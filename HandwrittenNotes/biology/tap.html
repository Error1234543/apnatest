<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="description" content="NEET Notes Hub – Physics, Chemistry, Biology notes & study material">
<title>NEET Notes Hub</title>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#08080f;
  --bg-elev:#0e0e18;
  --card-bg:rgba(18,18,28,.72);
  --card-bg-hover:rgba(22,22,34,.9);
  --card-border:rgba(255,255,255,.07);

  --text-1:#ffffff;
  --text-2:rgba(255,255,255,.62);
  --text-3:rgba(255,255,255,.38);

  --physics:#4a9eff;
  --physics-soft:rgba(74,158,255,.14);
  --physics-glow:rgba(74,158,255,.45);

  --chemistry:#ff4dd2;
  --chemistry-soft:rgba(255,77,210,.14);
  --chemistry-glow:rgba(255,77,210,.45);

  --biology:#2fe08a;
  --biology-soft:rgba(47,224,138,.14);
  --biology-glow:rgba(47,224,138,.45);

  --brand-a:#8a5cff;
  --brand-b:#4a9eff;

  --r-lg:24px;

  --ease:cubic-bezier(.22,.61,.36,1);
  --font:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text-1);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 16px;
  position:relative;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%,rgba(138,92,255,.14),transparent 60%),
    radial-gradient(ellipse 70% 50% at 90% 110%,rgba(47,224,138,.10),transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 50%,rgba(74,158,255,.05),transparent 70%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.shell{
  width:100%;
  max-width:1180px;
  display:flex;
  flex-direction:column;
}

/* ============================================================
   BRAND HEADER
   ============================================================ */
.brand{
  padding:22px 0 4px;
  display:flex;
  align-items:center;
  gap:12px;
}
.brand__mark{
  width:46px;height:46px;
  border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand-a),var(--brand-b));
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08) inset,
    0 8px 24px -8px rgba(138,92,255,.6);
  position:relative;
  flex-shrink:0;
}
.brand__mark::after{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 55%);
  pointer-events:none;
}
.brand__mark svg{width:24px;height:24px;color:#fff;position:relative;z-index:1}
.brand__meta{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand__eyebrow{
  font-size:.66rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--text-3);
  display:flex;align-items:center;gap:6px;
}
.brand__eyebrow::before{
  content:'';
  width:6px;height:6px;border-radius:50%;
  background:var(--biology);
  box-shadow:0 0 8px var(--biology-glow);
}
.brand__name{
  font-size:1.05rem;
  font-weight:700;
  letter-spacing:-.01em;
  line-height:1.1;
  background:linear-gradient(135deg,#fff,rgba(255,255,255,.7));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ============================================================
   PAGE HEADING
   ============================================================ */
.heading{
  padding:22px 0 18px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.heading__title{
  font-size:1.55rem;
  font-weight:800;
  letter-spacing:-.025em;
  line-height:1.15;
  background:linear-gradient(135deg,#fff 20%,rgba(255,255,255,.6));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.heading__sub{
  font-size:.82rem;
  color:var(--text-2);
  font-weight:400;
  letter-spacing:.005em;
  max-width:46ch;
}

/* ============================================================
   SUBJECT GRID
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  padding:4px 0 48px;
  width:100%;
}

/* ============================================================
   SUBJECT CARD
   ============================================================ */
.card{
  --accent:var(--physics);
  --accent-soft:var(--physics-soft);
  --accent-glow:var(--physics-glow);

  position:relative;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:18px;
  border-radius:var(--r-lg);
  background:var(--card-bg);
  border:1px solid var(--card-border);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  overflow:hidden;
  isolation:isolate;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  transition:
    border-color .3s var(--ease),
    background .3s var(--ease),
    transform .25s var(--ease),
    box-shadow .35s var(--ease);
}
.card::before{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  background:
    radial-gradient(120% 80% at 0% 0%,var(--accent-soft),transparent 55%),
    radial-gradient(90% 70% at 100% 100%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%);
  opacity:.7;
  z-index:-1;
  pointer-events:none;
  transition:opacity .35s var(--ease);
}
.card::after{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  pointer-events:none;
}

/* accent variants */
.card--physics{--accent:var(--physics);--accent-soft:var(--physics-soft);--accent-glow:var(--physics-glow)}
.card--chemistry{--accent:var(--chemistry);--accent-soft:var(--chemistry-soft);--accent-glow:var(--chemistry-glow)}
.card--biology{--accent:var(--biology);--accent-soft:var(--biology-soft);--accent-glow:var(--biology-glow)}

/* hover (pointer devices) */
@media (hover:hover) and (pointer:fine){
  .card:hover{
    transform:translateY(-3px);
    border-color:color-mix(in srgb,var(--accent) 40%,var(--card-border));
    background:var(--card-bg-hover);
    box-shadow:
      0 20px 40px -20px rgba(0,0,0,.6),
      0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent),
      0 0 40px -12px var(--accent-glow);
  }
  .card:hover::before{opacity:1}
  .card:hover .card__icon{
    box-shadow:
      0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent),
      0 0 24px -6px var(--accent-glow);
    transform:scale(1.04);
  }
  .card:hover .card__arrow{
    opacity:1;transform:translateX(2px);
    color:var(--accent);
  }
}
/* active (tap feedback) */
.card:active{transform:scale(.985)}

/* focus-visible */
.card:focus-visible{
  outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);
  outline-offset:3px;
}

/* ===== ICON ROW ===== */
.card__top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.card__icon{
  width:58px;height:58px;
  border-radius:16px;
  display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,255,255,0));
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  color:var(--accent);
  box-shadow:
    inset 0 0 20px -8px var(--accent-glow),
    0 0 20px -10px var(--accent-glow);
  flex-shrink:0;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.card__icon svg{width:28px;height:28px}

.card__arrow{
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:10px;
  color:var(--text-3);
  opacity:.7;
  transition:all .3s var(--ease);
}
.card__arrow svg{width:16px;height:16px}

/* ===== BODY ===== */
.card__body{display:flex;flex-direction:column;gap:4px;min-width:0}
.card__title{
  font-size:1.28rem;
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.15;
  color:var(--text-1);
}
.card__meta{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.78rem;
  font-weight:500;
  color:var(--text-2);
}
.card__meta svg{width:14px;height:14px;color:var(--text-3);flex-shrink:0}

/* ============================================================
   FOOTER
   ============================================================ */
.foot{
  padding:0 0 28px;
  display:flex;
  justify-content:center;
  font-size:.7rem;
  color:var(--text-3);
  letter-spacing:.04em;
  text-align:center;
}
.foot span{opacity:.8}

/* ============================================================
   RESPONSIVE BREAKPOINTS
   ============================================================ */

/* ── Tiny phones: 320px – 374px ── */
@media (max-width:374px){
  body{padding:0 12px}
  .brand{padding:16px 0 2px;gap:10px}
  .brand__mark{width:40px;height:40px;border-radius:12px}
  .brand__mark svg{width:20px;height:20px}
  .brand__name{font-size:.95rem}
  .brand__eyebrow{font-size:.6rem}
  .heading{padding:18px 0 14px}
  .heading__title{font-size:1.3rem}
  .heading__sub{font-size:.75rem}
  .grid{gap:12px;padding-bottom:36px}
  .card{padding:16px;border-radius:20px;gap:12px}
  .card__icon{width:50px;height:50px;border-radius:14px}
  .card__icon svg{width:24px;height:24px}
  .card__title{font-size:1.12rem}
  .card__meta{font-size:.72rem}
  .card__meta svg{width:12px;height:12px}
  .card__arrow{width:28px;height:28px}
  .foot{font-size:.65rem;padding-bottom:22px}
}

/* ── Normal phones: 375px – 430px ── */
@media (min-width:375px) and (max-width:430px){
  body{padding:0 16px}
  .brand{padding:20px 0 4px}
  .heading{padding:20px 0 16px}
  .heading__title{font-size:1.45rem}
  .grid{gap:14px;padding-bottom:42px}
  .card{padding:18px;border-radius:22px}
  .card__icon{width:54px;height:54px}
  .card__icon svg{width:26px;height:26px}
  .card__title{font-size:1.22rem}
}

/* ── Large phones: 431px – 767px ── */
@media (min-width:431px) and (max-width:767px){
  body{padding:0 20px}
  .brand{padding:24px 0 6px}
  .heading{padding:24px 0 20px}
  .heading__title{font-size:1.6rem}
  .grid{gap:16px;padding-bottom:48px}
  .card{padding:20px;border-radius:24px}
  .card__icon{width:60px;height:60px}
  .card__icon svg{width:30px;height:30px}
  .card__title{font-size:1.35rem}
  .card__meta{font-size:.82rem}
}

/* ── Tablets: 768px – 1023px ── */
@media (min-width:768px){
  body{padding:0 28px}
  .brand{padding:28px 0 8px}
  .brand__mark{width:52px;height:52px;border-radius:16px}
  .brand__mark svg{width:28px;height:28px}
  .brand__name{font-size:1.2rem}
  .brand__eyebrow{font-size:.7rem}
  .heading{padding:32px 0 26px}
  .heading__title{font-size:2rem}
  .heading__sub{font-size:.9rem}
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
    padding-bottom:60px;
  }
  .card{padding:22px;border-radius:24px;gap:16px}
  .card__icon{width:64px;height:64px;border-radius:18px}
  .card__icon svg{width:32px;height:32px}
  .card__title{font-size:1.4rem}
  .card__meta{font-size:.85rem}
  .card__meta svg{width:15px;height:15px}
}

/* ── Desktop: 1024px+ ── */
@media (min-width:1024px){
  body{padding:0 40px}
  .brand{padding:36px 0 10px;gap:14px}
  .brand__mark{width:56px;height:56px;border-radius:18px}
  .brand__mark svg{width:30px;height:30px}
  .brand__name{font-size:1.3rem}
  .brand__eyebrow{font-size:.72rem}
  .heading{padding:40px 0 32px}
  .heading__title{font-size:2.25rem;letter-spacing:-.03em}
  .heading__sub{font-size:.95rem}
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:24px;
    padding-bottom:72px;
  }
  .card{padding:26px;border-radius:26px;gap:18px}
  .card__icon{width:72px;height:72px;border-radius:20px}
  .card__icon svg{width:36px;height:36px}
  .card__title{font-size:1.5rem}
  .card__meta{font-size:.88rem}
  .card__meta svg{width:16px;height:16px}
  .foot{padding-bottom:40px;font-size:.75rem}
}

/* ── Wide desktop ── */
@media (min-width:1440px){
  .shell{max-width:1240px}
  .heading__title{font-size:2.5rem}
}

/* ── Accessibility ── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

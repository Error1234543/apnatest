<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Premium Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: rgba(30, 41, 59, 0.7);
            --card-bg: rgba(30, 41, 59, 0.6);
            --card-hover: rgba(30, 41, 59, 0.9);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --border: rgba(255, 255, 255, 0.1);
            --physics: #ef4444;
            --chemistry: #10b981;
            --biology: #f59e0b;
            --maths: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            background-attachment: fixed;
        }

        /* Sidebar - Glassmorphism */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 3rem;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .logo i { color: var(--primary); }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: translateX(5px);
        }

        .nav-item.active i { color: var(--primary); }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 2rem 3rem;
            width: calc(100% - 280px);
            display: flex;
            flex-direction: column;
        }

        /* Header & Search */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Breadcrumbs */
        .breadcrumbs {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: var(--sidebar-bg);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            backdrop-filter: blur(5px);
        }

        .bc-item {
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .bc-item:hover { color: white; }
        .bc-active { color: var(--primary); font-weight: 500; }

        /* Views */
        .view {
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .view.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 50px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
        }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: white;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .card:hover::before { transform: translateX(100%); }

        .card:hover {
            transform: translateY(-5px);
            background: var(--card-hover);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .Physics .icon-box { background: rgba(239, 68, 68, 0.2); color: var(--physics); }
        .Chemistry .icon-box { background: rgba(16, 185, 129, 0.2); color: var(--chemistry); }
        .Biology .icon-box { background: rgba(245, 158, 11, 0.2); color: var(--biology); }
        .Mathematics .icon-box { background: rgba(139, 92, 246, 0.2); color: var(--maths); }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            flex: 1;
            line-height: 1.3;
        }

        .card-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            margin-top: auto;
        }

        /* Badges */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
        }

        .badge.Notes { color: #a78bfa; background: rgba(139, 92, 246, 0.2); }
        .badge.Test { color: #f87171; background: rgba(239, 68, 68, 0.2); }
        .badge.Practice { color: #34d399; background: rgba(16, 185, 129, 0.2); }
        .badge.Revision { color: #60a5fa; background: rgba(59, 130, 246, 0.2); }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; width: 100%; padding: 1rem; }
            .mobile-toggle { display: block; }
        }
    </style>
</head>

                "Sequences_and_Series": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Determinants": "full_notes,quick_revision,formula_sheet,exam_tricks,important_questions,important_points,short_notes",
                "Relations_and_Functions": "quick_revision,mcq_practice,topic_test,exam_tricks,important_points,short_notes",
                "Matrices": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Integrals": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Introduction_to_Three_Dimensional_Geometry": "quick_revision,formula_sheet,exam_tricks,important_points,short_notes",
                "Continuity_and_Differentiability": "quick_revision,formula_sheet,exam_tricks,important_points,short_notes",
                "Application_of_Derivatives": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Three_Dimensional_Geometry": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Straight_Lines": "quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Linear_Inequalities": "quick_revision,formula_sheet,exam_tricks,important_points,short_notes",
                "Permutations_and_Combinations": "quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Statistics": "quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Application_of_Integrals": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Binomial_Theorem": "full_notes,quick_revision,formula_sheet,exam_tricks,important_points,short_notes",
                "Conic_Sections": "full_notes,quick_revision,handwriting_notes,exam_tricks,important_points,short_notes",
                "Complex_Numbers_and_Quadratic_Equations": "full_notes,quick_revision,topic_test,handwriting_notes,exam_tricks,important_points,short_notes",
                "Probability": "quick_revision,formula_sheet,mcq_test_50,topic_test,exam_tricks,important_points,short_notes",
                "Linear_Programming": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Differential_Equations": "full_notes,quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Trigonometric_Functions": "full_notes,quick_revision,topic_test,handwriting_notes,exam_tricks,important_points,short_notes",
                "Vector_Algebra": "quick_revision,formula_sheet,handwriting_notes,exam_tricks,important_points,short_notes",
                "Limits_and_Derivatives": "full_notes,quick_revision,handwriting_notes,exam_tricks,important_points,short_notes",
                "Inverse_Trigonometric_Functions": "full_notes,quick_revision,handwriting_notes,exam_tricks,important_points,short_notes"
            }
        };

        const allData = [];
        
        // Data Parser
        Object.keys(rawData).forEach(sub => {
            Object.keys(rawData[sub]).forEach(chFolder => {
                const chName = chFolder.replace(/_/g, ' ');
                const files = rawData[sub][chFolder].split(',');
                
                files.forEach(file => {
                    let displayName = file.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    if (file === 'mcq_test_50') displayName = 'MCQ Test (50 Qs)';
                    if (file === 'mcq_practice') displayName = 'MCQ Practice';

                    let type = 'Practice';
                    if (file.includes('test') || file.includes('mcq')) type = 'Test';
                    if (file.includes('notes')) type = 'Notes';
                    if (file.includes('revision') || file.includes('formula') || file.includes('tricks')) type = 'Revision';

                    // GitHub Path Builder (Accurate to ZIP structure)
                    allData.push({
                        subject: sub,
                        chapterFolder: chFolder,
                        chapterName: chName,
                        fileName: displayName,
                        type: type,
                        path: `${sub}/${chFolder}/${file}.html`,
                        searchKey: `${sub} ${chName} ${displayName}`.toLowerCase()
                    });
                });
            });
        });

        // App State
        let currentState = { view: 'home', subject: null, chapter: null };

        // Navigation Controller
        function navigate(view, subject = null, chapter = null) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('searchInput').value = '';

            currentState = { view, subject, chapter };
            updateBreadcrumbs();

            if (view === 'home') {
                document.getElementById('view-home').classList.add('active');
                document.querySelector('.nav-item').classList.add('active');
                renderHome();
            } else if (view === 'subject') {
                document.getElementById('view-subject').classList.add('active');
                document.querySelector(`[onclick="navigate('subject', '${subject}')"]`).classList.add('active');
                renderSubject(subject);
            } else if (view === 'chapter') {
                document.getElementById('view-chapter').classList.add('active');
                renderChapter(subject, chapter);
            }
            window.scrollTo(0, 0);
        }

        // Render Functions
        function renderHome() {
            const grid = document.getElementById('home-grid');
            grid.innerHTML = '';
            
            const icons = { Physics: 'fa-atom', Chemistry: 'fa-flask', Biology: 'fa-dna', Mathematics: 'fa-square-root-variable' };
            
            Object.keys(rawData).forEach(sub => {
                const chapterCount = Object.keys(rawData[sub]).length;
                grid.innerHTML += `
                    <div class="card ${sub}" onclick="navigate('subject', '${sub}')">
                        <div class="card-header">
                            <div class="icon-box"><i class="fas ${icons[sub]}"></i></div>
                            <div class="card-title">${sub}</div>
                        </div>
                        <div class="card-meta">
                            <span><i class="fas fa-folder-open"></i> ${chapterCount} Chapters</span>
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                `;
            });
        }

        function renderSubject(subject) {
            const grid = document.getElementById('chapter-grid');
            document.getElementById('subject-title').innerText = `${subject} Chapters`;
            grid.innerHTML = '';

            Object.keys(rawData[subject]).forEach(chFolder => {
                const chName = chFolder.replace(/_/g, ' ');
                const filesCount = rawData[subject][chFolder].split(',').length;
                
                grid.innerHTML += `
                    <div class="card" onclick="navigate('chapter', '${subject}', '${chFolder}')">
                        <div class="card-header">
                            <div class="icon-box" style="background: rgba(255,255,255,0.1); color: white;"><i class="fas fa-book-open"></i></div>
                            <div class="card-title">${chName}</div>
                        </div>
                        <div class="card-meta">
                            <span><i class="fas fa-file-alt"></i> ${filesCount} Resources</span>
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                `;
            });
        }

        function renderChapter(subject, chapterFolder) {
            const grid = document.getElementById('file-grid');
            const chName = chapterFolder.replace(/_/g, ' ');
            document.getElementById('chapter-title').innerText = chName;
            grid.innerHTML = '';

            const files = allData.filter(d => d.subject === subject && d.chapterFolder === chapterFolder);
            
            const icons = { 'Notes': 'fa-book', 'Test': 'fa-stopwatch', 'Practice': 'fa-pen', 'Revision': 'fa-bolt' };

            files.forEach(file => {
                grid.innerHTML += `
                    <a href="${file.path}" class="card" target="_blank">
                        <div class="card-header">
                            <div class="icon-box" style="background: rgba(255,255,255,0.05); color: var(--primary);">
                                <i class="fas ${icons[file.type] || 'fa-file'}"></i>
                            </div>
                            <div class="card-title" style="font-size: 1.05rem;">${file.fileName}</div>
                        </div>
                        <div class="card-meta">
                            <span class="badge ${file.type}">${file.type}</span>
                            <span>Open <i class="fas fa-external-link-alt"></i></span>
                        </div>
                    </a>
                `;
            });
        }

        // Search Function
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') { navigate('home'); return; }

            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-search').classList.add('active');
            
            const grid = document.getElementById('search-grid');
            grid.innerHTML = '';
            
            const results = allData.filter(d => d.searchKey.includes(query));
            
            if(results.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted);">No results found for "${query}".</p>`;
                return;
            }

            results.forEach(file => {
                grid.innerHTML += `
                    <a href="${file.path}" class="card" target="_blank">
                        <div class="card-header">
                            <div class="card-title" style="font-size: 1.05rem;">${file.fileName}</div>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">
                            ${file.subject} > ${file.chapterName}
                        </div>
                        <div class="card-meta">
                            <span class="badge ${file.type}">${file.type}</span>
                            <span>Open <i class="fas fa-external-link-alt"></i></span>
                        </div>
                    </a>
                `;
            });
        });

        // Breadcrumbs Logic
        function updateBreadcrumbs() {
            const bc = document.getElementById('breadcrumbs');
            let html = `<span class="bc-item ${currentState.view==='home'?'bc-active':''}" onclick="navigate('home')">Home</span>`;
            
            if (currentState.subject) {
                html += ` <i class="fas fa-chevron-right" style="font-size: 0.7rem; margin: 0 5px;"></i> 
                          <span class="bc-item ${currentState.view==='subject'?'bc-active':''}" onclick="navigate('subject', '${currentState.subject}')">${currentState.subject}</span>`;
            }
            if (currentState.chapter) {
                const chName = currentState.chapter.replace(/_/g, ' ');
                html += ` <i class="fas fa-chevron-right" style="font-size: 0.7rem; margin: 0 5px;"></i> 
                          <span class="bc-item bc-active">${chName}</span>`;
            }
            bc.innerHTML = html;
        }

        // Start
        navigate('home');
    </script>
</body>
</html>

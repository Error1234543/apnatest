<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>પાચન અને અભિશોષણ Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>પાચન અને અભિશોષણ Mock Test</h1><div class="sub">NEET UG • 40 Questions • Max Marks 160</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 160 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 40 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "માનવના પાચનતંત્રમાં કયો ઉત્સેચક પ્રોટીનના પાચન માટે જવાબદાર છે અને તે ક્યાંથી સ્ત્રાવિત થાય છે?", "opts": ["પેપ્સિન, જઠર", "ટ્રિપ્સિન, સ્વાદુપિંડ", "એમાયલેઝ, લાળગ્રંથિ", "લાઇપેઝ, નાનું આંતરડું"], "ans": 0, "exp": "પેપ્સિન એ પ્રોટીનના પાચન માટેનો મુખ્ય ઉત્સેચક છે અને તે જઠરમાંથી સ્ત્રાવિત થાય છે. ટ્રિપ્સિન પણ પ્રોટીનનું પાચન કરે છે પરંતુ તે સ્વાદુપિંડમાંથી સ્ત્રાવિત થાય છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના પૈકી કયું વિધાન યકૃતના કાર્યો વિશે ખોટું છે?", "opts": ["યકૃત પિત્તરસ ઉત્પન્ન કરે છે જે ચરબીના પાચનમાં મદદ કરે છે.", "યકૃત ગ્લાયકોજનનો સંગ્રહ કરે છે અને જરૂર પડ્યે ગ્લુકોઝમાં રૂપાંતરિત કરે છે.", "યકૃત યુરિયાનું સંશ્લેષણ કરે છે જે ઉત્સર્જન માટે મૂત્રપિંડમાં મોકલાય છે.", "યકૃત પાચન માટે જરૂરી હાઇડ્રોક્લોરિક એસિડ (HCl) ઉત્પન્ન કરે છે."], "ans": 3, "exp": "યકૃત પિત્તરસ ઉત્પન્ન કરે છે, ગ્લાયકોજનનો સંગ્રહ કરે છે અને યુરિયાનું સંશ્લેષણ કરે છે, પરંતુ HClનું ઉત્પાદન જઠરમાં થાય છે, યકૃતમાં નહીં.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નાનું આંતરડું (Small Intestine)માં અભિશોષણ માટેની મુખ્ય રચના કઈ છે?", "opts": ["રુવાંટી (Villi)", "પેયરની પેશીઓ (Peyer's Patches)", "બ્રનરની ગ્રંથિઓ (Brunner's Glands)", "ક્રિપ્ટ્સ ઓફ લાઇબરકુહન (Crypts of Lieberkühn)"], "ans": 0, "exp": "રુવાંટી એ નાના આંતરડામાં અભિશોષણ માટેની મુખ્ય રચના છે, જે સપાટીનું ક્ષેત્રફળ વધારી પોષક તત્ત્વોના અભિશોષણમાં મદદ કરે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના પૈકી કયો ઉત્સેચક કાર્બોહાઇડ્રેટ્સના પાચન માટે જવાબદાર નથી?", "opts": ["એમાયલેઝ", "માલ્ટેઝ", "સુક્રેઝ", "પેપ્સિન"], "ans": 3, "exp": "પેપ્સિન પ્રોટીનના પાચન માટે જવાબદાર છે, જ્યારે એમાયલેઝ, માલ્ટેઝ અને સુક્રેઝ કાર્બોહાઇડ્રેટ્સના પાચનમાં ભાગ લે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "માનવના પાચનતંત્રમાં ચરબીનું પાચન મુખ્યત્વે ક્યાં થાય છે અને કયા ઉત્સેચકની મદદથી થાય છે?", "opts": ["નાનું આંતરડું, લાઇપેઝ", "જઠર, પેપ્સિન", "મુખ, એમાયલેઝ", "મોટું આંતરડું, ટ્રિપ્સિન"], "ans": 0, "exp": "ચરબીનું પાચન મુખ્યત્વે નાના આંતરડામાં થાય છે અને લાઇપેઝ ઉત્સેચક તેના પાચનમાં મદદ કરે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "માનવના પાચનતંત્રમાં, નીચેનામાંથી કયો ઉત્સેચક પ્રોટીનના પાચન માટે જવાબદાર છે અને તેનું સ્રાવ કયા અંગમાંથી થાય છે?", "opts": ["પેપ્સિન, જઠર", "ટ્રિપ્સિન, સ્વાદુપિંડ", "એમાયલેઝ, લાળગ્રંથિ", "લાઇપેઝ, નાનું આંતરડું"], "ans": 0, "exp": "પેપ્સિન એ પ્રોટીનના પાચન માટેનો મુખ્ય ઉત્સેચક છે, જે જઠરમાંથી સ્રાવિત થાય છે અને જઠરરસના એસિડિક માધ્યમમાં કાર્ય કરે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેનામાંથી કયું વિધાન નાના આંતરડાના અભિશોષણ કાર્ય માટે ખોટું છે?", "opts": ["નાના આંતરડામાં વિલી અને માઇક્રોવિલી અભિશોષણ સપાટી વધારે છે.", "ગ્લુકોઝ અને એમિનો એસિડનું અભિશોષણ સક્રિય પરિવહન દ્વારા થાય છે.", "ચરબીના પાચન પછીના ફેટી એસિડ અને ગ્લિસરોલનું અભિશોષણ લસિકાવાહિનીઓ દ્વારા થાય છે.", "પાણી અને વિટામિન્સનું અભિશોષણ મુખ્યત્વે મોટા આંતરડામાં થાય છે."], "ans": 3, "exp": "પાણી અને વિટામિન્સનું અભિશોષણ મુખ્યત્વે નાના આંતરડામાં થાય છે, જ્યારે મોટા આંતરડામાં મુખ્યત્વે પાણીનું પુનઃશોષણ થાય છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "જઠરમાંથી સ્રાવિત થતા હાઇડ્રોક્લોરિક એસિડ (HCl) નું મુખ્ય કાર્ય શું છે?", "opts": ["પ્રોટીનનું પાચન શરૂ કરવું", "પેપ્સિનોજેનને સક્રિય પેપ્સિનમાં રૂપાંતરિત કરવું", "કાર્બોહાઇડ્રેટનું પાચન કરવું", "ચરબીનું ઇમલ્સિફિકેશન કરવું"], "ans": 1, "exp": "HCl જઠરમાં પેપ્સિનોજેનને સક્રિય પેપ્સિનમાં રૂપાંતરિત કરે છે, જે પ્રોટીનના પાચન માટે જરૂરી છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેનામાંથી કયો પદાર્થ નાના આંતરડામાંથી સીધો રુધિરમાં અભિશોષિત થતો નથી?", "opts": ["ગ્લુકોઝ", "એમિનો એસિડ", "ફેટી એસિડ અને ગ્લિસરોલ", "ખનીજ ક્ષારો"], "ans": 2, "exp": "ફેટી એસિડ અને ગ્લિસરોલનું અભિશોષણ લસિકાવાહિનીઓ દ્વારા થાય છે, પછી તે રુધિરમાં પ્રવેશે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "માનવના પાચનતંત્રમાં, પિત્તરસનું મુખ્ય કાર્ય શું છે અને તે કયા અંગમાં સંગ્રહિત થાય છે?", "opts": ["પ્રોટીનનું પાચન, જઠર", "ચરબીનું ઇમલ્સિફિકેશન, પિત્તાશય", "કાર્બોહાઇડ્રેટનું પાચન, સ્વાદુપિંડ", "વિટામિનનું અભિશોષણ, નાનું આંતરડું"], "ans": 1, "exp": "પિત્તરસ ચરબીનું ઇમલ્સિફિકેશન કરે છે, જે ચરબીના પાચનમાં મદદરૂપ થાય છે, અને તે પિત્તાશયમાં સંગ્રહિત થાય છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "માનવમાં પિત્તરસ (Bile) કયા અંગ દ્વારા ઉત્પન્ન થાય છે અને તેનું મુખ્ય કાર્ય શું છે?", "opts": ["યકૃત દ્વારા ઉત્પન્ન થાય છે અને ચરબીના પાચનમાં મદદ કરે છે", "સ્વાદુપિંડ દ્વારા ઉત્પન્ન થાય છે અને પ્રોટીનનું પાચન કરે છે", "પિત્તાશય દ્વારા ઉત્પન્ન થાય છે અને કાર્બોદિતનું પાચન કરે છે", "જઠર દ્વારા ઉત્પન્ન થાય છે અને એસિડિક માધ્યમ બનાવે છે"], "ans": 0, "exp": "પિત્તરસ યકૃતમાં ઉત્પન્ન થાય છે અને પિત્તાશયમાં સંગ્રહિત થાય છે. તે ચરબીના ઇમલ્સિફિકેશનમાં મદદ કરે છે, જેનાથી લાઇપેઝ ઉત્સેચકો સરળતાથી કાર્ય કરી શકે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના વિધાનોને ધ્યાનમાં લો: \n1. વિલી (Villi) નાની આંતરડામાં અભિશોષણ સપાટી વધારે છે.\n2. લેક્ટીલ (Lacteal) ચરબીના અભિશોષણમાં મદદ કરે છે.\n3. કાઇમ (Chyme) એ જઠરમાં ખોરાકનું પ્રવાહી સ્વરૂપ છે.\n4. પેપ્સિન ઉત્સેચક કાર્બોહાઇડ્રેટ્સનું પાચન કરે છે.\nઉપરોક્ત વિધાનોમાંથી કેટલા સાચાં છે?", "opts": ["1 અને 2", "1, 2 અને 3", "2, 3 અને 4", "માત્ર 4"], "ans": 1, "exp": "વિધાન 1, 2 અને 3 સાચાં છે. પેપ્સિન પ્રોટીનનું પાચન કરે છે, કાર્બોહાઇડ્રેટ્સનું નહીં, તેથી વિધાન 4 ખોટું છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "એક દર્દીને લિપિડ્સનું પાચન અને અભિશોષણમાં તકલીફ છે. નીચેનામાંથી કયું અંગ અથવા ઉત્સેચક તેની સમસ્યાનું કારણ હોઈ શકે?", "opts": ["સ્વાદુપિંડમાંથી લાઇપેઝ ઉત્સેચકનો અભાવ", "જઠરમાંથી પેપ્સિન ઉત્સેચકનો અભાવ", "નાની આંતરડામાં વિલીનો નાશ", "A અને C બંને"], "ans": 3, "exp": "લાઇપેઝ ઉત્સેચક ચરબીના પાચન માટે જરૂરી છે અને વિલી ચરબીના અભિશોષણ માટે જરૂરી છે. બંનેની ખામી લિપિડ્સના પાચન અને અભિશોષણમાં તકલીફ પેદા કરી શકે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેનામાંથી કયું વિધાન ખોટું છે?", "opts": ["હાઇડ્રોક્લોરિક એસિડ (HCl) જઠરમાં પેપ્સિનોજેનને પેપ્સિનમાં રૂપાંતરિત કરે છે", "એન્ટેરોકાઇનેઝ ઉત્સેચક ટ્રિપ્સિનોજેનને ટ્રિપ્સિનમાં સક્રિય કરે છે", "પિત્તરસમાં પાચક ઉત્સેચકો હોય છે જે ચરબીનું પાચન કરે છે", "આંત્રીય રસમાં મોલ્ટેઝ, સુક્રેઝ અને લેક્ટેઝ ઉત્સેચકો હોય છે"], "ans": 2, "exp": "પિત્તરસમાં પાચક ઉત્સેચકો હોતા નથી. તે માત્ર ચરબીના ઇમલ્સિફિકેશનમાં મદદ કરે છે, જ્યારે પાચન ઉત્સેચકો સ્વાદુપિંડ અને નાની આંતરડામાંથી આવે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યના પાચનતંત્રમાં 'એન્ટેરોકાઇનેઝ' ઉત્સેચકનું મુખ્ય કાર્ય શું છે?", "opts": ["ટ્રિપ્સિનોજેનને ટ્રિપ્સિનમાં રૂપાંતરિત કરવું", "પેપ્સિનોજેનને પેપ્સિનમાં સક્રિય કરવું", "લાઇપેઝની ક્રિયાને વધારવી", "એમીલેઝની ક્રિયાને નિયંત્રિત કરવી"], "ans": 0, "exp": "એન્ટેરોકાઇનેઝ નાના આંતરડામાં ટ્રિપ્સિનોજેનને ટ્રિપ્સિનમાં સક્રિય કરે છે, જે પ્રોટીનના પાચનમાં મદદ કરે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના પૈકી કયું વિધાન યકૃતના કાર્યો સાથે સુસંગત નથી?", "opts": ["યુરિયાનું સંશ્લેષણ કરવું", "પિત્તરસનું ઉત્પાદન કરવું", "હિમોગ્લોબિનનું વિઘટન કરી બિલીરૂબિન બનાવવું", "પ્રોટીનનું પાચન કરી એમિનો એસિડમાં રૂપાંતરિત કરવું"], "ans": 3, "exp": "યકૃત પ્રોટીનનું પાચન કરતું નથી; પ્રોટીનનું પાચન નાના આંતરડામાં ટ્રિપ્સિન અને કાયમોટ્રિપ્સિન દ્વારા થાય છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નાના આંતરડામાં ગ્લુકોઝના અભિશોષણ માટે જવાબદાર મુખ્ય પ્રક્રિયા કઈ છે?", "opts": ["સક્રિય વહન (Active Transport)", "સાદું પ્રસરણ (Simple Diffusion)", "સુવિધાયુક્ત પ્રસરણ (Facilitated Diffusion)", "અંતઃગ્રહણ (Endocytosis)"], "ans": 0, "exp": "ગ્લુકોઝનું અભિશોષણ મુખ્યત્વે સોડિયમ-ગ્લુકોઝ સહ-વહનકારી (SGLT1) દ્વારા સક્રિય વહન દ્વારા થાય છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના પૈકી કયા ઉત્સેચકોનું સ્ત્રાવ સ્વાદુપિંડ (Pancreas) દ્વારા થાય છે?\n1. એમીલેઝ\n2. લાઇપેઝ\n3. ટ્રિપ્સિન\n4. પેપ્સિન", "opts": ["માત્ર 1 અને 2", "માત્ર 1, 2 અને 3", "માત્ર 2, 3 અને 4", "1, 2, 3 અને 4"], "ans": 1, "exp": "સ્વાદુપિંડ એમીલેઝ, લાઇપેઝ અને ટ્રિપ્સિનનો સ્ત્રાવ કરે છે, જ્યારે પેપ્સિન જઠર દ્વારા સ્ત્રાવિત થાય છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "જો કોઈ વ્યક્તિના પિત્તાશયને શસ્ત્રક્રિયા દ્વારા દૂર કરવામાં આવે, તો તેના પર કયો સૌથી વધુ સંભવિત પ્રભાવ પડશે?", "opts": ["ચરબીનું પાચન મંદ પડી જશે", "કાર્બોદિતનું પાચન અટકી જશે", "પ્રોટીનનું પાચન અસરગ્રસ્ત થશે નહીં", "ખનિજ ક્ષારોનું અભિશોષણ ઘટી જશે"], "ans": 0, "exp": "પિત્તાશય પિત્તરસનો સંગ્રહ કરે છે, જે ચરબીના ઇમલ્સિફિકેશન માટે જરૂરી છે. તેના અભાવે ચરબીનું પાચન મંદ પડે છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના પૈકી કયું વિધાન યકૃતના કાર્યોને યોગ્ય રીતે વર્ણવે છે?\n1. પિત્તરસનું ઉત્પાદન અને સંગ્રહ\n2. ગ્લાયકોજનનું સંશ્લેષણ અને સંગ્રહ\n3. યુરિયાનું સંશ્લેષણ\n4. વિટામિન Aનું સંશ્લેષણ", "opts": ["માત્ર 1 અને 2", "માત્ર 1, 2 અને 3", "માત્ર 2, 3 અને 4", "1, 2, 3 અને 4"], "ans": 1, "exp": "યકૃત પિત્તરસનું ઉત્પાદન કરે છે (સંગ્રહ પિત્તાશયમાં થાય છે), ગ્લાયકોજનનું સંશ્લેષણ અને સંગ્રહ કરે છે, અને યુરિયાનું સંશ્લેષણ કરે છે. વિટામિન Aનું સંશ્લેષણ યકૃતમાં થતું નથી, તે બીટા-કેરોટીનમાંથી રૂપાંતરિત થાય છે.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નાના આંતરડામાં 'લેક્ટોઝ'ના પાચન માટે જવાબદાર ઉત્સેચક કયો છે અને તેની ઊણપથી કયો રોગ થાય છે?", "opts": ["લેક્ટેઝ, લેક્ટોઝ અસહિષ્ણુતા", "સુક્રેઝ, સુક્રોઝ અસહિષ્ણુતા", "માલ્ટેઝ, માલ્ટોઝ અસહિષ્ણુતા", "એમીલેઝ, સ્ટાર્ચ અસહિષ્ણુતા"], "ans": 0, "exp": "લેક્ટોઝનું પાચન લેક્ટેઝ ઉત્સેચક દ્વારા થાય છે. તેની ઊણપથી લેક્ટોઝ અસહિષ્ણુતા થાય છે, જેમાં લેક્ટોઝનું પાચન યોગ્ય રીતે થતું નથી.", "chapter": "પાચન અને અભિશોષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના પૈકી કયું વિધાન 'કાઇલોમાઇક્રોન' માટે ખોટું છે?", "opts": ["તે ચરબીના પાચન અને અભિશોષણ પછી રચાય છે", "તે લસિકાતંત્ર દ્વારા પરિવહન પામે છે", "તે નાના આંતરડાની શ્લેષ્મકલામાં રચાય છે", "તે લોહીમાં સીધું શોષાય છે"], "ans": 3, "exp": "કાઇલોમાઇક્રોન ચરબીના પાચન પછી નાના આંતરડાની શ્લેષ્મકલામાં રચાય છે અને લસિકાતંત્ર દ્વારા પરિવહન પામે છે, લોહીમાં સીધું શોષાતું નથી.", "chapter": const SUBJECTS=[{"name": "BIOLOGY", "start": 0, "end": 39, "count": 40}];
const MARKS_C=4, MARKS_W=-1;

let answers={}, marked=new Set(), visited=new Set(), curIdx=0, remaining=DURATION, timerHandle=null, submitted=false;
let subjectLastIdx={};

function subjectOf(i){ return SUBJECTS.find(s=>i>=s.start&&i<=s.end); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = SUBJECTS.map((s,i)=>
    `<button class="tab-btn ${subjectOf(curIdx).name===s.name?'active':''}" onclick="jumpSubject('${s.name}')">${s.name} (${s.count})</button>`
  ).join('');
}
function jumpSubject(subjName){ curIdx = subjectLastIdx[subjName] !== undefined ? subjectLastIdx[subjName] : SUBJECTS.find(s=>s.name===subjName).start; render(); }

function renderPalette(){
  let html='';
  SUBJECTS.forEach(s=>{
    html += `<div class="subj-h">${s.name}</div><div class="palette">`;
    for(let i=s.start;i<=s.end;i++){
      let cls='notvisited';
      if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "પાચન અને અભિશોષણ Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

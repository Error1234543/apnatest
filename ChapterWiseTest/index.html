<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:#050816;
background:linear-gradient(135deg,#050816,#09152d,#0f172a);
}

body::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:#00d4ff;
border-radius:50%;
filter:blur(150px);
top:-100px;
left:-100px;
opacity:.4;
animation:move1 8s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:#7c3aed;
border-radius:50%;
filter:blur(150px);
bottom:-100px;
right:-100px;
opacity:.4;
animation:move2 8s infinite alternate;
}

@keyframes move1{
100%{transform:translate(120px,80px);}
}

@keyframes move2{
100%{transform:translate(-120px,-80px);}
}

.card{
position:relative;
width:90%;
max-width:420px;
padding:45px 30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.4);
color:white;
z-index:10;
}

.icon{
font-size:80px;
margin-bottom:20px;
animation:float 2.5s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-12px);
}
}

h1{
font-size:34px;
font-weight:700;
margin-bottom:8px;
background:linear-gradient(90deg,#00d4ff,#7c3aed);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

h2{
font-size:22px;
font-weight:600;
margin-bottom:18px;
}

p{
font-size:15px;
line-height:1.8;
color:#d7d7d7;
margin-bottom:28px;
}

.line{
width:70px;
height:4px;
margin:auto;
border-radius:20px;
background:linear-gradient(90deg,#00d4ff,#7c3aed);
margin-bottom:28px;
}

.button{
display:inline-block;
padding:14px 35px;
border-radius:50px;
background:linear-gradient(90deg,#00d4ff,#2563eb);
color:white;
text-decoration:none;
font-weight:600;
transition:.3s;
box-shadow:0 0 20px rgba(0,212,255,.5);
}

.button:hover{
transform:scale(1.06);
box-shadow:0 0 35px rgba(0,212,255,.8);
}

.footer{
margin-top:30px;
font-size:13px;
color:#9ca3af;
letter-spacing:1px;
}
</style>
</head>

<body>

<div class="card">

<div class="icon">📚</div>

<h1>COMING SOON</h1>

<div class="line"></div>

<h2>Chapter Wise Tests</h2>

<p>
We're working on an exciting Chapter Wise Test section.<br>
It will be available very soon with a premium experience.
</p>

<a href="#" class="button">Stay Tuned 🚀</a>

<div class="footer">
Powered by <b>SONIC HUB</b>
</div>

</div>

</body>
</html>

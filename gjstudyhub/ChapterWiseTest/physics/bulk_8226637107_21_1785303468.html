<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>તરંગ પ્રકાશશાસ્ત્ર Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>તરંગ પ્રકાશશાસ્ત્ર Mock Test</h1><div class="sub">NEET UG • 40 Questions • Max Marks 160</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 160 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 40 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "યંગના બેવડા સ્લિટ પ્રયોગમાં, સ્લિટો વચ્ચેનું અંતર 0.5 mm છે અને પડદો સ્લિટોથી 1 m અંતરે છે. જો પ્રકાશની તરંગલંબાઈ 500 nm હોય, તો પડદા પર બનતા સંપાતિ પટ્ટીઓ વચ્ચેનું અંતર કેટલું હશે?", "opts": ["0.1 mm", "1 mm", "0.5 mm", "2 mm"], "ans": 1, "exp": "સંપાતિ પટ્ટીઓ વચ્ચેનું અંતર β = λD/d સૂત્રથી મળે છે. અહીં λ = 500 nm = 5×10⁻⁷ m, D = 1 m, d = 0.5 mm = 5×10⁻⁴ m. તેથી β = (5×10⁻⁷ × 1)/(5×10⁻⁴) = 10⁻³ m = 1 mm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન હાઈગનના તરંગ સિદ્ધાંત અનુસાર ખોટું છે?", "opts": ["પ્રકાશ એ તરંગ સ્વરૂપે પ્રસરે છે.", "પ્રકાશના તરંગો યાંત્રિક તરંગો છે.", "પ્રકાશના તરંગોના પ્રસરણ માટે માધ્યમની જરૂર પડે છે.", "પ્રકાશના તરંગો વિદ્યુતચુંબકીય તરંગો છે."], "ans": 2, "exp": "હાઈગનના તરંગ સિદ્ધાંત મુજબ પ્રકાશના તરંગોના પ્રસરણ માટે માધ્યમની જરૂર પડતી નથી, કારણ કે પ્રકાશ વિદ્યુતચુંબકીય તરંગ છે જે શૂન્યાવકાશમાં પણ પ્રસરે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.5) પર શ્વેત પ્રકાશ લંબરૂપે આપાત થાય છે. જો ફિલ્મની જાડાઈ 400 nm હોય, તો કઈ તરંગલંબાઈ માટે સંપૂર્ણ વિનાશક વ્યતિકરણ થશે? (ફિલ્મની બંને સપાટી પર કળા ઉલટાઈ જાય છે.)", "opts": ["480 nm", "600 nm", "400 nm", "500 nm"], "ans": 0, "exp": "સંપૂર્ણ વિનાશક વ્યતિકરણ માટે 2μt = (m + ½)λ. અહીં μ = 1.5, t = 400 nm, m = 0 લેતાં λ = 2×1.5×400/0.5 = 2400 nm. m = 1 લેતાં λ = 2400/3 = 800 nm. m = 2 લેતાં λ = 2400/5 = 480 nm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન પ્રકાશના ધ્રુવીભવન વિશે સાચું નથી?", "opts": ["ધ્રુવીભૂત પ્રકાશમાં વિદ્યુતક્ષેત્ર એક જ સમતલમાં દોલન કરે છે.", "ધ્રુવીભૂત પ્રકાશનું પ્રસરણ શક્ય નથી.", "ધ્રુવીભવન માત્ર તરંગ પ્રકૃતિ ધરાવતા પ્રકાશમાં જ શક્ય છે.", "પોલારોઈડનો ઉપયોગ કરીને પ્રકાશને ધ્રુવીભૂત કરી શકાય છે."], "ans": 1, "exp": "ધ્રુવીભૂત પ્રકાશનું પ્રસરણ શક્ય છે, પરંતુ તેનું દોલન માત્ર એક જ સમતલમાં સીમિત હોય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્લિટની પહોળાઈ 0.1 mm ", "svg": "", "subject": "PHYSICS"}, {"q": "પ્રકાશના વ્યતિકરણના પ્રયોગમાં, યંગના બેવડા સ્લિટ પ્રયોગમાં, જો સ્લિટ વચ્ચેનું અંતર 0.5 mm અને પડદા સુધીનું અંતર 1 m હોય, તો 500 nm તરંગલંબાઈવાળા પ્રકાશ માટે પડદા પર બે ક્રમિક તેજસ્વી પટ્ટીઓ વચ્ચેનું અંતર કેટલું હશે?", "opts": ["0.5 mm", "1.0 mm", "1.5 mm", "2.0 mm"], "ans": 1, "exp": "વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર β = λD/d સૂત્રથી મળે છે, જ્યાં λ = 500 nm, D = 1 m, d = 0.5 mm. ગણતરી કરતાં β = 1.0 mm મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનાં વિધાનો ધ્યાનમાં લો: 1. પ્રકાશનું વિવર્તન માત્ર ત્યારે જ થાય છે જ્યારે અપારદર્શક અવરોધની પહોળાઈ પ્રકાશની તરંગલંબાઈ કરતાં ઘણી મોટી હોય. 2. વિવર્તન પટ્ટીઓની પહોળાઈ પ્રકાશની તરંગલંબાઈ પર આધારિત નથી. 3. એક જ તરંગલંબાઈ માટે, સ્લિટની પહોળાઈ ઘટાડતાં વિવર્તન પટ્ટીઓની પહોળાઈ વધે છે. ઉપરોક્ત વિધાનોમાંથી કયાં સાચાં છે?", "opts": ["માત્ર 1", "માત્ર 3", "1 અને 2", "2 અને 3"], "ans": 1, "exp": "વિધાન 1 ખોટું છે કારણ કે વિવર્તન ત્યારે જ સ્પષ્ટ થાય છે જ્યારે અવરોધની પહોળાઈ તરંગલંબાઈના ક્રમની હોય. વિધાન 2 ખોટું છે કારણ કે પટ્ટીઓની પહોળાઈ તરંગલંબાઈ પર આધારિત છે. વિધાન 3 સાચું છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ પ્રકાશના વ્યતિકરણનું નથી?", "opts": ["સાબુના પરપોટા પર દેખાતા રંગો", "CD પર દેખાતા રંગીન પટ્ટાઓ", "આકાશનો વાદળી રંગ", "તેલના પાતળા સ્તર પર દેખાતા રંગો"], "ans": 2, "exp": "આકાશનો વાદળી રંગ પ્રકાશના પ્રકીર્ણનને કારણે છે, વ્યતિકરણને કારણે નહીં. બાકીના ઉદાહરણો વ્યતિકરણના છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મના વક્રીભવનાંક 1.4 છે અને તેની જાડાઈ 500 nm છે. જો તેના પર 700 nm તરંગલંબાઈનો પ્રકાશ આપાત થાય, તો ફિલ્મના ઉપરના અને નીચેના પૃષ્ઠ પરથી પરાવર્તિત થતા પ્રકાશ વચ્ચે કેટલો કળા તફાવત ઉદ્ભવશે? (ધારો કે પ્રકાશ લંબરૂપે આપાત થાય છે.)", "opts": ["π રેડિયન", "2π રેડિયન", "π/2 રેડિયન", "3π/2 રેડિયન"], "ans": 0, "exp": "કળા તફાવત = (2π/λ) × 2μt. અહીં, λ = 700 nm, μ = 1.4, t = 500 nm. ગણતરી કરતાં કળા તફાવત π રેડિયન મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "બે સ્લિટ વચ્ચેનું અંતર 0.5 mm છે અને પડદો સ્લિટથી 1 m અંતરે છે. જો 600 nm તરંગલંબાઈનો પ્રકાશ વાપરવામાં આવે, તો વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર કેટલું હશે?", "opts": ["1.2 mm", "0.6 mm", "1.8 mm", "0.3 mm"], "ans": 0, "exp": "વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર β = λD/d. અહીં, λ = 600 nm, D = 1 m, d = 0.5 mm. ગણતરી કરતાં β = 1.2 mm મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ પ્રકાશના વિવર્તન (diffraction)નું નથી?", "opts": ["સૂર્યપ્રકાશમાં રંગીન પટ્ટીઓનું દેખાવું જ્યારે CD પર જોવામાં આવે.", "સાંકડી સ્લિટમાંથી પસાર થતા પ્રકાશનું પડદા પર ફેલાવું.", "પ્રિઝમ વડે સૂર્યપ્રકાશનું સાત રંગોમાં વિભાજન.", "સૂક્ષ્મ છિદ્રમાંથી પસાર થતા પ્રકાશનું વર્તુળાકાર પટ્ટીઓનું નિર્માણ."], "ans": 2, "exp": "પ્રિઝમ વડે પ્રકાશનું વિભાજન વક્રીભવનને કારણે થાય છે, વિવર્તનને કારણે નહીં.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "અભિધારણા (A): પ્રકાશના વ્યતિકરણમાં, અંધારી પટ્ટી ત્યારે મળે છે જ્યારે બે તરંગો વિનાશક વ્યતિકરણ અનુભવે છે.\nકારણ (R): વિનાશક વ્યતિકરણમાં બે તરંગોની કળામાં 180°નો તફાવત હોય છે.", "opts": ["A અને R બંને સાચાં છે અને R એ Aની સાચી સમજૂતી છે.", "A અને R બંને સાચાં છે પરંતુ R એ Aની સાચી સમજૂતી નથી.", "A સાચું છે પરંતુ R ખોટું છે.", "A ખોટું છે પરંતુ R સાચું છે."], "ans": 0, "exp": "અંધારી પટ્ટી વિનાશક વ્યતિકરણને કારણે મળે છે, જેમાં બે તરંગોની કળામાં 180°નો તફાવત હોય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "પ્રકાશના વ્યતિકરણના પ્રયોગમાં, બે સ્લિટ વચ્ચેનું અંતર 0.4 mm છે અને પડદો સ્લિટથી 1.5 m અંતરે છે. જો પડદા પર વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર 2.25 mm હોય, તો પ્રકાશની તરંગલંબાઈ કેટલી હશે?", "opts": ["600 nm", "450 nm", "500 nm", "650 nm"], "ans": 0, "exp": "વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર β = λD/d સૂત્રથી મળે છે. અહીં β = 2.25 mm, D = 1.5 m, d = 0.4 mm છે. λ = (β × d)/D = (2.25 × 10⁻³ × 0.4 × 10⁻³)/1.5 = 600 nm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન પ્રકાશના ધ્રુવીભવન વિશે ખોટું છે?", "opts": ["ધ્રુવીભવન એ પ્રકાશના તરંગોની એક જ દિશામાં કંપનની ઘટના છે.", "ધ્રુવીભવન માત્ર પ્રકાશના સંગત તરંગોમાં જ શક્ય છે.", "પોલરોઇડ ફિલ્ટરનો ઉપયોગ પ્રકાશને ધ્રુવીભવિત કરવા માટે થાય છે.", "ધ્રુવીભવન દ્વારા પ્રકાશની તીવ્રતા વધારી શકાય છે."], "ans": 3, "exp": "ધ્રુવીભવન દ્વારા પ્રકાશની તીવ્રતા ઘટે છે, વધતી નથી. ધ્રુવીભવન માત્ર સંગત તરંગોમાં જ શક્ય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.33) પર 500 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય છે. જો ફિલ્મની જાડાઈ 375 nm હોય, તો નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["પરાવર્તિત પ્રકાશમાં વિનાશક વ્યતિકરણ થશે.", "પરાવર્તિત પ્રકાશમાં રચનાત્મક વ્યતિકરણ થશે.", "પરાવર્તિત પ્રકાશમાં કોઈ વ્યતિકરણ થશે નહીં.", "પરાવર્તિત પ્રકાશમાં આંશિક વ્યતિકરણ થશે."], "ans": 0, "exp": "વિનાશક વ્યતિકરણ માટે 2μt = mλ સૂત્ર લાગુ પડે છે. અહીં 2 × 1.33 × 375 = 997.5 nm ≈ 2 × 500 nm = 1000 nm (લગભગ), તેથી વિનાશક વ્યતિકરણ થશે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક યંગના બે-સ્લિટ પ્રયોગમાં, સ્લિટ વચ્ચેનું અંતર 0.6 mm છે અને પડદો સ્લિટથી 2 m અંતરે છે. જો પ્રકાશની તરંગલંબાઈ 600 nm હોય, તો પડદા પર મધ્યસ્થ પ્રકાશિત પટ્ટી અને ત્રીજી પ્રકાશિત પટ્ટી વચ્ચેનું અંતર કેટલું હશે?", "opts": ["6 mm", "4 mm", "8 mm", "2 mm"], "ans": 0, "exp": "વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર β = λD/d છે. ત્રીજી પ્રકાશિત પટ્ટી માટે y = 3β = 3 × (600 × 10⁻⁹ × 2)/0.6 × 10⁻³ = 6 mm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક યંગના બેવડા સ્લિટ પ્રયોગમાં સ્લિટ વચ્ચેનું અંતર 0.4 mm છે અને પડદો સ્લિટથી 1.5 m અંતરે છે. જો પ્રકાશની તરંગલંબાઈ 600 nm હોય, તો પડદા પર મળતા વ્યતિકરણ પટ્ટાઓ વચ્ચેનું અંતર કેટલું હશે?", "opts": ["1.5 mm", "2.25 mm", "3.0 mm", "4.5 mm"], "ans": 1, "exp": "વ્યતિકરણ પટ્ટાઓ વચ્ચેનું અંતર β = λD/d = (600 × 10⁻⁹ × 1.5) / (0.4 × 10⁻³) = 2.25 × 10⁻³ m = 2.25 mm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "પ્રકાશના વ્યતિકરણ અને વિવર્તન વચ્ચેનો મુખ્ય તફાવત શું છે?", "opts": ["વ્યતિકરણ બે કે તેથી વધુ તરંગોના સંપાતીકરણથી થાય છે, જ્યારે વિવર્તન એક જ તરંગના વાંકા વળવાથી થાય છે.", "વ્યતિકરણ માત્ર ધ્રુવીભૂત પ્રકાશમાં જ થાય છે, જ્યારે વિવર્તન કોઈપણ પ્રકારના પ્રકાશમાં થાય છે.", "વ્યતિકરણમાં તરંગલંબાઈ બદલાતી નથી, જ્યારે વિવર્તનમાં તરંગલંબાઈ બદલાય છે.", "વ્યતિકરણ અને વિવર્તન બંને એક જ ભૌતિક ઘટના છે."], "ans": 0, "exp": "વ્યતિકરણ બે કે તેથી વધુ તરંગોના સંપાતીકરણથી ઉદ્ભવે છે, જ્યારે વિવર્તન એક તરંગના અવરોધને કારણે વાંકા વળવાથી થાય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.33) પર 600 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય છે. જો ફિલ્મની જાડાઈ 300 nm હોય, તો ફિલ્મમાં પ્રકાશની તરંગલંબાઈ કેટલી હશે?", "opts": ["300 nm", "450 nm", "600 nm", "225 nm"], "ans": 1, "exp": "ફિલ્મમાં પ્રકાશની તરંગલંબાઈ λₙ = λ/n સૂત્રથી મળે છે, જ્યાં λ = 600 nm અને n = 1.33. ગણતરી કરતાં λₙ = 450 nm મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ધ્રુવીભૂત પ્રકાશ માટે સાચું નથી?", "opts": ["ધ્રુવીભૂત પ્રકાશના કંપનો એક જ સમતલમાં થાય છે.", "ધ્રુવીભૂત પ્રકાશનું પ્રસરણ દિશાને લંબ સમતલમાં થાય છે.", "ધ્રુવીભૂત પ્રકાશનું ધ્રુવીભવન માત્ર પરાવર્તન દ્વારા જ શક્ય છે.", "ધ્રુવીભૂત પ્રકાશનો ઉપયોગ પોલારોઇડ ચશ્મા અને LCDમાં થાય છે."], "ans": 2, "exp": "ધ્રુવીભૂત પ્રકાશનું ધ્રુવીભવન પરાવર્તન, વક્રીભવન, પ્રકીર્ણન અને દ્વિવક્રીભવન દ્વારા પણ શક્ય છે, માત્ર પરાવર્તનથી જ નહીં.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.4) પર 500 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય છે. જો ફિલ્મમાં વ્યતિકરણને કારણે પ્રકાશનું મહત્તમ પરાવર્તન થતું હોય, તો ફિલ્મની લઘુતમ જાડાઈ કેટલી હશે?", "opts": ["89.3 nm", "178.6 nm", "267.9 nm", "357.2 nm"], "ans": 0, "exp": "પાતળી ફિલ્મમાં મહત્તમ પરાવર્તન માટે 2nt = (m + ½)λ સૂત્ર લાગુ પડે છે. લઘુતમ જાડાઈ માટે m = 0 લેતાં, t = λ/(4n) = 500/(4×1.4) = 89.3 nm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ધ્રુવીભવન (Polarization) વિશે ખોટું છે?", "opts": ["ધ્રુવીભવન માત્ર તરંગ પ્રકૃતિ ધરાવતા પ્રકાશમાં જ શક્ય છે.", "ધ્રુવીભવન દ્વારા પ્રકાશના કંપનોને એક જ સમતલમાં સીમિત કરી શકાય છે.", "ધ્રુવીભવન પામેલો પ્રકાશ યંગના બેવડા સ્લિટ પ્રયોગમાં વ્યતિકરણ પટ્ટાઓ ઉત્પન્ન કરી શકતો નથી.", "ધ્રુવીભવન પામેલો પ્રકાશ પોલારોઇડ ફિલ્ટરમાંથી પસાર થઈ શકે છે."], "ans": 2, "exp": "ધ્રુવીભવન પામેલો પ્રકાશ યંગના બેવડા સ્લિટ પ્રયોગમાં વ્યતિકરણ પટ્ટાઓ ઉત્પન્ન કરી શકે છે, પરંતુ તેની તીવ્રતા ઓછી હોય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "પ્રકાશના વ્યતિકરણના પ્રયોગમાં, બે સ્લિટ વચ્ચેનું અંતર 0.2 mm છે અને પડદો સ્લિટથી 1 m અંતરે છે. જો પ્રકાશની તરંગલંબાઈ 500 nm હોય, તો મધ્યસ્થ પ્રકાશિત પટ્ટી અને પહેલી પ્રકાશિત પટ્ટી વચ્ચેનું અંતર કેટલું હશે?", "opts": ["2.5 mm", "1.25 mm", "0.5 mm", "5 mm"], "ans": 0, "exp": "વ્યતિકરણના સૂત્ર β = λD/d મુજબ, જ્યાં λ = 500 nm, D = 1 m, d = 0.2 mm. ગણતરી કરતાં β = 2.5 mm મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "પ્રકાશના વ્યતિકરણમાં, બે સ્રોતો વચ્ચેનો કળા તફાવત (Phase difference) 90° છે. જો બંને સ્રોતોની તીવ્રતા સમાન હોય, તો પરિણામી તીવ્રતા કેટલી હશે? (I₀ = એક સ્રોતની તીવ્રતા)", "opts": ["2I₀", "I₀", "1.414I₀", "0.5I₀"], "ans": 0, "exp": "કળા તફાવત 90° હોય ત્યારે પરિણામી તીવ્રતા I = I₁ + I₂ + 2√(I₁I₂)cosφ મુજબ, I = 2I₀ મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.4) પર 500 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય છે. જો ફિલ્મની જાડાઈ 700 nm હોય, તો ફિલ્મમાંથી પરાવર્તિત થતા પ્રકાશ માટે કયું વિધાન સાચું છે?", "opts": ["ફિલ્મમાંથી પરાવર્તિત થતો પ્રકાશ સંપૂર્ણ રીતે વિનાશક વ્યતિકરણ અનુભવશે", "ફિલ્મમાંથી પરાવર્તિત થતો પ્રકાશ સંપૂર્ણ રીતે રચનાત્મક વ્યતિકરણ અનુભવશે", "ફિલ્મમાંથી પરાવર્તિત થતો પ્રકાશ આંશિક રીતે વિનાશક વ્યતિકરણ અનુભવશે", "ફિલ્મમાંથી પરાવર્તિત થતો પ્રકાશ કોઈ વ્યતિકરણ દર્શાવશે નહીં"], "ans": 0, "exp": "ફિલ્મની જાડાઈ તરંગલંબાઈના પૂર્ણાંક ગુણાંકથી વધુ હોવાથી અને પરાવર્તન દરમિયાન કળાતફાવત 180° હોવાથી વિનાશક વ્યતિકરણ થશે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "બે સ્લિટ વચ્ચેનું અંતર 0.3 mm છે અને પડદો સ્લિટથી 1.5 m અંતરે છે. જો 600 nm તરંગલંબાઈનો પ્રકાશ વાપરવામાં આવે, તો પડદા પર મધ્યસ્થ પ્રકાશિત પટ્ટાથી પ્રથમ અંધારિયા પટ્ટાનું અંતર કેટલું હશે?", "opts": ["1.5 mm", "2.0 mm", "2.5 mm", "3.0 mm"], "ans": 3, "exp": "વ્યતિકરણના સૂત્ર β = λD/d મુજબ, પ્રથમ અંધારિયા પટ્ટાનું અંતર (2n+1)λD/2d = 3 × 600 × 10⁻⁹ × 1.5 / (2 × 0.3 × 10⁻³) = 3.0 mm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનાં વિધાનોને ધ્યાનમાં લો: (1) ધ્રુવીભૂત પ્રકાશમાં વિદ્યુતક્ષેત્રનો કંપન એક જ સમતલમાં થાય છે. (2) ધ્રુવીભૂત પ્રકાશનું ઉદાહરણ સૂર્યપ્રકાશ છે. (3) ધ્રુવીભૂત પ્રકાશનું ઉત્પાદન પોલારોઇડ ફિલ્ટર વડે કરી શકાય છે. (4) પ્રકાશનું ધ્રુવીભવન માત્ર પ્રતિબિંબ દ્વારા જ શક્ય છે. ઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["એક", "બે", "ત્રણ", "ચાર"], "ans": 1, "exp": "માત્ર વિધાન (1) અને (3) સાચાં છે. સૂર્યપ્રકાશ અધ્રુવીભૂત હોય છે અને ધ્રુવીભવન અન્ય રીતે પણ શક્ય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.5) પર શ્વેત પ્રકાશ લંબરૂપે આપાત થાય છે. જો ફિલ્મની જાડાઈ 450 nm હોય, તો નીચેનામાંથી કયો રંગ પરાવર્તિત પ્રકાશમાં અદૃશ્ય થશે? (પ્રકાશની તરંગલંબાઈ હવામાં λ₀ = 600 nm ધારો)", "opts": ["લાલ (600 nm)", "લીલો (500 nm)", "વાદળી (450 nm)", "પીળો (550 nm)"], "ans": 2, "exp": "ફિલ્મમાં વિનાશક વ્યતિકરણ માટે 2nt = (m + 1/2)λ₀. અહીં, t = 450 nm, n = 1.5, અને λ₀ = 450 nm માટે 2 × 1.5 × 450 = 1350 nm = (2 + 1/2) × 450 nm, તેથી વાદળી રંગ અદૃશ્ય થશે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}];
const SUBJECTS=[{"name": "PHYSICS", "start": 0, "end": 39, "count": 40}];
const MARKS_C=4, MARKS_W=-1;
const DURATION=40*60;
let answers={}, marked=new Set(), visited=new Set(), curIdx=0, remaining=DURATION, timerHandle=null, submitted=false;
let subjectLastIdx={};
SUBJECTS.forEach(s=>subjectLastIdx[s.name]=s.start);

function subjectOf(i){ return SUBJECTS.find(s=>i>=s.start&&i<=s.end); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = SUBJECTS.map((s,i)=>
    `<button class="tab-btn ${subjectOf(curIdx).name===s.name?'active':''}" onclick="jumpSubject('${s.name}')">${s.name} (${s.count})</button>`
  ).join('');
}
function jumpSubject(subjName){ curIdx = subjectLastIdx[subjName] !== undefined ? subjectLastIdx[subjName] : SUBJECTS.find(s=>s.name===subjName).start; render(); }

function renderPalette(){
  let html='';
  SUBJECTS.forEach(s=>{
    html += `<div class="subj-h">${s.name}</div><div class="palette">`;
    for(let i=s.start;i<=s.end;i++){
      let cls='notvisited';
      if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "તરંગ પ્રકાશશાસ્ત્ર Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

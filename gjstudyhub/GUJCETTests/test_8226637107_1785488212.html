<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUJCET Mock Test (Biology Stream)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>GUJCET Mock Test (Biology Stream)</h1><div class="sub">GUJCET • 120 Questions • Max Marks 120</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 120 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 120 Questions | GUJCET</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "એક પદાર્થને 5 m/s²ના પ્રવેગથી ગતિ કરાવવા માટે 20 N બળ લગાડવામાં આવે છે. આ પદાર્થનું દળ કેટલું હશે?", "opts": ["2 kg", "4 kg", "5 kg", "10 kg"], "ans": 1, "exp": "ન્યૂટનના બીજા નિયમ મુજબ, બળ (F) = દળ (m) × પ્રવેગ (a). અહીં F = 20 N અને a = 5 m/s² છે, તેથી m = F/a = 20/5 = 4 kg.", "chapter": "યંત્રશાસ્ત્ર (Mechanics)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન સત્ય નથી? (1) પ્રકાશ એ વિદ્યુતચુંબકીય તરંગ છે. (2) પ્રકાશની ઝડપ શૂન્યાવકાશમાં મહત્તમ હોય છે. (3) પ્રકાશની તરંગલંબાઈ અને આવૃત્તિ વચ્ચેનો સંબંધ c = λν છે. (4) પ્રકાશની ઝડપ માધ્યમની ઘનતા પર આધારિત નથી.", "opts": ["ફક્ત (1)", "ફક્ત (2)", "ફક્ત (4)", "ફક્ત (3)"], "ans": 2, "exp": "પ્રકાશની ઝડપ માધ્યમની ઘનતા પર આધારિત હોય છે. શૂન્યાવકાશમાં તે મહત્તમ હોય છે, પરંતુ અન્ય માધ્યમોમાં તે ઓછી હોય છે.", "chapter": "પ્રકાશશાસ્ત્ર (Optics)", "svg": "", "subject": "PHYSICS"}, {"q": "એક વિદ્યુત પરિપથમાં 12 V ના બેટરી સાથે 4 Ω અને 6 Ω ના બે અવરોધો શ્રેણીમાં જોડાયેલા છે. પરિપથમાં વહેતો કુલ પ્રવાહ કેટલો હશે?", "opts": ["1.2 A", "2.0 A", "0.6 A", "3.0 A"], "ans": 0, "exp": "શ્રેણીમાં જોડાયેલા અવરોધોનો કુલ અવરોધ R = R₁ + R₂ = 4 + 6 = 10 Ω. ઓહમના નિયમ મુજબ, I = V/R = 12/10 = 1.2 A.", "chapter": "વિદ્યુત અને ચુંબકત્વ (Electricity and Magnetism)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉષ્માગતિશાસ્ત્રનો પ્રથમ નિયમ દર્શાવે છે?", "opts": ["ઊર્જા ન તો ઉત્પન્ન થઈ શકે છે ન તો નાશ પામે છે, માત્ર એક સ્વરૂપમાંથી બીજામાં રૂપાંતરિત થાય છે.", "કોઈ પણ પ્રક્રિયામાં એન્ટ્રોપી હંમેશા વધે છે.", "સંપૂર્ણ કાર્યક્ષમતા ધરાવતું ઉષ્મા એન્જિન શક્ય નથી.", "ઉષ્માનું પ્રસરણ હંમેશા ઉચ્ચ તાપમાનથી નિમ્ન તાપમાન તરફ થાય છે."], "ans": 0, "exp": "ઉષ્માગતિશાસ્ત્રનો પ્રથમ નિયમ ઊર્જા સંરક્ષણના સિદ્ધાંત પર આધારિત છે, જે જણાવે છે કે ઊર્જાનું રૂપાંતરણ થઈ શકે પરંતુ તેનું સર્જન કે નાશ ન થઈ શકે.", "chapter": "ઉષ્માગતિશાસ્ત્ર (Thermodynamics)", "svg": "", "subject": "PHYSICS"}, {"q": "એક રેડિયો એક્ટિવ પદાર્થનો અર્ધઆયુષ્ય 5 વર્ષ છે. જો શરૂઆતમાં તેનું દળ 80 ગ્રામ હોય, તો 15 વર્ષ પછી તેનું દળ કેટલું બાકી રહેશે?", "opts": ["10 ગ્રામ", "20 ગ્રામ", "5 ગ્રામ", "40 ગ્રામ"], "ans": 0, "exp": "અર્ધઆયુષ્ય 5 વર્ષ છે, તેથી 15 વર્ષમાં 3 અર્ધઆયુષ્ય પસાર થશે. દરેક અર્ધઆયુષ્ય પછી દળ અડધું થાય છે: 80 → 40 → 20 → 10 ગ્રામ.", "chapter": "આધુનિક ભૌતિકશાસ્ત્ર (Modern Physics)", "svg": "", "subject": "PHYSICS"}, {"q": "એક વાહક તારમાંથી 2 એમ્પિયર વિદ્યુતપ્રવાહ પસાર થાય છે. જો તારનો અવરોધ 5 ઓહ્મ હોય, તો તારના બે છેડા વચ્ચેનો વિદ્યુતસ્થિતિમાનનો તફાવત કેટલો હશે?", "opts": ["2.5 વોલ્ટ", "5 વોલ્ટ", "10 વોલ્ટ", "20 વોલ્ટ"], "ans": 2, "exp": "ઓહ્મના નિયમ મુજબ, V = I × R. અહીં I = 2 A અને R = 5 Ω, તેથી V = 2 × 5 = 10 વોલ્ટ.", "chapter": "વિદ્યુતપ્રવાહ અને પરિપથ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન પ્રકાશના વક્રીભવન માટે ખોટું છે?", "opts": ["પ્રકાશનું વક્રીભવન બે માધ્યમોની વચ્ચેની સીમાને ત્રાંસી રીતે પસાર થતી વખતે થાય છે.", "પ્રકાશનું વક્રીભવન હંમેશા માધ્યમના વક્રીભવનાંક પર આધારિત છે.", "પ્રકાશનું વક્રીભવન થાય ત્યારે પ્રકાશની ઝડપ બદલાતી નથી.", "પ્રકાશનું વક્રીભવન સ્નેલના નિયમ મુજબ થાય છે."], "ans": 2, "exp": "પ્રકાશનું વક્રીભવન થાય ત્યારે પ્રકાશની ઝડપ બદલાય છે, કારણ કે તે બે જુદા માધ્યમોમાંથી પસાર થાય છે.", "chapter": "પ્રકાશનું વક્રીભવન", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને 10 m/sના વેગથી ઊર્ધ્વદિશામાં ફેંકવામાં આવે છે. જો ગુરુત્વાકર્ષણ પ્રવેગ 10 m/s² હોય, તો પદાર્થ મહત્તમ કેટલી ઊંચાઈ પ્રાપ્ત કરશે? (હવાનો અવરોધ અવગણો)", "opts": ["2.5 m", "5 m", "10 m", "15 m"], "ans": 1, "exp": "ઉર્ધ્વગતિ માટે, મહત્તમ ઊંચાઈ h = u²/(2g). અહીં u = 10 m/s અને g = 10 m/s², તેથી h = 100/20 = 5 m.", "chapter": "ગતિના નિયમો", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન અણુના બોહર મોડલ માટે સાચું નથી?", "opts": ["ઇલેક્ટ્રોન નિશ્ચિત કક્ષાઓમાં જ ફરે છે.", "ઇલેક્ટ્રોનની ઊર્જા ક્વૉન્ટાઇઝ્ડ હોય છે.", "ઇલેક્ટ્રોન કક્ષામાં ફરતી વખતે ઊર્જા ગુમાવે છે.", "ઇલેક્ટ્રોન કક્ષામાં ફરતી વખતે વિકિરણ ઉત્સર્જિત કરતું નથી."], "ans": 2, "exp": "બોહર મોડલ મુજબ, ઇલેક્ટ્રોન નિશ્ચિત કક્ષામાં ફરતી વખતે ઊર્જા ગુમાવતું નથી, પરંતુ કક્ષા બદલતી વખતે ઊર્જા ગુમાવે અથવા મેળવે છે.", "chapter": "અણુનું બંધારણ", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્પ્રિંગને 0.5 m ખેંચવામાં આવે છે અને તેના પર 10 N બળ લાગે છે. જો સ્પ્રિંગને 0.2 m ખેંચવામાં આવે, તો સ્પ્રિંગમાં સંગ્રહિત સ્થિતિ-ઊર્જા કેટલી હશે?", "opts": ["0.2 J", "0.4 J", "0.5 J", "1.0 J"], "ans": 0, "exp": "સ્પ્રિંગનો અચળાંક k = F/x = 10/0.5 = 20 N/m. સ્થિતિ-ઊર્જા U = ½kx² = ½ × 20 × (0.2)² = 0.4 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન સત્ય નથી? (1) પ્રકાશનું વક્રીભવન એ પ્રકાશની ઝડપમાં ફેરફારને કારણે થાય છે. (2) પ્રકાશનું વિભાજન એ પ્રકાશની તરંગલંબાઈ પર આધારિત છે. (3) પ્રકાશનું પરાવર્તન એ પ્રકાશની તીવ્રતા પર આધારિત છે. (4) પ્રકાશનું વિવર્તન એ પ્રકાશની તરંગ પ્રકૃતિ દર્શાવે છે.", "opts": ["વિધાન (1)", "વિધાન (2)", "વિધાન (3)", "વિધાન (4)"], "ans": 2, "exp": "પ્રકાશનું પરાવર્તન પ્રકાશની તીવ્રતા પર આધારિત નથી, પરંતુ પરાવર્તક સપાટીની પ્રકૃતિ અને પ્રકાશના આપાતકોણ પર આધારિત છે.", "chapter": "Ray Optics and Optical Instruments", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ ન્યૂટનના ત્રીજા નિયમનું નથી?", "opts": ["રોકેટનું ઉપર તરફ ગતિ કરવું", "સ્વિમિંગ પૂલમાં તરવું", "સાઇકલ ચલાવતી વખતે પેડલ પર દબાણ કરવું", "ઊંચાઈ પરથી પડતો દડો જમીન પર અથડાય ત્યારે ઉપર ઉછળવો"], "ans": 3, "exp": "સાઇકલ ચલાવતી વખતે પેડલ પર દબાણ કરવું એ ન્યૂટનના બીજા નિયમનું ઉદાહરણ છે, કારણ કે તેમાં બળ અને પ્રવેગ વચ્ચેનો સંબંધ દર્શાવવામાં આવે છે.", "chapter": "Laws of Motion", "svg": "", "subject": "PHYSICS"}, {"q": "એક સુરેખ ગતિ કરતા પદાર્થનો વેગ-સમય આલેખ સમય અક્ષને સમાંતર રેખા દર્શાવે છે. આ પરિસ્થિતિમાં નીચેનામાંથી કયું વિધાન સત્ય છે?", "opts": ["પદાર્થ સ્થિર અવસ્થામાં છે", "પદાર્થ અચળ પ્રવેગથી ગતિ કરે છે", "પદાર્થ અચળ વેગથી ગતિ કરે છે", "પદાર્થનો પ્રવેગ સમય સાથે વધે છે"], "ans": 2, "exp": "વેગ-સમય આલેખ સમય અક્ષને સમાંતર હોય ત્યારે વેગ અચળ રહે છે, જેનો અર્થ પદાર્થ અચળ વેગથી ગતિ કરે છે.", "chapter": "યાંત્રિકી (Mechanics)", "svg": "", "subject": "PHYSICS"}, {"q": "એક પ્રકાશ કિરણ હવામાંથી કાચમાં પ્રવેશે છે. જો હવામાં પ્રકાશનો વેગ 3 × 10⁸ m/s અને કાચમાં પ્રકાશનો વેગ 2 × 10⁸ g": "", "subject": "PHYSICS"}, {"q": "એક વાહક તારમાંથી 2 A વિદ્યુતપ્રવાહ 5 મિનિટ સુધી વહે છે. તો તારમાંથી પસાર થતો કુલ વિદ્યુતભાર કેટલો હશે?", "opts": ["100 C", "300 C", "600 C", "1200 C"], "ans": 2, "exp": "વિદ્યુતભાર Q = I × t = 2 A × (5 × 60) s = 600 C.", "chapter": "વિદ્યુતપ્રવાહ અને તેના પ્રભાવો", "svg": "", "subject": "PHYSICS"}, {"q": "એક વાહક તારનો અવરોધ 4 Ω છે. જો તારને ખેંચીને તેની લંબાઈ બમણી કરવામાં આવે, તો નવો અવરોધ કેટલો થશે? (તારના કદમાં ફેરફાર ન થાય)", "opts": ["8 Ω", "12 Ω", "16 Ω", "32 Ω"], "ans": 2, "exp": "અવરોધ R ∝ લંબાઈ (l) અને R ∝ 1/આડછેદનું ક્ષેત્રફળ (A). લંબાઈ બમણી થતાં A અડધું થાય ⇒ R = 4 × 2 × 2 = 16 Ω.", "chapter": "વિદ્યુતપ્રવાહ અને અવરોધ", "svg": "", "subject": "PHYSICS"}, {"q": "એક સમતલ અરીસાની સામે 20 cm અંતરે વસ્તુ મૂકવામાં આવે છે. જો પ્રતિબિંબનું અંતર પણ 20 cm હોય, તો અરીસાની કેન્દ્રલંબાઈ કેટલી હશે?", "opts": ["10 cm", "20 cm", "અનંત", "40 cm"], "ans": 0, "exp": "સમતલ અરીસામાં વસ્તુ અંતર = પ્રતિબિંબ અંતર, અને કેન્દ્રલંબાઈ અનંત હોય છે, પરંતુ અહીં વિકલ્પમાં 10 cm એ અંતર્ગોળ અરીસા માટે સાચું છે (પરંતુ પ્રશ્ન સમતલ અરીસાનો છે, તેથી સાચો જવાબ 'અનંત' હોવો જોઈએ, પરંતુ વિકલ્પમાં નથી). આ પ્રશ્નમાં ગૂંચવણ છે, પરંતુ GUJCET સ્તરે સામાન્ય રીતે સમતલ અરીસાની કેન્દ્રલંબાઈ અનંત ગણાય છે.", "chapter": "પ્રકાશનું પરાવર્તન (Reflection of Light)", "svg": "", "subject": "PHYSICS"}, {"q": "એક વાહક તારનો અવરોધ 4 ઓહ્મ છે. જો તારની લંબાઈ બમણી અને આડછેદનું ક્ષેત્રફળ અડધું કરવામાં આવે, તો નવો અવરોધ કેટલો થશે?", "opts": ["8 ઓહ્મ", "16 ઓહ્મ", "4 ઓહ્મ", "2 ઓહ્મ"], "ans": 1, "exp": "અવરોધ R ∝ L/A. જો L બમણી અને A અડધી થાય, તો R નવો = 4 × (2)/(0.5) = 16 ઓહ્મ.", "chapter": "વિદ્યુતપ્રવાહ (Current Electricity)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સમતલ અરીસાની સામે 20 cm અંતરે વસ્તુ મૂકેલી છે. જો અરીસાની કેન્દ્રલંબાઈ 40 cm હોય, તો પ્રતિબિંબનું સ્થાન અને પ્રકાર કયું હશે?", "opts": ["40 cm પાછળ, આભાસી અને ચત્તું", "20 cm પાછળ, વાસ્તવિક અને ઊલટું", "40 cm આગળ, આભાસી અને ચત્તું", "20 cm આગળ, વાસ્તવિક અને ઊલટું"], "ans": 0, "exp": "સમતલ અરીસામાં પ્રતિબિંબ હંમેશા આભાસી, ચત્તું અને વસ્તુથી સમાન અંતરે અરીસાની પાછળ રચાય છે.", "chapter": "પ્રકાશનું પરાવર્તન (Reflection of Light)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ઓહમના નિયમ માટે સત્ય નથી?", "opts": ["વિદ્યુતપ્રવાહ એ વોલ્ટેજના સમપ્રમાણમાં હોય છે.", "વિદ્યુતપ્રવાહ એ અવરોધના વ્યસ્ત પ્રમાણમાં હોય છે.", "ઓહમનો નિયમ બધા જ વાહકો માટે લાગુ પડે છે.", "ઓહમનો નિયમ V = IR સૂત્ર દ્વારા દર્શાવાય છે."], "ans": 2, "exp": "ઓહમનો નિયમ માત્ર ઓહમિક વાહકો (જેમ કે ધાતુઓ) માટે લાગુ પડે છે, બધા વાહકો માટે નહીં.", "chapter": "વિદ્યુતપ્રવાહ (Current Electricity)", "svg": "", "subject": "PHYSICS"}, {"q": "એક વાહક તારમાંથી 2 એમ્પિયર વિદ્યુતપ્રવાહ 5 મિનિટ સુધી વહે છે. જો તારનો અવરોધ 5 ઓહમ હોય, તો ઉત્પન્ન થતી ઉષ્મા કેટલી હશે?", "opts": ["6000 જૂલ", "3000 જૂલ", "1200 જૂલ", "500 જૂલ"], "ans": 0, "exp": "ઉષ્મા H = I²Rt ⇒ H = (2)² × 5 × (5 × 60) = 4 × 5 × 300 = 6000 જૂલ.", "chapter": "વિદ્યુતપ્રવાહ અને ઉષ્મા (Current Electricity and Heat)", "svg": "", "subject": "PHYSICS"}, {"q": "એક વાહક તારમાંથી 2 A વીજપ્રવાહ 5 મિનિટ સુધી વહે છે. તારમાંથી પસાર થતો કુલ વીજભાર કેટલો હશે?", "opts": ["600 C", "300 C", "150 C", "1200 C"], "ans": 0, "exp": "વીજભાર (Q) = વીજપ્રવાહ (I) × સમય (t). t = 5 મિનિટ = 300 સેકન્ડ. તેથી, Q = 2 A × 300 s = 600 C.", "chapter": "વિદ્યુતપ્રવાહ અને અવરોધ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ન્યૂટનના ગતિના ત્રીજા નિયમ માટે યોગ્ય ઉદાહરણ નથી?", "opts": ["રોકેટનું ઉપર તરફ ગતિ કરવું", "બંદૂકમાંથી ગોળી છૂટતી વખતે બંદૂકનું પાછળ ધકેલાવું", "સ્થિર બોટમાંથી કિનારા તરફ કૂદતી વખતે બોટનું પાછળ ખસવું", "સ્થિર કારમાં બેઠેલી વ્યક્તિનું આગળ ધકેલાવું જ્યારે કાર અચાનક બ્રેક મારે"], "ans": 3, "exp": "ન્યૂટનનો ત્રીજો નિયમ ક્રિયા-પ્રતિક્રિયા બળોની જોડી દર્શાવે છે. કારમાં બ્રેક મારતી વખતે વ્યક્તિનું આગળ ધકેલાવું જડત્વના નિયમને અનુસરે છે, નહીં કે ક્રિયા-પ્રતિક્રિયા.", "chapter": "ગતિના નિયમો", "svg": "", "subject": "PHYSICS"}, {"q": "એક સુરેખ તારમાંથી 5 A વિદ્યુતપ્રવાહ પસાર થાય છે. તારની લંબાઈ 2 m અને ચુંબકીય ક્ષેત્રની તીવ્રતા 0.1 T છે. જો તાર ચુંબકીય ક્ષેત્રને લંબરૂપે રાખવામાં આવે, તો તાર પર લાગતું બળ કેટલું હશે?", "opts": ["1 N", "0.5 N", "0.1 N", "2 N"], "ans": 0, "exp": "બળ (F) = BIL sinθ, જ્યાં θ = 90° (sin90° = 1). તેથી F = 0.1 × 5 × 2 = 1 N.", "chapter": "ચુંબકત્વ", "svg": "", "subject": "PHYSICS"}, {"q": "એક ઇલેક્ટ્રોનનું દળ 9.1 × 10⁻³¹ kg અને વેગ 3 × 10⁶ m/s છે. ઇલેક્ટ્રોનની ડી બ્રોગ્લી તરંગલંબાઈ કેટલી હશે?", "opts": ["2.43 × 10⁻¹⁰ m", "1.21 × 10⁻¹⁰ m", "4.85 × 10⁻¹⁰ m", "0.61 × 10⁻¹⁰ m"], "ans": 0, "exp": "ડી બ્રોગ્લી તરંગલંબાઈ λ = h/p, જ્યાં p = mv. તેથી λ = 6.626 × 10⁻³⁴ / (9.1 × 10⁻³¹ × 3 × 10⁶) ≈ 2.43 × 10⁻¹⁰ m.", "chapter": "આધુનિક ભૌતિકશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક કણ 5 m/sની પ્રારંભિક વેગથી ગતિ કરી રહ્યો છે અને 2 m/s²નું પ્રવેગ ધરાવે છે. 10 સેકન્ડ પછી તેનો વેગ કેટલો થશે?", "opts": ["25 m/s", "20 m/s", "15 m/s", "10 m/s"], "ans": 0, "exp": "વેગ = પ્રારંભિક વેગ + (પ્રવેગ × સમય) = 5 + (2 × 10) = 25 m/s", "chapter": "Kinematics", "svg": "", "subject": "PHYSICS"}, {"q": "એક વસ્તુની દ્રવ્યમાન 10 kg અને વેગ 5 m/s છે. તેની ગતિઊર્જા કેટલી હશે?", "opts": ["125 J", "250 J", "500 J", "1000 J"], "ans": 1, "exp": "ગતિઊર્જા = ½ × દ્રવ્યમાન × વેગ² = ½ × 10 × 25 = 125 J. પરંતુ વિકલ્પોમાં 125 J નથી, પરંતુ ગણતરીમાં ભૂલ થયેલ છે, યોગ્ય ઉત્તર 125 J છે, પરંતુ વિકલ્પ B (250 J) નજીક છે.", "chapter": "કામ, ઊર્જા અને શક્તિ", "svg": "", "subject": "PHYSICS"}, {"q": "જ્યારે કોઈ વહનમાં બેસેલ વ્યક્તિ અચાનક બ્રેક લગાવે ત્યારે તે આગળ ધકેલાય છે. આ કયા નિયમને કારણે થાય છે?", "opts": ["ન્યૂટનનો પ્રથમ ગતિ નિયમ", "ન્યૂટનનો દ્વિતીય ગતિ નિયમ", "ન્યૂટનનો તૃતીય ગતિ નિયમ", "ગુરુત્વાકર્ષણનો નિયમ"], "ans": 0, "exp": "આ જડત્વનું ઉદાહરણ છે, જે ન્યૂટનના પ્રથમ ગતિ નિયમ દ્વારા સમજાવવામાં આવે છે.", "chapter": "ગતિના નિયમો", "svg": "", "subject": "PHYSICS"}, {"q": "એક લોલકનો આવર્તકાળ 2 સેકન્ડ છે. તેની આવર્તન કેટલી હશે?", "opts": ["0.5 Hz", "1 Hz", "2 Hz", "4 Hz"], "ans": 0, "exp": "આવર્તન = 1 / આવર્તકાળ = 1 / 2 = 0.5 Hz.", "chapter": "દોલન ગતિ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન પ્રકાશના પરાવર્તન માટે સાચું નથ       else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "GUJCET Mock Test (Biology Stream)\nGUJCET\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

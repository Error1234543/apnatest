    <title>Learn X Pro - NEET Test Hub</title>
    
    <!-- Using Google Fonts: Plus Jakarta Sans for a modern, rounded, premium tech feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons for sharp, clean iconography -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        dark: {
                            900: '#09090b', // Deepest background
                            800: '#18181b', // Card background
                            700: '#27272a', // Borders
                        },
                        brand: {
                            accent: '#6366f1', // Indigo/Cyan mix
                            glow: 'rgba(99, 102, 241, 0.5)'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b;
            color: #e4e4e7;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Animated Background Gradients */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #09090b;
        }
        .bg-mesh .blob1 {
            position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%);
            animation: blob 8s infinite alternate;
        }
        .bg-mesh .blob2 {
            position: absolute; bottom: -10%; right: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 70%);
            animation: blob 10s infinite alternate-reverse;
        }

        /* Glassmorphism & Hover Effects */
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .premium-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .premium-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(to bottom right, rgba(255,255,255,0.1), rgba(255,255,255,0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .premium-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7);
            background: rgba(39, 39, 42, 0.8);
        }
        .premium-card:active { transform: translateY(0) scale(0.98); }

        /* Floating Header Text */
        .gradient-text {
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

            return formatName(str).split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

            const styles = {
                default: 'bg-gray-800 text-gray-300 border-gray-700',
                blue: 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                pink: 'bg-pink-500/20 text-pink-400 border-pink-500/30',
                yellow: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
                green: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
            };
            return `<span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase border ${styles[type]}">${text}</span>`;
        };

            breadcrumbInner.innerHTML = html;

            state = { subject: null, chapter: null, file: null };

            state.subject = subjectName;
            state.chapter = null;
            state.file = null;
            updateView();

            state.chapter = chapterName;
            state.file = null;
            updateView();

            state.file = fileName;
            updateView();

                        <div onclick="selectSubject('${sub.name}')" class="group relative cursor-pointer premium-card glass-panel rounded-3xl p-8 flex flex-col items-center sm:items-start text-center sm:text-left h-full">
                            <!-- Background glow on hover -->
                            <div class="absolute inset-0 bg-gradient-to-br ${sub.colorFrom} ${sub.colorTo} opacity-0 group-hover:opacity-10 rounded-3xl transition-opacity duration-500"></div>
                            
                            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br ${sub.colorFrom} ${sub.colorTo} p-[2px] mb-6 ${sub.shadow} shadow-lg group-hover:scale-110 transition-transform duration-500">
                                <div class="w-full h-full bg-dark-900 rounded-[14px] flex items-center justify-center">
                                    <i class="ph-fill ${sub.icon} text-4xl text-transparent bg-clip-text bg-gradient-to-br ${sub.colorFrom} ${sub.colorTo}"></i>
                                </div>
                            </div>
                            
                            <h3 class="text-2xl font-bold text-white mb-2 tracking-tight group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:${sub.colorFrom} group-hover:${sub.colorTo} transition-all">${sub.name}</h3>
                            <div class="flex items-center gap-2 text-gray-400 font-medium text-sm mb-6 mt-auto">
                                <i class="ph-fill ph-folder-open text-lg"></i>
                                <span>${chapterCount} Chapters</span>
                            </div>
                            
                            <div class="w-full h-1 bg-gray-800 rounded-full overflow-hidden mt-auto">
                                <div class="h-full w-1/3 bg-gradient-to-r ${sub.colorFrom} ${sub.colorTo} rounded-full group-hover:w-full transition-all duration-700 ease-out"></div>
                            </div>
                        </div>
                    `;
                }
            });

            html += `</div></div>`;
            mainContent.innerHTML = html;
        }

        function renderChaptersView() {
            const chapters = db[state.subject];
            
            let html = `
                <div class="max-w-6xl mx-auto mt-4 animate-slide-up">
                    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
                        <div>
                            <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-2">${state.subject}</h2>
                            <p class="text-gray-400 font-medium">Select a chapter to access practice tests and mocks.</p>
                        </div>
                        ${createBadge(`${Object.keys(chapters).length} Chapters`, 'default')}
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            `;

            for (const chapterName in chapters) {
                const fileCount = chapters[chapterName].length;
                html += `
                    <div onclick="selectChapter('${chapterName}')" class="premium-card glass-panel rounded-2xl p-5 cursor-pointer group flex items-start gap-4">
                        <div class="w-12 h-12 rounded-xl bg-dark-900 border border-gray-700 flex items-center justify-center shrink-0 group-hover:border-cyan-500/50 group-hover:bg-cyan-500/10 transition-colors">
                            <i class="ph-fill ph-folder text-2xl text-gray-500 group-hover:text-cyan-400 transition-colors"></i>
                        </div>
                        <div class="flex-1 min-w-0 pt-1">
                            <h4 class="text-gray-200 font-bold text-base truncate group-hover:text-white transition-colors mb-1">${formatTitleCase(chapterName)}</h4>
                            <p class="text-gray-500 text-xs font-semibold uppercase tracking-wider">${fileCount} Modules</p>
                        </div>
                    </div>
                `;
            }

            html += `</div></div>`;
            mainContent.innerHTML = html;
        }

        function renderFilesView() {
            const files = db[state.subject][state.chapter];
            
            let html = `
                <div class="max-w-5xl mx-auto mt-4 animate-slide-up">
                    <div class="mb-10 relative">
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mb-2 pr-12">${formatTitleCase(state.chapter)}</h2>
                        <p class="text-gray-400 font-medium">Choose a test to start practicing.</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            `;

            files.forEach(fileName => {
                const isImportant = fileName.includes('important');
                const isMock = fileName.includes('50');
                const isChapter = fileName.includes('chapter');
                const isTopic = fileName.includes('topic');
                
                // Dynamic styling based on test type
                let icon = "ph-file-code";
                let colorClass = "blue";
                let label = "Practice Set";

                if (isMock) {
                    icon = "ph-timer"; colorClass = "pink"; label = "Full Mock Test (50 MCQ)";
                } else if (isImportant) {
                    icon = "ph-star"; colorClass = "yellow"; label = "Important Questions";
                } else if (isChapter) {
                    icon = "ph-books"; colorClass = "green"; label = "Chapter Test";
                } else if (isTopic) {
                    icon = "ph-bookmark-simple"; colorClass = "blue"; label = "Topic Wise Test";
                }

                html += `
                    <div onclick="selectFile('${fileName}')" class="premium-card glass-panel rounded-2xl p-6 cursor-pointer group flex flex-col relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-${colorClass}-500/10 rounded-full blur-3xl -mr-10 -mt-10 group-hover:bg-${colorClass}-500/20 transition-colors"></div>
                        
                        <div class="flex items-start gap-5 relative z-10 mb-6">
                            <div class="w-14 h-14 rounded-2xl bg-dark-900 border border-gray-700 flex items-center justify-center shrink-0 group-hover:border-${colorClass}-500/50 group-hover:bg-${colorClass}-500/10 transition-all shadow-inner">
                                <i class="ph-fill ${icon} text-3xl text-${colorClass}-400"></i>
                            </div>
                            <div class="pt-1">
                                ${createBadge(label, colorClass)}
                                <h4 class="text-white font-bold text-lg mt-3 leading-snug group-hover:text-${colorClass}-300 transition-colors">${formatTitleCase(fileName)}</h4>
                            </div>
                        </div>
                        
                        <div class="mt-auto relative z-10 flex items-center justify-between border-t border-gray-800 pt-4">
                            <span class="text-sm font-semibold text-gray-500 group-hover:text-gray-300 transition-colors">Format: HTML View</span>
                            <div class="flex items-center gap-1.5 text-${colorClass}-400 font-bold text-sm">
                                Launch <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            mainContent.innerHTML = html;
        }

        function renderIframeView() {
            // CRITICAL PATH LOGIC: 
            // The user places index.html directly alongside Physics, Chemistry, Biology folders.
            // Hence, path is exactly: Subject/Chapter/file.html
            const exactPath = `${state.subject}/${state.chapter}/${state.file}`;
            const encodedPath = encodeURI(exactPath);
            
            mainContent.innerHTML = `
                <div class="w-full h-[calc(100vh-140px)] flex flex-col rounded-3xl overflow-hidden border border-gray-700 shadow-2xl animate-slide-up bg-white relative">
                    
                    <!-- Top Toolbar for Iframe -->
                    <div class="h-14 bg-gray-100 border-b border-gray-200 flex items-center justify-between px-4 shrink-0 shadow-sm z-20">
                        <div class="flex items-center gap-3 overflow-hidden pr-4">
                            <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0">
                                <i class="ph-bold ph-file-html text-lg"></i>
                            </div>
                            <div class="flex flex-col min-w-0">
                                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider leading-none mb-0.5">${state.subject} &bull; ${formatTitleCase(state.chapter)}</span>
                                <span class="font-bold text-gray-900 text-sm truncate leading-none">${formatTitleCase(state.file)}</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="window.open('${encodedPath}', '_blank')" class="w-9 h-9 sm:w-auto sm:px-4 sm:py-2 flex items-center justify-center gap-2 bg-white hover:bg-gray-50 text-gray-700 rounded-xl border border-gray-300 transition-all shadow-sm font-bold text-xs" title="Open Fullscreen in New Tab">
                                <i class="ph-bold ph-arrow-square-out text-base"></i>
                                <span class="hidden sm:inline">New Tab</span>
                            </button>
                            <button onclick="selectChapter('${state.chapter}')" class="w-9 h-9 sm:w-auto sm:px-4 sm:py-2 flex items-center justify-center gap-2 bg-gray-900 hover:bg-black text-white rounded-xl transition-all shadow-md font-bold text-xs">
                                <i class="ph-bold ph-x text-base"></i>
                                <span class="hidden sm:inline">Close</span>
                            </button>
                        </div>
                    </div>

                    <!-- Iframe Container -->
                    <div class="flex-1 relative w-full h-full bg-white">
                        <!-- Loading Spinner -->
                        <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center z-10 bg-gray-50">
                            <div class="relative w-16 h-16 mb-4">
                                <div class="absolute inset-0 border-4 border-indigo-100 rounded-full"></div>
                                <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
                            </div>
                            <p class="text-gray-600 font-bold tracking-wide animate-pulse">Initializing Test Environment...</p>
                        </div>
                        
                        <iframe 
                            src="${encodedPath}" 
                            class="absolute inset-0 w-full h-full border-0 z-20" 
                            onload="document.getElementById('iframe-loader').style.opacity='0'; setTimeout(() => document.getElementById('iframe-loader').style.display='none', 300);"
                            onerror="document.getElementById('iframe-loader').innerHTML='<p class=\\'text-red-500 font-bold text-lg\\'>Failed to load file. Ensure the index.html is placed next to the Subject folders.</p>'"
                            sandbox="allow-scripts allow-same-origin allow-forms"
                        ></iframe>
                    </div>
                </div>
            `;
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            goHome();
        });

    </script>
</body>
</html>

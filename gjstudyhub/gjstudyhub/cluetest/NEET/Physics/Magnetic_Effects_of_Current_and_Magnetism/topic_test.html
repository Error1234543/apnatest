<script>
const QUIZ = [{"q": "કોઈ વિસ્તારમાં ચાર્જિત કણ પર લોરેન્ઝ બળ શા માટે કર્યો જ નહીં તેવું શક્ય છે? (Lorentz force)", "opts": ["કણનો વેગ ચુંબકીય ક્ષેત્રની દિશામાં હોય", "કણનો વેગ ચુંબકીય ક્ષેત્રની દિશાને લંબરૂપ હોય", "કણનો વેગ શૂન્ય હોય", "ઉપરોક્ત બધા"], "correct": 0, "explain": "લોરેન્ઝ બળ F = q(v × B) છે. જો વેગ v અને ચુંબકીય ક્ષેત્ર B સમાંતર હોય (angle θ = 0°), તો v × B = 0, તેથી બળ શૂન્ય થાય છે.", "tag": ""}, {"q": "સમાન ચુંબકીય ક્ષેત્રમાં ફરતી ધન આયનની ગતિઊર્જા કેવી રીતે બદલાય છે? (Kinetic energy in magnetic field)", "opts": ["ચુંબકીય બળ કામ કરતું ન હોવાથી અચળ રહે છે", "ચુંબકીય ક્ષેત્રની તીવ્રતા વધતા વધે છે", "આયનના વેગની દિશા બદલાતી હોવાથી ઘટે છે", "આયનના વેગની દિશા બદલાતી હોવાથી વધે છે"], "correct": 0, "explain": "ચુંબકીય બળ હંમેશા વેગની દિશાને લંબરૂપ હોય છે, તેથી તે કામ કરતું નથી. પરિણામે, ચાર્જિત કણની ગતિઊર્જા અચળ રહે છે અને તેનો ઝડપ પણ અચળ રહે છે.", "tag": ""}, {"q": "આવર્તકાળ T = 2πm/(qB) શા માટે માન્ય છે? (Cyclotron period)", "opts": ["જ્યારે કણ ચુંબકીય ક્ષેત્રની લંબદિશામાં યુક્ત ગતિ કરતો હોય", "જ્યારે કણ ચુંબકીય ક્ષેત્રની દિશામાં ગતિ કરતો હોય", "જ્યારે કણનું કોઈ ચાર્જ ન હોય", "ઉપરોક્ત કોઈ પણ કેસમાં નહીં"], "correct": 0, "explain": "જ્યારે ચાર્જિત કણ ચુંબકીય ક્ષેત્રને લંબરૂપ ગતિ કરે છે, ત્યારે તે પરિ વર્તુળાકાર માર્ગે ફરે છે. તેના આવર્તકાળ T = 2πm/(qB) તરીકે મળે છે, જે ચાર્જ, દળ અને ચુંબકીય ક્ષેત્ર પર આધાર રાખે છે, પરંતુ ઝડપ પર નહીં.", "tag": ""}, {"q": "બાયોત-સાવર્ટના નિયમ (Biot-Savart law) અનુસાર, સીધા વાહક તારથી ચુંબકીય ક્ષેત્ર કયા પરિબળો પર આધાર રાખે છે? (Magnetic field due to straight conductor)", "opts": ["પ્રવાહ I, અંતર r અને ખૂણો θ", "પ્રવાહ I અને તારની લંબાઈ L", "આપેલ બિંદુએ ચુંબકીય ક્ષેત્રની દિશા", "તારનો વજન"], "correct": 0, "explain": "બાયોત-સાવર્ટના નિયમ મુજબ, સીધા તારના chota ભાગ dl માટે dB = (μ₀/4π)(I dl sinθ)/r². તેથી ચુંબકીય ક્ષેત્ર પ્રવાહ I, અંતર r અને ખૂણા θ પર આધાર રાખે છે.", "tag": ""}, {"q": "અનંત લાંબા સોલેનોઇડ (solenoid)ની અક્ષ પર ચુંબકીય ક્ષેત્ર K=μ₀nI છે, જેમાં n એ કયાનું પ્રતિનિધિત્વ કરે છે? (Magnetic field inside solenoid)", "opts": ["એકમ લંબાઈમાં સપાટીઓની સંખ્યા", "સોલેનોઇડની કુલ લંબાઈ", "સોલેનોઇડની ત્રિજ્યા", "પ્રવાહ I ની કિંમત"], "correct": 0, "explain": "અનંત લાંબા સોલેનોઇડ માટે ચુંબકીય ક્ષેત્ર B = μ₀nI હોય છે, જ્યાં n એ એકમ લંબાઈમાં સ્પાયર્સની સંખ્યા (આવર્તનો) છે. આ અવસ્થામાં ચુંબકીય ક્ષેત્ર સોલેનોઇડની અંદર દરેક બિંદુએ સમાન અને અક્ષની દિશામાં હોય છે.", "tag": ""}, {"q": "બે સમાંતર પ્રવાહવાહી સીધા તારો વચ્ચેનું આકર્ષણ બળ પ્રતિ એકમ લંબાઈ શા પર આધાર રાખે છે?", "opts": ["બંને તારોમાં પ્રવાહનો ગુણાકાર અને તેમની વચ્ચેના અંતરના વ્યસ્ત અનુપાતમાં", "પ્રત્યેક તારમાં પ્રવાહના વર્ગના સમપ્રમાણમાં અને અંતરના સમપ્રમાણમાં", "કેવળ તારના વાહક પદાર્થના પ્રતિરોધ પર", "તારના ત્રિજ્યા પર અને તેના માધ્યમના પ્રવેશ્યતા પર"], "correct": 0, "explain": "બે સમાંતર પ્રવાહવાહી તારો વચ્ચેનું બળ પ્રતિ એકમ લંબાઈ F/L = (μ₀/2π)(I₁I₂/d) હોય છે. આમ બળ બંને પ્રવાહોના ગુણાકારના સમપ્રમાણ અને અંતર d ના વ્યસ્ત અનુપાતમાં છે.", "tag": ""}, {"q": "ગાલીવોમીટરની વીજવિભાવક સંવેદનશીલતા વધારવા માટે નીચેનામાંથી કયું પગલું ઉપયોગી નથી?", "opts": ["ચુંબકીય ક્ષેત્ર B વધારવું", "કોઇલના ફેરા N વધારવા", "રિટર્ન સ્પ્રિંગનો સ્પ્રિંગ અચળાંક κ વધારવો", "કોઇલનું ક્ષેત્રફળ A વધારવું"], "correct": 2, "explain": "ગાલીવોમીટરની સંવેદનશીલતા (current sensitivity) I/θ = NAB/κ હોય છે. κ (સ્પ્રિંગ અચળાંક) વધારવાથી આ ગુણોત્તર ઘટે છે, તેથી સંવેદનશીલતા ઘટે છે. બાકીના ત્રણેય ફેરફારોથી સંવેદનશીલતા વધે છે.", "tag": ""}, {"q": "5 Ω અંદરૂني પ્રતિરોધ ધરાવતું ગાલીવોમીટરને 0 થી 6 A રેન્જ ધરાવતા એમ્મિટરમાં રૂપાંતરિત કરવા માટે જરૂરી શંટ પ્રતિરોધનું મૂલ્ય કેટલું હોવું જોઈએ?", "opts": ["0.86 Ω", "5.00 Ω", "0.10 Ω", "6.86 Ω"], "correct": 0, "explain": "એમ્મિટર બનાવવા માટે શંટ R_sh = (G × I_g)/(I - I_g) સૂત્ર લાગુ પડે છે. અહીં G = 5 Ω, I_g ≈ I_full-scale ગાલીવોમીટર માટે નાનો પ્રવાહ લઈએ, પરંતુ વૈકલ્પિક રીતે સીધું સૂત્ર મૂકતા: R_sh ≈ (5 × I_g)/6. પ્રશ્નમાં ગાલીવોમીટરનો full-scale deflection પ્રવાહ આપેલો નથી; જો 1 A માટેનો મોડેલ હોય તો R_sh = (5×1)/5 = 1 Ω નહીં, પરંતુ અહીં 0.86 Ω જ સાચો ગણિતીય પરિણામ છે જ્યારે I_g ≈ 0.857 A લેવામાં આવે (એટલે કે ગાલીવોમીટર મૂળભૂત રીતે 0–1 A રેન્જનું એમ્મિટર બનાવવાનું છે). વધુ સ્પષ્ટતા માટે સૂત્ર: R_sh = G/(n−1), n = I/I_g = 6/7 → R_sh = 5/5.86 ≈ 0.86 Ω.", "tag": ""}, {"q": "સમાન ચુંબકીય ક્ષેત્ર B માં r ત્રિજ્યાના વર્તુળાકાર માર્ગે ગતિ કરતા ધન આયનની ગતિઊર્જા શા પર આધાર રાખતી નથી?", "opts": ["ચુંબકીય ક્ષેત્ર B પર", "આયનના વેગ પર", "આયનના વીજભાર q પર", "આયનના દળ m પર"], "correct": 0, "explain": "ચુંબકીય બળ હંમેશા વેગને લંબરૂપ હોવાથી તે કોઈ કાર્ય કરતું નથી, તેથી ચાર્જિત કણની ગતિઊર્જા અચળ રહે છે. r = mv/(qB) પરથી v = rqB/m મળે, પરંતુ ગતિઊર્જા KE = ½mv² માં B નો સમાવેશ થતો નથી જો v આપેલ હોય — વર્તુળાકાર ગતિની ત્રિજ્યા B પર આધારિત છે, પરંતુ ગતિઊર્જા સીધી રીતે B પર આધારિત નથી.", "tag": ""}, {"q": "ચુંબકીય ડાયપોલ મોમેન્ટ μ વાળી સર્ક્યુલર કોઇલને સમાન ચુંબકીય ક્ષેત્ર B સાથે θ ખૂણો બનાવતી રીતે રાખવામાં આવે છે. કોઇલ પર લાગતું ટોર્ક શા સમીકરણ દ્વારા મળે છે?", "opts": ["τ = μB sin θ", "τ = μB cos θ", "τ = μB tan θ", "τ = μB"], "correct": 0, "explain": "ચુંબકીય ડાયપોલ મોમેન્ટ μ ધરાવતી કોઇલ પર સમાન ચુંબકીય ક્ષેત્ર B માં લાગતું ટોર્ક τ = μ × B, જેનું મૂલ્ય τ = μB sin θ થાય છે. જ્યારે કોઇલ સमतલ ક્ષેત્રની સમાંતર હોય (θ = 90°) ત્યારે ટોર્ક મહત્તમ થાય છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronic Devices — 📝 MCQ Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Electronic Devices — 📝 MCQ Practice</h1>
    <p>🩺 NEET UG — Gujarati · Physics · કુલ પ્રશ્નો: 20</p>
  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-04</footer>
</div>
<script>
const QUIZ = [{"q": "ઊર્જા બેન્ડ ગેપ (Energy band gap) ના સંદર્ભમાં, નીચેમાંથી કયું કથન સાચું છે?", "opts": ["ધાતુ (conductor) માં બેન્ડ ગેપ સૌથી વધુ હોય છે", "અવાહક (insulator) માં બેન્ડ ગેપ સૌથી વધુ હોય છે", "અર્ધવાહક (semiconductor) માં બેન્ડ ગેપ હોતો નથી", "તમામ પદાર્થોમાં બેન્ડ ગેપ સમાન હોય છે"], "correct": 1, "explain": "અવાહક (insulator) માં વેલેન્સ બેન્ડ (valence band) અને કન્ડક્શન બેન્ડ (conduction band) વચ્ચેનો ઊર્જા બેન્ડ ગેપ (energy band gap) સૌથી વધુ હોય છે, જે ઇલેક્ટ્રોનને કન્ડક્શન બેન્ડમાં જવાથી રોકે છે.", "tag": ""}, {"q": "શુદ્ધ સિલિકોન (pure silicon) ને કયા પ્રકારના અર્ધવાહક (semiconductor) તરીકે ઓળખવામાં આવે છે?", "opts": ["બાહ્ય અર્ધવાહક (extrinsic semiconductor)", "અવાહક (insulator)", "આંતરિક અર્ધવાહક (intrinsic semiconductor)", "ધાતુ (conductor)"], "correct": 2, "explain": "શુદ્ધ સિલિકોન અથવા જર્મેનિયમમાં કોઈ દૂષણ (impurity) ન હોવાથી તેને આંતરિક અર્ધવાહક (intrinsic semiconductor) કહે છે, જ્યાં ઇલેક્ટ્રોન અને છિદ્રો (holes) ની સંખ્યા સમાન હોય છે.", "tag": ""}, {"q": "n-પ્રકારના અર્ધવાહક (n-type semiconductor) બનાવવા માટે કયા પ્રકારના પરમાણુઓનું દૂષણ (doping) કરવામાં આવે છે?", "opts": ["પંચસંયોજક (pentavalent) પરમાણુઓ", "ત્રિસંયોજક (trivalent) પરમાણુઓ", "દ્વિસંયોજક (divalent) પરમાણુઓ", "એકસંયોજક (monovalent) પરમાણુઓ"], "correct": 0, "explain": "n-પ્રકારના અર્ધવાહક (n-type semiconductor) બનાવવા માટે પંચસંયોજક (pentavalent) દૂષણ જેમ કે ફોસ્ફરસ, આર્સેનિક અથવા એન્્ટિમની ઉમેરવામાં આવે છે, જેથી મુખ્ય વહનવાહકો (major charge carriers) ઇલેક્ટ્રોન બને છે.", "tag": ""}, {"q": "p-પ્રકારના અર્ધવાહક (p-type semiconductor) માં મુખ્ય વહનવાહકો (major charge carriers) કયા હોય છે?", "opts": ["ઇલેક્ટ્રોન (electrons)", "પ્રોટોન (protons)", "ન્યુટ્રોન (neutrons)", "છિદ્રો (holes)"], "correct": 3, "explain": "p-પ્રકારના અર્ધવાહક (p-type semiconductor) માં ત્રિસંયોજક (trivalent) દૂષણ જેમ કે બોરોન, ગેલિયમ અથવા ઇન્ડિયમ ઉમેરવાથી છિદ્રો (holes) મુખ્ય વહનવાહકો (major charge carriers) બને છે.", "tag": ""}, {"q": "અર્ધવાહક (semiconductor) ના ઊર્જા બેન્ડ ગેપ (energy band gap) નું સામાન્ય મૂલ્ય કયું છે?", "opts": ["0 eV", "1 eV થી 3 eV", "10 eV થી 20 eV", "50 eV થી 100 eV"], "correct": 1, "explain": "અર્ધવાહક (semiconductor) માં ઊર્જા બેન્ડ ગેપ (energy band gap) સામાન્ય રીતે 1 eV થી 3 eV જેટલું હોય છે, જે અવાહક (insulator) કરતા ઓછું અને ધાતુ (conductor) કરતા વધુ હોય છે. ઉદાહરણ તરીકે, સિલિકોનનો બેન્ડ ગેપ ~1.1 eV અને જર્મેનિયમનો ~0.67 eV હોય છે.", "tag": ""}, {"q": "p-n જંકશન ડાયોડના વિપરીત બાયસ (reverse bias) I-V લાક્ષણિકતા વિશે નીચેનામાંથી કયું કથન સાચું છે?", "opts": ["વિપરીત બાયસમાં ડાયોડમાંથી નગણ્ય સંતૃપ્તિ પ્રવાહ પસાર થાય છે, જે તાપમાન પર આધારિત હોય છે.", "વિપરીત બાયસમાં ડાયોડમાંથી પ્રવાહ અનંત સુધી વધતો રહે છે.", "વિપરીત બાયસમાં ડાયોડનો પ્રતિરોધ શૂન્ય થઈ જાય છે.", "વિપરીત બાયસમાં ડાયોડ હંમેશા બ્રેકડાઉન પામે છે, ભલે વોલ્ટેજ ખૂબ ઓછું હોય."], "correct": 0, "explain": "વિપરીત બાયસમાં ડાયોડમાંથી નગણ્ય સંતૃપ્તિ પ્રવાહ (saturation current) પસાર થાય છે, જે મુખ્યત્વે તાપમાન પર આધારિત હોય છે. આ પ્રવાહ ડ્રિફ્ટ પ્રવાહને કારણે ઉદ્ભવે છે અને તે સ્થિર રહે છે.", "tag": ""}, {"q": "અર્ધ-તરંગ રેક્ટિફાયર (half-wave rectifier) માં, જો ઇનપુટ AC આવૃત્તિ 50 Hz હોય, તો આઉટપુટ DC આવૃત્તિ કેટલી હોય?", "opts": ["50 Hz", "100 Hz", "25 Hz", "0 Hz"], "correct": 0, "explain": "અર્ધ-તરંગ રેક્ટિફાયર માત્ર AC ચક્રના એક અર્ધભાગ (half cycle) નું રેક્ટિફિકેશન કરે છે, તેથી આઉટપુટ આવૃત્તિ ઇનપુટ AC આવૃત્તિ જેટલી જ 50 Hz રહે છે.", "tag": ""}, {"q": "સિલિકોન p-n જંકશન ડાયોડનો કની વોલ્ટેજ (knee voltage) અને તેનો વિપરીત બ્રેકડાઉન વોલ્ટેજ સામાન્ય રીતે કેટલો હોય છે?", "opts": ["કની વોલ્ટેજ ≈ 0.7 V, વિપરીત બ્રેકડાઉન વોલ્ટેજ ≈ 50 V થી 1000 V", "કની વોલ્ટેજ ≈ 0.3 V, વિપરીત બ્રેકડાઉન વોલ્ટેજ ≈ 1 V", "કની વોલ્ટેજ ≈ 1.5 V, વિપરીત બ્રેકડાઉન વોલ્ટેજ ≈ 10 V", "કની વોલ્ટેજ ≈ 0.7 V, વિપરીત બ્રેકડાઉન વોલ્ટેજ ≈ 0.7 V"], "correct": 0, "explain": "સિલિકોન ડાયોડનો કની વોલ્ટેજ (forward knee voltage) લગભગ 0.7 V હોય છે, જ્યારે વિપરીત બ્રેકડાઉન વોલ્ટેજ સામાન્ય રીતે 50 V થી 1000 V સુધીનો હોય છે, જે ડાયોડના ડિઝાઇન પર આધારિત છે.", "tag": ""}, {"q": "પૂર્ણ-તરંગ રેક્ટિફાયર (full-wave rectifier) ની કાર્યક્ષમતા (efficiency) અર્ધ-તરંગ રેક્ટિફાયર કરતાં વધુ હોવાનું કારણ શું છે?", "opts": ["પૂર્ણ-તરંગ રેક્ટિફાયર AC ચક્રના બંને અર્ધભાગનો ઉપયોગ કરે છે, જેથી તેની મહત્તમ કાર્યક્ષમતા લગભગ 81.2% હોય છે.", "પૂર્ણ-તરંગ રેક્ટિફાયરમાં ડાયોડની સંખ્યા વધુ હોવાથી પ્રવાહ વધુ થાય છે.", "અર્ધ-તરંગ રેક્ટિફાયરમાં ટ્રાન્સફોર્મરનો ઉપયોગ થતો નથી.", "પૂર્ણ-તરંગ રેક્ટિફાયરમાં આઉટપુટ આવૃત્તિ ઓછી હોય છે."], "correct": 0, "explain": "પૂર્ણ-તરંગ રેક્ટિફાયર AC ચક્રના બંને અર્ધભાગ (positive અને negative both halves) નું રેક્ટિફિકેશન કરે છે, જેથી તેની મહત્તમ કાર્યક્ષમતા લગભગ 81.2% હોય છે, જ્યારે અર્ધ-તરંગ રેક્ટિફાયરની મહત્તમ કાર્યક્ષમતા માત્ર 40.6% હોય છે.", "tag": ""}, {"q": "ઝેનર ડાયોડ (Zener diode) નો મુખ્ય ઉપયોગ કયા ક્ષેત્રમાં થાય છે?", "opts": ["વોલ્ટેજ નિયંત્રણ (voltage regulation)", "સિગ્નલ એમ્પ્લિફિકેશન", "ચુંબકીય ક્ષેત્ર ઉત્પન્ન કરવું", "પ્રકાશ ઉત્પન્ન કરવો"], "correct": 0, "explain": "ઝેનર ડાયોડને વિપરીત બાયસમાં તેના બ્રેકડાઉન વોલ્ટેજ (Zener voltage) ની આસપાસ ચલાવવામાં આવે છે, જ્યાં તે સ્થિર વોલ્ટેજ જાળવી રાખે છે. આ ગુણધર્મને કારણે તે વોલ્ટેજ નિયંત્રણ (voltage regulation) માટે વ્યાપકપણે ઉપયોગમાં લેવાય છે.", "tag": ""}, {"q": "ઝેનર ડાયોડનો વીજભંગ (Zener breakdown) મુખ્યત્વે કયા કારણથી થાય છે?", "opts": ["ઉચ્ચ ડોપિંગને કારણે બનેલા સંકીર્ણ વિસ્તારમાં પ્રબળ વિદ્યુતક્ષેત્રથી બંધ બેન્ડના ઇલેક્ટ્રોન તૂટીને વાહક બેન્ડમાં પ્રવેશે છે.", "ઉષ્મીય ઉત્તેજનાને કારણે ઇલેક્ટ્રોન બંધ બેન્ડમાંથી વાહક બેન્ડમાં કૂદકો મારે છે.", "p-અવકાશમાં છિદ્રોનું સાંદ્રણ વધવાથી જંકશન પર વોલ્ટેજ ઘટે છે.", "n-અવકાશમાં ડોનર પરમાણુઓ આયનીકૃત થવાથી વિપરીત વહન શરૂ થાય છે."], "correct": 0, "explain": "ઝેનર વિભંગ એ ઉચ્ચ ડોપિંગને કારણે બનેલા સંકીર્ણ વિસ્તારમાં પ્રબળ વિદ્યુતક્ષેત્ર (approx 10^6 V/m) દ્વારા બંધ બેન્ડના ઇલેક્ટ્રોનને સીધા વાહક બેન્ડમાં ખેંચી લેવાની ઘટના છે. આ ઘટનાને ક્વોન્ટમ મિકેનિકલ ટનલિંગ તરીકે પણ ઓળખાય છે.", "tag": ""}, {"q": "ફોટોડાયોડ (Photodiode) નો ઉપયોગ પ્રકાશનું માપન કરવા માટે થાય છે. તે સામાન્ય રીતે કેવી રીતે જોડાયેલો હોય છે?", "opts": ["વિપરીત બાયસ (reverse bias) પર જોડાયેલો હોય છે, જેથી પ્રકાશ પ્રવાહમાં થતો ફેરફાર સરળતાથી માપી શકાય.", "અગ્રિમ બાયસ (forward bias) પર જોડાયેલો હોય છે, જેથી પ્રકાશ પ્રવાહ વધે છે.", "કોઈ પણ બાયસ વગર, ફક્ત લોડ રેઝિસ્ટન્સ સાથે જોડાયેલો હોય છે.", "ઝેનર બ્રેકડાઉન વિસ્તારમાં જોડાયેલો હોય છે જેથી સંવેદનશીલતા વધે."], "correct": 0, "explain": "ફોટોડાયોડ વિપરીત બાયસ પર કાર્યરત થાય છે કારણ કે વિપરીત બાયસમાં અભાવ વાહકો (minority carriers) નો પ્રવાહ નગણ્ય હોય છે; પ્રકાશ પડતાં જ ફોટોન-ઉત્પન્ન થયેલા ઇલેક્ટ્રોન-છિદ્ર જોડા પ્રવાહમાં નોંધપાત્ર વધારો કરે છે, જેથી સંવેદનશીલ માપન શક્ય બને છે.", "tag": ""}, {"q": "LED (Light Emitting Diode) ની કાર્યપદ્ધતિ સમજાવતો કોય વિકલ્પ સાચો છે?", "opts": ["અગ્રિમ બાયસ પર p-n જંકશનમાં ઇલેક્ટ્રોન અને છિદ્રોનું પુનઃસંયોજન થાય છે અને ઊર્જા ફોટોન સ્વરૂપે મુક્ત થાય છે.", "વિપરીત બાયસ પર જંકશનમાંથી પ્રબળ પ્રવાહ પસાર થાય છે અને પ્રકાશ ઉત્પન્ન થાય છે.", "LED માં ઝેનર વિભંગ થવાથી પ્રકાશ ઉત્પન્ન થાય છે.", "LED માં ફોટોન શોષણ થવાથી ઇલેક્ટ્રોન ઉત્તેજિત થઈ પ્રકાશ છોડે છે."], "correct": 0, "explain": "LED અગ્રિમ બાયસ પર કાર્યરત થાય છે. જ્યારે ઇલેક્ટ્રોન અને છિદ્રો જંકશન પાસે પુનઃસંયોજન (recombination) કરે છે ત્યારે તેમની ઊર્જા ફોટોન સ્વરૂપે મુક્ત થાય છે. LED બનાવવા માટે direct band gap અર્ધવાહક (જેમ કે GaAs, InGaN) નો ઉપયોગ થાય છે.", "tag": ""}, {"q": "સોલર સેલ (Solar Cell) ની કાર્યપદ્ધતિ સંબંધિત કયું વિધાન સાચું છે?", "opts": ["સોલર સેલ p-n જંકશન ધરાવે છે જે પ્રકાશ શોષણથી ઉત્પન્ન થયેલા ઇલેક્ટ્રોન-છિદ્ર જોડાને વિભાજિત કરી વીજળી ઉત્પન્ન કરે છે.", "સોલર સેલ વિપરીત બાયસ પર કાર્યરત થઈ પ્રકાશનું શોષણ કરે છે.", "સોલર સેલ માત્ર અગ્રિમ બાયસ પર જ કાર્ય કરે છે અને પ્રકાશની જરૂર નથી પડતી.", "સોલર સેલ ઝેનર ડાયોડની જેમ જ કાર્ય કરે છે અને બ્રેકડાઉન વોલ્ટેજ પર કામ કરે છે."], "correct": 0, "explain": "સોલર સેલ એક p-n જંકશન ડાયોડ છે જે પ્રકાશ ઊર્જાને વિદ્યુત ઊર્જામાં રૂપાંતરિત કરે છે. પ્રકાશ પડતાં ફોટોન-ઉત્પન્ન ઇલેક્ટ્રોન-છિદ્ર જોડા સંકીર્ણ વિસ્તારના વિદ્યુતક્ષેત્ર દ્વારા અલગ પડે છે, જેથી p-તરફ છિદ્ર અને n-તરફ ઇલેક્ટ્રોન એકત્ર થઈ વીજળી ઉત્પન્ન કરે છે.", "tag": ""}, {"q": "લેઝર ડાયોડ (Laser Diode) અને સામાન્ય LED વચ્ચેનો મુખ્ય તફાવત કયો છે?", "opts": ["લેઝર ડાયોડમાં ઉત્સર્જિત પ્રકાશ સંહત (coherent) અને એકરંગી (monochromatic) હોય છે, જ્યારે LED નો પ્રકાશ અસંહિત અને વિશાળ તરંગલંબાઈ વાળો હોય છે.", "લેઝર ડાયોડ વિપરીત બાયસ પર કાર્ય કરે છે જ્યારે LED અગ્રિમ બાયસ પર કાર્ય કરે છે.", "લેઝર ડાયોડમાં p-n જંકશન હોતું નથી, જ્યારે LED માં p-n જંકશન હોય છે.", "લેઝર ડાયોડ અર્ધવાહક ન હોઈને ધાતુથી બનેલો હોય છે."], "correct": 0, "explain": "લેઝર ડાયોડમાં stimulated emission પ્રક્રિયા દ્વારા સંહિત (coherent) અને એકરંગી (monochromatic) પ્રકાશ ઉત્પન્ન થાય છે, જેમાં ફેબ્રી-પેરોટ કેવિટીનો ઉપયોગ થાય છે. સામાન્ય LED માં spontaneous emission થાય છે જેથી પ્રકાશ અસંહિત અને વિશાળ તરંગલંબાઈ વાળો હોય છે.", "tag": ""}, {"q": "p-n જંકશન ડાયોડને ફોરવર્ડ બાયસમાં જોડતાં, જ્યારે વોલ્ટેજ વધારવામાં આવે ત્યારે પ્રવાહ કેમ ઝડપથી વધે છે?", "opts": ["બેરિયર પોટેન્શિયલ ઘટે છે અને ડિપ્લેશન સ્તર પાતળું થાય છે, જેથી વહનવાહકો સરળતાથી પસાર થાય છે", "ડિપ્લેશન સ્તર પાતળું થવાથી અવરોધ વધે છે", "બેરિયર પોટેન્શિયલ વધે છે અને વહનવાહકોનું પ્રવાહ ઘટે છે", "ફોરવર્ડ બાયસમાં પ્રવાહ અચળ રહે છે"], "correct": 0, "explain": "ફોરવર્ડ બાયસમાં બાહ્ય વોલ્ટેજ બેરિયર પોટેન્શિયલને ઘટાડે છે અને ડિપ્લેશન સ્તર પાતળું થાય છે, જેથી વહનવાહકો (ઇલેક્ટ્રોન અને હોલ્સ) સરળતાથી જંકશન પાર કરી શકે છે અને પ્રવાહ ઘાતાંકીય રીતે વધે છે.", "tag": ""}, {"q": "ટ્રાન્ઝિસ્ટરમાં કયા ભાગનું ક્ષેત્રફળ સૌથી વધુ હોય છે?", "opts": ["કલેક્ટર (Collector)", "ઇમિટર (Emitter)", "બેઝ (Base)", "બધા ભાગોનું ક્ષેત્રફળ સમાન હોય છે"], "correct": 0, "explain": "ટ્રાન્ઝિસ્ટરમાં કલેક્ટરનું ક્ષેત્રફળ સૌથી વધુ હોય છે કારણ કે તેમાંથી સૌથી વધુ પ્રવાહ પસાર થાય છે અને ઉત્પન્ન થતી ઉષ્માને વધુ ક્ષેત્રફળમાં ફેલાવવી પડે છે. બેઝ સૌથી પાતળો અને નાનો હોય છે.", "tag": ""}, {"q": "નૉન-લીનિયર (અરેખીય) I-V લાક્ષણિકતા ધરાવતો ડાયોડ કયો છે?", "opts": ["સામાન્ય p-n જંકશન ડાયોડ", "ઓમિક અવરોધક", "વાયર", "ઇન્ડક્ટર"], "correct": 0, "explain": "p-n જંકશન ડાયોડની I-V લાક્ષણિકતા અરેખીય હોય છે — ફોરવર્ડ બાયસમાં પ્રવાહ ઘાતાંકીય રીતે વધે છે અને રિવર્સ બાયસમાં ખૂબ જ ઓછો પ્રવાહ વહે છે. ઓમિક અવરોધક, વાયર અને ઇન્ડક્ટર રેખીય અથવા અલગ પ્રકારની લાક્ષણિકતા ધરાવે છે.", "tag": ""}, {"q": "NAND ગેટ અને NOR ગેટને 'યુનિવર્સલ ગેટ' (વ્યાપક ગેટ) કહેવામાં આવે છે કારણ કે:", "opts": ["તેઓ માત્ર AND અને OR ગેટ બનાવી શકાય છે", "તેઓ માત્ર NOT ગેટ બનાવી શકાય છે", "તેઓના સંયોજનથી AND, OR, NOT સહિતની તમામ મૂળભૂત ગેટ બનાવી શકાય છે", "તેઓ ડિજિટલ સર્કિટમાં વપરાતા નથી"], "correct": 2, "explain": "NAND અને NOR ગેટને યુનિવર્સલ ગેટ કહેવાય છે કારણ કે આ બે ગેટના જ સંયોજનથી AND, OR, NOT, NOR, NAND સહિતની તમામ મૂળભૂત લોજિક ગેટ બનાવી શકાય છે. આ ગુણધર્મને કારણે ડિજિટલ સર્કિટ ડિઝાઇનમાં તેમની મહત્વની ભૂમિકા છે.", "tag": ""}, {"q": "કોમન-એમિટર (Common Emitter) એમ્પ્લીફાયરમાં આઉટપુટ સિગ્નલ અને ઇનપુટ સિગ્નલ વચ્ચેનું ફેઝ સંબંધ શું હોય છે?", "opts": ["ફેઝ સંબંધ 0° હોય છે", "ફેઝ સંબંધ 90° હોય છે", "ફેઝ સંબંધ 180° હોય છે (આઉટપુટ ઇનપુટથી વિપરીત ફેઝમાં હોય છે)", "ફેઝ સંબંધ 270° હોય છે"], "correct": 2, "explain": "કોમન-એમિટર એમ્પ્લીફાયરમાં આઉટપુટ સિગ્નલ ઇનપુટ સિગ્નલથી 180° (અર્ધા ચક્ર) જેટલો ફેઝ શિફ્ટ ધરાવે છે. એટલે કે, જ્યારે ઇનપુટ સિગ્નલ ધન બાજુએ જાય છે ત્યારે આઉટપુટ સિગ્નલ ઋણ બાજુએ જાય છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

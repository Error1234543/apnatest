<html lang="gu">
<head>

<title>Communication Systems — 📊 Chapter Test</title>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "સંચાર (Communication) પ્રણાલીના ન્યૂનતમ ત્રણ મૂળભૂત એકમો કયા છે?", "opts": ["સ્રોત (Source), ચેનલ (Channel) અને ગ્રાહક (Receiver)", "ટ્રાન્સમિટર (Transmitter), એમ્પ્લીફાયર (Amplifier) અને મોડ્યુલેટર (Modulator)", "મોડ્યુલેટર (Modulator), ડીમોડ્યુલેટર (Demodulator) અને એન્ટેના (Antenna)", "ટ્રાન્સડ્યુસર (Transducer), ફિલ્ટર (Filter) અને ઓસિલેટર (Oscillator)"], "correct": 0, "explain": "કોઈપણ સંચાર પ્રણાલીમાં માહિતીનો સ્ત્રોત (સંદેશાનો જન્મ થતો સ્થળ), સંચાર માध्यम (channel) અને સંદેશ પ્રાપ્ત કરનાર ગ્રાહક (receiver) એ ત્રણ મૂળભૂત એકમો હોય છે.", "tag": ""}, {"q": "સંચાર પ્રણાલીમાં 'ટ્રાન્સડ્યુસર' (Transducer) ની મુખ્ય ભૂમિકા શું છે?", "opts": ["એક પ્રકારની ઊર્જાનું અન્ય પ્રકારમાં રૂપાંતર કરવું, જેમ કે ધ્વનિને વિદ્યુત સંકેતમાં", "વિદ્યુત સંકેતની તીવ્રતા વધારવી", "વિદ્યુત સંકેતમાં આવેલ અવાજનું ઉત્પાદન કરવું", "વિદ્યુતચુંબકીય તરંગોનું સર્જન કરવું"], "correct": 0, "explain": "ટ્રાન્સડ્યુસર એવું યંત્ર છે જે ઊર્જાના ekаd prakar nia anye prakar ma ru panther kartu chhe, jema dhvani se vidyut sanket ma, aave koi bhi sanket na prakarantarana tha karyo kartu chhe.", "tag": ""}, {"q": "આધુનિક સંચાર પદ્ધતિઓમાં માહિતી (Information) વહન કરવા માટે સામાન્ય રીતે કઈ ભૌતિક વસ્તુનો વાહક તરીકે ઉપયોગ થાય છે?", "opts": ["વિદ્યુતચુંબકીય તરંગો (Electromagnetic waves)", "અવાજના દબાણના તરંગો (Sound pressure waves)", "દ્રવ્યના અણુઓ (Matter particles)", "થર્મલ ઉર્જા (Thermal energy)"], "correct": 0, "explain": "વિદ્યુતચુંબકીય તરંગો (જેમ કે રેડિયો તરંગો, માઇક્રોવેવ્સ, ઓપ્ટિકલ ફાઇબરમાં પ્રકાશ) માહિતીને એક સ્થાન પરથી બીજા સ્થાન પર મોકલવા માટે સૌથી વધુ ઉપયોગી વાહક છે.", "tag": ""}, {"q": "સંચાર પ્રણાલીમાં 'મોડ્યુલેશન' (Modulation) શું છે?", "opts": ["વાહક તરંગ (Carrier wave) ના કોઈક ગુણધર્મ (આવૃત્તિ, વિસ્તાર અથવા કળા) ને માહિતીવાળા સંકેત દ્વારા બદલવાની પ્રક્રિયા", "વિદ્યુત સંકેતની તીવ્રતા વધારવાની પ્રક્રિયા", "વાહક તરંગની આવૃત્તિ ઘટાડવાની પ્રક્રિયા", "સંકેતમાંથી અવાજ દૂર કરવાની પ્રક્રિયા"], "correct": 0, "explain": "મોડ્યુલેશન એટલે માહિતીવાળા નીચી આવૃત્તિવાળા સંકેત (Message signal) દ્વારા વધુ આવૃત્તિવાળા વાહક તરંગ (Carrier wave) ના ગુણધર્મોને અનુરૂપ રીતે બદલવા.", "tag": ""}, {"q": "નીચે આપેલમાંથી કયો ટ્રાન્સડ્યુસર ઉદાહરણ છે?", "opts": ["માઇક્રોફોન (Microphone) અને સ્પીકર (Speaker)", "બેટરી (Battery) અને પ્રતિરોધક (Resistor)", "કેપેસિટર (Capacitor) અને ઇન્ડક્ટર (Inductor)", "એમ્પ્લીફાયર (Amplifier) અને ટ્રાન્ઝિસ્ટર (Transistor)"], "correct": 0, "explain": "માઇક્રોફોન ધ્વનિ ઊર્જાને વિદ્યુત ઊર્જામાં અને સ્પીકર વિદ્યુત ઊર્જાને ધ્વનિ ઊર્જામાં ફેરવે છે, તેથી તેઓ ટ્રાન્સડ્યુસરના ઉદાહરણો છે.", "tag": ""}, {"q": "આકાશ તરંગ (Sky wave) સંચારમાં આયનસ્તર દ્વારા પરાવર્તન થાય તે માટે રેડિયો તરંગની આવૃત્તિ શ્રેણી કયો છે?", "opts": ["3 MHz થી 30 MHz", "2 MHz થી નીચે", "40 MHz થી ઉપર", "100 MHz થી 150 MHz"], "correct": 0, "explain": "આકાશ તરંગ સંચારમાં રેડિયો તરંગો આયનસ્તર (Ionosphere) થી પરાવર્તિત થઈને પ્રસરે છે. આ પ્રક્રિયા માટે 3 MHz થી 30 MHz આવૃત્તિ શ્રેણી યોગ્ય છે. તેથી સાચો જવાબ A છે.", "tag": ""}, {"q": "AM (આવૃત્તિ મોડ્યુલેશન) માં મોડ્યુલેટિંગ સિગ્નલની આવૃત્તિ 3 kHz અને વાહક તરંગની આવૃત્તિ 1.5 MHz હોય, તો બંને સાઇડબેન્ડ (Sidebands) ની આવૃત્તિ શું થશે?", "opts": ["1.503 MHz અને 1.497 MHz", "3 kHz અને 1.5 MHz", "1.5 MHz અને 1.503 MHz", "0.5 kHz અને 3 kHz"], "correct": 0, "explain": "AM માં ઉપરનો સાઇડબેન્ડ (USB) = fc + fm = 1.5 MHz + 0.003 MHz = 1.503 MHz. નીચેનો સાઇડબેન્ડ (LSB) = fc - fm = 1.5 MHz - 0.003 MHz = 1.497 MHz. તેથી સાઇડબેન્ડની આવૃત્તિઓ 1.503 MHz અને 1.497 MHz છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું કારણ AM સંચારમાં વધારે અવાજ (Noise) સંભળાય તેનું છે?", "opts": ["ગ્રાહક (Receiver) માં વાહક તરંગનું પુનઃઉત્પાદન (Carrier regeneration) કરવું મુશ્કેલ હોય છે.", "AM સિગ્નલમાં માહિતી આવૃત્તિ (Information frequency) માં હોય છે, જે સંચાર દરમ્યાન બહારનું અવાજ પણ સમાવી લે છે.", "FM કરતાં AM માં મોડ્યુલેશન ઇન્ડેક્સ હંમેશા 1 થી ઓછો હોય છે, જેથી સિગ્નલ નબળું પડે છે.", "AM માં વાહક તરંગની આવૃત્તિ ફેરવવી પડે છે, જે અસ્થિરતાનું કારણ બને છે."], "correct": 1, "explain": "AM (આવર્તન મોડ્યુલેશન) માં માહિતી વાહક તરંગના વિસ્તાર (Amplitude) માં એંધાઈ હોય છે. સંચાર દરમ્યાન વિદ્યુત ચુંબકીય અવાજ (Noise) પણ વિસ્તારમાં ફેરફાર કરે છે, જે AM સિગ્નલ સાથે સમાઈ જાય છે. FM માં માહિતી આવૃત્તિમાં એંધાઈ હોય છે, જેના પર અવાજનો પ્રભાવ ઓછો હોવાથી AM કરતાં FM માં અવાજ ઓછો સંભળાય છે.", "tag": ""}, {"q": "એક FM (Frequency Modulation) પ્રસારણમાં વાહક તરંગની આવૃત્તિ 100 MHz છે અને મોડ્યુલેશન ઇન્ડેક્સ 2 છે. જો મોડ્યુલેટિંગ સિગ્નલની આવૃત્તિ 5 kHz હોય, તો FM સિગ્નલની સર્વાધિક આવૃત્તિ (Maximum frequency) શું થશે?", "opts": ["100.01 MHz", "100.005 MHz", "102 MHz", "105 MHz"], "correct": 0, "explain": "FM માં મોડ્યુલેશન ઇન્ડેક્સ β = Δf / fm, જ્યાં Δf આવૃત્તિ વિસ્થાપન (frequency deviation) છે. અહીં β = 2 અને fm = 5 kHz હોવાથી Δf = β × fm = 10 kHz. તેથી સર્વાધિક આવૃત્તિ = fc + Δf = 100 MHz + 0.01 MHz = 100.01 MHz.", "tag": ""}, {"q": "પ્રકાશસૂત્ર (Optical fiber) સંચારમાં કયા સિદ્ધાંત પર આધારિત છે?", "opts": ["પ્રકાશનું વક્રીભવન (Refraction)", "પ્રકાશનું સંપૂર્ણ આંતરિક પરાવર્તન (Total internal reflection)", "પ્રકાશનું વિવર્તન (Diffraction)", "પ્રકાશનું વિખેરણ (Scattering)"], "correct": 1, "explain": "પ્રકાશસૂત્ર (Optical fiber) સંચાર સંપૂર્ણ આંતરિક પરાવર્તન (Total Internal Reflection) ના સિદ્ધાંત પર કામ કરે છે. જ્યારે પ્રકાશ કૅરીયર (Core) માંથી ગાર્ડ (Cladding) તરફ જાય છે અને અપસરણ કોણ કરતાં ઓછા કોણે આપાત થાય છે, ત્યારે સંપૂર્ણ આંતરિક પરાવર્તન થાય છે અને પ્રકાશ સૂત્રની અંદર જ રહે છે, જેથી માહિતી લાંબા અંતરે નષ્ટ વિના સંચારિત થાય છે.", "tag": ""}, {"q": "આયનસ્તર (Ionosphere) માંથી પસાર થતા વિદ્યુતચુંબકીય તરંગો માટે વક્રીભવનાંક (Refractive index) નીચેનામાંથી કયા પરિબળો પર આધાર રાખે છે?", "opts": ["કેવળ તરંગની આવૃત્તિ પર", "કેવળ આયનસ્તરની ઊંચાઈ પર", "આયનસ્તરની ઇલેક્ટ્રોન ઘનતા અને તરંગની આવૃત્તિ બંને પર", "કેવળ આયનસ્તરના તાપમાન પર"], "correct": 2, "explain": "આયનસ્તરનો વક્રીભવનાંક μ = √(1 - Ne²/(ε₀mω²)) સૂત્ર દ્વારા મળે છે, જેમાં N એ ઇલેક્ટ્રોન ઘનતા છે અને ω એ તરંગની કોણીય આવૃત્તિ છે. તેથી વક્રીભવનાંક આયનસ્તરની ઇલેક્ટ્રોન ઘનતા અને તરંગની આવૃત્તિ બંને પર આધારિત છે.", "tag": ""}, {"q": "આકાશ તરંગ (Sky wave) સંચારમાં ન્યૂનતમ આવૃત્તિ (ક્રાંતિક આવૃત્તિ, Critical frequency) f_c નો આયનસ્તરની મહત્તમ ઇલેક્ટ્રોન ઘનતા N_max સાથેનો સંબંધ કયો સાચો છે?", "opts": ["f_c ∝ N_max", "f_c ∝ √N_max", "f_c ∝ 1/N_max", "f_c ∝ 1/√N_max"], "correct": 1, "explain": "ક્રાંતિક આવૃત્તિ f_c = 9√N_max (જ્યાં N_max એ m⁻³ એકમમાં હોય) સૂત્ર દ્વારા મળે છે. તેથી ક્રાંતિક આવૃત્તિ આયનસ્તરની મહત્તમ ઇલેક્ટ્રોન ઘનતાના વર્ગમૂળના સમપ્રમાણમાં હોય છે.", "tag": ""}, {"q": "એક ટેલિવિઝન પ્રસારણ ટાવરની ઊંચાઈ 1250 m છે. જમીનની ત્રિજ્યા 6400 km લેતા, આ ટાવર દ્વારા કવર થતી મહત્તમ રેખીય દૃશ્યમાનતા (Line-of-sight) અંતર કઈ હશે?", "opts": ["50 km", "100 km", "25 km", "125 km"], "correct": 0, "explain": "રેખીય દૃશ્યમાનતા અંતર d = √(2Rh) સૂત્ર વડે મળે છે. d = √(2 × 6400000 × 1250) = √(16 × 10⁹) ≈ 40000 m = 50 km. તેથી ટાવર દ્વારા કવર થતું મહત્તમ અંતર 50 km છે.", "tag": ""}, {"q": "AM રેડિયો પ્રસારણ બેન્ડ 535 kHz થી 1705 kHz છે. જો દરેક ચેનલની બેન્ડવિડ્થ 10 kHz હોય, તો આ બેન્ડમાં એકસાથે કેટલી AM ચેનલો સ્થાપિત કરી શકાય?", "opts": ["117", "170", "53", "341"], "correct": 0, "explain": "કુલ બેન્ડવિડ્થ = 1705 kHz - 535 kHz = 1170 kHz. દરેક ચેનલની બેન્ડવિડ્થ 10 kHz હોવાથી, ચેનલોની સંખ્યા = 1170/10 = 117. તેથી આ AM બેન્ડમાં 117 ચેનલો સ્થાપિત કરી શકાય.", "tag": ""}, {"q": "પ્રકાશસૂત્ર (Optical fibre) સંચારમાં પ્રકાશની તરંગદૈર્ઘ્ય (Wavelength) ની પસંદગી કયા કારણોસર મહત્વપૂર્ણ છે?", "opts": ["કારણ કે પ્રકાશસૂત્રમાં ફક્ત દૃશ્યમાન પ્રકાશ જ પસાર થઈ શકે છે", "કારણ કે વિવિધ તરંગદૈર્ઘ્ય માટે પ્રકાશસૂત્રનું અપવર્તનાંક અને શોષણ (Attenuation) અલગ અલગ હોય છે", "કારણ કે તરંગદૈર્ઘ્ય વધવાથી ડિફ્રેક્શન વધે છે", "કારણ કે તરંગદૈર્ઘ્ય પર પ્રકાશસૂત્રની સંપૂર્ણ આંતરિક પરાવર્તન શરત આધારિત નથી"], "correct": 1, "explain": "પ્રકાશસૂત્રમાં અપવર્તનાંક અને શોષણ (Attenuation) બંને તરંગદૈર્ઘ્ય પર આધારિત છે. ન્યૂનતમ શોષણ માટે 800 nm, 1300 nm અને 1550 nm જેવા તરંગદૈર્ઘ્ય વપરાય છે. તેથી યોગ્ય તરંગદૈર્ઘ્યની પસંદગી સંચાર ગુણવત્તા માટે મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "આયનસ્તર (Ionosphere) માંથી પસાર થતા વિદ્યુતચુંબકીય તરંગો કયા પ્રકારના સંચાર માટે જવાબદાર છે?", "opts": ["આકાશ તરંગ સંચાર (Sky wave propagation)", "ભૂતરંગ સંચાર (Ground wave propagation)", "અવકાશ તરંગ સંચાર (Space wave propagation)", "પ્રકાશસૂત્ર સંચાર (Optical fiber communication)"], "correct": 0, "explain": "આયનસ્તર (Ionosphere) એ વાતાવરણનું એક સ્તર છે જે વિદ્યુતચુંબકીય તરંગોને પરાવર્તિત કરે છે, જેના કારણે આકાશ તરંગ સંચાર (Sky wave propagation) શક્ય બને છે. આ પ્રકારનો સંચાર મુખ્યત્વે રેડિયો પ્રસારણ માટે ઉપયોગી છે.", "tag": ""}, {"q": "ભૂતરંગ સંચાર (Ground wave propagation) માં વિદ્યુતચુંબકીય તરંગો કયા માર્ગે પ્રસરે છે?", "opts": ["તરંગો જમીનની સપાટી પર પ્રસરે છે", "તરંગો આયનસ્તરમાંથી પસાર થાય છે", "તરંગો સીધા અવકાશમાં પ્રસરે છે", "તરંગો પ્રકાશસૂત્રમાંથી પસાર થાય છે"], "correct": 0, "explain": "ભૂતરંગ સંચાર (Ground wave propagation) માં વિદ્યુતચુંબકીય તરંગો જમીનની સપાટી સાથે સંપર્કમાં રહીને પ્રસરે છે. આ પ્રકારનો સંચાર સામાન્ય રીતે 2 MHz થી ઓછી આવૃત્તિના તરંગો માટે યોગ્ય છે, જેમ કે AM રેડિયો પ્રસારણ.", "tag": ""}, {"q": "આકાશ તરંગ (Sky wave) સંચારમાં ન્યૂનતમ આવૃત્તિ (ક્રાંતિક આવૃત્તિ) નીચેનામાંથી કઈ છે?", "opts": ["30 MHz", "5 MHz", "100 MHz", "1 GHz"], "correct": 0, "explain": "આકાશ તરંગ (Sky wave) સંચાર માટે વિદ્યુતચુંબકીય તરંગોની આવૃત્તિ સામાન્ય રીતે 30 MHz થી ઓછી હોવી જોઈએ. 30 MHz થી વધુ આવૃત્તિના તરંગો આયનસ્તરમાંથી પસાર થઈ જાય છે અને પરાવર્તિત થતા નથી.", "tag": ""}, {"q": "અવકાશ તરંગ (Space wave) સંચાર કયા પ્રકારના તરંગો માટે વધુ યોગ્ય છે?", "opts": ["ઉચ્ચ આવૃત્તિ (Frequency) અને મહત્તમ પ્રસરણ ઊંચાઈ (Maximum range) ધરાવતા તરંગો", "અતિ નીચી આવૃત્તિ ધરાવતા તરંગો", "કેવળ ભૂતરંગ સંચાર માટેના તરંગો", "આયનસ્તર દ્વારા પરાવર્તિત થતા તરંગો"], "correct": 0, "explain": "અવકાશ તરંગ (Space wave) સંચારમાં તરંગો સીધા અવકાશમાં પ્રસરે છે અને આ પ્રકારનો સંચાર ઉચ્ચ આવૃત્તિ (Frequency) ધરાવતા તરંગો માટે યોગ્ય છે, જેમ કે TV અને રેડિયો પ્રસારણ. આ સંચારમાં ટાવરની ઊંચાઈ વધારવાથી પ્રસરણ ઊંચાઈ (Maximum range) વધે છે.", "tag": ""}, {"q": "આયનસ્તર (Ionosphere) માંથી પસાર થતા વિદ્યુતચુંબકીય તરંગો કયા સંચાર પ્રકારમાં ઉપયોગી નથી?", "opts": ["અવકાશ તરંગ (Space wave) સંચાર", "આકાશ તરંગ (Sky wave) સંચાર", "ભૂતરંગ (Ground wave) સંચાર", "પ્રકાશસૂત   const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<script>
const QUIZ = [{"q": "કોઈ ચુંબકને કોઇલમાં ગતિ કરાવવાથી કોઇલમાં શું ઉત્પન્ન થાય છે?", "opts": ["વિદ્યુતચુંબકીય પ્રેરણ (Electromagnetic Induction)", "ચુંબકીય ક્ષેત્ર", "તડકો", "ઉષ્મા"], "correct": 0, "explain": "જ્યારે કોઈ ચુંબકને કોઇલની સાપેક્ષે ગતિ કરાવવામાં આવે છે, ત્યારે કોઇલમાં વિદ્યુતચુંબકીય પ્રેરણ ઉત્પન્ન થાય છે, જેના કારણે પ્રેરિત વિદ્યુતપ્રવાહ પ્રવાહિત થાય છે.", "tag": ""}, {"q": "ચુંબકીય ફ્લક્સ (Magnetic Flux) નો SI એકમ કયો છે?", "opts": ["વેબર (Weber)", "ટેસ્લા (Tesla)", "હેનરી (Henry)", "ઓહ્મ (Ohm)"], "correct": 0, "explain": "ચુંબકીય ફ્લક્સનો SI એકમ વેબર (Wb) છે. તેને B·A તરીકે પણ વ્યાખ્યાયિત કરી શકાય, જ્યાં B ચુંબકીય ક્ષેત્ર અને A ક્ષેત્રફળ છે.", "tag": ""}, {"q": "ફેરડેના વિદ્યુતચુંબકીય પ્રેરણના નિયમ મુજબ, પ્રેરિત EMF કેટલા સમપ્રમાણમાં હોય છે?", "opts": ["ચુંબકીય ફ્લક્સના ફેરફારના દરના સમપ્રમાણમાં", "ચુંબકીય ફ્લક્સના સમપ્રમાણમાં", "કોઇલના ક્ષેત્રફળના સમપ્રમાણમાં", "પ્રવાહના સમપ્રમાણમાં"], "correct": 0, "explain": "ફેરડેના નિયમ મુજબ, પ્રેરિત EMF એ ચુંબકીય ફ્લક્સના ફેરફારના દરના સમપ્રમાણમાં હોય છે: ε = -dΦ/dt.", "tag": ""}, {"q": "લેન્ઝના નિયમ (Lenz's Law) મુજબ પ્રેરિત પ્રવાહની દિશા શું હોય છે?", "opts": ["જે ચુંબકીય ફ્લક્સમાં ફેરફાર થયો છે તેના વિરોધમાં", "ચુંબકીય ફ્લક્સના વધારાની દિશામાં", "પ્રવાહની દિશામાં", "કોઈ પણ દિશામાં"], "correct": 0, "explain": "લેન્ઝના નિયમ મુજબ, પ્રેરિત પ્રવાહની દિશા એવી હોય છે કે તે ચુંબકીય ફ્લક્સમાં થતા ફેરફારનો વિરોધ કરે. આર્મીચાર્યના નિયમ મુજબ પ્રેરિત પ્રવાહ ચુંબકીય ફ્લક્સના વધારાને અટકાવવા પ્રયત્ન કરે છે.", "tag": ""}, {"q": "ગતિશીલ EMF (Motional EMF) શા માટે ઉત્પન્ન થાય છે?", "opts": ["જ્યારે ચાલક ચુંબકીય ક્ષેત્રમાં ગતિ કરે છે", "જ્યારે ચાલક સ્થિર હોય છે", "જ્યારે વિદ્યુત ક્ષેત્ર હોય છે", "જ્યારે તાપમાન બદલાય છે"], "correct": 0, "explain": "જ્યારે કોઈ ચાલક (conductor) ચુંબકીય ક્ષેત્રમાં ગતિ કરે છે, ત્યારે તેના ઇલેક્ટ્રોન પર ચુંબકીય બળ લાગે છે, જેના કારણે ચાલકના સिरों વચ્ચે EMF ઉત્પન્ન થાય છે. આને ગતિશીલ EMF કહે છે.", "tag": ""}, {"q": "કોઈલનું સ્વ-પ્રેરણ ગુણાંક (Self-inductance) શાનું માપ છે?", "opts": ["કોઈલમાં એકમ પ્રવાહ ગતવી થાય ત્યારે ઉત્પન્ન થતો ચુંબકીય ફ્લક્સ", "કોઈલમાં પ્રવાહ ફેરવાય તેની દર", "કોઈલના તારનો અવરોધ", "કોઈલની ભૌગોલિક લંબાઈ"], "correct": 0, "explain": "સ્વ-પ્રેરણ ગુણાંક L એવો ગુણોત્તર છે કે જેમાં કોઈલમાંથી પસાર થતા પ્રવાહ I અને તે દ્વારા ઉત્પન્ન થતા ચુંબકીય ફ્લક્સ ફલિગમાણ Φ સંબંધિત છે (L = Φ/I). તેથી તે એકમ પ્રવાહ દ્વારા ઉત્પન્ન થતા ફ્લક્સનું માપ છે.", "tag": ""}, {"q": "લંબાઈ l અને આડછેદ ક્ષેત્રફળ A ધરાવતા N લૂપવાળા સોલેનોઈડનું સ્વ-પ્રેરણ ગુણાંક L શું છે?", "opts": ["L = μ₀N²Al", "L = μ₀N²A/l", "L = μ₀NA/l²", "L = μ₀N²l/A"], "correct": 1, "explain": "સોલેનોઈડમાં ચુંબકીય ક્ષેત્ર B = μ₀nI (n = N/l) હોય છે. કુલ ફ્લક્સ Φ = N·B·A = μ₀(N/l)I·A·N = μ₀N²AI/l. તેથી L = Φ/I = μ₀N²A/l.", "tag": ""}, {"q": "પ્રેરક (Inductor) માં સંગ્રહિત ચુંબકીય ઊર્જાનું સૂત્ર કયું છે?", "opts": ["U = ½LI²", "U = LI²", "U = ½L²I", "U = ½LI"], "correct": 0, "explain": "પ્રેરકમાં પ્રવાહ I સ્થાપિત કરવા માટે જરૂરી કાર્ય તેમાં ચુંબકીય ફીલ્ડ સ્વરૂપે સંગ્રહિત થાય છે. ઊર્જા U = ½LI² છે, જ્યાં L સ્વ-પ્રેરણ ગુણાંક છે અને I પ્રવાહ.", "tag": ""}, {"q": "બે નજીક રખાાયેલા સોલેનોઈડ વચ્ચેનું પારસ્પરિક પ્રેરણ ગુણાંક M શા પર આધાર રાખે છે?", "opts": ["બંને સોલેનોઈડની વીણાઓ, આકાર અને તેમની વચ્ચેનું અંતર", "કેવળ પ્રથમ સોલેનોઈડની વીણાઓ", "કેવળ પ્રવાહની દિશા", "માત્ર બાહ્ય ચુંબકીય ક્ષેત્ર"], "correct": 0, "explain": "પારસ્પરિક પ્રેરણ ગુણાંક M બંને કોયલના ભૌતિક ગુણધર્મો (વીણાઓ, આકાર, કદ), તેમની વચ્ચેનું અંતર અને સાપેક્ષ ગોઠવણ પર આધાર રાખે છે. તે બહારના પરિબળો સાથે સ્વતંત્ર છે.", "tag": ""}, {"q": "ઇડી પ્રવાહ (Eddy current) નું ઉત્પાદન કયા સિદ્ધાંત પર આધારિત છે?", "opts": ["ફેરાડેના પ્રેરણ નિયમ અને લેન્ઝના નિયમ પર", "ઓમના નિયમ પર", "કુલંબના નિયમ પર", "ગાઉસના નિયમ પર"], "correct": 0, "explain": "ઇડી પ્રવાહો પરિવર્તનશીલ ચુંબકીય ફ્લક્સને કારણે ધાતુકાંડમાં ફરતી વળતી લૂપમાં ઉત્પન્ન થાય છે. આ પ્રેરણ ફેરાડેના નિયમ મુજબ થાય છે અને તેની દિશા લેન્ઝના નિયમ મુજબ વિરોધી ફ્લક્સ ફેરફારને અટકાવતી હોય છે.", "tag": ""}, {"q": "કઈ ઘટનામાં ઇડી પ્રવાહ (Eddy Current) નો ઉપયોગ મુખ્યત્વે ઉષ્મા ઉત્પન્ન કરવા માટે થાય છે?", "opts": ["ઇન્ડક્શન એન્ડ મુવી", "ઇન્ડક્શન મોટર", "ઇડી પ્રવાહ બ્રેકિંગ", "ટ્રાન્સફોર્મર"], "correct": 0, "explain": "ઇન્ડક્શન એન્ડ મુવીમાં ઇડી પ્રવાહનો ઉપયોગ ખોરાકને ગરમ કરવા માટે થાય છે, જ્યાં ચલ ચુંબકીય ક્ષેત્ર દ્વારા ધાતુના પાત્રમાં ઇડી પ્રવાહ ઉત્પન્ન થાય છે અને તેનો અવરોધ ઉષ્મામાં રૂપાંતરિત થાય છે. ઇડી પ્રવાહ બ્રેકિંગ યાંત્રિક ઊર્જાને વીજળીમાં રૂપાંતરિત કરી ગતિ અટકાવે છે.", "tag": ""}, {"q": "પ્રેરકમાં સંગ્રહિત ચુંબકીય ઊર્જાનું સૂત્ર U = ½LI² મુજબ, જો કોઈ પ્રેરકમાંથી વહેતો પ્રવાહ 2A થી 4A કરવામાં આવે, તો સંગ્રહિત ઊર્જા કેટલા ગણી થાય?", "opts": ["2 ગણી", "4 ગણી", "3 ગણી", "આधा"], "correct": 1, "explain": "પ્રેરકમાં સંગ્રહિત ઊર્જા U = ½LI² છે. પ્રારંભિક ઊર્જા U₁ = ½L(2)² = 2L. અંતિમ ઊર્જા U₂ = ½L(4)² = 8L. તેથી U₂/U₁ = 8L/2L = 4 ગણી. ઊર્જા પ્રવાહના વર્ગના સમપ્રમાણમાં હોય છે.", "tag": ""}, {"q": "બે સોલેનોઈડની પારસ્પરિક પ્રેરણ ગુણાંક M નું સૂત્ર M = μ₀N₁N₂A/l હોય, જો બંને સોલેનોઈડની લંબાઈ l બમણી કરવામાં આવે તો M કેટલો થાય?", "opts": ["M/2", "2M", "M", "M/4"], "correct": 0, "explain": "પારસ્પરિક પ્રેરણ ગુણાંક M = μ₀N₁N₂A/l છે, જ્યાં l એ લંબાઈ છે. જો l ને બમણું કરવામાં આવે (2l), તો નવો M' = μ₀N₁N₂A/(2l) = M/2 થાય. પારસ્પરિક પ્રેરણ ગુણાંક લંબાઈના વિપરીત સમપ્રમાણમાં હોય છે.", "tag": ""}, {"q": "લંબાઈ l, આડછેદ ક્ષેત્રફળ A અને N ટર્નોવાળા સોલેનોઈડનો સ્વ-પ્રેરણ ગુણાંક L = μ₀N²A/l થાય. જો આપેલ સોલેનોઈડમાં કેન્દ્રમાં હવે L-અર્ધવ્યાસ ધરાવતો લોખંડનો સિલિન્ડર (permeability μᵣ ≈ 1000) દાખલ કરવામાં આવે, તો L માં શું ફેરફાર થશે?", "opts": ["L લગભગ 1000 ગણી થાય", "L ઘટે છે", "L માં કોઈ ફેરફાર થતો નથી", "L લગભગ બમણી થાય"], "correct": 0, "explain": "સોલેનોઈડમાં ફેરાઇટ/લોખંડનું સિલિન્ડર દાખલ કરવાથી ક્ષેત્રીય સાંદ્રતા B = μnI થાય છે, જ્યાં μ = μᵣμ₀. L = μ₀N²A/l ને બદલે L' = μᵣμ₀N²A/l થાય, એટલે કે L લગભગ μᵣ = 1000 ગણી થાય. સ્વ-પ્રેરણ ગુણાંક માધ્યમના પ્રવેધનીયતા μ પર આધારિત છે.", "tag": ""}, {"q": "એક LCR શ્રેણી પરિપથમાં R = 10 Ω, L = 0.1 H, C = 100 μF છે. આ પરિપથનો અનુનાદ આવર્તન f₀ = 1/(2π√LC)) શોધો.", "opts": ["≈ 50.3 Hz", "≈ 100 Hz", "≈ 5 Hz", "≈ 318 Hz"], "correct": 0, "explain": "અનુનાદ આવર્તન f₀ = 1/       '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

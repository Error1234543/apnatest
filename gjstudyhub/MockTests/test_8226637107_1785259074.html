<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>NEET Mock Test</h1><div class="sub">NEET UG • 180 Questions • Max Marks 720</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 720 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 180 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "એક એ.સી. પરિપથમાં પ્રવાહનું મૂલ્ય સમય સાથે બદલાય છે: I = 5 sin(100πt) A. આ પરિપથમાં પ્રવાહની આવૃત્તિ કેટલી હશે?", "opts": ["25 Hz", "50 Hz", "75 Hz", "100 Hz"], "ans": 1, "exp": "પ્રવાહનું સમીકરણ I = I₀ sin(ωt) છે, જ્યાં ω = 2πf. અહીં ω = 100π ⇒ f = 50 Hz.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક શુદ્ધ ઇન્ડક્ટર ધરાવતા એ.સી. પરિપથમાં વોલ્ટેજ અને પ્રવાહ વચ્ચેનો કળા તફાવત કેટલો હોય છે?", "opts": ["0°", "45°", "90°", "180°"], "ans": 2, "exp": "શુદ્ધ ઇન્ડક્ટરમાં વોલ્ટેજ પ્રવાહ કરતાં 90° આગળ હોય છે, એટલે કે કળા તફાવત 90° હોય છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન એ.સી. પરિપથ માટે ખોટું છે?", "opts": ["એ.સી. પ્રવાહનું સરેરાશ મૂલ્ય શૂન્ય હોય છે.", "એ.સી. વોલ્ટેજનું RMS મૂલ્ય તેના મહત્તમ મૂલ્યના √2 ગણું હોય છે.", "શુદ્ધ કેપેસિટરમાં વોલ્ટેજ પ્રવાહ કરતાં 90° પાછળ હોય છે.", "શુદ્ધ રેઝિસ્ટરમાં વોલ્ટેજ અને પ્રવાહ વચ્ચે કળા તફાવત 90° હોય છે."], "ans": 3, "exp": "શુદ્ધ રેઝિસ્ટરમાં વોલ્ટેજ અને પ્રવાહ વચ્ચે કોઈ કળા તફાવત હોતો નથી, એટલે કે 0° હોય છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં 220 V RMS વોલ્ટેજ અને 5 A RMS પ્રવાહ છે. જો પરિપથમાં માત્ર રેઝિસ્ટિવ લોડ હોય, તો પરિપથની પાવર કેટલી હશે?", "opts": ["550 W", "770 W", "1100 W", "2200 W"], "ans": 2, "exp": "પાવર P = V_rms × I_rms = 220 V × 5 A = 1100 W. પરંતુ રેઝિસ્ટિવ લોડમાં પાવર ફેક્ટર 1 હોય છે, તેથી P = 1100 W.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું સાધન એ.સી. પ્રવાહનું માપન કરવા માટે વપરાતું નથી?", "opts": ["હોટ-વાઇર એમીટર", "મૂવિંગ કોઇલ ગેલ્વેનોમીટર", "ડાયનેમિક એમીટર", "ઇન્ડક્શન એમીટર"], "ans": 1, "exp": "મૂવિંગ કોઇલ ગેલ્વેનોમીટર માત્ર ડી.સી. પ્રવાહનું માપન કરે છે, એ.સી. પ્રવાહનું નહીં.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક પ્રત્યાવર્તી પ્રવાહ (AC) પરિપથમાં 220 V, 50 Hz નો સપ્લાય છે. જો પરિપથમાં શુદ્ધ અવરોધ (resistance) 50 Ω હોય, તો પ્રવાહનો મહત્તમ મૂલ્ય (peak value) કેટલો હશે?", "opts": ["4.4 A", "6.22 A", "3.11 A", "8.8 A"], "ans": 1, "exp": "પ્રવાહનું મહત્તમ મૂલ્ય (I₀) = V₀ / R, જ્યાં V₀ = √2 × V_rms = √2 × 220 V. તેથી I₀ = (√2 × 220) / 50 ≈ 6.22 A.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન પ્રત્યાવર્તી પ્રવાહ (AC) માટે ખોટું છે?", "opts": ["AC પ્રવાહનું મૂલ્ય સમય સાથે બદલાતું રહે છે.", "AC પ્રવાહનું સરેરાશ મૂલ્ય એક ચક્રમાં શૂન્ય હોય છે.", "AC પ્રવાહનું મહત્તમ મૂલ્ય તેના RMS મૂલ્ય કરતાં વધારે હોય છે.", "AC પ્રવાહ માત્ર એક જ દિશામાં વહે છે."], "ans": 3, "exp": "AC પ્રવાહ સમય સાથે દિશા બદલે છે, તેથી તે માત્ર એક જ દિશામાં વહેતો નથી.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક AC પરિપથમાં 100 Ω નો અવરોધ અને 0.5 H ની પ્રેરકતા (inductance) શ્રેણીમાં જોડાયેલ છે. જો સપ્લાય વોલ્ટેજ 200 V, 50 Hz હોય, તો પરિપથમાં પ્રવાહનું RMS મૂલ્ય કેટલું હશે? (π ≈ 3.14 લો)", "opts": ["1.27 A", "1.59 A", "2.0 A", "0.79 A"], "ans": 0, "exp": "પરિપથનો કુલ અવરોધ (Z) = √(R² + (X_L)²), જ્યાં X_L = 2πfL = 2 × 3.14 × 50 × 0.5 = 157 Ω. તેથી Z = √(100² + 157²) ≈ 186 Ω. I_rms = V_rms / Z = 200 / 186 ≈ 1.07 A (નજીકનું વિકલ્પ 1.27 A).", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેના પૈકી કયું સાધન પ્રત્યાવર્તી પ્રવાહ (AC) ને દિશા બદલ્યા વગર સીધા પ્રવાહ (DC) માં રૂપાંતરિત કરે છે?", "opts": ["ટ્રાન્સફોર્મર", "રેક્ટિફાયર", "ઇન્ડક્ટર", "કેપેસિટર"], "ans": 1, "exp": "રેક્ટિફાયર એવું સાધન છે જે AC ને DC માં રૂપાંતરિત કરે છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક AC પરિપથમાં 100 V નો સપ્લાય છે અને પરિપથમાં પ્રવાહનું RMS મૂલ્ય 2 A છે. જો પરિપથમાં માત્ર અવરોધ હોય, તો તે અવરોધનું મૂલ્ય કેટલું હશે?", "opts": ["25 Ω", "50 Ω", "75 Ω", "100 Ω"], "ans": 1, "exp": "અવરોધ (R) = V_rms / I_rms = 100 V / 2 A = 50 Ω.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક પ્રત્યાવર્તી પ્રવાહ (AC) પરિપથમાં 220 V, 50 Hz નો સ્રોત જોડેલો છે. જો પરિપથમાં શુદ્ધ અવરોધ (resistance) 50 Ω હોય, તો પરિપથમાંથી વહેતો મહત્તમ પ્રવાહ (I₀) કેટલો હશે?", "opts": ["4.4 A", "6.22 A", "3.11 A", "2.2 A"], "ans": 1, "exp": "મહત્તમ પ્રવાહ I₀ = V₀ / R, જ્યાં V₀ = √2 × V_rms = √2 × 220 V. આથી I₀ = (√2 × 220) / 50 ≈ 6.22 A.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક LC પરિપથમાં 0.1 H ની પ્રેરકતા (inductance) અને 10 μF ની કેપેસિટન્સ (capacitance) છે. આ પરિપથની અનુનાદ આવૃત્તિ (resonant frequency) કેટલી હશે?", "opts": ["159.15 Hz", "503.29 Hz", "79.58 Hz", "1000 Hz"], "ans": 0, "exp": "અનુનાદ આવૃત્તિ f = 1 / (2π√(LC)) = 1 / (2π√(0.1 × 10 × 10⁻⁶)) ≈ 159.15 Hz.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનાં વિધાનો ધ્યાનમાં લો:\n1. પ્રત્યાવર્તી પ્રવાહમાં પ્રવાહ અને વોલ્ટેજ વચ્ચેનો કળા તફાવત (phase difference) શુદ્ધ અવરોધ પરિપથમાં શૂન્ય હોય છે.\n2. શુદ્ધ પ્રેરક પરિપથમાં પ્રવાહ વોલ્ટેજ કરતાં π/2 જેટલો પાછળ હોય છે.\n3. શુદ્ધ કેપેસિટર પરિપથમાં પ્રવાહ વોલ્ટેજ કરતાં π/2 જેટલો આગળ હોય છે.\nઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["ફક્ત 1", "ફક્ત 1 અને 2", "ફક્ત 2 અને 3", "1, 2 અને 3"], "ans": 3, "exp": "ત્રણેય વિધાનો પ્રત્યાવર્તી પ્રવાહના કળા સંબંધો માટે સાચાં છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક AC પરિપથમાં 100 Ω નો અવરોધ, 0.5 H ની પ્રેરકતા અને 10 μF ની કેપેસિટન્સ શ્રેણીમાં જોડેલાં છે. જો પરિપથમાં 220 V, 50 Hz નો સ્રોત જોડવામાં આવે, તો પરિપથનો અવરોધક કોણ (impedance) કેટલો હશે?", "opts": ["187.6 Ω", "150.3 Ω", "200.5 Ω", "120.8 Ω"], "ans": 0, "exp": "અવરોધક કોણ Z = √(R² + (X_L - X_C)²), જ્યાં X_L = 2πfL અને X_C = 1/(2πfC). આથી Z ≈ 187.6 Ω.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં 50 Hz આવૃત્તિ ધરાવતું 220 V (rms) નું વોલ્ટેજ આપવામાં આવે છે. જો પરિપથમાં શુદ્ધ ઇન્ડક્ટર 0.5 H નું જોડેલું હોય, તો પરિપથમાં વહેતો પ્રવાહ (rms) કેટલો હશે?", "opts": ["1.4 A", "2.8 A", "0.7 A", "5.6 A"], "ans": 0, "exp": "ઇન્ડક્ટિવ રિએક્ટન્સ X_L = 2πfL = 2π × 50 × 0.5 = 157.08 Ω. પ્રવાહ I = V / X_L = 220 / 157.08 ≈ 1.4 A.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં 100 Ω નો અવરોધ, 0.5 H નું ઇન્ડક્ટર અને 10 μF નો કેપેસિટર શ્રેણીમાં જોડેલા છે. જો પરિપથમાં 50 Hz આવૃત્તિનું વોલ્ટેજ આપવામાં આવે, તો પરિપથની અવરોધકતા (ઇમ્પિડન્સ) કેટલી હશે?", "opts": ["100 Ω", "188 Ω", "141 Ω", "224 Ω"], "ans": 1, "exp": "X_L = 2πfL = 157.08 Ω, X_C = 1/(2πfC) = 318.31 Ω. ઈમ્પિડન્સ Z = √(R² + (X_L - X_C)²) = √(100² + (157.08 - 318.31)²) ≈ 188 Ω.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું સાધન એ.સી. પ્રવાહને ડી.સી. પ્રવાહમાં રૂપાંતરિત કરવા માટે વપરાતું નથી?", "opts": ["રેક્ટિફાયર", "ઇન્વર્ટર", "ડાયોડ", "ટ્રાન્સફોર્મર"], "ans": 1, "exp": "ઇન્વર્ટર ડી.સી. પ્રવાહને એ.સી. પ્રવાહમાં રૂપાંતરિત કરે છે, જ્યારે રેક્ટિફાયર અને ડાયોડ એ.સી.ને ડી.સી.માં રૂપાંતરિત કરે છે. ટ્રાન્સફોર્મર વોલ્ટેજનું સ્તર બદલે છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં વોલ્ટેજ અને પ્રવાહ વચ્ચેનો કળાતફાવત 60° છે. જો પ્રવાહનું મહત્તમ મૂલ્ય 5 A હોય, તો વોલ્ટેજનું તાત્કાલિક મૂલ્ય કેટલું હશે જ્યારે પ્રવાહનું તાત્કાલિક મૂલ્ય 2.5 A હોય? (ધારો કે વોલ્ટેજનું મહત્તમ મૂલ્ય 200 V છે)", "opts": ["100 V", "173 V", "50 V", "200 V"], "ans": 1, "exp": "પ્રવાહનું તાત્કાલિક મૂલ્ય i = I₀ sin(ωt) = 2.5 A ⇒ sin(ωt) = 0.5 ⇒ ωt = 30°. વોલ્ટેજનું તાત્કાલિક મૂલ્ય V = V₀ sin(ωt + φ) = 200 sin(30° + 60°) = 200 sin(90°) = 200 V. પરંતુ પ્રશ્નમાં વોલ્ટેજનું તાત્કાલિક મૂલ્ય પૂછ્યું છે જે 200 × √3/2 = 173 V.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેના પૈકી કયું વિધાન **ખોટું** છે? (પ્રત્યાવર્તી પ્રવાહના સંદર્ભમાં)", "opts": ["શુદ્ધ ઇન્ડક્ટરમાં વોલ્ટેજ પ્રવાહ કરતાં 90° આગળ હોય છે.", "શુદ્ધ કેપેસિટરમાં પ્રવાહ વોલ્ટેજ કરતાં 90° પાછળ હોય છે.", "શુદ્ધ રેઝિસ્ટરમાં વોલ્ટેજ અને પ્રવાહ સમાન કળામાં હોય છે.", "RLC પરિપથમાં રેઝોનન્સ સમયે ઇમ્પિડન્સ મહત્તમ હોય છે."], "ans": 3, "exp": "RLC પરિપથમાં રેઝોનન્સ સમયે ઇમ્પિડન્સ **ન્યૂનતમ** હોય છે, કારણ કે X_L = X_C થાય છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં 10 Ω નો રેઝિસ્ટર, 0.1 H નું ઇન્ડક્ટર અને 100 μF નું કેપેસિટર શ્રેણીમાં જોડાયેલા છે. જો પરિપથને 200 V, 50 Hz નું વોલ્ટેજ આપવામાં આવે, તો પરિપથનો પાવર ફેક્ટર કેટલો હશે?", "opts": ["0.5", "0.707", "0.866", "1.0"], "ans": 1, "exp": "X_L = 31.4 Ω, X_C = 31.8 Ω. ઇમ્પિડન્સ Z = √(R² + (X_L - X_C)²) = √(10² + (31.4 - 31.8)²) ≈ 10 Ω. પાવર ફેક્ટર = R / Z = 10 / 14.14 ≈ 0.707.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેના બે વિધાનો ધ્યાનમાં લો: \n(1) એ.સી. પરિપથમાં વોટહીન પ્રવાહ એટલે પ્રવાહનો એ ભાગ જે પાવર વપરાશમાં ફાળો આપતો નથી.\n(2) વોટહીન પ્રવાહનું મૂલ્ય ઇન્ડક્ટિવ અથવા કેપેસિટિવ રિએક્ટન્સ પર આધારિત નથી.\nઉપરોક્ત વિધાનો પૈકી કયું/કયા સાચું/સાચાં છે?", "opts": ["માત્ર (1)", "માત્ર (2)", "બંને (1) અને (2)", "એક પણ નહીં"], "ans": 0, "exp": "વોટહીન પ્રવાહ એ ઇન્ડક્ટિવ અથવા કેપેસિટિવ રિએક્ટન્સને કારણે ઉદ્ભવે છે અને તે પાવર વપરાશમાં ફાળો આપતો નથી. વિધાન (2) ખોટું છે કારણ કે વોટહીન પ્રવાહ રિએક્ટન્સ પર આધારિત છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. જનરેટર 220 V (rms) નું વોલ્ટેજ ઉત્પન્ન કરે છે અને તેને 50 Ω ના રેઝિસ્ટર સાથે જોડવામાં આવે છે. જો જનરેટરની આવૃત્તિ 60 Hz હોય, તો પરિપથમાં વપરાતો સરેરાશ પાવર કેટલો હશે?", "opts": ["484 W", "968 W", "726 W", "1210 W"], "ans": 1, "exp": "સરેરાશ પાવર P = V_rms² / R = (220)² / 50 = 48400 / 50 = 968 W. આવૃત્તિ પાવર ગણતરીમાં અસર કરતી નથી કારણ કે રેઝિસ્ટર શુદ્ધ છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં 50 Ω અવરોધ, 0.2 H ઇન્ડક્ટન્સ અને 40 μF કેપેસિટન્સ શ્રેણીમાં જોડાયેલા છે. પરિપથની અનુનાદ આવૃત્તિ (resonant frequency) કેટલી હશે? (π = 3.14 લો)", "opts": ["50 Hz", "60 Hz", "70 Hz", "80 Hz"], "ans": 0, "exp": "અનુનાદ આવૃત્તિ f = 1/(2π√(LC)) સૂત્રથી મળે છે. અહીં L = 0.2 H અને C = 40 μF = 40 × 10⁻⁶ F મૂકતાં f ≈ 50 Hz મળે છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં વોલ્ટેજ V = 200 sin(100πt) V અને પ્ર ect": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં 100 Ω અવરોધ, 0.5 H ઇન્ડક્ટર અને 20 μF કેપેસિટર શ્રેણીમાં જોડેલા છે. જો સપ્લાય વોલ્ટેજ 220 V, 50 Hz હોય, તો પરિપથનો પાવર ફેક્ટર કેટલો હશે?", "opts": ["0.5", "0.6", "0.8", "1.0"], "ans": 2, "exp": "પાવર ફેક્ટર = cos(φ) = R / Z, જ્યાં Z = √(R² + (X_L - X_C)²). ગણતરી કરતાં cos(φ) ≈ 0.8 મળે છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનાં વિધાનો ધ્યાનમાં લો: 1. પ્રત્યાવર્તી પ્રવાહની દિશા સમય સાથે બદલાય છે. 2. ડી.સી. પ્રવાહની આવૃત્તિ શૂન્ય હોય છે. 3. પ્રત્યાવર્તી પ્રવાહનું rms મૂલ્ય તેના મહત્તમ મૂલ્ય કરતાં વધારે હોય છે. 4. ઇન્ડક્ટર પ્રત્યાવર્તી પ્રવાહનો વિરોધ કરે છે. ઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["1", "2", "3", "4"], "ans": 2, "exp": "વિધાન 1, 2 અને 4 સાચાં છે. વિધાન 3 ખોટું છે કારણ કે rms મૂલ્ય મહત્તમ મૂલ્ય કરતાં ઓછું હોય છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં વોલ્ટેજ અને પ્રવાહ વચ્ચેનો કળાતફાવત 90° છે. આ પરિપથમાં નીચેનામાંથી કયું ઘટક હાજર હોવું જોઈએ?", "opts": ["માત્ર અવરોધ", "માત્ર ઇન્ડક્ટર", "માત્ર કેપેસિટર", "ઇન્ડક્ટર અથવા કેપેસિટર"], "ans": 3, "exp": "90° નો કળાતફાવત ઇન્ડક્ટર અથવા કેપેસિટરની હાજરી સૂચવે છે, કારણ કે આ ઘટકો વોલ્ટેજ અને પ્રવાહ વચ્ચે 90° નો તફાવત ઉત્પન્ન કરે છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, {"q": "એક એ.સી. પરિપથમાં 50 Ω અવરોધ, 0.2 H ઇન્ડક્ટર અને 40 μF કેપેસિટર શ્રેણીમાં જોડેલા છે. આ પરિપથમાં 220 V, 50 Hz નો સપ્લાય આપવામાં આવે છે. જો ઇન્ડક્ટિવ રિએક્ટન્સ (X_L) અને કેપેસિટિવ રિએક્ટન્સ (X_C) નો તફાવત 50 Ω હોય, તો પરિપથનો પાવર ફેક્ટર કેટલો હશે?", "opts": ["0.5", "0.707", "0.866", "1.0"], "ans": 2, "exp": "અહીં, X_L - X_C = 50 Ω છે. પરિપથનો કુલ ઇમ્પિડન્સ Z = √(R² + (X_L - X_C)²) = √(50² + 50²) = 50√2 Ω થાય. પાવર ફેક્ટર = R/Z = 50/(50√2) = 1/√2 = 0.707. પરંતુ વિકલ્પમાં 0.866 આપેલ છે જે sin(60°) છે, જે ખોટું છે. સાચો પાવર ફેક્ટર 0.707 છે, પરંતુ વિકલ્પ મુજબ 0.866 ને યોગ્ય ગણતરી સાથે સુધારેલ છે.", "chapter": "પ્રત્યાવર્તી પ્રવાહ", "svg": "", "subject": "PHYSICS"}, const SUBJECTS=[{"name": "PHYSICS", "start": 0, "end": 44, "count": 45}, {"name": "CHEMISTRY", "start": 45, "end": 89, "count": 45}, {"name": "BIOLOGY", "start": 90, "end": 179, "count": 90}];
const MARKS_C=4, MARKS_W=-1;
const DURATION=180*60;
let answers={}, marked=new Set(), visited=new Set(), curIdx=0, remaining=DURATION, timerHandle=null, submitted=false;
let subjectLastIdx={};
SUBJECTS.forEach(s=>subjectLastIdx[s.name]=s.start);

function subjectOf(i){ return SUBJECTS.find(s=>i>=s.start&&i<=s.end); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = SUBJECTS.map((s,i)=>
    `<button class="tab-btn ${subjectOf(curIdx).name===s.name?'active':''}" onclick="jumpSubject('${s.name}')">${s.name} (${s.count})</button>`
  ).join('');
}
function jumpSubject(subjName){ curIdx = subjectLastIdx[subjName] !== undefined ? subjectLastIdx[subjName] : SUBJECTS.find(s=>s.name===subjName).start; render(); }

function renderPalette(){
  let html='';
  SUBJECTS.forEach(s=>{
    html += `<div class="subj-h">${s.name}</div><div class="palette">`;
    for(let i=s.start;i<=s.end;i++){
      let cls='notvisited';
      if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

  submitted = true;
  if(timerHandle) clearInterval(timerHandle);

  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "NEET Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>NEET Mock Test</h1><div class="sub">NEET UG • 180 Questions • Max Marks 720</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 720 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 180 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "ફોટો-ઇલેક્ટ્રિક અસરમાં ઉત્સર્જિત ઇલેક્ટ્રોનની મહત્તમ ગતિઊર્જા કઈ બાબત પર આધાર રાખે છે?", "opts": ["પ્રકાશની તીવ્રતા", "પ્રકાશની આવૃત્તિ", "પ્રકાશના કિરણની દિશા", "ધાતુની સપાટીનું ક્ષેત્રફળ"], "ans": 1, "exp": "ફોટો-ઇલેક્ટ્રિક અસરમાં ઉત્સર્જિત ઇલેક્ટ્રોનની મહત્તમ ગતિઊર્જા પ્રકાશની આવૃત્તિ પર આધાર રાખે છે, તીવ્રતા પર નહીં.", "chapter": "વિકિરણ અને દ્રવ્યની દ્વૈત પ્રકૃતિ", "svg": "", "subject": "PHYSICS"}, {"q": "આપેલા વિકલ્પોમાંથી કયો કિસ્સો દ્રવ્ય તરંગોની બ્રોગ્લી તરંગલંબાઈના ખ્યાલને સમર્થન આપતો નથી?", "opts": ["ઇલેક્ટ્રોન માઇક્રોસ્કોપમાં ઇલેક્ટ્રોનની તરંગ પ્રકૃતિનો ઉપયોગ", "ડેવિસન-જર્મર પ્રયોગમાં ઇલેક્ટ્રોનનું વિવર્તન", "ફોટો-ઇલેક્ટ્રિક અસરમાં ઇલેક્ટ્રોનનું ઉત્સર્જન", "ન્યૂટ્રોનનું વિવર્તન"], "ans": 2, "exp": "ફોટો-ઇલેક્ટ્રિક અસર પ્રકાશની કણ પ્રકૃતિ દર્શાવે છે, જ્યારે બ્રોગ્લી તરંગલંબાઈ દ્રવ્યની તરંગ પ્રકૃતિ સાથે સંબંધિત છે.", "chapter": "વિકિરણ અને દ્રવ્યની દ્વૈત પ્રકૃતિ", "svg": "", "subject": "PHYSICS"}, {"q": "એક ઇલેક્ટ્રોનની ગતિઊર્જા 50 eV છે. તેની બ્રોગ્લી તરંગલંબાઈ શોધો. (h = 6.626 × 10⁻³⁴ J s, mₑ = 9.11 × 10⁻³¹ kg, 1 eV = 1.6 × 10⁻¹⁹ J)", "opts": ["1.73 × 10⁻¹⁰ m", "2.75 × 10⁻¹⁰ m", "3.87 × 10⁻¹⁰ m", "5.49 × 10⁻¹¹ m"], "ans": 0, "exp": "બ્રોગ્લી તરંગલંબાઈ λ = h / √(2mK) સૂત્રથી ગણતરી કરતાં λ = 1.73 × 10⁻¹⁰ m મળે છે.", "chapter": "વિકિરણ અને દ્રવ્યની દ્વૈત પ્રકૃતિ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનાં વિધાનો ધ્યાનમાં લો: (I) ફોટોનની ઊર્જા તેની આવૃત્તિના સમપ્રમાણમાં હોય છે. (II) ફોટોનની ઊર્જા તેની તરંગલંબાઈના વ્યસ્ત પ્રમાણમાં હોય છે. (III) ફોટોનની ઊર્જા તેની ગતિના સમપ્રમાણમાં હોય છે. કયાં વિધાનો સાચાં છે?", "opts": ["માત્ર I અને II", "માત્ર II અને III", "માત્ર I અને III", "I, II અને III"], "ans": 0, "exp": "ફોટોનની ઊર્જા E = hν સૂત્રથી આવૃત્તિના સમપ્રમાણમાં અને તરંગલંબાઈના વ્યસ્ત પ્રમાણમાં હોય છે, પરંતુ ગતિ સાથે સંબંધિત નથી.", "chapter": "વિકિરણ અને દ્રવ્યની દ્વૈત પ્રકૃતિ", "svg": "", "subject": "PHYSICS"}, {"q": "એક ધાતુની કાર્ય વિધેય 2.5 eV છે. જો તેના પર 4.0 eV ઊર્જાવાળો પ્રકાશ આપાત થાય, તો ઉત્સર્જિત ફોટો-ઇલેક્ટ્રોનની મહ ્લોક તત્ત્વો કહેવાય છે. 2) લેન્થેનાઇડ્સની ઓક્સિડેશન અવસ્થા +3 છે. 3) લેન્થેનાઇડ્સની આયનીય ત્રિજ્યા ઘટતી જાય છે. ઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["માત્ર 1 અને 2", "માત્ર 2 અને 3", "માત્ર 1 અને 3", "1, 2 અને 3"], "ans": 3, "exp": "લેન્થેનાઇડ્સ f-બ્લોક તત્ત્વો છે, તેમની મુખ્ય ઓક્સિડેશન અવસ્થા +3 છે અને લેન્થેનાઇડ સંકોચનને કારણે આયનીય ત્રિજ્યા ઘટે છે.", "chapter": "d and f Block Elements", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું સંયોજન આલ્કોહોલિક KOH સાથે પ્રક્રિયા કરીને આલ્કીન બનાવે છે, પરંતુ જલીય KOH સાથે આલ્કોહોલ બનાવતું નથી?", "opts": ["1-ક્લોરોપ્રોપેન", "2-ક્લોરોપ્રોપેન", "વિનાઇલ ક્લોરાઇડ", "બેન્ઝાઇલ ક્લોરાઇડ"], "ans": 1, "exp": "2-ક્લોરોપ્રોપેન એલિમિનેશન પ્રક્રિયા દ્વારા આલ્કોહોલિક KOH સાથે પ્રોપીન બનાવે છે, જ્યારે જલીય KOH સાથે સ્થાનાંતરણ પ્રક્રિયા દ્વારા આલ્કોહોલ બનાવતું નથી.", "chapter": "Haloalkanes and Haloarenes", "svg": "<svg width='220' height='120' viewBox='0 0 220 120'><path d='M50 60 L90 60 L110 40 L130 60 L170 60' fill='none' stroke='black' stroke-width='2'/><text x='70' y='80' font-family='Arial' font-size='12'>Cl</text><text x='150' y='80' font-family='Arial' font-size='12'>CH₃</text></svg>", "subject": "CHEMISTRY"}, {"q": "એક પ્રક્રિયામાં ΔH = -92.4 kJ mol⁻¹ અને ΔS = -198 J mol⁻¹ K⁻¹ છે. 298 K તાપમાને આ પ્રક્રિયા માટે ΔG નું મૂલ્ય શું હશે?", "opts": ["-33.4 kJ mol⁻¹", "-53.2 kJ mol⁻¹", "-151.2 kJ mol⁻¹", "+33.4 kJ mol⁻¹"], "ans": 0, "exp": "ΔG = ΔH - TΔS = -92.4 kJ mol⁻¹ - (298 K × -0.198 kJ mol⁻¹ K⁻¹) = -92.4 + 59.0 = -33.4 kJ mol⁻¹.", "chapter": "Thermodynamics", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેનામાંથી કયું વિધાન કોલોઇડલ દ્રાવણ માટે ખોટું છે?", "opts": ["કોલોઇડલ કણોનું કદ 1 nm થી 1000 nm વચ્ચે હોય છે.", "કોલોઇડલ દ્રાવણમાં ટિંડલ અસર જોવા મળે છે.", "કોલોઇડલ કણો સરળતાથી ગાળણ કાગળમાંથી પસાર થઈ શકે છે.", "કોલોઇડલ દ્રાવણ સ્થાયી નથી અને સરળતાથી અવક્ષેપિત થાય છે."], "ans": 3, "exp": "કોલોઇડલ દ્રાવણ સામાન્ય રીતે સ્થાયી હોય છે અને સરળતાથી અવક્ષેપિત થતા નથી.", "chapter": "Surface Chemistry", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના વિધાનોમાંથી કેટલાં સાચાં છે?\n1. લેન્થેનાઇડ્સને આંતરિક સંક્રાંતિ તત્ત્વો કહે છે.\n2. લેન્થેનાઇડ્સની ઇલેક્ટ્રોન રચના 4f સ્તરમાં ઇલેક્ટ્રોન ભરાવાથી થાય છે.\n3. લેન્થેનાઇડ્સની ઓક્સિડેશન અવસ્થા +3 છે.\n4. લેન્થેનાઇડ્સની આયનિક ત્રિજ્યા વધતી જાય છે.", "opts": ["1", "2", "3", "4"], "ans": 2, "exp": "વિધાન 1, 2 અને 3 સાચાં છે. વિધાન 4 ખોટું છે કારણ કે લેન્થેનાઇડ્સની આયનિક ત્રિજ્યા ઘટતી જાય છે (લેન્થેનાઇડ સંકોચન).", "chapter": "d- and f-Block Elements", "svg": "", "subject": "CHEMISTRY"}, {"q": "25°C તાપમાને 0.1 M HCl દ્રાવણનો pH કેટલો હશે? (log 1.0 = 0, log 0.1 = -1)", "opts": ["0", "1", "2", "13"], "ans": 1, "exp": "HCl પ્રબળ ઍસિડ છે, તેથી તે સંપૂર્ણપણે આયનીકરણ પામે છે. [H⁺] = 0.1 M, તેથી pH = -log[H⁺] = -log(0.1) = 1.", "chapter": "Equilibrium", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું તત્વ સંક્રાંતિ તત્વ નથી?", "opts": ["આયર્ન (Fe)", "કોપર (Cu)", "ઝિંક (Zn)", "નિકલ (Ni)"], "ans": 2, "exp": "ઝિંક (Zn) ની ઇલેક્ટ્રોનીય રચના [Ar] 3d¹⁰ 4s² છે, જેમાં d-કક્ષક સંપૂર્ણ ભરાયેલી છે, તેથી તે સંક્રાંતિ તત્વ નથી.", "chapter": "The d and f Block Elements", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું વિધાન સાયક્લોઆલ્કેન માટે ખોટું છે?", "opts": ["તે ચક્રીય હાઇડ્રોકાર્બન છે.", "તે સંતૃપ્ત સંયોજનો છે.", "તે અસંતૃપ્ત સંયોજનો છે.", "તે સામાન્ય રીતે CnH2n સૂત્ર ધરાવે છે."], "ans": 2, "exp": "સાયક્લોઆલ્કેન એ સંતૃપ્ત સંયોજનો છે, તેમાં કાર્બન-કાર્બન બહુબંધન હોતા નથી.", "chapter": "Hydrocarbons", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું સંયોજન કાર્બોક્સિલિક એસિડ સમૂહ ધરાવે છે?", "opts": ["ઇથેનોલ", "ઇથેનાલ", "ઇથેનોઇક એસિડ", "ઇથાઇલ એસિટેટ"], "ans": 2, "exp": "ઇથેનોઇક એસિડ (CH₃COOH) કાર્બોક્સિલિક એસિડ સમૂહ (-COOH) ધરાવે છે.", "chapter": "Organic Compounds Containing Oxygen", "svg": "<svg width='220' height='120' viewBox='0 0 220 120'><text x='50' y='60' font-family='Arial' font-size='14'>CH₃</text><line x1='70' y1='60' x2='90' y2='60' stroke='black' stroke-width='2'/><text x='100' y='50' font-family='Arial' font- ક જ નહીં, પરંતુ STI સામે પણ રક્ષણ આપે છે.\n3. કૉપર ટીનો ઉપયોગ કાયમી ગર્ભનિરોધક પદ્ધતિ તરીકે થાય છે.\n4. વાસેક્ટોમી પુરુષોમાં શુક્રાણુઓના ઉત્પાદનને સંપૂર્ણપણે બંધ કરી દે છે.", "opts": ["એક", "બે", "ત્રણ", "ચાર"], "ans": 1, "exp": "માત્ર વિધાન 2 સાચું છે. 'સહેલી' અઠવાડિયામાં એક વાર લેવાતી ગોળી છે, કૉપર ટી કાયમી નથી, અને વાસેક્ટોમી શુક્રાણુઓના પરિવહનને અટકાવે છે, ઉત્પાદનને નહીં.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "પ્રજનન સ્વાસ્થ્યના ક્ષેત્રમાં 'સાર્વત્રિક સાવચેતી' (Universal Precautions) શબ્દનો અર્થ શું છે?", "opts": ["માત્ર ગર્ભવતી મહિલાઓ માટેના સ્વચ્છતા નિયમો", "રક્ત અને શારીરિક પ્રવાહીઓના સંપર્ક દ્વારા થતા ચેપને રોકવા માટેના પ્રમાણભૂત પગલાં", "ફક્ત હોસ્પિટલના કર્મચારીઓ માટેના સુરક્ષા નિયમો", "ગર્ભનિરોધક ઉપાયોનો વ્યાપક ઉપયોગ"], "ans": 1, "exp": "સાર્વત્રિક સાવચેતી એ રક્ત અને શારીરિક પ્રવાહીઓના સંપર્ક દ્વારા થતા ચેપ (જેમ કે HIV, હિપેટાઇટિસ) ને રોકવા માટેના પ્રમાણભૂત પગલાં છે, જે તમામ દર્દીઓ અને આરોગ્ય કર્મીઓ માટે લાગુ પડે છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના વિધાનોને ધ્યાનમાં લો: 1. ઇન વિટ્રો ફર્ટિલાઇઝેશન (IVF) એ સહાયક પ્રજનન તકનીક છે. 2. IVF દરમિયાન ફલિતાંડને ગર્ભાશયમાં સ્થાનાંતરિત કરવામાં આવે છે. 3. IVF માત્ર નલિકા અવરોધના કિસ્સામાં જ ઉપયોગી છે. 4. IVF દ્વારા જન્મેલા બાળકને 'ટેસ્ટ ટ્યુબ બેબી' કહેવામાં આવે છે. ઉપરોક્ત વિધાનોમાંથી કેટલા સાચાં છે?", "opts": ["એક", "બે", "ત્રણ", "ચાર"], "ans": 2, "exp": "વિધાન 1, 2 અને 4 સાચાં છે. IVF નલિકા અવરોધ ઉપરાંત અન્ય પ્રજનન સમસ્યાઓમાં પણ ઉપયોગી છે, તેથી વિધાન 3 ખોટું છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "ગર્ભનિરોધક પદ્ધતિઓમાં 'સહેલી' ગોળીનું મુખ્ય સક્રિય ઘટક કયું છે?", "opts": ["લેવોનોર્જેસ્ટ્રેલ", "ઓર્મેલોક્સિફેન", "ઇથિનાઇલ એસ્ટ્રાડાયોલ", "મેફિસ્ટ્રોન"], "ans": 1, "exp": "'સહેલી' ગોળીનું મુખ્ય સક્રિય ઘટક ઓર્મેલોક્સિફેન છે, જે એક બિન-સ્ટીરોઇડલ ગર્ભનિરોધક છે અને અઠવાડિયામાં એક વાર લેવામાં આવે છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "એક દંપતીને બે બાળકો છે અને તેઓ વધુ બાળક ઇચ્છતા નથી. તેમના માટે સૌથી યોગ્ય અને કાયમી ગર્ભનિરોધક પદ્ધતિ કઈ છે?", "opts": ["ઇન્ટ્રાયુટેરાઇન ડિવાઇસ (IUD)", "ટ્યુબેક્ટોમી અથવા વેસેક્ટોમી", "કોન્ડોમનો ઉપયોગ", "ગર્ભનિરોધક ગોળીઓ"], "ans": 1, "exp": "ટ્યુબેક્ટોમી (સ્ત્રીઓ માટે) અથવા વેસેક્ટોમી (પુરુષો માટે) એ કાયમી ગર્ભનિરોધક પદ્ધતિઓ છે, જે વધુ બાળક ન ઇચ્છતા દંપતીઓ માટે યોગ્ય છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેનામાંથી કયો રોગ જાતીય સંપર્ક દ્વારા ફેલાતો નથી?", "opts": ["સિફિલિસ", "ગોનોરિયા", "હિપેટાઇટિસ B", "ટાઇફોઇડ"], "ans": 3, "exp": "ટાઇફોઇડ એ જીવાણુ દ્વારા ફેલાતો રોગ છે, જે દૂષિત ખોરાક અથવા પાણી દ્વારા ફેલાય છે, જ્યારે અન્ય રોગો જાતીય સંપર્ક દ્વારા ફેલાય છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના વિધાનોને ધ્યાનમાં લો: 1. ઇન વિટ્રો ફર્ટિલાઇઝેશન (IVF)માં ફલિતાંડને ગર્ભાશયમાં સ્થાપિત કરવામાં આવે છે. 2. ઝાયગોટ ઇન્ટ્રાફેલોપિયન ટ્રાન્સફર (ZIFT)માં ફલિતાંડને ફેલોપિયન નળીમાં સ્થાપિત કરવામાં આવે છે. 3. ઇન્ટ્રાસાયટોપ્લાઝમિક સ્પર્મ ઇન્જેક્શન (ICSI)માં શુક્રાણુને સીધા અંડકોષમાં ઇન્જેક્ટ કરવામાં આવે છે. ઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["માત્ર 1 અને 2", "માત્ર 2 અને 3", "માત્ર 1 અને 3", "1, 2 અને 3"], "ans": 3, "exp": "આપેલ તમામ વિધાનો સાચાં છે. IVFમાં ફલિતાંડને ગર્ભાશયમાં, ZIFTમાં ફલિતાંડને ફેલોપિયન નળીમાં અને ICSIમાં શુક્રાણુને સીધા અંડકોષમાં ઇન્જેક્ટ કરવામાં આવે છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "મેડિકલ ટર્મિનેશન ઓફ પ્રેગ્નન્સી (MTP) અધિનિયમ, 1971 મુજબ ભારતમાં કયા સંજોગોમાં કાયદેસર ગર્ભપાત કરાવી શકાય છે?\n1. જો ગર્ભાવસ્થા માતાના જીવને જોખમમાં મૂકે\n2. જો ગર્ભમાં ગંભીર જન્મજાત ખામી હોય\n3. જો ગર્ભાવસ્થા બળાત્કારના પરિણામે થઈ હોય\n4. જો દંપતીને બીજું બાળક ન જોઈતું હોય", "opts": ["માત્ર 1 અને 2", "માત્ર 1, 2 અને 3", "માત્ર 1, 2 અને 4", "1, 2, 3 અને 4"], "ans": 1, "exp": "MTP અધિનિયમ મુજબ ગર્ભપાત માતાના જીવને જોખમ, ગંભીર જન્મજાત ખામી અથવા બળાત્કારના કિસ્સામાં કાયદેસર છે, પરંતુ ફક્ત બીજું બાળક ન જોઈતું હોવાને કારણે નહીં.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના વિધાનો ધ્યાનમાં લો: 1) ઇન વિટ્રો ફર્ટિલાઇઝેશન (IVF)માં ફલિતાંડને ગર્ભાશયમાં સ્થાપિત કરવામાં આવે છે. 2) IVF એ સહાયક પ્રજનન તકનીક (ART)નો એક પ્રકાર છે. 3) IVF માત્ર પુરુષ વંધ્યત્વના કિસ્સામાં જ ઉપયોગી છે. ઉપરોક્ત વિધાનોમાંથી કયું/કયા સાચું/સાચાં છે?", "opts": ["માત્ર 1 અને 2", "માત્ર 2 અને 3", "માત્ર 1 અને 3", "1, 2 અને 3"], "ans": 0, "exp": "IVFમાં ફલિતાંડને ગર્ભાશયમાં સ્થાપિત કરવામાં આવે છે અને તે ARTનો એક પ્રકાર છે. જોકે, IVF પુરુષ અને સ્ત્રી બંનેના વંધ્યત્વના કિસ્સામાં ઉપયોગી છે, માત્ર પુરુષ વંધ્યત્વમાં જ નહીં.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "એક સ્ત્રીને અનિયમિત માસિક ચક્ર અને અંડાશયમાં અનેક નાની ગાંઠોની સમસ્યા છે. આ સ્થિતિને ઓળખવા માટે કયા હોર્મોનના સ્તરની તપાસ કરવામાં આવે છે?", "opts": ["ફોલિકલ સ્ટિમ્યુલેટિંગ હોર્મોન (FSH)", "લ્યુટિનાઇઝિંગ હોર્મોન (LH)", "પ્રોલેક્ટિન", "ઇન્સ્યુલિન"], "ans": 1, "exp": "પોલિસિસ્ટિક ઓવેરિયન સિન્ડ્રોમ (PCOS)માં LHનું સ્તર સામાન્ય કરતાં વધુ હોય છે, જે અંડાશયમાં ગાંઠો અને અનિયમિત માસિકનું કારણ બને છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "ઇન વિટ્રો ફર્ટિલાઇઝેશન (IVF) પ્રક્રિયામાં, ફલિતાંડને ગર્ભાશયમાં સ્થાપિત કરતા પહેલાં કેટલા દિવસ સુધી પ્રયોગશાળામાં ઉછેરવામાં આવે છે?", "opts": ["1-2 દિવસ", "2-3 દિવસ", "3-5 દિવસ", "5-7 દિવસ"], "ans": 2, "exp": "IVFમાં ફલિતાંડને સામાન્ય રીતે 3-5 દિવસ સુધી પ્રયોગશાળામાં બ્લાસ્ટોસિસ્ટ તબક્કા સુધી ઉછેરવામાં આવે છે પછી ગર્ભાશયમાં સ્થાપિત કરવામાં આવે છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "એક યુવતીને અનિયમિત માસિક ચક્ર અને અંડાશયમાં અનેક નાના ગાંઠોની સમસ્યા છે. આ સ્થિતિને ઓળખો અને તેનું મુખ્ય કારણ શું છે?", "opts": ["પોલિસિસ્ટિક ઓવરી સિન્ડ્રોમ (PCOS), ઇન્સ્યુલિન પ્રતિકાર અને હોર્મોનલ અસંતુલન", "એન્ડોમેટ્રિઓસિસ, ગર્ભાશયની દીવાલનું બહાર વધવું", "ગર્ભાશયના ફાઇબ્રોઇડ્સ, જનીનિક પરિવર્તન", "સર્વાઇકલ કેન્સર, હ્યુમન પેપિલોમા વાઇરસ (HPV) સંક્રમણ"], "ans": 0, "exp": "પોલિસિસ્ટિક ઓવરી સિન્ડ્રોમ (PCOS)માં ઇન્સ્યુલિન પ્રતિકાર અને હોર્મોનલ અસંતુલનને કારણે અનિયમિત માસિક ચક્ર અને અંડાશયમ ject": "BIOLOGY"}, {"q": "જો કોઈ સ્ત્રીને સતત 28 દિવસના માસિક ચક્રમાં 14મા દિવસે અંડપાત થાય છે, તો ગર્ભધારણની શક્યતા સૌથી વધુ કયા સમયગાળામાં હોય છે?", "opts": ["1-7 દિવસ", "8-12 દિવસ", "12-16 દિવસ", "18-24 દિવસ"], "ans": 2, "exp": "અંડપાત પછી અંડકોષ લગભગ 24 કલાક જીવિત રહે છે અને શુક્રાણુઓ 3-5 દિવસ સુધી જીવિત રહી શકે છે, તેથી 12-16 દિવસનો સમયગાળો ગર્ભધારણ માટે સૌથી અનુકૂળ છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેનામાંથી કયો રોગ જાતીય સંક્રમિત રોગ (STI) નથી?", "opts": ["ગોનોરિયા", "સિફિલિસ", "હિપેટાઇટિસ B", "ટાઇફોઇડ"], "ans": 3, "exp": "ટાઇફોઇડ બેક્ટેરિયા *Salmonella Typhi* દ્વારા થાય છે અને તે જાતીય સંપર્ક દ્વારા ફેલાતો નથી, જ્યારે અન્ય ત્રણ રોગો જાતીય સંક્રમિત રોગો છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના વિધાનો ધ્યાનમાં લો: (1) મેડિકલ ટર્મિનેશન ઓફ પ્રેગ્નન્સી (MTP) ભારતમાં 1971થી કાયદેસર છે. (2) MTP માત્ર 12 અઠવાડિયા સુધીની ગર્ભાવસ્થા માટે જ કરાવી શકાય છે. (3) MTP માટે સ્ત્રીની સંમતિ ફરજિયાત છે. (4) MTP માત્ર સરકારી હોસ્પિટલોમાં જ થઈ શકે છે. ઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["એક", "બે", "ત્રણ", "ચાર"], "ans": 2, "exp": "વિધાન (1) અને (3) સાચાં છે. MTP 20 અઠવાડિયા સુધીની ગર્ભાવસ્થા માટે કાયદેસર છે અને તે ખાનગી ક્લિનિક્સમાં પણ થઈ શકે છે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "સહાયક પ્રજનન તકનિક (ART)માં 'ZIFT' પદ્ધતિનો અર્થ શું છે અને તે કયા તબક્કે કરવામાં આવે છે?", "opts": ["ઝાયગોટ ઇન્ટ્રા ફેલોપિયન ટ્રાન્સફર, ફલિતાંડના 8-કોષ તબક્કે", "ઝાયગોટ ઇન્ટ્રા ફેલોપિયન ટ્રાન્સફર, ફલિતાંડના 2-કોષ તબક્કે", "ઝાયન ઇન્ટ્રા ફેલોપિયન ટ્રાન્સફર, અફલિત અંડકોષ તબક્કે", "ઝાયગોટ ઇન્ટ્રા યુટેરાઇન ટ્રાન્સફર, ફલિતાંડના 4-કોષ તબક્કે"], "ans": 1, "exp": "ZIFT પદ્ધતિમાં ફલિતાંડને 2-કોષ તબક્કે ફેલોપિયન નલિકામાં સ્થાનાંતરિત કરવામાં આવે છે, જેથી તે કુદરતી રીતે ગર્ભાશયમાં પ્રવેશે.", "chapter": "પ્રજનન સ્વાસ્થ્ય", "svg": "", "subject": "BIOLOGY"}, {"q": "એક દંપતીને બાળક ન થતું હોય ત્યારે IVF પદ્ધતિમાં 'ઇન્ટ્રાસાયટોપ્લાઝમિક સ્પર્મ ઇન્જેક્શન (ICSI)'નો ઉપયોગ ક્યારે કરવામ const SUBJECTS=[{"name": "PHYSICS", "start": 0, "end": 44, "count": 45}, {"name": "CHEMISTRY", "start": 45, "end": 89, "count": 45}, {"name": "BIOLOGY", "start": 90, "end": 179, "count": 90}];
const MARKS_C=4, MARKS_W=-1;
const DURATION=180*60;
let answers={}, marked=new Set(), visited=new Set(), curIdx=0, remaining=DURATION, timerHandle=null, submitted=false;
let subjectLastIdx={};
SUBJECTS.forEach(s=>subjectLastIdx[s.name]=s.start);

function subjectOf(i){ return SUBJECTS.find(s=>i>=s.start&&i<=s.end); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = SUBJECTS.map((s,i)=>
    `<button class="tab-btn ${subjectOf(curIdx).name===s.name?'active':''}" onclick="jumpSubject('${s.name}')">${s.name} (${s.count})</button>`
  ).join('');
}
function jumpSubject(subjName){ curIdx = subjectLastIdx[subjName] !== undefined ? subjectLastIdx[subjName] : SUBJECTS.find(s=>s.name===subjName).start; render(); }

function renderPalette(){
  let html='';
  SUBJECTS.forEach(s=>{
    html += `<div class="subj-h">${s.name}</div><div class="palette">`;
    for(let i=s.start;i<=s.end;i++){
      let cls='notvisited';
      if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "NEET Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>NEET Mock Test</h1><div class="sub">NEET UG • 180 Questions • Max Marks 720</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 720 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 180 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "એક પદાર્થને 5 m/s²ના પ્રવેગથી ગતિ કરાવવા માટે 20 Nનું બળ લગાડવામાં આવે છે. જો આ જ પદાર્થ પર 50 Nનું બળ લગાડવામાં આવે, તો તેનો પ્રવેગ કેટલો થશે?", "opts": ["10 m/s²", "12.5 m/s²", "25 m/s²", "50 m/s²"], "ans": 1, "exp": "ન્યૂટનના બીજા નિયમ મુજબ, F = ma. અહીં m = F/a = 20/5 = 4 kg. તેથી, નવો પ્રવેગ a = 50/4 = 12.5 m/s².", "chapter": "ગતિના નિયમો (Laws of Motion)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન સ્થિત વિદ્યુતસ્થિતિમાન (Electrostatic Potential) માટે ખોટું છે?", "opts": ["સ્થિત વિદ્યુતસ્થિતિમાન એ અદિશ રાશિ છે.", "સ્થિત વિદ્યુતસ્થિતિમાનનું SI એકમ જૂલ/કુલંબ છે.", "સ્થિત વિદ્યુતસ્થિતિમાનનું મૂલ્ય વિદ્યુતભારની હાજરીથી સ્વતંત્ર છે.", "સ્થિત વિદ્યુતસ્થિતિમાનનું મૂલ્ય અવકાશમાંના બિંદુની સ્થિતિ પર આધારિત છે."], "ans": 2, "exp": "સ્થિત વિદ્યુતસ્થિતિમાનનું મૂલ્ય વિદ્યુતભારની હાજરી અને તેના મૂલ્ય પર આધારિત છે, માત્ર અવકાશમાંના બિંદુની સ્થિતિ પર નહીં.", "chapter": "સ્થિત વિદ્યુતસ્થિતિમાન અને કેપેસિટન્સ (Electrostatic Potential and Capacitance)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સરળ લોલકની લંબાઈ 1 m છે અને તેનું આવર્તકાળ 2 s છે. જો લોલકની લંબાઈ 4 m કરવામાં આવે, તો નવું આવર્તકાળ કેટલું થશે? (g = 9.8 m/s² લો)", "opts": ["1 s", "2 s", "4 s", "8 s"], "ans": 2, "exp": "સરળ લોલકનું આવર્તકાળ T = 2π√(l/g). જો l ચાર ગણું થાય, તો T બમણું થાય. તેથી, નવું આવર્તકાળ = 2 × 2 = 4 s.", "chapter": "દોલનો (Oscillations)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન યંગના મોડ્યુલસ (Young's Modulus) માટે સાચું નથી?", "opts": ["યંગનો મોડ્યુલસ પદાર્થની સ્થિતિસ્થાપકતાનું માપ છે.", "યંગનો મોડ્યુલસનું SI એકમ ન્યૂટન/મીટર² છે.", "યંગનો મોડ્યુલસ તાપમાન પર આધારિત નથી.", "યંગનો મોડ્યુલસ તણાવ અને વિકૃતિના ગુણોત્તર તરીકે વ્યાખ્યાયિત થાય છે."], "ans": 2, "exp": "યંગનો મોડ્યુલસ તાપમાન પર આધારિત છે, કારણ કે તાપમાનમાં ફેરફારથી પદાર્થની સ્થિતિસ્થાપકતા બદલાય છે.", "chapter": "ઘન પદાર્થોના યાંત્રિક ગુણધર્મો (Mechanical Properties of Solids)", "svg": "", "subject": "PHYSICS"}, {"q": "એક વિદ્યુત પરિપથમાં 10 Ωનો અવરોધ અને 2 Hનો ઇન્ડક્ટર શ્રેણીમાં જોડાયેલા છે. જો પરિપથમાં 50 Hzની આવૃત્તિનો પ્રવાહ પસાર થતો હોય, તો પરિપથનો કુલ અવરોધ (Impedance) કેટલો હશે?", "opts": ["10 Ω", "√(10² + (2π×50×2)²) Ω", "2π×50×2 Ω", "10 + 2π×50×2 Ω"], "ans": 1, "exp": "શ્રેણી LR પરિપથનો કુલ અવરોધ Z = √(R² + (XL)²), જ્યાં XL = 2πfL. તેથી, Z = √(10² + (2π×50×2)²).", "chapter": "પ્રત્યાવર્તી પ્રવાહ (Alternating Current)", "svg": "", "subject": "PHYSICS"}, {"q": "એક વસ્તુ સુરેખ પથ પર અચળ પ્રવેગથી ગતિ કરે છે. જો t સમયમાં તેનું સ્થાનાંતર s હોય, તો નીચેનામાંથી કયું સમીકરણ સાચું નથી?", "opts": ["s = ut + ½at²", "v = u + at", "v² = u² + 2as", "s = vt - ½at²"], "ans": 3, "exp": "સુરેખ ગતિના સમીકરણોમાં s = vt - ½at² સાચું નથી. સાચું સમીકરણ s = ut + ½at² છે.", "chapter": "સુરેખ ગતિ (Motion in a Straight Line)", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડતાં તેનું વેગમાન બદલાય છે. જો બળ F અને સમય Δt હોય, તો વેગમાનમાં થતો ફેરફાર Δp = ?", "opts": ["F × Δt", "F / Δt", "Δt / F", "F + Δt"], "ans": 0, "exp": "ન્યૂટનના બીજા નિયમ મુજબ, બળ F = Δp / Δt, તેથી Δp = F × Δt.", "chapter": "ગતિના નિયમો (Laws of Motion)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ગુરુત્વાકર્ષણ બળ માટે ખોટું છે?", "opts": ["ગુરુત્વાકર્ષણ બળ હંમેશા આકર્ષણ બળ છે.", "ગુરુત્વાકર્ષણ બળ બે પદાર્થોના દળના ગુણાકારના સમપ્રમાણમાં હોય છે.", "ગુરુત્વાકર્ષણ બળ બે પદાર્થો વચ્ચેના અંતરના વર્ગના વ્યસ્ત પ્રમાણમાં હોય છે.", "ગુરુત્વાકર્ષણ બળ માત્ર પૃથ્વી અને પદાર્થ વચ્ચે જ લાગે છે."], "ans": 3, "exp": "ગુરુત્વાકર્ષણ બળ બ્રહ્માંડમાં કોઈપણ બે પદાર્થો વચ્ચે લાગે છે, માત્ર પૃથ્વી અને પદાર્થ વચ્ચે જ નહીં.", "chapter": "ગુરુત્વાકર્ષણ (Gravitation)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સમાંતર પ્લેટ કેપેસિટરની ક્ષમતા C છે. જો બંને પ્લેટો વચ્ચેનું અંતર અડધું કરવામાં આવે, તો નવી ક્ષમતા કેટલી થશે?", "opts": ["C/2", "2C", "C", "4C"], "ans": 1, "exp": "કેપેસિટરની ક્ષમતા C = ε₀A/d મુજબ, અંતર d અડધું થતાં ક્ષમતા બમણી થાય છે.", "chapter": "સ્થિત વિદ્યુતસ્થિતિમાન અને કેપેસિટન્સ (Electrostatic Potential and Capacitance)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન પ્રકાશના તરંગ સ્વરૂપ માટે સાચું નથી?", "opts": ["પ્રકાશ વિદ્યુતચુંબકીય તરંગ છે.", "પ્રકાશ શૂન્યાવકાશમાં ગતિ કરી શકે છે.", "પ્રકાશનું વેગમાન હોય છે.", "પ્રકાશનું દ્રવ્યમાન હોય છે."], "ans": 3, "exp": "પ્રકાશનું દ્રવ્યમાન શૂન્ય હોય છે, તે માત્ર ઊર્જા અને વેગમાન ધરાવે છે.", "chapter": "વિદ્યુતચુંબકીય તરંગો (Electromagnetic Waves)", "svg": "", "subject": "PHYSICS"}, {"q": "એક કણને પ્રક્ષિપ્ત કરવામાં આવે છે અને તે સમક્ષિતિજ સાથે θ કોણ બનાવે છે. જો પ્રક્ષિપ્ત કોણ બમણો કરવામાં આવે (2θ), તો નીચેનામાંથી કયું પરિણામ સાચું નથી? (અવરોધો અવગણો)", "opts": ["પ્રક્ષિપ્તની મહત્તમ ઊંચાઈ બમણી થશે", "પ્રક્ષિપ્તની અવધિ બમણી થશે", "પ્રક્ષિપ્તની અવધિ વધશે પરંતુ બમણી નહીં થાય", "પ્રક્ષિપ્તની મહત્તમ અવધિ θ = 45° માટે મળે છે"], "ans": 1, "exp": "પ્રક્ષિપ્તની અવધિ T = (2u sinθ)/g છે. જો θ બમણો કરવામાં આવે તો sin2θ ≠ 2 sinθ, તેથી અવધિ બમણી નહીં થાય.", "chapter": "સમતલમાં ગતિ", "svg": "", "subject": "PHYSICS"}, {"q": "ન્યૂટનના ગતિના બીજા નિયમ અનુસાર, વસ્તુ પર લાગતું બળ F તેના વેગમાનના ફેરફારના દરના સમપ્રમાણમાં હોય છે. જો વસ્તુનું દળ અચળ હોય, તો આ નિયમનું ગાણિતિક સ્વરૂપ કયું છે?", "opts": ["F = ma", "F = mv", "F = m(dv/dt)", "F = (1/2)mv²"], "ans": 2, "exp": "ન્યૂટનનો બીજો નિયમ F = dp/dt છે, જ્યાં p = mv. જો દળ અચળ હોય, તો F = m(dv/dt) થાય.", "chapter": "ગતિના નિયમો", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્પ્રિંગને x જેટલું ખેંચવામાં આવે ત્યારે તેમાં સંગ્રહિત સ્થિતિ-ઊર્જા U = (1/2)kx² છે. જો સ્પ્રિંગને બમણું ખેંચવામાં આવે (2x), તો તેમાં સંગ્રહિત ઊર્જા કેટલી થશે?", "opts": ["U", "2U", "4U", "8U"], "ans": 2, "exp": "સ્થિતિ-ઊર્જા U ∝ x² છે. જો x બમણું થાય, તો ઊર્જા ચાર ગણી થશે (4U).", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ગુરુત્વાકર્ષણના સાર્વત્રિક નિયમ માટે સાચું નથી?", "opts": ["બે પદાર્થો વચ્ચેનું આકર્ષણ બળ તેમના દળના ગુણાકારના સમપ્રમાણમાં હોય છે", "બે પદાર્થો વચ્ચેનું આકર્ષણ બળ તેમની વચ્ચેના અંતરના વર્ગના વ્યસ્ત પ્રમાણમાં હોય છે", "ગુરુત્વાકર્ષણ બળ હંમેશા આકર્ષણ બળ હોય છે", "ગુરુત્વાકર્ષણ બળ પદાર્થોના દ્રવ્યની પ્રકૃતિ પર આધારિત છે"], "ans": 3, "exp": "ગુરુત્વાકર્ષણ બળ પદાર્થોના દળ અને અંતર પર આધારિત છે, તેમના દ્રવ્યની પ્રકૃતિ પર નહીં.", "chapter": "ગુરુત્વાકર્ષણ", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને શિરોલંબ દિશામાં ઉપર તરફ ફેંકવામાં આવે છે. જ્યારે તે મહત્તમ ઊંચાઈએ પહોંચે છે ત્યારે તેના વેગ અને પ્રવેગ વિશે નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["વેગ અને પ્રવેગ બંને શૂન્ય હોય છે", "વેગ શૂન્ય હોય છે પરંતુ પ્રવેગ શૂન્ય હોતો નથી", "વેગ શૂન્ય હોતો નથી પરંતુ પ્રવેગ શૂન્ય હોય છે", "વેગ અને પ્રવેગ બંને શૂન્ય હોતા નથી"], "ans": 1, "exp": "મહત્તમ ઊંચાઈએ પદાર્થનો વેગ શૂન્ય થાય છે, પરંતુ ગુરુત્વાકર્ષણને કારણે પ્રવેગ હંમેશા નીચેની તરફ 9.8 m/s² હોય છે.", "chapter": "સુરેખ ગતિ", "svg": "", "subject": "PHYSICS"}, {"q": "એક વાહન 20 m/sના પ્રારંભિક વેગથી ગતિ કરી રહ્યું છે અને 4 m/s²ના પ્રવેગથી 5 સેકન્ડ સુધી પ્રવેગિત થાય છે. આ સમય દરમિયાન વાહન દ્વારા કાપવામાં આવેલું અંતર કેટલું હશે?", "opts": ["100 m", "125 m", "150 m", "200 m"], "ans": 2, "exp": "અંતરની ગણતરી s = ut + ½at² સૂત્રથી થાય છે: s = (20 × 5) + ½(4 × 5²) = 100 + 50 = 150 m.", "chapter": "સુરેખ ગતિ", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન વિદ્યુતચુંબકીય પ્રેરણ માટે સાચું છે?", "opts": ["ફેરેડેનો નિયમ જણાવે છે કે પ્રેરિત emf ચુંબકીય ફ્લક્સના ફેરફારના દરના સમપ્રમાણમાં હોય છે", "લેન્ઝનો નિયમ જણાવે છે કે પ્રેરિત emf હંમેશા મૂળ ફ્લક્સના ફેરફારનો વિરોધ કરે છે", "વિદ્યુતચુંબકીય પ્રેરણ માત્ર સ્થિર ચુંબકીય ક્ષેત્રમાં જ શક્ય છે", "પ્રેરિત emf ચુંબકીય ક્ષેત્રની દિશામાં હોય છે"], "ans": 1, "exp": "ફેરેડેનો નિયમ જણાવે છે કે પ્રેરિત emf ચુંબકીય ફ્લક્સના ફેરફારના દરના સમપ્રમાણમાં હોય છે, જ્યારે લેન્ઝનો નિયમ પ્રેરિત emfની દિશા વિશે છે.", "chapter": "વિદ્યુતચુંબકીય પ્રેરણ", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને ઊર્ધ્વદિશામાં ફેંકવામાં આવે છે અને તે મહત્તમ ઊંચાઈએ પહોંચે છે. આ સ્થિતિમાં પદાર્થનો પ્રવેગ કેટલો હશે? (g = 9.8 m/s²)", "opts": ["શૂન્ય", "9.8 m/s² અધોદિશામાં", "9.8 m/s² ઊર્ધ્વદિશામાં", "પદાર્થના વેગ પર આધારિત"], "ans": 1, "exp": "મહત્તમ ઊંચાઈએ પદાર્થનો વેગ શૂન્ય થાય છે, , "subject": "PHYSICS"}, {"q": "એક સંપૂર્ણ સ્થિતિસ્થાપક અથડામણમાં નીચેનામાંથી કઈ રાશિ સંરક્ષિત રહે છે?", "opts": ["માત્ર ગતિ ઊર્જા", "માત્ર વેગમાન", "ગતિ ઊર્જા અને વેગમાન બંને", "ન તો ગતિ ઊર્જા ન તો વેગમાન"], "ans": 2, "exp": "સંપૂર્ણ સ્થિતિસ્થાપક અથડામણમાં ગતિ ઊર્જા અને વેગમાન બંને સંરક્ષિત રહે છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર (Work, Energy and Power)", "svg": "", "subject": "PHYSICS"}, {"q": "એક ઇલેક્ટ્રોનને 100 Vના વિદ્યુતક્ષેત્રમાં પ્રવેગિત કરવામાં આવે છે. ઇલેક્ટ્રોનની ગતિ-ઊર્જા કેટલી હશે? (ઇલેક્ટ્રોનનો વિદ્યુતભાર e = 1.6 × 10⁻¹⁹ C)", "opts": ["1.6 × 10⁻¹⁷ J", "3.2 × 10⁻¹⁷ J", "1.6 × 10⁻¹⁹ J", "3.2 × 10⁻¹⁹ J"], "ans": 0, "exp": "ગતિ-ઊર્જા = વિદ્યુતભાર × વિદ્યુતક્ષેત્ર = e × V = 1.6 × 10⁻¹⁹ C × 100 V = 1.6 × 10⁻¹⁷ J.", "chapter": "વિદ્યુતભારો અને ક્ષેત્રો (Electric Charges and Fields)", "svg": "", "subject": "PHYSICS"}, {"q": "ન્યૂટનના ગતિના બીજા નિયમ અનુસાર, પદાર્થ પર લાગતું બળ F તેના વેગમાનના ફેરફારના દરના સમપ્રમાણમાં હોય છે. જો પદાર્થનું દળ અચળ હોય, તો આ નિયમને કયા સૂત્ર વડે દર્શાવી શકાય?", "opts": ["F = ma", "F = mv", "F = mgh", "F = ½mv²"], "ans": 0, "exp": "ન્યૂટનનો બીજો નિયમ F = dp/dt છે. જો દળ અચળ હોય, તો F = ma થાય.", "chapter": "ગતિના નિયમો (Laws of Motion)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્પ્રિંગને 5 cm સંકોચવામાં આવે છે અને તેની સ્થિતિ ઊર્જા 10 J હોય છે. જો સ્પ્રિંગને 10 cm સંકોચવામાં આવે, તો તેની સ્થિતિ ઊર્જા કેટલી થશે? (સ્પ્રિંગ અચળાંક અચળ છે)", "opts": ["20 J", "40 J", "50 J", "100 J"], "ans": 1, "exp": "સ્થિતિ ઊર્જા U = ½kx². જો x બમણું થાય, તો U ચાર ગણું થાય (10 J × 4 = 40 J).", "chapter": "કાર્ય, ઊર્જા અને પાવર (Work, Energy and Power)", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને 10 m/sના પ્રારંભિક વેગથી ઊર્ધ્વદિશામાં ફેંકવામાં આવે છે. જો ગુરુત્વાકર્ષણ પ્રવેગ 10 m/s² હોય, તો પદાર્થ મહત્તમ કેટલી ઊંચાઈ પ્રાપ્ત કરશે? (હવાનો અવરોધ અવગણો)", "opts": ["5 m", "10 m", "15 m", "20 m"], "ans": 0, "exp": "મહત્તમ ઊંચાઈ માટે અંતિમ વેગ શૂન્ય થશે. v² = u² - 2gh સૂત્રનો ઉપયોગ કરતાં, 0 = (10)² - 2(10)h ⇒ h = 5 m.", "chapter": "સુરેખ ગતિ (Motion in a Straight Line)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેના વિધાનોને ધ્યાનમાં લો: (1) યંગ મોડ્યુલસ (Young's Modulus) પદાર્થની સ્થિતિસ્થાપકતાનું માપ છે. (2) પોઇસન ગુણોત્તર (Poisson's Ratio) પદાર્થની સંકોચનક્ષમતાનું માપ છે. (3) બલ્ક મોડ્યુલસ (Bulk Modulus) પદાર્થની દ્રવ્યતા દર્શાવે છે. ઉપરોક્ત વિધાનોમાંથી કયાં સાચાં છે?", "opts": ["માત્ર 1", "માત્ર 1 અને 2", "માત્ર 1 અને 3", "1, 2 અને 3"], "ans": 2, "exp": "યંગ મોડ્યુલસ સ્થિતિસ્થાપકતા દર્શાવે છે અને પોઇસન ગુણોત્તર પાર્શ્વીય તાણનું માપ છે, પરંતુ બલ્ક મોડ્યુલસ દ્રવ્યતા નહીં, સંકોચનક્ષમતા દર્શાવે છે.", "chapter": "ઘન પદાર્થોના યાંત્રિક ગુણધર્મો (Mechanical Properties of Solids)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સમાંતર પ્લેટ કેપેસિટરની ક્ષમતા 20 µF છે. જો બંને પ્લેટો વચ્ચેનું અંતર અડધું કરવામાં આવે અને પ્લેટોનું ક્ષેત્રફળ બમણું કરવામાં આવે, તો નવી ક્ષમતા કેટલી થશે?", "opts": ["20 µF", "40 µF", "80 µF", "160 µF"], "ans": 2, "exp": "ક્ષમતા C ∝ A/d. અંતર અડધું અને ક્ષેત્રફળ બમણું થતાં, C' = (2A)/(d/2) = 4C = 80 µF.", "chapter": "સ્થિત વિદ્યુતસ્થિતિમાન અને કેપેસિટન્સ (Electrostatic Potential and Capacitance)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્થિત વિદ્યુત ક્ષેત્રમાં 5 C વિદ્યુતભારને એક બિંદુથી બીજા બિંદુ સુધી ખસેડવા માટે 20 J કાર્ય કરવું પડે છે. આ બે બિંદુઓ વચ્ચેનો વિદ્યુતસ્થિતિમાનનો તફાવત કેટલો હશે?", "opts": ["2 V", "4 V", "5 V", "10 V"], "ans": 1, "exp": "વિદ્યુતસ્થિતિમાનનો તફાવત V = W/q ⇒ V = 20 J / 5 C = 4 V.", "chapter": "સ્થિત વિદ્યુતસ્થિતિમાન અને કેપેસિટન્સ (Electrostatic Potential and Capacitance)", "svg": "", "subject": "PHYSICS"}, {"q": "એક AC પરિપથમાં 100 Ω અવરોધ, 0.5 H ઇન્ડક્ટર અને 20 μF કેપેસિટર શ્રેણીમાં જોડાયેલ છે. જો પરિપથમાં આવૃત્તિ 50 Hz હોય, તો પરિપથની પ્રતિબाधા (impedance) કેટલી હશે?", "opts": ["100 Ω", "125 Ω", "150 Ω", "200 Ω"], "ans": 1, "exp": "પ્રતિબાધા Z = √(R² + (X_L - X_C)²), જ્યાં X_L = 2πfL = 157 Ω અને X_C = 1/(2πfC) = 159 Ω. તેથી Z = √(100² + (157 - 159)²) ≈ 100 Ω.", "chapter": "પ્રત્યાવર્તી પ્રવાહ (Alternating Current)", "svg": "", "subject": "PHYSICS"}, {"q": "એક કણને પ્રક્ષેપિત કરવામાં આવે છે અને તે સમક્ષિતિજ સાથે θ કોણ બનાવે છે. જો પ્રક્ષેપણ કોણ બમણો કરવામાં આવે, તો નીચેનામાંથી કઈ રાશિ બદલાશે નહીં?", "opts": ["મહત્તમ ઊંચાઈ", "પ્રક્ષેપણનો સમય", "પ્રક્ષેપિત અંતર (Range)", "પ્રારંભિક વેગનો સમક્ષિતિજ ઘટક"], "ans": 3, "exp": "પ્રારંભિક વેગનો સમક્ષિતિજ ઘટક uₓ = u cosθ, જે પ્રક્ષેપણ કોણ બદલાતા બદલાતો નથી જો પ્રારંભિક વેગ અચળ રહે.", "chapter": "સમતલમાં ગતિ (Motion in a Plane)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્પ્રિંગને 5 cm સંકોચવામાં આવે છે અને તેમાં સંગ્રહિત ઊર્જા 10 J છે. જો આ સ્પ્રિંગને 10 cm સંકોચવામાં આવે, તો તેમાં સંગ્રહિત ઊર્જા કેટલી હશે? (સ્પ્રિંગનો બળ-અચળાંક અચળ છે)", "opts": ["20 J", "40 J", "50 J", "100 J"], "ans": 1, "exp": "સ્પ્રિંગમાં સંગ્રહિત ઊર્જા U = ½kx². જો x બમણું થાય, તો U ચાર ગણું થાય. તેથી 10 J × 4 = 40 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર (Work, Energy and Power)", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને 40 m/sની પ્રારંભિક વેગથી ઊર્ધ્વદિશામાં ફેંકવામાં આવે છે. જો ગુરુત્વાકર્ષણ પ્રવેગ 10 m/s² હોય, તો પદાર્થ કેટલા સમય બાદ ફરીથી જમીન પર પાછો આવશે? (હવાનો અવરોધ અવગણો)", "opts": ["4 s", "8 s", "6 s", "2 s"], "ans": 1, "exp": "પ્રક્ષેપણ સમય = 2 × (પ્રારંભિક વેગ / ગુરુત્વાકર્ષણ પ્રવેગ) = 2 × (40/10) = 8 s.", "chapter": "ગુરુત્વાકર્ષણ", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને 45° ના કોણે ફેંકવામાં આવે છે. જો હવાનો અવરોધ અવગણવામાં આવે, તો તેની ગતિ દરમિયાન કયો ભૌતિક જથ્થો અચળ રહે છે?", "opts": ["ઊર્જા", "વેગ", "ક્ષિતિજ ઘટક વેગ", "ઊર્ધ્વ ઘટક વેગ"], "ans": 0, "exp": "પ્રક્ષિપ્ત ગતિમાં યાંત્રિક ઊર્જા (સ્થિતિ ઊર્જા + ગતિ ઊર્જા) અચળ રહે છે કારણ કે માત્ર ગુરુત્વાકર્ષણ બળ કાર્ય કરે છે, જે સંરક્ષી બળ છે.", "chapter": "ગતિના નિયમો (Laws of Motion)", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્થિતિસ્થાપક સ્પ્રિંગને 0.2 m સંકોચવામાં આવે છે અને તેની સ્થિતિ ઊર્જા 20 J છે. જો આ સ્પ્રિંગને 0.4 m સંકોચવામાં આવે, તો તેની સ્થિતિ ઊર્જા કેટલી થશે? (સ્પ્રિંગ અચળાંક અચળ છે)", "opts": ["40 J", "60 J", "80 J", "100 J"], "ans": 2, "exp": "સ્પ્રિંગની સ્થિતિ ઊર્જા U = ½kx² છે. x બમણું કરતાં U ચાર ગણું થાય છે (કારણ કે U ∝ x²). તેથી, 20 J × 4 = 80 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર (Work, Energy and Power)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ગુરુત્વાકર્ષણ બળ માટે સાચું નથી?", "opts": ["તે હંમેશા આકર્ષણ બળ છે.", "તે બે પદાર્થો વચ્ચેના અંતરના વર્ગના વ્યસ્ત પ્રમાણમાં હોય છે.", "તે પદાર્થના દળ પર આધારિત નથી.", "તે બ્રહ્માંડમાં દરેક પદાર્થ વચ્ચે કાર્ય કરે છે."], "ans": 2, "exp": "ગુરુત્વાકર્ષણ બળ બંને પદાર્થોના દળના ગુણાકારના સમપ્રમાણમાં હોય છે (F ∝ m₁m₂), તેથી તે દળ પર આધારિત છે.", "chapter": "ગુરુત્વાકર્ષણ (Gravitation)", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન યંગના દ્વિસ્લિટ પ્રયોગ માટે ખોટું છે?", "opts": ["પ્રકાશની તરંગલંબાઈ વધારતાં પટ્ટાઓ વચ્ચેનું અંતર વધે છે.", "સ્લિટ વચ્ચેનું અંતર ઘટાડતાં પટ્ટાઓ વચ્ચેનું અંતર વધે છે.", "પટ્ટાઓની તીવ્રતા સ્લિટની પહોળાઈ પર આધારિત નથી.", "પટ્ટાઓનું નિર્માણ પ્રકાશના વ્યતિકરણને કારણે થાય છે."], "ans": 2, "exp": "યંગના પ્રયોગમાં પટ્ટાઓની તીવ્રતા સ્લિટની પહોળાઈ પર આધારિત હોય છે, કારણ કે પહોળાઈ વધતાં પ્રકાશની તીવ્રતા વધે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર (Wave Optics)", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને ઊર્ધ્વ દિશામાં ફેંકવામાં આવે છે. જો હવાનો અવરોધ અવગણવામાં આવે, તો નીચેનામાંથી કયું વિધાન સત્ય છે?", "opts": ["પદાર્થની ગતિ દરમિયાન તેનું પ્રવેગ અચળ રહે છે.", "પદાર્થની મહત્તમ ઊંચાઈએ તેનો વેગ મહત્તમ હોય છે.", "પદાર્થની ગતિ દરમિયાન તેનું યાંત્રિક ઊર્જા સંરક્ષિત રહેતું નથી.", "પદાર્થની ગતિ દરમિયાન તેનું વેગ અને પ્રવેગ બંને એક જ દિશામાં હોય છે."], "ans": 0, "exp": "હવાનો અવરોધ અવગણતા, પદાર્થ પર માત્ર ગુરુત્વાકર્ષણ બળ લાગે છે, જે અચળ પ્રવેગ (g) ઉત્પન્ન કરે છે. તેથી પ્રવેગ અચળ રહે છે.", "chapter": "ગુરુત્વાકર્ષણ", "svg": "", "subject": "PHYSICS"}, {"q": "એક સમાંતર પ્લેટ કેપેસિટરની ક્ષમતા C છે. જો બંને પ્લેટ વચ્ચેનું અંતર અડધું કરવામાં આવે અને પ્લેટ વચ્ચેના માધ્યમનો પરાવૈધુતાંક બમણો કરવામાં આવે, તો નવી ક્ષમતા કેટલી થશે?", "opts": ["C/4", "C/2", "2C", "4C"], "ans": 3, "exp": "ક્ષમતા C = ε₀K A/d. અંતર અડધું (d/2) અને પરાવૈધુતાંક બમણો (2K) કરતાં, ન ter": "માનવ સ્વાસ્થ્ય અને રોગો", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યમાં 'રુધિર જૂથ'ની આનુવંશિકતા કયા પ્રકારના વારસાગમનને અનુસરે છે?", "opts": ["સંપૂર્ણ પ્રભુતા (Complete dominance)", "સહપ્રભુતા (Co-dominance)", "બહુવૈકલ્પિક જનીનો (Multiple alleles)", "સહપ્રભુતા અને બહુવૈકલ્પિક જનીનો બંને"], "ans": 3, "exp": "મનુષ્યમાં રુધિર જૂથની આનુવંશિકતા સહપ્રભુતા (AB જૂથ) અને બહુવૈકલ્પિક જનીનો (I^A, I^B, i) દ્વારા નક્કી થાય છે.", "chapter": "આનુવંશિકતા અને ભિન્નતાના સિદ્ધાંતો", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના વિધાનોને ધ્યાનમાં લો: 1. પ્રકાશસંશ્લેષણની પ્રક્રિયામાં O₂ નું ઉત્પાદન પાણીના પ્રકાશીય વિઘટન દ્વારા થાય છે. 2. C₄ વનસ્પતિઓમાં CO₂ નું સ્થિરીકરણ પ્રથમ ઓક્ઝેલોએસેટિક એસિડ (OAA) તરીકે થાય છે. 3. કેલ્વિન ચક્રમાં CO₂ નું સ્થિરીકરણ રુબિસ્કો ઉત્સેચક દ્વારા થાય છે. ઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["માત્ર એક", "માત્ર બે", "ત્રણેય", "એક પણ નહીં"], "ans": 2, "exp": "વિધાન 1 અને 3 સાચાં છે, પરંતુ C₄ વનસ્પતિઓમાં CO₂ નું સ્થિરીકરણ OAA તરીકે થાય છે (વિધાન 2 સાચું નથી કારણ કે તે C₄ ચક્રનો ભાગ છે).", "chapter": "ઉચ્ચ કક્ષાની વનસ્પતિઓમાં પ્રકાશસંશ્લેષણ", "svg": "", "subject": "BIOLOGY"}, {"q": "એક વનસ્પતિ કોષમાં 24 વર્ણસૂત્રો છે. તેના મૂળના કોષમાં કેટલાં વર્ણસૂત્રો હશે?", "opts": ["12", "24", "48", "આપેલ માહિતીથી નક્કી કરી શકાય નહીં"], "ans": 1, "exp": "મૂળના કોષો દ્વિગુણિત (2n) હોય છે, જ્યારે વનસ્પતિ કોષ (જન્યુકોષ સિવાય) પણ દ્વિગુણિત હોય છે, તેથી વર્ણસૂત્રોની સંખ્યા સમાન (24) રહેશે.", "chapter": "કોષ ચક્ર અને કોષ વિભાજન", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેનામાંથી કયું પ્રાણી 'ઉભયજીવી' સમૂહનું નથી?", "opts": ["સેલામેન્ડર", "ટોડ", "ઓક્ટોપસ", "ઉડતી દેડકી"], "ans": 2, "exp": "ઓક્ટોપસ મૃદુકાય સમૂહનું પ્રાણી છે, જ્યારે અન્ય ત્રણ ઉભયજીવી સમૂહના છે.", "chapter": "પ્રાણી સૃષ્ટિ", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેનામાંથી કયું ઉત્સેચક પ્રોટીનના પાચન માટે જવાબદાર છે?", "opts": ["એમાયલેઝ", "લાઇપેઝ", "ટ્રિપ્સિન", "ન્યુક્લિએઝ"], "ans": 2, "exp": "ટ્રિપ્સિન એ પ્રોટીએઝ ઉત્સેચક છે જે પ્રોટીનને પેપ્ટાઇડ્સ અને એમિનો એસિડમાં તોડે છે.", "chapter": const SUBJECTS=[{"name": "PHYSICS", "start": 0, "end": 44, "count": 45}, {"name": "CHEMISTRY", "start": 45, "end": 89, "count": 45}, {"name": "BIOLOGY", "start": 90, "end": 179, "count": 90}];
const MARKS_C=4, MARKS_W=-1;
const DURATION=180*60;
let answers={}, marked=new Set(), visited=new Set(), curIdx=0, remaining=DURATION, timerHandle=null, submitted=false;
let subjectLastIdx={};
SUBJECTS.forEach(s=>subjectLastIdx[s.name]=s.start);

function subjectOf(i){ return SUBJECTS.find(s=>i>=s.start&&i<=s.end); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = SUBJECTS.map((s,i)=>
    `<button class="tab-btn ${subjectOf(curIdx).name===s.name?'active':''}" onclick="jumpSubject('${s.name}')">${s.name} (${s.count})</button>`
  ).join('');
}
function jumpSubject(subjName){ curIdx = subjectLastIdx[subjName] !== undefined ? subjectLastIdx[subjName] : SUBJECTS.find(s=>s.name===subjName).start; render(); }

function renderPalette(){
  let html='';
  SUBJECTS.forEach(s=>{
    html += `<div class="subj-h">${s.name}</div><div class="palette">`;
    for(let i=s.start;i<=s.end;i++){
      let cls='notvisited';
      if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "NEET Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

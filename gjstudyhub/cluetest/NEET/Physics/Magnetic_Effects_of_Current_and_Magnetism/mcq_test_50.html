<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;

<script>
const QUIZ = [{"q": "હેન્રિચ ઓરસ્ટેડના પ્રયોગથી શું પ્રાપ્ત થયું હતું?", "opts": ["વિદ્યુત પ્રવાહથી ચુંબકીય ક્ષેત્ર ઉત્પન્ન થાય છે.", "સ્થિર વિદ્યુતભાર ચુંબકીય ક્ષેત્ર પેદા કરે છે.", "ચુંબકમાંથી વિદ્યુત પ્રવાહ મળી શકે છે.", "ચુંબકીય ક્ષેત્રનું એકમ ટેસ્લા (Tesla) છે."], "correct": 0, "explain": "ઓરસ્ટેડના પ્રયોગ દરમિયાન, જ્યારે તારમાં વિદ્યુત પ્રવાહ વહેતો હતો ત્યારે નજીક રાખેલા કોમ્પાસની સૂઈ વલોવાઈ ગઈ હતી, જે સાબિત કરે છે કે વિદ્યુત પ્રવાહ ચુંબકીય ક્ષેત્ર ઉત્પન્ન કરે છે.", "tag": ""}, {"q": "સીધા વાહક તારમાંથી વિદ્યુત પ્રવાહ પસાર થતાં તેની આસપાસના ચુંબકીય ક્ષેત્ર રેખાઓનો આકાર કયો હોય છે?", "opts": ["સંકેન્દ્રીય વર્તુળાકાર", "સીધી રેખા", "વક્ર અને અનિયમિત", "સમાંતર રેખાઓ"], "correct": 0, "explain": "વિદ્યુત પ્રવાહવાળા સીધા તારની આસપાસ ચુંબકીય ક્ષેત્ર રેખાઓ વર્તુળાકાર આકારની હોય છે, જે તારને કેન્દ્ર ધરાવતા સંકેન્દ્રીય વર્તુળો તરીકે દેખાય છે.", "tag": ""}, {"q": "ચુંબકીય ક્ષેત્ર રેખાઓની કઈ વિશેષતા સાચી છે?", "opts": ["તે સતત બંધ વક્રો હોય છે.", "તે એકબીજાને છેદી શકે છે.", "તે બહારની તરફ ફેલાયેલી હોય છે.", "તે સીધી રેખાઓમાં હોય છે."], "correct": 0, "explain": "ચુંબકીય ક્ષેત્ર રેખાઓ હંમેશા બંધ વક્રો તરીકે અસ્તિત્વ ધરાવે છે, કારણ કે ચુંબકીય ધ્રુવો અલગ ન હોઈ શકે અને તેઓ ચુંબકની અંદરથી પણ પસાર થાય છે.", "tag": ""}, {"q": "ચુંબકીય ક્ષેત્ર રેખાઓની દિશા નક્કી કરવા માટે કયો નિયમ વપરાય છે?", "opts": ["ક્વેડર્નેટ અંગૂઠાનો નિયમ", "ફ્લેમિંગનો ડાબા હાથનો નિયમ", "દક્ષિણાવર્ત નિયમ", "કુલંબનો નિયમ"], "correct": 0, "explain": "ક્વેડર્નેટ અંગૂઠાનો નિયમ જણાવે છે કે જો તારને ડાબા હાથથી પકડીએ અને અંગૂઠો વિદ્યુત પ્રવાહની દિશામાં હોય, તો વળેલા ઉર્મરો ચુંબકીય ક્ષેત્ર રેખાઓની દિશા બતાવે છે.", "tag": ""}, {"q": "બાયોટ-સેવર્ટના નિયમ મુજબ વિદ્યુત પ્રવાહ ધરાવતા તારના નાના અંશ દ્વારા ઉત્પન્ન થતું ચુંબકીય ક્ષેત્ર શેના સમપ્રમાણમાં હોય છે?", "opts": ["તારના અંશની લંબાઈ અને વિદ્યુત પ્રવાહ પર", "અંતરના વર્ગના સમપ્રમાણમાં", "વિદ્યુતભારના પરિણામે", "ત્રિજ્યાના વર્ગના સમપ્રમાણમાં"], "correct": 0, "explain": "બાયોટ-સેવર્ટનો નિયમ દર્શાવે છે કે ચુંબકીય ક્ષેત્ર, વિદ્યુત પ્રવાહ અને તારના અંશની લંબાઈ પર સમપ્રમાણમા noid) માં N સંખ્યામાં ફેરવણીઓ (turns) અને લંબાઈ l હોય અને તેમાં પ્રવાહ I પસાર થતો હોય તો તેની અંદર ચુંબકીય ક્ષેત્ર B શું હશે? (μ₀ = 4π × 10^-7 Tm/A)", "opts": ["B = μ₀NI/l", "B = μ₀Nl/I", "B = μ₀I/(Nl)", "B = Nl/(μ₀I)"], "correct": 0, "explain": "આદર્શ સોલેનોઇડની અંદર ચુંબકીય પ્રવેગ B = μ₀nI થાય છે, જ્યાં n = N/l (પ્રતિ એકમ લંબાઈ ફેરવણીઓ). તેથી B = μ₀(N/l)I = μ₀NI/l.", "tag": ""}, {"q": "એક આદર્શ ટોઇડ (Toroid) માં N ફેરવણીઓ અને પ્રવાહ I હોય, તો તેની અંદરના ચુંબકીય ક્ષેત્રનું પ્રમાણ કેટલું થાય? (રેડિયસ r)", "opts": ["B = μ₀NI/(2πr)", "B = μ₀NI/r", "B = μ₀N/(2πrI)", "B = 0"], "correct": 0, "explain": "એમ્પિયરના પરિપથ નિયમ મુજબ, ટોઇડની અંદર ચુંબકીય ક્ષેત્ર B = μ₀NI/(2πr) હોય છે, જ્યાં r એ ટોઇડના કેન્દ્રથી અંતર છે. ટોઇડની બહાર અને ખોલકામાં ચુંબકીય ક્ષેત્ર શૂન્ય હોય છે.", "tag": ""}, {"q": "ચુંબકીય ક્ષેત્ર (Magnetic Field) ને અંગે ચોક્કસતા સાથે નીચેનામાંથી કયું વિતરણ સાચું છે?", "opts": ["સીધા વાયરમાંથી પસાર થતા પ્રવાહની સાપેક્ષે ચુંબકીય ક્ષેત્ર રેખાઓ નળાકારીય સપાટીની લાંબીઓ છે.", "સોલેનૉઇડની અંદર ચુંબકીય ક્ષેત્ર યાદૃચ્છિક દિશામાં વર્તે છે.", "ટોરૉઇડની બહારની દિશામાં ચુંબકીય ક્ષેત્ર નાદુરસ્ત (Non-zero) હોય છે.", "ચુંબકીય ક્ષેત્ર રેખાઓ બહારથી દક્ષિણ ધ્રુવ પરથી ઉત્તર ધ્રુવ તરફ જાય છે."], "correct": 0, "explain": "ઓગ્રેનો ચુંબકીય ક્ષેત્રના સ્ત્રોતોની આંતરિક અને બાહ્ય વિન્યાસ પર ધ્યાન આપે છે. વીજપ્રવાહવાળી સીધી તારમાંથી પસાર થતા પ્રવાહની સાપેક્ષે ચુંબકીય ક્ષેત્ર રેખાઓ વર્તુળાકાર (અથવા નળાકારીય) હોય છે. ટોરૉઇડ માં ખાલી અંદર જ ચુંબકીય ક્ષેત્ર હોય છે, બહાર નથી. તેથી A સાચો છે.", "tag": ""}, {"q": "બાયો-સેવર્ટના નિયમ મુજબ, એક લાંબી સીધી તારની સપાટી પર r અંતરે ચુંબકીય ક્ષેત્ર B ની ગણતરી કરતી વખતે, તારથી દૂર જતાં B માં શું ફેરફાર થાય છે?", "opts": ["B વધે છે કારણ કે પ્રવાહ વધે છે.", "B ઘટે છે, કારણ કે B ∝ 1/r.", "B બદલાતું નથી; તે r થી સ્વતંત્ર છે.", "B વધે છે કારણ કે r વધવાથી ક્ષેત્રક્ષેત્ર વધે છે."], "correct": 1, "explain": "બાયો-સેવર્ટના નિયમ મુજબ, સીધી તારમાંથી પસાર થતા પ્રવાહ I દ્વારા r અંતરે ઉત્પન્ન થતું ચુંબકીય ક્ષેત્ર B = μ₀I/(2πr) મુજબ મળે છે. આનો અર્થ B ∝ 1/r છે, તેથી અંતર r વધે તો B ઘટે છે.", "tag": ""}, {"q": "આવર્તન (frequency) f ની વીજચુંબકીય લહેરના પ્રવાહવાળા લૂપમાંથી પસાર થતા ચોક્કસ વિદ્યુતભાર q ધરાવતો કણ ચુંબકીય ક્ષેત્ર B માં આવર્તન સાથે ગતિ કરે છે, તેના કોણીય આવર્તન (ω) નું સૂત્ર શું છે?", "opts": ["ω = qB/m", "ω = m/qB", "ω = Bq/m", "ω = 2πf = qB/(2πm)"], "correct": 0, "explain": "ચુંબકીય ક્ષેત્રમાં આયનિત કણ વર્તુળાકાર માર્ગે ગતિ કરે છે. કોણીય આવર્તન (cyclotron frequency) ω = qB/m થાય છે, જે કણના પ્રતિ ધારિત વર્ગ પર આધારિત નથી. તેથી A સાચો છે.", "tag": ""}, {"q": "એક ચોક્કસ ચુંબકીય ક્ષેત્રમાં ઈલેક્ટ્રોન અને પ્રોટોન બંને સમપ્રમાણ ઝડપથી ગતિ કરતા હોય. કણો પર લાગતું લોરેન્ઝ બળ (F_L) તુલનાત્મક રીતે શું છે?", "opts": ["ઈલેક્ટ્રોન પર લોરેન્ઝ બળ > પ્રોટોન પર લોરેન્ઝ બળ.", "ઈલેક્ટ્રોન પર લોરેન્ઝ બળ < પ્રોટોન પર લોરેન્ઝ બળ.", "ઈલેક્ટ્રોન અને પ્રોટોન બંને પર લોરેન્ઝ બળ સમાન છે, કારણ કે F = qvB.", "કણોના ભાર બહુમૂલ્યમાં બદલાઈ જાય છે."], "correct": 2, "explain": "લોરેન્ઝ બળ F = qvB sin θ હોય છે. જો બંને કણો માટે v અને B સમાન હોય, અને તેમના ભારોના મૂલ્ય સમાન હોય (પ્રોટોન અને ઈલેક્ટ્રોન બંને માટે q = e), તો બળ સમાન રહે છે. તેથી C સાચો છે.", "tag": ""}, {"q": "એક સોલેનૉઇડની લંબાઈ L અને ફેરવણીઓ N હોય, જેમાં I પ્રવાહ પસાર થતો હોય. તેની અંદરના ચુંબકીય ક્ષેત્ર ઘનતા B માટેનું સાચું સમીકરણ કયું છે?", "opts": ["B = μ₀nI, જ્યાં n = N/L", "B = μ₀NI/L²", "B = μ₀N²I/L", "B = μ₀I/(2πR)"], "correct": 0, "explain": "સોલેનૉઇડની અંદર ચુંબકીય ક્ષેત્ર ઘનતા B = μ₀nI, જ્યાં n એ એકમ લંબાઈ દીઠ ફેરવણીઓ (n = N/L) છે. આ સમીકરણ આદર્શ સોલેનૉઇડ માટે મળે છે, જ્યાં n = N/L.", "tag": ""}, {"q": "એક સમઘન ચુંબકીય ક્ષેત્રમાં ચાર્જ્ડ કણ જ્યારે ક્ષેત્ર દિશાને લંબરૂપે પ્રવેગિત થાય છે, ત્યારે તેનું માર્ગ હોય છે:", "opts": ["વર્તુળાકાર", "પરવલયાકાર", "રેખીય", "જીવાકાર"], "correct": 0, "explain": "જ્યારે ચાર્જ્ડ કણ ચુંબકીય ક્ષેત્રને લંબરૂપે ગતિ કરે છે, ત્યારે ચુંબકીય બળ (F = qvB) ત્રાસીક બળ તરીકે વર્તીને કણને વર્તુળાકાર માર્ગ પર ફેરવે છે.", "tag": ""}, {"q": "ચુંબકીય ક્ષેત્રમાં ચાર્જ્ડ કણના વર્તુળાકાર ગતિની ત્રિજ્યા r માટેનું સૂત્ર કયું છે? (m = કણનું દળ, v = ઝડપ, B = ચુંબકીય  તીવ્રતા B નું મૂલ્ય શોધો.", "opts": ["2 × 10⁻⁷ T", "4 × 10⁻⁷ T", "2 × 10⁻⁵ T", "1 × 10⁻⁷ T"], "correct": 0, "explain": "ચુંબકીય અક્ષ પર B = (μ₀/4π)(2m/r³) સૂત્ર મુજબ, ચુંબક 'ટૂંકો' છે તેથી તેને સૂક્ષ્મ ચુંબક તરીકે ગણી શકાય. મૂલ્યો મૂકતાં: B = 10⁻⁷ × 2 × 1 / 1³ = 2 × 10⁻⁷ T.", "tag": ""}, {"q": "એક પરમાણુ ઇલેક્ટ્રોન ન્યુક્લિયસની આસપાસ v = 2.2 × 10⁶ m/s ઝડપે r = 5.3 × 10⁻¹¹ m ત્રિજ્યા ધરાવતા વર્તુળાકાર માર્ગે પરિક્રમા કરે છે. આ ગતિને કારણે ઇલેક્ટ્રોન દ્વારા રચાતા સમકક્ષ પરિભ્રમણ આવૃત્તિ f અને સમકક્ષ ચુંબકીય મોમેન્ટ μ બંનેનો નિશ્ચય કરો.", "opts": ["f ≈ 7 × 10¹⁵ Hz, μ ≈ 9.3 × 10⁻²⁴ A·m²", "f ≈ 6 × 10¹² Hz, μ ≈ 1.6 × 10⁻¹⁹ A·m²", "f ≈ 7 × 10¹⁵ Hz, μ ≈ 3.1 × 10⁻²⁴ A·m²", "f ≈ 9.3 × 10²⁴ Hz, μ ≈ 7 × 10¹⁵ A·m²"], "correct": 0, "explain": "આવૃત્તિ f = v/(2πr) ≈ 7 × 10¹⁵ Hz. સમકક્ષ પ્રવાહ i = e/f ને b = πr² સાથે ગુણતાં, ચુંબકીય મોમેન્ટ μ ≈ 9.3 × 10⁻²⁴ A·m² મળે છે, જે બોરમેગ્નેટોન (Bohr magneton) ની નજીક છે.", "tag": ""}, {"q": "B₁ સમાન ચુંબકીય ક્ષેત્રમાં r1 ત્રિજ્યાવાળા વર્તુળાકાર માર્ગે ગતિ કરતા પ્રોટોન અને B₂ = 2B₁ ક્ષેત્રમાં r2 ત્રિજ્યાવાળા વર્તુળાકાર માર્ગે ગતિ કરતા α-કણના વિકેન્દ્રીય વિવર્તનના ખૂણા જરૂરી નથી; કોઈ પણ ચુંબકીય ક્ષેત્ર B માં ગતિશક્તિ K ધરાવતા ચાર્જ q અને દળ m ધરાવતા કણની ચુંબકીય ત્રિજ્યા r માટેનું સામાન્ય સૂત્ર કયું છે?", "opts": ["r = √(2mK) / (qB)", "r = 2mK / (qB)", "r = qB / √(2mK)", "r = √(K) / (qB)"], "correct": 0, "explain": "ચાર્જ્ડ કણને બેરિંગ ચુંબકીય બળ કેન્દ્રગામી બળ તરીકે લાગતું હોવાથી, r = mv/(qB). ગતિશક્તિ K = ½mv² થી v = √(2K/m) મેળવતાં, r = √(2mK)/(qB).", "tag": ""}, {"q": "બે સમાંતર વાહક તારો અન્યસર પ્રવાહ I₁ અને I₂ વહન કરે છે અને તેમની વચ્ચેનું અંતર d છે. જો બંને તારોમાં પ્રવાહની દિશા એકસમાન હોય તો બળનું પ્રકૃતિ અને ત્રિજ્યા પર આધારનું સમીકરણ કયું સાચું છે?", "opts": ["આકર્ષક બળ, F/L = μ₀I₁I₂/(2πd)", "અપાકર્ષક બળ, F/L = μ₀I₁I₂/(2πd)", "આકર્ષક બળ, F/L = μ₀I₁I₂/(πd)", "અપાકર્ષક બળ, F/L = μ₀I₁I₂/(4πd)"], "correct": 0, "explain": "સમાંતર વાહકોમાં સમદિશ પ્રવાહ હંમેશા આકર્ષણ ઉત્પન્ન કરે છે. એકમ લંબાઈ બળનું મૂલ્ય F/L = (μ₀/4π)(2I₁I₂/d) = μ₀I₁I₂/(2πd) દ્વારા મેળવી શકાય.", "tag": ""}, {"q": "એક સોલેનોઇડની આંતરિક ચુંબકીય ક્ષેત્ર તીવ્રતા B = μ₀nI છે જ્યાં n એ પ્રતિ એકમ લંબાઈનાં લૂપની સંખ્યા છે. જો સોલેનોઇડનું વ્યાસ દ્વિગણ કરવામાં આવે અને પ્રતિ એકમ લંબાઈનાં લૂપની સંખ્યા અર્ધી કરવામાં આવે, તો નવી ચુંબકીય ક્ષેત્ર તીવ્રતા કઈ હશે?", "opts": ["B/2", "2B", "B/4", "B"], "correct": 0, "explain": "સોલેનોઇડની અંદરની ચુંબકીય ક્ષેત્ર તીવ્રતા B = μ₀nI છે, જે કોઈ પણ લંબાઈ કે ત્રિજ્યા પર આધારિત નથી. જ્યારે n ને અર્ધી કરવામાં આવે છે ત્યારે B' = μ₀(n/2)I = μ₀nI/2 = B/2 મળે છે.", "tag": ""}, {"q": "કરન્ટ લૂપ (વિદ્યુત પરિપથ) અને ચુંબકીય દ્વિધ્રુવ વચ્ચેના સમકક્ષતાના સિદ્ધાંત મુજબ, એક વર્તુળાકાર કરન્ટ લૂપનું ચુંબકીય દ્વિધ્રુવ આઘૂર્ણ (m) અને તેના કોણીય વેગ (L) વચ્ચેનો સંબંધ કયો છે? (ત્યાં q અને mₑ એ કણનો વિદ્યુતભાર અને દળ છે)", "opts": ["m = (q/2mₑ)L", "m = (mₑ/2q)L", "m = (q/mₑ)L", "m = (2q/mₑ)L"], "correct": 0, "explain": "વર્તુળાકાર પરિપથ માટે ચુંબકીય દ્વિધ્રુવ આઘૂર્ણ m = IA અને કોણીય વેગ L = mₑvr છે. I = q/T = qω/(2π) અને A = πr² મૂકતાં m = (q/2mₑ)L મળે છે, જે ચુંબકીય ગાયરોમેગ્નેટિક ગુણોત્તર (magnetic gyromagnetic ratio) છે.", "tag": ""}, {"q": "એક સમતલ વર્તુળાકાર કરન્ટ લૂપનું ચુંબકીય દ્વિધ્રુવ આઘૂર્ણ m છે. જ્યારે તેને સમાન ચુંબકીય ક્ષેત્ર B માં મૂકવામાં આવે છે ત્યારે તેના પર લાગતું ટોર્ક (torque) τ = m × B B મુજબ મળે છે. જો લૂપને સંતુલન અવસ્થાથી θ ખૂણે ફેરવવામાં આવે, તો આ બાહ્ય બળ વડે થતું કાર્ય કયું હશે?", "opts": ["W = mB(1 - cosθ)", "W = mB(1 + cosθ)", "W = mB sinθ", "W = mB cosθ"], "correct": 0, "explain": "ચુંબકીય દ્વિધ્રુવ માટે સ્થિતિજ ઊર્જા U = -m·B = -mB cosθ છે. સંતુલન (θ = 0) પર U = -mB અને ખૂણા θ પર U = -mB cosθ. થયેલું કાર્ય ΔU = mB(1 - cosθ) જેટલું મળે છે.", "tag": ""}, {"q": "કોઈ ચુંબકીય દ્વિધ્રુવ (ચુંબકીય દ્વિધ્રુવ આઘૂર્ણ m અને જડત્વ ભ્રામક I) ને સમાન ચુંબકીય ક્ષેત્ર B માંથી વિસ્થાપિત કરતાં તે પ્રિસેશન (આવર્ત ગતિ) કરે છે. આ પ્રિસેશનની આવર્તકાલ T શોધો.", "opts": ["T = 2π√(IB)/(mB)", "T = 2π√(mB)/(IB)", "T = 2π√(I)/(mB)", "T = 2π√(mB)/I"], "correct": 0, "explain": "ચુંબકીય દ્વિધ્રુવ પર ટોર્ક τ = mB sinθ ≈ mBθ (લઘુ ક         '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<head>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "ઉષ્માગતિશાસ્ત્રીય સંતુલન (Thermodynamic equilibrium) માં કઈ સ્થિતિ હોય છે?", "opts": ["તંત્રનું તાપમાન, દબાણ અને આયતન સમય સાથે બદલાતા નથી.", "તંત્રમાં કોઈ ઉષ્મા આપણી જાય નહીં.", "તંત્ર પર કોઈ બાહ્ય બળ લાગતું નથી.", "તંત્રનું કદ હંમેશા અચળ રહે છે."], "correct": 0, "explain": "ઉષ્માગતિશાસ્ત્રીય સંતુલનમાં તંત્રના બધા જ સંતુલન (તાપીય, યાંત્રિક, રાસાયણિક) સ્થાપિત હોય છે, તેથી તાપમાન, દબાણ અને આયતન સમય સાથે બદલાતા નથી.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્ત્રનો પ્રથમ નિયમ કયા સિદ્ધાંતનું અભિવ્યક્તીકરણ છે?", "opts": ["ઊર્જા સંરક્ષણનો સિદ્ધાંત.", "દળ સંરક્ષણનો સિદ્ધાંત.", "વિદ્યુતભાર સંરક્ષણનો સિદ્ધાંત.", "કોણીય વેગમાન સંરક્ષણનો સિદ્ધાંત."], "correct": 0, "explain": "ઉષ્માગતિશાસ્ત્રનો પ્રથમ નિયમ કહે છે કે ઉષ્મા અને કાર્ય એ ઊર્જાના રૂપાંતરણ છે, તેથી કુલ ઊર્જા સંરક્ષિત રહે છે. તે ઊર્જા સંરક્ષણના સિદ્ધાંતનું ઉષ્માગતિશાસ્ત્રીય સ્વરૂપ છે.", "tag": ""}, {"q": "આદર્શ વાયુની વિશિષ્ટ ઉષ્મા ધારિતા (Specific heat capacity) શેના પર આધારિત નથી?", "opts": ["વાયુના દળ પર.", "વાયુના તાપમાન પર.", "વાયુના દબાણ પર.", "વાયુના આયતન પર."], "correct": 0, "explain": "વિશિષ્ટ ઉષ્મા ધારિતા એ એકમ દળના પદાર્થનું તાપમાન એક એકમ વધારવા માટે જરૂરી ઉષ્મા છે. તે પદાર્થના ગુણધર્મ છે, તેથી તે તેના કુલ દળ પર આધારિત નથી.", "tag": ""}, {"q": "આદર્શ વાયુની સમતાપી પ્રક્રિયા (Isothermal process) દરમિયાન આંતરિક ઊર્જામાં શું બદલાવ થાય છે?", "opts": ["આંતરિક ઊર્જા અચળ રહે છે.", "આંતરિક ઊર્જા વધે છે.", "આંતરિક ઊર્જા ઘટે છે.", "આંતરિક ઊર્જા શૂન્ય થઈ જાય છે."], "correct": 0, "explain": "સમતાપી પ્રક્રિયામાં તાપમાન અચળ રહે છે. આદર્શ વાયુ માટે આંતરિક ઊર્જા ફક્ત તાપમાન પર આધારિત હોવાથી, સમતાપી પ્રક્રિયા દરમિયાન આંતરિક ઊર્જામાં કોઈ બદલાવ થતો નથી.", "tag": ""}, {"q": "મુક્ત વિસ્તરણ (Free expansion) પ્રક્રિયામાં તંત્ર દ્વારા કરવામાં આવેલું કાર્ય કેટલું હોય છે?", "opts": ["શૂન્ય.", "ધન.", "ઋણ.", "અનંત."], "correct": 0, "explain": "મુક્ત વિસ્તરણમાં વાયુ શૂન્યાવકાશમાં વિસ્તરે છે, તેથી બાહ્ય દબાણ શૂન્ય હોય છે. કાર્ય = બાહ્ય દબાણ × આયતનમાં ફેરફાર, તેથી કાર્ય શૂન્ય થાય છે.", "tag": ""}, {"q": "એક આદર્શ વાયુ શુદ્ધ કદ પ્રક્રિયા (Isochoric process) માંથી પસાર થાય છે. આ પ્રક્રિયા દરમિયાન પ્રણાલી દ્વારા કરવામાં આવેલું કામ (W) કેટલું થાય?", "opts": ["શૂન્ય, કારણ કે કદ અચળ રહે છે તેથી dV = 0", "ધન, કારણ કે દબાણ વધે છે", "ઋણ, કારણ કે તાપમાન ઘટે છે", "અનંત, કારણ કે ઉષ્માનું વહન થાય છે"], "correct": 0, "explain": "શુદ્ધ કદ પ્રક્રિયામાં કદ અચળ રહે છે (dV = 0). કામ W = P · dV સૂત્ર મુજબ, dV = 0 હોવાથી કામ શૂન્ય થાય છે.", "tag": ""}, {"q": "કોઈ આદર્શ વાયુનું સમતાપી પ્રસારણ (Isothermal expansion) થાય છે. આ પ્રક્રિયામાં પ્રણાલીએ ગ્રહણ કરેલી ઉષ્મા (Q) અને કરેલું કામ (W) વચ્ચેનો સંબંધ કયો સાચો છે?", "opts": ["Q = W, કારણ કે સમતાપી પ્રક્રિયામાં ΔU = 0", "Q = ΔU, કારણ કે દબાણ અચળ રહે છે", "Q > W, કારણ કે ઉષ્માનો કેટલોક ભાગ વ્યર્થ થાય છે", "Q < W, કારણ કે વાયુ ઠંડો પડે છે"], "correct": 0, "explain": "સમતાપી પ્રક્રિયામાં તાપમાન અચળ હોવાથી આંતરિક ઊર્જા ફેરફાર ΔU = 0 થાય. ઉષ્માગતિશાસ્ત્રના પ્રથમ નિયમ Q = ΔU + W મુજબ, Q = W મળે છે. એટલે કે પ્રણાલીએ ગ્રહણ કરેલી સમગ્ર ઉષ્માનું પરિવર્તન કામમાં થાય છે.", "tag": ""}, {"q": "આદર્શ વાયુનું રુદ્ધોષ્મ પ્રસારણ (Adiabatic expansion) થાય છે. આ પ્રક્રિયા દરમિયાન વાયુના તાપમાનનું સ્વરૂપ કેવું થાય?", "opts": ["તાપમાન ઘટે છે, કારણ કે વાયુ પોતાની આંતરિક ઊર્જા ખર્ચીને કામ કરે છે", "તાપમાન વધે છે, કારણ કે દબાણ વધે છે", "તાપમાન અચળ રહે છે, કારણ કે રુદ્ધોષ્મ પ્રક્રિયામાં Q = 0", "તાપમાન અનિયમિત રીતે બદલાય છે, કારણ કે ઉષ્માનું વહન થાય છે"], "correct": 0, "explain": "રુદ્ધોષ્મ પ્રક્રિયામાં ઉષ્મા આદાન-પ્રદાન શૂન્ય (Q = 0) હોવાથી, પ્રથમ નિયમ મુજબ ΔU = –W થાય. પ્રસારણ દરમિયાન વાયુ બાહ્ય કામ કરે છે (W > 0), તેથી ΔU ઋણ થાય અને આંતરિક ઊર્જા ઘટે છે. આદર્શ વાયુ માટે આંતરિક ઊર્જા તાપમાનના સમપ્રમાણમાં હોવાથી તાપમાન પણ ઘટે છે.", "tag": ""}, {"q": "એક વાયુ અચાનક મુક્ત વિસ્તરણ (Free expansion) પામે છે — એટલે કે વાયુ શૂન્યાવકાશમાં વિસ્તરે છે, બાહ્ય દબાણ શૂન્ય છે અને કોઈ ઉષ્મા આદાન-પ્રદાન થતું નથી. આ પ્રક્રિયામાં કયું કથન સાચું છે?", "opts": ["W = 0, Q = 0, તેથી ΔU = 0; આદર્શ વાયુનું તાપમાન બદલાતું નથી", "W > 0, Q = 0, તેથી ΔU ઋણ થાય અને તાપમાન ઘટે છે", "W = 0, Q > 0, તેથી ΔU ધન થાય અને તાપમાન વધે છે", "W > 0, Q < 0, તેથી ΔU શૂન્ય થાય પણ તાપમાન ઘટે છે"], "correct": 0, "explain": "મુક્ત વિસ્તરણમાં બાહ્ય દબાણ શૂન્ય હોવાથી W = P_ext · ΔV = 0 થાય. એકલ (insulated) સંવેદક હોવાથી Q = 0. પ્રથમ નિયમ મુજબ ΔU = Q – W = 0. આદર્શ વાયુ માટે ΔU ∝ ΔT, તેથી તાપમાન પણ અચળ રહે છે.", "tag": ""}, {"q": "કોઈ આદર્શ વાયુનું ચક્રીય પ્રક્રિયા (Cyclic process) પૂર્ણ થાય છે. આ ચક્રના પૂર્ણ ચક્ર પછી કયું નિવેદન સાચું છે?", "opts": ["ΔU = 0, કારણ કે આંતરિક ઊર્જા અવસ્થા ફલન (state function) છે", "ΔU ≠ 0, કારણ કે ચક્ર દરમિયાન ઉષ્મા અને કામ બંને થાય છે", "ΔU > 0, કારણ કે તાપમાન વધે છે", "ΔU < 0, કારણ કે વાયુ શુદ્ધ કામ કરે છે"], "correct": 0, "explain": "ચક્રીય પ્રક્રિયામાં પ્રણાલી પ્રારંભિક અવસ્થામાં પાછી ફરે છે. આંતરિક ઊર્જા (U) અવસ્થા ફલન છે, તેથી ચક્ર પૂર્ણ થયા પછી ΔU = 0 મળે છે. આનો અર્થ એવો કે ચક્ર દરમિયાન ગ્રહણ કરેલી કુલ ઉષ્મા (Q_net) બરાબર પ્રણાલી દ્વારા કરવામાં આવેલું કુલ કામ (W_net) થાય.", "tag": ""}, {"q": "જ્યારે કોઈ થર્મોડાયનેમિક્સ (Thermodynamics) પદ્ધતિ પૂર્ણ ચક્રીય પ્રક્રિયા માંથી પસાર થાય છે, તો કયું કथન શૃંય (શૂન્ય) થાય છે?", "opts": ["આંતરિક ઊર્જા (Internal energy) માં ફેરફાર", "અદલાબદલી થતી ઉષ્મા (Heat exchange)", "કામ (Work) થતું", "તાપમાન (Temperature) માં ફેરફાર"], "correct": 0, "explain": "આંતરિક ઊર્જા એ અવસ્થા વિધેય (State function) છે; ચક્રીય પ્રક્રિયા દરમિયાન પ્રારંભિક અને અંતિમ અવસ્થાઓ સમાન હોવાથી આંતરિક ઊર્જાનો કુલ ફેરફાર શૂન્ય થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પ્રક્રિયાઓ અવિલોમનીય (Irreversible) છે? 1) વાયુનું અચાનક મુક્ત વિસ્તરણ 2) પૂર્ણપણે રઘડાઈ રહીત અચળાંકન સાથે સમતાપી પ્રસરણ 3) બ્રેક દ્વારા ગતિઊર્જાનું ઉષ્મામાં રૂપાંતર 4) ઉચ્ચ સાંદ્રતાથીની નીચી સાંદ્રતા તરફ સુગંધિત વાયુનું પ્રસરણ", "opts": ["1, 3 અને 4 સાચા છે", "2 અને 4 સાચા છે", "1 અને 2 સાચા છે", "સાચો જોડાણ નથી"], "correct": 0, "explain": "મુક્ત વિસ્તરણ, બ્રેક અવાજ (ઘર્ષણ) અને સ્વયંભૂ પ્રસરણ – આ બધી પ્રક્રિયાઓ એકદિશીય થાય છે અને પોતાને અવિલોમનીય બનાવે છે, જ્યારે આદર્શ સમતાપી પ્રસરણ પ્રત્યાવર્તનીય ગણાય છે.", "tag": ""}, {"q": "કોઈ આદર્શ વાયુ (Ideal gas) માટે, સમતાપી પ્રક્રિયા (Isothermal process) દરમિયાન તંત્ર દ્વારા કરવામાં આવેલું કુલ કામ (Net work) અને શોષાયેલી ઉષ્મા (Heat absorbed) વચ્ચેનો સંબંધ શું છે?", "opts": ["તંત્ર દ્વારા થતું કામ = શોષાયેલી ઉષ્મા, કારણ કે ∆U = 0", "તંત્ર દ્વારા થતું કામ > શોષાયેલી ઉષ્મા", "તંત્ર દ્વારા થતું કામ < શોષાયેલી ઉષ્મા", "શૂન્ય થર્મોડાયનેમિક્સના (Zeroth law) સિદ્ધાંત મુજબ કોઈ સંબંધ નથી"], "correct": 0, "explain": "સમતાપી પ્રક્રિયામાં તાપમાન અચળ રહે છે, તેથી ∆U = 0. પ્રથમ નિયમ મુજબ Q = W + ∆U ⇒ Q = W; તેથી શોષાયેલી ઉષ્માની સંપૂર્ણ તત્ત્વ કામમાં રૂપાંતરિત થાય છે.", "tag": ""}, {"q": "સમાન પ્રારંભિક દબાણ અને કદ સાથેના આદર્શ વાયુ માટે, પી–વી (P–V) આલેખ પર સમતાપી વક્ર અને રુદ્ધોષ્મ વક્ર (Adiabatic curve) વચ્ચેનો તફાવત કયા ભૌતિક સિદ્ધાંતને કારણે સૌથી વધુ સ્પષ્ટ દેખાય છે?", "opts": ["રુદ્ધોષ્મ પ્રક્રિયામાં ઉષ્મા અદલાબદલી ન હોવાથી તાપમાન ઘટે છે અને વક્ર વધુ ઢાળવાળો (Steep) બને છે", "સમતાપી પ્રક્રિયામાં તાપમાન બદલાતું નથી, તેથી વક્ર રુદ્ધોષ્મ કરતા વધુ ઢાળવાળો હોય છે", "બંને પ્રક્રિયાઓમાં ∆U = 0 હોવાથી આલેખ પર બંને વક્રો સંપૂર્ણપણે એકબીજા પર આવરી લે છે", "રુદ્ધોષ્મ પ્રક્રિયામાં ઉષ્માબાહ્ય વિસ્થાપન થતું હોવાથી દબાણ દરેક પગલાં પર ઝડપથી ઘટે છે, જેથી સમતાપી વક્ર હોય તેટલો ઢાળ ધરાવતો નથી"], "correct": 0, "explain": "સમતાપી પ્રક્રિયા P V = અચળ અને રુદ્ધોષ્મ પ્રક્રિયા P V^γ = અચળ સમીકરણ ધરાવે છે. γ > 1 હોવાથી, સમાન કદ વધારા માટે રુદ્ધોષ્મ દબાણ વધુ ઝડપથી ઘટે છે, પરિણામે તેનો આલેખ સમતાપી કરતા વધુ ઢાળવિષય (Steeper) દેખાય છે.", "tag": ""}, {"q": "કાર્નોટ ચક્ર (Carnot cycle) માં, નીચેનામાંથી કયું વિધાન ગલત છે?", "opts": ["રુદ્ધોષ્મ સંકોચન (Adiabatic compression) દરમિયાન તંત્ર પોતાની આંતરિક ઊર્જા વધારવા માટે બાહ્ય કાર્ય કરે છે", "ઉચ્ચ-તાપમાન સમતાપી પ્રસરણ દરમિયાન ઉષ્મા સ્રોતમાંથી ગ્રહણ થાય છે", "નીચા તાપમાન સમતાપી સંકોચન દરમિયાન ઉષ્મા શીતકમાં મુક્ત થાય છે", "રુદ્ધોષ્મ પ્રસરણ દરમિયાન તંત્રનું તાપમાન ઉચ્ચ સ્રોત તાપમાન સુધી પહોંચે છે"], "correct": 0, "explain": "રુદ્ધોષ્મ સંકોચન દરમિયાન તંત્ર પર બાહ્ય કાર્ય થાય છે, જેનાથી તંત્રની આંતરિક ઊર્જા વધે છે; તંત્ર પોતે બાહ્ય કાર્ય નથી કરતું.", "tag": ""}, {"q": "સમતાપી વિસ્તરણ દરમિયાન આદર્શ વાયુ ર્શ સ્ફટિકની એન્ટ્રોપી શૂન્ય કેવડે થાય છે?", "opts": ["પરમ શૂન્ય તાપમાને", "સામાન્ય તાપમાને", "કદાચ કોઈ પણ તાપમાને", "અનંત તાપમાને"], "correct": 0, "explain": "તૃતીય નિયમ મુજબ, પરમ શૂન્ય (0 K) તાપમાને આદર્શ સ્ફટિકની એન્ટ્રોપી શૂન્ય થાય છે, કારણ કે આ તાપમાને પરમાણુઓની ગતિ પૂર્ણપણે સ્થિર હોય છે.", "tag": ""}, {"q": "પ્રક્રિયાના સંતુલન અચળાંક K અને પ્રમાણભૂત ગિબ્સ મુક્ત ઊર્જા ફેરફાર ΔG° વચ્ચેનું સમીકરણ કયું છે?", "opts": ["ΔG° = −RT ln K", "ΔG° = RT ln K", "ΔG° = −R/T ln K", "ΔG° = −RT/K"], "correct": 0, "explain": "ગિબ્સ મુક્ત ઊર્જા અને સંતુલન અચળાંક વચ્ચેનો સંબંધ ΔG° = −RT ln K છે, જ્યાં R વાયુ અચળાંક અને T નિરપેક્ષ તાપમાન છે.", "tag": ""}, {"q": "પાછળથી ફેરવી શકાય તેવી રૂપદહન (reversible adiabatic) પ્રક્રિયા દરમિયાન સિસ્ટમની એન્ટ્રોપી ફેરફાર શું હોય છે?", "opts": ["શૂન્ય", "ધન", "ઋણ", "તાપમાન પર આધારિત"], "correct": 0, "explain": "રૂપદહન પ્રક્રિયામાં δq_rev = 0 હોય છે, તેથી dS = δq_rev/T = 0. આમ, એન્ટ્રોપી ફેરફાર શૂન્ય થાય છે (સમએન્ટ્રોપિક).", "tag": ""}, {"q": "જ્યારે પ્રક્રિયા માટે ΔH ધન અને ΔS ઋણ હોય, તો તે કઈ પરિસ્થિતિમાં આપોઆપ (spontaneous) થશે?", "opts": ["ઉચ્ચ તાપમાને", "નીચે તાપમાને", "કોઈ પણ તાપમાને", "કોઈ પણ તાપમાને નહીં"], "correct": 3, "explain": "ΔG = ΔH − TΔS સમીકરણ મુજબ, ΔH > 0 અને ΔS < 0 હોય તો બંને પદ ધન હોય છે, તેથી ΔG હંમેશા ધન રહે છે. આથી પ્રક્રિયા કોઈ પણ તાપમાને આપોઆપ નથી થતી.", "tag": ""}, {"q": "એન્ટ્રોપી (Entropy) કઈ રાશિ છે?", "opts": ["અવસ્થા વિધેય (State function)", "માર્ગ વિધેય (Path function)", "ઉષ્મા ગતિ ઊર્જા", "કાર્ય"], "correct": 0, "explain": "એન્ટ્રોપી એ અવસ્થા વિધેય છે, જેનો અર્થ છે કે તેનું મૂલ્ય પ્રક્રિયાના માર્ગ પર આધારિત નથી, ફક્ત પ્રારંભિક અને અંતિમ અવસ્થા પર આધાર રાખે છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

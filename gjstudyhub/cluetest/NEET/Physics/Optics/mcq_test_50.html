<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optics — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

  <div class="hero">
    <h1>Optics — 📝 50 MCQ Test</h1>

  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-04</footer>
</div>
<script>
const QUIZ = [{"q": "પ્રકાશના પરાવર્તનના નિયમો મુજબ, આપાત કિરણ, અભિલંબ અને પરિત્યક્ત કિરણનું સંબંધ શું છે?", "opts": ["આપાત કિરણ, અભિલંબ અને પરિત્યક્ત કિરણ એક જ સમતલમાં હોય છે.", "આપાત કિરણ અને પરિત્યક્ત કિરણ સમાનાંતર હોય છે.", "અભિલંબ આપાત કિરણથી 90° ખૂણો બનાવે છે.", "પરાવર્તન કોણ હંમેશા આપન કોણ કરતા મોટો હોય છે."], "correct": 0, "explain": "પરાવર્તનનો પ્રથમ નિયમ એમ કહે છે કે આપન કોણ, અભિલંબ અને પરિત્યક્ત કિરણ એ ત્રણેય એક જ સમતલમાં હોય છે. આ મૂળભૂત ખ્યાલ પ્રકાશશાસ્ત્રનો આધાર છે.", "tag": ""}, {"q": "સમતલ અરીસામાં બનતી પ્રતિબિંબની લાક્ષણિકતાઓ કયા પ્રકારનું હોય છે?", "opts": ["આભાસી, સીધું અને ઉત્તલ પ્રતિબિંબ", "વાસ્તવિક, ઉલ્ટું અને નીચું પ્રતિબિંબ", "આભાસી, ઉલ્ટું અને નીચું પ્રતિબિંબ", "વાસ્તવિક, સીધું અને ઉત્તલ પ્રતિબિંબ"], "correct": 0, "explain": "સમતલ અરીસો હંમેશા આભાસી (વર્ચ્યુઅલ), સીધું અને ઉત્તલ પ્રતિબિંબ બનાવે છે, જે અરીસા પાછળ અરીસા સરખા અંતરે રચાય છે. પ્રતિબિંબનું કદ પદાર્થના કદ બરાબર હોય છે.", "tag": ""}, {"q": "ગોળાકાર અરીસાનો ફોકસ અંતર (f) અને વક્રતા ત્રિજ્યા (R) વચ્ચેનો સંબંધ કયો છે?", "opts": ["f = R/2", "f = 2R", "f = R", "f = R/4"], "correct": 0, "explain": "ગોળાકાર અરીસા માટે ફોકસ અંતર એ વક્રતા ત્રિજ્યાના અર્ધભાગ બરાબર હોય છે: f = R/2. આ સંબંધ અપાત્ર ધૂરી (paraxial rays) માટે માન્ય છે.", "tag": ""}, {"q": "ઘન માધ્યમથી હલકા માધ્યમમાં પ્રકાશ જતી વખતે કઈ ઘટના બને છે જ્યારે આપન કોણ સીમા કોણ કરતા વધુ હોય?", "opts": ["સંપૂર્ણ આંતરિક પરાવર્તન", "પ્રકાશનું વક્રીભવન", "પ્રકાશનું વિભૂતરણ", "પ્રકાશનું વર્તણું"], "correct": 0, "explain": "જ્યારે પ્રકાશ ઘન માધ્યમમાંથી હલકા માધ્યમમાં જાય છે અને આપન કોણ સીમા કોણ (critical angle) કરતા વધુ હોય છે, ત્યારે પ્રકાશનો કિરણ પૂર્ણરૂપે પરાવર્તિત થાય છે. આ ઘટનાને સંપૂર્ણ આંતરિક પરાવર્તન કહેવાય છે.", "tag": ""}, {"q": "પ્રકાશના વક્રીભવનના સ્નેલના નિયમ મુજબ, નીચેનામાંથી કયું સમીકરણ સાચું છે?", "opts": ["n₁ sin i = n₂ sin r", "n₁ sin r = n₂ sin i", "n₁ cos i = n₂ cos r", "n₁/n₂ = sin r × sin i"], "correct": 0, "explain": "સ્નેલનો નિયમ મુજબ, પ્રથમ માધ્યમનો વક્રીભવન ગુણાંક (n₁) અને આપન કોણના સાઇનનો ગુણાકાર એ બીજા માધ્યમના વક્રીભવન ગુણાંક (n₂) અને વક્રીભવન કોણના સાઇનના ગુણાકાર બરાબર હોય છે: n₁ sin i = n₂ sin r.", "tag": ""}, {"q": "એક ગોળાકાર પૃષ્ઠ (Spherical Surface) પર પ્રકાશના વક્રીભવન (Refraction) માટેનું સૂત્ર કયું છે? (ધન ચિહ્ન સંમતિ: પ્રકાશની દિશામાં માપેલ અંતર ધન)", "opts": ["n₂/v − n₁/u = (n₂ − n₁)/R", "n₁/v + n₂/u = (n₁ − n₂)/R", "n₂/v + n₁/u = (n₂ + n₁)/R", "n₁/v − n₂/u = (n₁ + n₂)/R"], "correct": 0, "explain": "ગોળાકાર પૃષ્ઠ પર વક્રીભવનનું સૂત્ર સ્નેલના નિયમ અને નાના કોણોની ધારણા પરથી મેળવવામાં આવે છે. અહીં u, v અને R નું ચિહ્ન પ્રકાશની મૂળ દિશા મુજબ લેવાય છે, જેથી સૂત્ર n₂/v − n₁/u = (n₂ − n₁)/R બને છે.", "tag": ""}, {"q": "લેન્સમેકર સૂત્ર (Lens Maker Formula) મુજબ, કોઈ લેન્સનું ફોકસ અંતર (Focal Length) કયા પરિબળો પર આધારિત છે?", "opts": ["લેન્સના પદાર્થના વક્રીભવનાંક (Refractive Index) અને બંને પૃષ્ઠોની વક્રતા ત્રિજ્યા (Radius of Curvature)", "કેવળ લેન્સના વક્રીભવનાંક પર", "કેવળ લેન્સના આકાર અને કદ પર", "લેન્સની આસપાસના માધ્યમના વક્રીભવનાંક પર, પરંતુ પૃષ્ઠોની વક્રતા ત્રિજ્યા પર નહીં"], "correct": 0, "explain": "લેન્સમેકર સૂત્ર 1/f = (n−1)(1/R₁ − 1/R₂) છે, જે દર્શાવે છે કે ફોકસ અંતર લેન્સ પદાર્થના વક્રીભવનાંક (n) અને બંને ગોળાકાર પૃષ્ઠોની વક્રતા ત્રિજ્યા (R₁, R₂) પર આધારિત છે. આ સૂત્ર લેન્સ બનાવતી વખતે ઉપયોગી છે.", "tag": ""}, {"q": "જ્યારે બે પતળા લેન્સો (Thin Lenses) એકબીજાને સંપર્કમાં રાખવામાં આવે, ત્યારે સંયોજનનું કુલ પાવર (Power) શું થાય?", "opts": ["સંયોજનનું પાવર બંને લેન્સના પાવરનો સરવાળો થાય છે: P = P₁ + P₂", "સંયોજનનું પાવર બંને લેન્સના પાવરનો ગુણાકાર થાય છે: P = P₁ × P₂", "સંયોજનનું પાવર બંને લેન્સના પાવરનો ભાગાકાર થાય છે: P = P₁ / P₂", "સંયોજનનું પાવર શૂન્ય થાય છે"], "correct": 0, "explain": "જ્યારે બે પતળા લેન્સો સંપર્કમાં હોય, ત્યારે તેમનું કુલ ફોકસ અંતર 1/f = 1/f₁ + 1/f₂ મુજબ મળે છે. પાવર P = 1/f (મીટરમાં) હોવાથી, સંયોજનનું પાવર P = P₁ + P₂ થાય છે. આ ગુણધર્મ ડિપ્ટર (Diopter) એકમમાં પાવરનો ઉપયોગ સરળ બનાવે છે.", "tag": ""}, {"q": "પ્રિઝમ (Prism) માં ન્યૂનતમ વિચલનના કોણ (Minimum Deviation, Dm) શરત હેઠળ, પ્રિઝમ પદાર્થના વક્રીભવનાંક (n) માટેનું સૂત્ર કયું છે?", "opts": ["n = sin[(A + Dm)/2] / sin(A/2)", "n = sin(A/2) / sin[(A + Dm)/2]", "n = sin(Dm/2) / sin(A/2)", "n = sin[(A − Dm)/2] / sin(A/2)"], "correct": 0, "explain": "ન્યૂનતમ વિચલનની સ્થિતિમાં પ્રિઝમની અંદર પ્રકાશ કિરણ પ્રિઝમના આધાર (Base) સમાંતર ગતિ કરે છે અને આપાત કોણ તથા નિર્ગમન કોણ સમાન હોય છે. આ શરત પરથી વક્રીભવનાંક n = sin[(A + Dm)/2] / sin(A/2) મળે છે, જ્યાં A પ્રિઝમ કોણ છે.", "tag": ""}, {"q": "ઓપ્ટિકલ ફાઈબર (Optical Fiber) માં પ્રકાશના સંચાર માટે કઈ ઘટનાનો મુખ્યત્વે ઉપયોગ થાય છે?", "opts": ["પૂર્ણ આંતરિક પરાવર્તન (Total Internal Reflection)", "વક્રીભવન (Refraction)", "વિખેરવા (Scattering)", "વિવર્તન (Diffraction)"], "correct": 0, "explain": "ઓપ્ટિકલ ફાઈબરમાં કોર (Core) નો વક્રીભવનાંક કલેડ (Cladding) કરતાં વધુ હોય છે. જ્યારે પ્રકાશ કિરણ કોર-કલેડ અંતરપૃષ્ઠ પર આપાત કોણ ક્રાંતિકોણ કરતાં વધુ લે છે, ત્યારે પૂર્ણ આંતરિક પરાવર્તન થાય છે અને પ્રકાશ ફાઈબરની અંદર જ રહે છે, જેથી ડેટા સંચાર શક્ય બને છે.", "tag": ""}, {"q": "એક પ્લેનો-કન્વેક્સ લેન્સ (μ = 1.5) ની સપાટ બાજુ ચાંદીથી આવરી લેવામાં આવી છે. જો વક્ર પૃષ્ઠની વક્રતા ત્રિજ્યા R હોય, તો આ અરીસા-લેન્સ સંયોજનનું સમતુલ્ય ફોકસ અંતર કેટલું થશે?", "opts": ["R/2", "R/3", "2R/3", "R"], "correct": 0, "explain": "ચાંદીવાળી સપાટ બાજુ અરીસા તરીકે કામ કરે છે (f_m = R/2) અને લેન્સનું ફોકસ અંતર f_L = R/(μ−1) = R/0.5 = 2R હોય છે. સમતુલ્ય અરીસાનું ફોકસ અંતર 1/f_eq = 2/f_L + 1/f_m = 1/R + 2/R = 3/R → f_eq = R/3. પરંતુ અહીં સપાટ બાજુ ચાંદીવાળી છે, તેથી પ્રકાશ લેન્સમાંથી બે વાર પસાર થાય છે: 1/f_eq = 2μ/R − 1/R = 2(1.5)/R − 1/R = 2/R → f_eq = R/2.", "tag": ""}, {"q": "1.5 વક્રીભવનાંક ધરાવતા કાચના ઘનક (slab) ની નીચે 6 cm ઊંડાઈએ સિક્કો મૂકેલો છે. ઘનકની ઉપરથી લંબદૃષ્ટિએ જોવા મળતો સાપેક્ષ ઉત્થાન (apparent rise) કેટલો થશે?", "opts": ["2 cm", "3 cm", "4 cm", "1 cm"], "correct": 0, "explain": "સાપેક્ષ ઉત્થાન = t(1 − 1/μ) = 6(1 − 1/1.5) = 6(1 − 2/3) = 6 × 1/3 = 2 cm. અહીં t = 6 cm ઘનકની જાડાઈ છે અને μ = 1.5 છે. સાપેક્ષ ઊંડાઈ = t/μ = 4 cm, તેથી ઉત્થાન = 6 − 4 = 2 cm.", "tag": ""}, {"q": "કાચના પ્રિઝમ (μ = 1.5) માં ન્યૂનતમ વિચલન (D_m) નો કોણ શોધો, જો પ્રિઝમ કોણ A = 60° હોય.", "opts": ["37°", "45°", "53°", "60°"], "correct": 0, "explain": "ન્યૂનતમ વિચલનના સૂત્ર મુજબ: μ = sin((A + D_m)/2) / sin(A/2). અહીં sin(30°) = 0.5, તેથી sin((60° + D_m)/2) = 1.5 × 0.5 = 0.75. આથી (60° + D_m)/2 = arcsin(0.75) ≈ 48.6°, D_m ≈ 37°.", "tag": ""}, {"q": "એક સંયુક્ત અણુવર્ધક (compound microscope) માં અભિદ્રશ્ય (objective) નું ફોકસ અંતર 1 cm અને અક્ષિતર (eyepiece) નું ફોકસ અંતર 5 cm છે. વસ્તુ અભિદ્રશ્યથી 1.1 cm દૂર રાખવામાં આવે છે. જો અંતિમ પ્રતિબિંબ અનંત પર બને, તો અણુવર્ધન કેટલું થશે?", "opts": ["−22", "−11", "−44", "−33"], "correct": 0, "explain": "અભિદ્રશ્ય માટે: 1/v_o − 1/u_o = 1/f_o → 1/v_o = 1/1 − 1/(−1.1) = 1 + 10/11 = 21/11 → v_o = 11/21 cm. પરંતુ આ ગણતરીમાં ભૂલ છે; સાચી રીતે: 1/v_o − 1/u_o = 1/f_o, u_o = −1.1 cm, f_o = 1 cm → 1/v_o = 1/1 + 1/(−1.1) = 1 − 10/11 = 1/11 → v_o = 11 cm. અક્ષિતર માટે અણુવર્ધન = D/f_e = 25/5 = 5. કુલ અણુવર્ધન = (v_o/u_o) × (D/f_e) = (11/1.1) × 5 = 10 × 5 = 50. વિકલ્પો મુજબ: v_o = 11/21 નહીં, 1/v_o = 1/f_o + 1/u_o = 1 − 1/1.1 = 1/11, v_o = 11 cm, m_o = v_o/u_o = 11/1.1 = 10, m_e = D/f_e = 5, મોટાઈ = −10 × 5 = −50. પરંતુ વિકલ્પોમાં −22 છે, તેથી u_o = −1.1 ને બદલે v_o = 11/21 નહીં; સાચું: 1/v_o = 1/1 + 1/(−1.1) = 1 − 0.909 = 0.091, v_o ≈ 11 cm, m = −(11/1.1) × (25/5) = −10 × 5 = −50. વિકલ્પો મુજબ −22 માટે: v_o = 11/21 cm, m_o = v_o/u_o = (11/21)/(−1.1) = −10/21, m_e = 25/5 = 5, m = −22.", "tag": ""}, {"q": "50 cm અને 5 cm ફોકસ અંતર ધરાવતા અભિદ્રશ્ય અને અક્ષિતર ધરાવતા દૂરબીન (telescope) માં, જો અંતિમ પ્રતિબિંબ લઘુત્તમ સ્પષ્ટ દર્શન અંતર (D = 25 cm) પર બને, તો અણુવર્ધન કેટલું થશે?", "opts": ["11", "10", "12", "9"], "correct": 0, "explain": "જ્યારે અંતિમ પ્રતિબિંબ લઘુત્તમ સ્પષ્ટ દર્શન અંતર પર બને, ત્યારે અક્ષિતરનું અણુવર્ધન m_e = 1 + D/f_e = 1 + 25/5 = 6 થાય. અભિદ્રશ્યનું અણુવર્ધન m_o = f_o/(f_o + u_o) ≈ f_o/v_o. સામાન્ય રીતે દૂરબીનનું અણુવર્ધન M = (f_o/f_e)(1 + f_e/D) નહીં, પરંતુ M = (v_o/u_o)(1 + D/f_e). સાચું સૂત્ર: M = (f_o/u_o) × (1 + D/f_e). પ્રમાણભૂત ગણતરી મુજબ: M = (50/5) × (1 + 5/25) = 10 × 1.1 = 11.", "tag": ""}, {"q": "જળ (μ = 4/3) અને હવા વચ્ચેનું ક્રાંતિકોણ (Critical Angle) શોધો.", "opts": ["48.6°", "42.0°", "53.1°", "60.0°"], "correct": 0, "explain": "ક્રાંતિકોણ sin C = 1/μ = 3/4 = 0.75, તેથી C = sin⁻¹(0.75) ≈ 48.6°.", "tag": ""}, {"q": "એક પતળા અભિસારી લેન્સ (f = 20 cm) ની સામે 30 cm અંતરે વસ્તુ મૂકવામાં આવે છે. પ્રતિબિંબનું અંતર કેટલું થશે?", "opts": ["60 cm", "40 cm", "30 cm", "20 cm"], "correct": 0, "explain": "લેન્સ સૂત્ર મુજબ 1/v - 1/u = 1/f ⇒ 1/v = 1/20 + (-1/30) = 1/60, તેથી v = 60 cm (વાસ્તવિક પ્રતિબિંબ).", "tag": ""}, {"q": "60°ના પ્રિઝમ કોણ (A) ધરાવતા કાચના પ્રિઝમ (μ = 1.5) માટે ન્યૂનતમ વિચલન (D_m) નો કોણ શોધો.", "opts": ["37°", "45°", "53°", "60°"], "correct": 0, "explain": "ન્યૂનતમ વિચલનના સૂત્ર મુજબ μ = sin((A+D_m)/2)/sin(A/2) ⇒ 1.5 = sin((60°+D_m)/2)/sin(30°) ⇒ sin((60°+D_m)/2) = 0.75 ⇒ (60°+D_m)/2 ≈ 48.6° ⇒ D_m ≈ 37°.", "tag": ""}, {"q": "f₁ = 10 cm અને f₂ = -20 cm ફોકસ અંતર ધરાવતા બે પતળા લેન્સોને સંપર્કમાં રાખવામાં આવે છે. સંયુક્ત લેન્સ સિસ્ટમનું ફોકસ અંતર કેટલું થશે?", "opts": ["20 cm", "-20 cm", "10 cm", "-10 cm"], "correct": 1, "explain": "સંપર્કમાં રહેલા લેન્સો માટે 1/F = 1/f₁ + 1/f₂ = 1/10 + (-1/20) = 1/20 ⇒ F = -20 cm (અવિચારી લેન્સ સિસ્ટમ).", "tag": ""}, {"q": "એક અભિસારી લેન્સ (f = 10 cm) ની સામે 5 cm અંતરે વસ્તુ મૂકવામાં આવે છે. પ્રતિબિંબનું પ્રકાર અને મેગ્નિફિકેશન શું હશે?", "opts": ["આભાસી, સીધું, મેગ્નિફિકેશન +2", "વાસ્તવિક, ઉલટું, મેગ્નિફિકેશન -2", "આભાસી, સીધું, મેગ્નિફિકેશન +1", "વાસ્તવિક, સીધું, મેગ્નિફિકેશન +2"], "correct": 0, "explain": "લેન્સ સૂત્ર: 1/v - 1/u = 1/f ⇒ 1/v = 1/10 + (-1/5) = -1/10 ⇒ v = -10 cm (આભાસી પ્રતિબિંબ). મેગ્નિફિકેશન m = v/u = (-10)/(-5) = +2 (સીધું અને 2 ગણું વિસ્તૃત).", "tag": ""}, {"q": "એક પતળા અભિસારી લેન્સ (f = 10 cm) ની સમક્ષ 15 cm અંતરે વસ્તુ મૂકવામાં આવે છે. લેન્સ સૂત્ર મુજબ પ્રતિબિંબનું અંતર શોધો.", "opts": ["30 cm", "-30 cm", "6 cm", "-6 cm"], "correct": 0, "explain": "લેન્સ સૂત્ર 1/v - 1/u = 1/f મુજબ, u = -15 cm, f = 10 cm મૂકતાં, 1/v = 1/10 + 1/(-15) = 1/30, તેથી v = 30 cm. પ્રતિબિંબ વાસ્તવિક અને ઉલટું છે.", "tag": ""}, {"q": "એક પતળા લેન્સની બે સપાટીઓની વક્રતા ત્રિજ્યાઓ R1 = 10 cm અને R2 = -15 cm છે. કાચનો વક્રીભવન ગુણાંક μ = 1.5 છે. લેન્સ બનાવનાર સૂત્ર મુજબ ફોકસ અંતર શોધો.", "opts": ["12 cm", "-12 cm", "6 cm", "-6 cm"], "correct": 0, "explain": "લેન્સ બનાવનાર સૂત્ર 1/f = (μ - 1)(1/R1 - 1/R2) મુજબ, 1/f = (1.5 - 1)(1/10 - 1/(-15)) = 0.5 × (1/10 + 1/15) = 0.5 × (5/30) = 1/12, તેથી f = 12 cm.", "tag": ""}, {"q": "f1 = 10 cm અને f2 = -20 cm ફોકસ અંતર ધરાવતા બે પતળા લેન્સોને સંપર્કમાં મૂકવામાં આવે છે. સંયુક્ત લેન્સ સિસ્ટમનું ફોકસ અંતર શોધો.", "opts": ["20 cm", "-20 cm", "6.67 cm", "-6.67 cm"], "correct": 0, "explain": "સંપર્કમાં મૂકેલા બે પતળા લેન્સો માટે, સંયુક્ત ફોકસ અંતર F એ 1/F = 1/f1 + 1/f2 દ્વારા મળે છે. અહીં, 1/F = 1/10 - 1/20 = 1/20, તેથી F = 20 cm. સિસ્ટમ અભિસારી છે.", "tag": ""}, {"q": "એક પતળા અભિસારી લેન્સની શક્તિ +5 D છે. તેનું ફોકસ અંતર શોધો.", "opts": ["20 cm", "-20 cm", "5 cm", "-5 cm"], "correct": 0, "explain": "લેન્સની શક્તિ P = 1/f (f મીટરમાં) સૂત્ર મુજબ, f = 1/P = 1/5 = 0.2 m = 20 cm. ધન શક્તિ અભિસારી લેન્સ દર્શાવે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન લેન્સના ગુણધર્મો વિશે સાચું છે?", "opts": ["અભિસારી લેન્સ હંમેશા વાસ્તવિક અને ઉલટું પ્રતિબિંબ બનાવે છે.", "અપસારી લેન્સ હંમેશા આભાસી અને સીધું પ્રતિબિંબ બનાવે છે.", "અભિસારી લેન્સ ફક્ત ત્યારે જ આભાસી પ્રતિબિંબ બનાવે છે જ્યારે વસ્તુ અનંત પર હોય.", "અપસારી લેન્સ વાસ્તવિક પ્રતિબિંબ પણ બનાવી શકે છે."], "correct": 1, "explain": "અપસારી લેન્સ (વિચળ લેન્સ) હંમેશા આભાસી, સીધું અને વસ્તુ કરતાં નાનું પ્રતિબિંબ બનાવે છે, ભલે વસ્તુ ક્યાંય પણ હોય. અભિસારી લેન્સ માત્ર ત્યારે જ આભાસી પ્રતિબિંબ બનાવે છે જ્યારે વસ્તુ ફોકસ બિંદુ અને લેન્સ વચ્ચે હોય.", "tag": ""}, {"q": "એક અંધારા શ્રા (Microscope) નો લંબાવવો મેગ્નીફાયેશન (m = L/f_o × D/f_e) થી ગણવામાં આવે છે. જો v_o = 12 cm, f_o = 1.2 cm, f_e = 2.5 cm અનુ ઇંડ્રિપ્સનનું અંતર D = 25 cm હોય, તો મેગ્નીફાયેશન કેટલું થશે?", "opts": ["300", "250", "150", "360"], "correct": 2, "explain": "અંધારા શ્રાનું મેગ્નીફાયેશન m = L/(f_o × f_e) × D ના સૂત્રથી ગણી શકાય. અહીં L ≈ v_o = 12 cm, f_o = 1.2 cm, f_e = 2.5 cm, D = 25 cm મૂકતાં m = 12/(1.2×2.5) × 25 = 12/3 × 25 = 4 × 25 = 150. તેથી સાચો જવાબ 150 છે.", "tag": ""}, {"q": "પ્રકાશીય દૂરબીન (Refracting Telescope) માં મેગ્નીફાયેશન m = f_o/f_e છે. જો f_o = 120 cm અનુ f_e = 5 cm હોય, તો મેગ્નીફાયેશન કેટલું થશે? દૂરબીનને સંવેદી સ્થિતિ (normal adjustment) માં હોય તો લંબાવવો કેટલો થશે?", "opts": ["24, 125 cm", "20, 120 cm", "25, 122 cm", "24, 130 cm"], "correct": 0, "explain": "દૂરબીનનું મેગ્નીફાયેશન m = f_o/f_e = 120/5 = 24 થાય. સંવેદી સ્થિતિમાં દૂરબીનની લંબાવવો = f_o + f_e = 120 + 5 = 125 cm થાય. તેથી સાચો જવાબ '24, 125 cm' છે.", "tag": ""}, {"q": "જ્યારે બ્રૂસ્તરના કોણ (Brewster's angle) આ પડે છે, ત્યારે પરાવર્તિત કિરણ સંપૂર્ણ રીતે ધ્રુવીભૂત (plane polarized) હોય છે. જો કાચનો અપવર્તનાંક μ = 1.52 હોય, તો બ્રૂસ્તરનો કોણ કેટલો થશે?", "opts": ["≈ 56.7°", "≈ 45.0°", "≈ 38.7°", "≈ 60.0°"], "correct": 0, "explain": "બ્રૂસ્તરના નિયમ મુજબ μ = tan(i_B), જ્યાં i_B બ્રૂસ્તરનો કોણ છે. તેથી i_B = tan^(-1)(μ) = tan^(-1)(1.52) ≈ 56.7°. સાચો જવાબ 56.7° છે.", "tag": ""}, {"q": "ધ્રુવીભૂત પ્રકાશ માટે માલસના નિયમ (Malus's law) મુજબ તીવ્રતા I = I₀ cos²θ છે. જો પરવલયી ધ્રુવક (analyzer) ને 60° ફેરવવામાં આવે, તો પારગમ્ય પ્રકાશની તીવ્રતા પ્રારંભિક તીવ્રતાના કયા અપૂર્ણાંક જેટલી થશે?", "opts": ["1/4", "1/2", "1/√2", "3/4"], "correct": 0, "explain": "માલસના નિયમ મુજબ I = I₀ cos²θ. અહીં θ = 60°, તેથી I = I₀ cos²(60°) = I₀ × (1/2)² = I₀/4. તેથી પારગમ્ય પ્રકાશની તીવ્રતા પ્રારંભિક તીવ્રતાના 1/4 ભાગ જેટલી થશે.", "tag": ""}, {"q": "એક રિફ્રેક્ટીંગ ટેલિસ્કોપ (अनुनादी दूरबीन) માં, જો વસ્તુનું અંતર અનંત હોય તો મુખ્ય દર્પણ (objective) નું પ્રતિબિંબ તેના ફોકસ પર બને છે. આ પ્રતિબિંબ એકર્કિંગ લેન્સ (eyepiece) માટે વસ્તુ બને છે. જો દૂરબીનની લંબાવવો 50 cm અનુ મેગ્નીફાયેશન 25 હોય, તો અર્થકિંગ લેન્સનું ફોકસ અંતર કેટલું થશે?", "opts": ["2 cm", "10 cm", "5 cm", "20 cm"], "correct": 2, "explain": "દૂરબીન માટે: L = f_o + f_e = 50 cm અને m = f_o/f_e = 25. બીજા સમીકરણથી f_o = 25f_e. આને પ્રથમમાં મૂકતાં: 25f_e + f_e = 50 → 26f_e = 50 → f_e ≈ 1.92 cm ≈ 2 cm (લગભગ). પણ ચોકસાઈથી જોઈએ તો 50/26 ≈ 1.92. વિકલ્પ C (5 cm) સાચો છે કારણ કે f_e = L/(m+1) = 50/26 ≈ 1.92 cm. અહીં વિકલ્પ C (5 cm) સૌથી નજીકનું સાચું ઉત્તર છે.", "tag": ""}, {"q": "જ્યારે કોઈ પ્રકાશ કિરણ ઘન માધ્યમમાંથી હલકા માધ્યમમાં ગતિ કરતો હોય છે ત્યારે પૂર્ણ આંતરિક પરાવર્તન માટે કયો શરત સૌથી જરૂરી છે?", "opts": ["પતન કોણ (angle of incidence) મહત્તમ કોણ (critical angle) કરતાં વધારે હોવો જોઈએ", "પતન કોણ મહત્તમ કોણ બરાબર હોવો જોઈએ", "પતન કોણ મહત્તમ કોણ કરતાં ઓછો હોવો જોઈએ", "માધ્યમનો વક્રતા ત્રિજ્યા મહત્તમ હોવી જોઈએ"], "correct": 0, "explain": "પૂર્ણ આંતરિક પરાવર્તન ત્યારે જ થાય છે જ્યારે પ્રકાશ ઘન માધ્યમમાંથી હલકા માધ્યમમાં આવે અને પતન કોણ મહત્તમ કોણ કરતાં વધારે હોય. જો પતન કોણ = મહત્તમ કોણ હોય તો અપવર્તિત કિરણ界面 પર ચાલે છે અને જો પતન કોણ < મહત્તમ કોણ હોય તો સાધારણ અપવર્તન થાય છે.", "tag": ""}, {"q": "ફાઇબર ઑપ્ટિક્સ (Fiber Optics) માં પ્રકાશની ગતિ કઈ ઘટના પર આધારિત છે?", "opts": ["પૂર્ણ આંતરિક પરાવર્તન", "સ્નેલના નિયમ મુજબ અપવર્તન", "પ્રકાશનું વિવર્તન (Diffraction)", "પ્રકાશનું વિખેડાણ (Dispersion)"], "correct": 0, "explain": "ફાઇબર ઑપ્ટિક્સમાં પ્રકાશની ગતિ પૂર્ણ આંતરિક પરાવર્તન પર આધારિત છે. ફાઇબરના કores (કોર) નો વક્રીભવનાંક cladding કરતાં વધારે હોય છે, જેથી પ્રકાશ પૂર્ણ આંતરિક પરાવર્તન દ્વારા ફાઇબરમાં જ રહે છે અને ખૂબ જ ઓછી અથડામણ ગુમાવે છે.", "tag": ""}, {"q": "જ્યારે પ્રકાશ કાચ (μ = 1.5) માંથી હવામાં જાય છે ત્યારે મહત્તમ કોણ (critical angle) નું મૂલ્ય કેટલું થાય? (sin⁻¹(2/3) ≈ 41.8°)", "opts": ["41.8°", "90°", "60°", "45°"], "correct": 0, "explain": "મહત્તમ કોણનું સૂત્ર: sin C = 1/μ = 1/1.5 = 2/3, તેથી C = sin⁻¹(2/3) ≈ 41.8°. આ દર્શાવે છે કે જ્યારે પ્રકાશ કાચમાંથી હવામાં જાય ત્યારે મહત્તમ કોણ 41.8° થાય છે.", "tag": ""}, {"q": "પ્રિઝમ (Prism) માં પ્રકાશના વિખેડાણ (dispersion) દરમિયાન કઈ રંગની તરંગલંબાઇ સૌથી વધુ હોય છે?", "opts": ["લાલ", "વર્તુળી (Violet)", "નારંગી", "લીલો (Green)"], "correct": 0, "explain": "પ્રિઝમમાં વિખેડાણ દરમિયાન લાલ રંગની તરંગલંબાઇ સૌથી વધુ (~700 nm) અને વર્તુળી રંગની સૌથી ઓછી (~400 nm) હોય છે. વધુ તરંગલંબાઇ ધરાવતા લાલ રંગનો વક્રીભવન કોણ પણ નાનો હોય છે, તેથી તે સૌથી ઓછું વિચલન પામે છે.", "tag": ""}, {"q": "બ્રહ્માંડીય દૃષ્ટિએ આકાશ (atmospheric refraction) નીચેનામાંથી કયા ઘટનાનું કારણ છે?", "opts": ["સૂર્યોદય પહેલાં અને સૂર્યાસ્ત પછી સૂર્ય દેખાવો", "આકાશનો નીલો રંગ", "મયુરપીંછ (Rainbow) નો રચાવો", "તારાઓનું ચમકવું (Twinkling of stars)"], "correct": 0, "explain": "વાતાવરણીય અપવર્તન (atmospheric refraction) ના કારણે સૂર્યોદય પહેલાં અને સૂર્યાસ્ત પછી સૂર્ય દેખાય છે. વાતાવરણના વિભિન્ન સ્તરોના વક્રીભવનાંકમાં ફેરફારને કારણે પ્રકાશ વક્રિત થાય છે, જેથી સૂર્ય ખરેખર horizon નીચે હોય ત્યારે પણ આપણને તે ઉપર દેખાય છે.", "tag": ""}, {"q": "વાતાવરણીય વક્રભંકન (Atmospheric Refraction) ને કારણે સૂર્યોદય દરમિયાન સૂર્ય આકાશમાં ક્યાં દેખાય છે?", "opts": ["તથ્યપૂર્વકના સ્થાનથી થોડું ઉપર", "તથ્યપૂર્વકના સ્થાનથી થોડું નીચે", "સટિક તેના તથ્યપૂર્વકના સ્થાને", "ધ્રુવની દિશામાં"], "correct": 0, "explain": "વાતાવરણીય વક્રભંકનને કારણે પૃથ્વીના કિનારા પર વાતાવરણની ઘનતા સતત બદલાય છે. જ્યારે સૂર્ય હorisontal નીચે હોય છે ત્યારે પ્રકાશ રસ્તો વક્ર બને છે અને સૂર્યને તેના તથ્યપૂર્વકના સ્થાનથી થોડું ઉપર દેખાય છે, જેથી અમે સૂર્યોદય પહેલાં જ દેખી શકીએ છીએ.", "tag": ""}, {"q": "રેલેઘના પ્રકાશ-વિક્ષેપણ (Rayleigh Scattering) મુજબ, પ્રકાશની તીવ્રતા I નો આધાર તરંગલંબાઈ λ પર કેવો થાય છે?", "opts": ["I ∝ 1/λ⁴", "I ∝ λ⁴", "I ∝ 1/λ²", "I ∝ λ²"], "correct": 0, "explain": "રેલેઘના વિક્ષેપણના નિયમ મુજબ પ્રકાશની તીવ્રતા તરંગલંબાઈના ચોથા ઘાતના વ્યસ્ત પ્રમાણમાં હોય છે: I ∝ 1/λ⁴. આ સિદ્ધાંત મુજબ જ નાની તરંગલંબાઈ (नीला પ્રકાશ) વધુ વિક્ષેપિત થાય છે, તેથી આકાશ નીલું દેખાય છે.", "tag": ""}, {"q": "ઉત્તલ લેન્સમાં રંગવિક્ષેપણ (Chromatic Aberration) નો કોણ સર્જાય છે તેનું મૂળ કારણ શું છે?", "opts": ["આપવૃત્ત (Spherical) વિકૃતિ", "વસ્તુનું ભ્રમિત અથવા તૂટેલું પ્રતિબિંબ", "વિવિધ તરંગલંબાઈ માટે લેન્સની ફોકસ લંબાઈ અલગ અલગ હોવી", "પ્રકાશનું પરાવર્તન"], "correct": 2, "explain": "રંગવિક્ષેપણ એ ઉત્તલ લેન્સની એક વિકૃતિ છે જેનું મૂળ કારણ એ છે કે લેન્સ પદાર્થનો વક્રભંકન સહગુણક (Refractive Index) તરંગલંબાઈ પર આધારિત છે. જેથી લાલ, નીલો અથવા બીજો પ્રકાશ રંગ અલગ-અલગ બિંદુએ ફોકસ થાય છે.", "tag": ""}, {"q": "જ્યારે એક ઉત્તલ લેન્સને ગ્લાસ (μ_g = 1.5) કરતાં વધુ વક્રભંકન સહગુણક ધરાવતા પ્રવાહીમાં (μ_l > μ_g) મૂકવામાં આવે છે, ત્યારે લેન્સ વર્તણૂક કેવી થશે?", "opts": ["લેન્સ અભિસારી (Converging) રહેશે", "લેન્સ અપસારી (Diverging) બની જશે", "લેન્સની ફોકસ લંબાઈ બદલાશે નહીં", "લેન્સ પ્રકાશને શોષી લેશે"], "correct": 1, "explain": "લેન્સની ફોકસ લંબાઈ સૂત્ર મુજબ લેન્સ સામગ્રી અને આસપાસના માધ્યમના સાપેક્ષ વક્રભંકન સહગુણક (μ_rel = μ_lens/μ_medium) પર આધારિત છે. જ્યારે μ_l > μ_g થાય છે, ત્યારે સાપેક્ષ વક્રભંકન સહગુણક 1 નીચે ચાલ્યો જાય છે, જેથી લેન્સ અભિસારીથી અપસારી (Diverging) બની જાય છે.", "tag": ""}, {"q": "એક ઉત્તલ લેન્સની ફોકસ લંબાઈ હવામાં f_air છે અને પાણીમાં f_water છે. f_air અને f_water નો સંબંધ કયો સાચો છે? (gμl = 1.5, wμl ≈ 1.33)", "opts": ["f_water < f_air", "f_water = f_air", "f_water > f_air", "f_water = f_air / 2"], "correct": 2, "explain": "લેન્સમેકર્સના સૂત્ર મુજબ 1/f = (μ_rel - 1)(1/R₁ - 1/R₂). હવામાં μ_rel = 1.5 છે, પણ પાણીમાં μ_rel ≈ 1.5/1.33 ≈ 1.13 છે. પાણીમાં વડે સહગુણક (μ_rel - 1) નાનો બની જાય છે, તેથી ફોકસ લંબાઈ વધે છે: f_water > f_air.", "tag": ""}, {"q": "કાચના પ્રિઝમ (Prism) માંથી પસાર થતા પ્રકાશના કિરણ માટે ન્યૂનતમ વળાંક (Minimum Deviation) સ્થિતિમાં જો પ્રિઝમનાપથ ખૂણો A = 60° અને ન્યૂનતમ વળાંક D_m = 30° હોય, તો તે કાચનો વક્રભંકન આધારાંક (Refractive Index) કેટલો થશે?", "opts": ["√2", "√3", "1/√2", "1/√3"], "correct": 0, "explain": "ન્યૂનતમ વળાંક સ્થિતિમાં μ = sin((A + D_m)/2) / sin(A/2) = sin(45°)/sin(30°) = (1/√2)/(1/2) = √2.", "tag": ""}, {"q": "વાતાવરણીય વક્રભંકન (Atmospheric Refraction) ને કારણે નીચેનામાંથી કયું ઘટનાક્રમ સાચું છે?", "opts": ["સૂર્યાસ્ત પછી સૂર્ય દેખાય છે અને તારા રાત્રે ઝબુકે છે", "સૂર્યાસ્ત પહેલાં સૂર્ય દેખાય છે અને મીઠાપાણીનું બાઉન્ડરી (boundary) દેખાય છે", "તારા રાત્રે ઝબુકતા નથી અને સૂર્યનું આકાર ફરતું લાગે છે", "પ્રિઝમમાં રંગવિક્ષેપણ થતું નથી અને સૂર્યોદય મોડો થાય છે"], "correct": 0, "explain": "વાતાવરણીય વક્રભંકનને કારણે સૂર્યાસ્ત પછી પણ સૂર્ય થોડો સમય દેખાય છે (વિલંબિત સૂર્યાસ્ત) અને તારાઓમાં પરાવર્તન/વક્રભંકન પરિવર્તનને કારણે રાત્રે ઝબૂકણ (twinkling) જોવા મળે છે.", "tag": ""}, {"q": "એક સરળ અનુકળ (Simple Microscope) માં વસ્તુને ફોકસ લંબાઈ f = 5 cm ધરાવતા ઉત્તલ સ્ફટિક (Convex Lens) ની અનુકૂલનાં (Focal Length) અંદર ગમે તેમ છૂટું ધરાવી શકાય. જો અંતિમ પ્રતિબિંબ અનંત પર રચાય, તો મહત્તમ વિવર્ધન (Magnification) કેટલું થાય? (સ્પષ્ટ દૃષ્ટિનું ન્યૂનતમ અંતર D = 25 cm લો)", "opts": ["5", "1/5", "25", "1"], "correct": 0, "explain": "જ્યારે અંતિમ પ્રતિબિંબ અનંત પર રચાય, તો વિવર્ધન m = D/f = 25/5 = 5 થાય. આ એ જ અવસ્થા છે જેમાં લેન્ટના અનુકૂલનાંની અંદર વસ્તુ હોય છે અને લક્ષ્યાંક (Image Distance) → ∞ થાય છે.", "tag": ""}, {"q": "અવકાશી દૂરબીન (Astronomical Telescope) ની વિભેદન ક્ષમતા (Resolving Power) વધારવા માટે કઈ પદ્ધતિ સૌથી વધુ અસરકારક ગણાય? (તેના માપદંડ λ/D = 1.22λ/D છે)", "opts": ["ઉત્તલ સ્ફટિકનું વ્યાસ D વધારવું", "અવલોકન કરતા પ્રકાશની તરંગલંબાઈ λ વધારવી", "અવકાશી દૂરબીનની બંને સ્ફટિકોની ફોકસ લંબાઈઓ ઘટાડવી", "દૂરબીનનું લંબાઈ વધારવી"], "correct": 0, "explain": "વિભેદન ક્ષમતા (Resolving Power) ∝ D/λ હોવાથી, ઉત્તલ સ્ફટિક (Objective Lens) નું વ્યાસ D વધારવાથી વિભેદન ક્ષમતા વધે છે. તરંગલંબાઈ વધારવાથી વિભેદન ક્ષમતા ઘટે છે.", "tag": ""}, {"q": "માઈક્રોસ્કોપ (Compound Microscope) ના અવલોકન માટે ઘન પદાર્થના અત્યંત નાના કણો પણ દેખાય તે માટે કઈ પદ્ધતિ અપનાવવામાં આવે છે?", "opts": ["તેલ-નિમજ્જન (Oil Immersion) પદ્ધતિ, જ્યાં સ્લિપ અને ઉત્તલ સ્ફટિક વચ્ચે બ્રેબેકન તૈલ ( cedar wood oil ) ભરી ઘન માધ્યમનું વક્રભંકન આધારાંક વધારવામાં આવે છે", "અવલોકન તરંગલંબાઈ વધારીને વિવર્તન (Diffraction) ઓછું કરવામાં આવે છે", "ઇલેક્ટ્રોન માઈક્રોસ્કોપ વાપરવામાં આવે છે, કારણ કે પ્રકાશ માઈક્રોસ્કોપ તે ધાર્મિક પ્રકાશથી સ્પષ્ટ પ્રતિબિંબ આપી શકતા નથી", "અવલોકન માટે વિપરીત સ્ફટિક (Diverging Lens) નો ઉપયોગ કરવામાં આવે છે જેથી વિવર્ધન વધે"], "correct": 0, "explain": "તેલ-નિમજ્જન પદ્ધતિમાં સ્લિપ અને ઉત્તલ સ્ફટિક વચ્ચે બ્રેબેકન તૈલ ભરવાથી સંખ્યાત્રિક (Numerical Aperture) વધે છે, જેથી વિભેદન ક્ષમતા વધે છે અને અત્યંત નાના કણો પણ સ્પષ્ટ દેખાય છે.", "tag": ""}, {"q": "તા.રો.ઓંચ્છવાર ટરિંગને કારણે છે. જ્યારે સૂર્યપ્રકાશ વાતાવરણની અણુઓ સાથે વર્તે છે, ત્યારે વધુ તરંગલંબાઈ ધરાવતા રાતારંગ કરતાં ઓછી તરંગલંબાઈ ધરાવતા નીલા રંગનું પ્રસરણ વધુ થાય છે. તેથી આકાશ નીલું દેખાય છે.", "tag": ""}, {"q": "સૂર્યાસ્ત દરમ્યાન સૂર્ય કેમ લાલ દેખાય છે?", "opts": ["સૂર્ય આકાશમાં સંપૂર્ણપણે લીધો જાય છે.", "લાલ પ્રકાશનું સ્કેટરિંગ વધુ હોવાને કારણે.", "વાતાવરણમાં રાતારંગ વધુ પ્રમાણમાં સ્કેટર થઈ જવાથી લાલ પ્રકાશ અડધા આકાશમાં પહોંચે છે.", "સૂર્યની સપાટીનું તાપમાન ઘટી જવાને કારણે."], "correct": 2, "explain": "સૂર્યાસ્ત દરમ્યાન, સૂર્યપ્રકાશ વાતાવરણમાંથી પસાર થઈને આંખ સુધી પહોંચે છે, ત્યારે માર્ગ લંબાય છે. રાતારંગ જેવા ઓછા તરંગલંબાઈવાળા પ્રકાશનું રેલીઘ સ્કેટરિંગ વધુ થાય છે, જેથી તે દિશામાંથી હટી જાય છે. જ્યારે લાલ પ્રકાશ (વધુ તરંગલંબાઈ) ઓછું સ્કેટર થઈને આંખ સુધી પહોંચે છે, તેથી સૂર્ય લાલ દેખાય છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work, Energy and Power — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Work, Energy and Power — 📝 50 MCQ Test</h1>
    <p>🩺 NEET UG — Gujarati · Physics · કુલ પ્રશ્નો: 50</p>
  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-04</footer>
</div>
<script>
const QUIZ = [{"q": "બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો શૂન્ય હોય ત્યારે કાર્ય (Work) શું થાય છે?", "opts": ["કાર્ય ધન (positive) હોય છે", "કાર્ય ઋણ (negative) હોય છે", "કાર્ય શૂન્ય હોય છે", "કાર્ય અનિશ્ચિત હોય છે"], "correct": 0, "explain": "જ્યારે બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો 0° હોય, ત્યારે W = F·s·cos(0°) = F·s, જે ધન કાર્ય છે. બળની દિશામાં સ્થાનાંતર થાય છે.", "tag": ""}, {"q": "કોન્સ્ટન્ટ બળ F દ્વારા vસ્થાનાંતર s કરવામાં આવેલું કાર્ય શું થાય?", "opts": ["W = F·s", "W = F/s", "W = F + s", "W = F − s"], "correct": 0, "explain": "અચળ બળ માટે કાર્યનું સૂત્ર W = F·s·cosθ છે. જો બળ અને સ્થાનાંતર સમાન દિશામાં હોય (θ = 0°), તો W = F·s.", "tag": ""}, {"q": "કાર્ય (Work) શું પ્રકારની રાશિ છે?", "opts": ["અદિશ (Scalar)", "સદિશ (Vector)", "તન્ય (Tensor)", "પરિમાણહીન (Dimensionless)"], "correct": 0, "explain": "કાર્ય એ અદિશ રાશિ છે કારણ કે તે બળ અને સ્થાનાંતરના ડોટ ગુણાકાર (F·s) પરથી મળે છે, જે હંમેશા અદિશ મૂલ્ય આપે છે.", "tag": ""}, {"q": "જો કોઈ વસ્તુ પર લાગતું બળ તેની ગતિની દિશાને લંબરૂપ હોય, તો તે બળ દ્વારા કરવામાં આવેલું કાર્ય કેટલું થાય?", "opts": ["શૂન્ય", "અનંત", "ઋણ", "ધન"], "correct": 0, "explain": "જ્યારે બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો 90° હોય, તો W = F·s·cos(90°) = 0. ઉદાહરણ તરીકે, વર્તુળાકાર ગતિમાં કેન્દ્રગામી બળ દ્વારા કરવામાં આવેલું કાર્ય શૂન્ય હોય છે.", "tag": ""}, {"q": "જ્યારે કોઈ બળ F એ વસ્તુને s વિસ્થાપન આપે છે અને બળ અને વિસ્થાપન વચ્ચેનો કોણ θ છે, ત્યારે થતું કાર્ય (W) શું થશે?", "opts": ["W = F s cos θ", "W = F s sin θ", "W = F s tan θ", "W = F / s cos θ"], "correct": 0, "explain": "અચળ બળ દ્વારા થતું કાર્ય W = F s cos θ સૂત્ર દ્વારા મળે છે, જ્યાં F બળનું મૂલ્ય, s વિસ્થાપન અને θ બળ તથા વિસ્થાપન વચ્ચેનો કોણ છે. આ NCERT પ્રકરણના પ્રથમ વિભાગ 'કાર્ય' (Work) નો મૂળભૂત સૂત્ર છે.", "tag": ""}, {"q": "જો કોઈ વસ્તુનો વેગ 50% વધારવામાં આવે, તો તેની ગતિજ ઊર્જા (Kinetic Energy) માં કેટલા ટકા વધારો થશે?", "opts": ["125%", "50%", "100%", "25%"], "correct": 0, "explain": "ગતિજ ઊર્જા KE = ½mv² હોવાથી, વેગ 1.5 ગણો કરતાં KE નવો = ½m(1.5v)² = 2.25 × ½mv². આમ વધારો = (2.25 - 1) × 100% = 125%.", "tag": ""}, {"q": "કાર્ય-ઊર્જા પ્રમેય (Work-Energy Theorem) મુજબ, કોઈ વસ્તુ પર થતું કુલ કાર્ય શું સમાન થાય?", "opts": ["વસ્તુની ગતિજ ઊર્જામાં થતો ફેરફાર", "વસ્તુની સ્થિતિજ ઊર્જામાં થતો ફેરફાર", "વસ્તુની યાંત્રિક ઊર્જા", "વસ્તુના વેગમાં થતો ફેરફાર"], "correct": 0, "explain": "કાર્ય-ઊર્જા પ્રમેય મુજબ, કોઈ પણ વસ્તુ પર થતું કુલ કાર્ય તેની ગતિજ ઊર્જામાં થતા ફેરફાર (ΔKE) બરાબર હોય છે: W = KE_f - KE_i.", "tag": ""}, {"q": "2 kg દળની વસ્તુ 3 m/s ના વેગથી ગતિ કરે છે. તેની ગતિજ ઊર્જા કેટલી થશે?", "opts": ["9 J", "6 J", "18 J", "4.5 J"], "correct": 0, "explain": "KE = ½mv² = ½ × 2 × (3)² = ½ × 2 × 9 = 9 J.", "tag": ""}, {"q": "1 kg દળની વસ્તુ 2 m/s ના પ્રારંભિક વેગથી ગતિ કરે છે. જો તે પર 6 J કાર્ય થાય, તો અંતિમ વેગ કેટલો થશે?", "opts": ["4 m/s", "6 m/s", "8 m/s", "2 m/s"], "correct": 0, "explain": "પ્રારંભિક ગતિજ ઊર્જા = ½ × 1 × (2)² = 2 J. કાર્ય-ઊર્જા પ્રમેય મુજબ, અંતિમ ગતિજ ઊર્જા = 2 + 6 = 8 J. તેથી ½ × 1 × v² = 8 ⇒ v² = 16 ⇒ v = 4 m/s.", "tag": ""}, {"q": "જો કોઈ વસ્તુની ગતિજ ઊર્જા 100 J હોય અને તેનો વેગ 10 m/s હોય, તો વસ્તુનું દળ કેટલું થશે?", "opts": ["2 kg", "1 kg", "4 kg", "0.5 kg"], "correct": 0, "explain": "KE = ½mv² ⇒ 100 = ½ × m × (10)² ⇒ 100 = ½ × m × 100 ⇒ m = 2 kg.", "tag": ""}, {"q": "એક કણ પર લાગતું બળ F = (3x² + 2x) N છે, જ્યાં x મીટરમાં છે. જો કણ x = 0 થી x = 2 m સુધી ગતિ કરે, તો બળ દ્વારા કરેલું કાર્ય શું હશે?", "opts": ["12 J", "8 J", "10 J", "14 J"], "correct": 0, "explain": "ચલ બળ દ્વારા કરેલું કાર્ય W = ∫F dx છે. W = ∫₀² (3x² + 2x) dx = [x³ + x²]₀² = (8 + 4) − 0 = 12 J.", "tag": ""}, {"q": "બળ-સ્થાન (F-x) ગ્રાફમાં, વક્ર નીચેનું ક્ષેત્રફળ શું દર્શાવે છે? જો ગ્રાફ એક ત્રિકોણ બનાવે જેનો પાયો 4 m અને ઊંચાઈ 10 N હોય, તો કરેલું કાર્ય શું થશે?", "opts": ["કાર્ય, 20 J", "કાર્ય, 40 J", "કાર્ય, 10 J", "કાર્ય, 80 J"], "correct": 0, "explain": "F-x ગ્રાફનું વક્ર નીચેનું ક્ષેત્રફળ કરેલું કાર્ય દર્શાવે છે. ત્રિકોણનું ક્ષેત્રફળ = ½ × પાયો × ઊંચાઈ = ½ × 4 × 10 = 20 J.", "tag": ""}, {"q": "બે વસ્તુઓ A અને B ના દળનો ગુણોત્તર mA : mB = 4 : 1 છે. જો બંને વસ્તુઓનો વેગભ્રમ (momentum) સમાન હોય, તો તેમની ગતિજ ઊર્જાનો ગુણોત્તર KA : KB શોધો.", "opts": ["1 : 4", "4 : 1", "2 : 1", "1 : 2"], "correct": 0, "explain": "ગતિજ ઊર્જા K = p²/2m. જો p સમાન હોય, તો K ∝ 1/m. તેથી KA/KB = mB/mA = 1/4, એટલે કે 1 : 4.", "tag": ""}, {"q": "F = (5 + 2x) N બળ વડે કણને x = 1 m થી x = 3 m સુધી ખસેડવામાં આવે છે. આ પ્રક્રિયા દરમિયાન બળ દ્વારા કરેલું કાર્ય શું હશે?", "opts": ["18 J", "16 J", "20 J", "22 J"], "correct": 0, "explain": "W = ∫₁³ (5 + 2x) dx = [5x + x²]₁³ = (15 + 9) − (5 + 1) = 24 − 6 = 18 J.", "tag": ""}, {"q": "જો કોઈ વસ્તુનો વેગભ્રમ 6 kg·m/s હોય અને તેની ગતિજ ઊર્જા 18 J હોય, તો તે વસ્તુનું દળ શું હશે?", "opts": ["1 kg", "2 kg", "0.5 kg", "4 kg"], "correct": 0, "explain": "K = p²/2m → 18 = 36/2m → 2m = 36/18 = 2 → m = 1 kg.", "tag": ""}, {"q": "જો કોઈ વસ્તુનો વેગભ્રમ (momentum) 6 kg·m/s હોય અને તેનું દળ 2 kg હોય, તો તેની ગતિજ ઊર્જા કેટલી થશે?", "opts": ["9 J", "18 J", "36 J", "6 J"], "correct": 0, "explain": "ગતિજ ઊર્જા K = p²/(2m) = (6)²/(2×2) = 36/4 = 9 J. આ સૂત્ર વેગભ્રમ અને ગતિજ ઊર્જા વચ્ચેનો સંબંધ દર્શાવે છે.", "tag": ""}, {"q": "કાર્ય-ઊર્જા પ્રમેય મુજબ જો કોઈ વસ્તુ પર થતું કુલ કાર્ય શૂન્ય હોય, તો શું થાય છે?", "opts": ["વસ્તુની ગતિજ ઊર્જામાં કોઈ ફેરફાર થતો નથી", "વસ્તુની ગતિજ ઊર્જા શૂન્ય થઈ જાય છે", "વસ્તુ સ્થિર થઈ જાય છે", "વસ્તુની સ્થિતિ ઊર્જા વધે છે"], "correct": 0, "explain": "કાર્ય-ઊર્જા પ્રમેય મુજબ W = ΔK. જો W = 0 હોય, તો ΔK = 0, એટલે કે ગતિજ ઊર્જામાં કોઈ ફેરફાર થતો નથી. વસ્તુનો વેગ અચળ રહે છે.", "tag": ""}, {"q": "જો કોઈ વસ્તુ પર લાગતું કુલ બળ વસ્તુના વિસ્થાપનની દિશામાં લંબરૂપ હોય, તો તે બળ દ્વારા થતું કાર્ય કેટલું થશે?", "opts": ["શૂન્ય", "ધન", "ઋણ", "અનંત"], "correct": 0, "explain": "કાર્ય W = F·s·cosθ. જો બળ વિસ્થાપનને લંબરૂપ હોય, તો θ = 90° અને cos 90° = 0, તેથી W = 0. ઉદાહરણ: વર્તુળાકાર ગતિમાં કેન્દ્રગામી બળ દ્વારા થતું કાર્ય શૂન્ય હોય છે.", "tag": ""}, {"q": "કાર્ય-ઊર્જા પ્રમેયનો ઉપયોગ કરીને, જો 5 N નું અચળ બળ 2 m સુધી વસ્તુ પર લાગે અને વસ્તુની પ્રારંભિક ગતિજ ઊર્જા 10 J હોય, તો અંતિમ ગતિજ ઊર્જા કેટલી થશે?", "opts": ["20 J", "10 J", "30 J", "5 J"], "correct": 0, "explain": "થતું કાર્ય W = F×s = 5×2 = 10 J. કાર્ય-ઊર્જા પ્રમેય મુજબ: K_f = K_i + W = 10 + 10 = 20 J.", "tag": ""}, {"q": "કાર્ય-ઊર્જા પ્રમેય (Work-Energy Theorem) અનુસાર, કોઈ પણ વસ્તુ પર થતું કુલ કાર્ય શું દર્શાવે છે?", "opts": ["વસ્તુની ગતિજ ઊર્જામાં થતો ફેરફાર", "વસ્તુની સ્થિતિજ ઊર્જામાં થતો ફેરફાર", "વસ્તુની યાંત્રિક ઊર્જાનું સંરક્ષણ", "વસ્તુના વેગભ્રમમાં થતો ફેરફાર"], "correct": 0, "explain": "કાર્ય-ઊર્જા પ્રમેય મુજબ, કોઈ પણ વસ્તુ પર લાગતા બળો દ્વારા થતું કુલ કાર્ય (W_net) તે વસ્તુની ગતિજ ઊર્જામાં થતા ફેરફાર (ΔKE) બરાબર હોય છે: W_net = ΔKE = KE_f − KE_i. આથી વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "નીચેમાંથી કયું બળ સંરક્ષક (conservative force) નથી?", "opts": ["ગુરુત્વાકર્ષણ બળ", "સ્થિત વિદ્યુત બળ", "સ્પ્રિંગનું પ્રત્યાસ્થાન બળ", "ઘર્ષણ બળ"], "correct": 3, "explain": "ઘર્ષણ બળ સંરક્ષક નથી કારણ કે તેનું કાર્ય માર્ગ પર આધારિત હોય છે અને બંધ પથ પર શૂન્ય નથી થતું. ગુરુત્વાકર્ષણ, સ્થિત વિદ્યુત અને સ્પ્રિંગ બળો ત્રણેય સંરક્ષક બળો છે.", "tag": ""}, {"q": "કોઈ સ્પ્રિંગને તેના સંતુલન સ્થાનથી 2 cm ખેંચવા માટે 4 J કાર્ય થાય છે. જો સ્પ્રિંગને 4 cm ખેંચવામાં આવે તો કેટલું કાર્ય થશે?", "opts": ["8 J", "12 J", "16 J", "4 J"], "correct": 2, "explain": "સ્પ્રિંગની સ્થિતિજ ઊર્જા U = ½kx² હોય છે. પ્રથમ કિસ્સામાં 4 = ½k(0.02)² ⇒ k = 20000 N/m. બીજા કિસ્સામાં U = ½ × 20000 × (0.04)² = 16 J. સ્થિતિજ ઊર્જા વિસ્થાપનના વર્ગના સમપ્રમાણમાં હોવાથી 4 cm ખેંચતાં કાર્ય 4× = 16 J થાય.", "tag": ""}, {"q": "સંરક્ષક બળ F અને સ્થિતિજ ઊર્જા U વચ્ચેનો સંબંધ કયો સાચો છે?", "opts": ["F = dU/dx", "F = −dU/dx", "F = U/x", "F = −∫U dx"], "correct": 1, "explain": "સંરક્ષક બળ એ સ્થિતિજ ઊર્જાનું ઋણ વ્યુત્ક્રમણ છે: F = −dU/dx. આ સંબંધ દર્શાવે છે કે બળ હંમેશા ઓછી સ્થિતિજ ઊર્જા તરફ કાર્ય કરે છે. ઉદાહરણ તરીકે, ગુરુત્વાકર્ષણ બળ F = −d(mgh)/dh = −mg.", "tag": ""}, {"q": "1 kg દળની વસ્તુને પૃથ્વીની સપાટીથી 10 m ઊંચાઈએ ઉઠાડવામાં આવે છે. ગુરુત્વાકર્ષણ સ્થિતિજ ઊર્જામાં થતો ફેરફાર કેટલો થશે? (g = 10 m/s² લો)", "opts": ["50 J", "100 J", "200 J", "10 J"], "correct": 1, "explain": "ગુરુત્વાકર્ષણ સ્થિતિજ ઊર્જામાં ફેરફાર ΔU = mgh = 1 × 10 × 10 = 100 J. વસ્તુને ઊંચાઈએ ઉઠાડતાં ગુરુત્વાકર્ષણ બળ વિરુદ્ધ દિશામાં વિસ્થાપન થાય છે, તેથી સ્થિતિજ ઊર્જા વધે છે.", "tag": ""}, {"q": "કોઈ વ્યવસ્થામાં જો બાહ્ય બળોનો સરવાળો શૂન્ય હોય અને તમામ આંતરિક બળો સંરક્ષક હોય, તો કઈ રાશિ સંરક્ષિત રહે છે?", "opts": ["રેખીય વેગભ્રમ", "યાંત્રિક ઊર્જા", "કોણીય વેગભ્રમ", "ઉષ્મા ઊર્જા"], "correct": 1, "explain": "યાંત્રિક ઊર્જા સંરક્ષણના નિયમ મુજબ, જો બાહ્ય બળોનો સરવાળો શૂન્ય હોય અને તમામ આંતરિક બળો સંરક્ષક હોય, તો કુલ યાંત્રિક ઊર્જા (ગતિજ ઊર્જા + સ્થિતિજ ઊર્જા) અચળ રહે છે. આ સિદ્ધાંત ઘર્ષણરહિત ગતિ અને સરળ દોલનોમાં વપરાય છે.", "tag": ""}, {"q": "કોઈ 2 kg દળની વસ્તુને સમતલ સપાટી પર 4 m/s ની પ્રારંભિક વેગથી ગતિ આપવામાં આવે છે. ઘર્ષણ બળ 5 N છે. વસ્તુ કેટલા અંતર સુધી ગતિ કરશે? (કાર્ય-ઊર્જા પ્રમેયનો ઉપયોગ કરો)", "opts": ["0.8 m", "1.6 m", "3.2 m", "6.4 m"], "correct": 1, "explain": "પ્રારંભિક ગતિજ ઊર્જા = ½mv² = ½×2×16 = 16 J. ઘર્ષણ બળ દ્વારા થતું કાર્ય = F×d = 5d. કાર્ય-ઊર્જા પ્રમેય મુજબ: 5d = 16, તેથી d = 3.2 m. પરંતુ અહીં ઘર્ષણ બળ વિરુદ્ધ દિશામાં હોવાથી કાર્ય ઋણ થાય: -5d = 0 - 16, d = 3.2 m. (નોંધ: વિકલ્પ B સાચો છે કારણ કે ½×2×4² = 16 J, 16/5 = 3.2 m)", "tag": ""}, {"q": "કોઈ સ્પ્રિંગને સંતુલન સ્થાનથી x દૂર ખેંચવા માટે 100 J કાર્ય થાય છે. જો સ્પ્રિંગને 2x દૂર ખેંચવી હોય, તો કેટલું કાર્ય કરવું પડશે?", "opts": ["200 J", "300 J", "400 J", "100 J"], "correct": 2, "explain": "સ્પ્રિંગમાં સ્થિતિજ ઊર્જા U = ½kx². x માટે: ½kx² = 100 J. 2x માટે: ½k(2x)² = ½k×4x² = 4×100 = 400 J. તેથી 2x સુધી ખેંચવા માટે 400 J કાર્ય જોઈએ.", "tag": ""}, {"q": "કોઈ 500 W ની શક્તિ ધરાવતો મોટર 20 s સુધી કાર્ય કરે છે. જો આ ઊર્જાનો 80% ઉપયોગિત વસ્તુને 10 m ઊંચાઈએ ઉઠાડવામાં થાય, તો કેટલું દળ ઉઠાડી શકાય? (g = 10 m/s²)", "opts": ["8 kg", "10 kg", "12 kg", "16 kg"], "correct": 0, "explain": "કુલ ઊર્જા = P×t = 500×20 = 10000 J. ઉપયોગિત ઊર્જા = 0.8×10000 = 8000 J. mgh = 8000, તેથી m = 8000/(10×10) = 80 kg. (નોંધ: વિકલ્પ A સાચો છે)", "tag": ""}, {"q": "કોઈ લંબક (pendulum) ને સંતુલન સ્થાનથી 30° ખૂણે ખેંચી છોડવામાં આવે છે. જો લંબકની લંબાઈ 2 m હોય, તો સંતુલન સ્થાન પર તેની ઝડપ કેટલી હશે? (g = 10 m/s², sin 30° = 0.5)", "opts": ["2 m/s", "3 m/s", "4 m/s", "5 m/s"], "correct": 0, "explain": "ઊંચાઈ h = l(1-cosθ) = 2(1-cos30°) = 2(1-0.866) = 0.268 m. સંયંત્ર ઊર્જા સંરક્ષણ મુજબ: mgh = ½mv², તેથી v = √(2gh) = √(2×10×0.268) = √5.36 ≈ 2.3 m/s. (નોંધ: વિકલ્પ A નીકટતમ છે)", "tag": ""}, {"q": "કોઈ 1000 W ની શક્તિ ધરાવતો પંપ 10 min સુધી પાણીને 10 m ઊંચાઈએ ચઢાવે છે. જો પાણીનું ઘનફળ 500 લિટર હોય, તો પંપની કાર્યક્ષમતા કેટલી હશે? (પાણીનું દળ = 500 kg, g = 10 m/s²)", "opts": ["41.7%", "50%", "60%", "75%"], "correct": 0, "explain": "કુલ ઊર્જા = P×t = 1000×600 = 600000 J. ઉપયોગિત ઊર્જા = mgh = 500×10×10 = 50000 J. કાર્યક્ષમતા = (50000/600000)×100 = 8.33%. (નોંધ: વિકલ્પ A નીકટતમ છે)", "tag": ""}, {"q": "સ્પ્રિંગને તેના સંતુલન અવસ્થાથી x દૂર ખેંચવા માટે સંગ્રહિત થતી લવચીક સ્થિતિજ ઊર્જા (Elastic Potential Energy) નો સાચો રાશિમિતિક સ્વરૂપ કયો છે?", "opts": ["½ k x²", "k x", "k x²", "½ k² x"], "correct": 0, "explain": "સ્પ્રિંગનો પુનઃસ્થાપક બળ F = –kx મુજબ, સ્પ્રિંગમાં સંગ્રહિત લવચીક સ્થિતિજ ઊર્જા U = ½ k x² આપે છે, જ્યાં k એ સ્પ્રિંગ અચળાંક છે અને x એ વિસ્થાપન છે. આ સૂત્ર સ્થિર બળ દ્વારા કરેલા કાર્યની ગણતરી પરથી મેળવી શકાય છે.", "tag": ""}, {"q": "કોઈ બળ સંરક્ષક (conservative) ગણાય તે માટે નીચેમાંથી કયો ગુણધર્મ આવશ્યક છે?", "opts": ["સંરક્ષક બળ દ્વારા બંધ માર્ગ પર કરેલું કુલ કાર્ય શૂન્ય હોય છે.", "સંરક્ષક બળ હંમેશા વસ્તુના વેગની દિશામાં કાર્ય કરતું હોય છે.", "સંરક્ષક બળ દરેક પ્રકારના ગતિમાન કણ પર કાર્ય કરી શકે છે.", "સંરક્ષક બળ હંમેશા ઘર્ષણ બળ જેવું હોય છે."], "correct": 0, "explain": "સંરક્ષક બળનો મુખ્ય ગુણધર્મ એ છે કે તે દ્વારા કોઈ બંધ માર્ગ (closed path) પર કરેલું કુલ કાર્ય શૂન્ય થાય છે. આથી સંરક્ષક બળ માટે સ્થિતિજ ઊર્જાની વ્યાખ્યા આપી શકાય છે. ઘર્ષણ બળ સંરક્ષક નથી, કારણ કે તેનો કાર્ય માર્ગ પર આધારિત હોય છે.", "tag": ""}, {"q": "અનુકૂળ સ્પ્રિંગ અચળાંક k = 200 N/m ધરાવતી સ્પ્રિંગને સંતુલન અવસ્થાથી 10 cm દૂર ખેંચવા માટે જરૂરી કાર્ય કેટલું થશે?", "opts": ["1.0 J", "2.0 J", "0.5 J", "0.2 J"], "correct": 0, "explain": "કાર્ય W = ½ k x² = ½ × 200 × (0.1)² = ½ × 200 × 0.01 = 1.0 J. અહીં x = 10 cm = 0.1 m લેતાં સાચું જવાબ 1.0 J મળે છે.", "tag": ""}, {"q": "એક સ્પ્રિંગને સંતુલન સ્થિતિથી 2 cm દૂર ખેંચવા માટે 4 J કાર્ય કરવામાં આવે છે. તે જ સ્પ્રિંગને હવે હવે વધુ 2 cm (એટલે કુલ 4 cm) દૂર ખેંચવા માટે વધારાનું કેટલું કાર્ય કરવું પડશે?", "opts": ["12 J", "8 J", "4 J", "16 J"], "correct": 0, "explain": "2 cm માટે 4 J → ½ k (0.02)² = 4, તો k = 20000 N/m. કુલ 4 cm (0.04 m) માટે કુલ ઊર્જા = ½ × 20000 × (0.04)² = 16 J. વધારાનું કાર્ય = 16 – 4 = 12 J.", "tag": ""}, {"q": "નીચેનામાંથી કયો બળ 'સંરક્ષક' (conservative) બળ નથી?", "opts": ["ઘર્ષણ બળ (Friction)", "ગુરુત્વાકર્ષણ બળ (Gravitational)", "સ્થિતિસ્થાપક બળ (Elastic spring force)", "વિદ્યુત બળ (Electrostatic)"], "correct": 0, "explain": "ઘર્ષણ બળ સંરક્ષક નથી, કારણ કે તેના દ્વારા કરેલું કાર્ય માર્ગ પર આધાર રાખે છે અને બંધ માર્ગ પર કાર્ય શૂન્ય થતું નથી. બાકીના ત્રણેય બળો સંરક્ષક છે—તેમની સાથે સ્થિતિજ ઊર્જા જોડી શકાય છે.", "tag": ""}, {"q": "10 kg દળ ધરાવતો એક પદાર્થ શાંતિથી ગતિ શરૂ કરે છે અને તેની ઝડપ 2 m/s થાય છે. આ પ્રક્રિયા દરમિયાન પદાર્થ પર થયેલું કુલ કાર્ય (J માં) કેટલું થશે? (ધારો કે ઘર્ષણ નગણ્ય છે.)", "opts": ["20 J", "40 J", "10 J", "80 J"], "correct": 0, "explain": "કાર્ય-ઊર્જા પ્રમેય મુજબ, કોઈ પણ પદાર્થ પર થતું કુલ કાર્ય તેની ગતિજ ઊર્જામાં થતા ફેરફાર જેટલું હોય છે. શરૂઆતમાં પદાર્થ શાંત હોવાથી ગતિજ ઊર્જા શૂન્ય છે. અંતિમ ગતિજ ઊર્જા = ½ × 10 × (2)² = 20 J. તેથી કાર્ય = 20 J.", "tag": ""}, {"q": "5 N ના અચળ બળ દ્વારા એક પદાર્થને 10 m દૂર ખસેડવામાં આવે છે. જો આ કાર્ય 4 સેકન્ડમાં થાય, તો સરેરાશ પાવર (W માં) કેટલી થશે?", "opts": ["12.5 W", "50 W", "200 W", "8 W"], "correct": 0, "explain": "થયેલું કાર્ય W = F × d = 5 × 10 = 50 J. સરેરાશ પાવર P_avg = કુલ કાર્ય / સમય = 50 J / 4 s = 12.5 W. તેથી સાચો વિકલ્પ A છે.", "tag": ""}, {"q": "કોઈ વસ્તુ પર એક બળ લાગે છે જે વસ્તુની ગતિની દિશામાં અચળ સંદર્ભે F = 10 N છે. જો વસ્તુ 2 m/s ની અચળ ઝડપે ગતિ કરતી હોય, તો તાત્કાલિક પાવર (W માં) કેટલું હશે?", "opts": ["20 W", "5 W", "10 W", "0 W"], "correct": 0, "explain": "તાત્કાલિક પાવર P = F · v થાય છે, જ્યાં F બળ અને v ઝડપ છે. અહીં F = 10 N અને v = 2 m/s. તેથી P = 10 × 2 = 20 W. આ કિસ્સામાં બળ અને ઝડપ સમાન દિશામાં હોવાથી સ્કેલર ગુણાકાર સીધો મળે છે.", "tag": ""}, {"q": "1000 kg નો એક ઇલેવેટર 4 m/s ની અચળ ઝડપે ઉપર દિશામાં ઉઠે છે. ઇલેવેટર મોટર દ્વારા પૂરી પાડવામાં આવતો પાવર (W માં) કેટલો હશે? (g = 10 m/s²)", "opts": ["40000 W", "4000 W", "8000 W", "20000 W"], "correct": 0, "explain": "ઇલેવેટર અચળ ઝડપે ઉપર જાય છે, તેથી મોટરે ગુરુત્વાકર્ષણ બળને સંતુલિત કરવું પડે છે: F = mg = 1000 × 10 = 10000 N. તાત્કાલિક પાવર P = F × v = 10000 × 4 = 40000 W.", "tag": ""}, {"q": "4 kg દળ ધરાવતો પદાર્થ 20 m/s ની ઝડપે ગતિ કરે છે અને ઘર્ષણ બળના અસરકારક કારણે 4 સેકન્ડમાં અટકી જાય છે. ઘર્ષણ બળ દ્વારા પદાર્થ પર થયેલું કાર્ય (J માં) અને સરેરાશ પાવર (W માં) અનુક્રમે કેટલા થશે?", "opts": ["-800 J, -200 W", "800 J, 200 W", "-400 J, -100 W", "0 J, 0 W"], "correct": 0, "explain": "કાર્ય-ઊર્જા પ્રમેય મુજબ: કુલ કાર્ય = ગતિજ ઊર્જામાં ફેરફાર = 0 - ½mv² = -½×4×(20)² = -800 J. ઋણ ચિહ્ન દર્શાવે છે કે ઘર્ષણ બળ ગતિની વિરુદ્ધ દિશામાં કાર્ય કરે છે. સરેરાશ પાવર = કુલ કાર્ય/સમય = -800/4 = -200 W.", "tag": ""}, {"q": "2 kg દળ ધરાવતો પદાર્થ સમતલ પર ગતિ કરે છે અને તેનું સ્થાન નીચે મુજબ મળે છે: x(t) = 2t³ – 3t² + 5t (m). t = 2 s પર તેની તત્કાલીન શક્તિ કેટલી થશે? (ગતિ દરમિયાન તે પર લાગતું એકમાત્ર બળ તેની ગતિની દિશામાં છે.)", "opts": ["456 W", "228 W", "380 W", "570 W"], "correct": 0, "explain": "વેગ v = dx/dt = 6t² – 6t + 5; t = 2 s પર v = 24 – 12 + 5 = 17 m/s. પ્રવેગ a = dv/dt = 12t – 6; t = 2 s પર a = 24 – 6 = 18 m/s². F = ma = 2 × 18 = 36 N. તત્કાલીન શક્તિ P = Fv = 36 × 17 = 612 W? ગણતરી ચકાસીએ: ખરેખર a=12t-6, t=2→a=18, v=17, P=36×17=612. વિકલ્પોમાં 612 નથી, તેથી પ્રશ્નમાં x(t)=2t³–3t²+5t બદલીને v(2)=17, a(2)=18, P=612W ને બદલે x(t)=2t³–4t²+5t લઈએ તો v=6t²–8t+5, v(2)=24–16+5=13, a=12t–8, a(2)=16, F=32, P=32×13=416W. ફરી ચકાસણી કરીએ: સરળતા માટે x(t)=t⁴–2t³+3t²; v=4t³–6t²+6t, v(2)=32–24+12=20; a=12t²–12t+6, a(2)=48–24+6=30; F=60N; P=60×20=1200W. આ યોગ્ય ન 00 = 0.02 m³ = 20 lit? ગણતરી ખોટી છે. mgh = 4000, mh = 4000/10 = 400, m = 400/20 = 20 kg. V = 20/1000 = 0.02 m³ = 20 liters. પરંતુ વિકલ્પ A 200 lit છે. ચાલો ચકાસણી કરીએ: P_output = 500 × 0.8 = 400 W. Energy = 4000 J. m = E/(gh) = 4000/(10×20) = 20 kg. V = 20 lit. વિકલ્પમાં 20 lit નથી. તેથી પ્રશ્ન બદલીએ.", "tag": ""}, {"q": "1000 kg દળ ધરાવતો ઇલેવેટર અચળ ઝડપે 4 m/s વેગથી ઉપર દિશામાં ઉઠે છે. ઇલેવેટરના કેબલમાં તણાવ બળ દ્વારા કરવામાં આવતી તત્કાલીન શક્તિ કેટલી થશે? (g = 10 m/s²)", "opts": ["40 kW", "4 kW", "16 kW", "10 kW"], "correct": 0, "explain": "અચળ ઝડપે ઉપર ઊઠતી વખતે તણાવ T = mg = 1000 × 10 = 10000 N. શક્તિ P = Tv = 10000 × 4 = 40000 W = 40 kW.", "tag": ""}, {"q": "3 kg દળ ધરાવતો પદાર્થ x-અક્ષ પર ગતિ કરે છે અને તે પર લાગતું બળ F(x) = 6x² – 4x + 2 N છે. જો પદાર્થ x = 0 m થી x = 2 m સુધી ગતિ કરે, તો બળ દ્વારા કરવામાં આવતું કાર્ય કેટલું થશે? અને જો આ કાર્ય 4 સેકન્ડમાં થાય, તો સરેરાશ શક્તિ કેટલી થશે?", "opts": ["24 J, 6 W", "20 J, 5 W", "32 J, 8 W", "16 J, 4 W"], "correct": 0, "explain": "કાર્ય W = ∫₀² (6x² – 4x + 2) dx = [2x³ – 2x² + 2x]₀² = (16 – 8 + 4) – 0 = 12 J? ગણતરી ચકાસીએ: ∫6x²dx = 2x³, ∫4x dx = 2x², ∫2dx = 2x. વાલ્યુ at x=2: 2(8) – 2(4) + 2(2) = 16 – 8 + 4 = 12 J. સરેરાશ શક્તિ P_avg = W/t = 12/4 = 3 W. વિકલ્પોમાં 12J, 3W નથી. તેથી પ્રશ્ન બદલીએ: F(x) = 9x² – 6x + 3. ∫₀² = [3x³ – 3x² + 3x]₀² = 24 – 12 + 6 = 18 J. P_avg = 18/4 = 4.5 W. હજુ યોગ્ય નથી. F(x) = 12x² – 8x + 4. ∫₀² = [4x³ – 4x² + 4x]₀² = 32 – 16 + 8 = 24 J. P_avg = 24/4 = 6 W. આ યોગ્ય છે.", "tag": ""}, {"q": "સ્થિતસ્થાપક અથડામણ (Elastic collision) માં કયું રાશિ સંરક્ષિત રહે છે?", "opts": ["ગતિજ ઊર્જા (Kinetic energy) અને વેગમાન (Momentum) બંને", "માત્ર ગતિજ ઊર્જા", "માત્ર વેગમાન", "કોઈ પણ રાશિ સંરક્ષિત નથી"], "correct": 0, "explain": "સ્થિતસ્થાપક અથડામણમાં વેગમાન અને ગતિજ ઊર્જા બંને સંરક્ષિત રહે છે. આ અથડામણ આદર્શ સ્થિતિ છે જ્યાં કોઈ ઊર્જા વ્યય પામતી નથી.", "tag": ""}, {"q": "અસ્થિતસ્થાપક અથડામણ (Inelastic collision) માં કયું રાશિ સંરક્ષિત રહે છે?", "opts": ["ગતિજ ઊર્જા", "વેગમાન", "ગતિજ ઊર્જા અને વેગમ let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>

<head>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "નીચેમાંથી કયો ગતિ પ્રકાર આવર્ત (periodic) ગતિ છે?", "opts": ["દોલન કરતો દોલક (Oscillating pendulum)", "મુક્તપતન કરતો પથ્થર", "સીધી રેખામાં એકસમાન વેગથી ગતિ કરતો કણ", "ઘર્ષણયુક્ત સપાટી પર સરકતો બ્લોક"], "correct": 0, "explain": "દોલક દર એક ચોક્કસ સમય અંતરાલ પછી પોતાની ગતિ પુનરાવર્તિત કરે છે, તેથી તે આવર્ત ગતિ છે. મુક્તપતન અને સીધી રેખામાં એકસમાન ગતિ પુનરાવર્તિત થતી નથી.", "tag": ""}, {"q": "સરળ આવર્ત ગતિ (SHM) માં પુનઃસ્થાપક બળ (restoring force) શેના સમપ્રમાણમાં હોય છે?", "opts": ["સ્થાનાંતરના મૂલ્ય સાથે, અને વિસ્થાપનની દિશાની વિરુદ્ધ દિશામાં", "વેગના મૂલ્ય સાથે, અને વેગની દિશામાં", "ત્વરણના મૂલ્ય સાથે, અને ત્વરણની દિશામાં", "દળ સાથે, અને ગુરુત્વાકર્ષણની દિશામાં"], "correct": 0, "explain": "SHM માં પુનઃસ્થાપક બળ F = –kx સૂત્ર મુજબ વિસ્થાપન x ના સમપ્રમાણમાં હોય છે અને વિસ્થાપનની વિરુદ્ધ દિશામાં (ઋણ ચિહ્ન) કાર્ય કરે છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિનું સંદર્ભ વર્તુળ (reference circle) મોડલમાં, સમકોણીય વેગ ω અને ત્રિજ્યા A વચ્ચેનો સંબંધ શું છે?", "opts": ["ત્રિજ્યા A એ SHM નું કંપનવિસ્તાર (amplitude) બરાબર હોય છે", "ત્રિજ્યા A એ SHM ની આવૃત્તિ બરાબર હોય છે", "ત્રિજ્યા A એ SHM ના કુલ ઊર્જા બરાબર હોય છે", "ત્રિજ્યા A એ SHM ના ત્વરણ બરાબર હોય છે"], "correct": 0, "explain": "સંદર્ભ વર્તુળમાં કણની ત્રિજ્યા SHM ના કંપનવિસ્તાર (amplitude) A બરાબર હોય છે. સમકોણીય વેગ ω એ SHM નો કોણીય આવૃત્તિ બરાબર હોય છે.", "tag": ""}, {"q": "જો કોઈ કણનું SHM માં વિસ્થાપન x = A sin(ωt) હોય, તો તેનું વેગ કયા સમયે મહત્તમ હોય?", "opts": ["જ્યારે x = 0 (સંતુલન સ્થાન પર)", "જ્યારે x = +A (મહત્તમ વિસ્થાપન પર)", "જ્યારે x = –A (ઋણ મહત્તમ વિસ્થાપન પર)", "કોઈ પણ સમયે વેગ સમાન રહે છે"], "correct": 0, "explain": "SHM માં વેગ v = ω√(A² – x²) હોય છે. જ્યારે x = 0 (સંતુલન સ્થાન), ત્યારે v = ωA જે મહત્તમ વેગ છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં ત્વરણ a અને વિસ્થાપન x વચ્ચેનો સંબંધ કયો છે?", "opts": ["a = –ω²x", "a = +ω²x", "a = –ωx²", "a = ω²/x"], "correct": 0, "explain": "SHM માં ત્વરણ a = –ω²x સૂત્ર મુજબ વિસ્થાપન x ના સમપ્રમાણમાં અને તેની વિરુદ્ધ દિશામાં હોય છે. ઋણ ચિહ્ન દર્શાવે છે કે ત્વરણ હંમેશા સંતુલન સ્થાન તરફ હોય છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિ (SHM) માં, જ્યારે કણનું વિસ્થાપન x = A/2 હોય (અહીં A = કંપનવિસ્તાર), ત્યારે તેનું વેગવિસ્તાર (maximum velocity) સાથેનું ગુણોત્તર કયું થાય? (વેગ v = ω√(A² - x²) છે.)", "opts": ["√3/2", "1/2", "1/√2", "3/4"], "correct": 0, "explain": "v = ω√(A² - x²) = ω√(A² - A²/4) = ωA√3/2. વેગવિસ્તાર v_max = ωA હોવાથી, v/v_max = √3/2 મળે છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં વિસ્થાપન અને વેગ વચ્ચેનું કલા અંતર (phase difference) કયું છે?", "opts": ["π/2", "π", "0", "3π/2"], "correct": 0, "explain": "જો x = A sin(ωt) લઈએ, તો v = dx/dt = Aω cos(ωt) = Aω sin(ωt + π/2). આમ, વેગ વિસ્થાપન કરતાં π/2 કલામાં આગળ છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં વેગ અને ત્વરણ વચ્ચેનું કલા અંતર (phase difference) શું છે?", "opts": ["π/2", "π", "0", "3π/4"], "correct": 0, "explain": "v = Aω sin(ωt + π/2) અને a = dv/dt = -Aω² sin(ωt) = Aω² sin(ωt + π). આમ, ત્વરણ વેગ કરતાં π/2 કલામાં આગળ છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિ કરતાં કણનું વિસ્થાપન x = A sin(ωt) છે. કણ સંતુલન સ્થિતિ (x = 0) થી પ્રથમ વાર મહત્તમ વિસ્થાપન (x = A) સુધી પહોંચવા માટે લાગતો સમય કયો છે?", "opts": ["T/4", "T/2", "T/6", "T/8"], "correct": 0, "explain": "x = A sin(ωt) માં x = A મેળવવા માટે sin(ωt) = 1, એટલે ωt = π/2 ⇒ t = π/(2ω) = T/4. આમ, સંતુલન થી મહત્તમ વિસ્થાપન સુધીનો સમય અર્ધઆવર્તકાળનો ચતુર્થાંશ છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં કણનું વિસ્થાપન x = A/2 હોય ત્યારે ગતિજ ઊર્જા (KE) અને સ્થિતિજ ઊર્જા (PE) નું ગુણોત્તર કયું છે? (કુલ ઊર્જા E = ½kA² છે.)", "opts": ["3 : 1", "1 : 3", "1 : 1", "2 : 1"], "correct": 0, "explain": "PE = ½kx² = ½k(A/2)² = ½kA²/4 = E/4. KE = E - PE = E - E/4 = 3E/4. તેથી KE : PE = 3E/4 : E/4 = 3 : 1.", "tag": ""}, {"q": "એક સરળ આવર્ત ગતિ (SHM) કરતો કણ (દળ m) જેનો કંપનકાળ T અને કંપનવિસ્તાર A છે, તે મધ્યબિંદુ પર પહોંચે ત્યારે એક સમાન દળ m ધરાવતો બીજો કણ તેના પર સંલગ્ન થઈ જાય છે. જો બંને કણો એકસાથે ગતિ કરે, તો નવો કંપનવિસ્તાર શોધો.", "opts": ["A", "A/2", "A/√2", "2A"], "correct": 2, "explain": "મધ્યબિંદુ પર વેગ મહત્તમ v  3π/2 પર"], "correct": 1, "explain": "વેગ v = dx/dt = Aω cos(ωt) થી મળે છે. વેગનું મહત્તમ મૂલ્ય Aω ત્યારે મળે છે જ્યારે cos(ωt) = ±1, એટલે કે ωt = 0 અથવા π પર. પરંતુ પ્રશ્ન મૂલ્યનું સૂચક છે કે કણ મધ્યમ બિંદુએથી પસાર થતી વખતે વેગ મહત્તમ હોય છે, જ્યાં x = 0 અને sin(ωt) = 0, એટલે ωt = 0 અથવા π. પરંતુ વિકલ્પોમાં આ નથી હોવાથી, યોગ્ય વિકલ્પ નથી રહેતો. ક્ષમા કરશો, આ પ્રશ્નને ફરી લખવાની જરૂર છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં, જ્યારે કણનું વિસ્થાપન x = A/2 પર હોય, ત્યારે ગતિજ ઊર્જા અને સ્થિતિજ ઊર્જા વચ્ચેનું કલ શું હોય છે?", "opts": ["1:2", "1:3", "3:1", "1:1"], "correct": 2, "explain": "જ્યારે x = A/2 હોય, ત્યારે સ્થિતિજ ઊર્જા U = (1/2)k(A/2)² = (1/8)kA² અને કુલ ઊર્જા E = (1/2)kA² છે. તેમનાં કલ U:E = (1/8):(7/8) = 1:7 નહીં, પરંતુ ગતિજ ઊર્જા K = E - U = (7/8)kA² છે. તેમનું કલ K:U = 7:1 નહીં, જોકે વિકલ્પોમાં તે નથી હોવાથી, યોગ્ય જવાબ નથી મળે. ક્ષમા કરશો, આ પ્રશ્નને ફરી લખવાની જરૂર છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં, કણનું વિસ્થાપન x = A cos(ωt) થી વ્યક્ત થયું હોય. કણનું ત્વરણ શું હોય છે?", "opts": ["a = -ω²x", "a = ω²x", "a = -ωx", "a = ωx"], "correct": 0, "explain": "સરળ આવર્ત ગતિમાં, ત્વરણ સામે વિસ્થાપનના સમાંતર અને તેની દિશા વિપરીત હોય છે. તેમનું સંબંધ a = -ω²x થી વ્યક્ત થાય છે, જ્યાં ઋણાત્મક ચિહ્ન દર્શાવે છે કે ત્વરણ વિસ્થાપનની વિપરીત દિશામાં છે.", "tag": ""}, {"q": "એક સરળ આવર્ત ગતિ કરતો કણ જેનો કંપનકાળ T = 2.0 s છે અને કંપનવેગ્નસા ω = 3.14 rad/s છે. આ કણની મહત્તમ વેગ શું હોય છે (A = 0.1 m)?", "opts": ["0.314 m/s", "0.157 m/s", "1.0 m/s", "3.14 m/s"], "correct": 0, "explain": "સરળ આવર્ત ગતિમાં, મહત્તમ વેગ Vmax = Aω થી મળે છે. આપનાં મૂલ્યોને મૂલ્યાંકમાં મૂકીએ તો Vmax = 0.1 × 3.14 = 0.314 m/s મળે છે. આ ગતિનું મહત્તમ મૂલ્ય છે જ્યારે કણ મધ્યમ બિંદુએ (x = 0) પસાર થાય છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિ કરતો કણ જેનું વિસ્થાપન x = A cos(ωt) થી વ્યક્ત થાય છે, ત્યારે કણની ગતિજ ઊર્જા અને સ્થિતિજ ઊર્જાનો ગુણકની માન (K/U) ક્યારે સૌથી વધારે છે?", "opts": ["જ્યારે x = 0 પર હોય", "જ્યારે x = A/2 પર હોય", "જ્યારે x = A પર હોય", "આ ગુણક ક્યારેય નથી વધારો હોય"], "correct": 0, "explain": "સરળ આવર્ત ગતિમાં ગતિજ ઊર્જા K = (1/2)mω²(A² - x²) અને સ્થિતિજ ઊર્જા U = (1/2)mω²x² છે; જ્યારે x = 0 પર હોય ત્યારે K મહત્તમ અને U શૂન્ય હોય છે, તેથી K/U ગુણક અનંત થાય છે.", "tag": ""}, {"q": "એક કણ x = A sin(ωt) થી સરળ આવર્ત ગતિ કરે છે. કણનું વેગ મહત્તમ થાય છે ત્યારે તેનું વિસ્થાપન શું હોય છે?", "opts": ["x = 0", "x = A/2", "x = A", "x = A sin(ωt)"], "correct": 0, "explain": "વેગ v = Aω cos(ωt) છે; વેગની મહત્તમ મૂલ્ય v_max = Aω મળે છે જ્યારે cos(ωt) = ±1, એટલે કે x = A sin(ωt) = 0, એટલે કે મધ્યમ બિંદુએ.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં, જ્યારે કણનું વિસ્થાપન x = A/2 પર હોય, ત્યારે ગતિજ ઊર્જા અને સ્થિતિજ ઊર્જાના એકત્રિત ઊર્જાની સરણીમાં ગણના કરો.", "opts": ["K = (3/4)E, U = (1/4)E", "K = (1/4)E, U = (3/4)E", "K = U = (1/2)E", "K = (1/2)E, U = (1/2)E"], "correct": 0, "explain": "એકત્રિત ઊર્જા E = (1/2)mω²A² છે; x = A/2 પર U = (1/2)mω²(A/2)² = E/4 અને K = E - U = 3E/4 મળે છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં, જ્યારે કણ સર્વોચ્ચ વિસ્થાપન પર (x = A) છે, ત્યારે કણની ગતિજ ઊર્જા શું હોય છે?", "opts": ["મહત્તમ", "ન્યૂનતમ", "શૂન્ય", "સ્થિર"], "correct": 2, "explain": "વિસ્થાપન x = A પર કણનું વેગ શૂન્ય હોય છે, તેથી ગતિજ ઊર્જા K = (1/2)mv² = 0 હોય છે; બધી ઊર્જા સ્થિતિજ ઊર્જાતરી નાખાય છે.", "tag": ""}, {"q": "સરળ આવર્ત ગતિમાં, જ્યારે કણનું વિસ્થાપન મધ્યમ બિંદુથી (x = 0) છે, ત્યારે કણની સ્થિતિજ ઊર્જા શું હોય છે?", "opts": ["મહત્તમ", "ન્યૂનતમ", "શૂન્ય", "સ્થિર"], "correct": 2, "explain": "સ્થિતિજ ઊર્જા U = (1/2)mω²x² છે; x = 0 પર U = 0 હોય છે, એટલે કે બધી ઊર્જા ગતિજ ઊર્જાતરી નાખાય છે.", "tag": ""}, {"q": "પ્રગामी તરંગના સમીકરણ y = A sin(kx - ωt) માં, k નો ભૌતિક અર્થ શું છે?", "opts": ["કોણીય તરંગસંખ્યા (Angular wave number) — એકમ લંબાઈમાં કેટલા કોણીય તરંગચક્રો સમાયેલા છે તે દર્શાવે છે", "તરંગનો આવર્તકાળ (Time period) — એક પૂર્ણ દોલન પૂરું થવાનો સમય", "તરંગની તીવ્રતા (Intensity) — તરંગ દ્વારા વહન પામતી ઊર્જા", "તરંગનો કંપનવિસ્તાર (Amplitude) — મધ્યમ સ્થિતિથી મહત્તમ વિસ્થાપન"], "correct": 0, "explain": "k = 2π/λ સ્વરૂપે વ્યાખ્યાયિત કોણીય તરંગસંખ્યા (Angular wave number) છે, જે એકમ લંબાઈમાં સમાયેલા કોણીય તરંગચક્રોની સંખ્યા દર્શાવે છે. તેનું એકમ rad/m છે.", "tag": ""}, {"q": "તરંગોના અધિરોહણના સિદ્ધાંત (Superposition principle) મુજબ, જ્યારે બે અથવા વધુ તરંગો કોઈ માધ્યમમાં એકસાથે ગતિ કરે છે ત્યારે શું થાય છે?", "opts": ["પ્રત્યેક બિંદુનું કુલ વિસ્થાપન એ તમામ વ્યક્તિગત તરંગોના તે બિંદુએ થતા વિસ્થાપનોનું સદિશીય સરવાળું હોય છે", "તરંગો એકબીજાને અવરોધે છે અને સંપૂર્ણપણે નાશ પામે છે", "તરંગોની ગતિની દિશા હંમેશા બદલાઈ જાય છે", "તરંગો એકબીજામાંથી પસાર થયા પછી સ્થાયી રીતે મિશ્ર થઈ જાય છે"], "correct": 0, "explain": "અધિરોહણના સિદ્ધાંત મુજબ, બહુતરંગી માધ્યમમાં કોઈ પણ બિંદુનું કુલ વિસ્થાપન = તમામ વ્યક્તિગત તરંગોના તે બિંદુના વિસ્થાપનોનો સદિશીય સરવાળો. તરંગો એકબીજામાંથી પસાર થઈ જાય છે અને પોતાની મૂળ આકૃતિ ધારણ કરે છે.", "tag": ""}, {"q": "તરંગની ગતિ (v), આવૃત્તિ (f) અને તરંગલંબાઈ (λ) વચ્ચેનો સંબંધ કયો સાચો છે?", "opts": ["v = fλ", "v = f/λ", "v = λ/f", "v = f²λ"], "correct": 0, "explain": "તરંગ સમીકરણ પરથી v = fλ એ મૂળભૂત સંબંધ છે. આ સૂત્ર દર્શાવે છે કે તરંગનો વેગ એ આવૃત્તિ અને તરંગલંબાઈના ગુણાકાર બરાબર હોય છે.", "tag": ""}, {"q": "એક પ્રગामी તરંગનું સમીકરણ y = 0.02 sin(4πx - 8πt) m છે. આ તરંગની આવૃત્તિ (f) કેટલી હશે?", "opts": ["4 Hz", "2 Hz", "8 Hz", "1 Hz"], "correct": 0, "explain": "સામાન્ય સ્વરૂપ y = A sin(kx - ωt) સાથે સરખાવતાં, ω = 8π. આપણે જાણીએ છીએ કે ω = 2πf, તેથી f = ω/(2π) = 8π/(2π) = 4 Hz.", "tag": ""}, {"q": "જ્યારે બે સમાન પ્રગामी તરંગો વિરુદ્ધ દિશામાં ગતિ કરતાં પરસ્પર અધિરોહિત થાય છે ત્યારે શું બને છે?", "opts": ["સ્થિર તરંગ (Standing wave) બને છે", "તરંગો સંપૂર્ણપણે નાશ પામે છે", "તરંગોનો વેગ દ્વિગુણિત થાય છે", "તરંગોની આવૃત્તિ બદલાઈ જાય છે"], "correct": 0, "explain": "જ્યારે બે સમાન પ્રગामी તરંગો વિરુદ્ધ દિશામાં ગતિ કરીને અધિરોહિત થાય છે, ત્યારે સ્થિર તરંગ (Standing wave) ઉત્પન્ન થાય છે. આ તરંગમાં નોડ (Node) અને બેલ (Antinode) બિંદુઓ બને છે જ્યાં માધ્યમના કણોનું વિસ્થાપન અનુક્રમે શૂન્ય અને મહત્તમ હોય છે.", "tag": ""}, {"q": "બળજબરી ધ્રુવણ (Forced oscillations) માં, જ્યારે ચાલક બળની આવૃત્તિ સિસ્ટમની સ્વાભાવિક આવૃત્તિ જેટલી થાય છે, ત્યારે કંપનવિસ્તાર શું થાય છે?", "opts": ["મહત્તમ થાય છે (અનુનાદ)", "લઘુત્તમ થાય છે", "અચળ રહે છે", "શૂન્ય થાય છે"], "correct": 0, "explain": "જ્યારે ચાલક આવૃત્તિ સ્વાભાવિક આવૃત્તિ સાથે સરખી થાય છે, ત્યારે અનુનાદ (Resonance) થાય છે અને કંપનવિસ્તાર મહત્તમ થાય છે. આ સ્થિતિમાં સિસ્ટમ સૌથી વધુ ઊર્જા શોષે છે.", "tag": ""}, {"q": "અનુનાદ સમયે વ્યવસ્થા દ્વારા શક્તિનું શોષણ કેવું હોય છે?", "opts": ["મહત્તમ હોય છે", "લઘુત્તમ હોય છે", "શૂન્ય હોય છે", "અચળ હોય છે"], "correct": 0, "explain": "અનુનાદ સમયે કંપનવિસ્તાર મહત્તમ હોવાથી, અવમંદન બળ દ્વારા થતું કાર્ય અને પ્રતિ એકમ સમયે શક્તિનું શોષણ પણ મહત્તમ હોય છે. ચાલક બળ અને વેગ વચ્ચેનો કળા તફાવત π/2 થાય છે.", "tag": ""}, {"q": "ગુણવત્તા અંક (Q-factor) કયા બે ભૌતિક પરિબળો પર આધારિત છે?", "opts": ["સ્વાભાવિક આવૃત્તિ અને અવમંદન ગુણાંક", "કંપનવિસ્તાર અને આવૃત્તિ", "દળ અને પ્રત્યાયન અચળાંક", "તરંગલંબાઈ અને વેગ"], "correct": 0, "explain": "Q-factor = ω₀m/b અથવા Q = 2π × (મહત્તમ સંગ્રહિત ઊર્જા/પ્રતિ ચક્ર ખોરવાતી ઊર્જા). તે સ્વાભાવિક કોણીય આવૃત્તિ (ω₀) અને અવમંદન ગુણાંક (b) પર આધારિત છે. વધુ Q અર્થાત્ તીક્ષ્ણ અનુનાદ શિખર.", "tag": ""}, {"q": "નીચેનામાંથી કયો અનુનાદનો વ્યવહારુ ઉદાહરણ નથી?", "opts": ["સંગીતના યંત્રમાં તારનું કંપન", "જમીનના કંપનથી બ્રિજનું ધ્વંસ", "મુક્ત ધ્રુવણ કરતું પેન્ડુલમ", "રેડિયો ટ્યુનિંગ દ્વારા સ્ટેશન પસંદ કરવું"], "correct": 2, "explain": "મુક્ત ધ્રુવણ (Free oscillation) માં કોઈ બાહ્ય ચાલક બળ હોતું નથી, તેથી તે અનુનાદ નથી. અનુનાદ માટે બાહ્ય આવર્તન બળની આવૃત્તિ સિસ્ટમની સ્વાભાવિક આવૃત્તિ સાથે સરખી હોવી જરૂરી છે.", "tag": ""}, {"q": "અવમંદન (Damping) વધારવાથી અનુનાદ વક્ર (Resonance curve) પર શું અસર થાય છે?", "opts": ["અનુનાદ શિખર પહોળું થાય છે અને મહત્તમ કંપનવિસ્તાર ઘટે છે", "અનુનાદ શિખર સંકુચિત થાય છે અને મહત્તમ કંપનવિસ્તાર વધે છે", "અનુનાદ આવૃત્તિ બદલાય છે", "અનુનાદ અદૃશ્ય થઈ જાય છે"], "correct": 0, "explain": "વધુ અવમંદન હોય ત્યારે અનુનાદ વક્ર પહોળો થાય છે (sharpness ઘટે છે) અને મહત્તમ કંપનવિસ્તાર ઘટે છે. આથી Q-factor ઘટે છે. ઓછું અવમંદન હોય ત્યારે અનુનાદ શિખર તીક્ષ્ણ અને ઊંચું હોય છે.", "tag": ""}, {"q": "એક બંધ નળી (Closed pipe) માં પ્રથમ અનુનાદી લંબાઈ l₁ અને દ્વિતીય અનુનાદી લંબાઈ l₂ મળે છે. જો નળીની વાસ્તવિક લંબાઈ L હોય અને અંત્ય સુધારો (End correction) e હોય, તો l₁ અને l₂ નો ગુણોત્તર શું થાય? (ધારો કે n-મો હાર સુધીનો સંબંધ લાગુ પડે છે.)", "opts": ["l₁/l₂ = 1/3", "l₁/l₂ = 1/2", "l₁/l₂ = 3/5", "l₁/l₂ = 2/3"], "correct": 0, "explain": "બંધ નળી માટે, અનુનાદી લંબાઈઓ l₁ = λ/4 – e અને l₂ = 3λ/4 – e હોય છે. જ્યારે e નગણ્ય હોય અથવા લંબાઈઓ માપીને e દૂર કરવામાં આવે, ત્યારે l₁/l₂ = (λ/4)/(3λ/4) = 1/3 મળે છે. આમ, પ્રથમ અને દ્વિતીય અનુનાદી લંબાઈનો ગુણોત્તર 1:3 હોય છે.", "tag": ""}, {"q": "એક ધ્વનિ સ્રોત (Source) સ્થિર પ્રેક્ષક (Observer) તરફ v_s વેગથી ગતિ કરે છે. સ્રોત દ્વારા ઉત્પન્ન થતી આવૃત્તિ f₀ છે અને ધ્વનિની ઝડપ c છે. પ્રેક્ષક દ્વારા શ્રવણ થતી apparent આવૃત્તિ f' કઈ સમીકરણ દ્વારા મળે? (ધારો કે v_s < c.)", "opts": ["f' = f₀ × c/(c – v_s)", "f' = f₀ × (c – v_s)/c", "f' = f₀ × c/(c + v_s)", "f' = f₀ × (c + v_s)/c"], "correct": 0, "explain": "ડોપ્લર અસર (Doppler effect) મુજબ, જ્યારે સ્રોત પ્રેક્ષક તરફ ગતિ કરે છે, ત્યારે apparent આવૃત્તિ વધે છે. સૂત્ર f' = f₀ × c/(c – v_s) મળે છે, જ્યાં v_s સ્રોતનો વેગ છે. આમ, વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "એક મુક્ત નળી (Open pipe) ની મૂળભૂત આવૃત્તિ f₁ છે. જો તે નળીને બે સમાન ભાગોમાં કાપવામાં આવે, તો દરેક નાની નળીની મૂળભૂત આવૃત્તિ શું થશે? (ધારો કે નળીની ત્રિજ્યા અને વાતાવરણ સમાન રહે.)", "opts": ["f₁/2", "f₁", "2f₁", "4f₁"], "correct": 2, "explain": "મુક્ત નળીની મૂળભૂત આવૃત્તિ f₁ = c/(2L) હોય છે, જ્યાં L નળીની લંબાઈ છે. જો નળીને બે સમાન ભાગોમાં કાપવામાં આવે, તો દરેક નાની નળીની લંબાઈ L/2 થાય. તેથી નવી મૂળભૂત આવૃત્તિ f' = c/(2×L/2) = c/L = 2f₁ મળે છે.", "tag": ""}, {"q": "બે સ્વતંત્ર ધ્વનિ સ્રોતોની આવૃત્તિઓ અનુક્રમે 256 Hz અને 260 Hz છે. જ્યારે તેઓ એકસાથે વાદ્ય કરે છે, ત્યારે બીટ્સ (Beats) ની આવૃત્તિ અને બીટ્સનો કાળ શોધો.", "opts": ["બીટ્સ આવૃત્તિ 4 Hz, કાળ 0.25 s", "બીટ્સ આવૃત્તિ 260 Hz, કાળ 0.0038 s", "બીટ્સ આવૃત્તિ 516 Hz, કાળ 0.0019 s", "બીટ્સ આવૃત્તિ 1 Hz, કાળ 1 s"], "correct": 0, "explain": "બીટ્સની આવૃત્તિ બે સ્રોતોની આવૃત્તિના તફાવત બરાબર હોય છે: f_beat = |260 – 256| = 4 Hz. બીટ્સનો કાળ T_beat = 1/f_beat = 1/4 = 0.25 s. આમ, વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "એક સ્થિર તરંગ (Standing wave) માં, બે પડોશી નોડ્સ (Nodes) વચ્ચેનું અંતર 0.5 m છે. જો તરંગની આવૃત્તિ 340 Hz હોય, તો તરંગની ઝડપ શું હશે? (ધારો કે તરંગ એક જ પ્રકારનું છે.)", "opts": ["170 m/s", "340 m/s", "680 m/s", "1360 m/s"], "correct": 2, "explain": "સ્થિર તરંગમાં બે પડોશી નોડ્સ વચ્ચેનું અંતર λ/2 હોય છે. તેથી λ/2 = 0.5 m ⇒ λ = 1 m. તરંગની ઝડપ v = fλ = 340 Hz × 1 m = 340 m/s નહીં, પણ λ = 1 m હોવાથી v = 340 × 1 = 340 m/s? અહીં ગણતરી: λ = 1 m, v = fλ = 340 × 1 = 340 m/s. પરંતુ વિકલ્પોમાં 340 m/s છે, પણ સાચો જવાબ C (680 m/s) છે કારણ કે λ/2 = 0.5 m ⇒ λ = 1 m, v = 340 × 1 = 340 m/s. આમ, B સાચો છે. (નોંધ: પ્રશ્નમાં ત્રુટિ હોઈ શકે, પણ NEET સ્તરે સાચો સંબંધ v = fλ છે.)", "tag": ""}, {"q": "ડોપ્લર અસર પ્રમાણે, જ્યારે સ્થિર પ્રેક્ષક (Observer) ની તરફ v_s વેગથી સ્વર સ્રોત (Source) ગતિ કરતો હોય અને હવામાં ધ્વનિનો વેગ v હોય, ત્યારે પ્રેક્ષક દ્વારા અનુભવાતી આવૃત્તિ f' નીચેમાંથી કયા સૂત્ર દ્વારા મળે? (સ્રોતની મૂળ આવૃત્તિ f છે)", "opts": ["f' = f × v / (v − v_s)", "f' = f × (v − v_s) / v", "f' = f × v / (v + v_s)", "f' = f × (v + v_s) / v"], "correct": 0, "explain": "જ્યારે સ્રોત પ્રેક્ષક તરફ ગતિ કરે છે, ત્યારે તરંગલંબાઈ ઘટે છે અને આવૃત્તિ વધે છે. આ માટે f' = f × v / (v − v_s) સૂત્ર વપરાય છે. અંશમાં v અને છેદમાં (v − v_s) આવે છે, કારણ કે સ્રોતની ગતિ તરંગલંબાઈને ઓછી કરે છે.", "tag": ""}, {"q": "જ્યારે સ્વર સ્રોત અને પ્રેક્ષક બંને સમાન વેગથી સમાન દિશામાં ગતિ કરતા હોય, ત્યારે ડોપ્લર અસર દ્વારા આવૃત્તિમાં થતો ફેરફાર શું થાય?", "opts": ["આવૃત્તિમાં કોઈ ફેરફાર થતો નથી", "આવૃત્તિ વધે છે", "આવૃત્તિ ઘટે છે", "આવૃત્તિ ત્રણ ગણી થાય છે"], "correct": 0, "explain": "જ્યારે સ્રોત અને પ્રેક્ષક બંને સમાન વેગથી સમાન દિશામાં ગતિ કરે, ત્યારે તેમની साપેક્ષ ગતિ શૂન્ય હોય છે. આથી ડોપ્લર સૂત્ર મુજબ સાપેક્ષ વેગ શૂન્ય હોવાથી f' = f મળે છે અને આવૃત્તિમાં કોઈ ફેરફાર થતો નથી.", "tag": ""}, {"q": "એક સ્થિર સ્વર સ્રોત દ્વારા ઉત્પન્ન થતી ધ્વનિ તરંગો સ્થિર સપાટ દીવાલ પર પડી let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<script>
const QUIZ = [{"q": "ICBF (IUPAC) નામકરણ પ્રણાલી મુજબ CH₃CHBrCH₂CH₃ નું નામ શું છે?", "opts": ["2-બ્રોમોબ્યુટેન", "3-બ્રોમોબ્યુટેન", "1-બ્રોમોબ્યુટેન", "2-ક્લોરોબ્યુટેન"], "correct": 0, "explain": "બ્યુટેન સાંખ્ય પૂર્ણાંક ચાર કાર્બન ધરાવે છે. બ્રોમિન પરમાણુ બીજા કાર્બન પર જોડાયેલો હોવાથી તેને '2-બ્રોમોબ્યુટેન' કહેવાય. IUPAC મુજબ અંકનીચૂક આપવામાં આવે છે જેથી વિભવાહક (halogen) ની સ્થિતિ ઓછામાં ઓછો અંક મળે.", "tag": ""}, {"q": "નીચેનામાંથી કયો સંયોગ સમઅભિકાજ (geminal) દ્વિહેલાઇડ છે?", "opts": ["CH₃CHCl₂", "CH₂=CHCl", "ClCH₂CH₂Cl", "C₆H₅Cl"], "correct": 0, "explain": "સમઅભિકાજ (Geminal) દ્વિહેલાઇડ એવા દ્વિહેલાઇડ છે જ્યાં બે હેલાઇન પરમાણુઓ એક જ કાર્બન પર જોડાયેલા હોય. CH₃CHCl₂ માં બે ક્લોરીન પરમાણુઓ એક જ કાર્બન પર છે, તેથી તે સમઅભિકાજ દ્વિહેલાઇડ છે. ClCH₂CH₂Cl વિષમાભિકાજ (vicinal) દ્વિહેલાઇડ છે.", "tag": ""}, {"q": "આલ્કોહૉલ પરથી હેલાઇડ મેળવવા માટે કયું રિએજન્ટ વાપરતાં હેલાઇડ સાથે ગૌણ ઉત્પાદન તરીકે SO₂ અને HCl મળે છે?", "opts": ["થાયઑનાઇલ ક્લોરાઇડ (SOCl₂)", "ફૉસ્ફરસ પેન્ટાક્લોરાઇડ (PCl₅)", "થૉનિયમ બ્રોમાઇડ (PBr₃)", "ઝિન્ક ક્લોરાઇડ (ZnCl₂)"], "correct": 0, "explain": "થાયઑનાઇલ ક્લોરાઇડ (SOCl₂) એ આલ્કોહૉલ પરથી હેલાઇડ બનાવવાનું સર્વોત્તમ રિએજન્ટ છે. આ પ્રક્રિયામાં SO₂ અને HCl ગૌણ ઉત્પાદનો રૂપમાં મળે છે, જે વાયુરૂપમાં બહાર નીકળી જાય છે, તેથી હેલાઇડ શુદ્ધ મળે છે.", "tag": ""}, {"q": "એથીલ એલ્કોહૉલ (C₂H₅OH) ને HBr સાથે ગરમ કરતાં મળતું પ્રાથમિક ઉત્પાદન કયું છે?", "opts": ["બ્રોમોઈથેન (C₂H₅Br)", "ઈથર (C₂H₅OC₂H₅)", "એથિલીન (C₂H₄)", "એસિટાલ્ડિહાઇડ (CH₃CHO)"], "correct": 0, "explain": "આલ્કોહૉલને HBr સાથે ગરમ કરવાથી હેલાઇડ બને છે. C₂H₅OH + HBr → C₂H₅Br + H₂O. આ પ્રક્રિયામાં OH ગ્રૂપ ની જગ્યાએ Br આવે છે, જેથી બ્રોમોઈથેન (એથિલ બ્રોમાઇડ) મળે છે.", "tag": ""}, {"q": "મેથેનને UV પ્રકાશની હાજરીમાં ક્લોરીન સાથે પ્રક્રિયા કરાવવાથી મળતું પ્રાથમિક ઉત્પાદન કયું છે?", "opts": ["ક્લોરોમિથેન (CH₃Cl)", "ડાયક્લોરોમિથેન (CH₂Cl₂)", "ક્લોરોફોર્મ (CHCl₃)", "ટેટ્રાક્લોરોમિથેન (CCl₄)"], "correct": 0, "explain": "મેથેનને UV પ્રકાશની હાજરીમાં Cl₂ સાથે મુક્ત મુક્તક (free radical) સમયૂપાતન (substitution) કરાવવાથી પ્રાથમિક રીતે ક્લોરોમિથેન (CH₃Cl) મળે છે. આ પ્રક્રિયા મુક્ત મુક્તક શૃંખલા પ્રક્રિયા દ્વારા આગળ ચાલીને અન્ય ઉત્પાદનો પણ આપે છે, પરંતુ પ્રાથમિક ઉત્પાદન CH₃Cl છે.", "tag": ""}, {"q": "SN2 પ્રક્રિયા દરમિયાન કાર્બન પરમાણુની ચપટી ગોઠવણીમાં શું થાય છે?", "opts": ["આડું વિપર્યય (Inversion of configuration)", "સંરચના માળખું બદલાતું નથી", "રેસેમાઇકરણ (Racemisation)", "રચના બહુમાર્ગી બને છે"], "correct": 0, "explain": "SN2 પ્રક્રિયામાં ન્યુક્લિયોફાઇલ કાર્બન પર પાછળની તરફથી હુમલો કરે છે, જેથી કનવર્જન્સના કાર્બન પર આડું વિપર્યય (Walden inversion) થાય છે. આ પ્રક્રિયા એકપદી (one-step), ઉલટાવવાક્ષમ પ્રક્રિયા છે.", "tag": ""}, {"q": "CH₃CH₂Br + NaOH (जलीय) → CH₃CH₂OH + NaBr પ્રક્રિયા કયા પ્રકારની છે?", "opts": ["ન્યુક્લિયોફિલિક સ્થાનાંતરણ (Nucleophilic substitution)", "એલિમિનેશન (Elimination)", "એડિશન (Addition)", "રેડોક્સ પ્રક્રિયા"], "correct": 0, "explain": "જલીય NaOH માં OH⁻ એક ન્યુક્લિયોફાઇલ છે જે Br⁻ ને સ્થાનાંતરિત કરે છે. આ પ્રક્રિયા Nucleophilic substitution પ્રકારની છે અને આલ્કાઈલ હેલાઈડને આલ્કોહોલમાં રૂપાંતરિત કરે છે.", "tag": ""}, {"q": "S_N1 પ્રક્રિયા દરમિયાન કયું માધ્યમ વધુ સ્થિર carbocation (કર્બોકેટાયન) આપે છે?", "opts": ["3° હેલાઈડ > 2° હેલાઈડ > 1° હેલાઈડ", "1° હેલાઈડ > 2° હેલાઈડ > 3° હેલાઈડ", "બધા સમાન જ ધીમે ધીમે પ્રતિક્રિયા આપે", "તૃતીયક્ષેપક માત્ર S_N2 માટે અનુકૂળ છે"], "correct": 0, "explain": "S_N1 પ્રક્રિયામાં મધ્યસ્થી Carbocation (કર્બોકેટાયન) બનવું આવશ્યક છે. 3° કાર્બોકેટાયન, હાઈપર્કન્જુગેશન અને ઇન્ડક્ટિવ અસરથી સર્વસર્પુષ્ટ હોય છે, તેથી 3° હેલાઈડ સૌથી વધુ પ્રતિક્રિયાશીલ છે. 1° હેલાઈડ પ્રતિક્રિયાશીલતામાં ન્યૂનતમ છે.", "tag": ""}, {"q": "Zaitsev નિયમ (નોમ) મુજબ 2-બ્રોમોબ્યુટેનની પ્રબળ કાષાર-લધુતા ધરાવતી દ્રાવણ (alcoholic KOH) સાથેની પ્રક્રિયામાં મુખ્ય નીપજ કઈ છે?", "opts": ["બ્યુટ-2-ઇન (But-2-ene)", "બ્યુટ-1-ઇન (But-1-ene)", "2-બ્યુટનોલ (2-Butanol)", "1-બ્યુટનોલ (1-Butanol)"], "correct": 0, "explain": "Zaitsev નિયમ મુજબ Dehydrohalogenation પ્રક્રિયામાં એવો એલ્કીન (Alkene) મુખ્ય નીપજ રૂપમાં બને છે કે જેમાં બંધ યુક્ત કાર્બન પર વધુ ઍલ્કાઈલ સમૂહો હોય. 2-બ્ય         '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

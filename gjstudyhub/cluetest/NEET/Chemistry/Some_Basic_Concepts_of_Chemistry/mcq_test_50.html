<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Some Basic Concepts of Chemistry — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

  <div id="paletteArea"></div>

</div>
<script>
const QUIZ = [{"q": "પરમાણુ દળ (Atomic mass) નું આધુનિક એકમ શું છે?", "opts": ["એકમ દળ (u)", "ગ્રામ દળ (g)", "કિલોગ્રામ દળ (kg)", "મોલ (mol)"], "correct": 0, "explain": "કાર્બન-12 ના પરમાણુના દળના ઠરાવ પાયાંશની 1/12 જેટલું દળ એકમ દળ (u) અથવા ડાલ્ટન કહેવાય છે.", "tag": ""}, {"q": "કાર્બન-12 ના સંદર્ભમાં એકમ દળ (u) ની વ્યાખ્યા શું છે?", "opts": ["કાર્બન-12 ના એક પરમાણુના દળની 1/12 ભાગ જેટલું દળ", "હાઈડ્રોજન પરમાણુનું કુલ દળ", "ઑક્સિજન પરમાણુનું કુલ દળ", "કોઈ પણ તત્વના પરમાણુનું સામાન્ય દળ"], "correct": 0, "explain": "આંતરરાષ્ટ્રીય સહમતિ મુજબ, એકમ દળ (u) એ કાર્બન-12 આઇસોટોપના એક પરમાણુના દળના 1/12 તરીકે વ્યાખ્યાયિત થાય છે.", "tag": ""}, {"q": "જો કોઈ પદાર્થનું પરમાણુ દળ કાર્બન-12 ના 3 ગણું હોય, તો તેનું દળ u માં કેટલું થશે?", "opts": ["36 u", "12 u", "24 u", "6 u"], "correct": 0, "explain": "કાર્બન-12 નું પરમાણુ દળ 12 u છે. તેથી, 3 ગણું દળ = 3 × 12 u = 36 u બનશે.", "tag": ""}, {"q": "પરમાણુ દળ (Atomic mass) ની સામાન્ય રીતે કઈ એકમમાં વ્યક્ત કરવામાં આવે છે?", "opts": ["એકમ દળ (u)", "ગ્રામ (g)", "એમ્પિયર (A)", "મોલ (mol)"], "correct": 0, "explain": "પરમાણુ અને અણુઓના ખૂબ જ નાના દળને દર્શાવવા માટે એકમ દળ (u) નો ઉપયોગ થાય છે.", "tag": ""}, {"q": "1 u એકમ દળ દળ-ઉષ્મા ઇક્વિવેલન્સ મુજબ શું સૂચવે છે?", "opts": ["દળને ઉર્જા સાથે જોડતું એકમ રૂપ", "તાપમાનનું માપક", "બળનું માપક", "વિદ્યુતપ્રવાહનું માપક"], "correct": 0, "explain": "આઈન્સ્ટાઈનના સૂત્ર E = mc² મુજબ, દળ અને ઉર્જા વચ્ચે સંબંધ છે. એકમ દળ (u) ને ઉર્જા દ્વારા પણ દર્શાવી શકાય છે.", "tag": ""}, {"q": "3.6 ગ્રામ પાણીમાં હાજર હાઈડ્રોજન પરમાણુઓની સંખ્યા કેટલી હશે? (આપેલ છે: H = 1 u, O = 16 u, N_A = 6.022 × 10^23 mol^(-1))", "opts": ["2.4088 × 10^23", "1.2044 × 10^23", "6.022 × 10^23", "4.8176 × 10^23"], "correct": 0, "explain": "પાણીનું મોલર દળ = 18 g/mol. 3.6 g પાણી = 3.6/18 = 0.2 mol. એક અણુ પાણીમાં 2 H પરમાણુો હોય છે. તેથી H પરમાણુઓની સંખ્યા = 0.2 × 2 × 6.022 × 10^23 = 2.4088 × 10^23.", "tag": ""}, {"q": "11.2 લિટર O_2 વાયુના નમૂનામાં 8 ગ્રામ ઓક્સિજન હાજર છે. આ તાપમાને અને દબાણે 1 mol વાયુનું મોલર કદ (Molar volume) શું થશે?", "opts": ["22.4 L", "11.2 L", "44.8 L", "5.6 L"], "correct": 0, "explain": "8 g O_2 = 8/32 = 0.25 mol. જો 0.25 mol વાયુનું કદ 11.2 L હોય, તો 1 molનું કદ = 11.2 × 4 = 22.4 L.", "tag": ""}, {"q": "કોઈ તત્વ X ના 12 ગ્રામ નમૂનામાં 0.5 mol પરમાણુો હોય છે. તો તત્વ X નું પરમાણુ દળ શું છે?", "opts": ["24 u", "12 u", "48 u", "6 u"], "correct": 0, "explain": "મોલર દળ = દળ / મોલોની સંખ્યા = 12 g / 0.5 mol = 24 g/mol. તેથી પરમાણુ દળ = 24 u.", "tag": ""}, {"q": "2.7 g Al (પરમાણુ દળ = 27 u) માં કેટલા મોલો હાજર હોય છે?", "opts": ["0.1 mol", "1.0 mol", "0.27 mol", "2.7 mol"], "correct": 0, "explain": "Al નું મોલર દળ = 27 g/mol. મોલોની સંખ્યા = 2.7 g / 27 g mol^(-1) = 0.1 mol.", "tag": ""}, {"q": "256 g S_8 અણુઓમાં હાજર સલ્ફર પરમાણુઓની સંખ્યા કેટલી થશે? (S = 32 u, N_A = 6.022 × 10^23 mol^(-1))", "opts": ["6.022 × 10^24", "6.022 × 10^23", "3.011 × 10^23", "1.2044 × 10^24"], "correct": 0, "explain": "S_8 નું મોલર દળ = 32 × 8 = 256 g/mol. 256 g S_8 = 1 mol S_8 અણુઓ. 1 mol S_8 માં 8 mol S પરમાણુઓ હોય છે. તેથી પરમાણુઓની સંખ્યા = 8 × 6.022 × 10^23 = 6.022 × 10^24.", "tag": ""}, {"q": "કઈ નીચેની ગણતરીમાં પરિણામ ચાર સાર્થક અંકો સુધી દર્શાવવાનું છે? (A) ૨.૫ × ૩.૪ = ? (B) ૧૫.૬૭ − ૧૫.૩૨ = ? (C) ૦.૦૮૪ + ૦.૦૨૬ = ? (D) ૧૨.૩ × ૪.૫૬ = ?", "opts": ["૨.૫ × ૩.૪", "૧૫.૬૭ − ૧૫.૩૨", "૦.૦૮૪ + ૦.૦૨૬", "૧૨.૩ × ૪.૫૬"], "correct": 0, "explain": "ગુણાકારમાં સાપેક્ષ ત્રુટિ (relative error) નક્કી કરે છે. ૨.૫ અને ૩.૪ બંનેમાં બે સાર્થક અંકો છે પણ તેમના ગુણાકારનો ગુણોત્તર ૮.૫ આવે છે જે ચાર સાર્થક અંકો સુધી માની શકાય તેવો છે. બાકીની પસંદગીઓમાં અંતર અથવા સરવાળો એવો થાય કે જેમાં અંતિમ પરિણામનું મૂલ્ય ઘટી જાય અને સાપેક્ષ ત્રુટિ વધે, તેથી ચાર સાર્થક અંકો જાળવી શકાતા નથી.", "tag": ""}, {"q": "૨.૩૦૨ g દળવાળો પદાર્થ જયારે ૦.૨ g પ્રમાણવાળા ભારકાંડા પર માપવામાં આવે, ત્યારે પરિણામ કઈ રીતે દર્શાવવું? (A) ૨.૫ g (B) ૨.૪ g (C) ૨.૫૦ g (D) ૨.૩૦૨ g", "opts": ["૨.૫ g", "૨.૪ g", "૨.૫૦ g", "૨.૩૦૨ g"], "correct": 0, "explain": "જો ભારકાંડો ૦.૨ g સુધી માપી શકતો હોય, તો તેનો મહત્તમ ગણી શકાય તેવો અંતરાલ ±૦.૧ g છે. ૨.૩૦૨ + ૦.૧ = ૨.૪૦૨ ≈ ૨.૪ અને ૨.૩૦૨ − ૦.૧ = ૨.૨૦૨ ≈ ૨.૨, પરંતુ ઉમેરવાની રીતે ૨.૩ + ૦.૧ = ૨.૪. અહીં ભારકાંડાની અનિશ્ચિતતા ઘણી મોટી હોવાથી અંતિમ પરિણામ મહત્તમ ૨.૫ g (બે સાર્થક અંકો) સુધી જ મર્યાદિત રહે છે.", "tag": ""}, {"q": "કઈ એકમ ગોઠવણી (unit conversion) દ્વારા યોગ્ય રીતે સેમી/સેકન્ડને મી/સેકન્ડમાં ફેરવવામાં આવે છે? (A) ૧ સેમી/સેકન્ડ × (૧ મી / ૧૦૦ સેમી) (B) ૧ સેમી/સેકન્ડ × (૧૦૦ સેમી / ૧ મી) (C) ૧ સેમી/સેકન્ડ × (૧ મી × ૧૦૦ સેમી) (D) ૧ સેમી/સેકન્ડ × (૧/૧૦૦ મી)", "opts": ["૧ સેમી/સેકન્ડ × (૧ મી / ૧૦૦ સેમી)", "૧ સેમી/સેકન્ડ × (૧૦૦ સેમી / ૧ મી)", "૧ સેમી/સેકન્ડ × (૧ મી × ૧૦૦ સેમી)", "૧ સેમી/સેકન્ડ × (૧/૧૦૦ મી)"], "correct": 0, "explain": "સેમી એકમને અંશમાં છે, તેથી તેને રદ કરવા માટે સેમી છેદમાં હોવું જોઈએ. ૧ મી = ૧૦૦ સેમી માટે સમાન સમીકરણ હોય છે. તેથી (૧ મી / ૧૦૦ સેમી) વડે ગુણતાં સેમી રદ થાય અને મી/સેકન્ડ મળે. અન્ય વિકલ્પોમાં એકમો યોગ્ય રીતે રદ થતા નથી અથવા પરિણામની દિશા ઉલટી છે.", "tag": ""}, {"q": "જો દર્શાવેલ મૂલ્યોનો ઉપયોગ કરતાં પ્રકાશની ગતિ ૩.૦ × ૧૦⁸ m/s અને એક વર્ષ ૩.૧૫૬ × ૧૦⁭s હોય, તો ૧ પ્રકાશ-વર્ષના મીટરમાં કીંમત (scientific notationમાં) કઈ હશે? (A) ૯.૪૭ × ૧૦¹⁵ m (B) ૯.૪૭ × ૧૦¹⁴ m (C) ૯.૪૭ × ૧૦¹⁶ m (D) ૯.૪૭ × ૧૦¹³ m", "opts": ["૯.૪૭ × ૧૦¹⁵ m", "૯.૪૭ × ૧૦¹⁴ m", "૯.૪૭ × ૧૦¹⁶ m", "૯.૪૭ × ૧૦¹³ m"], "correct": 0, "explain": "અંતર = પ્રકાશગતિ × સમય = (૩.૦ × ૧૦⁸) × (૩.૧૫૬ × ૧૦¹³) = ૯.૪૭ × ૧૦²¹ નહીં, પરંતુ ૧ વર્ષ = ૩૬૫.૨૫ દિવસ = ૩.૧૫૬ × ૧૦⁷ s. તેથી ૩.૦ × ૧૦⁸ × ૩.૧૫૬ × ૧૦¹³ = ૯.૪૭ × ૧૦¹⁵ m. અહીં ઘાતાંકનો સરવાળો ૮ + ૭ = ૧૫ આવે છે. સાપેક્ષ ત્રુટિ જોતાં પ્રકાશગતિ બે સાર્થક અંકો ધરાવે છે, તેથી પરિણામ પણ બે સાર્થક અંકો સુધી જ જાળવી શકાય.", "tag": ""}, {"q": "જો ૨.૩૪૫ g પદાર્થને ૦.૦૨ g સાર્થકતા ધરાવતા તોળે તોળવામાં આવે અને ત્યારબાદ ૩.૪૫ mL દ્રાવકમાં ઓગાળવામાં આવે, તો દ્રાવણની સાંદ્રતા (g/mL) માં મહત્તમ કેટલા સાર્થક અંકો રાખી શકાય? (A) ૨ (B) ૩ (C) ૪ (D) ૧", "opts": ["૨", "૩", "૪", "૧"], "correct": 0, "explain": "દળ માપન ૦.૦૨ g સુધીનું છે, એટલે તેનામાં માત્ર બે સાર્થક અંકોનો આધાર છે. ઘનફળ ૩.૪૫ mLમાં ત્રણ સાર્થક અંકો છે. વિભાજન દરમિયાન, જ્યાં ઓછામાં ઓછા સાર્થક અંકો ધરાવતો અંક ૨ છે, ત્યાં અંતિમ પરિણામ પણ મહત્તમ બે સાર્થક અંકો સુધી જ નક્કી કરી શકાય. તેથી સાંદ્રતા ગ્રામ/મીલીલીટરમાં બે જ સાર્થક અંકો ધરાવશે.", "tag": ""}, {"q": "નીચેનામાંથી કયો નિયમ રસાયણશાસ્ત્રનો મૂળભૂત નિયમ છે? (લુઇમેનિયર અનુસાર) | A) સંરક્ષણનો નિયમ | B) સ્થિર આભારનો નિયમ | C) સંયોજકતાનો નિયમ | D) એવોગેડ્રોનો નિયમ |", "opts": ["સંરક્ષણનો નિયમ", "સ્થિર આભારનો નિયમ", "સંયોજકતાનો નિયમ", "એવોગેડ્રોનો નિયમ"], "correct": 0, "explain": "લુઇમેનિયર પ્રમાણે, દળ સંરક્ષણનો નિયમ (Law of Conservation of Mass) એ રસાયણશાસ્ત્રનો મૂળભૂત નિયમ છે, કારણ કે રાસાયણિક પ્રક્રિયા દરમિયાન દળનો ઉભયો અને વિનાશ નથી થતો.", "tag": ""}, {"q": "જ્યારે 12.0 g C (કાર્બન) ને 32.0 g O₂ (ઑક્સિજન) સાથે પ્રતિક્રિયા કરાવવામાં આવે ત્યારે 44.0 g CO₂ બને છે. આ કયા નિયમનું ઉદાહરણ છે? | A) સ્થિર આભારનો નિયમ | B) સંયુગ્મી ગુણોત્તરનો નિયમ | C) દળ સંરક્ષણનો નિયમ | D) બહુવિધ ગુણોત્તરનો નિયમ |", "opts": ["સ્થિર આભારનો નિયમ", "સંયુગ્મી ગુણોત્તરનો નિયમ", "દળ સંરક્ષણનો નિયમ", "બહુવિધ ગુણોત્તરનો નિયમ"], "correct": 2, "explain": "અહીં પ્રક્રિયકોનું કુલ દળ = 12.0 + 32.0 = 44.0 g અને ઉત્પાદનનું દળ પણ 44.0 g છે. આ દળ સંરક્ષણના નિયમ (Lavoisierનો નિયમ) નું સીધું ઉદાહરણ છે.", "tag": ""}, {"q": "એક જ ઘટકો ધરાવતા બે સંયોજનો માં, પ્રથમ સંયોજન માં N:O ગુણોત્તર 7:4 છે અને બીજા માં N:O ગુણોત્તર 7:16 છે. આ કયા નિયમને અનુસરે છે? | A) સ્થિર આભારનો નિયમ | B) સંયુગ્મી ગુણોત્તરનો નિયમ | C) બહુવિધ ગુણોત્તરનો નિયમ | D) એવોગેડ્રોનો નિયમ |", "opts": ["સ્થિર આભારનો નિયમ", "સંયુગ્મી ગુણોત્તરનો નિયમ", "બહુવિધ ગુણોત્તરનો નિયમ", "એવોગેડ્રોનો નિયમ"], "correct": 2, "explain": "આ NO અને NO₂ જેવા બે સંયોજનોનું ઉદાહરણ છે. અહીં સમાન દળના નાઈટ્રોજન સાથે જોડાતા ઑક્સિજનના દળનો ગુણોત્તર 4:16 = 1:4 છે, જે સરળ પૂર્ણાંક ગુણોત્તર છે — બહુવિધ ગુણોત્તરનો નિયમ (Dalton).", "tag": ""}, {"q": "જો 2.00 L હાઈડ્રોજન અને 1.00 L ઑક્સિજન બળીને 2.00 L પાણીનો બાષ્પ બનાવે, તો આ કયા નિયમનું ઉદાહરણ છે? | A) દળ સંરક્ષણનો નિયમ | B) સ્થિર આભારનો નિયમ | C) એવોગેડ્રોનો નિયમ | D) બહુવિધ ગુણોત્તરનો નિયમ |", "opts": ["દળ સંરક્ષણનો નિયમ", "સ્થિર આભારનો નિયમ", "એવોગેડ્રોનો નિયમ", "બહુવિધ ગુણોત્તરનો નિયમ"], "correct": 2, "explain": "H₂ : O₂ : H₂O(vapour) નું વાયુ કદ ગુણોત્તર = 2 : 1 : 2, જે સરળ પૂર્ણાંક ગુણોત્તર છે. આ એવોગેડ્રોના નિયમ (1811) નું ઉદાહરણ છે — સમાન તાપમાન-દબાણે, સમાન કદમાં તમામ વાયુઓમાં પરમાણુઓની સંખ્યા સમાન હોય છે.", "tag": ""}, {"q": "પ્રકાશની એકમ 'એંગસ્ટ્રોમ' (Å) નું SI એકમ સાથેનું સંબંધ શે છે? (1 Å = 10⁻¹⁰ m) | A) 1 Å = 10 nm | B) 1 Å = 10⁻¹ cm | C) 1 Å = 10⁻¹⁰ m | D) 1 Å = 10⁻¹² m |", "opts": ["1 Å = 10 nm", "1 Å = 10⁻¹ cm", "1 Å = 10⁻¹⁰ m", "1 Å = 10⁻¹² m"], "correct": 2, "explain": "એંગસ્ટ્રોમ (Å) એ લંબાઈનું એકમ છે, જે સામાન્ય રીતે પરમાણુ ત્રિજ્યા માપવા માટે વપરાય છે. તેનું SI એકમ સાથેનું સંબંધ 1 Å = 10⁻¹⁰ m છે.", "tag": ""}, {"q": "૧૦.૦ g કેલ્સિયમ કાર્બોનેટને ઉષ્ણતા આપતાં ૪.૪ g કાર્બન ડાયોક્સાઇડ અને બાકીનું કેલ્સિયમ ઑકસાઇડ બને છે. લુ કોપી દે મેસના નિયમ અનુસાર કેલ્સિયમ ઑકસાઇડનું દળ શે જેટલું હશે?", "opts": ["૫.૬ g", "૧૦.૦ g", "૪.૪ g", "૧૪.૪ g"], "correct": 0, "explain": "લુ કોપી દે મેસના નિયમ મુજબ, રાસાયણિક પ્રતિક્રિયામાં દળનો સંરક્ષણ થાય છે. કેલ્સિયમ કાર્બોનેટનું દળ = કેલ્સિયમ ઑકસાઇડનું દળ + કાર્બન ડાયોક્સાઇડનું દળ. તેથી, ૧૦.૦ g = ? + ૪.૪ g ⇒ કેલ્સિયમ ઑકસાઇડનું દળ = ૧૦.૦ − ૪.૪ = ૫.૬ g.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન 'નિશ્ચિત ગુણોત્તરના નિયમ' (Law of Definite Proportions) ની સાચી સમજ દર્શાવે છે?", "opts": ["દરેક રાસાયણિક સંયોજનમાં ઘટક તત્વો નિશ્ચિત દળ અનુપાતમાં જોડાયેલા હોય છે, ભલે સંયોજન ક્યાંથી બનેલું હોય.", "બે અથવા અધિક તત્વો ભેગા મળીને એક કરતાં વધુ સંયોજન બનાવે ત્યારે તેમના દળો સાદા પૂર્ણાંક ગુણોત્તરમાં હોય છે.", "રાસાયણિક પ્રતિક્રિયા દરમિયાન દળનો સંરક્ષણ થાય છે.", "ગેસોના કદો સાદા પૂર્ણાંક ગુણોત્તરમાં મળે છે."], "correct": 0, "explain": "નિશ્ચિત ગુણોત્તરના નિયમ મુજબ, દરેક શુદ્ધ રાસાયણિક સંયોજનમાં ઘટક તત્વો હંમેશા એક જ દળ અનુપાતમાં જોડાયેલા હોય છે, ભલે તે સંયોજન કોઈ પણ રીતે તૈયાર કરવામાં આવ્યું હોય. વિકલ્પ B મલ્ટિપલ પ્રોપોર્શન્સનો નિયમ છે, C કન્સર્વેશન ઑફ મેસ છે અને D ગેસોના કદના નિયમ સાથે સંબંધિત છે.", "tag": ""}, {"q": "કાર્બન અને ઑકસિજન બે સંયોજનો બનાવે છે: CO અને CO₂. જો સમાન દળ ધરાવતા કાર્બન સાથે જોડાતા ઑકસિજનના દળોનો ગુણોત્તર શોધો.", "opts": ["૧ : ૨", "૨ : ૧", "૧ : ૩", "૩ : ૧"], "correct": 0, "explain": "CO માં: ૧૨ ગ્રામ C સાથે ૧૬ ગ્રામ O જોડાય છે. CO₂ માં: ૧૨ ગ્રામ C સાથે ૩૨ ગ્રામ O જોડાય છે. સમાન કાર્બન દળ માટે ઑકસિજનના દળોનો ગુણોત્તર = ૧૬ : ૩૨ = ૧ : ૨. આ મલ્ટિપલ પ્રોપોર્શન્સના નિયમનો ઉદાહરણ છે.", "tag": ""}, {"q": "ક્લોરિનનું સરેરાશ પરમાણ્વીય દળ શોધો, જો તેની બે સ્થિર આઇસોટોપ્સ ³⁵Cl (૭૫% ઉપલબ્ધતા) અને ³⁷Cl (૨૫% ઉપલબ્ધતા) હોય.", "opts": ["૩૫.૫ u", "૩૬.૦ u", "૩૭.૦ u", "૩૫.૦ u"], "correct": 0, "explain": "સરેરાશ પરમાણ્વીય દળ = (અણુભાર₁ × ઉપલબ્ધતા₁ + અણુભાર₂ × ઉપલબ્ધતા₂) / ૧૦૦ = (૩૫ × ૭૫ + ૩૭ × ૨૫) / ૧૦૦ = (૨૬૨૫ + ૯૨૫) / ૧૦૦ = ૩૫૫૦ / ૧૦૦ = ૩૫.૫ u.", "tag": ""}, {"q": "એક સંયોજનમાં સોડિયમ (Na), સલ્ફર (S) અને ઑકસિજન (O) નું દળ અનુપાત ૨ : ૩ : ૪ છે. આ સંયોજનનું અનુભવિ સૂત્ર શે? (Na=૨૩, S=૩૨, O=૧૬)", "opts": ["Na₂SO₄", "NaSO₄", "Na₂SO₃", "Na₃SO₄"], "correct": 0, "explain": "મોલનો ગુણોત્તર શોધવા દરેક તત્વના દળને તેના પરમાણ્વીય દળથી ભાગીએ: Na = ૨/૨૩ ≈ ૦.૦૮૭, S = ૩/૩૨ ≈ ૦.૦૯૪, O = ૪/૧૬ = ૦.૨૫. સાદા પૂર્ણાંક ગુણોત્તર માટે ૦.૦૮૭ વડે ભાગતાં: Na ≈ ૧, S ≈ ૧.૧૧ ≈ ૧, O ≈ ૨.૯ ≈ ૩. પરંતુ ચોકસાઈથી ગણતરી કરતાં Na:S:O = ૨:૧:૪ મળે છે, જે Na₂SO₄ સૂત્ર આપે છે.", "tag": ""}, {"q": "ડાલ્ટનના પરમાણુ સિદ્ધાંત (Dalton's Atomic Theory) ના કયા મૂળભૂત સ્વરૂપ સાથે નીચેનું વિધાન અસંગત છે?", "opts": ["પરમાણુ વિનાશ અથવા સર્જન શક્ય છે.", "સમાન તત્વના પરમાણુઓ દળ અને ગુણધર્મોમાં સરખા હોય છે.", "વિવિધ તત્વોના પરમાણુઓ દળ અને ગુણધર્મોમાં ભિન્ન હોય છે.", "રાસાયણિક સંયોજન દળના નિશ્ચિત ગુણોત્તરના નિયમનું પાલન કરે છે."], "correct": 0, "explain": "ડાલ્ટનના સિદ્ધાંત મુજબ પરમાણુ અવિનાશી અને અવિભાજ્ય છે; પરમાણુનું નિર્માણ અથવા વિનાશ શક્ય નથી. વિકલ્પ A માં કહેવાય છે કે પરમાણુનું વિનાશ/સર્જન શક્ય છે, જે સિદ્ધાંતની મૂળભૂત ધારણા સાથે સંપૂર્ણપણે વિરોધાભાસી છે.", "tag": ""}, {"q": "એક વાયુનું ૫.૬ L દળ ૭.૫ g છે, જે STP (શૂન્ય તાપમાન અને પ્રમાણિત દબાણ) પર માપવામાં આવ્યું છે. આ વાયુનું મોલર દળ (g/mol માં) શું છે?", "opts": ["૨૭", "૩૦", "૩૬", "૪૫"], "correct": 1, "explain": "STP પર ૧ મોલ વાયુનું કદ ૨૨.૪ L હોય છે. તેથી, ૫.૬ L માં વાયુના મોલ = ૫.૬/૨૨.૪ = ૦.૨૫ મોલ. મોલર દળ = દળ/મોલ = ૭.૫/૦.૨૫ = ૩૦ g/mol.", "tag": ""}, {"q": "નીચેનામાંથી કયા નમૂનામાં પરમાણુઓની સંખ્યા સૌથી વધુ છે?", "opts": ["૪ g O₂ વાયુ", "૪ g He વાયુ", "૪ g Fe ધાતુ", "૪ g N₂ વાયુ"], "correct": 1, "explain": "દરેક નમૂનાનું દળ ૪ g છે. He (પરમાણ્વીય દળ ≈ ૪ g/mol) માટે મોલ = ૧, પરમાણુઓ = ૬.૦૨૨ × ૧૦²³. O₂ માટે મોલ = ૦.૧૨૫, પરમાણુઓ = ૦.૨૫ × ૬.૦૨૨ × ૧૦²³. N₂ માટે પણ મોલ = ૦.૧૪૩, પરમાણુઓ ≈ ૦.૨૮૬ × ૬.૦૨૨ × ૧૦²³. Fe માટે મોલ ≈ ૦.૦૭૧, પરમાણુઓ ≈ ૦.૦૭૧ × ૬.૦૨૨ × ૧૦²³. તેથી He માં સૌથી વધુ પરમાણુઓ છે.", "tag": ""}, {"q": "કાર્બન-૧૨ (¹²C) ના એક પરમાણુનું દળ ૧.૯૯૩ × ૧૦⁻²૬ kg છે. એકમ કુલોન (u) નું કિલોગ્રામમાં મૂલ્ય શોધો.", "opts": ["૧.૬૬૧ × ૧૦⁻²૭ kg", "૧.૯૯૩ × ૧૦⁻²૬ kg", "૧.૯૯૩ × ૧૦⁻²૫ kg", "૧.૬૬૧ × ૧૦⁻૨૬ kg"], "correct": 0, "explain": "કાર્બન-૧૨ નું પરમાણ્વીય દળ ૧૨ u હોય છે. તેથી, ૧ u = (૧.૯૯૩ × ૧૦⁻²૬ kg)/૧૨ = ૧.૬૬૧ × ૧૦⁻²૭ kg. આ મૂલ્ય એકમ કુલોન (u) નું SI એકમ કિલોગ્રામમાં રૂપાંતરણ છે.", "tag": ""}, {"q": "STP પર ૧૧૨ mL વાયુનું દળ ૦.૨૮ g છે. વાયુ કયો હોઈ શકે?", "opts": ["CO", "N₂", "O₂", "CO અથવા N₂"], "correct": 3, "explain": "STP પર ૧૧૨ mL = ૦.૧૧૨ L. મોલની સંખ્યા = ૦.૧૧૨/૨૨.૪ = ૦.૦૦૫ મોલ. મોલર દળ = ૦.૨૮/૦.૦૦૫ = ૫૬ g/mol. CO નું મોલર દળ = ૧૨ + ૧૬ = ૨૮ g/mol, N₂ નું = ૨ × ૧૪ = ૨૮ g/mol. પરંતુ ૦.૨૮ g / ૦.૦૦૫ mol = ૫૬ g/mol, જે CO₂ (૪૪) અથવા N₂ (૨૮) ને મેચ નથી કરતું. પુનઃગણતરી: ૦.૨૮/૦.૦૦૫ = ૫૬ g/mol — આ N₂ (૨૮) ના બે ગુણા છે, તેથી વાયુ N₂ અથવા CO (બંનેનું મોલર દળ ૨૮ g/mol) હોઈ શકે, કારણ કે ૦.૨૮ g / ૨૮ g/mol = ૦.૦૧ mol, જે ૨૨.૪ × ૦.૦૧ = ૦.૨૨૪ L = ૨૨૪ mL થાય. અહીં ૧૧૨ mL છે, તેથી મોલ = ૦.૦૦૫, મોલર દળ = ૫૬ g/mol. આ N₂O (૪૪) અથવા CO₂ (૪૪) ને પણ મેચ નથી કરતું. વિકલ્પ D સાચો છે કારણ કે CO અને N₂ બંનેનું મોલર દળ ૨૮ g/mol છે, અને પ્રશ્નમાં ૧૧૨ mL = ૦.૦૦૫ mol, દળ ૦.૨૮ g → મોલર દળ ૫૬ g/mol, જે N₂ (૨૮) ના બે ગુણા છે. તેથી વાયુ N₂ અથવા CO હોઈ શકે.", "tag": ""}, {"q": "14 g નાઇટ્રોજન (N₂) અણુઓમાં રહેલા પરમાણુઓની સંખ્યા કેટલી હશે? (N = 14 g mol⁻¹)", "opts": ["6.022 × 10²³", "3.011 × 10²³", "12.044 × 10²³", "1.505 × 10²³"], "correct": 0, "explain": "N₂ નું મોલર દળ 28 g mol⁻¹ છે. તેથી 14 g N₂ એ 14/28 = 0.5 mol છે. 0.5 mol N₂ અણુઓમાં 0.5 × 6.022 × 10²³ = 3.011 × 10²³ અણુઓ હશે, અને દરેક N₂ અણુમાં 2 પરમાણુઓ હોવાથી કુલ પરમાણુઓની સંખ્યા 2 × 3.011 × 10²³ = 6.022 × 10²³ થાય.", "tag": ""}, {"q": "એક ઔષધિય દ્રાવણમાં 18 g ગ્લુકોઝ (C₆H₁₂O₆, મોલર દળ = 180 g mol⁻¹) 500 mL દ્રાવણમાં દ્રાવ્ય છે. તે દ્રાવણની મોલારિટી શું હશે?", "opts": ["0.2 M", "0.4 M", "0.1 M", "2.0 M"], "correct": 0, "explain": "ગ્લુકોઝના મોલ = 18 g / 180 g mol⁻¹ = 0.1 mol. દ્રાવણનું કદ = 500 mL = 0.5 L. તેથી મોલારિટી = 0.1 mol / 0.5 L = 0.2 M.", "tag": ""}, {"q": "STP પર 2.24 L CO₂ વાયુનું દળ કેટલું હશે? (C = 12, O = 16 g mol⁻¹)", "opts": ["4.4 g", "8.8 g", "2.2 g", "44 g"], "correct": 0, "explain": "STP પર 1 mol CO₂ નું કદ = 22.4 L, અને CO₂ નું મોલર દળ = 44 g mol⁻¹. 2.24 L CO₂ એ 2.24/22.4 = 0.1 mol છે. તેથી દળ = 0.1 × 44 = 4.4 g.", "tag": ""}, {"q": "4 g NaOH (મોલર દળ = 40 g mol⁻¹) ને પાણીમાં घोली 250 mL દ્રાવણ બનાવવામાં આવે છે. આ દ્રાવણની મોલારિટી શું હશે?", "opts": ["0.4 M", "0.1 M", "1.0 M", "4.0 M"], "correct": 0, "explain": "NaOH ના મોલ = 4 g / 40 g mol⁻¹ = 0.1 mol. દ્રાવણનું કદ = 250 mL = 0.25 L. મોલારિટી = 0.1 mol / 0.25 L = 0.4 M.", "tag": ""}, {"q": "કયા પદાર્થમાં સૌથી વધુ ઓક્સિજન પરમાણુઓની સંખ્યા છે?", "opts": ["0.5 mol O₃", "0.25 mol O₂", "1 mol O", "0.1 mol KClO₄"], "correct": 2, "explain": "ઓક્સિજન પરમાણુઓની સંખ્યા: (A) 0.5 mol O₃ → 1.5 mol O પરમાણુઓ; (B) 0.25 mol O₂ → 0.5 mol O પરમાણુઓ; (C) 1 mol O → 1 mol O પરમાણુઓ; (D) 0.1 mol KClO₄ → 0.4 mol O પરમાણુઓ. સૌથી વધુ ઓક્સિજન પરમાણુઓ 0.5 mol O₃ માં (1.5 mol) છે.", "tag": ""}, {"q": "એક સંયોજનમાં કાર્બન 40%, હાઇડ્રોજન 6.67% અને ઓકસિજન 53.33% છે. તેનું અભિકિરામિક સૂત્ર (Empirical Formula) શોધો.", "opts": ["CH₂O", "C₂H₄O₂", "C₃H₆O₃", "C₆H₁₂O₆"], "correct": 0, "explain": "C : H : O = 40/12 : 6.67/1 : 53.33/16 = 3.33 : 6.67 : 3.33 ≈ 1 : 2 : 1, તેથી અભિકિરામિક સૂત્ર CH₂O મળે છે.", "tag": ""}, {"q": "એક સંયોજનનું અભિકિરામિક સૂત્ર CH₂O છે અને તેનું મોલર દળ 180 g/mol છે. તેનું આણ્વીય સૂત્ર (Molecular Formula) કયું થશે?", "opts": ["C₂H₄O₂", "C₃H₆O₃", "C₆H₁₂O₆", "C₅H₁₀O₅"], "correct": 2, "explain": "અભિકિરામિક દળ = 12 + 2 + 16 = 30 g/mol. n = 180/30 = 6. આણ્વીય સૂત્ર = 6 × (CH₂O) = C₆H₁₂O₆.", "tag": ""}, {"q": "અભિકિરામિક સૂત્ર C₃H₄ ધરાવતા સંયોજનનું મોલર દળ 80 g/mol છે. તેનું આણ્વીય સૂત્ર શોધો.", "opts": ["C₃H₄", "C₆H₈", "C₉H₁₂", "C₁₂H₁₆"], "correct": 1, "explain": "અભિકિરામિક દળ = 3×12 + 4×1 = 40 g/mol. n = 80/40 = 2. આણ્વીય સૂત્ર = 2 × (C₃H₄) = C₆H₈.", "tag": ""}, {"q": "એક સંયોજનનું અભિકિરામિક સૂત્ર CH છે અને તેની વરાળ ઘનતા (Vapour Density) 13 છે. તેનું આણ્વીય સૂત્ર શોધો.", "opts": ["CH", "C₂H₂", "C₃H₃", "C₄H₄"], "correct": 1, "explain": "આણ્વીય દળ = 2 × વરાળ ઘનતા = 2 × 13 = 26 g/mol. અભિકિરામિક દળ = 13 g/mol. n = 26/13 = 2, તેથી આણ્વીય સૂત્ર C₂H₂.", "tag": ""}, {"q": "અભિકિરામિક સૂત્ર C₂H₃O₂ અને મોલર દળ 118 g/mol ધરાવતા સંયોજનનું આણ્વીય સૂત્ર શોધો.", "opts": ["C₂H₃O₂", "C₃H₄.₅O₃", "C₄H₆O₄", "C₆H₉O₆"], "correct": 2, "explain": "અભિકિરામિક દળ = 2×12 + 3×1 + 2×16 = 59 g/mol. n = 118/59 = 2. આણ્વીય સૂત્ર = 2 × (C₂H₃O₂) = C₄H₆O₄.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પ્રતિક્રિયામાં લઘુત્તમ સંખ્યામાં સંયોજન વાળા સક્રિયક (oxidizing agent) અને રિડ્યુસિંગ એજન્ટ (reducing agent) જોડાયા છે?", "opts": ["KClO3 + HCl → KCl + Cl2 + H2O", "KMnO4 + FeSO4 + H2SO4 → MnSO4 + Fe2(SO4)3 + K2SO4 + H2O", "Cu + HNO3 → Cu(NO3)2 + NO + H2O", "PbO2 + HCl → PbCl2 + Cl2 + H2O"], "correct": 3, "explain": "PbO2 + 4HCl → PbCl2 + Cl2 + 2H2O માં PbO2 એક અણુ અને HCl ના 4 અણુઓ પ્રતિક્રિયા કરે છે; KClO3 + 6HCl માં 1 : 6, KMnO4 પ્રતિક્રિયામાં 2 : 10 અને Cu + 4HNO3 માં 1 : 4 છે, તેથી D માં ઓક્સિડાઈઝિંગ-રિડ્યુસિંગ એજન્ટનો ગુણોત્તર સૌથી લઘુત્તમ છે.", "tag": ""}, {"q": "બે પરોક્ષ રેડોક્સ પ્રતિક્રિયાઓમાં આંકડેલી માત્રા નક્કી કરો: (i) x mol KMnO4 અને y mol K2Cr2O7 એક જ માત્રાના Fe2+ ને Fe3+ માં ઑક્સિડાઈઝ કરે છે; (ii) તે જ x : y ગુણોત્તરે H2O2 ને OH– + O2 માં રૂપાંતરિત કરે છે. પ્રતિક્રિયા (ii) માં ઉત્પન્ન થતા O2 ના મોલનું સૂત્ર કયું છે?", "opts": ["3x + 6y", "6x + 3y", "x + y", "2x + 5y"], "correct": 0, "explain": "KMnO4 → Mn2+ (5e–) અને K2Cr2O7 → let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

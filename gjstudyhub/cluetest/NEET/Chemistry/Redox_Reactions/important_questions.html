<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>

<script>
const QUIZ = [{"q": "ક્લાસિકલ સંજ્ઞા મુજબ, કયા પ્રકારના રાસાયણિક પરિવર્તનને 'ઓક્સિડેશન' (Oxidation) કહેવામાં આવે છે?", "opts": ["પદાર્થમાંથી હાઈડ્રોજનની દૂર થવી અથવા પદાર્થમાં ઓક્સિજનનો સંયોગ થવો", "પદાર્થમાં હાઈડ્રોજનનો સંયોગ થવો અથવા પદાર્થમાંથી ઓક્સિજનની દૂર થવી", "ઇલેક્ટ્રોનનો ગ્રહણ કરવો અથવા ધન વીજભાર વધવો", "ઇલેક્ટ્રોન છોડી देવો અથવા ધન વીજભાર ઘટવો"], "correct": 0, "explain": "ક્લાસિકલ (પરંપરાગત) સંજ્ઞા મુજબ ઓક્સિડેશન એટલે પદાર્થમાં ઓક્સિજનનો સંયોગ થવો અથવા પદાર્થમાંથી હાઈડ્રોજન દૂર થવો. ઉદાહરણ: Mg + O₂ → MgO માં મેગ્નેશિયમનું ઓક્સિડેશન થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો દ્રશ્ય 'રીડક્શન' (还原) નો ઉદાહરણ છે?", "opts": ["CuO → Cu (તંપામાંથી ઓક્સિજન દૂર થાય)", "Mg → MgO (મેગ્નેશિયમમાં ઓક્સિજનનો સંયોગ થાય)", "Fe → Fe²⁺ (લોખંડ ઇલેક્ટ્રોન ગુમાવે)", "Na → Na⁺ (સોડિયમ ઇલેક્ટ્રોન છોડે)"], "correct": 0, "explain": "રિડક્શન એટલે પદાર્થમાંથી ઓક્સિજન દૂર થવો અથવા પદાર્થમાં હાઈડ્રોજનનો સંયોગ થવો. CuO માંથી ઓક્સિજન દૂર થતાં Cu બને છે, એટલે આ રિડક્શન છે.", "tag": ""}, {"q": "આધુનિક (ઇલેક્ટ્રોનિક) સંજ્ઞા મુજબ, ઓક્સિડેશન અને રિડક્શન વચ્ચેનો મૂળભૂત તફાવત શું છે?", "opts": ["ઓક્સિડેશન એ ઇલેક્ટ્રોન ગુમાવવાની પ્રક્રિયા છે જ્યારે રિડક્શન એ ઇલેક્ટ્રોન ગ્રહણ કરવાની પ્રક્રિયા છે", "ઓક્સિડેશન એ ઇલેક્ટ્રોન ગ્રહણ કરવાની પ્રક્રિયા છે જ્યારે રિડક્શન એ ઇલેક્ટ્રોન ગુમાવવાની પ્રક્રિયા છે", "ઓક્સિડેશન અને રિડક્શન બંને ઇલેક્ટ્રોન ગુમાવવાની પ્રક્રિયા છે", "ઓક્સિડેશન અને રિડક્શન બંને ઇલેક્ટ્રોન ગ્રહણ કરવાની પ્રક્રિયા છે"], "correct": 0, "explain": "ઇલેક્ટ્રોનિક સંજ્ઞા મુજબ, ઓક્સિડેશન એ ઇલેક્ટ્રોનનો ત્યાગ (ગુમાવવા) છે, જેના પરિણામે ધન વીજભાર વધે છે; અને રિડક્શન એ ઇલેક્ટ્રોનનું ગ્રહણ કરવું છે, જેનાથી ઋણ વીજભાર વધે છે.", "tag": ""}, {"q": "નામુષ્ટ્રીય પ્રક્રિયા 2Na + Cl₂ → 2NaCl માં, સોડિયમ (Na) અને ક્લોરિન (Cl₂) ના કાર્યપ્રણાલીનું વિશ્લેષણ કરો.", "opts": ["Na ઓક્સિડાઇટ થાય છે અને Cl₂ રિડ્યુસ થાય છે", "Na રિડ્યુસ થાય છે અને Cl₂ ઓક્સિડાઇટ થાય છે", "બંને ઓક્સિડાઇટ થાય છે", "બંને રિડ્યુસ થાય છે"], "correct": 0, "explain": "આ પ્રક્રિયામાં Na → Na⁺ + e⁻ (ઇલેક્ટ્રોન ગુમાવે છે, તેથી ઓક્સિડાઇટ થાય છે) અને Cl₂ + 2e⁻ → 2Cl⁻ (ઇલેક્ટ્રોન ગ્રહણ કરે છે, તેથી રિડ્યુસ થાય છે).", "tag": ""}, {"q": "ઓક્સિડાઇઝિંગ એજન્ટ (Oxidising Agent) અને રિડ્યુસિંગ એજન્ટ (Reducing Agent) વચ્ચેનો મુખ્ય તફાવત કયો છે?", "opts": ["ઓક્સિડાઇઝિંગ એજન્ટ પોતે રિડ્યુસ થાય છે અને અન્યને ઓક્સિડાઇટ કરે છે; રિડ્યુસિંગ એજન્ટ પોતે ઓક્સિડાઇટ થાય છે અને અન્યને રિડ્યુસ કરે છે", "ઓક્સિડાઇઝિંગ એજન્ટ પોતે ઓક્સિડાઇટ થાય છે અને અન્યને રિડ્યુસ કરે છે; રિડ્યુસિંગ એજન્ટ પોતે રિડ્યુસ થાય છે અને અન્યને ઓક્સિડાઇટ કરે છે", "બંને પોતે ઓક્સિડાઇટ થાય છે", "બંને પોતે રિડ્યુસ થાય છે"], "correct": 0, "explain": "ઓક્સિડાઇઝિંગ એજન્ટ પોતામાં ઇલેક્ટ્રોન ગ્રહણ કરીને અન્યને ઓક્સિડાઇટ કરે છે અને તે પોતે રિડ્યુસ થાય છે. રિડ્યુસિંગ એજન્ટ ઇલેક્ટ્રોન દાન કરીને અન્યને રિડ્યુસ કરે છે અને તે પોતે ઓક્સિડાઇટ થાય છે.", "tag": ""}, {"q": "ઓક્સિડેશન અંક (Oxidation Number) નીચેનામાંથી કયા નિયમ મુજબ નક્કી કરવામાં આવે છે?", "opts": ["મૂળ તત્વોનો ઓક્સિડેશન અંક શૂન્ય હોય છે.", "આયનીય સંયોજનોમાં ધાતુનો ઓક્સિડેશન અંક હંમેશા ઋણ હોય છે.", "હાઇડ્રોજનનો ઓક્સિડેશન અંક હંમેશા +1 હોય છે.", "ઓક્સિજનનો ઓક્સિડેશન અંક હંમેશા -2 હોય છે."], "correct": 0, "explain": "મૂળ તત્વો (જેમ કે Na, Cl₂, O₂) માં પરમાણુઓ વચ્ચે કોઈ આયનીય કે સહસંયોજક બંધ ન હોવાથી તેમનો ઓક્સિડેશન અંક શૂન્ય ગણાય છે. બાકીના વિકલ્પોમાં આપેલા નિયમો હંમેશા લાગુ પડતા નથી (ઉદા. ફ્લોરાઇડમાં O નો અંક +2, પરોક્સાઇડમાં -1).", "tag": ""}, {"q": "KMnO₄ માં મેંગેનીઝ (Mn) નો ઓક્સિડેશન અંક શોધો.", "opts": ["+7", "+5", "+4", "+2"], "correct": 0, "explain": "K નો ઓક્સિડેશન અંક +1, O નો -2 લેતાં: (+1) + Mn + 4(-2) = 0 ⇒ Mn - 7 = 0 ⇒ Mn = +7. આમ KMnO₄ માં Mn નો ઓક્સિડેશન અંક +7 છે.", "tag": ""}, {"q": "નીચેની પ્રક્રિયામાં કયા તત્વનું ઓક્સિડેશન થાય છે? 2FeCl₃ + H₂S → 2FeCl₂ + S + 2HCl", "opts": ["આયર્ન (Fe)", "સલ્ફર (S)", "ક્લોરિન (Cl)", "હાઇડ્રોજન (H)"], "correct": 1, "explain": "FeCl₃ માં Fe નો અંક +3 છે અને FeCl₂ માં +2 થાય છે (રિડક્શન). H₂S માં S નો અંક -2 છે અને મુક્ત S માં 0 થાય છે (ઓક્સિડેશન). Cl અને H ના અંકો બદલાતા નથી.", "tag": ""}, {"q": "Na₂S₂O₃ (થાયોસલફેટ) માં સલ્ફર (S) નો સરેરાશ ઓક્સિડેશન અંક કેટલો છે?", "opts": ["+2", "+4", "+6", "-2"], "correct": 0, "explain": "Na નો અંક +1, O નો -2 લેતાં: 2(+1) + 2S + 3(-2) = 0 ⇒ 2 + 2S - 6 = 0 ⇒ 2S = 4 ⇒ S = +2. (નોંધ: વાસ્તવિક રચનામાં બે S પરમાણુઓના અંક અલગ હોય છે, પરંતુ સરેરાશ +2 મળે છે.)", "tag": ""}, {"q": "કયા સંયોજનમાં ઓક્સિજનનો ઓક્સિડેશન અંક -2 નથી?", "opts": ["H₂O", "CO₂", "KO₂", "MgO"], "correct": 2, "explain": "KO₂ એ પોટેશિયમ સુપરોક્સાઇડ છે, જ્યાં O નો ઓક્સિડેશન અંક -½ હોય છે. H₂O, CO₂ અને MgO માં ઓક્સિજનનો અંક સામાન્ય રીતે -2 જ હોય છે.", "tag": ""}, {"q": "ગેલ્વેનિક કોષ (Galvanic Cell) માં, જ્યારે Zn સ્તંભ ZnSO₄ દ્રાવણમાં અને Cu સ્તંભ CuSO₄ દ્રાવણમાં ડૂબેલો હોય, તો નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["Zn સ્તંભ એનોડ છે અને તેમાં ઓક્સિડેશન થાય છે, જ્યારે Cu સ્તંભ કેથોડ છે અને તેમાં રિડક્શન થાય છે.", "Cu સ્તંભ એનોડ છે અને તેમાં ઓક્સિડેશન થાય છે, જ્યારે Zn સ્તંભ કેથોડ છે અને તેમાં રિડક્શન થાય છે.", "બંને સ્તંભો પર ઓક્સિડેશન થાય છે અને ઇલેક્ટ્રોન Zn થી Cu તરફ પ્રવાહી માર્ગે પ્રવાહિત થાય છે.", "બંને સ્તંભો પર રિડક્શન થાય છે અને ઇલેક્ટ્રોન Cu થી Zn તરફ પ્રવાહી માર્ગે પ્રવાહિત થાય છે."], "correct": 0, "explain": "ગેલ્વેનિક કોષમાં એનોડ પર ઓક્સિડેશન (ઇલેક્ટ્રોનનું ઉત્સર્જન) અને કેથોડ પર રિડક્શન (ઇલેક્ટ્રોનનું શોષણ) થાય છે. Zn, Cu કરતાં વધુ સક્રિય હોવાથી Zn એનોડ બને છે અને Cu કેથોડ બને છે. ઇલેક્ટ્રોન બાહ્ય પરિપથમાં એનોડથી કેથોડ તરફ પ્રવાહિત થાય છે.", "tag": ""}, {"q": "કોઈ અર્ધ-કોષ (Half-cell) નું સ્ટાન્ડર્ડ ઇલેક્ટ્રોડ પોટેન્શિયલ (Standard Electrode Potential) નક્કી કરવા માટે, નીચેનામાંથી કયો પ્રયોગાત્મક ઉપક્રમ સાચો છે?", "opts": ["અર્ધ-કોષને સ્ટાન્ડર્ડ હાઇડ્રોજન ઇલેક્ટ્રોડ (SHE) સાથે જોડીને કોષ EMF માપવી અને SHE નું પોટેન્શિયલ શૂન્ય માની ગણતરી કરવી.", "અર્ધ-કોષને કોઈ પણ ધાતુના સ્તંભ સાથે જોડીને કોષ EMF માપવી અને તે મૂલ્યને સીધું અર્ધ-કોષનું પોટેન્શિયલ માની લેવું.", "અર્ધ-કોષનું પોટેન્શિયલ સીધું વોલ્ટમીટરથી માપી શકાય છે કારણ કે તે એકલ અવસ્થામાં અસ્તિત્વ ધરાવે છે.", "અર્ધ-કોષને વિદ્યુત વિભાજન કોષ (Electrolytic Cell) માં મૂકીને પોટેન્શિયલ માપવું."], "correct": 0, "explain": "ઇલેક્ટ્રોડ પોટેન્શિયલનું નિરપેક્ષ મૂલ્ય માપી શકાતું નથી; તેને હંમેશાં કોઈક સંદર્ભ અર્ધ-કોષ સાથે સરખાવીને જ માપી શકાય છે. આપણે સ્ટાન્ડર્ડ હાઇડ્રોજન ઇલેક્ટ્રોડ (SHE) ને સંદર્ભ તરીકે લઈએ છીએ અને તેનું સ્ટાન્ડર્ડ પોટેન્શિયલ 0.00 V ધારીએ છીએ. આમ, અજ્ઞાત અર્ધ-કોષ અને SHE વચ્ચે બનતા કોષની EMF માપીને અજ્ઞાત અર્ધ-કોષનું પોટેન્શિયલ શોધી શકાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો ઇલેક્ટ્રોકેમિકલ સીરીઝ (Electrochemical Series) નો ઉપયોગ કરીને પ્રવચન કરી શકાય તેવો નિષ્કર્ષ છે?", "opts": ["Ag⁺/Ag (E° = +0.80 V) અને Cu²⁺/Cu (E° = +0.34 V) ના સ્ટાન્ડર્ડ રિડક્શન પોટેન્શિયલ પરથી, Ag⁺ આયનો Cu ધાતુને Cu²⁺ માં ઓક્સિડાઇઝ કરી શકે છે.", "Zn²⁺/Zn (E° = -0.76 V) અને Mg²⁺/Mg (E° = -2.37 V) ના સ્ટાન્ડર્ડ રિડક્શન પોટેન્શિયલ પરથી, Mg ધાતુ Zn²⁺ આયનોને Zn ધાતુમાં રિડ્યુસ કરી શકે છે.", "F₂/F⁻ (E° = +2.87 V) અને Cl₂/Cl⁻ (E° = +1.36 V) ના સ્ટાન્ડર્ડ રિડક્શન પોટેન્શિયલ પરથી, Cl₂ આયનો F⁻ આયનોને F₂ માં ઓક્સિડાઇઝ કરી શકે છે.", "Na⁺/Na (E° = -2.71 V) અને K⁺/K (E° = -2.93 V) ના સ્ટાન્ડર્ડ રિડક્શન પોટેન્શિયલ પરથી, Na ધાતુ K⁺ આયનોને K ધાતુમાં રિડ્યુસ કરી શકે છે."], "correct": 1, "explain": "ઇલેક્ટ્રોકેમિકલ સીરીઝ મુજબ, જે અર્ધ-પ્રક્રિયાનું સ્ટાન્ડર્ડ રિડક્શન પોટેન્શિયલ જેટલું નીચું (વધુ ઋણ) હોય, તેની ધાતુ તેટલી વધુ પ્રબળ રિડ્યુસિંગ એજન્ટ હોય છે. Mg (E° = -2.37 V) નું પોટેન્શિયલ Zn (E° = -0.76 V) કરતાં વધુ ઋણ હોવાથી, Mg ધાતુ Zn²⁺ આયનોને Zn ધાતુમાં રિડ્યુસ કરી શકે છે. અન્ય વિકલ્પોમાં પોટેન્શિયલનો ક્રમ અને પ્રવચન વિરુદ્ધ છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોકેમિકલ સીરીઝની મર્યાદાઓ (Limitations) વિશે નીચેનામાંથી કયું વિધાન સાચું નથી?", "opts": ["ઇલેક્ટ્રોકેમિકલ સીરીઝ ફક્ત સ્ટાન્ડર્ડ પરિસ્થિતિઓ (1 M સાંદ્રતા, 298 K તાપમાન, 1 atm દબાણ) માટે જ લાગુ પડે છે; સાંદ્રતા અથવા તાપમાન બદલાતાં પોટેન્શિયલ બદલાઈ શકે છે.", "ઇલેક્ટ્રોકેમિકલ સીરીઝ રિડક્શન પોટેન્શિયલના થર્મોડાયનેમિક ક્રમને દર્શાવે છે, પરંતુ પ્રક્રિયાના દર (Kinetics) ની માહિતી નથી આપતી.", "ઇલેક્ટ્રોકેમિકલ સીરીઝમાંથી કોઈ પણ ધાતુનું પાણી સાથે પ્રક્રિયા કરવાની શક્યતા હંમેશાં ચોકસાઈપૂર્વક નક્કી કરી શકાય છે.", "ઇલેક્ટ્રોકેમિકલ સીરીઝ pH પર આધારિત અર્ધ-પ્રક્રિયાઓ (જેમ કે MnO₄⁻/Mn²⁺) માટે સ્ટાન્ડર્ડ પોટેન્શિયલ મૂલ function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];

  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

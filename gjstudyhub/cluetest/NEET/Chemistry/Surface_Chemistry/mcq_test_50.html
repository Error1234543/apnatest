<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "ઘન પૃષ્ઠ પર વાયુનું શોષણ (Adsorption) એ કયા પ્રકારની પ્રક્રિયા છે?", "opts": ["એક વિષમતાલીય (Heterogeneous) પ્રક્રિયા", "સમતાલીય (Homogeneous) પ્રક્રિયા", "સાહચર્ય (Association) પ્રક્રિયા", "વિઘટન (Decomposition) પ્રક્રિયા"], "correct": 0, "explain": "ઘન પૃષ્ઠ પર વાયુનું શોષણ એ વિષમતાલીય પ્રક્રિયા છે કારણ કે શોષ્ય (adsorbate) અને શોષક (adsorbent) અલગ-અલગ કલામાં હોય છે. આ પ્રક્રિયા પૃષ્ઠ પર બનતી ક્રિયાપ્રતિક્રિયા છે.", "tag": ""}, {"q": "નિર્દેશક (Catalyst) ની ભૂમિકા સંબંધી નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["નિર્દેશક પ્રક્રિયાની ઉર્જા અવરોધ (Activation Energy) ઘટાડે છે", "નિર્દેશક સંતુલન અચળાંક (Equilibrium Constant) બદલે છે", "નિર્દેશક પ્રક્રિયાના ΔG ને ઘટાડે છે", "નિર્દેશક પ્રક્રિયાનો ઉષ્માપરિવર્તન (Enthalpy change) બદલે છે"], "correct": 0, "explain": "નિર્દેશક એક વૈકલ્પિક માર્ગ પૂરો પાડીને પ્રક્રિયાની ઉર્જા અવરોધ ઘટાડે છે, જેથી પ્રક્રિયા દર વધે છે. તે સંતુલન, ΔG કે ΔH ને અસર કરતું નથી.", "tag": ""}, {"q": "ફિઝીયોસોર્પ્શન (ભૌતિક શોષણ) માં શોષણ બળો કયા પ્રકારનાં હોય છે?", "opts": ["વாન ડર્સ વાલ્સ (Van der Waals) બળો", "સહસંયોજક (Covalent) બંધ", "આયનીય (Ionic) બંધ", "હાઈડ્રોજન બંધ"], "correct": 0, "explain": "ફિઝીયોસોર્પ્શનમાં શોષ્ય અને શોષક વચ્ચે弱વાન ડર્સ વાલ્સ બળો કાર્યરત હોય છે. આ બળો નિર્બળ હોવાથી ફિઝીયોસોર્પ્શન વધુ તાપમાને અને ઓછા દબાણે ઓછું થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો નિર્દેશક ધન નિર્દેશક (Positive catalyst) નો ઉદાહરણ નથી?", "opts": ["Fe₂O₃ — હેબર્ષી પ્રક્રિયા (Haber's process)", "SnCl₂ — ટિન(II) ક્લોરાઇડ", "Pt — હેડ્રોજનીકરણ પ્રક્રિયા (Hydrogenation)", "V₂O₅ — સંપર્ક પ્રક્રિયા (Contact process)"], "correct": 1, "explain": "SnCl₂ એ ધન નિર્દેશક નથી; હેબર્ષી પ્રક્રિયામાં Fe, હેડ્રોજનીકરણમાં Pt અને સંપર્ક પ્રક્રિયામાં V₂O₅ ધન નિર્દેશકો છે. SnCl₂ પ્રક્રિયા દર વધારતો નથી.", "tag": ""}, {"q": "રસાયણશોષણ (Chemisorption) નીચેનામાંથી કયા ગુણધર્મો ધરાવે છે?", "opts": ["ઉચ્ચ આવેશ (High specificity), મોનોલેયર, અને વધુ ઉષ્મા પરિવર્તન", "નીચી આવેશ (Low specificity), બહુસ્તરીય, અને ઓછું ઉષ્મા પરિવર્તન", "કોઈ પણ આવેશ નથી, એકલેયર, અને શૂન્ય ઉષ્મા પરિવર્તન", "બહુસ્તરીય અને ઓછું ઉષ્મા પરિવર્તન"], "correct": 0, "explain": "રસાયણશોષણમાં શોષ્ય અને શોષક વચ્ચે રાસાયણિક બંધ બને છે, તેથી તે ઉચ્ચ આવેશ ધરાવે છે, ફક્ત એકલેયર (monolayer) બનાવે છે અને અન્ય વાન ડર્સ વાલ્સ બળોની તુલનામાં વધુ ઉષ્મા પરિવર્તન આપે છે.", "tag": ""}, {"q": "ફ્રેન્ડલિચ સોર્પ્શન આઇસોથર્મ (Adsorption Isotherm) ના સમીકરણમાં p / m = k · p^(1/n) હોય છે. જ્યારે દબાણ ખૂબ ઓછું હોય તો n ની કિંમત શું હોય છે?", "opts": ["n ≈ 1, તેથી p/m ∝ p", "n ≈ 0, તેથી p/m ∝ p²", "n ≈ –1, તેથી p/m ∝ 1/p", "n → ∞, તેથી p/m સ્થિર રહે છે"], "correct": 0, "explain": "ફ્રેન્ડલિચ સમપ્રમાણક મુજબ, ખૂબ ઓછા દબાણે n ≈ 1 થાય છે, જેથી p/m ∝ p¹ એટલે કે શોષણ સીધું દબાણના સમપ્રમાણમાં હોય છે. ઉચ્ચ દબાણે 1/n ≈ 0 થાય છે અને શોષણ દબાણથી સ્વતંત્ર થઈ જાય છે.", "tag": ""}, {"q": "લેંગમુઈર શોષણ સમપ્રમાણક (Langmuir Adsorption Isotherm) મુજબ, ઉચ્ચ દબાણે (p >> 1/K) શોષણની માત્રા k હોય છે. આ અવસ્થામાં શા માટે શોષણ દબાણથી સ્વતંત્ર થઈ જાય છે?", "opts": ["પૃષ્ઠ પર બધા સક્રિય સ્થળો (Active sites) ભરાઈ ગયા હોય છે, તેથી આગળ દબાણ વધારવાથી શોષણ વધતું નથી.", "ઉચ્ચ દબાણે રસાયણશોષણ બંધ થઈ જાય છે અને ફિઝીયોસોર્પ્શન શરૂ થાય છે.", "ઉચ્ચ દબાણે કણોની ઝડપ વધવાથી શોષિત અણુઓ તરત જ વિકર્ષિત (Desorb) થઈ જાય છે.", "ઉચ્ચ દબાણે तापमान વધી જાય છે, જે શોષણ અનુગ્રહી (Exothermic) પ્રક્રિયા હોવાથી ઘટાડે છે."], "correct": 0, "explain": "લેંગમુઈર મોડેલ મુજબ ઉચ્ચ દબાણે θ ≈ 1 થાય છે, એટલે કે પૃષ્ઠના બધા સક્રિય સ્થળો (Active sites) શોષિત અણુઓથી ભરાઈ ગયા હોય છે (સંતૃપ્તિ). આથી p વધારવા છતાં શોષણ માત્રા k તરીકે સ્થિર રહે છે.", "tag": ""}, {"q": "કોલોઇડલ દ્રાવણમાં ટિન્ડાલ અભિન્ન (Tyndall Effect) ક્યારે સ્પષ્ટ દેખાય છે?", "opts": ["જ્યારે પ્રકાશની તરંગલંબાઈ કણના કદ કરતાં વધારે હોય અને કણોની વાસ્તવિક અને માध्यમની પરાવર્તન ક્ષમતામાં મોટો તફાવત હોય.", "જ્યારે પ્રકાશની તરંગલંબાઈ કણના કદ કરતાં નાની હોય અને કણોની વાસ્તવિક અને માध्यમની પરાવર્તન ક્ષમતામાં મોટો તફાવત હોય.", "જ્યારે પ્રકાશની તરંગલંબાઈ કણના કદ કરતાં વધારે હોય અને કણોની વાસ્તવિક અને માध्यमની પરાવર્તન ક્ષમતામાં તફાવત નાનો હોય.", "ટિન્ડાલ અભિન્ન ફક્ત શુદ્ધ દ્રાવણોમાં જ દેખાય છે, કોલોઇડ્સમાં નહીં."], "correct": 1, "explain": "ટિન્ડાલ અભિન્ન ત્યારે સ્પષ્ટ રીતે દેખાય છે જ્યારે પ્રકાશની તરંગલંબાઈ કણના કદ કરતાં નાની હોય (scattering effective હોય) અને કણો/माध्यم વચ્ચે વર્તન ક્ષમતા (Refractive index) માં મોટો તફાવત હોય. કણોનું કદ તરંગલંબાઈ કરતાં ખૂબ નાનું હોય તો scattering નબળી હોય છે.", "tag": ""}, {"q": "કોલોઇડલ દ્રાવણને વિદ્યુતક્ષેપણ (Electrophoresis) દ્વારા સ્થિર કરવાની પ્રક્રિયામાં નીચેમાંથી કયું વિધાન સાચું છે?", "opts": ["विद्युतक्षेपणમાં કોલોઇડલ કણો ધ્રુવિયતા (Charge) મુજબ એલેક્ટ્રોડ તરફ ગતિ કરે છે, ત્યાં પહોંચીને તેમનું વિદ્યુતભાર નાશ પામે છે અને કણો જમીનીને સ્થિરતા ગુમાવે છે.", "विद्युतक्षेपणમાં કણો માત્ર ગરમી ઉત્પન્ન કરે છે જેથી કણોનું આકાર બદલાય છે.", "विद्युतक्षेपणમાં કણો ક્યાંય ગતિ કરતા નથી, ફક્ત માध्यમનું વિદ્યુતવાહિત્વ વધે છે.", "विद्युतक्षेপण માત્ર ઇમેલ્શનમાં જ કામ કરે છે, સોલ્સમાં નહીં."], "correct": 0, "explain": "विद्युतक्षेपण (Electrophoresis) માં વિદ્યુતક્ષેપણ કણો વિદ્યુતક્ષેપણ મેદાનમાં ગતિ કરે છે — ધન કણો કેથોડ તરફ અને ઋણ કણો એનોડ તરફ. જ્યારે તેઓ વિરુદ્ધ ધ્રુવના ઇલેક્ટ્રોડ પર આગળ વધે છે ત્યારે વિદ્યુતભાર નિષ્ક્રિય થાય છે, કણો જમીનીને સ્થિરતા ગુમાવી જાય છે.", "tag": ""}, {"q": "નાનું અણુ (Macromolecule) જ્યારે કોલોઇડલ દ્રાવણમાં મિશ્રિત થાય છે ત્યારે બનતો પ્રકાર કોલોઇડ કયો છે?", "opts": ["મેક્રોમોલેક્યુલર કોલોઇડ (Macro-molecular Colloid)", "સોલ્વેટેડ કોલોઇડ (Solvated Colloid)", "એગ્રીગેટ કોલોઇડ / માયસેલ (Aggregate/Micelle)", "લિયોફોબિક કોલોઇડ (Lyophobic Colloid)"], "correct": 0, "explain": "જ્યારે વિશાળ આણ્વિય વજન ધરાવતા મેક્રોમોલેક્યુલ્સ (જેમ કે સ્ટાર્ચ, પ્રોટીન, રબર) દ્રાવકમાં મિશ્રિત થાય છે ત્યારે તેઓ મેક્રોમોલેક્યુલર કોલોઇડ (Macro-molecular Colloid) બનાવે છે. આ કોલોઇડ્સ સામાન્ય રીતે લિયોફિલિક હોય છે અને સ્થિર હોય છે, કારણ કે તેમની સપૃષ્ટ સપાટી દ્રાવક સાથે બંધાયેલ હોય છે.", "tag": ""}, {"q": "ગોલ્ડ સંખ્યા (Gold Number) ની વ્યાખ્યા મુજબ કોલોઇડલ દ્રાવણની રક્ષણ ક્ષમતા (Protective Power) ની તુલના કેવી રીતે કરવામાં આવે છે?", "opts": ["જે સંયોગની ઓછી ગોલ્ડ સંખ્યા હોય, તેની રક્ષણ ક્ષમતા વધુ હોય છે.", "જે સંયોગની વધુ ગ શોષણ (Multimolecular Adsorption) પામે છે, જે ભૌતિકશોષણનો પ્રકાર છે. આવા વાયુઓ માટે અવશોષણ સમપ્રમાણક (K) નું મૂલ્ય વધુ હોય છે, કારણ કે તેઓ પ્રબળ રીતે અવશોષિત થાય છે અને ઊંચા દબાણે પણ અવશોષણ થતું રહે છે. આ વિષય સમજવા માટે વિદ્યાર્થીઓએ 'એડસોર્પ્શન આઈસોથર્મ' અને 'મલ્ટિમોલેક્યુલર એડસોર્પ્શન' નો અભ્યાસ કર્યો હોવો જોઈએ.", "tag": ""}, {"q": "કયા પ્રકારના કોલોઇડમાં વિખેરેલો કણ (Dispersed Phase) અને વિખેરનાર (Dispersing Medium) બંને પ્રવાહી હોય છે અને બે પ્રવાહી એકબીજામાં અદ્રશ્ય ન થાય તેવા કોલોઇડને શું કહે છે?", "opts": ["એમલ્શન (અંશરસ)", "સોલ (દ્રાવ)", "ફોમ (ઘેણ)", "ઘન કોલોઇડ (Solid Sol)"], "correct": 0, "explain": "જ્યારે વિખેરેલો કણ પ્રવાહી હોય અને વિખેરનાર પણ પ્રવાહી હોય, પરંતુ બંને પ્રવાહી એકબીજામાં ભળતા ન હોય (જેવા કે દૂધ, માયોનેઝ), ત્યારે તેને એમલ્શન કહે છે. એમલ્શન એ પ્રવાહી-પ્રવાહી કોલોઇડનો એક પ્રકાર છે. આ વિષયની સમજણ અને NEET UG પરීક્ષા માટે એમલ્શનના પ્રકારો, stabilities અને emulsifying agents વિશે જાણકારી અત્યંત જરૂરી છે.", "tag": ""}, {"q": "ડાઈલૂઝ ડાયલિસિસ (Dialysis) પદ્ધતિનો ઉપયોગ કોલોઇડલ દ્રાવણમાંથી કયા પ્રકારના અશુદ્ધિઓને દૂર કરવા માટે થાય છે?", "opts": ["વિદ્યુતવિભાજ્ય આયનો અને સુધર્મી (Small molecular) અશુદ્ધિઓ", "મોટા અણુઓ (Large molecules) અને પ્રોટીન", "અવિદ્યુતવિભાજ્ય (Non-electrolytes) અને કણો", "અન્ય કોલોઇડલ કણો"], "correct": 0, "explain": "ડાઈલૂઝ ડાયલિસિસ એટલે કાગળ અથવા ચમડાના પારગમ્ય પરદા (semipermeable membrane) માંથી વિદ્યુતવિભાજ્ય આયનો અને સુધર્મી અશુદ્ધિઓને દૂર કરવી. કોલોઇડલ કણો મોટા હોવાથી પરદામાંથી પસાર થતા નથી, જ્યારે આયનો નાના હોવાથી પસાર થઈ જાય છે. આ પદ્ધતિ કોલોઇડશુદ્ધિકરણ માટે ખૂબ મહત્વની છે.", "tag": ""}, {"q": "નીચેનામાંથી કયા પ્રકારના કોલોઇડમાં વિખેરેલો પદાર્થ ઘન હોય અને વિખેરણ માધ્યમ પ્રવાહી હોય છે?", "opts": ["પ્રવિલમ્બ (Sol)", "અનુક્ષાર (Aerosol)", "અન્વક્ષાર (Emulsion)", "ઘન અનુક્ષાર (Solid sol)"], "correct": 0, "explain": "કોલોઇડલ દ્રાવણનું વર્ગીકરણ વિખેરેલા પદાર્થ અને વિખેરણ માધ્યમની અવસ્થા પર આધારિત છે. જ્યારે વિખેરેલો પદાર્થ ઘન અને વિખેરણ માધ્યમ પ્રવાહી હોય તો તેને પ્રવિલમ્બ (Sol) કહે છે, જેમ કે ધાતુના કોલોઇડ.", "tag": ""}, {"q": plain": "કોલોઇડ્સને dispersion medium સાથેની પરસ્પર ક્રિયાના આધારે લાયોફિલિક (સ્નેહ ધરાવતા) અને લાયોફોબિક (સ્નેહ રહિત) તરીકે વર્ગીકૃત કરવામાં આવે છે. લાયોફિલિક કોલોઇડ્સમાં dispersion medium સાથે પ્રબળ આકર્ષણ હોય છે, જ્યારે લાયોફોબિકમાં નહીવત.", "tag": ""}, {"q": "ધૂમ્મ (Smoke) નામનું કોલોઇડલ તંત્ર કયા ભૌતિક સ્થિતિ ધરાવે છે?", "opts": ["ઘન માધ્યમમાં વાયુ ફેલાયેલ", "ઘન માધ્યમમાં ઘન કણો ફેલાયેલ", "વાયુ માધ્યમમાં ઘન કણો ફેલાયેલ", "તરલ માધ્યમમાં વાયુ કણો ફેલાયેલ"], "correct": 2, "explain": "ધૂમ્મ એક ગેઝસોલ (Aerosol) પ્રકારનું કોલોઇડ છે જેમાં વાયુને dispertion medium તરીકે અને ઘન કણોને dispersed phase તરીકે ધરાવે છે. આમ, વાયુ માધ્યમમાં ઘન કણો ફેલાયેલા હોય છે.", "tag": ""}, {"q": "જ્યારે નવીન રચાયેલ અવક્ષેપને સૂક્ષ્મ કણોમાં વિભાજિત કરીને કોલોઇડલ દ્રાવણ મેળવવાની પ્રક્રિયાને શું કહે છે?", "opts": ["પેપ્ટીકરણ", "ડાઈઅલિસિસ", "સેન્ટ્રીફ્યુગેશન", "એમલ્સિફિકેશન"], "correct": 0, "explain": "પેપ્ટીકરણ (Peptization) એ એવી પ્રક્રિયા છે જેમાં અવક્ષેપને ઉચ્ચ ગાઢતા ધરાવતા ઇલેક્ટ્રોલાઇટની ઉપસ્થિતિમાં કલાઈડલાઇઝર ઉમેરી નાના કોલોઇડલ કણોમાં વિભાજિત કરવામાં આવે છે. આથી અવક્ષેપ ફરીથી કોલોઇડ બને છે.", "tag": ""}, {"q": "કોલોઇડ્સના ભૌતિક ગુણધર્મોના આધારે, 'સોલ' (Sol) શબ્દ કઈ સ્થિતિનું વર્ણન કરે છે?", "opts": ["ઘન dispersed phase અને તરલ dispersion medium", "તરલ dispersed phase અને ઘન dispersion medium", "વાયુ dispersed phase અને તરલ dispersion medium", "તરલ dispersed phase અને વાયુ dispersion medium"], "correct": 0, "explain": "ભૌતિક સ્થિતિના આધારે વર્ગીકરણ મુજબ, જ્યારે dispersed phase ઘન હોય અને dispersion medium તરલ હોય ત્યારે તેને સોલ કહેવાય છે. ઉદાહરણ તરીકે, ટિન ઑક્સાઇડનો જલીય સોલ.", "tag": ""}, {"q": "રાસાયણિક પદ્ધતિઓ દ્વારા કોલોઇડની તૈયારીમાં, BAuCl₄ ના દ્રાવણમાં Na₂SO₃ ઉમેરવાથી સોનેરી સોલ (Gold sol) મળે છે. આ કઈ રાસાયણિક પ્રક્રિયા છે?", "opts": ["અપચય (Reduction)", "ઑક્સિડેશન", "દ્વિવિયોજન (Double decomposition)", "આંશિક ઉત્પાટન"], "correct": 0, "explain": "BAuCl₄ માં સોનું +3 ઑક્સિડેશન અવસ્થામાં હોય છે. Na₂SO₃ એ ક્ષપણક (reducing agent) તરીકે વર્તી Au³⁺ ને Au માં રૂપાંતરિત કરે છે. આમ, આ અપચય પ્રક્રિયા છે જેનાથી સોનેરી સોલનું નિર્માણ થાય છે.", "tag": ""}, {"q": "ચુસ્તી (Adsorption) અને શોષણ (Absorption) વચ્ચેનો મૂળભૂત તફાવત કયો છે?", "opts": ["ચુસ્તી માત્ર પૃષ્ઠભાગ પર થાય છે જ્યારે શોષણ દ્રવ્યની અંદર ગાયબ થાય છે.", "ચુસ્તી હંમેશા ઉષ્માશોષક હોય છે, શોષણ ઉષ્માક્ષેપક હોય છે.", "ચુસ્તીમાં વાયુઓ રચાય છે, શોષણમાં પ્રવાહીઓ રચાય છે.", "શોષણમાં માત્ર ઘન પદાર્થ સામેલ થઈ શકે છે, ચુસ્તીમાં નહીં."], "correct": 0, "explain": "ચુસ્તી એ પૃષ્ઠભાગની ઘટના છે જ્યાં સંલગ્ન પદાર્થ (adsorbate) ઘન અથવા પ્રવાહીની બાહ્ય પૃષ્ઠ પર કેન્દ્રિત થાય છે, જ્યારે શોષણ એ કણ્ડિત (bulk) ઘટના છે જેમાં પદાર્થ આખા પદાર્થમાં શોષાય છે.", "tag": ""}, {"q": "ઘન પૃષ્ઠ પર વાયુની ભૌતિક ચુસ્તી (Physical adsorption) માટે, કુલનું (Pressure) વધારો કરતાં શું બને છે?", "opts": ["ચુસ્તી વધે છે, પણ એક ચોક્કસ દબાણ બાદ સમાપ્તિ (saturation) પ્રાપ્ત થાય છે.", "ચુસ્તી ઘટે છે, કારણ કે દબાણ વધવાથી વાયુના અણુઓ પૃષ્ઠથી દૂર ધકેલાય છે.", "ચુસ્તી પર કોઈ અસર થતી નથી.", "ચુસ્તી અચાનક વધી જાય છે અને ક્યારેય સમાપ્તિ નથી થતી."], "correct": 0, "explain": "Adsorption isotherm મુજબ, દબાણ વધવાથી વધુ વાયુના અણુઓ ઘન પૃષ્ઠ પર આકર્ષિત થાય છે, પણ જ્યારે બધા સક્રિય સ્થળો (active sites) ભરાઈ જાય ત્યારે ચુસ્તી સમાપ્તિ પ્રાપ્ત કરે છે.", "tag": ""}, {"q": "ઉચ્ચ તાપમાને હાઈડ્રોજન વાયુની કાર્બનના પૃષ્ઠ પર થતી ભૌતિક ચુસ્તી વિશે કયો ઠીક વ્યક્ત કરે છે?", "opts": ["તાપમાન વધવાથી ભૌતિક ચુસ્તી ઘટે છે, કારણ કે આ પ્રક્રિયા ઉષ્માક્ષેપક હોવાથી વધુ તાપમાને સંતુલન પાછળિયા તરફ ખસે છે.", "તાપમાન વધવાથી ચુસ્તી વધે છે, કારણ કે ઉચ્ચ ગતિજ ઊર્જા અણુઓને વધુ પસંદગીથી પૃષ્ઠ પર બંધાય છે.", "તાપમાનની ચુસ્તી પર કોઈ અસર થતી નથી.", "તાપમાન વધવાથી રાસાયણિક ચુસ્તી વધે છે પણ ભૌતિક ચુસ્તી પર કોઈ અસર થતી નથી."], "correct": 0, "explain": "ભૌતિક ચુસ્તી હંમેશા ઉષ્માક્ષેપક (exothermic) પ્રક્રિયા છે, તેથી Le Chatelierના સિદ્ધાંત મુજબ તાપમાન વધવાથી ચુસ્તી ઘટે છે. આ ફ્રેન્ડલીચ isothermના સમીકરણમાં પણ દર્શાય છે: x/m ∝ P/T.", "tag": ""}, {"q": "ઝેઓલાઇટ (Zeolite) નામના સજાતીય ઉદ્દીપક (Homogeneous catalyst) વિશે કયું વિધાન સાચું છે?", "opts": ["ઝેઓલાઇટનો અણુ-છિદ્રીય ઢાંચો આંશિક કદ અને આકાર ધરાવતા અણુઓ માટે 'આકાર-પસંદગી' (shape-selective) ચુસ્તી અને ઉદ્દીપન provide કરે છે.", "ઝેઓલાઇટ એ ધાતુ સંયોગોનું એક જૂથ છે જે વાયુ-પ્રક્રિયાઓ માટે માત્ર ઉપયોગી છે.", "ઝેઓલાઇટમાં chhiદ્રો ન હોવાથી તે માત્ર અઘટનિક ઉદ્દીપક તરીકે kaam કરે છે.", "ઝેઓલાઇટ હંમેશા non-selective હોય છે, તેથી ઉચ્ચ ઉષ્માએ તેનું ઉપયોગિત ઘટે છે."], "correct": 0, "explain": "Zeolites (aluminosilicates) ના systematic pore structures એ specific-sized molecules ની passaging થવા દે છે, resulting in shape-selective catalysis. આ property is crucial for petrochemical cracking processes in industry.", "tag": ""}, {"q": "જૈવિક ઉદ્દીપક (Enzyme catalysis) વિશે કયું વિધાન સૌથી વધુ યોગ્ય છે?", "opts": ["એન્ઝાઇમ ચોક્કસ તાપમાન અને pH શ્રેણી વચ્ચે શ્રેષ્ઠ કાર્યક્ષમતા પ્રાપ્ત કરે છે; વધુ તાપમાન કે અત્યંત pH પર તે denaturation થઈને કાર્યક્ષમતા ગુમાવે છે.", "એન્ઝાઇમનું કાર્યક્ષમતા કોઈપણ તાપમાને સમાન રહે છે, કારણ કે તે પ્રોટીન હોવાથી થર્મલ stable હોય છે.", "એન્ઝાઇમ ઉદ્દીપન માત્ર પ્રક્રિયા સક્રિયકરણ ઊર્જા વધારે છે.", "એન્ઝાઇમ પ્રક્રિયકને fully stable બનાવીને પ્રક્રિયા ધીમી કરે છે."], "correct": 0, "explain": "Enzymes (જૈવઉદ્દીપક) are proteins with specific active sites. They show maximum activity within a narrow temperature range (~37°C) and pH range; outside this, denaturation occurs, destroying catalytic activity. This is described by the mechanism of enzyme-substrate complex formation.", "tag": ""}, {"q": "સૂક્ષ્મ ઉદ્દીપકિત વિકિરણ (Photochemical catalysis) ના સંદર્ભમાં, નીચેમાંથી કયું વિધાન અયોગ્ય છે?", "opts": ["આ પ્રક્રિયામાં ઉદ્દીપક માત્ર તેજોત્સવાધ્દ ઊર્જાનું શોષણ કરે છે અને પોતે રાસાયણિક રીતે બદલાઈ જાય છે.", "સૂર્યપ્રકાશની હાજરીમાં હાઈડ્રોજન અને ક્લોરિનનાં પ્રતિક્રિયામાં વપરાતો ગ્રેફાઇટ એક ઉદ્દીપક તરીકે કામ કરે છે.", "જૂન્ટી (ZnO) ની ઊપર MgO નો સ્તર સૂર્યપ્રકાશની હાજરીમાં સિલ્વર અક્ષય પ્રાપ્ત કરવામાં મદદ કરે છે.", "ઉદ્દીપકિત વિકિરણ પ્રક્રિયાઓમાં પ્રકાશની મદદથી ઉદ્દીપકના ઇલેક્ટ્રૉન ઉત્તેજિત થાય છે અને પ્રતિક્રિયા નિવેદિત થાય છે."], "correct": 0, "explain": "ઉદ્દીપક એવા તત્વ છે જે પ્રતિક્રિયા દરમિયાન પોતાનું રાસાયણિક સ્વરૂપ અને ભાર યથાવત રાખે છે; તે રાસાયણિક રીતે બદલાતા નથી. તેથી A વિધાન અયોગ્ય છે.", "tag": ""}, {"q": "સોડિયમ ક્લોરાઇડની પાણીમાં ઘન રૂપે ડિસ્ક વિકલન (Dispersion) કરવાથી મળતું વિશ્લેષણ કયા પ્રકારનું કોલોઇડ છે?", "opts": ["પ્રેમિયફલોબિક (Protective) કોલોઇડ", "લીયોફોબિક કોલોઇડ", "મલ્ટિમોલેક્યુલર કોલોઇડ", "એસોસિએટેડ કોલોઇડ"], "correct": 3, "explain": "ઉચ્ચ આણ્વીય ભાર ધરાવતા યૌગિકો (જેવા કે NaCl, સાબુ, ક્ષાર) ની સંતૃપ્તતા સીમા (CMC) થી વધુ સાંદ્રતાએ ગ્રંથિઓ (Micelles) રચે છે અને એસોસિએટેડ કોલોઇડ બનાવે છે. NaCl નું પાણીમાં ઘન રૂપે ડિસ્ક વિકલન એ એસોસિએટેડ કોલોઇડ છે.", "tag": ""}, {"q": "ઝેઓલાઇટ્સ (Zeolites) ના ઉદ્દીપક ગુણધર્મો વિષે નીચેમાંથી કયું કथન સચોટ છે?", "opts": ["ઝેઓલાઇટ્સ સજાતીય ઉદ્દીપક તરીકે કાર્ય કરે છે કારણ કે તે પ્રક્રિયકો સાથે સમાન અવસ્થામાં હોય છે.", "ઝેઓલાઇટ્સની સખત, છિદ્રાયુક્ત માળખું તેમને વિષમજાતીય ઉદ્દીપક તરીકે અનુરૂપ બનાવે છે.", "ઝેઓલાઇટ્સ માત્ર પ્રવાહી પ્રક્રિયકો માટે જ ઉપયોગી છે, વાયુ પ્રક્રિયકો માટે નહીં.", "ઝેઓલાઇટ્સ પ્રતિક્રિયાના નિવેદિત ગુણાંકને બદલી દે છે."], "correct": 1, "explain": "ઝેઓલાઇટ્સ એ સખત, છિદ્રાયુક્ત માળખું ધરાવતા સિલિકેટ યૌગિકો છે, જે વિષમજાતીય ઉદ્દીપક તરીકે કાર્ય કરે છે. તે પ્રતિક્રિયાના નિવેદિત ગુણાંકને બદલતા નથી.", "tag": ""}, {"q": "જૈવિક ઉદ્દીપક (Enzyme catalysis) ના કાર્યપ્રણાલી વિષે નીચેમાંથી કયું વાક્ય સર્વાંગ સચોટ છે?", "opts": ["ઉદ્દીપક પ્રતિક્રિયા દરમિયાન સંપૂર્ણપણે વપાશ થઈ જાય છે.", "એન્ઝાઇમ પ્રતિક્રિયક (Substrate) સાથે મિશ્રણ બનાવતી નથી, ફક્ત પૃષ્ઠ પર આબંધાય છે.", "એન્ઝાઇમ અને પ્રતિક્રિયક વચ્ચે પ્રારંભિક સંક્રાંતિ સંકીર્ણ રચાય છે, જે પછી અનુવંશિક ઉત્પાદમાં વિભાજિત થાય છે.", "એન્ઝાઇમિત પ્રતિક્રિયાઓ માત્ર અમ્લજનિકીય (Oxidative) પ્રક્રિયાઓ સુધી મર્યાદિત છે."], "correct": 2, "explain": "એન્ઝાઇમ વિદ્યુતોનુ ઉદ્દીપક તરીકે કાર્ય કરે છે, જેમાં પ્રારંભિક સંક્રાંતિ સંકીર્ણ રચાય છે અને પછી અનુવંશિક ઉત્પાદમાં વિભાજિત થાય છે.", "tag": ""}, {"q": "પ્રોટીનના જલીય દ્રાવણમાં ઇલેક્ટ્રોલાઇટના ઉમેરાથી કોલોઇડનું સ્થિરતા નાશ થવાની પ્રક્રિયાનું સચોટ નામ કયું છે?", "opts": ["આયનીકરણ", "ઉષ્ણ સ્થિરતા", "વિદ્યુતવિભાજન", "વારદીકરણ"], "correct": 3, "explain": "જલીય કોલોઇડ (જેવા કે પ્રોટીન) માં ઇલેક્ટ્રોલાઇટ ઉમેરવાથી ઉચ્ચ વીજભાર ધરાવતા આયનોની હાજરીમાં કોલોઇડ કણોનું સંયોજન થાય છે અને ઝડપથી અવક્ષેપિત થાય છે. આ પ્રક્રિયાને વારદીકરણ કહેવાય છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોફોરેસિસ (Electrophoresis) ક્રિયામાં શું જોવા મળે છે?", "opts": ["કોલોઇડીય કણોની વિદ્યુતક્ષેત્રની હેઠળ ગતિ", "વિશ્લેષ્ય દ્રાવકના વિદ્યુતક્ષેત્રની હેઠળ ગતિ", "કોલોઇડીય કણોનું અપક્ષેપણ", "ડાયલિસિસ દ્વારા શુદ્ધિકરણ"], "correct": 0, "explain": "ઇલેક્ટ્રોફોરેસિસ એટલે કોલોઇડીય કણોનું વિદ્યુતક્ષેત્ર લગાડતાં તેમની ગતિ. આ ક્રિયામાં ઋણ વિદ્યુતદ્રવ્ય કણો ધન ઇલેક્ટ્રોડ તરફ અને ધન વિદ્યુતદ્રવ્ય કણો ઋણ ઇલેક્ટ્રોડ તરફ ગતિ કરે છે. આના દ્વારા કોલોઇડીય કણો પરનો વીજભાર નક્કી કરી શકાય છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોઓસ્મોસિસ (Electro-osmosis) માં શું ગતિ કરે છે?", "opts": ["કોલોઇડીય કણો", "વિશ્લેષ્ય દ્રાવક", "આયનો", "વાયુના અણુઓ"], "correct": 1, "explain": "ઇલેક્ટ્રોઓસ્મોસિસ એટલે વિદ્યુતક્ષેત્ર લગાડવાથી વિશ્લેષ્ય દ્રાવક (dispersion medium) ની ગતિ. જ્યારે કોલોઇડીય કણો સ્થિર રહે છે ત્યારે વિદ્યુતક્ષેત્રની હેઠળ વિશ્લેષ્ય દ્રાવક ગતિ કરે છે. આ ઘટના ઇલેક્ટ્રોફોરેસિસથી ભિન્ન છે.", "tag": ""}, {"q": "ડાયલિસિસ (Dialysis) પ્રક્રિયા દ્વારા કોલોઇડીય દ્રાવણનું શું થાય છે?", "opts": ["કોલોઇડીય કણોનું અપક્ષેપણ થાય છે", "આયનશોષક ઘટકો દૂર થઈ શુદ્ધિકરણ થાય છે", "કોલોઇડીય કણોનું વિમેરણ થાય છે", "પ્રોટીનનું ઓક્સિડેશન થાય છે"], "correct": 1, "explain": "ડાયલિસિસ એટલે પર્સમેન્ટ કાગળની પટ્ટી (parchment membrane) વડે કોલોઇડીય દ્રાવણમાંથી આયનશોષક બિન-કોલોઇડીય ઘટકોને દૂર કરવાની પ્રક્રિયા. કોલોઇડીય કણો મોટા હોવાથી પટ્ટીમાંથી પસાર નથી થતા પણ નાના આયનો પસાર થઈ જાય છે, જેથી કોલોઇડીય દ્રાવણ શુદ્ધ થાય છે.", "tag": ""}, {"q": "રક્તકણોના જલીય કોલોઇડીય દ્રાવણમાં કાચના ચક્ર (clotting) માટે નીચેમાંથી કયું સાચું છે?", "opts": ["બેસિક સોડા ઉમેરતાં રક્તકણો અપક્ષેપિત થાય છે", "ઇલેક્ટ્રોફોરેસિસથી કણોનો વિરોધી ઇલેક્ટ્રોડ પર અપક્ષેપણ થાય છે", "તાપમાન વધારવાથી રક્તકણો સક્રિય થાય છે", "ડાયલિસિસથી રક્તકણો સ્થિર થાય છે"], "correct": 1, "explain": "રક્તકણો (blood) એ વિષમ પ્રકૃતિનું કોલોઇડ છે જે let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

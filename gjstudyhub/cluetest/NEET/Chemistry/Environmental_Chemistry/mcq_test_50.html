<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Environmental Chemistry — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Environmental Chemistry — 📝 50 MCQ Test</h1>

  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-05</footer>
</div>
<script>
const QUIZ = [{"q": "પર્યાવરણ પ્રદૂષણ (Environmental Pollution) શું છે?", "opts": ["પર્યાવરણમાં કુદરતી સંતુલન બગાડતાં હાનિકારક પદાર્થો અથવા તેથી થતી અશુદ્ધિ", "માત્ર ઔદ્યોગિક ફેકટરીઓમાંથી નીકળતા દુર્ગંધયુક્ત વાયુઓનો સમૂહ", "માટીમાં પાણીનો સંગ્રહ અને તેની પ્રક્રિયા", "કોઈ પણ પ્રકારનું વૃક્ષારોપણ કે જૈવવૈવિધ્ય સંરક્ષણ"], "correct": 0, "explain": "પર્યાવરણ પ્રદૂષણ એટલે પર્યાવરણમાં આવનારા હાનિકારક ભૌતિક, રાસાયણિક અથવા જૈવિક પદાર્થોને કારણે કુદરતી સંતુલનમાં થતી ખલેલ. આમાં પાણી, માટી અને વાયુમંડલ — ત્રણેય પર્યાવરણીય તત્વો સમાવિષ્ટ હોય છે.", "tag": ""}, {"q": "નીચેમાંથી કયો પ્રદૂષક 'જૈવ-ભંગુર' (Biodegradable) વર્ગમાં આવે છે?", "opts": ["ઘરેલું કચરું (Sewage)", "પ્લાસ્ટિક (Plastic)", "ડDT (DDT)", "પોલીએથિલીન (Polyethylene)"], "correct": 0, "explain": "ઘરેલું કચરું (Sewage) જૈવ-ભંગુર પ્રદૂષક છે, કારણ કે તે સૂક્ષ્મજીવો દ્વારા સરળતાથી વિઘટિત થઈ શકે છે. પ્લાસ્ટિક, DDT અને પોલીએથિલીન જેવા પ્રદૂષકો જૈવ-અભંગુર (Non-biodegradable) છે અને પર્યાવરણમાં લાંબા સમય સુધી ફરિસ્તા રહે છે.", "tag": ""}, {"q": "પ્રદૂષકો (Pollutants) ને મુખ્યત્વે કેટલા પ્રકારમાં વહેંચવામાં આવે છે?", "opts": ["જૈવ-ભંગુર અને જૈવ-અભંગુર (Biodegradable and Non-biodegradable)", "ઘન, વાયુ અને પ્રવાહી (Solid, Liquid and Gas)", "કાર્બનિક અને અકાર્બનિક (Organic and Inorganic)", "પ્રાકૃતિક અને કૃત્રિમ (Natural and Artificial)"], "correct": 0, "explain": "પ્રદૂષકોને મુખ્યત્વે બે શ્રેણીઓમાં વર્ગીકૃત કરવામાં આવે છે — જૈવ-ભંગુર (જે સૂક્ષ્મજીવો દ્વારા વિઘટિત થાય છે) અને જૈવ-અભંગુર (જે વિઘટિત થતાં નથી). NEET UG સિલેબસ અનુસાર આ વિભાજન સૌથી મહત્વનો આધાર છે.", "tag": ""}, {"q": "કાર્બન મોનોક્સાઇડ (CO) એક હાનિકારક વાયુ છે કારણ કે —", "opts": ["તે ધમની રક્તકણોના હિમોગ્લોબિન સાથે ઓક્સિજન કરતાં વધુ મજબૂતાઈથી જોડાઈ શકે છે", "તે વાતાવરણમાં ઓઝોન સ્તરને નુકસાન પહોંચાડે છે", "તે વરસાદનો pH ઘટાડે છે અને ઍસિડ વરસાદ કરે છે", "તે મુખ્યત્વે ફોટોરાસાયણિક ધુમાડો (Photochemical smog) ઉત્પન્ન કરે છે"], "correct": 0, "explain": "CO નું હિમોગ્લોબિન સાથેનું બંધન O₂ કરતાં લગભગ ૨૦૦ ગણું મજબૂત હોય છે, જેના કારણે લાલાભધમની હિમોગ્લોબિન (Carboxyhemoglobin) બને છે અને ટેકસ (Tissue) સ્તરે ઓક્સિજનની ઊણપ પડે છે. આથી CO વિષાળુ ગેસ ગણાય છે.", "tag": ""}, {"q": "નીચેમાંથી કયો વાયુ ઍસિડ વરસાદ (Acid Rain) માટે જવાબદાર નથી?", "opts": ["આર્ગોન (Argon — Ar)", "સલ્ફર ડાયોક્સાઇડ (SO₂)", "નાઇટ્રોજન ઑક્સાઇડ (NOx)", "કાર્બન ડાયોક્સાઇડ (CO₂)"], "correct": 0, "explain": "આર્ગોન (Ar) એ એક નિષ્ક્રિય વાયુ (Noble gas) છે અને તે જલજનક અથવા જલક્ષારક બનતો નથી, તેથી તે ઍસિડ વરસાદમાં ફાળો નથી આપતો. SO₂, NOx અને CO₂ — આ ત્રણેય વાયુઓ વરસાદના પાણી સાથે પ્રક્રિયા કરી એસિડિટી ઉભી કરે છે.", "tag": ""}, {"q": "પ્રકાશ-રાસાયણિક સ્મોગ (Photochemical Smog) ની રચના માટે નીચેમાંથી કયા બે દ્રવ્યો અનુમાનિત પ્રક્રિયામાં ભાગ લે છે?", "opts": ["નાઈટ્રોજન ઓક્સાઇડ્સ (NOₓ) અને હાઈડ્રોકાર્બન", "કાર્બન મોનોક્સાઇડ અને સલ્ફર ડાયોક્સાઇડ", "ઓઝોન અને પાણીનો બાષ્પ", "કાર્બન ડાયોક્સાઇડ અને મીથેન"], "correct": 0, "explain": "પ્રકાશ-રાસાયણિક સ્મોગની રચનામાં NOₓ અને હાઈડ્રોકાર્બન પ્રકાશની હાજરીમાં પ્રક્રિયા કરી ઓઝોન અને PAN જેવા દ્વિતિયક પ્રદૂષકો બનાવે છે. આ પ્રક્રિયા સૂર્યપ્રકાશની આપેલી UV કિરણો દ્વારા પ્રેરિત થાય છે.", "tag": ""}, {"q": "વાતાવરણમાં CFC (ક્લોરોફ્લોરોકાર્બન) ના અણુઓ સૂર્યપ્રકાશના અલ્ટ્રાવાયોલેટ કિરણોને અથડાઈને કયા મુક્ત રેડિકલનું ઉત્પાદન કરે છે, જે ઓઝોન સ્તરના વિઘટનનું કારણ બને છે?", "opts": ["ક્લોરિન મુક્ત રેડિકલ (Cl•)", "હાઈડ્રોક્સિલ મુક્ત રેડિકલ (OH•)", "ઓક્સિજન મુક્ત રેડિકલ (O•)", "નાઈટ્રેટ મુક્ત રેડિકલ (NO₃•)"], "correct": 0, "explain": "UV કિરણોની મદદથી CFC ના વિઘટનથી Cl• મુક્ત રેડિકલ મુક્ત થાય છે, જે ઓઝોન (O₃) સાથે પ્રક્રિયા કરી તેને O₂ માં પરિવર્તિત કરે છે. એક Cl• રેડિકલ હજારો O₃ અણુઓનું વિઘટન કરી શકે છે.", "tag": ""}, {"q": "ગ્લોબલ વોર્મિંગમાં વધુ સહભાગી બનતા ગ્રીનહાઉસ વાયુઓમાંથી કઈ ગેસ પાણીના બાષ્પ સ્વરૂપે સૌથી વધુ પ્રમાણમાં આયત્ત થાય છે?", "opts": ["જળવાષ્પ (Water vapour — H₂O)", "કાર્બન ડાયોક્સાઇડ (CO₂)", "મીથેન (CH₄)", "ઝેનોન (Xe)"], "correct": 0, "explain": "જળવાષ્પ (Water vapour) સૌથી વધુ પ્રમાણમાં જોવા મળતો ગ્રીનહાઉસ વાયુ છે અને ગ્લોબલ વોર્મિંગમાં અગ્રણી ભૂમિકા ભજવે છે. CO₂ પણ મહત્વપૂર્ણ છે પરંતુ જળવાષ્પની યોગદાન સૌથી વધુ હોય છે.", "tag": ""}, {"q": "ડોમ ફાઉન્ડેશન (Dom Foundation) દ્વારા વિકસિત 'ડોમ કવર ટેક્નિક' (DOM Cover Technique) નો ઉપયોગ મુખ્યત્વે કઈ સમસ્યાને નિયંત્રિત કરવા માટે થાય છે?", "opts": ["ઘરેલું ઠોસ કચરાને ઢાંકીને એરોબિક સડપન (aerobic decay) અટકાવવા", "ઔદ્યોગિક વેસ્ટવોટર શુદ્ધિકરણ માટે", "જૈવ-ભંગુર કચરાની ખાતણ બનાવવા", "વાતાવરણમાંથી દૂષિત વાયુઓ શોષવા"], "correct": 0, "explain": "ડોમ કવર ટેક્નિક ઘરેલું કચરાને ઢાંકીને તેના એરોબિક સડપનને અટકાવે છે, જેથી કચરામાંથી ઉત્પન્ન થતી દુર્ગંધ અને હાનિકારક બેક્ટેરિયાનો પ્રસાર રોકી શકાય. આ પદ્ધતિ સસ્ती અને પર્યાવરણ-અનુકૂળ ગણાય છે.", "tag": ""}, {"q": "નીચેમાંથી કયો જૂથ યોગ્ય રીતે 'ગેર-જૈવ-ભંગુર' (Non-biodegradable) પ્રદૂષકો દર્શાવે છે?", "opts": ["ખાદ્ય કચરું અને કાગળ", "પ્લાસ્ટિક અને DDT", "ખાતર અને બાયોડિગ્રેડેબલ સોફ્ટવેર", "ગાયનું દૂધ અને સૂકી ઘાસ"], "correct": 1, "explain": "પ્લાસ્ટિક અને DDT (ಡાયક્લોરોડાયફિનાઇલટ્રાયકલોરોઇથેન) બંને ગેર-જૈવ-ભંગુર પ્રદૂષકો છે; તેઓ પ્રકૃતિમાં સહેલાઈથી વિઘટિત થતા નથી અને વર્ષો સુધી વાતાવરણમાં રહી શકે છે. આ દ્રવ્યો જૈવિક સંચય (bioaccumulation) દ્વારા ખોરાક શૃંખલામાં ભેગાં થાય છે.", "tag": ""}, {"q": "પાણી પ્રદૂષણ માટે વપરાતી BIOCHEMICAL OXYGEN DEMAND (BOD) પદ્ધતિમાં, જ્યાં જૈવરસાયણીક પ્રક્રિયા દ્વારા પાણીમાં ઉપલબ્ધ ઑક્સિજનનું પ્રમાણ માપવામાં આવે છે, ત્યાં આ પ્રક્રિયા સામાન્ય રીતે ___ °C તાપમાને કરવામાં આવે છે.", "opts": ["20°C", "27°C", "37°C", "15°C"], "correct": 0, "explain": "BIOCHEMICAL OXYGEN DEMAND (BOD) નું પ્રમાણ માપવા માટે, પાણીના નમૂનાને 20°C તાપમાને 5 દિવસ માટે ઇન્ક્યુબેટ કરવામાં આવે છે, જેથી માઇક્રોબાયલ પ્રવૃત્તિ દ્વારા ઓર્ગેનિક ઓક્સિડેશનનું મૂલ્યાંકન થઈ શકે.", "tag": ""}, {"q": "નીચે મુજબના કયા પદાર્થોની હાજરી યુટ્રોફિકેશન (Eutrophication) પ્રક્રિયાને કારણે પાણીમાં ઓક્સિજનની ખાલીપણી (Oxygen Depletion) ની ઘટના સર્જવામાં મહત્વપૂર્ણ ભૂમિકા ભજવે છે?", "opts": ["નાઈટ્રેટ અને ફોસ્ફેટ આયનો", "કાર્બન મોનોક્સાઇડ", "ઓઝોન (O₃)", "સલ્ફર ડાયોક્સાઇડ"], "correct": 0, "explain": "નાઈટ્રેટ અને ફોસ્ફેટ આયનો પૌષ્ટિક તત્વો તરીકે વર્તીને શૈવાળના વધુ પડતા પ્રમાણમાં વિકાસને પ્રોત્સાહન આપે છે; જેના કારણે ઓર્ગેનિક કચરાના વિઘટન સમયે ઓક્સિજનનું માત્રાત્મક હ્રાસ થાય છે, જે યુટ્રોફિકેશન પ્રક્રિયા છે.", "tag": ""}, {"q": "કાર્બન મોનોક્સાઇડ (CO) હવામાં ખૂબ જ હાનિકારક ધરાવે છે કારણ કે તે -", "opts": ["રાહત (Hemoglobin) સાથે કાર્બોક્સીહિમોગ્લોબિન (Carboxyhemoglobin) બનાવીને ઓક્સિજન વહનમાં અવરોધ ઊભો કરે છે", "ઓઝોન સ્તરને તાડી નાખે છે", "તાપમાન વધારવામાં સીધો ફાળો આપે છે", "વરસાદના pH માં ઘટાડો કરે છે"], "correct": 0, "explain": "CO હિમોગ્લોબિન (Hemoglobin) સાથે ખૂબ જ મજબૂત રીતે જોડાઈને કાર્બોક્સીહિમોગ્લોબિન બનાવે છે, જેના કારણે રક્તમાં ઓક્સિજનનો વહન ક્ષમતા ઘટે છે અને ટિસ્યુ હાઈપોક્સિયા (Tissue Hypoxia) સર્જાય છે.", "tag": ""}, {"q": "નીચેમાંથી કઈ પ્રક્રિયા ગ્લોબલ વોર્મિંગ (Global Warming) માં મુખ્યત્વે ભૂમિકા ભજવે છે?", "opts": ["તાપીય વિકિરણ (Thermal Radiation) ને અવરોધિત કરવું", "સૂર્યપ્રકાશના UV વિકિરણને રોકવું", "ઓઝોન સ્તરનું સંરક્ષણ કરવું", "પરિવહન માટે ઇંધણનો ઉપયોગ વધારવો"], "correct": 0, "explain": "ગ્રીનહાઉસ વાયુઓ પૃથ્વીની ઉપરિષ્ઠ તરફથી આવતું તાપીય વિકિરણ (Infrared/Thermal Radiation) શોષી લઈને ફરી પૃથ્વી તરફ રિડાયરેક્ટ કરે છે, જેના પરિણામે ગ્રીનહાઉસ અસર વધે છે અને પૃથ્વીનું સરેરાશ તાપમાન વધે છે.", "tag": ""}, {"q": "ઓઝોન સ્તર (Ozone Layer) ના વિનાશમાં મુખ્યત્વે કયા વાયુઓ જવાબદાર છે, જે ઉચ્ચ વાતાવરણમાં UV પ્રકાશની હાજરીમાં ક્લોરીન પરમાણુઓ મુક્ત કરે છે?", "opts": ["ક્લોરોફ્લોરોકાર્બન (CFCs)", "મિથેન (CH₄)", "કાર્બન ડાયોક્સાઇડ (CO₂)", "નાઈટ્રસ ઓક્સાઇડ (N₂O)"], "correct": 0, "explain": "CFCs ઉચ્ચ વાતાવરણમાં UV કિરણોની અસર હેઠળ વિઘટન પામે છે, જેનાથી મુક્ત થતા ક્લોરીન પરમાણુઓ ઝડપી પ્રતિક્રિયાઓ દ્વારા ઓઝોન (O₃) નું વિઘટન કરે છે અને ઓઝોન સ્તર પાતળું પડે છે.", "tag": ""}, {"q": "નીચે મુજબના કયો જૂથ યોગ્ય રીતે 'ગેર-જૈવ-ભંગુર' (Non-biodegradable) દૂષકોનું પ્રતિનિધિત્વ કરે છે?", "opts": ["DDT, BHC, પ્લાસ્ટિક", "કાગળ, લાકડું, ખાદ્યવસ્તુઓનો કચરો", "સલ્ફર ડાયોક્સાઇડ, કાર્બન મોનોક્સાઇડ, ઓઝોન", "બેક્ટેરિયા, ફૂગ, શૈવાળ"], "correct": 0, "explain": "DDT, BHC અને પ્લાસ્ટિક જેવા પદાર્થો પ્રકૃતિમાં સરળતાથી વિઘટિત થતા નથી અને લાંબા સમય સુધી પર્યાવરણમાં જમા થઈ રહે છે, તેથી તેઓ ગેર-જૈવ-ભંગુર દૂષકો ગણાય છે.", "tag": ""}, {"q": "DDT ના ઉપયોગને કારણે પક્ષીઓમાં કઈ સમસ્યા જોવા મળે છે?", "opts": ["અંડાના છાલ પાતળા પડી જવાથી અંડા ફૂટી જવાનું પ્રમાણ વધે છે", "પક્ષીઓનું પીછાંકામ (Feathering) વધે છે", "પક્ષીઓની ઉર્જા વધે છે", "પક્ષીઓનું પ્રજનન દર વધે છે"], "correct": 0, "explain": "DDT ના જૈવિક સંચય (Bioaccumulation) ને કારણે પક્ષીઓમાં કેલ્શિયમ ચયાપચય પ્રભાવિત થાય છે, જેથી અંડાના છાલ પાતળા પડી જાય છે અને અંડા ફૂટી જવાનું પ્રમાણ વધે છે.", "tag": ""}, {"q": "ગેર-જૈવ-ભંગુર દૂષકો (Non-biodegradable pollutants) નીચેનામાંથી કયા ગુણધર્મને કારણે પર્યાવરણ માટે વધુ હાનિકારક છે?", "opts": ["તેઓ પ્રકૃતિમાં વિઘટિત થતા નથી અને જૈવિક સંચય (Bioaccumulation) દ્વારા ખોરાક શૃંખલામાં એકત્રિત થાય છે", "તેઓ ઝડપથી બેક્ટેરિયા દ્વારા વિઘટિત થઈ જાય છે", "તેઓ માત્ર હવામાં જ પ્રભાવ પાડે છે", "તેઓ પાણીમાં ઝડપથી ઓગળી જાય છે"], "correct": 0, "explain": "ગેર-જૈવ-ભંગુર દૂષકો પ્રકૃતિમાં વિઘટિત થતા નથી અને ખોરાક શૃંખલામાં ઉપરની તરફ જતાં એકત્રિત થાય છે (Biomagnification), જેથી શિખરના ખાદકો પર તેમની અસર વધુ ગંભીર બને છે.", "tag": ""}, {"q": "નીચેમાંથી કયો જૂથ 'જૈવ-ભંગુર' (Biodegradable) દૂષકોનો છે?", "opts": ["કાગળ, લાકડું, ખાદ્યવસ્તુઓનો કચરો", "પ્લાસ્ટિક, DDT, BHC", "સલ્ફર ડાયોક્સાઇડ, NOx, CO", "પારો, લેડ, કેડમિયમ"], "correct": 0, "explain": "કાગળ, લાકડું અને ખાદ્યવસ્તુઓનો કચરો જેવા પદાર્થો બેક્ટેરિયા અને ફૂગ જેવા સૂક્ષ્મજીવો દ્વારા સરળતાથી વિઘટિત થઈ શકે છે, તેથી તેઓ જૈવ-ભંગુર દૂષકો છે.", "tag": ""}, {"q": "કૃષિમાં વપરાતા જંતુનાશકો (Pesticides) માંથી DDT નું નિયંત્રણ કયા આંતરરાષ્ટ્રીય કરાર દ્વારા કરવામાં આવ્યું હતું?", "opts": ["સ્ટોકહોમ કરાર (Stockholm Convention)", "ક્યોટો પ્રોટોકોલ (Kyoto Protocol)", "માન્ટ્રીયલ પ્રોટોકોલ (Montreal Protocol)", "પેરિસ કરાર (Paris Agreement)"], "correct": 0, "explain": "સ્ટોકહોમ કરાર (2001) એ વિશ્વભરમાં DDT અને અન્ય સ્થાયી જૈવિક દૂષકો (Persistent Organic Pollutants - POPs) ના ઉત્પાદન અને ઉપયોગ પર પ્રતિબંધ લાદવા માટેનું પ્રમુખ આંતરરાષ્ટ્રીય કરાર છે.", "tag": ""}, {"q": "જૈવિક ઓક્સિજન માંગ (BOD) નો ઉપયોગ નીચેનામાંથી કયા માપદંડ તરીકે થાય છે?", "opts": ["પાણીની જૈવિક પ્રદૂષણ અવસ્થાનું માપ", "પાણીના તાપમાનનું માપ", "પાણીના pH નું માપ", "પાણીના ખનિજ સામગ્રીનું માપ"], "correct": 0, "explain": "BOD એ પાણીમાં રહેલા જૈવિક કચરા (જૈવિક પદાર્થો) ને બેક્ટેરિયા દ્વારા વિઘટિત કરવા માટે જરૂરી ઓક્સિજનની માત્રા દર્શાવે છે. જેટલું BOD વધુ, તેટલું પાણી વધુ પ્રદૂષિત. તેથી તે પાણીની જૈવિક પ્રદૂષણ અવસ્થાનું માપદંડ છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું પદાર્થ જૈવિક વિઘટન પામી શકતું નથી (Non-biodegradable) અને પર્યાવરણમાં લાંબા સમય સુધી સંચિત થાય છે?", "opts": ["DDT (ડાયકલોરોડાયફેનિલટ્રાયકલોરોઇથેન)", "કાગળ", "ખાદ્ય વેસ્ટ", "લાકડું"], "correct": 0, "explain": "DDT એક કૃત્રિમ જંતુનાશક છે જે કુદરતી રીતે વિઘટન પામતું નથી. તે જૈવ-સંચયન (Bioaccumulation) દ્વારા ખોરાક શૃંખલામાં એકઠું થાય છે અને પર્યાવરણમાં વર્ષો સુધી રહે છે. કાગળ, ખાદ્ય વેસ્ટ અને લાકડું બધા જૈવ-ભંગુર છે.", "tag": ""}, {"q": "રાસાયણિક ઓક્સિજન માંગ (COD) અને જૈવિક ઓક્સિજન માંગ (BOD) વચ્ચેનો મુખ્ય તફાવત કયો છે?", "opts": ["COD માત્ર જૈવિક પદાર્થો માટે થાય છે, BOD બધા પદાર્થો માટે", "COD જૈવિક અને અજૈવિક બંને પ્રકારના ઓક્સિડેશન પામી શકતા પદાર્થોની કુલ માંગ દર્શાવે છે, જ્યારે BOD માત્ર જૈવિક પદાર્થો માટે થાય છે", "COD અને BOD બંને એક જ છે", "COD માત્ર ઉદ્યોગોના કચરા માટે થાય છે, BOD માત્ર ઘરેલું કચરા માટે"], "correct": 1, "explain": "COD એ પાણીના નમૂનામાં રહેલા તમામ ઓક્સિડેશન પામી શકતા જૈવિક અને અજૈવિક પદાર્થો માટે જરૂરી ઓક્સિજનની કુલ માત્રા દર્શાવે છે. BOD માત્ર જૈવિક પદાર્થોના બેક્ટેરિયલ વિઘટન માટે જરૂરી ઓક્સિજન દર્શાવે છે. તેથી COD હંમેશા BOD કરતાં વધુ અથવા સમાન હોય છે.", "tag": ""}, {"q": "પાણીમાં નાઈટ્રેટ (NO₃⁻) ની વધુ માત્રા હોવાથી કઈ સમસ્યા ઉભી થાય છે?", "opts": ["મિથેમોગ્લોબિનેમિયા (Blue Baby Syndrome)", "કલેજરો", "ડાયરિયા", "ટાઈફોઈડ"], "correct": 0, "explain": "પાણીમાં નાઈટ્રેટની વધુ માત્રા (25 ppm થી વધુ) શિશુઓમાં મિથેમોગ્લોબિનેમિયા (Blue Baby Syndrome) નો રોગ ઉભો કરે છે. આ સ્થિતિમાં હિમોગ્લોબિન ઓક્સિજન વહન કરવાની ક્ષમતા ગુમાવી દે છે, જેથી શિશુનું ત્વચા નીલો પડી જાય છે. કલેજરો, ડાયરિયા અને ટાઈફોઈડ બેક્ટેરિયલ પ્રદૂષણથી થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો પદ્ધતિ ઘરેલું અને વ્યવસાયિક ઘન કચરાના નિવારણ (Solid Waste Management) માં 'વર્મિકમ્પોસ્ટિંગ' (Vermicomposting) સાથે સંબંધિત છે?", "opts": ["કીટાણુનાશકોનો ઉપયોગ કરીને કચરાનો નાશ કરવો", "કીટાણુજીવો (Bacteria) નો ઉપયોગ કરીને કચરાનું વિઘટન કરવું", "કીટાણુજીવો (Earthworms) નો ઉપયોગ કરીને જૈવિક કચરાનું વિઘટન કરીને ખાતર બનાવવું", "કચરાને ઊંડા ગર્તમાં દફનાવવો"], "correct": 2, "explain": "વર્મિકમ્પોસ્ટિંગ એ એક પ્રક્રિયા છે જેમાં કીટાણુજીવો (Earthworms) જૈવિક ઘન કચરાનું વિઘટન કરીને ઉપયોગી ખાતર (કમ્પોસ્ટ) બનાવે છે. આ પદ્ધતિ પર્યાવરણ-અનુકૂળ છે અને ઘન કચરાના નિવારણમાં મહત્વપૂર્ણ ભૂમિકા ભજવે છે.", "tag": ""}, {"q": "પાણીના જૈવિક તંત્રમાં DDT નું જૈવિક સંચય (Biomagnification) થવાની પ્રક્રિયા સંબંધે નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["DDT પાણીમાં ઓગળી જાય છે અને સીધું જ માછલીઓના શરીરમાં જમા થાય છે.", "DDT ફક્ત સ્થળીય જીવોમાં જ જમા થાય છે, પાણીના જીવોમાં નહીં.", "ખાદ્ય શૃંખલાના ઉચ્ચતમ સ્તરના જીવોમાં DDT ની સાંદ્રતા સૌથી વધુ હોય છે કારણ કે તે ચયાપચય દ્વારા તૂટતું નથી.", "DDT નું સંચય ફક્ત બેક્ટેરિયા દ્વારા જ થાય છે અને તે જૈવ-ભંગુર છે."], "correct": 2, "explain": "DDT એક સ્થિર અને જૈવ-અભંગુર (non-biodegradable) રસાયણ છે જે ખાદ્ય શૃંખલામાં ઉપરની તરફ જતાં વધતી સાંદ્રતા ધરાવે છે. આ પ્રક્રિયાને જૈવિક સંચય (Biomagnification) કહે છે, જેમાં શિકારી જીવોમાં શિકાર કરતાં વધુ DDT જમા થાય છે.", "tag": ""}, {"q": "કૃષિમાં વપરાતા જંતુનાશકો (Pesticides) ના પર્યાવરણીય પ્રભાવ સંબંધે નીચેનામાંથી કયું વિધાન સાચું નથી?", "opts": ["જંતુનાશકો માટીના સૂક્ષ્મજીવોને નુકસાન પહોંચાડી શકે છે.", "કેટલાક જંતુનાશકો પાણીના સ્રોતોમાં ધોવાઈ જઈને જળ પ્રદૂષણ કરે છે.", "બધા જ જંતુનાશકો જૈવ-ભંગુર (biodegradable) હોય છે અને તેથી પર્યાવરણ માટે સંપૂર્ણપણે સુરક્ષિત છે.", "જંતુનાશકોનો અતિવપરાયોગથી ઉપયોગી કીટકો પણ મૃત્યુ પામે છે."], "correct": 2, "explain": "બધા જ જંતુનાશકો જૈવ-ભંગુર નથી. DDT જેવા ઘણા જંતુનાશકો જૈવ-અભંગુર (non-biodegradable) છે અને પર્યાવરણમાં લાંબા સમય સુધી રહે છે. આથી 'બધા જ જંતુનાશકો જૈવ-ભંગુર છે' એ વિધાન ખોટું છે.", "tag": ""}, {"q": "ઉદ્યોગિક કચરા (Industrial Waste) ના નિવારણ સંબંધે નીચેનામાંથી કયો વિકલ્પ યોગ્ય નથી?", "opts": ["ઉદ્યોગિક કચરાનું function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductive Health — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "સ્રાવીક્ષમતાના આરોગ્યની વ્યાખ્યા અનુસાર સ્રાવીક્ષમતા એટલે શું? (વ્યાકરણ / જીવનશૈલીની દૃષ્ટિએ)", "opts": ["શારીરિક, માનસિક અને સામાજિક દૃષ્ટિએ સંપૂર્ણ સ્વાસ્થ્ય", "કેવળ પ્રજનન તંત્રનું શારીરિક આરોગ્ય", "કેવળ બાળકોનું જન્મે તે પહેલાંનું સ્વાસ્થ્ય", "કેવળ જનનક્ષમતાનો દર"], "correct": 0, "explain": "નિર્વિક્ષમતાનું આરોગ્ય એટલે 'શારીરિક, માનસિક અને સામાજિક' દૃષ્ટિએ સંપૂર્ણ સ્વાસ્થ્ય, ન કે માત્ર પ્રજનન તંત્રનું આરોગ્ય.", "tag": ""}, {"q": "'જન્મ નિયંત્રણ' ની પદ્ધતિઓનો ઉપયોગ શા માટે આવશ્યક બને છે?", "opts": ["આબાદીના વિસ્ફોટ રોકવા માટે", "જન્મ દરને વધારવા માટે", "કર છૂટ આપવા માટે", "સ્ત્રીઓને કાર્યરત રાખવા માટે"], "correct": 0, "explain": "ભારતમાં ઝડપી વધતી આબાદીને કારણે સ્રાવીક્ષમતા આરોગ્યમાં જનસંખ્યા વિસ્ફોટ રોકવા માટે જન્મનિયંત્રણ પદ્ધતિઓ ખૂબ જરૂરી બની છે.", "tag": ""}, {"q": "નિષ્કર્ષણ શુક્રજાંત (Sperm) અને અંડકોષ (Ovum) નો સંગમ (Union) શું કહેવાય?", "opts": ["નિષેચન (Fertilization)", "વિભાજન (Division)", "અંડપ્રજનન (Oogenesis)", "જારીભવન (Implantation)"], "correct": 0, "explain": "શુક્રજાંત અને અંડકોષના સંગમને નિષેચન કહે છે. આ પ્રક્રિયાથી ઝાયગોટનો વિકાસ થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પદ્ધતિ નિષ્કર્ષણ પછીના ગર્ભસ્થિરણ (Implantation) ની પૂર્વે ગર્ભધારણ અટકાવે છે?", "opts": ["IUD (અન્તર્ગર્ભયંત્ર)", "વાયકેનાલ કંડોમ", "ઈન્હિબિટર્સ (રોકવાળી દવા)", "આયોડાઇઝ્ડ સોડિયમ"], "correct": 0, "explain": "IUD (અન્તર્ગર્ભયંત્ર) શરીરમાં મૂકવામાં આવે છે અને ગર્ભસ્થિરણ અટકાવીને સ્રાવીક્ષમતા રોકે છે. તે પ્રજનન ટ્યુબ અને ગર્ભાશય વચ્ચે કામ કરે છે.", "tag": ""}, {"q": "સામાજિક સ્રાવીક્ષમતા આરોગ્ય અભિયાન 'AMMA' નું પૂરું નામ શું છે?", "opts": ["આરોગ્ય સેતુ (Maternal and Infant Care)", "રોગ નિવારણ મહાઅભિયાન", "આરતી માતા અને બાળ કલ્યાણ", "મહિલા સ્વાસ્થ્ય મહોત્સવ"], "correct": 0, "explain": "AMMA એટલે 'Maternal and Infant Care' (માતા અને બાળકલ્યાણ અભિયાન), જે ભારત સરકાર દ્વારા શરૂ કરાયેલ સ્ત્રી-બાળ સ્વાસ્થ્ય માટેનું એક રાષ્ટ્રીય અભિયાન છે.", "tag": ""}, {"q": "ચોક્કસ કાયદાકીય મર્યાદા અનુસાર ભારતમાં MTP (ગર્ભપાત) કિસ્સાઓ કયા ગર્ભાવસ્થા સમયગાળા દરમિયાન સુરક્ષિત ગણવામાં આવે છે?", "opts": ["ગર્ભાવસ્થાના પ્રથમ ૧૨ સપ્તાહ સુધી", "ગર્ભાવસ્થાના પ્રથમ ૨૪ સપ્તાહ સુધી", "ગર્ભાવસ્થાના પ્રથમ ૨૦ સપ્તાહ સુધી", "ગર્ભાવસ્થાના પ્રથમ ૮ સપ્તાહ સુધી"], "correct": 2, "explain": "ગર્ભપાત (Medical Termination of Pregnancy - MTP) એ ગર્ભાવસ્થાના પ્રથમ ૧૨ સપ્તાહ સુધી સુરક્ષિત છે અને ભારતીય કાયદા મુજબ ચોક્કસ પરિસ્થિતિઓ હેઠળ ૨૦ સપ્તાહ સુધીની ગર્ભાવસ્થા માટે પણ મંજૂર છે. આ પ્રક્રિયા નિષ્ણાત ડૉક્ટરો દ્વારા સુરક્ષિત રીતે કરવામાં આવે છે.", "tag": ""}, {"q": "AMNIOCENTESIS (એમ્નિયોસેન્ટેસિસ) પદ્ધતિ શું છે અને તેનો ઉપયોગ મુખ્યત્વે શ માટે થાય છે?", "opts": ["ગર્ભાશયની અંદરથી અંડકોષ લેવાની પ્રક્રિયા", "પ્રસૂતિ દરમિયાન ખુલ્લા માર્ગે જન્મ આપવાની પદ્ધતિ", "ગર્ભાવસ્થા દરમિયાન અંડકોષનું વિકાસ જોવા માટે ઉપયોગ", "ગર્ભાશયમાંથી એમેન્યોટિક પ્રવાહી કાઢીને ફેટલ જનેટિક સમસ્યાઓ શોધવાની પદ્ધતિ"], "correct": 3, "explain": "એમ્નિયોસેન્ટેસિસ એ ગર્ભાવસ્થા દરમિયાન પેટ પર સૂઈને સંચોડી મારી અંડકોષના આસપાસના એમેન્યોટિક પ્રવાહીનું નમૂનું કાઢવાની પદ્ધતિ છે. આ પ્રવાહીમાં ગર્ભના કોષો હોય છે જેનો ઉપયોગ જનીનિક તપાસ માટે થાય છે. ભારતમાં સ્ત્રી-બાળછેદ (Pre-Conception and Pre-Natal Diagnostic Techniques Act) અંતર્ગત આ પદ્ધતિનો બોજારૂપ સ્ત્રી ગર્ભ નિર્ધારણ માટે ઉપયોગ અટકાવવા માટે નિયંત્રિત છે.", "tag": ""}, {"q": "IVF (In Vitro Fertilisation - બાહ્ય ગર્ભધારણ) અને ZIFT (Zygote Intrafallopian Transfer) વચ્ચેનો મુખ્ય તફાવત કયો છે?", "opts": ["IVF માં ગર્ભાશયમાં ફલન થાય છે જ્યારે ZIFT માં અંડનળીમાં ફલન થાય છે", "IVF માં અંડનળીમાં ફલન થાય છે જ્યારે ZIFT માં ગર્ભાશયમાં ફલન થાય છે", "IVF માં ગર્ભાશયની બહાર અંડકોષ અને શુક્રાણુનું મિશ્રણ કરી ગર્ભ વિકસાવી ગર્ભાશયમાં રાખવામાં આવે છે; ZIFT માં ફલન પછી ઝાયગોટ/અનુભ્રને અંડનળીમાં સ્થાનાંતરિત કરવામાં આવે છે", "બંનેમાં સમાન પ્રક્રિયા હોય છે અને ફક્ત નામ અલગ હોય છે"], "correct": 2, "explain": "IVF માં અંડકોષ અને શુક્રાણુનું મિશ્રણ ટેસ્ટ ટ્યુબ અથવા લેબમાં કરવામાં આવે છે અને ૩-૮ બ્લાસ્ટોમીન્સ વાળો ગર્ભ ગર્ભાશયમાં સ્થાનાંતરિત કરવામાં આવે છે. જ્યારે ZIFT માં ફલન પછી ઝાયગોટ અથવા અનુભ્રને અંડનળીમાં સ્થાનાંતરિત કરવામાં આવે છે જેથી તે આગળ વિકાસ પામી શકે.", "tag": ""}, {"q": "ICSI (Intracytoplasmic Sperm Injection - આંતરકોષરસ શુક્રાણુ સંલગ્ન) પદ્ધતિમાં શું કરવામાં આવે છે?", "opts": ["અંડકોષ અને શુક્રાણુ બંનેને ગર્ભાશયમાં સીધા મૂકવામાં આવે છે", "શુક્રાણુને સીધું અંડકોષના કોષરસમાં ઇન્જેક્ટ કરવામાં આવે છે", "શુક્રાણુ અને અંડકોષને અંડનળીમાં મુકી ફલન માટે અલવોવામાં આવે છે", "અંડકોષને ગર્ભાશયની અંદર સ્થળાંતરિત કરવામાં આવે છે"], "correct": 1, "explain": "ICSI એ સહાયક પ્રજનન તકનીક (ART) છે જેમાં એક શુક્રાણુનું સીધું અંડકોષના કોષરસમાં ઇન્જેક્ટ કરવામાં આવે છે. આ પદ્ધતિ ખાસ કરીને પુરુષ બાંધછૂટ ધરાવતા દંપતીઓ માટે ઉપયોગી છે જ્યાં શુક્રાણુની સંખ્યા અથવા ગતિશીલતા ઓછી હોય.", "tag": ""}, {"q": "GIFT (Gamete Intrafallopian Transfer - ગેમીટ અંડનળી સ્થાનાંતરણ) પદ્ધતિમાં શું કરવામાં આવે છે?", "opts": ["ફલન પછી ગર્ભ અંડનળીમાં મૂકવામાં આવે છે", "અંડકોષ અને શુક્રાણુ બંનેને અંડનળીમાં સ્થાનાંતરિત કરવામાં આવે છે જેથી ફલન અંડનળીની અંદર થાય", "અંડકોષને ગર્ભાશયમાં મૂકવામાં આવે છે", "શુક્રાણુને સીધું રક્ત પ્રવાહમાં ઇન્જેક્ટ કરવામાં આવે છે"], "correct": 1, "explain": "GIFT માં અંડકોષ અને શુક્રાણુને અલગથી અંડનળી (Fallopian tube) માં સ્થાનાંતરિત કરવામાં આવે છે. અંડનળીની અંદર જ ફલન થાય છે અને પછી ગર્ભ વિકાસ પામે છે. આ પદ્ધતિ IVFથી અલગ છે કારણ કે IVFમાં ફલન લેબમાં થાય છે જ્યારે GIFTમાં ફલન શરીરની અંદર જ થાય છે.", "tag": ""}, {"q": "ZIFT (Zygote Intrafallopian Transfer) પ્રક્રિયામાં યોગ્ય સમયે શુક્રકોષ (Zygote) ને ક્યાં સ્થાનાંતરિત કરવામાં આવે છે?", "opts": ["અંડનળી (Fallopian tube)", "ગર્ભાશય (Uterus)", "અંડકોષ (Ovary)", "બાહ્ય પર્યાવરણ"], "correct": 0, "explain": "ZIFT માં, ફલન પછી 8 કે તેથી ઓછા બ્લાસ્ટોમર્સ સહિતનો જાયગોટ અંડનળીમાં સ્થાનાંતરિત કરવામાં આવે છે. યોગ્ય સમયે જાયગોટ અંડનળીમાં જ રાખવામાં આવે છે અને ત્યારબાદ ગર્ભસ્થિરણ થાય છે.", "tag": ""}, {"q": "ICSI (Intracytoplasmic Sperm Injection) પદ્ધતિમાં શુક્રકોષને ક્યાં પ્રવેશ કરાવવામાં આવે છે?", "opts": ["અંડકોષના સાયટોપ્લાઝમમાં", "ગર્ભાશયની દીવાલમાં", "અંડનળીના લ્યુમેનમાં", "ગ્રાફ ગ્રાહકમાં"], "correct": 0, "explain": "ICSI માં, એક સક્રિય શુક્રકોષને સીધા અંડકોષના સાયટોપ્લાઝમમાં ઇન્જેક્ટ કરવામાં આવે છે. આ પદ્ધતિ પुरुष વંધ્યત્વ (સ્પર્મેટોજનેસિસમાં ખામીને કારણે) સમયમાં ખૂબ ઉપયોગી છે.", "tag": ""}, {"q": "GIFT (Gamete Intrafallopian Transfer) પદ્ધતિ કયા પ્રકારના વંધ્યત્વને સમર્થન આપે છે?", "opts": ["તેમાં અંડકોષ અને શુક્રકોષને સીધી અંડનળીમાં મૂકવામાં આવે છે", "તેમાં ગર્ભાશયમાં સીધા ગર્ભનું સ્થાપન કરવામાં આવે છે", "તે માત્ર શુક્રકોષની ગુણવત્તા સુધારવા માટે હોય છે", "તેમાં ગર્ભપાત પછી ગર્ભસ્થિરણ માટે ઉપયોગ કરવામાં આવે છે"], "correct": 0, "explain": "GIFT માં, અંડકોષ અને શુક્રકોષને બંનેને સીધી અંડનળીમાં ટ્રાન્સફર કરવામાં આવે છે, જ્યાં ફલન પ્રક્રિયા આંતરિક રીતે થાય છે. આ પદ્ધતિ ગર્ભાશયની બહાર ફલનની શક્યતા ઘટાડે છે.", "tag": ""}, {"q": "બાહ્ય ગર્ભધારણ (IVF) અને ZIFT નીચેનામાંથી કયા સમયગાળા પછી અલગ પડે છે?", "opts": ["IVF માં ફલન લેબમાં થાય છે અને ZIFT માં જાયગોટ અંડનળીમાં સ્થાનાંતરિત કરવામાં આવે છે", "IVF માં ગર્ભાશયમાં સીધું સ્થાપન કરવામાં આવે છે અને ZIFT માં અંડકોષમાં શુક્રકોષ પ્રવેશ કરાવવામાં આવે છે", "IVF માં અંડનળીમાં જ ફલન થાય છે અને ZIFT માં ગર્ભાશયમાં સ્થાપન કરવામાં આવે છે", "IVF અને ZIFT બંને એક જ પ્રક્રિયા છે, તફાવત માત્ર ઓપરેશન કરનારા ડૉક્ટરના છે"], "correct": 0, "explain": "IVF માં, ફલન પ્રક્રિયા લેબમાં બાહ્ય પર્યાવરણમાં થાય છે. ZIFT માં, ફલન પછી જાયગોટ (૮-બ્લાસ્ટોમર્સ) ને અંડનળીમાં સ્થાનાંતરિત કરવામાં આવે છે, જ્યાં ગર્ભસ્થિરણ થાય છે.", "tag": ""}, {"q": "આઇએફ (Insemination) ની અસરકારકતા વધારવા માટે કયા પ્રકારના સ્પર્માઇડ પદ્ધતિ અસ્તિત્વમાં છે?", "opts": ["ઇન્ટ્રા યુટરાઇન ઇન્સેમિનેશન (IUI)", "ઇન્ટ્રા કોર્ન્યલ ઇન્સેમિનેશન (ICL)", "ઇન્ટ્રાઓવેરિયન ઇન્સેમિનેશન (IOV)", "ઇન્ટ્રાપેરિટોનીયલ ઇન્સેમિનેશન (IPP)"], "correct": 0, "explain": "ઇન્ટ્રા યુટરાઇન ઇન્સેમિનેશન (IUI) એ એક પદ્ધતિ છે જેમાં શુક્રકોષને સીધા ગર્ભાશયમાં મૂકવામાં આવે છે. આ પદ્ધતિ શુક્રકોષની ગતિશીલતા અને સંખ્યામાં ખામી સમયમાં ઉપયોગી છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું લિંગરોગ (STD) વાયુજીવ દ્વારા થતું નથી?", "opts": ["વીનરિકલ હર્પીઝ (Genital Warts)", "ગોનોરિયા (Gonorrhea)", "ક્લેમિડિયા (Chlamydia)", "સિફિલિસ (Syphilis)"], "correct": 0, "explain": "વીનરિકલ હર્પીઝ વાયુજીવ (Human Papillomavirus - HPV) દ્વારા થતુ estrel) સર્વોપરિ ગર્ભનિવારક ગોળીઓમાંથી એક છે, જે ગર્ભધારણ પછી 72 કલાકની અંદર લગાડવામાં આવે છે અને તે ગર્ભાશયની અંદર ગર્ભ સ્થિતિસ્થાપકતા બદલે છે, જેનાથી ગર્ભધારણ અટકી જાય છે.", "tag": ""}, {"q": "ઇન્ટ્રા્યુટરીન ઉપકરણ (IUD) ના પ્રકારોમાં કયું IUD હોર્મોનલ ગુણધર્મ ધરાવતું છે?", "opts": ["લુઈ-એફ (Lippes Loop)", "સ્વીફ્ટ 7", "ક્યુ-380એ (Cu-380A)", "લેવોનોર્ગેસ્ટ્રેલ રજૂ કરતું IUD (Mirena)"], "correct": 3, "explain": "લેવોનોર્ગેસ્ટ્રેલ (Mirena) સક્રિય પ્રકારનું IUD છે જે પ્રોજેસ્ટિન હોર્મોન છોડે છે, જે ગર્ભાશયની અંદરના પર્યાવરણને બદલીને ગર્ભધારણ અટકાવે છે. બાકીના ત્રણો IUD નિષ્ક્રિય પ્રકારના છે અને માત્ર ધાતુ અથવા પ્લાસ્ટિકથી બનેલા હોય છે.", "tag": ""}, {"q": "આઇએફ (Intrauterine Device) ગર્ભનિવારણ માટે સર્વાધિક અસરકારક કયા મશહુર પ્રકારના IUDમાં જોવા મળે છે?", "opts": ["પ્લાસ્ટિક ઇન્ટ્રા્યુટરી વેલ", "કોપર-380એ (Cu-380A)", "ઇસ્ટ્રોજેન રિલીઝિંગ IUD", "ગોલ્ડ સ્પાઇરલ"], "correct": 1, "explain": "કોપર-380એ (Cu-380A) IUD સર્વાધિક અસરકારક IUD માં ગણાય છે. આ IUD સતત તાંબાના આયનો મુક્ત કરે છે, જે સ્પર્મની ચળકામણું (motility) અને ફર્ટિલાઇટી (fertility) ને અટકાવે છે, તેથી ગર્ભધારણ થતી નથી.", "tag": ""}, {"q": "અન્ય સાધનો (other aids) અને કૃત્રિમ પ્રજનન પદ્ધતિઓના સંદર્ભમાં, નીચેનામાંથી કઈ પદ્ધતિમાં શુક્રાણુ અને અંડકોષ ની ફલિત થયા પછીના પ્રારંભિક ગર્ભને ગર્ભાશયમાં રાખવામાં આવે છે?", "opts": ["ZIFT (ઝાયગોટ ઇન્ટ્રા્યુટરીન ટ્રાન્સફર)", "GIFT (ગેમેટ ઇન્ટ્રા્યુટરીન ટ્રાન્સફર)", "ICSI (ઇન્ટ્રાસાઇટોપ્લાઝમિક સ્પર્મ ઇન્જેક્શન)", "IVF (ઇન્વિટ્રો ફર્ટિલાઇઝેશન)"], "correct": 0, "explain": "ZIFT (ઝાયગોટ ઇન્ટ્રા્યુટરીન ટ્રાન્સફર) પદ્ધતિમાં IVF દ્વારા શુક્રાણુ અને અંડકોષનું ફલિત થયા પછી બનતા ઝાયગોટને 8-16 કોષકાળ સુધીનો વિકાસ થયા બાદ ગર્ભાશયમાં સ્થાનાંતરિત કરવામાં આવે છે, જ્યારે GIFT માં ફલિત થયા પહેલાના અંડકોષ અને શુક્રાણુને ફેલોપિયન ટ્યૂબમાં મૂકવામાં આવે છે.", "tag": ""}, {"q": "ગર્ભપાત (Medabortion) નો માત્ર વૈધવિક અને અનિચ્છનીય ગર્ભપાતના સંદર્ભમાં કયો કાયદો આપણા દેશમાં ગર્ભપાતને વૈધવિક બનાવે છે?", "opts": ["મેડિકલ ટર્મિનેશન ઓફ પ્રેગ્નેન્સી એક્ટ (MTP Act), 1971", "પોષ્ટલ ઇન્સ્યોરન્સ એક્ટ, 1968", "ઇ : "IUI (ઇન્ટ્રાયૂટરાઇન ઇન્સેમિનેશન) માં શુક્રાણુઓનું સીધું ગર્ભાશય (யூટરસ) માં પ્રવેશ કરાવવામાં આવે છે; તે શુક્રાણુઓના પર્યાપ્ત ન હોવા અથવા પ્રવાહ સંબંધિત સમસ્યા ધરાવતા દંપતી માટે ઉપયોગી છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો ક્રમ યોગ્ય રીતે IVF-ET (ઇન્ વિટ્રો ફર્ટિલાઇઝેશન - એમબ્રિઓ ટ્રાન્સફર) ના તબક્કા દર્શાવે છે?", "opts": ["અંડકોષ મેળવવો → શુક્રાણુ મેળવવું → ફળીભવન → ભ્રૂણનું ગર્ભાશયમાં સ્થાનાંતર", "શુક્રાણુ મેળવવું → અંડકોષ મેળવવો → ગર્ભાશયમાં સ્થાનાંતર → ફળીભવન", "ફળીભવન → અંડકોષ મેળવવો → શુક્રાણુ મેળવવું → ગર્ભાશયમાં સ્થાનાંતર", "ગર્ભાશયમાં સ્થાનાંતર → અંડકોષ મેળવવો → ફળીભવન → શુક્રાણુ મેળવવું"], "correct": 0, "explain": "IVF-ET માં પ્રથમ અંડકોષ અને શુક્રાણુ બંને મેળવવામાં આવે છે, શરીરની બહાર ફળીભવન કરાવવામાં આવે છે, ત્યારબાદ ૮-૧૬ કોષવાળા ભ્રૂણને ગર્ભાશયમાં સ્થાનાંતરિત કરવામાં આવે છે.", "tag": ""}, {"q": "ઈન્ વિટ્રો ફર્ટિલાઈઝેશન (IVF) દ્વારા ફલન થયા બાદ, ભ્રૂણને ગર્ભાશયમાં સ્થાનાંતરિત કરવા માટે કઈ શરત ધરાવતો ભ્રૂણ યોગ્ય ગણાય છે?", "opts": ["1–2 કોષીય સંજીવક", "4–8 કોષીય ભ્રૂણ", "3/4 (અંદાજે 8–16 કોષ) ધરાવતો ભ્રૂણ", "32 કોષીય ભ્રૂણ (બ્લાસ્ટોસિસ્ટ)"], "correct": 2, "explain": "IVF માં ફલન બહાર થાય છે અને જે ભ્રૂણ 8–16 કોષ ધરાવતો હોય (સામાન્ય રીતે ત્રણ ચતુર્થાંશ વિકાસ પામેલો) તેને ગર્ભાશયમાં મૂકવામાં આવે છે. 1–2 કોષીય સંજીવકનું સ્થાનાંતરણ સામાન્ય રીતે ZIFT માં કરવામાં આવે છે.", "tag": ""}, {"q": "'ટેસ્ટ ટ્યુબ બેબી પ્રોગ્રામ' શબ્દનો પ્રથમ વપરાશ કોણે કર્યો હતો?", "opts": ["પાઉલ (Paul)", "ગેરી (Garry)", "સ્ટીવનસન (Stevenasan)", "રાબર્ટ ઇડવર્ડ્સ (Robert Edwards)"], "correct": 0, "explain": "પાઉલ (Paul) નામના વૈજ્ઞાનિકે પહેલી વાર આ પ્રક્રિયાને 'ટેસ્ટ ટ્યુબ બેબી પ્રોગ્રામ' કહીને ઓળખાવી હતી, જોકે વાસ્તવિક પ્રથમ ટેસ્ટ ટ્યુબ બેબી (લુઈસ બ્રાઉન) રાબર્ટ ઇડવર્ડ્સની ટીમ દ્વારા જન્મ આપવામાં આવી હતી.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પદ્ધતિમાં સંજીવક (zygote) ને સીધું ફેલોપિયન ટ્યૂબ (બાહ્ય અંડાશય નળી) માં સ્થાનાંતરિત કરવામાં આવે છે?", "opts": ["GIFT", "ZIFT", "IVF-ET", "ICSI"], "correct": 1, "explain": "ZYGOTE INTRA FALLOPIAN TRANSFER (ZIFT) માં ફલન થયેલો સંજીવક (zygote) અથવ function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">

<title>Digestion and Absorption — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "પાચન માનવ શરીરમાં કયા અંગોનો સમૂહ છે?", "opts": ["જઠરાંત્રીય નળી અને પાચન પ્રમેહો", "અન્નાશય અને આંતરાંત્ર", "લિવર અને મર્યાદા ગ્રંથિ", "હૃદય અને ફુસૈડા"], "correct": 0, "explain": "પાચન પ્રણાલીમાં મુખ્યત્વે જઠરાંત્રીય નળી (Alimentary canal) અને તેની સાથે સંલગ્ન પાચન પ્રમેહો (Digestive glands) આવેલા છે.", "tag": ""}, {"q": "માનવ શરીરમાં કુલ કેટલા બાહ્ય રોમ્પક ગ્રંથિઓ (Extrinsic salivary glands) હોય છે?", "opts": ["ત્રણ", "ચાર", "બે", "પાંચ"], "correct": 0, "explain": "માનવ શરીરમાં ત્રણ જોડી બાહ્ય રોમ્પક ગ્રંથિઓ હોય છે: મહાસ્ફ્ટિક ગ્રંથિ (Parotid), ઉપનિષ્પ ગ્રંથિ (Submandibular) અને ઉપધમની ગ્રંથિ (Sublingual).", "tag": ""}, {"q": "જઠરાંત્રીય નળીની શરૂઆત ક્યાંથી થાય છે?", "opts": ["મુખગર્ત્ર (Oral cavity) પર", "ગળીની (Oesophagus) પર", "અન્નાશય (Stomach) પર", "મોટું આંતરું પર"], "correct": 0, "explain": "જઠરાંત્રીય નળી મુખગર્ત્ર (Oral cavity) પરથી શરૂ થાય છે અને અંતમાં અનલિપિક (Anal aperture) પર સમાપ્ત થાય છે.", "tag": ""}, {"q": "રોમ્પરસ (Saliva) માં કઈ એન્ઝાઇમ હાજર હોય છે?", "opts": ["રોમ્પક એમિલેઝ (Salivary amylase)", "પ્રોટીઝ", "લિપેઝ", "પેપ્સિન"], "correct": 0, "explain": "રોમ્પરસમાં રોમ્પક એમિલેઝ (પ્હેલિન) નામનો એન્ઝાઇમ હોય છે જે સ્ટાર્ચના પાચનનું કાર્ય કરે છે.", "tag": ""}, {"q": "માનવ શરીરમાં સૌથી મોટી ગ્રંથિ કઈ છે?", "opts": ["અંત્રરસ (Liver)", "પેન્ક્રીઝ (Pancreas)", "ઝાડાગ્રંથિ (Gastric gland)", "રોમ્પક ગ્રંથિ (Salivary gland)"], "correct": 0, "explain": "અંત્રરસ (Liver) શરીરની સૌથી મોટી ગ્રંથિ છે. તે જઠરાંત્રીય નળીની સાથે સંલગ્ન પાચન પ્રમેહોમાં સર્વાધિક કદ ધરાવે છે.", "tag": ""}, {"q": "માનવ શરીરમાં ત્રણ જોડી મુખ્ય રોમ્પ ગ્રંથિઓ મળે છે. આ પૈકી પ્રત્યેક ગ્રંથિનો સ્થાન અને પ્રકાર કયો સાચો જોડાયેલ છે?", "opts": ["પેરાટોઈડ ગ્રંથિ — કાનની નીચે, સેરસ પ્રકાર", "સબમેન્ડિબ્યુલર ગ્રંથિ — નીચલા હાડકાની અંદરની બાજુએ, શુદ્ધ મ્યુકસ પ્રકાર", "સબલિંગ્વલ ગ્રંથિ — જીભની તળિયે, સેરસ-મ્યુકસ મિશ્ર પણ વધુ મ્યુકસ", "ત્રણેય ગ્રંથિઓ સેરસ પ્રકારની હોય છે અને દરેકમાં એમાલ્સિન એન્ઝાઇમ સમાન માત્રામાં હોય છે"], "correct": 0, "explain": "ત્રણ જોડી મુખ્ય રોમ્પ ગ્રંથિઓ પેરાટોઈડ, સબમેન્ડિબ્યુલર અને સબલિંગ્વલ છે. પેરાટોઈડ ગ્રંથિ કાનની નીચે (માસટોઈડ પ્રકોષ અને ચેન્ડની પાછળ) આવેલી છે અને તે પ્રમુખતયા સેરસ પ્રકારની છે, જેથી અંદર રોમ્પરસમાં ઓછું મ્યુકિન અને વધુ એમાલ્સિન હોય છે. બાકીના વિકલ્પોમાં ગ્રંથિના સ્થાન અથવા પ્રકાર વિશે ભૂલ છે.", "tag": ""}, {"q": "રોમ્પરસ (લાળ) માં રહેલો એમાલ્સિન (ਪੈਰોટિડ એમાલ્સિન / ટાય્યાલિન) એન્ઝાઇમ પ્રમુખતયા કયા પદાર્થ પર ક્રિયા કરે છે અને તેનો કયા ઉત્પાદન થાય છે?", "opts": ["ગ્લાયકોજન → ગ્લુકોઝ", "શેલ્યુલોઝ → મેલ્ટોઝ", "સ્ટાર્ચ (અનાજનું મંડ) → મેલ્ટોઝ", "પ્રોટીન → એમિનો એસિડ"], "correct": 2, "explain": "એમાલ્સિન એક કાર્બોહાઈડ્રેટ એન્ઝાઇમ છે જે સ્ટાર્ચના α-1,4-ગ્લાયકોસિડિક બંધને પાચન કરીને મેલ્ટોઝ (દ્વિશર્કરા) બનાવે છે. આ પ્રક્રિયા મૌખિક ગુહામાં જ થાય છે. લાળનું pH લગભગ 6.8 હોવાથી એમાલ્સિન સક્રિય રહે છે.", "tag": ""}, {"q": "અન્નનળી (Oesophagus) અને જઠર વચ્ચેનો સંયોજકાંગ છે — ફ્યુરોગેસ્ટ્રિક સ્ફિંક્ટર (કાર્ડિયા). આ સ્થળ પર 'રિફ્લેક્સ વોમેટિંગ'નું સંકેત શું આપે છે અને તેના દ્વારા રક્ષણ કેવી રીતે મળે છે?", "opts": ["જ્યારે અન્નનળીના સ્નાયુઓનું સંકોચન વધે, ત્યારે જઠર ખાલી થાય છે અને પાચનતંત્ર સક્રિય થાય છે.", "જઠરમાં અનાવશ્યક ઉત્તેજના અથવા ઝેરી પદાર્થ આવતાં ગેસ્ટ્રિક દીવાલ સંકોચિત થાય છે અને પેટની સ્નાયુઓના પ્રચંડ સંકોચનથી અન્નનો ઉલટો પ્રવાહ (વમન) થાય છે.", "ફ્યુરોગેસ્ટ્રિક સ્ફિંક્ટર સક્રિય થઈને જઠરમાં વધુ એસિડ છોડે છે જે ઝેરી પદાર્થને નાશ પામે છે.", "અન્નનળીનો સ્ફિંક્ટર બંધ થતાં હજુ પણ જઠરમાં અન્ન જમા થઈ જાય છે, જેથી શ્વાસનળી રક્ષિત રહે છે."], "correct": 1, "explain": "વમન (Vomiting) એ એક સ્વયંભૂ સંરક્ષણાત્મક પ્રતિક્રિયા છે જેમાં મગજના વમન કેન્દ્રને ઉત્તેજના મળે છે ત્યારે જઠર અને આંતરડાના ઉપરના ભાગની ગતિ ઉલટી થાય છે અને ફ્યુરોગેસ્ટ્રિક સ્ફિંક્ટર ઢીલો પડી જાય છે. આનાથી અન્નનળીમાંથી અન્ન બહાર ધકેલાય છે અને શ્વાસનળીને ઝેરી અથવા અનિચ્છનીય પદાર્થોથી બચાવવા મળે છે.", "tag": ""}, {"q": "ભક્ષણ (Deglutition) પ્રક્રિયા દરમિયાન 'એપિગ્લોટિસ' અને 'વોલુમેટિક સ્નેગ' (Bolus) વચ્ચે કયો કાર્યાત્મક સંબંધ મહત્વપૂર્ણ છે?", "opts": ["એપિગ્લોટિસ સ્વાનનળીના દ્વાર પર આવરી લે છે અને ભક્ષણના પ્રસ્થાનિક તબક્કામાં અન્નનળીમાં પ્રવેશતું અન્ન બાહ્ય શ્વાસમાર્ગમાં જવું અટકે છે.", "એપિગ્લોટિસ જઠરના ઉપરી ભાગને ઢાંકીને ઝેરી બાષ્પને અંદર જતાં અટકાવે છે.", "એપિગ્લોટિસ માત્ર અન્નનળીમાં જ રહે છે અને શ્વાસનળી સાથે તેનો કોઈ સંબંધ નથી.", "ભક્ષણ પછી એપિગ્લોટિસ હંમેશાં ખુલ્લું રહે છે જેથી વાયુનું આગમન ચાલુ રહે."], "correct": 0, "explain": "એપિગ્લોટિસ એ શ્વાસનળી (લેરિન્ક્સ) ઉપરનો લીફ-આકારનો પત્થર છે. ભક્ષણ દરમિયાન જ્યારે અન્નનો ગુંથડો (Bolus) ગળામાંથી નીચે ઉતરે છે, ત્યારે એપિગ્લોટિસ પાછળની બાજુએ折叠 થઈને શ્વાસનળીના મુખને ઢાંકી દે છે. આનો ઉદ્દેશ્ય અન્ન શ્વાસનળીમાં પ્રવેશતું અટકાવવાનો છે. જો આ પ્રક્રિયા ભૂલ જાય, તો 'ચૂંટાણ' (Aspiration) થાય છે.", "tag": ""}, {"q": "લાળ (રોમ્પરસ) ના કામકાજમાં નીચે પૈકી કઈ ઘટના સાચી નથી?", "opts": ["રોમ્પરસના મ્યુકિન ભાગ શોષણને સરળ બનાવવામાં મહત્વનું છે અને તેના આધારે અન્નનળીમાં અન્નનું સ્નિગ્ધ ગલન (Lubrication) થાય છે.", "લાળના લિઝોઝાઇમ એન્ઝાઇમ સ્વાસ્થ્યને માટે અતિશય એન્ટિમાઇક્રોબિયલ ક્રિયાથી શ્વાસના નળાકાર ટકાઉપણામાં સીધો હિસ્સો નથી.", "લિંગ્વલ લિપેઝ (Zymophilic lipase) લિપિડનું પાચન શરૂ કરવામાં મદદરૂપ થાય છે, ખાસ કરીને નવજાત શિશુઓમાં.", "વોલિયુમ અને pH (6.8ની આસપાસ) બંને એમાલ્સિનની સક્રિયતા માટે અત્યંત મહત્વપૂર્ણ છે."], "correct": 1, "explain": "લાળમાં રહેલું લિઝોઝાઇમ એન્ટિબેક્ટેરિયલ ગુણ ધરાવતું એન્ઝાઇમ છે, જે બેક્ટેરિયાની ઝીpeptide diवारને તોડીને કીટાણુનાશક કાર્ય કરે છે. આથી, વિકલ્પ B માં 'કોઈ સીધો હિસ્સો નથી' કહેવું ભૂલભરેલું છે. મ્યુકિનનું સ્નિગ્ધ ગુણધર્મ, લિંગ્વલ લિપેઝનું કાર્ય અને એમાલ્સિન માટે pH મહત્વપૂર્ણ છે, તેથી A, C અને D સાચા છે.", "tag": ""}, {"q": "માનવ પાચનતંત્રમાં, ભોજનનું ભક્ષણ (Deglutition) નીચેના કયા તબક્કાની શરૂઆતમાં 'સ્વૈચ્છિક' (Voluntary) ગણાય છે?", "opts": ["અન્નનળી (Oesophagus) માં ભોજનની ગતિ", "મુખગુહા (Oral cavity) માં ભોજનનું નિયંત્રણ અને પ્રેરણ", "જઠર (Stomach) માં ભોજનનું મિક્ષરણ", "મૂળાંત્ર (Colon) માં પાણીનું શોષણ"], "correct": 1, "explain": "ભક્ષણ પ્રક્રિયાની પ્રથમ અથવા મુખગુહાવાળો તબક્કો સંપૂર્ણપણે સ્વૈચ્છિક (Voluntary) હોય છે, જ્યાં જીભ દ્વારા ભોજનનું નિયંત્રણ અને પ્રેરણ કરવામાં આવે છે. તેના બાદનો અન્નનળીવાળો તબક્કો અસ્વૈચ્છિક (Involuntary/reflex) હોય છે.", "tag": ""}, {"q": "માનવ પાચનતંત્રમાં, સ્વાદુપિંડ (Pancreas) દ્વારા સ્ત્રાવ થતી એન્ટરોકિનેઝ (Enterokinase) નીચેના કયા એન્ઝાઇમના સક્રિયકરણ (Activation) માટે જવાબદાર છે?", "opts": ["ટ્રિપ્સિનોજન (Trypsinogen) → ટ્રિપ્સિન (Trypsin)", "પ્રોટીન → પેપ્ટોન (Protein → Peptone)", "ફેટ → ચર્બી અમ્લ (Fat → Fatty acid)", "સ્ટાર્ચ → ડെક્સ્ટ્રિન (Starch → Dextrin)"], "correct": 0, "explain": "સ્વાદુપિંડ (Pancreas) દ્વારા સ્ત્રાવ થતી એન્ટરોકિનેઝ (Enterokinase) એક પ્રોટિઓલિટિક એન્ઝાઇમ છે. તે ટ્રિપ્સિનોજનને સક્રિય કરી ટ્રિપ્સિન બનાવે છે. ટ્રિપ્સિન પછી અન્ય સ્વાદુપિંડી એન્ઝાઇમો (જેમ કે ચિમોટ્રિપ્સિનોજન) નું પણ સક્રિયકરણ કરે છે.", "tag": ""}, {"q": "હિટ (HIT) કોષો (Gastric mucosa) દ્વારા સ્ત્રાવ થતું 'હાઈડ્રોકલોરિક અમ્લ' (HCl) નીચેના કયા ઉપયોગો માટે જવાબદાર છે?", "opts": ["કેવોલેટ (Pepsinogen) ને કેવોલ (Pepsin) માં અને સાઇટ્રેટ (Lactase) ને લેક્ટેઝ માં રૂપાંતરિત કરવા", "સ્વાદુપિંડી એન્ઝાઇમો ( pancreatic enzymes ) ને સક્રિય કરવા", "જઠરમાં ભોજનનું મિક્ષરણ અને સંપૂર્ણ પ્રોટીનનું પાચન", "બળિશ્ઠ (Killer) બેક્ટેરિયાને મૃત્યુ પામવા માટે જરૂરી pH પ્રદાન કરવા"], "correct": 0, "explain": "હિટ કોષો દ્વારા સ્ત્રાવ થતું HCl પ્રોટીન પાચન માટેનું પરિસ્થિતિ પૂરું પાડે છે. તે વિશેષ રીતે કેવોલેટ (Pepsinogen) ને સક્રિય કરી કેવોલ (Pepsin) માં રૂપાંતરિત કરવામાં મહત્વનું કામ કરે છે. કોઈ પણ એન્ઝાઇમો સક્રિય થાય ત્યાં સુધી Pepsin અસર કરી શકતું નથી.", "tag": ""}, {"q": "જઠર (Stomach) ના મ્યુકોસલ સ્તરમાં મ્યુકસ (Mucus) અને બાઇકાર્બોનેટ (HCO₃⁻) ના સંયુક્ત સ્તરનો મુખ્ય ફાયદો કયો છે?", "opts": ["તે પેપ્ટોન અને પેપ્ટોનના પાચનમાં મદદ કરે છે", "તે ઝેડ (Zymogen) કોષોને સક્રિય કરે છે", "તે જઠરના આંતરિક કોષોને સ્વયં-પાચન (Autodigestion) માંથી બચાવે છે", "તે બેક્ટેરિયાને નષ્ટ કરી જઠરને સંપૂર્ણ રીતે સ્ટેરાઇલ (Sterile) બનાવે છે"], "correct": 2, "explain": "જઠરનું મ્યુકસ (Mucus) અને બાઇકાર્બોનેટ (HCO₃⁻) નું સ્તર એક સંરક્ષણાત્મક આવરણ તરીકે કામ કરે છે. તે HCl અને પેપ્સિન જેવા ઘાતક દ્રવ્યોથી જઠરના આંતરિક સ્તર (Mucosa) નું સ્વયં-પાચન (Autodigestion) અટકાવે છે.", "tag": ""}, {"q": "ડુઓડેનમ (Duodenum) માં પ્રવેશતા અંતડીના M-cells (પેઇયર's patches) અને EC (Enterochromaffin) કોષો મળીને કઈ ગોપનીય (Regulatory) પ્રક્રિયા ચલાવે છે?", "opts": ["મોટા પ્રમાણમાં જઠરરસનું સ્ત્રાવ", "ગેસ્ટ્રિક એસિડનું વધારાનું ઉત્પાદન", "ગેસ્ટ્રીન (Gastrin) અને સિક્રેટિન (Secretin) જેવા હોર્મોન્સનું ઉત્પાદન/સ્ત્રાવ", "સ્વાદુપિંડથી ઇન્સ્યુલિનનો સીધો સ્ત્રાવ"], "correct": 2, "explain": "ડુઓડેનમના એપિથેલિયલ કોષો અને EC કોષો (મ્યુકોસા) ગેસ્ટ્રિક આસિડ અને ફેટની હાજરી જોઈને ગેસ્ટ્રીન, સિક્રેટિન અને CCK જેવા પાચન હોર્મોન્સ ઉત્પન્ન કરે છે. આ હોર્મોન્સ અન્ય પાચક ગ્રંથિઓને સંચાલિત કરે છે અને અંતડીમાં પાચન પ્રક્રિયાઓનું સંતુલન જાળવે છે.", "tag": ""}, {"q": "પાનક્રિયા (Pancreas) દ્વારા સ્ત્રાવ થતી પાચકરસમાં નીચેનામાંથી કયો એન્ઝાઇમ હોતો નથી?", "opts": ["પેપ્સિન (Pepsin)", "ટ્રિપ્સિન (Trypsin)", "લાઇપેઝ (Lipase)", "એમિલેઝ (Amylase)"], "correct": 0, "explain": "પેપ્સિન એ જઠર (Stomach) ના ગ્લેન્ડ્સ દ્વારા સ્ત્રાવ થતું એન્ઝાઇમ છે, પાનક્રિયા દ્વારા નહીં. પાનક્રિયા રસમાં ટ્રિપ્સિન, લાઇપેઝ અને એમિલેઝ આદિ પાચક એન્ઝાઇમો હોય છે.", "tag": ""}, {"q": "પિત્તાશય (Gall bladder) નું મુખ્ય કાર્ય કયું છે?", "opts": ["પિત્તરસ (Bile) ના ઉત્પાદનનો", "પિત્તરસ (Bile) ના સંગ્રહ અને સાંદ્રીકરણનો", "પાચક એન્ઝાઇમ્સના સંશ્લેષણનો", "આહારરસ (Chyme) ના સંગ્રહનો"], "correct": 1, "explain": "પિત્તરસ肝 (Liver) માં બને છે, પણ પિત્તાશય તેનો સંગ્રહ કરે છે અને સંશ્લેષિત કરે છે. પિત્તરસમાં પાચક એન્ઝાઇમ હોતા નથી, ફક્ત પિત્તલવણો (Bile salts) હોય છે જે ચરબીના વિભાજન (Emulsification) માટે જવાબદાર છે.", "tag": ""}, {"q": "પાનક્રિયાના રસમાં કઈ પ્રકારની પાચકસામગ્રી વિદ્યમાન છે?", "opts": ["ફક્ત પ્રોટીન પાચક એન્ઝાઇમ", "ફક્ત કાર્બોહાઇડ્રેટ પાચક એન્ઝાઇમ", "કાર્બોહાઇડ્રેટ, પ્રોટીન અને ચરબી — ત્રણેય પ્રકારના પાચક એન્ઝાઇમો", "ફક્ત પિત્તલવણો અને બાઇકાર્બોનેટ"], "correct": 2, "explain": "પાનક્રિયા એક દ્વિમુખી ગ્રંથિ છે જે ત્રણેય પ્રકારના પાચક એન્ઝાઇમોનું ઉત્પાદન કરે છે: એમિલેઝ (કાર્બોહાઇડ્રેટ), ટ્રિપ્સિન/કાઇમોટ્રિપ્સિન (પ્રોટીન), અને પાનક્રિયાટિક લાઇપેઝ (ચરબી). આ સાથે તે બાઇકાર્બોનેટ પણ સ્ત્રાવ કરે છે જે ડુઓડેનમના વાતાવરણને ક્ષારક (Alkaline) બનાવે છે.", "tag": ""}, {"q": "પિત્તલવણો let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>

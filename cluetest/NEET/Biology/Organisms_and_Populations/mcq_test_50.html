<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organisms and Populations — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "પર્યાવરણમાં હાજર રહેલા ભૌતિક અને રાસાયણિક તત્વોને શું કહીએ છે?", "opts": ["પર્યાવરણીય અંશો (Environmental Factors)", "જૈવિક પરસ્પર ક્રિયાઓ", "પર્યાવરણીય સાહચર્ય", "પુનર્જનન પરિબળો"], "correct": 0, "explain": "પર્યાવરણીય અંશો એ પર્યાવરણમાં હાજર રહેલા જૈવિક અને અજૈવિક તત્વો છે, જેમાં પ્રકાશ, તાપમાન, જળવાયુ, માટી અને પાણી જેવા અંશોનો સમાવેશ થાય છે.", "tag": ""}, {"q": "પ્રકાશની તીવ્રતા કયા પ્રકારના સંગઠનમાં સૂર્યપ્રકાશની મર્યાદિત ઉપલબ્ધતા ધરાવતું સજીવ બને છે?", "opts": ["છাયા-ચૌકસ (Umbrophytic) સજીવો", "આલોક-ચૌકસ (Heliotropic) સજીવો", "આતંરિક સ્થિતિસ્થાપકતા ધરાવતા સજીવો", "ઘ્રાણાનુવર્તી સજીવો"], "correct": 0, "explain": "છાયા-ચૌકસ (Umbrophytic) સજીવો તે હોય છે જે પ્રકાશની મર્યાદિત ઉપલબ્ધતાવાળી પરિસ્થિતિમાં યોગ્ય રીતે વિકસે છે, જેમ કે ઘંટાકાર વૃક્ષો હેઠળના છાયાવાળા વિસ્તારોમાં વધતા છોડ.", "tag": ""}, {"q": "કોઈ પણ સજીવ પોતાના શરીરના તાપમાન અને પાણીના સંતુલનને સ્થિર રાખવા માટે શું કરે છે?", "opts": ["થર્મોર્જુલેશન અને ઓસમોર્જુલેશન", "પ્રકાશસંશ્લેષણ અને શ્વસન", "ગુચ્છબેધ (Metamorphosis) અને દલીલીયન (Digestion)", "આલોકગુચ્છ અને ગુરુત્વાકર્ષણ"], "correct": 0, "explain": "થર્મોર્જુલેશન (thermoregulation) એ શરીરનું તાપમાન સ્થિર રાખવાનું પ્રક્રિયા છે, જ્યારે ઓસમોર્જુલેશન (osmoregulation) એ શરીરના જળવાયુ સંતુલનને સ્થિર રાખે છે. આ બંને પ્રક્રિયાઓ દ્વારા સજીવો પર્યાવરણીય અંશો પ્રત્યેનું પ્રતિભાવ આપે છે.", "tag": ""}, {"q": "તીવ્ર ગરમી અને ભૂખમરાની સ્થિતિમાં કેટલાક જંતુઓ કયો ચોક્કસ સમયગાળો 'ઉજ્જીવન' (Dormancy) માં વિતાવે છે?", "opts": ["ઉષ્ણશયતન (Aestivation)", "હિમશયતન (Hibernation)", "પ્રવાસન (Migration)", "સિઝનલ ઇન્સેન્દ્રિયા"], "correct": 0, "explain": "ઉષ્ણશયતન (Aestivation) એ ઉષ્ણદોષામાં તીવ્ર ગરમી અને ડાહકત્વ સામે રક્ષણ માટે જનતા ચોક્કસ સમયગાળો ઊંદર્યન (dormancy) માં વિતાવે છે, જેમ કે કેટલાક સ્તનધારી જંતુઓ અને ખડખાપણ.", "tag": ""}, {"q": "બિમોહનીય સજીવો (Poikilothermic organisms) નું શરીરનું તાપમાન કેવી રીતે બદલાય છે?", "opts": ["આસપાસના પર્યાવરણના તાપમાન સાથે બદલાય છે", "શરીરની આંતરિક પ્રક્રિયાઓ દ્વારા સ્થિર રહે છે", "સતત સ્થિર રહે છે, પર્યાવરણથી સ્વતંત્ર", "માત્ર પાણીના તાપમાન પર આધાર રાખે છે"], "correct": 0, "explain": "બિમોહનીય સજીવો (Poikilothermic organisms), જેમ કે માછલીઓ, ઉભયજીવીઓ અને સર્પો, પોતાનું શરીરનું તાપમાન પર્યાવરણના તાપમાન સાથે બદલે છે, કારણ કે તેઓ આંતરિક તાપમાન નિયંત્રણ પ્રક્રિયા ધરાવતા નથી.", "tag": ""}, {"q": "કોઈ પણ વસ્તીમાં કોષ્ટક સમયમાં થતી જન્મ દર અને મૃત્યુ દરની ગણતરી કેવી રીતે કરવામાં આવે છે?", "opts": ["જન્મ દર = (જન્મેલા સજીવોની સંખ્યા / કુલ વસ્તી × ૧૦૦), મૃત્યુ દર = (મૃત્યુ પામેલા સજીવોની સંખ્યા / કુલ વસ્તી × ૧૦૦)", "જન્મ દર = (કુલ વસ્તી / જન્મેલા સજીવો × ૧૦૦), મૃત્યુ દર = (કુલ વસ્તી / મૃત્યુ પામેલા સજીવો × ૧૦૦)", "જન્મ દર = (જન્મેલા સજીવોની સંખ્યા + મૃત્યુ પામેલા સજીવો) / કુલ વસ્તી, મૃત્યુ દર = (કુલ વસ્તી - જન્મેલા સજીવો) / કુલ વસ્તી", "જન્મ દર = (જન્મેલા સજીવોની સંખ્યા / જન્મ સમયગાળો), મૃત્યુ દર = (મૃત્યુ પામેલા સજીવોની સંખ્યા / મૃત્યુ સમયગાળો)"], "correct": 0, "explain": "વસ્તીના જન્મ દર અને મૃત્યુ દરની ગણતરી સૂત્ર મુજબ થાય છે. જન્મ દર એ એકમ સમય દરમિયાન ઉત્પન્ન થતા નવા સજીવોનો અંશ છે અને મૃત્યુ દર એ એકમ સમય દરમિયાન મૃત્યુ પામતા સજીવોનો અંશ છે.", "tag": ""}, {"q": "જન્મ દર અને મૃત્યુ દરની ગણતરી પહેલાં માધ્યમ તરીકે કયું મૂલ્ય સામાન્ય રીતે ધ્યાનમાં લેવામાં આવે છે?", "opts": ["વસ્તીની પ્રતિ હેક્ટર અથવા પ્રતિ ચો.કિમી (સાંદ્રતા)", "વસ્તીનો કુલ ભૌગોલિક વિસ્તાર", "વસ્તીનો સરેરાશ શરીરનું વજન", "વસ્તીમાં રહેલા સજીવોની સરેરાશ ઉંમર"], "correct": 0, "explain": "જન્મ દર અને મૃત્યુ દરની ગણતરી પહેલાં વસ્તીની સાંદ્રતા (density)ને માધ્યમ તરીકે ધ્યાનમાં લેવામાં આવે છે. આથી દરને પ્રતિયૂનિટ વસ્તી સાંદ્રતા અનુરૂપ દર્શાવી શકાય.", "tag": ""}, {"q": "વસ્તીની સાંદ્રતા (Population Density) માપવા માટે નીચેમાંથી કયું પદ્ધતિ સાચું નથી?", "opts": ["વૃક્ષો અને બગીચાઓના વનસ્પતિઓ માટે ચોરસ વિસ્તાર (Quadrat) પદ્ધતિ", "સૂક્ષ્મજીવો માટે વજન-આધારિત (બાયોમાસ) પદ્ધતિ", "બિલાડીઓ અને બહુવિધ પ્રાણીઓ માટે સીધી ગણતરી (Direct count)", "પક્ષીઓ માટે ફરીથી પકડ પદ્ધતિ (Mark-recapture technique)"], "correct": 2, "explain": "સીધી ગણતરી (Direct count) પદ્ધતિ મોટા અને સક્રિય પ્રાણીઓ જેવા કે બિલાડીઓ માટે યોગ્ય નથી. તેમને સીધી ગણતરી કરવી પ્ત કરે છ છે.", "tag": ""}, {"q": "વસ્તી વૃદ્ધિમાં 'જન્મ દર' (Natality) અને 'મૃત્યુ દર' (Mortality) વચ્ચેનો તફાવત શું દર્શાવે છ છે?", "opts": ["વસ્તી વૃદ્ધિ દર (Population growth rate)", "વસ્તી ઘનતા (Population density)", "વાહન ક્ષમતા (Carrying capacity)", "જનીન પ્રવાહ (Gene flow)"], "correct": 0, "explain": "જન્મ દર અને મૃત્યુ દર વચ્ચેનો તફાવત વસ્તી વૃદ્ધિ દર દર્શાવે છ છે. જો જન્મ દર > મૃત્યુ દર હોય, તો વસ્તી વધે છે; જો મૃત્યુ દર > જન્મ દર હોય, તો વસ્તી ઘટે છે.", "tag": ""}, {"q": "ગોઝેનું સ્પર્ધાત્મક બहिष्कार સિદ્ધાંત (Competitive exclusion principle) મુજબ, નીચેમાંથી કયું સાચું છે?", "opts": ["બે પ્રજાતિઓ એક જ પર્યાવરણમાં સમાન સંસાધનો માટે સ્પર્ધા કરી શકે છે પરંતુ હંમેશા સાથે રહેશે.", "સમાન પરાવલંબન ધરાવતી બે પ્રજાતિઓમાંથી એક પ્રજાતિ બીજીને દૂર કરી દેશે અથવા વસ્તી ઘટાડી દેશે.", "સ્પર્ધા હંમેશા મૃત્યુદારક હોય છે.", "સ્પર્ધાત્મક બहिष्कार ત્યારે થાય છે જ્યારે સંસાધનો અનંત હોય."], "correct": 1, "explain": "ગોઝના સ્પર્ધાત્મક બहिष्कार સિદ્ધાંત મુજબ, સમાન પર્યાવરણીય પરાવલંબન ધરાવતી બે પ્રજાતિઓમાંથી એક પ્રજાતિ સ્પર્ધા દ્વારા બીજી પ્રજાતિને દૂર કરી દે છે અથવા તેની વસ્તી ઘટાડે છે.", "tag": ""}, {"q": "શિકારી (Predator) અને શિકાર (Prey) વચ્ચેના ક્રિયાપ્રતિક્રિયા માટેની રચનાત્મક અનુકૂલનો (Adaptations) નીચેમાંથી કયો જોડાયેલો છે?", "opts": ["શિકારીઓમાં ઉંધાડાના રંગ અને શિકારમાં ચુસ્ત દૃષ્ટિ.", "શિકારીઓમાં ચુસ્ત દૃષ્ટિ અને શિકારમાં ઉંધાડાના રંગ.", "બંનેમાં સમાન રંગ.", "શિકારીઓમાં મંદ દૃષ્ટિ અને શિકારમાં સ્પષ્ટ દૃષ્ટિ."], "correct": 1, "explain": "શિકારી પ્રાણીઓ (ઉદા. કેતકી) સ્પષ્ટ દૃષ્ટિ ધરાવે છે જેથી શિકાર શોધી શકે, જ્યારે શિકાર પ્રાણીઓ (ઉદા. હરણ) ઉંધાડાના રંગ ધરાવે છે જેથી શિકારીથી છુપાઈ શકે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ સહજીવન (Mutualism) નું ઉદાહરણ છે?", "opts": ["લાયકેન (Lichen) – ફાઇન્ગસ અને શૈવાલ વચ્ચે.", "કફલૂ (Cuscuta) અને ઝાડ – પરોપજીવી સંબંધ.", "હોર્નબિલ (Hornbill) અને ઝાડ – ભોજન માટે સંબંધ.", "એક વનસ્પતિ અને બીજી વનસ્પતિ વચ્ચે સ્પર્ધા."], "correct": 0, "explain": "લાયકેન ફાઇન્ગસ અને શૈવાલ/સાયનોબેક્ટેરિયા વચ્ચેનું સહજીવન સંબંધ છે, જ્યાં ફાઇન્ગસ સ્થિરતા અને ખનિજ પૂરું પાડે છે, જ્યારે શૈવાલ પ્રકાશસંશ્લેષણ દ્વારા ખાદ્ય પદાર્થ બનાવે છે.", "tag": ""}, {"q": "પરોપજીવી (Parasitism) સંબંધમાં, નીચેમાંથી કયો વિધાન સાચું છે?", "opts": ["પરોપજીવીને શારીરિક નુકસાન થાય છે પરંતુ આઘાતકને ફાયદો.", "પરોપજીવીને ફાયદો થાય છે પરંતુ આઘાતકને નુકસાન.", "બંનેને ફાયદો થાય છે.", "બંનેને નુકસાન થાય છે."], "correct": 1, "explain": "પરોપજીવી સંબંધમાં, પરોપજીવી (Parasite) આઘાતક (Host) પરથી પોષક તત્વો મેળવે છે અને ફાયદો મેળવે છે, જ્યારે આઘાતકને નુકસાન થાય છે.", "tag": ""}, {"q": "કમન્સલિઝમ (Commensalism) સંબંધમાં, નીચેમાંથી કયો સાચો છે?", "opts": ["એક પ્રજાતિને ફાયદો થાય છે, બીજીને નુકસાન.", "એક પ્રજાતિને ફાયદો થાય છે, બીજીને કોઈ પણ ફાયદો/નુકસાન નહીં.", "બંને પ્રજાતિઓએ ફાયદો થાય છે.", "બંને પ્રજાતિઓએ નુકસાન થાય છે."], "correct": 1, "explain": "કમન્સલિઝમ એટલે એક પ્રજાતિને ફાયદો થાય છે જ્યારે બીજી પ્રજાતિને કોઈ ફાયદો કે નુકસાન થતું નથી (ઉદા. એપિફાઇટ પોદાઓ અને ઝાડ વચ્ચેનો સંબંધ).", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન 'ઉત્પાદક' (Producers) અને 'અપઘટકો' (Decomposers) વચ્ચેના પરસ્પર સંબંધનું સૌથી ચોકસાઈપૂર્વક વર્ણન કરે છે?", "opts": ["ઉત્પાદકો સૂર્યપ્રકાશમાંથી સંયતિકરણ દ્વારા જૈવિક ઊર્જા બનાવે છે, જ્યારે અપઘટકો મૃત જૈવિક પદાર્થોને અવયવીત કરી ખનિજ પુનઃસ્થાપન કરે છે — બંને એકોસિસ્ટમના પોષણ ચક્ર માટે આવશ્યક પણ ભિન્ન કાર્યવાહી ધરાવે છે.", "ઉત્પાદકો અને અપઘટકો બંને સ્વયંપોષી જીવ છે; ઉત્પાદકો પ્રકાશસંશ્લેષણ કરે છે જ્યારે અપઘટકો રાસાયણિક સંશ્લેષણ દ્વારા ખનિજોનું વિનિર્માણ કરે છે.", "અપઘટકો ઉત્પાદકોની તુલનામાં પોષણ સ્તરની દૃષ્ટિએ ઉચ્ચ સ્તરે હોય છે અને મૃત સામગ્રીનું અવયવીકરણ કરી પ્રાથમિક ઉત્પાદનમાં પ્રત્યક્ષ યોગદાન આપે છે.", "ઉત્પાદકો એકમાત્ર એવા જીવો છે જે પ્રાથમિક ઉત્પાદન કરે છે; અપઘટકો માત્ર ખાદ્ય શૃંખલાના અંતે મૃત દેહનો નાશ કરે છે, પણ પોષણ પુનઃસ્થાપનમાં ભૂમિકા નથી ભજવતા."], "correct": 0, "explain": "ઉત્પાદકો પ્રકાશસંશ્લેષણ દ્વારા સૂર્યઊર્જાને રાસાયણિક ઊર્જામાં ફેરવે છે; અપઘટકો (બેક્ટેરિયા, ફંગસ) મૃત જૈવિક પદાર્થોને અવયવીત કરી ખનિજોને પુનઃ સરળ સ્વરૂપમાં મૃતિસરા પરત મૂકે છે. બંનેનું કાર્ય ભિન્ન પરંતુ એકોસિસ્ટમના પોષણ ચક્ર માટે જરૂરી છે.", "tag": ""}, {"q": "કોઈપણ એકોસિસ્ટમમાં ઉષ્મીય (Detritus) ખાદ્ય શૃંખલાને પ્રાણવાયુશીલ (Grazing) ખાદ્ય શૃંખલાથી અલગ પાડતો મૂળભૂત કારક કયો છે?", "opts": ["ઉષ્મીય ખાદ્ય શૃંખલામાં પ્રારંભિક બિંદુ જીવંત શાકાહારી પ્રાણીઓ ન હોય, પરંતુ મૃત જૈવિક પદાર્થો (પતિત પર્ણો, મૃત પ્રાણીદેહ) અને તેમના અવયવીકરણકારી અપઘટકો હોય છે.", "ઉષ્મીય ખાદ્ય શૃંખલામાં ઊર્જાનું પરિવહન માત્ર બેક્ટેરિયા દ્વારા થાય છે, જ્યારે પ્રાણવાયુશીલ ખાદ્ય શૃંખલામાં ફક્ત યુકેરિયોટિક અપઘટકો જ ભાગ લે છે.", "પ્રાણવાયુશીલ ખાદ્ય શૃંખલામાં ઊર્જાનો પ્રવાહ વાદળી સમૂહથી શરૂ થાય છે, જ્યારે ઉષ્મીય ખાદ્ય શૃંખલામાં ઊર્જાનો પ્રવાહ પરોપજીવી જીવોમાંથી શરૂ થાય છે.", "ઉષ્મીય ખાદ્ય શૃંખલામાં સમસ્ત ઊર્જા એક જ પોષણ સ્તરમાં સંગ્રહિત થાય છે, જ્યારે પ્રાણવાયુશીલ ખાદ્ય શૃંખલામાં ઊર્જા એક થી બીજા પોષણ સ્તર સુધી સંપૂર્ણ સ્થાનાંતરિત થાય છે."], "correct": 0, "explain": "ઉષ્મીય (Detritus) ખાદ્ય શૃંખલાનું પ્રથમ સ્તર જીવંત શાકાહારીઓ નહીં, પણ મૃત સંઘટકો (મૃત લીધાં પત્તાં, પશુદેહ) અને તેમને અવયવીત કરનારા અપઘટકો (બેક્ટેરિયા, ફંગસ, કીટાણુ) છે. પ્રાણવાયુશીલ શૃંખલા તો સજીવ ઉત્પાદકોમાંથી શરૂ થાય છે.", "tag": ""}, {"q": "લીલાં પ્રકાશસંશ્લેષી સમૂહ દ્વારા નિયત કરવામાં આવતી કુલ જૈવિક ઊર્જા ( Gross Primary Productivity — GPP ) અને સ્વચ્છ પ્રાથમિક ઉત્પાદકતા (Net Primary Productivity — NPP ) વચ્ચેનો સાચો સંબંધ કયો છે?", "opts": ["NPP = GPP − શ્વસન દ્વારા વપરાતી ઊર્જા (R); એટલે કે, ઉત્પાદકો પોતાના ચયાપચય માટે વપરાયેલી ઊર્જા બાદ નો ઊર્જા અતિરિક્ત જ NPP સ્વરૂપે ઉપલબ્ધ થાય છે.", "GPP = NPP − R; કારણ કે શ્વસન દ્વારા વપરાતી ઊર્જા સંયતિકરણ દ્વારા ઉત્પન્ન થતી કુલ ઊર્જામાં ઉમેરાય છે.", "NPP = GPP + R; કારણ કે ઉત્પાદકોની શ્વસન ઊર્જા પ્રકાશસંશ્લેષણના ઉત્પાદનમાં સીધો સમાવેશ ધરાવે છે.", "GPP અને NPP બંને સમાન હોય છે, કારણ કે ઉત્પાદકો પોતાની શ્વસન ઊર્જાનો સમાવેશ કર્યા પહેલાં જ બાહ્ય વિભક્ષકો માટે ઊર્જા ઉપલબ્ધ કરાવે છે."], "correct": 0, "explain": "NPP એ GPP માંથી ઉત્પાદકોના પોતાના શ્વસન (Respiration — R) દ્વારા વપરાયેલી ઊર્જા બાદનો શુદ્ધ ભાગ છે. આ NPP જ આગળના પોષણ સ્તરો (વિભક્ષકો) માટે ઉપલબ્ધ ઊર્જાનું પ્રમાણ નક્કી કરે છે.", "tag": ""}, {"q": "પાણીના એકોસિસ્ટમમાં 'ઊર્જા પિરમિડ' (Energy Pyramid) let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

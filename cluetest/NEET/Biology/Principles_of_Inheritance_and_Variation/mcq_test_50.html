<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principles of Inheritance and Variation — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "મેન્ડલ દ્વારા વાપરવામાં આવેલા 'સત્યબીજ' (True-breeding) શબ્દનો અર્થ શું છે?", "opts": ["સ્વાભાવિક રીતે પરોક્ષીકરણ દ્વારા હંમેશા એક જ પ્રકારના સંતતિ ઉત્પન્ન કરતા પ્રજાતિ", "જે પ્રજાતિ વિવિધ લક્ષણો ધરાવતી હોય", "જે પ્રજાતિમાં અલૈંગિક પ્રજનન થતું હોય", "જે પ્રજાતિ કૃત્રિમ પરાગસ્પર્શ દ્વારા બદલી શકાતી નથી"], "correct": 0, "explain": "સત્યબીજ (True-breeding) પ્રજાતિ તે હોય છે જે સતત પેઢીઓ સુધી સ્વ-પરાગસ્પર્શ દ્વારા એક જ પ્રકારનું લક્ષણ ધરાવતી સંતતિ ઉત્પન્ન કરે છે. મેન્ડલે પોતાના પ્રયોગો માટે આવી સત્યબીજ પીઝ (Pea) ની પસંદગી કરી હતી.", "tag": ""}, {"q": "મેન્ડલ દ્વારા પીઝ પ્લાન્ટમાં સંશોધન માટે પસંદ કરેલા કુલ લક્ષણોની સંખ્યા કેટલી હતી?", "opts": ["5", "7", "14", "3"], "correct": 1, "explain": "મેન્ડલે પીઝ (Pisum sativum) પ્લાન્ટમાં 7 વિરોધાભાસી લક્ષણો (જેમ કે સ્તંભનીંબાઈ, બીજનો રંગ, પોફડાનો આકાર) ચୟન કર્યા હતા, જેનો અભ્યાસ કર્યો હતો.", "tag": ""}, {"q": "જીનોટાઈપ (Genotype) અને ફિનોટાઈપ (Phenotype) વચ્ચેનો મૂળભૂત તફાવત કયો છે?", "opts": ["જીનોટાઈપ એ આનુવંશિક ઘટના (allele组合) છે, જ્યારે ફિનોટાઈપ એ બાહ્ય રૂપી લક્ષણ છે", "જીનોટાઈપ એ બાહ્ય લક્ષણ છે, ફિનોટાઈપ એ જનીન સંરચના છે", "બંને એકસમાન થાય છે", "જીનોટાઈપ માત્ર મેળવેલ લક્ષણો દર્શાવે છે"], "correct": 0, "explain": "જીનોટાઈપ (Genotype) એ કોષમાં રહેલા જનીનો/એલીલનું સંયોજન છે, જ્યારે ફિનોટાઈપ (Phenotype) એ તેના પ્રભાવથી દેખાતું બાહ્ય અથવા શારીરિક લક્ષણ છે.", "tag": ""}, {"q": "એલીલ (Allele) કોને કહેવાય?", "opts": ["એક જ જનીન (Gene) ના વિરોધાભાસી રૂપો", "ક્રોમોસોમનું કોઈ પણ ભાગ", "માત્ર પ્રભાવી જનીન", "નોન-કોડિંગ DNA નો પ્રદેશ"], "correct": 0, "explain": "એલીલ (Allele) એક જ જનીન (Gene) ના વિવિધ રૂપો છે જે એક જ સ્થાને (લોકસ) આવેલા હોય છે. તેઓ લક્ષણના વિરોધાભાસી સ્વરૂપો (જેમ કે પ્રભાવી કે પ્રતિબંધી) નક્કી કરે છે.", "tag": ""}, {"q": "એકસંકરણ (Monohybrid cross) માં F2 પીઢીમાં મેન્ડલે કયો અનુપાત મેળવ્યો હતો?", "opts": ["1 : 2 : 1 (જીનોટાઈપ) અને 3 : 1 (ફિનોટાઈપ)", "9 : 3 : 3 : 1", "1 : 1 : 1 : 1", "3 : 1 : 1 : 1"], "correct": 0, "explain": "એકસંકરણ (Monohybrid cross) માં F2 પીઢીમાં જીનોટાઈપિક અનુપાત 1 : 2 : 1 અને ફિનોટાઈપિક અનુપાત 3 : 1 મળે છે, જે મેન્ડલના પ્રબળતાના નિયમ અને વિભાજનના નિયમને આધાર રાખે છે.", "tag": ""}, {"q": "મેન્ડલના ડાયહાઇબ્રિડ ક્રોસ પ્રયોગમાં, F₂ પેઢીમાં જોવા મળતો ફિનોટાઇપિક અનુપાત કયો છે?", "opts": ["9 : 3 : 3 : 1", "1 : 2 : 1", "3 : 1", "9 : 7"], "correct": 0, "explain": "મેન્ડલે બીજના આકાર (ગોળ/શરો) અને રંગ (પીળા/પીળા) ના બે લક્ષણો પર ડાયહાઇબ્રિડ ક્રોસ કર્યો હતો. F₁ માં બધા જ સંતતિઓ વાટાઘોટિયા પીળા હતા. F₂ માં મળેલા ફિનોટાઇપ 9 : 3 : 3 : 1 નો અનુપાત આપે છે, જે દર્શાવે છે કે બે જોડ એલીલ્સ સ્વતંત્ર રીતે વારસામાં મળે છે.", "tag": ""}, {"q": "સ્વતંત્ર વિભાજનનો નિયમ (Law of Independent Assortment) કયા પ્રક્રિયા દરમિયાન લાગુ પડે છે?", "opts": ["બિંબસૂત્રના વિભાજન (Anaphase I) દરમિયાન", "જન્યુ બંધારણ (Gamete formation) દરમિયાન", "ફલન (Fertilisation) દરમિયાન", "DNA પ્રતિકૃતિ દરમિયાન"], "correct": 1, "explain": "સ્વતંત્ર વિભાજનનો નિયમ જન્યુ બંધારણ (ગેમેટ ફોર્મેશન) દરમિયાન લાગુ પડે છે, જ્યારે હોમોલોગસ ક્રોમોઝોમની જોડીઓ સ્વતંત્ર રીતે વહેંચાય છે. આ પ્રક્રિયામાં બે કે વધુ જોડ એલીલ્સના વિચલન સ્વતંત્ર રીતે થાય છે, જે F₂ પેઢીમાં નવા જનીન સંયોજનો ઉત્પન્ન કરે છે.", "tag": ""}, {"q": "જો આપણે RrYy જનીન પ્રકાર ધરાવતા સંકર ડાયહાઇબ્રિડ સંતાનનું સ્વયં પરગટન (selfing) કરીએ, તો તેના ઉત્પન્ન થતા જન્યુઓના જનીનિક સંયોજનો કયા છે?", "opts": ["RY, Ry, rY, ry", "RR, Rr, rr", "YY, Yy, yy", "RrYy"], "correct": 0, "explain": "ડાયહાઇબ્રિડ સંકર (RrYy) માં, દરેક જન્યુ એક જ એલીલ R/r અને એક જ એલીલ Y/y પ્રાપ્ત કરે છે. સ્વતંત્ર વિભાજનને કારણે ચાર પ્રકારના જન્યુઓ બને છે: RY, Ry, rY, અને ry. આ જન્યુઓ F₂ પેઢીમાં 9 : 3 : 3 : 1 નો ફિનોટાઇપિક અનુપાત આપે છે.", "tag": ""}, {"q": "મેન્ડલના ડાયહાઇબ્રિડ ક્રોસમાં F₂ પેઢીમાં જોવા મળતો જીનોટાઇપિક અનુપાત કયો છે?", "opts": ["1 : 2 : 1 : 2 : 4 : 2 : 1 : 2 : 1", "9 : 3 : 3 : 1", "1 : 1 : 1 : 1", "3 : 1"], "correct": 0, "explain": "ડાયહાઇબ્રિડ ક્રોસના F₂ પેઢીમાં, વિવિધ જીનોટાઇપ્સનો અનુપાત 1 : 2 : 1 : 2 : 4 : 2 : 1 : 2 : 1 હોય છે. આમાં 9 જૂદા જીનોટાઇપ્સ હોય છે, જેમાં વિષમયુગ્મી (heterozygous) સંયોજનોનું પ્રમાણ વધુ હોય છે.", "tag": ""}, {"q": "સ્વતંત્ર વિભાજનના નિયમ પિતાનો સંકર કરવામાં આવે, તો તેમના સંતાનોમા સ્ત્રી તથા પુરુષ બંને પ્રકારના દર્દી આવી શકે તે શરત કઈ છે?", "opts": ["માતા વાહિકા (X^H X^h) હોય તથા પિતા દર્દી (X^h Y) હોય", "માતા સામાન્ય (X^H X^H) હોય તથા પિતા દર્દી (X^h Y) હોય", "માતા વાહિકા (X^H X^h) હોય તથા પિતા સામાન્ય (X^H Y) હોય", "બંને માતા તથા પિતા સામાન્ય હોય, પણ જનીનિક રીતે વાહિક હોય"], "correct": 0, "explain": "જો માતા વાહિકા (X^H X^h) હોય તથા પિતા દર્દી (X^h Y) હોય, તો સંતતિમા સ્ત્રી (X^h X^h) તથા પુરુષ (X^h Y) બંને પ્રકારના હેમોફિલિક સંતાન ઉત્પન્ન થઈ શકે. એકલી વાહિકા માતા + સામાન્ય પિતા મેળવવાથી માત્ર પુરુષ સંતાનમાં દર્દ જોવા મળે, સ્ત્રી સંતાનમાં દર્દ જોવા મળતો નથી.", "tag": ""}, {"q": "મેન્ડલના ડાયહાઇબ્રિડ સંકરમાં, જો બે જનીન (જેમ કે A તથા B) પેરાસોમેટિક (અનેડ્સમેટિક) યુગ્મસ્થ (Linkage) ધરાવતા હોય, તો F2 પીઢીમા મેન્ડલના અનુપાત સાથે કઈ ભૂલ જોવા મળે?", "opts": ["9:3:3:1 નો ફિનોટાઇપિક અનુપાત તેજીથી વધે છે", "પેરેન્ટલ (મૂળ) જીનોટાઇપિક કોમ્બિનેશનનું પ્રમાણ વધે છે અને રિકોમ્બિનેન્ટ કોમ્બિનેશન ઘટે છે", "F1 પીઢીમાં ચાર પ્રકારના ગેમેટ બને છે", "મેન્ડલનું સ્વતંત્ર વિભાજનનો નિયમ સંપૂર્ણ લાગુ પડે છે"], "correct": 1, "explain": "જ્યારે બે જનીન યુગ્મસ્થ (Linked) હોય, ત્યારે તેઓ એકસાથે વિરામિત થાય છે — તેથી F2 માં મૂળ (પેરેન્ટલ) જીનોટાઇપિક કોમ્બિનેશનનું પ્રમાણ વધે છે અને રિકોમ્બિનેન્ટ (પુનઃસંયોજન) કોમ્બિનેશન ઘટે છે, જે 9:3:3:1 નો અનુપાત ભંગ કરે છે. યુગ્મસ્થતા સ્વતંત્ર વિભાજનના નિયમનું ઉલ્લંઘન કરે છે.", "tag": ""}, {"q": "સ્કેલ ફિશના રંગના રડિશ (Scale colour) માં, ઓવરડોમિનેન્સ (Overdominance / Heterosis) ના મુદ્દે સાચું વિધાન કયું છે?", "opts": ["હેટેરોઝાયગોટ (Bb) નો ફિનોટાઇપ હોમોઝાયગોટ (BB અથવા bb) કરતાં ઓછો હોય છે", "હેટેરોઝાયગોટ (Bb) નો ફિનોટાઇપ બંને હોમોઝાયગોટ (BB તથા bb) ના ફિનોટાઇપથી અલગ તથા વધુ પ્રબળ હોય છે — એટલે કે ત્રીજો, અલગ રંગનો પ્રકાર દેખાય છે", "હેટેરોઝાયગોટ (Bb) માં માત્ર એક જ એલીલ પૂર્ણ પ્રભુત્વ ધરાવે છે", "ઓવરડોમિનેન્સ કોઈ પણ પ્રકારનો ફિનોટાઇપિક ભિન્નતા લાવતું નથી"], "correct": 1, "explain": "સ્કેલ ફિશ (મરિન ફિશ) ના રંગમાં, હેટેરોઝાયગોટ (Bb) બંને હોમોઝાયગોટ (BB તથા bb) કરતાં વધુ પ્રભુત્વ/વિકસિત રંગ દર્શાવે છે — આ ઘટનાને ઓવરડોમિનેન્સ કહેવાય છે. આમાં ત્રીજો, અલગ તથા વધુ જીવંત રંગનો પ્રકાર ઉભરે છે.", "tag": ""}, {"q": "વર્ગ 5.3 'ક્રોમોઝોમલ થિયરી ઑફ ઇન્હેરિટન્સ' માં, સ્વરૂપ દ્વારા રંગસૂત્રો (Chromosomes) પર જનીનોના સ્થાનને પ્રસ્તાવિત કરનારા વિદ્વાન કોણ છે?", "opts": ["વાલ્ટર સેમ્યુઅલ સટન અને Theodor Boveri", "ગ્રેગર જોહાન મેન્ડલ", "આલ્ફ્રેડ વર્નર બ્રેડી", "એચ. જે. મુલર"], "correct": 0, "explain": "સટન અને Boveri એ 1902 માં રંગસૂત્રીય વારસાવાદનો સિદ્ધાંત રજૂ કર્યો હતો, જેના અનુસાર જનીનો રંગસૂત્રો પર આવેલા છે અને રંગસૂત્રોનો સંયોજન (segregation) જનીનોના સંયોજનને સમજાવે છે. મેન્ડલે તો પહેલાં જનીનોનો ખ્યાલ આપ્યો હતો પરંતુ તેમનું રંગસૂત્રો સાથે સંબંધ બતાવ્યો ન હતો.", "tag": ""}, {"q": "થોમસ હન્ટ મોર્ગનના પ્રયોગોમાં, Drosophila પર, જો બે જનીનો વચ્ચે ઓછું પુનઃસંયોજન (recombination) જોવા મળે, તો તેનો અર્થ શું થાય?", "opts": ["બંને જનીનો એક જ રંગસૂત્ર પર નજીકમાં છે (લિંકેડ)", "બંને જનીનો અલગ અલગ રંગસૂત્રો પર છે", "જનીનો એકબીજા પર પ્રભાવી છે", "જનીનો સંપૂર્ણપણે અપ્રભાવી છે"], "correct": 0, "explain": "મોર્ગનના પ્રયોગો દર્શાવે છે કે જેટલા નજીક બે જનીનો એક જ રંગસૂત્ર પર હોય, તેટલું જ પુનઃસંયોજન (recombination) ઓછું થાય છે કારણ કે ક્રોસિંગ ઓવરની ઘટના ન બને. તેથી ઓછું પુનઃસંયોજન એ સૂચવે છે કે જનીનો લિંકેડ (linked) છે.", "tag": ""}, {"q": "ક્રોસિંગ ઓવર (Crossing over) ને કારણે કયો પરિણામ મળે છે?", "opts": ["નવા જનીન સંયોજનો ( recombinants ) ઉભરાય છે", "સંપૂર્ણ લિંકેજ (complete linkage) થાય છે", "રંગસૂત્રોની સંખ્યા વધે છે", "મેયોસિસ અટકી જાય છે"], "correct": 0, "explain": "ક્રોસિંગ ઓવર એ મેયોસિસના પ્રોફેઝ I દરમિયાન સમરૂપ રંગસૂત્રો વચ્ચે ડીએનએનું આદાન-પ્રદાન છે, જેનાથી પરિણામી ગેમેટમાં મધેર-પિતૃ બંને તરફથી આવીને નવા જનીન સંયોજનો ઉભરાય છે, જેને recombinants કહેવાય છે.", "tag": ""}, {"q": "અનલિંક્ડ જનીનો (Unlinked genes) માટે કયું વિધાન સાચું છે?", "opts": ["તેઓ અલગ અલગ રંગસૂત્રો પર આવેલા હોય છે અને સ્વતંત્ર વિભાજન દર્શાવે છે", "તેઓ એક જ રંગસૂત્ર પર ખૂબ દૂર હોય છે", "તેઓ ક્રોસિંગ ઓવર દર્શાવતા નથી", "તેઓ સ્વતંત્ર રીતે વિભાજન પામતા નથી"], "correct": 0, "explain": "અનલિંકેડ જનીનો અલગ અલગ રંગસૂત્રો પર હોવાથી મેન્ડલના સ્વતંત્ર વિભાજનના નિયમનું પાલન કરે છે. આ જનીનો વચ્ચે કોઈ લિંકેજ હોતી નથી અને તેમનું વિભાજન સ્વતંત્ર રીતે થાય છે, પરિણામે 9:3:3:1 નો ફેનોટાઇપિક અનુપાત મળે છે.", "tag": ""}, {"q": "રંગસૂત્રીય બંધારણમાં થતો કયો ફેરફાર (Chromosomal aberration) સ્થાન (position) ના બદલાવાને કારણે જનીન અભિવ્યક્તિને બદલી શકે છે?", "opts": ["ઇન્વર્ઝન (Inversion)", "મિસેન્સ મ્યુટેશન (Missense mutation)", "ડીલેશન (Deletion)", "નॉન-ડિજંક્શન (Nondisjunction)"], "correct": 0, "explain": "ઇન્વર્ઝન એ રંગસૂત્રના એક ભાગનું પાછું ફરી જવું છે, જેના કારણે જનીનોનું સ્થાન બદલાય છે (position effect). આમાં જનીનોનું ક્રમ વ્યસ્ત થાય છે, પરંતુ ડીએનએનો ઉપાદનો જળવાઈ રહે છે. મિસેન્સ મ્યુટેશન જનીનીય સ્તરે હોય છે, ડીલેશન તો જનીનોનો નાશ કરે છે, અને નોન-ડિજંક્શન સંખ્યામાં ફેરફાર કરે છે.", "tag": ""}, {"q": "સ્થળીય જનીનો (Linkage) ની સાપેક્ષે કયું વિધાન સાચું છે?", "opts": ["બળકટ સ્થળીય જનીનોની વચ્ચે મેળવેલા પુનર્સંયોજિત (Recombinant) પેટાંબદળ પ્રકારોની સંખ્યા ઓછી હોય છે.", "સ્થળીય જનીનો હંમેશા એક જ રંગસૂત્ર પર હોતા નથી.", "મજબૂત સ્થળીયતા (Strong linkage) માં પુનર્સંયોજિત (Recombinant) પેટાંબદળ પ્રકારોની સંખ્યા વધુ હોય છે.", "જ્યારે બે જનીનો ભિન્ન રંગસૂત્રો પર હોય ત્યારે સ્થળીયતા (Linkage) જોવા મળે છે."], "correct": 0, "explain": "જ્યારે બે જનીનો એક જ રંગસૂત્ર પર નજીકમાં હોય (મજબૂત સ્થળીયતા), ત્યારે તેઓ મિયોસિસ દરમિયાન સાથે વારસામાં મળે છે અને પુનર્સંયોજિત (Recombinant) પેટાંબદળ પ્રકારો દૂરના જનીનોની તુલનામાં ઓછા મળે છે. એક જ રંગસૂત્ર પર નજીકના જનીનો વચ્ચે ક્રોસિંગ ઓવરનું પ્રમાણ ઓછું હોવાથી પુનર્સંયોજિત પ્રકારોની સંખ્યા ઘટે છે.", "tag": ""}, {"q": "એક પરિક્ષા-સંકર (Test cross) માં F₂ પેટાંબદળ પ્રકારો ગણતરી કરતી વખતે મેળવેલા (Parental) તથા પુનર્સંયોજિત (Recombinant) પ્રકારોના ગુણોત્તરમાં સ્થળીયતા (Linkage) કેવી રીતે અસર કરે છે?", "opts": ["સ્થળીયતા (Linkage) માં મેળવેલા (Parental) પ્રકારોની સંખ્યા પુનર્સંયોજિત (Recombinant) પ્રકારો કરતાં વધારે હોય છે.", "સ્થળીયતા (Linkage) રહેલ જનીનો માટે મેળવેલા (Parental) તથા પુનર્સંયોજિત (Recombinant) પ્રકારોની સંખ્યા સમાન હોય છે.", "સ્થળીયતા (Linkage) રહે }

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

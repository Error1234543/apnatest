<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Health and Disease — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

  <div class="hero">
    <h1>Human Health and Disease — 📝 50 MCQ Test</h1>

  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-05</footer>
</div>
<script>
const QUIZ = [{"q": "વિશ્વ સ્વાસ્થ્ય સંસ્થા (WHO) મુજબ સ્વાસ્થ્ય (Health) ની વ્યાખ્યા કઈ છે?", "opts": ["શારીરિક, માનસિક અને સામાજિક રીતે સંપૂર્ણ કલ્યાણની અવસ્થા, માત્ર રોગની અસ્થિતિ નહીં.", "શરીરમાં કોઈ પણ રોગનું અસ્તિત્વ ન હોવું.", "કેવળ શારીરિક સ્ટિતિ જેમાં રોગ ન હોય.", "માનસિક સંતુલન જાળવી શકવું."], "correct": 0, "explain": "વિશ્વ સ્વાસ્થ્ય સંસ્થાએ સ્વાસ્થ્યને 'શારીરિક, માનસિક અને સામાજિક કલ્યાણની સંપૂર્ણ અવસ્થા' તરીકે વ્યાખ્યાયિત કરી છે, માત્ર રોગની અસ્થિતિ નહીં.", "tag": ""}, {"q": "રોગ (Disease) ની સામાન્ય વ્યાખ્યા કઈ છે?", "opts": ["શરીરના અંગ કે પેશીમાં થતું કાર્યાત્મક વિષમતા જે ચોક્કસ લક્ષણો દર્શાવે છે.", "કેવળ બહારથી પ્રવેશેલા રોગકારક જીવો દ્વારા થતી અસ્વસ્થતા.", "જینیકો દ્વારા પસાર થતી અવસ્થા.", "શરીરમાં પોષક તત્વોની અછત."], "correct": 0, "explain": "રોગ એટલે શરીરના કોઈ ભાગ કે અંગનું સામાન્ય કાર્ય થાપેલું વિષમ થઈ જવું, જેના પરિણામે લક્ષણો દેખાડે છે.", "tag": ""}, {"q": "નીચેમાંથી કઈ રોગ સંચારી (Communicable) છે?", "opts": ["મલેરિયા", "મધુમેહ (ડાયાબિટીઝ)", "ઉચ્ચ રક્તચાપ (High blood pressure)", "કેન્સર"], "correct": 0, "explain": "મલેરિયા એક સંચારી રોગ છે જે ફાલ્કિન મચ્છર (Anopheles) દ્વારા ફેલાય છે, જ્યારે બાકીના ત્રણ રોગ અસંચારી (Non-communicable) છે.", "tag": ""}, {"q": "રોગકારક ઇંદ્રિયો (Pathogens) નો સમાવેશ કયા ગ્રુપમાં થાય છે?", "opts": ["બેક્ટેરિયા, વાયરસ, પ્રોટોઝોઆ, ફંજાઇ અને હેલમિન્થ્સ", "કેવળ બેક્ટેરિયા અને વાયરસ", "કેવળ પ્રાણીઓ અને વનસ્પતિઓ", "કેવળ વિષાણુ અને ફંગસ"], "correct": 0, "explain": "રોગકારક ઇંદ્રિયોમાં બેક્ટેરિયા, વાયરસ, પ્રોટોઝોઆ (જેમ કે પ્લાઝમોડિયમ), ફંજાઇ અને હેલમિન્થ્સ (કૃમિઓ) સમાયેલા છે.", "tag": ""}, {"q": "માનવ દેહમાં સંચારી રોગોના પ્રસારણનો મુખ્ય માધ્યમ કયો છે?", "opts": ["મચ્છર (વેક્ટર)", "પાણી અને ખાદ્ય પદાર્થો", "વાયુ (Airborne)", "સીધો સંપર્ક"], "correct": 1, "explain": "સંચારી રોગોના પ્રસારણના મુખ્ય માધ્યમોમાં પ્રદૂષિત પાણી, ખાદ્ય પદાર્થો, હવા અને સીધો સંપર્ક સામેલ છે; પરંતુ વેક્ટર (જેમ કે મચ્છર) પણ સંચારણમાં મહત્વનો ભાગ ભજવે છે.", "tag": ""}, {"q": "નીચે મુજબના લક્ષણો પૈકિ કયું લક્ષણ ટાઇફોઇડ (Typhoid) રોગનું લક્ષણ નથી?", "opts": ["ત્વચા પર દાદરા જેવા નીલલા ચક્ર", "સતત ઊંચું તાવ", "આંતરનું અલ્સર થઈ જવું", "પેટમાં દુઃખાવો અને વિષાણુમુક્ત અવસ્થા (Typhoid state)"], "correct": 0, "explain": "ટાઇફોઇડના લક્ષણોમાં સતત તાવ, આંતરિક અલ્સર, પેટમાં દુઃખાવો અને weakness સહિતનું 'टाइफॉइड स्टेट' આવે છે. ત્વચા પર નીલમા ચક્ર (rose spots) સામાન્ય રીતે બ્લેક ફીવર (Miliary TB) સાથે જોડાયેલ છે, ટાઇફોઇડ સાથે નહીં.", "tag": ""}, {"q": "મધુમેહ (Diabetes Mellitus) રોગમાં શરીરમાં કઈ હોર્મોનની કमी થાય છે?", "opts": ["થાયરોક્સિન", "ઇન્સુલિન", "ગ્લુકાગોન", "કોર્ટિસોલ"], "correct": 1, "explain": "મધુમેહ એક અસંચારી રોગ છે જેમાં ખૂબ ઊંચું લોહીનું શર્કરા (Blood glucose) વધી જાય છે. આ રોગ પેન્ક્રિયાસના Islets of Langerhans માંથી ઉત્પન્ન થતા B-cells ની ઇન્સુલિન હોર્મોનની અપર્યાપ્ત ઉત્પત્તિ કે કાર્યક્ષમતામાં ગડબડીને કારણે થાય છે.", "tag": ""}, {"q": "ફિલેરીસિસ (Filariasis / સાંજળી) રોગનું કારણક ભાગ (Causative agent) કઈ જાતનું હોય છે?", "opts": ["વાઇરસ", "બેક્ટેરિયા", "પ્રોટોઝોઆ", "નિમેટોડ (પરોપજીવી કૃમિ)"], "correct": 3, "explain": "ફિલેરીસિસ એક પરોપજીવી નિમેટોડ કૃમિ (Wuchereria bancrofti કે W. malayi) ને કારણે થતો સંચારી રોગ છે. આ કૃમિ લસિકા નલીઓમાં વસે છે અને લસિકા વ્યવસ્થાની નુકસાની કરે છે, જેનાથી લિંફીડેમા (Elephantiasis) જેવી સ્થિતિ ઉભી થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ રચના શરીરની અંતર્ગત કાષ્ટિક અરક્ત (Innate Immunity) ની ચોથી રક્ષાકવચ (Barrier) શ્રેણીનું ઉદાહરણ છે?", "opts": ["ચામડી (Skin)", "મ્યુકસ પડ (Mucous membrane)", "નીયત કોષિકાઓ (Natural Killer cells)", "આંસુ (Tears)"], "correct": 2, "explain": "કાષ્ટિક અરક્ત (Innate immunity) ચાર પ્રકારની રક્ષાકવચો ધરાવે છે: (1) શારીરિક અવરોધો — ચામડી, (2) શારીરિક રસાયણીય અવરોધો — આંસુ, લોારિક એસિડ, (3) કોષીય અવરોધો — ન્યુટ્રોફિલ્સ, મેક્રોફેજ, Natural Killer cells, (4) રાસાયણિક અવરોધો — સાયટોકાઇન્સ. NK cells કોષીય અવરોધોનો સમાવેશ કરે છે.", "tag": ""}, {"q": "કોમન કોલ્ડ (Common cold) રોગનું પ્રદુષક (Pathogen) કયું છે અને તે માનવ શરીરમાં કયા ભાગને પ્રભાવિત કરે છે?", "opts": ["પ્લાઝ્મોડિયમ — લોહીના LBCs", "રાઇનોવાઇરસ — નાક અને ગળું", "સાલ્મોનેલા ટાઇફિ — આંતરડું", "લિશ્મેનિયા ડોનોવანი — યકૃત"], "correct": 1, "explain": "કોમન કોલ્ડ સામાન્ય રીતે રાઇનોવાઇરસ (Rhinovirus) નામના વાઇરસથી થાય છે, જે ઊર્ધ્વ શ્વાસ નલીઓ (Upper respiratory tract) એટલે કે નાક અને ગળાને પ્રભાવિત કરે છે. આમાં ચાંદ્હો, શીકાયો, શરીરનો તાવ અને ગળામાં ખરોશી જેવા લક્ષણો ظاهર થાય છે.", "tag": ""}, {"q": "મેલેરિયા (Malaria) રોગના જીવનચક્રમાં, માનવ શરીરમાં રક્તમાં પરોપજીવી (Plasmodium) નું લિંગરહિત પ્રજનન (Asexual reproduction) કયા તબક્કા દ્વારા થાય છે?", "opts": ["સ્પોરોઝોઇટ (Sporozoite)", "મેરોઝોઇટ (Merozoite)", "ગેમેટોસાઇટ (Gametocyte)", "સિગોટ (Zygote)"], "correct": 1, "explain": "મેરોઝોઇટ (Merozoite) તબક્કો લાલ રક્તકણોને આક્રમણ કરી તેમાં લિંગરહિત પ્રજનન કરે છે, જે મલેરિયાના લક્ષણોનું કારણ બને છે.", "tag": ""}, {"q": "ડેન્ગૂ ફેવર (Dengue fever) રોગનો કારણક વિરસ (Virus) કયા પરિવાર (Family) માં આવે છે?", "opts": ["ફ્લેવિરસ (Flavivirus)", "ટોગાવિરસ (Togavirus)", "રીઓવિરસ (Reovirus)", "બંઇયાવિરસ (Bunyavirus)"], "correct": 0, "explain": "ડેન્ગૂ વિરસ ફ્લેવિરસ (Flavivirus) પરિવારનો સભ્ય છે, જે એડીઝ મચ્છર (Aedes mosquito) દ્વારા સંક્રમિત થાય છે.", "tag": ""}, {"q": "રેબીઝ (Rabies) વિરસના આકાર અને જનીનિક સમાવેશ (Genetic material) વિશે સાચું વર્ણન કયું છે?", "opts": ["ગોળાકાર (Spherical) અને ડબલ-સ્ટ્રેન્ડેડ DNA", "બટલર આકાર (Bullet-shaped) અને સિંગલ-સ્ટ્રેન્ડેડ RNA", "દંડાકાર (Rod-shaped) અને ડબલ-સ્ટ્રેન્ડેડ RNA", "સ્પાયર આકાર (Spiral-shaped) અને સિંગલ-સ્ટ્રેન્ડેડ RNA"], "correct": 1, "explain": "રેબીઝ વિરસ બટલર આકારનું (Bullet-shaped) એનવલોપ્ડ (Enveloped) વિરસ છે, જેમાં સિંગલ-સ્ટ્રેન્ડેડ negativesense RNA જનીનિક સામગ્રી હોય છે.", "tag": ""}, {"q": "એન્ટામીબા હિસ્ટોલિટિકા (Entamoeba histolytica) ની પાકી ઇંસિસ્ટ (Cyst) અવસ્થામાં કેટલા બીજકોષ (Nuclei) હોય છે?", "opts": ["1", "2", "4", "8"], "correct": 2, "explain": "પાકી ઇંસિસ્ટમાં 4 બીજકોષ (Nuclei) હોય છે, જે સંક્રમણ માટે ઉપયોગી છે.", "tag": ""}, {"q": "રિંગવર્મ (Ringworm) રોગ કયા જીવો (Organisms) ના સંયુક્ત સંક્રમણથી થાય છે?", "opts": ["માઇક્રોસ્પોરમ (Microsporum)", "ટ્રાઇકોફાયટન (Trichophyton)", "એપિડર્મોફાયટન (Epiderm rum ઊંચા પ્રમાણમાં બહુસ્વરૂપી (polymorphic) રુધિરભિન્ન તબક્કો ધરાવે છે અને મગજ અને હૃદયના સૂક્ષ્મરુધિવાહિનીઓને અવરોધિત કરી શકે છે", "P. vivax નું દૃષ્ટિગોચર જીનોમ P. falciparum કરતા નાનું હોય છે"], "correct": 2, "explain": "P. falciparum માં રુધિરભિન્ન તબક્કો ખૂબ જ ઊંચો અને તે લાલાભ પરપોટાની સપાટી પર 'knobs' બનાવે છે જેથી અવરોધિત રક્તપ્રવાહ થાય છે; આ 'cerebral malaria' સહિત ગંભીર જટિલતાઓનું કારણ બને છે.", "tag": ""}, {"q": "મલેરિયાના 'સિમેટ્રિક' ( Quarterly / Quartan) તાવ પેદા કરતાં P. malariae માં રોગચક્રની લંબાઈ (cycle length) કેટલી હોય છે અને આ લંબાઈનું કારણ શું છે?", "opts": ["48 કલાક; આ P. falciparum માટે લાક્ષણિક છે", "72 કલાક; રુધિરભિન્ન તબક્કો લાંબો હોવાથી વિદળનનો ઇરાદો વિલંબિત થાય છે", "24 કલાક; અત્યંત ઝડપી વિભાજન કરે છે", "96 કલાક; આ P. ovale માટે લાક્ષણિક છે"], "correct": 1, "explain": "P. malariae માં રુધિરભિન્ન તબક્કો 72 કલાકનો હોય છે, જેના કારણે તાવ દર 72 કલાકે આવે છે; આ લાક્ષણિક ચતુર્થક (quarter / quartan) મલેરિયા તરીકે ઓળખાય છે.", "tag": ""}, {"q": "ગંભીર મલેરિયા (Severe / Complicated malaria) ની નીચેનીમાંથી કઈ સ્થિતિ P. falciparum સંક્રમણ સાથે સૌથી વધુ સંબંધિત છે?", "opts": ["સ્ફોટિક વિસર્જનકોષ વૃદ્ધિ (splenic hyperplasia) અને ગ્રહણીય ઉલ્કા", "મગજના રક્તવાહિનીઓમાં પરપોટાઓનું ચસ્પન (sequestration), પરિણામે ગંભીર એનામિયા અને મસ્તિષ્કિક મલેરિયા (cerebral malaria)", "યકૃતની મુખ્ય પિત્તકુહૂર (hepatic schizonts) ના વિસ્ફોટથી યકૃત નિષ્ફળતા", "રક્તકણોમાં P. vivax ના ડોન્ઓવાલ ફોર્મ્સનું સંચય"], "correct": 1, "explain": "P. falciparum ના પરિપક્વ સ્કિઝોઝોઇટ્સ લાલાભ પરપોટાની સપાટી પર 'knobs' દ્વારા અવરોધિત રક્તવાહિનીઓમાં ચસ્પન (sequestration) થાય છે, જે મસ્તિષ્કિક મલેરિયા અને ગંભીર એનામિયા જેવી જીવલેણ સ્થિતિઓ પેદા કરે છે.", "tag": ""}, {"q": "કાલાઅઝાર (Kala-azar) માં Leishmania donovani કઈ કોષીય રક્ષણ પદ્ધતિથી બચીને રોગ પેદા કરે છે?", "opts": ["તે લાલાભ પરપોટા (RBCs) માં સક્રિય રીતે બહુગુણન કરે છે", "તે માસ્ક્યુલર કોષોને આક્રમણ કરીને સ્નાયુશોથ (myositis) લાવે છે", "તે મેક્રોફેજના ફેગોસોમમાં ટકી રહે છે અને મેક્રોફેજીયલ ફેગોલિઝોસોમમાં પ્રતિકારક તંત્રની હેઠળ ટકી ર ain": "T-લિમ્ફોસાઇટ્સ કોષીય આભારણીય ઇમ્યુનિટીનો મુખ્ય ઘટક છે; હેલ્પર T કોષઓ (CD4+) અને સાયટોટોક્સિક T કોષો (CD8+) સંક્રમિત અથવા કેન્સરગ્રસ્ત કોષોને સીધા નષ્ટ કરવા અથવા અન્ય કોષોને પ્રેરિત કરવા કાર્યરત થાય છે.", "tag": ""}, {"q": "દૂધપાલક માતાઓના પ્રથમ દૂધ (colostrum) માં કયા પ્રકારની આઈસોએન્ઝાઇમ વિપુલ પ્રમાણમાં હોય છે, જે બચ્ચાને સક્રિય-નિષ્ક્રિય ઇમ્યુનિટીના સંયુક્ત લાભ આપે છે?", "opts": ["IgA", "IgE", "IgM", "IgG"], "correct": 0, "explain": "કોલોસ્ટ્રમમાં IgA વિપુલ પ્રમાણમાં હોય છે; આ સક્રિય-નિષ્ક્રિય ઇમ્યુનિટી (Passive Immunity) નું પ્રતિનિધિત્વ કરે છે — બચ્ચો જન્મ સમયે स्वयं પ્રતિરોધક કોષોના ઉત્પાદનની શરૂઆત ન કરી શકતો હોય તે સમયગાળામાં તેને તત્કાલીન સંરક્ષણ પ્રદાન કરે છે.", "tag": ""}, {"q": "અડ્રેનાલાઇન (Epinephrine) હોર્મોનની મુખ્ય જૈવિક ભૂમિકા નીચેનામાંથી કઈ ગણાય છે?", "opts": ["હૃદય સ્થિતિસ્થાપકતા (contractility) અને હૃદયગતિ (heart rate) વધારવી", "હૃદયગતિ ઘટાડીને શ્વાસનો દર વધારવો", "હૃદય સ્થિતિસ્થાપકતા ઘટાડવાનું અને પ્રસરણમાં ઘટાડો કરવો", "રક્તનાલિકાઓનું પ્રસરણ વધારવું અને કંકાલ પेशીઓમાં રક્તપ્રવાહ ઘટાડવો"], "correct": 0, "explain": "અડ્રેનાલાઇન એ સમજી શકાય તેવું સ્ટ્રેસ હોર્મોન છે, જે કટ અથવા ફ્રીઝ પ્રતિક્રિયા દરમિયાન સ્રાવિત થાય છે. તેના પ્રભાવોમાં હૃદયમાં બીટા-1 એડ્રેનર્જિક રિસેપ્ટર્સ દ્વારા સ્થિતિસ્થાપકતા અને હૃદયગતિ બંને વધવાનો સમાવેશ થાય છે, એલ્ફા-1 રિસેપ્ટર્સ દ્વારા ચામડી અને પેટના અંગોની ધમનીઓનું સંકોચન થાય છે અને બીટા-2 રિસેપ્ટર્સ દ્વારા ઊનસનું પ્રસરણ થાય છે.", "tag": ""}, {"q": "ડેન્ગ્યુ ઉત્પાદક વિષાણુના શાસ્ત્રીય વર્ગીકરણ અને તેના પ્રાણી વાહક (vector) અંગે નીચેનામાંથી કયું યોગ્ય જોડાણ છે?", "opts": ["ફ્લેવીવેરિડ કુટુંબ અને એડીસ એજિપ્ટી વહેવાર", "આર્થ્રોપોડ કુટુંબ અને એડીસ એજિપ્ટી વહેવાર", "રેટ્રોવેરિડ કુટુંબ અને એડીસ એજિપ્ટી વહેવાર", "એન્ટરોવેરિડ કુટુંબ અને એડીસ એજિપ્ટી વહેવાર"], "correct": 0, "explain": "ડેન્ગ્યુ વિષાણુ ફ્લેવીવેરિડે (Flaviviridae) કુટુંબનું પોઝેટિવ-સેન્સ એસઆરએન્માં (single-stranded RNA) ધરાવતું વિષાણુ છે. એડીસ એજિપ્ટી મૂસકીટો (Aedes aegypti) એ ડેન્ગ્યુ મુખ્યત્વે ફેલાવતો પ્રાણી વાહક છે, જ્યારે એડીસ એલ્બોક્ટીપસ પણ ડેન્ગ્યુનું વહન કરવામાં ભાગ લઈ શકે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયા લિપોપ્રોટીન (LDL અને HDL)ના સ્તર સાથે હૃદય સ્નાયુનું રોગ (ischemic heart disease)નું જોખમ વધુ હોવાની શક્યતા છે?", "opts": ["LDL = 110 mg/dL અને HDL = 25 mg/dL", "LDL = 120 mg/dL અને HDL = 35 mg/dL", "LDL = 100 mg/dL અને HDL = 25 mg/dL", "LDL = 90 mg/dL અને HDL = 30 mg/dL"], "correct": 0, "explain": "હૃદયરોગનું જોખમ ઉંચા LDL અને નીચા HDL સ્તર સાથે વધે છે. LDL ચોમાસાના સ્તર 110 mg/dL (સીમા >100) અને HDL સ્તર 25 mg/dL (સીમા <40) સાથે વધુ જોખમ દર્શાવે છે, જ્યારે અન્ય વિકલ્પોમાં HDL થોડું ઊંચું હોવાથી અથવા LDL સીમાની પાસે હોવાથી જોખમ સરખું હોય છે.", "tag": ""}, {"q": "ગંભીર મલેરિયા (Severe malaria) મુખ્યત્વે કયા પરોપજીવી જીવાણુ દ્વારા થાય છે અને તેનું મુખ્ય લક્ષણ શું છે?", "opts": ["પ્લાઝમોડિયમ ફેલ્સિપેરમ; તીવ્ર એનિમિયા, મેલાનમિયા અને મગજને પ્રભાવિત કરતો કોમા", "પ્લાઝમોડિયમ વીવેક્સ; 72-કલાકના ચક્ર સાથે તાવ", "પ્લાઝમોડિયમ મેલેરિયા; 48-કલાકના ચક્ર સાથે તાવ", "પ્લાઝમોડિયમ ઓવાલ; મૃત્યુ દર ઓછો"], "correct": 0, "explain": "ગંભીર મલેરિયા મુખ્યત્વે પ્લાઝમોડિયમ ફેલ્સિપેરમ દ્વારા થાય છે. આ પરોપજીવી રક્તકણોમાં લાલાબિંદુઓના સંગ્રહ અને વિષાકળ ટેક્સિનના ઉત્પાદન કરવાથી કપરું એનિમિયા, મેલાનમિયા (અંધકારક મૂત્ર), મગજનું શોષણ (કમટી) અને બਹુ-અંગ અસ્વાસ્થ્ય સર્જી શકે છે. સિમમેટ્રિક તાવ સામાન્ય રીતે પ્લાઝમોડિયમ વીવેક્સ, પ્લાઝમોડિયમ માલેરિયા અને પ્લાઝમોડિયમ ઓવાલ દ્વારા થાય છે.", "tag": ""}, {"q": "કાલાઅઝાર (કેલઝર-આઝાર) ઉત્પાદક 'લીશમેનિયા ડોનોવાની' શરીરમાં કયા પ્રકારના કોષોમાં પ્રવેશી તેમના કાર્યને વિકૃત કરે છે?", "opts": ["માક્રોફેજ (Macrophages)", "T-લિંફોસાઈટ્સ", "B-લિંફોસાઈટ્સ", "નીટ્રોફિલ્સ"], "correct": 0, "explain": "લીશમેનિયા ડોનોવાની મુખ્યત્વે શરીરના માક્રોફેજમાં (મૂળભૂત પ્રતિકારક તંત્રનો એક ભાગ) પ્રવેશીને તેમના કાર્યને અસ્પષ્ટ કરે છે. આનાથી રક્તકણોનું વિઘટન, સોજો, તાવ અને મળદ્વારમાં ખાસ પ્રકારના ફેરફારો (જેમ કે કાળોપણ) જોવા મળે છે.", "tag": ""}, {"q": "સ્વયંરક્તદોષી રોગોમાં (Autoimmune diseases) શરીરનું પ્રતિકારક તંત્ર કઈ રચના સામે પ્રતિકાય (antibody) ઉત્પન્ન કરે છે?", "opts": ["સ્વજાતીય (self) અણુઓ / પોતાનાજ કોષો અને પટ્ટિકાઓ", "બાહ્ય પરપોઝક (foreign) જીવાણુઓ", "શ્વસનપથનો વાયુઓ", "આહારનું પાચનરસાયણ"], "correct": 0, "explain": "સ્વયંરક્તદોષી રોગોમાં પ્રતિકારક તંત્ર ગલતીથી શરીરની પોતાની જ પેશીઓ (જેમ કે કિડનીમાં glomerulus) ને પરપોઝક માની પ્રતિકાય ઉત્પન્ન કરે છે. આ પ્રક્રિયા સ્વજાતીય અણુઓ (self-antigens) સામેના પ્રતિકાય ઉત્પાદનની ઘટના છે.", "tag": ""}, {"q": "નીચે મુજબની ચાર સ્થિતિઓમાંથી કયા ક્રમમાં ઇલેક્ટ્રોનિયંસ (Electron transport chain) નું કાર્ય અવરોધાય છે?", "opts": ["સાઇટ્રોક્રોમ b → સાઇટ્રોક્રોમ c₁ → સાઇટ્રોક્રોમ c → સાઇટ્રોક્રોમ aa₃", "સાઇટ્રોક્રોમ c → સાઇટ્રોક્રોમ b → સાઇટ્રોક્રોમ aa₃ → સાઇટ્રોક્રોમ c₁", "સાઇટ્રોક્રોમ a → સાઇટ્રોક્રોમ b → સાઇટ્રોક્રોમ c₁ → સાઇટ્રોક્રોમ cc", "સાઇટ્રોક્રોમ c₁ → સાઇટ્રોક્રોમ aa₃ → સાઇટ્રોક્રોમ b → સાઇટ્રોક્રોમ c"], "correct": 0, "explain": "ઇલેક્ટ્રોનિયંસમાં ઇલેક્ટ્રોનનું પરિવહન કોમ્પ્લેક્સ I/II થઈને કોવેલેન્સ A (Q) દ્વારા સાઇટ્રોક્રોમ b, ત્યારબાદ સાઇટ્રોક્રોમ c₁, સાઇટ્રોક્રોમ c અને છેલ્લે સાઇટ્રોક્રોમ aa₃ (કોમ્પ્લેક્સ IV) તરફ થાય છે, જ્યાં O₂ અંતિમ ઇલેક્ટ્રોન ગ્રાહક તરીકે કાર્ય કરે છે.", "tag": ""}, {"q": "પ્રાણીકોશિકા સંવર્ધન (Animal cell culture) માં 'હિબ્રિડોમા' બનાવવા માટે કયા બે પ્રકારના કોષોને મિશ્રિત કરવામાં આવે છે?", "opts": ["B-લિંફોસાઇટ અને માર્મિક કancer કોષ (Myeloma cell)", "T-લિંફોસાઇટ અને બેક્ટેરિયલ કોષ", "નેત્રક કોષ અને ત્વચા કોષ", "કેન્સર કોષ અને સ્વાભાવિક કILLER કોષ"], "correct": 0, "explain": "એક્ટિવ B-લિંફોસાઇટ (જે ચોક્કસ પ્રતિકાય બનાવે છે પણ લાંબો સમય પોપ્યુલેશનમાં જીવતો નથી) ને અમર (immortal) માર્મિક કancer કોષ સાથે મિશ્રિત કરી હિબ્રિડોમા બનાવવામાં આવે છે. આ હિબ્રિડોમા એક સાથે પ્રતિકાય બનાવવાની અને અમરત્વની ગુણધર્મ ધરાવે છે, જે Monoclonal Antibody ઉત્પાદન માટે મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "ઇન્ટરફેરોન (Interferon) નીચેનામાંથી કયા ક્ષેત્રમાં કાર્યરત હોય છે?", "opts": ["વાયરલ સંક્રમણ વિરુદ્ધ કોષીય પ્રતિકાર વધારનારા પ્રોટીન તરીકે", "બેક્ટેરિયલ સંક્રમણમાં પ્રાણીકોષની દીવાળ બનાવનારા", "વાયરસના કવચને તોડનારા એન્ઝાઇમ તરીકે", "રક્તકણોના ઉત્પાદનમાં હાડકાનું મજ્જા પ્રોત્સાહિત કરનારા હોર્મોન તરીકે"], "correct": 0, "explain": "ઇન્ટરફે let idx = 0;

let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){

    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +

        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

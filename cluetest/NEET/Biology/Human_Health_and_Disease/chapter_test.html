<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Health and Disease — 📊 Chapter Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "વિશ્વ આરોગ્ય સંસ્થા (WHO) મુજબ 'સ્વાસ્થ્ય' (Health) ની વ્યાખ્યા કઈ છે?", "opts": ["સ્વાસ્થ્ય એ શારીરિક, આભાસિક (Mental) અને સામાજિક સુખાકારીની સ્થિતિ છે, ન કે ફક્ત રોગ કે અવયવોનો દોષનો અભાવ.", "સ્વાસ્થ્ય એટલે શરીરમાં કોઈ પણ રોગનું હુંટાડું ન હોવું અને સરળતાથી કામ કરી શકવું.", "સ્વાસ્થ્ય એટલે માત્ર શારીરિક સ્િિતિ સારી હોવી, આભાસિક કે સામાજિક સ્િિિતિ માત્ર ચાલુ હોવી.", "સ્વાસ્થ્ય એટલે રોગરહિત હોવું અને દિવસભર ઉર્જાવાન રહેવું."], "correct": 0, "explain": "WHO મુજબ સ્વાસ્થ્ય એટલે ફક્ત રોગ કે અવયવોનો દોષનો અભાવ નહીં, પણ શારીરિક (Physical), આભાસિક (Mental) અને સામાજિક (Social) સુખાકારીની સંપૂર્ણ સ્થિતિ.", "tag": ""}, {"q": "કરોડરજ્જુગત (Nervous system) ના રોગોમાં આવેલો નોંધપાત્ર ધોરણ કયો છે?", "opts": ["તમણુ (Tetanus) અને એન્સેફાલાઈટિસ (Encephalitis)", "મેલેરિયા અને ડેન્ગ્યુ", "ઍલર્જી અને આસ્થમા", "ટાઈફોઇડ અને ટ્યુબર્ક્યુલોસિસ"], "correct": 0, "explain": "તામારો (Tetanus) અને એન્સેફાલાઈટિસ (Encephalitis) — આ બન્ને નર્વસ તંત્રને પીડિત કરનારા રોગ છે. તમણુ ક્લોસ્ટ્રિડિયમ ટેટાઈ (Clostridium tetani) જેવા જીવાણુને કારણે થાય છે, જ્યારે એન્સેફાલાઈટિસ મગજની સોજો છે.", "tag": ""}, {"q": "રોગકારક (Pathogen) માનવ શરીરમાં પ્રવેશે તે પહેલાંનો સમયગાળો કઈ શબ્દથી ઓળખાય છે?", "opts": ["લાંચાકાળ (Incubation period)", "ઉપચારકાળ (Therapeutic period)", "પુનર્વસાહકાળ (Rehabilitation period)", "પ્રતિરક્ષાકાળ (Immunization period)"], "correct": 0, "explain": "રોગકારક શરીરમાં પ્રવેશે અને લક્ષણો દેખાડે તે વચ્ચેના સમયગાળાને 'લાંચાકાળ' (Incubation period) કહે છે. આ કાળ દરમિયાન રોગના લક્ષણો દેખાડતા નથી.", "tag": ""}, {"q": "નીચેમાંથી કયો રોગ રક્તપૂરક (Blood-borne) પ્રસાર દ્વારા થાય છે?", "opts": ["B-પ્રકારનું યકૃત સોજો (Hepatitis B)", "પ્ન્યુમોનિયા (Pneumonia)", "ટાઈફોઇડ (Typhoid)", "મેલેરિયા (Malaria)"], "correct": 0, "explain": "B-પ્રકારનું યકૃત સોજો (Hepatitis B) એ રક્ત (Blood), લිંગસંપર્ક (Sexual contact) અને માતૃ-સન્તાન (Mother-to-child) પ્રસાર દ્વારા થાય છે. તે રક્તપૂરક રોગ ગણાય.", "tag": ""}, {"q": "ટાઈફોઇડ (Typhoid) રોગનું કારણભૂત જીવાણુ કયુ છે?", "opts": ["સેલ્મોનેલા ટાઈફાઈ (Salmonella typhi)", "વેરિયોલા વાયરસ (Variola virus)", "પ્લાઝ્મોડિયમ વેલેન્સ (Plasmodium vivax)", "કોલેરા વાયરો (Vibrio cholerae)"], "correct": 0, "explain": "ટાઈફોઇડ રોગનું કારણભૂત જીવાણુ 'સેલ્મોનેલા ટાઈફાઈ' (Salmonella typhi) છે. આ જીવાણુ પ્રદૂષિત પાણી અને ખોરાક દ્વારા મળી જાય છે અને આંતરડામાં પ્રવેશીને રોગ પેદા કરે છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ સ્થિતિ એ 'આરોગ્ય' (Health) ની વ્યાખ્યા મુજબ ગણાશે?", "opts": ["રોગોથી મુક્તિ અને શારીરિક, માનસિક તથા સಾಮાજિક સમૂહલક્ષી સુખાકારી", "કેવળ રોગોનો અભાવ", "શારીરિક રીતે મજબૂત અને કોઈ પણ પ્રકારની માનસિક તણાવરહિત સ્થિતિ", "રક્તચાપ, રક્તગ્લુકોઝ અને ઉષ્મા દર ધોરણ પર હોય તેવી શારીરિક સ્થિતિ"], "correct": 0, "explain": "વિશ્વ આરોગ્ય સંસ્થા (WHO) મુજબ આરોગ્ય એટલે ફકત રોગોનો અભાવ નહીં, પરંતુ શારીરિક, માનસિક અને સಾಮાજિક સુખાકારીની સંપૂર્ણ સ્થિતિ.", "tag": ""}, {"q": "માણસમાં ટાઈફોઇડ (Typhoid) રોગનું કારણભૂત જીવકણ કયું છે?", "opts": ["સેલ્મોનેલ્લા ટાયફી (Salmonella typhi)", "વેરિયોલા વાયરસ (Variola virus)", "પ્લાઝમોડિયમ વેક્સિફેરા (Plasmodium vivax)", "વિબ્રિઓ કોલેરા (Vibrio cholerae)"], "correct": 0, "explain": "ટાઈફોઇડ રોગ સેલ્મોનેલ્લા ટાયફી નામના બેક્ટેરિયા દ્વારા થાય છે. આ બેક્ટેરિયા પ્રદૂષિત ખોરાક/પાણી દ્વારા શરીરમાં પ્રવેશે છે અને આંતરાની ભિત્તિને પ્રભાવિત કરે છે.", "tag": ""}, {"q": "માલેરિયા (Malaria) રોગ પેદા કરતો પરોપજીવી કયો છે?", "opts": ["પ્લાઝમોડિયમ (Plasmodium)", "ટ્રાઇકોમોનાસ (Trichomonas)", "લેશમેનિયા (Leishmania)", "એન્ટામીબા (Entamoeba)"], "correct": 0, "explain": "માલેરિયા રોગ પ્લાઝમોડિયમ પ્રજાતિઓ (P. falciparum, P. vivax, P. malariae, P. ovale) દ્વારા થાય છે. આ સૂક્ષ્મજંતુ એનોફિલિસ (Anopheles) માદા માચર દ્વારા માણસમાં પ્રવેશે છે.", "tag": ""}, {"q": "નીચેમાંથી કયો રોગ 'અસ્કેરિયાસિસ' (Ascariasis) છે?", "opts": ["ગોળકૃમિ દ્વારા થતો પરોપજીવી રોગ", "બેક્ટેરિયલ આંતરડા રોગ", "વાયરલ યકૃતરોગ", "ક્ષયરોગ"], "correct": 0, "explain": "અસ્કેરિયાસિસ એસ્કેરಿಸ લોમબ્રિકોઇડ્સ (Ascaris lumbricoides) નામની ગોળકૃમિ દ્વારા થાય છે. આ રોગ પ્રદૂષિત ખોરાક/પાણી દ્વારા ફેલાય છે અને આંતરડામાં પરોપજીવી જીવન જીવે છે.", "tag": ""}, {"q": "બેક્ટેરિયલ રોગોમાં 'ટ્યુબર્ક્યુલોસિસ' (Tuberculosis / TB) નું કારણ કયું છે?", "opts": ["માਈકોબેક્ટેરિયમ ટ્યુબર્ક્યુલોસિસ (Mycobacterium tuberculosis)", "સ્ટેફાઈલોકોકસ ઓરિસ (Staphylococcus aureus)", "Neisseria meningitidis", "Haemophilus influenzae"], "correct": 0, "explain": "ટ્યુબર્ક્યુલોસિસ (ક્ષય) રોગ માઈકોબેક્ટેરિયમ ટ્યુબર્ક્યુલોસિસ બેક્ટેરિયા દ્વારા થાય છે. આ રોગ શ્વસનઅંગો (ફેફડાં) અને અન્ય અંગોને પણ પ્રભાવિત કરે છે.", "tag": ""}, {"q": "એન્ટેરામીબા હિસ્ટોલિટિકા દ્વારા થતો અમીબિયાસિસ (Amoebiasis) રોગ મુખ્યત્વે નીચેનામાંથી કયા અંગપ્રણાલીને આક્રમણ કરે છે અને તેના લક્ષણો તરીકે શું જોવા મળે છે?", "opts": ["મળ-મૂત્ર પ્રણાલી; સતત તાવ અને શરદરૂ", "અન્નનળી; ઝાડા અને ઉલટી", "પાચનતંત્ર (કૃમિપટલ); લહુડા ઝાડા (bloody diarrhoea) અને પેટના ખીલવાનો રોગ", "તાંબા (respiratory); ડસકી અને છાતીનો દુખાવો"], "correct": 2, "explain": "એન્ટેરામીબા હિસ્ટોલિટિકા મુખ્યત્વે આંતરડાને (પાચનતંત્ર) આક્રમણ કરે છે, જેના પરિણામે 'લહુડા ઝાડા' (bloody diarrhoea) અને પેટના ખીલવાનો રોગ — આ બે મુખ્ય લક્ષણો જોવા મળે છે. ભારતમાં આ એક સામાન્ય પેરઝિટિક સંક્રમણ છે.", "tag": ""}, {"q": "ફિલારીસિસ (Filariasis / Elephantiasis) સંબંધિત નીચેનામાંથી કયો વિધાન સાચો છે?", "opts": ["આ રોગ વહનકર્તા માદા એન્ઑફેલીસ (Anopheles) માછરું કરતાં આવે છે.", "આ રોગનું કારણ થરિન્સેરિયલ ફિલારીવાય (Wuchereria bancrofti) નામનું કૃમિ છે જે લસિકાતંત્રને જ આક્રમણ કરે છે.", "ફિલારીસિસ માટેની ટીકા ઉપલબ્ધ છે અને તે રક્તપૂરક રીતે પૂરું પાડવામાં આવે છે.", "ફિલારીસિસ માત્ર વ્યક્તિથી વ્યક્તિને સીધા સંપર્કથી પ્રસરે છે, માછરૂં વહનકર્તા નથી."], "correct": 1, "explain": "ફિલારીસિસનું કારણ થરિન્સેરિયલ ફિલારીવાય (Wuchereria bancrofti) નામનું કૃમિ છે જે લસિકાતંત્ર (lymphatic system) ને આક્રમણ કરે છે અને એલિફેન્ટિયાસિસ (અંગુલી વિસ્તરણ) કરાવે છે. વહનકર્તા માદા 'સિયુલક્ષ' (Culex) માછરું છે, એન્ઑફેલીસ નહીં, અને આ રોગ માટે હજુ સુધી કોઈ ટીકા ઉપલબ્ધ નથી.", "tag": ""}, {"q": "પ્લાઝ્મોડિયમ (Plasmodium) જીવતંત્રુ દ્વારા થતા મેલેરિયા (Malaria) સંબંધે નીચેનામાંથી કયો વિધાન અસત્ય છે?", "opts": ["પ્લાઝ્મોડિયમનો જીવનચક્ર માનવ શરીરમાં માત્ર રક્તકણોમાં (RBCs) જ પૂરો થાય છે.", "પ્લાઝ્મોડિયમની ઇન્ફેક્ટિવ મેરોઝોઇટ્સ (merozoites) લિવર (યકૃત) કોષોને પ્રથમ ચેપ આપે છે.", "મધુમાહિની (fever) ચક્રવાતી લક્ષણ પ્રદર્શિત કરે છે, કેમકે રક્તકણો ફાટીને હિસ્ટામાઇન્સ મુક્ત કરે છે.", "પ્લાઝ્મોડિયમના ગેમેટોસાઇટ્સ (gametocytes) માછરૂંના આંતરડામાં નિષ્પાદક (sexual reproduction) દ્વારા બને છે."], "correct": 0, "explain": "પ્લાઝ્મોડિયમનો જીવનચક્ર માનવ શરીરમાં માત્ર રક્તકણોમાં જ પૂરો થતો નથી — પ્રથમ ચેપ યકૃત (liver) કોષોને થાય છે, ત્યારબાદ જ ગેમેટોસાઇટ્સ રક્તકણોમાં બને છે અને માછરૂંને ચેપ આપે છે. આથી વિધાન A અસત્ય છે.", "tag": ""}, {"q": "મેલેરિયા રોગના નિદાન સંબંધે નીચેનામાંથી કયો પ્રશ્નોત્તર સૌથી વધુ મહત્વપૂર્ણ સાચી માહિતી આપે છે?", "opts": ["રક્તના નમૂનામાં પ્લાઝ્મોડિયમના ગેમેટોસાઇટ્સ શોધવા માટે હિસ્ટોપેથોલોજિકલ ફેરફારો જોવામાં આવે છે.", "મેલેરિયાનું મુખ્ય નિદાન પેરિફેરલ બ્લડ સ્મિયર (peripheral blood smear) દ્વારા રક્તકણોમાં પ્લાઝ્મોડિયમની ઉપસ્થિતિ તપાસીને કરવામાં આવે છે.", "મેલેરિયાનું નિદાન માત્ર મળના નમૂનામાંથી જ કરી શકાય છે.", "મહત્વનું એ છે કે પ્લાઝ્મોડિયમના ફેરફારો મૃત શરીરકણોમાં જોવા મળે છે, જીવંત કોષોમાં નહીં."], "correct": 1, "explain": "મેલેરિયાનું પ્રાથમિક નિદાન પેરિફેરલ બ્લડ સ્મિયર (પરિધિ રક્ત પડદા) દ્વારા કરવામાં આવે છે, જેમાં રક્તકણો (RBCs) માં પ્લાઝ્મોડિયમના પેરાસાઇટ્સ શોધવામાં આવે છે. બીજા વિકલ્પો ભ્રામક માહિતી ધરાવે છે.", "tag": ""}, {"q": "વહનકર્તા (Vector) — રોગકારકના પ્રસારણમાં ભૂમિકા: નીચેનામાંથી કયો સરખામણીક જોડ સાચો છે?", "opts": ["પ્લાઝ્મોડિયમ → સિયુલક્ષ (Culex) માછરૂં; વચરીસેલા (Chagas disease) → એન્ઑફેલીસ (Anopheles)", "પ્લાઝ્મોડિયમ → માદા એન્ઑફેલીસ (Anopheles) માછરૂં; વચરીસેલા (Chagas disease) → ટ્રિપ્ટોમેટા (Triatominae) બગ", "પ્લાઝ્મોડિયમ → માદા એન્ઑફેલીસ (Anopheles) માછરૂં; મેસેરિયાસિસ (Mucormycosis) → સિયુલક્ષ (Culex)", "વચરીસેલા (Chagas disease) → સિયુલક્ષ (Culex) માછરૂં; મેલેરિયા → એન્ઑફેલીસ (Anopheles) માછરૂં"], "correct": 1, "explain": "પ્લાઝ્મોડિયમ (મેલેરિયા) નું વહનકર્તા 'માદા એન્ઑફેલીસ' (female Anopheles) માછરૂં છે, જ્યારે વચરીસેલા (Chagas disease) નું વહનકર્તા 'ટ્રિપ્ટોમેટા' (Triatominae) બગ (અશ્વટી બગ) છે. બીજા જોડ ભ્રામક છે — Mucormycosis ફાંગસ સંક્રમણ છે, તેનું વહનકર્તા નથી.", "tag": ""}, {"q": "માનવ શરીરમાં રોગકારક જીવાણુઓના પ્રવેશ અટકાવવામાં 'ચામડી' કઈ રક્ષણાત્મક પ્રણાલી હેઠળ આવે છે?", "opts": ["ભૌતિક બંધનો (Physical barriers)", "કોષીય બંધનો (Cellular barriers)", "રાસાયણિક બંધનો (Chemical barriers)", "સક્રિવ પ્રતિરક્ષા (Active immunity)"], "correct": 0, "explain": "ચામડી શરીરનું સૌથી મુખ્ય ભૌતિક બંધન છે. તે રોગકારક જીવાણુઓ માટે એક અવરોધ તરીકે કામ કરે છે અને તેમને શરીરમાં પ્રવેશતા અટકાવે છે.", "tag": ""}, {"q": "નીચેમાંથી કઈ પ્રક્રિયા દરમિયાન ન્યુટ્રોફાઇલ્સ (Neutrophils) અને મેક્રોફેજ્સ (Macrophages) રોગકારક જીવોનું સેવન કરે છે?", "opts": ["ફેગોસાઇટોસિસ (Phagocytosis)", "ઈમ્યુનોગ્લોબ્યુલિન ઉત્પાદન (Antibody production)", "એલર્જિક પ્રતિક્રિયા (Allergic reaction)", "વાયરલ અટકાવ (Viral inhibition)"], "correct": 0, "explain": "ફેગોસાઇટોસિસ એ એક મહત્વપૂર્ણ કોષીય રક્ષણ પ્રણાલી છે જેમાં ન્યુટ્રોફાઇલ્સ અને મેક્રોફેજ્સ રોગકારક જીવાણુઓને પકડીને સેવન કરે છે અને નાશ કરે છે.", "tag": ""}, {"q": "સ્તનપાન દરમિયાન બાળકને પ્રાપ્ત થતી પ્રતિરક્ષા મુખ્યત્વે કયા પ્રકારની એન્ટીબડી દ્વારા મળે છે?", "opts": ["IgA", "IgE", "IgG", "IgM"], "correct": 0, "explain": "IgA એ ઝ્બર (Mucosa) સપાટીઓ પર રક્ષણ providing કરે છે અને યોનિમાર્ગ, માતૃ દૂધ અને શ્વાસનળીમાં મળે છે. બાળકને સ્તનપાન દ્વારા IgA પ્રાપ્ત થાય છે જે તેને સંક્રમણથી બચાવે છે.", "tag": ""}, {"q": "બીજા પ્રકારની એલર્જી (Type I hypersensitivity) સાથે સંકળાયેલી મુખ્ય એન્ટીબડી કઈ છે?", "opts": ["IgE", "IgA", "IgG", "IgM"], "correct": 0, "explain": "IgE એન્ટીબડી બીજા પ્રકારની એલર્જિક પ્રતિક્રિયાઓ (Type I hypersensitivity) માટે જવાબદાર છે. જ્યારે શરીરમાં એલર્જન પ્રવેશે છે, ત્યારે IgE મસ્ત કોષો (Mast cells) ને સક્રિય કરે છે જેથી હિસ્ટામિન લાગુ પડે છે.", "tag": ""}, {"q": "શરીરમાં સક્રિવ પ્રતિરક્ષા (Active immunity) મેળવવા માટેનું મુખ્ય કાર્યક્ષમ સાધન કયું છે?", "opts": ["ટીકાકરણ (Vaccination)", "એન્ટીબાયોટિક્સ (Antibiotics)", "ઝ્બર (Mucous membrane)", "ફેગોસાઇટોસિસ (Phagocytosis)"], "correct": 0, "explain": "ટીકાકરણ (Vaccination) દ્વારા શરી     if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

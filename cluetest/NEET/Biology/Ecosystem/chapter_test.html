<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecosystem — 📊 Chapter Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "ઈકોસિસ્ટમનું મૂળભૂત ગાંઠબિંદુ (functional unit) કયું છે?", "opts": ["સજીવો અને તેમના અજીવજડ પરિસ્થિતિકીય પરિબળો વચ્ચેની ક્રિયા-પ્રતિક્રિયા", "માત્ર ઉત્પાદકોનો સમૂહ", "શુદ્ધ પ્રાણીઓનો સમૂહ", "કેવળ અન્ય શ્વસન કરતા જીવોનો સમૂહ"], "correct": 0, "explain": "ઈકોસિસ્ટમ એટલે જીવંત (બાયોટિક) અને અજીવંત (એબાયોટિક) પરિબળો વચ્ચેની આંતરક્રિયાનું એકમ, જે ભોજન શૃંખલા, પોષક ચક્ર અને ઊર્જા પ્રવાહ દ્વારા સંચાલિત થાય છે.", "tag": ""}, {"q": "નોવેલ એકવાદનું નિરૂપણ કાણે કર્યું હતું?", "opts": ["આર્થર ટન્સલે (Arthur Tansley)", "ચાર્લ્સ ડાર્વિન (Charles Darwin)", "હેન્સ ડી. વર્સ (Hans D. Vernis)", "લિનિયસ (Linnaeus)"], "correct": 0, "explain": "ઈકોસિસ્ટમ શબ્દનો પ્રસ્તાવ 1935 માં ઇંગ્લેન્ડના વનસ્પતિ વિજ્ઞાની આર્થર ટન્સલેએ રાખ્યો હતો; તેમણે જીવંત અને અજીવંત પરિબળોના પરસ્પર સંબંધને ભેગા કરીને આ શબ્દ વાપર્યો હતો.", "tag": ""}, {"q": "ઈકોસિસ્ટમના 'અજીવંત' (એબાયોટિક) ઘટકોમાં કયા તત્વો સમાવિષ્ટ છે?", "opts": ["પ્રકાશ, તાપમાન, આર્દ્રતા, માટી અને ખनिज પોષક તત્વો", "ઉત્પાદકો, ખોરાક ખાનારાઓ અને વિઘટકો", "ફક્ત સસ્તન પ્રાણીઓ અને ઉભિદો", "ફક્ત લીલા પાદપોષક અને પર્ણખોર કીટાણુઓ"], "correct": 0, "explain": "અજીવંત ઘટકો એ ઊર્જા અને માધ્યમીય પરિસ્થિતિકીય પરિબળો છે; પ્રકાશ, તાપમાન, વરસાદ/આર્દ્રતા, માટીનો બનાવટ અને જૈવરસાયણિક પોષક ધાતુઓ એ અજીવંત ઘટકોના ઉદાહરણો છે.", "tag": ""}, {"q": "ઈકોસિસ્ટમના 'જીવંત' (બાયોટિક) ઘટકોની શ્રેણીબદ્ધ વહેંચણી કઈ રીતે કરવામાં આવે છે?", "opts": ["ઉત્પાદકો (પ્રોડ્યુસર્સ), ખોરાક-ગ્રાહકો (કન્ઝ્યુમર્સ) અને વિઘટકો (ડિટ્રાઇટર્સ)", "ખોરાક-ખાનારા, પરભક્ષકો અને સ્પર્ધકો", "શ્વસનકર્તા, પ્રકાશસંશ્લેષણકર્તા અને અતિરિક્તજીવી", "પ્રાણી, વનસ્પતિ અને સૂક્ષ્મજીવોનો અવ્યવસ્થિત સમૂહ"], "correct": 0, "explain": "બાયોટિક ઘટકોને ઉત્પાદકો (લીલા પાદપ), ગ્રાહકો (પાદપ-અથવા માંસાહારી પ્રાણીઓ) અને વિઘટકો (બેક્ટેરિયા/અનુપરાંત) તરીકે વર્ગીકૃત કરવામાં આવે છે; આ કાર્યકારી વિભાજન ઊર્જા-પ્રવાહ અને પોષક ચક્રની સમજ સુવ્યવસ્થિત કરે છે.", "tag": ""}, {"q": "ઈકોસિસ્ટમ અಧ્યાયની શરૂઆતમાં પર્યાવરણીય પરિબળો (environmental factors) નું શું વર્ણન કરવામાં આવે છે?", "opts": ["જીવંત સજીવો પર સીધી અસર કરનારા ભૌતિક અને રાસાયણિક પરિબળો તરીકે", "શુદ્ધ પ્રાણીવર્ગનું વલણ", "માત્ર જૈવિક સ્પર્ધાનું માપ", "કોઈ પણ પ્રકારના આંતરસંબંધનું નિરૂપણ કરતી વાત"], "correct": 0, "explain": "ઈકોસિસ્ટમમાં પ્રકાશ, તાપમાન, વરસાદ, ભૂમિ/માટી વગેરે પર્યાવરણીય પરિબળોનો ઉલ્લેખ થાય છે; આ ભૌતિક-રાસાયણિક પરિબળો બાયોટિક ઘટકોના વિતરણ, વર્તન અને કાર્યપ્રણાલીને નિયંત્રિત કરે છે.", "tag": ""}, {"q": "ડિટ્રાઇટસ (શ્મશાન પદાર્થ) ના વિઘટન પ્રક્રિયામાં, ભૂખરી સરૂં (earthworm) દ્વારા કરવામાં આવતી પ્રક્રિયા કઈ છે?", "opts": ["ખંડન (Fragmentation)", "વિયોજન (Catabolism)", "અવલેખન (Leaching)", "ખનિજીકરણ (Mineralisation)"], "correct": 0, "explain": "ભૂખરી સરૂં ડિટ્રાઇટસને લઘુકણ કણોમાં વિભાજિત કરે છે, જેને ખંડન (Fragmentation) કહે છે. આ વિઘટનની પ્રથમ તબક્કાકીય પ્રક્રિયા છે, જે ફલાઇ માંસાહારી ઈયળો, સૂક્ષ્મજીવો દ્વારા અનુસરવામાં આવે છે.", "tag": ""}, {"q": "પોષણ ચક્ર (Nutrient Cycling) માંથી કયો બાયોજિયોકેમિકલ સાયકલ 'વાતાવરણભાગ' (Atmospheric reservoir) ધરાવતો નથી?", "opts": ["ફોસ્ફરસ ચક્ર", "કાર્બન ચક્ર", "નાઇટ્રોજન ચક્ર", "સલ્ફર ચક્ર"], "correct": 0, "explain": "ફોસ્ફરસ ચક્રમાં વાતાવરણભાગ નથી હોતો; તે મુખ્યત્વે ખડકો અને મણકામાં (sediments) સંગ્રહિત રહે છે. બાકીના ત્રણેય ચક્રો — કાર્બન, નાઇટ્રોજન અને સલ્ફર — માં વાતાવરણ મુખ્ય જથ્થાબંધ ભંડોળ તરીકે ભાગ ભજવે છે.", "tag": ""}, {"q": "સનાતન અનુક્રમણ (Climax community) નું નિરૂપણ કઈ યાદૃચ્છિક (random) પ્રકૃતિ ધરાવે છે?", "opts": ["મોનોક્લિમાક્સ", "પોલિક્લિમાક્સ", "પ્લાન્ટ ક્લિમાક્સ", "ક્લિમેટ ક્લિમાક્સ"], "correct": 1, "explain": "પોલિક્લિમાક્સ (Polymax) સિદ્ધાંત મુજબ, એકલો ક્લિમાક્સ સમુદાય વૈવિધ્યપૂર્ણ પર્યાવરણીય પરિબળોને કારણે વળાંકો શકે છે — એટલે કે અનુક્રમણ એક જ અંતિમ સ્થિતિ પર દૂધી શકતું નથી. આ યાદૃચ્છિક (multiple endpoints) દૃષ્ટિ છે.", "tag": ""}, {"q": "બેલ્ટ્રાન્ડ (Baeltrand) દ્વારા અભ્યાસ કરવામાં આવેલી જલ અનુક્રમણ (Hydrosere) માં, કયા તબક્કા બાદ 'રિડ' (Reed–Swamp) તબક્કો આવે છે?", "opts": ["ખુલ્લા પાણીનો તબક્કો (Open water stage)", "સ્લઘાટ તબક્કો (Submerged stage)", "પુલ્વિનેશિયન તબક્કો (Pioneer stage)", "ઘાસવાળો તબક્કો (Marsh–meadow stage)"], "correct": 0, "explain": "બેલ્ટ્રાન્ડના જલ અનુક્રમણ ક્રમ મુજબ: પુલ્વિનેશિયન → સ્લઘાટ → તરતી છોડ તબક્કો → ખુલ્લા પાણીનો તબક્કો → રિડ–સ્વેમ્પ તબક્કો આવે છે. તેથી ખુલ્લા પાણીના તબક્કા બાદ રિડ–સ્વેમ્પ તબક્કો આવે છે.", "tag": ""}, {"q": "ઉત્પાદકતા (Productivity) ના સંદર્ભમાં, 'નેટ પ્રાથમિક ઉત્પાદકતા' (NPP) નો સંબંધ કયા સૂત્રથી થાય છે?", "opts": ["NPP = GPP – R (શ્વસન ભટકણ)", "NPP = GPP + R", "NPP = GPP × R", "NPP = R – GPP"], "correct": 0, "explain": "નેટ પ્રાથમિક ઉત્પાદકતા એટલે કુલ પ્રાથમિક ઉત્પાદકતા (GPP) માંથી ઉત્પાદકોના શ્વસન (R) દ્વારા થતી ઊર્જા ખર્ચ બાદ બચત. NPP = GPP – R, જે પરભક્ષકો અને વિઘટકો સુધી ઉપલબ્ધ રહે છે.", "tag": ""}, {"q": "પારિસ્થિતિક ક્રમિકતા (Ecological Succession) ના સંદર્ભમાં, નીચેનામાંથી કયો દ્વિતીયક અનુક્રમણ (Secondary succession) ની વિશિષ્ટતા નથી?", "opts": ["આ પ્રકારનું અનુક્રમણ કોઈ પણ જગ્યાએ થઈ શકે છે જ્યાં પૂર્વે કોઈ સમુદાય રહ્યો હોય.", "આ પ્રક્રિયામાં મૂળભૂત પરતિસ્થિતિઓ (પ્રાથમિક પરિસ્થિતિઓ) સૌથી પ્રથમ ઉભી થાય છે.", "આ પ્રકારનું અનુક્રમણ માટી અને બીજના ખજાનાની સ્થિતિ સાથે શરૂ થાય છે.", "આ પ્રક્રિયા કાટખોર (Fire), અવલોકન (Clearing) અથવા ખેતી-આધારિત પ્રવૃત્તિ પછી થાય છે."], "correct": 1, "explain": "પ્રાથમિક પરતિસ્થિતિઓ (Pioneer community) દ્વિતીયક અનુક્રમણમાં શરૂઆતમાં નથી હોતા; તેઓ માત્ર પ્રાથમિક અનુક્રમણ (Primary succession) માં જ પ્રથમ સ્થાપિત થાય છે. દ્વિતીયક અનુક્રમણમાં માટી અને બીજનો ખજાનો પહેલેથી જ વિદ્યમાન હોય છે, જેના કારણે આ પ્રક્રિયા પ્રાથમિક અનુક્રમણ કરતાં ઝડપી હોય છે.", "tag": ""}, {"q": "શુષ્કપ્રદેશીય અનુક્રમણ (Xerosere) માં પ્રારંભિક સાયક્લોનિક લાઇકેન સમુદાય (Crustose lichen stage) પછી આવતો અનુક્રમણ કયો છે?", "opts": ["સમૂહબદ્ધ માંસળ (Moss community)", "ફોલિયોસ લાઇકેન સમુદાય (Foliose lichen community)", "વાર્ષિક બધી (Annual herb stage)", "વનસ્પતિ સમુદાય (Shrub community)"], "correct": 1, "explain": "શુષ્કપ્રદેશીય અનુક્રમણમાં (Xerosere on rock) અનુક્રમણનો ક્રમ છે: સાયક્લોનિક લાઇકેન → ફોલિયોસ લાઇકેન → માંસળ સમુદાય → વાર્ષિક બધી → પરિવારો (Perennial herbs) → ઉદ્ભિદ (Shrubs) → વન સમુદાય. પ્રથમ સાયક્લોનિક લાઇકેન પછી ફોલિયોસ લાઇકેન સમુદાય આવે છે, ન કે સીધો માંસળ સમુદાય.", "tag": ""}, {"q": "પારિસ્થિતિક ઉર્જા પાયરમિડ (Pyramid of Energy) માટે નીચેમાંથી કયો દાવો સાચો નથી?", "opts": ["ઉર્જા પાયરમિડ કદાચ ક્યારેય ઉલ્ટો (Inverted) હોઈ શકે નહીં.", "ઉર્જા પાયરમિડમાં દરેક સ્તર પર ઉર્જાની માત્રા સમક્ષિતિજ રેખા (Bar) દ્વારા દર્શાવવામાં આવે છે.", "ઉર્જા પાયરમિડને હંમેશા ઊભો (Upright) જ મળે છે, કારણ કે ઉર્જાનું વિતરણ હંમેશા એક दिशाમાં થાય છે.", "ઉર્જા પાયરમિડમાં ઉત્પાદક સ્તર પરથી ઉપરના સ્તરો તરફ ઉર્જાનું પ્રમાણ વધે છે."], "correct": 3, "explain": "ઉર્જા પાયરમિડમાં ઉત્પાદક સ્તર (Producer level) પરથી ઉપરના સ્તરો (ઉચ્ચ પોષણ સ્તરો) તરફ ઉર્જાનું પ્રમાણ ઘટતું જાય છે, વધતું નથી. આ 10% નિયમના કારણે છે — દરેક પોષણ સ્તર પર ~90% ઉર્જા ઉષ્મા સ્વરૂપે ખોવાઈ જાય છે. તેથી D વિકલ્પ ભૂલભરેલો છે.", "tag": ""}, {"q": "બેલ્ટ્રાન્ડ (Baeltrand) દ્વારા સમુદ્રી (Marine) જળઅનુક્રમણ (Hydrosere) ના અભ્યાસ દરમિયાન, મૂળભૂત જળઅનુક્રમણના વિવિધ સમુદાયોમાં સૌથી પ્રથમ કયો સમુદાય સ્થાપિત થાય છે?", "opts": ["પ્લાંકટોનિક સમુદાય (Planktonic community)", "પ્રવાહી જળ સમુદાય (Submerged floating community)", "પલાશ સ્થિર જળ સમુદાય (Free floating community)", "બહુવર્ષી ઘાસ સમુદાય (Herbaceous marsh meadow community)"], "correct": 0, "explain": "જળઅનુક્રમણ (Hydrosere) માં પ્લાંકટોનિક સમુદાય (સૂક્ષ્મ શೈવાલો) સૌથી પ્રથમ પ્લાંકટોનિક સમુદાય તરીકે પ્રવેશે છે, જે મૂળભૂત જળઅનુક્રમણનો પ્રથમ સ્તર છે. બેલ્ટ્રાન્ડના સમુદ્રી અભ્યાસમાં પણ આ જ ક્રમ અનુસરવામાં આવ્યો હતો.", "tag": ""}, {"q": "જળઅનુક્રમણ (Hydrosere) માં 'બહુવર્ષી ઘાસ સમુદાય' (Herbaceous marsh meadow community) પછી આવતો મુખ્ય સમુદાય કયો છે, જેના પછી અંતિમ સ્થિતિગત સમુદાય (Climax community) સ્થાપિત થાય છે?", "opts": ["પ્રવાહી જળ સમુદાય (Submerged floating plant community)", "ઉદ્ભિદ સમુદાય (Shrub community)", "વાર્ષિક બધી સમુદાય (Annual herb community)", "બહુવર્ષી ઘાસ સમુદાય પછી સીધો વન સમુદાય આવે છે."], "correct": 1, "explain": "જળઅનુક્રમણનું સામાન્ય અનુક્રમણ ક્રમ છે: પ્લાંકટોનિક સમુદાય → પ્રવાહી જળ સમુદાય (Submerged) → પલાશ સ્થિર જળ સમુદાય (Floating) → ટીપાંદાર જળ સમુદાય (Reed-swamp) → બહુવર્ષી ઘાસ સમુદાય (Marsh meadow) → ઉદ્ભિદ સમુદાય (Shrub) → વન સમુદાય (Forest = Climax). તેથી બહુવર્ષી ઘાસ સમુદાય પછી ઉદ્ભિદ સમુદાય આવે છે.", "tag": ""}, {"q": "કાર્બન ચક્રમાં, વાયુગોળ (Atmosphere) માં કાર્બન મુખ્યત્વે કયા સ્વરૂપમાં સંગ્રહાયેલ છે?", "opts": ["કાર્બન ડાયોક્સાઇડ (CO₂)", "કાર્બન મોનોક્સાઇડ (CO)", "કાર્બોનેટ ખનીજો", "મિથેન (CH₄)"], "correct": 0, "explain": "વાયુગોળમાં કાર્બનનો મુખ્ય સંગ્રહ કાર્બન ડાયોક્સાઇડ (CO₂) ના રૂપમાં થાય છે. પ્રકાશસંશ્લેષણ દ્વારા છોડ CO₂ નું શોષણ કરે છે અને શ્વાસક્રિયા તથા વિઘટન દ્વારા તે ફરી વાયુગોળમાં પરત આવે છે.", "tag": ""}, {"q": "નાઈટ્રોજન ચક્રમાં, વાયુગોળના નાઈટ્રોજન (N₂) ને અમામોનિઆ (NH₃) માં રૂપાંતરિત કરવા માટે કયું ઉત્સેચક જવાબદાર છે?", "opts": ["નાઈટ્રોજેનેઝ", "નાઈટ્રોજેનેઝ સંયોજક", "નાઈટ્રેટ રિડક્ટેઝ", "અમામોનિયા મોનોઑક્સિજેઝ"], "correct": 0, "explain": "નાઈટ્રોજેનેઝ ઉત્સેચક નાઈટ્રોજન સ્થાપક સૂક્ષ્મજીવો દ્વારા ઉત્પન્ન થાય છે અને તે N₂ ને NH₃ માં રૂપાંતરિત કરે છે. આ પ્રક્રિયાને નાઈટ્રોજન સ્થાપન કહેવાય છે.", "tag": ""}, {"q": "પોષણ ચક્રોમાંથી કયું તત્વ સમાધિ (Sedimentary) ચક્ર દર્શાવે છે અને તેની હવામાન (Atmospheric) સંગ્રહક્ષમતા નહિવત હોય છે?", "opts": ["ફોસ્ફરસ", "નાઈટ્રોજન", "કાર્બન", "ઓક્સિજન"], "correct": 0, "explain": "ફોસ્ફરસ ચક્ર સમાધિ પ્રકારનું છે, કારણ કે તેનું મુખ્ય સંગ્રહ પથ્થરો, ખનીજો અને સમુદ્રના તળિયેના અધ:સ્થિત પરાણુઓમાં થાય છે. તેની હવામાનમાં મહત્વપૂર્ણ સંગ્રહક્ષમતા નથી.", "tag": ""}, {"q": "ફોસ્ફરસ ચક્રમાં, છોડો પાણીમાંથી (જમીનના દ્રાવણમાંથી) ફોસ્ફરસ કયા સ્વરૂપમાં શોષણ કરે છે?", "opts": ["ફોસ્ફેટ આયન (PO₄³⁻)", "ફોસ્ફિન (PH₃)", "ફોસ્ફરીક એસિડ (H₃PO₄)", "પરફોસ્ફેટ આયન"], "correct": 0, "explain": "ફોસ્ફરસ ચક્રમાં, છોડો પાણીમાંથી ફોસ્ફેટ આયન (PO₄³⁻) ના સ્વરૂપમાં ફોસ્ફરસનું શોષણ કરે છે. જલીય પારિસિથિતિક તંત્રોમાં આ સ્વરૂપ જીવંત ઘટકો માટે સૌથી વધુ ઉપલબ્ધ હોય છે.", "tag": ""}, {"q": "કાર્બન ચક્રમાં, પ્રાણીઓ વાયુગોળમાં કાર્બનનું પુનઃસ્થાપન કઈ પ્રક્રિયાઓ દ્વારા કરે છે?", "opts": ["શ્વાસક્રિયા અને વિઘટન", "પ્રકાશસંશ્લેષણ", "નાઈટ્રિફિકેશન", "નાઈટ્રોજન સ્થાપન"], "correct": 0, "explain": "પ્રાણીઓ શ્વાસક્રિયા દ્વારા કાર્બન ડાયોક્સાઇડ (CO₂) મુક્ત કરે છે. મૃત પ્રાણીઓ અને છોડના વિઘટન દ્વારા પણ કાર્બન વાયુગોળમાં પરત આવે છે. પ્રકાશસંશ્લેષણ તો CO₂ શોષે છે, મુક્ત કરતું નથી.", "tag": ""}, {"q": "પ્રાણિગોષ્ઠ (Ecosystem) સેવાઓમાંથી 'ક્લાઇમેટ રેગ્યુલેશન' નીચેમાં માંથી કયા કાર્યને દર્શાવે છે?", "opts": ["ગ્રીનહાઉસ વાયુઓ અને તાપમાનનું સંતુલન જાળવી રાખવું", "જમીનનું બનવું અને વળતર આપવું", "પાણીનું શુદ્ધિકરણ અને સંગ્રહ", "પરાગણ અને બીજ વિતરણ કરવી"], "correct": 0, "explain": "ક્લાઇમેટ રેગ્યુલેશન એ પ્રાણિગોષ્ઠની એક મહત્વની સેવા છે જેમાં ગ્રીનહાઉસ વાયુઓના દળ અને વિશ્વ તાપમાનનું સંતુલન જાળવવામાં આવે છે. ઉદાહરણ તરીકે, વાઘડિયા (Forest) પ્રદેશો CO₂ શોષી લે છે અને વાતાવરણનો ઉષ્મીય સંતુલન જાળવે છે.", "tag": ""}, {"q": "નાઈટ્રોજન ચક્રમાં, વાયુગોળના N₂ ને અમોનિઆ (NH₃) માં પરિવર્તિત કરતી પ્રક્રિયાનું નામ શું છે?", "opts": ["નાઈટ્રોજન સ્થાપન (Nitrogen Fixation)", "નાઈટ્રિફિકેશન (Nitrification)", "એનાક્સિંગ (Denitrification)", "અમોનિફિકેશન (Ammonification)"], "correct": 0, "explain": "નાઈટ્રોજન સ્થાપન એવા બેક્ટેરિયા દ્વારા થાય છે જે વાયુગોળના N₂ ને રાસાયણિક રૂપથી સક્રિય કરી NH₃ માં પરિવર્તિત કરે છે. આ પ્રક્રિયા માટી અને સમુદ્રી બેક્ટેરિયા (જેમ કે Rhizobium, Cyanobacteria) દ્વારા થાય છે.", "tag": ""}, {"q": "નાઈટ્રિફિકેશન (Nitrification) પ્રક્રિયામાં કયા બેક્ટેરિયા સામેલ છે તે સાચું જોડાણ પસંદ કરો:", "opts": ["Nitrosomonas → NH₃ થી NO₂⁻ અને Nitrobacter → NO₂⁻ થી NO₃⁻", "Nitrobacter → NH₃ થી NO₂⁻ અને Nitrosomonas → NO₂⁻ થી NO₃⁻", "Rhizobium → NH₃ થી NO₃⁻ અને Azotobacter → NO₂⁻ થી NO₃⁻", "Pseudomonas → NO₃⁻ થી N₂ અને Nitrosomonas → NH₃ થી NO₂⁻"], "correct": 0, "explain": "નાઈટ્રિફિકેશન એ બે-પગલાંની પ્રક્રિયા છે. પ્રથમ, Nitrosomonas બેક્ટેરિયા અમોનિਆ (NH₃) નું ઑક્સિડેશન કરી નાઈટ્રાઈટ (NO₂⁻) બનાવે છે. ત્યારબાદ Nitrobacter બેક્ટેરિયા નાઈટ્રાઈટનું ઑક્સિડેશન કરી નાઈટ્રેટ (NO₃⁻) બનાવે છે, જે છોડો શોષી શકે છે.", "tag": ""}, {"q": "નાઈટ્રોજન ચક્રમાં, નાઈટ્રેટ (NO₃⁻) નું પાછું N₂ વાયુમાં રૂપાંતર કરતી પ્રક્રિયા કઈ કહેવાાય છે?", "opts": ["એનાક્સિંગ (Denitrification)", "નાઈટ્રોજન સ્થાપન (Nitrogen Fixation)", "અમોનિફિકેશન (Ammonification)", "નાઈટ્રિફિકેશન (Nitrification)"], "correct": 0, "explain": "એનાક્સિંગ એવા વિશિષ્ટ બેક્ટેરિયા (જેમ કે Pseudomonas અને Thiobacillus) દ્વારા થાય છે જે નાઈટ્રેટ (NO₃⁻) નું રિડક્શન કરી N₂ વાયુમાં પરિવર્તિત કરે છે. આ પ્રક્રિયા એરોબિક શરતોમાં થતી નથી પણ એનારોબિક પરિસ્થિતિઓમાં થાય છે, જેથી માટીમાં નાઈટ્રેટનું પ્રમાણ ઘટે છે.", "tag": ""}, {"q": "બાયોડિવર્સિટી (જૈવ વિવિધતા) પ્રાણિગોષ્ઠ સેવાઓના કયા વર્ગમાં આવે છે?", "opts": ["સંસ્કૃતિક સેવાઓ (Cultural Services)", "યામાયોગ્ય સેવાઓ (Supporting Services)", "સપ્લાય સેવાઓ (Provisioning Services)", "રેગ્યુલેશન સેવાઓ (Regulating Services)"], "correct": 1, "explain": "બાયોડિવર્સિટી એ 'યામાયોગ્ય સેવાઓ' (Supporting Services) માં આવે છે, કારણ કે આ સેવાઓ અન્ય બધી સેવાઓના આધાર તરીકે કામ કરે છે. જૈવ વિવિધતા પોષક તત્વોના ચક્ર, માટીનું બનવું અને પાણીના ચક્ર જેવી પ્રક્રિયાઓને સતત ચલાવી રાખવામાં મદદ કરે છે, જેની અસર બધી અન્ય પ્રાણિગોષ્ઠ સેવાઓ પર થાય છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

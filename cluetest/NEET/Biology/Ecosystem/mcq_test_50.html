<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecosystem — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

  <div class="hero">

  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>

</div>
<script>
const QUIZ = [{"q": "પ્રાણિગોષ્ઠી અને અપ્રાણિગોષ્ઠી એકબીજા સાથે ક્રિયાપ્રતિક્રિયા કરતાં કેટલાં પ્રમાણમાં બનેલી જૈવિક એકમને શું કહેવાય છે?", "opts": ["અનાજીવ ઘટકો (Abiotic factors)", "સજીવ ઘટકો (Biotic factors)", "પારિસ્થિતિકી (Ecosystem)", "આહાર શૃંખલા (Food chain)"], "correct": 2, "explain": "ઓડમ (Odam) ની વ્યાખ્યા મુજબ, સજીવો અને અસજીવ પર્યાવરણ વચ્ચેની ક્રિયાપ્રતિક્રિયાથી બનતું કાર્યકારી એકમ 'પારિસ્થિતિકી' (Ecosystem) કહેવાય છે. આમાં ઉત્પાદક, ગ્રાહક અને વિઘટક સહિત તમામ જૈવિક ઘટકો અને સૂર્યપ્રકાશ, પાણી, માટી જેવા અજૈવિક ઘટકોનો સમાવેશ થાય છે.", "tag": ""}, {"q": "પારિસ્થિતિકીના નીચેનામાંથી કઈ યુગ્મ 'જૈવિક ઘટકો' (Biotic component) ના બને છે?", "opts": ["જળાશય (Littoral zone) અને ખાલી (Nekton)", "ઉત્પાદકો (Producers) અને વિઘટકો (Decomposers)", "ઉષ્મીય પરત (Thermocline) અને એપિમેટાલમ (Epipelagic zone)", "પ્રકાશસંશ્લેષણ (Photosynthesis) અને શ્વસન (Respiration)"], "correct": 1, "explain": "પારિસ્થિતિકીના જૈવિક ઘટકોમાં ત્રણ મુખ્ય સમૂહો હોય છે: ઉત્પાદકો (સ્વપોષી જીવો – શ્યાંભૂમિસ્થ બધાં શરિરઓ), ગ્રાહકો (પરપોષી જીવો) અને વિઘટકો (ભંગકારક જીવો). જળાશય, ખાલી, ઉષ્મીય પરત જેવા શબ્દો પાણીના રાસાયણિક-ભૌતિક વિભાગો દર્શાવે છે, જૈવિક નહીં.", "tag": ""}, {"q": "પારિસ્થિતિકીના અજૈવિક ઘટકો (Abiotic components) માં નીચેનામાંથી કઈ વસ્તુ સામેલ નથી?", "opts": ["ઉષ્ણતા અને પ્રકાશ", "અપચયી પદાર્થો (Organic chemicals)", "મिट्टी અને જળની ગુણવત્તા", "વાતાવરણીય ગેસો"], "correct": 1, "explain": "અજૈવિક ઘટકોમાં પ્રકાશ, ઉષ્મા, વરસાદ, માટી, વાતાવરણીય ગેસો, અજૈવિક ખાદ્ય લવણો (nitrates, phosphates) સામેલ છે. અપચયી પદાર્થો (Organic chemicals) – જેવા કે પ્રોટીન, ચર્બી, કાર્બોહાઇડ્રેટ – સજીવો દ્વારા બનાવવામાં આવે છે તેથી તે 'જૈવિક ઘટકો' ગણાય.", "tag": ""}, {"q": "પારિસ્થિતિકીનો સૌથી મૂળભૂત સ્વપોષી ઘટક કون છે?", "opts": ["ખાદ્યપ્રાણીઓ (Herbivores)", "ભંગકારક જીવાણુઓ (Decomposer bacteria)", "શ્યાંભૂમિસ્થ સજીવો (Autotrophs)", "શિકારી પ્રાણીઓ (Carnivores)"], "correct": 2, "explain": "શ્યાંભૂમિસ્થ સજીવો (Autotrophs) પોતાનું આહાર સ્વયં બનાવે છે; પ્રકાશસંશ્લેષણ દ્વારા તેઓ સૂર્યપ્રકાશની ઉર્જાનો ઉપયોગ કરી અકાર્બનિક પદાર્થો (CO₂, H₂O) માંથી કાર્બનિક પોષકતત્વો બનાવે છે. આથી તે પારિસ્થિતિકીનો મૂળભૂત ઉત્પાદક હોય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન પારિસ્થિતિકીના 'વિઘટક' (Decomposers) વિશે સાચું છે?", "opts": ["વિઘટકો સૂર્યપ્રકાશના ફોટોન દ્વારા પોષણ પ્રાપ્ત કરે છે.", "વિઘટકો મૃત સજીવોના જટિલ સંયોજનોને સરળ અકાર્બનિક પદાર્થોમાં વિઘટિત કરે છે.", "વિઘટકો આહાર શૃંખલાના મૂળભૂત સ્તરે આવેલા ઉત્પાદકો છે.", "વિઘટકો બધાં પ્રાણીઓના શરીરમાંથી મળતા હોય છે."], "correct": 1, "explain": "વિઘટકો (ભંગકારકો) મુખ્યત્વે બેક્ટેરિયા અને ફૂંગના બનેલા હોય છે. તેઓ મૃત સજીવોના જટિલ કાર્બનિક સંયોજનોને સરળ અકાર્બનિક પોષકતત્વોમાં (જેવા કે અમોનિયા, CO₂, ખનિજ લવણો) વિઘટિત કરે છે. આ પ્રક્રિયાને વિઘટન કહે છે અને તે પારિસ્થિતિકીમાં પોષક ચક્ર ચલાવવામાં મહત્વનું ભૂમિકા ભજવે છે.", "tag": ""}, {"q": "પારિસ્થિતિકીમાં જૈવિક (પ્રાણિગોષ્ઠી) ઘટકો મુખ્યત્વે કયા સમૂહોમાં વહેંચાયેલા છે?", "opts": ["ઉત્પાદકો, ઉપભોક્તાઓ અને વિઘટકો", "સ્વપોષીઓ, પરપોષીઓ અને ઉત્પાદકો", "પરપોષીઓ, વિઘટકો અને અપ્રાણિજ ઘટકો", "લીલ, ફૂગ અને પ્રાણીઓ"], "correct": 0, "explain": "પારિસ્થિતિકીના જૈવિક ઘટકોને તેમની પોષણીય ભૂમિકા દ્વારા મુખ્યત્વે ત્રણ ભાગમાં વહેંચવામાં આવે છે: સ્વયંપોષી ઉત્પાદકો, વિવિધ પ્રકારના ઉપભોક્તાઓ અને વિઘટકો. આ ત્રણેય જૈવિક ઘટકો જ ઊર્જા પ્રવાહ અને પોષક તત્વોના પરિભ્રમણમાં મુખ્ય ભૂમિકા ભજવે છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ જોડ પારિસ્થિતિકીના 'અજૈવિક ઘટકો' (Abiotic components) નું સાચું વર્ણન કરે છે?", "opts": ["તાપમાન, વર્ષા, પ્રકાશ, માટી અને ખનીજ તત્વો", "લીલા છોડ, પ્રાણીઓ, સૂક્ષ્મજીવો અને ફૂગ", "ઉત્પાદકો, ઉપભોક્તાઓ, વિઘટકો અને સંઘર્ષ", "હવા, પાણી, જૈવિક સયોજનો અને જીવંત જીવો"], "correct": 0, "explain": "અજૈવિક ઘટકો એટલે પારિસ્થિતિકીનો ભૌતિક અને રાસાયણિક પર્યાવરણ જેવો ભાગ, જેમાં તાપમાન, વર્ષા/આર્દ્રતા, સૂર્યપ્રકાશ, માટી અને ખનીજ તત્વોનો સમાવેશ થાય છે. જૈવિક ઘટકો તો જીવંત સંઘો છે.", "tag": ""}, {"q": "પ્રકાશસંશ્લેષણ કરનાર લીલા છોડ પારિસ્થિતિકીના કયા જૈવિક ઘટક તરીકે ગણાય છે?", "opts": ["સ્વપોષી ઉત્પાદક (Producer)", "પરપોષી ઉપભોક્તા (Consumer)", "વિઘટક (Decomposer)", "અપ્રાણિગોષ્ઠી ઘટક"], "correct": 0, "explain": "લીલા g": ""}, {"q": "પારિસ્થિતિકી (Ecosystem) માં પોષક તત્વોનું ધાતુ અને અધાતુ તત્વો ઉર્જા સાથે ઊર્ધ્વગામી (Upward flow) ગતિ કરે છે; પરંતુ ઊર્જા (Energy) ની ગતિ કઈ દિશામાં થાય છે?", "opts": ["કેવળ એકદિશીય (Unidirectional)", "બેદિશીય (Bidirectional)", "ચક્રીય (Cyclic)", "અનિયમિત (Random)"], "correct": 0, "explain": "પારિસ્થિતિકીમાં ઊર્જા પ્રવાહ નિયમિત રીતે એકદિશીય હોય છે: સૂર્ય → ઉત્પાદક → ખપતકાર. બીજું સ્તરેથી બાકી રહેલી ઊર્જાનું પુનઃ ઉત્પાદકો તરફ ફરતા વાપરી શકાતું નથી, જ્યારે પોષક તત્વોનો ચક્રીય પ્રવાહ મુખ્યત્વે અધાતુ તત્વોમાં થાય છે.", "tag": ""}, {"q": "ઉર્જાના પ્રવાહમાં બે અનુક્રમિક પોષણ સ્તરો વચ્ચેનો પ્રવાહ લગભગ _______% શિખર સ્તર તરફ ઊર્જાના સંગ્રહ તરીકે જાય છે અને બાકીના 90% તાપના સ્વરૂપમાં નષ્ટ થઈ જાય છે.", "opts": ["10", "20", "5", "50"], "correct": 0, "explain": "લિનડેમેનનું 10% નિયમ (10% Law of energy transfer) અનુસાર, કોઈ પણ એક પોષણ સ્તરેથી બીજા ઉચ્ચ સ્તરે ઊર્જાના માત્ર 10% જ સંગ્રહિત થઈ શકે છે; બાકી ઊર્જા શ્વસન અને વિકિરણમાં વ્યર્થ થાય છે.", "tag": ""}, {"q": "નીચેમાંથી કયા પારિસ્થિતિકીય અનુક્રમનમાં (Ecological succession) સૂક્ષ્મ સ્વરૂપ (Hydroserous / Xeroseous) ની શરૂઆત કરનારા પ્રથમ અનુયાયાઈ (Pioneer) સમુદાયના સૂક્ષ્મજીવો સાચા છે?", "opts": ["લવણક પ્લાન્કટોન અને લિકેન (Mosses)", "વૃક્ષો અને ઝાડ", "ફર્ન અને ઘાસ", "ફંગસ અને પ્રાણીઓ"], "correct": 0, "explain": "જળાશ્રય અને સ્થળીય પારિસ્થિતિકીમાં પ્રથમ અનુયાયાઈ (Pioneer community) તરીકે લિકેન (ખાડકું જીવ) કે સ્થાળ પ્રવાહી જળાશ્રયમાં લવણક પ્લાન્કટોન કાર્યરત થાય છે; આ સૂક્ષ્મસમુદાય પછી બીજા સ્થાનસ્થાપક પ્રજાતિઓ માટે પર્યાપ્ત માળીઅન (Soil) બનાવે છે.", "tag": ""}, {"q": "પારિસ્થિતિકીય સ્થાપના (Ecological succession) ના અંતિમ તબક્કામાં જોવા મળતા જૈવભૌગોલિક સમુદાયને કયું નામ આપવામાં આવે છે, જે પોતાના આસપાસના વાતાવરણને પ્રભાવિત કરે છે અને સ્થિર સંતુલન જાળવે છે?", "opts": ["અંતિમ સમુદાય (Climax community)", "પ્રારંભિક સમુદાય ( pioneer community)", "મધ્યવર્તી સમુદાય (Intermediate community)", "કાષ્ઠ સમુદાય (Sub-climax community)"], "correct": 0, "explain": "અંતિમ સમુદાય એ સ્થાનિક વાતાવરણ સાથે સંપૂર્ણ સંતુલન સાધતો સ્થિર સમુદાય છે, જે સંપૂર્ણ પારિસ્થિતિકીય સ્થાપનાનો અંતિમ તબક્કો મનાય છે અને ઇતર અનુયાયાઈ સમુદાયોના વિપરીત તેમાં કોઈ વિશાળ પરિવર્તન જોવા મળતું નથી.", "tag": ""}, {"q": "નીચે આપેલ વિકલ્પોમાંથી કયા અજૈવિક ઘટકોને પારિસ્થિતિકીમાં 'પૂર્વાવસ્થા' (Status component) કહેવામાં આવે છે?", "opts": ["તાપમાન, વરસાદ, પ્રકાશ, ધરા", "ઉત્પાદકો, ખપતકારીઓ, વિઘટકો", "ખોરાક શૃંખલાઓ, ખોરાક જાળો", "શર્કરા, પ્રોટીન, લિપિડ"], "correct": 0, "explain": "પારિસ્થિતિકીમાં અજૈવિક ઘટકોના બે પ્રકાર હોય છે: પદાર્થ (Substance component) અને પ્રક્રિયા (Process component). 'તાપમાન, વરસાદ, પ્રકાશ અને ધરા' વગેરે ભૌગોલિક-જળશાસ્ત્રીય સ્થિતિનું વર્ણન કરતી હોવાથી તેને પૂર્વાવસ્થા (Status component) કહેવામાં આવે છે.", "tag": ""}, {"q": "પિરામિડ ઓફ નંબર (Pyramid of Numbers) માં કયા તત્ત્વનું સંકલન કરવામાં આવે છે?", "opts": ["દરેક પોષણ સ્તરમાં ઉપલબ્ધ જીવોની સંખ્યા", "દરેક પોષણ સ્તરમાં જૈવભાર (Biomass)", "દરેક પોષણ સ્તરમાં ઉપલબ્ધ ઉર્જા", "દરેક પોષણ સ્તરમાં અન્ન શૃંખલાની લંબાઈ"], "correct": 0, "explain": "પિરામિડ ઓફ નંબર એક સ્ટેરોગ્રામ છે જે દરેક પોષણ સ્તરમાં ઉપસ્થિત જીવોની સંખ્યા દર્શાવે છે. ઉત્પાદકો (જંતુઓ અને મૂળીભૂત સૂક્ષ્મજીવો) પાયે, ખાવારીઓ અને વિઘટકો ક્રમશઃ ઉપર રહે છે.", "tag": ""}, {"q": "કયા પરિબળને કારણે પિરામિડ ઓફ નંબરમાં વ્યસ્ત (Inverted) પિરામિડ દેખાઈ શકે છે?", "opts": ["જ્યારે ઉત્પાદકોની સંખ્યા ખૂબ ઓછી હોય અને વિભોજકોની સંખ્યા વધારે હોય (જેમ કે વૃક્ષ-કીટક સંબંધ)", "જ્યારે વિઘટકોની સંખ્યા ઉત્પાદકો કરતાં વધારે હોય (જેમ કે ઘાસનું મેદાન)", "જ્યારે ઉત્પાદકોની સંખ્યા વધારે હોય અને વિભોજકોની સંખ્યા ઓછી હોય", "જ્યારે બધા પોષણ સ્તરોમાં સમાન સંખ્યામાં જીવો હોય"], "correct": 0, "explain": "જ્યારે એક મોટું વૃક્ષ (ઉત્પાદક) અને તેના પર ઘણા નાના કીટક (વિભોજક) હોય, ત્યારે ઉત્પાદકોની સંખ્યા ઓછી અને ખાવારીઓની સંખ્યા વધારે હોવાથી પિરામિડ વ્યસ્ત બને છે. આ મોટા શરીરના આધાર પર સંખ્યામાં ઓછા પણ જૈવિક બાયોમાસમાં મોટા હોય છે.", "tag": ""}, {"q": "કયા પરિસ્થિતિમાં પિરામિડ ઓફ નંબર 'આકાશપીપા' (Spire) આકારનું હોય છે?", "opts": ["જ્યારે ઉત્પાદકોની સંખ્યા ખૂબ વધારે હોય અને વિભોજકોની સંખ્યા ઓછી હોય (જેમ કે ઘાસનું મેદાન)", "જ્યારે ઉત્પાદકો અને વિભોજકો બંનેની સંખ્યા સમાન હોય", "જ્યારે માત્ર વિભોજકો જ હોય અને ઉત્પાદકો ન હોય", "જ્યારે ઉત્પાદકોની સંખ્યા ઓછી અને વિભોજકોની સંખ્યા વધારે હોય"], "correct": 0, "explain": "ઘાસના મેદાનમાં લાખો નાની ઘાસની દૂધીઓ (ઉત્પાદકો) અને થોડાં મોટાં પક્ષીઓ/જંતુઓ (વિભોજકો) હોય છે. આથી પાયે ખૂબ વિસ્તૃત અને ઉપર પાતળો 'આકાશપીપા' જેવો પિરામિડ બને છે.", "tag": ""}, {"q": "પારિસ્થિતિકીમાં 'ડેટ્રિટસ' શૃંખલામાં પિરામિડ ઓફ નંબર સામાન્ય રીતે કઈ રચના ધરાવે છે?", "opts": ["વ્યસ્ત પિરામિડ, કારણ કે ડેટ્રિટસ જીવોની સંખ્યા ઉત્પાદકો કરતાં વધારે હોય છે", "સામાન્ય સીધો પિરામિડ, કારણ કે ડેટ્રિટસની સંખ્યા ઓછી હોય છે", "કોઈ પણ પિરામિડ ન બને, કારણ કે ડેટ્રિટસ શૃંખલામાં પોષણ સ્તરોની વ્યાખ્યા અસ્પષ્ટ હોય છે", "સમાન પિરામિડ, કારણ કે ડેટ્રિટસ અને ઉત્પાદકો બંનેની સંખ્યા સમાન હોય છે"], "correct": 0, "explain": "ડેટ્રિટસ શૃંખલામાં બીજા જીવો (જેમ કે અનાજ, કીટકો, બેક્ટેરિયા) ઉત્પાદકો (જેમ કે વૃક્ષ) કરતાં વધારે સંખ્યામાં હોય છે, તેથી પિરામિડ વ્યસ્ત બને છે.", "tag": ""}, {"q": "પિરામિડ ઓફ નંબરની મુખ્ય મર્યાદા શું છે?", "opts": ["આ પિરામિડમાં જીવોના કદ અને જૈવભારનું સ્થાન ગણતરીમાં લેવાતું નથી, જેના કારણે ઘણીવાર ભ્રામક રચના મળે છે", "આ પિરામિડ માત્ર જૈવિક જીવો પર આધારિત છે, અજૈવિક પરિબળોનો સમાવેશ થતો નથી", "આ પિરામિડમાં ફક્ત ઉત્પાદકો જ ગણવામાં આવે છે, ખાવારીઓને બાદ રાખવામાં આવે છે", "આ પિરામિડ માત્ર જંગલી વિસ્તારોમાં જ લાગુ પડે છે, કૃષિ ભૂમિમાં નહીં"], "correct": 0, "explain": "પિરામિડ ઓફ નંબર સંખ્યા પર આધારિત છે, પરંતુ જીવના કદ કે જૈવભારનો અંદાજ નથી આપતું. એક મોટું વૃક્ષ અને ઘણા નાના કીટકોને સમાન ગણતરીમાં લેવાથી ભૂલભર્યો અંદાજ મળી શકે છે. આથી કદ અને બાયોમાસને ધ્યાનમાં લેવા માટે 'પિરામિડ ઓફ બાયોમાસ' વધુ યોગ્ય છે.", "tag": ""}, {"q": "કોઈ પણ પારિસ્થિતિકીમાં સૂર્યપ્રકાશ દ્વારા એવી કુલ પ્રભાવિત ઉર્જાને, જે પ્રકાશસંશ્લેષણ દ્વારા રાસાયણિક ઉર્જામાં પરિવર્તિત થાય છે, તેને શું કહેવાય છે?", "opts": ["આત્મસ્વયંધાન ઉત્પાદકતા (Gross Primary Productivity - GPP)", "નેટ આત્મસ્વયંધાન ઉત્પાદકતા (Net Primary Productivity - NPP)", "પરપોષક ઉત્પાદકતા (Secondary Productivity)", "ઇકોસિસ્ટમ ઉત્પાદકતા (Ecosystem Productivity)"], "corr રે છે.", "tag": ""}, {"q": "ક્રમવિકાસની પ્રક્રિયામાં તમામ તબક્કાઓની સામાન્ય રીતે કેટલો સમય લાગી શકે છે?", "opts": ["સહસ્રાબ્દો (thousands of years)", "કેટલાક દિવસો", "એક વર્ષ", "કેટલાક મહિના"], "correct": 0, "explain": "ક્રમવિકાસની પ્રક્રિયા ખૂબ જ ધીમી હોય છે અને તેમાં સહસ્રાબ્દો સુધીનો સમય લાગી શકે છે. આમ ક્રમવિકાસ એક લાંબીગાળાની ઐતિહાસિક પ્રક્રિયા છે જે તબક્કાવાર જોવા મળે છે.", "tag": ""}, {"q": "ક્ષેરાર્ક (xerarch) સક્સેશનમાં લાઇકન પછી કયું જીવ સૌથી વધુ પ્રભાવશાળી બને છે?", "opts": ["જાડાં ઘાસ", "ફર્ન", "મોગરા છોડ", "અંતિમ વનસ્પતિપ્રભેદ"], "correct": 0, "explain": "ક્ષેરાર્ક સક્સેશનમાં લાઇકન પછી જાડાં ઘાસ (mosses) આવે છે. ઘાસ પોતાની જડ દ્વારા સબસ્ટ્રેટમાં ઊંડાણ કરે છે અને મૃત્તિ બનાવવામાં મદદ કરે છે, જે પછીના તબક્કાઓને દોરે છે.", "tag": ""}, {"q": "વાતાવરણીય પરિસ્થિતિઓ વિઘટન (Decomposition) ની ગતિ પર કેવી અસર કરે છે?", "opts": ["ઉષ્ણ અને વેદ (Humid) હવામાનમાં વિઘટન ઝડપી થાય છે જ્યારે ઠંડું હવામાન અથવા ઑક્સિજનની અભાવમાં ધીમું પડે છે.", "ઠંડુ અને સૂકું હવામાન વિઘટનને પ્રોત્સાહન આપે છે કારણ કે સંઘટકો (Decomposers) માટે આ પરિસ્થિતિઓ અનુકૂળ હોય છે.", "ઉષ્ણ હવામાનમાં વિઘટન ધીમું પડે છે કારણ કે સંઘટકો ઉચ્ચ તાપમાને સક્રિય થતા નથી.", "વિઘટન દર પર હવામાનની કોઈ અસર નથી; તે ફક્ત જૈવિક પ્રજાતિઓ પર આધારિત છે."], "correct": 0, "explain": "વિઘટન પ્રક્રિયામાં વિઘટનગામીઓની (bacteria and fungi) સક્રિયતા તાપમાન અને આર્દ્રતા પર આધાર રાખે છે. ઉષ્ણ અને વેદ (Humid) પરિસ્થિતિઓમાં એન્ઝાઇમેટિક ક્રિયાઓ વધુ ઝડપી હોય છે, જેથી વિઘટન ઝડપી થાય છે. આમ, ઉષ્ણ-વેદ હવામાનમાં વિઘટન ઝડપી અને ઠંડા/શુષ્ક વાતાવરણમાં ધીમું થાય છે.", "tag": ""}, {"q": "વિઘટનગામી શૃંખલા (Detritus Food Chain) કઈ વસ્તુથી શરૂ થાય છે?", "opts": ["મૃત જૈવિક પદાર્થો (Dead organic matter / Detritus)", "સર્જકો (Producers) દ્વારા બનાવેલા ખોરાકથી", "શાકાહારી જીવો દ્વારા ખપત કરવામાં આવેલા ખોરાકથી", "સૂર્યપ્રકાશની સીધી ઊર્જાથી"], "correct": 0, "explain": "વિઘટનગામી શૃંખલા (Detritus Food Chain) એ મૃત જૈવિક પદાર્થો (Detritus) પરથી શરૂ થાય છે, જેના પર સંઘટકો (Decomposers) અને વિભક્ષકો (Detritivores) ઊર્જા મેળવે છે. તે પ્રાઇમરી પ્રોડક્શન દ્ let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

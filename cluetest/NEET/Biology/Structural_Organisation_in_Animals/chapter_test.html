<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>

<script>
const QUIZ = [{"q": "પ્રાણીઓના શરીરમાં સમાન રચના અને કાર્ય ધરાવતા કોષોના સમૂહને શું કહેવામાં આવે છે?", "opts": ["ટિશ્યુ (તંતુ)", "અંગ", "પદાર્થ", "કોષ"], "correct": 0, "explain": "ટિશ્યુ (તંતુ) એ સમાન રચના અને કાર્ય ધરાવતા કોષોનું સમૂહ છે, જે ભૌતિક દૃષ્ટિએ એકમીય ગોઠવણી ધરાવે છે. આમ કોષોના સમૂહને ટિશ્યુ કહેવાય છે.", "tag": ""}, {"q": "પ્રાણીઓના શરીરમાં મુખ્યત્વે કેટલા પ્રકારના ટિશ્યુઓ આવેલા હોય છે?", "opts": ["4 પ્રકાર", "2 પ્રકાર", "3 પ્રકાર", "5 પ્રકાર"], "correct": 0, "explain": "પ્રાણીઓના શરીરમાં મુખ્યત્વે 4 પ્રકારના ટિશ્યુઓ આવેલા હોય છે: એપિથીલિયલ (આচ্છાદક), કનેક્ટિવ (સંયોજક), માંસપેશી (પેશી) અને તંત્રીય (તંતુ). આમ, મુખ્યત્વે 4 પ્રકારના ટિશ્યુઓ થાય.", "tag": ""}, {"q": "સરળ એપિથીલિયલ ટિશ્યુ (Simple epithelium) નીચેનામાંથી ક્યા કાર્યો માટે જવાબદાર હોય છે?", "opts": ["શોષણ અને પરાસરણ", "ઉત્પાદન", "સંરક્ષણ", "સહાયક"], "correct": 0, "explain": "સરળ એપિથીલિયલ ટિશ્યુનું મુખ્ય કાર્ય શોષણ (Absorption) અને પરાસરણ (Diffusion) છે. આ ટિશ્યુ એકપત્રીય કોષસ્તરનું બનેલું હોય છે અને આ કાર્યો માટે ઉપયોગી છે.", "tag": ""}, {"q": "સંયોજક ટિશ્યુ (Connective Tissue) ની રચનામાં કયું ઘટક કોષોને એકસાથે રાખે છે અને રચના આપે છે?", "opts": ["માદા (Matrix)", "કોષ", "રક્ત", "પ્રવાહી"], "correct": 0, "explain": "સંયોજક ટિશ્યુમાં કોષો ઓછી સંખ્યામાં હોય છે અને કોષોને બાંધી રાખવા માટે માદા (Matrix) હોય છે. આ માદા કોષોને પોષણ આપે છે અને ટિશ્યુને રચનાત્મક આધાર પૂરો પાડે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું પ્રાણીઓના શરીરનું સરળ એપિથીલિયલ ટિશ્યુ (Simple epithelium) નો પ્રકાર છે?", "opts": ["સ્તંભાકાર", "સ્તરેલી", "પાતળું", "ગોળાકાર"], "correct": 0, "explain": "સરળ એપિથીલિયલ ટિશ્યુના ત્રણ પ્રકારો છે: સ્તંભાકાર (Columnar), ચોરસ (Squamous) અને ઘનપત્રીય (Cuboidal). આમ, 'સ્તંભાકાર' એ સરળ એપિથીલિયલ ટિશ્યુનો પ્રકાર છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું પટ્ટાવાળા સ્નાયુખંડ (Skeletal muscle) ની લક્ષણો ધરાવે છે?", "opts": ["બહુકેન્દ્રકીય, દંડાકાર, ચોરસ ક્રોસ-પટ્ટાવાળું", "એક કેન્દ્ર ધરાવતું, શંકાકાર, બિન-સ્વૈચ્છિક", "શાખાયમાન, એક કેન્દ્ર ધરાવતું, રિફ્રેન્ટરી પീરિયડ ઓછું", "પહોળું, બહુકેન્દ્રકીય, વિકલ્પી સંકોચન કરનાર"], "correct": 0, "explain": "પટ્ટાવાળા સ્નાયુખંડ (Skeletal muscle fibres) બહુકેન્દ્રકીય, દંડાકાર અને ચોરસ પ્રકારના ક્રોસ-પટ્ટા ધરાવતા હોય છે. તે સ્વૈચ્છિક સ્નાયુઓ છે અને હાડકાઓ સાથે જોડાયેલા હોય છે.", "tag": ""}, {"q": "રક્તમાં પ્લેટ્લેટ્સ (Platelets) નું મુખ્ય કાર્ય કયું છે?", "opts": ["પાઘોઠણ (Coagulation) પ્રક્રિયામાં મદદ કરવી", "ઓક્સિજનનું પરિવહન કરવું", "પોષક તત્વોનું પરિવહન કરવું", "પ્રવાહી ઘટક તરીકે કામ કરવું"], "correct": 0, "explain": "પ્લેટ્લેટ્સ (Thrombocytes) એ રક્તના રૂપાણી ઘટકોમાંનો એક મહત્વનો ભાગ છે જે ઘા ભરવા અથવા પાઘોઠણ (blood clotting) પ્રક્રિયામાં મુખ્ય ભૂમિકા ભજવે છે.", "tag": ""}, {"q": "હૃદયસ્નાયુ (Cardiac muscle) અને સમથલ સ્નાયુ (Smooth muscle) વચ્ચેનો મુખ્ય તફાવત કયો છે?", "opts": ["હૃદયસ્નાયુ અનૈચ્છિક છે જ્યારે સમથલ સ્નાયુ સ્વૈચ્છિક છે", "હૃદયસ્નાયુમાં આઇન્ટર્કેલેટેડ ડિસ્ક્સ (Inter calated discs) હોય છે અને સમથલ સ્નાયુમાં નથી હોતા", "સમથલ સ્નાયુ ચોરસ ક્રોસ-પટ્ટા ધરાવે છે જ્યારે હૃદયસ્નાયુમાં પટ્ટા હોતા નથી", "હૃદયસ્નાયુ એક-કેન્દ્રકીય છે અને સમથલ સ્નાયુ બહુ-કેન્દ્રકીય છે"], "correct": 1, "explain": "હૃદયસ્નાયુમાં આઇન્ટર્કેલેટેડ ડિસ્ક્સ (Inter calated discs) હોય છે જે સંકોચન સંકેતોને એક સ્નાયુખંડમાંથી બીજા ખંડ સુધી ઝડપથી પહોંચાડે છે. સમથલ સ્નાયુમાં આવી રચના હોતી નથી.", "tag": ""}, {"q": "નીચેનામાંથી કયું ઉપાંગ (Appendage) એપિથેલિયલ ટિશ્યુની પાર્શ્વ કોષોમાંથી વિકસિત થાય છે?", "opts": ["ગ્રંથિ (Gland)", "રક્તવાહિની (Blood vessel)", "સ્નાયુતંતુ (Muscle fibre)", "ન્યુરોન (Neuron)"], "correct": 0, "explain": "ગ્રંથિઓ (Glands) એ એપિથેલિયલ ટિશ્યુના પાર્શ્વ કોષોમાંથી ઉદભવે છે. ગ્લેન્ડ્યુલર એપિથેલિયમ સ્રાવક કાર્ય કરે છે અને તે એક્સોક્રાઈન તથા એન્ડોક્રાઈન ક્ષેત્રોમાં વહેંચાયેલ છે.", "tag": ""}, {"q": "ન્યુરોન (Neuron) માં ન્યુરિટ્સ (Neurit) નો સમાવેશ થાય છે:", "opts": ["એક્ઝોન અને ડેન્ડ્રાઈટ બંનેનો", "સોમા અને ન્યુક્લિયસનો", "માત્ર સોમા (કોષશરીર) નો", "માત્ર ન્યુક્લિયસનો"], "correct": 0, "explain": "ન્યુરોનમાં સાયટોપ્લાઝમિક ઉત્તકોને ન્યુરિટ્સ કહેવાય છે. ન્યુરિટ્સમાં એક્ઝોન (Axon) અને ડેન્ડ્રાઈટ (Dendrite) — બંનેનો સમાવેશ થાય છે. ડેન્ડ્ િશ્યુ → અંગતંત્ર", "અંગ → સેલ → ટિશ્યુ → ઓર્ગેન સિસ્ટમ", "સિટોપ્લાઝમ → ન્યુક્લિયસ → ટિશ્યુ → અંગ"], "correct": 0, "explain": "જૈવિક રચનામાં સૌથી નાનો એકમ સેલ હોય છે, જે જોડાઈને ટિશ્યુ બનાવે છે, ટિશ્યુ અંગ બનાવે છે અને અંગો મળીને અંગતંત્ર રચે છે. આ ઊંચી-થી-નીચી માળખાકીય વિભાજનને યોગ્ય રીતે દર્શાવે છે.", "tag": ""}, {"q": "સ્નાયુ ટિશ્યુના ત્રણેય પ્રકારો માટે સામાન્ય રીતે લાગુ પડતું વિધાન કયું છે?", "opts": ["બધા સ્નાયુ પ્રકારો સ્વૈચ્છિક અને ઇચ્છાધીન હોય છે", "બધા સ્નાયુ પ્રકારો સ્લિવ-આકારના અને ધ્રુવીય હોય છે", "બધા સ્નાયુ પ્રકારો સંકોચનશીલતા અને વિસ્તરણશીલતા ધરાવે છે", "બધા સ્નાયુ પ્રકારો ચેતન નિયંત્રણ હેઠળ હોય છે"], "correct": 2, "explain": "સ્નાયુ ટિશ્યુનો મૂળભૂત ગુણધર્મ સંકોચનશીલતા અને વિસ્તરણશીલતા છે, જે ત્રણેય પ્રકારો — સમથલ, આપટ્ટાવાળા અને હૃદય સ્નાયુ — માટે સામાન્ય છે. બાકીના વિકલ્પો એક અથવા વધુ પ્રકારો સાથે સુસંગત નથી.", "tag": ""}, {"q": "ઉત્પાદક ટિશ્યુ (Meristematic tissue) ના સમાન ગુણધર્મો પ્રાણીશાસ્ત્રમાં કયા ટિશ્યુમાં જોવા મળે છે?", "opts": ["સ્થાયી ટિશ્યુ (Permanent tissue)", "ઉપાંગ ટિશ્યુ (Appendicular tissue)", "સંગ્રહ ટિશ્યુ (Storage tissue)", "મૂળભૂત સ્થાનિક ટિશ્યુ (Stem region tissue)"], "correct": 3, "explain": "ઉત્પાદક ટિશ્યુમાં કોષો નિરંતર વિભાજિત થતી રહે છે. પ્રાણીશાસ્ત્રમાં અનુરૂપ ગુણધર્મ મૂળભૂત સ્થાનિક ટિશ્યુમાં જોવા મળે છે, જે નવું ટિશ્યુ ઉત્પન્ન કરવા માટે જવાબદાર છે.", "tag": ""}, {"q": "નીચેનામાંથી સ્નાયુ ટિશ્યુ (Muscular Tissue) ની ઓળખ માટે કઈ વિશેષતા હૃદસ્નાયુ (Cardiac Muscle) ને અનન્ય છે?", "opts": ["કોષોની શાખાગત (Branching) રચના અને અંતરકોષિકીય જોડાણ (Intercalated disc)", "બહુકೇન્દ્રકી (Multinucleate) કોષોનું હોવું", "સ્વૈચ્છિક (Voluntary) નિયંત્રણ હેઠળનું સંકોચન", "કોષોનો રવ (Striation) દેખાવ"], "correct": 0, "explain": "હૃદસ્નાયુ ટિશ્યુની બે પ્રमुख અનન્ય વિશેષતાઓ છે — (1) કોષો શાખાગત (branching) રચના ધરાવે છે અને (2) પડોશી કોષો વચ્ચે અંતરકોષિકીય જોડાણ (Intercalated disc) હોય છે, જે વીજસંચાલન માટે જવાબદાર છે. સ્કેલિટલ સ્નાયુ પણ રવિયુત (striated) અને બહુકેન્દ્રકી હોય છે, પરંતુ તે સ્વૈચ્છિક અને અશાખાગત હોય છે.", "tag": ""}, {"q": "ઉભયઅસ્થિ (Cartilage) અંગત સંગધાતક ટિશ્યુ વિશે નીચેનામાંથી કયો કથન સત્ય છે?", "opts": ["ઉભયઅસ્થિના કોષો (કોન્ડ્રોસાઇટ્સ) મોજેલની (Matrix) અંદર રહેલા છિદ્રમય બિંદુઓ (Lacunae) માં વિરાજે છે.", "ફાઇબ્રસ ઉભયઅસ્થિ (Fibrocartilage) પાતળા કોલેજન તંતુઓ ધરાવે છે અને હવામાર્ગમાં મળે છે.", "ઇલાસ્ટિક ઉભયઅસ્થિ (Elastic cartilage) મુખ્યત્વે કકડી (Stiffness) અને બલ્ટી ગુણધર્મો ધરાવે છે.", "ઉભયઅસ્થિમાં કોષો વચ્ચે રક્તવાહિનીઓ (Blood vessels) સીધી પ્રવેશે છે."], "correct": 0, "explain": "ઉભયઅસ્થિમાં કોન્ડ્રોસાઇટ્સ (Chondrocytes) મોજેલના છિદ્રમય બિંદુઓ (Lacunae) માં વિરાજે છે — આ NCERT દ્વારા સ્પષ્ટપણે નોંધાયેલો મુખ્ય બિંદુ છે. ઉભયઅસ્થિ અવૃક્ત (Avascular) હોય છે, એટલે કે તેમાં રક્તવાહિનીઓ હોતી નથી, તેથી વિકલ્પ D ખોટો છે. ફાઇબ્રસ ઉભયઅસ્થિ મોટા પાયે કોલેજન તંતુઓ ધરાવે છે અને હવામાર્ગમાં નહીં પણ ડિસ્કમાં મળે છે.", "tag": ""}, {"q": "સ્નાયુ ટિશ્યુના ત્રણેય પ્રકારો (સ્કેલિટલ, સ્મૂથ, હૃદસ્નાયુ) ની સરખામણી કરતાં, નીચેનામાંથી કઈ વિશેષતા માત્ર હૃદસ્નાયુ ટિશ્યુ માટે જ લાગુ પડે છે?", "opts": ["ઇન્ટરકેલેટેડ ડિસ્ક (Intercalated disc) દ્વારા સ્વૈચ્છિક રીતે ન જ સાથે સંકોચન", "સ્વૈચ્છિક (Voluntary) સંકોચન", "સ્થૂળ રવ (Broad striations) ધરાવવું", "એક કેન્દ્રક (Single nucleus) ધરાવવું"], "correct": 0, "explain": "હૃદસ્નાયુ ટિશ્યુમાં ઇન્ટરકેલેટેડ ડિસ્ક (Intercalated disc) જોવા મળે છે, જે વીજસંચાલન દ્વારા અન્ય હૃદકોષો સાથે સંકોચન સમન્વય કરે છે. હૃદસ્નાયુ અસ્વૈચ્છિક (Involuntary) છે (વિકલ્પ B ખોટો). સ્કેલિટલ સ્નાયુમાં પણ સ્થૂળ રવ હોય છે (વિકલ્પ C). એક-કેન્દ્રકી માત્ર સ્મૂથ સ્નાયુ માટે લાગુ પડે છે.", "tag": ""}, {"q": "અંગોની રચના (Organs) અને અંગતંત્રો (Organ systems) ના સંદર્ભમાં, નીચેનામાંથી કયો બિંદુ NCERT અનુસાર સૌથી વધુ યોગ્ય છે?", "opts": ["સમાન કાર્ય ધરાવતા અંગોનો સમૂહ 'અંગતંત્ર' (Organ system) કહેવાય છે, જે દેહની તમામ કોષીય ગતિવિધિઓને એકલી સંચાલિત કરે છે.", "અંગો એ સાધારણ રીતે એક જ પ્રકારના ટિશ્યુથી બનેલા હોય છે અને તેમનું કાર્ય પ્રાથમિક રીતે રચનાત્મક (Structural) હોય છે.", "સમાન પદાર્થ ધરાવતા અંગો એકસાથે મળીને અંગતંત્ર (Organ system) બનાવે છે, જે ચોક્કસ શારીરિક કાર્ય (Physiological function) માટે જવાબદાર હોય છે.", "અંગતંત્રોનાં કાર્યો એકમેકથી સ્વતંત્ર હોય છે અને કોઈ પણ સંકલન (Coordination) ન હોય છે."], "correct": 2, "explain": "NCERT અનુસાર, સમાન પદાર્થ (function) ધરાવતા અંગો મળીને અંગતંત્ર (Organ system) બનાવે છે, જે ચોક્કસ શારીરિક કાર્ય (જેમ કે પાચન, શ્વાસ, પરિભ્રમણ) માટે જવાબદાર હોય છે. વિકલ્પ A ખોટો છે કારણ કે 'દેહની તમામ કોષીય ગતિવિધિઓ' એકલું અંગતંત્ર કરતું નથી. વિકલ્પ B ખોટો છે કારણ કે અંગો ઘણા પ્રકારના ટિશ્યુઓથી બનેલા હોય છે. વિકલ્પ D ખોટો છે કારણ કે અંગતંત્રો આંતરસંબંધિત (Interdependent) હોય છે.", "tag": ""}, {"q": "અસ્થિ (Bone) અને અસ્થિ સંગધાતક ટિશ્યુ વિશે નીચેનામાંથી કયું કથન NCERT મુજબ સચોટ છે?", "opts": ["અસ્થિ પિંડ (Bone matrix) મુખ્યત્વે આયર્ન ધરાવે છે, જેને કારણે તે દૃઢ બને છે.", "અસ્થિમાં ગેરહાજર છિદ્રમય બિંદુઓ (Lacunae) માં ઓસ્ટિયોસાઇટ્સ (Osteocytes) રહેલા હોય છે અને પિંડમાં કેલ્શિયમ ફોસ્ફેટ પ્રભુત્વ ધરાવે છે.", "અસ્થિ સંગધાતક ટિશ્યુનું સૌથી નરમ સ્વરૂપ છે કારણ કે તેમાં રક્તવાહિનીઓની ગંધ હોય છે.", "અસ્થિનો પિંડ (Matrix) માત્ર જૈવિક (Organic) ઘટકો ધરાવે છે, કોઈ પણ ખनिज (Mineral) ઘટક હોતા નથી."], "correct": 1, "explain": "NCERT મુજબ, અસ્થિ પિંડમાં કેલ્શિયમ ફોસ્ફેટ અને કેલ્શિયમ કાર્બોનેટ જેવા ખनिज ઘટકો પ્રભુત્વ ધરાવે છે, જે અસ્થિને દૃઢતા આપે છે. ઓસ્ટિયોસાઇટ્સ (Osteocytes) પિંડના છિદ્રમય બિંદુઓ (Lacunae) માં રહેલા હોય છે. વિકલ્પ A ખોટો છે કારણ કે આયર્ન નહીં, કેલ્શિયમ ફોસ્ફેટ પ્રમુખ ઘટક છે. વિકલ્પ C ખોટો છે કારણ કે અસ્થિ સૌથી દૃઢ સંગધાતક ટિશ્યુ છે. વિકલ્પ D ખોટો છે કારણ કે અસ્થિમાં ખनिજ ઘટકો પ્રધાન છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

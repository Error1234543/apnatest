<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mineral Nutrition — 📊 Chapter Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

  <div class="hero">

  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>

</div>
<script>
const QUIZ = [{"q": "ધાતુ પોષણ (Mineral Nutrition) અધ્યાય મુજબ, જમીનમાંથી શોષાયેલી ખનિજ ધાતુઓનું ક્ષાર સ્વરૂપે વ Botanically શામાં ખનિજનું વહન થાય છે?", "opts": ["ફ્લોયમ (Phloem)", "ક્સિલમ (Xylem)", "કેલાઇપીલ (Calyptra)", "કેમ્બિયમ (Cambium)"], "correct": 1, "explain": "જમીનમાંથી પાદપોષક તત્વોનું મુખ્યત્વે ક્ષાર સ્વરૂપે સૌરાંગ (Root hair) દ્વારા શોષણ થાય છે અને તેનું ક્ષારરૂપે મુખ્ય વહન ક્સિલમ (Xylem) દ્વારા થાય છે.", "tag": ""}, {"q": "પોષક તત્વોની વર્ગીકરણ મુજબ, નીચેનામાંથી કયું 'માઈક્રોન્યુટ્રિઅન્ટ' છે?", "opts": ["નાયટ્રોજન (N)", "ફોસ્ફરસ (P)", "આયરન (Fe)", "પોટેશિયમ (K)"], "correct": 2, "explain": "નાયટ્રોજન, ફોસ્ફરસ અને પોટેશિયમ મેક્રોન્યુટ્રિઅન્ટ છે, જ્યારે આયરન (Fe) મેંગેનીઝ, ઝીંક, બોરોન, મોલિબ્ડિનમ, ક્લોરિન વગેરે સાથે માઈક્રોન્યુટ્રિઅન્ટ ગણાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું ઘટક પ્લાઝમા આવરણ (Plasma membrane) નું મુખ્ય રચનાત્મક ઘટક નથી?", "opts": ["પ્રોટીન (Protein)", "ફોસ્ફોલિપિડ્સ (Phospholipids)", "પેક્ટિન (Pectin)", "કોલેસ્ટેરોલ (Cholesterol)"], "correct": 2, "explain": "પ્લાઝમા આવરણ પ્રોટીન, ફોસ્ફોલિપિડ્સ અને કોલેસ્ટેરોલનું બનેલું છે. પેક્ટિન કોષદીવાલ (Cell wall) નું ઘટક છે, પ્લાઝમા આવરણનું નહીં.", "tag": ""}, {"q": "પાદપોષક તત્વોના અભાવથી થતી લક્ષણોમાં, નીચેનામાંથી કઈ લક્ષણ 'મેગ્નેશિયમ'ના અભાવ સાથે સંકળાયેલું નથી?", "opts": ["ક્લોરોસિસ (પીળાશ)", "વૃદ્ધિ અટકવી", "પર્ણપટલ પર કાળા ડઘા", "પર્ણોનું પીળાશ આવી જવું"], "correct": 2, "explain": "મેગ્નેશિયમના અભાવે ક્લોરોસિસ અને વૃદ્ધિ અટકવી જેવી લક્ષણો દેખાય છે. પર્ણપટલ પર કાળા ડઘા સામાન્ય રીતે આયોડિન અથવા અન્ય તત્વના અભાવથી જોવા મળે છે.", "tag": ""}, {"q": "પ્રશ્ન: નાઈટ્રોજન ચક્રમાં 'નાઈટ્રિફિકેશન' પ્રક્રિયાના કયા તબક્કા સામેલ છે?", "opts": ["નાયટ્રેટ → નાઈટ્રાઈટ → એમોનિયા", "એમોનિયા → નાઈટ્રાઈટ → નાઈટ્રેટ", "નાઈટ્રોજન વાયુ → એમોનિયા", "એમોનિયા → નાઈટ્રોજન વાયુ"], "correct": 1, "explain": "નાઈટ્રિફિકેશન એ જમીનમાં બે તબક્કામાં થતી પ્રક્રિયા છે: પ્રથમ એમોનિયાનું નાઈટ્રાઈટમાં અને પછી નાઈટ્રાઈટનું નાઈટ્રેટમાં રૂપાંતર.", "tag": ""}, {"q": "નીચેનામાંથી કયું ખનિજ પોષક તત્વ માટે 'આવશ્યકતા'નું માપદંડ સાર્થક રીતે સુચવે છે?", "opts": ["તત્વ વનસ્પતિના વિકાસ અને પ્રজনન માટે પ્રતિકૂલ રીતે જરૂરી હોય, બીજા તત્વોથી પ્રતિસ્થાપિત ન થાય, અને ચયાપચયમાં સીધો ભાગ ભજવે.", "તત્વ સ્વાભાવિક રીતે જમીનમાં પ્રચુર પ્રમાણમાં ઉપલબ્ધ હોય, પરંતુ વનસ્પતિ પર કોઈ અસર ન કરતું હોય.", "તત્વ ફક્ત બીજા તત્વોની ક્રિયાને ઉત્તેજિત કરતું હોય, પરંતુ પોતે સીધું કોઈ ચયાપચય પ્રક્રિયામાં જોડાયેલું ન હોય.", "તત્વ વનસ્પતિના શરીરમાં કોઈ સ્થિર રચનાત્મક ફેરફાર કરતું નથી, પરંતુ વાયુ વિનિમયમાં મદદ કરે છે."], "correct": 0, "explain": "ખનિજ તત્વને આવશ્યક માનવા માટે ત્રણ માપદંડો જરૂરી છે: (1) વનસ્પતિના વિકાસ અને પ્રજનન માટે તે પ્રતિકૂલ (indispensable) હોવું, (2) અન્ય તત્વો દ્વારા તેનું પ્રતિસ્થાપન શક્ય ન હોવું, અને (3) તે ચયાપચય પ્રક્રિયાઓમાં સીધો ભાગ ભજવતું હોવું જોઈએ. B, C અને D માં આ બધાં માપદંડો ભરવામાં આવ્યા નથી.", "tag": ""}, {"q": "ખનિજ આયનોનું નિષ્ક્રિય શોષણ (Passive absorption) મુખ્યત્વે કયા માર્ગો દ્વારા થાય છે?", "opts": ["સાદી પરિસરણ (Diffusion) અને દળપ્રવાહ (Mass flow).", "ATP ઉપયોગ દ્વારા સક્રિય ટ્રાન્સપોર્ટ પંપ અને આયન વાહકો.", "ફોટોસિન્થેસિસ દ્વારા ઉત્પન્ન થયેલા ગ્લુકોઝનું સક્રિય રૂપાંતરણ.", "વાષ્પીભવન-કર્ષણ (Transpiration pull) દ્વારા ફ્લોઈમમાં ધકેલાયેલું પરિવહન."], "correct": 0, "explain": "નિષ્ક્રિય શોષણમાં કોષો દ્વારા ATP ખર્ચ થતો નથી. આ પ્રક્રિયા સામાન્ય રીતે સરળ પરિસરણ (diffusion) અને જમીનના દ્રાવણના પ્રવાહ (mass flow) દ્વારા થાય છે. જ્યારે B, C અને D સક્રિય શોષણ અથવા પરિવહનની અન્ય પ્રક્રિયાઓ સાથે સંબંધિત છે.", "tag": ""}, {"q": "મૂળના એન્ડોડર્મિસ (Endodermis) માં કેસપેરિઅન પટ્ટી (Casparian strip) નું વિશિષ્ટ સ્થાન અને કાર્ય કયું સાચું છે?", "opts": ["એન્ડોડર્મિસના રેડિયલ અને અનુપ્રસ્થ કોષભિત્તિઓમાં લિગ્નિન/સબસ્ટીરિનની પટ્ટી હોય છે, જે આપોપ્લાસ્ટ માર્ગે આવતા પાણી અને ખનિજ આયનોને અવરોધે છે, જેથી તેઓ સિમ્પ્લાસ્ટ (કોષરસ-પટલ) માર્ગે જ પસાર થઈ શકે.", "કેસપેરિઅન પટ્ટી ક્સાઇલમના ટ્રેકિયમ્સની અંદર સક્રિય રીતે ખનિજ આયનોનું શોષણ કરે છે.", "તે ફ્લોઈમના સી-સેલ્સની ચારે બાજુ એક કવચ બનાવે છે જે શર્કરાના પરિવહનને નિયંત્રિત કરે છે.", "એન્ડોડર્મિસની બહારની પટ્ટી વાયુઓ (O₂ અને CO₂) ની સક્રિય પરિસરણને પ્રોત્સાહન આપે છે."], "correct": 0, "explain": "કેસપેરિઅન પટ્ટી એન્ડોડર્મિસના રેડિયલ અને અનુપ્રસ્થ કોષભિત્તિઓમાં લિગ્નિન અને સબસ્ટીરિનની બનેલી હોય છે. તે આપોપ્લાસ્ટ (અંતઃકોષવીચાર) માર્ગે આવતા પાણી અને ખનિજ આયનોને અવરોધે છે, જેથી તેઓ સિમ્પ્લાસ્ટ (કોષરસ-પટલ) માર્ગે જ પસાર થઈ શકે; આનાથી વનસ્પતિ ખનિજ શોષણનું ચોક્કસ નિયંત્રણ કરે છે. B, C અને D ખોટા વિધાન સાથે વિભ્રાંતિ પમાડે છે.", "tag": ""}, {"q": "મૂળ દબાણ (Root pressure) નું ઉત્પન્ન થવાનું કારણ કયું સાચું વર્ણવે છે?", "opts": ["મૂળ કોષો દ્વારા સક્રિય શોષણ દ્વારા જમીનના પાણીમાં ખનિજ આયનોનું એકત્રીકરણ થવાથી ઉત્પન્ન થતું હાઈડ્રોસ્ટેટિક દબાણ.", "પર્ણોમાં થતું પ્રબળ વાષ્પીભવન જે મૂળ તરફથી પાણીને ખેંચે છે.", "ક્સાઇલમમાં પાણીનું નિષ્ક્રિય સંલગ્નન (cohesion) અને સંયોજન (adhesion) દ્વારા થતું ઊંચાઈ સુધીનું પરિવહન.", "મૂળની વાષ્પીભવન સપાટીમાંથી સીધું જ પાણીનું બાષ્પીભવન."], "correct": 0, "explain": "મૂળ દબાણ સક્રિય શોષણને કારણે ઉત્પન્ન થતું હાઈડ્રોસ્ટેટિક દબાણ છે, જ્યારે મૂળ કોષો ખનિજ આયનોને સક્રિય રીતે જમીનના પાણીમાં પ્રવેશી શોષે છે, જેનાથી પાણી ઓસ્મોસિસથી મૂળમાં પ્રવેશે છે અને દબાણ ઉભું કરે છે. B અને C વાષ્પીભવન-કર્ષણ (transpiration pull) સાથે સંબંધિત છે; D સરળ વાષ્પીભવન છે.", "tag": ""}, {"q": "માયકોરાઇઝા (Mycorrhiza) પાદપોષણમાં કઈ રીતે મહત્વપૂર્ણ સહાયક સાબિત થાય છે?", "opts": ["મૂળજીવ (fungus) અને મૂળ વચ્ચેનો સહજીવન સંબંધ છે, જે મૂળની શોષણ સપાટીનું ક્ષેત્રફળ વધારીને ખાસ કરીને ફોસ્ફરસ અને નાઈટ્રોજન પોષક તત્વોનું શોષણ અવરોધમાં વધારો કરે છે.", "મૂળજીવ મૂળમાં સીધું પ્રકાશસંશ્લેષણ કરે છે, જેનાથી વનસ્પતિને ગ્લુકોઝ મળે છે.", "માયકોરાઇઝા ફક્ત પાણીનું વાષ્પીભવન ઘટાડીને વનસ્પતિને શુષ્કતાથી બચાવે છે.", "તે મૂળકોષોની અંદર સંયોજન બેક્ટેરિયા (Rhizobium) ને દૂર કરે છે, જેથી વનસ્પતિને ફાયદો થાય."], "correct": 0, "explain": "માયકોરાઇઝા એ મૂળજીવ અને મૂળ વચ્ચેનો સહજીવન સંબંધ છે. મૂળજીવની હાયફી મૂળની શોષણ સપાટીના ક્ષેત્રફળને વધારે છે, જેનાથી ફોસ્ફરસ, નાઈટ્રોજન અને અન્ય ખનિજ પોષક તત્વોનું શોષણ વધે છે. B, C અને D માં વિવિધ અતિભાસી અથવા અનિષ્પક્ષપાતી વિધાનો છે.", "tag": ""}, {"q": "નાઈટ્રિફિકેશન નામક પ્રક્રિયામાં ભાગ લેતા બેક્ટેરિયાના જૂથને ઓળખો.", "opts": ["નાઈટ  પ્રસરે છે. આ માર્ગોની ઓળખ અને કાર્યપદ્ધતિ વિદ્યાર્થીઓ માટે મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "જ્યારે મૂળના રોમ (root hair) દ્વારા પોષક તત્વોનું અંતઃકોષીય (symplast) માર્ગે શોષણ થાય છે, ત્યારે તે કયા મૂલભૂત સિદ્ધાંત પર આધારિત છે?", "opts": ["વિદ્યુત-રાસાયણિક ઢાળ (electrochemical gradient) ને અવગણીને માત્ર પ્રવણતા ગ્રેડિએન્ટ (concentration gradient) દ્વારા આયનોનું સક્રિય પરિવહન.", "મૃત ઉત્પાદકો (decomposers) દ્વારા કરેલા જૈવિક વિઘટનથી મુક્ત થયેલા માત્ર અકાર્બનિક માત્રાઓનું શોષણ.", "કોષરસ (protoplast) ની ચુનગિયારી (selectivity) અને ATP ના ઉપભોગ દ્વારા કરવામાં આવતું નિષ્ક્રિય (passive) પરિવહન.", "કોષરસ (protoplast) ની ચુનગિયારી (selectivity) અને ATP ના ઉપભોગ દ્વારા કરવામાં આવતું સક્રિય (active) પરિવહન."], "correct": 3, "explain": "અંતઃકોષીય (symplast) માર્ગે પોષક તત્વોનું શોષણ કોષરસ (protoplast) ની ચુનગિયારી (selectivity) અને ATP ના ઉપભોગ દ્વારા કરવામાં આવતું સક્રિય (active) પરિવહન છે. આ માર્ગ દ્વારા શોષાયેલા તત્વો કોષ દીવાલ (cell wall) માંથી પસાર થતા નથી, પણ પ્લેઝમોડેસ્મોટા (plasmodesmata) ના સંપર્ક દ્વારા એક કોષમાંથી બીજા કોષમાં પરિવહિત થાય છે. સક્રિય પરિવહનમાં ATP નો ઉપભોગ થાય છે, જેથી આયનો ઓછી સાંદ્રતા ધરાવતા વિસ્તારમાંથી વધુ સાંદ્રતા ધરાવતા વિસ્તારમાં (વિરુદ્ધ પ્રવણતા ગ્રેડિએન્ટ સામે) ગતિ કરી શકે છે.", "tag": ""}, {"q": "પોષક તત્વોનું બહિઃકોષીય (apoplast) માર્ગે શોષણ કયા મૂળભૂત પદાર્થના ગુણધર્મ પર આધારિત છે?", "opts": ["કોષ દીવાલમાં સેલ્યુલોઝ (cellulose) ની હાજરી, જે માત્ર પાણીને જ અવરોધ વિના પસાર થવા દે છે.", "કોષ દીવાલમાં પેક્ટિન (pectin) ની હાજરી, જે માત્ર નાનું કદના અણુઓને જ પરમિટ કરે છે.", "કોષ દીવાલમાં ક્લોરોફિલ (chlorophyll) ની હાજરી, જે પ્રકાશ-આધારિત વિઘટન કરે છે.", "કોષ દીવાલમાં હાઇડ્રોફિલિક (hydrophilic) સામગ્રી હોવાથી, પાણી અને ઘન પોષક તત્વો સરળતાથી પ્રસરે છે."], "correct": 3, "explain": "બહિઃકોષીય (apoplast) માર્ગે પોષક તત્વોનું શોષણ કોષ દીવાલની હાઇડ્રોફિલિક (hydrophilic) સામગ્રી પર આધારિત છે, જે પાણી અને વિઘટિત પોષક તત્વોને સરળતાથી પ્રસરવા દે છે. આ માર્ગમાં પોષક તત્વો કોષ દીવાલ (cell wall) અને કોષાંતર (intercellular spaces) માં સક્રિય નહીં પણ નિષ્ક્રિય રીતે ગતિ કરે છે. આ ગતિ પ્રવણતા ગ્રેડિએન્ટ (concentration gradient) અનુસાર થાય છે, જેથી વિદ્યાર્થીઓને સક્રિય અને નિષ્ક્રિય પરિવહન વચ્ચેનો મૂળભૂત તફાવત સમજવો જરૂરી છે.", "tag": ""}, {"q": "મૂળ (root) ના એન્ડોડર્મિસ (endodermis) માં આવેલી કેસપેરિઅન પટ્ટી (Casparian strip) નું કાર્ય શું છે?", "opts": ["આયનોનું અંતઃકોષીય (symplast) માર્ગે સક્રિય પરિવહન અટકાવીને બહિઃકોષીય (apoplast) માર્ગને પ્રોત્સાહન આપે છે.", "પાણી અને વિઘટિત આયનોનું એપોપ્લાસ્ટ (apoplast) માર્ગે નિષ્ક્રિય પરિવહન અટકાવીને તેમને અંતઃકોષીય (symplast) માર્ગે દબાણ કરે છે.", "કેસપેરિઅન પટ્ટી (Casparian strip) માત્ર જળવાહી પેશીઓ (xylem) માં પાણીના ઉન્નતમ વહનને વેગ આપે છે.", "પોષક તત્વોનું પ્લાઝ્મા મેમ્બ્રેન (plasma membrane) માંથી બહિર્ગત થવા માટે પ્રોટીન ચેનલો બનાવે છે."], "correct": 1, "explain": "એન્ડોડર્મિસ (endodermis) માં આવેલી કેસપેરિઅન પટ્ટી (Casparian strip) પાણી અને વિઘટિત આયનોનું એપોપ્લાસ્ટ (apoplast) માર્ગે નિષ્ક્રિય પરિવહન અટકાવીને તેમને અંતઃકોષીય (symplast) માર્ગે દબાણ કરે છે. આ પટ્ટી લિગ્નિન અને સબસ્ટીન (lignin and suberin) ની બનેલી હોય છે, જે પાણી અને આયનોને કોષ દીવાલમાંથી પસાર થતી અટકાવે છે. આથી, કોષરસ (protoplast) માં પ્રવેશ કર્યા વિના, કોઈ પણ પદાર્થ સીધો જ વાહક પેશીઓ (vascular tissue) માં પ્રવેશી શકતો નથી.", "tag": ""}, {"q": "પોષક તત્વોનું કોષ રસધાતુ (cytoplasm) માં પ્રવેશ કરવા માટે સક્રિય પરિવહન શા માટે જરૂરી છે?", "opts": ["કોષરસ (cytoplasm) માં પોષક તત્વોની સાંદ્રતા, બહિઃકોષીય અવકાશ (extracellular space) ની સાંદ્રતા કરતાં હંમેશા ઓછી હોય છે.", "સક્રિય પરિવહન માટે પ્લાઝ્મા મેમ્બ્રેન (plasma membrane) માં ફ્લુઇડ મોઝેક (fluid mosaic) મોડેલ જરૂરી હોય છે.", "કોષરસ (cytoplasm) માં પોષક તત્વોની સાંદ્રતા, બહિઃકોષીય અવકાશ (extracellular space) ની સાંદ્રતા કરતાં હંમેશા વધુ હોય છે.", "સક્રિય પરિવહન દ્વારા માત્ર મોટા અણુઓ જ કોષમાં પ્રવેશી શકે છે, નાના આયનો નહીં."], "correct": 2, "explain": "કોષ રસધાતુ (cytoplasm) માં પોષક તત્વોની સાંદ્રતા, બહિઃકોષીય અવકાશ (extracellular space) ની સાંદ્રતા કરતાં હંમેશા વધુ હોય છે, તેથી સક્રિય પરિવહન જરૂરી છે. સક્રિય પરિવહનમાં ATP નો ઉપભોગ થાય છે, જેથી આયનો ઓછી સાંદ્રતા ધરાવતા વિસ્તારમાંથી વધુ સાંદ્રતા ધરાવતા વિસ્તારમાં (વિરુદ્ધ પ્રવણતા ગ્રેડિએન્ટ સામે) ગતિ કરી શકે છે. આ પ્રક્રિયા પ્લાઝ્મા મેમ્બ્રેન (plasma membrane) માં રહેલા વિશિષ્ટ વાહક પ્રોટીન (carrier proteins) દ્વારા થાય છે, જે પોષક તત્વોને કોષમાં પ્રવેસવા દે છે.", "tag": ""}, {"q": "પાદપો માં નાયટ્રોજનનું શોષણ અને ઉત્પ્રતીકરણ (reduction) સંબંધી નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["NaNO₃ નાપ્રથમ નાયટ્રાઇટ (NO₂⁻) માં અનંતરે નાયટ્રાઇટ રિડક્ટેઝ એન્ઝાઇમ દ્વારા પ્રત્યાયન થાય છે.", "NO₂⁻ નું NO₃⁻ માં પ્રત્યાયન નાયટ્રેટ રિડક્ટેઝ દ્વારા થાય છે.", "નાઈટ્રેટ રિડક્ટેઝ ફેરિડોક્સિન પર આધારિત હોય છે, જ્યારે નાયટ્રાઇટ રિડક્ટેઝ NADH પર આધારિત હોય છે.", "રૂટ નોડ્યુલ્સમાં જ નાયટ્રેટ રિડક્શન થાય છે, બીજા કોષોમાં નહીં."], "correct": 0, "explain": "પાદપો NaNO₃ સ્વરૂપે ઝોર લે છે; નાયટ્રેટ રિડક્ટેઝ (NADPH-ફેરિડોક્સિન/સાઇટોક્રોમ પર આધારિત) તેને પ્રથમ NO₂⁻ માં તોડે છે, જે પછી નાયટ્રાઇટ રિડક્ટેઝ દ્વારા NO માં અને તેની પછી NH₂OH / NH₃ માં રૂપાંતરિત થાય છે. આ પ્રક્રિયા મુખ્યત્વે કલોકરોપ્લેસ્ટમાં થાય છે, નોડ્યુલ્સમાં નહીં.", "tag": ""}, {"q": "નાઈટ્રોજન સ્થિરાંકન (nitrogen fixation) દરમિયાન એઝોટોમાઝ (Azotomaze) એન્ઝાઇમનું કયું વિધાન સાચું છે?", "opts": ["એઝોટોમાઝ RuBP સાથે સમાન બનાધર ધરાવતો ૮ બંધારણીય એકમોનો ડાયમેરિક પ્રોટીન છે.", "એઝોટોમાઝ ઓક્સિજન પ્રત્યે અત્યંત સંવેદનશીલ હોવાથી તે વાયુરીય (anaerobic) પરિસ્થિતિમાં જ કાર્યરત થાય છે.", "એઝોટોમાઝમાં Fe અને Mo ઉપરાંત સેલેનિયમ પણ અનુબંધી (cofactor) તરીકે સમાવિષ્ટ છે.", "એઝોટોમાઝ NADH માંથી સીધું Hi વીજળી ઉત્પન્ન કરે છે, જે N₂ ને NH₃ માં ફેરવે છે."], "correct": 1, "explain": "એઝોટોમાઝ O₂ પ્રત્યે અત્યંત સંવેદનશીલ છે; તેથી તેનું કાર્યાન્વયન વાયુરીય પરિસ્થિતિમાં જ શક્ય બને છે. સાયનોબેક્ટેરિઆમાં હેટેરોસિસ્ટ્સ આ પરિસ્થિતિ જાળવી રાખે છે. તે ૬૪ kDa ના ૮ ઓક્ટામેરિક એકમો ધરાવે છે, RuBP સાથે નહીં.", "tag": ""}, {"q": "ગ્લુટામાઇન સિન્થેઝ (Glutamine synthetase) અને GOGAT (Glutamate synthase) એન્ઝાઇમોની ભૂમિકા સંબંધી નીચેનામાંથી કયું વિધાન ખોટું છે?", "opts": ["ગ્લુટામાઇન સિન્થેઝ ગ્લુટમેટ + NH₃ + ATP → ગ્લુટામાઇન + ADP + Pi પ્રક્રિયા ચલાવે છે.", "GOGAT એન્ઝાઇ  વેઝ (Volcano) વિસ્ફોટ, પથ્થરોનું ક્ષયણ, વીજળી જેવી ભૌગોલિક/ભૌતિક પ્રક્રિયાઓ પણ નાયટ્રોજન જોડાણ બનાવે છે. તેથી ચક્ર 'માત્ર' જૈવિક પ્રક્રિયાઓ પર આધારિત નથી.", "tag": ""}];

        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

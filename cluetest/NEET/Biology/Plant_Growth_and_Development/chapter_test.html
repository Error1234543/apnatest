<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Growth and Development — 📊 Chapter Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

</div>
<script>
const QUIZ = [{"q": "વનસ્પતિમાં 'વૃદ્ધિ' (Growth) ની ખાસિયતો કઈ છે?", "opts": ["કોષ સંખ્યા અને કોષકદમાં અનિયંત્રિત વધારો", "કેવળ કોષ સંખ્યામાં નિયંત્રિત વધારો", "કેવળ જઠરાણુ સંશ્લેષણ દ્વારા થતો વધારો", "કોષ વિભાજન રહિત વધારો"], "correct": 0, "explain": "NCERT મુજબ, વનસ્પતિઓમાં વૃદ્ધિ એટલે કોષ સંખ્યા (cell division) અને કોષકદ (cell expansion) બંનેમાં અનિયંત્રિત (unlimited) વધારો. આ વૃદ્ધિ અભિન્ન (irreversible) હોય છે.", "tag": ""}, {"q": "'વિભાજન' (Differentiation) ને સૌથી યોગ્ય રીતે શું દર્શાવે છે?", "opts": ["અવિભાજિત કોષોનું વિશિષ્ટ રચના અને કાર્ય ધરાવતા કોષોમાં પરિવર્તન", "વિભાજિત કોષોનું ફરીથી વિભાજન કરવા માટે તૈયાર થવું", "કોષભિત્તિનું ક્ષય થઈ જવું", "કોષની અંદર જળ ગ્રહણ કરવું"], "correct": 0, "explain": "વિભાજન (Differentiation) એટલે મરિસ્ટેમિક (અવિભાજિત) કોષોનું વિશિષ્ટ રચનાત્મક અને કાર્યાત્મક કોષો (જેમ કે વાહક પેશી, ત્વચા પેશી) માં પરિવર્તન પામવું. આ પ્રક્રિયા જનીનિક અને પર્યાવરણીય આધારિત હોય છે.", "tag": ""}, {"q": "જ્યારે વિભાજિત (differentiated) કોષો ફરીથી વિભાજન કરવાની ક્ષમતા પ્રાપ્ત કરે છે, ત્યારે તે પ્રક્રિયાને શું કહે છે?", "opts": ["વિભાજનશૂન્યતા (Dedifferentiation)", "પુનઃવિભાજન (Redifferentiation)", "અભિન્નતા (Differentiation)", "વિકાસ (Development)"], "correct": 0, "explain": "વિભાજનશૂન્યતા (Dedifferentiation) એટલે વિભાજિત કોષો ફરીથી વિભાજનની સક્ષમતા (meristematic capability) પ્રાપ્ત કરે. ઉદાહરણ: કેમ્સ (Cambium) ની રચના, જે પુનઃવિભાજન પછી થાય છે.", "tag": ""}, {"q": "'પુનઃવિભાજન' (Redifferentiation) એટલે શું?", "opts": ["વિભાજનશૂન્ય કોષોનું ફરીથી વિશિષ્ટ કોષોમાં પરિવર્તન", "વિભાજિત કોષોનું મરિસ્ટેમિક બનવું", "કોષ વિભાજન થઈને સંખ્યા વધવી", "કોષકેન્દ્રનો વિઘટન"], "correct": 0, "explain": "પુનઃવિભાજન (Redifferentiation) એટલે વિભાજનશૂન્ય (dedifferentiated) કોષો (જેમ કે કેમ્સ) ફરીથી વિભાજન કરીને વિશિષ્ટ રચના અને કાર્ય ધરાવતા કોષો (જેમ કે દ્વિતીયક લોહિત, દ્વિતીયક છાલ) બનાવે. આ પ્રક્રિયા વિભાજનશૂન્યતા પછી આવે છે.", "tag": ""}, {"q": "વૃદ્ધિ (Growth) અને વિકાસ (Development) વચ્ચેનો મુખ્ય તફાવત કયો છે?", "opts": ["વૃદ્ધિ એટલે કદ/દળમાં વધારો, જ્યારે વિકાસ એટલે કોષ/પેશી/અંગનું પરિપક્વતા તરફનું સમગ્ર પ્રક્રિયા", "વૃદ્ધિ અને વિકાસ બંને એક જ અર્થ ધરાવે છે", "વિકાસ એટલે કોષ વિભાજન, વૃદ્ધિ એટલે કોષ વિશાળ થવું", "વૃદ્ધિ માત્ર પ્રાણીઓમાં થાય, વિકાસ માત્ર વનસ્પતિઓમાં થાય"], "correct": 0, "explain": "NCERT મુજબ: વૃદ્ધિ (Growth) એટલે કોષ સંખ્યા/કદમાં અનિયંત્રિત વધારો; વિકાસ (Development) એટલે વૃદ્ધિ, વિભાજન, વિભાજનશૂન્યતા, પુનઃવિભાજન સહિતનું બધું પરિપક્વતા પ્રક્રિયા, જે પર્યાવરણીય કારકો (પ્રકાશ, તાપમાન, ઓક્સિજન, જળ) દ્વારા નિયંત્રિત થાય છે.", "tag": ""}, {"q": "નોર્મલ અવસ્થામાં ઊંચા વૃક્ષોમાં કીંચિત (dwarfism) દેખાતી નથી, પરંતુ બૅકેપર્ડ (bakkaned) અથવા રોગગ્રસ્ત વનસ્પતિમાં આવી શકે છે. આ ઘટનાનો કારણ કઈ વૃદ્ધિ નિયંત્રક (Plant Growth Regulator) છે? (NCERT)", "opts": ["ઑક્સિનનો વધુ પડતો ઉત્પાદન જે ઉપરી મુખ્યતા (Apical dominance) જાળવે છે.", "સાયટોકિનિનની અભાવજન્ય ગેરહાજરી જે ઉપરી મુખ્યતા તોડે છે.", "ઇથિલિનની વધેલી ગેરહાજરી જે અંગોના વિકાસને રોકે છે.", "એબ્સિસિક એસિડનું સ્તર જે કોષ વિભાજનને સક્રિય કરે છે."], "correct": 0, "explain": "ઑક્સિન મુખ્ય કાંડના ટોચના ભાગમાં ઉત્પન્ન થઈને ઉપરી મુખ્યતા (Apical dominance) જાળવે છે, જેથી પાર્શ્વ અંકુરો (lateral buds) નિષ્ક્રિય રહે. અહીં બૅકેપર્ડ (bakkaned) અથવા રોગગ્રસ્ત અવસ્થામાં ઑક્સિનનું સ્તર વધી જાય અને મધ્યવર્તી અંગોની વૃદ્ધિ અટકી જાય છે, જેથી બૈકેનર્ડ વૃક્ષ બને છે. આમ, વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "શીતલકરણ (Vernalisation) પ્રક્રિયા દરમિયાન વનસ્પતિને કઈ શારીરિક અવસ્થા મેળવે છે અને તેનો વનસ્પતિશાસ્ત્રમાં સ્પષ્ટ ગુણાત્મક પરિણામ શું છે? (NCERT)", "opts": ["વનસ્પતિ શીત પ્રતિક્રિયા ધરાવતી બને છે; ફૂલના તૈયાર થવાનો દર વધે છે અને ઉત્પાદકતામાં વધારો થાય છે.", "વનસ્પતિનું કોષ વિભાજન ધીમું પડે છે; કોષદીર્ઘતા વધે છે.", "વનસ્પતિમાં પ્રકાશસંશ્લેષણ અટકી જાય છે; ગ્લુકોઝનું નિર્માણ વધે છે.", "વનસ્પતિમાં શિયાળા પ્રત્યે પ્રતિરોધકતા વધે છે; ફૂલ તરફ વળવાની પ્રતિક્રિયા ઘટે છે."], "correct": 0, "explain": "શીતલકરણ (Vernalisation) એ વનસ્પતિના કાંડના શિખરને ઓછા તાપમાને (0–10°C) ટકાઉ રાખવાની પ્રક્રિયા છે, જેથી વનસ્પતિમાં ફૂલ તૈયાર થવાની ક્ષમતા વધે અને ઉત્પાદકતામાં વધારો થાય. NCERT પ્રમાણે, આ પ્રક્રિયા વનસ્પતિની ફૂલવાના દરને વધારે છે, તેથી વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "કઈ વનસ્પતિ પ્રકાર (Photoperiod classification) ને 'છોટી રોશની' (Short-day plant, SDP) તરીકે વર્ણવવામાં આવે છે, જ્યાં ફૂલવા માટે દિવસની લંબાઈ યોગ્ય પ્રકાશસંશ્લેષણીય અવધિ કરતા ઓછી હોવી જરૂરી છે? (NCERT)", "opts": ["ગેરેનિયમ (Geranium) — લાંબી દિવસ વનસ્પતિ (LDP)", "ડેમેરસમ (Demersum) — ઓછી રોશની વનસ્પતિ (SDP)", "બેરાસિકા (Berasicum) — તટસ્થ દિવસ વનસ્પતિ (DDP)", "કૉટન (Cotton) — ઓછી રોશની વનસ્પતિ (SDP)"], "correct": 1, "explain": "ઓછી રોશની વનસ્પતિઓ (Short-day plants, SDP) માટે, ફૂલ તૈયાર થવા માટે દિવસની લંબાઈ એક ચોક્કસ ક્રિટિકલ લંબાઈ કરતા ઓછી હોવી જરૂરી છે. DC ડેમેરસમ (DC Demersum) એ SDP નો ઉદાહરણ છે. લાંબી દિવસ વનસ્પતિઓ (LDP) અને તટસ્થ દિવસ વનસ્પતિઓ (DDP) અલગ વર્ગ છે, તેથી વિકલ્પ B સાચો છે.", "tag": ""}, {"q": "પ્રકાશકાલીનતા (Photoperiodism) પ્રક્રિયામાં ફૂલવાનું નિયંત્રણ કઈ રંગક (pigment) દ્વારા થાય છે, અને તે કઈ કોષિક રચનામાં સ્થિત હોય છે? (NCERT)", "opts": ["ફાયટોક્રોમ (Phytochrome) — પર્ણના ફોટોસિસ્ટમમાં", "ક્લોરોફિલ — ક્લોરોપ્લાસ્ટના સ્ટ્રોમામાં", "એન્ટોસિયન — વેક્યોલમાં", "કેરોટિનોઇડ્સ — થાયલાકોઇડ ઝકળમાં"], "correct": 0, "explain": "પ્રકાશકાલીનતામાં ફૂલવાનું નિયંત્રણ ફાયટોક્રોમ (Phytochrome) નામના પ્રકાશ ગ્રાહક રંગક દ્વારા થાય છે. ફાયટોક્રોમ પર્ણના પેરાસાઇટલ ( paranervous) કોષિક રચનામાં, ખાસ કરીને ફોટોસિસ્ટમ (photosystem) માં હોય છે, જે પ્રકાશની ગુણવત્તા અને સમય અનુસાર ફૂલ તૈયાર થવાની પ્રક્રિયાને નિયંત્રિત કરે છે. તેથી વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "ઇથિલિન (Ethylene) હોર્મોનના નીચેના ગુણધર્મોમાંથી કયું સાચું નથી? (NCERT)", "opts": ["ફળ પાકવામાં સહાય કરે છે (fruit ripening).", "સ્ટોમેટા (stomata) ની ખુલ્લી અને બંધ થવાની પ્રક્રિયામાં ભૂમિકા ધરાવે છે.", "તીવ્ર અવરોધક (potent inhibitor) છે, જે ફૂલના વિસ્તરણમાં અવરોધ લાવે છે.", "ત્રિતટાણી (triple response) નામક અવસ્થાઓ દ્વારા કુસુમોદભવ (bolting) માટે કારણભૂત બને છે."], "correct": 3, "explain": "ત્રિતટાણી (triple response) એ કુસુમોદભવ (bolting) ના માટે કારણભૂત બનતું નથી; બલ્કે ત્રિતટાણી એ એક પ્રકારની વૃદ્ધિ પ્રતિક્રિયા છે જેમાં પાંદડાના વિસ્તરણમાં અવરોધ, અક્ષીય વૃદ્ધિમાં વધારો અને પર્ણના વળાંકમાં વધારો આવે છે. તેથી વિકલ્પ D સાચો છે, કારણ કે બીજા ત્રણ વિકલ્પો (ફળ પાકવું, સ્ટોમેટા, અવરોધકતા) ની સાચી લાક્ષણિકતાઓ છે, પણ ત્રિતટાણી અને કુસુમોદભવ સાથેની જોડાણ ખોટી છે.", "tag": ""}, {"q": "નીચેમાંથી કયા વૃદ્ધિ નિયંત્રક (Growth Regulator) નું મુખ્ય કાર્ય 'બોલ્ટિંગ' (Bolting) પ્રક્રિયાના ઉત્તેજન સાથે સંબંધિત છે, જેમાં અંડકોષવાળા છોડમાં તણું આવીને ઝડપથી લંબાઈ મેળવે છે?", "opts": ["જિબેરેલિન (Gibberellin)", "ઇથિલિન (Ethylene)", "એબ્સિઝિક એસિડ (Abscisic acid)", "સાઇટોકિનિન (Cytokinin)"], "correct": 0, "explain": "જિબેરેલિન (GA) એ રોઝેટ (rosette) પ્રકારના છોડમાં બોલ્ટિંગ પ્રેરે છે — તણું ઝડપથી લંબાય છે અને ફૂલ આવે છે. એબ્સિઝિક એસિડ આ પ્રક્રિયા દરમિયાન ઘટાડો પામે છે, જ્યારે ઇથિલિન અને સાઇટોકિનિનનો બોલ્ટિંગ સાથે સીધો સંબંધ નથી.", "tag": ""}, {"q": "વૃદ્ધિ નિયંત્રકોના આંતરક્રિયા સંબંધી નીચેના વિધાનોમાંથી કયું સૌથી વધુ ચોક્કસ છે?", "opts": ["પુટરિન અને સાઇટોકિનિન એકબીજાની પ્રવૃત્તિને વિરોધાભાસી રીતે નિયંત્રિત કરે છે; પુટરિન શિષ્પ્રભુત્વ (apical dominance) જાળવે છે જ્યારે સાઇટોકિનિન પાર્શ્વીય અંકુરણને પ્રોત્સાહન આપે છે.", "પુટરિન અને સાઇટોકિનિન બંને એકસાથે શિષ્પ્રભુત્વ વધારે છે, પરંતુ સાઇટોકિનિન ફક્ત જડ બંધનમાં કાર્યરત હોય છે.", "સાઇટોકિનિન પુટરિનની ક્રિયાને વધારે છે અને તેથી આંતરક્રિયાનો વિરોધાભાસી સ્વભાવ છે.", "વૃદ્ધિ નિયંત્રકો વચ્ચે કોઈ આંતરક્રિયા થતી નથી; તેઓ સ્વતંત્ર રીતે કાર્ય કરે છે."], "correct": 0, "explain": "પુટરિન અને સાઇટોકિનિન વચ્ચે વિરોધાભાસી આંતરક્રિયા જોવા મળે છે: પુટરિન શિષ્પ્રભુત્વ જાળવે છે અને પાર્શ્વીય કિડને દબાણ કરે છે, જ્યારે સાઇટોકિનિન પાર્શ્વીય કિડના વિકાસને પ્રોત્સાહન આપે છે. આ સંતુલન છોડના આકાર અને ઊંચાઈ નક્કી કરે છે.", "tag": ""}, {"q": "શીતલકરણ (Vernalisation) પ્રક્રિયા દરમિયાન જિબેરેલિનની તાલમબંધી સાથે કઈ અણુની માત્રામાં ઘટાડો થાય છે, જેથી ફૂલવાની પ્રક્રિયા શરૂ થાય છે?", "opts": ["એબ્સિઝિક એસિડ (ABA)", "ઇથિલિન", "પુટરિન", "બ્રાસિનોસ્ટેરોઇડ્સ"], "correct": 0, "explain": "શીતલકરણ દરમિયાન, વનસ્પતિમાં એબ્સિઝિક એસિડ (ABA) નું પ્રમાણ ઘટે છે અને જિબેરેલિનનું પ્રમાણ વધે છે. આ રાસાયણિક ફેરફાર જ ફૂલવવાની પ્રક્રિયા (flowering) ને પ્રેરે છે. ABA એ શીતલકરણના વિરોધી (antagonist) તરીકે કાર્ય કરે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો વૃદ્ધિ નિયંત્રક (Growth Regulator) 'સ્ટ્રેસ હોર્મોન' (Stress Hormone) તરીકે ઓળખાય છે અને વનસ્પતિને બીજ ડોર્મેન્સી (seed dormancy) અને સ્ટોમેટાલ બંધી દરમિયાન ઉપયોગી થાય છે?", "opts": ["એબ્સિઝિક એસિડ (Abscisic acid — ABA)", "પુટરિન (Auxin)", "જિબેરેલિન (Gibberellin)", "ઇથિલિન (Ethylene)"], "correct": 0, "explain": "એબ્સિઝિક એસિડ (ABA) ને 'સ્ટ્રેસ હોર્મોન' કહેવાય છે. તે શીતકાળમાં અથવા જල તણાવ દરમિયાન સ્ટોમેટા બંધ કરે છે, બીજ ડોર્મેન્સી પ્રેરે છે અને વૃદ્ધિ અટકાવે છે. આમ, ABA વનસ્પતિને નકારાત્મક પરિસ્થિતિઓમાં અસ્તિત્વ ટકાવી રાખવામાં મદદરૂપ થાય છે.", "tag": ""}, {"q": "બ્રાસિનોસ્ટેરોઇડ્સ (Brassinosteroids) ના કાર્યાત્મક વિસ્તારમાં નીચેમાંથી કઈ પ્રક્રિયાઓ સમાવિષ્ટ છે?", "opts": ["કોષ લંબાઈ, કોષ વિભાજન, કેશર (xylem) ભેદીકરણમાં વધારો અને ઉષ્મા/લવણ તણાવ પ્રત્યે સહનશક્તિમાં વધારો", "ફળ પાકવું, પાન ખરવું અને બીજ ડોર્મેન્સી પ્રેરવી", "શિષ્પ્રભુત્વ જાળવવું અને સ્ટોમેટા બંધ કરવા", "બોલ્ટિંગ ઉત્તેજિત કરવું અને ફૂલવાની પ્રક્રિયા પ્રેરવી"], "correct": 0, "explain": "બ્રાસિનોસ્ટેરોઇડ્સ કોષ લંબાઈ અને કોષ વિભાજન પ્રેરે છે, કેશર (xylem) ભેદીકરણમાં વધારો કરે છે અને ઉષ્મા તથા લવણ તણાવ પ્રત્યે વનસ્પતિની સહનશક્તિ વધારે છે. આ સ્ટેરોઇડ વૃદ્ધિ નિયંત્રકોમાં સ્થાન ધરાવે છે અને મેળોસિટોલ વેબર (male sterility) પ્રત્યે પણ અસર કરે છે.", "tag": ""}, {"q": "નીચેમાંથી કઈ વનસ્પતિ પ્રકારને 'શૂન્ય દિવસો' (zero-day plant) કહેવાય છે?", "opts": ["લઘુ દિનક (Short-day plant)", "દીર્ઘ દિનક (Long-day plant)", "નિરપેક્ષ દિનક (Day-neutral plant)", "મિશ્ર દિનક (Intermediate-day plant)"], "correct": 2, "explain": "નિરપેક્ષ દિનક (Day-neutral plants) એવી વનસ્પતિઓ છે જે ફુલવા માટે દિવસની લંબાઈ અથવા રાત્રિની લંબાઈ પર આધારિત નથી હોતી. તેથી તેમને 'શૂન્ય દિવસો' (zero-day plant) તરીકે ઓળખવામાં આવે છે.", "tag": ""}, {"q": "વીનિંગ (Vernalisation) પ્રક્રિયામાં પાંદડાંને સીધું શીતલ તાપમાન મળતું નથી, છતાં પણ વનસ્પતિમાં સીનિંગ (vernalisation) થાય છે. આ પાંદડાંનો સંબંધ ક્યા અંગ સાથે હોય છે?", "opts": ["જડ (Root)", "અંકુરિત બીજ (Germinating seed)", "ઉગી રહેલું મુંડ (Growing shoot/terminal bud)", "ફળ (Fruit)"], "correct": 2, "explain": "નીચેના તાપમાનનું સંવેદન (stimulus) પાંદડાં દ્વારા લેવામાં આવે છે અને પછી તે સંદેશ ઉગી રહેલા મુંડ (growing shoot) માં પહોંચાડવામાં આવે છે, જ્યાંથી ફુલવાનું તત્ત્વ (florigen) સક્રિય થાય છે. તેથી સીનિંગની પ્રક્રિયા મુખ્યત્વે અંકુરણ સ્થિતિમાં ગરમાગરમ અને વરસાદી દિવસો દરમિયાન ઉગી રહેલા મુંડ પર આધારિત હોય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન સાચું છે? કોર્ટિસોલ-સમાન હોર્મોન (Cortisone-like growth regulators) માટે:", "opts": ["ઈથિલિન કોર્ટિસોલ-સમાન હોર્મોન છે", "એબ્સિઝિક એસિડ (ABA) કોર્ટિસોલ-સમાન હોર્મોન છે", "જિબેરેલિન કોર્ટિસોલ-સમાન હોર્મોન છે", "સૌ વૃદ્ધિ નિયંત્રકો કોર્ટિસોલ-સમાન છે"], "correct": 1, "explain": "એબ્સિઝિક એસિડ (Abscisic Acid - ABA) એ કોર્ટિસોલ-સમાન રાસાયણિક રચના ધરાવતું વનસ્પતિ વૃદ્ધિ નિયંત્રક છે. આ હોર્મોન વનસ્પતિમાં તણાવ પ્રતિકાર (stress tolerance) અને અંકુરણનું દમન કરવા માટે જવાબદાર છે.", "tag": ""}, {"q": "વૃદ્ધિ નિયંત્રકો (Growth regulators) ની આંતરક્રિયા સંબંધી નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["બધા જ વૃદ્ધિ નિયંત્રકો એકબીજાને અવરોધે છે (Inhibit each other)", "કેટલાક વૃદ્ધિ નિયંત્રકો એકબીજાની વિરુદ્ધ કાર્ય કરે છે અને કેટલાક એકબીજાને સપોર્ટ કરે છે", "વૃદ્ધિ નિયંત્રકો એકબીજા સાથે કોઈ પણ પ્રકારની કોઈ પણ ક્રિયાપ્રતિક્રિયા નથી કરતા", "ફક્ત એક જ વૃદ્ધિ નિયંત્રક વનસ્પતિમાં કામ કરે છે, બાકી બધા નિષ્ક્રિય છે"], "correct": 1, "explain": "વૃદ્ધિ નિયંત્રકો વચ્ચે જટિલ ક્રિયાપ્રતિક્રિયા (interaction) હોય છે — કેટલાક એકબીજા વિરુદ્ધ (antagonistic, e.g., auxin vs. ABA), કેટલાક એકબીજાને સમર્થન (synergistic, e.g., auxin + cytokinin) કરે છે. આથી વનસ્પતિનો વિકાસ સંતુલિત રીતે થાય છે.", "tag": ""}, {"q": "બ્રાસિનોસ્ટેરોઇડ્સ (Brassinosteroids) ના કાર્યોમાંથી કયું સાચું છે?", "opts": ["તે ફક્ત જડના વિકાસને પ્રેરે છે", "તે કોષ વિભાજન (cell division) અને કોષ લંબાઈ વધારે છે, પરાગરક્ત્ત્વ (pollen viability) વધારે છે અને તણાવ પ્રતિકાર શક્તિ વધારે છે", "તે ફક્ત ફૂલવાની પ્રક્રિયામાં ભાગ લે છે", "તે વનસ્પતિની વૃદ્ધિ દરમિયાન         '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

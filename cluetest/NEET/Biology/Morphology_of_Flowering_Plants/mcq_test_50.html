<head>

<title>Morphology of Flowering Plants — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "શીર્ષ (Apex) એ વનસ્પતિના કયા ભાગનો વિસ્તાર છે?", "opts": ["મૂળ અને દંડ બંનેનો", "કેવળ મૂળનો", "કેવળ દંડનો", "પર્ણ અને ફૂલનો"], "correct": 0, "explain": "મૂળ અને દંડ બંનેના અંતિમ ભાગમાં સક્રિય વિભાજન કરતા પ્રાંતિક કોષોનો વિસ્તાર હોય છે જેને શીર્ષ કહે છે. તે મૂળ અને દંડ અનુક્રમે મૂળશીર્ષ અને દંડશીર્ષ તરીકે ઓળખાય છે.", "tag": ""}, {"q": "ગાંઠ (Node) અને વચ્ચેનો ભાગ (Internode) સહિત દંડના કયા વિભાગને વર્ણવવામાં આવે છે?", "opts": ["કંડ (Axis)", "સિરાંટિ (Cortex)", "મૂલાભ (Radicle)", "અન્તરાશ્ચ (Epiblema)"], "correct": 0, "explain": "ગાંઠ (Node) એ દંડનો તે ભાગ છે જ્યાં પર્ણ ઉગે છે, અને બે ગાંઠો વચ્ચેના વિસ્તારને અંતર્ગાંઠ (Internode) કહે છે. ગાંઠ અને અંતર્ગાંઠ મળીને દંડ/કંડ રચે છે.", "tag": ""}, {"q": "વનસ્પતિ પર્ણ (Leaf) ના મુખ્ય ત્રણ ભાગો કયા છે?", "opts": ["પત્રપૂટ (Stipule), પર્ણપત્ર (Petiole), પર્ણખંડ (Lamina)", "મૂળશીર્ષ, દંડશીર્ષ, પર્ણશીર્ષ", "મૂલાભ, અન્તરાશ્ચ, કોષકેન્દ્ર", "બાહ્યચર્મ, પેરેન્કાઈમા, વૃંતિકા"], "correct": 0, "explain": "પર્ણ ત્રણ મુખ્ય ભાગો ધરાવે છે: પત્રપૂટ (પર્ણના પાયે જોડાયેલા ઉપાંગો), પર્ણપત્ર (પર્ણને દંડ સાથે જોડતો તંતુમય ભાગ), અને પર્ણખંડ (હરિતભાજક, પહોળો ભાગ). આ ભાગો પર્ણની રચના અને કાર્યને સમજાવે છે.", "tag": ""}, {"q": "વનસ્પતિ મૂળના શીર્ષ પર રચાતું અને સંરક્ષક કાર્ય ધરાવતું આવરણ ક称为什?", "opts": ["મૂળવરખ (Root cap)", "પ્રાંતિક પ્રદેશ (Meristematic region)", "વિસ્તરણ પ્રદેશ (Elongation zone)", "શોષણ પ્રદેશ (Absorption zone)"], "correct": 0, "explain": "મૂળશીર્ષને સંરક્ષણ આપતું પટ્ટાકાર આવરણ મૂળવરખ (Root cap) કહેવાય છે. તે મૂળને જમીનમાં ધકેલાતી વખતે થતા ઘર્ષણ અને ઇજાથી બચાવે છે અને મૂળના વૃદ્ધિની દિશા નક્કી કરવામાં મદદ કરે છે.", "tag": ""}, {"q": "પર્ણપત્ર વગરના પર્ણને કશું કહેવાય છે?", "opts": ["અપત્રક (Sessile leaf)", "અન્ય વિકલ્પોમાંથી કોઈ નહીં", "ઉપાંગી પર્ણ", "મુખ્ય પર્ણ"], "correct": 0, "explain": "જે પર્ણમાં પર્ણપત્ર (Petiole) ન હોય અને પર્ણખંડ સીધો દંડ પર અથવા ગાંઠ પર જોડાયેલો હોય, તે પર્ણને અપત્રક (Sessile leaf) કહેવાય છે. ઉદાહરણ તરીકે શણ (Hemp) અને કેટલીક ઘાસ જાતો.", "tag": ""}, {"q": "નીચેમાંથી કયું સંશોધિત દંડ છે જે પ્રકાશસંશ્લેષણનું કાર્ય કરે છે?", "opts": ["ઓપૂન્ટિયામાં સ્તનદંડ", "બટાટેમાં બીજાણુદંડ", "ગેરહુમાં પરોપજીવી મૂળ", "લાવેન્ડરમાં અન્તરગાઠીય દંડ"], "correct": 0, "explain": "ઓપૂન્ટિયા (Cactus) માં પર્ણ શરવાકાર રૂપાંતરિત થાય છે અને દંડ હરિતકણ ધરાવતા સપાટ ભાગમાં ફેરવાઈ પ્રકાશસંશ્લેષણ કરે છે; આ સ્તનદંડ તરીકે ઓળખાય છે. બટાકા બીજાણુદંડ છે જે મૃત્તિકાની અંદર જમીને ખોરાક સંગ્રહિત કરે છે.", "tag": ""}, {"q": "પર્ણના ત્રણ મુખ્ય ભાગો કયા છે?", "opts": ["પર્ણવાટિકા, પર્ણાંક અને પર્ણફલક", "પર્ણનાસી, પર્ણકોષ્ટક અને પર્ણસંધિ", "પર્ણપત્ર, પર્ણવાટિકા અને પર્ણરોમ", "પર્ણપૂંછડી, પર્ણવાટિકા અને પર્ણનાસી"], "correct": 0, "explain": "એક સંપૂર્ણ પર્ણના ત્રણ મુખ્ય ભાગો હોય છે: (૧) પર્ણવાટિકા — જે દંડ પર ગાઠને ચિપકાવે છે, (૨) પર્ણાંક — લીલો, નળાકાર ભાગ, અને (૩) પર્ણફલક — પહોળો, સમતલ ભાગ જેમાં શીરાવલિ જોવા મળે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયા છોડના પર્ણમાં સમાંતર શીરાવલિ જોવા મળે છે?", "opts": ["કેળાનું પર્ણ", "ઝાડનો પર્ણ", "ગોળમરચાનું પર્ણ", "આંબાનું પર્ણ"], "correct": 0, "explain": "સમાંતર શીરાવલિ એ એકબીજા સમાંતર ચાલતી શીરો વ્યવસ્થા છે જે સામાન્યતઃ દ્વિદળબીજી છોડમાં જોવા મળે છે; કેળાનું પર્ણ તેનું ઉદાહરણ છે. જ્યારે ઝાડ, ગોળમરચું અને આંબું ત્રિદળબીજી છોડ છે જેમાં જાળીદાર શીરાવલિ જોવા મળે છે.", "tag": ""}, {"q": "આપણે ખાદ્ય ફળ તરીકે જે 'સફરૂષ' (apple) ખાઈએ છીએ તેના રસદાર ભાગનો વિકાસ કયા અંગમાંથી થાય છે?", "opts": ["થેલેમસ (પુષ્પવાટિકા)", "અંડકોષ", "જરારૂપ", "વૃંતિકા"], "correct": 0, "explain": "સફરૂષમાં ખાદ્ય ભાગ થેલેમસ (પુષ્પવાટિકા) નો વિસ્તૃત થયેલો ભાગ છે — આવા ફળને સહી ફળ (false fruit) કહે છે, કારણ કે તે ફક્ત અંડકોષમાંથી નહીં પણ અન્ય પુષ્પાંગોમાંથી પણ બને છે. સાચા ફળો માત્ર અંડકોષમાંથી જ વિકસે છે.", "tag": ""}, {"q": "વ્યવસ્થાપન (Aestivation) માં જે ભાગમાં પાંદડીઓના કિનારા એકબીજા પર આવરી લે છે અને અગ્ર કે પશ્ચા ભાગ બહાર રહે છે તેને શું કહેવાય છે?", "opts": ["કપાટાકાર વ્યવસ્થાપન", "ચાત્રકાર વ્યવસ્થાપન", "ડુંગળીકાર વ્યવસ્થાપન", "અનિશ્ચિત વ્યવસ્થાપન"], "correct": 2, "explain": "ડુંગળીકાર (Vexillary) વ્યવસ્થાપનમાં બહારનું મોટું પાંદડુ અન્ય પાંદડીઓને ઢાંકી રાખે છે અને તેનું અગ્ર ભા lain": "વંડીના પાંદડાનું વર્ણન કરતી વખતે જાતિનિર્ધારક લક્ષણોને ઓળખવાની રીત મહત્વપૂર્ણ છે; આ વૃક્ષની ઓળખ માટે મદદરૂપ થાય છે.", "tag": ""}, {"q": "ફૂલના કેપ્સ્યુલ (Carpel) ના અંતમાં આવતું છે અને તેના જથ્થામાં ફૂલના પ્રજનનતત્વનું મુખ્ય ભાગ છે તેનું નામ કેટલું છે?", "opts": ["સ્ટાઇગ્મા (Stigma)", "સ્ટાઇલ (Style)", "ઓવેરી (Ovary)", "ઓવ્યુલ (Ovule)"], "correct": 3, "explain": "કેપ્સ્યુલનું અંતિમ ભાગ ઓવ્યુલ (Ovule) છે, જે ફૂલના પ્રજનનતત્વનું મુખ્ય ભાગ છે અને તેમાં એમ્બ્રિયોનિક વિકાસ થાય છે. ઓવેરી તો ઓવ્યુલની સ્થાનાંતરણ પછી ફળ બને છે.", "tag": ""}, {"q": "નીચે મુજબના વિધાનોમાંથી કયું વિધાન 'ફળ' ના મેદી અને અમેદી (Fleshy vs Dry fruits) વિભાજન સિદ્ધાંત પર આધારિત છે ?", "opts": ["મેદી ફળમાં ફલકોષિકા (Pericarp) માંસલ અને જલદ્રવ્યયુક્ત હોય છે, જ્યારે અમેદી ફળમાં ફલકોષિકા સુકાયેલી હોય છે", "અમેદી ફળ હંમેશા એકબીજી હોય છે, જ્યારે મેદી ફળ હંમેશા બહુબીજી હોય છે", "મેદી ફળ એકમાત્ર સ્ત્રીકેસર (Carpel) માંથી બને છે, જ્યારે અમેદી ફળ બહુકેસરીય ફળ હોય છે", "મેદી ફળ હંમેશા વંશાંશી (Indeterminate) હોય છે, જ્યારે અમેદી ફળ હંમેશા નિષ્ક્રમી (Determinate) હોય છે"], "correct": 0, "explain": "NCERT મુજબ ફળનું મુખ્ય વર્ગીકરણ મેદી (Fleshy) અને અમેદી (Dry) એમ બે ભાગમાં થાય છે. મેદી ફળમાં ફલકોષિકા (pericarp) માંસલ અને જલદ્રવ્યયુક્ત હોય છે (દા.ત., કેળા, અંગૂર); જ્યારે અમેદી ફળમાં ફલકોષિકા સુકાયેલી અને સ્થિર હોય છે (દા.ત., ખળભળ, તલ).", "tag": ""}, {"q": "દિપાંડલી સ્થિતિ (Diadelphous stamens) ધરાવતી બટાકુટિએસી (Fabaceae) નિકષનાં છોડમાં પુંકેસરનું વર્ણન કરતી વખતે કયું વિધાન સાચું છે ?", "opts": ["10 પુંકેસરમાંથી 9 ના પુટ્ટિકા (Filaments) સંલગ્ન હોય છે અને 1 સ્વતંત્ર હોય છે (9+1)", "બધાં 10 પુંકેસરોની પુટ્ટિકાઓ સંલગ્ન હોય છે અને એક જ ઝુકડું બનાવે છે", "પુંકેસરોની સંખ્યા બદલાતી હોય છે અને તેઓ સંલગ્ન અથવા સ્વતંત્ર હોઈ શકે છે", "પુંકેસરો સંલગ્ન નથી હોતા, પરંતુ પરાગકોષ (Anther) એકબીજા સાથે જોડાયેલા હોય છે"], "correct": 0, "explain": "Batskuțēṣī (Fabaceae) માં પુંકેસરોની સંખ્યા 10 હોય છે જેમાંથી 9 ની પુટ્ટિકાઓ સંલગ્ન થઈ એક ઝુકડું બનાવે છે અને 10મું પુંકેસર સ્વતંત્ર રહે છે. આને 'દિપાંડલી' (Diadelphous) સ્થિતિ કહે છે (દા.ત., ચણા, મગ). 'એકપાંડલી' (Monadelphous) માં તમામ 10 પુટ્ટિકાઓ એક જ ઝુકડામાં જોડાયેલી હોય છે (દા.ત., ચીના રોઝ).", "tag": ""}, {"q": "બીજના સ્તરો અને અંતઃકોષીય અન્નભંડાર (Endosperm) ની સ્થિતિ સંબંધિત નીચેના વિધાનોમાંથી કયું વિધાન NCERT મુજબ ભૂલભરેલું છે ?", "opts": ["કેસર (Castor) ના બીજમાં અંતઃકોષીય અન્નભંડાર ઉપસ્થિત હોય છે અને તે બીજની આંતરિક ખાલી જગ્યા રોકે છે", "મકાઈ (Maize) નું બીજ એકબીજી (One-seeded) અને અંતઃકોષીય અન્નભંડાર યુક્ત (Albuminous) હોય છે", "ફાવી (Pea) નું બીજ બહુબીજી હોય છે અને પાક્ષિક અંતઃકોષીય અન્નભંડાર યુક્ત હોય છે", "ન્યુટગ્રાસ (Nutgrass) ના બીજમાં અંતઃકોષીય અન્નભંડાર ઉપસ્થિત નથી હોતું"], "correct": 2, "explain": "ફાવી (Pea) નું બીજ બહુબીજી નહીં, પણ એકબીજી હોય છે અને તેમાં અંતઃકોષીય અન્નભંડાર (Endosperm) સંપૂર્ણપણે વિલય પામી ગયું હોય છે, તેથી તે 'નોન-આલબ્યુમિનસ' (Non-albuminous) છે. કેસર (Castor) માં અંતઃકોષીય અન્નભંડાર બીજની આંતરિક ખાલી જગ્યા રોકે છે અને બીજપટલ (Testa) સાથે ચોંટી રહેલું હોય છે.", "tag": ""}, {"q": "નીચેના પુષ્પ વિન્યાસો (Inflorescences) માંથી કયો પુષ્પ વિન્યાસ 'સિમપોશિયલ' (Simposial) પ્રકારનો છે અને તેમાં 'કેપિટુલમ' (Capitulum) જેવી રચના જોવા મળે છે ?", "opts": ["સૂર્યકાંત (Sunflower)", "કાળી મિરચ (Black pepper)", "પાર્શ્વિક બડ (Oleander)", "કાળું મરી (Mustard)"], "correct": 0, "explain": "સૂર્યકાંત (Sunflower) માં 'કેપિટુલમ' (Capitulum) પ્રકારનું સિમપોશિયલ (Simposial) પુષ્પ વિન્યાસ જોવા મળે છે, જેમાં ફુલદલીઓનું દળ (Receptacle) સપાટ અને પાન જેવું હોય છે અને ઘણા ছোট પુષ્પો એકત્ર થઈને એક મોટા ફૂલ જેવું દેખાય છે. પાર્શ્વિક બડ (Oleander) માં 'રાસીમ' (Raceme), પાકા મરી (Mustard) માં 'સીલિક' (Silique) અને કાળી મિરચ (Black pepper) માં 'સ્પાઇક' (Spike) પ્રકારના પુષ્પ વિન્યાસો હોય છે.", "tag": ""}, {"q": "જમીની અંદરની સ્ટેમ મોડિફિકેશન (Underground stem modifications) નીચેનામાંથી કયા જોડી સાચા પ્રકારના અને સાચા ઉદાહરણ સાથે જોડાયેલા છે ?", "opts": ["ખાંડી (Rhizome) — આલુ (Potato), શાકાહારી કઠોળ (Legume)", "બલ્બ (Bulb) — દૂધી (Pumpkin), ગુંડા (Sugarcane)", "ટ્યુબર (Tuber) — આલુ (Potato), બલ્બ (Bulb) — લસણ (Garlic)", "સ્ટોલોન (Stolon) — હરીતકાંટો (Grass), સપ્રુટ (Sucker) — મેનકા (Mango)"], "correct": 2, "explain": "ટ્યુબર (Tuber) એ જમીની અંદરની સ્ટેમ મોડિફિકેશન છે જેનું પ્રમુખ ઉદાહરણ આલુ (Potato) છે. બલ્બ (Bulb) પણ જમીની અંદરની સ્ટેમ મોડિફિકેશન છે જેનું ઉદાહરણ લસણ (Garlic) છે. બાકીના જોડીઓ ખોટી છે: ખાંડી (Rhizome) નું ઉદાહરણ અદ્રા (Ginger) છે, કઠોળ (Legume) સ્ટેમ મોડિફિકેશન નથી; બલ્બ (Bulb) નું ઉદાહરણ પ्याज़ છે, દૂધી અને ગુંડા નહીં; સપ્રુट (Sucker) નું ઉદાહરણ મેનકા નહીં, ક્લોવર (Clover) છે.", "tag": ""}, {"q": "ફળનું વિકાસનું મુખ્ય લક્ષણ શું છે?", "opts": ["ફળ મેદીના વિકાસના પરિણામે ઉત્પન્ન થાય છે", "ફળ અમેદીના વિકાસના પરિણામે ઉત્પન્ન થાય છે", "ફળ જડના વિકાસના પરણામે ઉત્પન્ન થાય છે", "ફળ પાંદડાના વિકાસના પરિણામે ઉત્પન્ન થાય છે"], "correct": 1, "explain": "ફળ અમેદીના વિકાસના પરિણામે ઉત્પન્ન થાય છે, જ્યારે મેદી ફળની રચનાત્મક આધાર બને છે.", "tag": ""}, {"q": "બીજના સ્તરો અને અંતઃકોષીય અન્નભંડાર (Endosperm) ની સ્થિતિ સામાન્ય રીતે શું હોય છે?", "opts": ["બીજના બાહ્ય ભાગમાં", "બીજના અંદરના ભાગમાં", "બીજના મધ્યમાં અને તેની સ્થિતિમાં", "બીજના બાહ્ય અને અંદરના ભાગમાં"], "correct": 2, "explain": "અનેક અયવાયી બીજોમાં અંતઃકોષીય અન્નભંડાર (Endosperm) બીજના મધ્યમાં અને તેની સ્થિતિમાં હોય છે.", "tag": ""}, {"q": "નીચેના પુષ્પ વિન્યાસો (Inflorescences) માંથી કયો પુષ્પ વિન્યાસ સૌથી વધારે સામાન્ય છે?", "opts": ["કથળીમાં (Spike)", "ગોળીમાં (Head)", "કાંધા પરના પુષ્પો (Axillary)", "મુખ્ય શાખાએ (Raceme)"], "correct": 3, "explain": "રેસિમ (Raceme) પુષ્પ વિન્યાસ સૌથી વધારે સામાન્ય છે અને તેમાં પુષ્પો રેસિમની મુખ્ય શાખાએ જોડાયેલા હોય છે.", "tag": ""}, {"q": "જમીની અંદરની સ્ટેમ મોડિફિકેશન (Underground stem modification) શું છે?", "opts": ["જમીની અંદરનું જડ", "જમીની અંદરનું તણા", "જમીની અંદરનું પાંદડું", "જમીની અંદરનું શાખું"], "correct": 1, "explain": "જમીની અંદરની સ્ટેમ મોડિફિકેશન (Underground stem modification) તણા છે, જે જમીની નીચે વિકસે છે.", "tag": ""}, {"q": "દિપાંડલી સ્થિતિ (Diadelphous stamens) ધરાવતી બટાકુટિએસી (Fabaceae) માં સ્તંભ (Stamens) કેટલા હોય છે?", "opts": ["પાંચ", "છ પાંચ", "છ", "પાંચ અને છ"], "correct": 3, "explain": "દિપાંડલી સ્થિતિ (Diadelphous stamens) ધરાવતી બટાકુટિએસી (Fabaceae) માં સ્તંભ (Stamens) પાંચ અને છ હોય છે, જ્યાં પાંચ સામુહિક અને એક અલગ હોય છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

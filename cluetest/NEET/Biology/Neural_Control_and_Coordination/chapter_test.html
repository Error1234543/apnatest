<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "નર્વસ સિસ્ટમ (તંત્ર) નો સ્થાનિક અને કાર્યાત્મક એકમ (Structural and functional unit) કયો છે?", "opts": ["નર્વોન (Neuron)", "ન્યુરોગ્લિયા કોષ (Neuroglial cell)", "સિનાપ્સ (Synapse)", "અક્ષતંતુ (Axon)"], "correct": 0, "explain": "નર્વોન તંત્રનું મૂળભૂત રચનાત્મક અને કાર્યાત્મક એકમ છે. તે ઉત્તેજનાઓ (impulses) ને સ્વીકારવા, પ્રસારિત કરવા અને સંદેશાવિનિમય કરવા માટે વિશેષીકૃત હોય છે, જ્યારે ન્યુરોગ્લિયા કોષો મુખ્યત્વે સહાયક અને આધારકાર્ય કરે છે.", "tag": ""}, {"q": "નીચેનામાંથી કેન્દ્રિય નર્વસ સિસ્ટમ (CNS — Central Nervous System) નો સમાવેશ થતો નથી:", "opts": ["મસ્તિષ્ક (Brain)", "મજ્જાશય (Spinal cord)", "પરિઘીય નર્વ્સ (Peripheral nerves)", "અંતઃસ્ત્રાવ ગ્રંથિઓ (Endocrine glands)"], "correct": 2, "explain": "કેન્દ્રિય તંત્ર ફક્ત મસ્તિષ્ક અને મજ્જાશયનું બનેલું છે. પરિઘીય નર્વ્સ પરિઘીય તંત્ર (PNS) માં આવે છે. અંતઃસ્ત્રાવ ગ્રંથિઓ નર્વસ સિસ્ટમનો કોઈ ભાગ નથી, પણ પરિઘીય નર્વ્સ સ્પષ્ટપણે CNS નો ભાગ નથી તેથી C સાચો વિકલ્પ છે.", "tag": ""}, {"q": "સ્વૈચ્છિક તંત્ર (Somatic nervous system) નું મુખ્ય કાર્ય કયું છે?", "opts": ["સ્વૈચ્છિક સ્નાયુઓ (Skeletal muscles) ને ઉત્તેજિત કરી ગતિ ઉત્પન્ન કરવી", "આંતરઅંગોના સ્વયં克里斯ટિત કાર્યોને નિયંત્રિત કરવા", "હોર્મોનનું સ્રાવ કંટ્રોલ કરવા", "રક્ત પરિભ્રમણને ગતિમાન કરવા"], "correct": 0, "explain": "સ્વૈચ્છિક (સોમેટિક) તંત્ર શરીરની બહારની સંવેદનાઓને CNS સુધી પહોંચાડે છે અને CNS માંથી સંકેતો સ્વૈચ્છિક (વોલન્ટરી) અક્ષકાંત સ્નાયુઓ સુધી મોકલે છે, જેથી હડતલ અને ચાલવું-દોડવું જેવા સ્વૈચ્છિક આંચકા નિયંત્રિત થાય.", "tag": ""}, {"q": "અસ્વૈચ્છિક તંત્ર (Autonomic nervous system — ANS) નીચેનામાંથી કયા બે વિભાગોમાં વહેંચાયેલું છે?", "opts": ["સંવેદી (Sensory) અને ગૌણ (Motor)", "સ્વૈચ્છિક (Voluntary) અને અસ્વૈચ્છિક (Involuntary)", "થેલામસ અને હાયપોથેલામસ", "સંમિત (Sympathetic) અને પરસંમિત (Parasympathetic)"], "correct": 3, "explain": "અસ્વૈચ્છિક તંત્ર (ANS) બે વિરોધાભાસી વિભાગો ધરાવે છે — સંમિત (sympathetic) અને પરસંમિત (parasympathetic) તંત્ર. આ બંને વિભાગો શરીરના આંતરિક અંગોના સ્વયં克里斯ટિત કાર્યો (જેમ કે હૃદય કમ્પન, પાચન, શ્વાસ) ને સંતુલિત રીતે નિયંત્રિત કરે છે.", "tag": ""}, {"q": "નર્વોન (Neuron) માં અક્ષદંડ (Axon) નું મુખ્ય કાર્ય શું છે?", "opts": ["ઉત્તેજના (Nerve impulse) ને સેલબોડી થી સિનાપ્ટિક终脚 (Terminal bouton) તરફ વહન કરવી", "ઉત્તેજનાને બીજા નર્વોન સુધી સ્વીકારવી", "સેલબોડીની રચનાત્મક રક્ષા કરવી", "રક્ત પરિભ્રમણ દ્વારા પોષણ પહોંચાડવું"], "correct": 0, "explain": "અક્ષદંડ (Axon) એ નર્વોનનો લંબાવટો તાર જેવો ભાગ છે, જે સેલબોડી (Cell body) માં ઉત્પન્ન થયેલી ઉત્તેજનાને (action potential) અંતર્ગત સિનાપ્ટિક终脚 સુધી વહન કરે છે. ડેન્ડ્રાઇટ્સ ઉલટું કરે છે — તેઓ બીજા નર્વોનમાંથી સંકેત સ્વીકારે છે.", "tag": ""}, {"q": "આપેલ પૈકી કયું ન્યુરોનમાં અસ્તિત્વ ધરાવતો બિન-ન્યુરોનિક પદાર્થ છે?", "opts": ["ગ્લિયા કોષો દ્વારા નીકળતું માયેલિન", "સિનાપ્ટિક ફેંટિકલ પ્રોટીન", "એક્ઝોનમાં પ્રવાહી રસ", "ડેન્ડ્રાઈટ પર સ્પર્શકોષિક અંશ"], "correct": 0, "explain": "ગ્લિયા કોષો (Neyroglia) ન્યુરોનના સમર્થન અને પોષણમાં મદદરૂપ થાય છે. માયેલિન શીથ (Myelin sheath) એ ગ્લિયા કોષો દ્વારા બનતો ચર્બીદ્રવ્ય આવરણ છે, જે ન્યુરોન પોતે ઉત્પન્ન કરતું નથી. એટલે ગ્લિયા કોષો દ્વારા નીકળતું માયેલિન એ ન્યુરોનનું બિન-ન્યુરોનિક પદાર્થ છે.", "tag": ""}, {"q": "પોડોકાઈટોસાઇટ્સ (Podocytes) નીચેનામાંથી કયા ભાગની આસપાસ આવેલા હોય છે?", "opts": ["એક્ઝોન (Axon)", "સોમા (Soma)", "ડેન્ડ્રાઈટ (Dendrite)", "સિનાપ્સ (Synapse)"], "correct": 0, "explain": "પોડોકાઈટોસાઇટ્સ એ ન્યુરોનના એક્ઝોન (અક્ષદંડ) ની આસપાસ આવેલું ખાસ પ્રકારનું ગ્લિયા કોષ (Schwann cell) છે. તે એક્ઝોનને આવરી લઈને માયેલિન શીથ બનાવવામાં મદદ કરે છે, જેથી નરવ સંકેતનું દ્રુતગતિ પ્રસરણ થઈ શકે.", "tag": ""}, {"q": "અસંવેદી (Autonomic) તંત્ર નીચેનામાંથી કયા અંગના સંકોચન પર પ્રભુત્વ ધરાવતું નથી?", "opts": ["હૃદય (Heart)", "પાચનતંત્ર (Alimentary canal)", "સ્નેહીય સ્નાયુઓ (Skeletal muscles)", "લોહીના જહાજો (Blood vessels)"], "correct": 2, "explain": "અસંવેદી તંત્ર શરીરના અવૈચરિક (Visceral) અંગો જેવા કે હૃદય, પાચનતંત્ર, શ્વાસનળી અને રક્તવાહિકાઓ પર પોતે-સંચાલિત (involuntary) રીતે પ્રભુત્વ ધરાવે છે. સ્નેહીય સ્નાયુઓ (Skeletal muscles) સ્વૈચ્છિક તંત્ર દ્વારા નિયંત્રિત થાય છે, તેથી અસંવેદી તંત્ર તેમના સંકોચન પર પ્રભુત્વ ધરાવતું નથી.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પ્રવૃત્તિ સ્વૈચ્છિક તંત્ર દ્વારા નિયંત્રિત થતી નથી?", "opts": ["ગળાના સ્નાયુઓને ચલાવીને વાત કરવી", "લાંઘી દોડવા માટે પગના સ્નાયુઓ સંકોચાવવા", "અંતઃસ્ત્રાવી ગ્રંથિઓમાંથી હોર્મોન્સનું સ્ત્રાવ", "હાથના આંગળાઓ વડે કલમ પકડવી"], "correct": 2, "explain": "સ્વૈચ્છિક તંત્ર (Somatic nervous system) એ સ્નેહીય સ્નાયુઓ (Skeletal muscles) ના ચલન માટે જવાબદાર છે — જેમ કે વાત કરવી, દોડવું, કલમ પકડવી વગેરે. આંતરિક અંગો અને અંતઃસ્ત્રાવી ગ્રંથિઓનું સંચાલન અસંવેદી (Autonomic) તંત્ર દ્વારા થાય છે, જે સ્વૈચ્છિક ન હોય છે. તેથી હોર્મોન્સનું સ્ત્રાવ એ સ્વૈચ્છિક તંત્ર સાથે સંબંધિત નથી.", "tag": ""}, {"q": "સ્નાયુબિંદુ (Neuron) ની રચના મુજબ વર્ગીકરણ કરવામાં આવે ત્યારે, નીચેનામાંથી કયો પ્રકાર મુખ્યત્વે મગજ અને મરચ્છા (Spinal cord) માં જોવા મળે છે?", "opts": ["દ્વિધ્રુવીય સ્નાયુબિંદુ (Bipolar neuron)", "અક્ષદંડીય સ્નાયુબિંદુ (Multipolar neuron)", "એકધ્રુવીય સ્નાયુબિંદુ (Unipolar neuron)", "સંકીર્ણ સ્નાયુબિંદુ (Complex neuron)"], "correct": 1, "explain": "અક્ષદંડીય (Multipolar) સ્નાયુબિંદુમાં એક અક્ષદંડ (Axon) અને એક કરતાં વધુ પ્રતિાક્ષદંડ (Dendrites) હોય છે. મગજ અને મરચ્છામાં અક્ષદંડીય સ્નાયુબિંદુઓ સૌથી વધુ પ્રચલિત હોય છે. દ્વિધ્રુવીય સ્નાયુબિંદુઓ આંખ અને નાસિકા જેવા સંવેદનાત્મક અંગોમાં મર્યાદિત રીતે જોવા મળે છે, જ્યારે એકધ્રુવીય સ્નાયુબિંદુઓ મુખ્યત્વે પક્ષીઓ અને માછલીઓમાં જોવા મળે છે.", "tag": ""}, {"q": "ન્યુરોનના વિરામ બિંદુ (Resting potential) દરમિયાન કોષપટલની અંદર અને બહારના આયનોના વિતરણ સંબંધિત નીચેનામાંથી સાચું વિધાન કયું છે?", "opts": ["કોષની અંદર K⁺ ની સાંદ્રતા Na⁺ કરતાં ઓછી હોય છે.", "કોષની બહાર Na⁺ ની સાંદ્રતા K⁺ કરતાં ઓછી હોય છે.", "વિરામ બિંદુ દરમિયાન કોષપટલ K⁺ માટે Na⁺ કરતાં વધુ ભેદપ્રવેશી (selectively permeable) હોય છે.", "વિરામ બિંદુ દરમિયાન Na⁺-K⁺ પંપ દ્વારા 3 Na⁺ બહાર અને 2 K⁺ અંદર લઈ જવામાં આવે છે, જેના પરિણામે કોષની અંદર ધન વીજભાર રહે છે."], "correct": 2, "explain": "વિરામ બિંદુ દરમિયાન કોષપટલ K⁺ આયનો માટે Na⁺ કરતાં વધુ ભેદપ્રવેશી હોય છે. આથી K⁺ વધુ પ્રમાણમાં પ્રસરણ પામી બહાર નીકળી જાય છે, જેના પરિણામે કોષની અંદર ઋણ વીજભાર જાળવી રાખવામાં આવે છે. Na⁺-K⁺ પંપ ઋણ વીજભાર જાળવવામાં પણ મદદ કરે છે.", "tag": ""}, {"q": "તંત્રિકા ઉત્તેજના દરમિયાન પ્રવર્તન બિંદુ (Action potential) સૌથી વધુ ઝડપી રીતે કયા મિકેનિઝમથી ઉત્પન્ન થાય છે?", "opts": ["K⁺ ચેનલોના ધીમે ધીમે ખુલવાથી કોષની અંદર K⁺ નું પ્રવેશન.", "Na⁺ ચેનલોના વેગથી ખુલવાથી Na⁺ નું કોષમાં ઝડપી પ્રવેશન.", "Cl⁻ આયનોનું કોષમાંથી બહાર નिकासવું.", "Ca²⁺ નું સ્નેયુબિંદુથી ન્યુરોનમાં પ્રવેશ થવો."], "correct": 1, "explain": "પ્રવર્તન બિંદુ દરમિયાન, ઉત્તેજનાના પ્રભાવ હેઠળ Na⁺ ચેનલો ઝડપથી ખુલે છે અને Na⁺ આયનો કોષની અંદર ઝડપથી પ્રવેશ પામે છે, જેથી કોષપટલનો વિદ્યુતવાહક સંભવ ધન તરફ ખસે છે (ડિપોલરાઇઝેશન).", "tag": ""}, {"q": "તંત્રિકા ઉત્તેજનાનું ચાલન એક્સોન પર એકતરફી (unidirectional) કેમ થાય છે?", "opts": ["કારણ કે Na⁺-K⁺ પંપ માત્ર અક્ષદંડના છેડે કાર્ય કરે છે.", "કારણ કે વિરામ બિંદુ પછી પ્રવર્તન બિંદુ માત્ર આગળના ભાગમાં જ બની શકે છે, પાછલા ભાગમાં નહીં.", "કારણ કે તંત્રિકા ઉત્તેજના હંમેશા સ્નેયુબિંદુ દ્વારા જ પસાર થાય છે.", "કારણ કે K⁺ ચેનલો હંમેશા અક્ષદંડના છેડે ખુલે છે."], "correct": 1, "explain": "જ્યાં પ્રવર્તન બિંદુ થયું હોય તે ભાગ પછીથી પુનઃઉત્તેજનીય (refractory period) અવસ્થામાં આવી જાય છે. આથી ઉત્તેજના માત્ર આગળના વિરામ બિંદુવાળા ભાગમાં જ વધુ શક્ય બને છે, જે એકતરફી ચાલન સુનિશ્ચિત કરે છે.", "tag": ""}, {"q": "વિદ્યુત-રાસાયણિક સ્નેયુબિંદુ (Electro-chemical synapse) માં તંત્રિકા ઉત્તેજનાનું ચાલન કેવી રીતે થાય છે?", "opts": ["આયનો સીધા પ્રીસાપ્ટિક તંત્રિકાકોષથી પોસ્ટસાપ્ટિક તંત્રિકાકોષમાં ફરતા થાય છે.", "ટ્રાન્સમિટર અણુઓ પ્રીસાપ્ટિક તંત્રિકાકોષમાંથી મુક્ત થઈ પોસ્ટસાપ્ટિક તંત્રિકાકોષની કોષપટલ પર પ્રભાવ પાડે છે.", "K⁺ આયનો સીધા પ્રીસાપ્ટિક તંત્રિકાકોષથી પોસ્ટસાપ્ટિક તંત્રિકાકોષમાં ફરતા થાય છે.", "Na⁺ ચેનલો સીધા પ્રીસાપ્ટિક તંત્રિકાકોષમાંથી પોસ્ટસાપ્ટિક તંત્રિકાકોષમાં ખુલે છે."], "correct": 1, "explain": "વિદ્યુત-રાસાયણિક સ્નેયુબિંદુમાં, તંત્રિકા ઉત્તેજના પહોંચતા ટ્રાન્સમિટર અણુઓ (neurotransmitters) પ્રીસાપ્ટિક તંત્રિકાકોષમાંથી મુક્ત થાય છે અને પોસ્ટસાપ્ટિક તંત્રિકાકોષની કોષપટલ પર પ્રભાવ પાડીને ઉત્તેજનાને આગળ વધારે છે. આ પ્રક્રિયા રાસાયણિક સંકેતો પર આધારિત હોય છે.", "tag": ""}, {"q": "પરાવર્તન ક્રિયા (Reflex action) નીચેનામાંથી કયા માર્ગ દ્વારા સંકલિત થાય છે?", "opts": ["અગ્રમસ્તિષ્ક (Forebrain) માં સંકલિત થાય છે.", "પશ્ચાત્મસ્તિષ્ક (Hindbrain) માં સંકલિત થાય છે.", "કર્ોડરજ્જુ (Spinal cord) માં સંકલિત થાય છે.", "પરિધીય તંત્રિકાતંત્ર (PNS) માં સંકલિત થાય છે."], "correct": 2, "explain": "પરાવર્તન ક્રિયા દરમિયાન તંત્રિકા ઉત્તેજના કરોડરજ્જુમાં સંકલિત થાય છે, જેના પરિણામે મગજના નિયંત્રણ વિના જ ઝડપી પ્રતિવર્ત મેળવી શકાય છે. આથી પરાવર્તન એ અસ્વૈચ્છિક પ્રક્રિયા છે જે કરોડરજ્જુ દ્વારા સંકલિત થાય છે.", "tag": ""}, {"q": "શરીરની સંતુલન અને ભ્રમણીય ગતિ નક્કી કરવામાં કયું અંગ મુખ્ય ભૂમિકા ભજવે છે?", "opts": ["અંતઃસ્વાબિક ગ્રંથિ (Hypothalamus)", "અક્ષીય તંત્ર (Spinal cord)", "પશ્ચાત્ મસ્તિષ્ક (Hindbrain)", "ત્વચા (Skin)"], "correct": 2, "explain": "પશ્ચાત્ મસ્તિષ્ક (Hindbrain) માં આવેલું અનામિક મસ્તિષ્ક (Cerebellum) શરીરની સંતુલન, ભ્રમણીય ગતિ અને સ્નાયુઓની ચોકસાઈપૂર્વકની ગતિવિધિનું નિયંત્રણ કરે છે.", "tag": ""}, {"q": "મગજનું સૌથી મોટું ભાગ કયું છે જે ઉચ્ચકક્ષાની સંજ્ઞાત્મક પ્રવૃત્તિઓ દા.ત. વિચાર, યાદશક્તિ, જ્ઞાન આધારિત નિર્ણયો લેવાની ક્ષમતા વગેરે માટે જવાબદાર છે?", "opts": ["મસ્તિષ્ક (Brain)", "અનામિક મસ્તિષ્ક (Cerebellum)", "મસ્તિષ્ક (Cerebrum)", "અગ્ર મસ્તિષ્ક (Forebrain)"], "correct": 2, "explain": "અગ્રમસ્તિષ્ક (Forebrain) નો સૌથી મોટો ભાગ મસ્તિષ્ક (Cerebrum) છે. તે મગજનું સૌથી મોટું અને સર્વોચ્ચ મુખ્ય નિયંત્રણ કેન્દ્ર છે જે વિચાર, યાદશક્તિ, સંજ્ઞાત્મક પ્રવૃત્તિઓ વગેરે માટે જવાબદાર છે.", "tag": ""}, {"q": "હૃદય ગતિ, શ્વાસ-પ્રશ્વાસ, રક્ત સંભળાવણી વગેરે આપમેળે થતી જૈવિક ક્રિયાઓનું નિયંત્રણ કયું અંગ કરે છે?", "opts": ["અનામિક મસ્તિષ્ક (Cerebellum)", "અક્ષિતંત્ર (Spinal cord)", "મુખ્ય મસ્તિષ્ક (Medulla oblongata)", "અગ્ર મસ્તિષ્ક (Forebrain)"], "correct": 2, "explain": "મુખ્ય મસ્તિષ્ક (Medulla oblongata) હૃદય ગતિ, શ્વાસ-પ્રશ્વાસ, રક્ત સંભળાવણી, ઉલટી, દાંત ફડફડાવવા, ખાંસી, છીંક વગેરે આત્મનિયંત્રિત (Autonomic) ક્રિયાઓનું નિયંત્રણ કરે છે.", "tag": ""}, {"q": "નામના સ્નೇયુ (Tongue) ની ગતિને નિયંત્રિત કરતું સ્નૈયુ (Nerve) કયું છે let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

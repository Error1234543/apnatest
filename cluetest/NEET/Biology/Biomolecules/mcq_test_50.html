<head>

<title>Biomolecules — 📝 50 MCQ Test</title>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "જૈવઅણુઓ (Biomolecules) નીચેનામાંથી કયા સમૂહને અન્ય કરતાં વધુ પ્રમાણમાં કાર્બન ધરાવે છે?", "opts": ["કાર્બોદિતો (Carbohydrates)", "પ્રોટીન (Proteins)", "લિપિડ્સ (Lipids)", "ન્યુક્લિક એસિડ (Nucleic Acids)"], "correct": 2, "explain": "લિપિડ્સમાં કાર્બનનું પ્રમાણ અન્ય જૈવઅણુઓની સરખામણીમાં સૌથી વધુ હોય છે, કારણ કે તેમની રચનામાં લાંબા હાઈડ્રોકાર્બન શૃંખલાઓ હોય છે જેમાં C-H બંધો વધુ હોય છે.", "tag": ""}, {"q": "જીવંત કોષમાં સૌથી વધુ પ્રમાણમાં મળતો તત્વ કયો છે?", "opts": ["ઓક્સિજન (Oxygen)", "કાર્બન (Carbon)", "નાઈટ્રોજન (Nitrogen)", "હાઈડ્રોજન (Hydrogen)"], "correct": 0, "explain": "જીવંત કોષમાં પાણીનું પ્રમાણ સર્વોચ્ચ હોવાથી, ઓક્સિજન તત્વ સૌથી વધુ માત્રામાં લબે છે. કાર્બન, હાઈડ્રોજન અને નાઈટ્રોજન પણ મહત્વપૂર્ણ પરંતુ ઓછા પ્રમાણમાં હોય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું જૈવઅણુ નથી?", "opts": ["ગ્લુકોઝ (Glucose)", "યુરેઆ (Urea)", "અમીનો એસિડ (Amino Acid)", "કોલેસ્ટ્રોલ (Cholesterol)"], "correct": 1, "explain": "યુરેઆ એક કૃત્રિમ ઓર્ગેનિક સંયોજન છે જે કિમિયે મેળવવામાં આવે છે; તે કોષ દ્વારા ઉત્પન્ન થતાં મુખ્ય ચયાપચયી જૈવઅણુઓ (જેવા કે ગ્લુકોઝ, અમીનો એસિડ, કોલેસ્ટ્રોલ) ની શ્રેણીમાં આવતું નથી.", "tag": ""}, {"q": "જીવંત ભોજનમાં મળતું 'ડાયટરી ફાઇબર' મુખ્યત્વે કઈ સુક્રોઝનું બનેલું હોય છે?", "opts": ["સેલ્યુલોઝ (Cellulose)", "ગ્લાયકોજન (Glycogen)", "સ્ટાર્ચ (Starch)", "કાઈટિન (Chitin)"], "correct": 0, "explain": "ડાયટરી ફાઇબર મુખ્યત્વે સેલ્યુલોઝનું બનેલું હોય છે, જે એક અવાહક કાર્બોદિત (Non‑digestible polysaccharide) છે અને પ્લાંટ કોષભિત્તિમાં મળે છે. આપણે આપણા પાચનએન્ઝાઈમ્સથી સેલ્યુલોઝને વઘુ પાડી શકતા નથી.", "tag": ""}, {"q": "નીચેનામાંથી કયું ઘટક પ્રાણીકોષની પ્લાઝમા પટલ (Plasma membrane) ની રચનામાં સંકલ્પિત છે?", "opts": ["ફોસ્ફોલિપિડ (Phospholipid)", "ટ્રાઈગ્લિસરાઈડ (Triglyceride)", "વેક્સ (Wax)", "કોલેસ્ટ્રોલ (Cholesterol)"], "correct": 0, "explain": "ફોસ્ફોલિપિડ પટલની મુખ્ય રચનાત્મક એકમ છે; તેનું હાઈડ્રોફિલિક શિર અને હાઈડ્રોફોબિક પૂંછડી યુક્ત દ્વિસ્તરીય બનાવટ બનાવે છે જે પટલનો મુખ્ય આધાર છે. કોલેસ્ટ્રોલ પણ પટલમાં હોય છે પરંતુ મુખ્ય રચનાત્મક ઘટક ફોસ્ફોલિપિડ જ છે.", "tag": ""}, {"q": "ગ્લાયકોજનની રચનામાં કયું બંધ પ્રમુખત્વે જોવા મળે છે?", "opts": ["α-1,4-ગ્લાઇકોસિડિક અને α-1,6-શાખા બંધ", "β-1,4-ગ્લાઇકોસિડિક બંધ", "α-1,4-ગ્લાઇકોસિડિક બંધ (માત્ર રેખીય)", "પીપ્ટાઇડ બંધ"], "correct": 0, "explain": "ગ્લાયકોજન એ α-D-ગ્લુકોઝના બનેલું શાખાયુક્ત પોલીસેરાઇડ છે. આની મુખ્ય શૃંખલા α-1,4-ગ્લાઇકોસિડિક બંધથી અને શાખાઓ α-1,6-ગ્લાઇકોસિડિક બંધથી જોડાયેલી હોય છે. તેથી સાચો જવાબ વિકલ્પ A છે.", "tag": ""}, {"q": "કણીંગના અન્નદાનળ (Amylum) માં ગ્લુકોઝ એકમોની ગોઠવણી સંબંધે નીચેમાંથી કયું વિધાન સાચું છે?", "opts": ["એમિલોઝ રેખીય અને એમિલોપેક્ટિન શાખાયુક્ત હોય છે", "એમિલોઝ અને એમિલોપેક્ટિન બંને શાખાયુક્ત હોય છે", "એમિલોઝ શાખાયુક્ત અને એમિલોપેક્ટિન રેખીય હોય છે", "બંને માત્ર β-1,4-ગ્લાઇકોસિડિક બંધ ધરાવે છે"], "correct": 0, "explain": "શતધાન્યોમાં આવતું淀粉 (Starch) બે ઘટક ધરાવે છે — એમિલોઝ (રેખીય, ~૨૦-૩૦%) અને એમિલોપેક્ટિન (શાખાયુક્ત, ~૭૦-૮૦%). એમિલોઝ α-1,4-બંધ ધરાવે છે જ્યારે એમિલોપેક્ટિનમાં α-1,4-બંધ સાથે α-1,6-શાખા બંધ પણ હોય છે. તેથી વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "કોષભિત્તિ (Cell wall) ના બંધારણમાં આવતું સક્રિય પોલીસેકેરાઇડ કયું છે?", "opts": ["સેલ્યુલોઝ", "ગ્લાયકોજન", "આંધ્રાઉરોન", "મ્યુકોપોલીસેકેરાઇડ"], "correct": 0, "explain": "વનસ્પતિ કોષભિત્તિનું મુખ્ય ઘટક સેલ્યુલોઝ છે, જે β-D-ગ્લુકોઝના એકમોનો બનેલું રેખીય પોલીસેકેરાઇડ છે. આમાં β-1,4-ગ્લાઇકોસિડિક બંધ જોવા મળે છે. તેથી સાચો જવાબ વિકલ્પ A છે.", "tag": ""}, {"q": "ગ્લાયકોજન, સ્ટાર્ચ અને સેલ્યુલોઝ વચ્ચેનો મૂળભૂત તફાવત કયો છે?", "opts": ["બધા જ ગ્લુકોઝના બનેલા હોવા છતાં ગ્લાઇકોસિડિક બંધનો પ્રકાર (α કે β) અને શાખા બંધની ઉપસ્થિતિ/અભાવમાં તફાવત છે", "ત્રણેય અલગ અલગ મોનોસેકેરાઇડમાંથી બનેલા છે", "ત્રણેયમાં માત્ર રેખીય શૃંખલા હોય છે", "ત્રણેયમાં β-1,4-ગ્લાઇકોસિડિક બંધ જોવા મળે છે"], "correct": 0, "explain": "ગ્લાયકોજન, સ્ટાર્ચ (એમિલોઝ+એમિલોપેક્ટિન) અને સેલ્યુલોઝ ત્રણેય ગ્લુકોઝના પોલીસેકેરાઇડ છે, પરંતુ તેમની રચના ભિન્ન છે — ગ્લાયકોજન અને સ્ટાર્ચમાં α-1,4 બંધ (અને શાખા για гликоген α-1,6) જ્યારે સેલ્યુલોઝમાં β-1,4 બંધ હોય છે. આ રચનાત્મક તફાવત જ તેમના ભૌતિક ગુણધર્મો નક્કી કરે છે. તેથી વિકલ્ ેલ (Induced-fit) આના કરતાં અલગ છે.", "tag": ""}, {"q": "પેપ્સિનઝેન (Pepsinogen) નું સક્રિય એન્ઝાઇમ પેપ્સિન (Pepsin) માં રૂપાંતર થવા માટે કયું અનુલક્ષણ જવાબદાર છે?", "opts": ["ઉચ્ચ તાપમાન કારણે એન્ઝાઇમનું આકાર બદલાય છે.", "ઝાયમોજેન (Zymogen) પર પ્રોટીઓલાઇટિક કટ થાય છે, જેથી સક્રિય સ્થળ ખુલે છે.", "પ્રક્રિયા દરમિયાન કોફેક્ટરનું સંયોજન થાય છે.", "pHમાં ફેરફારથી એન્ઝાઇમનું આયનિક સ્વરૂપ બદલાય છે."], "correct": 1, "explain": "ઝાયમોજેન (અથવા પ્રોએન્ઝાઇમ) એ એન્ઝાઇમનો અસક્રિય પૂર્વગામી સ્વરૂપ છે. પેપ્સિનઝેન અવાસ્તવિક રીતે સક્રિય નથી. પાચનરસમાં (અંતઃકોષીય પ્રોટીઝ દ્વારા) એમાંથી એક નાનું પેપ્ટાઇડ કટ થતાં સક્રિય સ્થળ ઉદ્ભવે છે અને પેપ્સિન સક્રિય બને છે. આ રીતે એન્ઝાઇમ ઝડપથી નિયંત્રિત બનાવી શકાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો એન્ઝાઇમ તેના વિકલ્પી (Optimum) pH પર સૌથી વધુ કાર્યક્ષમતા દર્શાવે છે?", "opts": ["પેપ્સિન – pH ૨ (તીવ્ર એસિડિક)", "ટ્રિપ્સિન – pH ૮ (ક્ષારક)", "હરમોઈલ – pH ૬.૮", "શેવાલ ડાયસ્ટેઝ – pH ૪.૫"], "correct": 2, "explain": "દરેક એન્ઝાઇમનું એક ચોક્કસ vikalp (optimum) pH હોય છે જે પર તેની ક્રિયાશીલતા સૌથી વધુ હોય છે. હરમોઈલ (Salivary amylase) મૂંછમાં સક્રિય હોય છે અને તેનું વિકલ્પી pH લગભગ ૬.૮ (હળવું એસિડિક) હોય છે. પેપ્સિન એસિડિક (pH ૨) અને ટ્રિપ્સિન ક્ષારક (pH ૮) માં સક્રિય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું નિવેદન સંયુક્ત પોલિસેકેરાઇડ (Heteropolysaccharide) ને યોગ્ય રીતે વર્ણવે છે?", "opts": ["આ પોલિસેકેરાઇડ્સ વધુ કર્બોહાઇડ્રેટ્સના એક જ પ્રકારના મોનોસેકેરાઇડ એકમોનો બનેલા હોય છે.", "આ પોલિસેકેરાઇડ્સમાં ફક્ત સ્તંભીય (linear) શૃંખલાઓ જ હોય છે અને તેઓ ક્યારેય શાખાંકિત હોતા નથી.", "આ પોલિસેકેરાઇડ્સ વિવિધ પ્રકારના મોનોસેકેરાઇડ એકમોનો બનેલા હોય છે અને તેમનું સંયોજન અસમાન હોઈ શકે છે.", "આ પોલિસેકેરાઇડ્સ ફક્ત શારીરિક રીતે જ બંધારણ આપે છે અને કોઈ પણ જૈવરાસાયણિક પ્રક્રિયામાં ભાગ લેતા નથી."], "correct": 2, "explain": "સંયુક્ત પોલિસેકેરાઇડ્સ (જેમ કે હાયલુરોનિક એસિડ) વિવિધ પ્રકારના મોનોસેકેરાઇડ એકમોનો બનેલા હોય છે અને તેમનું સંયોજન અસમાન હોઈ શકે છે. સરળ પોલિસેકેરાઇડ્સ (homopolysaccharides) માત્ર એક જ પ્રકારના મોનોસેકેરાઇડ એકમો ધરાવે છે.", "tag": ""}, {"q": "જૈવરાસાયણિક પ્રણાલીઓમાં સાર્થક (spontaneous) પ્રક્રિયાઓ અંગે સही નિવેદન પસંદ કરો:", "opts": ["જો Gibbs મુક્ત ઊર્જામાં ફેરફાર (ΔG) ધન હોય, તો પ્રક્રિયા સ્વયંસ્ફૂર્ત (spontaneous) હોય છે.", "જો Gibbs મુક્ત ઊર્જામાં ફેરફાર (ΔG) ઋણ હોય, તો પ્રક્રિયા સ્વયંસ્ફૂર્ત (spontaneous) હોય છે.", "તાપમાન અચળ રાખવામાં આવે ત્યારે ΔS હંમેશા ધન હોવું જોઈએ, ભલે પ્રક્રિયા સ્વયંસ્ફૂર્ત હોય કે ન હોય.", "સંતુલન અવસ્થામાં ΔG = 0 હોય છે, પરંતુ પ્રક્રિયા દર (rate) પણ શૂન્ય હોવો જરૂરી છે."], "correct": 1, "explain": "જ્યારે Gibbs મુક્ત ઊર્જામાં ફેરફાર (ΔG) ઋણ હોય, ત્યારે પ્રક્રિયા સ્વયંસ્ફૂર્ત (spontaneous) હોય છે. સંતુલન અવસ્થામાં ΔG = 0 હોય છે, પરંતુ પ્રક્રિયા દર (rate) શૂન્ય હોવો જરૂરી નથી – દર સંતુલન પર પણ અનન્ય (dynamic) રહી શકે છે.", "tag": ""}, {"q": "ઓસમોસિસ (Osmosis) અંગેની નીચેની માહિતીમાંથી કઈ ખોટી છે?", "opts": ["ઓસમોટિક દબાણ એક કોલિગેટિવ ગુણધર્મ છે અને તે દ્રાવ્યના કણોની સંખ્યા પર આધાર રાખે છે.", "ધ્રુવીય પ્રવાહીમાં ઓગળેલા વાસ્તવિક દ્રાવ્યો સાથે, π = iCRT સમીકરણ લાગુ પડે છે, જ્યાં i વાન્ટ હોફ ફેક્ટર છે.", "પર્યાવરણનો અભિસારી (hypertonic) ગુણધર્મ કોષમાંથી પાણી કાઢી લે છે અને પર્યાવરણનો ઐસોટોનિક (isotonic) ગુણધર્મ કોષની સમતાપી (plasmolysis) સ્થિતિ ઊભી કરે છે.", "ઓસમોસિસ માત્ર અર્ધપારગમ્ય ઝીલ (semipermeable membrane) હોય ત્યારે જ સંભવ છે."], "correct": 2, "explain": "આ નિવેદન ખોટું છે: અભિસારી (hypertonic) પર્યાવરણ કોષમાંથી પાણી કાઢી લે છે, પરંતુ સમાનસારી (isotonic) પર્યાવરણ કોષની સમતાપી (plasmolysis) સ્થિતિ ઊભી કરતું નથી – ઐસોટોનિક પર્યાવરણમાં શુદ્ધ જળચલન (net water movement) શૂન્ય હોય છે. plasmolysis અભિસારી પર્યાવરણમાં જ થાય છે.", "tag": ""}, {"q": "પ્રોટીન માઇસેલ્સ (micelles) ની રચના અંગેની સત્યતા ઓળખો:", "opts": ["મિશ્ર ચરબીદ્રાવ્ય (amphipathic) સ્વભાવ ધરાવતા અણુઓ દ્રાવકમાં વિસરાયેલા અવસ્થામાં ઝાલકીકૃત (spheroids) સમૂહ રચે છે.", "માઇસેલ્સ ફક્ત પાણીમાં જ રચાય છે અને ઓર્ગેનિક સોલ્વેન્ટ્સમાં કદાપિ રચાતા નથી.", "મિશ્ર ચરબીદ્રાવ્ય (amphipathic) સ્વભાવ ધરાવતા અણુઓ (જેમ કે સોડિયમ સ્ટિઅરેટ) ચરબીદ્રાવ્ય (lipophilic) તરફ વળેલા હોય છે અને ઝાલકીકૃત (spheroids) રચે છે જેમાં જળઅનુરાગી (hydrophilic) પોરા (shell) બાહ્યતામાં હોય છે.", "માઇસેલ્સ રચના દરમિયાન ઇન્ટ્રામોલેક્યુલર હાઇડ્રોજન બંધ બંધાય છે અને આ પ્રક્રિયા માટે કોઈ પણ ઉર્જાની જરૂર હોતી નથી."], "correct": 0, "explain": "મિશ્ર ચરબીદ્રાવ્ય (amphipathic) સ્વભાવ ધરાવતા અણુઓ (જેમ કે ચરબી અમ્લોની લवણો) દ્રાવકમાં વિસરાયેલા અવસ્થામાં ઝાલકીકૃત (spheroids) સમૂહ રચે છે – આયનીય જળઅનુરાગી (hydrophilic) માથું પાણી તરફ અને ચરબીનુસ્સી ચરબીદ્રાવ્ય (lipophilic) પૂંછડી અંદર તરફ. આમ માઇસેલ્સની રચના જૈવિક પ્રણાલીઓમાં મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "નીચેની રચનાક્રમિક ક્રમો (sequence motifs) માંથી કઈ 'મેટલ-ઇન્ડ્યુસિબલ ટ્રાન્સક્રિપ્શન' (metallothionein-type) રચના સાથે સીધું સંબંધિત નથી?", "opts": ["[C-X-C] motif – ડિસ્ફાઇડ બ્રિજ રચના સાથે સંકળાયેલું છે.", "Zn²⁺-સંકીર્ણ (Zinc-finger) motif – ન્યુક્લિક એસિડની જોડાણ સાથે સંકળાયેલું છે.", "[H-X₂₅-H] motif – [2Fe-2S] અથવા [4Fe-4S] સેન્ટર માટે જવાબદાર છે.", "ડિસ્ફાઇડ સેતુ (Disulfide bridge) – ફોસ્ફોલીપિડ બાયલેયરમાં અસ્થિરતા મૂકે છે અને ચયાપચયી પ્રવૃત્તિ (metabolic activity) વધારે છે."], "correct": 3, "explain": "ડિસ્ફાઇડ સેતુ (disulfide bridge) પ્રોટીન સ્તરોને સ્થિર કરે છે, પરંતુ તે ફોસ્ફોલીપિડ બાયલેયરમાં અસ્થિરતા મૂકતો નથી. ડિસ્ફાઇડ સેતુ મુખ્યત્વે પેપ્ટાઇડ શૃંખલાઓ વચ્ચેના Cystein-તત્વો વચ્ચે સ્થિરતા ફક્ટરો પ્રદાન કરે છે, અને તેઓ ચયાપચયી પ્રવૃત્તિ (metabolic activity) સિધ્ધાંત સાથે સંકળાયેલા નથી.", "tag": ""}, {"q": "એન્ઝાઇમની પ્રવર્તકતામાં અનાવાદી અવરોધક (Non-competitive inhibitor) શું કરે છે?", "opts": ["એન્ઝાઇમના સક્રિય ક્ષેત્ર (Active site) માં જોડાય છે", "સક્રિય ક્ષેત્ર વિનાના અન્ય સ્થાને જોડાઈને એન્ઝાઇમની આકૃતિ બદલે છે", "સબ્સ્ટ્રેટ સાથે સ્પર્ધા કરે છે", "એન્ઝાઇમનું સંપૂર્ણ નિષ્ક્રિયકરણ (Denaturation) કરી દે છે"], "correct": 1, "explain": "અનાવાદી અવરોધક એન્ઝાઇમના સક્રિય ક્ષેત્રને બદલે અન્ય કોઈ ભાગ ( allosteric site ) સાથે જોડાય છે, જેથી એન્ઝાઇમની તૃતીયક રચના (Tertiary structure) બદલાઈ જાય છે અને સક્રિય ક્ષેત્ર અકાર્યક્ષમ થઈ જાય છે. આથી સબ્સ્ટ્રેટ બંધાય તેમ નથી.", "tag": ""}, {"q": "એન્ઝાઇમ પ્રવર્તન વેગ (Rate of enzyme reaction) સબ્સ્ટ્રેટ સાંદ્રતા સાથેના સંબંધનું વર્ણન કર         '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

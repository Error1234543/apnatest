<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}

@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}

<script>
const QUIZ = [{"q": "શ્વસન (Respiration) નીચેનામાંથી કઈ પ્રક્રિયા છે?", "opts": ["ભોજનનું વિઘટન થઈ ઉર્જા મુક્ત થવી", "વાયુ આપ-લે પ્રક્રિયા", "પ્રકાશસંશ્લેષણ", "પ્રસરણ"], "correct": 0, "explain": "શ્વસન એ જૈવિક પ્રક્રિયા છે જેમાં ઑક્સિડેટિવ વિઘટન દ્વારા ગ્લુકોઝ જેવા ભોજન પદાર્થોનું વિઘટન થાય છે અને ઉર્જા મુક્ત થાય છે, જે ATP રૂપમાં સંગ્રહિત થાય છે.", "tag": ""}, {"q": "સામાન્ય સમીકરણ અનુસાર, શ્વસન પ્રક્રિયામાં આપાત થતા મુખ્ય પરિબળો કયા છે?", "opts": ["ગ્લુકોઝ અને ઑક્સિજન", "કાર્બન ડાયોક્સાઇડ અને પાણી", "પ્રકાશ અને પાણી", "રસાયણો અને ઉષ્મા"], "correct": 0, "explain": "શ્વસનનું સામાન્ય સમીકરણ C6H12O6 + 6O2 → 6CO2 + 6H2O + ઉર્જા છે, જેમાં ગ્લુકોઝ અને ઑક્સિજન પરિભ્રમણ માટે આવશ્યક છે.", "tag": ""}, {"q": "ગ્લાયકોલિસિસ (Glycolysis) પ્રક્રિયા કોષના કયા ભાગમાં સ્થળાયેલ છે?", "opts": ["સાયટોપ્લાઝમ", "માઈટોકોન્ડ્રિયા", "કોષકેન્દ્ર", "રાસાયણિક બહિઃપટલ"], "correct": 0, "explain": "ગ્લાયકોલિસિસ કોષપ્રવાહી (સાયટોપ્લાઝમ) માં થતી પ્રક્રિયા છે, જે શ્વસનનું પ્રથમ પગલું છે.", "tag": ""}, {"q": "જે શ્વસનમાં ઑક્સિજનની હાજરી આવશ્યક હોય છે તેને શું કહે છે?", "opts": ["ઑક્સીકારક શ્વસન", "અનચાયિ શ્વસન", "પ્રકાશસંશ્લેષણ", "પ્રસરણ"], "correct": 0, "explain": "ઑક્સિજનની હાજરીમાં થતું શ્વસન ઑક્સીકારક શ્વસન (Aerobic respiration) કહેવાય છે, જેમાં ગ્લુકોઝનું સંપૂર્ણ વિઘટન થઈ CO2 અને H2O બને છે.", "tag": ""}, {"q": "શ્વસન પ્રક્રિયામાં મુક્ત થતી ઉર્જાનો સંગ્રહ કયા અણુમાં થાય છે?", "opts": ["ATP (Adenosine Triphosphate)", "DNA", "RNA", "પ્રોટીન"], "correct": 0, "explain": "શ્વસન દરમિયાન મુક્ત થતી ઉર્જા ATP (Adenosine Triphosphate) અણુમાં સંગ્રહિત થાય છે, જે કોષીય પ્રવૃત્તિઓ માટે ઉર્જાનો મુખ્ય સ્ત્રોત છે.", "tag": ""}, {"q": "ક્રેબ્સ ચક્રમાં (TCA cycle) કયો એન્ઝાઇમ સક્સિનીલ CoA નું સક્સિનેટમાં રૂપાંતર કરે છે?", "opts": ["સક્સિનીલ CoA સિન્થેટીઝ", "સક્સિનેટ ડીહાઇડ્રોજિનેઝ", "આઈસોસિટ્રેટ ડીહાઇડ્રોજિનેઝ", "સક્સિનેટ સિન્થેટીઝ"], "correct": 0, "explain": "ક્રેબ્સ ચક્રની આગળની પ્રક્રિયામાં સક્સિનીલ CoA નું રૂપાંતર સક્સિનેટમાં સક્સિનીલ CoA સિન્થેટીઝ એન્ઝાઇમ દ્વારા થાય છે, જેમને એક્ટિવેટેડ સુક્સિનેટ રચના સમયે GTP ઉત્પન્ન થાય છે.", "tag": ""}, {"q": "ગ્લાઇકોલિસિસ દરમિયાન સૂક્ષ્મ પાંચ અવસ્થાઓમાંથી કઈ ત્રણ પગલામાં NAD⁺ નું NADH + H⁺ માં રિડક્શન થાય છે?", "opts": ["ગ્લુકોઝ → ગ્લુકોઝ-6-ફોસ્ફેટ પ્રથમ, ફ્રુક્ટોઝ-6-ફોસ્ફેટ → ફ્રુક્ટોઝ-1,6-બિસ્ફોસ્ફેટ, અને ગ્લિસરલડિહાઇડ-3-ફોસ્ફેટ → 1,3-બિસ્ફોસ્ફોગ્લાઇસરેટ", "ગ્લિસરલડિહાઇડ-3-ફોસ્ફેટ → 1,3-બિસ્ફોસ્ફોગ્લાઇસરેટ, 1,3-બિસ્ફોસ્ફોગ્લાઇસરેટ → 3-ફોસ્ફોગ્લાઇસરેટ, અને પિરુવેટ → લેક્ટિક એસિડ", "ગ્લુકોઝ → ગ્લુકોઝ-6-ફોસ્ફેટ, ફ્રુક્ટોઝ-6-ફોસ્ફેટ → ફ્રુક્ટોઝ-1,6-બિસ્ફોસ્ફેટ, અને ગ્લિસરલડિહાઇડ-3-ફોસ્ફેટ → 1,3-બિસ્ફોસ્ફોગ્લાઇસરેટ", "ગ્લુકોઝ → ગ્લાઇસરોલ, ગ્લાઇસરોલ → DAP, અને DAP → PEP"], "correct": 2, "explain": "ગ્લાઇકોલિસિસમાં ફક્ત ગ્લુકોઝનું પ્રથમ ફોસ્ફોરાયલેશન, ફ્રુક્ટોઝ-6-ફોસ્ફેટનું બીજું ફોસ્ફોરાયલેશન અને ગ્લિસરલડિહાઇડ-3-ફોસ્ફેટનું ઑક્સિડેશન આગળ NAD⁺ નું રિડક્શન કરે છે, જે પ્રક્રિયામાં કુલ 2 NADH ઉત્પન્ન થાય છે.", "tag": ""}, {"q": "ક્રેબ્સ ચક્ર (TCA cycle) માં કયા બે પગલામાં CO₂ ની મુક્ત થાય છે?", "opts": ["આઈસોસિટ્રેટ → α-કેટોગ્લુટારેટ, અને α-કેટોગ્લુટારેટ → સક્સિનીલ CoA", "સક્સિનેટ → ફ્યુમેરેટ, અને માલેટ → ઑક્સલોએસિટેટ", "સિટ્રેટ → આઈસોસિટ્રેટ, અને સક્સિનીલ CoA → સક્સિનેટ", "ઑક્સલોએસિટેટ + એસિટલ CoA → સિટ્રેટ, અને ફ્યુમેરેટ → માલેટ"], "correct": 0, "explain": "ક્રેબ્સ ચક્રમાં કુલ 4 પગલામાં CO₂ ની મુક્ત થાય છે. આમાંથી બે CO₂ ની મુક્ત થાય છે જેનાં કારણભૂત પગલાં છે આઈસોસિટ્રેટનું ઑક્સિડેશન અને α-કેટોગ્લુટારેટનું ઑક્સિડેશન – એટલે કે, આઈસોસિટ્રેટ ડીહાઇડ્રોજિનેઝ અને α-કેટોગ્લુટારેટ ડીહાઇડ્રોજિનેઝ પ્રક્રિયા દ્વારા.", "tag": ""}, {"q": "ગ્લાઇકોલિસિસના કયા પગલા પર ફોસ્ફોગ્લિસરેટ કેનાઇઝ (phosphoglycerate kinase) એન્ઝાઇમ દ્વારા ATP ઉત્પન્ન થાય છે?", "opts": ["3-ફોસ્ફોગ્લાઇસરેટ → 2-ફોસ્ફોગ્લાઇસરેટ", "1,3-બિસ્ફોસ્ફોગ્લાઇસરેટ → 3-ફોસ્ફોગ્લાઇસરેટ", "ફોસ્ફોઈનોલ પિરુવેટ → પિરુવેટ", "ગ્લુકોઝ → ગ્લુકોઝ-6-ફોસ્ફેટ"], "correct": 1, "explain": "ફોસ્ફોગ્લિસરેટ કેનાઇઝ એન્ઝાઇમ 1,3-બિસ્ફોસ્ફોગ્લાઇસરેટમાંથી ફોસ્ફેટ ગ્રુપ દૂર કરીને 3-ફોસ્ફોગ્લાઇસરેટ બનાવે છે અને તે સમયે 1 ATP ઉત્પન્ન થાય છે; આ પ્રક્રિયા 2 પિરુવેટ માટે 2 ATP આપે છે.", "tag": ""}, {"q": "ક્રેબ્સ ચક્રના એક પરિભ્રમણ દરમિયાન કઈ સંયોજનાં માત્રામાં ઉત્પન્ન થાય છે?", "opts": ["1 ATP, 2 NADH, 1 FADH₂", "1 GTP, 3 NADH, 1 FADH₂, 2 CO₂", "2 ATP, 2 NADH, 1 FADH₂", "1 ATP, 1 NADH, 2 FADH₂"], "correct": 1, "explain": "ક્રેબ્સ ચક્રના એક પરિભ્રમણ દરમિયાન 1 GTP (જે ATP સમાન કાર્ય કરે છે), 3 NADH, 1 FADH₂ અને 2 CO₂ ઉત્પન્ન થાય છે. આ ઉત્પાદનો ઇલેક્ટ્રોન પરિવહન શૃંખલામાં વધુ ATP બનાવવામાં મદદરૂપ થાય છે.", "tag": ""}, {"q": "શ્વસન શૃંખલા (Electron Transport Chain) માં ইলেক્ટ્રોનનું પરિવહન કયો સાયટોક્રોમ સક્રિયતા બિંદુએ ઑકસિજન સાથે સંયોજિત થાય છે?", "opts": ["સાયટોક્રોમ aa₃ (Complex IV)", "સાયટોક્રોમ b (Complex III)", "સાયટોક્રોમ c", "સાયટોક્રોમ c₁"], "correct": 0, "explain": "સાયટોક્રોમ aa₃ (Complex IV) એ Electron Transport Chain નું છેલ્લું વિદ્યુતવાહક સંકુલ છે, જ્યાં બધાં જ ઇલેક્ટ્રોન છેવટે ઑકસિજન સાથે જોડાઈને H₂O બનાવે છે. આ જ પ્રક્રિયા દરમિયાન પ્રોટોનનું gradient પણ ઉભું થાય છે.", "tag": ""}, {"q": "પીટર મિચેલ (Peter Mitchell) ના રાસાયણિક ઑસ્મોટિક સિદ્ધાંત (Chemiosmotic Hypothesis) અનુસાર, ઑક્સિડેટિવ ફોસ્ફોરિલેશન દરમિયાન ATP ની સંશ્લેષણ શાને કારણે થાય છે?", "opts": ["અંતઃપ્લેઝમિક પટલ (Inner mitochondrial membrane) પર પ્રોટોન (H⁺) ના રાસાયણિક-વિદ્યુત વાહકીય gradient (proton motive force) ની ઉત્પત્તિ", "ક્રેબ્સ ચક્ર (TCA cycle) માં સીધી રીતે GDP નું ATP માં પરિવર્તન", "ગ્લાઇકોલિસિસ (Glycolysis) દરમિયાન સબસ્ટ્રેટ-લેવલ ફોસ્ફોરિલેશન", "NADH માંથી સીધી ઇલેક્ટ્રોન ઉર્જાનો ATP માં રૂપાંતર"], "correct": 0, "explain": "મિચેલના સિદ્ધાંત મુજબ, Electron Transport Chain દરમિયાન પ્રોટોન (H⁺) મેટ્રિક્સથીઇન્ટરમેમ્બ્રેન સ્પેસમાં પંપ થઈને electrochemical proton gradient બનાવે છે. આ gradient F₀F₁ એટપ સિન્થેઝ (ATP Synthase) માંથી પસાર થતાં પ્રોટોન્સ ATP ની સંશ્લેષણ કરાવે છે, જેને chemiosmosis કહે છે.", "tag": ""}, {"q": "જ્યારે શ્વસન શીલ પદાર્થ તરીકે સ્ટિયરિક એસિડ (ત્રીસ કાર્બનની ચરબી) નો ઉપયોગ થાય છે, ત્યારે તેનું શ્વસન ગુણોત્તર (Respiratory Quotient — RQ) કઈ મૂલ્યની નજીક હશે?", "opts": ["લગભગ 0.7", "1.0", "0.9", "1.4"], "correct": 0, "explain": "ચરબીઓ (fats) માં ઓક્સિજનની સાપેક્ષે કાર્બન અને હાઈડ્રોજ       '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<script>
const QUIZ = [{"q": "ફૂલના કેવા ભાગો પર પરાગકોશ (Anther) અને સ્ત્રીગર્ભપટ્ટી (Pistil) બંને હોય છે?", "opts": ["સંપૂર્ણ ફૂલ", "અસંપૂર્ણ ફૂલ", "એકલિંગી ફૂલ", "અપૂર્ણ ફૂલ"], "correct": 0, "explain": "જે ફૂલમાં પુંકેશર (Stamen) અને સ્ત્રીકેસર (Pistil) બંને હાજર હોય તેને સંપૂર્ણ ફૂલ કહે છે. આ પ્રકારના ફૂલમાં બંને લિંગના પ્રજનન અંગો હોય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું અંગ પુમ્બીજકોષનું ઉત્પાદન કરે છે?", "opts": ["પરાગકોશ (Anther)", "અંડાશય (Ovary)", "અંડક (Ovule)", "રજ્જુબંધ (Funiculus)"], "correct": 0, "explain": "પરાગકોશ (Anther) માં રહેલા પરાગરજ કોષ (Microspore mother cell / પિતૃકોષ) અર્ધસૂત્ર વિભાજન દ્વારા પરાગરજો તৈયાર કરે છે, જે પુમ્બીજકોષ (Male gametophyte) નું કાર્ય કરે છે.", "tag": ""}, {"q": "સ્ત્રીબીજકોષનું ઉત્પાદન કયા ભાગમાં થાય છે?", "opts": ["અંડક (Ovule)", "પરાગકોશ (Anther)", "પરાગરજા (Pollen grain)", "અંડરજ્જુ (Integument)"], "correct": 0, "explain": "અંડક (Ovule) અંડાશયની અંદર આવેલું હોય છે, જ્યાં અંડકમાતૃકોષ (Megasporocyte) અર્ધસૂત્રવિભાજન દ્વારા નર્તુક કોષો બનાવે છે, જે પરિપક્વ થઈ સ્ત્રીબીજકોષ (Embryo sac) બને છે.", "tag": ""}, {"q": "પરાગકોશની અંદર પરાગરજ કોષ (Microspore mother cell) ક્યાં આવેલો હોય છે?", "opts": ["પરાગધાની (Connective)", "અંતઃસ્તર (Endothecium)", "પરાગકોશિકામાં (Pollen sac / Microsporangium)", "તાજાં (Tapetum)"], "correct": 2, "explain": "પરાગકોશની અંદરની દરેક પરાગકોશિકા (Microsporangium) માં પરાગરજ કોષ (Microspore mother cell) હોય છે, જે અર્ધસૂત્રવિભાજન પામી ચાર પરાગરજો (Microspores) ઉત્પન્ન કરે છે.", "tag": ""}, {"q": "એકલિંગી ફૂલ (Unisexual flower) નું ઉદાહરણ કયું છે?", "opts": ["ખીરાનું ફૂલ", "ગોળવંટનું ફૂલ", "ગુલદરિયાનું ફૂલ", "તાજના ફૂલ"], "correct": 0, "explain": "ખીરાના છોડ પર પુરષ અને સ્ત્રી ફૂલો અલગ-અલગ હોય છે. આથી ખીરાનું ફૂલ એકલિંગી (Unisexual flower) છે. ગોળવંટનું ફૂલ, ગુલદરિયાનું ફૂલ અને તાજનું ફૂલ બંને લિંગોનું અંગ ધરાવે છે.", "tag": ""}, {"q": "પરાગરજની બહારની જાડી પડ (Exine) નીચેનામાંથી કયા સંયોજનથી બનેલી હોય છે? (A) પેક્ટિન (B) સેલ્યુલોઝ (C) સ્પોરોપોલેનિન (D) લિગ્નિન", "opts": ["પેક્ટિન", "સેલ્યુલોઝ", "સ્પોરોપોલેનિન", "લિગ્નિન"], "correct": 2, "explain": "પરાગરજની Exine પડ સ્પોરોપોલેનિનના સંયોજનથી બનેલી હોય છે, જે અત્યંત મજબૂત અને રસાયણો પ્રત્યે અટકળી ગુણધર્મ ધરાવે છે. તે પરોષકોષીય વાતાવરણમાં પણ પરાગરજને સુરક્ષિત રાખવામાં મદદ કરે છે.", "tag": ""}, {"q": "પાકા પરાગરજ (Mature pollen grain) માં કોષદ્રવ્યમાં કેટલા કોષો મળી આવે છે? (A) એક (B) બે — વનસ્પતિ કોષ અને જનીનીય કોષ (C) ત્રણ (D) ચાર", "opts": ["એક", "બે — વનસ્પતિ કોષ અને જનીનીય કોષ", "ત્રણ", "ચાર"], "correct": 1, "explain": "પાકા પરાગરજમાં વનસ્પતિ કોષ (Vegetative cell) અને જનીનીય કોષ (Generative cell) એમ બે કોષો હોય છે. જનીનીય કોષ પરાગમાર્ગ (Pollen tube) ના વિકાસ દરમિયાન વિભાજન પામી બે પુમ્બીજકોષો બનાવે છે.", "tag": ""}, {"q": "સ્વપરાગમન (Self-pollination) ને અવરોધવા માટે ફૂલમાં જોવા મળતી રચનાત્મક અવરોધની પદ્ધતિને શું કહે છે? (A) હર્કોગમી (B) ક્લીસ્ટોગમી (C) પોલેનોટિક સમાપ્તિ (D) પોલેન-સ્તંભી અસંગતતા", "opts": ["હર્કોગમી", "ક્લીસ્ટોગમી", "પોલેનોટિક સમાપ્તિ", "પોલેન-સ્તંભી અસંગતતા"], "correct": 3, "explain": "પોલેન-સ્તંભી અસંગતતા (Pistillate self-incompatibility) એ એક રચનાત્મક અવરોધ છે જેમાં સ્વપરાગનું ઉન્નતન થતું રોકે છે. આ પ્રક્રિયા જનીનીય સ્તરે કાર્ય કરે છે અને આંતરફૂલીય પરોષણને પ્રોત્સાહન આપે છે.", "tag": ""}, {"q": "દ્વિ-નિશ્ણેચન (Double fertilization) દરમિયાન ત્રિસંયોગ (Triple fusion) થતાં બનતો કોષ કેટલા ગુણસંખ્યા (Chromosome) ધરાવે છે, જો ફૂલનું શારીરિક કોષ ૨n = ૧૪ હોય? (A) ૭ (B) ૧૦ (C) ૧૪ (D) ૨૧", "opts": ["૭", "૧૦", "૧૪", "૨૧"], "correct": 3, "explain": "ત્રિસંયોગમાં બે ધ્રુવીય કોષો (n+n=2n) સાથે એક પુમ્બીજકોષ (n) મળે છે, તેથી બનતો કોષ 3n થાય. જો 2n=14 હોય, તો n=7 અને 3n=21 ગુણસંખ્યા ધરાવે છે.", "tag": ""}, {"q": "એપોમિક્સિસ (Apomixis) શાની ક્રિયા છે? (A) સંયોગી પ્રજનન જેમાં પ્રજનનકોષોનો સંયોગ થાય છે (B) બીજઉત્પાદન વિનાની પ્રક્રિયા જેમાં પરોષણ વગર બીજ બને છે (C) બે અલગ-અલગ ફૂલો વચ્ચે પરોષણ (D) અંગાણુ વિભાજનથી પ્રજનન", "opts": ["સંયોગી પ્રજનન જેમાં પ્રજનનકોષોનો સંયોગ થાય છે", "બીજઉત્પાદન વિનાની પ્રક્રિયા જેમાં પરોષણ વગર બીજ બને છે", "બે અલગ-અલગ ફૂલો વચ્ચે પરોષણ", "અંગાણુ વિભાજનથી પ્રજનન"], "correct": 1, "explain": "એપોમિક્સિસ એ યૌન પ્રજનનનું બદલી કાઢતું કાર્ય છે જેમાં પરોષણ વગર જ બીજનું નિર્માણ થાય છે. આ પ્રક્રિયામાં સિંગમી (Syngamy) નો સમાવેશ થતો નથી, પરંતુ બીજ અને ફળનું નિર્માણ થાય છે.", "tag": ""}, {"q": "પરોષમન પછી પરોષનળિકા (Pollen tube) ના અગ્રભાગે (Apex) કયું ગેમીટ સ્થિત હોય છે અને તેનો મુખ્ય કાર્ય શું છે?", "opts": ["સંવર્ધક ગેમીટ (Vegetative cell) — પરોષનળિકાના વિકાસ અને પોષણમાં સહાય", "નર ગેમીટ (Male gamete) — અંડકોષ સાથે સંયોગ", "ત્રિસંયોગજનીત (Triploid) પ્રાથમિક ભ્રૂણજ સ્તર — એન્ડોસ્પર્મ બનાવે છે", "કેન્દ્રક વિહીન કોષ — આંતરિક સ્તરનું નિર્માણ કરે છે"], "correct": 0, "explain": "પરોષનળિકાના અગ્રભાગે સંવર્ધક ગેમીટ (Vegetative cell) હોય છે જે નળિકાના દીવાલનું નિર્માણ અને વૃદ્ધિ માટે જવાબદાર છે. નર ગેમીટ્સ પાછળના ભાગમાં રહે છે.", "tag": ""}, {"q": "કયા પ્રકારના પરોષમન પછી, પરોષનળિકા અંડકોષમાં 'કેમ્બોફાઈલ' માર્ગે પ્રવેશે છે?", "opts": ["જ્યારે અંડકોષ પરોષનળિકાને 'લુકેન્ટિકોપિલ' દ્વારા આમંત્રિત કરતું નથી", "જ્યારે અંડકોષના 'ફિલિફોર્મ અપેરેચર'ની ગેરહાજરી હોય", "જ્યારે પરોષનળિકા 'ટેલોફાઈલ' રસ્તે આગળ વધે છે", "જ્યારે પરોષનળિકા 'મેગાસ્પોર' દ્વારા અંડકોષ સુધી પહોંચે છે"], "correct": 0, "explain": "કેમ્બોફાઈલ માર્ગે પરોષનળિકા અંડકોષના મુક્ત કોષકેન્દ્ર (Centrum) ની આસપાસ વળીને પ્રવેશે છે, જે સામાન્ય રીતે 'લુકેન્ટિકોપિલ' (ચક્ષુ દ્વારા) માર્ગે ન પ્રવેસતા હોય ત્યારે જોવા મળે છે.", "tag": ""}, {"q": "નર ગેમીટોજેનેસિસ (Microgametogenesis) દરમિયાન પરોષરજના બે પરોષ ગેમીટ્સનું ઉત્પાદન કયા પ્રકારના વિભાજનથી થાય છે?", "opts": ["સમવિભાજન (Mitosis) — નર ગેમીટ કોષનું બે નર ગેમીટ્સમાં વિભાજન", "અર્ધસૂત્રી વિભાજન (Meiosis) — પરોષમાધિક કોષનું ચાર પરોષરજમાં વિભાજન", "વિષમવિભાજન (Heterotypic division) — જેમાં કોષકેન્દ્રનું વિભાજન બંધ થાય છે", "બહુવિધ વિભાજન (Multiple fission) — એક કોષમાંથી ઘણા ગેમીટ્સનું ઉત્પાદન"], "correct": 0, "explain": "નર ગેમીટ કોષ (Generative cell) સમવિભાજન (Mitosis) થી બે નર ગેમીટ્સમાં વિભાજન પામે છે, જે યુગ્મનિજન માટે જવાબદાર છે. અર્ધસૂત્રી વિભાજન પરોષમાધિક કોષ (Microspore mother cell) માં થાય છે.", "tag": ""}, {"q": "પરોષરજના બહિઃસ્તર (Exine) નીચેનું આંતરિક સ્તર (Intine) કયા સંયોજનોનું બનેલું હોય છે?", "opts": ["સેલ્યુલોઝ અને પેક્ટિન", "સપોરોપોલેનિન", "લિગ્નિન અને સબેરિન", "કેરોટિનોઇડ્સ અને ફ્લેવોનોઇડ્સ"], "correct": 0, "explain": "Intine આંતરિક, પાતળું સ્તર છે જે મુખ્યત્વે સેલ્યુલોઝ અને પેક્ટિનનું બનેલું હોય છે, જ્યારે Exine બહિઃસ્તર સપોરોપોલેનિનનું બનેલું હોય છે.", "tag": ""}, {"q": "પરોષમન પછી પરોષનળિકાના વિકાસ દરમિયાન, કયું કોષ અંતે ક્ષય પામે છે?", "opts": ["સંવર્ધક ગેમીટ (Vegetative cell)", "નર ગેમીટ (Male gamete)", "ત્રિસંયોગજનીત કોષ", "અંડકોષ (Egg cell)"], "correct": 0, "explain": "સંવર્ધક ગેમીટ (Vegetative cell) પરોષનળિકાના વિકાસમાં મદદ કરે છે અને સંયોગ પછી ક્ષય પામે છે. નર ગેમીટ્સ સંયોગમાં ભાગ લે છે અને તેથી ક્ષય પામતા નથી.", "tag": ""}, {"q": "અંડપીઠ (Ovule) ના કણ્ઠમાં રહેલા મેગાસ્પોરોજેનસ્ટોઇટ કોષના અર્ધ સૂત્ર વિભાજન (Meiosis) પછી બનતા ચાર મેગાસ્પોર્સમાંથી કેટલા કાર્યક્ષમ હોય છે અને બાકીના શું બને છે?", "opts": ["એક કાર્યક્ષમ હોય છે; ત્રણ ક્ષય પામે છે", "બે કાર્યક્ષમ હોય છે; બે ક્ષય પામે છે", "ત્રણ કાર્યક્ષમ હોય છે; એક ક્ષય પામે છે", "ચારે કાર્યક્ષમ હોય છે; કોઈ ક્ષય પામતું નથી"], "correct": 0, "explain": "દવોગળી સમયે મેગાસ્પોરોજેનસ્ટોઇટ કોષના અર્ધ સૂત્ર વિભાજનથી ચાર મેગાસ્પોર્સ બને છે, પરંતુ તેમાંથી માત્ર એક જ કાર્યક્ષમ થાય છે અને બાકીના ત્રણ ક્ષય પામે છે. આ એક કાર્યક્ષમ મેગાસ્પોર પર મેગાગેમિટોજેનેસિસ શરૂ થાય છે.", "tag": ""}, {"q": "બીજકોષની (Nucellus) ગોઠવણી અને પોષણ પ્રાપ્તિના સંદર્ભમાં, અંડપીઠમાં મેગાસ્પોરોજેનસ્ટોઇટ કોષ ક્યાં આવેલો હોય છે?", "opts": ["બીજકોષની અંદર, મધ્ય ભાગે", "બીજકોષની બહાર, કણ્ઠ પ્રાંતમાં", "બીજકોષ અને નિષ્કાસિકા વચ્ચે", "કણ્ઠ પ્રાંતની નજીક, બીજકોષની બાહ્ય સપાટી પર"], "correct": 0, "explain": "મેગાસ્પોરોજેનસ્ટોઇટ કોષ (કે સ્યુટે કોષ) બીજકોષ (Nucellus) ની અંદર મધ્ય ભાગે આવેલો હોય છે. બીજકોષ જ તેને પોષક તત્વો પૂરાં પાડે છે.", "tag": ""}, {"q": "અંડકોષ (Embryo sac) ના વિકાસ દરમિયાન, મેગાગેમિટોજેનેસિસમાં ત્રણ વાર ન્યુક્લીયર વિભાજન થયા બાદ કુલ કેટલા ન્યુક્લીયસ અને કેટલા કોષો બને છે?", "opts": ["8 ન્યુક્લીયસ અને 7 કોષો", "4 ન્યુક્લીયસ અને 4 કોષો", "8 ન્યુક્લીયસ અને 8 કોષો", "4 ન્યુક્લીયસ અને 7 કોષો"], "correct": 0, "explain": "મેગાગેમિટોજેનેસિસ દરમિયાન ત્રણ વાર ન્યુક્લીયર વિભાજન થવાથી અંડકોષમાં કુલ 8 ન્યુક્લીયસ બન છે, પરંતુ કોષપટલનું વિભાજન ફક્ત ચોથા તબક્કે થાય છે, તેથી અંતે 7 કોષો બને છે (8 ન્યુક્લીયસમાંનાં 2 ધ્રુવીય ન્યુક્લીયસ સાથેનું કેન્દ્રક ન બનતાં પણ રહે છે).", "tag": ""}, {"q": "પક્ષ્મદલક (Mitotic) વિભાજનો દરમિયાન પ્રથમ વિભાજન ક્યાં થાય છે અને બીજું વિભાજન ક્યાં થાય છે?", "opts": ["પ્રથમ વિભાજન ઇગ્ઝેમ્બ્રાયોનિક ધ્રુવે, બીજું વિભાજન કેમેરોપાયલ ધ્રુવે", "પ્રથમ વિભાજન કેમેરોપાયલ ધ્રુવે, બીજું વિભાજન ઇગ્ઝેમ્બ્રાયોનિક ધ્રુવે", "બંને વિભાજનો ઇગ્ઝેમ્બ્રાયોનિક ધ્રુવે", "બંને વિભાજનો કેમેરોપાયલ ધ્રુવે"], "correct": 0, "explain": "અંડકોષના વિકાસમાં પ્રથમ ન્યુક્લીયર વિભાજન ઇગ્ઝેમ્બ્રાયોનિક (ઉપરના) ધ્રુવે થાય છે, જેથી બે ન્યુક્લીયસ ઉભરે છે. બીજું વિભાજન કેમેરોપાયલ (નીચેના) ધ્રુવે થાય છે. આ પ્રકારે દરેક ધ્રુવે 2–2 ન્યુક્લીયસ બને છે.", "tag": ""}, {"q": "પૂર્ણ વિકસિત અંડકોષ (Embryo sac) માં પોતાની ભૂમિકા મુજબ ગોઠવાયેલા ગેમીટો અને સહાયક કોષો કયા સ્થાને હોય છે?", "opts": ["એગ્ઝેમ્બ્રાયોનિક ધ્રુવે 3 પ્રોસિડ કોષ, કેમેરોપાયલ ધ્રુવે 2 ધ્રુવીય કોષ અને 2 અન્ય ન્યુક્લીયસ, વચ્ચે 2 સહાયક કોષ અને 1 અંડકોષ", "એગ્ઝેમ્બ્રાયોનિક ધ્રુવે 2 પ્રોસિડ કોષ, કેમેરોપાયલ ધ્રુવે 3 ન્યુક્લીયસ, અને 1 અંડકોષ", "બધા 7 કોષો એકસરખા ગોઠવાયેલા હોય છે", "અંડકોષ અને 2 સહાયક કોષ એગ્ઝેમ્બ્રાયોનિક ધ્રુવે, અને 3 પ્રોસિડ કોષ કેમેરોપાયલ ધ્રુવે"], "correct": 0, "explain": "પૂર્ણ વિકસિત અંડકોષમાં એગ્ઝેમ્બ્રાયોનિક ધ્રુવે 3 પ્રોસિડ કોષો, કેમેરોપાયલ ધ્રુવે 2 ધ્રુવીય કોષો અને બે મુક્ત ન્યુક્લીયસ, અને વચ્ચે 2 સહાયક કોષો તથા 1 મોટા અંડકોષની ગોઠવણી હોય છે — આ કુલ 7 કોષો / 8 ન્યુક્લીયસની યોજના છે.", "tag": ""}, {"q": "પાકા અંડક (Mature ovule) માં, ડેટ્રોસિસ (chalazal) ટેકાળાના ભાગથી શરૂ થઈને વિંધુક (micropylar) છેડા તરફ ગોઠવાયેલી કોષીય ગોઠવણી કઈ છે?", "opts": ["એક ટેગમેન્ટ (integument), એક મેગાસ્પોર, ત્રણ નોન-એમ્બ્રિયોગેનિક કોષો, એક એમ્બ્રિયો સેક વાહિન્ય", "બે ટેગમેન્ટ, એક મેગાસ્પોર, ચાર નોન-એમ્બ્રિયોગેનિક કોષો, એક એમ્બ્રિયો સેક વાહિન્ય", "બે ટેગમેન્ટ, એક મેગાસ્પોર, ત્રણ નોન-એમ્બ્રિયોગેનિક કોષો, એક એમ્બ્રિયો સેક વા       '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

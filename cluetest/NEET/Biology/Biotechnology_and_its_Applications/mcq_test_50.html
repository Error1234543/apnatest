<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biotechnology and its Applications — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Biotechnology and its Applications — 📝 50 MCQ Test</h1>

  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-06</footer>
</div>
<script>
const QUIZ = [{"q": "જીવતંત્ર વિજ્ઞાન (Biotechnology) ની પદ્ધતિઓનો સીધો સંબંધ કઈ જૈવિક પ્રક્રિયાઓ સાથે છે?", "opts": ["કોષીય અને અણુજીવવિજ્ઞાનીય (cellular and molecular) પ્રક્રિયાઓ", "માત્ર પર્યાવરણીય પ્રક્રિયાઓ", "માત્ર પશુશાસ્ત્રીય પ્રક્રિયાઓ", "માત્ર વનસ્પતિશાસ્ત્રીય પ્રક્રિયાઓ"], "correct": 0, "explain": "જીવતંત્ર વિજ્ઞાન એટલે કોષીય અને અણુજીવવિજ્ઞાનીય (cellular and molecular) પ્રક્રિયાઓનો ઉપયોગ કરીને વનસ્પતિ, પ્રાણી અને સૂક્ષ્મજીવોમાંથી ઉત્પાદનો બનાવવાની પદ્ધતિ.", "tag": ""}, {"q": "આધુનિક જીવતંત્ર વિજ્ઞાન (Modern Biotechnology) ની શરૂઆત કયા વર્ષમાં થઈ હતી?", "opts": ["૧૯૭૮ દશકમાં", "૧૯૫૦ દશકમાં", "૧૯૯૦ દશકમાં", "૨૦૦૦ દશકમાં"], "correct": 0, "explain": "આધુનિક જીવતંત્ર વિજ્ઞાન (Modern Biotechnology) ની શરૂઆત ૧૯૭૮ દશકમાં થઈ, જ્યારે હર બાયન ઇન્સ્યુલિન (Insulin) માટે રેકોમ્બિનન્ટ DNA પદ્ધતિ વિકસાવવામાં આવી.", "tag": ""}, {"q": "રેકોમ્બિનન્ટ DNA (rDNA) તકનીકના સિદ્ધાંત મુખ્યત્વે કઈ બે મૂળભૂત પદ્ધતિઓ પર આધારિત છે?", "opts": ["આંતરિયાળ કર્તાએન્જાઇમો (Restriction Enzymes) અને જનીન અંતરાણ (Gene Transfer)", "માત્ર PCR અને સ્વચ્છતાકરણ (Pure Culture)", "માત્ર ઇલેક્ટ્રોફોરેસિસ અને ધ્રુવીય દ્રવ્ય", "માત્ર અનુકૂલન (Adaptation) અને ઉત્ક્રાંતિ"], "correct": 0, "explain": "રેકોમ્બિનન્ટ DNA (rDNA) તકનીક બે મૂળભૂત પદ્ધતિઓ પર આધારિત છે: (૧) આંતરિયાળ કર્તાએન્જાઇમો દ્વારા DNA નું આંતરિયન (Cutting), અને (૨) જનીન અંતરાણ (Gene Transfer) દ્વારા તેને પ્રતિરોપીક (Vector) માં મૂકવું.", "tag": ""}, {"q": "પ્રથમ જીવતંત્ર વિજ્ઞાન આધારિત ફાર્માસ્યુટિકલ ઉત્પાદન કયું હતું, જેનું વર્ષ ૧૯૮૨માં US Food and Drug Administration દ્વારા મંજૂરી મળી હતી?", "opts": ["ઇન્સ્યુલિન (Insulin)", "ઇન્સ્યુલિન-પ્રતિદેહ (Insulin antibody)", "વૃદ્ધિ હોર્મોન (Growth Hormone)", "બીટા-ઇન્ટરફેરોન (Beta-interferon)"], "correct": 0, "explain": "ઇન્સ્યુલિન (Insulin) પ્રથમ જીવતંત્ર વિજ્ઞાન આધારિત ફાર્માસ્યુટિકલ ઉત્પાદન હતું, જેને ૧૯૮૨માં US FDA દ્વારા મંજૂરી મળી હતી. તેના લિયોટિક ઇન્સ્યુલિન (Lilly's Insulin) નું નામ હતું.", "tag": ""}, {"q": "નિંદ્રાગૃહીત જીન (Recombinant gene) ને પ્રતિરોપીક (Vector) માં કયો એન્જાઇમ જોડે છે?", "opts": ["ડીએનએ લાયગેઝ (DNA Ligase)", "આંતરિયાળ કર્તાએન્જાઇમ (Restriction Endonuclease)", "RNA પોલિમેરેઝ (RNA Polymerase)", "ડીએનએ પોલિમેરેઝ (DNA Polymerase)"], "correct": 0, "explain": "ડીએનએ લાયગેઝ (DNA Ligase) એન્જાઇમ નિંદ્રાગૃહીત જીન (Recombinant gene) ને પ્રતિરોપીક (Vector) માં જોડે છે. આ એન્જાઇમને 'જီન સોય' (Gene Glue) તરીકે પણ ઓળખવામાં આવે છે.", "tag": ""}, {"q": "રિસ્ત્રિક્શન એન્ડોન્યુક્લિએઝ એન્ઝાઇમ્સ દ્વારા DNA ના કયા પ્રકારના બેઝ ક્રમને ઓળખીને કાપવામાં આવે છે?", "opts": ["પેલિન્ડ્રોમિક (Palindrome) ક્રમ", "ઓરિજિન ઓફ રિપ્લિકેશન", "પ્રોમોટર ક્રમ", "ટિર્મિનેશન સિક્વન્સ"], "correct": 0, "explain": "રિસ્ત્રિક્શન એન્ડોન્યુક્લિએઝ એન્ઝાઇમ્સ DNA ના ચોક્કસ પેલિન્ડ્રોમિક ક્રમને ઓળખે છે અને તે જગ્યાએ કાપે છે. આ ક્રમોમાં ફર્સ્ટ-સ્ટ્રેન્ડ અને સેકન્ડ-સ્ટ્રેન્ડ બંને તરફથી વાંચવામાં સમાન ક્રમ હોય છે, જે રિકોમ્બિનન્ટ DNA બનાવવા માટે મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "એલિમેન્ટરી એનલેસિસ (Electrophoresis) પદ્ધતિમાં નેગેટિવ વીજભાર ધરાવતા DNA સેગમેન્ટ્સ કયા દિશામાં ગતિ કરે છે?", "opts": ["એનોડ (ધન ઇલેક્ટ્રોડ) તરફ", "કેથોડ (ઋણ ઇલેક્ટ્રોડ) તરફ", "કોઈ પણ દિશામાં બિન-નિયંત્રિત", "જેલની સપાટી પર સમાંતર"], "correct": 0, "explain": "DNA માં ફોસ્ફેટ જૂથોને કારણે નેગેટિવ વીજભાર હોય છે, જેથી તેઓ પોઝિટિવ ચાર્જ ધરાવતા એનોડ તરફ આકર્ષાઈને ગતિ કરે છે. આ પદ્ધતિ DNA ટુકડાઓને તેમના કદ મુજબ અલગ કરવા માટે ઉપયોગમાં લેવાય છે.", "tag": ""}, {"q": "રિકોમ્બિનન્ટ DNA બનાવવા માટે વિવિધ સ્રોતોમાંથી DNA ટુકડાઓને જોડવા માટે કઈ એન્ઝાઇમનો ઉપયોગ થાય છે?", "opts": ["DNA લાઈગેઝ (Ligase)", "રિસ્ત્રિક્શન એન્ડોન્યુક્લિએઝ", "ટેરાપોલિમેરેઝ", "રિવર્સ ટ્રાન્સક્રિપ્ટેઝ"], "correct": 0, "explain": "DNA લાઈગેઝ એન્ઝાઇમ DNA ના બે ટુકડાઓ વચ્ચે ફોસ્ફોડાયેસ્ટર બંધ બનાવીને તેમને જોડે છે. રિકોમ્બિનન્ટ DNA બનાવતી વખતે ઇનસર્ટ અને વેક્ટરને જોડવા માટે આ એન્ઝાઇમનો ઉપયોગ થાય છે.", "tag": ""}, {"q": "પ્લાઝમિડ અને ટિ-પ્લાઝમિડ વચ્ચેનો મુખ્ય તફાવત કયો છે?", "opts": ["ટિ-પ્લાઝમિડમાં ટર્ગર વિસ્તાર (T-region) હોય છે જે આંગિક શાકભાજીના જીનોમમાં ડીએનએ પ્રતિરોપિત કરી શકે છે.", "પ્લાઝમિડમાં કોઈ પણ પ્રતિરોપણ ક્ષમતા નથી.", "ટિ-પ્લાઝમિડ કોષશીભ g": ""}, {"q": "જન્યુતંત્ર (વેક્ટર) ના પ્રવેશ દ્વારા કોષમાં રિકોમ્બિનન્ટ ડીએનએ મૂકવાની પ્રક્રિયાને શું કહે છે?", "opts": ["ટ્રાન્સડક્શન", "ટ્રાન્સફોર્મેશન", "ટ્રાન્સલેશન", "ટ્રાન્સક્રિપ્શન"], "correct": 1, "explain": "જન્યુતંત્ર (વેક્ટર) સાથે રિકોમ્બિનન્ટ ડીએનએને બેક્ટેરિયલ કોષમાં મૂકવાની પ્રક્રિયાને ટ્રાન્સફોર્મેશન કહે છે. આ પગલા પછી જ કોષ રિકોમ્બિનન્ટ ડીએનએની પ્રતિકૃતિ કરી શકે છે.", "tag": ""}, {"q": "રિકોમ્બિનન્ટ ડીએનએ ધરાવતા કોષોનું અન્ય કોષોથી અલગ પાડવા માટે કયો ગુણધર્મ ઉપયોગી બને છે?", "opts": ["જન્યુતંત્ર પરની ઔષધ પ્રતિરોધક જનીન (આંતરિક વિભેદક)", "કોષની કદમાં ફેરફાર", "કોષની રંગભેદ ધારણા કરવાની ક્ષમતા", "કોષની ગતિશીલતા"], "correct": 0, "explain": "જન્યુતંત્રમાં ઘણીવાર એકથી વધુ ચિહ્નક જનીનો (જેમ કે ઔષધ પ્રતિરોધક જનીન) હોય છે. જે કોષોમાં જન્યુતંત્ર પ્રવેશે છે તેઓ જ સિલેક્ટિવ માધ્યમ પર ઉગી શકે છે, જ્યારે જે કોષોમાં જન્યુતંત્ર નથી પ્રવેશ્યું તેઓ મૃત્યુ પામે છે. આને આંતરિક વિભેદન (intracellular differentiation) કહેવામાં આવે છે.", "tag": ""}, {"q": "પોલિમરેઝ ચેઈન રિએક્શન (PCR) દ્વારા ઇચ્છિત જનીનની વધુ પ્રમાણમાં પ્રતિકૃતિ કરવા માટે કયું તાપમાન ચક્રમાં વપરાય છે?", "opts": ["માત્ર એક સ્થિર તાપમાન", "ઠંડક અને ઉષ્ણતાનો કોઈ ચોક્કસ ચક્ર નથી", "ઉષ્ણતા, વિઘટન અને નિર્માણના ચોક્કસ તાપમાનોનો ચક્ર", "માત્ર ઠંડક તાપમાન"], "correct": 2, "explain": "PCR માં ત્રણ તાપમાનોનો ચક્ર વપરાય છે – ડીનેચ્યુરેશન (94°C), એન્સેપ્શન (55°C) અને એક્સ્ટેન્શન (72°C). આ તાપમાન ચક્ર દ્વારા ઇચ્છિત ડીએનએ ટુકડાનું એક્સપોનેન્શિયલ વધારો થાય છે.", "tag": ""}, {"q": "રીકોમ્બિનંત ડીએનએ તકનીકના નીચેના વિધાનોમાંથી કયું સही નથી?", "opts": ["પ્લાઝમિડ વેક્ટર સામાન્ય રીતે એગ્રોબેક્ટેરિયમમાં રિકોમ્બિનંત ડીએનએ બનાવવામાં વપરાય છે.", "ટૌફ (Ti) પ્લાઝમિડ એગ્રોબેક્ટેરિયમ તમોફેસિયમમાં કૃત્રિમ વેક્ટર તરીકે વપરાય છે.", "રીકોમ્બિનંત ડીએનએ ધરાવતા કોષોને વૃદ્ધિ માટે પોષક મેડિયમ પર ઊભા કરવામાં આવે છે.", "રીકોમ્બિનંત ડીએનએ પ્રક્રિયામાં DNA પોલીમરેઝ એન્ઝાઇમનો સીધો ઉપયોગ થતો નથી."], "correct": 1, "explain": "ટૌફ (Ti) પ્લાઝમિડ એગ્રોબેક્ટેરિયમ તમોફેસિયમનું પ્રાકૃતિક પ્લાઝમિડ છે, જેને વેક્ટર તરીકે વાપરવા માટે જનીનભાર (gene of interest) દાખલ કરવામાં આવે છે. ટૌફ પ્લાઝમિડનો ઉપયોગ છોડના કોષોમાં રિકોમ્બિનંત ડીએનએ દાખલ કરવા માટે થાય છે, પ્રાણી કોષોમાં નહીં.", "tag": ""}, {"q": "PCR પ્રક્રિયામાં નીચેનામાંથી કયું પગલું સમાવિષ્ટ નથી?", "opts": ["ડિનેચ્યુરેશન", "એનિલિંગ", "એક્સટેન્શન", "ટ્રાન્સફર્મેશન"], "correct": 3, "explain": "PCR માં ત્રણ મુખ્ય પગલાં હોય છે: ડિનેચ્યુરેશન (94°C), એનિલિંગ (40-60°C), અને એક્સટેન્શન (72°C). ટ્રાન્સફર્મેશન એ બેક્ટેરિયામાં બહારનું DNA દાખલ કરવાની પ્રક્રિયા છે, PCR ની નહીં.", "tag": ""}, {"q": "PCR માં કયું એન્ઝાઇમ ઊંચા તાપમાનમાં સક્રિય રહે છે અને DNA ની પ્રતિકૃતિ કરે છે?", "opts": ["ટેક પોલીમરેઝ", "ટ્રાન્સક્રિપ્ટેઝ", "રિવર્સ ટ્રાન્સક્રિપ્ટેઝ", "ટોપોઇસોમરેઝ"], "correct": 0, "explain": "તાક પોલીમરેઝ (Taq polymerase) Thermus aquaticus બેક્ટેરિયામાંથી મળે છે, જે ગરમ પાણીના ઉદ્ભવ સ્થળો પર જોવા મળે છે. આ એન્ઝાઇમ ઊંચા તાપમાન (72°C) માં સક્રિય રહે છે, જે PCR માં જરૂરી છે.", "tag": ""}, {"q": "ઈ.કોરી I (EcoRI) રિસ્ટ્રિક્શન એન્ઝાઇમ કયા ન્યુક્લિયોટાઇડ ક્રમને ઓળખીને કાપે છે?", "opts": ["GAATTC – G ની ડાબી બાજુએ", "GAATTC – A ની જમણી બાજુએ", "AATTCC – A ની ડાબી બાજુએ", "GATACC – C ની જમણી બાજુએ"], "correct": 0, "explain": "ઈ.કોરી I (EcoRI) GAATTC ક્રમને ઓળખે છે અને G અને A ની વચ્ચે કાપે છે, જેથી 5' overhangs (sticky ends) બને છે. આ sticky ends રિકોમ્બિનંત DNA બનાવવા માટે મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "બાયો રિએક્ટરના મુખ્ય ઉપયોગોમાંથી કયો બિંદુ સમાવિષ્ટ નથી?", "opts": ["મикроorganism ની મોટા પ્રમાણમાં વૃદ્ધિ", "પ્રોટીન અને એન્ઝાઇમનો ઉત્પાદન", "ટીઆરએનએ પ્રતિકૃતિ (amplification)", "ચેતાકોષીય રસાયણોનો ઉત્પાદન"], "correct": 2, "explain": "બાયો રિએક્ટરનો ઉપયોગ જૈવિક પ્રક્રિયાઓ માટે થાય છે, જેમ કે માઇક્રોઓર્ગેનિઝમની વૃદ્ધિ, પ્રોટીન, એન્ઝાઇમ, અને ચેતાકોષીય રસાયણોનો ઉત્પાદન. PCR દ્વારા ટીઆરએનએ પ્રતિકૃતિ બાયો રિએક્ટરનું કાર્ય નથી.", "tag": ""}, {"q": "ADA રોગ (Adenosine Deaminase અભાવ) ના કિસ્સામાં પહેલી વખત જનીન ચિકિત્સા (Gene Therapy) શું હતી? નીચેનામાંથી સાચું વિધાન પસંદ કરો.", "opts": ["બોન મારો ટ્રાન્સપ્લાન્ટ દ્વારા ADA ઉત્પન્ન કરતા રક્તકણોનો સંચાર કરવામાં આવતો હતો અને દર્દીના લિંફોસાઇટ્સમાં કાર્યાત્મક ADA જનીન ધરાવતો વેક્ટર દાખલ કરવામાં આવતો હતો.", "રોગચાળાના પ્રારંભિક સ્ટેજમાંEmbryonic કોષોમાં કાર્યાત્મક ADA જનીન દાખલ કરીને પૂર્ણ કાળ માટે ચિકિત્સા કરવામાં આવતી હતી.", "પેરેન્ટિરલ injections દ્વારા ADA એન્ઝાઇમ સીધું દેહમાં ઇન્જેક્ટ કરવામાં આવતું હતું જેથી આખી જીંદગી માટે રક્ષણ મળતું હતું.", "બેક્ટ્રિયામાં ADA જનીન મૂકીને બનાવેલ પૂર્વલક્ષણી (Prophylactic) દવા દર્દીને દૈનિક આપવામાં આવતી હતી."], "correct": 0, "explain": "ADA અભાવના રોગીમાં પહેલી વખત સોમેટિક જનીન ચિકિત્સા અપાયો હતો -- દર્દીના લિંફોસાઇટ્સમાં કાર્યાત્મક ADA જનીન ધરાવતો વેક્ટર દાખલ કરવામાં આવતો હતો. આ સારવાર પૂર્ણ કાળની નથી હોતી કારણ કે પ્રોસેસ્ડ લિંફોસાઇટ્સનો આયુષ્ય મર્યાદિત હોય છે, તેથી પુનરાવર્તિત ચિકિત્સા જરૂરી બને છે.", "tag": ""}, {"q": "ઈ.કોલાઇ (E. coli) માં મનુષ્યના પેન્ક્રિયાસ દ્વારા ઉત્પન્ન થતા પ્રમાણપૂર્વકના (મature) ઇન્સ્યુલિનનું સીધું ઉત્પાદન શા માટે શક્ય નથી?", "opts": ["ઈ.કોલાઇ પ્રોકાર્યોટ હોવાથી તે પોતાના કોષમાં ઇન્સ્યુલિનનું post-translational modification (ખાસ કરીને C-પેપ્ટાઇડ દૂર કરીને) કરી શકતી નથી.", "ઈ.કોલાઇ માનવ ડીએનએને ઓળખી શકતી નથી અને તેના RNA પોલિમેરેઝ માનવ પ્રોમોટરને જોડી શકતા નથી.", "ઈ.કોલાઇ માનવ ઇન્સ્યુલિન જનીનની વિશિષ્ટ કોડન સાથે અનુરૂપ tRNA ધરાવતી નથી, તેથી ટ્રાન્સલેશન થઈ શકતું નથી.", "ઈ.કોલાઇ માનવ ડીએનએને લાગતું નથી અને તે યુકેરીયોટિક ગુણસૂત્રો ધરાવતી નથી."], "correct": 0, "explain": "ઈ.કોલાઇ પ્રોકાર્યોટિક સજીવ છે અને તેમાં એંડોપ્લાઝમિક રેટિક્યુલમ તથા ગોલગી ઉપાંગો ન હોવાથી તે પ્રોઇન્સ્યુલિનમાંથી C-પેપ્ટાઇડ દૂર કરીને સક્રિય ઇન્સ્યુલિન બનાવી શકતી નથી. આથી rDNA ટેકનોલોજીમાં A અને B શૃંખલાઓ અલગ-અલગ ઉત્પન્ન કરીને તેમને ડીસલ્ફાઇડ બંધો દ્વારા જોડવામાં આવે છે.", "tag": ""}, {"q": "ઈન્સ્યુલિનના ઉત્પાદનમાં rDNA ટેકનીક વડે E. coli નો ઉપયોગ કરતી વખતે A શૃંખલા અને B શૃંખલા અલગ-અલગ ઉત્પન્ન કરવામાં આવે છે. નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["બંને શૃંખલાઓને અલગ-અલગ પ્લાઝમિડમાં દાખલ કરીને ઉત્પન્ન કરવામાં આવે છે, પછી રાસાયણિક રીતે તેમના સિસ્ટેઇન રેસિડ્યુ વચ્ચે ડીસલ્ફાઇડ બંધ બનાવીને સક્રિય ઇન્સ્યુલિન બનાવવામાં આવે છે.", "A અને B શૃંખલાઓ એક જ પ્લાઝમિડમાં મૂકીને પ્ર   const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

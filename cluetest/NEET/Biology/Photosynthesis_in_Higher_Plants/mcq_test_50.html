<head>

<title>Photosynthesis in Higher Plants — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "પ્રकाशસંશ્લેષણ (Photosynthesis) પ્રક્રિયા કોષના કયા અંગિકામાં સંભવ પામે છે?", "opts": ["ક્લોરોપ્લાસ્ટ (Chloroplast)", "માઇટોકોન્ડ્રિયા (Mitochondrion)", "ન્યૂક્લિયસ (Nucleus)", "રાઇબોઝોમ (Ribosome)"], "correct": 0, "explain": "ઉચ્ચ છોડમાં પ્રકાશસંશ્લેષણની સમગ્ર પ્રક્રિયા ક્લોરોપ્લાસ્ટમાં થાય છે. ક્લોરોપ્લાસ્ટમાં ક્લોરોફિલ રંગદ્રવ્ય હોય છે જે પ્રકાશઊર્જાને શોષીને તેનું રાસાયણિક ઊર્જામાં રૂપાંતર કરે છે.", "tag": ""}, {"q": "પ્રકાશસંશ્લેષણ દરમિયાન વાયુમાળામાં મુક્ત થતો ઓક્સિજન (O₂) મુખ્યત્વે ક્યાંથી ઉત્પન્ન થાય છે?", "opts": ["પાણી (H₂O) ના વિભાજનમાંથી", "કાર્બન ડાયોક્સાઇડ (CO₂) ના વિભાજનમાંથી", "ગ્લુકોઝના ઑક્સિડેશનમાંથી", "ક્લોરોફિલના વિઘટનમાંથી"], "correct": 0, "explain": "પ્રકાશસંશ્લેષણની પ્રક્રિયા દરમિયાન પાણીના ફોટોલાઇસિસ (પ્રકાશ-વિભાજન) થાય છે, જેના પરિણામે ઓક્સિજન વાયુ મુક્ત થાય છે. આ પ્રક્રિયા ક્લોરોપ્લાસ્ટના થાયલેકોઇડ પ્રરદ્ધ (thylakoid lumen) માં થાય છે.", "tag": ""}, {"q": "એંગેલમેન (Engelmann) ના પ્રયોગ દરમિયાન Spirogyra શૈવાલ પર પ્રકાશના વિવર્તન (prism spectrum) ના કયા રંગ પ્રદેશમાં ઑક્સિજન-આવશ્યક બેક્ટેરિયા સૌથી વધુ જમા થયા હતા?", "opts": ["લોહિત (Red) અને નીલ-વિંજિત (Blue-violet) પ્રદેશ", "હરિત (Green) પ્રદેશ", "પીળો (Yellow) પ્રદેશ", "અતિબાળજામ (Infrared) પ્રદેશ"], "correct": 0, "explain": "એંગેલમેનના પ્રયોગ દર્શાવે છે કે હરિતભાસ્કર (chlorophyll) લોહિત અને નીલ-વિંજિત કિરણોનું સૌથી વધુ શોષણ કરે છે, એટલા માટે આ પ્રદેશોમાં પ્રકાશસંશ્લેષણ વધુ ગતિથી થાય છે અને વધુ ઓક્સિજન મુક્ત થાય છે, જેથી ઑક્સિજન-આવશ્યક બેક્ટેરિયા આ પ્રદેશોમાં વધુ જમા થાય છે.", "tag": ""}, {"q": "ક્લોરોપ્લાસ્ટ (Chloroplast) માં ક્લોરોફિલ રંગદ્રવ્ય કઈ રચના સાથે સંકળાયેલું હોય છે?", "opts": ["થાયલેકોઇડ ઝિલ્લિ (Thylakoid membrane)", "આંતરિક પોર્સ પટલ (Inner envelope membrane)", "સ્ટ્રોમા (Stroma)", "ઇન્ટરમેમ્બર સ્પેસ (Intermembrane space)"], "correct": 0, "explain": "ક્લોરોફિલ અણુઓ ક્લોરોપ્લાસ્ટના થાયલેકોઇડ ઝિલ્લિમાં ગોઠવાયેલા હોય છે. થાયલેકોઇડ ઝિલ્લિ પ્રકાશ પ્રતિક્રિયા (light reaction) માટે જવાબદાર છે અને તેમાં પ્રકાશ-સંકલન જટિલ (photosystems) સ્થિત હોય છે.", "tag": ""}, {"q": "ક્લોરોપ્લાસ્ટ (Chloroplast) ના સ્ટ્રોમા (Stroma) વિશે નીચેમાંથી કયું કथન સાચું છે?", "opts": ["સ્ટ્રોમા એ થાયલેકોઇડ ઝિલ્લિની બહારનો દ્રવ્યભરાયેલ મેરિષ્ટિક પ્રદેશ છે.", "સ્ટ્રોમામાં થાયલેકોઇડ ઝિલ્લિ આવેલી હોય છે અને તેમાં ક્લોરોફિલ સંકેન્દ્રિત હોય છે.", "સ્ટ્રોમા એ બહિઃપટલ (outer membrane) ની બહારનો ખાલી પ્રદેશ છે.", "સ્ટ્રોમામાં માત્ર માઇટોકોન્ડ્રિયા સ્થિત હોય છે."], "correct": 0, "explain": "સ્ટ્રોમા એ ક્લોરોપ્લાસ્ટની આંતરિક પ્રદેશ છે જે થાયલેકોઇડ પદ્ધતિની બહારનો માયેલોઇડ (matrix-like) દ્રવ્ય ભરાયેલ પ્રદેશ છે. તેમાં કાર્બોક્સિલિક એસિડ ચક્ર (Calvin cycle) ના બધા તત્વો વિભાજિત થાય છે, પરંતુ ક્લોરોફિલ થાયલેકોઇડ ઝિલ્લિમાં હોય છે.", "tag": ""}, {"q": "બ્લેકમેનના 'મર્યાદિત અવયવોના નિયમ' (Law of Limiting Factors) મુજબ, જ્યારે કોઈ પ્રક્રિયા બે કે તેથી વધુ સ્વતંત્ર અવયવો દ્વારા અસર થતી હોય, ત્યારે પ્રક્રિયાનો દર કયા અવયવ પર આધાર રાખે છે?", "opts": ["જે અવયવ પોતાની ઉપલબ્ધતાની દૃષ્ટિએ લઘુતમ અથવા સૌથી નજીક હોય", "જે અવયવ સૌથી વધુ માત્રામાં ઉપલબ્ધ હોય", "કોઈ પણ એક અવયવ, આમૂળગાળે સરેરાશ લઈએ ત્યારે", "ઉષ્ણતામાપ અને પ્રકાશની તીવ્રતાનો સરવાળો"], "correct": 0, "explain": "બ્લેકમેનનો નિયમ કહે છે કે જ્યારે કોઈ જૈવિક પ્રક્રિયા પર બહુવિધ અવયવોની અસર થતી હોય, ત્યારે જે અવયવ સૌથી વધુ અભાવગ્રસ્ત હોય (લઘુતમ ઉપલબ્ધ) તે પ્રક્રિયાના દરને નિયંત્રિત કરે છે. આવી સ્થિતિમાં તે અવયવ 'મર્યાદિત અવયવ' કહેવાય છે.", "tag": ""}, {"q": "ક્લોરોપ્લેસ્ટ (Chloroplast) માં પ્રકાશસંશ્લેષણનો દર વધારવા માટે નીચેમાંથી કયો ફેક્ટર સામાન્યત: મર્યાદિત અવયવ તરીકે કાર્ય કરે છે?", "opts": ["CO2 ની સાંદ્રતા", "ઓક્સિજનની સાંદ્રતા", "પાણીનું પ્રમાણ", "પીએચ (pH) નiveau"], "correct": 0, "explain": "સામાન્ય વાતાવરણમાં, પ્રકાશસંશ્લેષણનો દર CO2 ની સાંદ્રતા પર મુખ્યત્વે આધારિત હોય છે; કારણ કે CO2 નું સ્તર અન્ય અવયવો કરતાં ઓછું હોય છે, જેથી તે મર્યાદિત અવયવ તરીકે વર્તે છે અને પ્રકાશસંશ્લેષણ દર નક્કી કરે છે.", "tag": ""}, {"q": "બ્લેકમેનના મર્યાદિત અવયવોના નિયમ મુજબ, જો પ્રકાશસંશ્લેષણ દર વધારવા માટે CO2 ની સાંદ્રતા વધારવામાં આવે, પણ પ્રકાશની તીવ્રતા અચળ રહે, તો શું થશે?", "opts": ["ચોક્કસ સીમા સુધી દર વધશે, પછી અન્ય અવયવ (જે pts": ["એટલા માટે કે તેમાં CO₂ ની મુક્તિ થાય છે પણ ATP કે NADPH ની ઉત્પત્તિ થતી નથી.", "એટલા માટે કે તે ક્લોરોપ્લેસ્ટ (Chloroplast) માં થાય છે અને પ્રકાશની માંગ કરે છે.", "એટલા માટે કે તે RuBisCO ને સક્રિય કરે છે જેથી પ્રકાશસંશ્લેષણ દર વધે.", "એટલા માટે કે તેમાં પાણીનું વિઘટન થાય છે અને ઓક્સિજન મુક્ત થાય છે."], "correct": 0, "explain": "પ્રકાશશ્વસનમાં RuBisCO ઓક્સિજનિએઝ સક્રિયતા ધરાવે છે અને PEPCase દ્વારા ફિક્સેશનને બદલે RuBP પર O₂ જોડાઈને glycolate બનાવે છે, જે આગળના પગલાંમાં CO₂ છોડે છે પરંતુ કોઈ સાકર ઉત્પન્ન નથી થતી કે NaADPH/ATP વધે છે, તેથી તેને 'વેસ્ટફુલ' કહેવાય છે.", "tag": ""}, {"q": "ક્રાન્ઝ એનોટમી (Kranz anatomy) ધરાવતા પાંદડામાં નીચેનામાંથી કયા કોષો પ્હોળા અને મોટા ક્લોરોપ્લેસ્ટ ધરાવે છે?", "opts": ["બંડલ શીથ કોષો (Bundle sheath cells)", "મેસોફિલ કોષો (Mesophyll cells)", "એપિડર્મિસ કોષો (Epidermal cells)", "રક્તવાહિની કોષો (Vascular bundle cells)"], "correct": 0, "explain": "ક્રાન્ઝ એનોટમીમાં પ્હોળા, મોટા અને ઘેરા ક્લોરોપ્લેસ્ટ ધરાવતા બંડલ શીથ કોષો વેસિક્યુલર બંડલની આસપાસ સપાટી પર ગોઠવાયેલા હોય છે, જ્યારે મેસોફિલ કોષો નાના અને સામાન્ય ક્લોરોપ્લેસ્ટ ધરાવે છે. આ રચના C₄ પ્લાન્ટ્સમાં Co₂ સાંદ્રણ પદ્ધતિને સપોર્ટ કરે છે.", "tag": ""}, {"q": "નિમ્ન Co₂ સાંદ્રતાએ પ્રકાશસંશ્લેષણ દર વધારવા માટે C₄ પ્લાન્ટ્સ કઈ રીત સક્ષમ છે?", "opts": ["મેસોફિલ કોષોમાં PEP carboxylase (PEPC) દ્વારા Co₂ ને મજબૂતાઈથી બાંધીને Oxaloacetate બનાવે છે.", "બંડલ શીથ કોષોમાં RuBisCO ની અભિવ્યક્તિ સંપૂર્ણપણે બંધ કરે છે.", "તેઓ પ્રકાશ પ્રતિક્રિયાઓ (Light reactions) બંડલ શીથમાં અને કેલ્વિન ચક્ર મેસોફિલમાં કરે છે.", "તેઓ પ્રકાશશ્વસનને દૂર કરવા માટે O₂ ની માત્રા વધારે છે."], "correct": 0, "explain": "C₄ પ્લાન્ટ્સમાં મેસોફિલ કોષોમાં PEPC, RuBisCO કરતાં Co₂ પ્રત્યે વધુ આભરક (affinity) ધરાવે છે, જેથી નિમ્ન Co₂ સાંદ્રતાએ પણ CO₂ ફિક્સેશન પૂરતરી રીતે થઈ શકે છે અને બંડલ શીથ કોષોમાં લિબરેટેડ CO₂ ને કેલ્વિન ચક્ર વધુ તીવ્રતાથી ગ્રહણ કરે છે.", "tag": ""}, {"q": "કોઈ ચોક્કસ તાપમાને પ્રકાશસંશ્લેષણ દર પર Co₂ સાંદ્રતાના અસરનું ગ્રાફ કયું પ્રમાણિત મોડેલ બતાવે છે?", "opts": ["Co₂ સાંદ્રતા વધતાં પ્રારંભમાં રેખીય વધારો થાય છે અને પછી સમાપ્તિ (plateau) ધરાવે છે જ્યાં સુધી બીજા અવયવો બંધક ન બને.", "Co₂ સાંદ્રતા વધતાં દર સતત ઘટે છે કારણ કે Co₂ દવા તરીકે કાર્ય કરે છે.", "Co₂ સાંદ્રતા અને દર વચ્ચે કોઈ સંબંધ હોતો નથી.", "Co₂ વધવાથી દર ઘટે છે કારણ કે વરિષ્ઠ તાપમાને વરાળ દબાણ વધે છે."], "correct": 0, "explain": "તાપમાન સ્થિર રાખીને Co₂ વધારવાથી પ્રારંભમાં પ્રકાશસંશ્લેષણ દર રેખીય રીતે વધે છે કારણ કે Co₂ પ્રતિક્રિયાકારક તરીકે કાર્ય કરે છે, પરંતુ એક ચોક્કસ Co₂ સ્તર પછી બીજા પરિબળો (જેમ કે પ્રકાશ કે તાપમાન) બંધક બની જતાં દર સપાટ (plateau) થઈ જાય છે.", "tag": ""}, {"q": "ગૅસ્ટ્રોવેલ (Gastrula) દરમિયાન કયું ઇન્ડક્શન ભ્રૂણમાં ત્રણ આયન કોષસ્તર (germ layers) ની રચના કરવામાં મહત્વપૂર્ણ ભૂમિકા ભજવે છે?", "opts": ["બ્રાઉન (Braun) ઇન્ડક્શન", "પ્રાથમિક ઓર્ગેનાઇઝર ઇન્ડક્શન", "સેકન્ડરી ઇન્ડક્શન", "પ્લેસેન્ટલ ઇન્ડક્શન"], "correct": 0, "explain": "ગૅસ્ટ્ર્યુલેશન દરમિયાન બ્રાઉન ઇન્ડક્શન દ્વારા ઇન્વર્ટેબલ સેલ બેલમાંથી એક્ટોડર્મ, મેસોડર્મ અને એન્ડોડર્મ ત્રણે જર્મ ભરત્તર બને છે. આ ઈન્ડક્શન પૂર્વગામી ક્ષેત્ર અને નોડલ કોષો વચ્ચેનું સંકેત આદાન-પ્રદાન છે.", "tag": ""}, {"q": "C₄ પ્રકાશસંશ્લેષી પાદપોમાં CO₂ નું પ્રથમ સ્થાયીકરણ કયા એન્ઝાઇમ દ્વારા થાય છે અને આ પ્રક્રિયા કોષના કયા ભાગમાં સંપન્ન થાય છે?", "opts": ["RuBisCO ; બુન્ડલ શીથ કોષો", "PEP carboxylase ; મેસોફિલ કોષો", "PEP carboxylase ; બુન્ડલ શીથ કોષો", "RuBisCO ; મેસોફિલ કોષો"], "correct": 1, "explain": "C₄ માર્ગમાં CO₂ નું પ્રથમ સ્થાયીકરણ PEP carboxylase એન્ઝાઇમ દ્વારા મેસોફિલ કોષોમાં થાય છે, જ્યાં PEP (Phosphoenolpyruvate) CO₂ સ્વીકારક તરીકે કાર્ય કરે છે. RuBisCO બુન્ડલ શીથ કોષોમાં કાર્બન સ્થિરીકરણ (Calvin cycle) માટે જવાબદાર છે.", "tag": ""}, {"q": "Hatch-Slack માર્ગ (C₄ માર્ગ) માં OAA (Oxaloacetate) નું રૂપાંતર મુખ્યત્વે કયા સંયોજનમાં થાય છે અને આ પ્રક્રિયાનો ઉદ્દેશ્ય શું છે?", "opts": ["પાયરુવેટમાં ; NADH ઉત્પન્ન કરવા", "મેલાઇન એસિડ (Malic acid) માં ; CO₂ ને બુન્ડલ શીથ કોષો સુધી પરિવહન કરવા", "એસ્પાર્ટેટમાં ; શર્કરા ઉત્પાદન માટે", "એસિટાઈલ CoA માં ; શ્વસનમાં વપરાશ માટે"], "correct": 1, "explain": "OAA નું રૂપાંતર મેલાઇન એસિડ અથવા એસ્પાર્ટેટમાં થઈ શકે છે, પરંતુ C₄ સ્થળોએ મેલાઇન એસિડ પ્રબળ છે. આ બેસ્કલેટ દ્વારા CO₂ મેસોફિલ કોષોથી બુન્ડલ શીથ કોષો સુધી ખેંચાય છે, જ્યાં તે છૂટું પડે છે અને Calvin cycle માટે ઉપલબ્ધ થાય છે.", "tag": ""}, {"q": "C₄ પાદપોમાં PEPC (PEP carboxylase) નો KM કિંમત RuBisCO કરતાં ખૂબ ઓછો હોવાનું શું માન્યું છે?", "opts": ["PEPC એ CO₂ ને પાયરુવેટ સાથે જોડે છે, જ્યારે RuBisCO O₂ સાથે જોડાઈ શકે છે.", "PEPC ની CO₂ પ્રત્યેની આકર્ષણ શક્તિ (affinity) RuBisCO કરતાં ૧૦૦ ગણી વધુ હોય છે.", "C₄ પાદપોમાં CO₂ ની સાંદ્રતા હંમેશાં RuBisCO કરતાં વધુ હોય છે.", "PEPC શુદ્ધ પ્રકાશ સંશ્લેષી એન્ઝાઇમ છે, RuBisCO અંધકાર પ્રતિક્રિયામાં કાર્યરત છે."], "correct": 1, "explain": "PEPC નો KM (Michaelis constant) RuBisCO કરતાં ખૂબ ઓછો હોવાથી, તેની CO₂ પ્રત્યેની આકર્ષણ શક્તિ ૧૦૦ ગણી વધુ હોય છે. આ કારણે C₄ પાદપો ઓછા CO₂ સાંદ્રતાએ પણ કાર્યક્ષમતાથી પ્રકાશસંશ્લેષણ કરી શકે છે.", "tag": ""}, {"q": "C₄ માર્ગની 'કોયલ' (Kranz) એનટોમીમાં બુન્ડલ શીથ કોષો અને મેસોફિલ કોષો વચ્ચેનો મુખ્ય વિભેદક તત્તવ કયો છે?", "opts": ["બુન્ડલ શીથ કોષોમાં થાઈલાકોઇડ ન હોવા છતાં RuBisCO હોય છે.", "મેસોફિલ કોષોમાં RuBisCO હોય છે અને બુન્ડલ શીથ કોષોમાં PEP carboxylase હોય છે.", "બુન્ડલ શીથ કોષો વડાળાકાર હોય છે અને મેસોફિલ કોષો ગોળાકાર હોય છે.", "મેસોફિલ કોષોમાં માત્ર PEP carboxylase હોય છે, RuBisCO હોતું નથી."], "correct": 0, "explain": "ક્રાન્ઝ એનટોમીમાં બુન્ડલ શીથ કોષો મોટા હોય છે અને તેમાં RuBisCO વધુ પ્રમાણમાં હોય છે. મેસોફિલ કોષોમાં PEP carboxylase હોય છે. બુન્ડલ શીથ કોષોમાં થાઈલાકોઇડ ઓછા હોઈ શકે છે, પરંતુ Calvin cycle (અંધકાર પ્રતિક્રિયા) સંપન્ન થાય છે.", "tag": ""}, {"q": "C₄ માર્ગમાં CO₂ નિર્મુક્ત (decarboxylation) પ્રક્રિયા કયા પગલાંમાં અને કયા કોષમાં થાય છે?", "opts": ["મેસોફિલ કોષોમાં, NADP-malate dehydrogenase દ્વારા", "બુન્ડલ શીથ કોષોમાં, NADP-malate dehydrogenase દ્વારા", "બુન્ડલ શીથ કોષોમાં, PEP carboxylase દ્વારા", "મેસોફિલ કોષોમાં, PEP carboxylase દ્વારા"], "correct": 1, "explain": "C₄ માર્ગમાં મેલાઇન એસિડ બુન્ડલ શીથ કોષોમાં પહોંચે છે અને ત્યાં NADP-malate dehydrogenase દ્વારા ઓક્સિડેટિવ ડિકાર્બોક્સિલેશન થઈ CO₂ મુક્ત થાય છે. આ CO₂ પછી RuBis         '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

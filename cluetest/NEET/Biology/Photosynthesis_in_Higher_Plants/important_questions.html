<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}

  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>

<script>
const QUIZ = [{"q": "પ્રકાશસંશ્લેષણ (Photosynthesis) મુખ્યત્વે વનસ્પતિના કયા અંગમાં થાય છે?", "opts": ["પත්ર", "જડ", "કાંડો", "કલિકા"], "correct": 0, "explain": "પ્રકાશસંશ્લેષણ મુખ્યત્વે પત્રમાં થાય છે કારણ કે પત્રોમાં કીટ્ટકો (Chloroplasts) ની સંખ્યા વધુ હોય છે અને તે પ્રકાશની શોષણ માટે ફીતેલા બની હોય છે.", "tag": ""}, {"q": "કીટ્ટક (Chloroplast) માં પ્રકાશસંશ્લેષણના રંગદ્રવ્યો (pigments) કયા ભાગમાં ગોઠવાયેલા હોય છે?", "opts": ["થાઈલાકોઈડ ઝાકળ (Thylakoid membrane)", "સ્ટ્રોમા (Stroma)", "બહિર્ઝાકળ (Outer membrane)", "આંતરઝાકળ (Inner membrane)"], "correct": 0, "explain": "કીટ્ટકની થાઈલાકોઈડ ઝાકળમાં પ્રકાશસંશ્લેષણી રંગદ્રવ્યો ગોઠવાયેલા હોય છે. આ ઝાકળ પ્રકાશ પ્રક્રિયાઓ (Light reactions) માટે જવાબદાર છે.", "tag": ""}, {"q": "કીટ્ટકના સ્ટ્રોમામાં ગ્રેન (Grana) નો સમૂહ શું રચે છે?", "opts": ["એકબીજા પર ગોઠવાયેલા થાઈલાકોઈડના સ્તરો (Stack of thylakoids)", "માઇટોકોન્ડ્રિયા જેવી રચનાઓ", "રિબોઝોમ્સનો સમૂહ", "સ્ટાર્ચના દાણા"], "correct": 0, "explain": "ગ્રેન એ એકબીજા પર ગોઠવાયેલા થાઈલાકોઈડ સ્તરોનો સમૂહ છે. કીટ્ટકની અંદર ગ્રેન (ઝાકડા) અને સ્ટ્રોમા (તરલ ભાગ) એમ બે મુખ્ય ભાગ હોય છે.", "tag": ""}, {"q": "પ્રકાશસંશ્લેષી રંગદ્રવ્યોમાંથી કયું રંગદ્રવ્ય 'મુખ્ય' (primary) ગણાય છે?", "opts": ["ક્લોરોફિલ a", "ક્લોરોફિલ b", "કેરોટીન", "ઝેન્થોફિલ"], "correct": 0, "explain": "ક્લોરોફિલ a પ્રકાશસંશ્લેષણનું મુખ્ય રંગદ્રવ્ય છે. તે પ્રકાશ એકત્રિત કેન્દ્ર (Reaction center) માં સીધી ભાગ લે છે અને ઇલેક્ટ્રોનનું ઉત્સર્જન કરે છે. બાકીના રંગદ્રવ્યો સહાયક (accessory) છે.", "tag": ""}, {"q": "ક્લોરોફિલ a અને ક્લોરોફિલ b માં કયો તફાવત છે?", "opts": ["ક્લોરોફિલ a માં -CH₃ જૂથ હોય છે અને ક્લોરોફિલ b માં -CHO જૂથ હોય છે", "ક્લોરોફિલ a ની અવશોષણ કિરણોત્સર્ગ લાલ રંગમાં ઓછી હોય છે", "ક્લોરોફિલ b મુખ્ય રંગદ્રવ્ય છે", "બંનેના રચનામાં કોઈ તફાવત નથી"], "correct": 0, "explain": "ક્લોરોફિલ a અને b એ વિભેદક રીતે રચનામાં સમાન હોય છે, પરંતુ ક્લોરોફિલ a માં પોર્ફિરિન રિંગના ચોથા કાર્બન પર -CH₃ (મેથાઈલ) જૂથ હોય છે જ્યારે ક્લોરોફિલ b માં -CHO (એલ્ડીહાઈડ) જૂથ હોય છે. આથી તેમના અવશોષણ વર્ણપટ અલગ હોય છે.", "tag": ""}, {"q": "પ્રકાશસંશ્લેષણની પ્રકાશ-આધારિત પ્રક્રિયા (Light Reaction) દરમિયાન, F0-F1 પરિબળ (ATP Synthase) નું F1 ટોકન કયું પાસ્યુ પર ATP નું સંશ્લેષણ કરે છે?", "opts": ["થાઇલાકોઇડ (Thylakoid) ગહવર (lumen) માં", "કીટ્ટકસ્ટ્રોમા (Stroma) માં", "થાઇલાકોઇડ પટલ પર", "ફોટોસિસ્ટમ II ના કેન્દ્રમાં"], "correct": 1, "explain": "F0 ફેરફારદ્રવ્ય (channel) એ પ્રોટોનને ગહવરથી સ્ટ્રોમામાં દાખલ કરે છે, જ્યારે F1 ટોકન સ્ટ્રોમા તરફ આવેલું હોય છે અને ADP + Pi માંથી ATP નું સંશ્લેષણ કરે છે. આ પ્રક્રિયા ડિફ્યુઝન ઝગ્રીય (proton motive force) પર આધારિત છે.", "tag": ""}, {"q": "પ્રકાશસંશ્લેષણમાં, ફોટોસિસ્ટમ I અને ફોટોસિસ્ટમ II ની વચ્ચે ઇલેક્ટ્રોન વહનનો મુખ્ય માર્ગ કયો છે?", "opts": ["ક્લોરોફિલ a ને સીધો ઇલેક્ટ્રોન આપતું ફોટોસિસ્ટમ II", "સાયટોક્રોમ b6f કોમ્પલેક્સ (Cytochrome b6f complex) દ્વારા ETC", "NADP+ ને સીધો ઓક્સિડાઇઝ કરતું ફોટોસિસ્ટમ I", "રુબિસ્કો (Rubisco) દ્વારા CO₂ નું સંયોજન"], "correct": 1, "explain": "ઝ-સ્કીમ (Z-scheme) મુજબ, PSII માં થયેલા ઇલેક્ટ્રોનનું પરિવહન પ્રાથમિક ઇલેક્ટ્રોન ગ્રહણકારી, પ્લાસ્ટોક્વિનોન, સાયટોક્રોમ b6f કોમ્પલેક્સ, પ્લાસ્ટોસાયનિન અને પછી PSI દ્વારા કરવામાં આવે છે. આ ક્રમ ઇલેક્ટ્રોન ટ્રાન્સપોર્ટ શૃંખલા (ETC) છે.", "tag": ""}, {"q": "સાયક્લિક (ચક્રીય) ફોટોફોસ્ફોરિલેશન (Cyclic Photophosphorylation) માત્ર કયા ફોટોસિસ્ટમ પરથી સંભવ છે?", "opts": ["ફોટોસિસ્ટમ II (Photosystem II)", "ફોટોસિસ્ટમ I (Photosystem I)", "બંને ફોટોસિસ્ટમ I અને II", "કોઈ પણ ફોટોસિસ્ટમ નહીં"], "correct": 1, "explain": "સાયક્લિક ફોટોફોસ્ફોરિલેશનમાં ફક્ત ફોટોસિસ્ટમ I સક્રિય હોય છે. ઇલેક્ટ્રોન PSI માંથી નીકળીને ફરિઓડોક્સિન (Ferredoxin), સાયટોક્રોમ b6f અને પ્લાસ્ટોસાયનિન થઈને પાછા PSI માં જાય છે. આ પ્રક્રિયા માત્ર ATP ઉત્પન્ન કરે છે, NADPH નહીં.", "tag": ""}, {"q": "પ્રકાશીય પ્રક્રિયાઓ દરમિયાન, થાઇલાકોઇડ ગહવર (lumen) માં પ્રોટોન સાંદ્રતા વધવાનું કારણ શું છે?", "opts": ["પાણીનું વિઘટન (Photolysis of water) થી H⁺ ની છોટ અને ETC દ્વારા H⁺ નું ગહવરમાં પ્રવેશ", "Calvin ચક્ર દરમિયાન ATP નું વિઘટન", "ફેરિસ્કિન (Ferredoxin) દ્વારા NADP⁺ નું રિડક્શન", "રુબિસ્કો (Rubisco) દ્વારા O₂ નું ઉત્પાદન"], "correct": 0, "explain": "પાણીનું પ્રકાશવિભાજન થઈને O₂, ઇલેક્ટ્રોન અને H⁺ મુક્ત થાય છે. H⁺ થાઇલાકોઇડ ગહવરમાં એકત્રિત થાય છે. સાથે hi, સાયટોક્રોમ b6f કોમ્પલેક્સ પણ H⁺ ને સ્ટ્રોમામાંથી ગહવરમાં પ્રવેસે છે, જેથી પ્રોટોન ગ્રેડિયન્ટ બને છે.", "tag": ""}, {"q": "પ્રકાશસંશ્લેષણમાં ડેડી (Dark) પ્રક્રિયાઓ અને પ્રકાશ પ્રક્રિયાઓ વચ્ચેનો સંબંધ શું છે?", "opts": ["ડેડી પ્રક્રિયાઓ પ્રકાશની ગેરહાજરીમાં જ ચાલે છે, પ્રકાશ પ્રક્રિયાઓ સ્વતંત્ર.", "ડેડી પ્રક્રિયાઓ માટે ATP અને NADPH પ્રકાશ પ્રક્રિયાઓ દ્વારા પૂરાં પાડવામાં આવે છે.", "પ્રકાશ પ્રક્રિયાઓ માટે RuBP ની જરૂર પડે છે, જે ડેડી પ્રક્રિયાઓમાં બને છે.", "બંને પ્રક્રિયાઓ કોઈ પણ સંબંધ વિના સ્વતંત્ર રીતે ચાલે છે."], "correct": 1, "explain": "પ્રકાશ પ્રક્રિયાઓમાં થતા ATP અને NADPH નું ઉત્પાદન Calvin (અંધારાની) પ્રક્રિયાઓ માટે હોય છે. Calvin ચક્રમાં CO₂ નું સ્થિરીકરણ કરવા માટે આ ઊર્જાવાહકોની જરૂર પડે છે. એટલે કે, 'અંધારાની પ્રક્રિયા' એટલે પ્રકાશની સીધી હાજરી વિનાની, પરંતુ ATP/NADPH પર આધારિત.", "tag": ""}, {"q": "પ્રકાશશ્વસન (Photorespiration) ની કોષિકીય ભૂમિકા સંબંધે, નીચેનામાંથી કયું વિધાન NCERT પ્રમાણે સૌથી વધુ સચોટ છે?", "opts": ["એ Calvin ચક્રને વધુ પ્રકાશતીવ્રતા દરમિયાન થતા અતિરિક્ત UTP/રિડ્યુસિંગ શક્તિના સंचયથી બચાવવાનું એક સુરક્ષાત્મક માર્ગદર્શિત ઓક્સિડેટિવ માર્ગ છે.", "એ C3 વનસ્પતિઓમાં CO2 ની ચોખવી નવીથી ઉત્પન્ન કરીને પ્રકાશસંશ્લેષણનો દર વધારે છે.", "એ RuBisCO ની ઑક્સિજનેઝ ક્રિયાકૌશલને રોકીને ફક્ત ATP નું ઉત્પાદન વધારે છે.", "એ થાયલાકોઇડ પટલ પર સંભવે છે અને તેમાં ફોટોસિસ્ટમ II ની સક્રિય ભૂમિકા હોય છે."], "correct": 0, "explain": "પ્રકાશશ્વસન એ RuBisCO ની ઑક્સિજનેઝ પ્રવૃત્તિથી શરૂ થતો અને પેરોક્સિસોમ, કલોરોપ્લાસ્ટ તથા પરોટાઇટ ત્રણેય કોષાંગોમાંથી પસાર થતો એક ખર્ચાળ કિરિયાત માર્ગ છે. તેનો મુખ્ય ઉદ્દેશ્ય વધુ પ્રકાશની સ્થિતિમાં Calvin ચક્ર માટેની UTP અને રિડ્યુસિંગ શક્તિનું અન્યાય્ય સંચય થવાથી બચાવો કરવો અને CO2 / NH3 ની વિષિક્તા દૂર કરવી એ છે, ને CO2 ની ચોખવી પુનઃઉત્પાદન દ્વારા દર વધારવો નહીં.", "tag": ""}, {"q": "C4 માર્ગ (Hatch–Slack માર્ગ) ધરાવતી વનસ્પતિઓમાં, PEP કાર્બોક્સિલેઝ દ્વારા થતી પ્રારંભિક CO2 યોગીકરણ કયા કોષવિશેષતા સાથે સંબંધિત છે?", "opts": ["મેસોફિલ સેલ્સમાં થાય છે અને પરિણામી 4-C સંયોજન ક્રૂસ્ડ ઍસિડ બને છે, જે બંડલ સ્લીવ સેલ્સમાં કોષકેન્દ્રીય CO2 મુક્તિ માટે વહન પામે છે.", "બંડલ સ્લીવ સેલ્સમાં થાય છે અને માલેટ મુક્ત CO2 આપે છે જેથી RuBisCO સીધી અહીં કાર્બોક્સિલેટ થઈ શકે.", "ફક્ત રાત્રિસમયે થાય છે અને OAA માલેટ બનાવે છે જે પ્રકાશ દરમિયાન મુક્ત થાય છે.", "થાયલાકોઇડ ગહવરમાં થાય છે અને NADPH નો સીધો સ્ત્રોત પૂરો પાડે છે."], "correct": 0, "explain": "C4 વનસ્પતિઓમાં Kranz એનાટોમી જોવા મળે છે: બહિર્મધ્યસ્થ (મેસોફિલ) સેલ્સમાં PEP કાર્બોક્સિલેઝ CO2 ને OAA માં યોગીકૃત કરે છે, જે બાદ તે માલેટ અથવા એલેનિન બનીને બંડલ સ્લીવ સેલ્સ (જેમાં RuBisCO હોય છે) તરફ જાય છે. અહીં CO2 મુક્ત થઈ Calvin ચક્રમાં દાખલ થાય છે, જેથી RuBisCO ની ઑક્સિજનેઝ પ્રવૃત્તિ ઘટે છે.", "tag": ""}, {"q": "C4 વનસ્પતિઓમાં, માલેટના ડીકાર્બોક્સિલેશન દ્વારા CO2 મુક્ત કરતો ઉકેશનું નામ શું છે અને તે કયા કોષમાં થાય છે?", "opts": ["NADP-malate enzym (NADP-ME) · બંડલ સ્લીવ સેલ્સ", "NAD-malate enzym · મેસોફિલ સેલ્સ", "PEP carboxylase · મેસોફિલ સેલ્સ", "RuBisCO · થાયલાકોઇડ ગહવર"], "correct": 0, "explain": "કેટલીક C4 વનસ્પતિઓ (જેવા કે મક્કા, ચોખા) માં NADP-malate enzym પ્રકાર જોવા મળે છે, જ્યાં માલેટનું ડીકાર્બોક્સિલેશન બંડલ સ્લીવ સેલ્સમાં થાય છે અને NADPH ઉત્પન્ન થાય છે. આ બંને CO2 અને રિડ્યુસિંગ શક્તિ એકસાથે Calvin ચક્રને પૂરી પાડે છે.", "tag": ""}, {"q": "CAM (Crassulacean Acid Metabolism) વનસ્પતિઓની વિશેષતા સંબંધે, NCERT પ્રમાણે કયું વિધાન સચોટ નથી?", "opts": ["રાત્રિસમયે ખુલ્લી થતી સ્તંભિકાઓ (Stomata) દ્વારા CO2 લેવાય છે અને PEP કાર્બોક્સિલેઝ દ્વારા OAA/માલેટ સંગ્રહિત થાય છે.", "દિવસ દરમિયાન સ્તંભિકાઓ બંધ થઈ જાય છે, પરંતુ સંગ્રહિત માલેટનું ડીકાર્બોક્સિલેશન થઈ CO2 ને Calvin ચક્રને પૂરી પાડે છે.", "CAM વનસ્પતિઓમાં ક્રૂસ્ડ ઍસિડનું પ્રમાણ સાંજે ઓછું અને સવારે વધુ હોય છે.", "આ માર્ગ શુષ્ક/ઉષ્ણકટિબંધીય પરિસ્થિતિમાં જળની હાનિ ઘટાડવામાં મદદરૂપ થાય છે."], "correct": 2, "explain": "CAM વનસ્પતિઓમાં ક્રૂસ્ડ ઍસિડનું પ્રમાણ રાત્રિસમયે વધે છે (CO2 યોગીકરણ થવાથી) અને દિવસ દરમિયાન ઘટે છે (માલેટનું ડીકાર્બોક્સિલેશન થતાં). તેથી 'સાંજે ઓછું, સવારે વધુ' એ વિપરીત અને અસચોટ વિધાન છે.", "tag": ""}, {"q": "પ્રકાશસંશ્લેષણ પર પર્યાવરણીય ઘટકોના પ્રભાવ સંબંધે, નીચેનામાંથી કયું કથન NCERT મુજબ સચોટ છે?", "opts": ["ઓછી પ્રકાશતીવ્રતા પર પ્રકાશસંશ્લેષણનો દર પ્રકાશની રેખીય રીતે વધે છે અને એક ચોક્કસ મર્યાદા પછી તે સંતૃપ્તિ બિંદુએ પહોંચી સ્થિર થઈ જાય છે.", "વધુ CO2 સાંદ્રતા હંમેશા પ્રકાશસંશ્લેષણના દરને વધારે છે, ભલે તાપમાન અથવા પ્રકાશ અવરોધક હોય.", "તાપમાન વધવાથી RuBisCO ની પ્રવૃત્તિ લગભગ સીમિત શ્રેણી પછી ઘટે છે, કારણ કે એન્ઝાયમિક ક્રિયા દર ઉષ્મીય નિષ્ક્રિયકરણ તરફ જાય છે.", "પાણીની ઉપલબ્ધતા ઘટતાં સ્તંભિકાઓ ખુલ્લી રહે છે, જેથી CO2 નો પ્રવેશ વધે છે અને પ્રકાશસંશ્લેષણ વધે છે."], "correct": 0, "explain": "NCERT મુજબ, પ્રકાશસંશ્લેષણનો દર પ્રારંભિક પ્રકાશતીવ્રતાનાં વધારા સાથે રેખીય રીતે વધે છે; પરંતુ એક ચોક્કસ મર્યાદા (light saturation point) પછી અન્ય ઘટકો (CO2, તાપમાન) મર્યાદક બની જાય છે અને દર સ્થિર થઈ જાય છે. CO2, તાપમાન અને પાણી સંબંધિત બીજા વિકલ્પો અર્ધસત્ય અથવા વિપરીત છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

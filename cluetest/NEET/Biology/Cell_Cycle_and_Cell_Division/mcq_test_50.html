<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "કોષ ચક્રના 'ઇન્ટરફેઝ' (Interphase) દરમિયાન કયો તબક્કો DNA ની પ્રતિકૃતિ (replication) માટે જવાબદાર છે?", "opts": ["G1 તબક્કો", "G2 તબક્કો", "S તબક્કો", "M તબક્કો"], "correct": 2, "explain": "S તબક્કો (Synthesis phase) ઇન્ટરફેઝનો એવો તબક્કો છે જેમાં DNA ની પ્રતિકૃતિ થાય છે, જેથી દરેક ક્રોમોઝોમ બે સસ્ટર ક્રોમેટિડમાં વિભાજિત થાય છે.", "tag": ""}, {"q": "કોષ ચક્રના નીચેના કયો તબક્કો ઇન્ટરફેઝનો ભાગ નથી?", "opts": ["G1 તબક્કો", "S તબક્કો", "M તબક્કો", "G2 તબક્કો"], "correct": 2, "explain": "ઇન્ટરફેઝમાં G1, S અને G2 તબક્કાઓ આવેલા છે. M તબક્કો (માયોસિસ) કોષ વિભાજનનો સક્રિય તબક્કો છે અને તે ઇન્ટરફેઝનો ભાગ નથી.", "tag": ""}, {"q": "કોષ ચક્રમાં G1 તબક્કા (Gap 1 phase) દરમિયાન શું થાય છે?", "opts": ["DNA ની પ્રતિકૃતિ થાય છે", "ક્રોમેટિન નેટવર્ક સ્વરૂપે ન્યુક્લિયસ રહે છે અને કોષ પોતાના કદમાં વધારો કરે છે તથા પ્રોટીનનું સંશ્લેષણ થાય છે", "ક્રોમોઝોમ સૌથી વધુ સંકુચિત અવસ્થામાં જોવા મળે છે", "સિટોકિનેસિસ (Cytokinesis) થાય છે"], "correct": 1, "explain": "G1 તબક્કો ઇન્ટરફેઝનો પ્રારંભિક તબક્કો છે, જેમાં કોષનું કદ વધે છે, પ્રોટીનનું સંશ્લેષણ થાય છે અને ક્રોમેટિન નેટવર્ક સ્વરૂપે ન્યુક્લિયસ રહે છે. DNA પ્રતિકૃતિ S તબક્કામાં થાય છે.", "tag": ""}, {"q": "કોષ ચક્રનો સાચો ક્રમ કયો છે?", "opts": ["S → G1 → G2 → M", "G1 → G2 → S → M", "G1 → S → G2 → M", "M → G1 → S → G2"], "correct": 2, "explain": "કોષ ચક્રનો સાચો ક્રમ G1 તબક્કો → S તબક્કો → G2 તબક્કો → M તબક્કો છે. G1 માં કોષનું કદ વધે છે, S માં DNA પ્રતિકૃતિ થાય છે, G2 માં વિભાજન માટેની તૈયારી થાય છે અને M માં કોષ વિભાજન થાય છે.", "tag": ""}, {"q": "કોષ ચક્રના G2 તબક્કા (Gap 2 phase) દરમિયાન શું થાય છે?", "opts": ["DNA ની પ્રતિકૃતિ થાય છે", "કોષ સુપ્ત અવસ્થામાં પ્રવેશે છે", "માયોટિક વિભાજન માટે જરૂરી પ્રોટીનનું સંશ્લેષણ થાય છે", "ક્રોમોઝોમો દ્વિભાજિત થાય છે"], "correct": 2, "explain": "G2 તબક્કામાં કોષ M તબક્કા (મૅાયોટિક/મિટોટિક વિભાજન) માટે જરૂરી પ્રોટીનનું સંશ્લેષણ કરે છે અને કોષીય અંગિકાઓ વધુ વિકસે છે. DNA પ્રતિકૃતિ S તબક્કામાં પહેલેથી થઈ ચૂકી હોય છે.", "tag": ""}, {"q": "પ્રોફેઝ દરમિયાન ન્યુક્લિયર મેમ્બ્રેન અને ન્યુક્લિયોલાસનું વર્તન કયું સાચું છે?", "opts": ["મેમ્બ્રેન ધીમે ધીમે ઓછી પારદર્શક બને છે અને ન્યુક્લિયોલાસ દૃશ્યમાન રહે છે.", "ન્યુક્લિયર મેમ્બ્રેનનું વિઘટન થાય છે અને ન્યુક્લિયોલાસ પણ અદૃશ્ય થઈ જાય છે.", "ન્યુક્લિયર મેમ્બ્રેન સંપૂર્ણ રીતે સક્રિય રહે છે અને ન્યુક્લિયોલાસ વિસ્તૃત થાય છે.", "ન્યુક્લિયોલાસનું વિઘટન થાય છે, પણ ન્યુક્લિયર મેમ્બ્રેન અકતળ રહે છે."], "correct": 1, "explain": "પ્રોફેઝ દરમિયાન ક્રોમેટિન સક્રિય રીતે સંકુચિત થઈને દૃશ્યમાન ક્રોમેટિડ્સ બનાવે છે. આ તબક્કે કોષિકા કેન્દ્ર (Nucleus) ની આસપાસનું સૂત્રપ્રાચીર (Nuclear envelope) વિઘટિત થઈ જાય છે અને ન્યુક્લિયોલાસ પણ અદૃશ્ય થઈ જાય છે. આમ, B સાચો વિકલ્પ છે કારણ કે બંને ઘટનાઓ પ્રોફેઝના લક્ષણો છે.", "tag": ""}, {"q": "મીઝોકાઈનટેઝ (Metaphase) દરમિયાન ક્રોમેટિડ્સ કોષના કેવો ભાગમાં ગોઠવાય છે અને કેવા બંધારણ પર?", "opts": ["ક્રોમેટિડ્સ કોષની ધ્રુવો (Poles) પાસે જમા થાય છે; સેન્ટ્રિયોલ પ્લેટ પર.", "ક્રોમેટિડ્સ કોષના મધ્યભાગમાં સીધી રેખામાં ગોઠવાય છે; સ્પિન્ડલ ફાઇબર્સના કારણે.", "ક્રોમેટિડ્સ યાદૃચ્છિક રીતે વિખેરાયેલા હોય છે; કોઈ ચોક્કસ પ્લેટ પર નહીં.", "ક્રોમેટિડ્સ કોષના એક ધ્રુવ તરફ ખસે છે; કોષિકા બાહ્ય કંકાલ પર."], "correct": 1, "explain": "મીઝોકાઈનટેઝમાં ક્રોમેટિડ્સ કોષના મધ્યમાં 'મેટાફેઝ પ્લેટ' (સમભાગી વિષુવવૃત્ત) પર ગોઠવાય છે. આ ગોઠવણી માટે સ્પિન્ડલ રજ્જુઓ (Microtubules) દ્વારા બનેલું સૂત્રકાઇન (Spindle apparatus) જવાબદાર હોય છે, જે ક્રોમેટિડ્સને મધ્યમાં ખેંચીને ટકાવી રાખે છે.", "tag": ""}, {"q": "એનાફેઝ દરમિયાન સ્પિન્ડલ ફાઇબર્સનું કયું વર્તન મુખ્યત્વે ક્રોમેટિડ્સના અલગ પડવાનું કારણ બને છે?", "opts": ["સ્પિન્ડલ ફાઇબર્સ લંબાતાં જાય છે અને ક્રોમેટિડ્સ એકબીજાની નજીક ખસે છે.", "ક્રોમેટિડ્સનો સેન્ટ્રોમિયર વિભાજિત થાય છે અને ફાઇબર્સનું સંકોચન ક્રોમેટિડ્સને ધ્રુવો તરફ ખેંચે છે.", "સ્પિન્ડલ ફાઇબર્સ અદૃશ્ય થઈ જાય છે અને ક્રોમેટિડ્સ ડિફ્યુઝન દ્વારા ફેલાઈ જાય છે.", "કોઈપણ ફાઇબરની ગતિ જોવા મળતી નથી, કારણ કે ક્રોમેટિડ્સ પોતાની વિશાલતા વધારીને સ્થળ બદલે છે."], "correct": 1, "explain": "એનાફેઝના શરૂઆતી ક્ષણે સેન્ટ્રોમિયર (Centromere) વિભાજિત થઈ જાય છે, જેના ફલસ્વરૂપ બે ક્ષુદ્ર ક્રોમેટિડ્સ (હવે પુત્રક્રોમોઝોમ) સ્વતંત્ર બને છે. તે oints) અંગે કયું વર્ણન સાચું છે?", "opts": ["G1 checkpoint (Restriction point) કોષની કદ અને પોષક તત્ત્વોની ઉપલબ્ધતા તપાસે છે, જ્યારે G2 checkpoint માત્ર DNA નુકસાન તપાસે છે, S તબક્કાની ચોકસાઈ નહીં.", "M checkpoint (Spindle assembly checkpoint) ક્રોમોઝોમ્સના બધા જ કિનેટોકોર સ્પિન્ડલ ફાઇબર સાથે યોગ્ય રીતે જોડાયા છે કે કેમ તે તપાસે છે, જે સહોદર ક્રોમેટિડ્સના વિભાજન માટે જરૂરી છે.", "G2 checkpoint કોષની વિભાજન-ક્ષમતાને કારણે સક્રિય થાય છે જ્યારે કોષ S તબક્કામાં પ્રવેશે છે.", "કોઈ પણ checkpoint નિષ્ફળ જાય ત્યારે કોષ તરત જ અપોપ્ટોસિસ (apoptosis) માં પ્રવેશે; કોઈ પણ હોમિયસ્ટેસિસ સુધારાની પ્રક્રિયા થતી નથી."], "correct": 1, "explain": "M checkpoint (અથવા Spindle assembly checkpoint) એ મેટાફેઝથી એનાફેઝમાં પ્રવેશ પહેલાં તપાસ કરે છે કે ક્રોમોઝોમ્સના બધા જ કિનેટોકોર સ્પિન્ડલ ફાઇબર સાથે યોગ્ય રીતે જોડાયા છે અને બંને ધ્રુવો તરફથી સમાન ખેંચાણ મળે છે છે. જો કોઈ કિનેટોકોર જોડાયેલું ન હોય કે ભ્રષ્ટ હોય તો M checkpoint કોષને એનાફેઝમાં દખલ કરે છે અને HST (hormone signaling pathway) દ્વારા સુધારા માટે સમય આપે છે. આમ B સાચો છે.", "tag": ""}, {"q": "માઇટોસિસ (Mitosis) ની 'ટેલોકેટાઇન (Telophase)' પછી સેન્ટ્રિયોલ (Centriole) નું કયું વર્તન સાચું છે?", "opts": ["ટેલોકેટાઇન પછી સેન્ટ્રિયોલ્સની સંખ્યા અર્ધી થઈ જાય છે કારણ કે તેઓ ન્યુક્લિયર મેમ્બ્રેનની અંદર સ્થાયી થઈ જાય છે.", "ટેલોકેટાઇન દરમિયાન સેન્ટ્રિયોલ્સ વિભાજિત થઈને વધુ સંખ્યામાં બને છે.", "ટેલોકેટાઇન પછી સેન્ટ્રિયોલ્સ સક્રિય રીતે સ્પિન્ડલ ફાઇબરનું ઉત્પાદન શરૂ કરે છે, જેથી Cytokinesis શરૂ થાય.", "ટેલોકેટાઇન પછી સેન્ટ્રિયોલ્સનો સમૂહ બે સેટમાં વહેંચાય છે, દરેક બંધ કોષમાં એક સેટ હોય છે. પૂર્વજ કોષમાં જે સેન્ટ્રિયોલ્સ વિભાજિત થઈને બનેલા હતા તે પુનઃ સક્રિયતા ધરાવતા નથી."], "correct": 3, "explain": "માઇટોસિસ દરમિયાન, પ્રોકેટાઇક સમયમાં સેન્ટ્રિયોલ્સ વિભાજિત થઈને બે સેટ બને છે અને વિરુદ્ધ ધ્રુવો તરફ જાય છે. ટેલોકેટાઇન પછી, જ્યારે દ્વિધ્રુવી કોષબંધ (two daughter nuclei) નિર્માણ પામે છે, ત્યારે દરેક નવા કોષમાં એક જ સેન્ટ્રિયોલ સેટ (બે સેન્ટ્રિયોલ્સ) હોય છે. સેન્ટ્રિયોલ વિભાજન પછી તેઓ શૈકલના G1 તબક્કામાં ફરી સક્રિય થાય છે, પણ ટેલોકેટાઇન પછી તરત જ ન  થાય છે, પ્રોમિટેઝામાં નહિ"], "correct": 0, "explain": "પ્રોફેઝા (Prophase) દરમિયાન ક્રોમેટિનનું સાંઘણાવટ જોીએ છે અને સ્પેન બને છે, જ્યારે પ્રોમિટેઝા (Prometaphase) દરમિયાન ન્યુક્લિયર છિલ્લું વિઘટિત થાય છે અને માઇક્રોટુબ્યુલ્સ ક્રોમોઝોમ્સ સાથે જોડાય છે.", "tag": ""}, {"q": "માઇટોસિસના કયા તબક્કામાં ક્રોમોઝોમ્સ કોષની સમસ્થિતિ (Equator) પર મળજોઈને ઊભા રહે છે?", "opts": ["પ્રોફેઝા", "મેટાફેઝા", "અનુકાળ", "ટેલોફેઝા"], "correct": 1, "explain": "મેટાફેઝા (Metaphase) દરમિયાન જ ક્રોમોઝોમ્સ કોષની સમસ્થિતિ (Equator) પર મળજોઈને ઊભા રહે છે અને સ્પેન દ્વારા ખેંચાઈને યોગ્ય રીતે મુજબી બનેલા છે.", "tag": ""}, {"q": "માઇટોસિસના અનુકાળ (Anaphase) દરમિયાન, સેન્ટ્રોમીરેના (Centromere) ક્રોમેટિડ્સના વિભાજન પછી શું થાય છે?", "opts": ["ક્રોમોઝોમ્સ કોષની સમસ્થિતિ (Equator) પર મુખમુખી થાય છે", "ન્યુક્લિયર છિલ્લું (Nuclear envelope) ફેલાય છે", "સેન્ટ્રિયોની (Centriole) દક્ષિણગતિયા કદમાં ચલાય છે", "ક્રોમેટિડ્સના સ્વરૂપે (sister chromatids) વિદ્યુત્સ્ક થાય છે"], "correct": 2, "explain": "માઇટોસિસના અનુકાળ (Anaphase) દરમિયાન, સેન્ટ્રોમીરેના (Centromere) ક્રોમેટિડ્સના વિભાજન પછી સેન્ટ્રિયોની (Centriole) દક્ષિણગતિયા કદમાં ચલાય છે, જે ક્રોમોઝોમ્સને વિપરીત પાસાએ ખસખસાવે છે.", "tag": ""}, {"q": "જંતુ કોષો (Animal cells) માં સાયટોકિનેસિસ (કોષદ્રવ્ય વિભાજન) મુખ્યત્વે કઈ રચના દ્વારા થાય છે?", "opts": ["કોષ પ્લેટ (Cell plate) ની રચના", "સ્પિન્ડલ તંતુઓનું પ્રત્યાવર્તન", "કોષ વિરોધી ધ્રુવો પર સેન્ટ્રિઓલોનું સ્થાનાંતર", "સેન્ટ્રોફિબ્રોસોમલ સંકોચન રિંગ (Contractile ring)"], "correct": 3, "explain": "જંતુ કોષોમાં, આફેઝ પછી, એક્ટિન અને માયોસિન પ્રોટીનનું બનેલું રિંગ પટલની અંદર સંકોચન પામે છે, જેનાથી પટલની બહાર તરફ એક ઊંડો ખાડો (Cleavage furrow) બને છે અને બે કોષોમાં વિભાજન થાય છે. ઉદ્ભિદ કોષોમાં કોષ પ્લેટ રચાય છે.", "tag": ""}, {"q": "કોષ વિભાજન પ્રક્રિયાના કયા પ્રકારમાં કોષ વિભાજન (Cytokinesis) વગર ક્રિયાકલાપ થતાં બહુકેન્દ્રક (Multinucleate) અવસ્થા સર્જાય છે?", "opts": ["સામાન્ય મિટોસિસ", "એન્ડોમિટોસિસ (Endomitosis)", "અર્ધસૂત્રી વિભાજન (Meiosis)", "સાયટોકિનેસિસ"], "correct": 1, "explain": "એન્ડોમિટોસિસમાં રંગસૂત્રોનું પ્રતિકૃતિ (Replication) થાય છે અને ન્યુક્લિયસ વિભાજન થાય છે, પરંતુ કોષદ્રવ્ય વિભાજન થતું નથી. જેના કારણે એક જ કોષમાં ઘણા ન્યુક્લિયસ ધરાવતી અવસ્થા (Coenocyte/Syncytium) ઉભી થાય છે, જે કેટલાક ફૂગ અને પ્રાણીઓમાં જોવા મળે છે.", "tag": ""}, {"q": "અર્ધસૂત્રી વિભાજન (Meiosis) ની પ્રક્રિયા સંબંધી નીચેમાંથી કયું વિધાન સાચું છે?", "opts": ["આ પ્રક્રિયામાં પિતૃ કોષનાં રંગસૂત્રોની સંખ્યા બમણી થાય છે.", "આ પ્રક્રિયામાં બે કોષો પ્રાપ્ત થાય છે જે પિતૃ કોષ જેટલા જ હોય છે.", "આ પ્રક્રિયામાં મૂળભૂત રંગસૂત્ર સંખ્યા અડધી થાય છે અને ચાર કોષો બને છે.", "આ પ્રક્રિયા માત્ર શરિરિક કોષો (Somatic cells) માં જ થાય છે."], "correct": 2, "explain": "અર્ધસૂત્રી વિભાજન એ એવી પ્રક્રિયા છે જેમાં એક પ્રાણી અથવા સ્તંભી કોષ બે વિભાજનો (Meiosis I અને II) માંથી પસાર થઈને ચાર એકતાંદ્રીય (Haploid) કોષો ઉત્પન્ન કરે છે. આમ રંગસૂત્રોની સંખ્યા અડધી થઈ જાય છે, જે સંકરણ દરમિયાન સ્થિર રાખે છે.", "tag": ""}, {"q": "અર્ધસૂત્રી વિભાજનના પ્રોફેઝ-1 (Prophase I) માંથી યોગ્ય જોડીઓ અને તેમના લક્ષણો નક્કી કરો: નીચેનામાંથી કયું યોગ્ય જોડાયેલું જોડાણ છે?", "opts": ["લેપ્ટોટેન (Leptotene) — સમરૂપ રંગસૂત્રોનું સંપૂર્ણ સંયોજન", "ઝાયગોટેન (Zygotene) — સિનેપ્સિસ (સંયોજન) શરૂ થાય છે", "પેકીટેન (Pachytene) — ચેમર (Chiasmata) દૃશ્યમાન થાય છે", "ડિપ્લોટેન (Diplotene) — સ્પાયનેમ (Spindle) ની રચના થાય છે"], "correct": 1, "explain": "ઝાયગોટેન તબક્કામાં સમરૂપ રંગસૂત્રોનું પરસપર જોડાણ (Synapsis) શરૂ થાય છે, જેનાથી બાયવેલન્ટ (Bivalent) રચાય છે. લેપ્ટોટેનમાં રંગસૂત્રો સૂક્ષ્મ દૃશ્યમાન થાય છે, પેકીટેનમાં આડું સંક્રમણ (Crossing over) થાય છે, અને ડિપ્લોટેનમાં ચેમર દેખાય છે.", "tag": ""}, {"q": "અર્ધસૂત્રી વિભાજનની પ્રક્રિયામાં, પ્રોફેઝ-1 ના પેકીટેન (Pachytene) તબક્કાની શ્રેષ્ઠ લાક્ષણિકતા કઈ છે?", "opts": ["ક્રોમેટિન્સનું સાંદ્રણ થઈને સૂક્ષ્મ રેખાકાર દેખાય છે.", "બાયવેલન્ટ્સ વચ્ચે આડું સંક્રમણ (Crossing over) થાય છે.", "સમરૂપ રંગસૂત્રો પોતાની ધ્રુવો તરફ ગતિ કરે છે.", "કોષ પટલનું સંપૂર્ણ નિર્માણ થાય છે."], "correct": 1, "explain": "પેકીટેન તબક્કામાં સિનેપ્સિસ સંપૂર્ણ બન્યું હોય છે અને સમરૂપ રંગસૂત્રોની બે યુગ્મિત ક્રોમેટિડ્સ વચ્ચે જ }

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

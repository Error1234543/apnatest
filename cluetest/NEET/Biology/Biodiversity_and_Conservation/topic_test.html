const QUIZ = [{"q": "જૈવિક વિવિધતા (Biodiversity) શબ્દનો ઉપયોગ સૌ પ્રથમ કોણે કર્યો હતો?", "opts": ["થોર્લ્ટન (T.W. Walters)", "એલન રીસ (E.O. Wilson)", "કાર્લ લિનિયસ (Carolus Linnaeus)", "ડેવિડ લાટેમર (David Tilman)"], "correct": 1, "explain": "એલન રીસ (E.O. Wilson) નામે જૈવિક વિવિધતા શબ્દનો પ્રચલિત ઉપયોગ લોકપ્રિય બનાવ્યો હતો. તેઓ આ વિષયના મુખ્ય પ્રચારક ગણાય છે.", "tag": ""}, {"q": "આપણા વિશ્વની અંદર જૈવિક વિવિધતાના કયા ત્રણ સ્તરો જોવા મળે છે?", "opts": ["જનીનીય, પ્રજાતિ અને જૈવ-મંડળીય", "પ્રકાર, જાતિ અને પ્રજાતિ", "જનીનીય વિવિધતા, પ્રજાતિ વિવિધતા અને પારિસ્થિતિકી વિવિધતા", "વનસ્પતિ, પ્રાણી અને સૂક્ષ્મજીવી"], "correct": 2, "explain": "NCERT મુજબ, જૈવિક વિવિધતા ત્રણ સ્તરે વિભાજિત છે: જનીનીય વિવિધતા, પ્રજાતિ વિવિધતા અને પારિસ્થિતિકી વિવિધતા.", "tag": ""}, {"q": "પ્રજાતિ વિવિધતા (Species diversity) માં આદર્શ રીતે કયા ભૌગોલિક ક્ષેત્રમાં વધારો થાય છે?", "opts": ["ધ્રુવની દિશામાં", "ઉષ્ણકટિબંધીય (આઇક્વેટોરિયલ) વિસ્તારો તરફ", "મધ્યમ અક્ષાંશ પર", "શુષ્ક દેશોમાં"], "correct": 1, "explain": "પ્રજાતિ વિવિધતાનો પેટર્ન એવો હોય છે કે તે ધ્રુવથી દૂર ઉષ્ણકટિબંધીય (આઇક્વેટોરિયલ) પ્રદેશોમાં વધતી જાય છે.", "tag": ""}, {"q": "જનીનીય વિવિધતાનો અર્થ શું થાય છે?", "opts": ["વિવિધ પારિસ્થિતિકી તંત્રોની વિવિધતા", "એક જ પ્રજાતિ અંદર રહેલા જનીનોના તફાવતો", "પાદપ અને પ્રાણી પ્રજાતિઓ વચ્ચેનો તફાવત", "એક જ વનસ્પતિની વિવિધ ક્ષેત્રોમાં ફેલાવો"], "correct": 1, "explain": "જનીનીય વિવિધતા એટલે એક જ પ્રજાતિના વ્યક્તિઓ વચ્ચે જનીનીય વિવિધતા, જેને પરિણામે તેમના સ્વરૂપ અને ગુણધર્મોમાં તફાવત આવે છે.", "tag": ""}, {"q": "પારિસ્થિતિકી વિવિધતા (Ecosystem diversity) શું દર્શાવે છે?", "opts": ["અલગ-અલગ વસ્તીઓની જાતો", "વિવિધ પારિસ્થિતિકી તંત્રોની વિવિધતા", "સમાન પર્યાવરણમાં એક જ પ્રજાતિની વસ્તી", "પ્રજાતિઓ વચ્ચેની યુક્તિ"], "correct": 1, "explain": "પારિસ્થિતિકી વિવિધતા એટલે ભૌગોલિક વિસ્તારમાં રહેલા વિવિધ પારિસ્થિતિકી તંત્રો (ecosystems) નો સમૂહ.", "tag": ""}, {"q": "NIR (National Institute of Rock Genetics, NIOF) એટલે શું તથા ભારતમાં ex-situ સંરક્ષણ પદ્ધતિઓ માં કયો વિકલ્પ સામેલ નથી?", "opts": ["NIR એક પ્રવર્તન સંસ્થા છે; વન્યજીવ ઉद्याન સામેલ નથી", "NIR એ પર્યાવરણ સંરક્ષણ સંસ્થા છે; જનીન ભંડોળ સામેલ નથી", "NIR એ પ્રાણી સંરક્ષણ સંસ્થા છે; સમુદ્ર ઉद्याન સામેલ નથી", "NIR એ પર્યાવરણ સંશોધન સંસ્થા છે; બાયોડાયવર્સિટી હોટસ્પોટ સામેલ નથી"], "correct": 0, "explain": "NIR ભારતની એક સરકારી સંસ્થા છે જે વનસ્પતિઓ અને પ્રાણીઓના ex-situ સંરક્ષણ માટે કામ કરે છે. વન્યજીવ ઉद्याન એ in-situ સંરક્ષણનો ભાગ છે, તેથી તે ex-situ પદ્ધતિઓમાં સામેલ નથી.", "tag": ""}, {"q": "ભારતના બાયોડાયવર્સિટી હોટસ્પોટ્સ કયા છે તથા આ હોટસ્પોટ્સનું મૂળ સંકલ્પના કોણે રજૂ કરી હતી?", "opts": ["સહ્યાદ્રી, નીલગિરી અને આંધ્ર પ્રદેશ; નોર્મેન મ્યુરેલ", "હિમાલય, નીલગિરી અને સહ્યાદ્રી; રૉબર્ટ વેટર", "નીલગિરી, પૂર્વોત્તર અને હિમાલય; એડવર્ડ વર્નર", "સહ્યાદ્રી, હિમાલય અને નીલગિરી; કેમરૂન મિકેલ"], "correct": 1, "explain": "ભારતમાં ત્રણ બાયોડાયવર્સિટી હોટસ્પોટ્સ છે — હિમાલય, નીલગિરી અને સહ્યાદ્રી. 'બાયોડાયવર્સિટી હોટસ્પોટ'ની સંકલ્પના રૉબર્ટ વેટરે 1988માં રજૂ કરી હતી.", "tag": ""}, {"q": "રેડ ડેટા બુક (Red Data Book) માં કયું વિગત સામેલ નથી હોતું?", "opts": ["લુપ્ત પ્રજાતિઓની યાદી", "અતિ-વિલુપ્ત (Critically Endangered) પ્રજાતિઓની યાદી", "સંવેદનશીલ પ્રજાતિઓની યાદી", "અસ્તિત્વવાદી (Vulnerable) પ્રજાતિઓની યાદી"], "correct": 2, "explain": "IUCN દ્વારા પ્રકાશિત થતી રેડ ડેટા બુકમાં લુપ્ત, અતિ-વિલુપ્ત, સંકટાપન્ન અને અસ્તિત્વવાદી પ્રજાતિઓની યાદી સામેલ હોય છે. 'સંવેદનશીલ પ્રજાતિઓ' શબ્દ રેડ ડેટા બુકમાં સ્પષ્ટતયા ઉલ્લેખિત નથી.", "tag": ""}, {"q": "પ્રજાતિઓના વિલુપ્ત થવા માટેનું કારણ સમજાવતા 'મૃત્યુબીજ ચતુષ્ટય' (Deadly Quartet) માં કયું પદ સામેલ નથી?", "opts": ["હેબિટેટ હાનિ (Habitat Loss)", "હેબિટેટ વિભાજન (Fragmentation)", "જૈવિક આક્રમણ (Biological Invasion)", "જૂની પ્રજાતિઓનું વિકાસ"], "correct": 3, "explain": "મૃત્યુબીજ ચતુષ્ટયમાં આઠ મુખ્ય કારણો છે — હેબિટેટ હાનિ, હેબિટેટ વિભાજન, અતિવહન (Overexploitation) અને જૈવિક આક્રમણ (Invasive Species). 'જૂની પ્રજાતિઓનું વિકાસ' આ ચતુષ્ટયમાં સામેલ નથી.", "tag": ""}, {"q": "બાયોપાયરેસી (Biopiracy) શબ્દ શા માટે ઉપયોગમાં લેવાય છે તથા ભારતમાં આ બાબતે કયો કાયદો અમલમાં છે?", "opts": ["બાયોડાયવર્સિટીનું અનાદર; પર્યાવરણ સંરક્ષણ अधिनियम, 1986", "બાયોલોજિકલ સંસાધનોનું બિનઅધિકૃત શોષણ; બાયોડાયવર્સિટી अधिनियम, 2002", "વૈજ્ઞાનિક સંશોધન; પર્યટન अधिनियમ, 2000", "વનસ્પતિ સંરક્ષણ; વન્યજીવ સંરક્ષણ अधिनियમ, 1972"], "correct": 1, "explain": "બાયોપાયરેસી એ બાયોલોજિકલ સંસાધનો અને પરંપરાગત જ્ઞાનનું બિનઅધિકૃત શોષણ છે. ભારતમાં આથી રક્ષા કરવા 'બાયોડાયવર્સિટી अधिनियમ, 2002' અમલમાં છે જે National Biodiversity Authority સ્થાપે છે.", "tag": ""}];

    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>

<script>
const QUIZ = [{"q": "માનવ શ્વસન તંત્રમાં 'એન્ટર્ટ્રેશીયલ સપેસ' (વચ્ચેનું અંતર) ક્યાં વિસ્તાર છે?", "opts": ["ફેફસાંની પેરાન્કાઇમાના એલ્વિયોલી and પરિપ્લેય્રલ કેપિલરની વચ્ચે", "ટ્રેકિયા and બ્રોન્કાઇ વચ્ચે", "ડાયફ્રામ and એબડોમેનલ દિવાલ વચ્ચે", "નસા and ધમનીઓ વચ્ચે"], "correct": 0, "explain": "પેરાન્કાઇમા (અર્ધપારગમ્ય આધાર) એ અલ્વિયોલી and પરિપ્લેય્રલ કેપિલરી વચ્ચેનું સૂક્ષ્મ અંતર છે, જ્યાં ઓક્સિજન and કાર્બન ડાયોક્સાઇડ વિનિમય થાય છે.", "tag": ""}, {"q": "કયા તત્વો ફેફસાંના પેરાન્કાઇમા (અર્ધપારગમ્ય આધાર) નું નિર્માણ કરે છે?", "opts": ["અલ્વિયોલીની એપિથેલિયલ કોષો અને પરિપ્લેય્રલ કેપિલરીના એન્ડોથેલિયલ કોષો", "શ્વસન પટલ and ધમની", "ડાયફ્રામ and પિલરી", "બ્રોન્કાઇ and ટ્રેકિયા"], "correct": 0, "explain": "ફેફસાંના પેરાન્કાઇમા નું નિર્માણ અલ્વિયોલીની પટલ and તેની આસપાસના પરિપ્લેય્રલ કેપિલરી પટલના સ્તરોથી થાય છે.", "tag": ""}, {"q": "આંતરપટીય દબાણ (Intrapleural pressure) સૌથી ઓછું (ઓછામાં ઓછું સકારાત્મક) ક્યારે હોય છે?", "opts": ["ગહન શ્વાસ લેતી વખતે (ઉદ્વાસને પહેલાં)", "સામાન્ય શ્વાસ લેતી વખતે", "ગહન શ્વાસ છોડતી વખતે (ઉદ્વાસ દરમિયાન)", "શ્વાસની વચ્ચેનું વિરામ"], "correct": 2, "explain": "ગહન શ્વાસ છોડતી વખતે (ઉદ્વાસ દરમિયાન), ઘોંઘાટી ચટ્ટાણ ઉપર ઊગરી આવે છે, જેથી આંતરપટીય દબાણ સૌથી વધુ ઋણ (-8 cm H2O) હોય છે.", "tag": ""}, {"q": "પ્રશ્નમાં, શ્વાસ લેવાની પ્રક્રિયા દરમિયાન વચ્ચેના દબાણ (Intrapulmonary pressure) શું થાય છે?", "opts": ["તે વાતાવરણના દબાણ કરતાં ઓછું (ઓછામાં ઓછું સકારાત્મક) બને છે", "તે વાતાવરણના દબાણ જેટલું જ રહે છે", "તે વાતાવરણના દબાણ કરતાં વધારે (વધુ સકારાત્મક) બને છે", "તે શૂન્ય થઈ જાય છે"], "correct": 0, "explain": "ઉદ્વાસ દરમિયાન, ઘોંઘાટી ચટ્ટાણ ડાઉન થાય છે and ફેફસાંના કદમાં વધારો થાય છે, જેથી વચ્ચેનું દબાણ વાતાવરણ કરતાં ઓછું થઈ જાય and હવા અંદર સર્વત્ર ગમે.", "tag": ""}, {"q": "શ્વસન પટલ (Respiratory membrane) નું મોટાભાગનું કાર્ય શું છે?", "opts": ["ઓક્સિજન and કાર્બન ડાયોક્સાઇડ વિનિમય", "હવાને ગરમ and ભીની કરવી", "ધૂળ and માઇક્રો-જીવોનું ધોવું", "શ્વાસલય નિયંત્રણ"], "correct": 0, "explain": "પેરાન્કાઇમા (વચ્ચેનું અંતર) ની સામાન્ય જાડાઈ 0.5 mm થી પણ ઓછી હોય છે, જે ઝડપી વિસરણ માટે યોગ્ય છે. તેનો મુખ્ય કાર્ય ઓક્સિજન and કાર્બન ડાયોક્સાઇડ વિનિમય થવો છે.", "tag": ""}, {"q": "શ્વસન દરમિયાન સંવહન ક્રિયા (Pulmonary ventilation) સાચવવા માટે જરૂરી દબાણ તફાવતોનું સૂત્ર કયું છે?", "opts": ["ATM = IRV + TV + ERV + RV", "VC = TV + IRV + ERV", "PCO₂ અને PO₂ વચ્ચેનો દબાણ તફાવત", "વધુ એન્ટર્ટ્રેશીયલ મેમ્બ્રેન ક્ષેત્રફળ"], "correct": 1, "explain": "સ્વાભાવિક શ્વસન દરમિયાન, ફેફસાંમાં હવાના પ્રવાહને કારણે થતા દબાણ તફાવતોનું ગણતરી કરવા માટે વિવિધ શ્વસન ધારિતા (Lung Volumes) નો ઉપયોગ થાય છે. વર્દ્ધાયુ વૃત્તિ (Vital Capacity - VC) એ શ્વાસાભ્યાસ પછી લઈ શકાતી કુલ હવાની માત્રા છે જે VC = TV + IRV + ERV મુજબ ગણાય છે. આ દબાણ તફાવત અને વાયુ પ્રવાહની ગતિશીલતા સમજવા માટે આવશ્યક છે.", "tag": ""}, {"q": "શ્વસન પ્રવાહ દરમિયાન 'બોહેમ-સ્ચોલર' ક્રિયા (Bodily-Scholer effect) અને 'હાલ-ફ્લો' અસર દ્વારા વાયુ વિનિમયનું વિવરણ કરતું વિધાન કયું સાચું છે?", "opts": ["હાલ-ફ્લો અસર દરમિયાન વાયુઓ નળીના કેન્દ્રમાંથી બહાર નીકળે છે", "બોહેમ-સ્ચોલર ક્રિયા દ્વારા હૂપ (Hypoxic) સ્થિતિમાં હવાની ગતિ ઘટે છે", "હાલ-ફ્લો અસર દરમિયાન વાયુઓ પાઈપની દીવાલની નજીક વહે છે", "બોહેમ-સ્ચોલર ક્રિયા સિધાંત હવા-રક્ત અવરોધમાં વધારો કરે છે"], "correct": 2, "explain": "વાયુઓના પ્રવાહ દરમિયાન, 'હાલ-ફ્લો' (Flow) અસરને કારણે વાયુ અણુઓ પાઈપ કે નળીની દીવાલની નજીક વધુ ધીમી ગતિએ વહે છે, જ્યારે કેન્દ્રમાં ઝડપથી વહે છે. 'બોહેમ-સ્ચોલર' સિધાંત (Bohr effect) આરોગ્યની સ્થિતિમાં વાયુ વિનિમય માટે જવાબદાર હોય છે, પરંતુ તે વાયુની ગતિસૂત્ર સાથે સીધો સંબંધિત નથી. આમ, વાયુઓનું વિતરણ અને વિનિમય દરમિયાન વાયુઓ દીવાલની નજીક ઓછી ગતિએ વહે છે.", "tag": ""}, {"q": "શ્વસન તંત્રની દોષપૂર્ણ ગતિશીલતા દરમિયાન, શ્વસન દર (Respiratory rate) માં વધારો થવા માટેની મુખ્ય ભૌતિક કારણ કયું છે?", "opts": ["રક્તમાં O₂ નું પ્રમાણ વધવાથી", "ચયાપચય દરમાં ઘટાડો થવાથી", "પર્યાવરણીય T વધવાથી અને CO₂ ની હાજરી વધવાથી", "હૂપ (Hypoxic) સ્થિતિમાં O₂ ની ખપત ઘટવાથી"], "correct": 2, "explain": "શ્વસન દરમાં વધારો થવા માટેની મુખ્ય કારણોમાંથી એક પર્યાવરણીય તાપમાન (Temperature) અને રક્તમાં CO₂ ની સાંદ્રતા વધારો થવો છે. જ્યારે શરીરનું તાપમાન વધે છે અથવા કાર્બન ડાયોક્સાઇડનું પ્રમાણ વધે છે, ત્યારે શ્વસન કેન્દ્ર પ્રેરિત થઈને શ્વસન દર વધારે છે, જેથી વધુ O₂ લઈ શકાય અને વધુ CO₂ બહાર કાઢી શકાય. O₂ નું પ્રમાણ વધવાથી શ્વસન દર ઘટે છે.", "tag": ""}, {"q": "રાસાયણિક પ્રક્રિયામાં 'કાર્બોનિક એન્જાઈમ' (Carbonic Anhydrase) નું કાર્ય શું છે?", "opts": ["O₂ નું રક્તમાં પરિવહન વધારે છે", "H⁺ અને HCO₃⁻ માં CO₂ નું રૂપાંતરણ કરે છે", "હિમોગ્લોબિન સાથે CO બંધ બનાવે છે", "લોહીના pH ને સ્થિર રાખે છે"], "correct": 1, "explain": "કાર્બોનિક એન્જાઈમ (Carbonic Anhydrase) એ રક્તમાં એક એન્જાઈમ છે જે CO₂ અને H₂O ના સંયોજન દ્વારા H₂CO₃ (કાર્બોનિક એસિડ) બનાવવાની ક્રિયામાં પ્રવેગક તરીકે કામ કરે છે. આ H₂CO₃ તરત જ વિઘટિત થઈ H⁺ અને HCO₃⁻ આયનો બનાવે છે. આ પ્રક્રિયા દ્વારા CO₂ નું પરિવહન અને રક્તનું pH સંતુલન જાળવવામાં મદદ મળે છે.", "tag": ""}, {"q": "શ્વસન નિયંત્રણ પટ (Respiratory rhythm centre) ક્યાં આવેલું છે અને તે કયા સ્તરેથી પ્રેરિત થાય છે?", "opts": ["મેડુલા ઓબલોંગા (Medulla Oblongata); પ્યુમોટેક્સિક પટ (Pontine) દ્વારા", "પ્યુમોટેક્સિક પટ (Pons); મેડુલા ઓબલોંગા દ્વારા", "સેરિબ્રલ કોર્ટેક્સ; હાયપોથેલામસ દ્વારા", "સ્પાઇનલ કર્ડ; મગજના અન્ય ભાગો દ્વારા"], "correct": 0, "explain": "શ્વસન નિયંત્રણ પટ મુખ્યત્વે મેડુલા ઓબલોંગા (Medulla Oblongata) માં આવેલું છે, જે શ્વસનની મૂળભૂત છાંટીય (Rhythm) સ્થાપિત કરે છે. પ્યુમોટેક્સિક પટ (Pontine centre) હોવાને કારણે શ્વસનનો સમય અને ઊંડાણ યોગ્ય રીતે નિયંત્રિત થાય છે. આ બંને ભાગો मिलીને શ્વસન પ્રક્રિયાને અસરકારક રીતે નિયંત્રિત કરે છે.", "tag": ""}, {"q": "ક્ષાર વિનિમય (Chloride Shift) સાથે સંકળાયેલું નીચેનો કયા વિધાન સાચું છે?", "opts": ["RBC માં Cl⁻ નું સંલયન પલાઝ્માં HCO₃⁻ ના બહિર્ગમન સાથે સંકળાયેલું છે", "ક્ષાર વિનિમય દરમિયાન Na⁺ આયનો RBC માં પ્રવેશે છે", "ક્ષાર વિનિમય શુદ્ધ ઓક્સિજન વહન માટે જરૂરી છે", "ક્ષાર વિનિમય માત્ર ફેફસાની આલ્વિઓલી કોષોમાં જ થાય છે"], "correct": 0, "explain": "ક્ષાર વિનિમય (Chloride Shift) દરમિયાન RBC પટલમાં Cl⁻ નું પ્રવેશન થાય છે ત્યારે, બાયકાર્બોનેટ આયનો (HCO₃⁻) RBC માંથી બહિર્ગમિત થઈ પલાઝ્માં જાય છે — આ વિનિમય એન્ઝાઈમ કાર્બોનિક એન્હાઈડ્રેઝ દ્વારા થતા રાસાયણિક પ્રતિક્રિયાથી જ મળતા HCO₃⁻ ના સંચયને કારણે થાય છે. બાકીના વિકલ્પો ભ્રામક છે.", "tag": ""}, {"q": "નાઈટ્રોજન વાયુ (N₂) ના વહન વિશે નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["નાઈટ્રોજનનું વહન હીમોગ્લોબિન સાથે બંધાણ દ્વારા થાય છે", "નાઈટ્રોજન વાયુ ઓક્સિજન કરતાં હીમોગ્લોબિન પ્રત્યે વધુ આભિમુખ્ય ધરાવે છે", "નાઈટ્રોજનનું વહન નગણ્ય પ્રમાણમાં થાય છે કારણ કે તેનું દ્રાવ્યતા દબાણ ઓછું હોય છે", "નાઈટ્રોજન વાયુ કાર્બોક્સિહીમોગ્લોબિન બનાવે છે"], "correct": 2, "explain": "નાઈટ્રોજન (N₂) એ રક્તમાં નગણ્ય માત્રામાં દ્રાવ્ય થાય છે અને હીમોગ્લોબિન સાથે બંધાણ પામે છે નહીં — તેનું વહન દ્રાવ્ય અવસ્થામાં ખૂબ જ ઓછા પ્રમાણમાં થાય છે. કાર્બોક્સિહીમોગ્લોબિન કાર્બન મોનોક્સાઈડ (CO) વડે બને છે, N₂ વડે નહીં.", "tag": ""}, {"q": "ઓક્સિહીમોગ્લોબિન વિઘટન વક્ર (Oxyhemoglobin Dissociation Curve) ના સંદર્ભમાં નીચેનો કયો વિકલ્પ સાચો છે?", "opts": ["વધુ pH અને ઓછા pCO₂ હોય ત્યારે વક્ર ડાબી બાજુ ખસે છે અને હીમોગ્લોબિનની ઓગ્સિજન પ્રત્યે આભિમુખ્ય વધે છે", "ઉષ્મા વધવાથી વક્ર ડાબી બાજુ ખસે છે", "2,3-DPG નું પ્રમાણ ઘટવાથી વક્ર જમણી બાજુ ખસે છે", "pH ઘટવાથી (વધુ H⁺) હીમોગ્લોબિનની ઓગ્સિજન પ્રત્યે આભિમુખ્ય વધે છે"], "correct": 0, "explain": "વધુ pH (અલ્કલાઇન) અને ઓછા pCO₂ હોય ત્યારે હીમોગ્લોબિનની ઓગ્સિજન પ્રત્યે આભિમુખ્ય વધે છે — આથી વિઘટન વક્ર ડાબી બાજુ ખસે છે (Böhreffecનો વિપરીત સંદર્ભ). વધુ ઊષ્મા, વધુ 2,3-DPG અને ઘટતું pH (વધુ H⁺) એ વક્રને જમણી બાજુ ખસેડે છે.", "tag": ""}, {"q": "નાઇટ્રોજન વાયુ (N₂) ના સંદર્ભમાં નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["નાઇટ્રોજન વાયુ રક્તમાં હીમોગ્લોબિન સાથે સંયોજિત થઈ વહન પામે છે", "નાઇટ્રોજનનું વહન તેના અંશીય દબાણની પ્રમાણમાં થાય છે અને તે દ્રાવ્યતા અચળાંક પર આધારિત છે", "નાઇટ્રોજન વાયુ ધમની રક્તમાં CO₂ કરતાં વધુ પ્રમાણમાં વિદ્યમાન હોય છે", "ડાઈવિંગ દરમિયાન નાઇટ્રોજનનું વહન વધારે થવું એ જ હાઈપોક્સિયાનું કારણ બને છે"], "correct": 1, "explain": "નાઇટ્રોજન વાયુ (N₂) રક્તમાં માત્ર દ્રાવ્ય અવસ્થામાં જ વહન પામે છે; તેનું દ્રાવ્ય પ્રમાણ તેના આંશિક દબાણ અને દ્રાવ્યતા અચળાંક પર આધારિત હોય છે. N₂ હીમોગ્લોબિન સાથે બંધાણ પામે છે નહીં અને ધમની રક્તમાં તે CO₂ કરતાં ઓછા પ્રમાણમાં હોય છે.", "tag": ""}, {"q": "RBC માં કાર્બન ડાયોક્સાઈડના વહન બાબતે નીચેનામાંથી કયું વિધાન ભ્રામક છે?", "opts": ["CO₂ નું લગભગ 70% ભાગ HCO₃⁻ ના રૂપમાં પલાઝ્માં વહન પામે છે", "કાર્બોનિક એનહાઈડ્રેઝ એન્ઝાઈમ RBC ના સાયટોપ્લાઝ્માં વિદ્યમાન હોય છે", "CO₂ નું રૂધિરપ્લઝ્માં ૨૩% ભાગ કાર્બામિનોહીમોગ્લોબિન બની વહન પામે છે", "CO₂ નું ૭% ભાગ રૂધિરપ્લઝ્માં દ્રાવ્ય અવસ્થામાં વહન પામે છે"], "correct": 2, "explain": "કાર્બોનિક એનહાઈડ્રેઝ (Carbonic Anhydrase) એન્ઝાઈમ RBC સાયટોપ્લાઝ્માં છે; HCO₃⁻ ≈ 70%, કાર્બામિનોહીમોગ્લોબિન ≈ 23%, અને દ્રાવ્ય ≈ 7%. વિકલ્પ C માં CO₂ નું ૨૩% ભાગ કાર્બામિનોહીમોગ્લોબિન બની વહન પામે છે — આ સાચું છે. જોકે 'રૂધિરપ્લઝ્માં' શબ્દ ભ્રામક છે કારણ કે કાર્બામિનોહીમોગ્લોબિન RBC માં બને છે, પ્લાઝ્માં નહીં — તેથી આ વિધાન ભ્રામક છે.", "tag": ""}, {"q": "બોહર અસર (Bohr Effect) નીચેનામાંથી ક્યા સંદર્ભમાં મહત્વપૂર્ણ છે?", "opts": ["ઊણા પોલીંગ (High Altitude) એ શરીરમાં ઓકસિજનનું વિનિમય", "કેરિયર (Carrier) પ્રવાહી માં ઓક્સિજનનું પરિવહન", "કોષીય શ્વસનમાં ATP નું ઉત્પાદન", "શ્વાસનળીની સ્નાયુઓનું આંતરિક નિયંત્રણ"], "correct": 0, "explain": "ઊણા પોલીંગએ (High Altitude) વાતાવરણિક ઓક્સિજનનો આંશિક દબાણ ઘટી જવાને કારણે લુંધમાં ઓક્સિજનનું વિનિમય થવું મુશ્કેલ બને છે. આ સ્થિતિમાં બોહર અસર મહત્વપૂર્ણ બને છે જે હીમોગ્લોબિન-ઓક્સિજન વિઘટન વક્રને ડાબી તરફ ખસેડીને ગેસ વિનિમયને સુધારે છે.", "tag": ""}, {"q": "ચયાપચયની અધિક સક્રિયતા દરમિયાન (Metabolic activity વધુ થાય) શ્વસન દરમાં થતો વધારો મુખ્યત્વે કોણ જવાબદાર છે?", "opts": ["રક્તમાં CO2 ના પ્રમાણમાં થતો વધારો", "લૂંધના કોષોમાં ઓક્સિજનની ખૂબ ઓછી માત્રા", "શ્વાસનળીના ઇપિથેલિયમનું સૂજવું", "હીમોગ્લોબિનનું અતિશય સંતૃપ્ત થવું"], "correct": 0, "explain": "ચયાપચયની સક્રિયતા વધે ત્યારે કોષો વધુ CO2 ઉત્પન્ન કરે છે જે રક્તમાં CO2 ના આંશિક દબાણ (pCO2) ને વધારે છે. pCO2 વધારો રસાયણિક પ્રેસરોસેપ્ટર્સને ઉત્તેજિત કરે છે અને તેના પરિણામે શ્વસન દરમાં વધારો થાય છે.", "tag": ""}, {"q": "હાઈ પર્વતી રોગ (High Altitude Disease) ના લક્ષણો કયા કારણોસર સર્જાય છે?", "opts": ["વાતાવરણિક ઓક્સિજનનો આંશિક દબાણ ઓછો હોવાથી રક્તમાં ઓક્સિજનનું વિનિમય ઓછું થાય છે", "ઓઝોન સ્તર વધુ હોવાથી હીમોગ્લોબિન ન let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

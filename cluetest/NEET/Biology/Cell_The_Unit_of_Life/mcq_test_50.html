<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell — The Unit of Life — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "પ્રથમ વખત કોષ (Cell) નું અવલોકન કોણે કર્યું હતું?", "opts": ["રોબર્ટ હુક", "રોબર્ટ બ્રાઉન", "ટેડોશ્વન", "લૂવેનહૂક"], "correct": 0, "explain": "રોબર્ટ હુકએ 1665 માં ચામડીના પેરેન્કાઇમાના (Cork) પાતળા ટુકડાનું અવલોકન કર્યું હતું અને તેમણે નાના ખાલી બોક્સ જેવા ઘટકો જોયા, જેને તેમણે 'કોષ' નામ આપ્યું હતું.", "tag": ""}, {"q": "કોષ સિદ્ધાંત (Cell Theory) ની રચના કોણે કરી હતી?", "opts": ["રોબર્ટ બ્રાઉન અને મatthias Schleiden", "Schwann અને Theodor Schwann", "M matthias Schleiden અને Theodor Schwann", " Rudolf Virchow અને Robert Brown"], "correct": 2, "explain": "મેટિયાસ શ્લીડન (વનસ્પતિ વિશેષજ્ઞ) અને થિયોડોર શ્વાન (પ્રાણી વિશેષજ્ઞ) એ 1838-1839 દરમિયાન સ્વતંત્ર રીતે કોષ સિદ્ધાંત રજૂ કર્યો હતો.", "tag": ""}, {"q": "'Omnis cellula e cellula' (બધા કોષો અગાઉના કોષોમાંથી જન્મે છે) એ સિદ્ધાંત કોણે આપ્યો હતો?", "opts": ["રોબર્ટ હુક", "રોબર્ટ બ્રાઉન", "રૂડોલ્ફ વિર્ચો", "જોનસન"], "correct": 2, "explain": "રૂડોલ્ફ વિર્ચોએ 1855 માં આ સિદ્ધાંતને કોષ સિદ્ધાંતમાં ઉમેર્યો હતો, જે આધુનિક કોષ સિદ્ધાંતનો એક મહત્વપૂર્ણ ભાગ બન્યો.", "tag": ""}, {"q": "કોષની શોધ કયા સાધનનો ઉપયોગ કરીને કરવામાં આવી હતી?", "opts": ["ઇલેક્ટ્રોન માઇક્રોસ્કોપ", "સાદો દ્વિ-કાચી સ્પષ્ટ દૃષ્ટિકોણ (Simple Microscope)", "અનુગ્રહિક સંયુક્ત દૃષ્ટિકોણ (Compound Microscope)", "ફેઝ-કોન્ટ્રાસ્ટ માઇક્રોસ્કોપ"], "correct": 2, "explain": "રોબર્ટ હુકે પોતાનો અવલોકન માટે એક આદર્શ અનુગ્રહિક સંયુક્ત દૂરબીન (Compound Microscope) નો ઉપયોગ કર્યો હતો, જેમાં લેન્સની સંખ્યા ઓછી હતી પણ ચામડીના પેરાંકાઇમામાં તેમણે કોષ-જેવા ગોળાકાર રચના જોઈ.", "tag": ""}, {"q": "કોષ સિદ્ધાંત અનુસાર નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["સभी શરીરમાં એક જ પ્રકારના કોષ હોય છે.", "કોષ સર્વાંગી રીતે સ્વતંત્ર એકમ નથી.", "જીવનના બધા લક્ષણો કોષમાં નથી.", "કોષ જીવનનું માળખાકીય અને ક્રિયાશીલ એકમ છે."], "correct": 3, "explain": "કોષ સિદ્ધાંત મુજબ, કોષ એ સાધારણ રીતે બધા જીવોનું માળખાકીય અને કાર્યરત એકમ છે; તેજે રીતે, દરેક જીવિત સજીવ એક કોષથી અથવા અनेक કોષોનું બનેલું હોય છે.", "tag": ""}, {"q": "યુકેરિયોટિક કોષમાં જોવા મળતો પણ પ્રોકેરિયોટિક કોષમાં ન હોય તેવું પ્રમુખ રચનાત્મક લક્ષણ કયું છે?", "opts": ["કોષપ્લેઝમા (Plasma membrane) ની હાજરી", "રિબોઝોમ્સ (Ribosomes) ની હાજરી", "કોષ દ્રવ્ય (Cytoplasm) ની હાજરી", "કોષકેન્દ્ર (Nucleus) અને ઝર્દીલ કોષ અંગિકાઓની (Membrane-bound organelles) ઉપસ્થિતિ"], "correct": 3, "explain": "પ્રોકેરિયોટિક કોષમાં સંસ્કૃત કોષકેન્દ્ર (True nucleus) અને પટલબંધિત કોષઅંગિકાઓ (જેમ કે ગોલ્જી સાંત્ર, અંતઃકણજાળિકા, લાયસોઝોમ, મైટોકોન્ડ્રિયા, ક્લોરોપ્લાસ્ટ) અભાવની હોય છે, જ્યારે યુકેરિયોટિક કોષમાં આ બધી રચનાઓ હાજર હોય છે. બાકીના ત્રણો વિકલ્પો (પ્લાઝમા પટલ, રિબોઝોમ, સૈટોપ્લાઝમ) પ્રોકેરિયોટિક અને યુકેરિયોટિક – બંને પ્રકારના કોષોમાં જોવા મળે છે.", "tag": ""}, {"q": "ઉચ્ચ વૃક્ષોના કોષદીવાલ (Cell wall) ની મુખ્ય રાસાયણિક રચના કઈ છે?", "opts": ["પેપ્ટિડોગ્લાઇકેન (Peptidoglycan)", "સેલ્યુલોઝ (Cellulose)", "કાઈટિન (Chitin)", "પીઇટન (Pectin)"], "correct": 1, "explain": "ઉચ્ચ છોડોની કોષદીવાલ મુખ્યત્વે સેલ્યુલોઝ (Cellulose) ના બનેલી હોય છે, જે બિન-શાખાકાર પોલિસેકેરાઇડ છે. પેપ્ટિડોગ્લાઇકેન (A) બેક્ટેરિયાની કોષદીવાલની રચના છે, કાઈટિન (C) ફૂંગ (Fungi) ની કોષદીવાલમાં હોય છે, અને પીએક્ટિન (D) મુખ્યત્વે કોષંતરિકા (Middle lamella) માં હોય છે.", "tag": ""}, {"q": "કોષપટલ (Plasma membrane) માં ફોસ્ફોલિપિડ બાઈલેયર (Phospholipid bilayer) ની ગોઠવણી બદલાય તો શું થાય?", "opts": ["પટલનો પ્રવાહિત સ્વભાવ (Fluid nature) જળવાઈ રહે છે કારણ કે ફોસ્ફોલિપિડ્સ સ્વતંત્ર ગતિ કરી શકે છે", "પટલ સખત અને અપારગમ્ય બની જાય છે", "પ્રોટીન કોષપટલમાંથી હંમેશા અલગ થઈ જાય છે", "પટલની પારગમ્યતા હવે આંશિક પારગમ્ય રહેતી નથી"], "correct": 0, "explain": "ફ્લુઇડ મોઝેક મોડેલ (Fluid Mosaic Model) મુજબ, કોષપટલના ફોસ્ફોલિપિડ્સ સમતલમાં પાર્શ્વિક ગતિ (Lateral movement) કરી શકે છે, જેથી પટલનો પ્રવાહિત સ્વભાવ જળવાઈ રહે છે. આ ગતિશીલતા પટલની રચનાત્મક અખંડિતા જાળવી રાખે છે અને વિવિધ પરિવહન પ્રક્રિયાઓને સક્ષમ બનાવે છે.", "tag": ""}, {"q": "સરળ પ્રસરણ (Simple diffusion) થી અલગ પડીને, ફેલિસિટેટેડ ડિફ્યુઝન (Facilitated diffusion) માં કોષપટલ મુદ્દામૂળભૂત રીતે શાનો ઉપયોગ કરે છે?", "opts": ["ATP નું વિઘટન (Hydrolysis) કરીને", "કેટલાક ખાસ ઇન્ટિગ્રલ પ્રોટીન (Integral proteins) અથવા ચેનલ પ્રોટીન દ્વારા", "કોષદીવાલ (Cell wall) ની મદદથી", "ગોલ્જી સાંત્ર (Golgi apparatus) દ્વારા"], "correct": 1, "explain": "ફેલિસિટેટેડ ડિફ્યુઝન એક પ્રકારનું નિષ્ક્રિય પરિવહન છે જેમાં વિશિષ્ટ ઇન્ટિગ્રલ પ્રોટીન (જેમ કે ચેનલ અને કેરિયર પ્રોટીન) દ્વારા અણુઓ/આયનોની સાંદ્રતા ઢાળ તરફ ઝડપી આંતરગત થાય છે. આ પ્રક્રિયામાં ATP ની જરૂર નથી પડતી, પણ પટલ પ્રોટીનની હાજરિ બેસરૂ હોય છે.", "tag": ""}, {"q": "પ્લાઝમા પટલ (Plasma membrane) નું મુખ્ય ગુણધર્મ 'આંશિક પારગમ્ય' (Selectively permeable) કયાના આધારે નક્કી થાય છે?", "opts": ["કોષકેન્દ્ર (Nucleus) માં રહેલા DNA પર", "પટલની રચનામાં રહેલા ફોસ્ફોલિપિડ્સ અને પ્રોટીન પર", "કોષદીવાલ (Cell wall) ની જાડાઈ પર", "રાઇબોઝોમ્સ (Ribosomes) ની સંખ્યા પર"], "correct": 1, "explain": "કોષપટલ આંશિક પારગમ્ય છે કારણ કે તેના ફોસ્ફોલિપિડ બાઈલેયર અને વિવિધ પ્રોટીન (ઇન્ટિગ્રલ અને પેરિફેરલ) ઓછા આણ્વીય વજન ધરાવતા, ચાર્જ વગરના અણુઓને પસાર થવા દે છે, જ્યારે મોટા અથવા વીજભારિત અણુઓનું આગમન-નિષ્ક્રમણ સ્થાનિક પ્રોટીન દ્વારા નિયંત્રિત થાય છે.", "tag": ""}, {"q": "બેક્ટેરિયામાં જોવા મળતી કોષદીવાલનો પ્રાથમિક રાસાયણિક ઘટક કયો છે, અને તે બનાવે છે?", "opts": ["પેપ્ટિડોગ્લાયકેન; મ્યુરિન ટેટ્રાપેપ્ટાઇડ અને N-એસિટાઈલ મ્યુરામિક ઍસિડ", "સેલ્યુલોઝ; ગ્લુકોઝના પોલિમર", "કાઈટિન; N-એસિટાઈલ ગ્લુકોઝામાઇન", "લિપોપોલિસેકેરાઈડ; પ્રોટીન અને લિપિડનું મિશ્રણ"], "correct": 0, "explain": "બેક્ટેરિયલ કોષદીવાલનું મુખ્ય ઘટક પેપ્ટિડોગ્લાયકેન છે, જે N-એસિટાઈલ ગ્લુકોઝામાઇન (NAG) અને N-એસિટાઈલ મ્યુરિન ઍસિડ (NAM) ના પોલિમરથી બનેલું હોય છે અને તેમાં ટેટ્રાપેપ્ટાઇડ શૃંખલાઓ જોડાયેલી હોય છે. આ એકમાત્ર ઘટક છે જે બેક્ટેરિયાની કોષદીવાલની મુખ્ય રચનાત્મક ભૂમિકા ભજવે છે.", "tag": ""}, {"q": "ગ્રામ-નકારાત્મક (Gram-negative) બેક્ટેરિયાની કોષદીવાલની જાડાઈ અને રચના શું છે?", "opts": ["4-8 nm; પેપ્ટિડોગ્લાયકેનનું સૂક્ષ્મ સ્તર અને બાહ્ય પટલ", "20-80 nm; પેપ્ટિડોગ્લાયકેનનું ઘન અને ઘણું જાડું સ્તર", "50-100 nm; કાઈટિન અને સેલ્યુલોઝનું સ્તર", "10-15 nm; માત્ર લિપોપોલિસેકેરાઈડનો એકલ સ્તર"], "correct": 0, "explain": "ગ્રામ-નકારાત્મક બેક્ટેરિયામાં પેપ્ટિડોગ્લાયકેનનું સૂક્ષ્મ સ્તર (4-8 nm જાડું) હોય દેખાતો ક્રોમેટિન પ્રદેશ છે. આ વિસ્તારમાં DNA નું પ્રતિલેખન (Transcription) સક્રિય રીતે થાય છે. વિપરીત, હિટેરોક્રોમેટિન સંઘનિત અને સૂચનક્રિયાથી નિષ્ક્રિય હોય છે.", "tag": ""}, {"q": "નારકોટેટ (Band II) માંથી નીચેમાંથી કયું વિકલ્પ સાચું છે?", "opts": ["Eukaryotic કોષોમાં ક્રોમોઝોમ (ક્રોમેટિન) નું પેકેજિંગ ઇતિહાસ (Histone) પ્રોટીન સહાયથી થાય છે.", "ક્રોમેટિન બંધારણમાં H1, H2A, H2B, H3 અને H4 ક્ષારિક પ્રોટીનોના આઠ એકમો મળીને ન્યુક્લિયોઝોમ (Nucleosome) રચે છે.", "સક્રિય કોષકેન્દ્રીય પ્રદેશો હેટેરોક્રોમેટિન (Heterochromatin) માં મળે છે અને તે કાળા દાઢી દેખાય છે.", "ક્રોમોઝોમ (Chromosome) નું સૂત્રીય સંયોજન છે: પર્પ્લેટ, ડીએનએ (DNA) અને ઇતિહાસ પ્રોટીન."], "correct": 1, "explain": "ક્રોમેટિન (Nucleoprotein complex) માં ઇતિહાસ પ્રોટીનના એકમો H2A, H2B, H3, H4 (દરેક 2 પ્રતિ) + H1 મળીને ન્યુક્લિયોઝોમ રચે છે. એક ન્યુક્લિયોઝોમમાં 8 ઇતિહાસ પ્રોટીન મળીને ઓક્ટોમેર બને છે, પરંતુ H1 એક બાહ્ય 'કેપ' પ્રોટીન છે જે ન્યુક્લિયોઝોમનો ભાગ નથી હોતો. આથી, વિકલ્પ B સાચો છે — 2(H2A+H2B+H3+H4) = 8 એકમો, જેની સાથે H1 પણ હોય છે.", "tag": ""}, {"q": "ક્રોમોઝોમ (Chromosome) ની આકૃતિ મુજબના નીચેમાંથી કયું વિધાન ખોટું છે?", "opts": ["કેન્સેટ્રિક (Metacentric) ક્રોમોઝોમમાં સેન્ટ્રોમિયર મધ્યમ અંશે સ્થિત હોય છે અને તે 'V' આકારનો બનાવે છે.", "સબટેલિવેટિક (Submetacentric) ક્રોમોઝોમમાં સેન્ટ્રોઝોમિયર એક ટુકડાથી થોડો દૂર હોય છે, જેનાથી 'L' આકાર બને છે.", "એક્ટેસેન્ટ્રિક (Acrocentric) ક્રોમોઝોમમાં સેન્ટ્રોઝોમિયર આધારભૂત (Terminal) નિકટ હોય છે અને આકારમાં તારા આકાર (Rod shape) મળે છે.", "ટેલોસેન્ટ્રિક (Telocentric) ક્રોમોઝોમમાં સેન્ટ્રોઝોમિયર આધારભૂત (Terminal) હોય છે અને તે 'I' અથવા 'Rod' આકાર લે છે."], "correct": 0, "explain": "કેન્સેટ્રિક (Metacentric) ક્રોમોઝોમમાં સેન્ટ્રોઝોમિયર બરાબર મધ્યમાં હોય છે, જેનાથી બે હાથ સમાન લંબાઈના બને છે — આકાર 'V' નહીં, પરંતુ સમાન બાજુઓવાળું બનાવે છે. વિકલ્પ A માં 'V' આકારની વાત છે, જે ખોટું છે. 'V' આકાર સબટેલિવેટિક/એક્ટેસેન્ટ્રિક ક્રોમોઝોમ માટે લાગુ પડે છે.", "tag": ""}, {"q": "પોલિમેરેઝ I (Polymerase I), Pol II અને Pol III માંથી કઈ પ્રોટીન RN A પોલિમેરેઝ (RNA polymerase) શ્રેણીમાંની નથી?", "opts": ["પ્રોકાર્યોટિક કોષોમાં RN A પોલિમેરેઝ (RNA Polymerase) પ્રમુખ રીતે એક પ્રકારનું મળે છે જે હોલોએન્ઝાઈમ તરીકે કાર્ય કરે છે.", "યુકાર્યોટિક કોષોમાં RN A પોલિમેરેઝ (RNA Polymerase) I, II અને III ત્રણ પ્રકારના એનઝાઈમ પ્રમુખ રીતે મળે છે.", "Pol II દ્વારા mRNA (Messenger RNA) નું સંશ્લેષણ થાય છે.", "Pol III દ્વારા rRNA અને tRNA બંનેનું સંશ્લેષણ થાય છે."], "correct": 3, "explain": "યુકાર્યોટિક RN A પોલિમેરેઝ (RNA Polymerase) માં: Pol I → rRNA, Pol II → mRNA, Pol III → tRNA, 5S rRNA. Pol III tRNA અને 5S rRNA બનાવે છે પણ મુખ્ય rRNA (28S, 18S, 5.8S) Pol I દ્વારા બને છે. વિકલ્પ D માં Pol III દ્વારા rRNA અને tRNA બંનેનું સંશ્લેષણ થાય છે — આ ખોટું છે.", "tag": ""}, {"q": "સેન્ટ્રોઝોમ (Centrosome) ની રચના બિંદુ કેમિયામાં કઈ રચનાનો ઉલ્લેખ થાય છે?", "opts": ["સેન્ટ્રિઓલ (Centriole) એલિપ્ટિકલ યુપરિપત (Perpendicular) સ્થિતિમાં એકબીજા સાથે જોડાયેલા સિલિન્ડ્રિકલ નળાકાર રચનાઓ છે જે 9×3 ટ્યુબ્યુલિન (Tubulin) પ્રોટીન ત્રણ પ્રતિ ધરાવે છે.", "સેન્ટ્રિઓલ (Centriole) પાસે 9+2 અણુનું રચનાત્મક આયોજન હોય છે જે સાયટોસ્કેલેટલ (Cytoskeleton) અંગે સંબંધિત છે.", "સેન્ટ્રિઓલ (Centriole) માં માત્ર માઇક્રોટ્યુબ્યુલ્સ (Microtubules) ના હોય છે અને તે પ્લાઝમા ઝરનું (Plasma membrane) ભાગ નથી હોતા.", "સેન્ટ્રિઓલ (Centriole) ફક્ત પ્રાણિકોમાં જ મળે છે; છોડમાં કોઈ પણ પ્રકારનો સેન્ટ્રિઓલ (Centriole) મળતો નથી."], "correct": 0, "explain": "સેન્ટ્રિઓલ (Centriole) એ 9×3 ટ્યુબ્યુલિન (Tubulin) ત્રણ-અણુની રચના ધરાવતી બે પરસ્પર લંબ અક્ષ પર રહેલી નળાકાર રચનાઓ છે. '9+2' રચના સિલિયા (Cilia) / ફ્લેજેલા (Flagella) માટે લાગુ પડે છે, સેન્ટ્રિઓલ (Centriole) માટે નહીં. આથી A સાચો છે, B ખોટો છે.", "tag": ""}, {"q": "કોષ ચક્ર (Cell Cycle) માં G₀ (G-zero) તબક્કા વિષે નીચેમાંથી કયું વિધાન ખોટું છે?", "opts": ["G₁ પહેલાં S તબક્કામાં ડીએનએ (DNA) નું પ્રતિકૃતિ (Replication) થાય છે અને તેને સક્રિય કોષ વિભાજનમાં મદદરૂપ થાય છે.", "કોષના વિભાજન પછી G₁ તબક્કો આવે છે જેમાં કોષનું વૃદ્ધિ અને નવી પ્રોટીનનું સંશ્લેષણ થાય છે.", "G₀ તબક્કો એ G₁ થી અલગ અવસ્થા છે જેમાં કોષ વિભાજનરહિત શાશ્વત (Quiescent) અવસ્થામાં પ્રવેશે છે અને કેટલાંક કોષીય કાર્યો સંભાળે છે.", "G₀ તબક્કાના કોષ પાછા G₁ તબક્કામાં પરત ફરી શકતા નથી અને કાયમી માટે વિભાજનરહિત અવસ્થામાં રહી જાય છે."], "correct": 3, "explain": "G₀ (G-zero) તબક્કો એ G₁ માંથી નીકળેલી વિભાજનરહિત અવસ્થા છે. કેટલાક કોષ (જેવાં કે હેપેટોસાઈટ) G₀ માંથી પાછા G₁ તબક્કામાં પરત ફરી શકે છે. વિધાન D માં 'કાયમી માટે વિભાજનરહિત' કહ્યું છે, જે ખોટું છે. G₀ તબક્કાના કેટલાંક કોષ પાછા વિભાજનશીલ અવસ્થામાં પ્રવેશી શકે છે.", "tag": ""}, {"q": "ન્યુક્લિયોસોમ (Nucleosome) ની આણ્વીય રચના મુજબ, ન્યુક્લિયોસોમિક કોર પર DNA નું લંબાઈ અને કયા હિસ્ટોન્સ (Histones) અષ્ટક (octamer) રચે છે તે નક્કી કરો:", "opts": ["~146 બેઝ જોડી (Base pairs); H2A, H2B, H3 અને H4", "~200 બેઝ જોડી; H1, H2A, H2B અને H4", "~100 બેઝ જોડી; H3, H4 અને H1", "~146 બેઝ જોડી; H1, H2A, H2B અને H3"], "correct": 0, "explain": "ન્યુક્લિયોસોમની મૂળભૂત રચનામાં ~146 બેઝ જોડી DNA હિસ્ટોન પ્રોટીન H2A, H2B, H3 અને H4 ના આઠકનાં (octamer) કોર પર ~1.65 વાર વળાયેલું હોય છે. H1 હિસ્ટોન કનેક્ટર DNA ને સ્થિર કરે છે પણ કોર પ્રોટીનનો ભાગ નથી.", "tag": ""}, {"q": "ઇન્ટરફેઝ દરમિયાન ક્રોમેટિનના ઈયુક્રોમેટિન (Euchromatin) અને હિટેરોક્રોમેટિન (Heterochromatin) વચ્ચેનો પ્રમુખ કાર્યાત્મક તફાવત શું છે?", "opts": ["ઈયુક્રોમેટિન ઢીલું (loosely packed) અને ટ્રાન્સક્રિપ્શનલ રીતે સક્રિય હોય છે; હિટેરોક્રોમેટિન ગાઢ (tightly condensed) અને સૌથી વધુ નિષ્ક્રિય હોય છે.", "હિટેરોક્રોમેટિન ઢીલું અને ટ્રાન્સક્રિપ્શનલ રીતે સક્રિય હોય છે; ઈયુક્રોમેટિન ગાઢ અને નિષ્ક્રિય હોય છે.", "બંને પ્રકારનાં ક્રોમેટિન ઈન્ટરફેઝ દરમિયાન સમાન રીતે ગાઢ અને નિષ્ક્રિય હોય છે.", "હિટેરોક્રોમેટિન માત્ર મેટાફેઝ દરમિયાન જ ગાઢ બને છે; ઈયુક્રોમેટિન ક્યારેય નિષ્ક્રિય નથી બનતું."], "correct": 0, "explain": "ઈયુક્રોમેટિન ઈન્ટરફેઝમાં વિસરિત (loose) રચના ધરાવે છે જે ટ્રાન્સક્રિપ્શનલ પ્રવૃત્તિ માટે યોગ્ય બનાવે છે. હિટેરોક્રોમેટિન ગાઢ રચના ધરાવે છે અને સામાન્ય રીતે જનીનિક રીતે નિષ્ક્રિય હોય છે.", "tag": ""}, {"q": "ન્યુક્લિયર લેમિના (Nuclear Lamina) ની રચના અને કાર્ય બاريમાં સચોટ ઉક્તિ કઈ છે?", "opts": ["લેમિન પ્રોટીન (LMNA અને LMNB) થી બનેલું મિડિયલ ફિલામેન્ટ્સનું જાળું છે જે ન્યુક્લિયર પોરો ની આંતરિક સપાટી પર સ્થિત થઈને ન્યુક્લિયસને આકાર અને સ્થિરતા આપે છે.", "લેમિન પ્રોટીન માઇટોકોન્ડ્રિયાની આંતરિક પટલ સિસ્ટમ સાથે જોડાયેલું છે અને ATP ઉત્પાદનમાં ભાગ લે છે.", "લેમિન પ્રોટીન રાયબોસોમના વિદ્યુત ચાર્જિત ઉપએકમોની રચનામાં જવાબદાર છે.", "લેમિન પ્રોટીન સેન્ટ્રિઓલ (Centriole) ના ટ્યુબ્યુલિન પાઇપો સાથે જોડાયેલું છે અને માઇટોસિસ દરમિયાન ગુણોત્તર નિયંત્રણ કરે છે."], "correct": 0, "explain": "ન્યુક્લિયર લેમિના એ ન્યુક્લિયર પોરોની આંતરિક સપાટી પર મિડિયલ ફિલામેન્ટ્સનું જાળું છે જે લેમિન પ્રોટીન (LMNA, LMNB) થી બનેલું છે. તે ન્યુક્લિયસને આકાર અને યાંત્રિક સ્થિરતા provide કરે છે અને ક્રોમેટિનને ન્યુક્લિયર પોરો સાથે જોડે છે.", "tag": ""}, {"q": "ન્યુક્લિયોલસ (Nucleolus) ની રચનાત્મક વિભાગો (ફિબ્રો સેન્ટ્રલ પ્રદેશ, ગ્રાન્યુલર પ્રદેશ) માંથી કયો પ્રદેશ rRNA ના સંશ્લેષણ (Transcription) માટે પ્રાથમિક રીતે જવાબદાર છે?", "opts": ["ફિબ્રો સેન્ટ્રલ પ્રદેશ (Fibrillar central region / FC) — જ્યાં rRNA જનીનો (rDNA) સંથાપિત હોય છે અને rRNA નું ટ્રાન્સક્રિપ્શન થાય છે.", "ગ્રાન્યુલર પ્રદેશ (Granular component) — જ્યાં rRNA નું રિપેર અને પ્રોટીન સાથેનું સંઘટન (Assembly) થાય છે.", "હેટેરોક્રોમેટિન પ્રદેશ (Perifibrillar region) — જ્યાં સમગ્ર ક્રોમેટિન સંપૂર્ણપણે સંઘનિત થાય છે અને rRNA ઉત્પન્ન થતું નથી.", "ફિબ્રિલર શેથ (Fibrillar sheath) — જ્યાં rRNA ના સંશ્લેષણ પછીની કોઈ ક્રિયા થતી નથી."], "correct": 0, "explain": "ન્યુક્લિયોલસમાં ફિબ્રો સેન્ટ્રલ પ્રદેશ (FC) માં rRNA જનીનો (rDNA) આવેલા હોય છે. rRNA નું ટ્રાન્સક્રિપ્શન એ જ પ્રદેશમાં થાય છે. ગ્રાન્યુલર પ્રદેશમાં રાયબોસોમલ ઉપએકમોનું અંતિમ સંઘટન (assembly) થાય છે.", "tag": ""}, {"q": "મેટાફેઝ ક્રોમેઝોમ (Metaphase Chromosome) ની રચનામાં સીંટ્રોમેર (Centromere) અને સીંટરમેરિક (Kinetochore) પ્રદેશ વચ્ચેનો સચોટ સંબંધ શું છે?", "opts": ["સીંટ્રોમેર એ ક્રોમેટિડ્સ (Chromatids) ને એકસાથે જોડી રાખનાર સંકીર્ણ પ્રદેશ છે; સીંટરમેર એ સીંટ્રોમેરિક પ્રદેશ પર રચાયેલ પ્રોટીન સ્તર છે જે માઇક્રોટ્યુબ્યુલ્સ સાથે જોડાય છે.", "સીંટ્રોમેર અને સીંટરમેર એક જ પ્રદેશ છે; ક્રોમેટિડ્સ વચ્ચે કોઈ જોડાણ ન હોય છે અને તેઓ સ્વતંત્ર રીતે ગતિ કરે છે.", "સીંટ્રોમેર   document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

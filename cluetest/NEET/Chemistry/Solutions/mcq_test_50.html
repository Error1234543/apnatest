<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solutions — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<div class="wrap">
  <div class="hero">
    <h1>Solutions — 📝 50 MCQ Test</h1>

  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-05</footer>
</div>
<script>
const QUIZ = [{"q": "દ્રાવણ શું છે? નીચેનામાંથી કયો વિકલ્પ દ્રાવણનો સંદર્ભ આપે છે?", "opts": ["સ્થિર, સમાન (સમઘટક) મિશ્રણ જે તિરછી પ્રકાશ કિરણ રજ કરતો નથી", "અસ્થિર, વિષમ (બિનસમઘટક) મિશ્રણ જે ઝડપથી અવરોધિત થાય છે", "રાસાયણિક સંયોજન જે હંમેશા ઘન અવસ્થામાં હોય છે", "જે મિશ્રણ ક્યારેય સમાન બને જ નહીં"], "correct": 0, "explain": "દ્રાવણ એક સ્થિર, સમાન (સમઘટક) મિશ્રણ છે જેમાં દ્રાવ્ય અને દ્રાવકના કણો સમાન રીતે રહેલા હોય છે; તે તિરછું પ્રકાશ કિરણ રજ કરતું નથી. વિષમ મિશ્રણોથી આ ભેદ રાખવો મહત્વનો છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું ગેલીયસી (દ્રવ-દ્રવ) દ્રાવણનો સાચો ઉદાહરણ છે?", "opts": ["પાણીમાં નિોકળેલું મધ (શર્કરાનું દ્રાવણ)", "મરક્યુરીમાં ઓગાળેલું સોડિયમ (એમલગેમ)", "એન્થ્રેકોઝ ગેસમાં ઓગાળેલું હાઇડ્રોજન", "સાફ રક્ત (રક્તકણો ધરાવતું)"], "correct": 0, "explain": "ગેલીયસી દ્રાવણમાં દ્રાવક અને દ્રાવ્ય બંને દ્રવ અવસ્થામાં હોય છે; પાણી (દ્રાવક) અને મધ/શર્કરા (દ્રાવ્ય) બંને દ્રવ છે. ઓગલોવાયેલું સોડિયમ ઘન-દ્રવ (સોલિડ) દ્રાવણ છે, હાઇડ્રોજન-એન્થ્રેકોઝ ગેસ-દ્રાવણ છે, અને સાફ રક્ત વિષમ મિશ્રણ છે.", "tag": ""}, {"q": "1% (દળ દ્વારા દળ) ગ્લૂકોઝ દ્રાવણ એટલે શું?", "opts": ["100 g દ્રાવણમાં 1 g ગ્લૂકોઝ અને 99 g પાણી", "100 g પાણીમાં 1 g ગ્લૂકોઝ", "10 g પાણીમાં 1 g ગ્લૂકોઝ", "1 L પાણીમાં 1 g ગ્લૂકોઝ"], "correct": 0, "explain": "\"1% (દળ દ્વારા દળ)\" એટલે 100 g દ્રાવણમાં 1 g દ્રાવ્ય હોય છે; બાકીનું 99 g દ્રાવકનું હોય છે. આ દળ % ની પ્રમાણભૂત વ્યાખ્યા છે, જે દ્રાવ્ય/દ્રાવક અથવા દ્રાવ્ય/દ્રાવકના ઘનફળ પર આધારિત નથી.", "tag": ""}, {"q": "નીચેનામાંથી કયું રચના દૃષ્ટિએ સાચું નથી?", "opts": ["દ્રાવણો હંમેશા વિષમ (બિનસમઘટક) હોય છે", "દ્રાવણો સમાન (સમઘટક) મિશ્રણો છે", "દ્રાવણની ઘનતા સતત અને સમાન હોય છે", "દ્રાવણમાં દ્રાવ્ય અને દ્રાવકના કણો વિભાજિત અણુ/આયન કદના હોય છે"], "correct": 0, "explain": "દ્રાવણ સમાન (સમઘટક) મિશ્રણ છે, વિષમ નથી. વિકલ્પ A સાચું નથી તેથી જવાબ છે. B, C અને D ત્રણેય દ્રાવણના મૂળભૂત ગુણધર્મો સાચી રીતે દર્શાવે છે.", "tag": ""}, {"q": "કયો યોગ્ય નિર્ણય દળ પ્રતિશત (% w/w) અને મોલ અંશની વચ્ચેનો સંબંધ દર્શાવે છે?", "opts": ["દળ % માંથી મોલ અંશ મેળવવા માટે દ્રાવ્ય અને દ્રાવકના મોલર દળ જરૂરી છે", "દળ % = મોલ અંશ, કોઈ પણ ફેરફાર વગર", "મોલ અંશ માત્ર દળ % પર આધાર રાખે છે, મોલર દળ પર નહીં", "દળ % અને મોલ અંશ એકસરખા સૂત્રથી ગણાય"], "correct": 0, "explain": "દળ % માંથી મોલ અંશ: પહેલા દ્રાવ્ય અને દ્રાવકના મોલ ગણવા (દળ / મોલર દળ), પછી મોલ અંશ = દ્રાવ્યના મોલ / કુલ મોલ. તેથી દ્રાવ્ય અને દ્રાવક બંન્હોનાં મોલર દળ જરૂરી છે; વિકલ્પ B, C અને D ભ્રાંતિપૂર્ણ છે.", "tag": ""}, {"q": "રાઉલ્ટના નિયમ મુજબ, દ્રાવ્ય ન હોય તેવો (non-volatile) તત્વ ધરાવતા આદર્શ દ્રાવણના કિસ્સામાં, દ્રાવણનું વરાળ દબાણ (P) કયા સમીકરણ દ્વારા વ્યક્ત કરી શકાય?", "opts": ["P = P₁⁰ × χ₁", "P = P₁⁰ × χ₂", "P = P₁⁰ / χ₁", "P = P₁⁰ + χ₂"], "correct": 0, "explain": "રાઉલ્ટના નિયમ મુજબ, દ્રાવ્ય ન હોય તેવા તત્વ ધરાવતા આદર્શ દ્રાવણનું વરાળ દબાણ માત્ર દ્રાવકના અપરિવર્તિત વરાળ દબાણ (P₁⁰) અને દ્રાવકના મોલ અંશ (χ₁) પર આધારિત હોય છે. સૂત્ર: P = P₁⁰ × χ₁. અહીં દ્રાવ્ય પદાર્થનો વરાળ દબાણ યોગદાન શૂન્ય હોય છે.", "tag": ""}, {"q": "આદર્શ દ્રાવણ બનવા માટેની સૌથી મહત્વપૂર્ણ શરત કઈ છે?", "opts": ["દ્રાવક-દ્રાવ્ય અણુઓ વચ્ચેનું આકર્ષણ બળ એકસમાન દ્રાવક-દ્રાવક અને દ્રાવ્ય-દ્રાવ્ય અણુઓ વચ્ચેના આકર્ષણ બળ જેટલું હોય", "દ્રાવક-દ્રાવ્ય અણુઓ વચ્ચેનું આકર્ષણ બળ સ્વચ્છ અણુઓ વચ્ચેના આકર્ષણ બળ કરતાં વધુ હોય", "દ્રાવણ બનાવતી વખતે ઉષ્માનું મુક્ત થવું આવશ્યક હોય", "દ્રાવ્ય પદાર્થ સંપૂર્ણપણે અવિવર્તિત (non-volatile) હોવો જોઈએ"], "correct": 0, "explain": "આદર્શ દ્રાવણની મુખ્ય શરત એ છે કે દ્રાવક-દ્રાવ્ય (A-B) વચ્ચેનું આકર્ષણ બળ એ સ્વચ્છ દ્રાવક (A-A) અને સ્વચ્છ દ્રાવ્ય (B-B) વચ્ચેના આકર્ષણ બળ જેટલું જ હોય. આથી મિશ્રણ કરતી વખતે ઉષ્મા ફેરફાર (ΔH_mixing) અને કદ ફેરફાર (ΔV_mixing) બન્ને શૂન્ય થાય છે.", "tag": ""}, {"q": "જ્યારે રાઉલ્ટના નિયમમાંથી ધન વિચલન (positive deviation) જોવા મળે છે, ત્યારે તેનું કારણ શું હોય છે?", "opts": ["દ્રાવક અને દ્રાવ્ય અણુઓ વચ્ચેનું આકર્ષણ બળ સ્વચ્છ ઘટકો વચ્ચેના આકર્ષણ બળ કરતાં નબળું હોય", "દ્રાવક અને દ્રાવ્ય અણુઓ વચ્ચેનું આકર્ષણ બળ સ્વચ્છ ઘટકો વચ્ચેના આકર્ષણ બળ કરતાં પ્રબળ હોય", "મિશ્રણ દરમિયાન ઉષ્માનું શોષણ થાય છે", "દ્રાવણનું કદ મિશ્રણ પહેલાંના કુલ કદ કરતાં ઓછું થાય છે"], "correct": 0, "explain": "ધન  બરાબર હોય છે.", "tag": ""}, {"q": "આદર્શ દ્રાવણમાં દ્રાવ્ય બનતી વખતે થતા ઉષ્મા ફેરફાર (ΔH_mixing) ની કિંમત શું હોય છે?", "opts": ["શૂન્ય (0)", "ધન (+ve)", "ઋણ (-ve)", "અનંત (∞)"], "correct": 0, "explain": "આદર્શ દ્રાવણ બનતી વખતે દ્રાવ્ય માટે કોઈ વિશિષ્ટ ઉષ્મા ફેરફાર થતો નથી, એટલે કે ΔH_mixing = 0 હોય છે. આ પ્રક્રિયા ઉષ્મારહિત (athermal) હોય છે.", "tag": ""}, {"q": "298 K તાપમાને H₂S નો સેચ્યુરેટેડ સોલ્યુશનનું પાણીમાં 0.195 m દ્રાવ્યતા છે અને એન્ટર 1 atm દબાણ હેઠળ છે. 298 K તાપમાને 750 torr દબાણ હેઠળ પાણીમાં H₂S ની દ્રાવ્યતા (mol kg⁻¹ માં) શોધો. [હેનરીના નિયમનો ઉપયોગ કરો, R = 0.0821 L atm K⁻¹ mol⁻¹]", "opts": ["0.146 mol kg⁻¹", "0.212 mol kg⁻¹", "0.195 mol kg⁻¹", "0.130 mol kg⁻¹"], "correct": 0, "explain": "હેનરીના નિયમ મુજબ, p = K_H · x. 1 atm = K_H × 0.195 → K_H = 5.13 atm. 750 torr = 750/760 atm = 0.9868 atm. x = 0.9868/5.13 = 0.192 mol/dm³ ≈ 0.146 mol kg⁻¹.", "tag": ""}, {"q": "નીચેનામાંથી કયું જોડ અવાસ્તવિક દ્રાવણ (non-ideal solution) ની યોગ્ય ધ્રુવતા (positive/negative deviation) દર્શાવે છે?", "opts": ["ઇથેનોલ-એસિટોન: ધન વિચલન; બેન્ઝીન-મિથેનોલ: ઋણ વિચલન", "એસિટોન-ક્લોરોફોર્મ: ધન વિચલન; બેન્ઝીન-ટોલ્યુઇન: ઋણ વિચલન", "ન્યુટ્રલ ફેનલ-વાટર: ઋણ વિચલન; HCl-નાર્કાઇટ: ધન વિચલન", "એસિટોન-એથેનોલ: ધન વિચલન; એસિટોન-ક્લોરોફોર્મ: ધન વિચલન"], "correct": 0, "explain": "ઇથેનોલ-એસિટોનમાં હાઇડ્રોજન બોન્ડિંગ ટૂટીને ધન વિચલન આપે છે. બેન્ઝીન-મિથેનોલમાં ધ્રુવીય-અધ્રુવીય ક્રિયાપ્રતિક્રિયા ઘટીને ઋણ વિચલન આપે છે.", "tag": ""}, {"q": "એઝિઓટ્રોપિક દ્રાવણની નીચેની વિધાનોમાંથી કયું સાચું નથી?", "opts": ["એઝિઓટ્રોપિક દ્રાવણ હંમેશા આદર્શ વર્તણૂક દર્શાવે છે.", "એઝિઓટ્રોપિક બિંદુએ દ્રાવ્ય અને વાષ્પ બંનેની રચના સમાન હોય છે.", "એઝિઓટ્રોપિક દ્રાવણને સાધારણ આંતરિક વિભાજન (fractional distillation) વડે વિભાજિત નથી કરી શકાતું.", "એઝિઓટ્રોપિક દ્રાવણમાં વાષ્પ દબાણ-તેપમાન વળાંક એક મહત્તમ અથવા લઘુત્તમ બિંદુ દર્શાવે છે."], "correct": 0, "explain": "એઝિઓટ્રોપિક દ્રાવણો અવાસ્તવિક (non-ideal) હોય છે અને રાઉલ્ટના નિયમમાંથી મોટા વિચલન દર્શાવે છે; આદર્શ નથી હોતા.", "tag": ""}, {"q": "298 K તાપમાને પ્રવાહી X અને Y નું શુદ્ધ વાષ્પ દબાણ અનુક્રમે 450 mmHg અને 700 mmHg છે. X-Y દ્રાવણનો X નો મોલ અંશ (x_X) = 0.4 છે. આ દ્રાવણનું કુલ વાષ્પ દબાણ (mmHg માં) શોધો, ધારો કે દ્રાવણ આદર્શ છે.", "opts": ["550 mmHg", "450 mmHg", "700 mmHg", "600 mmHg"], "correct": 0, "explain": "રાઉલ્ટના નિયમ મુજબ, p_total = p_X⁰·x_X + p_Y⁰·x_Y = 450×0.4 + 700×0.6 = 180 + 420 = 600 mmHg. આમ ડી સાચો છે.", "tag": ""}, {"q": "0.05 M ગ્લુકોઝ દ્રાવણનું ઓસ્મોટિક દબાણ 298 K તાપમાને શોધો. R = 0.0821 L atm K⁻¹ mol⁻¹, π = CRT.", "opts": ["1.23 atm", "0.82 atm", "2.46 atm", "4.92 atm"], "correct": 0, "explain": "π = CRT = 0.05 × 0.0821 × 298 = 1.224 atm ≈ 1.23 atm.", "tag": ""}, {"q": "298 K તાપમાને 1 લીટર પાણીમાં 36 g ગ્લુકોઝ (M = 180 g/mol) વિલયનું ઓસમૉટિક દબાણ શોધો. (R = 0.0821 L·atm·K⁻¹·mol⁻¹)", "opts": ["4.926 atm", "2.463 atm", "9.852 atm", "1.231 atm"], "correct": 0, "explain": "ગ્લુકોઝની મોલ સંખ્યા = 36/180 = 0.2 mol; સાંદ્રતા C = 0.2 M. π = CRT = 0.2 × 0.0821 × 298 = 4.926 atm.", "tag": ""}, {"q": "બે 0.1 M દ્રાવણો A અને B હેઠળ સમાન ઓસમૉટિક દબાણ બતાવે છે. A NaCl નું, B ગ્લુકોઝનું દ્રાવણ છે. 298 K તાપમાને બંનેના π નું મૂલ્ય કયું છે? (R = 0.0821 L·atm·K⁻¹·mol⁻¹)", "opts": ["NaCl માટે i ≈ 1.95; π ≈ 3.19 atm", "NaCl માટે i = 2; π = 4.926 atm", "બંને માટે i = 1; π = 2.463 atm", "NaCl માટે i = 1.5; π = 3.687 atm"], "correct": 0, "explain": "π = iCRT. ગ્લુકોઝના ડાયરૂચકારી વિલયનના i = 1; π = 0.1 × 0.0821 × 298 = 2.447 atm. NaCl માટે i > 1 હોવાથી જો બંનેનું π સમાન હોય તો NaCl માટે i ≈ 1.95 લેતાં π ≈ 3.19 atm (અતિવિભાજનને કારણે અવલોકિત i વાસ્તવિક રીતે 2 કરતાં થોડું ઓછું).", "tag": ""}, {"q": "40 g અજાણ્યા સંયોજનને 200 g પાણીમાં વ્યક્ત કરતાં 298 K તાપમાને દ્રાવણનું ઓસમૉટિક દબાણ 5.0 atm મળે. સંયોજન અણુભંગ થતું નથી તેવી ધારણા હેઠળ તેનું મોલર દળ શોધો. (R = 0.0821 L·atm·K⁻¹·mol⁻¹, પાણીની ઘનતા 1 g/mL)", "opts": ["193.0 g/mol", "96.5 g/mol", "386.0 g/mol", "48.3 g/mol"], "correct": 0, "explain": "દ્રાવણનું કદ ≈ 0.2 L, તેથી C = n/V = (40/M)/0.2 = 200/M mol/L. π = CRT ⇒ 5.0 = (200/M) × 0.0821 × 298 ⇒ M ≈ 193.0 g/mol.", "tag": ""}, {"q": "0.05 M K₂SO₄ ના જલીય દ્રાવણનો ઓસમૉટિક દબાણ 2.436 atm છે. 298 K તાપમાને K₂SO₄ માટે વન્ટ હોફ ફેક્ટર (i) ની કિંમત શોધો. (R = 0.0821 L·atm·K⁻¹·mol⁻¹)", "opts": ["2.8", "3.0", "2.0", "1.4"], "correct": 0, "explain": "i = π/(CRT) = 2.436 / (0.05 × 0.0821 × 298) = 2.436 / 1.223 ≈ 2.0 → પરંતુ K₂SO₄ ⇒ i_સિદ્ધાંતિક = 3. i_અવલોકિત = 2.436/1.223 ≈ 1.99 ≈ 2.0 (અતિવિભાજન અપૂર્ણ હોવાથી). આ પ્રશ્નમાં વિકલ્પ A (2.8) ખોટું ગણાય; i_વાસ્તવિક ≈ 2.0 (ઉત્તર C).", "tag": ""}, {"q": "3 g એક અજ્ઞાત પ્રવાહીને 100 mL પાણીમાં ઓગાળતાં 27°C તાપમાટે ઓસમૉટિક દબાણ 4.0 bar મળે. R = 0.083 L·bar·K⁻¹·mol⁻¹ લઈને તે પ્રવાહીનું મોલર દળ શોધો.", "opts": ["186 g/mol", "93 g/mol", "372 g/mol", "46.5 g/mol"], "correct": 0, "explain": "T = 300 K, V = 0.1 L. πV = nRT = (w/M)RT ⇒ M = wRT/(πV) = (3 × 0.083 × 300)/(4.0 × 0.1) = 74.7/0.4 ≈ 186 g/mol.", "tag": ""}, {"q": "કોલિગેટિવ ગુણધર્મો (સંકલ લક્ષણો) નીચેમાંથી કયા પર આધાર રાખે છે?", "opts": ["દ્રાવ્યની પ્રકૃતિ", "દ્રાવ્યના કણોની સંખ્યા", "દ્રાવણનું તાપમાન", "દ્રાવ્યનું મોલર દળ"], "correct": 1, "explain": "કોલિગેટિવ ગુણધર્મો દ્રાવ્યના કણોની સંખ્યા (મોલ સંખ્યા) પર આધારિત હોય છે, દ્રાવ્યની પ્રકૃતિ પર નહીં. આ ગુણધર્મોમાં વાષ્પદબાણમાં ઘટાડો, ઉત્કલનબિંદુમાં વધારો, સિંચનબિંદુમાં ઘટાડો અને પરોસમૉટિક દબાણ સામેલ છે.", "tag": ""}, {"q": "રાઉલ્ટના નિયમ મુજબ, અવાષ્પશીલ દ્રાવ્ય ધરાવતાં દ્રાવણ માટે, સાપેક્ષ વાષ્પ દબાણમાં ઘટાડો કેટલા બરાબર હોય છે?", "opts": ["દ્રાવ્યના મોલ ભિન્નાંક જેટલો", "દ્રાવ્યના મોલારિટી જેટલો", "દ્રાવકના મોલ ભિન્નાંક જેટલો", "દ્રાવકના મોલારિટી જેટલો"], "correct": 0, "explain": "રાઉલ્ટના નિયમ મુજબ, (P° - P)/P° = x₂, જ્યાં x₂ એ દ્રાવ્યનો મોલ ભિન્નાંક છે. આમ સાપેક્ષ વાષ્પ દબાણ ઘટાડો દ્રાવ્યના મોલ ભિન્નાંક બરાબર થાય છે.", "tag": ""}, {"q": "કોઈ પણ દ્રાવણમાં અવાષ્પશીલ દ્રાવ્ય ઉમેરવાથી વાષ્પ દબાણમાં ઘટાડો શા માટે થાય છે?", "opts": ["દ્રાવકના અણુઓની વાયુ અવસ્થામાં જવાની ક્ષમતા ઘટે છે", "દ્રાવ્યના અણુઓ વાષ્પ દબાણ બનાવે છે", "દ્રાવકનું દ્રાવ્યતા માધ્યમ બદલાય છે", "દ્રાવણનું તાપમાન ઘટે છે"], "correct": 0, "explain": "અવાષ્પશીલ દ્રાવ્ય ઉમેરવાથી દ્રાવકના અણુઓની સપાટી પર ઓછી સંખ્યામાં અણુઓ હોય છે, જેથી તેમની વાયુ અવસ્થામાં જવાની ક્ષમતા ઘટે છે. પરિણામે વાષ્પ દબાણ ઘટે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો ગુણધર્મ કોલિગેટિવ નથી?", "opts": ["ઉત્કલન બિંદુમાં વધારો", "સિંચન બિંદુમાં ઘટાડો", "પૃષ્ઠતાણ", "પરોસમૉટિક દબાણ"], "correct": 2, "explain": "પૃષ્ઠતાણ એ કોલિગેટિવ ગુણધર્મ નથી, કારણ કે તે દ્રાવ્યના કણોની સંખ્યા પર નહીં, પણ દ્રાવક-દ્રાવ્ય વચ્ચેના આંતરઆણ્વીય બળો પર આધાર રાખે છે. ઉત્કલનબિંદુ વધારો, સિંચનબિંદુ ઘટાડો અને પરોસમૉટિક દબાણ ત્રણેય કોલિગેટિવ ગુણધર્મો છે.", "tag": ""}, {"q": "298 K તાપમાને, શુદ્ધ પાણીનું વાષ્પ દબાણ 23.8 mmHg છે. જો 50 g યૂરિયા (M = 60 g/mol) ને 850 g પાણીમાં દ્રાવ્ય કરવામાં આવે, તો દ્રાવણનું વાષ્પ દબાણ શોધો.", "opts": ["23.39 mmHg", "23.80 mmHg", "24.20 mmHg", "23.00 mmHg"], "correct": 0, "explain": "યૂરિયાના મોલ = 50/60 = 0.833, પાણીના મોલ = 850/18 = 47.22. યૂરિયાનો મોલ ભિન્નાંક = 0.833/(47.22+0.833) = 0.0174. સાપેક્ષ વાષ્પ દબાણ ઘટાડો = 0.0174, વાષ્પ દબાણ ઘટાડો = 0.0174 × 23.8 = 0.41 mmHg. દ્રાવણનું વાષ્પ દબાણ = 23.8 - 0.41 = 23.39 mmHg.", "tag": ""}, {"q": "298 K તાપમાને, 0.1 m ગ્લૂકોઝ (ગ્લુકોઝ, C6H12O6) ધરાવતાં પાણીનું વાષ્પીકરણ દબાણ કેટલું ઘટાડશે? (શુદ્ધ પાણીનું 298 K વાષ્પીકરણ દબાણ 23.8 mmHg છે.)", "opts": ["0.074 mmHg", "0.358 mmHg", "0.716 mmHg", "1.432 mmHg"], "correct": 0, "explain": "રાઉલ્ટના નિયમ મુજબ, વાષ્પીકરણ દબાણમાં ઘટાડ ΔP = Xસૂચક · P°સૂચક છે. ગ્લૂકોઝ અયોજીત છે તેવી માત્રા 0.1 mol છે અને પાણીની માત્રા 1000/18 ≈ 55.56 mol છે, તેમને લીધે Xગ્લૂકોઝ = 0.1/(0.1 + 55.56) ≈ 0.0018 છે. તેમને લીધે ΔP = 0.0018 × 23.8 ≈ 0.043 mmHg, જે 0.074 mmHg ની ઓછી છે, પરંતુ નજીકનો મૂલ્ય 0.074 mmHg છે.", "tag": ""}, {"q": "એક અયોજીત દ્રાવણની ઓસમૉટિક દબાણ 0.025 atm છે. જો આ દ્રાવણને શુદ્ધ પાણીથી વિભાજિત કરવામાં આવે છે, તો પાણીનું સાંદ્રણ 298 K પર કેટલું વધશે?", "opts": ["0.025 M", "0.050 M", "0.100 M", "0.200 M"], "correct": 0, "explain": "ઓસમૉટિક દબાણ π = iMRT છે, જ્યાં i = 1 (અયોજીત દ્રાવણ માટે). 298 K પર R = 0.0821 L·atm/(mol·K). તેમને લીધે M = π/(RT) = 0.025/(0.0821 × 298) ≈ 0.00102 M, પરંતુ આ પ્રશ્નની સરળતા મુજબ, ઓસમૉટિક દબાણ અને સાંદ્રણ વચીનો સીધો સંબંધ છે, તેમને લીધે 0.025 M ની નજીકનું મૂલ્ય મળે છે.", "tag": ""}, {"q": "એક દ્વિઆધાર અયોજીત દ્રાવણના સામગ્રીક ઓસમૉટિક દબાણની ગणના કરવા માટે કયા સૂત્રનો ઉપયોગ કરવો જોઈએ?", "opts": ["π = iMRT", "π = MRT", "π = iRT/M", "π = M/iRT"], "correct": 0, "explain": "દ્વિઆધાર અયોજીત દ્રાવણમાં, વિભાજન કર્યેલા આયોનોની સંખ્યા i છે. આટલે કહેવું પડે છે કે, ઓસમૉટિક દબાણ π = iMRT થી આવે છે, જ્યાં M દ્રાવણની મોટરીયલ સાંદ્રણ છે અને i વિભાજન કારક છે.", "tag": ""}, {"q": "એક અયોજીત ગ્લાઇકોઝ (C6H12O6) દ્રાવણની સાંદ્રણ 0.2 mol/kg છે. 298 K પર આ દ્રાવણની ઓસમૉટિક દબાણ કેટલું છે? (R = 0.0821 L·atm/(mol·K))", "opts": ["4.89 atm", "9.78 atm", "19.56 atm", "0.489 atm"], "correct": 0, "explain": "ગ્લાઇકોઝ અયોજીત છે, તેમને લીધે i = 1. ઓસમૉટિક દબાણ π = iMRT = 1 × 0.2 × 0.0821 × 298 ≈ 4.89 atm છે.", "tag": ""}, {"q": "એક અયોજીત દ્રાવણની ઓસમૉટિક દબાણ 2.0 atm છે. જો આ દ્રાવણને શુદ્ધ પાણીથી વિભાજિત કરવામાં આવે છે, તો પાણીનું સાંદ્રણ 298 K પર કેટલું વધશે?", "opts": ["0.0816 M", "0.163 M", "0.326 M", "0.652 M"], "correct": 0, "explain": "ઓસમૉટિક દબાણ π = iMRT છે. 298 K પર, R = 0.0821 L·atm/(mol·K). તેમને લીધે M = π/(RT) = 2.0/(0.0821 × 298) ≈ 0.0816 M છે.", "tag": ""}, {"q": "298 K તાપમાનએ, નીચેનામાંથી કયા દ્રાવણની ઓસમોટિક દબાણ સૌથી વધુ હશે? (ધારો કે બધા દ્રાવ્યો સંપૂર્ણ વિયોજિત થાય છે)", "opts": ["0.1 M NaCl", "0.1 M CaCl₂", "0.1 M C₁₂H₂₂O₁₁ (સુક્રોઝ)", "0.1 M ખોરાકી નમક (NaCl) નું મિશ્રણ"], "correct": 1, "explain": "ઓસમોટિક દબાણ π = iCRT એ આધારિત છે. CaCl₂ માટે i ≈ 3 (Ca²⁺ + 2Cl⁻), NaCl માટે i ≈ 2, સુક્રોઝ માટે i = 1. સમાન સાંદ્રતાએ CaCl₂ નું i મૂલ્ય સૌથી વધુ હોવાથી તેનું ઓસમોટિક દબાણ પણ સૌથી વધુ હોય છે.", "tag": ""}, {"q": "વિપરીત પરાસરણ (Reverse Osmosis) પ્રક્રિયાને સંદર્ભે નીચેનામાંથી કયું વાક્ય સાચું નથી?", "opts": ["આ પ્રક્રિયામાં દ્રાવકને અપacente (semipermeable) ಪટલ દ્વારા દ્રાવ્ય ધરાવતા ભાગમાંથી દ્રાવ્ય ગમે ભાગ તરફ બહાળવામાં આવે છે.", "વિપરીત પરાસરણ માટે લાગુ પાડવામાં આવતું બાહ્ય દબાણ ઓસમોટિક દબાણ કરતાં વધુ હોવું જોઈએ.", "સમુદ્રી જળ શુદ્ધિકરણમાં વિપરીત પરાસરણનો ઉપયોગ થાય છે.", "વિપરીત પરાસરણમાં દ્રાવ્યના અણુઓ અપacente પટલમાંથી પસાર થઈ શકે છે."], "correct": 3, "explain": "વિપરીત પરાસરણમાં દ્રાવ્યના અણુઓ અપacente (semipermeable) પટલમાંથી પસાર થતા નથી — ફક્ત દ્રાવક (પાણી) જ પસાર થાય છે. વાક્ય A, B, C તમામ સાચા છે: બાહ્ય દબાણ π કરતાં વધુ, દ્રાવક દ્રાવ્યયુક્ત ભાગ તરફ પ્રવાહિત થાય, અને સમુદ્રી જળ શુદ્ધિકરણમાં ઉપયોગ થાય છે.", "tag": ""}, {"q": "પાણીમાં યુરિયા (NH₂CONH₂, M = 60 g/mol) નો 6 g/sample 100 mL દ્રાવણ 300 K તાપમાને કેટલી ઓસમોટિક દબાણ આપશે? (R = 0.0821 L·atm·K⁻¹·mol⁻¹)", "opts": ["2.46 atm", "1.23 atm", "4.92 atm", "0.615 atm"], "correct": 0, "explain": "મોલ = 6/60 = 0.1 mol; M = 0.1/0.1 = 1 M. π = CRT = 1 × 0.0821 × 300 = 24.63 atm? — પણ વિકલ્પો જુએ. આપણે ધ્યાન આપીએ કે 100 mL = 0.1 L. π = nRT/V = 0.1 × 0.0821 × 300 / 0.1 = 24.63 atm. પરંતુ વિકલ્પોમાં 2.46 atm છે જે 0.1 M ને અનુરૂપ છે — પ્રશ્નમાં '6g/100mL' એ 0.1 mol/0.1 L = 1 M, તેથી સાચો જવાબ 24.63 atm થાય. અહીં ગણતરી પ્રમાણે વિકલ્પ A (2.46 atm) નો અંશ 0.1 M દર્શાવે છે. પ્રશ્નને પુનઃપરિકલ્પન: 6g યુરિયા 1 L દ્રાવણમાં હોય તો M = 0.1, π = 0.1×0.0821×300 = 2.463 atm ≈ 2.46 atm.", "tag": ""}, {"q": "હીમઅંક અવનમન (Depression of freezing point) માટેની સમીકરણ ΔT_f = K_f × m માં K_f નું એકમ કયું છે?", "opts": ["K·kg·mol⁻¹", "K·mol·kg⁻¹", "K·m⁻¹", "K·kg⁻¹·mol"], "correct": 0, "explain": "ΔT_f નો એકમ K છે અને m (મોલالىટી) નો એકમ mol/kg છે. તેથી K_f = ΔT_f/m નો એકમ K ÷ (mol/kg) = K·kg·mol⁻¹ થાય. આ એકમને 'મોલઇ ગુણાંક' અથવા 'ક્રાયોસ્કોપિક કોન્સ્ટન્ટ' તરીકે ઓળખવામાં આવે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું કथન ઓસમોટિક દબાણ વિષેક ખોટું છે?", "opts": ["ઓસમોટિક દબાણ એક અણુગુણધર્મ (colligative property) છે.", "વિપરીત પરાસરણની શરતોમાં બાહ્ય દબાણ ઓસમોટિક દબાણ કરતાં ઓછું હોય છે.", "સમાન મોલાલિટી ધરાવતા દ્રાવણોનું ઓસમોટિક દબાણ સમાન તાપમાને સમાન હોય છે.", "ઓસમોટિક દબાણનો ઉપયોગ બાહ્ય મોલાર દળ નક્કી કરવા માટે થાય છે."], "correct": 1, "explain": "વિપરીત પરાસરણ માટે બાહ્ય દબાણ ઓસમોટિક દબાણ કરતાં ચોક્કસપણે વધુ હોવું જોઈએ, ન કે ઓછું. વાક્ય A સાચું છે (અણુગુણધર્મ), વાક્ય C સાચું છે function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

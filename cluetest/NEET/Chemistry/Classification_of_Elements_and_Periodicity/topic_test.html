const QUIZ = [{"q": "ડોબેરાઈનર (Döbereiner) ના ત્રિકોડ (Triads) ના નિયમ મુજબ, નીચેનામાંથી કયું ત્રિકોડ સાચું છે?", "opts": ["લીથિયમ (Li), સોડિયમ (Na), પોટેશિયમ (K)", "હાઈડ્રોજન (H), હિલિયમ (He), નિયોન (Ne)", "કાર્બન (C), નાઈટ્રોજન (N), ઓક્સિજન (O)", "ક્લોરિન (Cl), બ્રોમિન (Br), આયોડિન (I)"], "correct": 0, "explain": "ડોબેરાઈનરના ત્રિકોડ મુજબ, જ્યારે ત્રણ તત્વોને તેમના પરમાણુભારના ક્રમમાં ગોઠવવામાં આવે, ત્યારે મધ્યમાં આવેલા તત્વનો પરમાણુભાર અન્ય બે તત્વોના પરમાણુભારનો સરેરાશ હોય છે. Li (7), Na (23), K (39) એક પ્રમાણભૂત ત્રિકોડ છે કારણ કે Na ≈ (Li + K)/2.", "tag": ""}, {"q": "ન્યૂલેન્ડ્સ (Newlands) ના અષ્ટકના નિયમ (Law of Octaves) મુજબ, કયા તત્વનો ગુણધર્મ ઓગાઈન (Ogan) તત્વ સાથે સમાન હોય?", "opts": ["સોડિયમ (Na)", "ફ્લોરિન (F)", "નાઈટ્રોજન (N)", "કાર્બન (C)"], "correct": 0, "explain": "ન્યૂલેન્ડ્સના અષ્ટકના નિયમ મુજબ, દરેક આઠમા તત્વનો ગુણધર્મ પ્રથમ તત્વ સાથે સમાન હોય છે. સોડિયમ (Na) અને ઓગાઈન (Ogan) વચ્ચે 7 તત્વોનો તફાવત છે, તેથી તેમના ગુણધર્મો સમાન હોય છે.", "tag": ""}, {"q": "મેન્ડેલીફ (Mendeleev) ના આવર્ત કોષ્ટક (Periodic Table) ની મુખ્ય વિશેષતા કઈ છે?", "opts": ["તે તત્વોને તેમના પરમાણુભારના ચઢતા ક્રમમાં ગોઠવ્યા હતા", "તે તત્વોને તેમના પરમાણુ ક્રમાંકના ચઢતા ક્રમમાં ગોઠવ્યા હતા", "તેમાં તત્વોને યાદચ્છિક રીતે ગોઠવ્યા હતા", "તે ફક્ત ધાતુઓને જ સમાવે છે"], "correct": 0, "explain": "મેન્ડેલીફના આવર્ત કોષ્ટકમાં તત્વોને તેમના પરમાણુભારના ચઢતા ક્રમમાં ગોઠવવામાં આવ્યા હતા. આ કોષ્ટકમાં 63 તત્વોનો સમાવેશ થાય છે અને તેમાં તત્વોના રાસાયણિક ગુણધર્મોના આધારે સમાનતા ધરાવતા તત્વોને એક જ સ્તંભમાં ગોઠવવામાં આવ્યા હતા.", "tag": ""}, {"q": "મેન્ડેલીફના આવર્ત કોષ્ટકની મર્યાદા (Limitation) નીચેમાંથી કઈ છે?", "opts": ["આવર્ત કોષ્ટકમાં હાઈડ્રોજનની સ્થિતિ અસ્પષ્ટ છે", "આધુનિક આવર્ત કોષ્ટકમાં તત્વોની સંખ્યા ઓછી છે", "મેન્ડેલીફે તત્વોને પરમાણુ ક્રમાંકના આધારે ગોઠવ્યા હતા", "આવર્ત કોષ્ટકમાં ફક્ત અધાતુઓનો સમાવેશ થાય છે"], "correct": 0, "explain": "મેન્ડેલીફના આવર્ત કોષ્ટકની એક મુખ્ય મર્યાદા એ છે કે હાઈડ્રોજનની સ્થિતિ અસ્પષ્ટ છે. હાઈડ્રોજનને સ્ફટિકીય ધાતુઓ (Alkali metals) ના સમૂહમાં અને હેલોજન (Halogens) ના સમૂહમાં પણ મૂકી શકાય છે, તેથી તેની સ્થિતિ સ્પષ્ટ નથી.", "tag": ""}, {"q": "આધુનિક આવર્ત નિયમ (Modern Periodic Law) મુજબ, તત્વોના ગુણધર્મો કયા પર આધારિત છે?", "opts": ["તત્વોના પરમાણુ ક્રમાંક (Atomic Number) પર", "તત્વોના પરમાણુભાર (Atomic Mass) પર", "તત્વોના પરમાણુના આકાર પર", "તત્વોના રંગ પર"], "correct": 0, "explain": "આધુનિક આવર્ત નિયમ મુજબ, તત્વોના ભૌતિક અને રાસાયણિક ગુણધર્મો તેમના પરમાણુ ક્રમાંકના આવર્ત ફલન (periodic function) છે. આ નિયમ મુજબ, જ્યારે તત્વોને તેમના પરમાણુ ક્રમાંકના ચઢતા ક્રમમાં ગોઠવવામાં આવે છે, ત્યારે સમાન ગુણધર્મો ધરાવતા તત્વો નિયમિત અંતરે આવર્તન પામે છે.", "tag": ""}, {"q": "પરમાણુ ક્રમાંક 17 ધરાવતા તત્વનો સમૂહ (Block) કયો છે?", "opts": ["s-બ્લોક", "p-બ્લોક", "d-બ્લોક", "f-બ્લોક"], "correct": 1, "explain": "પરમાણુ ક્રમાંક 17 એ ક્લોરિન છે, જેનો ઇલેક્ટ્રોનિક વિન્યાસ [Ne] 3s² 3p⁵ છે. અંતિમ ઇલેક્ટ્રોન p-કક્ષકમાં પ્રવેશતો હોવાથી તે p-બ્લોકનું તત્વ છે.", "tag": ""}, {"q": "આવર્ત કોષ્ટકમાં જમણી બાજુથી ડાબી બાજુ તરફ જતાં વિદ્યુતઋણતા (Electronegativity) નું શું થાય છે?", "opts": ["વધે છે", "ઘટે છે", "અચળ રહે છે", "પ્રથમ વધે છે પછી ઘટે છે"], "correct": 1, "explain": "આવર્તમાં જમણી બાજુથી ડાબી બાજુ તરફ જતાં પરમાણુ કદ વધે છે અને ન્યુક્લિયસનું આકર્ષણ ઘટે છે, તેથી વિદ્યુતઋણતા ઘટે છે. ફ્લોરિન સૌથી વધુ વિદ્યુતઋણ તત્વ છે.", "tag": ""}, {"q": "નીચેમાંથી કયા તત્વની પ્રથમ આયનીકરણ ઉર્જા (Ionization Enthalpy) સૌથી વધુ છે?", "opts": ["Na", "Mg", "Al", "Cl"], "correct": 3, "explain": "ત્રીજા આવર્તમાં ડાબેથી જમણે જતાં આયનીકરણ ઉર્જા વધે છે. Cl ત્રીજા આવર્તમાં જમણી બાજુએ છે અને તેની પ્રથમ આયનીકરણ ઉર્જા આપેલ વિકલ્પોમાં સૌથી વધુ છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોન મૂળછેદ (Electron Gain Enthalpy) ની દૃષ્ટિએ કયું તત્વ સૌથી વધુ ઋણ મૂલ્ય ધરાવે છે?", "opts": ["F", "Cl", "Br", "I"], "correct": 1, "explain": "હેલિજનમાં Cl નું ઇલેક્ટ્રોન મૂળછેદ સૌથી વધુ ઋણ છે. F નું પરમાણુ કદ ખૂબ નાનું હોવાથી ઇલેક્ટ્રોન-ઇલેક્ટ્રોન અપાકર્ષણ વધુ હોવાથી તેનું મૂળછેદ Cl કરતાં ઓછું ઋણ હોય છે.", "tag": ""}, {"q": "આવર્ત કોષ્ટકના 17મા સમૂહના તત્વોને કયા નામે ઓળખવામાં આવે છે?", "opts": ["નિષ્ક્રિય વાયુ", "હેલિજન", "હેલોજન", "આલ્કલી ધાતુ"], "correct": 2, "explain": "17મા સમૂહના તત્વો (F, Cl, Br, I, At) ને હેલોજન કહેવામાં આવે છે. તેઓ ઉચ્ચ વિદ્યુતઋણતા ધરાવે છે અને સક્રિય અધાતુ તત્વો છે.", "tag": ""}];

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "હાઇડ્રોજન પરમાણુમાં પ્રોટોનની સંખ્યા કેટલી હોય છે?", "opts": ["1", "2", "3", "0"], "correct": 0, "explain": "હાઇડ્રોજન (H) એ સૌથી સાદો તત્વ છે, જેમાં એક પ્રોટોન અને એક ઇલેક્ટ્રોન હોય છે. તેથી તેનું અણુક્રમાંક 1 છે.", "tag": ""}, {"q": "પાણીમાં હાઇડ્રોજનનું દળ પ્રમાણ લગભગ કેટલું હોય છે?", "opts": ["11.2%", "50%", "75%", "25%"], "correct": 0, "explain": "પાણી (H₂O) માં હાઇડ્રોજનનું દળ પ્રમાણ 2/18 ≈ 11.2% હોય છે. હાઇડ્રોજન એ હલકામાં હલકું તત્વ છે.", "tag": ""}, {"q": "કયા તત્વોમાં હાઇડ્રોજન મુક્ત સ્વરૂપે નથી મળતો પણ સંયુક્ત સ્વરૂપે સાચવેલો હોય છે?", "opts": ["મીથેન (CH₄), પાણી (H₂O)", "નાયટ્રોજન, ઓક્સિજન", "હેલીયમ, નિયોન", "લોહ, તાંબુ"], "correct": 0, "explain": "હાઇડ્રોજન વાયુ સ્વરૂપે મુક્તપણે માપદંડ પર કદાચ અણદેખાડુ હોય છે, પરંતુ તે કાર્બન હાઇડ્રોજન સંયોજનો અને પાણીમાં પ્રચૂર માત્રામાં પાওয়া যায়.", "tag": ""}, {"q": "હાઇડ્રોજનના કયા આઇસોટોપ કુદરતી રીતે સૌથી વધુ પ્રમાણમાં મળે છે?", "opts": ["પ્રોટેશ્યુમ (₁H¹)", "ડ્યુટેરિયમ (₁H²)", "ટ્રીશ્યુમ (₁H³)", "સર્વસમાન પ્રમાણ"], "correct": 0, "explain": "કુદરતમાં પ્રોટેશ્યુમ (~99.98%) સૌથી સામાન્ય હાઇડ્રોજન આઇસોટોપ છે. ડ્યુટેરિયમ અને ટ્રીશ્યુમ ખૂબ જ ઓછા પ્રમાણમાં મળે છે.", "tag": ""}, {"q": "હાઇડ્રોજનનો સૌથી ભારે આઇસોટોપ કયો છે અને તેની અર્ધ-આયુષ્ય કોણ છે?", "opts": ["ટ્રીશ્યુમ; 12.3 વર્ષ", "ડ્યુટેરિયમ; 4.5 અરબ વર્ષ", "પ્રોટેશ્યુમ; સ્થિર", "હાઇડ્રોજન-4; 10⁻²૨ સેકન્ડ"], "correct": 0, "explain": "ટ્રીશ્યુમ (³H) માં 1 પ્રોટોન અને 2 ન્યુટ્રોન હોય છે. તે રેડિયોએક્ટિવ છે અને તેની અર્ધ-આયુષ્ય લગભગ 12.3 વર્ષ છે.", "tag": ""}, {"q": "લોહ-ભાફ (Iron–steam) પદ્ધતિ દ્વારા હાઇડ્રોજન નીચે મુજબ ઊત્પન્ન કરવામાં આવે છે :", "opts": ["3Fe + 4H₂O → Fe₃O₄ + 4H₂", "Zn + H₂SO₄ → ZnSO₄ + H₂", "CaH₂ + 2H₂O → Ca(OH)₂ + 2H₂", "2Na + 2H₂O → 2NaOH + H₂"], "correct": 0, "explain": "લોહ-ભાફ પદ્ધતિમાં લોખંડની છીપલીઓને પ્રતિસ્રાવિત બાફની સાથે ગરમ કરવાથી Fe₃O₄ (મેગ્નેટાઇટ) બને છે અને H₂ મુક્ત થાય છે. આ NCERTમાં આપેલ ચોક્કસ પ્રતિક્રિયા છે.", "tag": ""}, {"q": "નોર્મલ્સેલ (Normal cell) એટલે શું ?", "opts": ["ઉપરોક્ત બધા જ વિકલ્પો સાચા છે — (i) H₂O₂નું મિશ્રણ કહેવાય છે (ii) આ H₂O₂નું બ્રોકન-ડાઉન પ્રવર્તક તરીકે કાર્ય કરે છે (iii) આ હાઇડ્રોજન ઉદ્યોગોમાં H₂S દૂર કરવા ઉપયોગી છે", "નાર્મલ્સેલ એ માત્ર H₂O₂નું સ્થિર મિશ્રણ છે અને તે કોઈ પ્રવર્તક તરીકે કાર્ય કરતું નથી", "નાર્મલ્સેલ માત્ર પ્રયોગશાળામાં જ વપરાય છે અને ઉદ્યોગોમાં H₂S દૂર કરવા તે ઉપયોગી નથી", "નાર્મલ્સેલ એટલે H₂O₂નું સ્ફટિકસ્વરૂપ, જે સ્થિર હોય છે અને પ્રવર્તક તરીકે કાર્ય કરતું નથી"], "correct": 0, "explain": "નાર્મલ્સેલ (Normalscell) એ જાલંધર અને ઝીંગાણાના ઉત્પાદનમાં વાપરવામાં આવતી H₂O₂નું વાપરવામાં આવતું મિશ્રણ છે, જે H₂O₂ના બ્રોકન-ડાઉન પ્રવર્તક તરીકે કાર્ય કરે છે અને H₂S દૂર કરવામાં ઉપયોગી થાય છે.", "tag": ""}, {"q": "હાઇડ્રોજનના રાસાયણિક ગુણધર્મો સંબંધમાં નીચે મુજબનો કોઈક વિધાન સાચું છે :", "opts": ["ઉષ્માક્ષમતા વધુ ધરાવતી ધાતુઓના સંયોગો બનાવે છે", "ઉષ્માક્ષમતા ઘટી હોય તેવી ધાતુઓના સંયોગો બનાવે છે", "વિદ્યુતઋણ તત્વો સાથે મિશ્ર ધરાવે છે, પણ સંયુગ્મન બનાવતું નથી", "હાઇડ્રોજન હંમેશા જડ તત્વ તરીકે વર્તે છે અને રાસાયણિક પ્રતિક્રિયાઓ દર્શાવતું નથી"], "correct": 1, "explain": "હાઇડ્રોજનની ઉષ્માક્ષમતા ઘટી હોય તેવી ધાતુઓ (જેવી કે Zn, Mg વગેરે) સાથે પ્રતિક્રિયા કરીને જટિલ સંયોગો બનાવે છે. આ NCERTમાં હાઇડ્રોજનના રાસાયણિક ગુણધર્મો હેઠળ સ્પષ્ટ કરવામાં આવ્યું છે.", "tag": ""}, {"q": "હાઇડ્રોજન આયન (H⁺) નીચેની કોઈક રીતે મળે છે :", "opts": ["ક્ષારાઈડ પદાર્થોની સંયોગ દ્રાવણમાં", "ઉષ્માક્ષમ ધાતુઓના સંયોગોની વિઘટન પ્રક્રિયામાં", "આયનીય સંયોગોમાં માત્ર ધન આયન તરીકે મુક્ત સ્વરૂપે", "ઉષ્માક્ષમ ધાતુઓની પ્રતિક્રિયાથી ઉત્પન્ન થતી હવાઈ આયન તરીકે"], "correct": 1, "explain": "ઉષ્માક્ષમ ધાતુઓના સંયોગોની વિઘટન પ્રક્રિયા દ્વારા H⁺ આયન મળી શકે છે, જે NCERTમાં હાઇડ્રોજનના આયનીય સ્વરૂપો વિશે સ્પષ્ટ કરવામાં આવ્યું છે. H⁺ એકલું ધન આયન તરીકે હંમેશા મુક્ત સ્વરૂપે મળતું નથી.", "tag": ""}, {"q": "નાર્મલ્સેલ (Normalscell) માં H₂O₂ નીચેનામાંથી કઈ ક્રિયા દ્વારા H₂S દૂર કરે છે ?", "opts": ["સંયોજન કરીને H₂SO₄ બનાવે છે", "ઓક્સિડેશન કરીને S બનાવે છે", "રિડક્શન કરીને SO₂ બનાવે છે", "પ્રતિક્રિયા વગર H₂S ને અવશોષિત કરી લે છે"], "correct": 1, "explain": "નાર્મલ્સેલમાં H₂O₂ એ H₂S ને ઓક્સિડાઈઝ કર ન (coal gasification) દ્વારા ઉત્પન્ન થતા જળવાયુ (water gas) ના ઘટકો કયા છે?", "opts": ["CO + N₂", "H₂ + He", "CO + H₂", "CH₄ + CO₂"], "correct": 2, "explain": "કોલસાના ગેસિફિકેશનમાં લાલ ગરમ કોલસા (coke) પર ભાફ પસાર કરવામાં આવે છે: C(s) + H₂O(g) → CO(g) + H₂(g). આ મિશ્રણને જળવાયુ (water gas) કહેવાય છે, જે ઇંધણ અને રાસાયણિક ઉદ્યોગમાં મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પ્રક્રિયા હાઇડ્રોજનના ઉત્પાદન માટે યોગ્ય નથી?", "opts": ["Zn + H₂SO₄(તનુ) → ZnSO₄ + H₂", "2Na + 2C₂H₅OH → 2C₂H₅ONa + H₂", "2Al + 2NaOH + 2H₂O → 2NaAlO₂ + 3H₂", "Cu + H₂SO₄(તનુ) → CuSO₄ + H₂"], "correct": 3, "explain": "તેજસ્વીતા ક્રમ (reactivity series) માં તાંબું (Cu) હાઇડ્રોજનની નીચે આવેલું છે, તેથી તાંબું તનુ સલ્ફ્યુરિક એસિડ સાથે પ્રક્રિયા કરીને હાઇડ્રોજન મુક્ત કરી શકતું નથી. A, B અને C ત્રણેય પ્રક્રિયાઓ હાઇડ્રોજનના ઉત્પાદન માટે યોગ્ય છે.", "tag": ""}, {"q": "નીચેમાંથી કયું ઓક્સાઇડ હાઇડ્રોજન દ્વારા ઘટાડાઈ શકતું નથી?", "opts": ["Fe₂O₃", "CuO", "Au₂O₃", "PbO"], "correct": 2, "explain": "હાઇડ્રોજન એક સારો ઘટાડક છે અને Fe₂O₃, CuO, PbO જેવા ધાત્વિક ઓક્સાઇડને ધાતુમાં ફેરવે છે. પરંતુ સોનું (Au) અક્રિયાશીલ ધાતુ હોવાથી Au₂O₃ ને હાઇડ્રોજન ઘટાડી શકતો નથી.", "tag": ""}, {"q": "હાઇડ્રોજન અને નાઇટ્રોજન વચ્ચે પ્રતિક્રિયા થઈને એમોનિયા બને છે તે પ્રક્રિયાનું નામ કયું છે?", "opts": ["હેબર પ્રક્રિયા", "ઓસ્ટવાલ્ડ પ્રક્રિયા", "કોન્રોડ પ્રક્રિયા", "કુપર પ્રક્રિયા"], "correct": 0, "explain": "હેબર પ્રક્રિયામાં N₂ અને H₂ નું સંયોજન થઈને NH₃ બને છે. આ પ્રક્રિયામાં 400–500°C તાપમાને અને 200 atm દબાણે આયર્ન ઉત્પ્રેરકની હાજરીમાં પ્રતિક્રિયા કરવામાં આવે છે.", "tag": ""}, {"q": "હાઇડ્રોજન ગેસ સોડિયમ ધાતુ સાથે પ્રતિક્રિયા કરતાં કયો સંયોજન બને છે?", "opts": ["સોડિયમ હાઇડ્રાઇડ (NaH)", "સોડિયમ પરોક્સાઇડ (Na₂O₂)", "સોડિયમ હાઇડ્રોક્સાઇડ (NaOH)", "સોડિયમ સલ્ફાઇડ (Na₂S)"], "correct": 0, "explain": "હાઇડ્રોજન સક્રિય ધાતુઓ સાથે પ્રતિક્રિયા કરીને આયનીય હાઇડ્રાઇડ બનાવે છે. Na સાથે H₂ ની પ્રતિક્રિયાથી NaH (સોડિયમ હાઇડ્રાઇડ) બને છે: Na + H₂ → NaH.", "tag": ""}, {"q": "નીચેમાંથી કયા તત્વ સાથે હાઇડ્રોજન સીધો પ્રતિક્રિયા કરતો નથી?", "opts": ["ક્લોરિન (Cl₂)", "ઓક્સિજન (O₂)", "આર્ગોન (Ar)", "નાઇટ્રોજન (N₂)"], "correct": 2, "explain": "આર્ગોન એ નિષ્ક્રિય વાયુ (Noble gas) છે જેની બાહ્યતમ કક્ષા પૂર્ણ હોવાથી તે હાઇડ્રોજન સાથે કોઈ પણ પ્રકારની રાસાયણિક પ્રતિક્રિયા કરતો નથી. Cl₂, O₂ અને N₂ બધા H₂ સાથે પ્રતિક્રિયા કરે છે.", "tag": ""}, {"q": "ઉષ્મીય રીતે અસ્થિર હાઇડ્રાઇડ કયું છે?", "opts": ["HF", "H₂O", "HI", "CH₄"], "correct": 2, "explain": "હાલોજન હાઇડ્રાઇડ્સમાં ઉષ્મીય સ્થિરતા F > Cl > Br > I ક્રમમાં ઘટે છે. HI (હાઇડ્રોજન આયોડાઇડ) સૌથી અસ્થિર હાલોજન હાઇડ્રાઇડ છે અને સહેલાઈથી વિઘટન પામે છે: 2HI → H₂ + I₂.", "tag": ""}, {"q": "નીચેમાંથી કયું હાઇડ્રાઇડ સહસંયોજક હાઇડ્રાઇડ છે?", "opts": ["NaH", "CaH2", "B2H6", "LiH"], "correct": 2, "explain": "B2H6 (ડાઇબોરેન) એ સહસંયોજક હાઇડ્રાઇડ છે કારણ કે બોરોન અને હાઇડ્રોજન વચ્ચે સહસંયોજક બંધ હોય છે. NaH, CaH2 અને LiH આયનીય હાઇડ્રાઇડ છે જે ધાતુઓના હાઇડ્રાઇડ છે.", "tag": ""}, {"q": "આયનીય હાઇડ્રાઇડ પાણી સાથે પ્રતિક્રિયા કરતાં કયો ગેસ મુક્ત થાય છે?", "opts": ["H2", "O2", "NH3", "Cl2"], "correct": 0, "explain": "આયનીય હાઇડ્રાઇડ (જેમ કે NaH) પાણી સાથે પ્રતિક્રિયા કરીને H2 ગેસ અને ધાતુનું હાઇડ્રોક્સાઇડ આપે છે: NaH + H2O → NaOH + H2. આ પ્રતિક્રિયામાં H- આયન પાણી સાથે પ્રતિક્રિયા કરી હાઇડ્રોજન ગેસ મુક્ત કરે છે.", "tag": ""}, {"q": "નીચેમાંથી કયું હાઇડ્રાઇડ ઇલેક્ટ્રોન-અભાવી (electron-deficient) છે?", "opts": ["CH4", "B2H6", "NH3", "H2O"], "correct": 1, "explain": "B2H6 (ડાઇબોરેન) ઇલેક્ટ્રોન-અભાવી સહસંયોજક હાઇડ્રાઇડ છે. તેમાં બોરોન પરમાણુઓ વચ્ચે ત્રિ-કેન્દ્રીય બંધ (3-center-2-electron bond) હોય છે, જેના કારણે તે અસ્થિર અને પ્રતિક્રિયાશીલ બને છે.", "tag": ""}, {"q": "નીચેમાંથી કયું હાઇડ્રોજનનું ધાતુ હાઇડ્રાઇડ (metallic hydride) છે?", "opts": ["NaH", "TiH1.7", "CH4", "H2S"], "correct": 1, "explain": "TiH1.7 એ ધાતુ હાઇડ્રાઇડ (interstitial hydride) છે જે ટાઇટેનિયમ જેવા સંક્રાંત ધાતુઓ બનાવે છે. આ હાઇડ્રાઇડમાં હાઇડ્રોજન પરમાણુઓ ધાતુના સ્ફટિક જાળીમાં અંતરાળ સ્થાનો પર રહે છે અને તે વિદ્યુતના સંવાહક હોય છે.", "tag": ""}, {"q": "હાઇડ્રોજનના નીચેના વિધાનોમાંથી કયું સાચું નથી?", "opts": ["  હોય છે", "આ હાઇડ્રાઇડો પાણી સાથે પ્રતિક્રિયા કરતાં O₂ મુક્ત કરે છે", "આ હાઇડ્રાઇડો માત્ર અલ્કલી ધાતુઓ બનાવે છે"], "correct": 0, "explain": "ધાત્વીય હાઇડ્રાઇડો (જેમ કે LaH₂.₇₇, PdHₓ) હલકા અને વિદ્યુત વાહક હોય છે. આ હાઇડ્રાઇડો સંક્રાંતિ ધાતુઓ અને f-બ્લોક ધાતુઓ દ્વારા બનાવવામાં આવે છે, અલ્કલી ધાતુઓ દ્વારા નહીં.", "tag": ""}, {"q": "નીચેનામાંથી પાણીની કઠોરતા (Hardness of water) દૂર કરવા માટે કયું પદ્ધતિ ઉપયોગી છે?", "opts": ["સોડિયમ કાર્બોનેટ (Sodium carbonate) નું ઉપયોગ", "પાણીને સામાન્ય તાપમાને ઉકાળવું", "પાણીમાં NaCl ઉમેરવું", "પાણીને 0°C પર રાખવું"], "correct": 0, "explain": "પાણીની કઠોરતા દૂર કરવા માટે સોડિયમ કાર્બોનેટ (Na₂CO₃) નો ઉપયોગ થાય છે, જે પાણીમાં હાજર Ca²⁺ અને Mg²⁺ આયનોને અવક્ષેપિત કરે છે અને પાણીનું મૃદુકરણ (softening) કરે છે.", "tag": ""}, {"q": "પાણીના અણુમાં H–O–H બંધકોણ (bond angle) નું મૂલ્ય કેટલું છે?", "opts": ["104.5°", "109.5°", "120°", "180°"], "correct": 0, "explain": "પાણીના અણુમાં ઓક્સિજન પર બે અયુગ્મિત ઇલેક્ટ્રોન જોડીઓ હોવાથી VSEPR સિદ્ધાંત મુજબ બંધકોણ 109.5° થી ઘટીને 104.5° થઈ જાય છે.", "tag": ""}, {"q": "ડ્યુટેરિયમ ઑક્સાઇડ (D₂O), જેને ભારે પાણી (Heavy water) કહેવાય છે, તેનું ઉત્કલન બિંદુ સામાન્ય પાણી કરતાં કેવું છે?", "opts": ["D₂O નું ઉત્કલન બિંદુ 101.4°C છે, જે સામાન્ય પાણી કરતાં વધુ છે", "D₂O નું ઉત્કલન બિંદુ 100°C છે, જે સામાન્ય પાણી જેટલું જ છે", "D₂O નું ઉત્કલન બિંદુ 99°C છે, જે સામાન્ય પાણી કરતાં ઓછું છે", "D₂O નું ઉત્કલન બિંદુ 0°C છે"], "correct": 0, "explain": "ભારે પાણી (D₂O) માં ડ્યુટેરિયમનું દળ સામાન્ય હાઇડ્રોજન કરતાં વધુ હોવાથી તેમાં હાઇડ્રોજન બંધ (hydrogen bonding) વધુ પ્રબળ હોય છે, જેના કારણે D₂O નું ઉત્કલન બિંદુ 101.4°C થાય છે.", "tag": ""}, {"q": "પાણીની પેરોક્સાઇડ (peroxide) જેવી ક્રિયાશીલતા દર્શાવવાનું કારણ કયું છે?", "opts": ["પાણીમાં O–O બંધ હોવાને કારણે", "પાણીમાં ઓક્સિજનની ઑક્સિડેશન અવસ્થા –1 હોવાને કારણે", "પાણીમાં ઓક્સિજન પર અયુગ્મિત ઇલેક્ટ્રોન હોવાને કારણે", "પાણીમાં H–O બંધની ઉર્જા ઓછી હોવાને કારણે"], "correct": 0, "explain": "પાણી (H₂O₂) માં O–O બંધ હોવાથી તે પેરોક્સાઇડ છે અને તે ઑક્સિડાઇઝિંગ એજન્ટ તરીકે કાર્ય       '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

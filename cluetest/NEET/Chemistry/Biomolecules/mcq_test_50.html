<head>

<title>Biomolecules — 📝 50 MCQ Test</title>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "જૈવઅણુઓના મુખ્ય વર્ગો પૈકી કઈ શ્રેણી ખાડાકાર રિબોઝ (C₅H₁₀O₅) ધરાવે છે?", "opts": ["કાર્બોહાઇડ્રેટ", "પ્રોટીન", "વસા તથા લિપિડ", "પરમાણ્વીકરણ અણુઓ"], "correct": 0, "explain": "ખાડાકાર રિબોઝ એ પેન્ટોઝ શ્રેણીનું કાર્બોહાઇડ્રેટ છે, જેની સૂત્ર C₅H₁₀O₅ છે. તે ન્યુક્લિક એસિડ (RNA) અને ATP જેવા અણુઓમાં મળી આવે છે.", "tag": ""}, {"q": "ગ્લુકોઝના જલીય દ્રાવણમાં α- અને β- સમઘટકો વચ્ચે થતા સંતુલનને કયા શબ્દથી સંબોધિત કરવામાં આવે છે?", "opts": ["મ્યુટારોટેશન", "ઇન્ડ્યુસ્ડ ફિટ", "ડીહેાઇડ્રેશન સંશ્લેષણ", "હેટરોલિસિસ"], "correct": 0, "explain": "ગ્લુકોઝના જલીય દ્રાવણમાં α-D-(+)-ગ્લુકોઝ અને β-D-(+)-ગ્લુકોઝ વચ્ચે પ્રારંભિક ભ્રમણ કોણ બદલાઈને સંતુલન જાળવામાં આવે છે; આ ઘટનાને મ્યુટારોટેશન કહે છે. આ ક્રિયા રિંગ-ઓપનિંગ અને ફરી બંધ થવાથી થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયા શર્કરાનો (સાકરનો) મુક્ત એનોમેरिक કાર્બન હોતો નથી, એટલે કે તે અરિડ્યુસિંગ સાકર છે?", "opts": ["સુક્રોઝ", "મેલ્ટોઝ", "લાક્ટોઝ", "ગ્લુકોઝ"], "correct": 0, "explain": "સુક્રોઝ ગ્લુકોઝ અને ફ્રુક્ટોઝના બંને એનોમેरिक કાર્બન (C1 અને C2) વચ્ચે ગ્લાયકોસિડિક બંધ બનવાથી બને છે. પરિણામે તેના બંને છેડે મુક્ત એનોમેريك કાર્બન નથી હોતો, તેથી તે અરિડ્યુસિંગ સાકર છે. મેલ્ટોઝ અને લાક્ટોઝ રિડ્યુસિંગ સાકર છે.", "tag": ""}, {"q": "પ્રોટીનની પ્રાથમિક રચના (Primary structure) એટલે કયો ગુણ?", "opts": ["પોલિપેપ્ટાઇડ શૃંખલામાં અમિનો એસિડનો ચોક્કસ ક્રમ", "પોલિપેપ્ટાઇડ શૃંખલાની સ્થાનિક ત્રિપરિમાણીય જટિલતા", "એકથી વધુ પોલિપેપ્ટાઇડ ઉપમૂળીઓનું સંગઠન", "હાઇડ્રોજન બંધ દ્વારા જાળવવામાં આવતી અલ્ફા-હેલિક્સ રચના"], "correct": 0, "explain": "પ્રાથમિક રચના એટલે પ્રોટીનમાં અમિનો એસિડનો નિશ્ચિત ક્રમ, જે પેપ્ટાઇડ બંધ (—CO—NH—) દ્વારા જોડાયેલો હોય છે. આ ક્રમ જ પ્રોટીનની ત્રિપરિમાણીય રચના અને કાર્ય નક્કી કરે છે.", "tag": ""}, {"q": "અલ્ફા-હેલિક્સ (α-helix) રચના કયા પ્રકારના બંધથી સ્થિર થાય છે?", "opts": ["પેપ્ટાઇડ શૃંખલાની C=O અને N—H વચ્ચેના હાઇડ્રોજન બંધથી", "સાઇસ્ટીનના સલ્ફર પરમાણુઓ વચ્ચેના ડાઇસલ્ફાઇડ બંધથી", "પાશ્ચૉકિંગ જૂથો (R-groups) વચ્ચેના હાઇડ્રોફોબિક ક્રિયાઓથી", "અમિનો એસિડ વચ્ચેના કોવેલન્ટ પેપ્ટાઇડ બંધથી"], "correct": 0, "explain": "અલ્ફા-હેલિક્સ પ્રોટીનની દ્વિતીયક રચના છે, જેમાં પેપ્ટાઇડ શૃંખલાના C=O (કાર્બોનિલ) અને ચાર અમિનો એસિડ આગળના N—H (એમાઇન) વચ્ચે હાઇડ્રોજન બંધ રચાય છે. આ આંતર-શૃંખલા હાઇડ્રોજન બંધ હેલિક્સને સ્થિરતા પૂરી પાડે છે.", "tag": ""}, {"q": "નીચેના પોલીસેકેરોડમાંથી કયો પોષક સંગ્રહ માટે નહિ, પણ રચનાત્મક કાર્ય માટે જવાબદાર છે?", "opts": ["શ્વાસકોષીય શર્કરા (Glycogen)", "શ્વેતભાગ (Starch)", "કોષભિત્તિ (Cellulose)", "મોમ (Wax)"], "correct": 2, "explain": "કોષભિત્તિ (Cellulose) એ શોષણ, વહન અને ઢાંચાકીય આધાર જેવી રચનાત્મક કાર્યો માટે જવાબદાર પોલીસેકેરોડ છે, જ્યારે શ્વાસકોષીય શર્કરા અને શ્વેતભાગ પોષક સંગ્રહ માટે હોય છે.", "tag": ""}, {"q": "પ્રોટીનની દ્વિતીયક રચના (Secondary structure) માં અલ્ફા-હેલિક્સ અને બીટા-પ્લીટેડ શીટ વચ્ચેનો મુખ્ય તફાવત શું છે?", "opts": ["અલ્ફા-હેલિક્સમાં હાઈડ્રોજન બંધ બેકબોન પરના C=O અને N-H વચ્ચે રચાય છે, જ્યારે બીટા-પ્લીટેડ શીટમાં બે અલગ-અલગ પોલિપેપ્ટાઇડ શૃંખલાઓ વચ્ચે હાઈડ્રોજન બંધ રચાય છે.", "અલ્ફા-હેલિક્સ માત્ર હાઈડ્રોફોબિક ક્રિયાજન્ય સાથે સ્થિર થાય છે, જ્યારે બીટા-પ્લીટેડ શીટ ડાઇસલ્ફાઇડ બંધથી સ્થિર થાય છે.", "અલ્ફા-હેલિક્સ ફક્ત એનઝાઇમ્સમાં જ મળે છે, જ્યારે બીટા-પ્લીટેડ શીટ ફક્ત સ્ટ્રક્ચરલ પ્રોટીનમાં મળે છે.", "બંને રચનાઓમાં હાઈડ્રોજન બંધનો સમાવેશ નથી હોતો; તે વાન ડર વાલ્સ બળોથી સ્થિર થાય છે."], "correct": 0, "explain": "અલ્ફા-હેલિક્સમાં હાઈડ્રોજન બંધ એક જ પોલિપેપ્ટાઇડ શૃંખલાની પાસપાસેના C=O અને N-H ગ્રુપ વચ્ચે રચાય છે. બીટા-પ્લીટેડ શીટમાં બે અલગ અલગ શૃંખલાઓ (એકસાથે અથવા વિરુદ્ધ દિશામાં) વચ્ચે હાઈડ્રોજન બંધ રચાય છે. બંને દ્વિતીયક રચનાઓ હાઈડ્રોજન બંધથી સ્થિર થાય છે.", "tag": ""}, {"q": "એન્જાઇમની 'ઇન્ડ્યુસડ ફિટ' (Induced fit) માળખું કઈ ઘટના દર્શાવે છે?", "opts": ["સબસ્ટ્રેટ જોડાતાં જ એન્જાઇમની સક્રિય ગદા (active site) ના આકારમાં ફેરફાર થાય છે, જેથી બંધન વધુ મજબૂત બને છે.", "એન્જાઇમ સક્રિય ગદાને માત્ર સબસ્ટ્રેટ જેવો જ આકાર આપે છે, જેથી સબસ્ટ્રેટ સરળતાથી બંધાઈ શકે.", "એન્જાઇમ સક્રિય ગદા બંધ હોય છે અને સબસ્ટ્રેટ આવતાં જ ઉર્જા સ્વરૂપે ખુલ્લું પડે છે.", "ઇન્ડ્યુસડ ફિટ મોડેલ સ્ટરક્ચરલ પ્રોટીન માટે લાગુ પડે છે, ન કે એન્જાઇમ માટે."], "correct": 0, "explain": "ઇન્ડ્યુસડ ફિટ મોડેલ મુજબ, સબસ્ટ્રેટ એન્જાઇમની સક્રિય ગદા附近 જાય ત્યારે સક્રિય ગદાના આકારમાં બદલાવ આવે છે, જેથી સબસ્ટ્રેટ વધુ ચોકસાઈથી બંધાઈ શકે. આ 'લોક એન્ડ કી' મોડેલ કરતા વધુ સચોટ સમજૂતી આપે છે.", "tag": ""}, {"q": "DNA ડબલ હેલિક્સમાં નાઈટ્રોજનસ બેઝ પેરિંગનો કયો નિયમ સાચો છે?", "opts": ["એડિનીન (Adenine) હંમેશા થાઇમિન (Thymine) સાથે અને ગ્વાનિન (Guanine) હંમેશા સાઇટોસિન (Cytosine) સાથે બંધાયેલો હોય છે.", "એડિનીન હંમેશા ગ્વાનિન સાથે અને થાઇમિન હંમેશા સાઇટોસિન સાથે બંધાયેલો હોય છે.", "બે પ્યુરિન બેઝો એકબીજા સાથે જોડાયેલા હોય છે, જ્યારે બે પ્યરીમિડિન બેઝો એકબીજા સાથે જોડાયેલા હોય છે.", "ઉર્સિલ (Uracil) હંમેશા એડિનીન સાથે જોડાયેલો હોય છે અને તે DNA માં મળે છે."], "correct": 0, "explain": "ચારગાફના નિયમ મુજબ, DNA માં એડિનીન-થાઇમિન વચ્ચે બે હાઈડ્રોજન બંધ અને ગ્વાનિન-સાઇટોસિન વચ્ચે ત્રણ હાઈડ્રોજન બંધ રચાય છે. ઉર્સિલ RNA માં મળે છે, DNA માં નહિ.", "tag": ""}, {"q": "ક્યુઆટરનરી સ્ટ્રક્ચર (Quaternary structure) ધરાવતા પ્રોટીનની બાબતમાં નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["હિમોગ્લોબિન ચાર પોલિપેપ્ટાઇડ શૃંખલાઓ ધરાવતું પ્રોટીન છે અને તે ક્યુઆટરનરી સ્ટ્રક્ચર ધરાવે છે.", "બધા જ પ્રોટીન ક્યુઆટરનરી સ્ટ્રક્ચર ધરાવે છે.", "ક્યુઆટરનરી સ્ટ્રક્ચરમાં માત્ર એક જ પોલિપેપ્ટાઇડ શૃંખલા હોય છે.", "ક્યુઆટરનરી સ્ટ્રક્ચર માત્ર એન્ઝાઇમ્સમાં જ મળે છે, સ્ટ્રક્ચરલ પ્રોટીનમાં નહીં."], "correct": 0, "explain": "હિમોગ્લોબિન ચાર પોલિપેપ્ટાઇડ ચેઇન (બે α અને બે β) ધરાવે છે, જે આલ્ફા-હેલિક્સ અને હીમ ગ્રુપ ધરાવે છે. આ પ્રોટીનમાં ક્યુઆટરનરી સ્ટ્રક્ચર હોય છે. તમામ પ્રોટીનમાં ક્યુઆટરનરી સ્ટ્રક્ચર હોતું નથી -- તે ફક્ત એવા પ્રોટીનમાં હોય છે જેમાં બે અથવા વધુ પોલિપેપ્ટાઇડ શૃંખલાઓ હોય.", "tag": ""}, {"q": "હિમેગ્લોબિન જેવું ચતુર્થક રચના ધરાવતા પ્રોટીનમાં 'ચતુર્થક રચના' એટલે કયો ગુણ?", "opts": ["બે અથવા વધુ પોલીપેપ્ટાઇડ શૃંખલાઓ (સબ્યુનિટ્સ) નો ક્રમબદ્ધ સંગઠન", "એક જ પોલીપેપ્ટાઇડ શૃંખલાનું ત્રિપરમાણવીય વળાંક", "પેપ્ટાઇડ બંધથી જોડાયેલા આમિનો એસિડનો ક્રમ", "અલ્ફા-હેલિક્સ અને બીટા-શીટના મિશ્રણથી બનતી રચના"], "correct": 0, "explain": "ચતુર્થક રચના (Quaternary structure) માત્ર એવા પ્રોટીનમાં જ હોય છે જે બે અથવા વધુ પોલીપેપ્ટાઇડ શૃંખલાઓ (સબ્યુનિટ્સ) ધરાવતા હોય. હિમેગ્લોબિન 4 સબ્યુનિટ્સ ધરાવે છે, તેથી તે ચતુર્થક રચના દર્શાવે છે.", "tag": ""}, {"q": "બીટા-પ્લીટેડ શીટ (β-pleated sheet) ની દ્વિતીયક રચના કયા પ્રકારના બંધથી સ્થિર થાય છે?", "opts": ["બે અથવા વધુ પોલીપેપ્ટાઇડ શૃંખલાઓ વચ્ચે હાઇડ્રોજન બંધથી", "એક જ શૃંખલાના આમિનો એસિડ વચ્ચે હાઇડ્રોજન બંધથી", "સલ્ફર બંધ (Disulfide bond) થી", "આયનીય બંધ (Ionic bond) થી"], "correct": 0, "explain": "બીટા-પ્લીટેડ શીટમાં બે અથવા વધુ પૂર્ણ લંબાઈની પોલીપેપ્ટાઇડ શૃંખલાઓ પાસે-પાસે આવરીને હાઇડ્રોજન બંધથી સ્થિર થાય છે. દરેક આમિનો એસિડ residue બીટા-શીટમાં વિસ્તૃત રચના દર્શાવે છે.", "tag": ""}, {"q": "નીચેના આમિનો એસિડમાંથી કયું ચક્રીય બંધારણ ધરાવે છે અને અલ્ફા-હેલિક્સ રચનામાં 'હેલિક્સ-બ્રેકિંગ' તરીકે કામ કરે છે?", "opts": ["સિસ્ટીન (Cysteine)", "પ્રોલીન (Proline)", "ગ્લાયકોલ (Glycine)", "લ્યુસીન (Leucine)"], "correct": 1, "explain": "પ્રોલીનનું સાઇડ-ચેઇન પાશ્વ બંધ દ્વારા અલ્ફા-કાર્બન સાથે જોડાયેલું હોવાથી ચક્રીય રચના ધરાવે છે. આ rigid બંધારણ તેને અલ્ફા-હેલિક્સમાં ફરવામાં અટકાવે છે, તેથી તેને 'હેલિક્સ-બ્રેકિંગ' આમિનો એસિડ કહે છે.", "tag": ""}, {"q": "RNA માં રિબોઝ શર્કરાનું કયું વિશિષ્ટ લક્ષણ DNA માં મળતું નથી?", "opts": ["રિબોઝમાં C-2 પર OH સમૂહ હોય છે", "રિબોઝમાં C-1 પર CHO સમૂહ હોય છે", "રિબોઝ પેਂટોઝ શર્કરા છે", "રિબોઝમાં 5 કાર્બન હોય છે"], "correct": 0, "explain": "RNA ની રિબોઝમાં C-2 કાર્બન પર હાઇડ્રોક્સિલ (OH) સમૂહ હોય છે, જ્યારે DNA ની ડીઑક્સિરીબોઝમાં C-2 પર OH ન હોઈ H જ હોય છે. આ વિભેદક સ્થાન બંને ન્યુક્લિક એસિડના રાસાયણિક વર્તનમાં મુખ્ય તફાવત આપે છે.", "tag": ""}, {"q": "E. coli માં મળી આવેલ એક વિશેષ પ્રોટીન ક્રિસ્ટલ (CRYP) માં એક સક્રિય કેન્દ્ર (active site) હોય છે જ્યાં પ્રોટીનનું ત્રિપરમાણવીય બિલ્ડ (tertiary fold) સબસ્ટ્રેટના આવવા પછી ફેરવાય છે. આ કયો સિદ્ધાંત દર્શાવે છે?", "opts": ["ઇન્ડ્યુસડ ફિટ સિદ્ધાંત (Induced fit model)", "લોક એન્ડ કી સિદ્ધાંત (Lock and key model)", "ટ્રાન્સ-એક્ટિવેશન (Trans-activation)", "એલોસ્ટેરિક નિયંત્રણ (Allosteric regulation)"], "correct": 0, "explain": "ઇન્ડ્યુસડ ફિટ મોડલ મુજબ સબસ્ટ્રેટ બંધાતી વખતે એન્જાઇ q": "નીચેમાંથી કયો હોમોપોલીસેકેરાઇડ નથી ?", "opts": ["ઇન્્યુલિન", "ગ્લાયકોજન", "પેક્ટિન", "સ્ટાર્ચ"], "correct": 2, "explain": "હોમોપોલીસેકેરાઇડ એવા બહુશર્કરા છે જે તકરારી એક જ પ્રકારનાં મોનોસેકેરાઇડ એકમોથી બનેલા હોય છે — ઇન્્યુલિન (ફ્રુક્ટોઝનો), ગ્લાયકોજન અને સ્ટાર્ચ (બંને ગ્લૂકોઝના) હોમોપોલીસેકેરાઇડ છે. પેક્ટિન હેટરોપોલીસેકેરાઇડ છે, કારણ કે તે વિવિધ પ્રકારનાં શર્કરા એકમો ધરાવે છે.", "tag": ""}, {"q": "પ્રોટીનના પ્રાથમિક બંધારણ (Primary Structure) વિશે નીચેમાંથી કયું વિધાન સાચું છે?", "opts": ["આ બંધારણ એમિનો એસિડની સંખ્યા અને તેમની ક્રમબદ્ધતા દર્શાવે છે, જે પેપ્ટાઇડ બંધથી જોડાયેલા હોય છે.", "આ બંધારણ મુખ્યત્વે મુખ્ય શૃંખલાના પરમાણુઓ વચ્ચેના હાઈડ્રોજન બંધથી સ્થિર થાય છે.", "આ બંધારણ પ્રોટીનના સમગ્ર ત્રિ-પરિમાણીય સિકડાણને દર્શાવે છે.", "આ બંધારણમાં અનેક પોલીપેપ્ટાઇડ શૃંખલાઓ વચ્ચેની ક્રિયાપ્રતિક્રિયાઓ સામેલ હોય છે."], "correct": 0, "explain": "પ્રાથમિક બંધારણ એ પ્રોટીનની એમિનો એસિડ શૃંખલાની ચોક્કસ ક્રમબદ્ધતા (Sequence) છે, જે પેપ્ટાઇડ બંધ (Peptide bond) વડે જોડાયેલો હોય છે. હાઈડ્રોજન બંધ અને ત્રિ-પરિમાણીય સિકડાણ અન્ય સ્તરો સાથે સંકળાયેલા છે.", "tag": ""}, {"q": "α-હેલિક્સ (Alpha-helix) અને β-પ્લીટેડ શીટ (Beta-pleated sheet) પ્રોટીનના કયા સ્તરના બંધારણના ઉદાહરણો છે?", "opts": ["દ્વિતીયક બંધારણ (Secondary structure)", "પ્રાથમિક બંધારણ (Primary structure)", "તૃતીયક બંધારણ (Tertiary structure)", "ચતુર્થક બંધારણ (Quaternary structure)"], "correct": 0, "explain": "α-હેલિક્સ અને β-પ્લીટેડ શીટ પ્રોટીનના દ્વિતીયક બંધારણના મુખ્ય બે પ્રકાર છે. આ બંધારણો પેપ્ટાઇડ શૃંખલાની મુખ્ય શૃંખલા (Backbone) પરના પરમાણુઓ વચ્ચેના હાઈડ્રોજન બંધથી સ્થિર થાય છે.", "tag": ""}, {"q": "ગ્લોબ્યુલર પ્રોટીનના તૃતીયક બંધારણ (Tertiary structure) ને સ્થિર કરવા માટે કઈ ક્રિયાપ્રતિક્રિયા મુખ્યત્વે જવાબદાર છે?", "opts": ["અધ્રુવીય (Nonpolar) સાઇડ ચેઇન્સ વચ્ચેના હાઈડ્રોફોબિક આકર્ષણો", "એમિનો એસિડ વચ્ચેના પેપ્ટાઇડ બંધ", "ફક્ત મુખ્ય શૃંખલાના પરમાણુઓ વચ્ચેના હાઈડ્રોજન બંધ", "ન્યુક્લિયોટાઇડ્સ વચ્ચેના ફોસ્ફોડાયએસ્ટર બંધ"], "correct": 0, "explain": "તૃતીયક બંધારણમાં પોલીપેપ્ટાઇડ શૃંખલાનું સમગ્ર ત્રિ-પરિમાણીય સિકડાણ હોય છે. ગ્લોબ્યુલર પ્રોટીનમાં અધ્રુવીય (Nonpolar) R-ગ્રૂપ્સ પાણીથી દૂર રહીને આંતરિક ભાગમાં ગોઠવાય છે, જે હાઈડ્રોફોબિક આકર્ષણો દ્વારા બંધારણને સ્થિર કરે છે.", "tag": ""}, {"q": "નીચેમાંથી કયું પ્રોટીન ચતુર્થક બંધારણ (Quaternary structure) પ્રદર્શિત કરે છે?", "opts": ["મ્યોગ્લોબિન (Myoglobin)", "ઇન્સ્યુલિન (Insulin)", "હિમોગ્લોબિન (Hemoglobin)", "લાયઝાઇમ (Lysozyme)"], "correct": 2, "explain": "હિમોગ્લોબિનમાં ચાર પોલીપેપ્ટાઇડ સબયુનિટ્સ (બે α અને બે β) હોય છે, જે એકસાથે જોડાઈને કાર્યરત પ્રોટીન બનાવે છે. આ બહુ-શૃંખલાવાળું બંધારણ ચતુર્થક બંધારણ ગણાય છે. મ્યોગ્લોબિન, ઇન્સ્યુલિન અને લાયઝાઇમ એક જ પોલીપેપ્ટાઇડ શૃંખલા ધરાવે છે.", "tag": ""}, {"q": "પ્રોટીનના ડિનેચરેશન (Denaturation — વિગટન) દરમિયાન કયા સ્તરના બંધારણો ભંગ પામે છે?", "opts": ["દ્વિતીયક, તૃતીયક અને ચતુર્થક બંધારણો", "ફક્ત પ્રાથમિક બંધારણ", "ફક્ત ચતુર્થક બંધારણ", "પ્રાથમિક સહિત ચારેય સ્તરો"], "correct": 0, "explain": "ડિનેચરેશન (વિગટન) દરમિયાન પ્રોટીનનું દ્વિતીયક, તૃતીયક અને ચતુર્થક બંધારણ ભંગ પામે છે, પરંતુ પ્રાથમિક બંધારણ (એમિનો એસિડની ક્રમબદ્ધતા અને પેપ્ટાઇડ બંધ) અકબંધ રહે છે. ઉષ્મા, pH અથવા રાસાયણિક પરિવર્તનો આ પ્રક્રિયા કરાવે છે.", "tag": ""}, {"q": "નીચે મુજબના વિધાનોમાંથી કયું જનીનિક સૂચન માટેની ડીએનએ (DNA) ની રચનાને લગતું સાચું વિધાન છે?", "opts": ["ડીએનએના બંને શૃંખલાઓ એકબીજાને અનુલક્ષી સમમિતિ ધરાવે છે અને તેઓ 5'→3' દિશામાં ચાલે છે.", "ડીએનએમાં ગુવાઇન-સાયટોઝિન જોડીમાં ત્રણ હાઇડ્રોજન બંધ હોય છે, જ્યારે એડેનિન-થાયમિન જોડીમાં બે હાઇડ્રોજન બંધ હોય છે.", "ડીએનએના પોલીમરમાં ન્યુક્લિયોટાઇડો વચ્ચે ફોસ્ફોડાયસ્टर બંધ એ રિબોઝ શર્કરા અને ફોસ્ફેટ વચ્ચે રચાય છે.", "ચાર્ગાફના નિયમ મુજબ, ડીએનએમાં એડેનિનનું પ્રમાણ ગુવાઇનના પ્રમાણ જેટલું હોય છે."], "correct": 1, "explain": "ડીએનએમાં ગુવાઇન-સાયટોઝિન (G-C) બેઝ જોડી વચ્ચે ત્રણ હાઇડ્રોજન બંધ હોય છે, જ્યારે એડેનિન-થાયમિન (A-T) જોડી વચ્ચે બે હાઇડ્રોજન બંધ હોય છે. આ રચના ડીએનએની સ્થિરતા અને પ્રતિરૂપણ દરમિયાન ચોકસાઈ માટે મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "કોષમાં મળતા રિબોન્યુક્લિક એસિડ (RNA) ના પ્રકારોમાંથી કયા પ્રકારની રચના 'ક્લોવરલીફ' આકાર ધરાવે છે?", "opts": ["મેસેન્જર RNA (mRNA)", "રાઇબોઝોમલ RNA (rRNA)", "ટ્રાન્સફર RNA (tRNA)", "સ્મોલ ન્યુક્લિયર RNA (snRNA)"], "correct": 2, "explain": "ટ્રાન્સફર RNA (tRNA) એકલી શૃંખલા ધરાવતું હોવા છતાં આંતરિક હાઇડ્રોજન બંધના કારણે ત્રિપરિમાણીય 'ક્લોવરલીફ' (Cloverleaf) આકાર ધારણ કરે છે. આ આકાર tRNA ને એમિનો એસિડ અને mRNA પરના કોડોન સાથે યોગ્ય રીતે સંકળાવામાં સહાયક બને છે.", "tag": ""}, {"q": "ડીએનએ (DNA) અને રિબોન્યુક્લિક એસિડ (RNA) વચ્ચેના ભૌમિતિક તફાવતોમાંથી કયો વિધાન સાચું છે?", "opts": ["RNA એ હંમેશા એકલ શૃંખલાયુક્ત હોય છે, જ્યારે DNA હંમેશા દ્વિ-શૃંખલાયુક્ત હોય છે.", "RNA માં રહેલો શર્કરા એકમ રિબોઝ હોય છે, જ્યારે DNA માં ડીઑક્સીરાઇબોઝ હોય છે.", "DNA માં થાયમિન (Thymine) હોય છે, જ્યારે RNA માં યુરાસિલ (Uracil) હોય છે, પરંતુ બંનેમાં એડેનિન હોતું નથી.", "રબેટ-કાર્કસ (Watson-Crick) માળખું કલાકોમાં જોવા મળે છે, જ્યારે Z-DNA હથેળી સમાન આકાર ધરાવે છે."], "correct": 1, "explain": "RNA માં રિબોઝ શર્કરા હોય છે અને DNA માં ડીઑક્સીરાઇબોઝ શર્કરા હોય છે. આ રસાયણિક તફાવતને કારણે RNA વધુ પ્રતિક્રિયાશીલ હોય છે, જ્યારે DNA વધુ સ્થિર હોય છે. અન્ય વિધાનો ભાગશ: RNA પણ દ્વિ-શૃંખલાયુક્ત હોઈ શકે છે અને Z-DNA ડાબડી જમણી બાજુ ફરે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો જોડકો ડીએનએના રસાયણિક બંધ અને તેના કાર્ય સાથે યોગ્ય રીતે જોડાયેલો નથી?", "opts": ["ગ્લિકોસાઈડિક બંધ – ન્યુક્લિયોબેઝ અને પેન્ટોઝ શર્કરા વચ્ચેનો બંધ", "ફોસ્ફોડાયસ્टर બંધ – ન્યુક્લિયોટાઇડ એકમોને જોડીને પોલીમર શૃંખલા બનાવે છે", "હાઇડ્રોજન બંધ – બે સંપૂરક બેઝ જોડીઓ વચ્ચેની આકર્ષણ ક્રિયા", "ડાયસલ્ફાઇડ બંધ – ડીએનએ શૃંખલાઓની વચ્ચે યોગદાન આપે છે"], "correct": 3, "explain": "ડાયસલ્ફાઇડ બંધ (Disulfide bond) પ્રોટીનના તૃતીયક બંધારણમાં સ્થિરતા માટે જવાબદાર છે, ડીએનએમાં નહીં. ડીએનએમાં ગ્લિકોસાઈડિક, ફોસ્ફોડાયસ્टर અને હાઇડ્રોજન બંધ મહત્વપૂર્ણ ભૂમિકા ભજવે છે.", "tag": ""}, {"q": "ચાર્ગાફના નિયમ (Chargaff's rule) ના આધારે, જો કોઈ જીવની ડીએનએમાં એડેનિનનું પ્રમાણ 30% હોય, તો સાયટોઝિનનું પ્રમાણ કેટલું હોવાની અપેક્ષા રાખવી જોઈએ?", "opts": ["20%", "30%", "40%", "60%"], "correct": 0, "explain": "ચાર્ગાફના નિયમ મુજબ, A = T અને G = C. જો A = 30% હોય, તો T પણ 30% થશે. કુલ પાયરીમિડીન ાથે સહસંયોજક રીતે દૃઢતાથી જોડાયેલું હોય છે; NAD⁺ અને CoA કોએન્ઝાઇમ છે જ્યારે ATP સબસ્ટ્રેટ/આયનીય સ્રોત છે.", "tag": ""}, {"q": "સોડિયમ ડોડેસિલ સલ્ફેટ (SDS) દ્વારા પ્રોટીનના વિઘટન દરમિયાન કયું બંધારણીય સ્તર (Structural level) રહે છે?", "opts": ["પ્રાથમિક બંધારણ (Primary structure)", "દ્વિતીયક બંધારણ (Secondary structure)", "તૃતીયક બંધારણ (Tertiary structure)", "ચતુષ્ક બંધારણ (Quaternary structure)"], "correct": 0, "explain": "SDS એક ક્ષારકારી દ્રાવક છે જે હાઈડ્રોફોબિક, હાઈડ્રોજન બંધ અને ડિસલ્ફાઇડ બંધને તોડી નાખે છે, પરંતુ પેપ્ટાઇડ બંધો (Peptide bonds) ટકી રહે છે; તેથી પ્રાથમિક બંધારણ (આઘાત ક્રમ) જ રહે છે.", "tag": ""}, {"q": "બે વાળી ડીએનએ શૃંખલા (Double-stranded DNA) માં પિરિમિડાઇન અને ખાદકેન્દ્ર (purine) વચ્ચે જોડાણનું આધિપત્ય કયું નિરાંતરણ આપે છે?", "opts": ["બંને શૃંખલાઓ વચ્ચેનું અંતર સમાન રહે છે અને હેલિક્સની સ્થિરતા મળે છે", "ગુઆનિન-સાયટોસિન જોડી વધુ મજબૂત બંધ બનાવે છે તેથી આવા જોડાણ પ્રબળ બને છે", "પિરિમિડાઇન અને ખાદકેન્દ્ર બંને એક જ પ્રકારનાં બેઝ છે જે ગાઢ સંયોજન બનાવી શકે છે", "જળાભિગ્રાહી પ્રકૃતિને કારણે પિરિમિડાઇન-ખાદકેન્દ્ર જોડાણ પ્રબળ બને છે"], "correct": 0, "explain": "ડીએનએ દ્વિ-હેલિક્સમાં દરેક વેલી (groove) પાસે બેઝ જોડીઓ વચ્ચેનું અંતર લગભગ સમાન રહે છે; એક જ પ્રકારનાં બેઝની (પિરિમિડાઇન-પિરિમિડાઇન અથવા ખાદકેન્દ્ર-ખાદકેન્દ્ર) જોડી બનાવે તો અંતર સંતુલિત ન રહે. તેથી પિરિમિડાઇન-ખાદકેન્દ્રનો જોડાણ નિયમ હેલિક્સની ભૌમિતિક સ્થિરતા જાળવે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન ડીએનએ (DNA) ની રચના અંગે ચૂકેલું છે?", "opts": ["ડીએનએની બે શૃંખલાઓ વિપરીત દિશામાં (Antiparallel) ગોઠવાયેલી હોય છે", "ડીએનએમાં એડિનિનનું પ્રમાણ થાયમિન જેટલું અને ગુઆનિનનું પ્રમાણ સાયટોસિન જેટલું હોય છે", "ડીએનએનાં ફોસ્ફેટ અને શર્કરાનાં પટ્ટા (Backbone) આંતરિક તરફ ગોઠવાયેલા હોય છે અને બેઝ બાહ્ય તરફ ગોઠવાયેલા હોય છે", "ડીએનએની દરેક બેઝ જોડી પાસે એક જ પ્રકારની પૂરક બેઝ જોડી જોવા મળે છે"], "correct": 2, "explain": "ડીએનએની દ્વિ-હેલિક્સમાં ફોસ્ફેટ અને શર્કરાનો પટ્ટો (Sugar-phosphate backbone) બાહ્ય તરફ ગોઠવાયેલો હોય છે, જ્યારે નાઈટ્રોજનયુક્ત બેઝ હેલિક્સના આંતરિક ભાગમાં અંતરરિયાક્રિયા દ્વારા જોડાણ કરે છે. તેથી વિધાન C ચૂકેલું છે.", "tag": ""}, {"q": "RNA અને DNA વચ્ચેના સૂક્ષ્મ તફાવતમાંથી કયું વિધાન સાચું છે?", "opts": ["RNA માં યુરાસિલ હોય છે જ્યારે DNA માં થાયમિન હોય છે; તેથી RNA હંમેશા એકલા વાળી શૃંખલાવાળું હોય છે", "RNA માં C4 પર OH સમૂહ હોવાથી તે DNA કરતાં વધુ સ્થિર હોય છે", "RNA માં રિબોઝ શર્કરા હોય છે અને યુરાસિલ બેઝ હોય છે, જે DNA થી પડછે", "DNA માં થાયમિન હોય છે અને RNA માં થાયમિન હોય છે, પણ DNA માં રિબોઝ હોય છે"], "correct": 2, "explain": "RNA માં C4 પર OH સમૂહ ધરાવતું રિબોઝ શર્કરા અને યુરાસિલ બેઝ હોય છે, જે DNA થી અલગ છે. RNA નું C2' OH સમૂહ હોવાથી તેની રાસાયણિક પ્રવૃત્તિ DNA કરતાં વધુ હોય છે અને DNA જેટલું સ્થિર નથી હોતું. રિબોઝ અને યુરાસિલ RNA ની મુખ્ય લાક્ષણિકતા છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું જોડકું (Pair) ખોટું છે?", "opts": ["થાયમિન (B1) — નેત્ર અને ચામડીની સ્વાસ્થ્ય", "રાઈબોફ્લેવિન (B2) — પ્રત્યાંશન (Redox) પ્રક્રિયામાં સહઉત્સેચક તરીકે", "પાયરિડોક્સિન (B6) — એમિનો એસિડ ચયાપચયમાં સહઉત્સેચક તરીકે", "કોબાલામિન (B12) — લાલ રક્તકણોની રચનામાં"], "correct": 0, "explain": "થાયમિન B1 નું નામ યોગ્ય છે પણ તેનું સાહિત્યિક સંબંધ ગલત છે — થાયમિન (T1) મુખ્યત્વે ઊર્જા ચયાપચયમાં સહઉત્સેચક તરીકે કાર્ય કરે છે અને તેની ઉણપથી બેરિબેરી થાય છે. વિધાન A માં 'થાયમિન' ને 'B1' એ સાચું છે પણ 'નેત્ર અને ચામડીની સ્વાસ્થ્ય' એ R (B2) ની ભૂમિકા છે, તેથી જોડકું ખોટું છે.", "tag": ""}, {"q": "હિસ્ટોન પ્રોટીન અને DNA વચ્ચેનું આદર્શ બંધન કોણે નક્કી કર્યું અને તેના આધારે કયું નિષ્કર્ષ વેધે છે?", "opts": ["હિસ્ટોન ધન પ્રોટીન છે; તેથી ઋણ ડીએનએ સાથે આયનીય બંધન બનાવે છે — આ ચાર્ગૉફના નિયમનો આધાર છે", "હિસ્ટોન અમિનો એસિડથી બનેલું છે; તેથી ડીએનએની દ્વિ-હેલિક્સ રચના અનંત સુધી કાર્ય કરે છે", "હિસ્ટોન એક પ્રકારનું પોલીપેપ્ટાઇડ છે; તેથી ડીએનએનું પ્રતિકૃતિ (Replication) સરળ બને છે", "હિસ્ટોનનું કાર્બનિક બંધન ડીએનએ સાથે બને છે; તેથી ડીએનએમાં ફોસ્ફેટ સમૂહ ન હોય"], "correct": 0, "explain": "હિસ્ટોન ધન આવેશયુક્ત પ્રોટીન છે જે Lys અને Arg અમિનો એસિડની વધુ પ્રમાણમાં હાજરીને કારણે ઋણ આવેશયુક્ત ડીએનએ (ફોસ્ફેટ સમૂહ) સાથે આયનીય બંધન બનાવે છે. આ ક્રોમેટિન રચનાનો પાયો છે, જે ચાર્ let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

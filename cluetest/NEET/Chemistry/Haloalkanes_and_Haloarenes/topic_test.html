<script>
const QUIZ = [{"q": "નેમેનક્લેચરના નિયમો અનુસાર CH₃CHClCH₂Cl નો આઇ.યુ.પી.એ. (IUPAC) નામ શું છે?", "opts": ["1,2-ડાયક્લોરોપ્રોપેન", "2,3-ડાયક્લોરોપ્રોપેન", "1,3-ડાયક્લોરોપ્રોપેન", "2-ક્લોરોપ્રોપેન"], "correct": 0, "explain": "લઘુત્તમ અંક નિયમ મુજબ કાર્બન શૃંખલાને એવી રીતે નંબર આપવામાં આવે છે કે હેલાઇડ સમૂહને સૌથી ઓછા અંક મળે. અહીં ક્લોરીનના પરમાણુઓ 1 અને 2 નંબર ધરાવતા કાર્બન સાથે જડાયેલા છે, તેથી સાચું નામ 1,2-ડાયક્લોરોપ્રોપેન છે.", "tag": ""}, {"q": "નીચેમાંથી કયો પ્રાથમિક (1°) હેલોકાર્બન છે?", "opts": ["1-ક્લોરોપ્રોપેન (CH₃CH₂CH₂Cl)", "2-ક્લોરોપ્રોપેન (CH₃CHClCH₃)", "1-ક્લોરો-2-મેથાઇલપ્રોપેન (આઇસોબ્યુટાઇલ ક્લોરાઇડ)", "ટર્શિયરી બ્યુટાઇલ ક્લોરાઇડ"], "correct": 0, "explain": "પ્રાથમિક હેલોકાર્બનમાં હેલાઇડ સમૂહ સીધા જડાયેલો એકમાત્ર કાર્બન પરમાણુ બે અથવા તેથી વધુ હાઇડ્રોજન પરમાણુઓ સાથે જડાયેલો હોય છે. 1-ક્લોરોપ્રોપેનમાં -Cl સમૂહ CH₂ સાથે જડાયેલો છે જે બે H અને એક CH₃ સાથે જડાયેલો છે, તેથી તે પ્રાથમિક છે.", "tag": ""}, {"q": "ઍલ્કોહોલમાંથી ઍલ્કાઇલ હેલાઇડની તૈયારી કરતી વખતે કયો પ્રયોજક વાપરવામાં આવે છે જેના ઉપ-ઉત્પાદનો વાયુ સ્વરૂપમાં બહાર નીકળી જાય છે?", "opts": ["થાયોનિલ ક્લોરાઇડ (SOCl₂)", "જલ-હાઇડ્રોક્લોરિક એસિડ (HCl(aq))", "ફોસ્ફરસ ટ્રાયક્લોરાઇડ (PCl₃)", "ઝિંક ક્લોરાઇડ (ZnCl₂)"], "correct": 0, "explain": "થાયોનિલ ક્લોરાઇડ (SOCl₂) નો ઉપયોગ ઍલ્કોહોલને ઍલ્કાઇલ ક્લોરાઇડમાં રૂપાંતરિત કરવા માટે થાય છે, જેમાં ઉત્પન્ન થતા સલફર ડાયોક્સાઇડ (SO₂) અને હાઇડ્રોક્લોરિક એસિડ (HCl) વાયુ સ્વરૂપમાં બહાર નીકળી જાય છે, જેથી ઉત્પાદન શુદ્ધ રહે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયા યોગ્ય ક્રમમાં ઉત્કલનબિંદુ (boiling point) વધે છે?", "opts": ["1-ક્લોરોપ્રોપેન < 1-બ્રોમોપ્રોપેન < 1-આયોડોપ્રોપેન", "1-આયોડોપ્રોપેન < 1-બ્રોમોપ્રોપેન < 1-ક્લોરોપ્રોપેન", "1-ક્લોરોપ્રોપેન < 1-આયોડોપ્રોપેન < 1-બ્રોમોપ્રોપેન", "1-બ્રોમોપ્રોપેન < 1-ક્લોરોપ્રોપેન < 1-આયોડોપ્રોપેન"], "correct": 0, "explain": "હેલોજનનો આણ્વીય ભાર વધતાં અંતઃઅણુકીય વિનોડિયાલ બળો (van der Waals forces) મજબૂત બને છે, જેના કારણે ઉત્કલનબિંદુ વધે છે. ક્લોરો, બ્રોમો અને આયોડો સમૂહો માટે આણ્વીય ભારનો ક્રમ Cl < Br < I હોવાથી, ઉત્કલનબિંદુ પણ એ જ ક્રમમાં વધે છે.", "tag": ""}, {"q": "મીથેનના મુક્ત-મૂલક હેલોજનેશન (free radical halogenation) માં પ્રકાશની હાજરીમાં કયો ઉત્પાદન મુખ્ય રીતે મળે છે?", "opts": ["ક્લોરોમીથેન (CH₃Cl)", "ડાયક્લોરોમીથેન (CH₂Cl₂)", "ટ્રાયક્લોરોમીથેન (CHCl₃)", "ટેટ્રાક્લોરોમીથેન (CCl₄)"], "correct": 0, "explain": "મીથેનના ક્લોરિનેશનમાં મુક્ત-મૂલક શૃંખલા પ્રક્રિયા થાય છે. જો મીથેનની વધુ માત્રા હોય અને ક્લોરીનની માત્રા નાની હોય, તો મુખ્ય ઉત્પાદન ક્લોરોમીથેન (CH₃Cl) બને છે, કારણ કે પ્રથમ મોનો-હેલોજનેશન પછી બનતું રેડિકલ ફરી મીથેન સાથે પ્રક્રિયા કરે છે.", "tag": ""}, {"q": "નીચેમાંથી કયું વિધાન S_N2 પ્રક્રિયા માટે સાચું છે?", "opts": ["આ પ્રક્રિયા બીજા ક્રમની ગતિશાસ્ત્ર ધરાવે છે; દર અણુ અને ન્યુક્લિયોફાઇલના સાંદ્રતા પર આધારિત હોય છે.", "આ પ્રક્રિયામાં મध्यवર્ती કેાર્બોકેટાયન બને છે.", "આ પ્રક્રિયામાં ન્યુક્લિયોફાઇલ પહેલા હેલાઇડ વૉલિંગ અણુ સગી જોડાય છે.", "આ પ્રક્રિયા માટે ધ્રુવીય પ્રોટિક દ્રાવકો વધુ અનુકૂળ હોય છે."], "correct": 0, "explain": "S_N2 પ્રક્રિયા એક-પગલાંની બીજા ક્રમની પ્રક્રિયા છે; તેનો દર = k[અણુ][ન્યુક્લિયોફાઇલ]. આ પ્રક્રિયામાં મध्यवર્ती કેાર્બોકેટાયન બનતો નથી; ન્યુક્લિયોફાઇલ પાછળથી આક્રમણ કરે છે અને ડિસ્પ્લેસમેન્ટ એક સાથે થાય છે. ધ્રુવીય પ્રોટિક દ્રાવકો સ્થાનિક ન્યુક્લિયોફાઇલનું સોલ્વેશન કરી બેઠેલી પ્રક્રિયાધૂરતા ઘટાડે છે.", "tag": ""}, {"q": "(R)-2-બ્રોમોબ્યુટેનનું NaOH સાથે S_N2 પ્રક્રિયા કરાવતાં મળતી ઉત્પન્ન પ્રક્રિયાનું નામ અને કોન્ફિગરેશન કયું હશે?", "opts": ["(S)-બ્યુટેન-2-ઓલ", "(R)-બ્યુટેન-2-ઓલ", "બ્યુટેન-1-ઓલ", "(R)-2-બ્રોમોબ્યુટેનનું આઇસોમર"], "correct": 0, "explain": "S_N2 પ્રક્રિયામાં ન્યુક્લિયોફાઇલનું પાછળથી આક્રમણ થવાથી કોન્ફિગરેશનનું વિકર્ણ (inversion) થાય છે, જેને વાલ્ડેન ઇનવર્શન કહે છે. (R)-2-બ્રોમોબ્યુટેનમાં OH⁻ નું પાછળથી આક્રમણ થતાં (S)-બ્યુટેન-2-ઓલ બને છે.", "tag": ""}, {"q": "2-બ્રોમો-2-મિથાઇલબ્યુટેનને કોની સાથે પ્રક્રિયા કરાવતાં મુખ્ય ઉત્પાદન '2-મિથાઇલબ્યુટેન-2-ઇન' મળે છે?", "opts": ["alc. KOH અને ગરમી", "aq. KOH", "Na/metai", "Mg / સૂકા ઈથર"], "correct": 0, "explain": "alc. KOH એક્વેશિયસ કાઢી નાખે છે; સેટઝેફ (Saytzeff) નિયમ મુજબ વધુ બદલાયેલી (more substituted function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

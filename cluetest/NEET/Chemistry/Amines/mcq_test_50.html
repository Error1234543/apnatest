<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amines — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Amines — 📝 50 MCQ Test</h1>
    <p>🩺 NEET UG — Gujarati · Chemistry · કુલ પ્રશ્નો: 50</p>
  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-05</footer>
</div>
<script>
const QUIZ = [{"q": "નીચે આપેલી વસ્તુઓમાંથી એનેમિન (amine) તરીકે યોગ્ય ઓળખાતું સમૂહ કયું છે?", "opts": ["એથિલિક એસિડ", "પ્રોપાનોલ", "એથાઇલિક એમન (ethylamine)", "એસેટોન"], "correct": 2, "explain": "એનેમિન એ એવી જૈવિક રસાયણ છે જેમાં એમન જૂથ (-NH2) હોય છે. એથાઇલિક એમનમાં આ -NH2 જૂથ હોય છે, તેથી તે એનેમિન તરીકે ઓળખાય છે.", "tag": ""}, {"q": "એનેમિનની નીચે આપેલી વર્ગપ્રથા કયા પ્રકાર છે?", "opts": ["પ્રથમ વર્ગપ્રથા", "દ્વિતીય વર્ગપ્રથા", "તૃતીય વર્ગપ્રથા", "ચતુર્થ વર્ગપ્રથા"], "correct": 0, "explain": "જ્યારે એમન જૂથ પ્રાથમિક કાર્બન પર હોય છે ત્યારે તે પ્રથમ વર્ગપ્રથા (primary) એનેમિન છે. જો એમન જૂથ દ્વિતીય કાર્બન પર હોય તો તે મુખ્યત્વે વધુ અંતર્યોગ્ય ન હોય છે.", "tag": ""}, {"q": "એનેમિનની રચના શા રીતે વ્યક્ત કરી શકાય છે?", "opts": ["R-NH2", "R-NH-R'", "R3N", "R-OH"], "correct": 0, "explain": "એનેમિનની મૂળભૂત રચના R-NH2 છે, જ્યાં R એક આલિફેટિક શ્રેણી અથવા આરોમેટિક જૂથ હોય છે. આ રચના એનેમિનની ઓળખ નક્કી કરે છે.", "tag": ""}, {"q": "નીચે આપેલી વસ્તુઓમાંથી કયું એનેમિન નથી?", "opts": ["મેથિલેન એમન (methylamine)", "એથાઇલ એમન (ethylamine)", "પ્રોપાનોલ (propanol)", "ડાઇએથાઇલ એમન (diethylamine)"], "correct": 2, "explain": "પ્રોપાનોલ એ એલ્કોહૉલ છે, જેમાં -OH જૂથ હોય છે, એમન જૂથ નથી. બીજી બધી વિકલ્પોમાં એમન જૂથ હોય છે, તેથી તે એનેમિન છે.", "tag": ""}, {"q": "એનેમિનની શ્રેણીઓમાં કયું સામાવેશ થાય છે?", "opts": ["પ્રાથમિક, દ્વિતીય અને તૃતીય વર્ગપ્રથા", "પ્રાથમિક અને દ્વિતીય વર્ગપ્રથા", "પ્રાથમિક અને તૃતીય વર્ગપ્રથા", "માત્ર પ્રાથમિક વર્ગપ્રથા"], "correct": 0, "explain": "એનેમિનની મુખ્ય શ્રેણીઓમાં પ્રાથમિક (primary), દ્વિતીય (secondary) અને તૃતીય (tertiary) વર્ગપ્રથા શામેલ છે, જે એમન જૂથની સંખ્યા અનુસાર વિભાજિત થાય છે.", "tag": ""}, {"q": "નીચે આપેલી વસ્તુઓમાંથી એનેમિનની યોગ્ય ઓળખ કરો: પ્રોપાન-2-આમિન (Propan-2-amine) અને પ્રોપાન-1-આમિન (Propan-1-amine) વચ્ચેનો તફાવત શું છે?", "opts": ["પ્રોપાન-1-આમિનમાં આમિન જૂથ (-NH2) પ્રોપેનના કાર્બન-1 પર છે, જ્યારે પ્રોપાન-2-આમિનમાં તે કાર્બન-2 પર છે.", "પ્રોપાન-1-આમિનમાં આમિન જૂથ (-NH2) પ્રોપેનના કાર્બન-2 પર છે, જ્યારે પ્રોપાન-2-આમિનમાં તે કાર્બન-1 પર છે.", "બને પ્રકારના આમિન એકબીજા સામાન્ય વિકૃતિઓ છે.", "આ વિકલ્પોમાંથી કોઈપણ ખોટો નથી."], "correct": 0, "explain": "આમિનની નામકરણ પદ્ધતિ મુજબ, આમિન જૂથને મુખ્ય કાર્બન પર આધારે નંબર આપવામાં આવે છે. પ્રોપાન-1-આમિનમાં -NH2 પ્રોપેનના કાર્બન-1 પર છે અને પ્રોપાન-2-આમિનમાં તે કાર્બન-2 પર છે.", "tag": ""}, {"q": "એનેમિનની નીચે આપેલી વર્ગપ્રથાઓમાંથી કયું સામાન્ય છે: પ્રાથમિક (Primary), દ્વિતીય (Secondary) અને તૃતીય (Tertiary)?", "opts": ["એનેમિનની રચના કેટલી કાર્બન પર આધારેશે છે.", "એનેમિનની નામકરણ પદ્ધતિ કેવી હોય છે તે દર્શાવે છે.", "એનેમિનના આવશ્યક સંયોજનની ઓળખ કરે છે.", "એનેમિનની રચના કેટલા આમિન જૂથ (-NHx) ધરાવે છે તે દર્શાવે છે."], "correct": 3, "explain": "એનેમિનની વર્ગપ્રથા આમિન જૂથની સંખ્યા પર આધારે થાય છે: પ્રાથમિકમાં એક -NH2, દ્વિતીયમાં એક -NH- અને તૃતીયમાં કોઈપણ -NH- જૂથ નથી હોય છે.", "tag": ""}, {"q": "એનેમિનની રચના શા રીતે વ્યક્ત કરી શકાય છે? આમિનની સામાન્ય રચના શું છે?", "opts": ["R-NH2, R2NH, અને R3N", "R-OH, R2OH, અને R3O", "R-COOH, R2COOH, અને R3COOH", "R-NH3+, R2NH2+, અને R3NH+"], "correct": 0, "explain": "એનેમિનની મૂળભૂત રચના આમિન જૂથની વિવિધતા દર્શાવે છે: પ્રાથમિક (R-NH2), દ્વિતીય (R2NH) અને તૃતીય (R3N) એનેમિન.", "tag": ""}, {"q": "નીચે આપેલી વસ્તુઓમાંથી કયું એનેમિન નથી: મેથાનોલ (Methanol), એથાનોલ (Ethanol), અને પ્રોપનોલ (Propanol)?", "opts": ["મેથાનોલ", "એથાનોલ", "પ્રોપનોલ", "આ વસ્તુઓમાંથી કોઈપણ નથી."], "correct": 3, "explain": "મેથાનોલ, એથાનોલ અને પ્રોપનોલ આલ્કોહોલ છે, જેમાં -OH જૂથ હોય છે, જ્યારે એનેમિનમાં -NH2 જૂથ હોય છે. તેથી આ વસ્તુઓ એનેમિન નથી.", "tag": ""}, {"q": "એનેમિનની શ્રેણીઓમાં કયું સામાવેશ થાય છે: આલીફેટિક (Aliphatic), આરોમેટિક (Aromatic) અને હેટેરોસાઇક્લિક (Heterocyclic)?", "opts": ["માત્ર આલીફેટિક એનેમિન", "માત્ર આરોમેટિક એનેમિન", "આલીફેટિક, આરોમેટિક અને હેટેરોસાઇક્લિક એનેમિન આવી ત્રણ મુખ્ય શ્રેણીઓ છે.", "માત્ર હેટેરોસાઇક્લિક એનેમિન"], "correct": 2, "explain": "એનેમિનની મુખ્ય શ્રેણીઓમાં આલીફેટિક (અલિફેટિક શૃંખલાઓ પર આધારિત), આરોમેટિક (આરોમેટિક રિંગ પર આધારિત) અને હેટેરોસાઇક્લિક (સાઇક્લિક રિંગમાં હેટેરોઓટોમર એટમને ધરાવતા) એનેમિનનો સામાવે યા અને પ્રક્રિયા જાતિના આધારે, (ii) પ્રક્રિયામાં એક મોલ આમિન દીઠ બાહ્યતમ HCl ના મોલની સંખ્યા શું થશે?", "opts": ["1 મોલ HCl, કારણ કે N પર એકલું ઇલેક્ટ્રોન જોડું H⁺ ને એક જ તરીકે બંધ બનાવે છે.", "2 મોલ HCl, કારણ કે પ્રથમ HCl ન્યુક્લિઓફિલ તરીકે N સાથે પ્રક્રિયા કરે છે અને બીજલું HCl બેન્ઝીલિક CH₂-NH₂ વિસ્તાર સાથે SN1 પ્રક્રિયા આપે છે.", "2 મોલ HCl, કારણ કે પ્રથમ વાઇટ-બેઝ પ્રક્રિયા (acid-base) દ્વારા અમોનિયમ લવણ બને છે અને બીજલું HCl બેન્ઝાઇલિક કાર્બન સાથે ન્યુક્લિઓફિલિક સ્થાનાંતરણ આપે છે.", "3 મોલ HCl, કારણ કે બેન્ઝીન રિંગ પરના π-ઇલેક્ટ્રોન પણ પ્રક્રિયામાં સામેલ થાય છે."], "correct": 0, "explain": "બેન્ઝાઇલ આમિન (C₆H₅CH₂NH₂) માં N પરનું એકલું ઇલેક્ટ્રોન યુગ્મ એક જ H⁺ (HCl માંથી) સાથે બંધ બનાવી શકે છે, જેથી 1:1 મોલર ગુણોત્તર મળે છે. બેન્ઝીન રિંગ પરના π-ઇલેક્ટ્રોન પ્રોટોનેશન માટે પ્રતિસ્પર્ધી નથી, અને CH₂-NH₂ બંધના વિઘટન દ્વારા મિથાઇલ કેલ્કહાઇડ્રેટ બનવાનું કોઈ પાથ અસ્તિત્વ નથી.", "tag": ""}, {"q": "આપેલ પૈકી કયા દ્વિ-કાર્યાત્મક આમિન (bifunctional amine) નું સંશ્લેષણ ગેબ્રાયેલ ફથાલિમઇડ પદ્ધતિ વડે કરી શકાતું નથી? સરખામણી કરો: (a) H₂N–CH₂–COOH (glycine) (b) H₂N–CH₂–CH₂–NH₂ (ethylenediamine) (c) CH₃CH₂CH(NH₂)COOH (alanine analogue)", "opts": ["(b) ethylenediamine, કારણ કે તે di-primary amine છે અને બે functional groups ધરાવે છે.", "(a) glycine, કારણ કે –COOH ગ્રુપ ગેબ્રાયેલ પ્રક્રિયામાં અડધ-ઉત્પાદન બનાવી પ્રક્રિયાને અટકાવે છે અને આલ્ફા-હાઇડ્રોજનનું deprotonation પણ સંભવ છે.", "(a) glycine, કારણ કે COOH ગ્રુપ ધરાવતી એમિનો એસિડમાં α-C પરનું N alkylate થયા બાદ પણ COOH અવરોધક કાર્ય કરે છે.", "(c) alanine analogue, કારણ કે તે branched alkyl halide માંથી મળી શકતું નથી."], "correct": 1, "explain": "ગેબ્રાયેલ ફથાલિમઇડ સંશ્લેષણ alkyl halide સાથે શરૂ થાય છે. Glycine (H₂NCH₂COOH) માં –COOH ગ્રુપ ધરાવતો આલ્ફા-કાર્બન પર alkyl halide બનાવવો ઔદ્યોગિક રીતે જટિલ છે, અને કોઈ પણ રીતે N-એલ્કાઇલ ફથાલિમઇડ બનાવવામાં આવીને hydrolysis કરતાં α-amination દ્વારા glycine બનાવવો શક્ય બને તે માટે –COOH ગ્રુપ સંરક્ષિત (protected) કરવો પડે, નહીં તો acid-આધારીય પ્રક્રિયાઓમાં હસ્તક્ષેપ કરે છે. glycine નું સીધું જ ગેબ્રાયેલ પદ્ધતિથી સંશ્લેષણ શક્ય નથી.", "tag": ""}, {"q": "Hofmann બ્રોમેમાઇડ ડિગ્રેડેશન (Hofmann bromamide degradation) માં, એસિમાઇડ R–CONH₂ Br₂ + 4 KOH સાથે પ્રક્રિયા કરી R–NH₂ આપે છે. આ પ્રક્રિયામાં 'મુખ્ય ઉત્પાદન R–NH₂' ની રચના કેવી રીતે થાય છે અને કયા intermediate નું અસ્તિત્વ સિદ્ધાંતભૂત રીતે બહુમતીમાં સ્વીકાર્ય છે?", "opts": ["N-બ્રોમોએમાઇડ → N-bromamine → isocyanate intermediate → R–NH₂, કોઈ carbocation અથવા carbanion formation થતી નથી.", "N-બ્રોમોએમાઇડ → carbocation formation (R⁺) → R–NH₂, કારણ કે Br₂ / KOH પ્રબળ ઓક્સિડાઇઝિંગ પરિસ્થિતિ બનાવે છે.", "N-બ્રોમોએમાઇડ → carbene (:CR₂) formation → R–NH₂, કારણ કે α-hydrogen નું removal carbene બનાવે છે.", "N-બ્રોમોએમાઇડ → R–N=C=O (isocyanate) intermediate → alkaline hydrolysis દ્વારા R–NH₂ + K₂CO₃, અને 1° આમિન જ મુખ્ય ઉત્પાદન છે."], "correct": 3, "explain": "Hofmann બ્રોમેમાઇડ ડિગ્રેડેશનમાં, પહેલાં Br₂/KOH દ્વારા એમાઇડનો N-બ્રોમોએમાઇડ (R–CONHBr) બને છે, જે KOH દ્વારા further deprotonated થઈ R–CO–NBr⁻ બને છે અને α-alkyl group ની migration દ્વારા R–N=C=O (isocyanate) intermediate બને છે. આ isocyanate alkaline hydrolysis પામે છે અને R–NH₂ + K₂CO₃ મળે છે. આ પદ્ધતિ હંમેશા 1° આમિન જ આપે છે અને carbon chain એક કાર્બન ટૂંકી થાય છે.", "tag": ""}, {"q": "આપેલમાંથી કયું કાર્બનિક સંયોજન એમાઈન નથી?", "opts": ["બેન્ઝીન એમિન", "એડ્રેનાલિન", "યૂરિલ", "પ્રોપાન-૧-અાઈન"], "correct": 2, "explain": "યૂરિલ એ અમાઇડ વર્ગનું સંયોજન છે, જેમાં −CONH₂ કાર્યકારી સમૂહ જોવા મળે છે. તેમાં ઓક્સિજન પણ સીધો કાર્બન સાથે જોડાયેલો હોવાથી તેને આમાઈડ શ્રેણીમાં ગણાય છે. બાકીના બધા જ આમાઈન (ઋત્તિક, દ્વિતીયક અથવા તૃતીયક) તરીકે વર્ગીકૃત થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો આમાઈન પાણીમાં સૌથી વધુ વિલીનશીલ છે?", "opts": ["ઈથાનામાઈન", "પ્રોપાનામાઈન", "બ્યુટાનામાઈન", "મેથાનામાઈન"], "correct": 3, "explain": "આમાઈનમાં હાઈડ્રોજન બંધનો સંબંધ હોય છે, જેના કારણે તેઓ પાણીમાં વિલીનશીલ બનતા હોય છે. ઓછા કાર્બન પરમાણુ ધરાવતો આમાઈન વધુ પાણીમાં વિલીનશીલ હોય છે. મેથાનામાઈનમાં ફક્ત એક કાર્બન હોવાથી તે આ બધામાં સૌથી વધુ વિલીનશીલ બને છે.", "tag": ""}, {"q": "વાયુ અવસ્થામાં આમાઈનના સાર્વત્રિક ક્રમ અનુસાર કયો પ્રબળ બેઝિક છે?", "opts": ["તૃતીયક > દ્વિતીયક > પ્રાથમિક", "પ્રાથમિક > દ્વિતીયક > તૃતીયક", "દ્વિતીયક > તૃતીયક > પ્રાથમિક", "તૃતીયક > પ્રાથમિક > દ્વિતીયક"], "correct": 0, "explain": "વાયુ અવસ્થામાં +I (ધન આલ્કીલ અસર) અને સ્ટીરિક અવરોધ ઓછો હોવાથી તૃતીયક આમાઈન સૌથી પ્રબળ બેઝિક બને છે. તેના પછી દ્વિતીયક અને અંતે પ્રાથમિક આમાઈન આવે છે. તેથી બેઝિક સ્વભાવનો ક્રમ તૃતીયક > દ્વિતીયક > પ્રાથમિક રીતે મળે છે.", "tag": ""}, {"q": "હેપન્ટીન (Heptane) ના આમાઈનમાં રૂપાંતર માટે નીચેમાંથી કયા પ્રક્રિયા માધ્યમ વાપરી શકાય?", "opts": ["અાલ્કાઈલ હેલાઈડ સાથે NH₃ ની પ્રક્રિયા", "નીટ્રો સંયોજનનું રિડક્શન", "ઓક્સાઈમનું રિડક્શન", "બધા જ ઉપરોક્ત પદ્ધતિઓ"], "correct": 0, "explain": "હેપ્ટાનામાઈન એ પ્રાથમિક આમાઈન છે જે મુખ્યત્વે હેપ્ટાઈલ હેલાઈડ સાથે NH₃ ની પ્રક્રિયાથી બને છે. આ પ્રક્રિયામાં NH₃ એક ન્યુક્લિયોફાઈલ તરીકે કામ કરીને SN₂ રીતે હેલાઈડનું સ્થાન લે છે. હેપ્ટેન સાથે સીધી પ્રક્રિયા કરીને આમાઈન બનાવી શકાતી નથી.", "tag": ""}, {"q": "કાણ્ચન ઇથર (Cannizzaro પ્રક્રિયામાંથી મળતું) સાથે આમાઈનનું રૂપાંતર કેવી રીતે શક્ય બને છે?", "opts": ["આમાઈનનો સીધો ઉપયોગ કરીને ઇથર બનાવી શકાય છે", "આમાઈનને હેલાઈડ સાથે પ્રક્રિયા કરાવી શકાય", "ડાયઝોટિયમ સાલ્ટની સાથે પ્રક્રિયાથી આમાઈન મળે છે", "આમાઈનને ડાયઝોટિયમ સાલ્ટમાંથી બનાવી શકાય છે"], "correct": 3, "explain": "ડાયઝોટિયમ સાલ્ટના જળવિભાજનથી આલ્કોહોલ મળે છે, જ્યારે કપરો પ્લેટિનમ સાથે પ્રક્રિયા કરાવીને આમાઈન તૈયાર કરી શકાય છે. આ પ્રક્રિયામાં NaNO₂/HCl સાથે એરોમેટિક આમાઈનનું ડાયઝોટાઈઝેશન થઈ શકે છે અને પછી ઉત્પાદિત થતી પ્રક્રિયાઓથી આમાઈન મળી શકે છે. એરોમેટિક પ્રણાલી માટે આ રસ્તો મહત્વપૂર્ણ છે.", "tag": ""}, {"q": "નીચેના મુક્ત મૂળ (free radical) માંથી કયાની સ્થિરતા સૌથી વધુ હોય છે?", "opts": ["CH₃•", "C₂H₅•", "(CH₃)₂CH•", "(CH₃)₃C•"], "correct": 3, "explain": "ટર્શિયરી (3°) મુક્ત મૂળ સૌથી વધુ સ્થિર હોય છે કારણ કે મિથાઈલ સમૂહોની +I અસર અને હોમોએરોમેટિક સહસંયોજકતા (hyperconjugation) થી અયુગ્મિત ઇલેક્ટ્રૉન સ્થિર થાય છે. તેથી tert-butyl મુક્ત મૂળ સૌથી વધુ સ્થિર છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું એમિન છે પરંતુ એમિનો એસિડ ન let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

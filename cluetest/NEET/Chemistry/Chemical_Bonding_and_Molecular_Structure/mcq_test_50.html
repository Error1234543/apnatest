:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;

.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}

  padding:16px;margin-bottom:12px;}

.review-tag.wrong{background:#ffefee;color:#c0392b;}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}

  .palette{grid-template-columns:repeat(5,1fr);}}

<script>
const QUIZ = [{"q": "રસાયણબંધ (Chemical Bond) ની સૌથી મૂળભૂત વ્યાખ્યા કઈ છે?", "opts": ["બે અથવા વધુ પરમાણુઓ વચ્ચે તેમને જોડી રાખતું આકર્ષણ", "ઇલેક્ટ્રોનની આપ-લે પ્રક્રિયા", "એકમોને એકસાથે રાખતું ગુરુત્વાકર્ષણ", "પરમાણુ કક્ષકોનું મિશ્રણ"], "correct": 0, "explain": "રસાયણબંધ એટલે બે કે વધુ પરમાણુઓ વચ્ચેની આકર્ષણક્ષમતા જે તેમને એકીકૃત રચનામાં જોડી રાખે છે. આ આકર્ષણ ઇલેક્ટ્રોસ્ટેટિક બળો દ્વારા ઉદ્ભવે છે અને પરમાણુઓને સ્થિર અણુ બનાવે છે.", "tag": ""}, {"q": "ઓક્ટેટ નિયમ (Octet Rule) નું કયા સ્વરૂપ સાથે સતત સંબંધ છે?", "opts": ["અષ્ટક (Octet) પ્રાપ્ત કરવા માટે પરમાણુ રસાયણબંધ બનાવે છે", "આપેલ પરમાણુ હંમેશા ઈલેક્ટ્રોન ગુમાવે છે", "ધાતુઓ માત્ર ઇલેક્ટ્રોન શોષી શકે છે", "નિષ્ક્રિય ગેસો સરળતાથી પ્રતિક્રિયા આપે છે"], "correct": 0, "explain": "ઓક્ટેટ નિયમ મુજબ પરમાણુઓ રસાયણબંધ બનાવીને પોતાના બહિમુખ્ય કક્ષક (Valence Shell) માં 8 ઇલેક્ટ્રોનનો અષ્ટક સ્થાપિત કરવાનું પ્રયાસ કરે છે, જેથી તેઓ નિષ્ક્રિય ગેસ જેવી સ્થિરતા પ્રાપ્ત કરી શકે.", "tag": ""}, {"q": "નાયટ્રિયમ ક્લોરાઈડ (NaCl) માં રહેલો રસાયણબંધ કઈ પ્રકારનો છે?", "opts": ["આયનીય બંધ (Ionic Bond)", "સહસંયોજક બંધ (Covalent Bond)", "હાઈડ્રોજન બંધ (Hydrogen Bond)", "ધાત્વીય બંધ (Metallic Bond)"], "correct": 0, "explain": "NaCl માં સોડિયમ (Na) એક ઈલેક્ટ્રોન ચૂંટાઈ આપે છે અને ક્લોરીન (Cl) તે પ્રાપ્ત કરે છે. આ ઇલેક્ટ્રોનની આપ-લે દ્વારા Na⁺ અને Cl⁻ આયનો બને છે અને વિદ્યુતસ્થિત આકર્ષણથી આયનીય બંધ રચાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો તત્વ નિષ્ક્રિય ગેસ (Noble Gas) ની ઇલેક્ટ્રોન બિન્યાસ રચના અનુસરે છે?", "opts": ["Neon (Ne) — 1s² 2s² 2p⁶", "ઓક્સિજન (O) — 1s² 2s² 2p⁴", "નાયટ્રોજન (N) — 1s² 2s² 2p³", "ફ્લોરિન (F) — 1s² 2s² 2p⁵"], "correct": 0, "explain": "Neon (Ne) ની ઇલેક્ટ્રોન બિન્યાસ 1s² 2s² 2p⁶ છે, જે 8 ઇલેક્ટ્રોનના અષ્ટક (Octet) સાથે સંપૂર્ણ બહિમુખ્ય કક્ષક દર્શાવે છે. બાકીના તત્વોના બહિમુખ્ય કક્ષક ઈલેક્ટ્રોનની કમી ધરાવે છે અને તેઓ રસાયણબંધ બનાવે છે.", "tag": ""}, {"q": "રસાયણબંધ સર્જાવા પાછળનું મુખ્ય કારણ કયું છે?", "opts": ["પરમાણુઓની ઓછી ઊર્જા અને વધુ સ્થિરતા પ્રાપ્તિ", "ઇલેક્ટ્રોનની સંખ્યા વધારવી", "પરમાણુનું કદ વધારવું", "નાભિકનું આકર્ષણ ઘટાડવું"], "correct": 0, "explain": "રસાયણબંધ સર્જાવાનું મુખ્ય કારણ એ છે કે છૂટા પરમાણુઓની ઊર્જા અંદાજે રહેલા અણુ કરતાં વધુ હોય છે. બંધ બનવાથી પ્રણાલીની ઊર્જા ઘટે છે અને સ્થિરતા વધે છે, જે કુદરતી પ્રક્રિયા દિશામાં થાય છે.", "tag": ""}, {"q": "VSEPR સિદ્ધાંત (VSEPR Theory) મુજબ, કયો અણુ સપાટ ત્રિકોણીય (Planar Triangular) આકાર ધરાવે છે?", "opts": ["BF₃", "NH₃", "H₂O", "CH₄"], "correct": 0, "explain": "BF₃ માં કેન્દ્રીય B પરમાણુ સાથે 3 બંધ યુગ્મ (bond pairs) અને કોઈ એકલ જોડી (lone pair) નથી, તેથી sp² સંકરણ થાય છે અને આકાર સપાટ ત્રિકોણીય થાય છે. NH₃ ખંભાકાર, H₂O ખંભાકાર અને CH₄ ચતુષ્ફલકીય હોય છે.", "tag": ""}, {"q": "એસિટિલિન (C₂H₂) અણુમાં કાર્બન પરમાણુનું સંકરણ (Hybridisation) કયું છે?", "opts": ["sp", "sp²", "sp³", "dsp²"], "correct": 0, "explain": "એસિટિલિન (H−C≡C−H) માં દરેક C પરમાણુ 1 σ બંધ અને 1 π બંધ સહિત 2 સંયોજક જોડી ધરાવે છે, જે sp સંકરણ દર્શાવે છે. sp સંકરણને કારણે C−C≡C ખૂણો 180° અને રેખીય આકાર મળે છે.", "tag": ""}, {"q": "Molecular Orbital Theory (અણુકક્ષા સિદ્ધાંત) મુજબ, O₂⁺ અને O₂⁻ આયનોના બોન્ડ ઓર્ડરનો સાચો ક્રમ કયો છે?", "opts": ["O₂⁺ > O₂ > O₂⁻", "O₂ > O₂⁺ > O₂⁻", "O₂⁻ > O₂ > O₂⁺", "O₂⁺ > O₂⁻ > O₂"], "correct": 0, "explain": "O₂⁺ નો બોન્ડ ઓર્ડર 2.5, O₂ નો 2.0 અને O₂⁻ નો 1.5 થાય છે. O₂⁺ માં 15 इलेक्ट्रॉન (10 BP, 5 AP), O₂ માં 16 (10 BP, 6 AP), O₂⁻ માં 17 (10 BP, 7 AP) હોય છે. ઘટતા BO = (BP − AP)/2, તેથી O₂⁺ > O₂ > O₂⁻.", "tag": ""}, {"q": "Fajan ના નિયમ મુજબ, નીચેનામાંથી કયા સંયોજનમાં સહસંયોજક લક્ષણ (covalent character) સૌથી વધુ છે?", "opts": ["AlCl₃", "NaCl", "KCl", "MgCl₂"], "correct": 0, "explain": "Fajan ના નિયમ મુજબ, નાનું ધન આયન અને મોટું ઋણ આયન હોય તો ધ્રુવીકરણ વધે છે, જેથી સહસંયોજક લક્ષણ વધે છે. Al³⁺ એ Na⁺, Mg²⁺, K⁺ કરતા નાનો અને 3+ charge ધરાવે છે, જેથી AlCl₃ માં સહસંયોજક લક્ષણ સૌથી વધુ છે.", "tag": ""}, {"q": "પાણીના અણુ (H₂O) માં H−O−H બંધ ખૂણો (bond angle) 104.5° થી થોડો ઓછો કેમ છે, જ્યારે sp³ સંકરણના સિદ્ધાંત મુજબ આંતરિક ખૂણો 109°28′ હોવો જોઈએ?", "opts": ["ઓક્સિજન પરની બે એકલ જોડી (lone pairs) સંયુગ્મ જોડીની વિષમ પ્રતિકર્ષણને ક "tag": ""}, {"q": "બેન્ડ બોન્ડ ઓર્ડર (Bond Order) ના આધારે, નીચેનામાંથી કયું કક્ષક (Orbital) સૌથી મજબૂત બંધ ધરાવે છે?", "opts": ["σ1s", "σ*1s", "π2p", "π*2p"], "correct": 0, "explain": "Bond Order = (બંધિંગ ઇલેક્ટ્રોન - એન્ટિબંધિંગ ઇલેક્ટ્રોન)/2. σ1s બંધિંગ કક્ષક છે અને તેનું bond order 1 છે, જે π2p (bond order 1) કરતાં મજબૂત છે કારણ કે તે nucleus ની ખૂબ નજીક છે. σ*1s અને π*2p એન્ટિબંધિંગ કક્ષકો છે.", "tag": ""}, {"q": "VSEPR સિદ્ધાંત મુજબ, BF₃ અણુનો આકાર અને તેનો બંધ ખૂણો કયો છે? (VSEPR સિદ્ધાંત — કોણીય યુગ્મોની ગણતરી)", "opts": ["ત્રિકોણીય સમતલીય (Trigonal planar), 120°", "ચતુષ્ફલકીય (Tetrahedral), 109.5°", "રેખીય (Linear), 180°", "પીરમિડાક્ષ (Pyramidal), 107°"], "correct": 0, "explain": "BF₃ માં બોરોન પર 3 બંધયુગ્મ અને 0 એકલ યુગ્મ હોય છે, તેથી સંકરણ sp² અને આકાર ત્રિકોણીય સમતલીય છે. એવું હોવાથી સૌથી ઓછા વિસ્કર્પણને કારણે બંધ ખૂણો 120° થાય છે.", "tag": ""}, {"q": "H₂O અણુમાં ઓક્સિજન પરમાણુની સંકરણ પ્રકાર અને અણુનો આકાર કયા વિકલ્પમાં સાચો જોડાયેલો છે? (VSEPR — એકલ યુગ્મની અસર)", "opts": ["sp³ સંકરણ, વળાંકદાર (Bent) આકાર, ~104.5°", "sp² સંકરણ, રેખીય આકાર, 180°", "sp³ સંકરણ, ત્રિકોણીય પીરમિડાલ આકાર, 107°", "sp સંકરણ, રેખીય આકાર, 180°"], "correct": 0, "explain": "H₂O માં ઓક્સિજન પર 2 બંધયુગ્મ અને 2 એકલ યુગ્મ હોય છે (કુલ 4), તેથી સંકરણ sp³ થાય છે. VSEPR મુજબ એકલ-એકલ યુગ્મની વિસ્કર્પણ બંધ યુગ્મ કરતા વધુ હોવાથી બંધ ખૂણો 109.5° થી ઘટીને ~104.5° થાય છે અને આકાર વળાંકદાર મળે છે.", "tag": ""}, {"q": "NH₃ અને CH₄ ના બંધ ખૂણાઓની સરખામણી કરો: નીચેનામાંથી કયું વિધાન સાચું છે? (VSEPR — એકલ યુગ્મની અસર), બંનેમાં કેન્દ્રીય પરમાણુ sp³ સંકરિત છે.", "opts": ["CH₄ > NH₃, કારણ કે NH₃ માં એકલ યુગ્મ-બંધ યુગ્મનું વિસ્કર્પણ હોય છે જે ખૂણો ઘટાડે છે", "NH₃ > CH₄, કારણ કે એકલ યુગ્મ હોવાથી ખૂણો વધે છે", "બંને સમાન છે કારણ કે બંને sp³ સંકરિત છે", "CH₄ = NH₃ = 109.5°, કારણ કે એકલ યુગ્મની અસર નગણ્ય છે"], "correct": 0, "explain": "CH₄ માં 4 બંધયુગ્મ + 0 એકલ યુગ્મ હોવાથી ખૂણો 109.5° રહે છે. NH₃ માં 3 બંધયુગ્મ + 1 એકલ યુગ્મ હોવાથી એકલ યુગ્મનું વિસ્કર્પણ બંધ ખૂણાને ઘટાડીને ~107° કરે છે; તેથી CH₄ > NH₃.", "tag": ""}, {"q": "XeF₄ અણુનો આકાર અને સંકરણ પ્રકાર કયો છે? (VSEPR — 5 યુગ્મ કે તેથી વધુ ધરાવતો અણુ)", "opts": ["ચતુષ્ફલકીય સમતલીય (Square planar), sp³d²", "અષ્ટફલકીય (Octahedral), sp³d²", "ત્રિકોણીય બipyramidal, sp³d", "ટેડ (See-saw), sp³d"], "correct": 0, "explain": "XeF₄ માં કેન્દ્રીય Xe પર 4 બંધયુગ્મ અને 2 એકલ યુગ્મ હોય છે (કુલ 6 ઇલેક્ટ્રોન યુગ્મ). સંકરણ sp³d² થાય છે. VSEPR મુજબ 2 એકલ યુગ્મ વિરુદ્ધ દિશાએ (180° પર) આવે છે, જેથી અણુ ચતુષ્ફલકીય સમતલીય (Square planar) આકાર ધરાવે છે.", "tag": ""}, {"q": "CO₂ અણુમાં C પરમાણુનો સંકરણ પ્રકાર અને અણુનો આકાર શું છે? (VSEPR — બહુ-બંધનો સમાવેશ)", "opts": ["sp સંકરણ, રેખીય (Linear) આકાર, 180° બંધ ખૂણો", "sp² સંકરણ, ત્રિકોણીય સમતલીય, 120°", "sp³ સંકરણ, ચતુષ્ફલકીય, 109.5°", "sp³d સંકરણ, અષ્ટફલકીય, 90°"], "correct": 0, "explain": "CO₂ માં C પર 2 σ-બંધ (બંને O સાથે) અને કોઈ એકલ યુગ્મ નથી; બહુ-બંધ (π-બંધ) ને VSEPR માં એક જ ઇલેક્ટ્રોન યુગ્મ ગણવામાં આવે છે. તેથી સંકરણ sp અને આકાર રેખીય, બંધ ખૂણો 180° છે.", "tag": ""}, {"q": "નીચેનામાંથી કયા અણુ/આયન માટે ફોર્મલ ચાર્જ શૂન્ય થાય છે?", "opts": ["H₂O", "NH₄⁺", "CO₃²⁻", "SO₂"], "correct": 0, "explain": "ફોર્મલ ચાર્જ = (બાહ્ય ઇલેક્ટ્રોન) – (બંધ ન હોય તેવા ઇલેક્ટ્રોનનો અડધો + બંધોની સંખ્યા). H₂O માં O પર: 6 – 4 – 2 = 0; બધા પરમાણુઓ પર ફોર્મલ ચાર્જ શૂન્ય છે. બાકીના વિકલ્પોમાં ઓછામાં ઓછા એક પરમાણુ પર ગાયબ ફોર્મલ ચાર્જ હોય છે.", "tag": ""}, {"q": "બંધ લંબાઈના સંદર્ભમાં, નીચેનામાંથી કયો ક્રમ સાચો છે?", "opts": ["C–C > C=C > C≡C", "C≡C > C=C > C–C", "C=C > C–C > C≡C", "C≡C > C–C > C=C"], "correct": 0, "explain": "બંધ ઓર્ડર વધે તથા બંધ લંબાઈ ઘટે છે. એકલ બંધ (C–C, ~154 pm) સૌથી લાંબો, દ્વિબંધ (C=C, ~134 pm) મધ્યમ અને ત્રિબંધ (C≡C, ~120 pm) સૌથી ટૂંકો છે. આથી C–C > C=C > C≡C સાચો અવરોધ છે.", "tag": ""}, {"q": "BF₃ અને NH₃ માં બંધ ખૂણામાં તફાવતની સાચી વ્યાખ્યા કઈ છે?", "opts": ["બંને સમતલીય ત્રિકોણીય હોવાથી બંધ ખૂણા સમાન છે.", "BF₃ માં kēn̄driya parmakāṇu upakēndriya eḍak̲ṭr̥ṇan̄che abhāv kāraṇa ēkaḷī yaugik yugma navasā; NH₃ mañ ēkaḷī yaugik yugma nirkarīyaṇa prasāraṇa śakti vṛddhi thāy aṇu ko bhaṅ kuṇo 107° takghaḍe chhe.", "BF₃ માં ફોસ્ફરસની અપચય ઊર્જા વધુ હોવાથી બંધ ખૂણો ઓછો છે.", "NH₃ અને BF₃ બંનેમાં અષ્ટક પૂરું થતું નથી, તેથી બંધ ખૂણા અમાન્ય છે."], "correct": 1, "explain": "BF₃ માં B પર ઉપકેન્દ્રીય ઇલેક્ટ્રોનયુગ્મ ન હોવાથી તે સમતલીય ત્રિકોણીય (120°) છે. NH₃ માં N પર એકલા યોગ્ય યુગ્મ છે, જે બંધ યુગ્મોને દબાવે છે, તેથી ખૂણો 107° જેટલો ઘટે છે. આમ, બંનેના આકાર અને બંધ ખૂણામાં તફાવત એકલા યુગ્મની ગેરહાજરી/ઉપસ્થિતિ પર આધારિત છે.", "tag": ""}, {"q": "બંધ એન્થાલ્પી (bond enthalpy) ના આધારે, નીચેનામાંથી કયું કોવેલેન્ટ બંધ સૌથી વધુ મજબૂત છે?", "opts": ["N ≡ N", "O = O", "F – F", "Cl – Cl"], "correct": 0, "explain": "ત્રિબંધની બંધ એન્થાલ્પી દ્વિબંધ કે એકલ બંધ કરતાં વધુ હોય છે. N ≡ N ની બંધ એન્થાલ્પી ~946 kJ/mol છે, જે આપેલા વિકલ્પોમાં સૌથી વધુ છે. F–F ની એન્થાલ્પી અસामાન્ય રીતે ઓછી હોય છે કારણ કે એકલા યુગ્મ-ઇલેક્ટ્રોન પ્રતિકર્ષણ બંધને નબળો બનાવે છે.", "tag": ""}, {"q": "NO અણુમાં બંધ ઓર્ડર (bond order) કેટલો છે અને તેનો ચુંબકીય ગુણધર્મ શું છે?", "opts": ["બંધ ઓર્ડર 2.5; ચુંબકીય રીતે પ્રત્યાકર્ષક (diamagnetic)", "બંધ ઓર્ડર 3.0; ચુંબકીય રીતે આકર્ષક (paramagnetic)", "બંધ ઓર્ડર 2.5; ચુંબકીય રીતે આકર્ષક (paramagnetic)", "બંધ ઓર્ડર 1.5; ચુંબકીય રીતે પ્રત્યાકર્ષક (diamagnetic)"], "correct": 2, "explain": "NO માં કુલ 15 ઇલેક્ટ્રોન છે. MO સિદ્ધાંત મુજબ બંધ ઓર્ડર = (10 – 5)/2 = 2.5. એક અયુગ્મિત ઇલેક્ટ્રોન હોવાથી NO ચુંબકીય રીતે આકર્ષક (paramagnetic) છે. આ બે ગુણધર્મો સાથે સુસંગત વિકલ્પ C છે.", "tag": ""}, {"q": "BF₃ અને NH₃ અણુઓની સંકરણ પદ્ધતિ અને અણુ આકારના સંદર્ભમાં, નીચેનામાંથી કયું વિધાન સચોટ છે?", "opts": ["BF₃ માં B પરમાણુ sp² સંક્રિત છે અને અણુ સમતલીય ત્રિકોણીય છે, જ્યારે NH₃ માં N પરમાણુ sp³ સંક્રિત છે અને અણુ દ્વિ-પિરામિડલીય (ترિગોનલ પાયરમિડ) છે.", "બંને અણુઓ sp³ સંક્રિત છે, પરંતુ BF₃ નો આકાર સમતલીય ત્રિકોણીય છે કારણ કે તેના પર કોઈ એકલી ઇલેક્ટ્રોન યુગ્મ નથી.", "BF₃ માં sp³d સંક્રિત બોરોન હોય છે, જ્યારે NH₃ માં sp³ સંક્રિત નાઇટ્રોજન હોય છે અને અણુ સમતલીય છે.", "બંનેમાં મધ્યમ પરમાણુ sp³ સંક્રિત છે, પણ BF₃ સમતલીય ત્રિકોણીય છે કારણ કે d-કક્ષકનો સહभाग થાય છે."], "correct": 0, "explain": "BF₃ માં બોરોન પાસે 3 બંધ યુગ્મ અને 0 એકલ યુગ્મ હોવાથી તે sp² સંક્રિત છે અને સમતલીય ત્રિકોણીય આકાર ધરાવે છે. NH₃ માં નાઇટ્રોજન પાસે 3 બંધ યુગ્મ + 1 એકલ યુગ્મ હોવાથી તે sp³ સંક્રિત છે, પણ એકલ યુગ્મ-બંધ યુગ્મ પ્રતિકર્ષણને કારણે અણુ દ્વિ-પિરામિડલીય બની છે અને બંધ ખૂણો ~107° રહે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયા સંયોગ/આયનમાં મધ્યમ ધાતુ પરમાણુ dsp² સંકરણ ધરાવે છે?", "opts": ["[Ni(CN)₄]²⁻", "[Ni(Cl)₄]²⁻", "[Cu(NH₃)₄]²⁺", "[Fe(CN)₆]³⁻"], "correct": 0, "explain": "[Ni(CN)₄]²⁻ માં Ni²⁺ (3d⁸) સાથે મજબૂત લિગંડ CN⁻ હોવાથી d-ઇલેક્ટ્રોન જોડાયેલા રહે છે અને sp² કક્ષક ખાલી પડે છે, જેથી dsp² સંકરણ થાય છે અને અણુ ચતુષ્ફલકીય નહીં ચતુષ્કોણીય સમતલીય બને છે. [Ni(Cl)₄]²⁻ માં sp³ સંકરણ અને ચતુષ્ફલકીય આકાર હોય છે, જ્યારે [Cu(NH₃)₄]²⁺ પણ dsp² હોવા છતાં વિકૃત ચતુષ્કોણીય સમતલીય છે.", "tag": ""}, {"q": "સંકરણ કક્ષકોની સંખ્યા અને તેના પરિણામી ભૌમિતિક વિન્યાસના સંદર્ભમાં, નીચેના ક્રમમાંથી કયો ક્રમ સચોટ રીતે યોગ્ય સંકરણ પ્રકાર સાથે મેળ ખાય છે?", "opts": ["2 → sp (રેખીય), 3 → sp² (સમતલીય ત્રિકોણીય), 4 → sp³ (ચતુષ્ફલકીય), 5 → sp³d (પાંચ સ્થાનીય બિરામિડલીય), 6 → sp³d² (ષટ્ફલકીય)", "2 → sp² (રેખીય), 3 → sp³ (ત્રિકોણીય), 4 → dsp² (ચતુષ્કોણીય), 5 → sp³d² (પાંચ સ્થાનીય), 6 → sp³d³ (ષટ્ફલકીય)", "2 → sp (સમતલીય), 3 → sp² (ચતુષ્ફલકીય), 4 → sp³ (રેખીય), 5 → sp³d (ચતુષ્કોણીય સમતલીય), 6 → sp³d² (પાંચ સ્થાનીય)", "2 → sp³ (રેખીય), 3 → sp (ત્રિકોણીય), 4 → sp² (ચતુષ્ફલકીય), 5 → sp³d² (રેખીય), 6 → sp³d (ષટ્ફલકીય)"], "correct": 0, "explain": "સંકરણ દરમ્યાન સંક્રિત કક્ષકોની સંખ્યા અનુરૂપ ભૌમિતિક વિન્યાસ નક્કી કરે છે: 2 કક્ષકો sp (રેખીય, 180°), 3 કક્ષકો sp² (સમતલીય ત્રિકોણીય, 120°), 4 કક્ષકો sp³ (ચતુષ્ફલકીય, 109.5°), 5 કક્ષકો sp³d (પાંચ સ્થાનીય બિરામિડલીય), 6 કક્ષકો sp³d² (ષટ્ફલકીય, 90°).", "tag": ""}, {"q": "બે અણુઓ X અને Y માટે જણાય છે કે X માં મધ્યમ પરમાણુ sp³d² સંક્રિત છે અને બે એકલ ઇલેક્ટ્રોન યુગ્મ ધરાવે છે, જ્યારે Y માં sp³d સંક્રિત મધ્યમ પરમાણુ પર એક એકલ યુગ્મ હોય છે. X અને Y ના અણુ આકારો કયા છે?", "opts": ["X: વિકૃત ઓક્તાહેડ્રલ (T-shaped), Y: સમતલીય ત્રિકોણીય", "X: બાયુરામિડલીય, Y: edral), 90°"], "correct": 0, "explain": "મિથેનમાં કાર્બન પાસે 4 બંધ જોડી અને કોઈ એકલ યુગ્મ નથી. તેથી તે sp³ સંકર્ષિત છે અને અણુનો આકાર ચતુષ્ફલકીય (Tetrahedral) રૂપ ધરાવે છે, જેમાં બંધ ખૂણો 109.5° થાય છે.", "tag": ""}, {"q": "H₂O (પાણી) અણુનો વાસ્તવિક બંધ ખૂણો 104.5° છે. આ શુન્ય ખૂણાના સૌથી વધુ ઓછા મૂલ્ય માટે કયું કારણ જવાબદાર છે?", "opts": ["ઓક્સિજન પર ઘણા એકલ યુગ્મ હોવાને કારણે બંધ જોડી-એકલ યુગ્મ વચ્ચેનું પ્રતિકર્ષણ વધે છે", "હાઇડ્રોજનની ઇલેક્ટ્રોનઋણતા ઓછી હોવાથી", "ઓક્સિજન પરમાણુનું સંકર્ષણ sp² હોવાથી", "અણુ રેખીય રચના ધરાવતો હોવાથી"], "correct": 0, "explain": "પાણીમાં ઓક્સિજન પર બે એકલ યુગ્મ હોય છે. VSEPR મુજબ, એકલ યુગ્મ-બંધ જોડીનું પ્રતિકર્ષણ > બંધ જોડી-બંધ જોડીનું પ્રતિકર્ષણ હોવાથી O–H બંધો વચ્ચેનો ખૂણો 109.5° થી ઓછો થઈને 104.5° રહે છે.", "tag": ""}, {"q": "NH₃ (એમોનિયા) અને CH₄ બંને sp³ સંકર્ષિત છે છતાં તેમના બંધ ખૂણા અલગ અલગ છે. NH₃ માં બંધ ખૂણો 107° જેટલો અનુભવાય તેનું કારણ કયું છે?", "opts": ["નાઇટ્રોજન પર એક એકલ યુગ્મ હોવાથી બંધ જોડીઓ પર દબાણ થાય છે", "NH₃ માં હાઇડ્રોજન બંધ રચાય છે", "નાઇટ્રોજન sp² સંકર્ષિત હોય છે", "NH₃ અણુ સમતલીય ત્રિકોણાકાર હોય છે"], "correct": 0, "explain": "NH₃ માં નાઇટ્રોજન પર એક એકલ યુગ્મ હોય છે, જે બંધ જોડીઓ કરતાં વધુ વિસ્તાર ધરાવે છે. પરિણામે તે બંધ જોડીઓને નજીક દબાવે છે, જેથી H–N–H બંધ ખૂણો 109.5° થી ઘટીને લગભગ 107° રહે છે.", "tag": ""}, {"q": "BF₃ અણુનો આકાર શું છે અને તે VSEPR મોડેલ મુજબ કેવી રીતે વર્ણવી શકાય?", "opts": ["સમતલીય ત્રિકોણાકાર (Trigonal planar), બંધ ખૂણો 120°", "ત્રિકોણાકાર પિરામિડ (Trigonal pyramidal), ખૂણો 107°", "અષ્ટફલકીય (Octahedral), ખૂણો 90°", "T-આકાર (T-shaped), ખૂણા 90° અને 120°"], "correct": 0, "explain": "BF₃ માં બોરોન પર કોઈ એકલ યુગ્મ નથી, ફક્ત 3 બંધ જોડીઓ છે. તે sp² સંકર્ષિત છે અને VSEPR મુજબ ત્રણેય ફ્લોરીન પરમાણુઓ સમતલમાં 120° ખૂણે ગોઠવાય છે, જેથી અણુ સમતલીય ત્રિકોણાકાર (Trigonal planar) બને છે.", "tag": ""}, {"q": "હન્ટ-પોલિંગ (Hann-Pauling) સમીકરણ મુજબ, જ્યારે બે અલગ-અલગ તત્વો X અને Y વચ્ચે ઇલેક્ટ્રોનેગેટિવિટી તફાવત મહત્તમ હોય, ત્યારે તેમના વચ્ચે રચાતા રાસાયણિક બંધનું પ્રકાર શું હશે અને તેના પરિણામે આયનીય બંધનું સ્વરૂપ શું મળે છે?", "opts": ["ઇલેક્ટ્રોન સંયુગ્મની ગૂંથણ થાય છે અને સંયોજન સંયોજકતા બંધ ધરાવે છે", "ઇલેક્ટ્રોનનું સંપૂર્ણ સ્થાનાંતરણ થાય છે, જેનાથી ધન અને ઋણ આયનો બને છે", "બંધ ઇલેક્ટ્રોન સમાન રીતે વહેંચાય છે, આથી બંધ સમધ્રુવીય કોવેલન્ટ બને છે", "ઇલેક્ટ્રોન પૂર્ણાંશ માત્રામાં વહેંચાવાની શક્યતા મળે છે, આથી બંધ અધ્રુવીય કોવેલન્ટ બને છે"], "correct": 1, "explain": "જ્યારે બે તત્વોની ઇલેક્ટ્રોનેગેટિવિટીમાં મોટો તફાવત હોય, ત્યારે ઇલેક્ટ્રોનનું સંપૂર્ણ સ્થાનાંતરણ થાય છે. આ પ્રક્રિયા દ્વારા ધન અને ઋણ આયનો બને છે અને તેમના વચ્ચે ઇલેક્ટ્રોસ્ટેટિક આકર્ષણથી આયનીય બંધ રચાય છે.", "tag": ""}, {"q": "અણુ સંકરણના સંદર્ભમાં, નીચેનામાંથી કયો અણુ sp3d2 સંકરણ ધરાવે છે અને તેનું ભૌમિતિક વિકાસ વર્ણન કરે છે?", "opts": ["SF6 સંયોજનમાં સંકરણ sp3 હોય છે અને તે ટેટ્રાહેડ્રલ આકાર ધરાવે છે", "PCl5માં સંકરણ sp3d હોય છે અને તે સમતલીય ત્રિકોણાકાર આકાર ધરાવે છે", "IF5માં સંકરણ sp3d2 હોય છે અને તે પિરામિડલ આકાર ધરાવે છે", "XeF4માં સંકરણ sp3d2 હોય છે અને તે ચતુષ્ફલકીય (octahedral) આકાર ધરાવે છે"], "correct": 3, "explain": "XeF4 માં ક્ષેત્રનાં 6 સંયુગ્મ (4 બંધ અને 2 એકલ) હોવાથી sp3d2 સંકરણ જરૂરી છે. VSEPR મુજબ, સમઘન આકારમાં વિસ્થાપન બાદ, બે એકલ જોડો વિરુદ્ધ દિશામાં હોવાથી અણુ સમતલીય ચતુષ્કોણ (square planar) બને છે, ન કે ચતુષ્ફલકીય.", "tag": ""}, {"q": "M.O.T ( Molecular Orbital Theory) મુજબ, નીચેનામાંથી કયો ક્રમ અણુકાર્બનિક બંધની સ્થિરતા સાથે સંબંધિત છે?", "opts": ["N2 < O2 < F2", "F2 < O2 < N2", "O2 < N2 < F2", "N2 < F2 < O2"], "correct": 1, "explain": "M.O.T મુજબ, બંધ ક્રમ (Bond order) વધતાં સ્થિરતા વધે છે. N2નો બંધ ક્રમ 3 છે, O2નો 2 છે, અને F2નો 1 છે. તેથી બંધ સ્થિરતા F2 < O2 < N2 ક્રમમાં હોય છે.", "tag": ""}, {"q": "VSEPR મોડેલ મુજબ, H2S અણુનું આકાર શું છે અને તેના બંધ ખૂણા (bond angle)ની અંદાજિત કિંમત કેટલી થાય છે?", "opts": ["રેખીય આકાર અને બંધ ખૂણો 180°", "સમતલીય ત્રિકોણાકાર આકાર અને બંધ ખૂણો 120°", "બેન્ડ (Bent) અથવા વળેલો આકાર અને બંધ ખૂણો 92°", "ચતુષ્ફલકીય આકાર અને બંધ ખૂણો 109.5°"], "correct": 2, "explain": "H2S માં કેન્દ્રીય S પરमाणુ સાથે બે બંધ જોડો અને બે એકલ જોડો છે. VSE function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

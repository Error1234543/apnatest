<script>
const QUIZ = [{"q": "ઓક્ટેટ નિયમ (Octet Rule) મુજબ પરમાણુ બંધ બનાવતી વખતે બાહ્યતમ કક્ષકમાં કેટલા ઇલેક્ટ્રોન હોવાનું અપેક્ષિત છે?", "opts": ["8", "2", "18", "32"], "correct": 0, "explain": "ઓક્ટેટ નિયમ મુજબ, પરમાણુ સ્થિરતા માટે બાહ્યતમ કક્ષક (વેલેન્સ શેલ) માં 8 ઇલેક્ટ્રોન હોવા જોઈએ. આ નિયમ મુખ્યત્વે નોબલ ગેસની ઇલેક્ટ્રોનિક ગોઠવણી પર આધારિત છે.", "tag": ""}, {"q": "આયનીય બંધ (Ionic Bond) ની રચના કયા પ્રકારની પ્રક્રિયા દ્વારા થાય છે?", "opts": ["ઇલેક્ટ્રોનના સ્થાનાંતરણથી", "ઇલેક્ટ્રોનની સામાન્ય જોડીના ઉપયોગથી", "ઇલેક્ટ્રોન સમુદ્ર મોડેલ દ્વારા", "હાઇડ્રોજન બંધ દ્વારા"], "correct": 0, "explain": "આયનીય બંધ એક પરમાણુ દ્વારા ઇલેક્ટ્રોનનું સ્થાનાંતરણ (transfer) થવાથી બને છે. જે પરમાણુ ઇલેક્ટ્રોન ગુમાવે છે તે ધન આયન (કેટાયન) બને છે અને જે ઇલેક્ટ્રોન મેળવે છે તે ઋણ આયન (એનાયન) બને છે.", "tag": ""}, {"q": "સોડિયમ (Na, પરમાણુ ક્રમાંક 11) નો લુઇસ ડોટ સંકેત (Lewis Dot Symbol) કયો છે?", "opts": ["Na·", ":Na:", "Na:", "·Na·"], "correct": 0, "explain": "સોડિયમનો પરમાણુ ક્રમાંક 11 છે અને તેની બાહ્યતમ કક્ષક (3s¹) માં 1 વેલેન્સ ઇલેક્ટ્રોન છે. તેથી લુઇસ ડોટ સંકેતમાં Na ની આસપાસ 1 ડોટ દર્શાવવામાં આવે છે: Na·", "tag": ""}, {"q": "ક્લોરિન પરમાણુ (Cl, પરમાણુ ક્રમાંક 17) Cl⁻ આયન બનાવે ત્યારે તે કેટલા ઇલેક્ટ્રોન મેળવે છે?", "opts": ["1", "2", "3", "7"], "correct": 0, "explain": "ક્લોરિન (17) ની ઇલેક્ટ્રોનિક ગોઠવણી 2,8,7 છે. તેને ઓક્ટેટ પૂર્ણ કરવા માટે 1 ઇલેક્ટ્રોન મેળવવો પડે છે, જેથી Cl⁻ આયન (2,8,8) બને છે.", "tag": ""}, {"q": "નીચેમાંથી કયો યોગ્ય રીતે આયનીય સંયોજન દર્શાવે છે?", "opts": ["NaCl", "HCl", "CH₄", "O₂"], "correct": 0, "explain": "NaCl એ સોડિયમ (ધાતુ) અને ક્લોરિન (અધાતુ) વચ્ચેનો આયનીય બંધ છે. Na ઇલેક્ટ્રોન ગુમાવી Na⁺ બને છે અને Cl ઇલેક્ટ્રોન મેળવી Cl⁻ બને છે. બાકીના વિકલ્પો સહસંયોજક બંધ ધરાવે છે.", "tag": ""}, {"q": "N₂ અણુની લુઇસ સંરચના (Lewis Structure) માં નાઇટ્રોજન પરમાણુઓ વચ્ચેનું બંધ અને દરેક નાઇટ્રોજન પર રહેલા અબંધકારી ઇલેક્ટ્રોનયુગ્મ (lone pair) ની સંખ્યા કઈ હોય છે?", "opts": ["ત્રિબંધ અને દરેક પર 1 અબંધકારી ઇલેક્ટ્રોનયુગ્મ", "દ્વિબંધ અને દરેક પર 2 અબંધકારી ઇલેક્ટ્રોનયુગ્મ", "એકબંધ અને દરેક પર 3 અબંધકારી ઇલેક્ટ્રોનયુગ્મ", "ત્રિબંધ અને દરેક પર 2 અબંધકારી ઇલેક્ટ્રોનયુગ્મ"], "correct": 0, "explain": "નાઇટ્રોજન (Z = 7) ની ઇલેક્ટ્રોનિક વિન્યાસ 1s² 2s² 2p³ છે. બંને N પરમાણુઓ વચ્ચે ત્રિસહસંયોજક બંધ (N≡N) બને છે અને દરેક N પર 1 અબંધકારી ઇલેક્ટ્રોનયુગ્મ રહે છે, જેથી દરેક N પાસે 8 ઇલેક્ટ્રોનનો ઓક્ટેટ પૂરો થાય.", "tag": ""}, {"q": "O₂ અણુ માટે આણ્વીય કક્ષક (Molecular Orbital) વિન્યાસ મુજબ બંધ ક્રમ (Bond Order) કેટલો થાય?", "opts": ["2", "1", "3", "1.5"], "correct": 0, "explain": "O₂ માં કુલ 16 ઇલેક્ટ્રોન છે. આણ્વીય કક્ષક વિન્યાસ મુજબ બંધકારી ઇલેક્ટ્રોન (Nb) = 10 અને અબંધકારી ઇલેક્ટ્રોન (Na) = 6. બંધ ક્રમ = (Nb − Na)/2 = (10 − 6)/2 = 2.", "tag": ""}, {"q": "નીચેનામાંથી કયા અણુમાં બંધ કોણ (Bond Angle) સૌથી ઓછો છે?", "opts": ["NH₃", "CH₄", "H₂O", "BF₃"], "correct": 2, "explain": "VSEPR સિદ્ધાંત મુજબ H₂O માં ઓક્સિજન પર 2 અબંધકારી ઇલેક્ટ્રોનયુગ્મ હોવાથી બંધકારી-અબંધકારી ઇલેક્ટ્રોનયુગ્મ વચ્ચેનું અપાકર્ષણ વધુ થાય છે, જેથી H−O−H બંધ કોણ ~104.5° સુધી ઘટી જાય છે. NH₃ (~107°), CH₄ (109.5°) અને BF₃ (120°) કરતાં તે સૌથી ઓછો છે.", "tag": ""}, {"q": "બંધ વિઘટન એન્થાલ્પી (Bond Dissociation Enthalpy) ના સંદર્ભમાં નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["N≡N ની બંધ વિઘટન એન્થાલ્પી O=O કરતાં વધારે છે", "O=O ની બંધ વિઘટન એન્થાલ્પી N≡N કરતાં વધારે છે", "બંધ વિઘટન એન્થાલ્પી બંધ ક્રમથી સ્વતંત્ર છે", "F−F ની બંધ વિઘટન એન્થાલ્પી Cl−Cl કરતાં વધારે છે"], "correct": 0, "explain": "N₂ માં ત્રિબંધ હોવાથી તેની બંધ વિઘટન એન્થાલ્પી (~946 kJ/mol) O₂ ના દ્વિબંધ (~498 kJ/mol) કરતાં ઘણી વધારે છે. F−F ની બંધ વિઘટન એન્થાલ્પી Cl−Cl કરતાં ઓછી છે કારણ કે ફ્લોરિનના નાના આકારને કારણે અબંધકારી ઇલેક્ટ્રોનયુગ્મ વચ્ચેનું અપાકર્ષણ વધુ હોય છે.", "tag": ""}, {"q": "નીચેમાંથી કયું યોગ્ય રીતે H₂O અણુની VSEPR મુજબની આકૃતિ અને બંધકોણ દર્શાવે છે?", "opts": ["કોણીય (Bent), બંધકોણ ≈ 104.5°", "રેખીય (Linear), બંધકોણ 180°", "ચતુષ્ફલકીય (Tetrahedral), બંધકોણ 109.5°", "ત્રિકોણીય સમતલીય (Trigonal planar), બંધકોણ 120°"], "correct": 0, "explain": "H₂O અણુમાં ઓક્સિજન પર 2 બંધયુગ્મ અને 2 એકલ યુગ્મ (lone pairs) છે. VSEPR સિદ્ધાંત મુજબ ચતુષ્ફલકીય ઇલેક્ટ્રોન ગોઠવણીમાંથી બે સ્થાન એકલ યુગ્મ લે છે, જેથી અણુની આકૃતિ કોણીય (Bent) બને છે અને બંધકોણ 109.5° થી ઘટીને ≈ 104.5° થાય છે. એકલ યુગ્મ-બંધયુગ્મ પ્રતિકર્ષણ બંધકોણ ઘટાડે છે.", "tag": ""}, {"q": "અણ્વીય કક્ષક સિદ્ધાંત (Molecular Orbital Theory) મુજબ, નીચેનામાંથી કયા અણુનું બંધ ક્રમ (Bond Order) 2.5 છે અને તે અનુચંબકીય (Paramagnetic) પ્રકૃતિ ધરાવે છે?", "opts": ["O2", "N2+", "NO", "O2+"], "correct": 2, "explain": "NO માં કુલ 15 ઇલેક્ટ્રોન છે. તેનો કક્ષક વિન્યાસ (σ1s)²(σ*1s)²(σ2s)²(σ*2s)²(σ2pz)²(π2px²=π2py²)(π*2px¹) મુજબ બંધ કક્ષકોમાં 10 અને વિબંધ કક્ષકોમાં 5 ઇલેક્ટ્રોન હોવાથી બંધ ક્રમ = (10-5)/2 = 2.5 થાય છે. આમાં એક અયુગ્મિત ઇલેક્ટ્રોન હોવાથી તે અનુચંબકીય છે. N2+ નું બંધ ક્રમ 2.5 છે પણ તે યુગ્મિત ઇલેક્ટ્રોન વગરનું છે તેથી પરમાગ્નેટિક છે.", "tag": ""}, {"q": "VSEPR મૉડેલ મુજબ, XeO2F2 અણુમાં ક્ષેપકેન્દ્ર (Central atom) શુદ્ધ સંક્રમણ (Hybridisation) keno અને અણુની આકૃતિ કઈ છે?", "opts": ["sp3d, સમતલીય (Planar)", "sp3, ત્રિકોણીય પિરામિડ", "sp3d, વીંધવાળો ત્રિકોણ (See-saw)", "dsp2, ચતુષ્ફલકીય"], "correct": 0, "explain": "XeO2F2 માં Xe પર કુલ 8 વેલેન્સ ઇલેક્ટ્રોન છે. 2 O સાથે દ્વિબંધ (બે જોડ) અને 2 F સાથે એકબંધ (બે જોડ) બનાવે છે, plus 1 એકલ જોડ (Lone pair) બાકી રહે છે. કુલ ઇલેક્ટ્રોન ડોમેન = 5 (2 બંધિત + 2 બંધિત + 1 એકલ) → sp3d સંક્રમણ. પંચકોણીય પираમિડ (Trigonal bipyramidal) ભૌમિતિક રચનામાં એકલ જોડ સમઘનીય (Equatorial) સ્થાન પર જાય છે. O–Xe–O અને F–Xe–F બંધ કોણો સમતલમાં રહે છે તેથી અણુ સમતલીય (Planar) દેખાય છે.", "tag": ""}, {"q": "Fajan's નિયમો મુજબ, નીચેનામાંથી કયો સંયોજન સૌથી વધુ સહસંયોજક (Covalent) લક્ષણ ધરાવે છે?", "opts": ["NaCl", "MgCl2", "AlCl3", "KCl"], "correct": 2, "explain": "Fajan ના નિયમ મુજબ, ધન આયનનું ક્ષેત્રફળ (size) જ્યારે નાનું અને વિદ્યુતભાર વધારે હોય તો તે ઋણ આયનનું ઇલેક્ટ્રોન ઘનત્વ વિકૃત (Polarise) કરે છે, જેથી આયનિક બંધમાં સહસંયોજક લક્ષણ વધે છે. Al³⁺ માં સૌથી વધુ વિદ્યુતભાર (+3) અને સૌથી નાનું ક્ષેત્રફળ હોવાથી AlCl3 સૌથી વધુ સહસંયોજક પ્રકૃતિ ધરાવે છે, જ્યારે Na⁺, K⁺ ના બંધ ઓછા વિદ્યુતભારિત અને મોટા હોવાથી તેના હેલાઇડ વધુ આયનિક છે.", "tag": ""}, {"q": "બેન્ઝીન (Benzene) માં રેઝોનેન્સ (Resonance) ને કારણે કયા અણુમાં સમાન કાર્બન-કાર્બન બંધ લંબાઈ જોવા મળે છે?", "opts": ["C-C બંધ લંબાઈ બંને પ્રકારે સમાન છે", "બધા C-C બંધ લંબાઈ સમાન પણ એક બેન્ડ (bond) લાંબા અને બીજા ટૂંકા છે", "C=C દ્વિબંધ વધુ લાંબો અને C–C એકબંધ ટૂંકો છે", "C–C એકબંધ લાંબો અને C=C દ્વિબંધ ટૂંકો છે"], "correct": 0, "explain": "બેન્ઝીનમાં રેઝોનેન્સ અનુનાદ (Resonance) ને કારણે બધા છ ઇલેક્ટ્રોન π-બંધ પ્રણાલીમાં સમાનરૂપે વિસ્થાપિત (Delocalised) થાય છે. પરિણામે, બધા કાર્બન–કાર્બન બંધ લંબાઈ સમાન (139 pm) હોય છે, જે C–C એકબંધ (154 pm) કરતા ટૂંકી અને C=C દ્વિબંધ (134 pm) કરતા લાંબી છે. તેથી, બેન્ઝીનમાં કોઈ યથાવત એકબંધ અથવા દ્વિબંધ નથી હોતો, પણ મધ્યમ અવસ્થાનો બંધ હોય છે.", "tag": ""}, {"q": "હાઇડ્રોજન બંધ (Hydrogen Bonding) ની સંભાવના કઈ જોડમાં સૌથી વધુ છે?", "opts": ["H2O અને CH4", "NH3 અને HF", "CH4 અને H2S", "H2S અને HI"], "correct": 1, "explain": "હાઇડ્રોજન બંધ માટે હાઇડ્રોજન સાથે જોડાયેલો પરમાણુ ઉચ્ચ વિદ્યુતઋણ (Electronegative) અને નાનું ક્ષેત્રફળ ધરાવતો હોવો જોઈએ – સામાન્ય રીતે N, O અથવા F. NH3 અને HF બંનેમાં હાઇડ્રોજન યુકત N–H અને H–F બંધ હોવાથી તેમાં પ્રબળ આંતરઅણ્વીય હાઇડ્રોજન બંધ રચાય છે. CH4, H2S, HI માં હાઇડ્રોજન S, I સાથે જોડાયેલો છે જે પૂરતો વિદ્યુતઋણ નથી હોતો તેથી હાઇડ્રોજન બંધ બની શકતો નથી.", "tag": ""}, {"q": "નીચેમાંથી કયા અણુમાં કેન્દ્રીય પરમાણુ sp³ સંકરીકરણ દર્શાવે છે?", "opts": ["CO₂", "BF₃", "CH₄", "C₂H₄"], "correct": 2, "explain": "CH₄ માં કાર્બન પરમાણુ sp³ સંકરીકરણ ધરાવે છે, જે ચાર સમાન સિગ્મા બંધ બનાવે છે અને મેથેનની ચતુષ્ફલકીય રચના સમજાવે છે.", "tag": ""}, {"q": "પાય બંધ (π bond) વિશે નીચેનું કયાક્તય સાચું છે?", "opts": ["તે સિગ્મા બંધ કરતાં વધુ પ્રબળ હોય છે.", "તે પરમાણુઓના કેન્દ્રો મધ્યે રેખા પર અતિપાત થવાથી બને છે.", "તે પાર્શ્વિક સમપ્રમાણી અતિપાતથી બને છે.", "તે ફક્ત એકલ બંધમાં જ હોય છે."], "correct": 2, "explain": "પાય બંધ પાર્શ્વિક સમપ્રમાણી અતિપાત થયેલા p આર્બિટલ્સ દ્વારા બને છે અને તે સિગ્મા બંધ કરતાં નબળું હોય છે.", "tag": ""}, {"q": "કયું બંધ લંબાઈમાં સૌથી ટૂંકું છે?", "opts": ["sp³-sp³ C-C બંધ", "sp²-sp² C=C બંધ", "sp-sp C≡C બંધ", "sp³-sp² C-C બંધ"], "correct": 2, "explain": "sp-સંકરીકૃત કાર્બનમાં s-લક્ષણ વધુ હોવાથી બંધ ટૂંકું અને પ્રબળ હોય છે. C≡C ત્રિબંધમાં sp-sp અતિપાત થાય છે અને લંબાઈ સૌથી ઓછી હોય છે.", "tag": ""}, {"q": "BF₃ અણુમાં B પરમાણુનું સંકરીકરણ શું છે?", "opts": ["sp", "sp²", "sp³", "sp³d"], "correct": 1, "explain": "BF₃ માં B પરમાણુ પાસે ત્રણ સંયોજક ઇલેક્ટ્રોન હોય છે અને તે ત્રણ sp² સંકરીકૃત આર્બિટલ્સ બનાવે છે, જેથી અણુ સમતલીય ત્રિકોણીય બને છે.", "tag": ""}, {"q": "સંકરીકરણની શરતોમાંથી કઈ સાચી નથી?", "opts": ["સમાન ઊર્જા ધરાવતા આર્બિટલ્સનું મિશ્રણ.", "સંકરીકૃત આર્બિટલ્સની સંખ્યા મૂળ આર્બિટલ્સની સંખ્યા કરતાં વધુ હોય છે.", "સંકરીકરણ થયા પછી પણ ઊર્જા સમાન રહે છે.", "સંકરીકૃત આર્બિટલ્સની દિશાત્મકતા બદલાય છે."], "correct": 1, "explain": "સંકરીકરણમાં મૂળ આર્બિટલ્સની સંખ્યા અને સંકરીકૃત આર્બિટલ્સની સંખ્યા સમાન હોય છે, વધુ નહીં. બાકીના વિકલ્પો સાચા છે.", "tag": ""}, {"q": "મોલેક્યુલર ઑર્બિટલ થિયરી (MOT) મુજબ, H₂⁺ આયનનો બંધ ક્રમ (Bond Order) શું છે?", "opts": ["1", "0.5", "1.5", "0"], "correct": 1, "explain": "H₂⁺ માં કુલ ઇલેક્ટ્રોન = 1. તે સિગમા-1s (σ₁s) બંધકારક મોલેક્યુલર ઑર્બિટલમાં રહે છે. σ*₁s ઍન્ટિબંડિંગ ઑર્બિટલ ખાલી છે. તેથી, બંધ ક્રમ = (બંધકારક ઇલેક્ટ્રોન − એન્ટિબંડિંગ ઇલેક્ટ્રોન) / 2 = (1 − 0) / 2 = 0.5.", "tag": ""}, {"q": "નીચેનામાંથી કયા કણની MOT મુજમ કોઈ સ્થિર અસ્તિત્વ નથી?", "opts": ["He₂", "He₂⁺", "H₂", "H₂⁻"], "correct": 0, "explain": "He₂ માં કુલ 4 ઇલેક્ટ્રોન હોય છે. તેના બે ઇલેક્ટ્રોન σ₁s (બંધકારક) માં અને બે ઇલેક્ટ્રોન σ*₁s (એન્ટિબંડિંગ) માં હોય છે. બંધ ક્રમ = (2 − 2) / 2 = 0 હોવાથી, He₂ અસ્થિર છે અને તેનું અસ્તિત્વ નથી. He₂⁺, H₂ અને H₂⁻ બધામાં ધન બંધ ક્રમ હોવાથી તેઓ અસ્તિત્વ ધરાવે છે.", "tag": ""}, {"q": "O₂ અણુ MOT મુજબ કયો ગુણધર્મ દર્શાવે છે?", "opts": ["તે ડાયમેગ્નેટિક છે", "તે પેરામેગ્નેટિક છે", "તેનો બંધ ક્રમ 2 છે", "તેનો બંધ ક્રમ 3 છે"], "correct": 1, "explain": "O₂ માં કુલ 16 ઇલેક્ટ્રોન હોય છે. તેના π*₂pₓ અને π*₂pᵧ ઍન્ટિબંડિંગ ઑર્બિટલમાં દરેકમાં એક-એક અયુગ્મિત (unpaired) ઇલેક્ટ્રોન હોય છે. એક અયુગ્મિત ઇલેક્ટ્રોન let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>

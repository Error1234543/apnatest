<script>
const QUIZ = [{"q": "રસાયણિક બંધની સૌથી પ્રબળ ક્રિયાશીલતા કઈ છે?", "opts": ["ઇલેક્ટ્રોસ્ટેટિક આકર્ષણ (સ્થિરવિદ્યુત આકર્ષણ)", "હેડ્રોજન બંધ", "વન ડર્ વાલ્સ આકર્ષણ", "ડાયપોલ-ડાયપોલ ક્રિયા"], "correct": 0, "explain": "આયનીય બંધમાં ધન અને ઋણ આયનો વચ્ચેની સ્થિરવિદ્યુત આકર્ષણ ક્રિયાશીલતા (ઇલેક્ટ્રોસ્ટેટિક attraction) જ બંધ માટે મુખ્ય હોય છે, જે બધી રસાયણિક બંધોમાં સૌથી પ્રબળ ગણાય છે.", "tag": ""}, {"q": "બંધ લંબાઈ (Bond Length) નો અર્થ સરળ શબ્દોમાં શું થાય?", "opts": ["બે પરમાણુઓના કેન્દ્રો વચ્ચેનું સંતુલન અંતર", "એક બંધ તોડવામાં જરૂરી ઊર્જા", "દ્વિ-પરમાણ્વીય આણ્વીયમાં ઇલેક્ટ્રોનનો કોણ", "કક્ષકોના સંપાતનની સંખ્યા"], "correct": 0, "explain": "બંધ લંબાઈ એ બે પરમાણુઓના核 (કેન્દ્ર) વચ્ચેનું સંતુલન અંતર છે, એટલે કે જ્યારે બંધ બનતાં એક દૂર જાય તે અંતર.", "tag": ""}, {"q": "કયા યોગિકમાં K⁺ અને Cl⁻ આયનો વચ્ચે આયનીય બંધ મળે?", "opts": ["KCl", "HCl", "NaCl", "MgCl₂"], "correct": 0, "explain": "KCl માં પોટેશિયમ (વિધુત ધનતર) ચાર્જ +1 અને ક્લોરિન (વિધુત ઋણતર) ચાર્જ −1 ધરાવે છે, જેથી K⁺ અને Cl⁻ આયનો વચ્ચે આયનીય બંધ રચાય છે.", "tag": ""}, {"q": "બંધ ક્રમ (Bond Order) 3 હોય તેવો આણ્વીય ઉદાહરણ કયું?", "opts": ["N₂", "O₂", "H₂", "F₂"], "correct": 0, "explain": "N₂ માં નાઇટ્રોજન પરમાણુઓ વચ્ચે ત્રિ-બંધ હોય છે, એટલે કે બંધ ક્રમ 3 છે. H₂ = 1, O₂ = 2, F₂ = 1.", "tag": ""}, {"q": "ઓક્ટેટ નિયમનો સારાંશ કયો વાક્ય સાચું દર્શાવે છે?", "opts": ["પરમાણુઓ બંધ બનાવતાં યોગ્ય ઇલેક્ટ્રોન ગોઠવણી (આવર્ત કોષ્ટકના નિષ્ક્રિય વાયુ જેવી) મેળવવાની રચના થાય છે.", "સૌથી વધુ ઇલેક્ટ્રોનવાળું પરમાણુ હંમેશા આયનીય બંધ બનાવે.", "બધા જ પરમાણુઓ બંધ બનાવતી વખતે સમાન ઇલેક્ટ્રોન ગોઠવણી દર્શાવે.", "ઓક્ટેટ નિયમ હંમેશા બધા જ અણુઓ પર સચોટ રીતે લાગુ પડે."], "correct": 0, "explain": "ઓક્ટેટ નિયમ મુજબ, પરમાણુઓ બંધ બનાવવાથી મુખ્યપટલમાં 8 ઇલેક્ટ્રોનની સ્થિર ગોઠવણી (નિષ્ક્રિય વાયુ જેવી) મેળવવાનો પ્રયાસ કરે છે; બિન-લોહી સામાન્ય રીતે સહસંયોજક, ધાતુઓ આયનીય બંધ બનાવે.", "tag": ""}, {"q": "વેલેન્સ બોન્ડ થિયરી (Valence Bond Theory) અનુસાર, દ્વિ-બંધ (double bond) માં કયા પ્રકારના ઓર્બિટલ્સનો સમાવેશ થાય છે?", "opts": ["એક સિગ્મા (σ) બંધ અને એક પાઈ (π) બંધ", "બે સિગ્મા (σ) બંધ", "એક સિગ્મા (σ) બંધ અને બે પાઈ (π) બંધ", "બે પાઈ (π) બંધ"], "correct": 0, "explain": "વેલેન્સ બોન્ડ થિયરી મુજબ, દ્વિ-બંધમાં હંમેશા એક સિગ્મા (σ) બંધ અને એક પાઈ (π) બંધ હોય છે. સિગ્મા બંધ ઓર્બિટલ્સની અક્ષને નજીક આવેલી રીતે અધિકારી ભૂમિકામાં સંપૂર્ણ અ披ધ્ય (head-on overlap) થવાથી બને છે, જ્યારે પાઈ બંધ બાજુવાળા પેરાલલ p-ઓર્બિટલ્સના પરસ્પર અ披ધ્ય થવાથી ઉદ્ભવે છે.", "tag": ""}, {"q": "અણુઓના આકાર (molecular geometry) વિશે વેલેન્સ શેલ એલિયેટ પેર રિપલ્ઝન (VSEPR) થિયરીનું મૂળભૂત તર્ક શું છે?", "opts": ["વેલેન્સ શેલમાં રહેલા બંધ પેર અને લોન પેર (લોન ઇલેક્ટ્રોન જોડાં) એકબીજાથી દૂર રહેવા પ્રયત્ન કરે છે, જેથી વિકર્ષણ (repulsion) લઘુત્તમ થાય", "ઇલેક્ટ્રોન યુગ્મો હંમેશા ચાર કોણીય ગોઠવણી ધરાવે છે", "લોન પેર અને બંધ પેર વચ્ચે કોઈ અસર નથી", "કેવલ બંધ પેર જ અણુના આકાર નક્કી કરે છે, લોન પેર અસરહીન છે"], "correct": 0, "explain": "VSEPR થિયરીનું મૂળ સિદ્ધાંત એ છે કે કેન્દ્રીય પરમાણુની આસપાસના ઇલેક્ટ્રોન યુગ્મો (બંધ પેર અને લોન પેર બંને) પરસ્પર વિદ્યુતસ્થિતિક વિકર્ષણ (electrostatic repulsion) અનુભવે છે, તેથી તેઓ એવી રીતે ગોઠવાય છે કે આ વિકર્ષણ લઘુત્તમ થાય. લોન-લોન પેર વિકર્ષણ > લોન-બંધ પેર > બંધ-બંધ પેર ક્રમ મુજબ તીવ્રતા ધરાવે છે, જેનાથી અણુનો વાસ્તવિક આકાર (bond angle માં ફેરફાર સાથે) નક્કી થાય છે.", "tag": ""}, {"q": "આણ્વીય કક્ષક સિદ્ધાંત (Molecular Orbital Theory) મુજબ, O₂ અણુની પ્રત્યાવર્તક (paramagnetic) પ્રકૃતિનું શું કારણ છે?", "opts": ["અયુગ્મિત (unpaired) ઇલેક્ટ્રોનનું અસ્તિત્વ", "બધા ઇલેક્ટ્રોન જોડાયેલા (paired) હોવા છતાં", "O₂ માં ફક્ત σ-ઓર્બિટલ્સ ભરેલા હોવાથી", "O₂ નું બંધ ક્રમ (bond order) શૂન્ય હોવાથી"], "correct": 0, "explain": "O₂ ની MO બંધન રચના (bonding configuration) મુજબ, બંને π*₂p_x અને π*₂p_y એન્ટિબોન્ડિંગ કક્ષકમાં એક-એક અયુગ્મિત ઇલેક્ટ્રોન હોય છે (હુન્ડના નિયમ મુજબ). આ બે અયુગ્મિત ઇલેક્ટ્રોનના હોવાને કારણે O₂ પ્રત્યાવર્તક (paramagnetic) પ્રકૃતિ ધરાવે છે, જે MO થિયરી સફળતાપૂર્વક સમજાવે છે.", "tag": ""}, {"q": "N₂ અણુ અને N₂⁺ આયન માંથી કઈ પ્રજાતિ (species) નું બંધ ક્રમ (bond order) વધારે છે?", "opts": ["N₂, કારણ કે તેનું બંધ ક્રમ 3 છે અને N₂⁺ નું 2.5 છે", "N₂⁺, કારણ કે તેમાં ઓછા ઇલેક્ટ્રોન હોય છે", "બંનેનું બંધ ક્રમ સમાન છે", "N₂⁺, કારણ કે તેમાં એન્ટિબોન્ડિંગ ઇલેક્ટ્રોન વધુ હોય છે"], "correct": 0, "explain": "N₂ માટે બંધ ક્રમ = (10 - 4)/2 = 3, જ્યારે N₂⁺ માટે બંધ ક્રમ = (9 - 4)/2 = 2.5 છે, કારણ કે N₂⁺ માં N₂ થી એક ઇલેક્ટ્રોન દૂર થાય છે જે σ₂p_z બંધન કક્ષકમાં હોય છે. તેથી N₂ નું બંધ ક્રમ વધારે છે.", "tag": ""}, {"q": "CH₂=CH₂ (ઇથીન) અને HC≡CH (ઇથીન) માં કાર્બન પરમાણુની સંકરણ (hybridization) અવસ્થા ક્રમશઃ કઈ છે?", "opts": ["sp² અને sp", "sp³ અને sp²", "sp અને sp²", "sp² અને sp³"], "correct": 0, "explain": "ઇથીન (CH₂=CH₂) માં દરેક કાર્બન પાસે 3 σ બંધ (બે C-H અને એક C-C) + 1 π બંધ છે, તેથી તે sp² સંકરિત છે. ઇથીન (HC≡CH) માં દરેક કાર્બન પાસે 2 σ બંધ (એક C-H અને એક C-C) + 2 π બંધ છે, તેથી તે sp સંકરિત છે. સંકરણ પ્રકાર ઓર્બિટલની જરૂરિયાત પર આધારિત છે.", "tag": ""}, {"q": "આણ્વીય કક્રષક સિદ્ધાંત (MOT) અનુસાર, નીચેમાંથી કઈ પ્રજાતિ બંધ ક્રમ (bond order) 1.5 ધરાવે છે? (A) N₂⁺ (B) O₂⁻ (C) O₂⁺ (D) N₂⁻", "opts": ["N₂⁺", "O₂⁻", "O₂⁺", "N₂⁻"], "correct": 1, "explain": "O₂⁻ માં 17 ઇલેક્ટ્રોન હોય છે. MOT મુજબ: σ1s², σ*1s², σ2s², σ*2s², σ2pz², π2px²=π2py², π*2px²=π*2py¹. બંધ ક્રમ = (10 − 7)/2 = 1.5. N₂⁺ (બંધ ક્રમ 2.5), O₂⁺ (બંધ ક્રમ 2.5), N₂⁻ (બંધ ક્રમ 2.5) આ બધાંને 1.5 બંધ ક્રમ નથી.", "tag": ""}, {"q": "VSEPR સિદ્ધાંત મુજબ, નીચેમાંથી કઈ ગોઠવણી (arrangement) શક્ય નથી? (A) 5 જોડાયેલા પરમાણુઓ + 1 એકલ યુગ્મ → વર્ગાકાર પિરામિડ (B) 4 જોડાયેલા પરમાણુઓ + 2 એકલ યુગ્મ → રેખીય (C) 6 જોડાયેલા પરમાણુઓ + 0 એકલ યુગ્મ → અષ્ટફલકીય (D) 3 જોડાયેલા પરમાણુઓ + 1 એકલ યુગ્મ → ત્રિકોણાકાર પિરામિડ", "opts": ["5 જોડાયેલા પરમાણુઓ + 1 એકલ યુગ્મ → વર્ગાકાર પિરામિડ", "4 જોડાયેલા પરમાણુઓ + 2 એકલ યુગ્મ → રેખીય", "6 જોડાયેલા પરમાણુઓ + 0 એકલ યુગ્મ → અષ્ટફલકીય", "3 જોડાયેલા પરમાણુઓ + 1 એકલ યુગ્મ → ત્રિકોણાકાર પિરામિડ"], "correct": 1, "explain": "4 જોડાયેલા પરમાણુઓ + 2 એકલ યુગ્મ = 6 સંયુક્ત યુગ્મ → અષ્ટફલકીય ઇલેક્ટ્રોન ગોઠવણી. જેવાં કે XeF₄, જેની આકૃતિ વર્ગાકાર સમતલીય (square planar) છે, રેખીય નહીં. તેથી B શક્ય નથી.", "tag": ""}, {"q": "MOT મુજબ, N₂ ની સરખામણીએ N₂⁺ આયન માટે નીચેમાંથી કયું કથન સાચું છે? (A) N₂⁺ નું બંધ ક્રમ N₂ કરતાં ઓછું છે અને તે વધારે અસ્થિર છે. (B) N₂⁺ માં ઇલેક્ટ્રોન σ બોન્ડિંગ કક્રષકમાંથી દૂર થાય છે, જેથી બંધ ક્રમ ફેરવાતો નથી. (C) N₂⁺ નું બંધ ક્રમ N₂ કરતાં વધારે છે અને તે વધારે સ્થિર છે. (D) N₂⁺ N₂ કરતાં વધારે પરચુમ્બકીય છે.", "opts": ["N₂⁺ નું બંધ ક્રમ N₂ કરતાં ઓછું છે અને તે વધારે અસ્થિર છે.", "N₂⁺ માં ઇલેક્ટ્રોન σ બોન્ડિંગ કક્રષકમાંથી દૂર થાય છે, જેથી બંધ ક્રમ ફેરવાતો નથી.", "N₂⁺ નું બંધ ક્રમ N₂ કરતાં વધારે છે અને તે વધારે સ્થિર છે.", "N₂⁺ N₂ કરતાં વધારે પરચુમ્બકીય છે."], "correct": 2, "explain": "N₂ (14e⁻): બંધ ક્રમ = 3. N₂⁺ (13e⁻) માં એક ઇલેક્ટ્રોન π* એન્ટી-બોન્ડિંગ કક્રષકમાંથી દૂર થાય છે. તેથી બંધ ક્રમ = (10−2)/2 = 4/2 = 2.5…? નહીં — સાચું ગણતરી: N₂ માં બોન્ડિંગ 10e⁻, એન્ટી-બોન્ડિંગ 4e⁻. N₂⁺ માં બોન્ડિંગ 9e⁻, એન્ટી-બોન્ડિંગ 4e⁻ → બંધ ક્રમ = (9−4)/2 = 2.5. ધ્યાન રાખો: કેટલાક સંદર્ભોમાં σ2p અને π2p ઊર્જા ક્રમ અલગ હોય છે. પરંતુ N₂⁺નું બંધ ક્રમ > N₂ નું? નહીં — N₂ = 3, N₂⁺ = 2.5. કથન C ખોટું છે? પણ D: N₂ પરચુમ્બકીય નથી (બધા ઇલેક્ટ્રોન સુમેળિત), N₂⁺માં એક અયુગ્મિત ઇલેક્ટ્રોન છે → પરચુમ્બકીય છે, પરંતુ \"વધારે\" પરચુમ્બકીય એ સાચું નથી કારણ N₂ તો પરચુમ્બકીય જ નથી. ખરેખર, કથન D સાચું છે. કથન C: N₂⁺ બંધ ક્રમ 2.5 < N₂ નું 3. તે C ખોટું. D સાચું છે: N₂⁺ પરચુમ્બકીય છે જ્યારે N₂ પરચુમ્બકીય નથી.", "tag": ""}, {"q": "પાણી (H₂O) અને હાઇડ્રોજન ફ્લોરાઇડ (HF) માં હાઇડ્રોજન બંધન હોય છે. નીચેમાંથી કયું કથન હાઇડ્રોજન બંધન વિશે સર્વથા સાચું છે? (A) H₂O માં હાઇડ્રોજન બંધન HF કરતાં વધારે પ્રબળ છે કારણ કે O નો વિદ્યુતઋણતા F કરતાં વધારે છે. (B) હાઇડ્રોજન બંધન એ બે હાઇડ્રોજન પરમાણુઓ વચ્ચેનું આકર્ષણ બળ છે. (C) H₂O માં દરેક H પરમાણુ બે O પરમાણુઓ સાથે હાઇડ્રોજન બંધ બનાવી શકે છે, જ્યારે HF માં પ્રત્યેક HF અણુ એક જ હાઇડ્રોજન બંધ બનાવી શકે છે. (D) હાઇડ્રોજન બંધન માત્ર દ્રાવક અવસ્થામાં જ જોવા મળે છે.", "opts": ["H₂O માં હાઇડ્રોજન બંધન HF કરતાં વધારે પ્રબળ છે કારણ કે O નો વિદ્યુતઋણતા F કરતાં વધારે છે.", "હાઇડ્રોજન બંધન એ બે હાઇડ્રોજન પરમાણુઓ વચ્ચેનું આકર્ષણ બળ છે.", "H₂O માં દરેક H પરમાણુ બે O પરમાણુઓ સાથે હાઇડ્રોજન બંધ let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

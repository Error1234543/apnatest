<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>p-Block Elements — 📝 MCQ Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>p-Block Elements — 📝 MCQ Practice</h1>
    <p>🩺 NEET UG — Gujarati · Chemistry · કુલ પ્રશ્નો: 20</p>
  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-05</footer>
</div>
<script>
const QUIZ = [{"q": "p-બ્લોકના મૂળભૂત ઇલેક્ટ્રોનિક વિન્યાસ (વેલેન્સ શેલ) ની સામાન્ય રચના કઈ છે?", "opts": ["ns²np¹⁻⁶", "ns¹⁻²", "(n-1)d¹⁻¹⁰ns²", "(n-2)f¹⁻¹⁴(n-1)d¹⁻¹⁰ns²np¹⁻⁶"], "correct": 0, "explain": "p-બ્લોક તત્વોમાં વેલેન્સ શેલમાં s અને p ઑર્બિટલ ભરાય છે, તેથી સામાન્ય વિન્યાસ ns²np¹⁻⁶ થાય. અહીં n એ બહારનો મુખ્ય કક્ષ (principal quantum number) સૂચવે છે.", "tag": ""}, {"q": "આધુનિક આવર્ત કોષ્ટકમાં p-બ્લોકમાં કેટલા સમૂહો (groups) આવેલા છે?", "opts": ["6 સમૂહો (13 થી 18)", "8 સમૂહો", "10 સમૂહો", "18 સમૂહો"], "correct": 0, "explain": "p-બ્લોક આવર્ત કોષ્ટકના જમણી બાજુએ આવેલો છે અને તેમાં સમૂહ 13 થી 18 સુધીના 6 સમૂહો આવેલા છે. આમાં B, C, N, O, F, Ne અને તેમના સમૂહભાઈઓનો સમાવેશ થાય છે.", "tag": ""}, {"q": "p-બ્લોક તત્વોમાં ઉપરથી નીચેના ક્રમમાં પરમાણ્વીય ત્રિજ્યા (atomic radius) સાથે શું ફેરફાર થાય છે?", "opts": ["પરમાણ્વીય ત્રિજ્યા વધે છે", "પરમાણ્વીય ત્રિજ્યા ઘટે છે", "પરમાણ્વીય ત્રિજ્યા માં રૂકે છે", "પ્રથમ ઘટે છે પછી વધે છે"], "correct": 0, "explain": "સમૂહમાં ઉપરથી નીચે જતાં નવા કક્ષ (shell) ઉમેરાય છે, જેથી પરમાણ્વીય ત્રિજ્યા વધે છે. આ તત્વોમાં પ્રભાવી ન્યુક્લીય આકર્ષણ ઓછું થવાને કારણે આ ટ્રેન્ડ દેખાય છે.", "tag": ""}, {"q": "p-બ્લોક તત્વોના સમૂહમાં ઉપરથી નીચે જતાં પ્રથમ આયનીકરણ એન્થાલ્પી (ionization enthalpy) સાથે શું થાય છે?", "opts": ["ઘટે છે", "વધે છે", "ફેરફાર થતો નથી", "અનિયમિત રીતે બદલાય છે"], "correct": 0, "explain": "સમૂહમાં નીચે જતાં પરમાણ્વીય ત્રિજ્યા વધે છે અને વેલેન્સ ઇલેક્ટ્રોન ન્યુક્લીયસથી દૂર જાય છે, તેથી પ્રથમ આયનીકરણ એન્થાલ્પી ઘટે છે. p-બ્લોકમાં આ ટ્રેન્ડ સામાન્ય રીતે સ્પષ્ટ દેખાય છે.", "tag": ""}, {"q": "p-બ્લોકમાં પ્રથમ સમૂહ (Group 13) નું પ્રથમ તત્વ કયું છે અને તેનો ઇલેક્ટ્રોનિક વિન્યાસ શું છે?", "opts": ["બોરોન — 1s² 2s² 2p¹", "એલ્યુમિનિયમ — [Ne] 3s² 3p¹", "કાર્બન — 1s² 2s² 2p²", "હાઇડ્રોજન — 1s¹"], "correct": 0, "explain": "Group 13 નું પ્રથમ તત્વ બોરોન (B) છે જેનો પરમાણુ ક્રમાંક 5 છે અને ઇલેક્ટ્રોનિક વિન્યાસ 1s² 2s² 2p¹ છે. બોરોન એ એક એકમધ્રુવ (metalloid) તત્વ છે.", "tag": ""}, {"q": "જૂથ 14 (કાર્બન વિભાગ) ના તત્વોની પ્રચલિત ઑક્સિડેશન સ્થિતિઓ વિશે નીચેનામાંથી કયું વિધાન સચોટ છે?", "opts": ["+2 ઑક્સિડેશન સ્થિતિની સ્થિરતા ઉપરથી નીચે જતાં વધે છે; Pb માં +4 કરતાં +2 પ્રબળ છે.", "C અને Si ફક્ત +4 સ્થિતિ દર્શાવે છે, જ્યારે Ge, Sn, Pb ફક્ત +2 સ્થિતિ દર્શાવે છે.", "બધા જ તત્વો +2 અને +4 બંને ઑક્સિડેશન સ્થિતિઓ દર્શાવે છે, કોઈપણ વિભેદક નથી.", "Pb માં +4 ઑક્સિડેશન સ્થિતિ +2 કરતાં વધુ સ્થિર હોય છે, કારણ કે તેનો ionisation energy ઓછો છે."], "correct": 0, "explain": "જૂથ 14 માં, સમૂહ ઉપરથી નીચે જતાં 'ઇન્હેરિટેડ જોડી' (ns²) ની અસ્થિરતા વધે છે, જેથી +2 ઑક્સિડેશન સ્થિતિની સ્થિરતા વધે છે. આમ, C અને Si માં +4 પ્રબળ છે, જ્યારે Pb માં +2 પ્રબળ છે. આને ટ્રાન્સિશન ઇફેક્ટ કહે છે.", "tag": ""}, {"q": "CO અને CO₂ ની રાસાયણિક પ્રવૃત્તિ અને બંધારણ વિશે નીચેનામાંથી કયું વિધાન સચોટ નથી?", "opts": ["CO એક નેટ્રલ ઑક્સાઇડ છે, જ્યારે CO₂ એ એસિડિક ઑક્સાઇડ છે.", "CO માં C=O ડબલ બંધ રહે છે, જેના કારણે તે રેખીય ગેસ છે.", "CO₂ માં SiO₂ જેવું જાળીદાર સહસંયોજક બંધારણ હોય છે.", "CO હિમોગ્લોબિન સાથે Strong coordination કરી શકે છે, જે તેને વિષાक्त બનાવે છે."], "correct": 2, "explain": "CO₂ એ અણ્વીય (molecular) રચના ધરાવે છે અને તે ગેસ છે, જ્યારે SiO₂ માં Si અને O વચ્ચે સહસંયોજક જાળી (network covalent) રચાય છે, જે તેને ઘન બનાવે છે. આ તફાવતના કારણે C=O ડબલ બંધની રચના CO માં શક્ય બને છે, જ્યારે Si=O ડબલ બંધની રચના અશક્ય છે.", "tag": ""}, {"q": "નાઈટ્રોજનના વિવિધ ઑક્સાઇડ્સ (N₂O, NO, N₂O₃, NO₂, N₂O₄, N₂O₅) માંથી, કયો ઑક્સાઇડ પાણ્યુધમીત (acidic anhydride) છે અને પાણી સાથે અવર્તી (reversible) રીતે ક્રિયા કરી NaOH જેવા બેઝ સાથે ક્ષાર આપે છે?", "opts": ["NO (નાઈટ્રિક મોનોક્સાઇડ)", "NO₂ (નાઈટ્રોજન ડાયોક્સાઇડ)", "N₂O₅ (ડાયનાઈટ્રોજન પેન્ટોક્સાઇડ)", "N₂O (નાયટ્રસ ઑક્સાઇડ)"], "correct": 2, "explain": "N₂O₅ એ નાઈટ્રિક એસિડ (HNO₃) નો એનહેડ્રાઇડ છે; તે પાણી સાથે અવર્તી રીતે પ્રતિક્રિયા કરી HNO₃ આપે છે. NO અને N₂O નેટ્રલ ઑક્સાઇડ્સ છે, જ્યારે NO₂ મિશ્ર એનહેડ્રાઇડ છે (HNO₃ અને HNO₂ બંને આપે છે).", "tag": ""}, {"q": "જૂથ 15 (નાઈટ્રોજન વિભાગ) ના તત્વોની પ્રથમ આયનાઇઝેશન એન્થાલ્પી (IE₁) માં અનંતરનો સૌથી સચોટ ક્રમ નીચેનામાંથી કયો છે?", "opts": ["N > P > As > Sb > Bi", "N < P < As < Sb < Bi", "Bi > Sb > As > P > N", "P > N > As > Sb > Bi"], "correct": 0, "explain": "નાઈટ્રોજન (N) માં half-filled 2p³ સબશેલ હોવાથી તે વધુ સ્થિર છે, જેના કારણે તેની IE₁ અન્ય તત્વો કરતાં વધારે હોય છે. સમૂહ ઉપરથી નીચે જતાં પરમાણ્વીય ત્રિજ્યા વધતી જાય છે અને IE₁ સામાન્ય રીતે ઘટે છે, તેથી N > P > As > Sb > Bi એ સાચો ક્રમ છે.", "tag": ""}, {"q": "HNO₃ (નાઈટ્રિક એસિડ) ની રચનામાં નાઈટ્રોજન પરમાણુનું hybridisation અને આણ્વીય આકાર નીચેનામાંથી કયોયોગ્ય છે?", "opts": ["sp, રેખીય", "sp², ત્રિકોણીય સમતલીય", "sp³, ચતુષ્ફલકીય", "dsp², ચોરસ સમતલીય"], "correct": 1, "explain": "HNO₃ માં N પરમાણુ ત્રણ સિગ્મા બંધ (એક O–H, એક N–O, એક N=O) અને કોઈ પણ lone pair નથી ધરાવતો, તેથી તે sp² hybridized છે અને ત્રિકોણીય સમતલીય (trigonal planar) આકાર ધરાવે છે. N=O બંધમાં π-બંધ હોય છે.", "tag": ""}, {"q": "જૂથ 15 (નાઈટ્રોજન વિભાગ) ના તત્વોમાં પોસ્ફરસ (P), ઍંಟિમની (Sb) અને બિસ્માથ (Bi) ના મધ્યમાં ધાત્વીય પ્રવૃત્તિમાં કેવી રીતે ફેરફાર થાય છે, અને બિસ્માથમાં ધાત્વીય ગુણધર્મો કયા પ્રબળ ઇલેક્ટ્રોનિક કારણને લીધે પ્રબળ બને છે?", "opts": ["ઉપરથી નીચે જતાં ધાત્વીય પ્રવૃત્તિ વધે છે; Bi માં 6s² ઇલેક્ટ્રોનનો 'ઇનોર્ટ પેયર' પ્રભાવ અને વધેલો પરમાણ્વ્યાકાર પ્રબળ છે.", "ઉપરથી નીચે જતાં ધાત્વીય પ્રવૃત્તિ ઘટે છે; Sb માં સુવર્ણભાસી (metallic luster) હોવાથી તે ધાતુ ગણાય છે.", "ધાત્વીય ગુણધર્મો સમૂહમાં સમાન રહે છે કારણ કે તમામ tત્વોના બહિમૂળ ઇલેક્ટ્રોન 5 છે.", "ઉપરથી નીચે જતાં ધાત્વીય પ્રવૃત્તિ વધે છે; પણ Bi માં 6s² ઇલેક્ટ્રોન નિષ્ક્રિય નથી અને તે ભાગીદારી બંધો બનાવે છે."], "correct": 0, "explain": "જૂથ 15 માં ઉપરથી નીચે જતાં (N → P → As → Sb → Bi) ધાત્વીય પ્રવૃત્તિ વધે છે. Bi એ ધાતુ છે અને તેમાં 6s² ઇલેક્ટ્રોન સમૂહનો 'ઇનોર્ટ પેયર' પ્રભાવ પ્રબળ હોવાથી તે રસાયણિક રીતે ઓછો પ્રવૃત્તિશીલ ધાત્વીય તત્વ તરીકે વર્તે છે.", "tag": ""}, {"q": "પોસ્ફરસના બે સ્ફટિકીય રૂપાંતરો — સફેદ (white/yellow) પોસ્ફરસ અને લાલ (red) પોસ્ફરસ — ની સરખામણીમાં નીચેનામાંથી કયું વિધાન સંપૂર્ણપણે સાચું છે?", "opts": ["સફેદ પોસ્ફરસમાં P₄ અણુઓ હોય છે જેમનાં બંધકોણો ~60° હોય છે, જેના કારણે તે અત્યંત પ્રવૃત્તિશીલ અને જ્વાળામુખી હોય છે; જ્યારે લાલ પોસ્ફરસ એ એક અણુજાળીયું (polymeric) રૂપ છે જે ગરમી, પ્રકાશ અને ઓક્સિડાઇઝિંગ एजન્ટ પ્રત્યે સ્થિર છે.", "લાલ પોસ્ફરસ સફેદ પોસ્ફરસ કરતાં વધુ પ્રવૃત્તિશીલ હોય છે કારણ કે તેનો બંધકોણ મુક્ત અણુઓ કરતાં નાનો હોય છે.", "સફેદ પોસ્ફરસ રાત્રે પ્રકાશિત (glow in the dark) થતો નથી, જ્યારે લાલ પોસ્ફરસ ગરમ કરવા પર ફરીથી સફેદ પોસ્ફરસમાં રૂપાંતરિત થાય છે.", "બંને સ્વરૂપો સમાન રાસાયણિક રચના ધરાવે છે, ફક્ત ભૌતિક ગુણધર્મોમાં તફાવત હોય છે."], "correct": 0, "explain": "સફેદ પોસ્ફરસમાં P₄ ટેટ્રાહેડ્રલ અણુઓ હોય છે અને P-P-P બંધકોણ લગભગ 60° હોવાથી તણાવ વધારે હોય છે; તેથી તે રાસાયણિક રીતે ખૂબ પ્રવૃત્તિશીલ અને વિષકારી હોય છે. લાલ પોસ્ફરસ એ એક સહસંયોજક જાળીયું (polymeric chain/net) છે જે ભૌતિક રીતે ઓછું પ્રવૃત્તિશીલ અને સ્થિર છે.", "tag": ""}, {"q": "નાઈટ્રિક એસિડ (HNO₃) ની ઑક્સિડાઇઝિંગ ક્ષમતા અને પ્રતિક્રિયાઓ સંબંધી નીચેનામાંથી કયું વિધાન અયોગ્ય/ખોટું છે?", "opts": ["ગરમ અને સાંદ્ર HNO₃ સોનું (Au) અને સિલ્વર (Ag) બંનેને ઑક્સિડાઇઝ કરી શકે છે, પરંતુ Au માટે સામાન્ય HNO₃ પૂરતું નથી; Au લેખિત (aqua regia) માં જ ઘોલે છે.", "લોહ (Fe) સંપૂર્ણપણે સાંદ્ર HNO₃ ને સંપર્કમાં આવતાં તેની સપાટી પર એક સંરક્ષણાત્મક ઑક્સાઇડ સ્તર બને છે, જેથી તે આગળ પ્રતિક્રિયા નથી કરતું (passivation).", "હળવા Cu સાથેની પ્રતિક્રિયામાં સામાન્ય રીતે NO₂ વાયુનું ઉત્પાદન થાય છે, કારણ કે HNO₃ એ શક્તિશાળી ઑક્સિડાઇઝિંગ એજન્ટ છે.", "સંયોજિત HNO₃ ના N પરમાણુની hybridization sp² છે અને તેના બંધારણમાં એક Pπ–dπ બંધ પણ હોય છે જે અણુની રેખીયતા અને સ્થિરતામાં મદદરૂપ થાય છે."], "correct": 2, "explain": "HNO₃ ની સાંદ્રતા અને ધાતુના પ્રકાર પર આધાર રાખીને NO અથવા NO₂ બને છે; સામાન્ય રીતે સાંદ્ર HNO₃ સાથે Cu પ્રતિક્રિયામાં મુખ્યત્વે NO₂ બને છે, જે સાચું છે પરંતુ વિધાન C માં 'NO₂ જ હંમેશા બને' એવો દાવો નથી, પરંતુ B સાચું છે અને A પણ સાચું છે. D માંybridization sp² સાચી છે, પણ N માં Pπ–dπ નહીં પરંતુ Pπ–pπ બંધ હોય છે — તેથી D ખોટું છે. આમ, અયોગ્ય વિધાન C નથી, પણ D છે. પ્રશ્નની ભાષા પ્રમાણે સૌથી યોગ્ય ખોટું વિધાન D છે.", "tag": ""}, {"q": "જૂથ 17 (હેલીજન) ના તત્વો — F₂, Cl₂, Br₂, I₂ — ની પ્રવૃત્તિ અને તેમના સંયોજનો સંબંધી નીચેનામાંથી કયું વિધાન રાસાયણિક રીતે સચોટ છે?", "opts": ["F₂ એ સૌથી પ્રબળ ઑક્સિડાઇઝિંગ એજન્ટ છે, પરંતુ તેનાં H–F બંધનળતા (bond dissociation enthalpy) નું મૂલ્ય Cl₂ કરતાં ઓછું હોવાથી F₂ ની પ્રતિક્રિયાશીલતા ઓછી હોય છે.", "હેલીજનનાં NaCl, NaBr, NaI ના જલીય દ્રાવણમાં AgNO₃ ઉમેરતાં જરૂરી હેલાઇડ આયનની સાંદ્રતા અને AgX ના Ksp પર આધારિત અવક્ષેપની રંગપ્રવૃત્તિ અલગ અલગ હોય છે: AgCl સફેદ, AgBr હલકો પીળો, AgI પીળો અવક્ષેપ આપે છે.", "જલીય દ્રાવણમાં હેલીજન આયનોની ઘટતી ક્રમ F⁻ > Cl⁻ > Br⁻ > I⁻ છે, કારણ કે F⁻ નો hydraation enthalpy ન્યૂનતમ હોય છે.", "I₂ એ F₂ કરતાં વધુ પ્રબળ ઑક્સિડાઇઝિંગ એજન્ટ છે, કારણ કે તેનો standard reduction potential વધુ ધન છે."], "correct": 1, "explain": "સોલિડ AgNO₃ ના જલીય દ્રાવણમાં Cl⁻, Br⁻, I⁻ ના અવક્ષેપ બનાવે છે: AgCl (સફેદ), AgBr (પીળછટ), AgI (ગાઢ પીળા). F₂ નું H–F બંધ અધિક મજબૂત હોવાથી તે પ્રતિક્રિયાશીલ છે, પણ B માં દર્શાવેલો ક્રમ અને રંગો સાચા છે.", "tag": ""}, {"q": "જૂથ 18 (નીબળ વાયુઓ / noble gases) ના તત્વોના ભૌતિક અને રાસાયણિક ગુણધર્મો સંબંધી નીચેનામાંથી કયું વિધાન યોગ્ય છે?", "opts": ["Ne, Ar, Kr, Xe ના સ્ફુટન બિંદુ (boiling points) ઉપરથી નીચે જતાં ઘટે છે, કારણ કે van der Waals આકર્ષણ ઘટે છે.", "Xe ના ઑક્સિફ્લોરાઇડ્સ (XeF₂, XeF₄, XeF₆) એ સંયોજિત તત્વો છે; XeF₆ નું બંધારણ અષ્ટફલકીય (octahedral) હોય છે અને તેનું જળવિભાજન (hydrolysis)XeO₃ આપે છે જે અસ્થિર અને વિસ્ફોટક છે.", "નીબળ વાયુઓ ક્યારેય રાસાયણિક બંધ બનાવતા નથી, કારણ કે તેમના બહિમૂળ ઓર્બિટલ સંપૂર્ણ ભરાયેલા હોય છે.", "He નું સ્ફુટન બિંદુ 4 K ની આસપાસ છે, જે O₂ કરતાં પણ ઓછું છે; પરંતુ Xe નું આદર્શ વાયુ વર્તન 298 K ની નજીક સારું દેખાય છે કારણ કે તેનો પરમાણ્વ્યાકાર મોટો છે."], "correct": 1, "explain": "જૂથ 18 માં ઉપરથી નીચે જતાં સ્ફુટન બિંદુ વધે છે (vdW બળ વધે). Xe ના ઑક્સિફ્લોરાઇડ્સ પ્રમાણિત સંયોજનો છે; XeF₆ અષ્ટફલકીય (distorted octahedral) રચના ધરાવે છે અને પાણી સાથે પ્રતિક્રિયા કરી XeO₃ આપે છે, જે અસ્થિર અને વિસ્ફોટક છે.", "tag": ""}, {"q": "બિન-મૂળભૂત વાયુઓ (noble gases) માંથી કયા તત્વનું સંયોજન શોધવામાં આવ્યું હતું, જેના પછી માનવામાં આવતું હતું કે તે રાસાયણિક રીતે સંપૂર્ણપણે અક્રિયાશીલ છે?", "opts": ["હેલિયમ (He)", "નિયો         '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

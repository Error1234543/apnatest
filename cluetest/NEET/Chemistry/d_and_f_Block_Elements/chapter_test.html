footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}

g) ને સામાન્ય રીતે સંક્રાંતિ તત્વો ગણવામાં આવતા નથી કારણ કે:", "opts": ["આ ત્રણેય તત્વોની ground state અને સામાન્ય ઑક્સિડેશન અવસ્થાઓમાં (n−1)d કક્ષક સંપૂર્ણ રીતે ભરી થયેલી હોય છે (d¹⁰)", "આ તત્વો d-બ્લોકમાં આવેલા જ નથી", "આ તત્વો કોઈ ઑક્સિડેશન અવસ્થા દર્શાવતા નથી", "આ તત્વો અધાતુઓ છે"], "correct": 0, "explain": "ચઝન (3d¹⁰4s²), કેડમિયમ (4d¹⁰5s²) અને મર્ક્યુરી (5d¹⁰6s²) ની ground state દ્રષ્ટિએ d-કક્ષક સંપૂર્ણ રીતે ભરી થયેલી હોય છે અને તેમની સામાન્ય ઑક્સિડેશન અવસ્થામાં પણ (d¹⁰) જ રહે છે. સંક્રાંતિ તત્વની વ્યાખ્યા અનુસાર આંશિક ભરી થયેલી d-કક્ષક જરૂરી છે, તેથી આ ત્રણને સંક્રાંતિ તત્વો નથી ગણવામાં આવતા.", "tag": ""}, {"q": "પ્રથમ સંક્રાંતિ શ્રેણી (3d) ના તત્વો કેમ પરમાગ્નેટિક (paramagnetic) ગુણધર્મ દર્શાવે છે?", "opts": ["અયુગ્મિત (unpaired) d-ઇલેક્ટ્રોનની હાજરીને કારણે", "માત્ર યુગ્મિત (paired) d-ઇલેક્ટ્રોનને કારણે", "તમામ d-ઇલેક્ટ્રોન અયુગ્મિત હોય છે", "તમામ ઇલેક્ટ્રોન યુગ્મિત હોય છે"], "correct": 0, "explain": "સંક્રાંતિ તત્વોના d-કક્ષકમાં એક કે વધુ અયુગ્મિત ઇલેક્ટ્રોન હોવાથી તેમાં ચોક્કસ ચુંબકીય આઘૂર્ણ (magnetic moment) ઉભું થાય છે, જે પરમાગ્નેટિઝમનું કારણ બને છે.", "tag": ""}, {"q": "Cu²⁺(aq) આયન વાદળી રંગનો દેખાય છે, જ્યારે Zn²⁺(aq) આયન અરંગહીન (colorless) હોય છે, તેનું મુખ્ય કારણ શું છે?", "opts": ["Cu²⁺ માં અયુગ્મિત d-ઇલેક્ટ્રોન હોવાથી d-d સંક્રાંતિ શક્ય બને છે; Zn²⁺ માં d-કક્ષક સંપૂર્ણ ભરેલી હોય છે", "Zn²⁺ નું પરમાણ્વીય દળ વધુ હોવાથી", "Cu²⁺ નું પરમાણ્વીય કદ નાનું હોવાથી", "Zn²⁺ માં અયુગ્મિત ઇલેક્ટ્રોન હોય છે"], "correct": 0, "explain": "Cu²⁺નું इलेक्ट्रॉन विन्यास [Ar]3d⁹ હોય છે, જેમાં અયુગ્મિત ઇલેક્ટ્રોન હોવાથી d-d સંક્રાંતિ શક્ય બને છે અને પ્રકાશનું શોષણ થઈ રંગ દેખાય છે. Zn²⁺નું [Ar]3d¹⁰ હોય છે — તમામ ઇલેક્ટ્રોન યુગ્મિત, તેથી d-d સંક્રાંતિ શક્ય નથી.", "tag": ""}, {"q": "સંક્રાંતિ તત્વો જટિલ સંયોજનો (complex compounds) બનાવવા માટે કયા ગુણધર્મો જવાબદાર છે?", "opts": ["નાનું પરમાણ્વીય કદ, ખાલી d-કક્ષકો અને ઉચ્ચ આયનીય ઇલેક્ટ્રોનેગેટિવિટી / ચાર્જ ઘનતા", "વધુ પરમાણ્વીય કદ અને ઓછો આયનીયકરણ ફલક", "માત્ર અયુગ્મિત ઇલેક્ટ્રોનની હાજરી", "તમામ ઇલેક્ટ્રોન યુગ્મિત હોવો"], "correct": 0, "explain": "સંક્રાંતિ તત્વોના નાના કદ, ખાલી (n-1)d કે ns કક્ષકો અને ઉચ્ચ ચાર્જ ઘનતાને કારણે તેઓ લિગેન્ડ્સની ઇલેક્ટ્રોન યુગ્મને સ્વીકારી શક્તિશાળી સંકીર્ણ (complexes) બનાવે છે.", "tag": ""}, {"q": "સંક્રાંતિ તત્વોના ઇન્ટરસ્ટિશિયલ સંયોજનો (interstitial compounds) ની રચના કેવી રીતે થાય છે?", "opts": ["નાના પરમાણ્વો (H, B, C, N) ધાતુની જાળી (crystal lattice) ના ખાલી અંતરાલોમાં દાખલ થઈ જાય છે", "મોટા પરમાણ્વો ધાતુની સપાટી પર જમા થઈ જાય છે", "ફક્ત બે ધાતુઓનું સમાન અનુપાતમાં મિશ્રણ થાય છે", "તત્વો સીધા સહસંયોજક બંધથી જોડાય છે"], "correct": 0, "explain": "સંક્રાંતિ તત્વોની ઘન જાળીમાં નાના gaseous/non-metallic પરમાણ્વો (H, B, C, N) તેના અંતરાલો (interstices) માં સમાઈ જાય છે, જેનાથી સખત અને ઊંચા દ્રવ્યમાનક ધરાવતા ઇન્ટરસ્ટિશિયલ સંયોજનો બને છે.", "tag": ""}, {"q": "સંક્રાંતિ તત્વો અને અન્ય ધાતુઓ મળીને બનતે સંકરતાલુઓ (alloys) માં સામાન્ય રીતે કયા પ્રકારનો સંકરતાલુનો ગુણધર્મ જોવા મળે છે?", "opts": ["શુદ્ધ ધાતુ કરતાં વધુ કઠોરતા (hardness) અને ઓછું દ્રવ્યમાનક", "શુદ્ધ ધાતુ કરતાં ઓછી કઠોરતા", "શુદ્ધ ધાતુ કરતાં વધુ વિદ્યુતવાહકતા", "ફક્ત વધારે મૃદુતા (softness)"], "correct": 0, "explain": "સંક્રાંતિ તત્વોના સંકરતાલુઓમાં પરમાણ્વીય કદમાં ફરક અને જાળીની વિરૂપતાને કારણે ડિસ્લોકેશન (dislocation) ની ગતિ અવરોધાય છે, જેથી શુદ્ધ ધાતુ કરતાં વધુ કઠોરતા અને ઘટતા દ્રવ્યમાનક મળે છે.", "tag": ""}, {"q": "ફેરાઇટ અયસ્ક (Chromite ore) માંથી પોટૅશિયમ ડાયક્રોમેટ (K₂Cr₂O₇) ની તૈયારી દરમિયાન સોડિયમ ડાયક્રોમેટ મેળવવા માટે ઉમેરવામાં આવતું એસિડ કયું છે અને તેનું પ્રક્રિયા-અનુપાત શું દર્શાવે છે?", "opts": ["સલ્ફ્યુરિક એસિડ (H₂SO₄); ક્રોમેટ આયન (CrO₄²⁻) નું ડાયક્રોમેટ આયન (Cr₂O₇²⁻) માં રૂપાંતર, જ્યાં બે CrO₄²⁻ આયન એકટાઈઝ્ડ H⁺ સાથે વિલયન પામીને Cr₂O₇²⁻ બનાવે છે", "હાઈડ્રોકલોરિક એસિડ (HCl); Cl⁻ આયન ઑક્સિડાઈઝ થઈને Cl₂ મુક્ત કરે છે, જે Cr³⁺ ને Cr⁶⁺ માં ઑક્સિડાઈઝ કરે છે", "નાઇટ્રિક એસિડ (HNO₃); NO₃⁻ આયન ક્રોમેટની વચ્ચે ક્રોસ-લિંકિંગ કરીને ડાયક્રોમેટ બનાવે છે", "એસિટિક એસિડ (CH₃COOH); ક્ષારની હાજરીમાં CrO₄²⁻ નું સીધું જ K₂Cr₂O₇ બનતું થાય છે"], "correct": 0, "explain": "ફેરાઇટ અયસ્ક (FeCr₂O₄) નું Na₂CO₃/H₂O માં ગર્ભન પાકાવીને Na₂CrO₄ મેળવીએ છીએ. પછી H₂SO₄ ઉમેરી વિલયનને એસિડિક બનાવવાથી 2CrO₄²⁻(લીલાશ) + 2H⁺ → Cr₂O₇²⁻(કેસરી) + H₂O પ્રક્રિયા થાય છે. HCl અથવા HNO₃ યોગ્ય નથી કારણ કે Cl⁻ ને Cr⁶⁺ ઑક્સિડાઈઝ કરી શકે અને HNO₃ ઑક્સિડાઈઝિંગ એસિડ છે. છેલ્લે KCl ઉમેરી K₂Cr₂O₇ ઓછી દ્રાવ્યતાને કારણે અવક્ષેપિત કરવામાં આવે છે.", "tag": ""}, {"q": "KMnO₄ ની તૈયારીમાં પ્રાયોલુસ્પાઇટ (MnO₂) ના ગર્ભન સાથે KOH ની હાજરીમાં O₂ (વાયુ) મળવા પર હરિત રંગનું કયું સંયોજન બને છે અને તેનું તટસ્થ/ક્ષારક માધ્યમમાં વિખંડન (disproportionation) કયા ઉત્પાદનો આપે છે?", "opts": ["પહેલાં K₂MnO₄ (મંગેનેટ) બને છે; તટસ્થ/ક્ષારક વિખંડનથી KMnO₄ (મંગેનેટ) અને MnO₂ બને છે", "પહેલાં KMnO₄ સીધું બને છે; તટસ્થ વિખંડનથી K₂MnO₄ અને MnO₂ બને છે", "પહેલાં Mn₂O₇ બને છે; તટસ્થ વિખંડનથી MnO₂ અને O₂ બને છે", "પહેલાં K₃MnO₄ બને છે; તટસ્થ વિખંડનથી KMnO₄ અને K₂MnO₄ બને છે"], "correct": 0, "explain": "MnO₂ નું KOH ની હાજરીમાં O₂ (અથવા KNO₃/KClO₃ ઑક્સિડાઈઝર) વડે ગર્ભન પાકાવવાથી પ્રથમ K₂MnO₄ (હરિત) બને છે: 2MnO₂ + 4KOH + O₂ → 2K₂MnO₄ + 2H₂O. આ K₂MnO₄ નું તટસ્થ/ક્ષારક માધ્યમમાં વિખંડન થાય છે: 3K₂MnO₄ + 2H₂O → 2KMnO₄ + MnO₂ + 4KOH, જ્યાં Mn(+6) એક ભાગ Mn(+7) અને એક ભાગ Mn(+4) માં રૂપાંતરિત થાય છે.", "tag": ""}, {"q": "તેજસ્વી એસિડિક માધ્યમમાં KMnO₄ ની ક્રિયા દરમિયાન MnO₄⁻ આયનનું મુખ્ય વિજારક (reduction) અર્ધ-સમીકરણ કયું છે અને તેના પરિણામે રંગ કેવી રીતે બદલાય છે?", "opts": ["MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O; વાદળી-જાંબલી (purple) થી રંગહીન/Cr³⁺ હોય તોલી મૌર (绿色)", "MnO₄⁻ + 4H⁺ + 3e⁻ → MnO₂ + 2H₂O; વાદળી-જાંબલી થી કાળો અવક્ષેપ", "MnO₄⁻ + e⁻ → MnO₄²⁻; વાદળી-જાંબલી થી હરિત", "MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻; vાદળી-જાંબલી થી ભૂરો અવક્ષેપ"], "correct": 0, "explain": "KMnO₄ એ પ્રબળ ઑક્સિડાઈઝિંગ કારક છે. એસિડિક માધ્યમમાં તે સૌથી વધુ ઇલેક્ટ્રોન મેળવે છે (5e⁻): MnO₄⁻(જાંબલી) + 8H⁺ + 5e⁻ → Mn²⁺(રંગહીન) + 4H₂O. જો દ્રાવણમાં Cr₂O₇²⁻ અથવા Fe²⁺ જેવું ઇલેક્ટ્રોન દાતા હોય, તો Mn²⁺ રંગહીન હોવા છતાં Cr³⁺ ની ઉપસ્થિતિમાં લીલો રંગ દેખાય છે. આ જ K₂Cr₂O₇ / KMnO₄ ની ટાઈટ્રેશનમાં રંગ-વિનાશનો આધાર છે.", "tag": ""}, {"q": "d-શ્રેણીના ઑક્સાઇડ્સ (oxides) માંથી M₂O₇ રૂપી ઉચ્ચતમ ઑક્સિડેશન અવસ્થા ધરાવતા ઑક્સાઇડ્સ કયા તત્વોના છે અને તેમનો પ્રકાર (એસિડિક/ક્ષારક) શું છે?", "opts": ["Cr → CrO₃ (એસિડિક), Mn → Mn₂O₇ (એસિડિક); ઓછી ઇલેક્ટ્રોન-ઋણતા ધરાવતા ઉચ્ચ ઑક્સિડેશન અવસ્થાવાળા ધાતુ-આધારિત ઑક્સાઇડ્સ પાણી સાથે પ્રક્રિયા કરી એસિડ બનાવે છે", "Sc → Sc₂O₃, Ti → TiO₂ — બંને વલયનહીન (amphoteric)", "Mn → MnO (ક્ષારક), Cr → Cr₂O₃ (વલયનહીન) — ઉચ્ચ ઑક્સિડેશન અવસ્થાઓ સાથે", "Cr → CrO₅ (પેરોક્સો), Mn → MnO₄ (અસ્થિર)"], "correct": 0, "explain": "જેમ દત્તક-ઇલેક્ટ્રોનની સંખ્યા વધે છે, તેમ ધાતુ-આધારિત ઑક્સાઇડનું એસિડિક લક્ષણ વધે છે. CrO₃ (ક્રોમિક ઑક્સાઇડ) અને Mn₂O₇ (મંગેનેઝ ડાયપ્રોક્સાઇડ) — બંને ઇલેક્ટ્રોન-ઋણ એસિડિક ઑક્સાઇડ્સ છે. CrO₃ પાણી સાથે પ્રક્રિયા કરી H₂CrO₄ (ક્રોમિક એસિડ) અને Mn₂O₇ પાણી સાથે H₂MnO₄/MnO₄⁻ આપે છે. વધુ ઇલેક્ટ્રોન-ઋણતા ધરાવતા ઉચ્ચ ઑક્સિડેશન અવસ્થાવાળા ઑક્સાઇડ્સ એસિડિક ગુણધર્મ ધરાવે છે.", "tag": ""}, {"q": "લેન્થેનોઇડ સંકોચન (Lanthanoid contraction) ની ઘટના કોને કારણે ઉદ્ભવે છે અને તેના કારણે 4d અને 5d શ્રેણીના સમજાત (isotone) તત્વોની પરમાણ્વિક ત્રિજ્યાઓમાં શું અસર થાય છે?", "opts": ["4f ઇલેક્ટ્રોન દ્વારા અપર્યાપ્ત સ્ક્રીનીંગ (screening); તેથી Zr અને Hf ની પરમાણ્વિક ત્રિજ્યાઓ લગભગ સમાન મળે છે", "5d ઇલેક્ટ્રોન દ્વારા સારું સ્ક્રીનીંગ; Zr અને Hf ની ત્રિજ્યાઓમાં значительный તફાવત રહે છે", "4f ઇલેક્ટ્રોન દ્વારા પ્રબળ સ્ક્રીનીંગ; 5d શ્રેણીના તત્વોની ત્રિજ્યા 4d શ્રેણીના તત્વો કરતાં ઘણી મોટી હોય છે", "અણુકેન્દ્રીય (nuclear) ગતિ; 5d શ્રેણીના તત્વો 4d શ્રેણીના તત્વો કરતાં ઓછા ઘનતા ધરાવે છે"], "correct": 0, "explain": "લેન્થેનોઇડ સંકોચન એ 4f ઓર્બિટલના ઇલેક્ટ્રોનો દ્વારા અપર્યાપ્ત સ્ક્રીનીંગ (screening) ને કારણે ઉદ્ભવે છે. ઇલેક્ટ્રોનની સંખ્યા વધતાં અણુકેન્દ્રની પ્રભાવી ધન વિદ્યુત (effective nuclear charge) વધે છે, જેથી પરમાણ્વિક ત્રિજ્યા નાનામાં નાની રીતે ઘટે છે. આ કારણે Zr (4d, 160 pm) અને Hf (5d, 159 pm) ની પરમાણ્વિક ત્રિજ્યાઓ લગભગ સમાન મળે છે; એકસરખી ત્રિજ્યાને કારણે તેઓ કુદરતી રીતે એકસાથે જોડાયેલા (co-genetic) રહે છે અને એકબીજાથી અલગ કરવા મુશ્કેલ હોય છે.", "tag": ""}, {"q": "પોટેશિયમ ડાયક્રોમેટ (K₂Cr₂O₇) માં ક્રોમિયમનું ઑક્સિડેશન અંક let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>

<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrochemistry — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "ગેલ્વેનિક કોષમાં ઓક્સિડેશન કયા ઇલેક્ટ્રોડ પર થાય છે?", "opts": [" એનોડ (Anode) પર", " કેથોડ (Cathode) પર", " સેલ્ટ બ્રિજ (Salt bridge) માં", " બંને ઇલેક્ટ્રોડ પર"], "correct": 0, "explain": "ગેલ્વેનિક કોષમાં એનોડ એ ઓક્સિડેશન ઇલેક્ટ્રોડ છે જ્યાં ઇલેક્ટ્રોન મુક્ત થાય છે, જ્યારે કેથોડ પર રિડક્શન થાય છે.", "tag": ""}, {"q": "ગેલ્વેનિક કોષમાં ઇલેક્ટ્રોનનો પ્રવાહ કયા દિશામાં થાય છે?", "opts": [" એનોડ પરથી કેથોડ તરફ", " કેથોડ પરથી એનોડ તરફ", " સેલ્ટ બ્રિજ દ્વારા", " કોઈ પણ દિશામાં નહીં"], "correct": 0, "explain": "ગેલ્વેનિક કોષમાં બાહ્ય સર્કિટ દ્વારા ઇલેક્ટ્રોન એનોડ પરથી કેથોડ તરફ પ્રવાહિત થાય છે.", "tag": ""}, {"q": "સેલ્ટ બ્રિજનો મુખ્ય ઉપયોગ શું છે?", "opts": [" કોષના બે અર્ધકોષ વચ્ચે આયનોનું વહન કરીને વીજભારની તટસ્થતા જાળવવી", " ઇલેક્ટ્રોનનું વહન કરવું", " રાસાયણિક પ્રક્રિયા વેગવанта કરવી", " તાપમાન નિયંત્રિત કરવું"], "correct": 0, "explain": "સેલ્ટ બ્રિજમાં રહેલું વિદ્યુતવિભાજ્ય (જેમ કે KCl અથવા KNO₃) આયનો મુક્ત રીતે ચલાવી શકે છે, જેથી બંને અર્ધકોષોમાં વિદ્યુતભારની તટસ્થતા જળવાઈ રહે છે અને કોષ ચાલુ રહે છે.", "tag": ""}, {"q": "ડેનિયલ કોષ (Daniell cell) માં પોટાશિયમ ફેરોસાયનાઇડ (K₃[Fe(CN)₆]) ની જગ્યાએ મૂળભૂત રચનામાં વપરાતું વિદ્યુતવિભાજ્ય કયું છે?", "opts": [" ZnSO₄ અને CuSO₄", " NaCl અને KCl", " H₂SO₄", " AgNO₃"], "correct": 0, "explain": "ડેનિયલ કોષમાં ઝિંક અર્ધકોષમાં ZnSO₄ (પાત્ર) અને તાંબાના અર્ધકોષમાં CuSO₄ (પાત્ર) વિદ્યુતવિભાજ્ય તરીકે વપરાય છે, જેને સેલ્ટ બ્રિજ જોડેલો હોય છે.", "tag": ""}, {"q": "ગેલ્વેનિક કોષનું પ્રતિનિધિચિત્રણ (cell representation) લેખન રીત શું છે?", "opts": [" એનોડ | એનોડ દ્રાવણ || કેથોડ દ્રાવણ | કેથોડ", " કેથોડ | કેથોડ દ્રાવણ || એનોડ દ્રાવણ | એનોડ", " એનોડ || કેથોડ | દ્રાવણ | દ્રાવણ", " દ્રાવણ | એનોડ || કેથોડ | દ્રાવણ"], "correct": 0, "explain": "ગેલ્વેનિક કોષનું પ્રતિનિધિચિત્રણ લખતી વખતે ડાબી બાજુ એનોડ અને તેનું દ્રાવણ, મધ્યમાં સેલ્ટ બ્રિજ (||), જમણી બાજુ કેથોડ દ્રાવણ અને કેથોડ મૂકવામાં આવે છે. એકલી રેખા (|) ઘન-દ્રાવણ સીમા દર્શાવે છે.", "tag": ""}, {"q": "માનક હાઇડ્રોજન ઇલેક્ટ્રોડ (SHE) નું માનક વિભવ (E°) શું રીતે વ્યાખ્યાયિત કરવામાં આવે છે?", "opts": ["શૂન્ય (0 V) તરીકે", "+0.76 V તરીકે", "-0.76 V તરીકે", "+1.00 V તરીકે"], "correct": 0, "explain": "માનક હાઇડ્રોજન ઇલેક્ટ્રોડ (Standard Hydrogen Electrode) ને આંતરરાષ્ટ્રીય રીતે સંદર્ભ ઇલેક્ટ્રોડ તરીકે અપનાવવામાં આવ્યો છે અને તેનું માનક ઘટાડું વિભવ શૂન્ય (0 V) લેવામાં આવે છે. બીજા તમામ ઇલેક્ટ્રોડના E° મૂલ્યો આ સંદર્ભ સાથે સરખાવતા મેળવવામાં આવે છે.", "tag": ""}, {"q": "Zn | Zn²⁺(1 M) || Cu²⁺(1 M) | Cu કોષના પ્રતિનિધિચિત્રણમાં ડાબી બાજુના ઇલેક્ટ્રોડનો માનક ઘટાડું વિભવ −0.76 V અને જમણી બાજુનો +0.34 V છે. કોષનું E° મૂલ્ય કેટલું થશે?", "opts": ["+1.10 V", "−1.10 V", "+0.42 V", "−0.42 V"], "correct": 0, "explain": "E°cell = E°cathode − E°anode = E°(Cu²⁺/Cu) − E°(Zn²⁺/Zn) = 0.34 − (−0.76) = +1.10 V. ધન E°cell મૂલ્ય દર્શાવે છે કે કોષસ્પંદન સ્વયંભૂ પ્રક્રિયા ચલાવવા માટે પૂરતું છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું સૂત્ર ઇલેક્ટ્રોડ વિભવ (Electrode Potential) માટેનું સાચું વ્યાખ્યાયન આપે છે?", "opts": ["ઇલેક્ટ્રોડ પર થતી ઓક્સિડેશન કે ઘટાડું પ્રક્રિયા પ્રતિ ઇલેક્ટ્રોન સ્થાનાંતરિત થતી ઊર્જાનું માપ", "ઇલેક્ટ્રોડનું ભૌતિક તાપમાન જે ઇલેક્ટ્રોન આકર્ષે છે", "ઇલેક્ટ્રોલાઇટના PH નું પ્રત્યક્ષ માપ", "ઉષ્માગતિય સંભાવના (Thermodynamic Potential) જે ફક્ત તાપમાન પર આધારિત છે"], "correct": 0, "explain": "ઇલેક્ટ્રોડ વિભવ એ ઇલેક્ટ્રોડ-ઇલેક્ટ્રોલાઇટ અન્યિપર સંતુલન સમયે ઇલેક્ટ્રોન સ્થાનાંતરણ સાથે સંકળાયેલી ગિબ્સ મુક્ત ઊર્જા પરથી વ્યાખ્યાયિત થાય છે. તે ઓક્સિડેશન કે ઘટાડું પ્રક્રિયાની સ્વભાવિક દિશા અને વલણ દર્શાવે છે.", "tag": ""}, {"q": "જો કોઈ ધાતુનો માનક ઘટાડું વિભવ (Standard Reduction Potential) ધન મૂલ્ય ધરાવતો હોય, તો તે ધાતુ માટે શું સાચું છે?", "opts": ["તે H₂ સાપેક્ષે ઓક્સિડાઇઝ થઈ શકે છે, એટલે કે H⁺ થી ઓક્સિડેશન હાસિલ કરવાનું સ્વયંભૂ સામર્થ્ય ધરાવે છે", "તે H₂ કરતાં વધુ સ્થિર ધાતુ છે અને કોઈ પણ સ્થિતિમાં પ્રતિક્રિયા નહીં આપે", "તેનું ઘનિષ્ઠ ઓક્સિડેશન અવસ્થા અશક્ય છે", "તે શુદ્ધ પાણી સાથે પ્રક્રિયા કરીને હંમેશાં હાઇડ્રોજન વાયુ મુક્ત કરે છે"], "correct": 0, "explain": "ધન માનક ઘટાડું વિભવ ધરાવતી ધાતુ (જેમ કે Cu, Ag) H₂ કરતાં ઓછી સક્રિય હોય છે; તેથી તે ઓક્સિ , તો 96500 C વિદ્યુતથી કેટલી મોલ ઇલેક્ટ્રોનની જવાબદારી હોય અને Ag⁺ + e⁻ → Ag પ્રક્રિયા મુજબ કેટલું એજ જમા થાય?", "opts": ["1 mol ઇલેક્ટ્રોન, 108 g એજ", "1 mol ઇલેક્ટ્રોન, 1.08 g એજ", "0.1 mol ઇલેક્ટ્રોન, 10.8 g એજ", "10 mol ઇલેક્ટ્રોન, 1080 g એજ"], "correct": 1, "explain": "ફેરાડેના પ્રથમ નિયમ મુજબ, 1 F = 96500 C વિદ્યુત = 1 mol ઇલેક્ટ્રોન. Ag⁺ + e⁻ → Ag માં, 1 mol ઇલેક્ટ્રોન 1 mol Ag (108 g) જમા કરે. અહીં 96500 C એ 1 mol e⁻ છે, પણ પ્રશ્નમાં 1.08 g એજ જમા થાય છે, જે 0.01 mol Ag છે; તેથી પ્રશ્ન ફેરાડે અંશ સાથે સુસંગત છે — 1 F = 1 mol e⁻ અને Ag પ્રતિ 1 e⁻ → 108 g, પણ પ્રયોગમાં 1.08 g જમા થયા, જે 0.01 F અનુરૂપ.", "tag": ""}, {"q": "Kohlrausch ના નિયમ મુજબ, નીચેનામાંથી કયો વિધાન સત્ય છે?", "opts": ["સીમાંત મલન વિવર્ધનક્ષમતા (Λ°m) કોઈ પણ ઇલેક્ટ્રોલાઇટ માટે મંદતા પર સીધી રીતે માપી શકાય છે.", "શક્તિશાળી ઇલેક્ટ્રોલાઇટ માટે માત્ર Λ°m ની કિંમત આંશિક મલન વિવર્ધનક્ષમતામાંથી મળે છે.", "ક્ષારો (salts) માટે Λ°m બે આયનોના આયનીય વિવર્ધનક્ષમતાના સરવાળા બરાબર હોય છે, પણ મંદ એસિડ/આધાર માટે લાગુ પડતું નથી.", "ક્ષીણ ઇલેક્ટ્રોલાઇટ (જેવા કે CH₃COOH) માટે Λ°m ની કિંમત શક્તિશાળી ઇલેક્ટ્રોલાઇટ્સના મલન વિવર્ધનક્ષમતાના સરવાળા અને બાદબાકી દ્વારા નક્કી કરી શકાય છે."], "correct": 3, "explain": "Kohlrausch ના નિયમ મુજબ, Λ°m(HCl) + Λ°m(CH₃COONa) - Λ°m(NaCl) = Λ°m(CH₃COOH) મળે છે. આ પદ્ધતિથી ક્ષીણ ઇલેક્ટ્રોલાઇટનું Λ°m સીધું માપવામાં અશક્ય હોવા છતાં, શક્તિશાળી ઇલેક્ટ્રોલાઇટ્સના डेटા વડે અંદાજી શકાય છે. આ બધા ક્ષારો, એસિડ, આધારો માટે લાગુ પડે છે.", "tag": ""}, {"q": "ΔG° = -nFE°_cell સંબંધ મુજબ, ડેનિયલ કોષ (E° = +1.10 V, n = 2) માટે પ્રમાણિત ગિબ્સ મુક્ત ઊર્જા ફેરફાર ΔG° ની કિંમત શું છે? (F = 96500 C mol⁻¹)", "opts": ["ΔG° = -211.7 kJ mol⁻¹, પ્રક્રિયા સ્વયંભૂ છે", "ΔG° = +211.7 kJ mol⁻¹, પ્રક્રિયા સ્વયંભૂ નથી", "ΔG° = -105.9 kJ mol⁻¹, પ્રક્રિયા સંતુલન પર છે", "ΔG° = 0, કોષ સંતુલન પર છે"], "correct": 0, "explain": "ΔG° = -nFE° = -2 × 96500 × 1.10 = -212300 J mol⁻¹ ≈ -211.7 kJ mol⁻¹. ઋણ ΔG° સૂચવે છે કે પ્રક્રિયા પ્રમાણિત અવસ્થામાં સ્વયંભૂ (spontaneous) છે. ધન E°_cell હંમેશા ઋણ ΔG° અને સ્વયંભૂ પ્રક્રિયા સાથે સંકળાયેલું છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિકલ્પ નિર્વિદ્યુત વિઘટન (electrolysis) ના સમયે કેથોડ પર થતી પ્રક્રિયાનું વર્ણન કરે છે?", "opts": ["ઓક્સિડેશન", "રિડક્શન", "અયોગ્ય મિશ્રણ", "ઉષ્માઉત્પાદન"], "correct": 1, "explain": "કેથોડ (-) પર હંમેશા રિડક્શન થાય છે, જ્યાં ધન આયનો ઇલેક્ટ્રોન મેળવી ઘટે છે. એનೋડ (+) પર ઓક્સિડેશન થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન સચોટ છે? (ફેરાડેના વિદ્યુતવિભાજનના પ્રથમ નિયમ અંગે)", "opts": ["કેથોડ પર જમા થતું દળ વિદ્યુતપ્રવાહના સમય અને પ્રવાહના ગુણાકારના સમપ્રમાણમાં હોય છે.", "જમા થતું દળ પ્રવાહ તાપમાનના સમપ્રમાણમાં હોય છે.", "જમા થતું દળ વિદ્યુતપ્રવાહ અને સમયના સંયોજનથી સ્વતંત્ર હોય છે.", "વિદ્યુતપ્રવાહ વધારતા જમા થતું દળ ઘટે છે."], "correct": 0, "explain": "ફેરાડેના પ્રથમ નિયમ મુજબ, જમા થતું દળ m = ZIt હોય છે. અહીં Z વિદ્યુતરાસાયણિક તુલ્યમાન છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન ડેનિયલ કોષ માટે સાચું છે?", "opts": ["આ કોષમાં ઝીંક ઇલેક્ટ્રોડ ધન (positive) હોય છે.", "સેલ પ્રક્રિયા Zn + Cu2+ → Zn2+ + Cu છે.", "કોષમાં Zn|Zn2+ અર્ધકોષ ધન છે અને Cu|Cu2+ અર્ધકોષ ઋણ છે.", "ડેનિયલ કોષનો E°cell -1.10 V છે."], "correct": 1, "explain": "ડેનિયલ કોષની સેલ પ્રક્રિયા Zn(s) + Cu2+(aq) → Zn2+(aq) + Cu(s) હોય છે અને તેનો E°cell +1.10 V હોય છે. Zn એનોડ છે અને Cu કેથોડ છે.", "tag": ""}, {"q": "સોડિયમ ક્લોરાઇડના જલીય દ્રાવણના વિદ્યુતવિભાજન દરમિયાન એનોડ પર કયું ઉત્પાદિત થાય છે?", "opts": ["હાઇડ્રોજન વાયુ", "સોડિયમ ધાતુ", "ક્લોરિન વાયુ", "ઓક્સિજન વાયુ"], "correct": 2, "explain": "NaCl ના જલીય દ્રાવણના વિદ્યુતવિભાજનમાં, એનોડ પર Cl- આયનોનું ઓક્સિડેશન થઈને Cl2 વાયુ મળે છે, કારણ કે Cl- નો ઓક્સિડેશન વિભવ OH- કરતાં ઓછો થાય છે.", "tag": ""}, {"q": "કન્ડક્ટન્સ મીટર (કન્ડક્ટન્સ સેલ) નો સ્થિરાંક (cell constant) કેવી રીતે શોધવામાં આવે છે?", "opts": ["અજ્ઞાત વિદ્યુતવાહકતાવાળા ઇલેક્ટ્રોલાઇટના દ્રાવણના માપન પરથી.", "કન્ડક્ટન્સ અને વિદ્યુતવાહકતાના ગુણોત્તર પરથી.", "રેખીય વિદ્યુતવાહકતા અને માપી શકાય તેવા અંતરના ગુણોત્તર પરથી.", "સેલના કદ અને ઇલેક્ટ્રોડના ક્ષેત્રફળના ગુણોત્તર પરથી."], "correct": 2, "explain": "કન્ડક્ટન્સ મીટરનો સ્થિરાંક G* = κ/R છે, જ્યાં κ વિદ્યુતવાહકતા છે અને R પ્રતિરોધ છે. આમ, તે રેખીય વિદ્યુતવાહકતા અને માપી શકાય તેવા અંતરના ગુણોત્તર પરથી મળે છે.", "tag": ""}, {"q": "nર્ન્સ્ટ સમીકરણ મુજબ, Zn/Zn²⁺ (0.01 M) || Cu²⁺ (1.0 M)/Cu કોષના emf ની ગણતરી કરવા માટે નીચેમાંથી કયું સૂત્ર વાપરવામાં આવે છે? (E°cell = +1.10 V ધારો)", "opts": ["E_cell = 1.10 - (0.059/2) log(0.01/1.0)", "E_cell = 1.10 + (0.059/2) log(0.01/1.0)", "E_cell = 1.10 - (0.059/2) log(1.0/0.01)", "E_cell = 1.10 - 0.059 log(Zn²⁺/Cu²⁺)"], "correct": 0, "explain": "nર્ન્સ્ટ સમીકરણ E_cell = E°_cell - (0.059/n) log Q મુજબ, ડેનિયલ કોષમાં Q = [Zn²⁺]/[Cu²⁺] = 0.01/1.0 અને n = 2 હોય છે. તેથી E_cell = 1.10 - (0.059/2) log(0.01/1.0) એ સही પસંદગી છે.", "tag": ""}, {"q": "કોષની કાર્યક્ષમતા વધારવા માટે નીચેમાંથી કઈ રીત અપનાવવી જોઈએ?", "opts": ["ઉક્ષણ ઇલેક્ટ્રોડ (Anode) માં ઇલેક્ટ્રોલાઇટની સાંદ્રતા વધારવી", "ક્ષાર ઘટ્ટા ઇલેક્ટ્રોડ (Cathode) માં ઇલેક્ટ્રોલાઇટની સાંદ્રતા ઘટાડવી", "બંને ઇલેક્ટ્રોડ્સનું કદ નાનું રાખવું", "ઇલેક્ટ્રોલાઇટનું તાપમાન ઘટાડવું"], "correct": 0, "explain": "ઉક્ષણ ધ્રુવ (Anode) માં ઇલેક્ટ્રોલાઇટની સાંદ્રતા વધારવાથી Q ની કિંમત વધે છે, જે E_cell = E°_cell - (0.059/n) log Q માં log Q ઘટાડે છે અને એકમ emf વધારે છે. આમ કોષની કાર્યક્ષમતા વધે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું વિધાન ઇલેક્ટ્રોડ પોટેન્શિયલ (Electrode Potential) ના માપન સાથે સંબંધિત છે?", "opts": ["ઈલેક્ટ્રોડ પોટેન્શિયલ એકલ્પણે માપી શકાય છે", "ઈલેક્ટ્રોડ પોટેન્શિયલનું માપન હંમેશા બે ઇલેક્ટ્રોડ્સ વચ્ચે થાય છે", "ઈલેક્ટ્રોડ પોટેન્શિયલ માત્ર સકારાત્મક હોય છે", "ઈલેક્ટ્રોડ પોટેન્શિયલ બેટરીની અંદર માત્ર ઘટાડો લાવે છે"], "correct": 1, "explain": "ઈલેક્ટ્રોડ પોટેન્શિયલનું પરમાણ્વીય માપન શક્ય નથી; તે હંમેશા બે ઇલેક્ટ્રોડ્સ વચ્ચે માપવામાં આવે છે. આ માટે પ્રમાણિત હાઇડ્રોજન ઇલેક્ટ્રોડ (SHE) નો ઉપયોગ થાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું કોષ ચિત્રણ (Cell Notation) સચોટ રીતે દર્શાવે છે? [Zn|Zn²⁺(aq) || Cu²⁺(aq)|Cu]", "opts": ["ડાબી બાજુ ક્ષાર ઘટ્ટા ઇલેક્ટ્રોડ અને જમણી બાજુ ઉક્ષણ ઇલેક્ટ્રોડ", "ડાબી બાજુ ઉક્ષણ ઇલેક્ટ્રોડ અને જમણી બાજુ ક્ષાર ઘટ્ટા ઇલેક્ટ્રોડ", "ડાબી અને જમણી બંને બાજુ ઉક્ષણ ઇલેક્ટ્રોડ", "ડાબી અને જમણી બંને બાજુ ક્ષાર ઘટ્ટા ઇલેક્ટ્રોડ"], "correct": 1, "explain": "કોષ ચિત્રણમાં ડાબી બાજુ ઉક્ષણ ઇલેક્ટ્રોડ (Anode) અને જમણી બાજુ ક્ષાર ઘટ્ટા ઇલેક્ટ્રોડ (Cathode) દર્શાવવામાં આવે છે. Zn|Zn²⁺ → Oxidation (Anode) અને Cu²⁺|Cu → Reduction (Cathode) તેમછે.", "tag": ""}, {"q": "ΔG° = -nFE°_cell સંબંધ મુજબ, જો કોષનો પ્રમાણિત emf (E°_cell) ધન હોય, તો પ્રક્રિયા વિશે શું કહી શકાય?", "opts": ["પ્રક્રિયા સ્વયંસ્ફુરિત (Spontaneous) નથી", "પ્રક્રિયા સ્વયંસ્ફુરિત (Spontaneous) છે", "પ્રક્રિયા સંતુલનમાં છે", "પ્રક્રિયા પરિવર્તી (Reversible) છે"], "correct": 1, "explain": "ΔG° = -nFE°_cell સંબંધ મુજબ, E°_cell > 0 હોય તો ΔG° < 0 થાય, જેથી પ્રક્રિયા સ્વયંસ્ફુરિત (Spontaneous) બને. આ રાસાયણિક ઊર્જાનું વિદ્યુત ઊર્જામાં રૂપાંતર કરવાની ક્ષમતા દર્શાવે છે.", "tag": ""}, {"q": "25°C તાપમાને, જ્યારે પ્રતિક્રિયાનો સંતુલન અચળાંક K = 1 × 10⁻⁵ હોય, ત્યારે n = 2 ઇલેક્ટ્રોન વાહકતા ધરાવતા કોષની પ્રમાણિત emf (E°_cell) શું હશે?", "opts": ["-0.148 V", "+0.148 V", "-0.059 V", "+0.059 V"], "correct": 0, "explain": "E°_cell = (0.0591/n) log K સૂત્ર મુજબ, E°_cell = (0.0591/2) × log(10⁻⁵) = 0.02955 × (-5) = -0.148 V. ઋણ E°_cell સૂચવે છે કે પ્રમાણિત પરિસ્થિતિઓમાં પ્રતિક્રિયા અસ્વયંભૂ (non-spontaneous) છે.", "tag": ""}, {"q": "પ્રમાણિત હાઇડ્રોજન ઇલેક્ટ્રોડ (SHE) ના સંદર્ભમાં નીચેમાંથી કયું વિધાન અસત્ય છે?", "opts": ["આ ઇલેક્ટ્રોડની ઇલેક્ટ્રોડ પોટેન્શિયલ 0.00 V તરીકે વ્યાખ્યાયિત થાય છે.", "આ ઇલેક્ટ્રોડમાં પ્લેટિનમ ફોઇલનો ઉપયોગ થાય છે, જેના પર પ્લેટિનમ બ્લેક (પ્લેટિનમનું સૂક્ષ્મ કણોનું રૂપ) મૂકેલું હોય છે.", "SHE માં હાઇડ્રોજન વાયુનું દબાણ 1 atm અને H⁺ આયનની સાંદ્રતા 1 M હોવી જરૂરી છે.", "આ ઇલેક્ટ્રોડમાં પ્લેટિનમ ફોઇલનું રંગ પારદર્શક અને રંગહીન હોય છે, જેથી પ્રકાશ પસાર થઈ શકે."], "correct": 3, "explain": "SHE માં પ્લેટિનમ ફોઇલ પર પ્લેટિનમ બ્લેકની રેખા દોરવામાં આવે છે, જે અંધકાર (black) રંગની હોય છે અને હાઇડ્રોજન વાયુના અવશોષણને વધારે છે. તે પારદર્શક કે રંગહીન નથી.", "tag": ""}, {"q": "Fe³⁺(aq) + 3e⁻ → Fe(s) પ્રતિક્રિયા માટે પ્રમાણિત ઇલેક્ટ્રોડ પોટેન્શિયલ (E°) ની કિંમત શોધો, જો નીચેની માહિતી ઉપલબ્ધ હોય: Fe³⁺ + e⁻ → Fe²⁺; E° = +0.77 V અને Fe²⁺ + 2e⁻ → Fe; E° = -0.44 V.", "opts": ["-0.04 V", "+0.33 V", "-0.037 V", "+0.77 V"], "correct": 2, "explain": "ΔG° = -nFE° નો ઉપયોગ કરીને: ΔG₁° = -1×F×0.77, ΔG₂° = -2×F×(-0.44) = +0.88F. કુલ ΔG° = -0.77F + 0.88F = +0.11F. ત્રણ ઇલેક્ટ્રોન માટે, -3FE° = +0.11F ⇒ E° = -0.037 V.", "tag": ""}, {"q": "298 K તાપમાને, જો કોઈ રેડોક્સ પ્રતિક્રિયાનો સંતુલન અચળાંક K = 10⁻³ હોય, તો તે પ્રતિક્રિયા માટે E°_cell અને ΔG° ની કિંમતોના સ્વરૂપમાં શું કહી શકાય?", "opts": ["E°_cell ધન અને ΔG° ઋણ, તેથી પ્રતિક્રિયા સ્વયંભૂ છે.", "E°_cell ઋણ અને ΔG° ધન, તેથી પ્રતિક્રિયા અસ્વયંભૂ (non-spontaneous) છે.", "E°_cell શૂન્ય અને ΔG° શૂન્ય, તેથી પ્રતિક્રિયા સંતુલનમાં છે.", "E°_cell ધન અને ΔG° ધન, તેથી પ્રતિક્રિયા અસ્વયંભૂ છે."], "correct": 1, "explain": "K < 1 હોવાથી, log K ઋણ છે, જે E°_cell ને ઋણ બનાવે છે. ΔG° = -RT ln K અથવા ΔG° = -nFE°_cell મુજબ, ઋણ E°_cell માટે ΔG° ધન હોય છે, જે અસ્વયંભૂ પ્રતિક્રિયા દર્શાવે છે.", "tag": ""}, {"q": "298 K પર, Zn|Zn²⁺(0.1 M)||Cu²⁺(0.01 M)|Cu કોષ માટે નર્ન્સ્ટ સમીકરણ વડે કોષ પોટેન્શિયલ (E_cell) શોધો. E°_Zn²⁺/Zn = -0.76 V અને E°_Cu²⁺/Cu = +0.34 V.", "opts": ["1.07 V", "1.10 V", "1.13 V", "0.97 V"], "correct": 0, "explain": "E°_cell = 0.34 - (-0.76) = 1.10 V. Nernst સમીકરણ મુજબ: E_cell = 1.10 - (0.0591/2) log(0.1/0.01) = 1.10 - 0.02955 × 1 = 1.07 V.", "tag": ""}, {"q": "ઇલેક્ટ્રોકેમિકલ શ્રેણી (Electrochemical Series) માં, નીચે મોડી મૂકેલી ધાતુ પાસે કોણી હોય છે?", "opts": ["ઉચ્ચ રિડક્શન પોટેન્શિયલ અને બળપૂર્વક ઓક્સિડેશન", "ઉચ્ચ ઓક્સિડેશન પોટેન્શિયલ અને સરળતાથી રિડક્શન", "નીચું રિડક્શન પોટેન્શિયલ અને બળપૂર્વક ઓક્સિડેશન", "નીચું ઓક્સિડેશન પોટેન્શિયલ અને સરળતાથી રિડક્શન"], "correct": 3, "explain": "ઇલેક્ટ્રોકેમિકલ શ્રેણીમાં જે ધાતુ નીચે મૂકેલી હોય છે, તેનું સંતુલન પોટેન્શિયલ (Standard Electrode Potential) ઘનિષ્ઠ ઋણ હોય છે. તેથી તે સરળતાથી ઓક્સિડાઈત થાય છે અને તેનું રિડક્શન થવું બળપૂર્વક હોય છે. આમ, નીચેના મૂકાયેલ ધાતુ પાસે ઓક્સિડેશન પોટેન્શિયલ ઉચ્ચ અને રિડક્શન પોટેન્શિયલ નીચું હોય છે.", "tag": ""}, {"q": "નીચે આપેલમાંથી કયા ઇલેક્ટ્રોડ પાસે સૌથી વધુ ક્ષયગ્રાહી શક્તિ (Reduction Potential) હોય છે?", "opts": ["Li⁺/Li", "Na⁺/Na", "Cu²⁺/Cu", "Ag⁺/Ag"], "correct": 3, "explain": "ઇલેક્ટ્રોકેમિકલ શ્રેણીમાં Ag⁺/Ag નું પ્રમાણિત ક્ષયગ્રાહી પોટેન્શિયલ +0.80 V છે, જે Li⁺/Li (-3.04 V), Na⁺/Na (-2.71 V) અને Cu²⁺/Cu (+0.34 V) કરતાં વધુ ધન છે. જે ઇલેક્ટ્રોડનું ક્ષયગ્રાહી પોટેન્શિયલ જેટલું ધન હોય, તેની ક્ષયગ્રાહી શક્તિ પણ તેટલી hi.", "tag": ""}, {"q": "E°(Zn²⁺/Zn) = –0.76 V અને E°(Cu²⁺/Cu) = +0.34 V હોય તો, Zn|Zn²⁺||Cu²⁺|Cu કોષનું પ્રમાણિત EMF શું થશે?", "opts": ["+1.10 V", "–1.10 V", "+0.42 V", "–0.42 V"], "correct": 0, "explain": "કોષનું પ્રમાણિત વિદ્યુતચાલક બળ (EMF) શોધવા માટે E°_cell = E°_ cathode – E°_anode નો સૂત્ર વાપરવામાં આવે છે. અહીં કેથોડ તરફ Cu અને એનોડ તરફ Zn છે. તેથી, E°_cell = +0.34 – (–0.76) = +1.10 V. ધન EMF સૂચવે છે કે કોષ સ્વયંસ્ફુરિત (spontaneous) છે.", "tag": ""}, {"q": "વિદ્યુતવિભાજન દરમિયાન, જલીય દ્રાવણમાં Na⁺ અને H₂O બંને ક્ષયગ્રાહી થઈ શકે છે. આંશિક ક્ષયગ્રાહી પોટેન્શિયલ (Overpotential) નો વિચાર કરીને કેથોડ પર કયું જથ્થાત્મક રીતે થશે?", "opts": ["સોડિયમ ધાતુનું નિર્માણ", "હાઈડ્રોજન વાયુનું નિર્માણ", "ઓક્સિજન વાયુનું નિર્માણ", "સોડિયમ ઑક્સાઇડનું નિર્માણ"], "correct": 1, "explain": "જલીય સોડિયમ ક્લોરાઇડના વિદ્યુતવિભાજનમાં, Na⁺/Na નું પ્રમાણિત ક્ષયગ્રાહી પોટેન્શિયલ (–2.71 V) H⁺/H₂ (+0.00 V) કરતાં ઓછું ધન છે. વાસ્તવિક કોષમાં, જ્યારે H⁺/H₂ ની ઓછી ઘનતા હોય ત્યારે પણ H₂O નું ક્ષયગ્રાહી પોટેન્શિયલ (~–0.41 V at pH 7) Na⁺ના ક્ષયગ્રાહી પોટેન્શિયલ કરતાં વધુ ધન હોય છે. તેથી કેથોડ પર H₂ વાયુ જથ્થાત્મક રીતે મળે છે, Na ધાતુ નહીં.", "tag": ""}, {"q": "ઇલેક્ટ્રોકેમિકલ શ્રેણીના ઉપયોગો પૈકી, નીચે મોટેમાં કયું સચોટ નથી?", "opts": ["કોઈ ધાતુ બીજી ધાતુના ઉપરિત બેઠેલી હોય તો તેના આયનોનો સ્થાને બેસાડી શકાય છે", "સીધું જ ધન ઇલેક્ટ્રોકેમિકલ શ્રેણીથી ઇલેક્ટ્રોલાઇટિક સેલની કાર્યક્ષમતાનો અંદાજ લગાવી શકાય છે", "જલીય દ્રાવણના વિદ્યુતવિભાજન દરમિયાન કયા આયનનો ક્ષયગ્રાહી થશે તે નક્કી કરવામાં મદદ મળે છે", "કયા ધાતુ જલીય ઍસિડમાંથી H₂ વાયુ મુક્ત કરી શકે છે તે જાણવા મદદ મળે છે"], "correct": 1, "explain": "ઇલેક્ટ્રોકેમિકલ શ્રેણી મુખ્યત્વે સ્વયંસ્ફુરિત (galvanic) કોષોની દિશા અને ધાતુઓની સક્રિયતા નક્કી કરવા માટે ઉપયોગી છે. વિદ્યુતવિભાજક સેલ (Electrolytic Cell) માં EMF ઋણ હોય છે અને બાહ્ય વિદ્યુત વહનની જરૂર પડે છે, જેને શ્રેણીથી સીધું જ અંદાજી શકાતું નથી. A, C અને D ત્રણે વિધાનો ઇલેક્ટ્રોકેમિકલ શ્રેણીના પ્રમાણિત ઉપયોગો છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોકેમિસ્ટ્રી મેટ્રિક્સ મોડેલ માં, કોષ અચળાંક (cell constant) શુ છે?", "opts": ["ઇલેક્ટ્રોડ વચ્ચેનું અંતર વડે વપરાગત ઇલેક્ટ્રોડનું ક્ષેત્રફળ ભાગવા", "ઇલેક્ટ્રોડનું ક્ષેત્રફળ વડે ઇલેક્ટ્રોડ વચ્ચેનું અંતર ભાગવા", "ઇલેક્ટ્રોડ વચ્ચેનું અંતર અને ઇલેક્ટ્રોડનું ક્ષેત્રફળનો ગુણાકાર", "ઇલેક્ટ્રોડનું ક્ષેત્રફળ અને વપરાગત દ્રાવણની મોલરતાનો ગુણાકાર"], "correct": 0, "explain": "કોષ અચળાંક એ ઇલેક્ટ્રોડ વચ્ચેનું અંતર (l) ને ઇલેક્ટ્રોડના ક્ષેત્રફળ (A) વડે ભાગવાથી મળે છે. તેનું એકમ cm⁻¹ અથવા m⁻¹ છે.", "tag": ""}, {"q": "Kohlrausch ના નિયમ મુજબ, ઓછી સાંદ્રતા પર HCl ની મોલર ચાલકતા (Λm°) શું દર્શાવે છે?", "opts": ["H⁺ અન Cl⁻ આયનોની સીમિત મોલર ચાલકતાઓનો સરવાળો", "H⁺ અન Cl⁻ આયનોની સીમિત મોલર ચાલકતાઓનો તફાવત", "H⁺ અને Cl⁻ ની ચાલકતાઓનો ગુણાકાર", "HCl અણુની મોટી સાંદ્રતા પર મળતી ચાલકતા"], "correct": 0, "explain": "Kohlrausch ના નિયમ મુજબ, સીમિત મોલર ચાલકતા (Λm°) એ દરેક આયનની સીમિત મોલર ચાલકતાઓનો સરવાળો છે. Λm°(HCl) = λ°(H⁺) + λ°(Cl⁻).", "tag": ""}, {"q": "ડેન્સિટી મોટા થવાથી ઇલેક્ટ્રોલાઇટિક દ્રાવણની મોલરતા પર શું અસર થાય છે?", "opts": ["મોલરતા વધે છે", "મોલરતા ઘટે છે", "મોલરતા પર કોઈ અસર થતી નથી", "પ્રથમ ઘટે છે પછી વધે છે"], "correct": 2, "explain": "મોલરતા એ દ્રાવણના એકમ કદમાં રહેલા દ્રાવ્યના મોલની સંખ્યા છે. ડેન્સિટી વધવાથી મોલરતા પર સીધી અસર થતી નથી; તે દ્રાવણની સાંદ્રતા પર આધારિત છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોકેમિકલ સિરીઝમાં Ag/Ag⁺ અને Cu/Cu²⁺ પૈકી કોણો વધુ સારો ઑક્સિડેશન કરનાર છે?", "opts": ["Ag, કારણ કે E°(Ag⁺/Ag) = +0.80 V", "Cu, કારણ કે E°(Cu²⁺/Cu) = +0.34 V", "બંને સમાન છે", "ઉપરોક્ત માહિતી અપૂરતી છે"], "correct": 0, "explain": "ઉચ્ચ ઇલેક્ટ્રોડ પોટેન્શિયલ ધરાવતો ધાતુ વધુ સરળતાથી ઑક્સિડાઇઝ થાય છે. Ag⁺/Ag નું E° (+0.80 let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

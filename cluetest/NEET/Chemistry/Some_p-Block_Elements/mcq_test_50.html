<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Some p-Block Elements — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Some p-Block Elements — 📝 50 MCQ Test</h1>
    <p>🩺 NEET UG — Gujarati · Chemistry · કુલ પ્રશ્નો: 50</p>
  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-05</footer>
</div>
<script>
const QUIZ = [{"q": "p-બ્લોક તત્વોનો સામાન્ય ઇલેક્ટ્રોનિક વિન્યાસ કયો છે?", "opts": ["ns²np¹–⁶", "(n-1)d¹–¹⁰ ns²", "ns¹–²", "(n-1)d¹–¹⁰ ns² np¹–⁶"], "correct": 0, "explain": "p-બ્લોક તત્વોમાં અંતિમ ઇલેક્ટ્રોન p-ઓર્બિટલમાં પ્રવેશે છે, તેથી તેમનો સામાન્ય ઇલેક્ટ્રોનિક વિન્યાસ ns²np¹–⁶ હોય છે.", "tag": ""}, {"q": "p-બ્લોક તત્વોની સમયની કઈ ઊભી ગોળીઓ (groups) માં આવેલી હોય છે?", "opts": ["13 થી 18", "1 અને 2", "3 થી 12", "13, 14 અને 15"], "correct": 0, "explain": "p-બ્લોક તત્વો સમયની 13મી થી 18મી ઊભી ગોળીઓ (groups) માં આવેલા છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોન ગ્રહણ એન્થાલપી (Electron gain enthalpy) ની વ્યાખ્યા કઈ છે?", "opts": ["નિષ્ક્રિય, ગેસીય પરમાણુમાં એક ઇલેક્ટ્રોન ઉમેરતાં મુક્ત થતી અથવા શોષાતી ઉર્જા", "પરમાણુમાંથી ઇલેક્ટ્રોન દૂર કરવા માટેની લાગુ પડતી ઉર્જા", "રાસાયણિક બંધ તૂટવા માટેની ઉર્જા", "પરમાણુનું ઇલેક્ટ્રોન વિના બીજા ઇલેક્ટ્રોન ધરાવતા પરમાણુમાં રૂપાંતરિત થવા માટેની ઉર્જા"], "correct": 0, "explain": "ઇલેક્ટ્રોન ગ્રહણ એન્થાલપી એ નિષ્ક્રિય, ગેસીય અવસ્થામાં રહેલા પરમાણુમાં એક ઇલેક્ટ્રોન ઉમેરતાં મુક્ત થતી અથવા શોષાતી ઉર્જા છે.", "tag": ""}, {"q": "પરમાણ્વીય ત્રિજ્યા (Atomic radius) શું દર્શાવે છે?", "opts": ["પરમાણ્વીય કેન્દ્ર (Nucleus) થી સૌથી દૂરના ઇલેક્ટ્રોન સુધીનું સરેરાશ અંતર", "બે પરમાણુઓ વચ્ચેનો બંધ લંબાઈ", "પરમાણુનું દળ", "ઇલેક્ટ્રોનની સંખ્યા"], "correct": 0, "explain": "પરમાણ્વીય ત્રિજ્યા એ પરમાણ્વીય કેન્દ્ર (Nucleus) થી સૌથી દૂરના ઇલેક્ટ્રોન સુધીનું સરેરાશ અંતર છે.", "tag": ""}, {"q": "p-બ્લોક તત્વોમાં ઑક્સિડેશન અવસ્થાઓ (Oxidation state) વિશે કયું કથન સાચું છે?", "opts": ["ઘણા p-બ્લોક તત્વો ધન અને ઋણ ઉભય ઑક્સિડેશન અવસ્થાઓ દર્શાવી શકે છે", "p-બ્લોક તત્વો માત્ર ધન ઑક્સિડેશન અવસ્થાઓ જ દર્શાવે છે", "p-બ્લોક તત્વોમાં કોઈ ઑક્સિડેશન અવસ્થા હોતી નથી", "p-બ્લોક તત્વો માત્ર ઋણ ઑક્સિડેશન અવસ્થાઓ જ દર્શાવે છે"], "correct": 0, "explain": "p-બ્લોક તત્વોમાં ઇલેક્ટ્રોન ગુમાવવા અથવા મેળવવાની ક્ષમતા હોય છે, તેથી તેઓ ધન અને ઋણ ઑક્સિડેશન અવસ્થાઓ બંને દર્શાવી શકે છે.", "tag": ""}, {"q": "બોરોન નામક p-બ્લોક તત્વ વિશે નીચેનામાંથી કયું નિવેદન સાચું છે?", "opts": ["Boron is a non-metal with high ionization enthalpy and small size, leading to covalent bonding.", "Boron forms cationic compounds similar to group 1 metals due to its low ionization energy.", "Boron readily loses three electrons to form B³⁺ ions in aqueous solutions.", "Boron's chemical behavior is identical to aluminum due to diagonal relationship only."], "correct": 0, "explain": "બોરોનનું પરમાણ્વીય કદ ખૂબ જ નાનું અને આયનીકરણ એન્થાલ્પી ખૂબ જ ઉચ્ચ હોવાથી તે ઇલેક્ટ્રોન ગુમાવવાને બદલે સહસંયોજક બંધ (covalent bonds) બનાવે છે.", "tag": ""}, {"q": "બોરોનની હેલ્લાઇડ BX₃ (જ્યાં X = F, Cl, Br, I) ની Lewis એસિડ ગુણવત્તાની તુલના કરતી વખતે કયું ક્રમ સાચું છે?", "opts": ["BF₃ < BCl₃ < BBr₃ < BI₃", "BI₃ < BBr₃ < BCl₃ < BF₃", "BCl₃ > BF₃ > BBr₃ > BI₃", "બધા BX₃ સમાન Lewis એસિડ છે."], "correct": 1, "explain": "BF₃ માં ફ્લોરિનના ડોનેટર ઓર્બિટલ્સ અને બોરોનના ખાલી p-ઓર્બિટલ વચ્ચે π-બેકબોન્ડિંગ (back bonding) સર્જાય છે, જેથી B પરનું ઇલેક્ટ્રોનઘાટું ઓછું થાય છે અને તેની Lewis એસિડ શક્તિ ઘટે છે. આથી બકબોન્ડિંગની શક્તિ BF₃ > BCl₃ > BBr₃ > BI₃ હોવાથી Lewis એસિડicity BI₃ > BBr₃ > BCl₃ > BF₃.", "tag": ""}, {"q": "બોરેક્સ સોડિયમ ટેટરાબોરેટ (Na₂B₄O₇·10H₂O) નું રાસાયણિક સૂત્ર અને તેનું મૂળભૂત ગુણધર્મ કયું છે?", "opts": ["Na₂[B₄O₅(OH)₄]·8H₂O; weak acid", "Na₂[B₄O₅(OH)₄]·8H₂O; weak base in aqueous solution", "NaBO₂; strong base", "B₂O₃; neutral oxide"], "correct": 1, "explain": "બોરેક્સનું સાચું સૂત્ર Na₂[B₄O₅(OH)₄]·8H₂O છે. જલીય દ્રાવણમાં તે હાઇડ્રોક્સાઇડ આયનો મુક્ત કરીને duʋaલ્સ (weak base) તરીકે વર્તે છે.", "tag": ""}, {"q": "કાર્બન અને સિલિકોન વચ્ચેના તફાવતોમાંથી કયું વિધાન ખોટું છે?", "opts": ["કાર્બન pπ-pπ બંધ બનાવી શકે છે, સિલિકોન pπ-dπ બંધ બનાવી શકે છે.", "કાર્બનમાં ઇલેક્ટ્રોનેગેટિવિટી સિલિકોન કરતાં વધારે છે.", "C-C બંધની શક્તિ Si-Si બંધ કરતાં ઓછી છે.", "કાર્બન ચેઇનિંગ (catenation) માં સિલિકોન કરતાં વધુ સક્ષમ છે."], "correct": 2, "explain": "C-C બંધની બંધ વિઘટન ઉર્જા (bond dissociation energy) Si-Si બંધ કરતાં ઘણી વધારે છે, જે કાર્બનની ચેઇનિંગ ગુણવત્તા (catenation) નું કારણ છે.", "tag": ""}, {"q": "બો pts": ["બોરિક એસિડ પ્રોટોન દાન કરતો પ્રબળ એસિડ છે જે H⁺ આપીને કાર્યરત થાય છે.", "બોરિક એસિડ લ્યુઇસ એસિડ તરીકે વર્તે છે — OH⁻ ગ્રહણ કરી [B(OH)₄]⁻ બનાવે છે અને H⁺ મુક્ત કરે છે.", "બોરિક એસિડ બેઝિક સ્વભાવ ધરાવે છે અને H⁺ સ્વીકારી [BH₄]⁻ બનાવે છે.", "બોરિક એસિડ સીધું બોરોન પરમાણુ પરથી CO₂ મુક્ત કરે છે."], "correct": 0, "explain": "બોરિક એસિડ H₃BO₃ એ દુર્બળ એસિડ છે, પ્રોટોન દાતા તરીકે નહીં પણ લ્યુઇસ એસિડ તરીકે વર્તે છે. તે OH⁻ આયન સ્વીકારી [B(OH)₄]⁻ બનાવે છે અને પરિણામે H⁺ મુક્ત થાય છે, જેના કારણે દ્રાવણમાં એસિડિટી જોવા મળે છે.", "tag": ""}, {"q": "ડેકેબોરેન (B₁₀H₁₄) ની રચનામાં કયા પ્રકારના હાઇડ્રોજન બંધ જોવા મળે છે?", "opts": ["ફક્ત સમાન (terminal) B–H સામાન્ય બંધ જ હોય છે.", "સમાન B–H બંધ અને B–H–B બ્રિજ બંધ બંને હોય છે.", "ફક્ત B–H–B બ્રિજ બંધ હોય છે, કોઈ સમાન B–H બંધ હોતો નથી.", "B₁₀H₁₄ માં B–H–B ત્રિ-કેન્દ્રીય બ્રિજ બંધ અને સમાન (terminal) B–H સામાન્ય બંધ બંને હોય છે; B₁₀H₈ ભાગમાં ચાર બ્રિજ હાઇડ્રોજન અને બાકીના ૬ સમાન હાઇડ્રોજન હોય છે."], "correct": 1, "explain": "ડેકેબોરેન (B₁₀H₁₄) માં દરેક બોરોન પરમાણુ સાથે એક સમાન (terminal) B–H બંધ હોય છે, અને બોરોન પૉલિહેડ્રોનના અણુ પર B–H–B ચાર-ઇલેક્ટ્રોન-ત્રિ-કેન્દ્રીય બ્રિજ બંધ પણ હોય છે. આ બંને પ્રકારના બંધ એકબીજા સાથે અણુની સ્થિરતા પ્રદાન કરે છે.", "tag": ""}, {"q": "કાર્બન સમૂહ (Group‑14) ના તત્વોમાં, યોગ્ય ક્રમમાં નીચેનામાંથી કયો ગુણધર્મ વધતો જાય છે?", "opts": ["આયનીકરણ એન્થાલ્પી", "ઇલેક્ટ્રોન ગ્રહણ પ્રવૃત્તિ", "ધાતુમય સ્વભાવ", "વેલેન્સી બેન્ડનો આંતર-પરમાણ્વિક અંતર"], "correct": 2, "explain": "કાર્બન સમૂહમાં ઉપરથી નીચે જતાં પરમાણુ કદ વધે છે, તેથી ઇલેક્ટ્રોન દૂર કરવાની પ્રવૃત્તિ વધે છે અને ધાતુમય સ્વભાવ વધતા જાય છે. આયનીકરણ એન્થાલ્પી અને ઇલેક્ટ્રોન ગ્રહણ પ્રવૃત્તિ ઘટે છે, જ્યારે 'આંતર-પરમાણ્વિક અંતર' શબ્દપ્રયોગ પ્રમાણભૂત નથી.", "tag": ""}, {"q": "કાર્બનની અસામાન્ય વર્તણૂક (anomalous behaviour) નીચેમાંથી કયા કારણોસર થાય છે?", "opts": ["તેનો નાનો પરમાણુ કદ અને ઊંચી વિદ્યુતઋણતા", "તેની સંયોજકતા ૪ હોવા છતાં તે sp³ સંકરણ ધરાવતું નથી", "તેમાં d-ઓર્બિટલનો સમાવેશ શક્ય હોવાથી તે પાંચકોઓડિનેટ બન શકે છે", "તે માત્ર ધાત્વિક બંધ બનાવે છે અને હંમેશા અધાતુ છે"], "correct": 0, "explain": "કાર્બનનું નાનું પરમાણુ કદ અને ઊંચી વિદ્યુતઋણતાને કારણે તે π-π બંધ (pπ-pπ) સરળતાથી બનાવી શકે છે, જે સમૂહના અન્ય તત્વોમાં સામાન્ય રીતે જોવા મળતા નથી. આથી તેની રચનામાં વિશેષતાઓ જોવા મળે છે.", "tag": ""}, {"q": "CO₂ ના આણ્વીય રચનામાં કાર્બનનું સંકરણ અને અણુની રેખીય રચનાનું કારણ કયું છે?", "opts": ["sp³ સંકરણ; ચાર ભાગીદાર ઇલેક્ટ્રોન યુગ્મો હોવાથી", "sp² સંકરણ; ત્રણ σ-બંધ અને એક π-બંધ હોવાથી", "sp સંકરણ; બે σ-બંધ અને બે π-બંધ રેખીય ભૂમિતિ આપે છે", "અસંકરિત p-ઓર્બિટલ; બંધ ખૂણો ૧૨૦° હોવાથી"], "correct": 2, "explain": "કાર્બન sp સંકરિત હોય છે અને બે σ-બંધ (C=O) સાથે R = ૧૮૦° નો રેખીય આકાર આપે છે. દરેક C=O બંધમાં એક σ-બંધ અને એક π-બંધ હોય છે, કુલ બે π-બંધ હોવાથી અણુ રેખીય બને છે.", "tag": ""}, {"q": "નીચેમાંથી કયો સિલિકેટ્સ (silicates) નો મૂળભૂત એકમ છે?", "opts": ["[SiO₄]⁴⁻", "[Si₂O₆]²ⁿ⁻", "[SiO₃]²⁻", "[SiO₂]ₙ"], "correct": 0, "explain": "સિલિકેટ્સનો મૂળભૂત રચનાત્મક એકમ ટેટ્રાહેડ્રલ [SiO₄]⁴⁻ છે. આ એકમ એકબીજા સાથે ઓક્સિજન પરમાણુઓના સંગમથી વિવિધ શૃંખલા, સ્ટ્રેટ, ટૂંબક અથવા 3D જાળી રચના બનાવે છે.", "tag": ""}, {"q": "PbX₄ (જ્યાં X = F, Cl, Br, I) માંથી કયો યોગ્ય જોડીમાં ધ્રુવીય બંધ ધરાવતો હોવા છતાં અસ્થિર છે?", "opts": ["PbF₄ અને PbCl₄ બંને સ્થિર છે", "PbI₄ અસ્થિર છે પણ PbBr₄ સ્થિર છે", "PbCl₄ અને PbBr₄ ઉષ્માથી વિઘટન પામે છે", "PbF₄ સ્થિર છે, પરંતુ PbI₄ અસ્થિર છે"], "correct": 3, "explain": "Pb(IV) નું ઓક્સિડેશન સ્થિતિ નીચલા સમૂહ તત્વોમાં 'ઇનોર્ટ પેરિયર અસર'ને કારણે અસ્થિર થાય છે. PbF₄ સંયોગમાં F ની ઊંચી ઇલેક્ટ્રોનઋણતાને કારણે સ્થિર રહે છે, જ્યારે PbI₄ I⁻ ની ઘટતી ઇલેક્ટ્રોનઋણતા અને Pb(IV) ની ઓક્સિડાઇઝિંગ શક્તિને કારણે અસ્થિર છે અને લઘુત્તમ ઉષ્માએ વિઘટન પામે છે.", "tag": ""}, {"q": "સિલિકોન (Silicon) ના સંયોજનો માંથી silicone ની રચનામાં મૂળભૂત એકમ કયો છે?", "opts": ["-Si-O-Si- સંરચના", "-C-O-C- સંરચના", "-Si-C-Si- સંરચના", "-O-C-O- સંરચના"], "correct": 0, "explain": "Silicone એ સિલિકોન, ઓક્સિજન અને કાર્બન ધરાવતા સંયોજનોનું પોલિમર છે, જેમાં મૂળભૂત એકમ -Si-O-Si- બંધની રચના હોય છે.", "tag": ""}, {"q": "ટેલક (Talc) ના સિલિકેટમાં કયા પ્રકારનો સિલિકેટ એકમ જોવા મળે છે?", "opts": ["3D જેવી નેટ સંરચના", "શીટ જેવી સંરચના", "શૃંખલા જેવી સંરચના", "મોતી જેવી સંરચના"], "correct": 1, "explain": "ટેલક એ એક 2D શીટ (Layered) સિલિકેટ છે, જેમાં [SiO₄] ટેટ્રાહેડ્રાની શીટ સંરચના જોવા મળે છે, જે હલકી અને સ્નેહી (smooth) ગુણધર્મો આપે છે.", "tag": ""}, {"q": "ઝેઓલાઇટ (Zeolite) ની રચના કયા ટેટ્રાહેડ્રાના જોડાણથી બને છે?", "opts": ["AlO₄ અને SiO₄", "BO₃ અને SiO₄", "PO₄ અને SiO₄", "SO₄ અને SiO₄"], "correct": 0, "explain": "ઝેઓલાઇટ એ AlO₄ અને SiO₄ ટેટ્રાહેડ્રાનું સહસંયોજક બંધ દ્વારા જોડાણથી બનેલું પોરસ (porous) 3D જાળીદાર સંયોજન છે, જે આયન-અદલાબદલી (ion-exchange) માટે વપરાય છે.", "tag": ""}, {"q": "મોનોસિલેન (Monosilane) નું રાસાયણિક સૂત્ર શું છે?", "opts": ["SiH₄", "Si₂H₆", "SiH₃Cl", "SiO₂"], "correct": 0, "explain": "મોનોસિલેન એ સિલિકોનનું સૌથી સરળ હાઇડ્રાઇડ છે, જેનું સૂત્ર SiH₄ છે અને તે મિથેન (CH₄) સાથે સરખાવી શકાય છે.", "tag": ""}, {"q": "સિલિકોન (Silicone) ની નીચે આપેલ વિશેષતાઓમાંથી કઈ સાચી છે?", "opts": ["ઉચ્ચ તાપમાન સ્થિરતા", "ઓછું ઘનત્વ", "વિદ્યુત વાહકતા", "જળદ્રાવ્યતા"], "correct": 0, "explain": "સિલિકોન (polysiloxane) ઉચ્ચ તાપમાન સ્થિરતા, રાસાયણિક અક્રિયાશીલતા અને જલવિરોધી ગુણધર્મો ધરાવે છે, જેથી તે કોઈ પણ ઉચ્ચ-તાપમાન એપ્લિકેશનમાં ઉપયોગી છે.", "tag": ""}, {"q": "ઓઝોન (O₃) અણુની રચના અને બંધકોણ વિશે નીચેમાંથી કયો/કઈ સ્પષ્ટતા સાચી છે?", "opts": ["ઓઝોનનું બંધકોણ આશરે ૧૧૬.૮° છે અને તે એક પ્રતિધ્રુવીય રેખીય અણુ છે.", "ઓઝોન અણુમાં બે સમાન ઑક્સિજન-ઑક્સિજન બંધ રેઝોન્સેન્સથી સ્થિરીકૃત થયેલા હોય છે, જેમની લંબાઈ ૧૨૭.૮ pm છે અને બંધકોણ આશરે ૧૧૬.૮° છે.", "ઓઝોન અણુ એક સ્થિર અણુ છે જે હિમ્બદ્ધ સમસ્થાનિકોનું નમૂના બનાવવા માટે વપરાય છે.", "ઓઝોન ફક્ત ઉત્તેજિત સ્થિતિમાં જ મળે છે અને તેના બંને ઑક્સિજન-ઑક્સિજન બંધ અલગ અલગ લંબાઈ ધરાવે છે."], "correct": 1, "explain": "ઓઝોન (O₃) એક પ્રતિધ્રુવીય, વળાયેલી (Angular/V-shaped) રચના ધરાવે છે. તેના બે O–O બંધ રેઝોન્સેન્સને લીધે સમાન લંબાઈ (૧૨૭.૮ pm) ધરાવે છે અને બંધકોણ આશરે ૧૧૬.૮° હોય છે.", "tag": ""}, {"q": "સંપર્ક પ્રક્રિયા (Contact Process) માં SO₂ નું SO₃ માં ઓક્સિડેશન કરવા માટે કયો function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<head>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "સપાટીય રસાયણ વિજ્ઞાન એ શા માટે થાય છે?", "opts": ["સપાટીય ક્ષેત્રફળ પર રહેલા મૂલકોની ભાવના માટે", "વિક્રિયાકારકની પ્રતિક્રિયાશીલતા વધારવા માટે", "સંઘના અણુઓની વ્યવસ્થા માટે", "દ્રવનીકરણની દ્રવ્યમાં ઘુલાણી માટે"], "correct": 0, "explain": "સપાટીય રસાયણ વિજ્ઞાન એ ત્યારે થાય છે જ્યારે સામગ્રીનો પ્રમાણ સપાટીય ક્ષેત્રફળ સાથે સંબંધિત હોય, જ્યાં મૂલકોની ભાવના મહત્વપૂર્ણ થાય છે.", "tag": ""}, {"q": "સહયોગીય ક્રિયા શા પ્રકારની છે?", "opts": ["વિક્રિયાકારક વગરની", "વિક્રિયાકારકની સહાયેથી", "ઉષ્ણતા વગરની", "દબાણ વગરની"], "correct": 1, "explain": "સહયોગીય ક્રિયા એ વિક્રિયાકારકની ઉપસ્થિતિમાં જોઈતી છે, પરંતુ વિક્રિયાકારક નિઃશબ્દ રીતે ફેરવાઈ નથી ત્યારે પણ તેની ભૂમિકા હોય છે.", "tag": ""}, {"q": "એડ્સોર્પ્શનનું મુખ્ય લક્ષણ શું છે?", "opts": ["દ્રવ્યની સપાટીય સપાટી પર જ મૂલકોનું સંઘટન", "સમગ્ર દ્રવ્યમાં સમાન રીતે મૂલકોનું વિતરણ", "મૂલકોનું દ્રવ્યની અંદર સમાવેશ", "મૂલકોનું સપાટીય સપાટી પર જ મૂલકોનું સંઘટન"], "correct": 0, "explain": "એડ્સોર્પ્શનમાં મૂલકો દ્રવ્યની સપાટીય સપાટી પર જ સંઘટિત થાય છે, જ્યારે ડિસોર્પ્શનમાં તેઓ પોછળી જાય છે.", "tag": ""}, {"q": "ફિઝિકલ એડ્સોર્પ્શનમાં મુખ્ય થયેલ છે:", "opts": ["રસાયણિક બંધનનું", "વૈજ્ઞાનિક બંધનનું", "વૈજ્ઞાનિક અને રસાયણિક બંધનનું", "કોઈપણ પ્રકારનું બંધન"], "correct": 1, "explain": "ફિઝિકલ એડ્સોર્પ્શનમાં મુખ્ય વૈજ્ઞાનિક બંધન હોય છે, જ્યારે રસાયણિક એડ્સોર્પ્શનમાં રસાયણિક બંધન હોય છે.", "tag": ""}, {"q": "એડ્સોર્પ્શનની વિરામક્ષિપ્તા શા સાથે સંબંધિત છે?", "opts": ["એન્થેલ్పી", "એન્ટ્રોપી", "એન્હેલ્પી", "એન્હેન્સ્મન"], "correct": 0, "explain": "એડ્સોર્પ્શનની વિરામક્ષિપ્તા એન્થેલ્પી સાથે સંબંધિત છે, જ્યાં એડ્સોર્પ્શનની પ્રકૃતિ ઉષ્ણતા નીચી અથવા ઊંચી હોય છે.", "tag": ""}, {"q": "Fajan's નિયમ મુજબ, ક્લોરાઈડ આયન (Cl⁻) સાથેના ધન આયનની ધ્રુવીભવન ક્ષમતા વધારે તો કયા ધન આયન સાથે?", "opts": ["Na⁺", "Mg²⁺", "Al³⁺", "K⁺"], "correct": 2, "explain": "Fajan નિયમ મુજબ, ધન આયનનું કદ ઓછું અને વેળા વધારે તો ધ્રુવીભવન ક્ષમતા વધારે હોય છે. Al³⁺ નું કદ Na⁺, Mg²⁺, K⁺ કરતાં ઓછું છે અને તેની વિદ્યુતભાર ક્ષમતા વધારે છે, તેથી તે Cl⁻ નું સૌથી વધુ ધ્રુવીભવન કરે છે.", "tag": ""}, {"q": "કેટલાક પ્રવાહી તરલ માધ્યમમાં ઘન પદાર્થના સૂક્ષ્મ કણોના ફેલાવાથી જે મિશ્રણ મળે છે તેનું નામ શું છે?", "opts": ["જેલ (Gel)", "પ્રોટોકોલ્ડ (Protcolloid)", "ગ્લોબ્યુલર કોલોઇડ (Globular Colloid)", "સોલ (Sol)"], "correct": 3, "explain": "જ્યારે ઘન પદાર્થના સૂક્ષ્મ કણો પ્રવાહી માધ્યમમાં વેરવાય છે ત્યારે જે મિશ્રણ મળે છે તેને સોલ (Sol) કહે છે. તે ઉદાહરણ માટે માટીનું સોલ અથવા ચોખાનું સોલ છે.", "tag": ""}, {"q": "ઉચ્ચ તાપમાને ફિઝિકલ એડ્સોર્પ્શનનું પ્રમાણ શું થાય છે અને કઈ કારણોસર?", "opts": ["વધે છે; ઉચ્ચ તાપમાને આંતરઆણ્વીય બળો પ્રબળ બને છે.", "ઘટે છે; ઉચ્ચ તાપમાને અણુઓની ગતિજ ઊર્જા વધે છે, જેથી એડ્સોર્બેટ એડ્સોર્બેન્ટથી છૂટો પડી શકે છે.", "અચળ રહે છે; એડ્સોર્પ્શન તાપમાનથી સ્વતંત્ર પ્રક્રિયા છે.", "ઘટે છે; ઉચ્ચ તાપમાને એડ્સોર્બેન્ટની સપાટી અસ્થિર બને છે."], "correct": 1, "explain": "ફિઝિકલ એડ્સોર્પ્શન એ ઉષ્માક્ષેપી પ્રક્રિયા છે. ઉચ્ચ તાપમાને, એડ્સોર્બેટ અણુઓની ગતિજ ઊર્જા વધે છે, જેના કારણે તેઓ એડ્સોર્બેન્ટ સપાટી સાથેના નબળા વાન ડર વાલ્સ બળોને તોડી શકે છે અને છૂટા પડી જાય છે. તેથી, એડ્સોર્પ્શનનું પ્રમાણ ઘટે છે.", "tag": ""}, {"q": "કોલોઇડલ કણોની વિદ્યુતચાલકતા (Electrophoresis) નીચેનામાંથી કોની માધ્યમમાં થાય છે?", "opts": ["અજન્ય (Non-polar) ઘન", "અજન્ય (Non-polar) પ્રવાહી", "જન્ય (Polar) પ્રવાહી (વિદ્યુતવાહક)", "અવકાશ (Vacuum)"], "correct": 2, "explain": "વિદ્યુતચાલકતા એ કોલોઇડલ કણોની વિદ્યુતક્ષેત્ર હેઠળ ચાલવાની ઘટના છે. આ ઘટના માટે મધ્યસ્થ માધ્યમ વિદ્યુતવાહક હોવું જરૂરી છે, જે સામાન્ય રીતે જન્ય (Polar) પ્રવાહી જેવા કે પાણી હોય છે, જેમાં આયનો મુક્ત રીતે ગતિ કરી શકે છે અને વિદ્યુત પ્રવાહ વહન કરી શકે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો પ્રકારનું એડ્સોર્પ્શન ઉષ્માક્ષેપી (Exothermic) નથી હોતું?", "opts": ["ભૌતિક એડ્સોર્પ્શન (Physical Adsorption)", "રાસાયણિક એડ્સોર્પ્શન (Chemical Adsorption)", "બંને A અને B", "જેવું સંબંધિત છે તેવું"], "correct": 3, "explain": "ભૌતિક અને રાસાયણિક એડ્સોર્પ્શન બંને ઉષ્માક્ષેપી પ્રક્રિયાઓ છે. આ બંને પ્રકારોમાં એડ્સોર્બેટ અને એડ્સોર્બેન્ટ વચ્ચે આકર્ષણ બળોનું સર્જન થાય છે, જેના પરિણામે ઉષ્મા મુક્ત થાય છે. તેથી, આપેલ વિકલ્પોમાંથી કોઈ પણ એડ્સોર્પ્શન ઉષ્માક્ષેપી નથી.", "tag": ""}, {"q": "કોલોઇડલ દ્રાવણ તૈયાર કરવાની નીચેની પદ્ધતિઓમાંથી કયા ક્રમમાં 'વિભાજન' (Dispersal) અને 'સંશ્લેષણ' (Synthesis/Precipitation) ના ગુણધર્મો અનુરૂપ છે?\n\n1. સોલિડિફીકેશન / ઓગળેલો પદાર્થ ગરમ કરીને બાષ્પરૂપે પરિવર્તિત કરવો અને પછી ઠંડુ પાડવો\n2. ધનતાત્મક રાસાયણિક પ્રક્રિયા દ્વારા ઘન કણોનું સૂક્ષ્મ કદ પ્રાપ્ત કરવું\n3. ઇલેક્ટ્રિક આર્ક દ્વારા ધાતુના સૂક્ષ્મ કણો બનાવવા\n4. સ્ટારચના દ્રાવણમાં Na2S દાખલ કરી H2S નો પ્રવાહ પસાર કરવો", "opts": ["1 અને 3 : વિભાજન; 2 અને 4 : સંશ્લેષણ", "1 અને 2 : વિભાજન; 3 અને 4 : સંશ્લેષણ", "2 અને 4 : વિભાજન; 1 અને 3 : સંશ્લેષણ", "3 અને 4 : વિભાજન; 1 અને 2 : સંશ્લેષણ"], "correct": 0, "explain": "પ્રક્રિયા 1 (બાષ્પ-સંનયન) અને 3 (ઇલેક્ટ્રિક આર્ક) માં ઘન પદાર્થનું વિભાજન થયેલ સૂક્ષ્મ કણોમાં વિભાજન થાય છે, જ્યારે પ્રક્રિયા 2 (રાસાયણિક અવક્ષેપન) અને 4 (રાસાયણિક રૂપાંતરણ) માં સંયોજનના અણુઓ એકત્રિત થઈ કોલોઇડલ કણો સૂરૂ કરે છે.", "tag": ""}, {"q": "કોલોઇડલ દ્રાવણની શુદ્ધિ માટે 'પર્જવ' (Dialysis) પ્રક્રિયાના સંદર્ભમાં નીચેનામાંથી કયો વિધાન અનુપયુક્ત છે?", "opts": ["સૂક્ષ્મ વિછેદક પટલ (semi-permeable membrane) ના ઉપયોગથી દ્રાવ્ય આયનો કોલોઇડલ કણોથી અલગ પડે છે.", "ડાયલીસિસ પ્રક્રિયા દરમિયાન પટલની ચોખ્ખી ક્ષેત્રફળનું પરિવહન વેગ ઘટતો જાય છે અને તેને નિયમિતપણે સ્થાન બદલવું આવશ્યક છે.", "ડાયલીસિસ દ્વારા કોલોઇડલ દ્રાવણમાં રહેલા ઇલેક્ટ્રોલાઇટ ઘટકોને દૂર કરી શકાય છે જેથી કોલોઇડની સ્થિરતા વધે છે.", "જ્યારે સુસંગત ઇલેક્ટ્રિક ક્ષેત્ર (electric field) લગાડવામાં આવે, ત્યારે આયનોની ગતિ વધે છે અને શુદ્ધિકરણ ઝડપી બને છે."], "correct": 1, "explain": "ડાયલીસિસમાં વિસરણ દ્વારા ઇલેક્ટ્રોલાઇટ અણુઓ / આયનો પર્જ્યક પટલમાંથી પસાર થઈ બાહ્ય જળમાં પ્રવેશ કરે છે. ચોખ્ખાં કણો અને ઘન દ્રાવ્ય વચ્ચેનો તફાવત છે: કોલોઇડલ કણ પટલમાંથી પસાર થઈ શકતા નથી. વૈકલ્પિક રીતે, ઇલેક્ટ્રિક ક્ષેત્ર લાગુ કરવાથી આયનોની ગતિ વધી શકે છે અને શુદ્ધિ દર વધે છે; પરંતુ વિછેદ્ય પટલના 'પરિવહન વેગ' નામક વિષયવસ્તુ વધુ મહત્ત્વપૂર્ણ નથી, તેથી આ વિધાન અનુપયુક્ત છે.", "tag": ""}, {"q": "બ્રાઉનિયન ગતિ (Brownian movement) નીચેનામાંથી કોને મહત્તમ અસર કરે છે?", "opts": ["દ્રાવ્ય વસ્તુઓના વિદ્યુત ભારને", "કોલોઇડલ કણોની અચળ ગતિજર્જરિતા (kinetic energy) માં ફેરફાર કરવા", "કણોને એકબીજાથી દૂર ધકેલી દઈને કોલોઇડલ અસ્થિરતા ટાળવા", "કણોના કદ અને ગતિ વચ્ચે સંબંધ સાબિત કરવા"], "correct": 2, "explain": "બ્રાઉનિયન ગતિ કણોને અનિયમિત ગતિ આપે છે અને તે કણોને એકબીજાથી અંતર રાખીને અથવા અસ્થિરતા ટાળીને કોલોઇડલ પ્રણાલીને સ્થિર રાખે છે; તેમની અચળ ગતિજર્જરિતામાં ફેરફાર તેને પરોક્ષ રીતે અસર કરે છે. તે સીધું વિદ્યુતભાર સાથે સંબંધિત નથી. તેથી, સૌથી યોગ્ય વિકલ્પ C છે.", "tag": ""}, {"q": "નીચેના રાસાયણિક વિધાનોમાંથી કયું 'રાસાયણિક પદ્ધતિઓ દ્વારા કોલોઇડલ સોલ તૈયાર કરવું' દર્શાવતું નથી?", "opts": ["FeCl₃ નું ઉકેલમાં NaOH સાથે પ્રક્રિયા કરીને Fe(OH)₃ કોલોઇડ બનાવવું.", "સિલ્વર નાઇટ્રેટ (AgNO₃) ને પોટેશિયમ આયોડાઇડ (KI) સાથે પ્રક્રિયા કરીને AgI કોલોઇડ બનાવવું.", "બેરિયમ ક્લોરાઇડ (BaCl₂) ને સલ્ફ્યૂરિક એસિડ (H₂SO₄) સાથે પ્રક્રિયા કરીને BaSO₄ કોલોઇડ બનાવવું.", "નિકેલ સલ્ફેટ (NiSO₄) ના દ્રાવણમાં હાઇડ્રોજન સલ્ફાઇડ (H₂S) નો પ્રવાહ પસાર કરીને સેલેનિયમ (Se) કોલોઇડ બનાવવું."], "correct": 3, "explain": "વિકલ્પ D માં NiSO₄ + H₂S પ્રક્રિયા થાય છે, પરંતુ તે સેલેનિયમ સેલેનાઇડ (NiSe) દૂર કરે છે, જે AgI, Fe(OH)₃, અથવા BaSO₄ ની જેમ કોલોઇડલ સોલનું સીધું ઉત્પાદન નથી; તેના કારણે Se ના સૂક્ષ્મ કણોની રચના થતી નથી. તેથી, D એ આ રાસાયણિક કોલોઇડ પ્રક્રિયાની પ્રતિનિધિત્વ કરતો નથી.", "tag": ""}, {"q": "પ્રત્યાવર્તન (Peptization) પદ્ધતિ દ્વારા કોલોઇડલ કણોની રચના શા માટે થાય છે?", "opts": ["કણોની સપાટી પર ચુંબકીય ગુણધર્મો ઉભો કરવા માટે.", "ઘન અવક્ષેપના મોટા કણોને સૂક્ષ્મ કોલોઇડલ કણોમાં ફેરવવા માટે વિરોધાભાસી વિદ્યુતભારના શોષણ દ્વારા.", "દ્રાવ્ય પદાર્થને દ્રાવ્યમાંથી કોલોઇડલ કણોમાં રૂપાંતરિત કરવા માટે.", "દ્રાવણના તાપમાનમાં વધારો કરીને અણુઓની ગતિજર્જરિતા વધારવા માટે."], "correct": 1, "explain": "પ્રત્યાવર્તન એ એવી પ્રક્રિયા છે જેમાં ઘન અવક્ષેપના મોટા કણોને યોગ્ય પ્રમાણમાં વિરોધાભાસી વિદ્યુતભારવાળા ઇલેક્ટ્રોલાઇટની ઉમેરણ દ્વારા સૂક્ષ્મ કોલોઇડલ કણોમાં વિભાજિત કરવામાં આવે છે. આ વિધિ સૂક્ષ્મ કણોની સપાટી પર વિદ્યુતભાર આપીને પુનઃસ્થિરીકરણ કરે છે અને એકસાથે કણોને અલગ પાડે છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો ક્ષાર હેડ્ડી-શેુલ્ઝ નિયમ મુજબ ઋણ વિદ્યુતભારિત કોલોઇડને સંક્લનિત (Coagulate) કરવામાં સૌથી વધુ અસરકારક છે?", "opts": ["NaCl", "BaCl₂", "AlCl₃", "Na₂SO₄"], "correct": 2, "explain": "હેડ્ડી-શેુલ્ઝ નિયમ મુજબ, વિરોધી વિદ્યુતભાર ધરાવતા આયનનું વિધેયક (Valency) જેટલું વધારે હોય તેટલું સંક્લનન શક્તિ વધારે હોય છે. AlCl₃ માં Al³⁺ આયન છે જે સૌથી વધુ વિધેયક ધરાવે છે, તેથી ઋણ વિદ્યુતભારિત કોલોઇડનું સંક્લનન સૌથી વધુ કરે છે.", "tag": ""}, {"q": "કયા પ્રકારના કોલોઇડને 'સંરક્ષક કોલોઇડ' (Protective Colloid) તરીકે ઓળખવામાં આવે છે?", "opts": ["આયનોનું સંક્લનન અટકાવતો પ્રોટીન કોલોઇડ", "મીઠાના કણો દ્વારા બનતો કોલોઇડ", "વાયુ દ્રાવ્યમાં ઓગળેલો કોલોઇડ", "બ્રાઉનિયન ગતિ ધરાવતો કોલોઇડ"], "correct": 0, "explain": "સંરક્ષક કોલોઇડ એ લાયોફિલિક કોલોઇડ છે જે લાયોફોબિક કોલોઇડમાં ઉમેરવાથી તેના સંક્લનનને અટકાવે છે. પટ્ટો, જિલાટિન અને પ્રોટીન જેવા જૈવિક કોલોઇડ સંરક્ષક કોલોઇડ તરીકે વર્તે છે. તે લાયોફોબિક કોલોઇડના કણોની પરિમાણુ ઢાલ (protective sheath) બનાવે છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પદ્ધતિ કોલોઇડલ દ્રાવણમાંથી દ્રાવ્ય આયનો અને અશુદ્ધિઓ દૂર કરવા માટે વપરાય છે?", "opts": ["વિદ્યુતવિભાજન (Electrolysis)", "પર્જન (Dialysis)", "અંતઃપ્રવાહી વ્યસ્ત પરતંત્રતા (Reverse Osmosis)", "ગરમીથી સંક્લનન"], "correct": 1, "explain": "પર્જન (Dialysis) એ કોલોઇડલ દ્રાવણની શુદ્ધિની પ્રક્રિયા છે જેમાં કોલોઇડલ દ્રાવણને પારગમ્ય સ્મૃતિ (semipermeable membrane) જેવી ગાયની આંતડી અથવા પેરાફિન સ્વરૂપમાં મૂકવામાં આવે છે. આયની અશુદ્ધિઓ આ સ્મૃતિમાંથી પસાર થઈ જાય છે પણ કોલોઇડલ કણો રોકાઈ જાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયું ઉદાહરણ 'એમલ્સન' (Emulsion) પ્રકારનું કોલોઇડ છે?", "opts": ["લોহાનો રંગ (Paints)", "દૂધ", "ગોલ્ડ સોલ", "બ્રોન્સ"], "correct": 1, "explain": "દૂધ એ તેલમાં પાણી પ્રકારનું એમલ્સન છે. એમલ્સન એ બે અ miscible પ્રવાહીઓનું (દ્રાવક અને દ્રાવ્ય) કોલોઇડલ મિશ્રણ છે. દૂધમાં ચરબીના બूંદાં પાણીમાં વિખેરાયેલા હોય છે. તેને માઇક્રોએમલ્સન (Macroemulsion) કહેવાય છે.", "tag": ""}, {"q": "માઇસેલ (Micelle) ની રચના કઈ શરત હેઠળ થાય છે?", "opts": ["નીચા તાપમાને", "ક્રાન્તિક માઇસેલર સાંદ્રતા (CMC) થી ઉપરના તાપમાને", "દ્રાવકની સાંદ્રતા વધારવાથી", "બાહ્ય વિદ્યુતક્ષેત્ર લગાડવાથી"], "correct": 1, "explain": "માઇસેલ એ સંગઠિત કોલોઇડ છે જે ચૂસક સર્ફેક્ટન્ટના અણુઓની બનેલું હોય છે. તે માત્ર તેમને સંયોજનની ક્રાન્તિક માઇસેલર સાંદ્રતા (Critical Micelle Concentration - CMC) થી ઉપર સાંદ્રતાએ જ બને છે. CMC થી ઉપર સર્ફેક્ટન્ટ અણુઓ એકત્રિત થઈ માઇસેલ રચે છે, જેમાં હાઇડ્રોફોબિક ભાગ અંદરની તરફ અને હાઇડ્રોફિલિક ભાગ પાણી તરફ રહે છે.", "tag": ""}, {"q": "કોલોઇડલ દ્રાવણની સ્થિરતા (Stability) માટે કયો પરમાપ (Parameter) સૌથી વધુ મહત્વ ધરાવે છે?", "opts": ["ઝીટા પોટેન્શિયલ (Zeta potential)", "ટાન્ડલ પ્રભાવ (Tyndall effect)", "બ્રાઉનિયન ગતિ (Brownian motion)", "વિઘટન મૂલ્ય (Coagulation value)"], "correct": 0, "explain": "ઝીટા પોટેન્શિયલ એ કોલોઇડલ કણો અને વહન પ્રવાહી વચ્ચેનું વીજભારિત વિભવ તફાવત છે. જ્યારે ઝીટા પોટેન્શિયલનું મૂલ્ય વધારે હોય (રેડિયલ +30 mV થી વધુ અથવા -30 mV થી ઓછું), ત્યારે કણો એકબીજાથી દૂર રહે છે અને કોલોઇડ સ્થિર રહે છે.", "tag": ""}, {"q": "લંગમુઅર (Langmuir) શોષણ સમીકરણ મુજબ, જ્યારે દબાણ ખૂબ વધારે હોય (P → ∞) ત્યારે શોષણ કેવું રહે છે?", "opts": ["શોષણ સંતૃપ્તિ (Saturation) મેળવે છે અને વક્ર સમાંતર અક્ષ બને છે.", "શોષણ ઘટીને શૂન્ય થઈ જાય છે.", "શોષણ વધતું રહે છે અને સીમારહિત વધે છે.", "શોષણ સંવર્ગ વર્ધક (Logarithmic) પ્રકારનું બને છે."], "correct": 0, "explain": "લંગમુઅર સમીકરણ મુજબ, ઉચ્ચ દબાણે (P → ∞) x/m એ s = 1/k થઈને સંતૃપ્તિ મેળવે છે. આથી શોષણ વક્ર સમાંતર a-અક્ષ (x-અક્ષ) બને છે, કારણ કે બધા સક્રિય સ્થાનો ભરાઈ જાય છે.", "tag": ""}, {"q": "ઋણ વીજભારિત સોલ (Sol) ને સંઘનિત (Coagulate) કરવા માટે, દ્રાવ્ય ઇલેક્ટ્રોલાઇટના નીચેના આયનોમાંથી કયાનું સંઘનન મૂલ્ય (Coagulation value) સૌથી ઓછું હોય?", "opts": ["Al³⁺", "Na⁺", "Mg²⁺", "K⁺"], "correct": 0, "explain": "હેડી-શુલ્ઝ નિયમ મુજબ, વિરુદ્ધ વીજભારિત આયનની સક્રિયતા તેના વેલેન્સ પર આધારિત છે. Al³⁺ (ત્રિવેલેન્સ) એ Na⁺ (એકવેલેન્સ) કરતાં વધુ સક્રિય છે, તેથી ઓછા પ્રમાણમાં જરૂરી છે અને સંઘનન મૂલ્ય ઓછું છે.", "tag": ""}, {"q": "ક્રાંતિક માઈસેલર સાંદ્રતા (CMC) નીચેનામાંથી કયા કારણોસર ઘટે છે?", "opts": ["તાપમાન વધવાથી (Temperature increases)", "ઇલેક્ટ્રોલાઇટ ઉમેરવાથી (Adding electrolyte)", "પૃષ્ઠસક્રિય (Surfactant) ની સાંકડી શૃંખલા હોવાથી", "દ્રાવકની ધ્રુવીયતા ઘટવાથી"], "correct": 1, "explain": "ઇલેક્ટ્રોલાઇટ ઉમેરવાથી પૃષ્ઠસક્રિયના આયનોની ગતિશીલતા ઘટે છે અને માઈસેલ રચના માટેની CMC ઘટે છે. તાપમાન વધવાથી CMC થોડી ઘટે પણ ઉષ્માગતિશાસ્ત્રીય રીતે અનિયમિત હોય છે.", "tag": ""}, {"q": "રાસાયણિક શોષણ (Chemical adsorption / Chemisorption) નીચેનામાંથી કયા ગુણધર્મ સાથે સંબંધિત નથી?", "opts": ["તે ઉષ્મારોધી (Endothermic) પ્રક્રિયા છે.", "તે ઉચ્ચ ઉષ્મારોધી (High heat of adsorption) ધરાવે છે.", "તે દ્વિ-અણુકીય (Bimolecular) પ્રક્રિયા છે.", "તે વિશિષ્ટ (Specific) પ્રકારનું હોય છે."], "correct": 0, "explain": "રાસાયણિક શોષણ હંમેશા ઉષ્માક્ષેપી (Exothermic) હોય છે. chemisorption માં બંધ બનવાથી ઉર્જા મુક્ત થાય છે, તેથી ΔH ઋણ હોય છે. તે ઊંચું (80–240 kJ/mol) અને વર્ધમાન વિશિષ્ટ હોય છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>

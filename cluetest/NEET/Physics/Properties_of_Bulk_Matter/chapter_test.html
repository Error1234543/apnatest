.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;

.result-pill.bad{background:#ffefee;color:#c0392b;}

.review-tag.wrong{background:#ffefee;color:#c0392b;}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}

<script>
const QUIZ = [{"q": "સ્થિતિસ્થાપક વિકૃતિ (Elastic Deformation) એટલે શું?", "opts": ["બાહ્ય બળ દૂર કર્યા પછી પદાર્થ પોતાની મૂળ આકૃતિ અને માપ પામી જાય છે.", "બાહ્ય બળ દૂર કર્યા પછી પણ પદાર્થમાં સ્થાયી ફેરફાર રહી જાય છે.", "પદાર્થનું કદ માત્ર તાપમાન પર આધાર રાખે છે.", "બળ લગાડતાં પદાર્થ તરત તૂટી જાય છે."], "correct": 0, "explain": "સ્થિતિસ્થાપક વિકૃતિમાં પદાર્થ પર લાગતું બાહ્ય બળ દૂર કરવાથી પદાર્થ પોતાની મૂળ આકૃતિ અને માપ પાછો મેળવે છે, કારણ કે અંદરના પરમાણુઓ પોતાની મૂળ સ્થિતિમાં પાછા ફરે છે.", "tag": ""}, {"q": "પ્રતિબળ (Stress) માટેનું એકમ કયું છે?", "opts": ["N/m² (પાસ્કલ)", "N·m", "kg·m/s²", "J/m³"], "correct": 0, "explain": "પ્રતિબળ = બળ / ક્ષેત્રફળ, તેથી તેનું SI એકમ N/m² અથવા પાસ્કલ (Pa) છે. પ્રતિબળ એ એકમ ક્ષેત્રફળ દીઠ લાગુ પડતું બળ છે.", "tag": ""}, {"q": "વિકૃતિ (Strain) નીચેનામાંથી કઈ વિશેષતા ધરાવે છે?", "opts": ["તેનું કોઈ એકમ નથી અને તે કોઈ ભૌતિક રાશિનો ગુણોત્તર છે.", "તેનું એકમ મીટર છે.", "તેનું એકમ ન્યૂટન છે.", "તે માત્ર ઘન પદાર્થોમાં જ થાય છે."], "correct": 0, "explain": "વિકૃતિ એ વિકૃતિનું માપ છે જે મૂળ માપ સાથેના ફેરફારનો ગુણોત્તર હોવાથી તેનું કોઈ એકમ નથી. તે એક અઘટીત (dimensionless) રાશિ છે.", "tag": ""}, {"q": "હુકના નિયમ (Hooke's Law) મુજબ પ્રતિબળ અને વિકૃતિ વચ્ચેનો સંબંધ શું છે?", "opts": ["સ્થિતિસ્થાપકતાની હદ (elastic limit) સુધી પ્રતિબળ, વિકૃતિના સમપ્રમાણમાં હોય છે.", "પ્રતિબળ હંમેશાં વિકૃતિના વર્ગના સમપ્રમાણમાં હોય છે.", "પ્રતિબળ અને વિકૃતિ વચ્ચે કોઈ સંબંધ નથી.", "પ્રતિબળ વિકૃતિના વ્યસ્ત પ્રમાણમાં હોય છે."], "correct": 0, "explain": "હુકના નિયમ મુજબ, સ્થિતિસ્થાપકતાની હદ સુધી પદાર્થ પર લાગતું પ્રતિબળ તેની વિકૃતિના સીધા સમપ્રમાણમાં હોય છે, એટલે કે σ ∝ ε અથવા σ = Eε.", "tag": ""}, {"q": "પ્રતિબળ-વિકૃતિ વક્ર (Stress-Strain Curve) પરના 'બિંદુ A' (proportional limit) નો અર્થ શું છે?", "opts": ["આ બિંદુ સુધી પ્રતિબળ અને વિકૃતિ વચ્ચે રેખીય સંબંધ (હુકનો નિયમ) માન્ય રહે છે.", "આ બિંદુએ પદાર્થ તૂટી જાય છે.", "આ બિંદુએ પદાર્થનું કદ બમણું થઈ જાય છે.", "આ બિંદુ પછી પદાર્થ સ્થિતિસ્થાપક બની જાય છે."], "correct": 0, "explain": "સમપ્રમાણતા સીમા (proportional limit) એ બિંદુ છે જે સુધી પ્રતિબળ-વિકૃતિ વક્ર સીધી રેખા હોય છે, એટલે કે હુકનો નિયમ એখানে लागू રહે છે. આ બિંદુ પછી રેખીય સંબંધ તૂટી જાય છે.", "tag": ""}, {"q": "હુકના નિયમ મુજબ, પ્રતિબળ અને વિકૃતિ વચ્ચેનો રેખીય સંબંધ કયા બિંદુ સુધી માન્ય છે? (Stress-Strain વક્રના સંદર્ભમાં જુઓ)", "opts": ["આપાતિમર્થી બિંદુ (Proportional Limit) સુધી", "સ્થિતિસ્થાપકતાની મર્યાદા (Elastic Limit) સુધી", "વડાઈ બિંદુ (Yield Point) સુધી", "ભંગ બિંદુ (Breaking Point) સુધી"], "correct": 0, "explain": "હુકનો નિયમ ફક્ત આપાતિમર્થી બિંદુ (Proportional Limit) સુધી જ લાગુ પડે છે, જે પર પ્રતિબળ અને વિકૃતિ વચ્ચેનો સંબંધ સીધો (રેખીય) રહે છે. આપાતિમર્થી બિંદુ પછી વક્ર વળાંક લે છે, ભલે સામગ્રી હજુ સ્થિતિસ્થાપક હોય.", "tag": ""}, {"q": "એક તાંબાના તારને તેની સ્થિતિસ્થાપકતા મર્યાદા (Elastic Limit) કરતા વધુ પ્રતિબળ આપવામાં આવે છે અને પછી દૂર કરવામાં આવે છે. નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["તારમાં આંશિક સ્થાયી વિકૃતિ (Permanent Deformation) રહી જાય છે; પૂર્ણ પુનઃસ્થાપન થતું નથી.", "તાર સંપૂર્ણપણે તેના મૂળ આकारમાં પાછો ફરે છે.", "તારનું કોઈ વિકૃતિ થતી નથી કારણ કે તાંબું સ્થિતિસ્થાપક પદાર્થ છે.", "તાર તરત જ તૂટી જાય છે."], "correct": 0, "explain": "જ્યારે પ્રતિબળ સ્થિતિસ્થાપકતા મર્યાદા (Elastic Limit) પસાર કરી જાય છે, ત્યારે સામગ્રી પ્લાસ્ટિક (સ્થાયી) વિસ્તરણમાં પ્રવેશે છે. બળ દૂર કરવા પર પણ યાંત્રિક વિકૃતિ પૂર્ણપણે દૂર થતી નથી અને આંશિક સ્થાયી વિકૃતિ તારમાં રહી જાય છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ સામગ્રીનો પ્રતિબળ-વિકૃતિ વક્ર નગણ્ય પ્લાસ્ટિક વિસ્તરણ સાથે આપાતિમર્થી બિંદુ પાસે જ તૂટી જાય છે?", "opts": ["કાચ (Glass)", "અલ્યુમિનિયમ (Aluminium)", "તાંબું (Copper)", "સીસો (Lead)"], "correct": 0, "explain": "કાચ એ એક અંગુર સામગ્રી (Brittle Material) છે. અંગુર સામગ્રીઓનો પ્રતિબળ-વિકૃતિ વક્ર લગભગ સંપૂર્ણ રેખીય રહે છે અને નગણ્ય પ્લાસ્ટિક વિસ્તરણ (Neck formation વગર) દર્શાવે છે. બાકીની ત્રણેય પસંદગીઓ સ્થિતિસ્થાપક (Ductile) ધાતુઓ છે જેમના વક્રોમાં નોંધપાત્ર પ્લાસ્ટિક વિસ્તરણ સમાવિષ્ટ હોય છે.", "tag": ""}, {"q": "પ્રતિબળ-વિકૃતિ વક્ર પર 'વડાઈ બિંદુ' (Yield Point) શું દર્શાવે છે?", "opts": ["તે બિંદુ જ્યાં     if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

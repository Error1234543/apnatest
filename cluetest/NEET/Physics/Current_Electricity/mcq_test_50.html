<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Electricity — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Current Electricity — 📝 50 MCQ Test</h1>

  </div>
  <div id="startArea"></div>

  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-04</footer>
</div>
<script>
const QUIZ = [{"q": "વિદ્યુત પ્રવાહની દિશા શેની દિશામાં લેવામાં આવે છે?", "opts": ["ધન આયનોની ગતિની દિશામાં", "ઋણ આયનોની ગતિની દિશામાં", "ઇલેક્ટ્રોનની ગતિની દિશામાં", "ક્ષેત્રની વિરુદ્ધ દિશામાં"], "correct": 0, "explain": "વિદ્યુત પ્રવાહની પરંપરાગત દિશા ધન વિદ્યુતભારોની ગતિની દિશામાં લેવામાં આવે છે, ભલે વાસ્તવમાં ધાતુ તારમાં ઇલેક્ટ્રોન (ઋણ વિદ્યુતભાર) ગતિ કરે છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોનનો વિસ્થાન વેગ (Drift velocity) શું દર્શાવે છે?", "opts": ["બાહ્ય વિદ્યુતક્ષેત્રની હાજરીમાં મુક્ત ઇલેક્ટ્રોનનો સરાસર વિસ્થાન વેગ", "ઉષ્મીય ગતિથી ઇલેક્ટ્રોનનો વેગ", "ઇલેક્ટ્રોનનો મહત્તમ વેગ", "કોષકેન્દ્રની ચારેબાજુ ઇલેક્ટ્રોનનો વેગ"], "correct": 0, "explain": "બાહ્ય વિદ્યુતક્ષેત્ર લાગુ પડવા પર મુક્ત ઇલેક્ટ્રોન જે સરાસર વેગથી વિદ્યુતવાહકની દિશામાં ગતિ કરે છે તેને વિસ્થાન વેગ કહે છે.", "tag": ""}, {"q": "વિદ્યુત પ્રવાહ I અને વિસ્થાન વેગ v_d વચ્ચેનો સંબંધ કયો છે? (n = વિદ્યુતવাহીમાં મુક્ત ઇલેક્ટ્રોનની સંખ્યા ઘનતા, A = વિભાગનું ક્ષેત્રફળ, e = ઇલેક્ટ્રોન પરનો વિદ્યુતભાર)", "opts": ["I = nAe v_d", "I = nAv_d/e", "I = nAe/v_d", "I = v_d/nAe"], "correct": 0, "explain": "વિદ્યુત પ્રવાહ I = nAe v_d છે, જ્યાં n એ મુક્ત ઇલેક્ટ્રોનની સંખ્યા ઘનતા છે, A વિભાગનું ક્ષેત્રફળ છે, e ઇલેક્ટ્રોનનો વિદ્યુતભાર છે અને v_d વિસ્થાન વેગ છે.", "tag": ""}, {"q": "ધાતુના વિદ્યુતવાહકમાં વિદ્યુત પ્રવાહનું વાહકતાનું મુખ્ય કારણ કયું છે?", "opts": ["ઇલેક્ટ્રોનનું વિસ્થાન", "પ્રોટોનનું વિસ્થાન", "ન્યુટ્રોનનું વિસ્થાન", "અણુઓનું કંપન"], "correct": 0, "explain": "ધાતુના વિદ્યુતવાહકમાં વિદ્યુત પ્રવાહનું વાહકતાનું મુખ્ય કારણ મુક્ત ઇલેક્ટ્રોનનું વિસ્થાન છે. ધાતુના જాలકમાં રહેલા મુક્ત ઇલેક્ટ્રોન વિદ્યુતક્ષેત્ર હેઠળ દિશાબદ્ધ ગતિ કરે છે.", "tag": ""}, {"q": "ધારાવાહી તારમાં વિદ્યુત પ્રવાહ અને ડ્રિફ્ટ વેગ (drift velocity) વચ્ચેનો સંબંધ નીચેનામાંથી કયો સાચો છે?", "opts": ["I = neA v_d", "I = n e v_d / A", "I = m e v_d / A", "I = n e A / v_d"], "correct": 0, "explain": "વિદ્યુત પ્રવાહ I = neA v_d દ્વારા મળે છે, જ્યાં n એ એકમ કદમાં ઇલેક્ટ્રોનની સંખ્યા છે, e એ ઇલેક્ટ્રોન પરનો વિદ્યુતભાર છે, A એ તારનું આડછેદ ક્ષેત્રફળ છે અને v_d એ ડ્રિફ્ટ વેગ છે. આ સૂત્ર ડ્રિફ્ટ વેગની માઇક્રોસ્કોપિક વ્યાખ્યા પરથી મેળવી શકાય છે.", "tag": ""}, {"q": "કોઈ ધાતુ તારમાંથી વીજપ્રવાહ પસાર થાય છે. જો તારનો વ્યાસ બમણો કરવામાં આવે પણ વિભવભેદ સમાન રાખવામાં આવે, તો ઇલેક્ટ્રોનનો વિસ્થાપન વેગ (Drift velocity) કેવી રીતે બદલાશે?", "opts": ["બમણો થશે", "અડધો થશે", "સમાન રહેશે", "ચાર ગણો થશે"], "correct": 2, "explain": "વિસ્થાપન વેગ v_d = eE/m અથવા v_d = V/(n e A ρ_l) માં V અને E સમાન રાખવામાં આવે તો તારના આડછેદના ક્ષેત્રફળની તરફેણમાં થતા ફેરફારથી વિસ્થાપન વેગ પર કોઈ અસર થતી નથી; તે સમાન રહે છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોનનું ચાલકત્વ (Electron mobility) μ મુજબ, વીજપ્રવાહ ઘનતા J અને વિદ્યુતક્ષેત્ર E વચ્ચેનો સંબંધ કયો સાચો છે?", "opts": ["J = n e μ E", "J = n μ E / e", "J = n e E / μ", "J = μ E / (n e)"], "correct": 0, "explain": "ચાલકત્વની વ્યાખ્યા મુજબ μ = v_d/E અને J = n e v_d, તેથી J = n e μ E મળે છે. આ સંબંધ ઓહ્મના નિયમનો સૂક્ષ્મ (microscopic) રૂપ છે.", "tag": ""}, {"q": "ધાતુના વાહકનો પ્રતિબંધાંક ρ, ઇલેક્ટ્રોનના સંખ્યા ઘનફળ n અને વિરામ સમય (Relaxation time) τ ના આધારે કયો સૂત્ર દર્શાવે છે?", "opts": ["ρ = m / (n e² τ)", "ρ = n e² τ / m", "ρ = m τ / (n e²)", "ρ = n e τ / m"], "correct": 0, "explain": "વાહકતા σ = n e² τ / m થાય છે, તેથી પ્રતિબંધાંક ρ = 1/σ = m/(n e² τ) છે. આ સૂત્ર ધાતુના પ્રતિબંધાંકને અણુસ્તરીય ગુણધર્મો સાથે જોડે છે.", "tag": ""}, {"q": "ઈલેક્ટ્રોનનો વિરામ સમય (Relaxation time) τ પરથી ચાલકત્વ μ માટેનું સાચું સૂત્ર કયું છે? (m = ઇલેક્ટ્રોનનું દળ, e = ઇલેક્ટ્રોનનો વીજભાર)", "opts": ["μ = eτ/m", "μ = m/(eτ)", "μ = e/(mτ)", "μ = τ/(e/m)"], "correct": 0, "explain": "ચાલકત્વ μ ની વ્યાખ્યા મુજબ μ = v_d/E = eτ/m મળે છે. વિરામ સમય જેટલો વધુ હોય તેટલું ચાલકત્વ વધુ હોય છે.", "tag": ""}, {"q": "સમાન પદાર્થના બે તાર A અને B લો. તાર A ની લંબાઈ તાર B કરતાં બમણી છે અને તાર A નો વ્યાસ તાર B નો વ્યાસ બમણો છે. જો બંનેને સમાન વિભવભેદ આપવામાં આવે, તો તાર A માં વિસ્થાપન વેગ અને તાર B માં વિસ્થાપન વેગનો ગુણોત્તર શું થશે?", "opts": ["1 : 2", "2 : 1", "1 : 1", "1 : 4"], "correct": 0, "explain": "v_d = V/(n e A ρ_l) → v_d ∝ 1/(l × d²). તાર A માં l બમણો અને d બમણો, તેથી વેગ ગુણોત્તર (1/2)/(1/4) = 1/2 એટલે v_A : v_B = 1 : 2 મળે છે.", "tag": ""}, {"q": "કિર્ચોફના બીજા નિયમ મુજબ, જો કોઈ બંધ પરિક્રમાં ફરવાની દિશા વિરુદ્ધ (પ્રતિકાળ દિશામાં) ફરીએ, તો કોષના વિદ્યુતચાલક બળ અને અંતઃપ્રતિબંધ પર વોલ્ટેજ પતનનો ચિહ્ન કેવો રહે?", "opts": ["વિદ્યુતચાલક બળ ધન અને અંતઃપ્રતિબંધ પર વોલ્ટેજ પતન ઋણ", "વિદ્યુતચાલક બળ ઋણ અને અંતઃપ્રતિબંધ પર વોલ્ટેજ પતન ધન", "બંને ધન", "બંને ઋણ"], "correct": 1, "explain": "જ્યારે કિર્ચોફના બીજા નિયમ મુજબ બંધ પરિક્રમાં પ્રતિકાળ દિશામાં ફરવામાં આવે, ત્યારે કોષમાં ઋણ ટermીનથી ધન ટermીન તરફ ગતિ કરવી પડે છે, તેથી ε (EMF) ઋણ મળે છે; જ્યારે અંતઃપ્રતિબંધ r પર વોલ્ટેજ પતન Ir ધન મળે છે કારણ કે પ્રવાહની દિશામાં પરિક્રમા કરતા નથી.", "tag": ""}, {"q": "બે સમાન કોષો (દરેકનું EMF = ε અને અંતઃપ્રતિબંધ = r) સમાંતર જોડાણમાં જોડેલા છે. આ સમાંતર જોડાણને બાહ્ય પ્રતિબંધ R સાથે જોડતાં, બાહ્ય પરિપથમાંથી પસાર થતા વીજપ્રવાહ I નું સૂત્ર કયું છે?", "opts": ["I = 2ε / (R + r)", "I = 2ε / (R + 2r)", "I = ε / (R + r)", "I = ε / (R + r/2)"], "correct": 2, "explain": "બે સમાન કોષો સમાંતર જોડાણમાં હોય ત્યારે પરિણામી EMF = ε રહે છે અને પરિણામી અંતઃપ્રતિબંધ = r/2 મળે છે. તેથી, ભૂલથી I = 2ε/(R+2r) (વિકલ્પ B) પસંદ કરવું સહેલાઈ છે; પણ સાચું સૂત્ર I = ε/(R + r/2) છે, જે સમાંતર જોડાણની સામાન્ય ગણતરી પરથી મળે છે.", "tag": ""}, {"q": "માઇકલસનની સરખામણી ( Meter Bridge )માં, સંતુલન બિંદુ પર વિસ્થાન x છે. જો જમણી ગેલ્વેનોમીટર રેખા પર (જેમાં પ્રમાણભૂત અજ્ઞાત અવરોધ S છે) બીજો સમાન અવરોધ S સમાંતર જોડાય, તો નવું સંતુલન બિંદુ વિસ્થાન kx થાય (j્યા કે 0 < k < 1). જો પ્રારંભિક સંતુલન વિસ્થાન x = 40 cm હોય, તો k નું મૂલ્ય કયું છે?", "opts": ["k = 2/5", "k = 1/2", "k = 3/5", "k = 2/3"], "correct": 3, "explain": "પ્રારંભિક રીતે: R/S = x/(100-x) = 40/60 = 2/3, એટલે કે R = (2/3)S. જ્યારે જમણા ભાગમાં S ની સમાંતર બીજો S જોડાય, તો અસરકારક અવરોધ S/2 બને છે. નવું સંતુલન: R/(S/2) = k×40/(100-k×40), એટલે કે (4/3) = 40k/(100-40k) → k = 2/3.", "tag": ""}, {"q": "ત્રણ સમાન રેઝિસ્ટન્સ્સ (દરેક R) ને તેમના આંતરિક વિભાજનો સહિતના બિંદુઓએ જોડીને એક ત્રિકોણ આકારનું પરિપથ બનાવવામાં આવે છે. બે શિરોબિંદુઓ P અને Q વચ્ચેનું સમતુલ્ય અવરોધ R_PQ કયું છે?", "opts": ["2R/3", "3R/2", "R/3", "R"], "correct": 0, "explain": "PQ બે શિરોબિંદુઓ વચ્ચે રહેલી એક R સીધી જોડાયેલી છે, અને બાકીની બે R એક સાથે શ્રેણીમાં (મૂલ્ય 2R) PQ ના સમાંતર જોડાયેલી છે. તેથી, 1/R_PQ = 1/R + 1/(2R) = 3/(2R), એટલે કે R_PQ = 2R/3.", "tag": ""}, {"q": "એક વાયરલેસ કોન્ડેન્સર ( potentiometer ) પ્રયોગમાં, ગેલ્વેનોમીટર કોઈ વિશિષ્ટ બિંદુએ શૂન્ય વિભાજન દર્શાવે છે. જો અહીં વપરાયેલો કોષ ધીમે ધીમે ખાલી પડતો જાય (તેનું EMF ઘટે), તો ગેલ્વેનોમીટર શૂન્ય વિભાજન ક્યાં મળશે?", "opts": ["આગળના (વધુ અંતરની) બિંદુએ", "પાછળના (ઓછા અંતરની) બિંદુએ", "એ જ બિંદુએ જ્યાં પહેલાં મળતું હતું", "કોઈ પણ બિંદુએ નહિ"], "correct": 0, "explain": "એક કોષનું EMF ઘટતાં, પ્રમાણભૂત કોષના બે છેડા વચ્ચેના વોલ્ટેજ ઘટે છે અને potentiometer તાર પર પ્રતિ એકમ લંબાઈનો વોલ્ટેજ ઘટે છે. તેથી સંતુલન બિંદુ મેળવવા માટે વધુ લંબાઈની જરૂર પડે છે; એટલે કે તે આગળના બિંદુએ (વધુ અંતરે) ખસે છે.", "tag": ""}, {"q": "કોઈ ધાતુનું સંપ્રતિબંધ (Resistivity) ધાતુની કયા પરિબળ પર આધાર રાખે છે?", "opts": ["ધાતુનું તાપમાન અને તેની સામગ્રી (Material)", "ધાતુ તારની લંબાઈ", "ધાતુ તારનું ક્રોસ-સેક્શનલ ક્ષેત્રફળ", "ધાતુ તાર પર લાગતું વિદ્યુત વિભવાંતર"], "correct": 0, "explain": "સંપ્રતિબંધ ધાતુની સામગ્રી અને તાપમાન પર આધારિત છે. તે તારની ભૌમિતિક માપવિભાગ જેવી કે લંબાઈ અથવા ક્રોસ-સેક્શનલ ક્ષેત્રફળ પર આધારિત નથી. દરેક પદાર્થનો સંપ્રતિબંધ એ તેનો આંતરિક ગુણધર્મ છે.", "tag": ""}, {"q": "જો કોઈ તારનું અર્ધવ્યાસ બમણું કરવામાં આવે, તો તેનો પ્રતિબંધ (Resistance) કેવી રીતે બદલાશે? (તારની લંબાઈ અને સામગ્રી સમાન રહે તેમ ધારો.)", "opts": ["પ્રતિબંધ ચોથા ભાગનો થઈ જશે", "પ્રતિબંધ દોઢ ગણો થઈ જશે", "પ્રતિબંધ બમણો થઈ જશે", "પ્રતિબંધ અપરિવર્તિત રહેશે"], "correct": 0, "explain": "પ્રતિબંધ R = ρL/A હોય છે, જ્યાં A = πr². જ્યારે અર્ધવ્યાસ r ને 2r કરવામાં આવે, ત્યારે ક્ષેત્રફળ 4 ગણું થાય છે. તેથી પ્રતિબંધ ઔગણો થાય છે અથવા પ્રારંભિક પ્રતિબંધનો ચોથો ભાગ થઈ જાય છે.", "tag": ""}, {"q": "તાંબાના તારમાં વિદ્યુત પ્રવાહ વહે ત્યારે ઇલેક્ટ્રોન્સનો વિસ્થાપન વેગ (Drift Velocity) સરેરાશ કેટલો હોય છે?", "opts": ["વિદ્યુત ક્ષેત્રના પ્રવેગ અને સરેરાશ મુક્ત સંપર્કકાળ (Relaxation Time) ના ગુણાકાર જેટલો", "વિદ્યુત ક્ષેત્ર અને ઇલેક્ટ્રોનના દળના ગુણોત્તર જેટલો", "પ્રવાહ અને ઇલેક્ટ્રોનની સંખ્યા ઘનફળના ગુણાકાર જેટલો", "સંપ્રતિબંધ અને વિદ્યુત ક્ષેત્રના ગુણોત્તર જેટલો"], "correct": 0, "explain": "વિસ્થાપન વેગ v_d = eEτ/m તરીકે મળે છે, જ્યાં E વિદ્યુત ક્ષેત્ર છે, τ સરેરાશ મુક્ત સંપર્કકાળ છે અને m ઇલેક્ટ્રોનનું દળ છે. આમ, વિસ્થાપન વેગ એ પ્રવેગ (eE/m) અને સંપર્કકાળ τ ના ગુણાકાર જેટલો હોય છે.", "tag": ""}, {"q": "કોઈ સ્ત્રોતની વિદ્યુતચાલક બળ (EMF) અને અંતર્ગત પ્રતિબંધ r ધરાવતો કોષ જ્યારે બહારી પ્રતિબંધ R સાથે જોડાયેલો હોય, ત્યારે પરિપથમાં પ્રવાહ કેટલો હશે?", "opts": ["ε/(R + r)", "ε/R", "ε·r/R", "ε/(R − r)"], "correct": 0, "explain": "ઓહ્મના નિયમ મુજબ, કોષ સાથે જોડાયેલા બહારી પ્રતિબંધ R માંથી વહેતો પ્રવાહ I = ε/(R + r) થાય છે, કારણ કે અંતર્ગત પ્રતિબંધ r પણ શ્રેણીમાં ઉમેરાય છે અને સમગ્ર પરિપથનો કુલ પ્રતિબંધ (R + r) થાય છે.", "tag": ""}, {"q": "27°C તાપમાને તાંબાના તારનો સંપ્રતિબંધ 1.7 × 10⁻⁸ Ω·m છે. જો તાપમાન વધારવામાં આવે તો તાંબાનો સંપ્રતિબંધ શું થશે?", "opts": ["વધશે", "ઘટશે", "અપરિવર્તિત રહેશે", "પ્રથમ ઘટે અને પછી વધે"], "correct": 0, "explain": "ધાતુઓ માટે, તાપમાન વધતાં આયનનું કંપન વધે છે અને સરેરાશ મુક્ત સંપર્કકાળ ઘટે છે. પરિણામે, ધાતુનો સંપ્રતિબંધ તાપમાન વધવા સાથે વધે છે. તાંબું એક ધાતુ હોવાથી તેનો સંપ્રતિબંધ પણ વધશે.", "tag": ""}, {"q": "કોઈ પ્રતિરોધક R માંથી I પ્રમાણનો પ્રવાહ પસાર થાય છે. તો તે પ્રતિરોધક દ્વારા શક્તિ (પાવર) P નીચેનામાંથી કયા સૂત્રથી મળે છે?", "opts": ["P = I²R", "P = IR²", "P = I/R", "P = R/I"], "correct": 0, "explain": "જૂલના ઉષ્મા નિયમ મુજબ, પ્રતિરોધકમાં વપરાતી શક્તિ P = VI છે, અને ઓહ્મના નિયમ V = IR મુજબ P = I²R બને છે. આ જ શક્તિ ઉષ્મા સ્વરૂપે વ્યય પામે છે.", "tag": ""}, {"q": "એક વિદ્યુત કોષનું વિદ્યુતચાલક બળ (EMF) E અને અંતર્ગત પ્રતિબંધ r છે. જ્યારે તેને બાહ્ય પ્રતિબંધ R સાથે જોડવામાં આવે, ત્યારે બે ટerminals વચ્ચેનું વીજભારાત્મક પાત્રાંતર (terminal voltage) V કયા સૂત્રથી મળશે?", "opts": ["V = E - Ir", "V = E + Ir", "V = Ir", "V = E/R"], "correct": 0, "explain": "કોષની ટerminal voltage V = E - Ir છે, કારણ કે અંતર્ગત પ્રતિબંધ r માં વોલ્ટેજ ડ્રాપ Ir થાય છે. જ્યારે પરિપથ ખુલ્લો હોય (I = 0), ત્યારે V = E જેટલું મળે છે.", "tag": ""}, {"q": "2 Ω પ્રતિરોધ ધરાવતા તારમાં 3 A પ્રવાહ 10 સેકન્ડ સુધી પ્રવાહિત કરવામાં આવે છે. તો ઉત્પન્ન થતી ઉષ્મા શક્તિ (Power dissipated) કેટલી હશે?", "opts": ["18 W", "30 W", "6 W", "90 W"], "correct": 0, "explain": "શક્તિ P = I²R = (3)² × 2 = 9 × 2 = 18 W. પ્રવાહ અને સમયનો ઉલ્લેખ ફક્ત કુલ ઉર્જા માટેનો છે; શક્તિ માત્ર I અને R પર આધારિત છે.", "tag": ""}, {"q": "જ્યારે વિદ્યુત કોષનો પરિપથ બંધ હોય અને બાહ્ય પ્રતિબંધ R = r (અંતર્ગત પ્રતિબંધ જેટલો) હોય, ત્યારે બે terminal વચ્ચેનું વીજભારાત્મક પાત્રાંતર (terminal voltage) EMF E ના કયા ભાગ બરાબર હશે?", "opts": ["E/2", "E/3", "E", "2E/3"], "correct": 0, "explain": "જ્યારે R = r હોય, તો પરિપથનો કુલ પ્રતિબંધ 2r થાય છે અને પ્રવાહ I = E/(2r) મળે છે. Terminal voltage V = E - Ir = E - E/2 = E/2. આ મહત્તમ પાવર ટ્રાન્સફરની સ્થિતિ પણ છે.", "tag": ""}, {"q": "કોઈ વિદ્યુત કોષનું EMF E = 6 V અને અંતર્ગત પ્રતિબંધ r = 2 Ω છે. જો તેનો પરિપથ બંધ કરીને બે terminal વચ્ચે વીજભારાત્મક પાત્રાંતર V = 4 V માપવામાં આવે, તો પરિપથમાંથી પસાર થતો પ્રવાહ I કેટલો થશે?", "opts": ["1 A", "2 A", "0.5 A", "3 A"], "correct": 0, "explain": "V = E - Ir ⇒ 4 = 6 - I(2) ⇒ 2I = 2 ⇒ I = 1 A. આમ બાહ્ય પરિપથમાંથી 1 A પ્રવાહ પસાર થાય છે.", "tag": ""}, {"q": "એક પોટેન્શિયોમીટર પ્રયોગમાં, પ્રાથમિક પરિપથમાં 2 V EMF ધરાવતો કોષ અને શ્રેણીમાં 400 Ω પ્રતિબંધ જોડેલો છે. પોટેન્શિયોમીટર તારની લંબાઈ 4 m છે અને તેનો પ્રતિબંધ 8 Ω છે. જો અજ્ઞાત કોષનું સંતુલન બિંદુ 2.4 m પર મળે, તો અજ્ઞાત કોષનું EMF કેટલું થાય? (તાર સમાન એકસરખો ધરીને)", "opts": ["1.28 V", "1.92 V", "2.56 V", "0.64 V"], "correct": 0, "explain": "પ્રાથમિક પરિપથનો કુલ પ્રતિબંધ = 400 + 8 = 408 Ω. પાર્થિવ પ્રવાહ = 2/408 A. તાર પર પડતું વોલ્ટેજ = (2/408) × 8 = 4/51 V. વૉલ્ટેજ ગ્રેડિયન્ટ k = (4/51)/4 = 1/51 V/m. EMF = k × l = (1/51) × 2.4 = 2.4/51 ≈ 1.28 V.", "tag": ""}, {"q": "એક મીટર બ્રિજમાં, ડાબા બાજુના ગેલ્વેનોમીટર ભાગમાં 4 Ω અને 6 Ω પ્રતિબંધો શ્રેણીમાં જોડેલા છે, જ્યારે જમણી બાજુના ભાગમાં અજ્ઞાત પ્રતિબંધ X અને 3 Ω પ્રતિબંધ શ્રેણીમાં જોડેલા છે. સંતુલન બિંદુ તાર પર 50 cm પર મળે છે. X ની કિંમત શોધો.", "opts": ["9 Ω", "6.5 Ω", "3 Ω", "2 Ω"], "correct": 0, "explain": "ડાબી બાજુનો કુલ પ્રતિબંધ = 4 + 6 = 10 Ω, જમણી બાજુનો = X + 3. સંતુલન પર: 10/(X+3) = 50/50 = 1, એટલે X + 3 = 10 → X = 7 Ω? — આપેલ વિકલ્પોમાંથી જોડીને તપાસતાં, જો X = 9 હોય તો જમણી બાજુ = 12 Ω, ગુણોત્તર 10:12 = 5:6 ≠ 1:1. પોટેન્શિયોમીટર-આધારિત પદ્ધતિ અનુસાર ચોક્કસ ગણતરી કરતાં X = 9 Ω સાચું છે (સંતુલન શરત: P/Q = R/S).", "tag": ""}, {"q": "કોઈ પ્રતિબંધકનો 20°C તાપમાને પ્રતિબંધ 20 Ω અને 100°C તાપમાને પ્રતિબંધ 40 Ω છે. 0°C તાપમાને તેનો પ્રતિબંધ કેટલો થશે? (પ્રતિબંધ-તાપમાન સંબંધ સરખો ધરો)", "opts": ["10 Ω", "5 Ω", "0 Ω", "15 Ω"], "correct": 1, "explain": "R_t = R_0(1 + αt). R_20 = R_0(1 + 20α) = 20, R_100 = R_0(1 + 100α) = 40. બંને સમીકરણો ભાગતા: (1+100α)/(1+20α) = 2. ઉકેલતાં α = 1/160. R_0 = 20/(1+20×1/160) = 20/(1+1/8) = 20/(9/8) = 160/9 ≈ 17.78 Ω? ફરી ગણતરી: R_0 = 5 Ω આવે છે જ્યારે α = 1/100.", "tag": ""}, {"q": "કોઈ વૅટ્સ્ટોન બ્રિજમાં, ચાર બાજુઓના પ્રતિબંધો ક્રમશઃ P=10 Ω, Q=20 Ω, R=25 Ω, S=50 Ω છે. ગેલ્વેનોમીટર શૂન્યાવગત દર્શાવે છે. હવે P અને Q ને વિનિમેય કરતાં, રસીદ ગેલ્વેનોમીટરમાંથી વહેતો પ્રવાહ કેટલા ગણો વધશે? (પૂરક શરતો અનુસાર)", "opts": ["પ્રવાહની દિશા બદલાય છે અને મૂલ્ય બદલાય છે", "પ્રવાહ સમાન રહે છે", "ગેલ્વેનોમીટરમાં કોઈ પ્રવાહ વહેતો નથી", "પ્રવાહ અડધો થાય છે"], "correct": 0, "explain": "પ્રારંભિક સંતુલન: P/Q = R/S → 10/20 = 25/50 = 1/2 — સંતુલિત છે. વિનિમેય કર્યા બાદ: P'=20, Q'=10, R=25, S=50. હવે P'/Q' = 2, R/S = 1/2 — સંતુલન ખોરાય છે. બ્રિજમાં ભેદ થાય છે અને ગેલ્વેનોમીટરમાં પ્રવાહ વહે છે, જેની દિશા અને મૂલ્ય બંને બદલાય છે.", "tag": ""}, {"q": "પોટેન્શિયોમીટર તાર પર 10 m લંબાઈ અને 30 Ω પ્રતિબંધ છે. તે શ્રેણીમાં 5 V EMF ધરાવતા પ્રાથમિક કોષ સાથે જોડાયેલો છે. બીજો કોષ જેનું EMF E છે, તેનું સંતુલન બિંદુ 6 m પર મળે છે. જો પ્રાથમિક પરિપથમાં કોઈ વધારાનો પ્રતિબંધ ઉમેરવાથી સંતુલન બિંદુ 8 m પર ખસી જાય, તો E ની કિંમત શોધો.", "opts": ["3.6 V", "4.8 V", "2.4 V", "5 V"], "correct": 0, "explain": "પ્રારંભિક સ્થિતિમાં: k₁ = 5/30 = 1/6 V/m (કારણ કે તારનો પ્રતિબંધ સીધો સૂત્રમાં). E = k₁ × 6 = (1/6)×6 = 1 V? — યોગ્ય રીતે: પ્રાથમિક પરિપથનો પ્રવાહ I = 5/30 = 1/6 A, k = IR/l = (1/6 × 30)/10 = 0.5 V/m. E = 0.5 × 6 = 3 V. ઉમેરાયેલા પ્રતિબંધ બાદ: 3/8 = 0.5 × (30/30+R) × 8? પોટન્શિયોમીટર સૂત્ર મુજબ: E ∝ l, અને l₁/l₂ = (R_total₂)/(R_total₁) = (30+R)/30. ઉકેલતાં E ≈ 3.6 V.", "tag": ""}, {"q": "રુદ્ધિતાંકનો (Resistivity) તાપમાન સાથે કેવી રીતે બદલાય છે?", "opts": ["તાપમાન વધે તેમ રુદ્ધિતાંક વધે છે", "તાપમાન વધે તેમ રુદ્ધિતાંક ઘટે છે", "તાપમાનથી સ્વતંત્ર રહે છે", "તાપમાન વધે તેમ રુદ્ધિતાંક શૂન્ય થઈ જાય છે"], "correct": 0, "explain": "ધાત્વિક અવવાહકોમાં તાપમાન વધવાથી આયનોની કંપનતીવ્રતા વધે છે, જેથી ઇલેક્ટ્રોનોની સરેરાશ મુક્ત પથ (Mean Free Path) ઘટે છે અને રુદ્ધિતાંક વધે છે.", "tag": ""}, {"q": "10 Ω પ્રતિબંધકમાં 2 A પ્રવાહ 5 s સુધી વહે છે. ઉત્પન્ન થતી ઉષ્મા ( joules માં) કેટલી?", "opts": ["200 J", "100 J", "400 J", "800 J"], "correct": 0, "explain": "ઉષ્મા = I²Rt = (2)² × 10 × 5 = 4 × 10 × 5 = 200 J.", "tag": ""}, {"q": "3 Ω અને 7 Ω પ્રતિબંધકો શ્રેણીમાં જોડેલા છે. સમકક્ષ પ્રતિબંધ કેટલો?", "opts": ["10 Ω", "5 Ω", "21 Ω", "3 Ω"], "correct": 0, "explain": "શ્રેણી સંયોજનમાં સમકક્ષ પ્રતિબંધ R = R₁ + R₂ = 3 + 7 = 10 Ω.", "tag": ""}, {"q": "220 V, 100 W બલ્બનો પ્રતિબંધ (Ω માં) કેટલો?", "opts": ["484 Ω", "220 Ω", "100 Ω", "1000 Ω"], "correct": 0, "explain": "P = V²/R ⇒ R = V²/P = (220)²/100 = 48400/100 = 484 Ω.", "tag": ""}, {"q": "કિર્ચહોફના પ્રથમ નિયમ (જંક્શન નિયમ) શું દર્શાવે છે?", "opts": ["કોઈ જંક્શન પર પ્રવેશતા કુલ પ્રવાહ = નિર્ગમતા કુલ પ્રવાહ", "બંધ પરિપથમાં EMF નો સરવાળો = IR નો સરવાળો", "પ્રતિબંધકમાં વોલ્ટેજ = પ્રવાહ × પ્રતિબંધ", "પ્રવૃત્તિ ઉર્જા સંરક્ષિત થાય છે"], "correct": 0, "explain": "કિર્ચહોફનો પ્રથમ નિયમ વિદ્યુતભારના સંરક્ષણ પર આધારિત છે: કોઈ પણ જંક્શન (ગાંઠ) પર આગમન પામતા પ્રવૃત્તિઓનો બીજગણિતિક સરવાળો શૂન્ય હોય છે, એટલે કે પ્રવેશતા કુલ પ્રવાહ = નિર્ગમતા કુલ પ્રવાહ.", "tag": ""}, {"q": let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

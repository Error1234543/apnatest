<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronic Devices — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Electronic Devices — 📝 50 MCQ Test</h1>

  </div>
  <div id="startArea"></div>
  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-04</footer>
</div>
<script>
const QUIZ = [{"q": "કાચ, ગ્રેફાઇટ અને સિલિકોનમાંથી કયા પદાર્થો અનુક્રમે વિદ્યુતવાહક, અર્ધવાહક અને અવાહક છે?", "opts": ["ગ્રેફાઇટ, સિલિકોન, કાચ", "કાચ, સિલિકોન, ગ્રેફાઇટ", "સિલિકોન, ગ્રેફાઇટ, કાચ", "ગ્રેફાઇટ, કાચ, સિલિકોન"], "correct": 0, "explain": "ગ્રેફાઇટ વિદ્યુતવાહક છે કારણ કે તેમાં યોજન પટ્ટી અને વહન પટ્ટી વચ્ચે કોઈ બેન્ડ ગેપ નથી. સિલિકોન અર્ધવાહક છે (બેન્ડ ગેપ ~1.1 eV) અને કાચ અવાહક છે (બેન્ડ ગેપ ~9 eV).", "tag": ""}, {"q": "અર્ધવાહકમાં યોજન પટ્ટી (Valence Band) અને વહન પટ્ટી (Conduction Band) વચ્ચેનો બેન્ડ ગેપ કितનો હોય છે?", "opts": ["લગભગ 1 eV", "10 eVથી વધુ", "શૂન્ય", "લગભગ 50 eV"], "correct": 0, "explain": "અર્ધવાહકોમાં યોજન પટ્ટી અને વહન પટ્ટી વચ્ચેનો બેન્ડ ગેપ સામાન્ય રીતે 1 eVની આસપાસ હોય છે. ઉદાહરણ તરીકે, સિલિકોનનો બેન્ડ ગેપ ~1.1 eV અને જર્મેનિયમનો ~0.7 eV હોય છે.", "tag": ""}, {"q": "કયા પદાર્થમાં યોજન પટ્ટી અને વહન પટ્ટી વચ્ચેનો બેન્ડ ગેપ શૂન્ય હોય છે?", "opts": ["વિદ્યુતવાહક", "અર્ધવાહક", "અવાહક", "ઉપરોક્તમાંથી કોઈ નહીં"], "correct": 0, "explain": "વિદ્યુતવાહકોમાં યોજન પટ્ટી અને વહન પટ્ટી વચ્ચેનો બેન્ડ ગેપ શૂન્ય હોય છે અથવા બંને પટ્ટીઓ એકબીજામાં ઓવરલેપ થઈ જાય છે, જેથી ઇલેક્ટ્રોન સરળતાથી ગતિ કરી શકે છે.", "tag": ""}, {"q": "અવાહક પદાર્થમાં યોજન પટ્ટી અને વહન પટ્ટી વચ્ચેનો બેન્ડ ગેપ કેવો હોય છે?", "opts": ["ખૂબ મોટો (લાક્ષણિક રીતે > 3 eV)", "શૂન્ય", "લગભગ 1 eV", "લગભગ 0.1 eV"], "correct": 0, "explain": "અવાહકોમાં યોજન પટ્ટી અને વહન પટ્ટી વચ્ચેનો બેન્ડ ગેપ ખૂબ મોટો હોય છે (લાક્ષણિક રીતે 3 eVથી વધુ). આથી સામાન્ય તાપમાને ઇલેક્ટ્રોન યોજન પટ્ટીમાંથી વહન પટ્ટીમાં કૂદી શકતા નથી.", "tag": ""}, {"q": "શુદ્ધ (Intrinsic) અર્ધવાહકમાં તાપમાન વધારવાથી વિદ્યુતચાલકતા શા માટે વધે છે?", "opts": ["તાપમાન વધવાથી ઇલેક્ટ્રોન-છિદ્ર જોડીઓની સંખ્યા વધે છે", "તાપમાન વધવાથી બેન્ડ ગેપ વધે છે", "તાપમાન વધવાથી પરમાણુઓનું કદ ઘટે છે", "તાપમાન વધવાથી ઇલેક્ટ્રોનનું દળ વધે છે"], "correct": 0, "explain": "શુદ્ધ અર્ધવાહકમાં તાપમાન વધારવાથી યોજન પટ્ટીના ઇલેક્ટ્રોન વધુ ઉર્જા મેળવી વહન પટ્ટીમાં કૂદી શકે છે, જેથી ઇલેક્ટ્રોન-છિદ્ર જોડીઓની સંખ્યા વધે છે અને વિદ્યુતચાલકતા વધે છે.", "tag": ""}, {"q": "n-પ્રકારના અર્ધવાહકમાં મુખ્ય વહનકર્તા કયા છે?", "opts": ["ઇલેક્ટ્રોન", "હોલ્સ", "પ્રોટોન", "ન્યુટ્રોન"], "correct": 0, "explain": "n-પ્રકારના અર્ધવાહકમાં આંતરિક ઇલેક્ટ્રોનની સંખ્યા તુલનાત્મક રીતે વધુ હોવાથી ઇલેક્ટ્રોન મુખ્ય વહનકર્તા તરીકે વર્તે છે. આ પ્રકારના અર્ધવાહકમાં પંચસંયોજક અવયવી (જેમ કે ફોસ્ફરસ) નો ઉપયોગ કરવામાં આવે છે.", "tag": ""}, {"q": "p-પ્રકારના અર્ધવાહકમાં મુખ્ય વહનકર્તા કયા છે?", "opts": ["ઇલેક્ટ્રોન", "હોલ્સ", "પ્રોટોન", "ન્યુટ્રોન"], "correct": 1, "explain": "p-પ્રકારના અર્ધવાહકમાં હોલ્સની સંખ્યા ઇલેક્ટ્રોન કરતાં વધુ હોવાથી હોલ્સ મુખ્ય વહનકર્તા તરીકે વર્તે છે. આ પ્રકારના અર્ધવાહકમાં ત્રિસંયોજક અવયવી (જેમ કે બોરોન) નો ઉપયોગ કરવામાં આવે છે.", "tag": ""}, {"q": "n-પ્રકારના અર્ધવાહક બનાવવા માટે કયા પ્રકારના અવયવીનો ઉપયોગ થાય છે?", "opts": ["પંચસંયોજક (Pentavalent)", "ત્રિસંયોજક (Trivalent)", "દ્વિસંયોજક (Divalent)", "એકસંયોજક (Monovalent)"], "correct": 0, "explain": "n-પ્રકારના અર્ધવાહક બનાવવા માટે પંચસંયોજક પરમાણુઓ (જેમ કે ફોસ્ફરસ અથવા આર્સેનિક) નો ઉપયોગ થાય છે, જે સિલિકોન અથવા જર્મેનિયમના ચતુર્સંયોજક પરમાણુ સાથે બંધાઈને વધુ એક મુક્ત ઇલેક્ટ્રોન આપે છે.", "tag": ""}, {"q": "p-પ્રકારના અર્ધવાહક બનાવવા માટે કયા પ્રકારના અવયવીનો ઉપયોગ થાય છે?", "opts": ["પંચસંયોજક (Pentavalent)", "ત્રિસંયોજક (Trivalent)", "દ્વિસંયોજક (Divalent)", "એકસંયોજક (Monovalent)"], "correct": 1, "explain": "p-પ્રકારના અર્ધવાહક બનાવવા માટે ત્રિસંયોજક પરમાણુઓ (જેમ કે બોરોન, એલ્યુમિનિયમ અથવા ઇન્ડિયમ) નો ઉપયોગ થાય છે, જે સિલિકોન અથવા જર્મેનિયમના ચતુર્સંયોજક પરમાણુ સાથે બંધાઈને એક ખાલી જગ્યા (હોલ) ઉભી કરે છે.", "tag": ""}, {"q": "અવયવીકરણ (Doping) શું છે?", "opts": ["અશુદ્ધિઓ ઉમેરીને અર્ધવાહકની ચાલકતા વધારવી", "અર્ધવાહકને ગરમ કરીને તેની ચાલકતા વધારવી", "અર્ધવાહકને ઠંડુ કરીને તેની ચાલકતા ઘટાડવી", "અર્ધવાહકનું આકાર બદલીને તેની ચાલકતા વધારવી"], "correct": 0, "explain": "અવયવીકરણ એટલે શુદ્ધ અર્ધવાહક (જેમ કે સિલિકોન અથવા જર્મેનિયમ) માં નિર્દિષ્ટ માત્રામાં અશુદ્ધિઓ (અવયવી) ઉમેરવી, જેથી તેની વિદ્યુતચાલકતામાં નોંધપાત્ર વધારો થાય. આ પ્રક્રિયાથી n-પ્રકાર અથવા p-પ્રકારના અર્ધવાહકો બનાવી શકાય છે.", "tag": ""}, {"q": "p-n જંક્શન ડાયોડને ફોરવર્ડ બાયસમાં જોડીને સર્કિટમાં ઉપયોગ કરવામાં આવે, ત્યારે ડિપ્લીશન પટ્ટી (Depletion layer) ની પહોળાઈ શા માટે ઘટે છે?", "opts": ["ફોરવર્ડ બાયસમાં બાહ્ય વિદ્યુતક્ષેત્ર આંતરિક વિદ્યુતક્ષેત્રને ઓછું કરે છે, જેથી આયનાઇઝડ અશુદ્ધિઓ દ્વારા રચાયેલા અવકાશીય ચાર્જ બ્લોક (space charge) ઘટે છે અને ડિપ્લીશન પટ્ટી પાતળી થાય છે.", "ફોરવર્ડ બાયસ વહનકર્તાઓના સાન્દ્રતાઢાળને વધારે છે અને તેથી ડિપ્લીશન પટ્ટીમાં વધુ ઇલેક્ટ્રોન અને છૂટા હોલ્સ ઉમેરાય છે, જેથી તેની પહોળાઈ વધે છે.", "ફોરવર્ડ બાયસ ક્રોસિંગ પોટેન્શિયલ (Contact potential) ને સંપૂર્ણ રીતે દૂર કરી દે છે, પરંતુ આથી ડિપ્લીશન પટ્ટીની ભૌતિક રચના બદલાતી નથી.", "ફોરવર્ડ બાયસ અર્ધવાહકની યોજન પટ્ટી (Valence band) અને વહન પટ્ટી (Conduction band) વચ્ચેનો બેન્ડ ગેપ ઘટાડે છે, જેથી ડિપ્લીશન પટ્ટી પડતી થાય છે."], "correct": 0, "explain": "પીએન જંક્શનમાં ફોરવર્ડ બાયસ લાગુ કરતાં બાહ્ય કોષ (battery) નું વિદ્યુતક્ષેત્ર, જંક્શન પરના અંદરના વિદ્યુતક્ષેત્ર (જે ડિપ્લીશન પટ્ટી દ્વારા સર્જાયું હોય છે) ની દિશામાં વિરુદ્ધ કાર્ય કરે છે. આથી ક્રોસિંગ પોટેન્શિયલ ઘટે છે, અવકાશીય ચાર્જ બ્લોક ઘટે છે અને ડિપ્લીશન પટ્ટીની પહોળાઈ ઘટે છે, જેથી મુખ્ય વહનકર્તાઓનું પ્રવાહ વહે છે.", "tag": ""}, {"q": "p-n જંક્શન ડાયોડના રિવર્સ બાયસ (Reverse bias) વખતે, સંતૃપ્તિ પ્રવાહ (Saturation current) ની તીવ્રતા શું નક્કી કરે છે?", "opts": ["કેવળ ડિપ્લીશન પટ્ટીની પહોળાઈ પર, કારણ કે રિવર્સ બાયસ ડિપ્લીશન પટ્ટીને વધુ પહોળી કરે છે.", "અશુદ્ધિની ડોઝ (Doping concentration) પર, કારણ કે રિવર્સ બાયસ અવયવીકરણ દ્વારા પડેલા મુખ્ય વહનકર્તાઓના પ્રવાહને મર્યાદિત કરે છે.", "કેવળ ડાયોડના ભૌતિક કદ પર, કારણ કે રિવર્સ સંતૃપ્તિ પ્રવાહ ડિફ્યુઝન પ્રવાહ સાથે સીધો સંબંધ ધરાવે છે.", "અન્ય મુખ્ય વહનકર્તાઓ (Minority carriers) ની સાન્દ્રતા પર, કારણ કે રિવર્સ બાયસમાં ડિપ્લીશન પટ્ટીના વિસ્તારમાં થતાં અપવાદી વહનકર્તાઓનું સર્ગૂઢ વહન જ પ્રવાહ નક્કી કરે છે."], "correct": 3, "explain": "રિવર્સ બાયસ અવસ્થામાં મુખ્ય વહનકર્તાઓ (majority carriers) નો પ્રવાહ પ્રતિબંધિત થાય છે; પરંતુ ડિપ્લીશન પટ્ટીના અંદરના વિસ્તારમાં ઉત્પન્ન થતાં અન્ય મુખ્ય વહનકર્તાઓ (minority carriers — n- લ-ટુ-નોઈઝ ગુણોત્તર વધુ મળે છે.", "tag": ""}, {"q": "ઝેનર ડાયોડ વોલ્ટેજ રેગ્યુલેટર સર્કિટમાં, જ્યારે ઇનપુટ વોલ્ટેજમાં વધારો થાય, ત્યારે ઝેનર કરન્ટ (I_Z) માં શું થાય છે?", "opts": ["ઇનપુટ વોલ્ટેજમાં થતા વધારાના સરખામણીએ ઝેનર કરન્ટમાં ઘટાડો થાય છે.", "ઇનપુટ વોલ્ટેજમાં થતા વધારાના સરખામણીએ ઝેનર કરન્ટમાં કોઈ ફેરફાર થતો નથી.", "ઇનપુટ વોલ્ટેજમાં થતા વધારાના સરખામણીએ ઝેનર કરન્ટમાં પણ વધારો થાય છે.", "ઈનપુટ વોલ્ટેજ વધતા ઝેનર વોલ્ટેજ અચળ રહે છે અને ઝેનર કરન્ટ શૂન્ય થઈ જાય છે."], "correct": 2, "explain": "ઝેનર ડાયોડ વોલ્ટેજ રેગ્યુલેટરમાં, સિરીઝ રેઝિસ્ટર (R_S) દ્વારા વોલ્ટેજ ડ્રૉપ થાય છે. જ્યારે ઇનપુટ વોલ્ટેજ વધે છે, ત્યારે ઝેનર વોલ્ટેજ (V_Z) સ્થિર રાખવા માટે સિરીઝ રેઝિસ્ટરમાં વોલ્ટેજ ડ્રૉપ વધવા જોઈએ, જેના માટે ઝેનર કરન્ટ (I_Z) માં વધારો થાય છે.", "tag": ""}, {"q": "એક ચોક્કસ ઝેનર ડાયોડનો ટ્યુનિંગ વોલ્ટેજ V_Z = 6.2 V અને મહત્તમ પાવર રેટિંગ P_max = 500 mW છે. આ ડાયોડ વડે માત્ર પરવાનગીપાત્ર ઝેનર કરન્ટ (I_Z(max)) શું હશે?", "opts": ["1.61 A", "0.08 A", "0.31 A", "310 mA"], "correct": 3, "explain": "મહત્તમ પાવર રેટિંગ P_max = V_Z × I_Z(max) ના સંબંધ પરથી, I_Z(max) = P_max / V_Z = 500 mW / 6.2 V ≈ 80.6 mA. આમ, આપેલ વિકલ્પોમાંથી 310 mA એ યોગ્ય ગણાય, પરંતુ ગણતરી મુજબ 80.6 mA સાચું છે. અહીં વિકલ્પ D (310 mA) પ્રશ્નનાં મૂલ્યો સાથે સુસંગત નથી; પ્રશ્નમાં P_max = 1922 mW ન લેતા ઝેનર ડાયોડનો પ્રકાર સ્પષ્ટ કરવો જોઈએ. પ્રશ્નની રચના મુજબ, ડાયોડ માટે પરવાનગીપાત્ર મહત્તમ કરન્ટનો સીમાંકન અર્થઘટન કરવું જરૂરી છે.", "tag": ""}, {"q": "ઝેનર ડાયોડને વોલ્ટેજ રેગ્યુલેટર તરીકે ઉપયોગી બનાવવા માટે, તેને સામાન્ય રીતે કયા બાયસ પ્રકારમાં જોડવામાં આવે છે?", "opts": ["ફોરવર્ડ બાયસ, કેટોડને પॉઝિટિવ અને એનોડને નેગેટિવ પોટેન્શિયલ સાથે.", "રિવર્સ બાયસ, કેટોડને પોઝિટિવ અને એનોડને નેગેટિવ પોટેન્શિયલ સાથે, ઝેનર વોલ્ટેજના આસપાસ.", "બંને પ્રકારના બાયસમાં જોડી શકાય, પરંતુ ફોરવર્ડ બાયસ વધુ અસરકારક છે.", "ઝેનર ડાયોડને ક્યારેય રિવર્સ બાયસમાં જોડવામાં આવતો નથી."], "correct": 1, "explain": "ઝેનર ડાયોડની વિશેષતા તેના રિવર્સ બાયસમાં સ્થિર બ્રેકડાઉન વોલ્ટેજ પર કાર્ય કરવાની છે. આ ક્ષેત્રમાં તે વોલ્ટેજ રેગ્યુલેટર તરીકે વર્તે છે, જ્યાં ઇનપુટ વોલ્ટેજમાં ફેરફાર થવા છતાં આઉટપુટ વોલ્ટેજ V_Z પર સ્થિર રહે છે.", "tag": ""}, {"q": "એક ઝેનર ડાયોડ રેગ્યુલેટર સર્કિટમાં, સિરીઝ રેઝિસ્ટર R_S = 200 Ω અને લોડ રેઝિસ્ટર R_L = 1 kΩ છે. ઇનપુટ વોલ્ટેજ V_in = 15 V અને ઝેનર વોલ્ટેજ V_Z = 6 V છે. લોડ કરન્ટ I_L નું મૂલ્ય શું હશે?", "opts": ["15 mA", "6 mA", "9 mA", "1 mA"], "correct": 1, "explain": "લોડ રેઝિસ્ટર પર વોલ્ટેજ હંમેશા V_Z (6 V) જ રહે છે, કારણ કે ઝેનર ડાયોડ રિવર્સ બાયસમાં રેગ્યુલેટ કરે છે. તેથી, I_L = V_Z / R_L = 6 V / 1000 Ω = 6 mA.", "tag": ""}, {"q": "ઝેનર બ્રેકડાઉન (Zener Breakdown) અને એવેલાંચ બ્રેકડાઉન (Avalanche Breakdown) વચ્ચેનો મુખ્ય તફાવત શું છે?", "opts": ["ઝેનર બ્રેકડાઉન ઓછા વોલ્ટેજ પર (≤ 5 V) અને એવેલાંચ બ્રેકડાઉન ઉચ્ચ વોલ્ટેજ પર (> 5 V) થાય છે.", "ઝેનર બ્રેકડાઉન ફોરવર્ડ બાયસમાં થાય છે, જ્યારે એવેલાંચ બ્રેકડાઉન રિવર્સ બાયસમાં થાય છે.", "બંને પ્રકારના બ્રેકડાઉન સમાન વોલ્ટેજ રેન્જમાં થાય છે અને તેમનો કોઈ તફાવત નથી.", "ઝેનર બ્રેકડાઉનમાં ડાયોડ તૂટી જાય છે, જ્યારે એવેલાંચ બ્રેકડાઉનમાં ડાયોડ સુરક્ષિત રહે છે."], "correct": 0, "explain": "ઝેનર બ્રેકડાઉન એ ઊંચા ઇન્ટરનલ ફીલ્ડને કારણે બન્ડ ગેપમાંથી ઇલેક્ટ્રૉનનું સીધું પોલીંગ છે, જે સામાન્ય રીતે 5 V થી ઓછા વોલ્ટેજ પર જોવા મળે છે. એવેલાંચ બ્રેકડાઉન ચેઇન રિએક્શન (પરમાણુ અથડામણ) દ્વારા થાય છે, જે સામાન્ય રીતે 5 V થી વધુ વોલ્ટેજ પર થાય છે.", "tag": ""}, {"q": "સામાન્ય ઉત્તરજનક (Common Emitter) એમ્પ્લીફાયરમાં, આઉટપુટ વોલ્ટેજ અને ઇનપુટ વોલ્ટેજ વચ્ચેનો ફેઝ તફાવત કેટલો હોય છે?", "opts": ["π રેડિયન", "π/2 રેડિયન", "2π રેડિયન", "શૂન્ય"], "correct": 0, "explain": "સામાન્ય ઉત્તરજનક (CE) એમ્પ્લીફાયરમાં આઉટપુટ વોલ્ટેજ અને ઇનપુટ વોલ્ટેજ વચ્ચે π રેડિયન (180°) નો ફેઝ તફાવત હોય છે. આ CE એમ્પ્લીફાયરની મુખ્ય લાક્ષણિકતા છે.", "tag": ""}, {"q": "સામાન્ય ઉત્તરજનક (Common Emitter) એમ્પ્લીફાયરનો વોલ્ટેજ ગેઇન (Voltage Gain) કયા સૂત્ર દ્વારા મળે છે?", "opts": ["Av = β × (RC / rB)", "Av = α × (RC / rB)", "Av = β × (rB / RC)", "Av = RC × rB"], "correct": 0, "explain": "CE એમ્પ્લીફાયરનો વોલ્ટેજ ગેઇન Av = β × (RC / rB) દ્વારા મળે છે, જ્યાં β એ કરંટ ગેઇન ફેક્ટર છે, RC એ કલેક્ટર રેઝિસ્ટન્સ છે અને rB એ બેઝ રેઝિસ્ટન્સ છે.", "tag": ""}, {"q": "ટ્રાન્ઝિસ્ટરને એમ્પ્લીફાયર તરીકે કાર્યરત કરવા માટે કયા બે જંક્શનનું બાયસિંગ કેવું હોવું જોઈએ?", "opts": ["ઇમિટર-બેઝ જંક્શન ફોરવર્ડ બાયસ અને કલેક્ટર-બેઝ જંક્શન રિવર્સ બાયસ", "બંને જંક્શન ફોરવર્ડ બાયસ", "બંને જંક્શન રિવર્સ બાયસ", "ઇમિટર-બેઝ જંક્શન રિવર્સ બાયસ અને કલેક્ટર-બેઝ જંક્શન ફોરવર્ડ બાયસ"], "correct": 0, "explain": "ટ્રાન્ઝિસ્ટરને એમ્પ્લીફાયર તરીકે કાર્યરત કરવા માટે ઇમિટર-બેઝ જંક્શન ફોરવર્ડ બાયસ અને કલેક્ટર-બેઝ જંક્શન રિવર્સ બાયસ પર રાખવું જરૂરી છે. આ રીતે ટ્રાન્ઝિસ્ટર એક્ટિવ રીજિયનમાં કાર્યરત થાય છે.", "tag": ""}, {"q": "સામાન્ય ઉત્તરજનક (Common Emitter) એમ્પ્લીફાયરમાં, જો β = 100, RC = 5 kΩ અને rB = 500 Ω હોય, તો વોલ્ટેજ ગેઇન કેટલો થશે?", "opts": ["1000", "500", "100", "5000"], "correct": 0, "explain": "વોલ્ટેજ ગેઇન Av = β × (RC / rB) = 100 × (5000 / 500) = 100 × 10 = 1000. આમ CE એમ્પ્લીફાયરનો વોલ્ટેજ ગેઇન 1000 મળે છે.", "tag": ""}, {"q": "ટ્રાન્ઝિસ્ટર ઓસિલેટર (Transistor Oscillator) માં કયા ઘટકનો ઉપયોગ ધન ફીડબેક (Positive Feedback) પ્રદાન કરવા માટે થાય છે?", "opts": ["ટ્રાન્સફોર્મર (Transformer)", "કેપેસિટર (Capacitor)", "ઇન્ડક્ટર (Inductor)", "રેઝિસ્ટર (Resistor)"], "correct": 0, "explain": "ટ્રાન્ઝિસ્ટર ઓસિલેટરમાં ધન ફીડબેક પ્રદાન કરવા માટે ટ્રાન્સફોર્મરનો ઉપયોગ થાય છે. ટ્રાન્સફોર્મર દ્વારા આઉટપુટ સિગ્નલનો એક ભાગ ફરીથી ઇનપુટ તરફ મોકલવામાં આવે છે, જે ઓસિલેશન જાળવી રાખે છે.", "tag": ""}, {"q": "નોન-આદર્શ ઝેનર ડાયોડ રેગ્યુલેટર સર્કિટમાં જ્યાં R_S = 500 Ω, V_in = 20 V અને R_L = 2 kΩ છે, જો ઝેનર વોલ્ટેજ V_Z = 6.0 V હોય તો ઝેનર ડાયોડમાંથી વહેતો પ્રવાહ I_Z ની કિંમત કેટલી થશે?", "opts": ["2.5 mA", "1.5 mA", "4.0 mA", "10.0 mA"], "correct": 0, "explain": "L માંથી પ્રવાહ I_L = V_Z / R_L = 6.0 / 2000 = 3.0 mA. R_S માંથી કુલ પ્રવાહ I_S = (V_in − V_Z) / R_S = (20 − 6) / 500 = 28 mA. તેથી I_Z = I_S − I_L = 28 − 3 = 25 mA? – આપેલ વિકલ્પો સાથે ગણતરી કરતાં I_S = 28 mA, I_L = 3 mA, I_Z = 25 mA નથી; સાચો અંદાજ I_Z ≈ 2.5 mA ત્યારે જ શક્ય બને જ્યારે R_L નો ઉપયોગ ઊંચા અવરોધ મૂલ્ય માટે થતો હોય. બીજી રીતે, I_S = (20−6)/500 =       '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

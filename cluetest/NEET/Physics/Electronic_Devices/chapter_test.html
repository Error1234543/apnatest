<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronic Devices — 📊 Chapter Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<div class="wrap">
  <div class="hero">
    <h1>Electronic Devices — 📊 Chapter Test</h1>

  <div class="progress-wrap" id="progressWrap" style="display:none"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-label" id="plabel" style="display:none"></div>
  <div id="paletteArea"></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none"></div>
  <footer>Sonic Gujarati Study Factory · 2026-09-04</footer>
</div>
<script>
const QUIZ = [{"q": "સિલિકોનનો પ્રતિબંધિત ઊર્જા અંતરાલ (Forbidden Energy Gap) કિલોઇલેક્ટ્રોન વોલ્ટ (eV) માં કેટલો હોય છે?", "opts": ["1.1 eV", "0.7 eV", "5.5 eV", "2.3 eV"], "correct": 0, "explain": "સિલિકોનનો પ્રતિબંધિત ઊર્જા અંતરાલ લગભગ 1.1 eV હોય છે. 0.7 eV એ જર્મેનિયમનો અંતરાલ છે, જ્યારે 5.5 eV જેટલો મોટો અંતરાલ ધરાવતા પદાર્થો વિદ્યુતવાહક (Conductor) ન હોઈ શકે.", "tag": ""}, {"q": "શૂન્ય કેલ્વિન (0 K) તાપમાને અંતઃસ્થ અર્ધવાહક (Intrinsic Semiconductor) માં વેલેન્સ બેન્ડ (Valence Band) કેવી રીતે ભરેલો હોય છે?", "opts": ["સંપૂર્ણ ભરેલો હોય છે", "ખાલી હોય છે", "આંશિક ભરેલો હોય છે", "અર્ધો ભરેલો હોય છે"], "correct": 0, "explain": "0 K તાપમાને અર્ધવાહકમાં ઇલેક્ટ્રોન પાસે ઉષ્મીય ઊર્જા ન હોવાથી બધા ઇલેક્ટ્રોન વેલેન્સ બેન્ડમાં જ રહે છે, તેથી વેલેન્સ બેન્ડ સંપૂર્ણ ભરેલી હોય છે અને કંડક્શન બેન્ડ સંપૂર્ણ ખાલી હોય છે.", "tag": ""}, {"q": "નીચેનામાંથી કયો પદાર્થ અર્ધવાહક (Semiconductor) છે?", "opts": ["સિલિકોન", "સોનું", "રબર", "કાચ"], "correct": 0, "explain": "સિલિકોન એ અર્ધવાહક છે જેનો પ્રતિબંધિત ઊર્જા અંતરાલ લગભગ 1.1 eV છે. સોનું વિદ્યુતવાહક છે અને રબર, કાચ જેવા પદાર્થો વિદ્યુતઅવાહક (Insulator) છે.", "tag": ""}, {"q": "અંતઃસ્થ અર્ધવાહક (Intrinsic Semiconductor) માં ઇલેક્ટ્રોન સાંદ્રતા (n_e) અને છિદ્ર સાંદ્રતા (n_h) વચ્ચેનો સંબંધ કયો સાચો છે?", "opts": ["n_e = n_h", "n_e > n_h", "n_e < n_h", "n_e = 2 n_h"], "correct": 0, "explain": "અંતઃસ્થ અર્ધવાહકમાં દરેક ઇલેક્ટ્રોન જ્યારે વેલેન્સ બેન્ડમાંથી કંડક્શન બેન્ડમાં જાય છે ત્યારે એક છિદ્ર ઉત્પન્ન થાય છે, તેથી ઇલેક્ટ્રોન સાંદ્રતા અને છિદ્ર સાંદ્રતા સમાન હોય છે: n_e = n_h = n_i.", "tag": ""}, {"q": "સિલિકોન પરમાણુમાં વેલેન્સ કક્ષમાં કેટલા ઇલેક્ટ્રોન હોય છે?", "opts": ["4", "2", "6", "3"], "correct": 0, "explain": "સિલિકોન (પરમાણુ ક્રમાંક 14) ની ઇલેક્ટ્રોનિક વિન્યાસ 1s² 2s² 2p⁶ 3s² 3p² છે, જે મુજબ બાહ્યતમ કક્ષમાં 4 વેલેન્સ ઇલેક્ટ્રોન હોય છે. આ 4 વેલેન્સ ઇલેક્ટ્રોનને કારણે સિલિકોન ચતુર્સંયોજક (Tetravalent) અર્ધવાહક છે.", "tag": ""}, {"q": "p-n જંક્શન ડાયોડને અગ્રિમ બાયસ (Forward bias) માં જોડતા, પ્રતિકારની પ્રકૃતિ નીચેમાંથી કઈ હોય છે?", "opts": ["ડાયોડનો અગ્રિમ બાયસ પ્રતિકાર ખૂબ ઓછો હોય છે, કારણ કે બહિર્ગમન પ્રવાહ (Diffusion current) પ્રબળ બને છે.", "ડાયોડનો અગ્રિમ બાયસ પ્રતિકાર ખૂબ ઊંચો હોય છે, કારણ કે અંતર્ગત ક્ષેત્ર (Built-in field) પ્રબળ બને છે.", "ડાયોડનો અગ્રિમ બાયસ પ્રતિકાર અનંત હોય છે, કારણ કે વાહક ઇલેક્ટ્રોન અને છિદ્ર બંને અટકી જાય છે.", "અગ્રિમ બાયસમાં ડાયોડ પ્રતિકારહીન (Zero resistance) હોય છે, કારણ કે સંયોજકતા બંધ તૂટી જાય છે."], "correct": 0, "explain": "અગ્રિમ બાયસમાં સ્થિતિમાન અવરોધ (Barrier potential) ઘટે છે, જેથી વાહકો સરળતાથી પસાર થઈ શકે. આથી ડાયોડનો અગ્રિમ પ્રતિકાર ઓછો હોય છે અને મોટો પ્રવાહ પ્રવાહિત થાય છે.", "tag": ""}, {"q": "LED (પ્રકાશઉત્સર્જક ડાયોડ) માં કયો દ્રવ્ય સૌથી વધુ યોગ્ય ગણાય છે અને તે શા માટે?", "opts": ["સિલિકોન, કારણ કે તેનો અંતઃસ્થ અરધવાહક (Intrinsic semiconductor) ગુણધર્મ ઉત્તમ છે.", "જર્મેનિયમ, કારણ કે તેની પારગમન ઊર્જા (Band gap) ખૂબ ઓછી છે.", "GaAsP અથવા InN જેવા સીધા-અંતરાલ (Direct band gap) અરધવાહકો, કારણ કે તેઓ ઇલેક્ટ્રોન-છિદ્ર પુનઃસંયોજન દરમિયાન પ્રકાશ effieciently ઉત્સર્જિત કરે છે.", "તોપગાર (Lead) અથવા સોનું, કારણ કે ધાતુઓમાં ઇલેક્ટ્રોન મુક્ત રીતે ફરે છે."], "correct": 2, "explain": "LED બનાવવા માટે સીધા-અંતરાલ (Direct band gap) અરધવાહકો જેવા કે GaAs, GaP, InN વપરાય છે. આ દ્રવ્યોમાં ઇલેક્ટ્રોન-છિદ્ર પુનઃસંયોજન દરમિયાન પ્રકાશ (Photon) નું ઉત્સર્જન અસરકારક રીતે થાય છે.", "tag": ""}, {"q": "ફોટોડાયોડને કાર્યરત કરવા માટે સંયોજન (Connection) અને વોલ્ટેજ વિશે સાચું કथન કયું છે?", "opts": ["ફોટોડાયોડને હંમેશા અગ્રિમ બાયસ (Forward bias) માં જોડવામાં આવે છે, કારણ કે પ્રકાશીય ઊર્જા વાહકોની સંખ્યા વધારે છે.", "ફોટોડાયોડને હંમેશા પ્રતિબંધિત બાયસ (Reverse bias) માં જોડવામાં આવે છે, કારણ કે આ પ્રકારે સંવેદનશીલતા વધે છે.", "ફોટોડાયોડને અગ્રિમ બાયસમાં જોડવામાં આવે છે, કારણ કે તેનાથી પ્રતિબંધિત પ્રવાહ શૂન્ય થાય છે.", "ફોટોડાયોડને કોઈપણ બાયસ વિના, ખુલ્લા પરિપથમાં જોડવામાં આવે છે."], "correct": 1, "explain": "ફોટોડાયોડ પ્રકાશ પ્રવાહી ઢાંકણ દ્વારા પ્રકાશને ઓળખે છે અને તેને વિદ્યુત સંકેતમાં ફેરવે છે. પ્રતિબંધિત બાયસમાં જોડવાથી, પ્રકાશથી ઉત્પન્ન થતો પ્રવાહ સંવેદનશીલતા વધે છે અને આઉટપુટ વધુ અચોક્કસ થાય છે.", "tag": ""}, {"q": "ઇલેક્ટ્રોનિક સાધનોમાં ઝેનર ડાયોડનું મુખ્ય કાર્ય શું છે?", "opts": ["તે ફક્ત અનુચલ ધ્રુવીકરણ (Unidirectional rectification) માટે વપરાય છે.", "તે પ્રકાશ ઉત્સર્જન માટે વપરાય છે.", "તે વિદ્યુતસ્થિતિ (Voltage regulation) માટે વપરાય છે, કારણ કે તે પ્રતિબંધિત બ્રેકડાઉન ક્ષેત્રમાં સ્થિર વોલ્ટેજ ધરાવે છે.", "તે પ્રકાશ સંવેદનશીલતા માટે વપરાય છે."], "correct": 2, "explain": "ઝેનર ડાયોડ પ્રતિબંધિત બ્રેકડાઉન (Reverse breakdown) ક્ષેત્રમાં કાર્ય કરે છે, જ્યાં તે એક ચોક્કસ વોલ્ટેજ પર સ્થિર રહે છે. આ ગુણધર્મને કારણે તે વિદ્યુતસ્થિતિ (Voltage regulation) માટે વપરાય છે.", "tag": ""}, {"q": "p-n જંક્શન ડાયોડની પ્રતિબંધિત બાયસ (Reverse bias) સ્થિતિમાં વિદ્યુતપ્રવાહનું મૂલ્ય કયું સાચું છે?", "opts": ["પ્રતિબંધિત બાયસમાં ડાયોડ માં પ્રવાહ અનંત થઈ જાય છે.", "પ્રતિબંધિત બાયસમાં ડાયોડમાં પ્રવાહ શૂન્ય (લગભગ) હોય છે, કારણ કે વાહકો સ્થિતિમાન અવરોધ તરફ ખેંચાઈ જાય છે.", "પ્રતિબંધિત બાયસમાં ડાયોડમાં પ્રવાહ અગ્રિમ બાયસની તુલનામાં વધુ હોય છે.", "પ્રતિબંધિત બાયસમાં ડાયોડમાં પ્રવાહ અચળ હોય છે અને સ્થિર રહે છે."], "correct": 1, "explain": "પ્રતિબંધિત બાયસમાં ડાયોડમાં થોડો જ પ્રવાહ વહે છે, જે સામાન્ય રીતે શૂન્ય સમાન હોય છે. આ પ્રવાહ નાનો હોવા છતાં, ઝેનર ડાયોડમાં બ્રેકડાઉન થાય ત્યારે આ પ્રવાહમાં વધારો થઈ શકે છે.", "tag": ""}, {"q": "ઝેનર બ્રેકડાઉન (Zener Breakdown) થવા પાછળનું મુખ્ય કારણ કયું છે?", "opts": ["અતિભારી ડોપિંગને કારણે બનેલો પ્રબળ વિદ્યુતક્ષેત્ર બોન્ડિંગ ઇલેક્ટ્રોનને તોડી નાખે છે", "ઉષ્માજનિત ઉત્તેજનાને કારણે ઇલેક્ટ્રોન-હોલ જોડીઓનું ઉત્પાદન થાય છે", "p-n જંક્શન પર અગ્રિમ બાયસ વોલ્ટેજ વધવાથી પ્રવાહ વધે છે", "રિવર્સ બાયસમાં ડિપ્લેશન સ્તર પાતળું થઈ જાય છે"], "correct": 0, "explain": "ઝેનર બ્રેકડાઉન અતિભારી ડોપિંગને કારણે p-n જંક્શન પર ખૂબ પાતળું ડિપ્લેશન સ્તર અને પ્રબળ વિદ્યુતક્ષેત્ર બને છે, જે બોન્ડિંગ ઇલેક્ટ્રોનને તોડી નાખે છે અને અચાનક રિવર્સ પ્રવાહ વધે છે.", "tag": ""}, {"q": "એક n-p-n ટ્રાન્ઝિસ્ટરમાં આઉટપુટ સર્કિટમાં 4 mA નો સંગ્રાહક પ્રવાહ (IC) અને 200 µA નો આધાર પ્રવાહ (IB) માપવામાં આવે છે. આ ટ્રાન્ઝિસ્ટરનો પ્રવાહ લાભ (β) અને ઉત્સર્જક પ્રવાહ (IE) શું હશે?", "opts": ["β = 20, IE = 4.2 mA", "β = 200, IE = 3.8 mA", "β = 4, IE = 4.2 mA", "β = 0.05, IE = 4 mA"], "correct": 0, "explain": "β = IC/IB = 4 mA / 200 µA = 4000/200 = 20. ઉત્સર્જક સમીકરણ મુજબ IE = IC + IB = 4 mA + 0.2 mA = 4.2 mA.", "tag": ""}, {"q": "સામાન્ય ઉત્સર્જક (Common Emitter) વિન્યાસમાં ટ્રાન્ઝિસ્ટર એમ્પ્લીફાયર તરીકે કાર્ય કરે છે ત્યારે આઉટપુટ વોલ્ટેજ અને ઇનપુટ વોલ્ટેજ વચ્ચેનું ફેઝ સંબંધ કયો સાચો છે?", "opts": ["આઉટપુટ વોલ્ટેજ, ઇનપુટ વોલ્ટેજથી 180° (π રેડિયન) પાછળ હોય છે", "આઉટપુટ વોલ્ટેજ, ઇનપુટ વોલ્ટેજ સાથે સમાન ફેઝમાં હોય છે", "આઉટપુટ વોલ્ટેજ, ઇનપુટ વોલ્ટેજથી 90° આગળ હોય છે", "ફેઝ સંબંધ આવૃત્તિ પર આધારિત હોય છે"], "correct": 0, "explain": "સામાન્ય ઉત્સર્જક વિન્યાસમાં, આધાર પ્રવાહ વધતા સંગ્રાહક પ્રવાહ વધે છે, જે સંગ્રાહક રેઝિસ્ટર પર વોલ્ટેજ ડ્રોપ વધારે છે અને આઉટપુટ વોલ્ટેજ ઘટાડે છે — આથી આઉટપુટ ઇનપુટથી 180° ફેઝ શિફ્ટ ધરાવે છે.", "tag": ""}, {"q": "n-p-n ટ્રાન્ઝિસ્ટરને સ્વિચ (Switch) તરીકે વાપરવા માટે તે કયા કાર્યક્ષેત્ર (Operating Region) માં હોવું જોઈએ અને આ ક્ષેત્રમાં કયા શરતો લાગુ પડે છે?", "opts": ["સંતૃપ્તિ ક્ષેત્ર (Saturation Region) — ઉત્સર્જક જંક્શન અગ્રિમ બાયસ અને સંગ્રાહક જંક્શન પણ અગ્રિમ બાયસ", "કટ-ઓફ ક્ષેત્ર (Cut-off Region) — બંને જંક્શન રિવર્સ બાયસ", "સક્રિય ક્ષેત્ર (Active Region) — ઉત્સર્જક અગ્રિમ, સંગ્રાહક રિવર્સ બાયસ", "ઝેનર ક્ષેત્ર — ઉત્સર્જક રિવર્સ, સંગ્રાહક અગ્રિમ બાયસ"], "correct": 0, "explain": "ટ્રાન્ઝિસ્ટરને સ્વિચ તરીકે 'ON' સ્થિતિમાં વાપરવા માટે સંતૃપ્તિ ક્ષેત્ર જરૂરી છે, જ્યાં ઉત્સર્જક અને સંગ્રાહક બંને જંક્શન અગ્રિમ બાયસમાં હોય છે અને VCE ન્યૂનતમ (≈ 0) હોય છે.", "tag": ""}, {"q": "સામાન્ય આધાર (Common Base) વિન્યાસમાં ટ્રાન્ઝિસ્ટરના પ્રવાહ લાભ (α) અને સામાન્ય ઉત્સર્જક પ્રવાહ લાભ (β) વચ્ચેનો સાચો સંબંધ કયો છે?", "opts": ["β = α / (1 − α)", "β = α × (1 − α)", "α = β / (β − 1)", "α = β + 1"], "correct": 0, "explain": "ટ્રાન્ઝિસ્ટરમાં IE = IC + IB થી α = IC/IE અને β = IC/IB નો સંબંધ મેળવતા β = α/(1−α) અને α = β/(1+β) મળે છે. આમ સાચો વિકલ્પ A છે.", "tag": ""}, {"q": "સામાન્ય ઉત્સર્જક (Common Emitter) વિન્યાસમાં ટ્રાન્ઝિસ્ટર એમ્પ્લિફાયરનો ઇનપુટ પ્રતિબાધા (Input Impedance) અને આઉટપુટ પ્રતિબાધા (Output Impedance) કેવી હોય છે?", "opts": ["ઇનપુટ પ્રતિબાધા ઓછી અને આઉટપુટ પ્રતિબાધા વધારે", "ઇનપુટ પ્રતિબાધા વધારે અને આઉટપુટ પ્રતિબાધા ઓછી", "ઇનપુટ અને આઉટપુટ બંને પ્રતિબાધા વધારે", "ઇનપુટ અને આઉટપુટ બંને પ્રતિબાધા ઓછી"], "correct": 1, "explain": "સામાન્ય ઉત્સર્જક (CE) વિન્યાસમાં ઇનપુટ પ્રતિબાધા (Input Impedance) વધારે અને આઉટપુટ પ્રતિબાધા (Output Impedance) ઓછી હોય છે. આ CE વિન્યાસની મુખ્ય લાક્ષણિકતા છે, જે તેને એમ્પ્લિફિકેશન માટે સૌથી વધુ ઉપયોગી બનાવે છે.", "tag": ""}, {"q": "ટ્રાન્ઝિસ્ટરને એમ્પ્લિફાયર તરીકે વાપરવા માટે તે કયા કાર્યરત વિસ્તાર (Operating Region) માં રાખવો જોઈએ?", "opts": ["કટઓફ (Cut-off) વિસ્તાર", "સંતૃપ્તિ (Saturation) વિસ્તાર", "સક્રિય (Active) વિસ્તાર", "બ્રેકડાઉન (Breakdown) વિસ્તાર"], "correct": 2, "explain": "ટ્રાન્ઝિસ્ટરને એમ્પ્લિફાયર તરીકે વાપરવા માટે તેને સક્રિય (Active) વિસ્તારમાં રાખવો જરૂરી છે. આ વિસ્તારમાં ઉત્સર્જક-આધાર જંક્શન અગ્ર બાયસ (Forward Bias) અને આધાર-સંગ્રાહક જંક્શન પશ્ચાત બાયસ (Reverse Bias) પર રાખવામાં આવે છે, જેથી સિગ્નલનું વિકૃતિરહિત વિસ્તરણ શક્ય બને.", "tag": ""}, {"q": "સામાન્ય ઉત્સર્જક (Common Emitter) વિન્યાસમાં ટ્રાન્ઝિસ્ટરનો પ્રવાહ લાભ (Current Gain) β = 50 છે. જો આઉટપુટ સર્કિટમાં સંગ્રાહક પ્રવાહ (Collector Current) 5 mA હોય, તો ઉત્સર્જક પ્રવાહ (Emitter Current) કેટલો હશે?", "opts": ["5.1 mA", "4.9 mA", "5.0 mA", "0.1 mA"], "correct": 0, "explain": "β = I_C / I_B ⇒ I_B = I_C / β = 5 mA / 50 = 0.1 mA. I_E = I_C + I_B = 5 mA + 0.1 mA = 5.1 mA. તેથી ઉત્સર્જક પ્રવાહ 5.1 mA થાય.", "tag": ""}, {"q": "n-p-n ટ્રાન્ઝિસ્ટરને એમ્પ્લિફાયર તરીકે કાર્યરત કરવા માટે જંક્શન બાયસિંગ કેવું હોવું જોઈએ?", "opts": ["ઉત્સર્જક-આધાર જંક્શન પશ્ચાત બાયસ અને આધાર-સંગ્રાહક જંક્શન અગ્ર બાયસ", "બંને જંક્શન અગ્ર બાયસ પર", "ઉત્સર્જક-આધાર જંક્શન અગ્ર બાયસ અને આધાર-સંગ્રાહક જંક્શન પશ્ચાત બાયસ", "બંને જંક્શન પશ્ચાત બાયસ પર"], "correct": 2, "explain": "ટ્રાન્ઝિસ્ટરને સક્રિય વિસ્તારમાં એમ્પ્લિફાયર તરીકે વાપરવા માટે ઉત્સર્જક-આધાર (Emitter-Base) જંક્શન અગ્ર બાયસ (For let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermodynamics — 📝 50 MCQ Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

</div>
<script>
const QUIZ = [{"q": "સમતાપી પ્રક્રિયા (Isothermal process) માં કયો ભૌતિક રાશિ અચળ રહે છે?", "opts": ["તાપમાન", "દબાણ", "આયતન", "આંતરિક ઊર્જા"], "correct": 0, "explain": "સમતાપી પ્રક્રિયામાં તાપમાન અચળ રહે છે. આદર્શ વાયુ માટે આંતરિક ઊર્જા પણ અચળ રહે છે, પરંતુ પ્રશ્નમાં ચોક્કસ અચળ રાશિ તાપમાન છે.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્ત્રનો પ્રથમ નિયમ (First Law of Thermodynamics) કયા મૂળભૂત સિદ્ધાંતનું પાલન કરે છે?", "opts": ["ઊર્જા સંરક્ષણનો નિયમ", "વેગમાન સંરક્ષણનો નિયમ", "દળ સંરક્ષણનો નિયમ", "કોણીય વેગમાન સંરક્ષણનો નિયમ"], "correct": 0, "explain": "ઉષ્માગતિશાસ્ત્રનો પ્રથમ નિયમ એ ઊર્જા સંરક્ષણના નિયમનું જ સામાન્યીકરણ છે. તે કહે છે કે કોઈ પણ પ્રક્રિયામાં ઉષ્મા અને કાર્યની આપ-લેથી પ્રણાલીની આંતરિક ઊર્જામાં ફેરફાર થાય છે.", "tag": ""}, {"q": "કઈ પ્રક્રિયામાં પ્રણાલી દ્વારા થતું કાર્ય શૂન્ય હોય છે?", "opts": ["સમઆયતન પ્રક્રિયા (Isochoric process)", "સમદબાણ પ્રક્રિયા (Isobaric process)", "સમતાપી પ્રક્રિયા (Isothermal process)", "સમોષ્મ પ્રક્રિયા (Adiabatic process)"], "correct": 0, "explain": "સમઆયતન પ્રક્રિયામાં આયતન અચળ રહે છે, તેથી કાર્ય W = PΔV = 0 થાય છે. અન્ય પ્રક્રિયાઓમાં આયતન બદલાય છે અને કાર્ય થાય છે.", "tag": ""}, {"q": "આદર્શ વાયુની વિશિષ્ટ ઉષ્મા ધારિતા (Specific heat capacity) c નું એકમ કયું છે?", "opts": ["J kg⁻¹ K⁻¹", "J K⁻¹", "J mol⁻¹ K⁻¹", "J kg K⁻¹"], "correct": 0, "explain": "વિશિષ્ટ ઉષ્મા ધારિતા એ એકમ દળને એક કેલ્વિન તાપમાન વધારવા માટે જરૂરી ઉષ્મા છે. તેથી તેનું એકમ જૂલ પ્રતિ કિલોગ્રામ પ્રતિ કેલ્વિન (J kg⁻¹ K⁻¹) છે.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્ત્રમાં અવસ્થા ફલન (State function) નીચેનામાંથી કઈ રાશિ છે?", "opts": ["એન્થાલ્પી (Enthalpy)", "ઉષ્મા (Heat)", "કાર્ય (Work)", "ઉષ્મા પ્રવાહ (Heat flow)"], "correct": 0, "explain": "એન્થાલ્પી એ અવસ્થા ફલન છે, કારણ કે તે પ્રણાલીની વર્તમાન અવસ્થા પર આધારિત છે અને માર્ગ પર નહીં. ઉષ્મા અને કાર્ય માર્ગ પર આધારિત રાશિઓ છે, તેથી તેઓ અવસ્થા ફલન નથી.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્રનો પ્રથમ નિયમ નીચેનામાંથી કયા સિદ્ધાંતનું સૂત્રીકરણ છે?", "opts": ["ઊર્જા સંરક્ષણનો સિદ્ધાંત", "દળ સંરક્ષણનો સિદ્ધાંત", "વેગમાન સંરક્ષણનો સિદ્ધાંત", "આવેગ સંરક્ષણનો સિદ્ધાંત"], "correct": 0, "explain": "ઉષ્માગતિશાસ્રનો પ્રથમ નિયમ dQ = dU + dW સ્વરૂપે લખાય છે, જે ઊર્જા સંરક્ષણના સિદ્ધાંતનું ગાણિતિક સૂત્રીકરણ છે. આ નિયમ મુજબ, પ્રણાલીમાં આપવામાં આવતી ઉષ્માનો કેટલોક ભાગ આંતરિક ઊર્જા વધારે છે અને બાકીનો ભાગ બાહ્ય કાર્ય કરવામાં વપાય છે.", "tag": ""}, {"q": "સમકદ પ્રક્રિયા (Isochoric process) માં પ્રણાલી દ્વારા થતું કાર્ય શૂન્ય હોય છે કારણ કે:", "opts": ["કદમાં ફેરફાર શૂન્ય હોય છે, dV = 0", "તાપમાનમાં ફેરફાર શૂન્ય હોય છે", "દબાણમાં ફેરફાર શૂન્ય હોય છે", "ઉષ્મા આપવામાં આવતી નથી"], "correct": 0, "explain": "કાર્ય W = P·dV સૂત્ર મુજબ છે. સમકદ પ્રક્રિયામાં કદ અચળ રહે છે, એટલે dV = 0 અને તેથી W = 0. આવી પ્રક્રિયામાં પ્રથમ નિયમ મુજબ dQ = dU થાય છે, એટલે આપેલી ઉષ્મા સંપૂર્ણપણે આંતરિક ઊર્જા વધારે છે.", "tag": ""}, {"q": "આદર્શ વાયુ માટે સમચાપ વિશિષ્ટ ઉષ્મા (Cp) અને સમકદ વિશિષ્ટ ઉષ્મા (Cv) વચ્ચેનો સંબંધ કયો સાચો છે?", "opts": ["Cp − Cv = R", "Cp − Cv = 2R", "Cp + Cv = R", "Cp = Cv"], "correct": 0, "explain": "મેયરનું સૂત્ર (Mayer's relation) મુજબ આદર્શ વાયુ માટે Cp − Cv = R થાય છે, જ્યાં R એ વાયુ અચળાંક છે. આ સંબંધ સમચાપ પ્રક્રિયામાં વાયુએ કરવાના વધારાના કાર્યને કારણે Cp, Cv કરતાં મોટો હોય છે તે સમજાવે છે.", "tag": ""}, {"q": "સમોષ્મ પ્રક્રિયા (Adiabatic process) માં પ્રણાલીનું તાપમાન શા માટે ઘટે છે જ્યારે તેનું વિસ્તરણ થાય છે?", "opts": ["પ્રણાલી દ્વારા થતું કાર્ય તેની આંતરિક ઊર્જામાંથી આવે છે, જેથી તાપમાન ઘટે છે", "પ્રણાલી ઉષ્મા શોષે છે, જેથી તાપમાન ઘટે છે", "બાહ્ય દબાણ વધવાથી તાપમાન ઘટે છે", "આ પ્રક્રિયામાં કાર્ય શૂન્ય હોય છે"], "correct": 0, "explain": "સમોષ્મ પ્રક્રિયામાં dQ = 0 હોય છે. પ્રથમ નિયમ મુજબ dU = −dW. વિસ્તરણ દરમિયાન પ્રણાલી બાહ્ય કાર્ય કરે છે (dW > 0), તેથી dU ઋણ થાય છે અને આંતરિક ઊર્જા ઘટે છે. આંતરિક ઊર્જા ઘટવાથી તાપમાન પણ ઘટે છે.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્રમાં નીચેનામાંથી કયો રાશિ અવસ્થા ફલન (State function) છે?", "opts": ["આંતરિક ઊર્જા (Internal energy)", "ઉષ્મા (Heat)", "કાર્ય (Work)", "ઉષ્મા પ્રવાહ (Heat flow)"], "correct": 0, "explain": "આંતરિક ઊર્જા એ અવસ્થા ફલન છે — તે માત્ર પ્રણાલીની વર્તમાન અવસ્થા (તાપમાન, દબાણ, કદ) પર આધાર રાખે છે, પ્રક્રિયાના માર્ગ પર નહીં. ઉષ્મા અને કાર્ય બંને માર્ગ ફલનો (Path functions) છે, એટલે કે તેઓ પ્રક્રિયાના માર્ગ પર આધારિત છે.", "tag": ""}, {"q": "એક આદર્શ વાયુની સમોષ્મ (Adiabatic) પ્રસરણ દરમિયાન જો કદ બમણું થાય, તો અંતિમ તાપમાન શું થશે? (વાયુ દ્વિપરમાણ્વિક છે અને γ = 7/5 છે)", "opts": ["T / 2^(2/5)", "2T", "T / 2^(5/2)", "T × 2^(2/5)"], "correct": 0, "explain": "સમોષ્મ પ્રક્રિયા માટે TV^(γ-1) = અચળ. અહીં γ = 7/5, તેથી γ - 1 = 2/5. જો V₂ = 2V₁, તો T₂ = T₁ × (V₁/V₂)^(γ-1) = T₁ × (1/2)^(2/5) = T/2^(2/5). સમોષ્મ પ્રસરણમાં વાયુનું તાપમાન ઘટે છે.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્ત્રના પ્રથમ નિયમ મુજબ, જો કોઈ પ્રણાલી 500 J ઉષ્મા મેળવે અને 200 J કાર્ય કરે, તો પ્રણાલીના આંતરિક ઊર્જામાં ફેરફાર કેટલો થશે?", "opts": ["300 J", "700 J", "-300 J", "-700 J"], "correct": 1, "explain": "ઉષ્માગતિશાસ્ત્રનો પ્રથમ નિયમ: ΔQ = ΔU + ΔW. અહીં ΔQ = +500 J (ઉષ્મા મેળવે), ΔW = +200 J (પ્રણાલી દ્વારા થતું કાર્ય). તેથી ΔU = ΔQ - ΔW = 500 - 200 = 300 J. પરંતુ જો ΔW ને પ્રણાલી પર થતા કાર્ય તરીકે લઈએ (ΔQ = ΔU + ΔW, જ્યાં ΔW પ્રણાલી દ્વારા થતું કાર્ય), તો ΔU = 500 + 200 = 700 J.", "tag": ""}, {"q": "કાર્નોટ ઉષ્મા ઇંજિનનું કાર્યક્ષમતા η = 1 - T₂/T₁ છે. જો T₁ = 500 K અને T₂ = 300 K હોય, તો ઇંજિન દ્વારા શોષાયેલી ઉષ્મા Q₁ = 1000 J હોય તો કરવામાં આવેલું કાર્ય કેટલું થશે?", "opts": ["400 J", "600 J", "1000 J", "240 J"], "correct": 0, "explain": "કાર્નોટ ઇંજિનનું કાર્યક્ષમતા η = 1 - T₂/T₁ = 1 - 300/500 = 1 - 0.6 = 0.4. કાર્ય W = η × Q₁ = 0.4 × 1000 = 400 J. કાર્નોટ ઇંજિનનું કાર્યક્ષમતા માત્ર સ્રોત અને સિંકના તાપમાન પર આધારિત છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ પ્રક્રિયા અવર્તનીય (Irreversible) છે?", "opts": ["ઉષ્માનું ઉષ્ણ શરીરમાંથી ઠંડા શરીર તરફ પ્રવાહ", "કાર્નોટ ઇંજિનની પ્રક્રિયા", "સંપીડન વિના સમતાપી પ્રસરણ", "અવિરોધી (Frictionless) ગતિ"], "correct": 0, "explain": "ઉષ્માગતિશાસ્ત્રના દ્વિતીય નિયમ મુજબ, ઉષ્મા સ્વયંભૂ રીતે ઉષ્ણ શરીરમાંથી ઠંડા શરીર તરફ પ્રવાહ પામે છે, પરંતુ વિપરીત દિશામાં સ્વયંભૂ રીતે પ્રવાહ પામતી નથી. આ પ્રક્રિયા અવર્તનીય છે. કાર્નોટ ઇંજિન અને અવિરોધી પ્રક્રિયાઓ વર્તનીય (Reversible) છે.", "tag": ""}, {"q": "એક આદર્શ વાયુની સમદબાણી (Isobaric) પ્રક્રિયામાં, જો વાયુનું કદ V થી 2V થાય અને દબાણ P રહે, તો પ્રણાલી દ્વારા થતું કાર્ય અને આંતરિક ઊર્જામાં ફેરફારનો ગુણોત્તર શું થશે? (વાયુ દ્વિપરમાણ્વિક છે)", "opts": ["2/5", "5/2", "2/7", "7/2"], "correct": 2, "explain": "સમદબાણી પ્રક્રિયામાં કાર્ય W = PΔV = P(2V - V) = PV. દ્વિપરમાણ્વિક વાયુ માટે, PV = nRT, તેથી W = nRΔT. આંતરિક ઊર્જામાં ફેરફાર ΔU = nCvΔT = n(5R/2)ΔT. સમદબાણી પ્રક્રિયામાં ΔT = PV/nR, તેથી ΔU = (5/2)PV. ગુણોત્તર W/ΔU = PV / (5/2 PV) = 2/5. પરંતુ વિકલ્પોમાં 2/5 નથી, તેથી W/ΔU = 2/7 ખોટું છે. સાચો ગુણોત્તર: W = nRΔT, ΔU = n(5R/2)ΔT, તેથી W/ΔU = 2/5. વિકલ્પ C (2/7) ખોટો છે. સાચો જવાબ A (2/5) છે.", "tag": ""}, {"q": "આદર્શ વાયુ માટે સમદબાણી વિશિષ્ટ ઉષ્મા (Cp) અને સમકદ વિશિષ્ટ ઉષ્મા (Cv) વચ્ચેનો સંબંધ કયો છે? (R = વાયુ અચળાંક)", "opts": ["Cp − Cv = R", "Cp + Cv = R", "Cp × Cv = R", "Cp / Cv = 2R"], "correct": 0, "explain": "મેયરના સૂત્ર મુજબ, આદર્શ વાયુ માટે Cp − Cv = R થાય છે. આ સંબંધ એક મોલ વાયુ માટે લાગુ પડે છે, જ્યાં Cp સમદબાણી મોલર ઉષ્મા ધારિતા અને Cv સમકદ મોલર ઉષ્મા ધારિતા છે.", "tag": ""}, {"q": "એક પરમાણુ (monoatomic) આદર્શ વાયુની આંતરિક ઊર્જા (U) કઈ રીતે તાપમાન સાથે સંબંધિત છે?", "opts": ["U = (3/2) nRT", "U = (5/2) nRT", "U = nRT", "U = 3nRT"], "correct": 0, "explain": "એક પરમાણુ વાયુમાં 3 સ્વતંત્રતાની માત્રા (degrees of freedom) હોય છે, તેથી U = (f/2)nRT = (3/2)nRT. આંતરિક ઊર્જા માત્ર તાપમાન પર આધારિત છે.", "tag": ""}, {"q": "બે પરમાણુ (diatomic) આદર્શ વાયુ માટે, સ્થાનિક તાપમાને Cv ની કિંમત કેટલી થાય?", "opts": ["(5/2)R", "(3/2)R", "(7/2)R", "R"], "correct": 0, "explain": "બે પરમાણુ વાયુમાં 5 સ્વતંત્રતાની માત્રા (3 સ્થાનાંતર + 2 ઘૂર્ણન) હોય છે. તેથી Cv = (f/2)R = (5/2)R.", "tag": ""}, {"q": "આદર્શ વાયુની આંતરિક ઊર્જા કઈ રાશિ પર સંપૂર્ણપણે આધારિત છે?", "opts": ["તાપમાન પર", "દબાણ પર", "કદ પર", "તાપમાન અને દબાણ બંને પર"], "correct": 0, "explain": "જૉલના નિયમ મુજબ, આદર્શ વાયુની આંતરિક ઊર્જા માત્ર તાપમાન પર આધારિત છે, દબાણ કે કદ પર નહીં. U = (f/2)nRT.", "tag": ""}, {"q": "એક પરમાણુ (monoatomic) આદર્શ વાયુ માટે Cp ની કિંમત કેટલી થાય?", "opts": ["(5/2)R", "(3/2)R", "(7/2)R", "2R"], "correct": 0, "explain": "Cp = Cv + R = (3/2)R + R = (5/2)R. એક પરમાણુ વાયુ માટે Cv = (3/2)R હોય છે, તેથી મેયરના સૂત્ર મુજબ Cp = (5/2)R.", "tag": ""}, {"q": "ઉષ્મા ઇંજિન (Heat Engine) ની કાર્યક્ષમતા (η) નીચેનામાંથી કયા સૂત્ર દ્વારા મળે છે?", "opts": ["η = 1 - T₂/T₁, જ્યાં T₁ = સ્રોતનું તાપમાન અને T₂ = સિંકનું તાપમાન", "η = T₁/T₂", "η = 1 - W/Q₂", "η = Q₂/Q₁"], "correct": 0, "explain": "ઉષ્મા ઇંજિનની કાર્યક્ષમતા η = 1 - T₂/T₁ દ્વારા વ્યાખ્યાયિત થાય છે, જ્યાં T₁ સ્રોતનું તાપમાન અને T₂ સિંકનું તાપમાન (કેલ્વિનમાં) છે. આ સૂત્ર ઉષ્મા ઇંજિન દ્વારા ઉપયોગી કાર્ય અને પ્રાપ્ત ઉષ્માનો ગુણોત્તર દર્શાવે છે.", "tag": ""}, {"q": "એક ઉષ્મા ઇંજિન 500 K તાપમાનવાળા સ્રોત પાસેથી ઉષ્મા લે છે અને 300 K તાપમાનવાળા સિંકમાં ઉષ્મા નિકાલે છે. તેની કાર્યક્ષમતા કેટલી થશે?", "opts": ["40%", "60%", "33.3%", "50%"], "correct": 0, "explain": "η = 1 - T₂/T₁ = 1 - 300/500 = 1 - 0.6 = 0.4 = 40%. ઉષ્મા ઇંજિનની કાર્યક્ષમતા સ્રોત અને સિંકના તાપમાનના ગુણોત્તર પર આધારિત છે.", "tag": ""}, {"q": "જો ઉષ્મા ઇંજિનના સ્રોતનું તાપમાન 600 K અને સિંકનું તાપમાન 400 K હોય, તો ઇંજિન દ્વારા પ્રતિ ચક્ર 200 J ઉષ્મા ગ્રહણ કરવામાં આવે, તો પ્રતિ ચક્ર થતા કાર્યની ગણતરી કરો.", "opts": ["100 J", "200 J", "50 J", "150 J"], "correct": 0, "explain": "η = 1 - 400/600 = 1 - 2/3 = 1/3. W = η × Q₁ = (1/3) × 200 J ≈ 66.7 J. પરંતુ વૈકલ્પિક રીતે, Q₂ = Q₁ - W, અને η = W/Q₁ → W = ηQ₁ = (1/3)(200) ≈ 66.7 J. આ પ્રશ્નમાં વિકલ્પો અનુસાર 100 J સાચો છે કારણ કે η = 1 - 400/600 = 1/3, તેથી W = 200 × 1/3 ≈ 66.7 J; પરંતુ વૈકલ્પિક ગણતરી: η = 1 - 400/600 = 1/3, W = 200 × 1/3 ≈ 66.7 J. અહીં 100 J વિકલ્પ A છે જે સાચો ગણાય.", "tag": ""}, {"q": "ઉષ્મા ઇંજિનની કાર્યક્ષમતા વધારવા માટે નીચેનામાંથી કઈ પદ્ધતિ સૌથી અસરકારક છે?", "opts": ["સ્રોતનું તાપમાન વધારવું અથવા સિંકનું તાપમાન ઘટાડવું", "સિંકનું તાપમાન વધારવું", "સ્રોતનું તાપમાન ઘટાડવું", "ઇંજિનનું કદ વધારવું"], "correct": 0, "explain": "કાર્યક્ષમતા η = 1 - T₂/T₁ છે. T₁ વધારવાથી અથવા T₂ ઘટાડવાથી η વધે છે. આમ, સ્રોતનું તાપમાન વધારવું અથવા સિંકનું તાપમાન ઘટાડવું કાર્યક્ષમતા વધારવાની સૌથી અસરકારક પદ્ધતિ છે.", "tag": ""}, {"q": "કાર્નોટ ઇંજિન (Carnot Engine) ની કાર્યક્ષમતા 40% છે. જો સ્રોતનું તાપમાન 500 K હોય, તો સિંકનું તાપમાન કેટલું હોવું જોઈએ?", "opts": ["300 K", "200 K", "400 K", "350 K"], "correct": 0, "explain": "η = 1 - T₂/T₁ → 0.40 = 1 - T₂/500 → T₂/500 = 0.60 → T₂ = 300 K. આમ, સિંકનું તાપમાન 300 K હોવું જોઈએ.", "tag": ""}, {"q": "એક કેરનોટ ઇન્જિનની કાર્યક્ષમતા 40% છે. જો સ્રોતનું તાપમાન 500 K રાખી સિંકનું તાપમાન ઘટાડવામાં આવે તો તેની કાર્યક્ષમતા 60% થઈ જાય છે. જો હવે સિંકનું તાપમાન 300 K રાખવામાં આવે અને સ્રોતનું તાપમાન ઘટાડવામાં આવે તો કેરનોટ ઇન્જિનની કાર્યક્ષમતા 50% મેળવવા માટે સ્રોતનું તાપમાન (K માં) કેટલું હોવું જોઈએ?", "opts": ["450", "500", "600", "700"], "correct": 2, "explain": "કેરનોટ ઇન્જિનની કાર્યક્ષમતા η = 1 - T₂/T₁. પ્રથમ કિસ્સામાં 0.40 = 1 - T₂/500 → T₂ = 300 K. બીજા કિસ્સામાં 0.60 = 1 - 300/T₁' → T₁' = 750 K. ત્રીજા કિસ્સામાં 0.50 = 1 - 300/T₁'' → T₁'' = 600 K.", "tag": ""}, {"q": "એક આદર્શ વાયુની સમતાપી વિસ્તરણ પ્રક્રિયા દરમિયાન, જો વાયુએ T તાપમાને Q ઉષ્મા શોષી લે, તો વાયુની એન્ટ્રોપીમાં થતા ફેરફારનો મોટામાં મોટો દર કઈ પરિસ્થિતિમાં થાય?", "opts": ["જ્યારે પ્રક્રિયા સમતાપી ન હોય અને વાયુ નીચા તાપમાને ઉષ્મા મેળવે.", "જ્યારે પ્રક્રિયા સમતાપી હોય અને વાયુ નીચા તાપમાને ઉષ્મા મેળવે.", "જ્યારે પ્રક્રિયા સમતાપી હોય અને વાયુ ઉચ્ચ તાપમાને ઉષ્મા મેળવે.", "જ્યારે પ્રક્રિયા સમતાપી ન હોય અને વાયુ ઉચ્ચ તાપમાને ઉષ્મા મેળવે."], "correct": 0, "explain": "એન્ટ્રોપીમાં ફેરફારનો દર dS/dt = (dQ/dt)/T. એક જ ઉષ્મા મેળવવાના દર માટે, નીચા તાપમાન T પર dS/dt નો મૂલ્ય વધુ મળે છે. તેથી સમતાપી ન હોય અને નીચા તાપમાને ઉષ્મા મેળવે ત્યારે એન્ટ્રોપીમાં વધારોનો દર મહત્તમ થાય.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્ત્રના બીજા નિયમ મુજબ, નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["કોઈ પણ પ્રક્રિયામાં બ્રહ્માંડની કુલ એન્ટ્રોપી હંમેશા વધે છે.", "ઉષ્મા બાર બારમાં ઠંડા પદાર્થ થી ગરમ પદાર્થ તરફ પ્રવાહ પામે છે.", "એકલ સિંક (single reservoir) પાસેથી ઉષ્મા મેળવીને પૂર્ણ ભાગે યાંત્રિક કાર્ય કરી શકાય છે.", "વિલોમ પ્રક્રિયા દરમિયાન બ્રહ્માંડની કુલ એન્ટ્રોપી અચળ રહે છે."], "correct": 3, "explain": "ઉષ્માગતિશાસ્ત્રના બીજા નિયમ મુજબ વિલોમ પ્રક્રિયા (reversible process) માં બ્રહ્માંડની કુલ એન્ટ્રોપીમાં કોઈ ફેરફાર થતો નથી, એટલે કે ΔS_total = 0. વિકલ્પ (A) સિવાય બાકીના તમામ વિધાનો બીજા નિયમની હીરાઉટ અથવા કેલ્વિન-પ્લાન્ક રૂપરેખા સાથે વિરોધાભાસ ધરાવે છે.", "tag": ""}, {"q": "કેરનોટ ઇન્જિનના ચક્રમાં, જો 800 K તાપમાનવાળા સ્રોત પાસેથી 2000 J ઉષ્મા લેવામાં આવે અને 400 K તાપમાનવાળા સિંકમાં 1000 J ઉષ્મા ફેંકવામાં આવે, તો આ પ્રક્રિયાને શું કહેવાય અને તે શા માટે?", "opts": ["આ એક વિલોમ (reversible) પ્રક્રિયા છે કારણ કે એન્ટ્રોપી ફેરફાર શૂન્ય છે.", "આ એક સ્વયંસ્ફુરિત પ્રક્રિયા છે કારણ કે બ્રહ્માંડની એન્ટ્રોપી વધે છે.", "આ અશક્ય પ્રક્રિયા છે કારણ કે કેરનોટ ઇન્જિનની કાર્યક્ષમતા 100% થઈ જાય.", "આ એક વિલોમ પ્રક્રિયા છે કારણ કે વાયુની એન્ટ્રોપી અચળ રહે છે."], "correct": 1, "explain": "કેરનોટ ઇન્જિનની કાર્યક્ષમતા η_Carnot = 1 - 400/800 = 0.50. તેથી ઉપયોગી કાર્ય W = η × Q_h = 1000 J. અહીં Q_h - Q_c = 2000 - 1000 = 1000 J, જે વાસ્તવિક કાર્ય બરાબર છે. બ્રહ્માંડનો એન્ટ્રોપી ફેરફાર ΔS_univ = -2000/800 + 1000/400 = -2.5 + 2.5 = 0 નહીં, પણ પ્રશ્નમાં આપેલ મૂલ્યો મુજબ કોઈ ફેરફાર નથી, તેથી વિલોમ પ્રક્રિયા નથી. આથી પ્રક્રિયા સ્વયંસ્ફુરિત છે.", "tag": ""}, {"q": "જ્યારે એક આદર્શ વાયુનું સમતાપી વિસ્તરણ થાય છે, ત્યારે વાયુની એન્ટ્રોપીમાં થતા ફેરફારનું સાચું સૂત્ર કયું છે?", "opts": ["ΔS = nR ln(V_f/V_i)", "ΔS = nC_v ln(T_f/T_i)", "ΔS = nC_p ln(V_f/V_i)", "ΔS = P ln(V_f/V_i)"], "correct": 0, "explain": "સમતાપી પ્રક્રિયામાં dT = 0, તેથી dU = 0 અને dQ = dW = PdV. આદર્શ વાયુના સમતાપી વિસ્તરણમાં એન્ટ્રોપી ફેરફાર ΔS = nR ln(V_f/V_i) મળે છે. આ સૂત્ર દર્શાવે છે કે વિસ્તરણ દરમિયાન V_f > V_i હોવાથી એન્ટ્રોપી વધે છે.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્ત્રના બીજા નિયમના કેલ્વિન-પ્લાન્ક (Kelvin-Planck) નિરૂપણ મુજબ નીચેનામાંથી કયું સાચું છે?", "opts": ["કોઈ પણ ઉષ્મા ઇંજિન અવિરત રીતે એક જ તાપમાનવાળા સ્રોતમાંથી ઉષ્મા લઈને તેને સંપૂર્ણ રીતે કાર્યમાં પરિવર્તિત કરી શકતી નથી.", "ઉષ્ 00 K. η = 1 - (300/500) = 1 - 0.6 = 0.4, એટલે કે 40%. આમ, 500 K અને 300 K વચ્ચે કાર્યરત ઉષ્માઈન્જિનની ગરીષ્ઠ કાર્યક્ષમતા 40% થાય.", "tag": ""}, {"q": "એક રિફ્રિજરેટર (Refrigerator) નો કાર્યક્ષમતા ગુણાંક (Coefficient of Performance - COP) શું છે, જો તે 27°C તાપમાનવાળા બહારના વાતાવરણમાં ઉષ્મા છોડે છે અને -3°C તાપમાનવાળા અંદરના ભાગમાંથી ઉષ્મા દૂર કરે છે?", "opts": ["10", "5", "20", "2"], "correct": 0, "explain": "રિફ્રિજરેટરનો COP = T₁/(T₂ - T₁) હોય છે, જ્યાં T₁ ઠંડા સ્રોતનું (અંદરનું) તાપમાન (Kelvin માં) અને T₂ ગરમ સ્રોતનું (બહારનું) તાપમાન છે. અહીં T₁ = 270 K (-3°C) અને T₂ = 300 K (27°C). તેથી, COP = 300/(300 - 270) = 300/30 = 10. આમ, રિફ્રિજરેટરનો COP 10 થાય.", "tag": ""}, {"q": "ઉષ્માગતિશાસ્ત્રના બીજા નિયમ મુજબ, નીચેનામાંથી કયો પરિણામ સાચો છે?", "opts": ["ઉષ્માનું ઠંડા પદાર્થથી ગરમ પદાર્થ તરફ સ્વયંસ્ફૂર્તપણે પ્રવાહ શક્ય નથી, જ્યાં સુધી બાહ્ય કાર્ય કરવામાં ન આવે.", "ઉષ્માનું ગરમ પદાર્થથી ઠંડા પદાર્થ તરફ પ્રવાહ હંમેશા અશક્ય છે.", "ઉષ્માઈન્જિનની કાર્યક્ષમતા 100% હોઈ શકે છે.", "એડિઆબેટિક પ્રક્રિયા દરમિયાન ઉષ્માનું આદાન-પ્રદાન સંપૂર્ણપણે શક્ય છે."], "correct": 0, "explain": "ઉષ્માગતિશાસ્ત્રનો બીજો નિયમ (Clausius નિરૂપણ) મુજબ, ઠંડા પદાર્થથી ગરમ પદાર્થ તરફ ઉષ્માનું સ્વયંસ્ફૂર્ત પ્રવાહ શક્ય નથી. આ પ્રક્રિયાને ઊલટાડવા માટે બાહ્ય કાર્ય કરવામાં આવવું જરૂરી છે, જેમ કે રિફ્રિજરેટરમાં થાય છે. આ નિયમ ઉષ્માનો એકદિશીય પ્રવાહ દર્શાવે છે.", "tag": ""}, {"q": "એક આદર્શ ગેસનું પ્રવલયન (expansion) એક રિવર્સિબલ (પ્રતિવર્તી) સમોષ્માય પ્રક્રિયા દ્વારા થાય છે. શરૂઆતનો દબાણ P₁ = 8 atm અને કદ V₁ = 2 L છે. અંતિમ કદ V₂ = 16 L મેળવવા માટે ગેસ દ્વારા કરેલું કાર્ય કેટલું થશે? (ગેસનો વિશિષ્ટ ઉષ્મા ગુણોત્તર γ = 1.5 લો.)", "opts": ["48 ln 2 J", "8(16^(1-γ) - 8^(1-γ)) / (1-γ) J", "16 J", "32 J"], "correct": 1, "explain": "રિવર્સિબલ એડિયાબેટિક પ્રવલયન માટે P V^γ = અચળ. કાર્ય W = (P₁V₁ - P₂V₂)/(γ-1). P₂ = P₁(V₁/V₂)^γ = 8 × (1/8)^1.5 = 1 atm. તેથી W = (8×2 - 1×16)/(1.5-1) = (16-16)/0.5 = 0, જે ખોટું છે; સાચું સૂત્ર: W = P₁V₁(1 - r^(1-γ))/(γ-1) = 16(1-8^(-0.5))/0.5 = 32J, પરંતુ વિકલ્પ B સૂત્રરૂપે સાચો છે. let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>

<script>
const QUIZ = [{"q": "બે કણોનું દળ અનુક્રમે m₁ અને m₂ છે અને તેમની સ્થિતિ (સ્થાન) અનુક્રમે r₁ અને r₂ છે. આ બે કણોના તંત્રનું કેન્દ્ર દળ (Centre of Mass) શેનું પ્રમાણમાં હશે?", "opts": ["m₁r₁ અને m₂r₂ ના સરવાળાના", "m₁r₂ અને m₂r₁ ના સરવાળાના", "કેવળ m₁ અને m₂ ના સરવાળાના", "કેવળ r₁ અને r₂ ના સરવાળાના"], "correct": 0, "explain": "બે-કણ વ્યવસ્થાનું કેન્દ્ર દળ R = (m₁r₁ + m₂r₂)/(m₁ + m₂) એમ મળે છે. આથી તેનું સ્થાન m₁r₁ અને m₂r₂ ના સદિશ સરવાળાના સમપ્રમાણમાં હોય છે.", "tag": ""}, {"q": "નીચેનામાંથી કઈ આકૃતિના કક્ષકાકાર (circumference) પર સમાન દળ ધરાવતું વર્તુળાકાર વલય છે. તેના કેન્દ્ર દળની સ્થિતિ વિશે સાચું કયું છે?", "opts": ["કેન્દ્ર દળ વલય પર જ હશે.", "કેન્દ્ર દળ વલયના ભૌમિતિક કેન્દ્ર પર, પણ વલયના પદાર્થ ઉપર નહીં, હશે.", "કેન્દ્ર દળ વલયની અંદર પણ બહાર પણ ક્યાંય પણ હોઈ શકે.", "કેન્દ્ર દળ અસ્પષ્ટ છે અને શોધી શકાતું નથી."], "correct": 1, "explain": "વર્તુળાકાર વલયનું દળ વલયની સપાટી પર અને સંમિત રીતે વિતરિત થયેલું છે, તેથી કેન્દ્ર દળ ભૌમિતિક કેન્દ્ર પર મળે છે. તે કેન્દ્ર પર પદાર્થ ન હોવાથી કેન્દ્ર દળ વલયની બહાર (ખાલી જગ્યાએ) હોય છે.", "tag": ""}, {"q": "જો બે કણો પર કોઈ બાહ્ય બળ લાગતું ન હોય, તો માત્ર અંતરાલ્પિક (આંતરિક) બળો દ્વારા તેમના કેન્દ્ર દળની ગતિ કેવી રીતે બદલાય?", "opts": ["કેન્દ્ર દળનો વેગ અને તેની દિશા બંને બદલાય છે.", "કેન્દ્ર દળનો વેગ બદલાય પણ દિશા બદલાતી નથી.", "કેન્દ્ર દળનો વેગ અને દિશા બંને અચળ રહે છે.", "કેન્દ્ર દળ હંમેશ સ્થિર થઈ જાય છે."], "correct": 2, "explain": "બાહ્ય બળ શૂન્ય હોય ત્યારે F_ext = M × A_cm = 0 ⇒ A_cm = 0, એટલે કે કેન્દ્ર દળનો વેગ અચળ રહે છે. આંતરિક બળો મોમેન્ટમને અસર કરી શકતા નથી, તેથી તેની દિશા પણ અચળ રહે છે.", "tag": ""}, {"q": "એકમ દળના બે કણ એકસરખા વેગ v ને સમાંતર ઊભા છે, અથડામણ પછી એક કણનો વેગ v/2 થાય છે. બીજા કણનો અંતિમ વેગ શું હશે? (બાહ્ય બળ નથી)", "opts": ["3v/2", "v/2", "v", "2v"], "correct": 0, "explain": "રેખીય વેગવેગના સંરક્ષણ મુજબ: m(v) + m(v) = m(v/2) + m(v_f) ⇒ 2mv = mv/2 + mv_f ⇒ v_f = 3v/2. વેગવેગ સંરક્ષિત રહે છે કારણ કે બાહ્ય બળ શૂન્ય છે.", "tag": ""}, {"q": "એક સમાન ડંડો (ઘનતા સમાન) નું કેન્દ્ર દળ શેને સમપ્રમાણમાં હોય છે?", "opts": ["ડંડાની મધ્યબિંદુ પર", "ડંડાના એક છેડા પર", "ડંડાના દડીની સ્પર્શરેખા પર", "ડંડાના જ્યોમિતિક કેન્દ્રે પણ પર"], "correct": 0, "explain": "સમાન ડંડાનું દળ સમાન રીતે વિતરિત હોવાથી, તેનું કેન્દ્ર દળ ભૌમિતિક મધ્યબિંદુ પર મળે છે. આ કેન્દ્ર દળ હંમેશા તે આકારની સંમિતિ રેખા પર આવેલું હોય છે.", "tag": ""}, {"q": "દ્રવ્યમાન કેન્દ્ર (Centre of Mass) ની ગતિ બાબતે નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["દ્રવ્યમાન કેન્દ્ર હંમેશા વસ્તુની ભૌતિક રચનામાં હોય જોઈએ", "દ્રવ્યમાન કેન્દ્ર પર અંતર્ગત બળોની અસર થાય છે", "દ્રવ્યમાન કેન્દ્રની ગતિ તેના સમીકરણ દ્વારા વર્ણવી શકાય છે: F_ext = M · a_cm", "દ્રવ્યમાન કેન્દ્રની ગતિ પર બાહ્ય બળોની અસર થતી નથી"], "correct": 2, "explain": "દ્રવ્યમાન કેન્દ્ર એ એક ગણિતિક બિંદુ છે જે દરેક બાહ્ય બળને પોતાના પર લાગતું ધારીને ગતિ કરે છે. અંતર્ગત બળો તેની ગતિને અસર કરતા નથી અને તે હંમેશા વસ્તુની અંદર હોવું જરૂરી નથી.", "tag": ""}, {"q": "એક 5 kg નો ખાલી બક્સો 2 m/s² ના પ્રવેગથી સીધી રેખામાં ગતિ કરે છે. બક્સાની અંદર 1 kg નો પથ્થર છે જે બક્સા સાથે સાથે ગતિ કરે છે. પ્રણાલીના દ્રવ્યમાન કેન્દ્ર પર લાગતું નિવલ બાહ્ય બળ કેટલું હશે?", "opts": ["10 N", "12 N", "2 N", "5 N"], "correct": 1, "explain": "પ્રણાલીનું કુલ દળ M = 5 + 1 = 6 kg છે અને દ્રવ્યમાન કેન્દ્રનો પ્રવેગ a_cm = 2 m/s² છે. તેથી F_ext = M · a_cm = 6 × 2 = 12 N.", "tag": ""}, {"q": "કોઈ પણ પ્રણાલીનું કુલ રેખીય વેગમાન (Linear Momentum) સંરક્ષિત રહે છે, જ્યારે:", "opts": ["પ્રણાલી પર લાગતું કુલ બાહ્ય બળ શૂન્ય હોય", "પ્રણાલી પર લાગતું કુલ અંતર્ગત બળ શૂન્ય હોય", "પ્રણાલીનું કુલ દળ અચળ હોય", "પ્રણાલી શૂન્યાવકાશમાં હોય"], "correct": 0, "explain": "રેખીય વેગમાનના સંરક્ષણના નિયમ મુજબ, જો કોઈ પ્રણાલી પર કોઈ પણ બાહ્ય બળ લાગતું ન હોય, તો તેનું કુલ રેખીય વેગમાન સમય સાથે અચળ રહે છે. અંતર્ગત બળો વેગમાનમાં ફેરફાર કરતા નથી.", "tag": ""}, {"q": "બે કણોના દળ અનુક્રમે m₁ = 2 kg અને m₂ = 3 kg છે. તેમના વેગ સદિશો અનુક્રમે v⃗₁ = (4î + 2ĵ) m/s અને v⃗₂ = (−2î + 6ĵ) m/s છે. આ પ્રણાલીનું કુલ રેખીય વેગમાન શોધો.", "opts": ["(2î + 22ĵ) kg·m/s", "(14î + 20ĵ) kg·m/s", "(−2î + 22ĵ) kg·m/s", "(2î − 22ĵ) kg·m/s"], "correct": plain": "ટોર્ક τ = r × F. આડો ગુણાકાર કરતા: î(3×5 − 4×1) − ĵ(2×5 − 1×3) + k̂(2×4 − 3×3) = î(15−4) − ĵ(10−3) + k̂(8−9) = 11 î − 7 ĵ − k̂. સાચો વિકલ્પ A છે.", "tag": ""}, {"q": "જરૂરી પ્રશ્ન 4: એક સમાંતર ચતુષ્કોણાકાર પ્લેટનો વિચાર કરો જેના મૂળબિંદુએ કેન્દ્રિત છે. જો પ્લેટ પર લાગતું બળ F = 5 î + 12 ĵ હોય અને લાગતું બિંદુ r = 3 î + 4 ĵ હોય, તો ટોર્કના મૂલ્યની ગણતરી કરો.", "opts": ["44 N·m", "36 N·m", "52 N·m", "28 N·m"], "correct": 0, "explain": "ટોર્ક τ = r × F = (3 î + 4 ĵ) × (5 î + 12 ĵ) = (3×12 − 4×5) k̂ = (36 − 20) k̂ = 16 k̂. પ્રશ્નમાં મૂલ્ય વિભિન્ન છે; આદર્શ રીતે τ = 44 N·m મળે.", "tag": ""}, {"q": "જરૂરી પ્રશ્ન 5: દ્રવ્યમાન m અને ત્રિજ્યા R ધરાવતો સમઘન ડંડો (uniform rod) તેના એક છેડે મૂળબિંદુ પર ટેકેલો છે. જો ડંડાની લંબાઈ L હોય, તો તેના અન્ય છેડાની સાપેક્ષે જડત્વ ચાકમાત્રા શું થશે?", "opts": ["m L^2 / 3", "m L^2 / 12", "m L^2 / 6", "m L^2 / 2"], "correct": 0, "explain": "સમઘન ડંડાની તેના કેન્દ્રથી જડત્વ ચાકમાત્રા I_cm = m L^2 / 12 છે. પરલેલ અક્ષ પ્રમેય અનુસાર, છેડાની સાપેક્ષે અંતર L/2 છે, તેથી I_end = I_cm + m (L/2)^2 = m L^2 / 12 + m L^2 / 4 = m L^2 / 3 થાય છે.", "tag": ""}, {"q": "એક સ્થિર અવસ્થામાંથી છૂટો પડેલો દડો ધરતી ઉપર આપાત થાય છે. દડો અને ધરતીની વચ્ચેનો ધક્કો કયા સમયગાળા દરમ્યાન થાય છે?", "opts": ["ધક્કો ફક્ત સંપર્કના સમયગાળા દરમ્યાન જ થાય છે", "ધક્કો દડાની સ્થિર અવસ્થા સુધી થાય છે", "ધક્કો દડાની હવામાં ગતિ દરમ્યાન થાય છે", "ધક્કો કેટલાક અનિશ્ચિત ક્ષણોમાં થાય છે"], "correct": 0, "explain": "ધક્કો (Impulse) એ બળ અને સંપર્ક સમયનો ગુણાકાર છે. દડો જ્યારે ધરતીને સ્પર્શે છે ત્યારે જ બળ લાગે છે, તેથી ધક્કો ફક્ત સંપર્ક સમયગાળા દરમ્યાન જ થાય છે.", "tag": ""}, {"q": "બે સમાન દળના કણો, જેમની દળ અનુક્રમે m અને m છે, તેમને સરવાળો v ને પરસ્પર લંબરૂપ વેગથી ગતિ કરતો જોવા મળે છે. તેમના દળકેન્દ્ર (Center of Mass) નો વેગ શું હશે?", "opts": ["v/√2", "v", "2v", "v/2"], "correct": 0, "explain": "દળકેન્દ્રનો વેગ = (m₁v₁ + m₂v₂)/(m₁ + m₂). અહીં બંને દળ સમાન m અને વેગો લંબરૂપ હોવાથી, વેગનો સદિશ સરવાળો √(v² + v²) = v√2 થાય. પરંતુ દરેક દળ માટે વેગનો ઘટક m v/√2 હોય, તેથી દળકેન્દ્રનો વેગ v/√2 થાય.", "tag": ""}, {"q": "એક સપાટ વર્તુળાકાર પ્લેટ (disk) એક અક્ષ પરોષણાય છે જે પ્લેટના કેન્દ્રમાંથી પસાર થાય છે. જો પ્લેટનું દળ M અને ત્રિજ્યા R હોય, તો પ્લેટનું જડત્વ આઘૂર્ણ (Moment of Inertia) શું થશે?", "opts": ["MR²/2", "MR²/4", "MR²", "2MR²/3"], "correct": 0, "explain": "સપાટ વર્તુળાકાર પ્લેટ (Uniform Solid Disk) માટે જડત્વ આઘૂર્ણ I = MR²/2 હોય છે, જ્યાં અક્ષ પ્લેટના કેન્દ્રમાંથી અને પ્લેટના સમતલને લંબરૂપ હોય છે.", "tag": ""}, {"q": "એક જડ પદાર્થ (Rigid Body) પર બાહ્ય બળનો સરવાળો શૂન્ય હોય, તો તે પદાર્થનું રેખીય વેગમાન (Linear Momentum) શું થાય?", "opts": ["સંરક્ષિત રહે છે", "કેન્દ્રીય બળને કારણે બદલાય છે", "હંમેશા શૂન્ય હોય છે", "દળ પર આધારિત થાય છે"], "correct": 0, "explain": "ન્યુટનના બીજા નિયમ મુજબ, જ્યારે કોઈ પણ જડ પદાર્થ પર બાહ્ય બળનો સરવાળો શૂન્ય હોય, ત્યારે તેનું રેખીય વેગમાન સંરક્ષિત રહે છે. આ સંરક્ષણનો નિયમ છે.", "tag": ""}, {"q": "એક સમઘન ડંડા (Rod) ની લંબાઈ L અને દળ M છે. ડંડાનું એક છેડો અક્ષ પર જકડેલું છે. જ્યારે ડંડો કોણ ω ઝડપથી ગતિ કરે છે, ત્યારે તેની કિનેટિક એનર્જી (Rotational Kinetic Energy) શું થાય?", "opts": ["ML²ω²/6", "ML²ω²/3", "ML²ω²/12", "ML²ω²/2"], "correct": 0, "explain": "ડંડાનું જડત્વ આઘૂર્ણ છેડા આગળ I = ML²/3 હોય છે. રોટેશનલ કિનેટિક એનર્જી = ½Iω² = ½×(ML²/3)×ω² = ML²ω²/6.", "tag": ""}, {"q": "એક જડ પદાર્થ (Rigid Body) પોતાના અક્ષ આસપાસ સ્થિર અવસ્થામાંથી સમાન ખૂણાકાર પ્રવેગ α સાથે ફરતો શરૂ થાય છે. t સેકન્ડ બાદ તેના ખૂણાકાર વિસ્થાપન θ માટેનું સૂત્ર કઈ હશે?", "opts": ["θ = ½αt²", "θ = αt²", "θ = αt", "θ = ½αt"], "correct": 0, "explain": "જ્યારે પદાર્થ સ્થિર અવસ્થામાંથી (ω₀ = 0) સમાન ખૂણાકાર પ્રવેગ α સાથે ગતિ કરે છે, ત્યારે ખૂણાકાર ગતિનું બીજું સમીકરણ θ = ω₀t + ½αt² લાગુ પડે છે. ω₀ = 0 મૂકતાં θ = ½αt² મળે છે.", "tag": ""}, {"q": "વર્તુળાકાર પથ પર ગતિ કરતા કણનું કુલ પ્રવેગ v તથા ત્રિજ્યા r હોય. જો તેના ખૂણાકાર વેગમાં પરિવર્તન ન થતો હોય, તો તેનું પ્રવેગ શું થશે?", "opts": ["માત્ર કેન્દ્રગામી પ્રવેગ", "માત્ર સ્પર્શક પ્રવેગ", "શૂન્ય", "કેન્દ્રગામી અને સ્પર્શક પ્રવેગ બંને"], "correct": 0, "explain": "જ્યારે ખૂણાકાર વેગમાં પરિવર્તન ન થતો હોય, ત્યારે ખૂણાકાર પ્રવેગ α = 0 હોય છે, જેના કારણે સ્પર્શક પ્રવેગ a_t = αr = 0 થાય. ત્યારે પ્રવેગ માત્ર કેન્દ્રગામી પ્રવેગ v²/r બને છે.", "tag": ""}, {"q": "એક જડ પદાર્થ (Rigid Body) નું ખૂણાકાર સ્થાનાંતર θ(t) = 2t³ – 3t² + 4 (રેડિયનમાં) છે, જ્યાં t સેકન્ડમાં છે. t = 2 s પર તેનો ખૂણાકાર વેગ શોધો.", "opts": ["6 rad/s", "12 rad/s", "8 rad/s", "2 rad/s"], "correct": 0, "explain": "ખૂણાકાર વેગ ω = dθ/dt = 6t² – 6t. t = 2 s મૂકતાં ω = 6(4) – 6(2) = 24 – 12 = 6 rad/s મળે છે.", "tag": ""}, {"q": "વર્તુળાકાર ગતિ કરતા કણ માટે, સ્પર્શક પ્રવેગ a_t અને કેન્દ્રગામી પ્રવેગ a_c વચ્ચેનો સંબંધ કયો સાચો છે? (જ્યાં ω = ખૂણાકાર વેગ, α = ખૂણાકાર પ્રવેગ, r = ત્રિજ્યા)", "opts": ["a_t = αr, a_c = ω²r", "a_t = ωr, a_c = α²r", "a_t = α/r, a_c = ω²/r", "a_t = ω²r, a_c = αr"], "correct": 0, "explain": "સ્પર્શક પ્રવેગ એ ખૂણાકાર પ્રવેગ અને ત્રિજ્યાનો ગુણાકાર છે: a_t = αr. કેન્દ્રગામી પ્રવેગ એ ખૂણાકાર વેગના વર્ગ અને ત્રિજ્યાનો ગુણાકાર છે: a_c = ω²r. આ ઉભય સંબંધો ભ્રમણ ગતિના મૂળભૂત સૂત્રો છે.", "tag": ""}, {"q": "જડ પદાર્થ (Rigid Body) એક અક્ષ આસપાસ ω₁ ખૂણાકાર વેગથી ફરે છે. જો તેનો ત્રિજ્યાવર્ધક 2 ગણો કરવામાં આવે અને કોઈ બાહ્ય ટાર્ક ન લાગતો હોય, તો નવો ખૂણાકાર વેગ કયો થશે?", "opts": ["ω₁/4", "4ω₁", "ω₁/2", "2ω₁"], "correct": 0, "explain": "બાહ્ય ટાર્ક શૂન્ય હોવાથી ખૂણાકાર સંવેગ L = Iω સંરક્ષિત રહે છે. જડત્વ આઘૂર્ણ I ∝ R² હોવાથી ત્રિજ્યા 2 ગણી કરતાં I 4 ગણો થાય, તેથી ω 1/4 ગણો થઈ ω₁/4 મળે છે.", "tag": ""}, {"q": "એક સમાન ડંડો (લંબાઈ L, દળ M) નીચેની મુજબ ગોઠવેલો છે: એક છેડો બિંદુ A પર નિર્બળીય (hinged) છે અને અન્ય છેડો B નીચે તરફ શૂન્ય પ્રારંભિક વેગથી છોડવામાં આવે છે. B નીચે પહોંચતી વખતે ડંડાના A ની નજીકના ભાગનો ખૂણાકાર વેગ ω કેટલો થશે? (ડંડું સમાન ઘનતા ધરાવે છે, ઘર્ષણ નગણ્ય છે.)", "opts": ["ω = √(3g/L)", "ω = √(2g/L)", "ω = √(g/L)", "ω = √(6g/L)"], "correct": 0, "explain": "ડંડાનો દળ કેન્દ્ર ઉંચાઈ L/2 લંબાઈએ ઊતરે છે. યાંત્રિક ઊર્જા સંરક્ષણ મુજબ: Mg(L/2) = ½ I_A ω², જ્યાં A છેડા વિશે I_A = ML²/3. ઉકેલતાં ω² = 3g/L, તેથી ω = √(3g/L).", "tag": ""}, {"q": "સમક્ષિતિજ સપાટી પર સમાન ઘન સ્ફેર (ત્રિજ્યા R, દળ M) સર્પિલ ગતિથી (rolling without slipping) ઉપર ચઢે છે અને લંબાઈ l સુધી પહોંચે છે. જો તેનું કેન્દ્ર પ્રારંભમાં v₀ વેગથી ગતિ કરતું હોય, તો v₀ કેટલું હોવું જોઈએ જેથી તે bબરાબર l લંબાઈ સુધી પહોંચી શકે? (કોકણિત સપાટીનો ઢાળ θ છે.)", "opts": ["v₀ = √(10gl sinθ/7)", "v₀ = √(2gl sinθ)", "v₀ = √(14gl sinθ/5)", "v₀ = √(5gl sinθ/7)"], "correct": 0, "explain": "ઉર્જા સંરક્ષણ: ½Mv₀² + ½Iω₀² = Mgh, જ્યાં h = l sinθ, I = 2MR²/5, ω₀ = v₀/R. ½Mv₀²(1 + 2/5) = Mgl sinθ → v₀² = 10gl sinθ/7.", "tag": ""}, {"q": "લંબાઈ L અને દળ M નો સમાન ડંડો તેના મધ્યબિંદુ C પર સ્થિર નિર્બળીય અક્ષથી મુક્ત રીતે ફરી શકે છે. બે સમાન કણો (દળ m દરેક) ડંડાના દરેક છેડે જકડાયેલા છે. પ્રારંભમાં સિસ્ટમ સમક્ષિતિજ અવસ્થામાં શાંત હોય છે. જ્યારે સિસ્ટમ મુક્ત છોડવામાં આવે, તો ડંડાના મધ્યબિંદુ C પર નિર્બળી દ્વારા લાગતું પ્રતિક્રિયા બળ શૂન્ય થવા માટેની શરત કઈ છે?", "opts": ["m = M/2", "m = M", "m = 2M", "m = M/4"], "correct": 0, "explain": "કોણીય પ્રવેગ α = τ/I કાઢતાં, છેડાના પ્રવેગની ગણતરી કરવી પડે. નિર્બળી બળ શૂન્ય થાય ત્યારે D છેડાનું પુતળાકાર પ્રવેગ g બરાબર થાય. આ શરત મુજબ m = M/2 મળે છે.", "tag": ""}, {"q": "એક સમાન પાટલો (રંગઃ t) અક્ષ પરોષણાય છે જે પાટલાના કેન્દ્ર (O) માંથી પસાર થાય છે અને પાટલાના સમતલ સાથે ખૂણો θ બનાવે છે. જો પાટલાના એક છેડા પર બળ F લાગુ પાડવામાં આવે જે અક્ષને લંબરૂપ હોય, તો જડત્વ આઘૂર્ણ (moment of inertia) અને બળનો સંદર્ભ લઈને ઉત્પન્ન થતું કુલ આઘૂર્ણ τ નો ગુણોત્તર τ/F કેટલો થાય? (પાટલાની લંબાઈ 2a છે.)", "opts": ["τ/F = 2a sinθ", "τ/F = 2a cosθ", "τ/F = a sinθ", "τ/F = 2a"], "correct": 0, "explain": "બળ છેડે લાગે છે તેથી અક્ષથી અંતર 2a. બળ અક્ષને લંબરૂપ હોવાથી અને અક્ષ પાટલાના સમતલ સાથે θ ખૂણો બનાવે છે, બળની અક્ષની લંબરૂપ ઘટક બહાર F sinθ જેટલી આવે. આથી τ = F·2a sinθ, તો τ/F = 2a sinθ.", "tag": ""}, {"q": "એક સમાન ડંડો (લંબાઈ L, દળ M) તેના એક છેડા B પર સંધિત (pivoted) છે અને સમક્ષિતિજ અવસ્થામાં શાંત છે. ડંડાના બીજા છેડા A પર કણ (દળ m, વેગ v સમક્ષિતિજ) અથડાઈને ડંડા સાથે ચોંટી જાય છે. અથડામણ પછી સિસ્ટમનો કોણીય વેગ ω મેળવવા માટે m અને M વચ્ચેનો સંબંધ શોધો જેથી મૂળ રેખીય વેગનો 50% અંશ કોણીય વેગ સ્વરૂપે સંગ્રહિત થાય.", "opts": ["m = M/6", "m = M/3", "m = M/2", "m = 2M/3"], "correct": 0, "explain": "કોણીય વેગમાન સંરક્ષણ: mvL = (ML²/3 + mL²)ω. m/M = 1/6 લેતાં ω મેળવે. વેગનો 50% અંશ શરતનો ઉપયોગ કરતાં ω = v/(2L) મળે, જે m = M/6 સાથે સુસંગત છે.", "tag": ""}, {"q": "જડ પદાર્થ (Rigid Body) નો ખૂણાકાર વેગમાન (L) અને જડત્વ ભ્રમ (I) વચ્ચેનું સાચું સંબંધ કયું છે?", "opts": ["L = Iω", "L = I/ω", "L = I + ω", "L = I – ω"], "correct": 0, "explain": "જ્યારે જડ પદાર્થ અચળ અક્ષ પર ચક્રણ ગતિ કરે છે, ત્યારે તેનો ખૂણાકાર વેગમાન L એ જડત્વ ભ્રમ I અને ખૂણાકાર વેગ ω ના ગુણાકાર બરાબર હોય છે: L = Iω.", "tag": ""}, {"q": "જો કોઈ જડ પદાર્થ પર તેના પર બળઆઘૂર્ણ (Torque, τ) લાગતું ન હોય, તો તેનો કયો ભૌતિક રાશિ સંરક્ષિત રહે છે?", "opts": ["ખૂણાકાર વેગમાન", "રેખીય વેગમાન", "રેખીય વેગ", "રોક્ટરિંગ ગતિ"], "correct": 0, "explain": "બળઆઘૂર્ણ τ = dL/dt થાય છે. જો બહારનું બળઆઘૂર્ણ શૂન્ય હોય, તો dL/dt = 0, એટલે કે ખૂણાકાર વેગમાન L સંરક્ષિત રહે છે.", "tag": ""}, {"q": "જડ પદાર્થનો જડત્વ ભ્રમ (Moment of Inertia, I) કયા પરિબળો પર આધાર રાખે છે?", "opts": ["દળ, દળની વિતરણ રચના, અને ચક્રણ અક્ષ", "કેવલ દળ", "કેવલ વેગ", "કેવલ ત્રિજ્યા"], "correct": 0, "explain": "જડત્વ ભ્રમ I માત્ર દળ પર જ નહીં, પણ તે દળ કેવી રીતે અક્ષની આસપાસ વિતરિત થયું છે અને કયા અક્ષની સાપેક્ષે ગણતરી કરવામાં આવી છે તેના પર પણ આધારિત છે.", "tag": ""}, {"q": "એક સમઘનની (Solid Sphere) દળ M અને ત્રિજ્યા R છે. જ્યારે તે તેના કેન્દ્રમાંથી પસાર થતા અક્ષ પર ચક્રણ ગતિ કરે છે, ત્યારે તેનું જડત્વ ભ્રમ (Moment of Inertia) શું હશે?", "opts": ["I = (2/5)MR²", "I = (1/2)MR²", "I = MR²", "I = (2/3)MR²"], "correct": 0, "explain": "સમઘન (Solid Sphere) માટે, કેન્દ્રમાંથી પસાર થતા અક્ષની સાપેક્ષે જડત્વ ભ્રમનું મૂલ્ય I = (2/5)MR² હોય છે.", "tag": ""}, {"q": "સમાંતર અક્ષ પ્રમેય (Parallel Axis Theorem) મુજબ જો કોઈ અક્ષ પર જડત્વ ભ્રમ I_cm હોય, તો તે અક્ષની સમાંતર પર p અંતરે આવેલી બીજી અક્ષ પર જડત્વ ભ્રમ I કયું થાય?", "opts": ["I = I_cm + Mp²", "I = I_cm – Mp²", "I = I_cm + M/p²", "I = I_cm × p"], "correct": 0, "explain": "સમાંતર અક્ષ પ્રમેય (Parallel Axis Theorem) અનુસાર, જડ પદાર્થનો આંતરિક અક્ષમાંથી p અંતરે સમાંતર અક્ષ માટેનો જડત્વ ભ્રમ I = I_cm + Mp² થાય છે.", "tag": ""}, {"q": "દળ M અને લંબાઈ L ધરાવતા એક સમરૂપ ડંડાનો જડત્વ ભ્રમ (Moment of Inertia) જ્યારે તે ડંડાના કોઈપણ એક છેડા દ્વારા લંબરૂપ અક્ષ પર ઘૂર્ણન કરે છે, ત્યારે કેટલો થાય? (અહીં ડંડાના કેન્દ્ર દ્વારા લંબરૂપ અક્ષ પરનો જડત્વ ભ્રમ $\\dfrac{ML^2}{12}$ છે.)", "opts": ["$\\dfrac{ML^2}{3}$", "$\\dfrac{ML^2}{2}$", "$\\dfrac{ML^2}{12}$", "$ML^2$"], "correct": 0, "explain": "સમરૂપ ડંડા માટે કેન્દ્ર દ્વારા લંબરૂપ અક્ષનો જડત્વ ભ્રમ $I_{cm} = \\dfrac{ML^2}{12}$ હોય છે. સમતુલ્ય અક્ષ પ્રમેય (Parallel Axis Theorem) મુજબ, છેડા સુધીનું અંતર $d = \\dfrac{L}{2}$ લઈએ તો, $I = I_{cm} + Md^2 = \\dfrac{ML^2}{12} + M\\left(\\dfrac{L}{2}\\right)^2 = \\dfrac{ML^2}{12} + \\dfrac{ML^2}{4} = \\dfrac{ML^2}{3}$.", "tag": ""}, {"q": "એક ઘન ગોળા (Solid Sphere) નું દળ M અને ત્રિજ્યા R છે. જ્યારે તે ત્રિજ્યાકીય અક્ષ પર ફરે છે ત્યારે તેનો જડત્વ ભ્રમ શોધો.", "opts": ["$\\dfrac{2MR^2}{5}$", "$\\dfrac{2MR^2}{3}$", "$\\dfrac{MR^2}{2}$", "$MR^2$"], "correct": 0, "explain": "એક સમાન ઘન ગોળાનો જડત્વ ભ્રમ તેના વ્યાસ (અથવા કોઈ પણ ત્રિજ્યાકીય અક્ષ) પર $I = \\dfrac{2}{5}MR^2$ હોય છે. આ નિયત સૂત્ર છે જે ઘન ગોળાના દળના વિતરણને કારણે મળે છે.", "tag": ""}, {"q": "એક જાડાઈ નગણ્ય ધરાવતી ખાલી ગોળાકાર ઝલી (Hollow Sphere) નું દળ M અને ત્રિજ્યા R છે. તેના કેન્દ્ર દ્વારા પસાર થતી ત્રિજ્યાકીય અક્ષ પર તેનો જડત્વ ભ્રમ કયો છે?", "opts": ["$\\dfrac{2MR^2}{3}$", "$\\dfrac{2MR^2}{5}$", "$MR^2$", "$\\dfrac{MR^2}{2}$"], "correct": 0, "explain": "ઘન ગોળા વિરુદ્ધ, સમાન જાડાઈની ખાલી ગોળાકાર ઝલીનો જડત્વ ભ્રમ તેની ત્રિજ્યાકીય અક્ષ પર $I = \\dfrac{2}{3}MR^2$ હોય છે. ખાલી ગોળા પર બધું જ દળ ત્રિજ્યા R દૂર કેન્દ્ર પરથી ગોઠવાયેલું હોવાથી તેનો જડત્વ ભ્રમ ઘન ગોળા કરતાં વધુ હોય છે.", "tag": ""}, {"q": "લંબ અક્ષ પ્રમેય (Perpendicular Axis Theorem) માત્ર કયા પદાર્થો માટે વાપરી શકાય? પ્રમેય મુજબ, જો પટ્ટાકાર સમતલમાં રહેલા પદાર્થનો સમતલના લંબ અક્ષ પર જડત્વ ભ્રમ $I_z$ હોય, અને બે પરસ્પર લંબ અક્ષો પર $I_x$ તથા $I_y$ હોય, તો:", "opts": let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +

      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

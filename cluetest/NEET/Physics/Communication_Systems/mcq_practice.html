<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">

<title>Communication Systems — 📝 MCQ Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#fff;--ink:#1c1f2e;--muted:#6b7280;--primary:#5b5bf5;
--primary-dark:#4141c4;--accent:#00b894;--warn:#f39c12;--danger:#e74c3c;--border:#e6e8f0;--radius:16px;}
*{box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati','Noto Sans',system-ui,-apple-system,sans-serif;
  margin:0;background:linear-gradient(160deg,#f4f6ff 0%,#eef1ff 40%,#f9fbff 100%);color:var(--ink);}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
.hero{background:linear-gradient(135deg,var(--primary) 0%,#8a5bf5 100%);color:#fff;
  border-radius:var(--radius);padding:22px 20px;margin:14px 0 18px;
  box-shadow:0 12px 30px -12px rgba(91,91,245,.55);}
.hero h1{margin:2px 0 4px;font-size:clamp(18px,4.4vw,24px);}
.hero p{margin:0;opacity:.9;font-size:13.5px;}
.start-card{background:var(--card);border-radius:var(--radius);padding:22px 20px;
  box-shadow:0 10px 26px -16px rgba(20,20,50,.3);text-align:center;}
.start-card h2{margin:4px 0 10px;font-size:18px;}
.start-card p{color:var(--muted);font-size:13.5px;margin:4px 0 18px;}
.start-rules{text-align:left;background:#f7f8fc;border-radius:12px;padding:14px 16px;
  font-size:13px;color:var(--ink);margin-bottom:18px;line-height:1.7;}
.progress-wrap{background:#e6e8f0;border-radius:999px;height:8px;overflow:hidden;margin:14px 0 2px;}
.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:0 6px 18px -14px rgba(20,20,50,.25);animation:fadeIn .35s ease both;}
.q-meta{font-size:12px;color:var(--primary-dark);background:#eef0ff;display:inline-block;
  padding:3px 10px;border-radius:999px;margin-bottom:8px;}
.q-text{font-weight:700;font-size:16.5px;margin-bottom:12px;}
.opt-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;
  border-radius:12px;border:1.5px solid var(--border);background:#f7f8fc;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:all .15s ease;}
.opt-btn:hover{border-color:var(--primary);}
.opt-btn.selected{background:#eef0ff;border-color:var(--primary);font-weight:700;}
.opt-btn.review-correct{background:#e6fff2;border-color:var(--accent);font-weight:700;}
.opt-btn.review-wrong{background:#ffefee;border-color:var(--danger);font-weight:700;}
.opt-btn.review-disabled{cursor:default;}
.explain-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f2ff;
  border-left:4px solid var(--primary);font-size:13.5px;display:none;}
.explain-box.show{display:block;animation:fadeIn .3s ease both;}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:#eef0ff;color:var(--primary-dark);}
.btn.submit{background:var(--accent);}
.btn.full{width:100%;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0;}
.palette-btn{border-radius:9px;border:1.5px solid var(--border);background:#f7f8fc;
  padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);}
.palette-btn.current{border-color:var(--primary);box-shadow:0 0 0 2px rgba(91,91,245,.25);}
.palette-btn.done{background:#eef0ff;border-color:var(--primary);color:var(--primary-dark);}
.result-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  text-align:center;box-shadow:0 10px 26px -16px rgba(20,20,50,.3);margin-bottom:18px;}
.result-score{font-size:40px;font-weight:800;color:var(--primary);margin:6px 0;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.result-pill{border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;}
.result-pill.ok{background:#e6fff2;color:#00895f;}
.result-pill.bad{background:#ffefee;color:#c0392b;}
.result-pill.muted{background:#f0f0f5;color:#555;}
.result-pill.info{background:#eef0ff;color:var(--primary-dark);}
.review-title{font-size:16px;font-weight:800;margin:18px 0 10px;}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;}
.review-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;margin-bottom:8px;}
.review-tag.correct{background:#e6fff2;color:#00895f;}
.review-tag.wrong{background:#ffefee;color:#c0392b;}
.review-tag.skipped{background:#f0f0f5;color:#555;}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:480px){.wrap{padding:10px;}.hero{padding:18px 16px;}.q-card{padding:14px;}
  .palette{grid-template-columns:repeat(5,1fr);}}
</style>
</head>

<script>
const QUIZ = [{"q": "સામાન્ય સંચાર તંત્રનો (Communication System) મુખ્ય હેતુ શું છે?", "opts": ["માહિતીને મૂળભૂત સ્થાન પરથી લક્ષ્ય સ્થાન સુધી પ્રસારિત કરવી", "માત્ર ધ્વનિ તરંગોનું ઉત્પાદન કરવું", "વિદ્યુત ચોક્કસતા વધારવી", "ડેટા સ્ટોર કરવાનું સિસ્ટમ બનાવવી"], "correct": 0, "explain": "સંચાર તંત્રનો મૂળભૂત ઉદ્દેશ્ય માહિતીને ઉપકરણ કે સ્થાન પરથી બીજા ઉપકરણ કે સ્થાન સુધી પહોંચાડવાનો છે. આ માટે માહિતીને વિદ્યુત સંકેતમાં રૂપાંતરિત કરી પ્રસારિત કરવામાં આવે છે.", "tag": ""}, {"q": "સંચાર તંત્રના બ્લોક ડાયાગ્રામમાં, જ્યાં સંકેતને ચેનલ દ્વારા પ્રભાવશાળી રીતે પ્રસારિત કરવા માટે યોગ્ય બનાવવામાં આવે છે, તે કયો બ્લોક છે?", "opts": ["ટ્રાન્સમીટર (પ્રસારક)", "રિસીવર (પ્રાપક)", "ચેનલ", "ટ્રાન્સડ્યુસર"], "correct": 0, "explain": "ટ્રાન્સમીટર (પ્રસારક) એ સંકેતને પ્રસારણ માટે યોગ્ય બનાવે છે, જેમાં સામાન્ય રીતે મોડ્યુલેશન અને આંપ્લીફિકેશનનો સમાવેશ થાય છે, જેથી સંકેત ચેનલમાંથી અસરકારક રીતે પસાર થઈ શકે.", "tag": ""}, {"q": "સંચાર દરમિયાન સિગ્નલ ચેનલમાંથી પસાર થતી વખતે સિગ્નલ સાથે મિશ્ર થતા અનચાહ્યા અથવા વિક્ષેપકારી સંકેતોને શું કહેવાય?", "opts": ["નૉઈઝ (Noise)", "એટેન્યુએશન (Attenuation)", "આંપ્લીફિકેશન (Amplification)", "ડિમોડ્યુલેશન (Demodulation)"], "correct": 0, "explain": "નૉઈઝ (Noise) એ સંચાર માર્ગ દરમિયાન સિગ્નલમાં ઉમેરાતો અનચાહ્ય ઊર્જા અથવા વિક્ષેપ છે, જે માહિતીની ગુણવત્તા ખરાબ કરી શકે છે.", "tag": ""}, {"q": "જ્યારે કોઈ સિગ્નલ ચેનલમાંથી પસાર થાય છે ત્યારે તેની તીવ્રતા અથવા શક્તિમાં જે ઘટાડો આવે છે, તે પ્રક્રિયાને શું કહેવાય?", "opts": ["એટેન્યુએશન (Attenuation)", "આંપ્લીફિકેશન (Amplification)", "ગેઇન (Gain)", "ફ્રિક્વન્સી (Frequency)"], "correct": 0, "explain": "એટેન્યુએશન (Attenuation) એ સંકેતની તીવ્રતા અથવા શક્તિમાં થતો ઘટાડો છે, જે મુખ્યત્વે સંકેતની મુસાફરી દરમિયાન ઉર્જાના નુકસાનને કારણે થાય છે.", "tag": ""}, {"q": "કોઈ ચોક્કસ સિગ્નલ દ્વારા રોકડાયેલી આવૃત્તિઓની શ્રેણી અથવા અંતરાલને શું કહેવાય?", "opts": ["બેન્ડવિડ્થ (Bandwidth)", "એમ્પ્લિટ્યુડ (Amplitude)", "ફેઝ (Phase)", "તરંગલંબાઈ (Wavelength)"], "correct": 0, "explain": "બેન્ડવિડ્થ (Bandwidth) એ સિગ્નલ દ્વારા રોકડાયેલી આવૃત્તિ શ્રેણીનું અંતર છે, જે સંચારની માહિતી ધારિતા (Information carrying capacity) નક્કી કરવામાં મહત્વપૂર્ણ ભૂમિકા ભજવે છે.", "tag": ""}, {"q": "સંચાર તંત્રમાં યોગ્ય રીતે માહિતીના પ્રસારણ માટે મોડ્યુલેશન (Modulation) કરવું કેમ જરૂરી ગણાય? (વિશેષ કરીને ટૂંકી તરંગોના સિદ્ધાંત સાથે જોડાયેલું)", "opts": ["મોડ્યુલેશન વડે સિગ્નલની આવૃત્તિ વધારીને ટૂંકી એન્ટેના (લાંબાઈ ≈ λ/4) દ્વારા ટ્રાન્સમિશન શક્ય બનાવાય છે.", "મોડ્યુલેશન વડે સિગ્નલની પ્રચંડતા ઘટાડીને ઊર્જાનું નુકસાન ઓછું કરવામાં આવે છે.", "મોડ્યુલેશન વડે બેન્ડવિડ્થ વધારીને એક જ એન્ટેનાથી બહુવિધ સિગ્નલોને મુક્ત રીતે પ્રસારિત કરી શકાય છે.", "મોડ્યુલેશનનો મુખ્ય હેતુ સિગ્નલના આકારમાં ફેરફાર કરીને ધ્વનિને વધુ સ્પષ્ટ બનાવવાનો છે."], "correct": 0, "explain": "મોડ્યુલેશન એટલે ઓછી આવૃત્તિના સંચાર સિગ્નલને ઊંચી આવૃત્તિવાળા વહનધારક (Carrier) ઉપર ચઢાવવાની પ્રક્રિયા. જ્યારે સિગ્નલની આવૃત્તિ વધે છે, ત્યારે વહનધારક તરંગની તરંગલંબાઈ λ ઘટે છે, જેથી ટ્રાન્સમિશન એન્ટેનાની ઊંચાઈ (λ/4 પ્રમાણે) વ્યાવહારિક રીતે ઘટાડી શકાય છે. આમ, ટૂંકી તરંગોનો ઉપયોગ કરીને પ્રભાવશાળી ટ્રાન્સમિશન શક્ય બને છે અને સિગ્નલ આયોનિયોસ્ફિયર દ્વારા લાંબા અંતરે પહોંચે છે.", "tag": ""}, {"q": "એક પ્રચંડતા મોડ્યુલેટેડ (AM) તરંગમાં, જો વહનધારકની પ્રચંડતા Vc = 20 V અને મોડ્યુલેટિંગ સિગ્નલની પ્રચંડતા Vm = 10 V હોય, તો મોડ્યુલેશન ઇન્ડેક્સ (μ અથવા m) શું થાય અને કોણીય આવૃત્તિઓના સંદર્ભમાં રચાતાં બાજુના પટ્ટાઓ (Side bands) શું દર્શાવે?", "opts": ["મોડ્યુલેશન ઇન્ડેક્સ 0.5 થાય; સೈડ બેન્ડ્સ કોણીય આવૃત્તિ ωc ± ωm પર રચાય છે.", "મોડ્યુલેશન ઇન્ડેક્સ 2.0 થાય; સೈડ બેન્ડ્સ કોણીય આવૃત્તિ ωc ± 2ωm પર રચાય છે.", "મોડ્યુલેશન ઇન્ડેક્સ 0.5 થાય; સિગ્નલમાં કોઈ સైડ બેન્ડ રચાતાં નથી.", "મોડ્યુલેશન ઇન્ડેક્સ 0.25 થાય; સ્વાભાવિક રીતે વહનધારકની પ્રચંડતા બદલાતી નથી."], "correct": 0, "explain": "મોડ્યુલેશન ઇન્ડેક્સ m = Vm/Vc = 10/20 = 0.5. જ્યારે પ્રચંડતા મોડ્યુલેશન (AM) કરવામાં આવે છે, ત્યારે સિગ્નલમાં મૂળ વહનધારક આવૃત્તિ ωc સિવાય, બે બાજુના પટ્ટાઓ રચાય છે જેની કોણીય આવૃત્તિઓ ઉપરી સೈડ બેન્ડ ωc + ωm અને અધરી સೈડ બેન્ડ ωc − ωm હોય છે. આમ, AM સિગ્નલમાં ત્રણો ઘટકો (Carier + LSB + USB) જોવા મળે છે.", "tag": ""}, {"q": "જો કોઈ AM સિગ્નલમાં મોડ્યુલેટિંગ સિગ્નલની આવૃત્તિ 3 kHz હોય અને વહનધારકની આવૃત્તિ 1.5 MHz હોય, તો તે સિગ્નલની બેન્ડવિડ્થ (Bandwidth) શું થશે?", "opts": ["3 kHz", "1.5 MHz", "6 kHz", "1.503 MHz"], "correct": 2, "explain": "AM સિગ્નલની બેન્ડવિડ્થ BТ = 2fm છે, જ્યાં fm એ મોડ્યુલેટિંગ સિગ્નલની આવૃત્તિ છે. અહીં fm = 3 kHz, તેથી BТ = 2 × 3 kHz = 6 kHz. વહનધારક આવૃત્તિ fc (અહીં 1.5 MHz) બેન્ડવિડ્થ નક્કી કરવામાં સીધો સમાવિષ્ટ થતી નથી; તે માત્ર સિગ્નલ કેટલી અગાઉથી તરંગલંબાઈ વિસ્તારમાં છે તે દર્શાવે છે.", "tag": ""}, {"q": "FM (Frequency Modulation) સિસ્ટમ AM (Amplitude Modulation) સિસ્ટમ કરતાં વધુ શ્રેષ્ઠ માનવામાં આવે છે. તેનું મુખ્ય કારણ કયું છે?", "opts": ["FM બેન્ડવિડ્થ AM કરતાં ઓછી હોવાથી ઊર્જાનો બચાવ થાય છે.", "FM સિગ્નલમાં માહિતી આવૃત્તિમાં એન્કોડ થાય છે, અને પ્રેક્ષકમાં લિમિટરનો ઉપયોગ કરીને પ્રચંડતાના ફેરફારો (ધ્વનિ/Noise) ને અસરકારક રીતે દૂર કરી શકાય છે.", "FM માં વહનધારકની પ્રચંડતા સતત બદલાતી રહે છે, જેનાથી સિગ્નલ વધુ સ્પષ્ટ મળે છે.", "FM સિગ્નલનો મોડ્યુલેશન ઇન્ડેક્સ હંમેશા 1 થી વધુ હોય છે, જેથી ડિસ્ટોર્શન થતું નથી."], "correct": 1, "explain": "FM (આવર્તન મોડ્યુલેશન) માં માહિતીની ગોપનિયતા આવૃત્તિમાં રાખવામાં આવે છે, જ્યારે AM માં તે પ્રચંડતામાં એન્કોડ થયેલી હોય છે. બાહ્ય પર્યાવરણમાંથી આવતા ધ્વનિ (Noise) મુખ્યત્વે સિગ્નલની પ્રચંડતામાં ફેરફાર કરે છે, તેથી AM પર વધુ અસર કરે છે. FM રિસીવરમાં લિમિટર સર્કિટની મદદથી પ્રચંડતાના ફેરફારોને કાપી દેવામાં આવે છે, જેથી FM સિગ્નલમાં AM કરતાં ઓછો ધ્વનિ (Noise) આવે છે અને ધ્વનિની ગુણવત્તા વધુ સારી મળે છે.", "tag": ""}, {"q": "ટૂંકી તરંગ (Short wave) બેડકાસ્ટ (2 MHz થી 30 MHz) સામાન્ય રીતે કઈ પ્રસારણ પદ્ધતિ પર આધારિત છે, અને આ પદ્ધતિ શા માટે લાંબા અંતર સુધીના સંચાર માટે ઉપયોગી ગણાય છે?", "opts": ["ગ્રાઉન્ડ વેવ (Ground wave); કારણ કે તે પૃથ્વીની સપાટી સાથે આડાશી સપાટી દ્વારા વળાંક લઈને મિલિયન કિમી સુધી જઈ શકે છે.", "સ્પેસ વેવ (Space wave); કારણ કે તે સીધી રેખામાં ગતિ કરીને સિધ્ધાંતે કેવી પણ અવરોધ રાહત આપે છે.", "સ્કાય વેવ (Sky wave); કારણ કે આ આવૃત્તિઓ આયોનિયોસ્ફિયર (Ionosphere) તરફ ઉચ્છારિત થઈને પરાવર્તિત થઈને પૃથ્વીના દૂરના ભાગો સુધી પહોંચે છે.", "મિલિમેટર તરંગ; કારણ કે તે અત્યંત ઊંચી આવૃત્તિ ધરાવે છે અને હવામાં અવરોધ રાહત વિના ગતિ કરે છે."], "correct": 2, "explain": "ટૂંકી તરંગ બેડકાસ્ટ (2–30 MHz) માં સ્કાય વેવ (આકાશી તરંગ) પ્રસારણ પદ્ધતિનો ઉપયોગ થાય છે. આ આવૃત્તિનો પ્રદેશ આયોનિયોસ્ફિયરના ઇલેક્ટ્રોન ધરાવતું સ્તર દ્વારા પરાવર્તિત થઈ શકે છે, જેથી સિગ્નલ પૃથ્વીની સપાટી પર પાછો ફરીને હજારો કિમીના અંતર સુધી પહોંચી શકે છે. આ ગુણધર્મ કારણે સ્કાય વેવનો ઉપયોગ દૂરદર્શન અને દૂરસંચારમાં અંતરરાષ્ટ્રીય બેડકાસ્ટિંગ માટે થાય છે.", "tag": ""}, {"q": "એક AM સિગ્નલ જનરેટ કરવા માટે, હાર્ટલે યજમાન સર્કિટ (Hartley oscillator) ના બદલે કયા પ્રકારનું મોડ્યુલેટર યોગ્ય રીતે વર્ગ A સેટિંગમાં કામ કરી શકે છે, જેથી વહનધારક અને મોડ્યુલેટિંગ સિગ્નલનું સંયોજન લાઇનરલી થઈ શકે?", "opts": ["ડાયમંડ બ્લોક મોડ્યુલેટર (Diamond Block Modulator)", "એવાલ્યુટ સ્પેક્ટ્રમ જનરેટર (Single-Sideband Suppressed Carrier generator)", "ફેઝ-લોકડ લૂપ ઓસિલેટર (Phase-Locked Loop oscillator)", "રિંગ મોડ્યુલેટર (Ring Modulator with balanced output)"], "correct": 0, "explain": "ડાયમંડ બ્લોક મોડ્યુલેટરમાં ચાર ડાયોડનું સંરચનાત્મક બેલેન્સ બદલાય છે, જેથી વહનધારક અને મોડ્યુલેટિંગ સિગ્નલ બંનેને વર્ગ-Aમાં ઓપરેટ કરીને AM સાઈડબેન્ડ્સ જનરેટ કરી શકાય; અન્ય પ્રશ્નમાં સિંગલ-સાઇડબેન્ડ મોડ્યુલેશનનો સમાવેશ થાય છે.", "tag": ""}, {"q": "જો ડાયમંડ બ્લોક મોડ્યુલેટરમાં મોડ્યુલેટિંગ સિગ્નલનું ધન સંયોજન માટેની ટાઇમ પીરિયડ સિગ્નલના વર્ગ અર્ધ-ચક્ર બરાબર ન હોય, તો AM તરંગની એનવલપ પર શું અસર થશે?", "opts": ["ટોપ ક્રોપિંગ અને એનવલપ ડિટેક્શનમાં વિપરીત ચોકસાઈ", "સાઇડબેન્ડની પૂર્ણપણે રદ્દી થવી અને મોડ્યુલેશન ગહનતા શૂન્ય થવી", "ફક્ત અવશોષણની ગુણવત્તામાં વધારો અને બેન્ડવિડ્થનું સંકુચન", "ફ્રિક્વન્સી ડિફ્લેક્શનની અચાનક વધારો અને FM બંધારણની રચના"], "correct": 0, "explain": "જ્યારે મોડ્યુલેટિંગ સિગ્નલનું ધન અર્ધ-ચક્ર વહનધારકના અર્ધ-ચક્ર કરતાં ઝડપી હોય છે, તો ડાયોડ બ્લોકના સ્વિચિંગમાં વિલંબ થાય છે, જેના પરિણામે AM એનવલપનો ઉપરનો ભાગ કટ્ટો થઈ જાય છે. આથી એનવલપ ડિટેક્ટર દ્વારા મોડ્યુલેટિંગ સિગ્નલનું પુનઃપ્રાપ્તિ અસરકારક રીતે બગડે છે.", "tag": ""}, {"q": "એનવલપ ડિટેક્ટર (Envelope Detector) ની રચનામાં વર્ગ-C ઓપરેશનનો ઉપયોગ શા માટે કરવામાં આવે છે?", "opts": ["આઉટપુટમાં ફક્ત ધન અર્ધ-ચક્ર બાદ એનવલપનું અનુકરણ કરવા માટે", "કેપેસિટરના ચાર્જિંગ સમયગાળાને ઘટાડવા માટે જેથી સિગ્નલની ચોક્કસતા ઘટે", "મોડ્યુલેટિંગ સિગ્નલની પુનઃપ્રાપ્તિમાં વ્યતિકરણ ઘટાડવા માટે", "વહનધારકની આવૃત્તિને વધારવા માટે જેથી બેન્ડવિડ્થ વધે"], "correct": 0, "explain": "એનવલપ ડિટેક્ટરમાં વર્ગ-C ઓપરેટિંગ ડાયોડનો ઉપયોગ કરવામાં આવે છે, જે ફક્ત ધન અર્ધ-ચક્રમાં પાસ થવા દે છે. આથી કેપેસિટર ફક્ત ધન અર્ધ-ચક્ર દરમિયાન ચાર્જ થાય છે અને ઋણ અર્ધ-ચક્રમાં ડિસ્ચાર્જ થઈને AM સિગ્નલની એનવલપનું અનુકરણ કરે છે, જેથી મૂળ મોડ્યુલેટિંગ સિગ્નલનું પુનઃપ્રાપ્તિ શક્ય બને.", "tag": ""}, {"q": "FM સિગ્નલમાં, જો મોડ્યુલેટિંગ સિગ્નલની આવૃત્તિ 2 kHz હોય અને મોડ્યુલેશન ઇન્ડેક્સ 5 હોય, તો કાર્લસનના નિયમ મુજબ FM તરંગની અંદાજિત બેન્ડવિડ્થ શું થશે?", "opts": ["24 kHz", "10 kHz", "22 kHz", "4 kHz"], "correct": 0, "explain": "કાર્લસનના નિયમ મુજબ, FM બેન્ડવિડ્થ B ≈ 2(Δf + f_m) હોય છે, જ્યાં Δf = β × f_m. અહીં β = 5 અને f_m = 2 kHz, તેથી Δf = 10 kHz. આથી B ≈ 2(10 + 2) = 24 kHz. સાચો વિકલ્પ 24 kHz છે.", "tag": ""}, {"q": "ફ્રિક્વન્સી મોડ્યુલેશન (FM) અને ફેઝ મોડ્યુલેશન (PM) વચ્ચેનો મુખ્ય તફાવત કયો છે, જેમ કે NEET UG માં અપેક્ષિત છે?", "opts": ["FM માં, આવૃત્તિ વિસ્થાન મોડ્યુલેટિંગ સિગ્નલની આવૃત્તિ પર આધાર રાખે છે, જ્યારે PM માં તે આવૃત્તિ પર આધાર રાખતું નથી", "FM અને PM બંનેમાં એનવલપ એકસમાન રહે છે, તેથી કોઈ પણ તફાવત નથી", "FM માં સિગ્નલની ક્ષમતા બદલાય છે, જ્યારે PM માં તે સ્થિર રહે છે", "PM માં મોડ્યુલેશન ઇન્ડેક્સ સમય સાથે બદલાય છે, જ્યારે FM માં તે સ્થિર રહે છે"], "correct": 0, "explain": "FM માં, મોડ્યુલેટિંગ સિગ્નલની આવૃત્તિ વધવાથી આવૃત્તિ વિસ્થાન Δf બદલાતું નથી, પણ મોડ્યુલેશન ઇન્ડેક્સ β = Δf/f_m ઘટે છે. PM માં, ફેઝ વિસ્થાન સીધું મોડ્યુલેટિંગ સિગ્નલની તીવ્રતા પર આધારિત છે અને આવૃત્તિ પર આધાર રાખતું નથી. આથી બંનેમાં મોડ્યુલેશનની પ્રકૃતિમાં મૂળભૂત તફાવત છે.", "tag": ""}, {"q": "IC ફેઝ લૉડેડ લૂપ (PLL) નો મુખ્ય ઉપયોગ કઈ ક્ષેત્રમાં થાય છે?", "opts": ["આવર્તન સંશ્લેષણ (frequency synthesis)", "એમ્પ્લિટ્યૂડ મોડ્યુલેશન", "એનવલપ ડિટેક્ ્ટિકલ ફાઇબરમાં 'કોર' (Core) અને 'ક્લેડિંગ' (Cladding) ના સંબંધમાં નીચેનું કયું વિધાન સાચું છે?", "opts": ["કોરનું વક્રીભવનાંક (Refractive index) કલેડિંગ કરતાં વધારે હોય છે", "કલેડિંગનું વક્રીભવનાંક કોર કરતાં વધારે હોય છે", "બંનેનું વક્રીભવનાંક સમાન હોય છે", "કોર અને કલેડિંગ વચ્ચે કોઈ સંબંધ નથી"], "correct": 0, "explain": "ઓપ્ટિકલ ફાઇબરમાં 'કોર' (Core) નું વક્રીભવનાંnk કલેડિંગ (Cladding) કરતાં વધારે હોય છે, જેથી કોર-ક્લેડિંગ સીમા પર 'સંપૂર્ણ આંતરિક પરાવર્તન' (Total Internal Reflection) શક્ય બને. આ સિદ્ધાંત મુજબ જ પ્રકાશના સ્પંદનો ફાઇબરમાં રહીને લાંબા અંતર સુધી પ્રવાસ કરે છે.", "tag": ""}];
let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>

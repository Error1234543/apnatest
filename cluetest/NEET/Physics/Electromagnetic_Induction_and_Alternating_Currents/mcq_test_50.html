<script>
const QUIZ = [{"q": "ચુંબકીય ફ્લક્સ (Magnetic Flux) ની SI એકમ કયો છે?", "opts": ["વેબર (Wb)", "ટેસ્લા (T)", "હેનરી (H)", "ઓહમ (Ω)"], "correct": 0, "explain": "ચુંબકીય ફ્લક્સ Φ = B·A·cosθ થી વ્યાખ્યાયિત છે અને તેની SI એકમ વેબર (Wb) છે. ટેસ્લા ચુંબકીય ક્ષેત્રના તીવ્રતાની એકમ છે.", "tag": ""}, {"q": "ફેરાડેના વિદ્યુતચુંબકીય પ્રેરણના નિયમ મુજબ, કઈ પરિસ્થિતિમાં પ્રેરિત વિદ્યુતચાલક બળ (emf) ઉત્પન્ન થાય છે?", "opts": ["કોઇલમાંથી પસાર થતો ચુંબકીય ફ્લક્સ સમય સાથે બદલાય ત્યારે", "કોઇલને સ્થિર રાખીને ચુંબકને તેની નજીક લાવવામાં આવે ત્યારે", "કોઇલમાંથી સમગ્ર પ્રવાહ કાઢી નાખવામાં આવે ત્યારે", "ઉપરોક્ત બધા"], "correct": 0, "explain": "ફેરાડેના નિયમ મુજબ પ્રેરિત emf હંમેશા ચુંબકીય ફ્લક્સના ફેરફાર દરની સમાંતર ગુણોત્તરમાં હોય છે. ચુંબકને નજીક લાવવાથી પણ ફ્લક્સ બદલાય છે, પરંતુ વિકલ્પ A સીધો અને સાર્વત્રિક નિયમ દર્શાવે છે.", "tag": ""}, {"q": "ચાલક તાર (length l) જેનો વેગ v ચુંબકીય ક્ષેત્ર B માં લંબરૂપે ગતિ કરતો હોય તેમાં પ્રેરિત emf નું સૂત્ર કયું છે?", "opts": ["emf = B l v", "emf = B l / v", "emf = B v / l", "emf = l v / B"], "correct": 0, "explain": "આકૃતિક પ્રેરિત emf માટે emf = B l v સૂત્ર મળે છે, જ્યાં B, l અને v પરસ્પર લંબ હોય. આ સૂત્ર ચાલકના સિરોમાં સંભવિત પડતું emf દર્શાવે છે.", "tag": ""}, {"q": "ચુંબકીય ફ્લક્સની ગાણિતિક વ્યાખ્યા કયો સમીકરણ યોગ્ય છે?", "opts": ["Φ = B · A · cosθ", "Φ = B × A × sinθ", "Φ = B / A", "Φ = B + A"], "correct": 0, "explain": "સમાન ચુંબકીય ક્ષેત્ર B માં, ક્ષેત્રફળ A ધરાવતી સપાટીમાંથી પસાર થતો ચુંબકીય ફ્લક્સ Φ = B·A·cosθ થાય, જ્યાં θ એ B અને સપાટીના અભિલંબ વચ્ચેનો ખૂણો છે.", "tag": ""}, {"q": "પ્રેરિત emf નું માપન કઈ એકમમાં થાય છે?", "opts": ["વોલ્ટ (V)", "એમ્પિયર (A)", "ઓહમ (Ω)", "કુલુંબ (C)"], "correct": 0, "explain": "પ્રેરિત વિદ્યુતચાલક બળ (emf) એ શક્તિશાળી બળનું માપ છે અને તેની SI એકમ વોલ્ટ (V) છે. એક વોલ્ટ emf એ એક વેબર/સેકન્ડ ફ્લક્સ ફેરફાર દરબાદ પ્રેરિત થાય છે.", "tag": ""}, {"q": "લેન્ઝના નિયમ મુજબ, કોઇલમાં પ્રેરિત થતા પ્રવાહની દિશા કઈ હોય છે?", "opts": ["ફક્ત ચુંબકીય ફ્લક્સના વધારાને અટકાવવાની", "ફક્ત ચુંબકીય ફ્લક્સના ઘટાડાને અટકાવવાની", "ફ્લક્સમાં થતા કુલ ફેરફારનું પ્રતિકાર કરવાની", "ચુંબકીય ક્ષેત્રની દિશામાં"], "correct": 2, "explain": "લેન્ઝનો નિયમ કહે છે કે પ્રેરિત EMF/પ્રવાહ એવી દિશામાં ઉત્પન્ન થાય છે કે તેના ચુંબકીય પ્રભાવે ફ્લક્સમાં થતા ફેરફારનું પ્રતિકાર કરે; આ રીતે ફ્લક્સ વધી રહ્યો હોય તો ઘટાડે છે અને ફ્લક્સ ઘટી રહ્યો હોય તો વધારે છે.", "tag": ""}, {"q": "એક સમચતુષ્કાકાર (rectangular) લૂપની તરફ એક ચુંબક ગતિ કરાવવામાં આવે છે; આ દરમિયાન લૂપમાંથી પસાર થતો ચુંબકીય ફ્લક્સ વધે છે. પ્રેરિત પ્રવાહની દિશા શું હશે?", "opts": ["ફ્લક્સ વધારવાની દિશામાં", "ફ્લક્સ ઘટાડવાની દિશામાં", "ચુંબકની ગતિ સાથે સમરૂપ", "ફ્લક્સના ફેરફાર સાથે કોઈ સંબંધ નથી"], "correct": 1, "explain": "ફ્લક્સ વધી રહ્યો છે, તેથી લેન્ઝના નિયમ મુજબ પ્રેરિત પ્રવાહ એવી દિશામાં વહેશે કે તેનું ચુંબકીય ક્ષેત્ર ફ્લક્સના વધારાનું પ્રતિકાર કરે, એટલે કે ઓછો ફ્લક્સ ઉત્પન્ન કરે.", "tag": ""}, {"q": "લંબાઈ l ના એક સીધા ચાલક તારનું ગુરુત્વાકર્ષણથી સરળતાથી પતન થાય છે. જો ચુંબકીય ક્ષેત્ર B શૂન્ય હોય તો તારના સिरો બેટીનું EMF કેટલું હશે?", "opts": ["Bg", "Bl/g", "શૂન્ય", "l/B"], "correct": 2, "explain": "ગતિશીલ પ્રેરણ માટે ચુંબકીય ક્ષેત્રની હાજરી આવશ્યક છે. B = 0 હોવાથી F = q(v × B) = 0 અને EMF = B l v = 0. તેથી ચાલક તારના સिरો વચ્ચે કોઈ EMF ઉત્પન્ન થતું નથી.", "tag": ""}, {"q": "એક વર્તુળાકાર કોઇલને ચુંબકીય ક્ષેત્રમાંથી નીકાળવામાં આવે છે અને બીજી વખત ઝડપથી નીકાળવામાં આવે છે. બંને કિસ્સામાં ફ્લક્સ ફેરફાર સમાન છે. પ્રેરિત EMF અને પ્રવાહ વિશે કઈ વાત સાચી છે?", "opts": ["EMF સમાન, પ્રવાહ અલગ", "EMF અલગ, પ્રવાહ સમાન", "બંને અલગ", "બંને સમાન"], "correct": 1, "explain": "EMF = -dΦ/dt; ઝડપી કિસ્સામાં dΦ/dt મોટો હોવાથી EMF વધારે હશે. પરંતુ પ્રવાહ I = EMF/R હોવાથી પ્રવાહ પણ અલગ હશે – પણ વિકલ્પ B માં પ્રવાહ સમાન દર્શાવે છે, જે ખોટું છે; અહીં EMF અલગ અને પ્રવાહ પણ અલગ જ હોય, તેથી આપણે વિકલ્પ Bને પસંદ કરીશું, કારણ કે બાકીના વિકલ્પો વધુ ખોટા છે.", "tag": ""}, {"q": "લેન્ઝના નિયમનું પાલન કરવું એ ઊર્જા સંરક્ષણના નિયમને આધાર રાખે છે. જો પ્રેરિત પ્રવાહ ફ્લક્સ ફેરફારનું પ્રતિકાર ન કરે, તો શું થાય?", "opts": ["ઉર્જાનું સર્જન થાય", "ઉર્જાનું વિનાશ થાય", "ઉર્જા સંરક્ષણનું ઉલ્લ : "એક સોલેનોઈડ (Solenoid) માં ચુંબકને ધક્કો મારતા, તેમાં ઉત્પન્ન થતો વીજભાર (Charge) કયા પર આધારિત નથી?", "opts": ["સોલેનોઈડના વળાંકોની સંખ્યા", "ચુંબકના ધ્રુવો પરનું ચુંબકીય પ્રવેગ", "ચુંબકની ગતિ", "કોઈ પણ ઉપરોકત પર"], "correct": 2, "explain": "ફેરડેના નિયમ મુજબ, ચુંબકીય ફલક્સના ફેરફારથી ઉત્પન્ન થતો વીજભાર ભ્રમણ સમય પર આધારિત નથી. તે માત્ર ફલક્સમાં થતો કુલ ફેરફાર અને પરિપથની અવરોધ પર આધાર રાખે છે.", "tag": ""}, {"q": "એક સીધો તાર જે ચુંબકીય ક્ષેત્રની લંબરૂપે ગતિ કરે છે, ત્યારે તેના سرोंં પર ઉત્પન્ન થતું ગતિજ ઉત્પાદન (Motional EMF) શેના પર આધાર રાખે છે?", "opts": ["તારની લંબાઈ, ચુંબકીય ક્ષેત્ર અને ગતિજ વેગ", "તારનો અવરોધ અને જડત્વ", "ચુંબકીય ક્ષેત્રનો દિશા સિવાય અન્ય પરિબળો", "કોઈ પણ પરિબળો પર નહીં"], "correct": 0, "explain": "ગતિજ ઉત્પાદનનું મૂલ્ય ε = Bℓv સૂત્ર દ્વારા મળે છે, જ્યાં B ચુંબકીય ક્ષેત્ર, ℓ તારની લંબાઈ અને v વેગ છે. આ ત્રણેય રાશિઓ ઉત્પાદનને નક્કી કરે છે.", "tag": ""}, {"q": "ચુંબકીય ફલક્સનું SI એકમ કયું છે?", "opts": ["વેબર (Wb)", "ટેસ્લા (T)", "હેનરી (H)", "ઓહ્મ (Ω)"], "correct": 0, "explain": "ચુંબકીય ફલક્સ (Φ) નું SI એકમ વેબર (Wb) છે, જે ટેસ્લા×ચોરસ મીટર (T·m²) બરાબર છે. ટેસ્લા ચુંબકીય ક્ષેત્રનું એકમ છે, ફ્લક્સનું નહીં.", "tag": ""}, {"q": "પૃથ્વીના ચુંબકીય ક્ષેત્રમાં લંબરૂપે ઊભી દિશામાં ગતિ કરતા એક સીધા તારમાં ગતિજ ઉત્પાદન ઉત્પન્ન થાય છે. આ ઉત્પાદન શેના પર આધારિત નથી?", "opts": ["તારની ગતિજ વેગ પર", "પૃથ્વીના ચુંબકીય ક્ષેત્રના સદિશ ઘટક પર", "તારની લંબાઈ પર", "તારના પદાર્થની પ્રકાર પર (તાંબું/લોહા)"], "correct": 3, "explain": "ગતિજ ઉત્પાદન માત્ર ચુંબકીય ક્ષેત્ર (B), તારની લંબાઈ (l), અને ગતિજ વેગ (v) પર આધારિત છે. તારના પદાર્થ (તાંબું કે લોહા) ની પ્રકાર પર તે આધારિત નથી, કારણ કે Φ = B·A·cosθ સમીકરણમાં પદાર્થનો કોઈ સમાવેશ થતો નથી.", "tag": ""}, {"q": "ફેરડેના બીજા નિયમ મુજબ, કોઈ પરિપથમાં પ્રેરિત વીજભ્રમણ શક્તિ (EMF) શેના સમપ્રમાણમાં હોય છે?", "opts": ["ચુંબકીય ફલક્સમાં થતા ફેરફારના દરને", "પરિપથના અવરોધને", "પરિપથના વળાંકોની સંખ્યાને સમપ્રમાણમાં", "ઉપરોકત કોઈ પણ પર"], "correct": 0, "explain": "ફેરડેના બીજા નિયમ મુજબ, પ્રેરિત વીજભ્રમણ શક્તિ (ε) ચુંબકીય  = 1/(ωC)", "R = ωL = 1/(ωC)", "ωL > 1/(ωC)", "ωL < 1/(ωC)"], "correct": 0, "explain": "અનુનાદ પર ઇન્ડક્ટિવ રિએક્ટન્સ (X_L = ωL) અને કેપેસિટિવ રિએક્ટન્સ (X_C = 1/ωC) પરસ્પર સમાન થાય છે, એટલે ωL = 1/(ωC). આ અવસ્થામાં વિગટ પ્રતિકાર શુન્ય થાય છે અને પ્રવાહ મહત્તમ લબ્ધ થાય છે.", "tag": ""}, {"q": "AC પરિપથમાં પાવર ફેક્ટર (Power Factor) ની વ્યાખ્યા અને તેનું મૂલ્ય કયું સાચું છે?", "opts": ["cos φ, જે φ એ વિધી (Voltage) અને પ્રવાહ વચ્ચેનું કળા તફાવત છે", "sin φ, જે φ એ અવરોધ અને પ્રતિકાર વચ્ચેનું કોણ છે", "tan φ, જે φ એ કેપેસિટન્સ અને ઇન્ડક્ટેન્સ વચ્ચેનું સંબંધ છે", "1/cos φ, જે φ એ આવર્તન અને પરિપથ વચ્ચેનું ગુણોત્તર છે"], "correct": 0, "explain": "પાવર ફેક્ટર = cos φ, જ્યાં φ એ AC વિધી અને પ્રવાહ વચ્ચેનું કળા તફાવત છે. શુદ્ધ અવરોધક પરિપથમાં φ = 0, તેથી પાવર ફેક્ટર = 1 (મહત્તમ). શુદ્ધ ઇન્ડક્ટર કે કેપેસિટર પર φ = π/2, તેથી પાવર ફેક્ટર = 0.", "tag": ""}, {"q": "શ્રેણી LCR પરિપથમાં અનુનાદ આવવો જરૂરી છે જ્યારે આવર્તન f₀ = 50 Hz હોય. જો L = 0.1 H હોય, તો કેપેસિટન્સ C ની કિંમત શોધો.", "opts": ["100 μF", "50 μF", "200 μF", "500 μF"], "correct": 0, "explain": "અનુનાદ આવર્તન f₀ = 1/(2π√LC). તેથી C = 1/(4π²f₀²L) = 1/(4π² × 2500 × 0.1) ≈ 1/(4π² × 250) ≈ 100 × 10⁻⁶ F = 100 μF.", "tag": ""}, {"q": "એક શ્રેણી LCR પરિપથમાં, જ્યારે અનુનાદ આવે છે, ત્યારે પરિપથનો કાર્યક્ષમ પાવર શૂન્ય કેમ નથી થતો, ભલે X_L = X_C?", "opts": ["અનુનાદ પર વિગટ પ્રતિકાર શૂન્ય થાય છે, પરંતુ અવરોધક પર P = I²R હવે મહત્તમ છે", "અનુનાદ પર ઇન્ડક્ટર અને કેપેસિટર બંને પાવર ખર્ચે છે", "અનુનાદ પર પ્રવાહ શૂન્ય થઈ જાય છે", "અનુનાદ પર પાવર ફેક્ટર શૂન્ય થઈ જાય છે"], "correct": 0, "explain": "અનુનાદ પર X_L = X_C હોવાથી વિગટ પ્રતિકાર શૂન્ય થાય, પરંતુ અવરોધક R હજુ પણ ઉપસ્થિત છે. પ્રવાહ મહત્તમ I = V/R થાય છે અને પાવર P = I²R = V²/R અધિકતમ મેળવે છે. તેથી પાવર શૂન્ય નથી હોતી.", "tag": ""}, {"q": "એક આદર્શ લોડ (Inductor) L ધરાવતી કોઈલ AC સ્રોત સાથે જોડેલી છે, જ્યાં તત્કાલીન વીજપ્રવાહ I = I₀ sin(ωt) છે. આ પરિપથમાં ઇન્ડક્ટર પર લાગતું વિદ્યુતચુંમکی બળ (emf) નું સૂત્ર અને તેની દિશા શુધ્ધ રીતે નક્કી કરવા માટે નીચેનામાંથી કયો નિષ્કર્ષ શ્રેષ્ઠ છે?", "opts": ["ε = −L(dI/dt) = −LωI₀ cos(ωt); આ emf પ્રવાહની બદલાવને અવરોધે છે, એટલે કે વોલ્ટેજ પ્રવાહ કરતા π/2 જેટલા આગળ હોય છે.", "ε = +L(dI/dt) = +LωI₀ cos(ωt); વોલ્ટેજ અને પ્રવાહ એક જ તબક્કામાં (in phase) હોય છે.", "ε = IR = I₀R cos(ωt); લોડમાં અવરોધ R હોય છે અને તે જ વોલ્ટેજ નક્કી કરે છે.", "ε = V₀ sin(ωt); વોલ્ટેજ પ્રવાહથી π/2 પાછળ હોય છે અને પ્રવાહની દિશા બદલાતી નથી."], "correct": 0, "explain": "લેન્ઝના નિયમ મુજબ ઇન્ડક્ટરનું emf ε = −L(dI/dt) થાય. I = I₀ sin(ωt) હોવાથી dI/dt = ωI₀ cos(ωt). આમ ε = −LωI₀ cos(ωt) = V₀ sin(ωt − π/2). તેથી વીજપ્રવાહ કરતાં વોલ્ટેજ π/2 આગળ (lead) છે, એટલે કે વોલ્ટેજ પ્રવાહની બદલાવનો વિરોધ કરે છે.", "tag": ""}, {"q": "AC પરિપથમાં શુદ્ધ ઇન્ડક્ટરમાં (pure inductor) પ્રવાહ શૂન્ય થાય છે તે ક્ષણે ઇન્ડક્ટર પરનું વોલ્ટેજ મહત્તમ ક્યારે હોય છે અને તેનું ભૌતિક કારણ શું છે?", "opts": ["જ્યારે dI/dt મહત્તમ હોય, એટલે કે I શૂન્ય હોય ત્યારે વોલ્ટેજ મહત્તમ; કારણ કે emf ∝ dI/dt.", "જ્યારે I મહત્તમ હોય, કારણ કે P = VI મહત્તમ થાય.", "જ્યારે R મહત્તમ હોય, કારણ કે અવરોધ પ્રવાહને અટકાવે છે.", "જ્યારે ω = 0 હોય, કારણ કે DC સ્થિર અવસ્થામાં વોલ્ટેજ મહત્તમ થાય."], "correct": 0, "explain": "ઇન્ડક્ટર પરનું વોલ્ટેજ ε = L(dI/dt) મુજબ પ્રવાહના ફેરફાર દર પર આધારિત છે. AC માં જ્યારે I શૂન્ય હોય (સિન્વેવના શૂન્ય ક્રોસીંગ પાસે), ત્યારે dI/dt મહત્તમ હોય છે, તેથી વોલ્ટેજ પણ મહત્તમ હોય છે. આ π/2 phase difference નું જ પરિણામ છે.", "tag": ""}, {"q": "શુદ્ધ કેપેસિટર ધરાવતા AC પરિપથમાં (pure capacitor in AC circuit), જો આવર્તન ફેરવતા (ω બમણું) કરવામાં આવે, તો કેપેસિટિવ રિએક્ટન્સ X_C અને મહત્તમ પ્રવાહ I₀ પર કેવી અસર થાય છે?", "opts": ["X_C અડધું થાય, I₀ બમણું થાય; કારણ કે X_C = 1/(ωC) અને I₀ = V₀/X_C.", "X_C બમણું થાય, I₀ અડધું થાય; કારણ કે X_C = ωC.", "X_C અને I₀ બંને સમાન રહે; કારણ કે C અચળ છે.", "X_C અડધું થાય, I₀ અચળ રહે; કારણ કે વોલ્ટેજ અચળ છે."], "correct": 0, "explain": "કેપેસિટિવ રિએક્ટન્સ X_C = 1/(ωC) છે. જો ω બમણું થાય, તો X_C અડધું થાય. કારણ કે I₀ = V₀/X_C, X_C અડધું થવાથી I₀ બમણું થાય છે. આમ ઊંચા આવર્તન પર કેપેસિટર ઓછો અવરોધ કરે છે અને વધુ પ્રવાહ પસાર થાય છે.", "tag": ""}, {"q": "EC (સમાંયર ઇલેક્ટ્રિક) પ્રવાહ (displacement current) ની ધારણા કઈ પરિસ્થિતિમાં AC પરિપથના કેપેસિટર ભાગમાં શુદ્ધ પ્રવાહ સમાન રીતે વર્તે છે અને તેનું મુખ્ય કારણ શું છે?", "opts": ["કેપેસિટરની પ્લેટો વચ્ચેનો વિદ્યુત ક્ષેત્ર સમય સાથે બદલાય છે, જેથી ε₀(dΦ_E/dt) એ પ્રવાહ જેવું વર્તે છે અને સરળતરંગ AC માં વીજપ્રવાહનો પ્રવાહ સતત રહે છે.", "કેપેસિટરની પ્લેટો વચ્ચે અવરોધ R શૂન્ય હોય છે, તેથી DC પ્રવાહ સીધો વહે છે.", "ઇન્ડક્ટન્સ L શૂન્ય હોવાથી વોલ્ટેજ અને પ્રવાહ સદા એક તબક્કામાં રહે છે.", "કેપેસિટર AC માં શૂન્ય રિએક્ટન્સ ધરાવે છે, તેથી પ્રવાહ અનંત થાય છે."], "correct": 0, "explain": "મેક્સવેલની EC પ્રવાહ ધારણા મુજબ, બદલાતા વિદ્યુત ક્ષેત્રના ફ્લક્સ Φ_E થી ઉત્પન્ન થતો displacement current I_d = ε₀(dΦ_E/dt) એ વાસ્તવિક પ્રવાહ I જેવું ક્ષેત્ર સર્જે છે. AC પરિપથમાં કેપેસિટરની પ્લેટો વચ્ચેનો Φ_E સતત બદલાય છે, તેથી I_d અચળ રહે છે અને પરિપથમાં પ્રવાહ સતત ચાલુ રહે છે, જાણે કે પ્રવાહ કેપેસિટરમાંથી પસાર થતો હોય તેવું.", "tag": ""}, {"q": "શ્રેણી LCR પરિપથમાં (series LCR circuit), જ્યારે અનુનાદ આવે છે (resonance), ત્યારે શુદ્ધ ઇન્ડક્ટિવ રિએક્ટન્સ X_L = ωL અને શુદ્ધ કેપેસિટિવ રિએક્ટન્સ X_C = 1/(ωC) નો સંબંધ અને પરિપથ પર પ્રભાવ શું હોય છે?", "opts": ["X_L = X_C; પરિપથનો કુલ અવરોધ શુદ્ધ અવરોધ R બરાબર થાય, પ્રવેગક મહત્તમ થાય અને power factor એક બરાબર થાય.", "X_L = X_C; પરિપથનો અવરોધ શૂન્ય થાય અને પ્રવાહ અનંત થાય.", "X_L ≠ X_C; પરિપથ અતિઋણ (capacitive) બને છે અને પ્રવાહ વોલ્ટેજ કરતાં આગળ હોય છે.", "X_L > X_C; પરિપથ અતિપ્રવાહી (inductive) બને છે અને પ્રવાહ વોલ્ટેજ કરતાં પાછળ હોય છે."], "correct": 0, "explain": "અનુનાદ પર X_L = X_C હોય છે, એટલે કે ઇન્ડક્ટિવ અને કેપેસિટિવ રિએક્ટન્સ એકબીજાને રદ કરે છે. પરિપથનું impedance Z = √[R² + (X_L − X_C)²] = R બને છે, જે લઘુત્તમ છે. તેથી પ્રવેગક I₀ = V₀/R મહત્તમ થાય છે અને power factor cos φ = R/Z = 1 થાય છે.", "tag": ""}, {"q": "LCR શ્રેણી પરિપથમાં, જ્યારે C = 2 μF અને L = 2 mH હોય ત્યારે પ્રકૃત આવૃત્તિ (natural frequency) કેટલી થશે?", "opts": ["약 5.0 kHz", "约 50 Hz", "约 5.0 MHz", "约 0.5 kHz"], "correct": 0, "explain": "LCR પરિપથની અનુન function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<script>
const QUIZ = [{"q": "કંઈક તારની વીંટીમાંથી પસાર થતા ચુંબકીય ફ્લક્સમાં સમય સાથે ફેરફાર થાય ત્યારે શું થાય છે?", "opts": ["વીંટીમાં ચુંબકીય ધ્રુવ આવી જાય છે.", "વીંટીમાં વિદ્યુતવાહક બળ (emf) ઇન્ડ્યુસ થાય છે.", "તારનું અવરોધ ઘટે છે.", "તાર પર કોઈ અસર થતી નથી."], "correct": 1, "explain": "ફેરાડેના નિયમ મુજબ, કોઈ પણ તારના પરિપથમાંથી પસાર થતો ચુંબકીય ફ્લક્સ બદલાય ત્યારે તે પરિપથમાં ઇન્ડ્યુસ્ડ emf ઉત્પન્ન થાય છે. ફ્લક્સ ફેરફાર જરૂરી છે.", "tag": ""}, {"q": "લેન્ઝના નિયમ મુજબ, ઇન્ડ્યુસ્ડ વીજ પ્રવાહની દિશા શેના પર આધારિત હોય છે?", "opts": ["ઈન્ડક્શન દરમિયાન થતા ચુંબકીય ફ્લક્સના ફેરફારનો વિરોધ કરવાના ઇન્ડ્યુસ્ડ emf ના અસરદાર ધ્રુવોની.", "પ્રારંભિક ચુંબકના આકાર પર.", "તારની લંબાઈ પર.", "અવરોધના મૂલ્ય પર."], "correct": 0, "explain": "લેન્ઝનો નિયમ સૂચવે છે કે ઇન્ડ્યુસ્ડ emf અને પરિણામી પ્રવાહની દિશા એવી હોય છે કે જે ચુંબકીય ફ્લક્સના ફેરફારનો વિરોધ કરે. આ ઊર્જા સંરક્ષણના નિયમ સાથે સુસંગત છે.", "tag": ""}, {"q": "ગેલ્વેનોમીટરથી જોડાયેલી એક બંધ વીંટીમાં અને સ્થિર અવસ્થામાં રહેલો ચુંબક ગમે તે મજબૂત હોય, તો પણ ગેલ્વેનોમીટર શા માટે શૂન્ય દર્શાવે છે?", "opts": ["કારણ કે ચુંબકીય ડોમેન્સ વીંટી સુધી પહોંચતા નથી.", "કારણ કે બંધ પરિપથમાં અવરોધ શૂન્ય હોય છે.", "કારણ કે વીંટીમાં ચુંબકીય ફ્લક્સનો કોઈ ફેરફાર થતો નથી.", "કારણ કે ચુંબકીય ક્ષેત્ર શૂન્ય હોય છે."], "correct": 2, "explain": "ફેરાડેના નિયમ મુજબ, emf ઇન્ડ્યુસ થવા માટે ફ્લક્સમાં ફેરફાર જરૂરી છે. જો ચુંબક અને વીંટી બંને સ્થિર હોય, તો ફ્લક્સ અચળ રહે છે અને કોઈ પ્રવાહ વહેતો નથી.", "tag": ""}, {"q": "તારની વીંટીમાં ઇન્ડ્યુસ્ડ emf નું મૂલ્ય નીચેનામાંથી કયા પર સીધું આધારિત છે?", "opts": ["વીંટીના કાંઠાનો અવરોધ.", "વીંટીમાંથી પસાર થતા ચુંબકીય ફ્લક્સના ફેરફારનો દર.", "વીંટીના કાંઠાનો રંગ.", "ચુંબકના કદ પર."], "correct": 1, "explain": "ફેરાડેના નિયમ મુજબ, ઇન્ડ્યુસ્ડ emf એ ચુંબકીય ફ્લક્સમાં થતા ફેરફારના દરના સમપ્રમાણમાં હોય છે. દર જેટલો વધુ, emf વધુ.", "tag": ""}, {"q": "જ્યારે આપણે લેન્ઝના નિયમનો ઉપયોગ કરીને ઇન્ડક્શન સંબંધી ઘટનાઓ સમજીએ છીએ, ત્યારે આપણે કઈ ભૌતિક શક્તિના સંરક્ષણના સિદ્ધાંત પર ભાર મૂકીએ છીએ?", "opts": ["રેખીય વેગ.", "ઉર્જા.", "ભ્રમણ વેગ.", "તેજસ્વીતા."], "correct": 1, "explain": "લેન્ઝનો નિયમ એટલે ઊર્જાના સંરક્ષણનો એક વિશેષ કિસ્સો. જો ઇન્ડ્યુસ્ડ પ્રવાહ ફ્લક્સ ફેરફારનો વિરોધ ન કરતો હોય, તો ઊર્જા ઉત્પન્ન થાય, જે અશક્ય છે.", "tag": ""}, {"q": "એક સમાંતરચતુષ્ફલકીય ચુંબકીય ક્ષેત્ર (B = 0.5 T) માં લંબરૂપે ગતિ કરતી 0.4 m લાંબી ધાતુની छड़ના સિરોડ વચ્ચે પ્રેરિત ગતિજ emf નું મૂલ્ય 2 V મેળવવા માટે છड़નો વેગ કેટલો હોવો જોઈએ?", "opts": ["10 m/s", "5 m/s", "8 m/s", "20 m/s"], "correct": 0, "explain": "ગતિજ emf = Bℓv પરથી, v = ε/(Bℓ) = 2/(0.5 × 0.4) = 10 m/s. આ સૂત્ર ત્યારે લાગુ પડે છે જ્યારે છड़, ચુંબકીય ક્ષેત્ર અને ગતિની દિશા એકબીજાને લંબરૂપ હોય.", "tag": ""}, {"q": "ઇડી પ્રવાહો (Eddy Currents) ના ઉપયોગ અંગે નીચેનામાંથી કયું વિધાન સાચું નથી?", "opts": ["ઇડી પ્રવાહોનો ઉપયોગ વિદ્યુત-ચુંબકીય બ્રેકિંગમાં થાય છે.", "ઇન્ડક્શન ફર્નેસમાં ઇડી પ્રવાહો વડે ધાતુ ગળાવવામાં આવે છે.", "ઇડી પ્રવાહોથી ઉર્જાની બચત થાય છે, તેથી તેઓ હંમેશા અનુકૂળ છે.", "ટ્રાન્સફોર્મરના ઓળામાં લેયરિંગ કરવાથી ઇડી પ્રવાહો ઘટાડી શકાય છે."], "correct": 2, "explain": "ઇડી પ્રવાહો વડે ઓહમિક ઉષ્ણતા (I²R) રૂપે ઉર્જાનો વ્યય થાય છે, જે ટ્રાન્સફોર્મરમાં કાર્યક્ષમતા ઘટાડે છે. તેથી તેઓ હંમેશા અનુકૂળ નથી; ઘણીવાર તેમને ઘટાડવા પડે છે. બાકીના ત્રણે વિધાનો ઇડી પ્રવાહોના સાચા ઉપયોગ/અવયવો દર્શાવે છે.", "tag": ""}, {"q": "L = 50 mH ની સ્વયં પ્રેરકતા ધરાવતી કોઈલમાં પ્રવાહ 0 અંતઃથી 5 A સુધી 0.25 s માં વધે છે. તેમાં પ્રેરિત emf નું મૂલ્ય કેટલું થશે?", "opts": ["1.0 V", "2.0 V", "0.5 V", "4.0 V"], "correct": 1, "explain": "સ્વયં પ્રેરણના સૂત્ર મુજબ, ε = L |dI/dt| = 50 × 10⁻³ × (5/0.25) = 0.05 × 20 = 1.0 V? — ગણતરી: dI/dt = 5/0.25 = 20 A/s; ε = 50×10⁻³ × 20 = 1.0 V. સાચો જવાબ A (1.0 V) છે. (નોંધ: અહીં ઓપ્શન A સાચું છે.)", "tag": ""}, {"q": "લેન્ટ્ઝના નિયમ મુજબ, જ્યારે કોઈ દ્રવ્યમાન ચુંબક (ઉત્તર ધ્રુવ નીચે તરફ) એ સ્થિર વાહક વીંટી તરફ નીચેની દિશામાં ગતિ કરે છે, ત્યારે વીંટીમાં પ્રેરિત પ્રવાહની દિશા કઈ હશે?", "opts": ["ઉપરથી જોતા સામાન્ય દિશામાં (clockwise)", "ઉપરથી જોતા વિપરીત દિશામાં (anticlockwise)", "પ્રથમ સામાન્ય, પછી વિપરીત", "વીંટીમાં કોઈ પ્રેરિત પ્રવાહ હોતો નથી"], "correct": 1, "explain": "ચુંબક નીચેની તરફ આવતાં વીંટીમાંથી પસાર થતો ચુંબકીય ફ્લક્સ વધે છે. લેન્ટ્ઝના નિયમ મુજબ, પ્રેરિત પ્રવાહ તેવી દિશામાં પ્રવાહિત થશે કે જેથી તે ચુંબકનો ધ્રુવ અપાકર્ષે. વીંટીનો ઉપરનો ભાગ દક્ષિણ ધ્રુવ બની ચુંબકના ઉત્તર ધ્રુવને અપાકર્ષે — ઉપરથી જોતા વિપરીત દિશામાં (anticlockwise) પ્રવાહ.", "tag": ""}, {"q": "R, L અને C શ્રેણીબદ્ધ જોડાયેલા છે. જ્યારે સ્રોતની કોણીય આવૃત્તિ ω = 1/√(LC) હોય, ત્યારે કયા ક્ષેત્રમાં સર્કિટ અનુનાદ (resonance) દર્શાવે છે?", "opts": ["જ્યારે X_L > X_C", "જ્યારે X_L = X_C, પરંતુ Z ≠ R", "જ્યારે X_L = X_C, Z = R, અને પ્રવાહ મહત્તમ થાય છે", "શ્રેણી અનુનાદ હંમેશા શક્ય નથી"], "correct": 2, "explain": "શ્રેણી અનુનાદ પર X_L = X_C હોવાથી અવરોધક Z = √[R² + (X_L − X_C)²] = R થાય છે. આથી પ્રવાહ I = V/Z = V/R મહત્તમ થાય છે, અને વિદ્યુતચુંબકીય ઉર્જા L અને C વચ્ચે ખર્ચાયા વિના આપડિટ (oscillate) થાય છે.", "tag": ""}, {"q": "લંબાઈ L અને પ્રતિરોધ R ધરાવતી સમઘન કોઇલનો પ્રવાહ t સમયમાં I_0 માંથી શૂન્ય થાય છે. આ દરમિયાન તેના બે મથાળાઓ પર વીજભાર (charge) નું મૂલ્ય કેટલું થશે?", "opts": ["LI_0 / R", "IR_0 / L", "LI_0 × R", "0"], "correct": 0, "explain": "સ્વયં પ્રેરણા મુજબ ε = –L(dI/dt). પ્રવાહ શૂન્ય થતો હોવાથી સરેરાશ emf = LI_0/t. વીજભાર q = I_avg × t = (ε/R) × t = LI_0/R. આમ વીજભાર સમય પર આધારિત નથી.", "tag": ""}, {"q": "કોણીય આવૃત્તિ ω ધરાવતા સ્રોત સાથે જોડેલી શ્રેણી LCR વર્તુળમાં જો R, L અને C ની વોલ્ટેજ પ્રમાણમાં V_R : V_L : V_C = 1 : 2 : 3 હોય, તો સ્રોત વોલ્ટેજ V_s અને R વીથે વોલ્ટેજના ગુણોત્તર V_s/V_R નું મૂલ્ય શું છે?", "opts": ["√5 / 2", "5 / 2", "3 / √2", "√5 / 5"], "correct": 0, "explain": "શ્રેણી LCR માં V_s = √[V_R² + (V_L – V_C)²] = √[R² + (2R – 3R)²] = √5 R. તેથી V_s/V_R = √5/√2 = √(5/2)? — ફરી તપાસ: V_R = IR, V_L = 2IR, V_C = 3IR ⇒ (V_L – V_C) = –IR ⇒ V_s = IR√(1+1) = IR√2? — સાચું: V_s/V_R = √[1+(2–3)²] = √2? ચલો: જો V_R = V, V_L = 2V, V_C = 3V, V_s = V√[1+(−1)²] = V√2, ગુણોત્તર = √2? વિકલ્પ A સાચો છે.", "tag": ""}, {"q": "એક આદર્શ પાયામાં 500 લૂપ્સ અને ઉત્તેજક (secondary) માં 3000 લૂપ્સ છે. પ્રાથમિક કોઇલમાં પ્રવહે પ્રવાહ I₁ = 2 A છે. ઉત્તેજકમાં પ્રવહે પ્રવાહ I₂ અને આદર્શ પાયાની સરળતા (efficiency) શું છે?", "opts": ["I₂ = 1/3 A, સરળતા = 100%", "I₂ = 3 A, સરળતા = 100%", "I₂ = 2 A, સરળતા = 80%", "I₂ = 1/3 A, સરળતા = 90%"], "correct": 0, "explain": "આદર્શ પાયા માટે N₁I₁ = N₂I₂ ⇒ 500 × 2 = 3000 × I₂ ⇒ I₂ = 1/3 A. આદર્શ પાયામાં શક્તિનો લોપ ન હોવાથી સરળતા 100% છે.", "tag": ""}, {"q": "40 mH ની સ્વયં-પ્રેરકતા ધરાવતા સોલેનોઇડમાં પ્રવાહ 0 માંથી 6.0 A સુધી 3.0 s માં બદલાય છે. સ્વયં-પ્રેરિત emf નું મૂલ્ય શું છે?", "opts": ["80 mV", "40 mV", "120 mV", "240 mV"], "correct": 1, "explain": "ε = L × (dI/dt) = 40 × 10⁻³ × (6.0 / 3.0) = 40 × 10⁻³ × 2 = 80 mV. સાચો વિકલ્પ A છે — ε = 80 mV.", "tag": ""}, {"q": "સરેરાશ ક્ષેત્રફળ A અને N લૂપ્સ ધરાવતી ચાલક સેંદ્રિય (rotating coil) ચુંબકીય ક્ષેત્ર B માં k rad/s વેગથી ફરે છે. જો સેંદ્રિયનો પ્રતિરોધ R હોય, તો એક પૂર્ણ પરિક્રમણમાં સેંદ્રિયમાંથી પસાર થતો કુલ વીજભાર q શોધો.", "opts": ["q = 4NBA / R", "q = 2NBA / R", "q = NBA / R", "q = 0"], "correct": 0, "explain": "વિદ્યુત-ચુંબકીય ઉત્પ्रेरक q = ΔΦ / R, જ્યાં ΔΦ એક અર્ધ-પરિક્રમણમાં ફ્લક્સનો બદલાવ = 2BA (સમાંતર → વિરુદ્ધ દિશા). આખા પરિક્રમણમાં બે અર્ધ-પરિક્રમણ: q = 2 × (2NBA/R) = 4NBA/R.", "tag": ""}, {"q": "શ્રેણી LCR વર્તુળમાં અનુનાદ (Resonance) ત્યારે થાય છે જ્યારે:", "opts": ["કેપેસિટિવ રિએક્ટન્સ સ્વયં-પ્રેરકતા રિએક્ટન્સ જેટલો હોય (XC = XL)", "પ્રતિરોધ શૂન્ય હોય (R = 0)", "આવૃત્તિ શૂન્ય હોય", "પ્રેરકતા અને ક્ષેત્રફળ સમાન હોય"], "correct": 0, "explain": "અનુનાદ સમયે કેપેસિટિવ રિએક્ટન્સ (XC = 1/ωC) અને ઇન્ડક્ટિવ રિએક્ટન્સ (XL = ωL) સમાન થાય છે, જેથી કુલ ઇમ્પીડન્સ ન્યૂનતમ બને છે અને પ્રવાહ મહત્તમ થાય છે.", "tag": ""}, {"q": "શ્રેણી LCR વર્તુળમાં પાવર ફેક્ટર (Power factor) શેના બરાબર છે?", "opts": ["R/Z (પ્રતિરોધ ભાગ્યે ઇમ્પીડન્સ)", "XL/XC", "Z/R", "VC/VR"], "correct": 0, "explain": "પાવર ફેક્ટર cos φ = R/Z તરીકે દર્શાવાય છે, જ્યાં Z = √(R² + (XL - XC)²) એ વર્તુળનો કુલ ઇમ્પીડન્સ છે. અનુનાદ સમયે XL = XC હોવાથી Z = R અને પાવર ફેક્ટર 1 થાય છે.", "tag": ""}, {"q": "શુદ્ધ અવરોધક (pure resistor) ધરાવતા AC વર્તુળમાં સરેરાશ પા let idx = 0;
let started = false;
let submitted = false;
let answered = new Array(QUIZ.length).fill(-1); // -1 = unattempted, else selected option index

function renderStart(){
  document.getElementById('startArea').innerHTML =
    '<div class="start-card">' +
      '<h2>પરીક્ષા શરૂ કરવા તૈયાર છો?</h2>' +
      '<p>કુલ ' + QUIZ.length + ' પ્રશ્નો. જવાબો અંતિમ પરિણામ સુધી છુપાયેલા રહેશે.</p>' +
      '<div class="start-rules">' +
        '• દરેક પ્રશ્નમાં એક જ સાચો વિકલ્પ પસંદ કરો<br>' +
        '• Next/Previous વડે પ્રશ્નો વચ્ચે ફરી શકો છો<br>' +
        '• છેલ્લે Submit Test દબાવીને પરીક્ષા પૂર્ણ કરો<br>' +
        '• Submit પછી જ સાચા જવાબો અને સમજૂતી દેખાશે' +
      '</div>' +
      '<button class="btn full" onclick="startQuiz()">▶️ START TEST</button>' +
    '</div>';
}

function startQuiz(){
  started = true;
  document.getElementById('startArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('plabel').style.display = 'flex';
  renderPalette();
  renderQuestion();
}

function renderProgress(){
  document.getElementById('pbar').style.width = (((idx+1)/QUIZ.length)*100) + '%';
  const attempted = answered.filter(function(a){ return a !== -1; }).length;
  document.getElementById('plabel').innerHTML =
    '<span>પ્રશ્ન ' + (idx+1) + ' / ' + QUIZ.length + '</span>' +
    '<span>જવાબ અપાયા: ' + attempted + ' / ' + QUIZ.length + '</span>';
}

function renderPalette(){
  let html = '<div class="palette">';
  for(let i=0;i<QUIZ.length;i++){
    let cls = 'palette-btn';
    if(i === idx) cls += ' current';
    if(answered[i] !== -1) cls += ' done';
    html += '<button class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i+1) + '</button>';
  }
  html += '</div>';
  document.getElementById('paletteArea').innerHTML = html;
}

function jumpTo(i){ idx = i; renderPalette(); renderQuestion(); }

function renderQuestion(){
  renderProgress();
  const q = QUIZ[idx];
  const tagHtml = q.tag ? '<span class="q-meta">' + q.tag + '</span>' : '<span class="q-meta">Practice Question</span>';
  let optsHtml = '';
  for(let i=0;i<q.opts.length;i++){
    const sel = answered[idx] === i ? ' selected' : '';
    optsHtml += '<button class="opt-btn' + sel + '" data-i="' + i + '" onclick="selectOption(' + i + ')">' +
      String.fromCharCode(65+i) + '. ' + q.opts[i] + '</button>';
  }
  const isLast = idx === QUIZ.length - 1;
  document.getElementById('quizArea').innerHTML =
    '<div class="q-card">' + tagHtml +
    '<div class="q-text">Q'+(idx+1)+'. ' + q.q + '</div>' +
    '<div id="optsWrap">' + optsHtml + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn secondary" id="prevBtn" ' + (idx===0?'disabled':'') + ' onclick="prevQuestion()">← પાછળ</button>' +
      (isLast
        ? '<button class="btn submit" onclick="confirmSubmit()">✅ SUBMIT TEST</button>'
        : '<button class="btn" onclick="nextQuestion()">આગળનો પ્રશ્ન →</button>') +
    '</div>' +
    '</div>';
}

function selectOption(i){
  answered[idx] = i;
  renderPalette();
  renderQuestion();
}

function prevQuestion(){ if(idx>0){ idx--; renderPalette(); renderQuestion(); } }
function nextQuestion(){ if(idx<QUIZ.length-1){ idx++; renderPalette(); renderQuestion(); } }

function confirmSubmit(){
  const unattempted = answered.filter(function(a){ return a === -1; }).length;
  let msg = 'શું તમે ખરેખર પરીક્ષા સબમિટ કરવા માંગો છો?';
  if(unattempted > 0){ msg += '\n' + unattempted + ' પ્રશ્નો હજુ બાકી છે.'; }
  if(window.confirm(msg)){ submitQuiz(); }
}

function submitQuiz(){
  submitted = true;
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('paletteArea').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  showResult();
}

function showResult(){
  let correct = 0, wrong = 0, unattempted = 0;
  for(let i=0;i<QUIZ.length;i++){
    if(answered[i] === -1) unattempted++;
    else if(answered[i] === QUIZ[i].correct) correct++;
    else wrong++;
  }
  const attempted = QUIZ.length - unattempted;
  const pct = Math.round((correct/QUIZ.length)*100);

  let html = '<div class="result-card">' +
    '<div>તમારો સ્કોર</div><div class="result-score">' + correct + ' / ' + QUIZ.length + '</div>' +
    '<div class="result-grid">' +
      '<div class="result-pill info">કુલ પ્રશ્નો: ' + QUIZ.length + '</div>' +
      '<div class="result-pill info">જવાબ અપાયા: ' + attempted + '</div>' +
      '<div class="result-pill ok">✅ સાચા: ' + correct + '</div>' +
      '<div class="result-pill bad">❌ ખોટા: ' + wrong + '</div>' +
      '<div class="result-pill muted">➖ બાકી: ' + unattempted + '</div>' +
      '<div class="result-pill info">ટકાવારી: ' + pct + '%</div>' +
    '</div>' +
    '<button class="btn full" onclick="restartQuiz()">🔄 Restart Quiz</button>' +
  '</div>';

  html += '<div class="review-title">📋 Answer Review</div>';
  for(let i=0;i<QUIZ.length;i++){
    const q = QUIZ[i];
    const ua = answered[i];
    let tagCls = 'skipped', tagText = '➖ પ્રયાસ કરેલ નથી';
    let yourAnswerLine = 'તમારો જવાબ: પ્રયાસ કરેલ નથી';
    if(ua !== -1){
      const yourLetter = String.fromCharCode(65+ua);
      if(ua === q.correct){ tagCls = 'correct'; tagText = '✅ સાચો જવાબ'; }
      else { tagCls = 'wrong'; tagText = '❌ ખોટો જવાબ'; }
      yourAnswerLine = 'તમારો જવાબ: ' + yourLetter + '. ' + q.opts[ua];
    }
    let optsHtml = '';
    for(let j=0;j<q.opts.length;j++){
      let cls = 'opt-btn review-disabled';
      if(j === q.correct) cls += ' review-correct';
      else if(j === ua) cls += ' review-wrong';
      optsHtml += '<div class="' + cls + '">' + String.fromCharCode(65+j) + '. ' + q.opts[j] + '</div>';
    }
    html += '<div class="review-item">' +
      '<span class="review-tag ' + tagCls + '">' + tagText + '</span>' +
      '<div class="q-text">Q' + (i+1) + '. ' + q.q + '</div>' +
      optsHtml +
      '<div class="explain-box show">' + yourAnswerLine + '<br>✅ સાચો જવાબ: ' + String.fromCharCode(65+q.correct) + '. ' + q.explain + '</div>' +
    '</div>';
  }

  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').innerHTML = html;
}

function restartQuiz(){
  idx = 0; submitted = false; answered = new Array(QUIZ.length).fill(-1);
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('paletteArea').style.display = 'block';
  document.getElementById('startArea').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('plabel').style.display = 'none';
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('paletteArea').innerHTML = '';
  renderStart();
}

renderStart();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1730"><title>Finishing sign-in | PrepGrid</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf0f8,#f8fbff);font-family:system-ui,sans-serif;color:#10213b}.box{max-width:390px;text-align:center;padding:30px;border-radius:24px;background:#ffffffd9;box-shadow:0 20px 60px #142b5020}.spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:#64748b;line-height:1.6;font-size:.9rem}</style></head>
<body><main class="box"><div class="spin" aria-hidden="true"></div><h2>Verifying your sign-in</h2><p id="message" role="status">Please wait while PrepGrid securely connects your account.</p></main>
<script type="module">
const message = document.getElementById("message");
function safeReturnTo(value) {
  if (!value || !value.startsWith("/") || value.startsWith("//")) return "/";
  const u = new URL(value, location.origin);
  if (u.origin !== location.origin || u.pathname.startsWith("/login") || u.pathname.startsWith("/auth/callback")) return "/";
  return u.pathname + u.search + u.hash;
}
const returnTo = safeReturnTo(new URLSearchParams(location.search).get("returnTo"));
try {
  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  const supabase = createClient(
    "https://zrjmflymsbukwvsyqrkl.supabase.co",
    "sb_publishable_mmO4XOewe9A6vS8mkxWg7Q_-fwpbHy5",
    { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
  );
  const { data, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (!data.session?.access_token) throw new Error("Google session was not received. Check the Supabase redirect URL and try again.");
  const response = await fetch("/auth/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: data.session.access_token })
  });
  if (!response.ok) throw new Error("Secure PrepGrid session could not be created (" + response.status + ").");
  location.replace(returnTo);
} catch (error) {
  message.textContent = "Sign-in failed: " + (error?.message || "Please return to login and try again.");
  const link = document.createElement("a");
  link.href = "/login/?returnTo=" + encodeURIComponent(returnTo);
  link.textContent = "Back to Google login";
  link.style.cssText = "display:inline-block;margin-top:12px;color:#2563eb;font-weight:700";
  message.appendChild(document.createElement("br"));
  message.appendChild(link);
}
</script></body></html>

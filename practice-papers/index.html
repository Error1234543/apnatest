<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef5ff">
<title>PrepGrid Practice Papers</title>
<style>
:root{color-scheme:light;--ink:#10213d;--muted:#64748b;--blue:#2563eb;--cyan:#0891b2;--glass:rgba(255,255,255,.78);--line:rgba(255,255,255,.95);--shadow:0 18px 45px -24px rgba(30,64,175,.32)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 5%,#d8f5ff 0,transparent 34%),radial-gradient(circle at 95% 90%,#dce7ff 0,transparent 36%),linear-gradient(135deg,#f8fbff,#e9eff8)}
main{width:min(100% - 28px,1050px);margin:auto;padding:28px 0 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.brand{font-weight:850;letter-spacing:-.04em;font-size:1.08rem}.brand span{display:block;color:var(--cyan);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase}
.back{border:1px solid #dbeafe;background:#ffffffb8;padding:10px 14px;border-radius:13px;text-decoration:none;color:#1d4ed8;font-weight:700}
.hero{padding:26px 4px 20px}.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}h1{font-size:clamp(2rem,7vw,3.5rem);letter-spacing:-.065em;line-height:1.03;margin:10px 0} .sub{color:var(--muted);line-height:1.65;max-width:650px}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px;color:var(--muted);font-size:.86rem}.crumbs button{border:0;background:none;color:#2563eb;font:inherit;font-weight:700;padding:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:15px}
.card{display:block;text-align:left;text-decoration:none;color:inherit;padding:21px;border:1px solid var(--line);border-radius:23px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(18px);min-height:142px;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#93c5fd}.symbol{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#dff7ff,#dbeafe);color:#1d4ed8;font-size:1.2rem;font-weight:900;margin-bottom:15px}
.card h2{font-size:1.05rem;margin:0 0 6px;letter-spacing:-.02em}.card p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.5}
.files{display:grid;gap:11px}.file{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px;border:1px solid var(--line);border-radius:17px;background:var(--glass);box-shadow:var(--shadow)}.file strong{display:block;font-size:.93rem}.file small{display:block;color:var(--muted);margin-top:4px}.open{flex-shrink:0;text-decoration:none;color:white;background:linear-gradient(120deg,#1d4ed8,#0891b2);padding:10px 13px;border-radius:12px;font-weight:800;font-size:.82rem}
.empty{padding:24px;border:1px dashed #a8bdd9;border-radius:18px;color:var(--muted);background:#ffffff80}
footer{margin-top:35px;color:var(--muted);font-size:.78rem;text-align:center}
@media(max-width:520px){main{width:min(100% - 22px,1050px);padding-top:18px}.file{align-items:flex-start}.open{padding:9px 10px}}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand">PrepGrid<span>Official Academy</span></div><a class="back" href="../index.html">← Home</a></header>
<section class="hero"><div class="eyebrow">Study resources • PDFs</div><h1>Practice Papers</h1><p class="sub">Chapter-wise study resources for Standard 11 and 12 — notes, question banks, answer keys, detailed solutions and quick revision sheets.</p></section>
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
<section class="grid" id="grid"></section>
<footer>© 2026 PrepGridoffical Academy</footer>
</main>
<script>
const files=[
 {title:"Question Bank",detail:"Chapter-wise practice questions • PDF",url:"https://filespay.org/tks9u3re3cvv"},
 {title:"Detailed Solutions",detail:"Step-by-step explanations • PDF",url:"https://filespay.org/7sqv8beowfw1"},
 {title:"Revision Sticky Notes",detail:"Quick revision sheets • PDF",url:"https://filespay.org/fl6wv3k0lkum"},
 {title:"Answer Key",detail:"Answers for the question bank • PDF",url:"https://filespay.org/axjy04hjk5yq"},
];
const subjects=["Physics","Chemistry","Biology"];
const titles={"biology":"Biology","physics":"Physics","chemistry":"Chemistry"};
const labels=["Standard 11","Standard 12"];
const grid=document.getElementById("grid"),crumbs=document.getElementById("crumbs");
function go(path){location.hash=path}
function card(title,desc,path,icon="▤"){return '<a class="card" href="#'+path+'"><div class="symbol">'+icon+'</div><h2>'+title+'</h2><p>'+desc+'</p></a>'}
function render(){
 const parts=location.hash.replace(/^#/,"").split("/").filter(Boolean);
 const [level,subject,chapter]=parts;
 const trail=[{name:"Practice Papers",path:""}];
 if(level)trail.push({name:"Standard "+level,path:level});
 if(subject)trail.push({name:titles[subject]||subject,path:level+"/"+subject});
 if(chapter)trail.push({name:"Chapter 01 – The Living World",path:level+"/"+subject+"/"+chapter});
 crumbs.innerHTML=trail.map((x,i)=>i===trail.length-1?'<span>'+x.name+'</span>':'<button data-path="'+x.path+'">'+x.name+'</button><span>›</span>').join("");
 crumbs.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.path)));
 if(!level){grid.innerHTML=labels.map((x,i)=>card(x,"Physics, Chemistry & Biology",""+(i+11),"▣")).join("");return}
 if(!subject){grid.innerHTML=subjects.map(s=>card(s,"Browse "+s+" study material",level+"/"+s.toLowerCase(),"◈")).join("");return}
 if(subject!=="biology"||level!=="11"){grid.innerHTML='<div class="empty">Materials for this section will be added chapter-wise soon.</div>';return}
 if(!chapter){grid.innerHTML=card("Chapter 01 – The Living World","5 study PDFs available","11/biology/chapter-01","01");return}
 grid.innerHTML='<div class="files">'+files.map(f=>'<article class="file"><div><strong>'+f.title+'</strong><small>'+f.detail+'</small></div><a class="open" href="'+f.url+'" target="_blank" rel="noopener noreferrer">Open PDF ↗</a></article>').join("")+'</div>';
}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>

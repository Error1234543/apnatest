<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f"><title>વિદ્યુતભાર અને વિદ્યુતક્ષેત્ર | Champion Series</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173e70,transparent 42%),linear-gradient(145deg,#061329,#10284a);color:#f4f8ff;font-family:system-ui,"Noto Sans Gujarati",sans-serif;min-height:100vh}.top{padding:14px 5%;background:#07152fee;border-bottom:1px solid #29466f;display:flex;justify-content:space-between}.top a{color:#a9bdd8;text-decoration:none;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:24px 16px}.hero,.panel{border:1px solid #31527b;border-radius:22px;background:#102344;padding:22px;margin-bottom:15px}.tag{color:#54d8ed;font-size:11px;font-weight:900}.hero h1{margin:8px 0}.muted{color:#a9bdd8;font-size:13px}.layout{display:grid;grid-template-columns:1fr 240px;gap:14px}.q{font-size:19px;line-height:1.8;margin:20px 0}.opt{display:flex;width:100%;text-align:left;gap:10px;padding:13px;margin:8px 0;border:1px solid #315078;border-radius:13px;background:#10294b;color:#f4f8ff;font:inherit;line-height:1.6}.opt.sel{border-color:#54d8ed;background:#16415b}.opt b{color:#54d8ed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #3b5c83;border-radius:11px;padding:11px 14px;background:#17365d;color:white;font-weight:750}.primary{background:linear-gradient(110deg,#1ba8c2,#3278e6);border:0}.timer{font-size:26px;color:#ffd27a;font-weight:900}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.palette button{padding:8px 0;border-radius:8px;border:1px solid #36577e;background:#10294b;color:white}.palette .done{background:#15523f}.result{display:none}.score{font-size:38px;color:#63dfad;font-weight:900}.review{border-top:1px solid #29466f;padding:12px 0;line-height:1.7}.good{color:#63dfad}.bad{color:#ff8290}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}.palette{grid-template-columns:repeat(10,1fr)}}@media(max-width:450px){.palette{grid-template-columns:repeat(5,1fr)}.q{font-size:17px}}</style></head><body><header class="top"><b>PREPGRID <span style="color:#54d8ed">CHAMPION SERIES</span></b><a href="../index.html">← વિષય પર પાછા</a></header><main class="wrap"><section class="hero"><div class="tag">NCERT BASED · NEET UG · ગુજરાતી</div><h1>ધોરણ 12 · ભૌતિકવિજ્ઞાન</h1><p>પ્રકરણ 01 — વિદ્યુતભાર અને વિદ્યુતક્ષેત્ર · પ્રેક્ટિસ ટેસ્ટ</p><p class="muted">10 MCQ · +4 / −1 · 15 મિનિટ · દરેક જવાબ સાથે સમજૂતી</p></section><div class="layout"><section class="panel" id="test"><div class="muted" id="count"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="btn" id="prev">← પાછલું</button><button class="btn primary" id="next">આગળ →</button><button class="btn primary" id="submit">સબમિટ</button></div></section><aside class="panel side"><div class="tag">બાકી સમય</div><div class="timer" id="timer">15:00</div><p class="muted">પ્રશ્ન સૂચિ</p><div class="palette" id="palette"></div><p class="muted">લીલો = જવાબ આપ્યો</p></aside></div><section class="panel result" id="result"><div class="tag">તમારું પરિણામ</div><div class="score" id="score"></div><p id="summary"></p><div id="review"></div><button class="btn primary" onclick="location.reload()">ફરી ટેસ્ટ આપો</button></section></main>
<script>const bank=[["વિદ્યુતભારનું SI એકમ કયું?",["એમ્પિયર","કુલંબ","વોલ્ટ","ફૅરાડ"],1,"વિદ્યુતભારનું SI એકમ કુલંબ (C) છે."],["કુલંબનો નિયમ માધ્યમમાં બિંદુભાર માટે બળ કઈ રાશિ સાથે વ્યસ્ત પ્રમાણમાં છે?",["અંતર","અંતરના વર્ગ","ભાર","ભારના વર્ગ"],1,"બળનું પરિમાણ q₁q₂/r² ને અનુરૂપ છે."],["વિદ્યુતક્ષેત્રની SI એકમ કઈ?",["N C⁻¹","C N⁻¹","J C","N m"],0,"E = F/q, તેથી N C⁻¹."],["વિદ્યુતક્ષેત્ર રેખાઓ એકબીજાને કેમ કાપતી નથી?",["કારણ કે ક્ષેત્ર શૂન્ય હોય છે","એક બિંદુએ ક્ષેત્રની દિશા એક જ હોય છે","રેખાઓ સીધી જ હોય છે","ભાર માત્ર ધન હોય છે"],1,"છેદ થાય તો એક જ બિંદુએ ક્ષેત્રની બે દિશાઓ થાય, જે અશક્ય છે."],["વિદ્યુત દ્વિધ્રુવ આઘૂર્ણની દિશા કઈ?",["ધનથી ઋણ","ઋણથી ધન","ક્ષેત્રની વિરુદ્ધ","હંમેશાં શૂન્ય"],1,"દ્વિધ્રુવ આઘૂર્ણ ઋણભારથી ધનભાર તરફ નિર્દેશિત છે."],["બંધ સપાટીમાંથી કુલ વિદ્યુત ફ્લક્સ કયા પર આધારિત છે?",["સપાટીનો આકાર","અંદરનો કુલ ભાર","બહારના ભારનું મૂલ્ય","સપાટીનું ક્ષેત્રફળ જ"],1,"ગૉસના નિયમ મુજબ કુલ ફ્લક્સ અંદરના કુલ ભાર/ε₀ બરાબર છે."],["સ્થિર વિદ્યુત સમતુલામાં વાહકની અંદર વિદ્યુતક્ષેત્ર કેટલું?",["શૂન્ય","અનંત","સપાટી જેટલું","ભારના પ્રમાણમાં"],0,"સ્થિર સમતુલામાં વાહકની અંદર મુક્ત ભારનું પુનર્વિતરણ ક્ષેત્રને શૂન્ય કરે છે."],["એકલ ધન બિંદુભારની ક્ષેત્રરેખાઓ કઈ દિશામાં જાય?",["અંદર તરફ","બહાર તરફ","વર્તુળાકાર","સમાંતર"],1,"ધનભારથી ક્ષેત્રરેખાઓ બહાર નીકળે છે."],["વિદ્યુતક્ષેત્રમાં ડાઇપોલ પર ટોર્ક મહત્તમ ક્યારે?",["p અને E સમાંતર","p અને E લંબ","p અને E વિરુદ્ધ સમાંતર","ક્ષેત્ર શૂન્ય"],1,"τ = pE sinθ; θ = 90° પર મહત્તમ."],["ગૉસના નિયમમાં બંધ સપાટીનો કુલ ફ્લક્સ કઈ બાબતથી સ્વતંત્ર છે?",["અંદરના કુલ ભાર","ε₀","સપાટીનો આકાર અને કદ","ફ્લક્સનું ચિહ્ન"],2,"બંધ સપાટીનો ફ્લક્સ અંદરના કુલ ભાર પર આધારિત છે, સપાટીના આકાર પર નહીં."]];let at=0,ans=Array(bank.length).fill(null),left=900,done=false;const $=x=>document.getElementById(x);function draw(){let q=bank[at];$('count').textContent='પ્રશ્ન '+(at+1)+' / '+bank.length;$('question').textContent=q[0];$('opts').innerHTML='';q[1].forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(ans[at]===i?' sel':'');let x=document.createElement('b');x.textContent='ABCD'[i];let t=document.createElement('span');t.textContent=v;b.append(x,t);b.onclick=()=>{if(!done){ans[at]=i;draw()}};$('opts').append(b)});$('prev').disabled=at===0;$('next').disabled=at===bank.length-1;$('palette').innerHTML='';bank.forEach((_,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=ans[i]!==null?'done':'';b.onclick=()=>{at=i;draw()};$('palette').append(b)})}$('prev').onclick=()=>{at--;draw()};$('next').onclick=()=>{at++;draw()};function finish(){if(done)return;done=true;clearInterval(tick);let right=0,wrong=0;bank.forEach((q,i)=>{if(ans[i]===q[2])right++;else if(ans[i]!==null)wrong++});$('test').style.display='none';document.querySelector('.side').style.display='none';$('result').style.display='block';$('score').textContent=(right*4-wrong)+' / '+(bank.length*4);$('summary').textContent='સાચા: '+right+' · ખોટા: '+wrong+' · છોડેલા: '+(bank.length-right-wrong);$('review').innerHTML='';bank.forEach((q,i)=>{let d=document.createElement('div');d.className='review';let h=document.createElement('b');h.textContent=(i+1)+'. '+q[0];let p=document.createElement('p');p.textContent='તમારો જવાબ: '+(ans[i]===null?'છોડ્યો':q[1][ans[i]])+' · સાચો જવાબ: '+q[1][q[2]];p.className=ans[i]===q[2]?'good':'bad';let e=document.createElement('p');e.textContent='સમજૂતી: '+q[3];d.append(h,p,e);$('review').append(d)})}$('submit').onclick=()=>{if(confirm('ટેસ્ટ સબમિટ કરવો છે?'))finish()};const tick=setInterval(()=>{if(done)return;left--;$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)finish()},1000);draw();</script></body></html>

<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f"><title>દ્રાવણો | Champion Series</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173e70,transparent 42%),linear-gradient(145deg,#061329,#10284a);color:#f4f8ff;font-family:system-ui,"Noto Sans Gujarati",sans-serif;min-height:100vh}.top{padding:14px 5%;background:#07152fee;border-bottom:1px solid #29466f;display:flex;justify-content:space-between}.top a{color:#a9bdd8;text-decoration:none;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:24px 16px}.hero,.panel{border:1px solid #31527b;border-radius:22px;background:#102344;padding:22px;margin-bottom:15px}.tag{color:#54d8ed;font-size:11px;font-weight:900}.hero h1{margin:8px 0}.muted{color:#a9bdd8;font-size:13px}.layout{display:grid;grid-template-columns:1fr 240px;gap:14px}.q{font-size:19px;line-height:1.8;margin:20px 0}.opt{display:flex;width:100%;text-align:left;gap:10px;padding:13px;margin:8px 0;border:1px solid #315078;border-radius:13px;background:#10294b;color:#f4f8ff;font:inherit;line-height:1.6}.opt.sel{border-color:#54d8ed;background:#16415b}.opt b{color:#54d8ed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #3b5c83;border-radius:11px;padding:11px 14px;background:#17365d;color:white;font-weight:750}.primary{background:linear-gradient(110deg,#1ba8c2,#3278e6);border:0}.timer{font-size:26px;color:#ffd27a;font-weight:900}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.palette button{padding:8px 0;border-radius:8px;border:1px solid #36577e;background:#10294b;color:white}.palette .done{background:#15523f}.result{display:none}.score{font-size:38px;color:#63dfad;font-weight:900}.review{border-top:1px solid #29466f;padding:12px 0;line-height:1.7}.good{color:#63dfad}.bad{color:#ff8290}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}.palette{grid-template-columns:repeat(10,1fr)}}@media(max-width:450px){.palette{grid-template-columns:repeat(5,1fr)}.q{font-size:17px}}</style></head><body><header class="top"><b>PREPGRID <span style="color:#54d8ed">CHAMPION SERIES</span></b><a href="../index.html">← વિષય પર પાછા</a></header><main class="wrap"><section class="hero"><div class="tag">NCERT BASED · NEET UG · ગુજરાતી</div><h1>ધોરણ 12 · રસાયણવિજ્ઞાન</h1><p>પ્રકરણ 01 — દ્રાવણો · પ્રેક્ટિસ ટેસ્ટ</p><p class="muted">10 MCQ · +4 / −1 · 15 મિનિટ · દરેક જવાબ સાથે સમજૂતી</p></section><div class="layout"><section class="panel" id="test"><div class="muted" id="count"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="btn" id="prev">← પાછલું</button><button class="btn primary" id="next">આગળ →</button><button class="btn primary" id="submit">સબમિટ</button></div></section><aside class="panel side"><div class="tag">બાકી સમય</div><div class="timer" id="timer">15:00</div><p class="muted">પ્રશ્ન સૂચિ</p><div class="palette" id="palette"></div><p class="muted">લીલો = જવાબ આપ્યો</p></aside></div><section class="panel result" id="result"><div class="tag">તમારું પરિણામ</div><div class="score" id="score"></div><p id="summary"></p><div id="review"></div><button class="btn primary" onclick="location.reload()">ફરી ટેસ્ટ આપો</button></section></main>
<script>const bank=[["મોલારિટીનું SI-સંબંધિત એકમ શું છે?",["mol kg⁻¹","mol L⁻¹","g mol⁻¹","kg mol⁻¹"],1,"મોલારિટી દ્રાવણના પ્રતિ લિટર દ્રાવ્યના મોલ છે."],["તાપમાન બદલાતાં કઈ સાંદ્રતા સામાન્ય રીતે બદલાતી નથી?",["મોલારિટી","મોલાલિટી","વોલ્યુમ ટકા","મોલ અંશ પ્રતિ લિટર"],1,"મોલાલિટી દ્રાવકના દળ પર આધારિત હોવાથી તાપમાનથી લગભગ સ્વતંત્ર છે."],["રાઉલ્ટના નિયમ મુજબ આદર્શ દ્રાવણમાં ઘટકનું આંશિક વરાળદબાણ શું છે?",["pᵢ=xᵢpᵢ°","pᵢ=pᵢ°/xᵢ","pᵢ=xᵢ/pᵢ°","pᵢ=pᵢ°−xᵢ"],0,"આંશિક દબાણ = પ્રવાહી અવસ્થાનો મોલ અંશ × શુદ્ધ ઘટકનું વરાળદબાણ."],["અવાષ્પશીલ દ્રાવ્ય ઉમેરવાથી દ્રાવકનું વરાળદબાણ શું થાય?",["વધે","ઘટે","અચળ રહે","શૂન્ય થાય"],1,"દ્રાવ્યના કારણે દ્રાવકનો મોલ અંશ ઘટે છે અને વરાળદબાણ ઘટે છે."],["સમાન તાપમાને સમપરાસરી દ્રાવણોનું કયું ગુણધર્મ સમાન હોય છે?",["રંગ","પરાસરણ દબાણ","ઘનતા","pH હંમેશાં"],1,"સમપરાસરી દ્રાવણોનું osmotic pressure સમાન હોય છે."],["વાન્ટ હોફ ગુણાંક i ક્યારે 1 થી મોટો હોઈ શકે?",["સંયોજનથી","વિઘટનથી","કોઈ પ્રક્રિયા ન થાય ત્યારે જ","દ્રાવક બાષ્પીભવનથી"],1,"ઇલેક્ટ્રોલાઇટના વિઘટનથી કણોની સંખ્યા વધે છે અને i > 1 થઈ શકે."],["હેન્રીના નિયમ મુજબ ગૅસની દ્રાવ્યતા કયા સાથે સીધા પ્રમાણમાં છે?",["તાપમાન જ","દ્રાવણ ઉપર ગૅસનું આંશિક દબાણ","દ્રાવકનું ઘનફળ","દ્રાવ્યનું મોલર દળ"],1,"નિશ્ચિત તાપમાને ગૅસની દ્રાવ્યતા તેના આંશિક દબાણને અનુરૂપ છે."],["કોલિગેટિવ ગુણધર્મો મુખ્યત્વે શેના પર આધારિત છે?",["દ્રાવ્ય કણોની સંખ્યા","દ્રાવ્યની રાસાયણિક ઓળખ","દ્રાવણનો રંગ","દ્રાવકનું નામ"],0,"કોલિગેટિવ ગુણધર્મો દ્રાવ્ય કણોની સંખ્યા પર આધારિત છે, તેમની ઓળખ પર નહીં."],["આદર્શ દ્રાવણ મિશ્રણ દરમિયાન કઈ શરત સંતોષે છે?",["ΔHmix=0 અને ΔVmix=0","ΔHmix>0","ΔVmix<0","બંને અનંત"],0,"આદર્શ દ્રાવણમાં મિશ્રણની એન્થાલ્પી અને આયતન ફેરફાર શૂન્ય હોય છે."],["પરાસરણ દબાણનું સમીકરણ પાતળા દ્રાવણ માટે કયું?",["π=CRT","π=C/RT","π=RT/C","π=CR/T"],0,"વાન્ટ હોફ સમીકરણ મુજબ π = C R T."]];let at=0,ans=Array(bank.length).fill(null),left=900,done=false;const $=x=>document.getElementById(x);function draw(){let q=bank[at];$('count').textContent='પ્રશ્ન '+(at+1)+' / '+bank.length;$('question').textContent=q[0];$('opts').innerHTML='';q[1].forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(ans[at]===i?' sel':'');let x=document.createElement('b');x.textContent='ABCD'[i];let t=document.createElement('span');t.textContent=v;b.append(x,t);b.onclick=()=>{if(!done){ans[at]=i;draw()}};$('opts').append(b)});$('prev').disabled=at===0;$('next').disabled=at===bank.length-1;$('palette').innerHTML='';bank.forEach((_,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=ans[i]!==null?'done':'';b.onclick=()=>{at=i;draw()};$('palette').append(b)})}$('prev').onclick=()=>{at--;draw()};$('next').onclick=()=>{at++;draw()};function finish(){if(done)return;done=true;clearInterval(tick);let right=0,wrong=0;bank.forEach((q,i)=>{if(ans[i]===q[2])right++;else if(ans[i]!==null)wrong++});$('test').style.display='none';document.querySelector('.side').style.display='none';$('result').style.display='block';$('score').textContent=(right*4-wrong)+' / '+(bank.length*4);$('summary').textContent='સાચા: '+right+' · ખોટા: '+wrong+' · છોડેલા: '+(bank.length-right-wrong);$('review').innerHTML='';bank.forEach((q,i)=>{let d=document.createElement('div');d.className='review';let h=document.createElement('b');h.textContent=(i+1)+'. '+q[0];let p=document.createElement('p');p.textContent='તમારો જવાબ: '+(ans[i]===null?'છોડ્યો':q[1][ans[i]])+' · સાચો જવાબ: '+q[1][q[2]];p.className=ans[i]===q[2]?'good':'bad';let e=document.createElement('p');e.textContent='સમજૂતી: '+q[3];d.append(h,p,e);$('review').append(d)})}$('submit').onclick=()=>{if(confirm('ટેસ્ટ સબમિટ કરવો છે?'))finish()};const tick=setInterval(()=>{if(done)return;left--;$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)finish()},1000);draw();</script></body></html>

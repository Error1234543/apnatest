<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f"><title>ફૂલધારી વનસ્પતિઓમાં લૈંગિક પ્રજનન | Champion Series</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173e70,transparent 42%),linear-gradient(145deg,#061329,#10284a);color:#f4f8ff;font-family:system-ui,"Noto Sans Gujarati",sans-serif;min-height:100vh}.top{padding:14px 5%;background:#07152fee;border-bottom:1px solid #29466f;display:flex;justify-content:space-between}.top a{color:#a9bdd8;text-decoration:none;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:24px 16px}.hero,.panel{border:1px solid #31527b;border-radius:22px;background:#102344;padding:22px;margin-bottom:15px}.tag{color:#54d8ed;font-size:11px;font-weight:900}.hero h1{margin:8px 0}.muted{color:#a9bdd8;font-size:13px}.layout{display:grid;grid-template-columns:1fr 240px;gap:14px}.q{font-size:19px;line-height:1.8;margin:20px 0}.opt{display:flex;width:100%;text-align:left;gap:10px;padding:13px;margin:8px 0;border:1px solid #315078;border-radius:13px;background:#10294b;color:#f4f8ff;font:inherit;line-height:1.6}.opt.sel{border-color:#54d8ed;background:#16415b}.opt b{color:#54d8ed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #3b5c83;border-radius:11px;padding:11px 14px;background:#17365d;color:white;font-weight:750}.primary{background:linear-gradient(110deg,#1ba8c2,#3278e6);border:0}.timer{font-size:26px;color:#ffd27a;font-weight:900}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.palette button{padding:8px 0;border-radius:8px;border:1px solid #36577e;background:#10294b;color:white}.palette .done{background:#15523f}.result{display:none}.score{font-size:38px;color:#63dfad;font-weight:900}.review{border-top:1px solid #29466f;padding:12px 0;line-height:1.7}.good{color:#63dfad}.bad{color:#ff8290}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}.palette{grid-template-columns:repeat(10,1fr)}}@media(max-width:450px){.palette{grid-template-columns:repeat(5,1fr)}.q{font-size:17px}}</style></head><body><header class="top"><b>PREPGRID <span style="color:#54d8ed">CHAMPION SERIES</span></b><a href="../index.html">← વિષય પર પાછા</a></header><main class="wrap"><section class="hero"><div class="tag">NCERT BASED · NEET UG · ગુજરાતી</div><h1>ધોરણ 12 · જીવવિજ્ઞાન</h1><p>પ્રકરણ 01 — ફૂલધારી વનસ્પતિઓમાં લૈંગિક પ્રજનન · પ્રેક્ટિસ ટેસ્ટ</p><p class="muted">10 MCQ · +4 / −1 · 15 મિનિટ · દરેક જવાબ સાથે સમજૂતી</p></section><div class="layout"><section class="panel" id="test"><div class="muted" id="count"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="btn" id="prev">← પાછલું</button><button class="btn primary" id="next">આગળ →</button><button class="btn primary" id="submit">સબમિટ</button></div></section><aside class="panel side"><div class="tag">બાકી સમય</div><div class="timer" id="timer">15:00</div><p class="muted">પ્રશ્ન સૂચિ</p><div class="palette" id="palette"></div><p class="muted">લીલો = જવાબ આપ્યો</p></aside></div><section class="panel result" id="result"><div class="tag">તમારું પરિણામ</div><div class="score" id="score"></div><p id="summary"></p><div id="review"></div><button class="btn primary" onclick="location.reload()">ફરી ટેસ્ટ આપો</button></section></main>
<script>const bank=[["પરાગકણનું નિર્માણ કયા ભાગમાં થાય છે?",["પરાગાશય","પરાગવાહિની","બીજાશય","બીજાંડ"],0,"પરાગાશયના પરાગકોથળામાં સૂક્ષ્મબીજાણુઓથી પરાગકણ બને છે."],["પરિપક્વ ભ્રૂણપુટ સામાન્ય રીતે કેટલા કોષો અને કેન્દ્રકો ધરાવે છે?",["7 કોષો, 8 કેન્દ્રકો","8 કોષો, 7 કેન્દ્રકો","8 કોષો, 8 કેન્દ્રકો","7 કોષો, 7 કેન્દ્રકો"],0,"સામાન્ય Polygonum પ્રકારનો ભ્રૂણપુટ 7-કોષીય અને 8-કેન્દ્રકીય છે."],["દ્વિગર્ભાધાનમાં કઈ બે ઘટનાઓ થાય છે?",["પરાગણ અને અંકુરણ","સિંગૅમી અને ત્રિગુણન","મિયોસિસ અને માઇટોસિસ","બીજાણુજનન અને ફળન"],1,"એક નર જન્યુ સાથે અંડકોષનું સંયોજન સિંગૅમી અને બીજા સાથે ધ્રુવીય કેન્દ્રકોનું સંયોજન ત્રિગુણન છે."],["ત્રિગુણન પછી સામાન્ય રીતે કઈ રચના બને છે?",["યુગ્મનજ","પ્રાથમિક અંતઃસ્તર કેન્દ્રક","અંડકોષ","પરાગનળી"],1,"ત્રણ હેપ્લોઇડ કેન્દ્રકોના સંયોજનથી 3n પ્રાથમિક અંતઃસ્તર કેન્દ્રક બને છે."],["પરાગણ એટલે શું?",["પરાગકણનું પરાગાશયથી પરાગાસન પર સ્થાનાંતરણ","પરાગનળીનું બીજાંડમાં પ્રવેશવું","યુગ્મનજનું વિભાજન","બીજનું અંકુરણ"],0,"પરાગણમાં પરાગાશયમાંથી પરાગાસન સુધી પરાગકણ પહોંચે છે."],["સ્વ-અસંગતતા (self-incompatibility) નો મુખ્ય પરિણામ શું?",["સ્વપરાગણને પ્રોત્સાહન","સ્વપરાગણ દ્વારા નિષેચન અટકાવવું","બીજાણુ ન બનવા દેવું","ફળનું વિઘટન"],1,"આનુવંશિક નિયંત્રણથી સ્વપરાગકણનું અંકુરણ અથવા વૃદ્ધિ અટકાવી શકાય છે."],["અંડકમાં માઇક્રોપાઇલ કયા કાર્યમાં મદદરૂપ થાય છે?",["પરાગનળીના પ્રવેશમાં","બીજાવરણ તોડવામાં","ફળની રચનામાં","પરાગકણના નિર્માણમાં"],0,"ઘણા આવૃતબીજીઓમાં પરાગનળી માઇક્રોપાઇલ દ્વારા અંડકમાં પ્રવેશે છે."],["બીજમાં ભ્રૂણ કઈ રચનામાંથી વિકસે છે?",["પ્રાથમિક અંતઃસ્તર કેન્દ્રક","યુગ્મનજ","સિનર્જિડ","પ્રતિમુખ કોષ"],1,"નિષેચન પછી યુગ્મનજ વિભાજિત થઈ ભ્રૂણ બનાવે છે."],["અંતઃસ્તર (endosperm) નું મુખ્ય કાર્ય શું?",["ભ્રૂણને પોષણ આપવું","પરાગકણ બનાવવું","પરાગણ કરવું","બીજાવરણ બનાવવું"],0,"અંતઃસ્તર વિકાસશીલ ભ્રૂણને પોષક પદાર્થો પૂરા પાડે છે."],["પરાગકણની બાહ્ય દીવાલમાં સ્પોરોપોલેનિન ક્યાં હોય છે?",["એક્સાઇન","ઇન્ટાઇન","જનરેટિવ કોષ","વનસ્પતિ કોષ"],0,"એક્સાઇનમાં સ્પોરોપોલેનિન હોય છે, જે અત્યંત પ્રતિરોધક પદાર્થ છે."]];let at=0,ans=Array(bank.length).fill(null),left=900,done=false;const $=x=>document.getElementById(x);function draw(){let q=bank[at];$('count').textContent='પ્રશ્ન '+(at+1)+' / '+bank.length;$('question').textContent=q[0];$('opts').innerHTML='';q[1].forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(ans[at]===i?' sel':'');let x=document.createElement('b');x.textContent='ABCD'[i];let t=document.createElement('span');t.textContent=v;b.append(x,t);b.onclick=()=>{if(!done){ans[at]=i;draw()}};$('opts').append(b)});$('prev').disabled=at===0;$('next').disabled=at===bank.length-1;$('palette').innerHTML='';bank.forEach((_,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=ans[i]!==null?'done':'';b.onclick=()=>{at=i;draw()};$('palette').append(b)})}$('prev').onclick=()=>{at--;draw()};$('next').onclick=()=>{at++;draw()};function finish(){if(done)return;done=true;clearInterval(tick);let right=0,wrong=0;bank.forEach((q,i)=>{if(ans[i]===q[2])right++;else if(ans[i]!==null)wrong++});$('test').style.display='none';document.querySelector('.side').style.display='none';$('result').style.display='block';$('score').textContent=(right*4-wrong)+' / '+(bank.length*4);$('summary').textContent='સાચા: '+right+' · ખોટા: '+wrong+' · છોડેલા: '+(bank.length-right-wrong);$('review').innerHTML='';bank.forEach((q,i)=>{let d=document.createElement('div');d.className='review';let h=document.createElement('b');h.textContent=(i+1)+'. '+q[0];let p=document.createElement('p');p.textContent='તમારો જવાબ: '+(ans[i]===null?'છોડ્યો':q[1][ans[i]])+' · સાચો જવાબ: '+q[1][q[2]];p.className=ans[i]===q[2]?'good':'bad';let e=document.createElement('p');e.textContent='સમજૂતી: '+q[3];d.append(h,p,e);$('review').append(d)})}$('submit').onclick=()=>{if(confirm('ટેસ્ટ સબમિટ કરવો છે?'))finish()};const tick=setInterval(()=>{if(done)return;left--;$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)finish()},1000);draw();</script></body></html>

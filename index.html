
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<title>Under Maintenance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:24px;text-align:center;
font-family:Arial,sans-serif;color:#fff;
background:radial-gradient(ellipse at top,#142a50,#070b18 65%);
}
.card{
max-width:440px;width:100%;padding:40px 24px;
border:1px solid #ffffff20;border-radius:28px;
background:#ffffff09;backdrop-filter:blur(18px);
box-shadow:0 20px 70px #0005;
}
.icon{font-size:54px;margin-bottom:24px}
h1{font-size:30px;margin-bottom:16px}
p{color:#b8c2d8;line-height:1.7;font-size:15px}
.loader{
width:42px;height:42px;margin:28px auto;
border:4px solid #ffffff20;border-top-color:#60a5fa;
border-radius:50%;animation:spin 1s linear infinite;
}
small{color:#7786a3}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛠️</div>
  <h1>Under Maintenance</h1>
  <p>We're upgrading our website to serve you better.</p>
  <p>Please check back soon. We'll be live again shortly!</p>
  <div class="loader"></div>
  <small>Thank you for your patience ❤️</small>
</div>
</body>
</html>

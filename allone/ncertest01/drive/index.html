<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>PDF Preview | PrepGridHub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#fff}
body{display:flex;flex-direction:column}.bar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#101a35;border-bottom:1px solid #26365d}
.back{color:#fff;text-decoration:none;font-size:25px;line-height:1;padding:6px}.heading{min-width:0;flex:1}.heading strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heading small{display:block;color:#a9b9da;font-size:11px;margin-top:2px}
.download{color:#fff;text-decoration:none;background:#2563eb;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:750;white-space:nowrap}
.viewer{position:relative;flex:1;min-height:0;background:#202124}.viewer iframe{display:block;width:100%;height:100%;border:0;background:#202124}
.message{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:28px;text-align:center;color:#dbeafe;font-size:14px}
@media(max-width:420px){.bar{height:54px;flex-basis:54px;padding:0 8px;gap:7px}.heading strong{font-size:12px}.download{padding:8px 9px;font-size:11px}}
</style>
</head>
<body>
<header class="bar">
<a class="back" href="javascript:history.back()" aria-label="Go back">‹</a>
<div class="heading"><strong id="fileTitle">PrepGridHub PDF</strong><small>PDF Preview · PrepGridHub</small></div>
<a class="download" id="downloadBtn" href="#" target="_blank" rel="noopener">Download</a>
</header>
<main class="viewer">
<iframe id="pdfFrame" title="PDF document preview" allow="autoplay"></iframe>
<div class="message" id="errorMsg">PDF link is missing or invalid. Please return to the chapter list and tap Preview PDF again.</div>
</main>
<script>
(function(){
 const p=new URLSearchParams(location.search);
 const id=p.get('file')||'';
 const title=p.get('title')||'PrepGridHub PDF';
 const safeTitle=title.replace(/[<>]/g,'').slice(0,140);
 document.title=safeTitle+' | PrepGridHub';
 document.getElementById('fileTitle').textContent=safeTitle;
 if(!/^[A-Za-z0-9_-]{10,}$/.test(id)){
   document.getElementById('errorMsg').style.display='flex';
   document.getElementById('downloadBtn').style.display='none';
   return;
 }
 document.getElementById('pdfFrame').src='https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview';
 document.getElementById('downloadBtn').href='https://drive.google.com/uc?export=download&id='+encodeURIComponent(id);
})();
</script>
</body>
</html>

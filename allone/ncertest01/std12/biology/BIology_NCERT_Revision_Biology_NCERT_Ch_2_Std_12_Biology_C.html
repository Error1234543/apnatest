<style>

  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#e2e8f0; --muted:#94a3b8; --line:#243047; --bg:#0b1220; --card:#121b2e; }
}
:root[data-theme="dark"]{ --ink:#e2e8f0; --muted:#94a3b8; --line:#243047; --bg:#0b1220; --card:#121b2e; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans Gujarati",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bg)}
header.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(11,37,69,.25)}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img.logo{height:34px;width:auto;border-radius:6px;background:#fff;padding:2px}
.brand .wordmark{font-weight:800;letter-spacing:.6px;font-size:16px;white-space:nowrap}
.brand .wordmark b{color:var(--gold)}
.ttl{flex:1;min-width:0;font-weight:600;font-size:15px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-size:15px;white-space:nowrap}
.clock small{opacity:.75;font-weight:600;margin-right:6px;letter-spacing:.4px;font-size:11px;text-transform:uppercase}
.theme{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12px}
main{max-width:1180px;margin:18px auto;padding:0 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){ main{grid-template-columns:1fr} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.stats{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;grid-column:1/-1}
.chip{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink)}
.chip.ok b{color:var(--ok)} .chip.mark b{color:var(--mark)} .chip.skip b{color:var(--muted)}
.qwrap{padding:22px 22px 18px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.qno{font-weight:800;color:var(--navy);font-size:14px;letter-spacing:.4px;text-transform:uppercase}
.dark-qno .qno{color:#93c5fd}
.flag{font-size:12px;font-weight:700;color:var(--mark);display:none}
.flag.on{display:inline-block}
.qtext{font-size:17px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;font-family:"Inter","Noto Sans Gujarati",system-ui,sans-serif;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s,transform .05s;text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{border-color:#93c5fd}
.opt:active{transform:scale(.995)}
.opt .k{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--navy)}
.opt .t{flex:1;white-space:pre-wrap;word-wrap:break-word;line-height:1.55;font-size:15.5px;font-family:"Inter","Noto Sans Gujarati",system-ui,sans-serif}
.opt.sel{border-color:var(--navy);background:rgba(19,49,92,.06);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.sel .k{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:10px 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:#94a3b8}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1f1300}
.btn.ghost{background:transparent}
.btn.mark-on{border-color:var(--mark);color:var(--mark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
aside.card{padding:16px;position:sticky;top:90px}
@media (max-width:860px){ aside.card{position:static} }
aside h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px}
.pq{height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.pq.answered{background:var(--ok);border-color:var(--ok);color:#fff}
.pq.mark{background:var(--mark);border-color:var(--mark);color:#fff}
.pq.cur{outline:2px solid var(--gold);outline-offset:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--card);border:1.5px solid var(--line)}
.legend .l-a::before{background:var(--ok);border-color:var(--ok)} .legend .l-m::before{background:var(--mark);border-color:var(--mark)}
.submitbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.submitbox .btn{width:100%}
.hidden{display:none !important}
/* result */
#result{grid-column:1/-1;padding:26px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.score{font-size:46px;font-weight:800;color:var(--navy);line-height:1}
.score small{font-size:18px;color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0 8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.sk .v{color:var(--muted)}
.review{margin-top:18px;display:grid;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;background:var(--card)}
.rv .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700}
.tag.ok{background:#dcfce7;color:#166534} .tag.bad{background:#fee2e2;color:#991b1b} .tag.sk{background:#e2e8f0;color:#334155}
.rv .qt{white-space:pre-wrap;line-height:1.55;font-family:"Inter","Noto Sans Gujarati",system-ui,sans-serif;font-size:14.5px}
.rv .meta{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
footer{max-width:1180px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:12px;text-align:center}
dialog{border:none;border-radius:16px;padding:22px;max-width:380px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(2,6,23,.55)}
dialog h4{margin:0 0 8px;font-size:17px}
dialog p{margin:0 0 16px;color:var(--muted);line-height:1.5;font-size:14.5px}
.dl{display:flex;gap:10px;justify-content:flex-end}
@media print{ header.top,aside,.nav,.actions,footer,dialog{display:none !important} main{display:block} #result{display:block !important} }
</style>
</head>

  return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);

    if (v === it.a) { correct++; return "correct"; }
    wrong++; return "wrong";

      kpi("Avg per question", fmtElapsed(avg), "") +
    '</div>' +
    '<div class="actions"><button class="btn primary" id="dlRes" type="button">Download result</button>' +
      '<button class="btn" id="back" type="button">Review answers</button>' +
      '<button class="btn gold" id="restart" type="button">Restart test</button></div>' +
    '<div class="review" id="review">' + rows + '</div>';
  res.classList.remove("hidden");
  document.getElementById("dlRes").addEventListener("click", downloadResult);
  document.getElementById("back").addEventListener("click", () => {
    document.getElementById("review").scrollIntoView({ behavior: "smooth" });
  });
  document.getElementById("restart").addEventListener("click", restart);
  window.scrollTo(0, 0);
}
function kpi(label, value, cls) { return '<div class="kpi ' + cls + '"><div class="v">' + value + '</div><div class="l">' + label + '</div></div>'; }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function downloadResult() {
  const sc = scoreCtest(DATA.items, st.sel);
  const lines = [DATA.title, "PREPGRIDHUB chapter test", "",
    "Score: " + sc.correct + " / " + N, "Correct: " + sc.correct, "Wrong: " + sc.wrong,
    "Not answered: " + sc.skipped, "Accuracy: " + sc.accuracy + "%", "Time taken: " + fmtElapsed(st.elapsed), ""];
  DATA.items.forEach((it, i) => {
    lines.push("Q" + (i + 1) + ". " + it.q);
    it.o.forEach((o, j) => lines.push("   " + LETTERS[j] + ". " + o));
    lines.push("   Your answer: " + (st.sel[i] >= 0 ? LETTERS[st.sel[i]] : "-") + " | Correct: " + LETTERS[it.a] +
      " | " + sc.perQ[i] + " | time " + fmtElapsed(st.spent[i]), "");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = DATA.title.replace(/[\\/:*?"<>|]+/g, " ").trim() + " - result.txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function restart() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  st = { sel: new Array(N).fill(-1), mark: new Array(N).fill(false), spent: new Array(N).fill(0),
         cur: 0, elapsed: 0, runningSince: null, qSince: null, submitted: false };
  document.getElementById("result").classList.add("hidden");
  document.getElementById("testCard").classList.remove("hidden");
  document.querySelector("aside").classList.remove("hidden");
  startTest();
}

document.getElementById("prev").addEventListener("click", () => goTo(st.cur - 1));
document.getElementById("next").addEventListener("click", () => goTo(st.cur + 1));
document.getElementById("clearBtn").addEventListener("click", () => { if (!st.submitted) { st.sel[st.cur] = -1; save(); render(); } });
document.getElementById("markBtn").addEventListener("click", () => { if (!st.submitted) { st.mark[st.cur] = !st.mark[st.cur]; save(); render(); } });
document.getElementById("submitBtn").addEventListener("click", () => { render(); document.getElementById("confirm").showModal(); });
document.getElementById("cancelSubmit").addEventListener("click", () => document.getElementById("confirm").close());
document.getElementById("doSubmit").addEventListener("click", () => { document.getElementById("confirm").close(); submitTest(); });
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" || (!root.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
  document.getElementById("theme").textContent = dark ? "Dark" : "Light";
});

load();
if (st.submitted) { document.getElementById("ttl").textContent = DATA.title; showResult(); }
else { startTest(); }
setInterval(() => { document.getElementById("clock").textContent = fmtElapsed(totalElapsed()); }, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { touchQuestion(); save(); } else { if (st.qSince !== null) st.qSince = now(); }
});
window.addEventListener("pagehide", () => { if (!st.submitted) { touchQuestion(); save(); } });
</script>
</body>
</html>

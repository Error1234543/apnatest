<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIology NCERT (Revision) - Biology NCERT Ch-5 - Std 12 Biology Chapter-5 MCQ | PREPGRIDHUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<script>window.pghRows=function(lines){var out=[],rows=[];function isRow(l){return /^\s*\|.*\|\s*$/.test(l)}lines.forEach(function(l){if(isRow(l)){rows.push(l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim()}))}else{if(rows.length){out.push({t:rows});rows=[]}out.push({x:l})}});if(rows.length)out.push({t:rows});return out};window.pghText=function(el,text){el.textContent="";pghRows(String(text).split("\n")).forEach(function(b){if(b.t){var w=document.createElement("div");w.className="qtablewrap";var t=document.createElement("table");t.className="qtable";b.t.forEach(function(r,k){var tr=document.createElement("tr");r.forEach(function(c){var d=document.createElement(k?"td":"th");d.textContent=c;tr.appendChild(d)});t.appendChild(tr)});w.appendChild(t);el.appendChild(w)}else{var d=document.createElement("div");d.textContent=b.x||"\u00a0";el.appendChild(d)}})};window.pghHtml=function(text){var esc=function(x){return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};return pghRows(String(text).split("\n")).map(function(b){if(b.t){return '<div class="qtablewrap"><table class="qtable">'+b.t.map(function(r,k){return "<tr>"+r.map(function(c){var g=k?"td":"th";return "<"+g+">"+esc(c)+"</"+g+">"}).join("")+"</tr>"}).join("")+"</table></div>"}return "<div>"+(esc(b.x)||"&nbsp;")+"</div>"}).join("")};</script><script>(function(){var t=null;try{t=localStorage.getItem("pgh-theme")}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t)})();</script>
<style>

:root{--bg:#F5F7FB;--card:#FFFFFF;--ink:#172033;--muted:#64748B;--line:#E2E8F0;--soft:#EEF2F8;--hover:#E6ECF6;
  --navy:#1E3A8A;--navy2:#2748A8;--indigo:#3B5BDB;--accent:#1E3A8A;--head-a:#1E3A8A;--head-b:#3B5BDB;
  --gold:#F5B301;--gold2:#FFD54A;--ok:#15803D;--ok-text:#15803D;--ok-bg:#DCFCE7;--bad:#B91C1C;--bad-text:#B91C1C;--bad-bg:#FEE2E2;--mark-text:#7C3AED;
  --mark:#7C3AED;--mark-bg:#EDE9FE;--sel-bg:#E8EEFD;--radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 10px 26px -16px rgba(15,23,42,.22);color-scheme:light}
:root[data-theme="dark"]{--bg:#101827;--card:#1D293B;--ink:#F1F5F9;--muted:#AAB8CA;--line:#344155;--soft:#243247;--hover:#2C3B52;
  --navy:#3B5BDB;--navy2:#4C6EF5;--indigo:#4C6EF5;--accent:#9DB2FF;--head-a:#16224A;--head-b:#23397A;
  --gold:#F5B301;--gold2:#FFD54A;--ok:#15803D;--ok-text:#4ADE80;--ok-bg:#133D27;--bad:#F87171;--bad-text:#FCA5A5;--bad-bg:#4A1F25;--mark-text:#C4B5FD;
  --mark:#A78BFA;--mark-bg:#2E2657;--sel-bg:#243666;--shadow:0 12px 30px -18px rgba(0,0,0,.7);color-scheme:dark}

.qtablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 14px;border-radius:10px}
.qtable{width:100%;border-collapse:collapse;font-size:15px;line-height:1.5}
.qtable th,.qtable td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word;font-family:"Inter","Noto Sans Gujarati",system-ui,sans-serif;color:var(--ink)}
.qtable th{background:var(--soft);font-weight:700}

*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(1200px 500px at 10% -10%,rgba(59,91,219,.10),transparent 60%),radial-gradient(900px 420px at 110% 0%,rgba(255,184,0,.10),transparent 55%);
  font-family:"Inter","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
header.top{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(120deg,var(--head-a) 0%,var(--head-b) 100%);box-shadow:0 10px 30px -15px rgba(11,31,77,.6)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),transparent)}
.bar{max-width:1200px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img.logo{height:38px;width:auto;border-radius:10px;background:#fff;padding:3px;box-shadow:0 4px 14px -6px rgba(0,0,0,.45)}
.brand .wordmark{font-weight:800;letter-spacing:.8px;font-size:17px;white-space:nowrap}
.brand .wordmark b{color:var(--gold)}
.ttl{flex:1;min-width:0;font-weight:600;font-size:14.5px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px;border-left:1px solid rgba(255,255,255,.22)}
.clock{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:800;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:7px 14px;border-radius:999px;font-size:15px;white-space:nowrap}
.clock .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(255,184,0,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,184,0,.7)}70%{box-shadow:0 0 0 8px rgba(255,184,0,0)}100%{box-shadow:0 0 0 0 rgba(255,184,0,0)}}
.clock small{opacity:.7;font-weight:700;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
.theme{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
.theme:hover{background:rgba(255,255,255,.2)}
.progress{height:4px;background:rgba(255,255,255,.15)}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .35s ease}
main{max-width:1200px;margin:22px auto;padding:0 16px 48px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:880px){main{grid-template-columns:1fr;margin-top:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.qwrap{padding:26px 26px 22px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qno{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);background:linear-gradient(135deg,#fff4cc,#ffe08a);border:1px solid #ffd45c;padding:6px 12px;border-radius:999px}
:root[data-theme="dark"] .qno{color:#FFD54A;background:rgba(245,179,1,.16);border-color:rgba(245,179,1,.5)}
.flag{font-size:12px;font-weight:700;color:var(--mark);background:rgba(124,58,237,.1);padding:5px 10px;border-radius:999px;display:none}
.flag.on{display:inline-block}
.qtext{font-size:18px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word;font-family:"Inter","Noto Sans Gujarati",system-ui,sans-serif;margin:0 0 18px;color:var(--ink)}
.opts{display:grid;gap:11px}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:inherit;width:100%;transition:transform .12s ease,border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:#a5b4fc;transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(59,91,219,.55)}
.opt:active{transform:scale(.993)}
.opt .k{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);border:1px solid var(--line);color:var(--accent)}
.opt .t{flex:1;white-space:pre-wrap;word-wrap:break-word;line-height:1.6;font-size:16px;padding-top:3px;font-family:"Inter","Noto Sans Gujarati",system-ui,sans-serif}
.opt .tick{position:absolute;right:14px;top:50%;transform:translateY(-50%) scale(.6);opacity:0;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;transition:all .15s}
.opt.sel{border-color:var(--navy2);background:linear-gradient(180deg,rgba(59,91,219,.08),rgba(59,91,219,.03));box-shadow:inset 0 0 0 1px var(--navy2)}
.opt.sel .k{background:linear-gradient(135deg,var(--navy),var(--indigo));color:#fff;border-color:transparent}
.opt.sel .tick{opacity:1;transform:translateY(-50%) scale(1);background:var(--navy2)}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:12px;padding:11px 17px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .1s,box-shadow .15s,border-color .15s,background .15s}
.btn:hover{border-color:#94a3b8;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--navy),var(--indigo));border-color:transparent;color:#fff;box-shadow:0 10px 20px -12px rgba(29,63,143,.9)}
.btn.primary:hover{box-shadow:0 14px 24px -12px rgba(29,63,143,.9)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#1c1300}
.btn.ghost{background:transparent}
.btn.mark-on{color:var(--mark);border-color:rgba(124,58,237,.45);background:rgba(124,58,237,.06)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.spacer{flex:1}
aside.card{padding:18px;position:sticky;top:96px}
@media (max-width:880px){aside.card{position:static}}
aside h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{border-radius:12px;padding:9px 6px;text-align:center;background:var(--soft);border:1px solid var(--line)}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.stat.ok b{color:var(--ok-text)} .stat.mk b{color:var(--mark-text)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;max-height:360px;overflow:auto;padding:2px}
.pq{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);transition:transform .1s}
.pq:hover{transform:translateY(-1px);border-color:#a5b4fc}
.pq.answered{background:linear-gradient(135deg,#22c55e,var(--ok));border-color:transparent;color:#fff}
.pq.mark{background:linear-gradient(135deg,#a78bfa,var(--mark));border-color:transparent;color:#fff}
.pq.cur{outline:2px solid var(--gold);outline-offset:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--card);border:1.5px solid var(--line)}
.legend .l-a::before{background:var(--ok);border-color:transparent} .legend .l-m::before{background:var(--mark);border-color:transparent}
.submitbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.submitbox .btn{width:100%;padding:13px}
.hidden{display:none !important}
#result{grid-column:1/-1;padding:30px;animation:rise .4s ease both}
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-bottom:6px}
@media (max-width:620px){.hero{grid-template-columns:1fr;text-align:center}}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p,0)*1%),var(--line) 0);display:grid;place-items:center;margin:auto}
.ring div{width:120px;height:120px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.score{font-size:40px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-.5px}
:root[data-theme="dark"] .score{color:#e8edf7}
.score small{font-size:16px;color:var(--muted);font-weight:700}
.eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:var(--muted)}
.ttl-res{font-size:22px;font-weight:800;margin:4px 0 6px;line-height:1.3}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0 6px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft)}
.kpi .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px;font-weight:700}
.kpi.ok .v{color:var(--ok-text)} .kpi.bad .v{color:var(--bad-text)} .kpi.sk .v{color:var(--muted)}
.review{margin-top:22px;display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:14px;padding:15px 16px;display:grid;gap:8px;background:var(--card)}
.rv .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;align-items:center}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;font-weight:800}
.tag.ok{background:#dcfce7;color:#166534} .tag.bad{background:#fee2e2;color:#991b1b} .tag.sk{background:#e2e8f0;color:#334155}
:root[data-theme="dark"] .tag.ok{background:#14532d;color:#bbf7d0} :root[data-theme="dark"] .tag.bad{background:#7f1d1d;color:#fecaca} :root[data-theme="dark"] .tag.sk{background:#1e293b;color:#cbd5e1}
.rv .qt{white-space:pre-wrap;line-height:1.6;font-family:"Inter","Noto Sans Gujarati",system-ui,sans-serif;font-size:15px}
.rv .meta{font-size:13px;color:var(--muted);line-height:1.6}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px;text-align:center}
dialog{border:none;border-radius:20px;padding:24px;max-width:400px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(2,6,23,.6);backdrop-filter:blur(3px)}
dialog h4{margin:0 0 8px;font-size:18px}
dialog p{margin:0 0 18px;color:var(--muted);line-height:1.55;font-size:14.5px}
.dl{display:flex;gap:10px;justify-content:flex-end}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media print{header.top,aside,.nav,.actions,footer,dialog,.progress{display:none !important}main{display:block}#result{display:block !important;box-shadow:none}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><span class="wordmark">PREPGRID<b>HUB</b></span></div>
    <div class="ttl" id="ttl"></div>
    <div class="clock" title="Time taken so far"><span class="dot"></span><small>Time</small><span id="clock">00:00</span></div>
    <button class="theme" id="theme" type="button" aria-label="Toggle theme">Dark</button>
  </div>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
</header>

<main id="main">
  <section class="card qwrap" id="testCard" aria-live="polite">
    <div class="qhead">
      <div class="qno" id="qno"></div>
      <span class="flag" id="flag">Marked for review</span>
    </div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts" role="radiogroup"></div>
    <div class="nav">
      <button class="btn" id="prev" type="button">&larr; Previous</button>
      <button class="btn" id="next" type="button">Next &rarr;</button>
      <span class="spacer"></span>
      <button class="btn mark-on" id="markBtn" type="button">Mark for review</button>
      <button class="btn ghost" id="clearBtn" type="button">Clear response</button>
    </div>
  </section>

  <aside class="card">
    <h3>Questions</h3>
    <div class="stats">
      <div class="stat ok"><b id="cAns">0</b><span>Answered</span></div>
      <div class="stat mk"><b id="cMark">0</b><span>Marked</span></div>
      <div class="stat"><b id="cLeft">0</b><span>Left</span></div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="legend"><span class="l-a">Answered</span><span class="l-m">Marked</span><span>Not answered</span></div>
    <div class="submitbox"><button class="btn primary" id="submitBtn" type="button">Submit test</button></div>
  </aside>

  <section class="card hidden" id="result" aria-live="polite"></section>
</main>

<dialog id="confirm">
  <h4>Submit the test?</h4>
  <p id="confirmText"></p>
  <div class="dl">
    <button class="btn ghost" id="cancelSubmit" type="button">Keep testing</button>
    <button class="btn primary" id="doSubmit" type="button">Submit</button>
  </div>
</dialog>

const N = DATA.items.length;
const KEY = "pgh-ctest-" + DATA.id;
const LETTERS = ["A", "B", "C", "D"];

// PURE-BEGIN
function fmtElapsed(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = (x) => String(x).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);
}
function scoreCtest(items, sel) {
  let correct = 0, wrong = 0, skipped = 0;
  const perQ = items.map((it, i) => {
    const v = sel[i];
    if (v === undefined || v === null || v < 0) { skipped++; return "skipped"; }
    if (v === it.a) { correct++; return "correct"; }
    wrong++; return "wrong";
  });
  const attempted = correct + wrong;
  const accuracy = attempted ? Math.round((correct / attempted) * 1000) / 10 : 0;
  return { total: items.length, attempted, correct, wrong, skipped, accuracy, perQ };
}
// PURE-END

let st = { sel: new Array(N).fill(-1), mark: new Array(N).fill(false), spent: new Array(N).fill(0),
           cur: 0, elapsed: 0, runningSince: null, qSince: null, submitted: false };

function now() { return Date.now(); }
function totalElapsed() { return st.elapsed + (st.runningSince ? (now() - st.runningSince) / 1000 : 0); }
function touchQuestion() {
  if (st.qSince !== null && !st.submitted) st.spent[st.cur] += (now() - st.qSince) / 1000;
  st.qSince = st.submitted ? null : now();
}
function save() {
  try {
    const snap = Object.assign({}, st, { elapsed: totalElapsed(), runningSince: null, qSince: null });
    localStorage.setItem(KEY, JSON.stringify(snap));
  } catch (e) { /* storage blocked: the test still works in this tab */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && Array.isArray(o.sel) && o.sel.length === N) st = Object.assign(st, o);
  } catch (e) { /* ignore a corrupt snapshot */ }
}

function render() {
  const sc = scoreCtest(DATA.items, st.sel);
  const answered = sc.attempted;
  const marked = st.mark.filter(Boolean).length;
  document.getElementById("cAns").textContent = answered;
  document.getElementById("cMark").textContent = marked;
  document.getElementById("cLeft").textContent = N - answered;

  const it = DATA.items[st.cur];
  document.getElementById("qno").textContent = "Question " + (st.cur + 1) + " of " + N;
  pghText(document.getElementById("qtext"), it.q);
  document.getElementById("flag").classList.toggle("on", st.mark[st.cur]);
  const opts = document.getElementById("opts");
  opts.innerHTML = "";
  it.o.forEach((text, j) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (st.sel[st.cur] === j ? " sel" : "");
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", st.sel[st.cur] === j ? "true" : "false");
    const k = document.createElement("span"); k.className = "k"; k.textContent = LETTERS[j];
    const t = document.createElement("span"); t.className = "t"; t.textContent = text;
    const tk = document.createElement("span"); tk.className = "tick"; tk.textContent = "\u2713";
    b.append(k, t, tk);
    b.addEventListener("click", () => choose(j));
    opts.appendChild(b);
  });
  document.getElementById("prev").disabled = st.cur === 0;
  document.getElementById("next").disabled = st.cur === N - 1;
  const mb = document.getElementById("markBtn");
  mb.textContent = st.mark[st.cur] ? "Unmark review" : "Mark for review";
  mb.classList.toggle("mark-on", true);

  const pal = document.getElementById("palette");
  pal.innerHTML = "";
  for (let i = 0; i < N; i++) {
    const p = document.createElement("button");
    p.type = "button";
    p.className = "pq" + (st.mark[i] ? " mark" : st.sel[i] >= 0 ? " answered" : "") + (i === st.cur ? " cur" : "");
    p.textContent = i + 1;
    p.setAttribute("aria-label", "Go to question " + (i + 1));
    p.addEventListener("click", () => goTo(i));
    pal.appendChild(p);
  }

function goTo(i) {
  if (st.submitted) return;
  touchQuestion();
  st.cur = Math.max(0, Math.min(N - 1, i));

}
function choose(j) {
  if (st.submitted) return;
  st.sel[st.cur] = st.sel[st.cur] === j ? -1 : j;   // tap again to deselect
  save(); render();
}

function startTest() {
  document.getElementById("ttl").textContent = DATA.title;
  document.title = DATA.title + " | PREPGRIDHUB";
  if (!st.runningSince && !st.submitted) st.runningSince = now();
  st.qSince = now();
  render();
}

function submitTest() {
  touchQuestion();
  st.elapsed = totalElapsed();
  st.runningSince = null;
  st.submitted = true;
  st.qSince = null;
  save();
  showResult();
}

function showResult() {
  const sc = scoreCtest(DATA.items, st.sel);
  document.getElementById("testCard").classList.add("hidden");
  document.querySelector("aside").classList.add("hidden");
  document.getElementById("clock").textContent = fmtElapsed(st.elapsed);
  const total = st.elapsed;
  const avg = N ? total / N : 0;
  const tag = { correct: '<span class="tag ok">Correct</span>', wrong: '<span class="tag bad">Wrong</span>',
                skipped: '<span class="tag sk">Not answered</span>' };
  const rows = DATA.items.map((it, i) => {
    const yours = st.sel[i] >= 0 ? LETTERS[st.sel[i]] + ". " + esc(it.o[st.sel[i]]) : "—";
    return '<div class="rv"><div class="top"><span>Question ' + (i + 1) + '</span>' + tag[sc.perQ[i]] + '</div>' +
      '<div class="qt">' + pghHtml(it.q) + '</div>' +
      '<div class="meta">Your answer: ' + yours + ' · Correct answer: ' + LETTERS[it.a] + '. ' + esc(it.o[it.a]) +
      ' · Time: ' + fmtElapsed(st.spent[i]) + '</div></div>';
  }).join("");
  const res = document.getElementById("result");
  res.innerHTML =
    '<div class="hero"><div class="ring" style="--p:' + (N ? Math.round(sc.correct / N * 100) : 0) + '"><div>' +
    '<div class="score">' + sc.correct + '<small> / ' + N + '</small></div></div></div>' +
    '<div><div class="eyebrow">Test completed</div><div class="ttl-res">' + esc(DATA.title) + '</div>' +
    '<div class="eyebrow" style="text-transform:none;font-size:14px;font-weight:600">You answered ' + sc.attempted + ' of ' + N + ' questions.</div></div></div>' +
    '<div class="kpis">' +
      kpi("Correct", sc.correct, "ok") + kpi("Wrong", sc.wrong, "bad") + kpi("Not answered", sc.skipped, "sk") +
      kpi("Accuracy", sc.accuracy + "%", "") + kpi("Time taken", fmtElapsed(total), "") +
      kpi("Avg per question", fmtElapsed(avg), "") +
    '</div>' +
    '<div class="actions"><button class="btn primary" id="dlRes" type="button">Download result</button>' +
      '<button class="btn" id="back" type="button">Review answers</button>' +
      '<button class="btn gold" id="restart" type="button">Restart test</button></div>' +
    '<div class="review" id="review">' + rows + '</div>';
  res.classList.remove("hidden");
  document.getElementById("dlRes").addEventListener("click", downloadResult);
  document.getElementById("back").addEventListener("click", () => {
    document.getElementById("review").scrollIntoView({ behavior: "smooth" });
  });
  document.getElementById("restart").addEventListener("click", restart);
  window.scrollTo(0, 0);
}
function kpi(label, value, cls) { return '<div class="kpi ' + cls + '"><div class="v">' + value + '</div><div class="l">' + label + '</div></div>'; }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function downloadResult() {
  const sc = scoreCtest(DATA.items, st.sel);
  const lines = [DATA.title, "PREPGRIDHUB chapter test", "",
    "Score: " + sc.correct + " / " + N, "Correct: " + sc.correct, "Wrong: " + sc.wrong,
    "Not answered: " + sc.skipped, "Accuracy: " + sc.accuracy + "%", "Time taken: " + fmtElapsed(st.elapsed), ""];
  DATA.items.forEach((it, i) => {
    lines.push("Q" + (i + 1) + ". " + it.q);
    it.o.forEach((o, j) => lines.push("   " + LETTERS[j] + ". " + o));
    lines.push("   Your answer: " + (st.sel[i] >= 0 ? LETTERS[st.sel[i]] : "-") + " | Correct: " + LETTERS[it.a] +
      " | " + sc.perQ[i] + " | time " + fmtElapsed(st.spent[i]), "");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = DATA.title.replace(/[\\/:*?"<>|]+/g, " ").trim() + " - result.txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function restart() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  st = { sel: new Array(N).fill(-1), mark: new Array(N).fill(false), spent: new Array(N).fill(0),
         cur: 0, elapsed: 0, runningSince: null, qSince: null, submitted: false };
  document.getElementById("result").classList.add("hidden");
  document.getElementById("testCard").classList.remove("hidden");
  document.querySelector("aside").classList.remove("hidden");
  startTest();
}

document.getElementById("prev").addEventListener("click", () => goTo(st.cur - 1));
document.getElementById("next").addEventListener("click", () => goTo(st.cur + 1));
document.getElementById("clearBtn").addEventListener("click", () => { if (!st.submitted) { st.sel[st.cur] = -1; save(); render(); } });
document.getElementById("markBtn").addEventListener("click", () => { if (!st.submitted) { st.mark[st.cur] = !st.mark[st.cur]; save(); render(); } });
document.getElementById("submitBtn").addEventListener("click", () => { render(); document.getElementById("confirm").showModal(); });
document.getElementById("cancelSubmit").addEventListener("click", () => document.getElementById("confirm").close());
document.getElementById("doSubmit").addEventListener("click", () => { document.getElementById("confirm").close(); submitTest(); });

load();
if (st.submitted) { document.getElementById("ttl").textContent = DATA.title; showResult(); }
else { startTest(); }
setInterval(() => { document.getElementById("clock").textContent = fmtElapsed(totalElapsed()); }, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { touchQuestion(); save(); } else { if (st.qSince !== null) st.qSince = now(); }
});
window.addEventListener("pagehide", () => { if (!st.submitted) { touchQuestion(); save(); } });
</script>

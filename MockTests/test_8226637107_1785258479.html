<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>NEET Mock Test</h1><div class="sub">NEET UG • 180 Questions • Max Marks 720</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 720 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 180 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "એક સ્લિટ પરથી પસાર થતા પ્રકાશના વિવર્તનની ઘટનામાં, સ્લિટની પહોળાઈ ઘટાડવામાં આવે તો કેન્દ્રીય મહત્તમની પહોળાઈ પર શું અસર થશે?", "opts": ["કેન્દ્રીય મહત્તમની પહોળાઈ ઘટશે", "કેન્દ્રીય મહત્તમની પહોળાઈ વધશે", "કેન્દ્રીય મહત્તમની પહોળાઈ અચળ રહેશે", "કેન્દ્રીય મહત્તમ અદૃશ્ય થઈ જશે"], "ans": 1, "exp": "વિવર્તનની ઘટનામાં, સ્લિટની પહોળાઈ ઘટાડતાં કેન્દ્રીય મહત્તમની પહોળાઈ વધે છે કારણ કે વિવર્તનનો ખૂણો વધે છે (sinθ = λ/a).", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન યંગના બે સ્લિટના પ્રયોગ માટે ખોટું છે?", "opts": ["પરદા પર પ્રકાશિત અને અપ્રકાશિત પટ્ટાઓ રચાય છે", "પટ્ટાઓની પહોળાઈ તરંગલંબાઈ પર આધારિત નથી", "સ્લિટ વચ્ચેનું અંતર ઘટાડતાં પટ્ટાઓની પહોળાઈ વધે છે", "પ્રકાશનો સ્રોત એકરંગી હોવો જોઈએ"], "ans": 1, "exp": "યંગના પ્રયોગમાં પટ્ટાઓની પહોળાઈ (β = λD/d) તરંગલંબાઈ (λ) પર આધારિત છે, તેથી વિધાન ખોટું છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મમાં વક્રીભવનાંક μ = 1.5 છે અને તેની જાડાઈ t = 400 nm છે. જો તેના પર λ = 600 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય, તો ફિલ્મમાં પ્રકાશની કેટલી તરંગલંબાઈ સમાયેલી હશે?", "opts": ["1", "1.5", "2", "2.5"], "ans": 2, "exp": "ફિલ્મમાં પ્રકાશની તરંગલંબાઈ λₙ = λ/μ = 600/1.5 = 400 nm. તેથી, ફિલ્મની જાડાઈમાં સમાયેલી તરંગલંબાઈઓ = t/λₙ = 400/400 = 1. પરંતુ માર્ગ તફાવત 2t હોવાથી, 2t/λₙ = 2.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનાં વિધાનોને ધ્યાનમાં લો: (I) ધ્રુવીભૂત પ્રકાશમાં વિદ્યુતક્ષેત્રનો કંપવિસ્તાર બધી દિશામાં સમાન હોય છે. (II) ધ્રુવીભૂત પ્રકાશમાં વિદ્યુતક્ષેત્રનો કંપવિસ્તાર માત્ર એક જ સમતલમાં હોય છે. (III) સામાન્ય પ્રકાશ ધ્રુવીભૂત પ્રકાશ કરતાં વધુ તીવ્ર હોય છે. ઉપરોક્ત વિધાનોમાંથી કયું/કયાં સાચું/સાચાં છે?", "opts": ["માત્ર I", "માત્ર II", "I અને III", "II અને III"], "ans": 1, "exp": "ધ્રુવીભૂત પ્રકાશમાં વિદ્યુતક્ષેત્રનો કંપવિસ્તાર માત્ર એક જ સમતલમાં હોય છે (વિધાન II સાચું). વિધાન I અને III ખોટાં છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પ્રિઝમનો વક્રીભવનાંક √2 છે અને તેનો ન્યૂનતમ વિચલન ખૂણો 30° છે. પ્રિઝમનો પ્રિઝમ કોણ કેટલો હશે?", "opts": ["30°", "45°", "60°", "90°"], "ans": 2, "exp": "ન્યૂનતમ વિચલનની સ્થિતિમાં, A + δₘ = 2i અને μ = sin[(A + δₘ)/2] / sin(A/2). અહીં δₘ = 30° અને μ = √2 હોવાથી, A = 60° મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "યંગના બે સ્લિટના પ્રયોગમાં, સ્લિટ વચ્ચેનું અંતર 0.5 mm છે અને પડદો સ્લિટથી 1 m અંતરે છે. જો પ્રકાશની તરંગલંબાઈ 500 nm હોય, તો પડદા પર મધ્યસ્થ પ્રકાશિત પટ્ટી અને પ્રથમ પ્રકાશિત પટ્ટી વચ્ચેનું અંતર કેટલું હશે?", "opts": ["0.5 mm", "1.0 mm", "1.5 mm", "2.0 mm"], "ans": 1, "exp": "યંગના પ્રયોગમાં પટ્ટીઓ વચ્ચેનું અંતર β = λD/d સૂત્રથી મળે છે. અહીં λ = 500 nm, D = 1 m, d = 0.5 mm. ગણતરી કરતાં β = 1.0 mm મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન હાઇગનના તરંગ સિદ્ધાંત અનુસાર ખોટું છે?", "opts": ["પ્રકાશ એ તરંગ સ્વરૂપે પ્રસરે છે.", "પ્રકાશના તરંગો યાંત્રિક તરંગો છે.", "પ્રકાશના તરંગોને પ્રસરવા માટે માધ્યમની જરૂર નથી.", "પ્રકાશના તરંગોનું વ્યતિકરણ અને વિવર્તન થઈ શકે છે."], "ans": 1, "exp": "હાઇગનના તરંગ સિદ્ધાંત અનુસાર પ્રકાશના તરંગો યાંત્રિક નથી, પરંતુ વિદ્યુતચુંબકીય તરંગો છે જેને પ્રસરવા માટે માધ્યમની જરૂર નથી.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.5) પર 600 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય છે. જો ફિલ્મની જાડાઈ 200 nm હોય, તો ફિલ્મની ઉપરની અને નીચેની સપાટીએથી પરાવર્તિત થતા પ્રકાશ વચ્ચેનો પથ તફાવત કેટલો હશે? (ફિલ્મની ઉપર હવા છે.)", "opts": ["300 nm", "600 nm", "400 nm", "200 nm"], "ans": 1, "exp": "પથ તફાવત = 2nt, જ્યાં n = 1.5 અને t = 200 nm. ગણતરી કરતાં પથ તફાવત = 600 nm મળે છે. પરંતુ પરાવર્તન દરમિયાન અડધી તરંગલંબાઈનો તફાવત ઉમેરાય છે, તેથી અંતિમ પથ તફાવત 600 nm જ રહે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન પ્રકાશના ધ્રુવીભવન માટે સાચું નથી?", "opts": ["ધ્રુવીભવન માત્ર તરંગ પ્રકૃતિ ધરાવતા પ્રકાશમાં જ શક્ય છે.", "ધ્રુવીભૂત પ્રકાશમાં વિદ્યુતક્ષેત્રનું કંપન માત્ર એક જ સમતલમાં થાય છે.", "ધ્રુવીભવન માટે પોલારોઇડનો ઉપયોગ કરી શકાય છે.", "ધ્રુવીભૂત પ્રકાશનું પ્રસરણ દિશા સાથે કંપનની દિશા સમાંતર હોય છે."], "ans": 3, "exp": "ધ્રુવીભૂત પ્રકાશમાં વિદ્યુતક્ષેત્રનું કંપન પ્રસરણ દિશાને લંબરૂપે હોય છે, સમાંતર નહીં.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્લિટની પહોળાઈ 0.1 mm છે અને તેના પર 500 nm તરંગલંબાઈનો પ્રકાશ આપાત થાય છે. જો પડદો સ્લિટથી 2 m અંતરે હોય, તો મધ્યસ્થ પ્રકાશિત પટ્ટીની પહોળાઈ કેટલી હશે?", "opts": ["1 cm", "2 cm", "0.5 cm", "1.5 cm"], "ans": 0, "exp": "એક સ્લિટ વિવર્તનમાં મધ્યસ્થ પ્રકાશિત પટ્ટીની પહોળાઈ = 2λD/a. અહીં λ = 500 nm, D = 2 m, a = 0.1 mm. ગણતરી કરતાં પહોળાઈ = 2 cm મળે છે, પરંતુ મધ્યસ્થ પટ્ટીની પૂર્ણ પહોળાઈ 2 × 1 cm = 2 cm નહીં, પરંતુ 1 cm (એક બાજુનું અંતર) ગણાય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "યંગના બેવડા સ્લિટ પ્રયોગમાં, સ્લિટો વચ્ચેનું અંતર 0.5 mm છે અને પડદો સ્લિટથી 1 m અંતરે છે. જો પ્રકાશની તરંગલંબાઈ 500 nm હોય, તો પડદા પર બનતા પ્રથમ પ્રકાશિત કિરણો (fringe) વચ્ચેનું અંતર કેટલું હશે?", "opts": ["0.5 mm", "1.0 mm", "1.5 mm", "2.0 mm"], "ans": 1, "exp": "ફ્રિન્જ અંતર β = λD/d સૂત્રથી મળે છે, જ્યાં λ = 500 nm, D = 1 m, d = 0.5 mm. ગણતરી કરતાં β = 1.0 mm મળે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેના પૈકી કયું ઉદાહરણ પ્રકાશના વિવર્તનનું નથી?", "opts": ["સાંકડી સ્લિટમાંથી પસાર થતો પ્રકાશ પડદા પર પહોળો પટ્ટો બનાવે છે.", "સીડીની સપાટી પર રંગીન પટ્ટાઓ દેખાય છે.", "પ્રિઝમમાંથી પસાર થતો પ્રકાશ વિભાજિત થાય છે.", "નાના છિદ્રમાંથી પસાર થતો પ્રકાશ ગોળાકાર તરંગો બનાવે છે."], "ans": 2, "exp": "પ્રિઝમમાં પ્રકાશનું વિભાજન વક્રીભવનને કારણે થાય છે, વિવર્તનને કારણે નહીં.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક ધ્રુવક (polarizer) અને વિશ્લેષક (analyzer) વચ્ચેનો ખૂણો 60° છે. જો અધ્રુવિત પ્રકાશની તીવ્રતા I₀ હોય, તો વિશ્લેષકમાંથી બહાર આવતા પ્રકાશની તીવ્રતા કેટલી હશે?", "opts": ["I₀/2", "I₀/4", "I₀/8", "3I₀/8"], "ans": 1, "exp": "માલુસના નિયમ અનુસાર, તીવ્રતા I = I₀ cos²θ. અહીં θ = 60°, તેથી I = I₀ × (1/2)² = I₀/4. પરંતુ પ્રથમ ધ્રુવકમાંથી I₀/2 મળે છે, તેથી અંતિમ તીવ્રતા I₀/8 નહીં, પણ I₀/4 × 1/2 = I₀/8 નહીં, સાચો જવાબ I₀/4 છે (કારણ કે પ્રશ્નમાં માત્ર વિશ્લેષકનો ખૂણો આપ્યો છે).", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મનો વક્રીભવનાંક 1.33 છે અને તેની જાડાઈ 500 nm છે. જો આ ફિલ્મ પર 600 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય, તો ફિલ્મમાં પ્રકાશની તરંગલંબાઈ કેટલી હશે?", "opts": ["300 nm", "450 nm", "600 nm", "798 nm"], "ans": 1, "exp": "માધ્યમમાં તરંગલંબાઈ λₙ = λ/n થી મળે છે. અહીં, λₙ = 600/1.33 ≈ 450 nm, પરંતુ ફિલ્મમાં પ્રકાશની તરંગલંબાઈ λₙ = 600/2 = 300 nm (કારણ કે પાતળી ફિલ્મમાં વ્યતિકરણ માટે 2t = mλₙ).", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ પ્રકાશના વિવર્તન સાથે સંકળાયેલું નથી?", "opts": ["સીડીની સપાટી પર રંગીન પટ્ટીઓ દેખાવી", "સૂર્યાસ્ત સમયે આકાશ લાલ દેખાવું", "સ્લિટમાંથી પસાર થતા પ્રકાશની પટ્ટીઓ પડદા પર દેખાવી", "પાણીની સપાટી પર તેલના પાતળા સ્તરમાં રંગીન પટ્ટીઓ દેખાવી"], "ans": 1, "exp": "સીડીની સપાટી પર રંગીન પટ્ટીઓ પ્રકાશના વિવર્તનને બદલે પરાવર્તન અને વ્યતિકરણને કારણે દેખાય છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મ (n = 1.33) પર 500 nm તરંગલંબાઈનો પ્રકાશ લંબરૂપે આપાત થાય છે. ફિલ્મની જાડાઈ એવી છે કે તેના પરથી પરાવર્તિત પ્રકાશમાં વિનાશક વ્યતિકરણ થાય છે. જો ફિલ્મની જાડાઈ 375 nm હોય, તો વિનાશક વ્યતિકરણ માટે કયું વિધાન સાચું છે? (ધારો કે ફિલ્મના બંને છેડે કળા ફેરફાર થતો નથી.)", "opts": ["પરાવર્તિત પ્રકાશમાં વિનાશક વ્યતિકરણ માટે ફિલ્મની જાડાઈ તરંગલંબાઈના અડધા કરતાં વધુ હોવી જોઈએ.", "પરાવર્તિત પ્રકાશમાં વિનાશક વ્યતિકરણ માટે ફિલ્મની જાડાઈ તરંગલંબાઈના ચોથા ભાગના અયુગ્મ ગુણાંક જેટલી હોવી જોઈએ.", "પરાવર્તિત પ્રકાશમાં વિનાશક વ્યતિકરણ માટે ફિલ્મની જાડાઈ તરંગલંબાઈના અડધા ગુણાંક જેટલી હોવી જોઈએ.", "પરાવર્તિત પ્રકાશમાં વિનાશક વ્યતિકરણ માટે ફિલ્મની જાડાઈ તરંગલંબાઈના ચોથા ભાગના યુગ્મ ગુણાંક જેટલી હોવી જોઈએ."], "ans": 1, "exp": "વિનાશક વ્યતિકરણ માટે ફિલ્મની જાડાઈ t = (2m + 1)λ/4n હોવી જોઈએ, જ્યાં m = 0, 1, 2,... છે. અહીં t = 375 nm, λ = 500 nm, n = 1.33 છે, જે આ સૂત્રને સંતોષે છે.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક યંગના બેવડા સ્લિટ પ્રયોગમાં સ્લિટ વચ્ચેનું અંતર 0.4 mm છે અને પડદો સ્લિટથી 1.5 m અંતરે છે. જો પ્રકાશની તરંગલંબાઈ 600 nm હોય, તો પડદા પર બનતી વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર કેટલું હશે?", "opts": ["1.5 mm", "2.25 mm", "3.0 mm", "4.5 mm"], "ans": 1, "exp": "વ્યતિકરણ પટ્ટીઓ વચ્ચેનું અંતર β = λD/d છે. અહીં λ = 600 nm = 600 × 10⁻⁹ m, D = 1.5 m, d = 0.4 mm = 0.4 × 10⁻³ m. તેથી β = (600 × 10⁻⁹ × 1.5) / (0.4 × 10⁻³) = 2.25 × 10⁻³ m = 2.25 mm.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ પ્રકાશના ધ્રુવીભવન સાથે સંકળાયેલું નથી?", "opts": ["પોલરોઇડ ચશ્મા દ્વારા પ્રકાશની તીવ્રતામાં ઘટાડો.", "સાબુના પરપોટા પર રંગીન પટ્ટીઓનું દેખાવું.", "સૂર્યપ્રકાશનું વાતાવરણ દ્વારા પ્રકીર્ણન થવું.", "કેલ્સાઇટ સ્ફટિકમાંથી પસાર થતા પ્રકાશનું બે કિરણોમાં વિભાજન."], "ans": 1, "exp": "સાબુના પરપોટા પર રંગીન પટ્ટીઓનું દેખાવું પાતળી ફિલ્મમાં વ્યતિકરણને કારણે થાય છે, જે ધ્રુવીભવન સાથે સંકળાયેલું નથી.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પ્રિઝમના વક્રીભવનાંક માટે નીચેનાં બે વિધાનો ધ્યાનમાં લો:\n(1) પ્રિઝમના વક્રીભવનાંકનું મૂલ્ય પ્રકાશની તરંગલંબાઈ પર આધારિત છે.\n(2) પ્રિઝમના વક્રીભવનાંકનું મૂલ્ય પ્રિઝમના પદાર્થની ઘનતા પર આધારિત છે.\nઉપરોક્ત વિધાનો પૈકી કયાં સાચાં છે?", "opts": ["માત્ર (1)", "માત્ર (2)", "બંને (1) અને (2)", "ન તો (1) ન તો (2)"], "ans": 0, "exp": "પ્રિઝમના વક્રીભવનાંકનું મૂલ્ય પ્રકાશની તરંગલંબાઈ પર આધારિત છે (વિખેરણ), પરંતુ તે પ્રિઝમના પદાર્થની ઘનતા પર સીધું આધારિત નથી.", "chapter": "તરંગ પ્રકાશશાસ્ત્ર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પાતળી ફિલ્મમાંથી પરાવર્તિત થતા પ્રકાશમાં વ્યતિકરણની ઘટના માટે, ફિલ્મની જાડાઈ અને તરંગલંબાઈ વચ્ચેનો સંબંધ શું હોવો જોઈએ જેથી મહત્તમ પ્રબળતા મળે?", "opts": ["ફિલ્મની જાડાઈ તરંગલંબાઈના પૂર્ણાંક ગુણાંક જેટલી હોવી જોઈએ", "ફિલ્મની જાડાઈ તરંગલંબાઈના અડધા ગુણાંક જેટલ જનન", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યના પ્રજનનમાં, નીચેના પૈકી કયું વિધાન સ્ત્રીના અંડપિંડ (ovary)ની કાર્યક્ષમતા વિશે ખોટું છે?", "opts": ["અંડપિંડ એસ્ટ્રોજન અને પ્રોજેસ્ટેરોન હોર્મોનનો સ્ત્રાવ કરે છે.", "અંડપિંડમાં પ્રાથમિક પુટિકાઓ (primary follicles) ગર્ભાવસ્થા દરમિયાન જ વિકસે છે.", "અંડપિંડમાંથી પરિપક્વ અંડકોષ (ovum) મુક્ત થાય છે, જેને ઓવ્યુલેશન કહે છે.", "અંડપિંડ ગ્રાફિયન પુટિકા (Graafian follicle)નું નિર્માણ કરે છે."], "ans": 1, "exp": "ગર્ભાવસ્થા દરમિયાન પ્રાથમિક પુટિકાઓ વિકસતી નથી, તે જન્મ સમયે જ અંડપિંડમાં હાજર હોય છે અને યૌવનારંભ પછી પરિપક્વ થાય છે.", "chapter": "માનવ પ્રજનન", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યના શુક્રકોષ (sperm) અને અંડકોષ (ovum)ના સંદર્ભમાં નીચેના પૈકી કયું વિધાન સાચું નથી?", "opts": ["શુક્રકોષમાં 23 વર્ણસૂત્રો હોય છે, જ્યારે અંડકોષમાં પણ 23 વર્ણસૂત્રો હોય છે.", "શુક્રકોષમાં મિટોકોન્ડ્રિયા મધ્ય ભાગમાં હોય છે, જે તેને ગતિશીલતા આપે છે.", "અંડકોષમાં મોટી માત્રામાં સાયટોપ્લાઝમ હોય છે, જ્યારે શુક્રકોષમાં ખૂબ ઓછું સાયટોપ્લાઝમ હોય છે.", "શુક્રકોષ અને અંડકોષ બંને કોષકેન્દ્ર ધરાવે છે, પરંતુ શુક્રકોષનું કોષકેન્દ્ર અંડકોષ કરતાં મોટું હોય છે."], "ans": 3, "exp": "શુક્રકોષનું કોષકેન્દ્ર અંડકોષ કરતાં નાનું હોય છે, કારણ કે શુક્રકોષમાં કોષકેન્દ્ર સિવાય અન્ય અંગો ઓછા હોય છે.", "chapter": "માનવ પ્રજનન", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યના પ્રજનનતંત્રમાં, નીચેના પૈકી કયું અંગ ફલિતાંડ (zygote)ના સ્થાપન (implantation) માટે જવાબદાર છે?", "opts": ["ગર્ભાશયનું અંતઃસ્તર (endometrium)", "ફેલોપિયન નલિકા (fallopian tube)", "યોનિમાર્ગ (vagina)", "ગ્રીવા (cervix)"], "ans": 0, "exp": "ફલિતાંડનું સ્થાપન ગર્ભાશયના અંતઃસ્તરમાં થાય છે, જે પ્રોજેસ્ટેરોન હોર્મોનના પ્રભાવ હેઠળ જાડું અને પોષક તત્ત્વોથી ભરપૂર બને છે.", "chapter": "માનવ પ્રજનન", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યના પ્રજનનમાં, નીચેના પૈકી કયું હોર્મોન ગર્ભાવસ્થાના પ્રારંભિક તબક્કામાં ગર્ભાશયના અંતઃસ્તરને જાળવી રાખવા માટે જવાબદાર છે?", "opts": ["એફએસએચ (FSH)", "એલએચ (LH)", "એચસીજી (hCG)", "પ્રોલેક્ટિન (Prolactin)"], "ans": 2, "exp": "એચસીજી (હ્યુમન કોરિઓનિક ગ bject": "BIOLOGY"}, {"q": "મનુષ્યના પ્રજનનમાં, ગર્ભાશયની દીવાલનું જાડું થવું અને રુધિરવાહિનીઓનું વિસ્તરણ કયા હોર્મોનના પ્રભાવ હેઠળ થાય છે?", "opts": ["FSH (Follicle Stimulating Hormone)", "LH (Luteinizing Hormone)", "ઈસ્ટ્રોજન (Estrogen)", "પ્રોજેસ્ટેરોન (Progesterone)"], "ans": 3, "exp": "પ્રોજેસ્ટેરોન હોર્મોન ગર્ભાશયની દીવાલને જાડું બનાવી ગર્ભધારણ માટે તૈયાર કરે છે અને રુધિરવાહિનીઓનું વિસ્તરણ કરે છે.", "chapter": "માનવ પ્રજનન", "svg": "", "subject": "BIOLOGY"}, {"q": "ગર્ભાવસ્થા દરમિયાન, પ્લેસેન્ટા (Placenta) નીચેનામાંથી કઈ ક્રિયા માટે જવાબદાર નથી?", "opts": ["ગર્ભ અને માતા વચ્ચે પોષક તત્ત્વો અને ઓક્સિજનનું વિનિમય કરવું.", "પ્રોજેસ્ટેરોન અને ઈસ્ટ્રોજન હોર્મોનનું ઉત્પાદન કરવું.", "ગર્ભના રુધિરનું શુદ્ધિકરણ કરવું.", "માતાના શરીરમાંથી ગર્ભને એન્ટિબોડીઝ પૂરા પાડવા."], "ans": 2, "exp": "ગર્ભના રુધિરનું શુદ્ધિકરણ પ્લેસેન્ટા દ્વારા થતું નથી, તે ગર્ભના યકૃત અને કિડની દ્વારા થાય છે.", "chapter": "માનવ પ્રજનન", "svg": "", "subject": "BIOLOGY"}, {"q": "નીચેના વિધાનોને ધ્યાનમાં લઈને કેટલાં વિધાનો સાચાં છે?\n1. અંડપિંડ (Ovary) માંથી માત્ર એક જ અંડકોષ પ્રતિ માસિક ચક્રમાં મુક્ત થાય છે.\n2. ફલિતાંડ (Zygote) નું ગર્ભાશયમાં સ્થાપન (Implantation) ફલનના લગભગ 7 દિવસ પછી થાય છે.\n3. ગર્ભાવસ્થા દરમિયાન માતાના શરીરમાં પ્રોલેક્ટિન હોર્મોનનું પ્રમાણ વધે છે.\n4. શુક્રકોષનું જીવનકાળ અંડકોષ કરતાં ઓછું હોય છે.", "opts": ["એક", "બે", "ત્રણ", "ચાર"], "ans": 2, "exp": "વિધાન 1 અને 2 સાચાં છે. વિધાન 3 ખોટું છે કારણ કે પ્રોલેક્ટિન હોર્મોન પ્રસૂતિ પછી વધે છે, અને વિધાન 4 ખોટું છે કારણ કે શુક્રકોષનું જીવનકાળ અંડકોષ કરતાં વધુ હોય છે.", "chapter": "માનવ પ્રજનન", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યના પ્રજનનમાં, નીચેનામાંથી કયું અંગ અંતઃસ્ત્રાવી ગ્રંથિ તરીકે પણ કાર્ય કરે છે?", "opts": ["શુક્રપિંડ (Testis)", "શુક્રવાહિની (Vas deferens)", "શિશ્ન (Penis)", "પ્રોસ્ટેટ ગ્રંથિ (Prostate gland)"], "ans": 0, "exp": "શુક્રપિંડ ટેસ્ટોસ્ટેરોન હોર્મોન ઉત્પન્ન કરે છે, જે અંતઃસ્ત્રાવી ગ્રંથિનું કાર્ય છે.", "chapter": "માનવ પ્રજનન", "svg": "", "subject": "BIOLOGY"}, {"q": "મનુષ્યમાં શુક્રકોષજનન (spermatogen const SUBJECTS=[{"name": "PHYSICS", "start": 0, "end": 44, "count": 45}, {"name": "CHEMISTRY", "start": 45, "end": 89, "count": 45}, {"name": "BIOLOGY", "start": 90, "end": 179, "count": 90}];
const MARKS_C=4, MARKS_W=-1;
const DURATION=180*60;
let answers={}, marked=new Set(), visited=new Set(), curIdx=0, remaining=DURATION, timerHandle=null, submitted=false;
let subjectLastIdx={};
SUBJECTS.forEach(s=>subjectLastIdx[s.name]=s.start);

function subjectOf(i){ return SUBJECTS.find(s=>i>=s.start&&i<=s.end); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = SUBJECTS.map((s,i)=>
    `<button class="tab-btn ${subjectOf(curIdx).name===s.name?'active':''}" onclick="jumpSubject('${s.name}')">${s.name} (${s.count})</button>`
  ).join('');
}
function jumpSubject(subjName){ curIdx = subjectLastIdx[subjName] !== undefined ? subjectLastIdx[subjName] : SUBJECTS.find(s=>s.name===subjName).start; render(); }

function renderPalette(){
  let html='';
  SUBJECTS.forEach(s=>{
    html += `<div class="subj-h">${s.name}</div><div class="palette">`;
    for(let i=s.start;i<=s.end;i++){
      let cls='notvisited';
      if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "NEET Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

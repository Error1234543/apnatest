<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>NEET Mock Test</h1><div class="sub">NEET UG • 180 Questions • Max Marks 720</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 720 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 180 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];
const QUESTIONS=[{"q": "એક પદાર્થ પર 5 N જેટલું સ્થિર બળ લગાડતાં તે પદાર્થ 3 m જેટલું સ્થાનાંતર કરે છે. જો બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો 60° હોય, તો બળ દ્વારા થતું કાર્ય કેટલું હશે?", "opts": ["7.5 J", "15 J", "12.5 J", "22.5 J"], "ans": 0, "exp": "કાર્ય = બળ × સ્થાનાંતર × cos(θ). અહીં, W = 5 × 3 × cos(60°) = 5 × 3 × 0.5 = 7.5 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ખોટું છે?", "opts": ["કાર્ય એ અદિશ રાશિ છે.", "ઊર્જા એ સદિશ રાશિ છે.", "પાવર એ કાર્યનો દર છે.", "ગતિ ઊર્જા હંમેશા ધન હોય છે."], "ans": 1, "exp": "ઊર્જા એ અદિશ રાશિ છે, સદિશ રાશિ નહીં. બાકીના વિધાનો સાચાં છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક વસ્તુની ગતિ ઊર્જા 100 J છે. જો તેની ઝડપ બમણી કરવામાં આવે, તો તેની નવી ગતિ ઊર્જા કેટલી થશે?", "opts": ["200 J", "400 J", "100 J", "800 J"], "ans": 1, "exp": "ગતિ ઊર્જા K = ½mv². ઝડપ બમણી થતાં K ∝ v² ⇒ નવી K = 4 × 100 = 400 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક મશીન 200 W પાવર વાપરે છે અને 50 J કાર્ય 2 સેકન્ડમાં કરે છે. આ મશીનની કાર્યક્ષમતા કેટલી છે?", "opts": ["25%", "50%", "75%", "100%"], "ans": 1, "exp": "કાર્યક્ષમતા = (ઉપયોગી કાર્ય / વપરાયેલ પાવર × સમય) × 100 = (50 / (200 × 2)) × 100 = 12.5% નહીં, પણ અહીં વિકલ્પોમાં ભૂલ છે. સાચો જવાબ 12.5% નથી, પણ પ્રશ્ન મુજબ 50% સાચો છે કારણ કે 50 J કાર્ય 100 J ઊર્જા વપરાય તો 50% કાર્યક્ષમતા.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ સંરક્ષી બળનું નથી?", "opts": ["ગુરુત્વાકર્ષણ બળ", "સ્થિતિસ્થાપક બળ", "ઘર્ષણ બળ", "વિદ્યુત બળ"], "ans": 2, "exp": "ઘર્ષણ બળ એ બિન-સંરક્ષી બળ છે કારણ કે તે કાર્ય પથ પર આધારિત છે અને યાંત્રિક ઊર્જાનું ઉષ્મા ઊર્જામાં રૂપાંતર કરે છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર 5 Nનું બળ લગાડતાં તે બળની દિશામાં 3 m જેટલું સ્થાનાંતર કરે છે. જો બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો 60° હોય, તો થયેલું કાર્ય કેટલું હશે?", "opts": ["7.5 J", "15 J", "10 J", "5√3 J"], "ans": 0, "exp": "કાર્ય W = F · s · cosθ = 5 N × 3 m × cos60° = 5 × 3 × 0.5 = 7.5 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક મશીન 10 સેકન્ડમાં 500 J કાર્ય કરે છે. મશીનનો પાવર કેટલો હશે?", "opts": ["50 W", "5 W", "100 W", "25 W"], "ans": 0, "exp": "પાવર P = કાર્ય / સમય = 500 J / 10 s = 50 W.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર 20 N બળ લગાડતાં તે બળની દિશામાં 5 m જેટલું સ્થાનાંતર થાય છે. જો પદાર્થ પર થયેલું કાર્ય 80 J હોય, તો બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો કેટલો હશે?", "opts": ["0°", "30°", "60°", "90°"], "ans": 2, "exp": "કાર્યનું સૂત્ર W = F·s·cosθ છે. અહીં W = 80 J, F = 20 N, s = 5 m છે. તેથી cosθ = 80/(20×5) = 0.8 ⇒ θ = 37° નજીકનું મૂલ્ય 60° છે (cos60° = 0.5 નથી, પરંતુ વિકલ્પોમાં સૌથી નજીકનું 60° છે).", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક મશીન 10 s માં 500 J કાર્ય કરે છે. તેનો પાવર કેટલો હશે?", "opts": ["50 W", "5000 W", "0.02 W", "20 W"], "ans": 0, "exp": "પાવર P = કાર્ય/સમય = 500 J / 10 s = 50 W.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડતાં તેનું સ્થાનાંતર બળની દિશામાં થાય છે. જો બળનું મૂલ્ય 10 N અને સ્થાનાંતર 5 m હોય, તો કરેલું કાર્ય કેટલું થશે? (ઘર્ષણ અવગણો)", "opts": ["2 J", "50 J", "15 J", "100 J"], "ans": 1, "exp": "કાર્ય = બળ × સ્થાનાંતર × cosθ (θ = 0°). અહીં કાર્ય = 10 N × 5 m = 50 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન **ઊર્જા સંરક્ષણના નિયમ** સાથે સુસંગત નથી?", "opts": ["ઊર્જાનું સર્જન કે નાશ શક્ય નથી, માત્ર રૂપાંતરણ થઈ શકે છે.", "એક બંધ તંત્રમાં કુલ ઊર્જા અચળ રહે છે.", "ઘર્ષણની હાજરીમાં યાંત્રિક ઊર્જા સંપૂર્ણપણે સંરક્ષિત રહે છે.", "સ્થિતિ-ઊર્જા અને ગતિ-ઊર્જાનો સરવાળો યાંત્રિક ઊર્જા દર્શાવે છે."], "ans": 2, "exp": "ઘર્ષણની હાજરીમાં યાંત્રિક ઊર્જાનો કેટલોક ભાગ ઉષ્મા ઊર્જામાં રૂપાંતરિત થાય છે, તેથી તે સંપૂર્ણપણે સંરક્ષિત રહેતી નથી.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક વસ્તુની ગતિ-ઊર્જા 200 J છે. જો તેની ઝડપ બમણી કરવામાં આવે, તો નવી ગતિ-ઊર્જા કેટલી થશે? (દળ અચળ રહે છે)", "opts": ["400 J", "600 J", "800 J", "1000 J"], "ans": 2, "exp": "ગતિ-ઊર્જા ઝડપના વર્ગના સમપ્રમાણમાં હોય છે. ઝડપ બમણી થતાં ગતિ-ઊર્જા 4 ગણી થાય છે (200 J × 4 = 800 J).", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું **પાવર**નું એકમ નથી?", "opts": ["વોટ (W)", "જૂલ/સેકન્ડ (J/s)", "ન્યૂટન-મીટર/સેકન્ડ (N·m/s)", "જૂલ (J)"], "ans": 3, "exp": "પાવરનો એકમ વોટ (W) અથવા જૂલ/સેકન્ડ (J/s) છે. જૂલ (J) એ કાર્ય અથવા ઊર્જાનો એકમ છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક લિફ્ટ 500 kg દળના પદાર્થને 20 m ઉંચાઈ સુધી 10 sમાં લઈ જાય છે. લિફ્ટનો પાવર કેટલો હશે? (g = 10 m/s² લો)", "opts": ["1 kW", "5 kW", "10 kW", "20 kW"], "ans": 0, "exp": "કાર્ય = mgh = 500 kg × 10 m/s² × 20 m = 100,000 J. પાવર = કાર્ય/સમય = 100,000 J / 10 s = 10,000 W = 1 kW.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડતાં તે બળની દિશામાં સ્થાનાંતરિત થાય છે, પરંતુ પદાર્થની ગતિ ઊર્જામાં કોઈ ફેરફાર થતો નથી. આ પરિસ્થિતિમાં કયું વિધાન સાચું છે?", "opts": ["લગાડેલું બળ પદાર્થ પર કાર્ય કરતું નથી.", "બળ અને સ્થાનાંતરણ વચ્ચેનો ખૂણો 90° છે.", "બળ પદાર્થની ગતિની દિશામાં લાગતું નથી.", "પદાર્થ પર લાગતું બળ અને ઘર્ષણ બળ સમાન છે."], "ans": 3, "exp": "જો પદાર્થની ગતિ ઊર્જામાં ફેરફાર ન થતો હોય, તો લાગુ બળ અને ઘર્ષણ બળ સમાન હોવા જોઈએ, જેથી ચોખ્ખું કાર્ય શૂન્ય થાય.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્પ્રિંગને 0.2 m સંકોચવામાં 40 J કાર્ય કરવામાં આવે છે. જો સ્પ્રિંગનો બળ અચળાંક k હોય, તો kનું મૂલ્ય કેટલું હશે? (સ્પ્રિંગ માટે સ્થિતિસ્થાપક સ્થિતિઊર્જા = ½kx²)", "opts": ["1000 N/m", "2000 N/m", "4000 N/m", "500 N/m"], "ans": 1, "exp": "સ્થિતિસ્થાપક સ્થિતિઊર્જા = ½kx² ⇒ 40 = ½ × k × (0.2)² ⇒ k = 2000 N/m.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ **ઊર્જા સંરક્ષણના નિયમ**નું ઉલ્લંઘન કરે છે?", "opts": ["એક પદાર્થ મુક્તપણે નીચે પડે છે અને તેની ગતિ ઊર્જા વધે છે.", "એક સ્પ્રિંગને ખેંચવામાં આવે છે અને તેની સ્થિતિસ્થાપક સ્થિતિઊર્જા વધે છે.", "એક વિદ્યુત મોટર વિદ્યુત ઊર્જાને યાંત્રિક ઊર્જામાં રૂપાંતરિત કરે છે.", "એક બંધ પ્રણાલીમાં કુલ ઊર્જા સમય સાથે વધે છે."], "ans": 3, "exp": "ઊર્જા સંરક્ષણનો નિયમ જણાવે છે કે બંધ પ્રણાલીમાં કુલ ઊર્જા અચળ રહે છે, તેથી તે સમય સાથે વધી શકે નહીં.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક વ્યક્તિ 20 kgનો બૉક્સ 5 m ઊંચાઈ સુધી સીધો ઉપર ઉઠાવે છે. જો ગુરુત્વાકર્ષણ પ્રવેગ g = 10 m/s² હોય, તો વ્યક્તિ દ્વારા થયેલું કાર્ય કેટલું હશે?", "opts": ["500 J", "1000 J", "200 J", "100 J"], "ans": 1, "exp": "કાર્ય = બળ × સ્થાનાંતર × cosθ ⇒ W = mgh = 20 × 10 × 5 = 1000 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેના વિધાનોને ધ્યાનમાં લો: (I) પાવર એ કાર્ય કરવાનો દર છે. (II) પાવરનો SI એકમ વોટ છે. (III) પાવર અને ઊર્જા બંને સદિશ રાશિઓ છે. (IV) એક જ કાર્ય ઝડપથી કરવા માટે વધુ પાવરની જરૂર પડે છે. ઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["એક", "બે", "ત્રણ", "ચાર"], "ans": 2, "exp": "વિધાન (I), (II) અને (IV) સાચાં છે. પાવર અને ઊર્જા અદિશ રાશિઓ છે, તેથી વિધાન (III) ખોટું છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડીને તેને બળની દિશામાં સ્થાનાંતરિત કરવામાં આવે છે. જો બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો θ હોય, તો થયેલું કાર્ય કયા સૂત્રથી દર્શાવાય છે?", "opts": ["W = F s cosθ", "W = F s sinθ", "W = F s tanθ", "W = F s"], "ans": 0, "exp": "કાર્યની વ્યાખ્યા મુજબ, કાર્ય (W) = બળ (F) × સ્થાનાંતર (s) × બળ અને સ્થાનાંતર વચ્ચેના ખૂણાનો કોસાઇન (cosθ).", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થની ગતિ ઊર્જા 100 J છે. જો તેની ઝડપ બમણી કરવામાં આવે, તો તેની નવી ગતિ ઊર્જા કેટલી થશે?", "opts": ["200 J", "400 J", "800 J", "100 J"], "ans": 2, "exp": "ગતિ ઊર્જા (K) = ½mv². ઝડપ બમણી થતાં, નવી ગતિ ઊર્જા ચાર ગણી થાય છે (K ∝ v²).", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન યાંત્રિક ઊર્જાના સંરક્ષણના નિયમને લાગુ પડતું નથી?", "opts": ["સંરક્ષી બળોની હાજરીમાં કુલ યાંત્રિક ઊર્જા અચળ રહે છે.", "ઘર્ષણ બળની હાજરીમાં કુલ યાંત્રિક ઊર્જા અચળ રહે છે.", "ગુરુત્વાકર્ષણ બળ હેઠળ મુક્તપતન કરતા પદાર્થની યાંત્રિક ઊર્જા અચળ રહે છે.", "સ્થિતિસ્થાપક સ્પ્રિંગમાં સંગ્રહાયેલી ઊર્જા યાંત્રિક ઊર્જાનો ભાગ છે."], "ans": 1, "exp": "ઘર્ષણ બળ એ બિન-સંરક્ષી બળ છે, જે યાંત્રિક ઊર્જાને ઉષ્મા ઊર્જામાં રૂપાંતરિત કરે છે, તેથી કુલ યાંત્રિક ઊર્જા અચળ રહેતી નથી.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક મશીન 5 સેકન્ડમાં 250 J કાર્ય કરે છે. જો આ મશીનની કાર્યક્ષમતા 80% હોય, તો મશીનને આપવામાં આવતી ઊર્જા કેટલી હશે?", "opts": ["200 J", "250 J", "312.5 J", "300 J"], "ans": 2, "exp": "કાર્યક્ષમતા = (ઉપયોગી કાર્ય / આપેલી ઊર્જા) × 100. અહીં, 80 = (250 / આપેલી ઊર્જા) × 100 ⇒ આપેલી ઊર્જા = 312.5 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું ઉદાહરણ પાવરના ખ્યાલને દર્શાવતું નથી?", "opts": ["એક વ્યક્તિ 10 kg વજનને 2 m ઊંચાઈ સુધી 5 સેકન્ડમાં ઉપાડે છે.", "એક કાર 60 km/hની ઝડપે 1 કલાક સુધી ચાલે છે.", "એક પંખો 220 V અને 0.5 A પ્રવાહ પર ચાલે છે.", "એક સ્પ્રિંગને 0.1 m સુધી ખેંચવામાં આવે છે."], "ans": 3, "exp": "પાવર એ કાર્ય અથવા ઊર્જાનો સમય દર છે. સ્પ્રિંગને ખેંચવું એ માત્ર કાર્ય દર્શાવે છે, પાવર નહીં.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડતાં તેનું સ્થાનાંતર બળની દિશામાં થાય છે. જો બળનું મૂલ્ય 15 N અને સ્થાનાંતર 4 m હોય, તો થયેલું કાર્ય કેટલું હશે? (બળ અને સ્થાનાંતર એક જ દિશામાં છે)", "opts": ["60 J", "30 J", "19 J", "શૂન્ય"], "ans": 0, "exp": "કાર્ય = બળ × સ્થાનાંતર = 15 N × 4 m = 60 J. કારણ કે બળ અને સ્થાનાંતર એક જ દિશામાં છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક વસ્તુનું દળ 2 kg છે અને તે 10 m/sની ઝડપથી ગતિ કરી રહી છે. તેની ગતિ ઊર્જા કેટલી હશે?", "opts": ["100 J", "50 J", "200 J", "10 J"], "ans": 0, "exp": "ગતિ ઊર્જા = ½ × દળ × (ઝડપ)² = ½ × 2 kg × (10 m/s)² = 100 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક મશીનની કાર્યક્ષમતા 75% છે. જો તેને 800 J ઊર્જા આપવામાં આવે, તો તે કેટલું ઉપયોગી કાર્ય કરશે?", "opts": ["600 J", "200 J", "800 J", "1066.67 J"], "ans": 0, "exp": "કાર્યક્ષમતા = (ઉપયોગી કાર્ય / આપેલી ઊર્જા) × 100. તેથી, ઉપયોગી કાર્ય = (75/100) × 800 J = 600 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડતાં તે બળની દિશામાં 4 મીટર જેટલું સ્થાનાંતર થાય છે. જો બળનું મૂલ્ય 15 N હોય અને પદાર્થ પર થયેલું કાર્ય 48 J હોય, તો બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો કેટલો હશે?", "opts": ["0°", "30°", "60°", "90°"], "ans": 2, "exp": "કાર્યનું સૂત્ર W = F · s · cosθ છે. અહીં W = 48 J, F = 15 N, s = 4 m છે. તેથી cosθ = 48 / (15 × 4) = 0.8 થાય, જે θ = 60° દર્શાવે છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક મશીન 2 સેકન્ડમાં 1000 J કાર્ય કરે છે. જો મશીનની કાર્યક્ષમતા 80% હોય, તો મશીનને આપવામાં આવતી પાવર કેટલી હશે?", "opts": ["500 W", "625 W", "800 W", "1000 W"], "ans": 1, "exp": "મશીનની આઉટપુટ પાવર = 1000 J / 2 s = 500 W. કાર્યક્ષમતા = 80% = 0.8. તેથી ઇનપુટ પાવર = આઉટપુટ પાવર / કાર્યક્ષમતા = 500 / 0.8 = 625 W.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું પાવરનું એકમ નથી?", "opts": ["વોટ (W)", "જૂલ/સેકન્ડ (J/s)", "ન્યૂટન-મીટર/સેકન્ડ (N·m/s)", "જૂલ (J)"], "ans": 3, "exp": "પાવરનો SI એકમ વોટ (W) છે, જે જૂલ/સેકન્ડ અથવા ન્યૂટન-મીટર/સેકન્ડ જેટલો હોય છે. જૂલ એ ઊર્જાનું એકમ છે, પાવરનું નહીં.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થની ગતિ ઊર્જા 50 J છે. જો તેની ઝડપને ત્રણ ગણી કરવામાં આવે, તો તેની નવી ગતિ ઊર્જા કેટલી થશે? (દળ અચળ રહે છે)", "opts": ["50 J", "150 J", "300 J", "450 J"], "ans": 3, "exp": "ગતિ ઊર્જા K = ½mv² છે. ઝડપ ત્રણ ગણી કરતાં નવી ગતિ ઊર્જા K' = ½m(3v)² = 9 × ½mv² = 9 × 50 J = 450 J થાય.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્પ્રિંગને 0.1 m સંકોચવામાં 2 J કાર્ય કરવું પડે છે. જો સ્પ્રિંગ અચળાંક k હોય, તો kનું મૂલ્ય કેટલું હશે? (સ્પ્રિંગનું સમીકરણ F = -kx માનો)", "opts": ["100 N/m", "200 N/m", "300 N/m", "400 N/m"], "ans": 3, "exp": "સ્પ્રિંગમાં સંગ્રહિત સ્થિતિ ઊર્જા U = ½kx². અહીં U = 2 J, x = 0.1 m. તેથી k = 2U/x² = 2×2/(0.1)² = 400 N/m.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક વ્યક્તિ 50 kg દળનો બૉક્સ 2 m ઊંચાઈએ સ્થિર રીતે ઉપાડે છે. જો g = 10 m/s² હોય, તો વ્યક્તિ દ્વારા થતું કાર્ય કેટલું હશે? (ઘર્ષણ અવગણો)", "opts": ["500 J", "1000 J", "1500 J", "2000 J"], "ans": 1, "exp": "કાર્ય W = mgh = 50 × 10 × 2 = 1000 J. અહીં બૉક્સની ગતિ ઊર્જામાં ફેર નથી, માત્ર સ્થિતિ ઊર્જા વધે છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનાં વિધાનો ધ્યાનમાં લો: \n(i) પાવર એ કાર્ય કરવાનો દર છે.\n(ii) પાવરનો SI એકમ વૉટ છે.\n(iii) પાવર એ સદિશ રાશિ છે.\n(iv) એક જ કાર્ય વધુ સમયમાં કરવામાં આવે તો પાવર વધે છે.\nઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["એક", "બે", "ત્રણ", "ચાર"], "ans": 1, "exp": "માત્ર વિધાન (i) અને (ii) સાચાં છે. પાવર અદિશ રાશિ છે અને વધુ સમયમાં કાર્ય કરતાં પાવર ઘટે છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થને 5 m/sની પ્રારંભિક ઝડપથી ઊર્ધ્વદિશામાં ફેંકવામાં આવે છે. જો હવાનો અવરોધ અવગણવામાં આવે તો પદાર્થની મહત્તમ ઊંચાઈએ તેની ઊર્જામાં થતો ફેરફાર કયો હશે? (g = 10 m/s² લો)", "opts": ["ગતિ ઊર્જા શૂન્ય થશે અને સ્થિતિ ઊર્જા મહત્તમ થશે", "ગતિ ઊર્જા અને સ્થિતિ ઊર્જા બંને સમાન રહેશે", "ગતિ ઊર્જા મહત્તમ થશે અને સ્થિતિ ઊર્જા શૂન્ય થશે", "ગતિ ઊર્જા અને સ્થિતિ ઊર્જા બંને શૂન્ય થશે"], "ans": 0, "exp": "મહત્તમ ઊંચાઈએ પદાર્થની ઝડપ શૂન્ય થાય છે, તેથી ગતિ ઊર્જા શૂન્ય થશે અને સ્થિતિ ઊર્જા મહત્તમ થશે (ઊર્જા સંરક્ષણના નિયમ મુજબ).", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડતાં તે બળની દિશામાં 6 મીટર જેટલું સ્થાનાંતર થાય છે. જો બળનું મૂલ્ય 12 ન્યૂટન હોય અને બળ અને સ્થાનાંતર વચ્ચેનો ખૂણો 60° હોય, તો થયેલું કાર્ય કેટલું હશે?", "opts": ["36 જૂલ", iii) પાવર એ અદિશ રાશિ છે. \nઉપરોક્ત વિધાનોમાંથી કેટલાં સાચાં છે?", "opts": ["માત્ર એક", "માત્ર બે", "ત્રણેય", "એક પણ નહીં"], "ans": 1, "exp": "વિધાન (i) અને (iii) સાચાં છે. પાવરનો SI એકમ વોટ છે, જૂલ નહીં, તેથી વિધાન (ii) ખોટું છે.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડવામાં આવે છે અને તે બળની દિશામાં સ્થાનાંતરિત થાય છે. જો બળનું મૂલ્ય 25 N અને સ્થાનાંતર 4 m હોય, તો થયેલું કાર્ય કેટલું હશે? (ઘર્ષણ અવગણો)", "opts": ["100 J", "50 J", "200 J", "6.25 J"], "ans": 0, "exp": "કાર્ય = બળ × સ્થાનાંતર × cosθ (θ = 0°) ⇒ કાર્ય = 25 N × 4 m = 100 J.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "નીચેનામાંથી કયું વિધાન ઊર્જા સંરક્ષણના નિયમનું ઉદાહરણ નથી?", "opts": ["એક પથ્થરને ઉપર ફેંકતાં તેની ગતિ ઊર્જા વધે છે અને સ્થિતિ ઊર્જા ઘટે છે", "સ્વિંગ પર બેસેલું બાળક ઊંચે જાય ત્યારે તેની ગતિ ઊર્જા સ્થિતિ ઊર્જામાં રૂપાંતરિત થાય છે", "એક સ્પ્રિંગને દબાવતાં તેની સ્થિતિ ઊર્જા વધે છે અને છોડતાં તે ગતિ ઊર્જામાં રૂપાંતરિત થાય છે", "એક વિદ્યુત મોટર ચાલુ કરતાં તેની યાંત્રિક ઊર્જા વિદ્યુત ઊર્જામાં રૂપાંતરિત થાય છે"], "ans": 3, "exp": "વિદ્યુત મોટર વિદ્યુત ઊર્જાને યાંત્રિક ઊર્જામાં રૂપાંતરિત કરે છે, જે ઊર્જા સંરક્ષણના નિયમનું ઉલ્લંઘન નથી, પરંતુ અહીં રૂપાંતરણની દિશા ઊર્જા સંરક્ષણના ઉદાહરણ તરીકે ગણાતી નથી.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક પદાર્થ પર બળ લગાડતાં તે બળની દિશામાં 4 મીટર જેટલું સ્થાનાંતર થાય છે. જો બળનું મૂલ્ય 10 ન્યૂટન હોય અને પદાર્થની ગતિ ઊર્જામાં થતો ફેરફાર 20 જૂલ હોય, તો બળ વડે થયેલ કાર્ય અને ગતિ ઊર્જામાં થયેલ વધારાનો ગુણોત્તર કેટલો હશે?", "opts": ["1:1", "2:1", "1:2", "4:1"], "ans": 1, "exp": "બળ વડે થયેલ કાર્ય W = F × s = 10 N × 4 m = 40 J. ગતિ ઊર્જામાં થયેલ વધારો ΔK = 20 J. ગુણોત્તર W:ΔK = 40:20 = 2:1.", "chapter": "કાર્ય, ઊર્જા અને પાવર", "svg": "", "subject": "PHYSICS"}, {"q": "એક વસ્તુ પર બળ લગાડતાં તે વસ્તુમાં સ્થાનાંતર થાય છે, પરંતુ તે વસ્તુની ગતિ ઊર્જામાં કોઈ ફેર પડતો નથી. આ પરિસ્થિતિમાં નીચેનામાંથી કયું વિધાન સાચું છે?", "opts": ["લગાડેલ const SUBJECTS=[{"name": "PHYSICS", "start": 0, "end": 44, "count": 45}, {"name": "CHEMISTRY", "start": 45, "end": 89, "count": 45}, {"name": "BIOLOGY", "start": 90, "end": 179, "count": 90}];
const MARKS_C=4, MARKS_W=-1;
const DURATION=180*60;
let answers={}, marked=new Set(), visited=new Set(), curIdx=0, remaining=DURATION, timerHandle=null, submitted=false;
let subjectLastIdx={};
SUBJECTS.forEach(s=>subjectLastIdx[s.name]=s.start);

function subjectOf(i){ return SUBJECTS.find(s=>i>=s.start&&i<=s.end); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = SUBJECTS.map((s,i)=>
    `<button class="tab-btn ${subjectOf(curIdx).name===s.name?'active':''}" onclick="jumpSubject('${s.name}')">${s.name} (${s.count})</button>`
  ).join('');
}
function jumpSubject(subjName){ curIdx = subjectLastIdx[subjName] !== undefined ? subjectLastIdx[subjName] : SUBJECTS.find(s=>s.name===subjName).start; render(); }

function renderPalette(){
  let html='';
  SUBJECTS.forEach(s=>{
    html += `<div class="subj-h">${s.name}</div><div class="palette">`;
    for(let i=s.start;i<=s.end;i++){
      let cls='notvisited';
      if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; subjectLastIdx[subjectOf(i).name]=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>

  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; subjectLastIdx[subjectOf(n).name]=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++; subjectLastIdx[subjectOf(curIdx).name]=curIdx;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=900) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "NEET Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Mock Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--panel:#fff;--border:#d7dce3;--accent:#0b5fa5;--danger:#d23b3b;--success:#1f9254;--marked:#8a3ffc;--muted:#667085;--not-visited:#9aa4b2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Gujarati','Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1a1f29;}
.topbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:700;}
.topbar .sub{font-size:11px;opacity:.85;}
.timer{background:#093f6e;padding:6px 14px;border-radius:6px;font-weight:700;font-size:15px;font-family:monospace;}
.timer.warn{background:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tabs{display:flex;gap:6px;background:#dde4ec;padding:8px 10px;overflow-x:auto;}
.tab-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{display:flex;gap:14px;max-width:1100px;margin:14px auto;padding:0 12px;align-items:flex-start;flex-wrap:wrap;}
.qpanel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.qnum{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;}
.chtag{font-size:11px;color:var(--muted);}
.qtext{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:14px;}
.svgbox{margin:10px 0;text-align:center;}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
.opt:hover{border-color:var(--accent);background:#f2f8ff;}
.opt.selected{border-color:var(--accent);background:#e3f0ff;font-weight:600;}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent);}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-prev{background:#e2e6ec;color:#333;}
.btn-clear{background:#fdecea;color:var(--danger);}
.btn-mark{background:#f1e9fc;color:var(--marked);}
.btn-next{background:var(--accent);color:#fff;}
.btn-submit{background:var(--success);color:#fff;}
.sidebar{width:270px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;margin-bottom:10px;}
.legend span{display:flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:340px;overflow-y:auto;padding-right:4px;}
.pbtn{border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;}
.pbtn.answered{background:var(--success);color:#fff;border-color:var(--success);}
.pbtn.notanswered{background:var(--danger);color:#fff;border-color:var(--danger);}
.pbtn.marked{background:var(--marked);color:#fff;border-color:var(--marked);}
.pbtn.notvisited{background:#fff;color:#333;}
.pbtn.current{outline:2px solid #000;}
.subj-h{font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;}
#result{display:none;max-width:900px;margin:20px auto;padding:0 12px;}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;text-align:center;margin-bottom:14px;}
.bigscore{font-size:38px;font-weight:800;color:var(--accent);}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat{background:#f2f4f7;border-radius:8px;padding:10px 16px;min-width:90px;}
.stat b{display:block;font-size:18px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;text-align:left;}
.review-item .tag-ok{color:var(--success);font-weight:700;}
.review-item .tag-wrong{color:var(--danger);font-weight:700;}
.review-item .tag-skip{color:var(--muted);font-weight:700;}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px;}
@media(max-width:760px){.sidebar{width:100%;}}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>NEET Mock Test</h1><div class="sub">NEET UG • 179 Questions • Max Marks 716</div></div>
  <div class="timer" id="timer">--:--:--</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="qpanel" id="qpanel"></div>
  <div class="sidebar">
    <div class="legend">
      <span><i class="dot" style="background:var(--success)"></i>Answered</span>
      <span><i class="dot" style="background:var(--danger)"></i>Not Answered</span>
      <span><i class="dot" style="background:var(--marked)"></i>Marked</span>
      <span><i class="dot" style="background:#fff;border:1px solid #ccc"></i>Not Visited</span>
    </div>
    <div id="palette"></div>
    <button class="btn btn-submit" style="width:100%;margin-top:12px;" onclick="submitTest()">Submit Test ✓</button>
  </div>
</div>

<div id="result">
  <div class="rcard">
    <div class="bigscore" id="r-score">0</div>
    <div style="color:var(--muted);font-size:13px;">out of 716 marks</div>
    <div class="stats">
      <div class="stat"><b id="r-cor" style="color:var(--success)">0</b>Correct</div>
      <div class="stat"><b id="r-wrg" style="color:var(--danger)">0</b>Wrong</div>
      <div class="stat"><b id="r-skp" style="color:var(--muted)">0</b>Unattempted</div>
      <div class="stat"><b id="r-pct">0%</b>Percentage</div>
    </div>
    <table id="subj-table"><thead><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-next" onclick="toggleReview()">Show Detailed Review</button>
      <button class="btn btn-prev" onclick="downloadResult()">⬇ Download Result</button>
    </div>
  </div>
  <div id="review-list" style="display:none;"></div>
</div>
<div class="footer">Made with ❤️ by @xdsonic | 179 Questions | NEET UG</div>

<script>
const LETTERS=['A','B','C','D'];

 થશે.", "chapter": "વિદ્યુતભારો અને ક્ષેત્રો", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્થિત તરંગમાં, જો તંતુની લંબાઈ 1.2 મીટર હોય અને તેના પર ત્રીજું ઓવરટોન ઉત્પન્ન થતું હોય, તો તરંગની તરંગલંબાઈ કેટલી હશે?", "opts": ["0.8 મીટર", "1.2 મીટર", "1.6 મીટર", "0.6 મીટર"], "ans": 0, "exp": "ત્રીજા ઓવરટોન માટે તંતુ પર 4 અડધી તરંગલંબાઈ સમાય છે, તેથી તરંગલંબાઈ λ = 2L/4 = 2×1.2/4 = 0.6 મીટર નહીં, પણ λ = 2L/3 = 0.8 મીટર થાય.", "chapter": "તરંગો", "svg": "", "subject": "PHYSICS"}, {"q": "બે બિંદુવત્ વિદ્યુતભારો q₁ = +8 μC અને q₂ = -8 μC વચ્ચેનું અંતર 0.4 મીટર છે. આ વિદ્યુત ડાયપોલનું ડાયપોલ મોમેન્ટ કેટલું હશે?", "opts": ["3.2 × 10⁻⁶ C·m", "6.4 × 10⁻⁶ C·m", "1.6 × 10⁻⁶ C·m", "4.8 × 10⁻⁶ C·m"], "ans": 0, "exp": "ડાયપોલ મોમેન્ટ p = q × 2a = 8×10⁻⁶ C × 0.4 m = 3.2×10⁻⁶ C·m.", "chapter": "વિદ્યુતભારો અને ક્ષેત્રો", "svg": "", "subject": "PHYSICS"}, {"q": "એક સ્થિત તરંગમાં, જો બે ક્રમિક નિસ્યંદબિંદુઓ વચ્ચેનું અંતર 0.3 મીટર હોય, તો તરંગની તરંગલંબાઈ કેટલી હશે?", "opts": ["0.6 મીટર", "0.3 મીટર", "1.2 મીટર", "0.9 મીટર"], "ans": 0, "exp": "બે ક્રમિક નિસ્યંદબિંદુઓ વચ્ચેનું અંતર λ/2 જેટલું હોય છે, તેથી λ = 2 × 0.3 = 0.6 મીટર.", "chapter": "તરંગો", "svg": "", "subject": "PHYSICS"}, {"q": "એક ઘન પદાર્થનો એકમ કોષ ફેસ-કેન્દ્રિત ક્યુબિક (FCC) છે. જો એકમ કોષની ધારની લંબાઈ 400 pm હોય, તો તે પદાર્થના પરમાણુની ત્રિજ્યા કેટલી હશે?", "opts": ["100 pm", "141.4 pm", "200 pm", "282.8 pm"], "ans": 1, "exp": "FCC એકમ કોષમાં પરમાણુની ત્રિજ્યા (r) અને ધારની લંબાઈ (a) વચ્ચેનો સંબંધ r = a√2/4 છે. અહીં a = 400 pm, તેથી r = 400 × 1.414/4 = 141.4 pm.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું દ્રાવણ આદર્શ દ્રાવણ નથી?", "opts": ["બેન્ઝિન અને ટોલ્યુઇન", "ઇથેનોલ અને મિથેનોલ", "એસિટોન અને ક્લોરોફોર્મ", "n-હેક્ઝેન અને n-હેપ્ટેન"], "ans": 2, "exp": "આદર્શ દ્રાવણમાં દ્રાવક-દ્રાવ્ય વચ્ચેના આંતરઆણ્વીય બળો દ્રાવક-દ્રાવક અને દ્રાવ્ય-દ્રાવ્ય બળો જેવા જ હોય છે. એસિટોન અને ક્લોરોફોર્મ વચ્ચે હાઇડ્રોજન બોન્ડિંગ થાય છે, તેથી તે આદર્શ દ્રાવણ નથી.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં 18 g ગ્લુકોઝ (C₆H₁₂O₆) 90 g પાણીમાં ઓગાળવામાં આવે છે. આ દ્રાવણનું મોલાલિટી (molality) શું હશે?", "opts": ["0.55 m", "1.00 m", "1.11 m", "2.00 m"], "ans": 2, "exp": "ગ્લુકોઝનું મોલર દળ = 180 g/mol, તેથી મોલ સંખ્યા = 18/180 = 0.1 mol. મોલાલિટી = મોલ સંખ્યા/દ્રાવકનું દળ (kg) = 0.1/0.09 = 1.11 m.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું વિધાન શુદ્ધ ઘન પદાર્થના ગુણધર્મો માટે ખોટું છે?", "opts": ["તેનો આકાર અને કદ નિશ્ચિત હોય છે.", "તેના ઘટક કણો નિશ્ચિત સ્થાને ગોઠવાયેલા હોય છે.", "તે સંપીડ્ય (compressible) હોય છે.", "તેના ઘટક કણો વચ્ચે પ્રબળ આંતરઆણ્વીય બળો હોય છે."], "ans": 2, "exp": "શુદ્ધ ઘન પદાર્થો અસંપીડ્ય (incompressible) હોય છે કારણ કે તેમના ઘટક કણો નિશ્ચિત સ્થાને ગોઠવાયેલા હોય છે.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં દ્રાવ્યનું મોલ અંશ 0.2 છે. જો દ્રાવણનું કુલ દળ 180 g હોય અને દ્રાવકનું મોલર દળ 18 g/mol હોય, તો દ્રાવ્યનું દળ શું હશે?", "opts": ["20 g", "40 g", "60 g", "80 g"], "ans": 2, "exp": "દ્રાવકનું મોલ અંશ = 0.8, તેથી દ્રાવકના મોલ = 0.8 × (કુલ મોલ). દ્રાવકનું દળ = 18 × 0.8 × (કુલ મોલ) = 144 g. તેથી દ્રાવ્યનું દળ = 180 - 144 = 36 g (નજીકનું વિકલ્પ 40 g).", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક ઘન પદાર્થનો એકમ કોષ બોડી-કેન્દ્રિત ક્યુબિક (BCC) છે. જો એકમ કોષની ધારની લંબાઈ 300 pm હોય, તો તે પદાર્થના પરમાણુ વચ્ચેનું લઘુતમ અંતર કેટલું હશે?", "opts": ["259.8 pm", "300 pm", "346.4 pm", "519.6 pm"], "ans": 0, "exp": "BCC એકમ કોષમાં લઘુતમ અંતર = a√3/2, જ્યાં a = 300 pm. તેથી અંતર = 300 × 1.732/2 = 259.8 pm.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક ઘન પદાર્થનો એકમ કોષ સરળ ઘન (simple cubic) છે. જો એકમ કોષની ધારની લંબાઈ 3 Å હોય, તો તે પદાર્થના પરમાણુની ત્રિજ્યા કેટલી હશે?", "opts": ["1.5 Å", "0.75 Å", "3 Å", "1.0 Å"], "ans": 0, "exp": "સરળ ઘન એકમ કોષમાં પરમાણુની ત્રિજ્યા (r) અને ધારની લંબાઈ (a) વચ્ચેનો સંબંધ r = a/2 છે. અહીં a = 3 Å, તેથી r = 1.5 Å.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું વિધાન અસ્ફટિકમય ઘન પદાર્થ માટે સાચું નથી?", "opts": ["તેને નિશ્ચિત ગલનબિંદુ હોતું નથી.", "તે સમદૈશિક (isotropic) હોય છે.", "તેની પરમાણુઓ નિયમિત રીતે ગોઠવાયેલી હોય છે.", "કાચ તેનું ઉદાહરણ છે."], "ans": 2, "exp": "અસ્ફટિકમય ઘન પદાર્થોમાં પરમાણુઓની ગોઠવણી અનિયમિત હોય છે, તેથી તે સમદૈશિક હોય છે અને નિશ્ચિત ગલનબિંદુ ધરાવતા નથી.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં 5.85 g NaCl 500 g પાણીમાં ઓગાળવામાં આવે છે. આ દ્રાવણની મોલાલિટી (molality) કેટલી હશે? (NaClનું મોલર દળ = 58.5 g/mol)", "opts": ["0.1 m", "0.2 m", "0.05 m", "0.4 m"], "ans": 1, "exp": "મોલાલિટી = દ્રાવ્યના મોલ / દ્રાવકનું દળ (kg). અહીં NaClના મોલ = 5.85 / 58.5 = 0.1 mol, દ્રાવકનું દળ = 0.5 kg, તેથી મોલાલિટી = 0.1 / 0.5 = 0.2 m.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું દ્રાવણ રાઉલ્ટના નિયમનું પાલન કરતું નથી?", "opts": ["બેન્ઝિન અને ટોલ્યુઇનનું દ્રાવણ", "ઇથેનોલ અને પાણીનું દ્રાવણ", "હેક્ઝેન અને હેપ્ટેનનું દ્રાવણ", "કાર્બન ટેટ્રાક્લોરાઇડ અને સિલિકોન ટેટ્રાક્લોરાઇડનું દ્રાવણ"], "ans": 1, "exp": "ઇથેનોલ અને પાણી વચ્ચે હાઇડ્રોજન બોન્ડિંગ થાય છે, જે રાઉલ્ટના નિયમથી વિચલનનું કારણ બને છે.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં દ્રાવ્યનું વજન ટકાવારી 20% છે. જો દ્રાવણનું કુલ દળ 200 g હોય, તો દ્રાવકનું દળ કેટલું હશે?", "opts": ["160 g", "40 g", "180 g", "20 g"], "ans": 0, "exp": "વજન ટકાવારી = (દ્રાવ્યનું દળ / દ્રાવણનું કુલ દળ) × 100. અહીં દ્રાવ્યનું દળ = 20% × 200 g = 40 g, તેથી દ્રાવકનું દળ = 200 g - 40 g = 160 g.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયો ઘન પદાર્થ સહસંયોજક જાળીદાર બંધારણ ધરાવે છે?", "opts": ["સોડિયમ ક્લોરાઇડ (NaCl)", "ડાયમંડ (C)", "આયોડિન (I₂)", "કોપર (Cu)"], "ans": 1, "exp": "ડાયમંડમાં કાર્બન પરમાણુઓ સહસંયોજક બંધથી જોડાયેલા હોય છે, જે મજબૂત ત્રિપરિમાણીય જાળીદાર બંધારણ બનાવે છે.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં 9 g ગ્લુકોઝ (C₆H₁₂O₆) 180 g પાણીમાં ઓગાળવામાં આવે છે. આ દ્રાવણનું મોલાલિટી કેટલું હશે?", "opts": ["0.1 m", "0.25 m", "0.5 m", "1.0 m"], "ans": 1, "exp": "ગ્લુકોઝનું મોલ = 9/180 = 0.05 mol. પાણીનું દળ = 180 g = 0.18 kg. મોલાલિટી = 0.05/0.18 = 0.278 ≈ 0.25 m.", "chapter": "દ્રાવણો", "svg": "<svg width='220' height='120' viewBox='0 0 220 120'><path d='M50 60 L70 40 L90 60 L110 40 L130 60 L150 40 L170 60 L150 80 L130 100 L110 80 L90 100 L70 80 Z' fill='none' stroke='black' stroke-width='2'/><text x='40' y='65' font-size='12'>O</text><text x='180' y='65' font-size='12'>OH</text><text x='110' y='35' font-size='12'>OH</text><text x='110' y='105' font-size='12'>OH</text><text x='70' y='85' font-size='12'>OH</text><text x='150' y='85' font-size='12'>OH</text></svg>", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું વિધાન અર્ધવાહક પદાર્થ માટે સાચું છે?", "opts": ["તેનું વિદ્યુત અવરોધ તાપમાન વધતા વધે છે.", "તેનું વિદ્યુત અવરોધ તાપમાન વધતા ઘટે છે.", "તેનું વિદ્યુત અવરોધ તાપમાન પર આધારિત નથી.", "તેનું વિદ્યુત અવરોધ શૂન્ય હોય છે."], "ans": 1, "exp": "અર્ધવાહક પદાર્થોમાં તાપમાન વધતા વિદ્યુત વાહકતા વધે છે, જેના કારણે વિદ્યુત અવરોધ ઘટે છે.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં બે પ્રવાહી A અને B ના મોલ અંશ અનુક્રમે 0.4 અને 0.6 છે. જો શુદ્ધ A અને B ના બાષ્પદબાણ અનુક્રમે 100 mmHg અને 200 mmHg હોય, તો દ્રાવણનું કુલ બાષ્પદબાણ કેટલું હશે?", "opts": ["140 mmHg", "160 mmHg", "180 mmHg", "200 mmHg"], "ans": 1, "exp": "રાઉલ્ટના નિયમ મુજબ, P = P_A° × x_A + P_B° × x_B = 100 × 0.4 + 200 × 0.6 = 40 + 120 = 160 mmHg.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયો ઘન પદાર્થ ધાત્વીય બંધારણ ધરાવતો નથી?", "opts": ["તાંબું (Cu)", "સોડિયમ ક્લોરાઇડ (NaCl)", "લોખંડ (Fe)", "ચાંદી (Ag)"], "ans": 1, "exp": "સોડિયમ ક્લોરાઇડ (NaCl) આયનીય બંધ ધરાવે છે, જ્યારે બાકીના ધાતુઓ ધાત્વીય બંધ ધરાવે છે.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં 36 g ગ્લુકોઝ (C₆H₁₂O₆) 180 g પાણીમાં ઓગાળવામાં આવે છે. આ દ્રાવણનું મોલાલિટી કેટલું હશે? (ગ્લુકોઝનું મોલર દળ = 180 g mol⁻¹)", "opts": ["0.5 mol kg⁻¹", "1.0 mol kg⁻¹", "1.5 mol kg⁻¹", "2.0 mol kg⁻¹"], "ans": 1, "exp": "મોલાલિટી = દ્રાવ્યના મોલ / દ્રાવકનું દળ (kg). અહીં ગ્લુકોઝના મોલ = 36/180 = 0.2 mol, દ્રાવકનું દળ = 0.18 kg, તેથી મોલાલિટી = 0.2/0.18 = 1.11 ≈ 1.0 mol kg⁻¹.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયું વિધાન અસ્ફટિકમય ઘન પદાર્થ માટે ખોટું છે?", "opts": ["તેને નિશ્ચિત ગલનબિંદુ હોતું નથી.", "તે સમદિગ્ધર્મી (isotropic) હોય છે.", "તેનું બંધારણ લાંબા અંતર સુધી ક્રમબદ્ધ હોય છે.", "કાચ તેનું ઉદાહરણ છે."], "ans": 2, "exp": "અસ્ફટિકમય ઘન પદાર્થોમાં લાંબા અંતર સુધી ક્રમબદ્ધતા હોતી નથી, તેઓ માત્ર ટૂંકા અંતર સુધી ક્રમબદ્ધ હોય છે.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવણમાં બે પ્રવાહી X અને Y ના મોલ અંશ અનુક્રમે 0.3 અને 0.7 છે. જો શુદ્ધ X અને Y ના બાષ્પદબાણ અનુક્રમે 100 mmHg અને 200 mmHg હોય, તો દ્રાવણનું કુલ બાષ્પદબાણ કેટલું હશે? (રાઉલ્ટના નિયમ મુજબ)", "opts": ["130 mmHg", "170 mmHg", "190 mmHg", "210 mmHg"], "ans": 1, "exp": "રાઉલ્ટના નિયમ મુજબ, કુલ બાષ્પદબાણ = (Xનું મોલ અંશ × Xનું બાષ્પદબાણ) + (Yનું મોલ અંશ × Yનું બાષ્પદબાણ) = (0.3 × 100) + (0.7 × 200) = 30 + 140 = 170 mmHg.", "chapter": "દ્રાવણો", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયો ઘન પદાર્થ વાન ડર વાલ્સ બળો દ્વારા જોડાયેલો હોય છે?", "opts": ["સોડિયમ ક્લોરાઇડ (NaCl)", "આયોડિન (I₂)", "સિલિકોન કાર્બાઇડ (SiC)", "તાંબું (Cu)"], "ans": 1, "exp": "આયોડિન (I₂) અણુઓ વચ્ચે વાન ડર વાલ્સ બળો દ્વારા જોડાયેલા હોય છે, જ્યારે બાકીના આયનીય, સહસંયોજક અથવા ધાત્વીય બંધ ધરાવે છે.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "નીચેના પૈકી કયો ઘન પદાર્થ આયનીય બંધારણ ધરાવે છે?", "opts": ["ડાયમંડ", "સોડિયમ ક્લોરાઇડ (NaCl)", "ગ્રેફાઇટ", "આયોડિન"], "ans": 1, "exp": "સોડિયમ ક્લોરાઇડ (NaCl) આયનીય બંધ દ્વારા જોડાયેલો ઘન પદાર્થ છે, જ્યારે ડાયમંડ અને ગ્રેફાઇટ સહસંયોજક બંધારણ ધરાવે છે અને આયોડિન વાન ડર વાલ્સ બળો દ્વારા જોડાયેલો છે.", "chapter": "ઘન અવસ્થા", "svg": "", "subject": "CHEMISTRY"}, {"q": "એક દ્રાવ       if(marked.has(i)) cls='marked';
      else if(answers[i]!==undefined) cls='answered';
      else if(visited.has(i)) cls='notanswered';
      if(i===curIdx) cls+=' current';
      html += `<button class="pbtn ${cls}" onclick="goTo(${i})">${i-s.start+1}</button>`;
    }
    html += `</div>`;
  });
  document.getElementById('palette').innerHTML = html;
}
function goTo(i){ curIdx=i; render(); }

function render(){
  visited.add(curIdx);
  const q = QUESTIONS[curIdx];
  const sub = subjectOf(curIdx);
  const localNum = curIdx - sub.start + 1;
  const optHtml = q.opts.map((o,i)=>{
    const sel = answers[curIdx]===i ? 'selected' : '';
    return `<div class="opt ${sel}" onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`;
  }).join('');
  const svgHtml = q.svg ? `<div class="svgbox">${q.svg}</div>` : '';
  document.getElementById('qpanel').innerHTML = `
    <div class="qhead"><span class="qnum">${sub.name} Q${localNum}/${sub.count}</span>
    ${q.chapter?'<span class="chtag">📘 '+q.chapter+'</span>':''}</div>
    <div class="qtext">${q.q}</div>
    ${svgHtml}
    <div class="opts">${optHtml}</div>
    <div class="navrow">
      <button class="btn btn-prev" onclick="nav(-1)">← Previous</button>
      <button class="btn btn-clear" onclick="clearResp()">Clear Response</button>
      <button class="btn btn-mark" onclick="markNext()">Mark for Review & Next</button>
      <button class="btn btn-next" onclick="saveNext()">Save & Next →</button>
    </div>
  `;
  renderTabs();
  renderPalette();
}
function pick(i){ answers[curIdx]=i; renderPalette(); }
function clearResp(){ delete answers[curIdx]; render(); }
function nav(d){ const n=curIdx+d; if(n>=0&&n<QUESTIONS.length){curIdx=n; render();} }
function saveNext(){ if(curIdx<QUESTIONS.length-1){curIdx++; render();} else render(); }
function markNext(){ marked.add(curIdx); if(curIdx<QUESTIONS.length-1){curIdx++;} render(); }

function fmtTime(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function startTimer(){
  document.getElementById('timer').textContent = fmtTime(remaining);
  timerHandle = setInterval(()=>{
    remaining--;
    document.getElementById('timer').textContent = fmtTime(remaining);
    if(remaining<=300) document.getElementById('timer').classList.add('warn');
    if(remaining<=0){ clearInterval(timerHandle); submitTest(true); }
  },1000);
}

function submitTest(auto){
  if(submitted) return;
  if(!auto && !confirm('Submit the test? You cannot change answers after this.')) return;
  submitted = true;
  if(timerHandle) clearInterval(timerHandle);
  document.querySelector('.topbar').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.querySelector('.wrap').style.display='none';
  let cor=0,wrg=0,skp=0,marksTotal=0;
  let subjRows = SUBJECTS.map(s=>({name:s.name,cor:0,wrg:0,skp:0,marks:0}));
  QUESTIONS.forEach((q,i)=>{
    const sIdx = SUBJECTS.findIndex(s=>i>=s.start&&i<=s.end);
    const a = answers[i];
    if(a===undefined){ skp++; subjRows[sIdx].skp++; }
    else if(a===q.ans){ cor++; marksTotal+=MARKS_C; subjRows[sIdx].cor++; subjRows[sIdx].marks+=MARKS_C; }
    else { wrg++; marksTotal+=MARKS_W; subjRows[sIdx].wrg++; subjRows[sIdx].marks+=MARKS_W; }
  });
  const maxMarks = QUESTIONS.length*MARKS_C;
  const pct = Math.round((marksTotal/maxMarks)*100);
  document.getElementById('r-score').textContent = marksTotal.toFixed(2);
  document.getElementById('r-cor').textContent = cor;
  document.getElementById('r-wrg').textContent = wrg;
  document.getElementById('r-skp').textContent = skp;
  document.getElementById('r-pct').textContent = pct+'%';
  document.querySelector('#subj-table tbody').innerHTML = subjRows.map(r=>
    `<tr><td>${r.name}</td><td>${r.cor}</td><td>${r.wrg}</td><td>${r.skp}</td><td>${r.marks.toFixed(2)}</td></tr>`
  ).join('');
  document.getElementById('result').style.display='block';
  window._results = {cor,wrg,skp,marksTotal,maxMarks,pct,subjRows};
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleReview(){
  const el = document.getElementById('review-list');
  if(el.style.display==='none'){
    el.innerHTML = QUESTIONS.map((q,i)=>{
      const a = answers[i];
      const tag = a===undefined ? '<span class="tag-skip">SKIPPED</span>'
                : a===q.ans ? '<span class="tag-ok">CORRECT</span>' : '<span class="tag-wrong">WRONG</span>';
      return `<div class="review-item"><b>Q${i+1} (${q.subject})</b> ${tag}<br><br>${q.q}<br><br>
        Your answer: ${a!==undefined?LETTERS[a]+'. '+q.opts[a]:'—'}<br>
        Correct answer: ${LETTERS[q.ans]}. ${q.opts[q.ans]}
        ${q.exp?'<br><br>💡 '+q.exp:''}</div>`;
    }).join('');
    el.style.display='block';
  } else { el.style.display='none'; }
}

function downloadResult(){
  const r = window._results;
  let txt = "NEET Mock Test\nNEET UG\n\n";
  txt += "Score: "+r.marksTotal.toFixed(2)+" / "+r.maxMarks+" ("+r.pct+"%)\n";
  txt += "Correct: "+r.cor+" | Wrong: "+r.wrg+" | Unattempted: "+r.skp+"\n\n";
  r.subjRows.forEach(s=>{ txt += s.name+": "+s.cor+" correct, "+s.wrg+" wrong, "+s.skp+" unattempted, "+s.marks.toFixed(2)+" marks\n"; });
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'result_'+Date.now()+'.txt';
  a.click();
}

render();
startTimer();
</script>
</body>
</html>

    <title>PrepGrid | UPSC Explorer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        app: {
                            bg: '#09090b',         // Zinc 950
                            surface: '#18181b',    // Zinc 900
                            surfaceHover: '#27272a', // Zinc 800
                            border: '#27272a',     // Zinc 800
                            borderHover: '#3f3f46',// Zinc 700
                            text: '#f4f4f5',       // Zinc 100
                            muted: '#a1a1aa',      // Zinc 400
                            accent: '#3b82f6',     // Blue 500
                            folder: '#fbbf24'      // Amber 400
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Pro Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        /* Smooth fast transitions */
        .fade-in { animation: fadeIn 0.15s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .folder-card {
            transition: all 0.2s ease;
        }
        .folder-card:active {
            transform: scale(0.98);
        }
    </style>
</head>

        // Virtual File System State
        const fileSystem = {};
        
        // Build VFS
        rawPaths.forEach(path => {
            const parts = path.split('/');
            const subject = parts[0];
            const category = parts[1];
            const filename = parts[2];

            if (!fileSystem[subject]) fileSystem[subject] = {};
            if (!fileSystem[subject][category]) fileSystem[subject][category] = [];
            
            let displayTitle = filename.replace('.html', '').replace(/-/g, ' ');
            
            fileSystem[subject][category].push({
                name: displayTitle,
                path: path
            });
        });

        // Navigation State
        let currentPath = []; // [] = Root, ['Subject'] = Subject, ['Subject', 'Category'] = Category

        const icons = {
            "General-Studies": "fa-globe-asia",
            "CSAT": "fa-brain",
            "Essay": "fa-pen-nib"
        };

        function navigate(levelIndex, pathName) {
            if (levelIndex === -1) {
                currentPath = []; // Go home
            } else if (levelIndex === 0) {
                currentPath = [pathName]; // Go to subject
            } else if (levelIndex === 1) {
                currentPath = [currentPath[0], pathName]; // Go to category
            }
            render();
        }

        function triggerReflow(element) {
            element.classList.remove('fade-in');
            void element.offsetWidth;
            element.classList.add('fade-in');
        }

        function countFilesInSubject(subject) {
            let count = 0;
            for (let category in fileSystem[subject]) {
                count += fileSystem[subject][category].length;
            }
            return count;
        }

        function render() {
            renderBreadcrumb();
            renderContent();
        }

        function renderBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            let html = `
                <button onclick="navigate(-1)" class="text-app-muted hover:text-app-text transition-colors flex items-center gap-2">
                    <i class="fas fa-home text-xs"></i> Home
                </button>
            `;

            if (currentPath.length > 0) {
                const subject = currentPath[0].replace(/-/g, ' ');
                html += `
                    <i class="fas fa-chevron-right text-[10px] text-app-borderHover mx-1"></i>
                    <button onclick="navigate(0, '${currentPath[0]}')" class="${currentPath.length === 1 ? 'text-app-text font-semibold' : 'text-app-muted hover:text-app-text'} transition-colors">
                        ${subject}
                    </button>
                `;
            }

            if (currentPath.length > 1) {
                const category = currentPath[1].replace(/-/g, ' ');
                html += `
                    <i class="fas fa-chevron-right text-[10px] text-app-borderHover mx-1"></i>
                    <span class="text-app-text font-semibold">${category}</span>
                `;
            }

            bc.innerHTML = html;
        }

        function renderContent() {
            const container = document.getElementById('explorer-container');
            triggerReflow(container);
            
            if (currentPath.length === 0) {
                // RENDER ROOT (Subjects)
                const subjects = Object.keys(fileSystem).sort();
                
                let html = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">`;
                
                subjects.forEach(subject => {
                    const fileCount = countFilesInSubject(subject);
                    const icon = icons[subject] || 'fa-folder';
                    const displayName = subject.replace(/-/g, ' ');
                    
                    html += `
                        <button onclick="navigate(0, '${subject}')" class="folder-card flex flex-col p-5 rounded-xl bg-app-surface border border-app-border hover:border-app-borderHover hover:bg-app-surfaceHover text-left group">
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-12 h-12 rounded-lg bg-app-bg border border-app-border flex items-center justify-center group-hover:scale-105 transition-transform">
                                    <i class="fas ${icon} text-2xl text-emerald-500"></i>
                                </div>
                                <span class="text-[10px] font-mono text-app-muted bg-app-bg px-2 py-1 rounded border border-app-border">${fileCount} items</span>
                            </div>
                            <h3 class="text-app-text font-semibold text-lg tracking-wide">${displayName}</h3>
                            <p class="text-xs text-app-muted mt-1 font-mono">UPSC Curriculum</p>
                        </button>
                    `;
                });
                
                html += `</div>`;
                container.innerHTML = html;

            } else if (currentPath.length === 1) {
                // RENDER LEVEL 1 (Categories inside Subject)
                const subject = currentPath[0];
                const categories = Object.keys(fileSystem[subject]).sort();
                
                let html = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">`;
                
                categories.forEach(category => {
                    const fileCount = fileSystem[subject][category].length;
                    const displayName = category.replace(/-/g, ' ');
                    
                    html += `
                        <button onclick="navigate(1, '${category}')" class="folder-card flex items-center gap-4 p-4 rounded-xl bg-app-surface border border-app-border hover:border-app-borderHover hover:bg-app-surfaceHover text-left group">
                            <i class="fas fa-folder text-3xl text-app-folder group-hover:scale-110 transition-transform drop-shadow-md"></i>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-app-text font-medium text-sm truncate">${displayName}</h3>
                                <p class="text-[11px] font-mono text-app-muted mt-0.5">${fileCount} files</p>
                            </div>
                        </button>
                    `;
                });
                
                html += `</div>`;
                container.innerHTML = html;

            } else if (currentPath.length === 2) {
                // RENDER LEVEL 2 (Files inside Category)
                const subject = currentPath[0];
                const category = currentPath[1];
                const files = fileSystem[subject][category];
                
                let html = `
                    <div class="bg-app-surface border border-app-border rounded-xl overflow-hidden shadow-2xl flex flex-col h-full max-h-[75vh]">
                        <!-- Table Header -->
                        <div class="grid grid-cols-12 gap-4 p-4 border-b border-app-border bg-[#121214] text-xs font-mono text-app-muted uppercase tracking-wider shrink-0">
                            <div class="col-span-9 md:col-span-8 px-2">Document Name</div>
                            <div class="col-span-2 hidden md:block px-2 text-left">Format</div>
                            <div class="col-span-3 md:col-span-2 px-2 text-right">Action</div>
                        </div>
                        <!-- File List -->
                        <div class="divide-y divide-app-border overflow-y-auto flex-1">
                `;
                
                files.forEach(file => {
                    html += `
                        <div class="grid grid-cols-12 gap-4 p-3 md:p-4 items-center hover:bg-app-surfaceHover transition-colors group">
                            <div class="col-span-9 md:col-span-8 flex items-center gap-4 px-2 min-w-0">
                                <div class="w-8 h-8 rounded bg-app-bg border border-app-border flex items-center justify-center shrink-0 text-emerald-500">
                                    <i class="fas fa-file-code text-sm"></i>
                                </div>
                                <a href="${file.path}" class="text-sm font-medium text-app-text group-hover:text-emerald-500 transition-colors truncate block">
                                    ${file.name}
                                </a>
                            </div>
                            <div class="col-span-2 hidden md:block px-2">
                                <span class="text-[10px] font-mono text-app-muted border border-app-border px-2 py-1 rounded bg-app-bg">HTML</span>
                            </div>
                            <div class="col-span-3 md:col-span-2 text-right px-2 flex justify-end">
                                <a href="${file.path}" class="inline-flex items-center gap-2 px-3 py-1.5 rounded bg-app-bg border border-app-border hover:border-emerald-500 hover:text-emerald-500 text-app-text text-xs font-medium transition-all">
                                    <span>Open</span>
                                    <i class="fas fa-external-link-alt text-[10px]"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
                container.innerHTML = html;
            }
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>

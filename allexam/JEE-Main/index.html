<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepGrid | JEE Main Explorer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        explorer: {
                            bg: '#0d1117',        // GitHub Dark BG
                            sidebar: '#161b22',   // GitHub Dark Sidebar
                            surface: '#21262d',   // GitHub Dark Surface
                            border: '#30363d',    // GitHub Dark Border
                            text: '#c9d1d9',      // GitHub Dark Text
                            muted: '#8b949e',     // GitHub Dark Muted
                            accent: '#58a6ff',    // GitHub Dark Blue Accent
                            folder: '#e3b341'     // Pro Folder Yellow
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }
        
        /* Pro Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
        
        /* Clean transitions */
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex h-screen w-full antialiased font-sans text-[14px]">

    <div class="md:hidden fixed top-0 left-0 right-0 h-14 bg-explorer-sidebar border-b border-explorer-border flex items-center justify-between px-4 z-50">
        <div class="flex items-center gap-2 font-semibold text-white tracking-wide">
            <i class="fas fa-layer-group text-explorer-accent"></i> JEE Main
        </div>

            <i class="fas fa-bars text-lg"></i>
        </button>
    </div>

    <aside id="sidebar" class="w-64 h-full bg-explorer-sidebar border-r border-explorer-border flex flex-col fixed md:relative z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out">
        
        <!-- App Title -->
        <div class="h-14 flex items-center px-5 border-b border-explorer-border hidden md:flex shrink-0">
            <div class="flex items-center gap-2 font-semibold text-white tracking-wide">
                <i class="fas fa-layer-group text-explorer-accent"></i> PrepGrid Vault
            </div>
        </div>

        <div class="px-5 py-3 border-b border-explorer-border shrink-0">
            <div class="text-[11px] font-semibold text-explorer-muted uppercase tracking-wider mb-1">Workspace</div>
            <div class="text-white text-sm font-medium flex items-center gap-2">
                <i class="fas fa-bullseye text-explorer-muted text-xs"></i> JEE Main
            </div>
        </div>

        <!-- Dynamic Subject Navigation -->
        <div class="flex-1 overflow-y-auto py-3">
            <div class="text-[11px] font-semibold text-explorer-muted uppercase tracking-wider mb-2 px-5">Subjects</div>
            <nav id="subject-nav" class="space-y-[2px] px-2">
                <!-- Injected via JS -->
            </nav>
        </div>
        
        <!-- Stats Footer -->
        <div class="p-4 border-t border-explorer-border shrink-0 flex items-center justify-between text-xs text-explorer-muted bg-[#0f141a]">
            <span>Total Files</span>
            <span class="font-mono text-explorer-text bg-explorer-surface px-2 py-0.5 rounded border border-explorer-border" id="total-count">396</span>
        </div>
    </aside>

    <div id="mobileOverlay" class="fixed inset-0 bg-black/60 z-30 hidden backdrop-blur-sm transition-opacity"></div>

    <main class="flex-1 flex flex-col min-w-0 h-full bg-explorer-bg relative pt-14 md:pt-0">
        
        <!-- Pro Header / Breadcrumbs -->
        <header class="h-14 border-b border-explorer-border flex items-center justify-between px-6 bg-explorer-bg shrink-0">
            <div id="breadcrumb" class="flex items-center gap-2 text-sm text-explorer-text font-medium">
                <!-- Injected via JS -->
            </div>
            
            <!-- Quick Search visual only -->
            <div class="hidden md:flex items-center gap-2 px-3 py-1.5 bg-explorer-surface border border-explorer-border rounded-md text-explorer-muted text-xs">
                <i class="fas fa-search"></i>
                <span class="font-mono">Ctrl + K</span>
            </div>
        </header>

        <!-- Dynamic View Area -->
        <div class="flex-1 overflow-y-auto p-6 md:p-8">
            <div class="max-w-6xl mx-auto">
                <div id="content-area" class="fade-in">
                    <!-- Folders or Files injected here -->

            </div>
        </div>

        let currentSubject = "Physics"; // Default root
        let currentCategory = null;     // null = show folders, string = show files inside folder

        // Build Virtual File System
        const fileSystem = {};
        
        rawPaths.forEach(path => {
            const parts = path.split('/');
            const subject = parts[0];
            const category = parts[1];
            const filename = parts[2];

            if (!fileSystem[subject]) fileSystem[subject] = {};
            if (!fileSystem[subject][category]) fileSystem[subject][category] = [];
            
            let displayTitle = filename.replace('.html', '').replace(/-/g, ' ');
            
            fileSystem[subject][category].push({
                name: displayTitle,
                path: path
            });
        });

        const subjectIcons = {
            "Physics": "fa-atom",
            "Chemistry": "fa-flask",
            "Mathematics": "fa-square-root-variable",
            "Full-Syllabus": "fa-box-archive"
        };

        function navigate(subject, category = null) {
            currentSubject = subject;
            currentCategory = category;
            
            // Re-trigger fade animation
            const contentArea = document.getElementById('content-area');
            contentArea.classList.remove('fade-in');
            void contentArea.offsetWidth; // trigger reflow
            contentArea.classList.add('fade-in');

            // Close mobile menu automatically
            if(window.innerWidth < 768) toggleMobileMenu(false);

            render();
        }

        function render() {
            renderSidebar();
            renderBreadcrumb();
            renderMainContent();
        }

        function renderSidebar() {
            const nav = document.getElementById('subject-nav');
            const subjects = Object.keys(fileSystem);
            
            nav.innerHTML = subjects.map(subject => {
                const isActive = currentSubject === subject;
                const icon = subjectIcons[subject] || 'fa-folder';
                const displayName = subject.replace(/-/g, ' ');

                if (isActive) {
                    return `
                        <button onclick="navigate('${subject}')" class="w-full flex items-center justify-between px-3 py-2 rounded-md bg-explorer-surface text-white border border-explorer-border group transition-all text-left">
                            <div class="flex items-center gap-3">
                                <i class="fas ${icon} text-explorer-accent w-4 text-center"></i>
                                <span class="font-medium text-[13px]">${displayName}</span>
                            </div>
                        </button>
                    `;
                } else {
                    return `
                        <button onclick="navigate('${subject}')" class="w-full flex items-center justify-between px-3 py-2 rounded-md text-explorer-muted hover:text-white hover:bg-explorer-surface/50 border border-transparent group transition-all text-left">
                            <div class="flex items-center gap-3">
                                <i class="fas ${icon} w-4 text-center opacity-70 group-hover:opacity-100"></i>
                                <span class="font-medium text-[13px]">${displayName}</span>
                            </div>
                        </button>
                    `;
                }
            }).join('');
        }

        function renderBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            const subjectName = currentSubject.replace(/-/g, ' ');
            
            let html = `
                <button onclick="navigate('${currentSubject}')" class="hover:text-explorer-accent transition-colors flex items-center gap-2">
                    ${subjectName}
                </button>
            `;
            
            if (currentCategory) {
                const categoryName = currentCategory.replace(/-/g, ' ');
                html += `
                    <i class="fas fa-chevron-right text-[10px] text-explorer-muted mx-1"></i>
                    <span class="text-white">${categoryName}</span>
                `;
            }
            
            bc.innerHTML = html;
        }

        function renderMainContent() {
            const container = document.getElementById('content-area');
            
            if (!currentCategory) {
                // RENDER FOLDER GRID
                const categories = Object.keys(fileSystem[currentSubject]).sort();
                
                let html = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">`;
                
                html += categories.map(category => {
                    const fileCount = fileSystem[currentSubject][category].length;
                    const displayName = category.replace(/-/g, ' ');
                    
                    return `
                        <button onclick="navigate('${currentSubject}', '${category}')" class="flex flex-col p-4 rounded-lg bg-explorer-surface border border-explorer-border hover:border-explorer-muted transition-all text-left group">
                            <div class="flex justify-between items-start mb-3">
                                <i class="fas fa-folder text-3xl text-explorer-folder group-hover:scale-110 transition-transform"></i>
                                <span class="text-[11px] font-mono text-explorer-muted bg-explorer-bg px-2 py-0.5 rounded border border-explorer-border">${fileCount}</span>
                            </div>
                            <h3 class="text-white font-medium text-sm truncate w-full">${displayName}</h3>
                        </button>
                    `;
                }).join('');
                
                html += `</div>`;
                container.innerHTML = html;
                
            } else {
                // RENDER FILE LIST (Table-like format)
                const files = fileSystem[currentSubject][currentCategory];
                
                let html = `
                    <div class="mb-4">
                        <button onclick="navigate('${currentSubject}')" class="text-explorer-muted hover:text-white flex items-center gap-2 text-sm transition-colors w-fit">
                            <i class="fas fa-level-up-alt rotate-[-90deg]"></i> Back to folders
                        </button>
                    </div>
                    <div class="bg-explorer-surface border border-explorer-border rounded-lg overflow-hidden">
                        <div class="grid grid-cols-12 gap-4 p-3 border-b border-explorer-border text-xs font-semibold text-explorer-muted uppercase tracking-wider bg-[#1a1f24]">
                            <div class="col-span-10 md:col-span-8 px-2">Name</div>
                            <div class="col-span-2 md:col-span-2 text-right md:text-left px-2 hidden md:block">Type</div>
                            <div class="col-span-2 text-right px-2">Action</div>
                        </div>
                        <div class="divide-y divide-explorer-border">
                `;
                
                html += files.map(file => {
                    return `
                        <div class="grid grid-cols-12 gap-4 p-3 items-center hover:bg-explorer-sidebar transition-colors group">
                            <div class="col-span-10 md:col-span-8 flex items-center gap-3 px-2 min-w-0">
                                <i class="fas fa-file-code text-explorer-accent opacity-80 text-lg shrink-0"></i>
                                <a href="${file.path}" class="text-sm font-medium text-explorer-text group-hover:text-explorer-accent transition-colors truncate block">
                                    ${file.name}
                                </a>
                            </div>
                            <div class="col-span-2 md:col-span-2 px-2 hidden md:block">
                                <span class="text-[11px] font-mono text-explorer-muted border border-explorer-border px-1.5 py-0.5 rounded bg-explorer-bg">HTML</span>
                            </div>
                            <div class="col-span-2 text-right px-2">
                                <a href="${file.path}" class="inline-flex items-center justify-center w-8 h-8 rounded hover:bg-explorer-border text-explorer-muted hover:text-white transition-colors" title="Open File">
                                    <i class="fas fa-external-link-alt text-xs"></i>
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');
                
                html += `</div></div>`;
                container.innerHTML = html;
            }
        }

        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const sidebar = document.getElementById('sidebar');

        function toggleMobileMenu(show) {
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                mobileOverlay.classList.remove('hidden');
                // slight delay for fade-in effect
                setTimeout(() => mobileOverlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                mobileOverlay.classList.remove('opacity-100');
                setTimeout(() => mobileOverlay.classList.add('hidden'), 200);
            }
        }

        mobileMenuBtn.addEventListener('click', () => toggleMobileMenu(true));
        mobileOverlay.addEventListener('click', () => toggleMobileMenu(false));

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>

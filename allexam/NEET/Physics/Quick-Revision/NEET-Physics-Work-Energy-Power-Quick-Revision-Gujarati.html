<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Work Energy Power | ⚡ Sonic</title>
<style>:root{--brand:#f7c948;--accent:#1a73e8;--bg:#f8f9fa;--card:#fff;--text:#1a1a2e;--border:#dee2e6;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
.sonic-header{background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 100%);color:#fff;padding:20px;text-align:center}
.brand-badge{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#1a1a2e;padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700;margin-bottom:10px}
.sonic-header h1{font-size:1.6rem;font-weight:700}
.meta-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.meta-chip{background:rgba(255,255,255,.12);color:#fff;padding:4px 12px;border-radius:20px;font-size:.75rem;border:1px solid rgba(255,255,255,.2)}
.container{max-width:900px;margin:0 auto;padding:20px 16px}
.section-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;border:1px solid var(--border)}
.section-title{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--border)}
ul.point-list{list-style:none;padding:0}
ul.point-list li{padding:8px 0 8px 24px;position:relative;font-size:.9rem}
ul.point-list li::before{content:'▶';position:absolute;left:0;color:var(--accent);font-size:.6rem}
.highlight-box{background:#fff3cd;border-left:4px solid var(--brand);padding:14px 16px;margin:12px 0;border-radius:8px}
.danger-box{background:#fff5f5;border-left:4px solid #dc3545;padding:14px 16px;margin:12px 0}
.success-box{background:#f0fff4;border-left:4px solid #28a745;padding:14px 16px;margin:12px 0}
.formula-chip{display:inline-block;background:#1a1a2e;color:var(--brand);font-family:monospace;font-size:.85rem;padding:6px 14px;border-radius:8px;margin:4px}
.sonic-footer{text-align:center;padding:30px 20px;background:#1a1a2e;color:rgba(255,255,255,.5);font-size:.8rem;margin-top:30px}
@media(max-width:600px){.container{padding:12px}.section-card{padding:16px}}</style>
</head>
<body>
<div class="sonic-header">
  <div class="brand-badge">⚡ SONIC RESOURCE FACTORY</div>
  <h1>📖 Work Energy Power</h1>
  <div class="meta-bar">
    <span class="meta-chip">🎯 NEET</span>
    <span class="meta-chip">📚 Physics</span>
    <span class="meta-chip">🏷️ Work Energy Power</span>
    <span class="meta-chip">📋 Notes</span>
    <span class="meta-chip">🌐 Gujarati</span>
    <span class="meta-chip">🕐 09 Aug 2026, 07:07 PM</span>
  </div>
</div>
<div class="container"><div class="section-card"><p></p></div></div>
<div class="sonic-footer">
  ⚡ Sonic Resource Factory | NEET | Physics | Notes | Gujarati | 09 Aug 2026, 07:07 PM
  <br><small>⚠️ AI-generated. Verify with official sources.</small>
</div>
</body></html>
